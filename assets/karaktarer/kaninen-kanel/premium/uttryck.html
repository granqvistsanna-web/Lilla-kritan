<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanel premium – uttryck och poser</title>
<style>
  body { margin:0; background:#222; display:grid; place-items:center; min-height:100vh; }
  svg { width:min(100vw, 1280px); height:auto; display:block; }
  text { font-family: Fredoka, "Arial Rounded MT Bold", system-ui, sans-serif; fill:#5a3b2e; text-anchor:middle; }
</style>
</head>
<body>
<!-- Kanels uttryck i kod, över det ansiktslösa v2-urklippet. Ett ark med alla uttryck, ?prov=borsta&zoom=… (030:s provbild), eller ?bara=<namn> för ett stort
     som går neutral → uttryck → neutral. I avsnitt: window.ansikte(namn, k) med k 0–1 från neutral. -->
<svg viewBox="0 0 1920 1080">
  <defs>
    <filter id="boil" filterUnits="userSpaceOnUse" x="-100" y="-100" width="2120" height="1280">
      <feTurbulence id="brus" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
      <feDisplacementMap in="SourceGraphic" scale="5"/>
    </filter>
    <clipPath id="orrot"><rect width="1024" height="308"/></clipPath>
  </defs>
  <rect width="1920" height="1080" fill="#f6efe3"/>
  <g id="kamera"><g id="scen"></g><g id="figurer" filter="url(#boil)"></g><g id="forgrund"></g></g>
  <g id="etiketter"></g>
</svg>
<script src="../../../../verktyg/blinka.js"></script>
<script src="../../../../verktyg/rigg-motor.js"></script>
<script>
// Öronen vrids kring roten (inne i huvudet), inte kring kanten som i kanel-rigg.json: annars svänger roten ut
// som en vit linje vid huvudet när öronen lutar inåt (hoppet, riktningsposen).
const RIGG = { 'arm-l': [212, 567], 'arm-r': [799, 566], 'leg-l': [435, 839], 'leg-r': [601, 835],
               'ear-l': [350, 300], 'ear-r': [675, 305], 'tail': [739, 741] };
const OGON = [[419, 401], [600, 400]], KINDER = [[383, 452], [636, 451]], FOTTER = 947;
const LINJE = '#2a1d1a', MUNLINJE = '#3a2a22', MUNFARG = '#7a2a1c', KIND = '#ec8f96';

// Alla uttryck har samma parametrar, så att de går att blanda. Det som inte anges är neutralt.
// ogonS [sx, sy] ögonens storlek · titt [x, y] blickriktning · ogonY ögon och bryn upp (−) / ner (+)
// glad [v, h] öga → ^-båge (0–1) · lock [v, h] ögonlock ner (0–1) · bryn synlighet · brynY [v, h] höjd · brynV inre änden upp (grader)
// kind kindernas styrka · le leendet 1 … −1 (lite surt) · leBred bredd · leX munnen åt sidan · streck munlinjernas synlighet
// mun [rx, ry, d, cy] öppen mun (d 0 = rund, 1 = platt överkant) · oron [v, h] öronen hänger (+) / spetsas (−) i grader
// armar [v, h] armarna upp (+) / ner (−) i grader, vila 8 · luta hela figuren i grader · strack kroppen sträcks (+) / sjunker (−)
const NEUTRAL = { ogonS: [1, 1], titt: [0, 0], ogonY: 0, glad: [0, 0], lock: [0, 0], bryn: 0, brynY: [0, 0], brynV: 0,
  kind: 0.75, le: 1, leBred: 1, leX: 0, streck: 1, mun: [0, 0, 0, 462], oron: [0, 0], armar: [8, 8], luta: 0, strack: 1,
  glimt: 0, tand: 0, tunga: 0, tandNere: 1, tander: [1, 1, 1, 1, 1, 1, 1, 1] };   // tandmunnen (030), se verktyg/rigg-motor.js

const UTTRYCK = {
  neutral:   { namn: 'neutral' },
  glad:      { namn: 'glad', kind: 1, le: 1.3, leBred: 1.15, ogonY: -2, oron: [-4, -4], armar: [16, 16] },
  jatteglad: { namn: 'jätteglad', glad: [1, 1], kind: 1, streck: 0, mun: [22, 20, 1, 456], oron: [-8, -8], armar: [40, 40], strack: 1.03 },
  forvanad:  { namn: 'förvånad', ogonS: [1.2, 1.16], bryn: 1, brynY: [-12, -12], kind: 0.6, streck: 0, mun: [9, 11, 0, 466],
               oron: [-9, -9], armar: [22, 22], strack: 1.04 },
  nyfiken:   { namn: 'nyfiken', titt: [11, -2], bryn: 0.9, brynY: [0, -8], le: 0.6, leBred: 0.8, leX: 4, oron: [-2, 10], luta: 5 },
  tanker:    { namn: 'tänker', titt: [-7, -12], bryn: 0.9, brynY: [-9, 0], le: 0.4, leBred: 0.55, leX: 10, oron: [6, -2], luta: -3 },
  ledsen:    { namn: 'lite ledsen', titt: [0, 4], ogonS: [0.95, 0.95], bryn: 1, brynY: [4, 4], brynV: 24,
               kind: 0.55, le: -0.7, leBred: 0.75, oron: [24, 24], armar: [-4, -4], luta: 2, strack: 0.97 },
  somnig:    { namn: 'sömnig', titt: [0, 3], lock: [0.66, 0.66], kind: 0.7, streck: 0, mun: [10, 13, 0, 468],
               oron: [16, 16], armar: [2, 2], luta: 3, strack: 0.97 },
  fnissig:   { namn: 'fnissig', glad: [1, 1], kind: 1, streck: 0, mun: [10, 9, 1, 456], leX: 3, oron: [-4, 8], armar: [24, 24], luta: 4, strack: 0.98 },
  blinkar:   { namn: 'blinkar', glad: [0, 1], kind: 1, le: 1.3, leBred: 1.1, leX: 5, oron: [0, -6], armar: [8, 30], luta: -3 },
  stolt:     { namn: 'stolt', glad: [1, 1], ogonY: -8, kind: 1, le: 1.2, leBred: 1.1, oron: [-6, -6], armar: [-8, -8], strack: 1.04 },
  // 030: gapet och det breda tandleendet (som kattens, men större: Sanna 2026-11-11, tänderna ska läsas). Gapet 120 × 72 px,
  // y 453–525: under nosen (447), mellan kinderna (413 och 606) och ovanför magfläcken (545). Nosfläcken växer med gapet (rita).
  // Tänderna sätts per scen: { ...param('gapar'), tander: [...] }.
  // glatt gap (Sanna 2026-11-11: gulligare, inte argt): platt överkant och rund botten som ett leende, inga höjda bryn
  gapar:     { namn: 'gapar', titt: [0, -2], kind: 1, streck: 0,
               mun: [60, 50, 0.55, 475], tand: 1, tunga: 1, oron: [-3, -3], strack: 1.02 },
  flinar:    { namn: 'visar tänderna', glad: [1, 1], kind: 1, streck: 0, mun: [56, 30, 1, 456], tand: 1, tandNere: 0, tunga: 1, oron: [-5, -5],
               armar: [20, 20], strack: 1.03 },
};
// ponytail: fnissig har ingen hand för munnen, armarna når inte dit (ca 115 px långa, munnen 300 px bort). Axlarna dras upp i stället.

// Poser: kropp, armar, ben och öron. De läggs ovanpå uttrycket, så pose('hurra') + ansikte('jatteglad') går ihop.
// luta hela figuren (grader, kring fötterna) · rikt −1 … 1 riktningspose åt vänster/höger (ansiktet glider dit, öronen lutar,
// båda armarna ut på den sidan, se rita) · upp −1 … 1 tittar upp/ner (ansiktet flyttas) · bred kroppens bredd (+/−) · strack kroppens
// höjd (+/−) · sank kroppen ner (+) / upp (−) i px · armar [v, h] upp (+) i grader, läggs till uttryckets · fram [v, h] armen
// framför kroppen (0/1) · benFram benen framför kroppen (0/1) · oron [v, h] hänger (+) i grader · ben [v, h] utåt (+) i grader · benY [v, h] foten upp (−) i px · benS [v, h] benet längre (+)
// lyft hela figuren upp (−) i px, skuggan krymper · svans svansens vinkel i grader · x hela figuren åt sidan i px
// boj kroppen böjer sig från fötterna i grader (+ åt höger): huvudet lutar sig dit, fötterna står kvar platt (luta vrider hela figuren)
// bada 0–1: båda armarna ut på riktningens sida (riktningsposerna, håller, når); utan den vänder rikt bara ansiktet, magen och öronen
const POSE0 = { luta: 0, rikt: 0, upp: 0, bred: 0, strack: 0, sank: 0, armar: [0, 0], fram: [0, 0], oron: [0, 0],
  benFram: 0, ben: [0, 0], benY: [0, 0], benS: [0, 0], lyft: 0, svans: 0, x: 0, klapp: 0, gang: 0, sving: 0, armY: 0, hand: 0, gnista: 0, gom: [0, 0], skak: [0, 0], nick: [0, 0], boj: 0, bada: 0,
  borste: 0, borstV: 0, borstX: -1, borstY: 0, borstNer: 0, skum: 0, hall: [0, 0], rack: [0, 0], sakV: 0, sakGrepp: 0, sakLager: 1, sakFri: [512, FOTTER, 0], sakMun: 0, sakBett: 0, sakPa: 0, troja: 0, stovlar: [0, 0] };
// hall [v, h] 0–1 saken i vänster/höger hand · sakV sakens extra vinkel i handen · sakFri [x, y, v] sakens fot när den ligger fritt ·
// sakMun 0–1 saken till munnen · sakBett tuggor som är borta · sakPa 0–1 saken från handen upp på kroppen (mössan) ·
// troja 0–1 tröjan ovanför huvudet → på · stovlar [v, h] 0–1 stöveln bredvid foten → på (verktyg/rigg-motor.js, Saker i handen)
// borste 0–1 tandborsten i vänstra handen (bildens vänster) · borstV borstens vinkel, vickar · borstX −1 … 1 borsthuvudet över munnens
// bredd (−1 = mungipan) · borstY −1 övre raden … 1 nedre · borstNer px borsten och handen sänkta · skum 0–1 (verktyg/rigg-motor.js)
const POSER = {
  neutral:   { namn: 'neutral' },
  lutaV:     { namn: 'lutar vänster', luta: -1.5, boj: -4.5, oron: [-4, 4] },
  lutaH:     { namn: 'lutar höger', luta: 1.5, boj: 4.5, oron: [4, -4] },
  vanster:   { namn: 'riktning vänster', rikt: -1, bada: 1 },
  hoger:     { namn: 'riktning höger', rikt: 1, bada: 1 },
  haller:    { namn: 'håller fram', rikt: -1, bada: 1, armar: [25, 0] },
  nar:       { namn: 'sträcker sig efter', rikt: 1, bada: 1, armar: [0, 55], luta: 1, boj: 2.5, strack: 0.03, upp: 0.4, oron: [-4, -4] },
  upp:       { namn: 'tittar upp', upp: 1, strack: 0.02, oron: [-4, -4] },
  ner:       { namn: 'tittar ner', upp: -1, strack: -0.02, oron: [6, 6] },
  pekar:     { namn: 'pekar', armar: [0, 32], luta: 1, boj: 2.5 },
  hurra:     { namn: 'hurra', armar: [70, 70], strack: 0.03, oron: [-6, -6] },
  magen:     { namn: 'händer på magen', armar: [-124, -124], fram: [1, 1] },
  blyg:      { namn: 'blyg', armar: [-25, -25], bred: -0.03, strack: -0.03, luta: -1.5, boj: -3.5, upp: -0.4, oron: [8, 4] },
  sitter:    { namn: 'sitter', ben: [40, 40], benY: [-40, -40], sank: 48, bred: 0.03, armar: [6, 6] },
  strack:    { namn: 'sträcker på sig', strack: 0.04, sank: -6, benS: [0.06, 0.06], armar: [30, 30], oron: [-5, -5] },
  huka:      { namn: 'hukar (före hopp)', strack: -0.08, bred: 0.05, ben: [6, 6], armar: [-10, -10], oron: [6, 6] },
  stampar:   { namn: 'stampar', ben: [0, 8], benY: [0, -16], luta: -2 },
  lyssnar:   { namn: 'lyssnar', luta: 2, boj: 5.5, oron: [-6, 14] },
  // 030: borsten leds av munnen (borstX, borstY) och vänstra armen följer i ett stycke: den står rakt upp framför kroppen
  // (−233 + vilans 8 = −225 från vilovinkeln 135°) med handen i borstens grepp, bara handen syns (-klapp-kopian) och den
  // tonade roten ligger över kroppens bruna päls. Rörelsen: ROR.borsta / borstDel (verktyg/rigg-motor.js).
  borstar:   { namn: 'borstar tänderna', armar: [-233, 0], fram: [1, 0], hand: 1, borste: 1 },
};
// ponytail: armar och ben byter lager (bakom/framför kroppen) vid fram 0,5. Ett hopp i lagren, men armen är gömd bakom kroppen just då.

// Blanda två uttryck eller två poser (namn eller parameterobjekt), k 0 = a, 1 = b.
const blanda = blandare(NEUTRAL, UTTRYCK), blandaRak = blandare(POSE0, POSER), param = u => fyll(NEUTRAL, UTTRYCK, u);
// Armar flyger inte (Sanna 2026-11-10): när armvinkeln ändras mer än 20° mellan två poser glider armen in bakom kroppen (gom),
// vinkeln byts medan den är gömd (mitten av blandningen) och armen glider ut igen. Inte när armen är framför kroppen eller i gången.
const blandaPose = (a, b, k) => { const ut = blandaRak(a, b, k), A = fyll(POSE0, POSER, a), B = fyll(POSE0, POSER, b), kk = Math.max(0, Math.min(1, k));
  if (Math.max(A.fram[0], A.fram[1], B.fram[0], B.fram[1], A.gang, B.gang) > 0) return ut;
  for (let i = 0; i < 2; i++) { const skillnad = Math.abs(B.armar[i] - A.armar[i]); if (skillnad <= 20) continue;
    const v = kk < 0.3 ? 0 : kk > 0.7 ? 1 : mjuk((kk - 0.3) / 0.4);
    ut.armar[i] = A.armar[i] + (B.armar[i] - A.armar[i]) * v; ut.gom[i] = Math.max(ut.gom[i], Math.sin(Math.PI * kk) * Math.min(1, (skillnad - 20) / 30)); }
  return ut; };

// Tandborsten: armens vilovinkel och längd (som i KLAPPNY-måtten) och borstens lutning (grader, snett upp mot munnen).
const BORSTE = '../../../rekvisita/tandborsten/cut/tandborsten.png', BORSTARM = { axel: 135, L: 138, lut: -20 };
// Saker i handen (verktyg/rigg-motor.js): handens mitt i armbilderna (armens yttersta klump, 108 px från vridpunkten längs 135° / 45°),
// figurens vita kant och greppet framför magen [armvinkel, in px, ner px] (som posen magen men 40 px lägre: saken når inte ansiktet).
// kant = den vita kanten i cut-tunn mätt i bilderna (ca 6 px, inte tunnings-talet 10). byte [in px, vinkel]: där handen tonar över
// till framsidan, gömd precis bakom kroppens kant med armens tonade rot över kroppen (uppmätt ur arm-l och arm-l-klapp mot kroppen).
// golv / bord: böjposen när handen hämtar något på golvet bredvid / på ett bord framför (luta, boj, strack, bred, armvinkel).
// mun: munnens mitt (läpparna, mellan leendet 462 och den öppna munnen 468) dit saken förs när den äter och dricker.
const HAND = { l: [135, 643], r: [875, 642], kant: 6, byte: [110, -73], fram: [-124, 70, 40], mun: [512, 466],
  golv: { luta: -4, boj: -6, strack: -0.08, bred: 0.05, armar: -25 }, bord: { luta: -1.5, boj: -2.5, strack: -0.03, bred: 0.02, armar: 0 } };
// Sakerna i provslingorna: muggen (rekvisita, handtaget i handen vid sidan, muggens vänstra sida framför magen, står upprätt) och en sked ritad i kod (ställföreträdare).
const PLOCKA = () => new URLSearchParams(location.search).get('fran') === 'bord'
  ? { fri: [400, 700, 0], boj: HAND.bord, fram: true, lyft: -60 } : { fri: [180, FOTTER, 0], boj: HAND.golv };
const PROVSAKER = {
  mugg: () => sakBild('../../../rekvisita/muggen/cut/muggen.png', 804, 664, { grepp: [705, 330], greppFram: [40, 360], fot: [300, 640], skala: 0.26, folj: 0, kant: 7, mun: [300, 0] }),   // mun: kanten precis under munnen, nosen syns
  // skeden med en klick gröt (sak-mat, äts upp i en tugga)
  sked: () => sakKod(`<rect x="-10" y="-112" width="20" height="160" rx="10" fill="#f2b13a"/><ellipse cy="-146" rx="27" ry="36" fill="#f2b13a"/>
    <ellipse cy="-150" rx="17" ry="25" fill="#f7cf6e"/><ellipse class="sak-mat" cy="-156" rx="19" ry="16" fill="#fbecc6"/>`,
    { grepp: [0, 0], greppFram: [0, 25], fot: [0, 48], skala: 1.1, folj: 0, vFram: -25, mun: [0, -158], bett: [[0, -156, 40]] }),   // framför magen längre ner på skaftet: änden sticker inte ut under handen
  // kanelbullen (rekvisita, art direction v2): handen under bullens vänstra kant, tuggorna uppe till höger
  bulle: () => sakBild('../../../rekvisita/kanelbulle/cut/kanelbulle-v3.png', 807, 797, { grepp: [170, 600], fot: [403, 795], skala: 0.17, folj: 0, kant: 8,
    mat: true, mun: [600, 230], bett: [[700, 170, 190], [560, 90, 170]] }),
  // gula solhatten (rekvisita, art direction v2): i handen i brättets högra kant (hänger ut åt sidan), på huvudet med brättets
  // mitt på hjässan; öronen sticker upp bakom kullen. Följer kroppens tryck och sträckning och lite av ansiktets nick.
  hatt: () => sakBild('../../../rekvisita/solhatt-gul/cut/solhatt-gul.png', 1024, 1024, { grepp: [975, 650], fot: [515, 640], skala: 0.37, folj: 0, kant: 10,
    pa: { punkt: [512, 245], drag: 0.4 } }),
  // röda bollen (rekvisita): handen ovanpå bollen, nära toppen
  boll: () => sakBild('../../../rekvisita/boll-rod/cut/boll-rod.png', 1024, 1024, { grepp: [540, 300], fot: [511, 858], skala: 0.18, folj: 0, kant: 10 }),
};

function figur(x, y, skala) {                 // en Kanel med fötterna i (x, y)
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g'), id = document.querySelectorAll('#figurer > g').length;
  // Öronroten nedanför y 308 ligger alltid under huvudet: klipps bort, så att den inte syns som en vit kant när huvudet trycks ihop.
  const del = (n, fil = n) => `<image class="${n}" href="cut-tunn/kanel-${fil}.png" width="1024" height="1024"${n.startsWith('ear') ? ' clip-path="url(#orrot)"' : ''}/>`;
  g.setAttribute('transform', `translate(${x} ${y}) scale(${skala}) translate(-512 ${-FOTTER})`);
  // arm-l2/arm-r2: kopior av armarna för riktningsposen (båda armarna ut på samma sida, den ena under den andra).
  g.innerHTML = `<ellipse class="skugga" cx="512" cy="${FOTTER - 30}" rx="300" ry="34" fill="#000" opacity="0.1"/>
    <g class="kanel">${['ear-l', 'ear-r', 'tail', 'leg-l', 'leg-r'].map(n => del(n)).join('')}
    ${del('arm-l2', 'arm-l')}${del('arm-r2', 'arm-r')}${del('arm-l')}${del('arm-r')}
    <g class="kropp"><image href="cut-tunn/kanel-body-tom.png" width="1024" height="1024"/>
    <image class="mage" href="cut-tunn/kanel-mage.png" width="1024" height="1024"/>
    <g class="drag"><clipPath id="nosinre-${id}"><rect x="470" y="412" width="84" height="68"/></clipPath><clipPath id="nosyttre-${id}"><path d="M0 0H1024V1024H0Z M480 412h58v40h-58Z" clip-rule="evenodd"/></clipPath>
    <image href="cut-tunn/kanel-nos.png" width="1024" height="1024" clip-path="url(#nosinre-${id})"/><image class="nosvaxt" href="cut-tunn/kanel-nos.png" width="1024" height="1024" clip-path="url(#nosyttre-${id})"/><path class="nasa" d="M492.8 425.3 Q486.0 416.0 499.5 416.0 L517.5 416.0 Q531.0 416.0 524.2 425.3 L515.2 437.7 Q508.5 447.0 501.8 437.7 Z" fill="#f98ca7" stroke="#b47377" stroke-width="2.5" stroke-linejoin="round"/>
    ${KINDER.map(([x, y]) => `<ellipse class="kind" cx="${x}" cy="${y}" rx="30" ry="18" fill="${KIND}"/>`).join('')}
    ${OGON.map((_, i) => `<g class="oga">
      <clipPath id="lock-${id}-${i}"><path class="lockklipp" d="M-40 -26 H40 V60 H-40Z"/></clipPath>
      <g clip-path="url(#lock-${id}-${i})"><ellipse rx="17" ry="25" fill="${LINJE}"/><circle cx="-6" cy="-10" r="6" fill="#fff"/></g>
      <path class="lock" fill="none" stroke="${LINJE}" stroke-width="6" stroke-linecap="round"/></g>
      <path class="glad" d="M-20 6 Q0 -18 20 6" fill="none" stroke="${LINJE}" stroke-width="7" stroke-linecap="round"/>
      <path class="bryn" d="M-16 3 Q0 -6 16 3" fill="none" stroke="${LINJE}" stroke-width="6" stroke-linecap="round"/>`).join('')}
    <g class="munnen"><path class="mun" fill="${MUNFARG}"/>${tandmun(id, '#b8545e', { langa: [1, 2] })}
    <g fill="none" stroke="${MUNLINJE}" stroke-width="5" stroke-linecap="round"><path class="nos"/><path class="le"/></g></g>
    </g></g>${borsteBild(BORSTE)}${['leg-l', 'leg-r', 'arm-l', 'arm-r'].map(n => del(n)).join('')}${del('arm-l', 'arm-l-klapp')}${del('arm-r', 'arm-r-klapp')}
    <g class="gnista">${[0, 1, 2, 3].map(() => `<path fill="none" stroke="#fff" stroke-width="20" stroke-linecap="round"/><path fill="none"
      stroke="#7a4a32" stroke-width="9" stroke-linecap="round"/>`).join('')}</g></g>`;
  document.getElementById('figurer').appendChild(g);
  return g;
}

function rita(fig, f, p = POSE0) {
  const q = s => fig.querySelector(s), alla = s => [...fig.querySelectorAll(s)];
  const r = Math.max(-1, Math.min(1, p.rikt + (fig.riktning || 0))), a = Math.abs(r), sida = Math.sign(r);   // −1 vänster, 1 höger
  const u = p.upp, sx = 1 + p.bred, sy = f.strack + p.strack, sank = p.sank;
  // Kroppen sträcks från fötterna och breddas kring mitten, så öron och armar flyttas med.
  const lyft = y => -(sy - 1) * (FOTTER - y) + sank;
  // Borsten leds av munnen: borsthuvudets plats (mal) och handens (grepp) i figurens ruta, med ansiktets glidning och kroppens sträckning.
