<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nicke premium – uttryck och poser</title>
<style>
  body { margin:0; background:#222; display:grid; place-items:center; min-height:100vh; }
  svg { width:min(100vw, 1280px); height:auto; display:block; }
  text { font-family: Fredoka, "Arial Rounded MT Bold", system-ui, sans-serif; fill:#5a3b2e; text-anchor:middle; }
</style>
</head>
<body>
<!-- Nyckelpigans uttryck i kod (gjort som Milles), över det ansiktslösa v2-urklippet. Ansiktet sitter direkt på den röda kroppen (ingen nosfläck). Ett ark med alla uttryck, eller ?bara=<namn> för ett stort
     som går neutral → uttryck → neutral. I avsnitt: window.ansikte(namn, k) med k 0–1 från neutral. -->
<svg viewBox="0 0 1920 1080">
  <defs>
    <filter id="boil" filterUnits="userSpaceOnUse" x="-100" y="-100" width="2120" height="1280">
      <feTurbulence id="brus" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
      <feDisplacementMap in="SourceGraphic" scale="5"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="#f6efe3"/>
  <g id="kamera"><g id="scen"></g><g id="figurer" filter="url(#boil)"></g><g id="forgrund"></g></g>
  <g id="etiketter"></g>
</svg>
<script>
// Vridpunkter ur nicke-rigg.json. Armar, ben och antenner är ombyggda (lemmens egen svarta krita plus en rund svart rot
// in under kroppen) och vrids kring roten. Antennerna är "öronen" (ear-l, ear-r): de släpar och gungar som öron.
const UT = { fran: 12, over: 50, ut: 70, upp: 26 };   // lyfta armar: från 12° glider de ut 70 px och upp 26 px (fullt vid 62°)
const RIGG = { 'arm-l': [260, 563], 'arm-r': [755, 559], 'leg-l': [457, 785], 'leg-r': [573, 782],
               'ear-l': [433, 215], 'ear-r': [578, 212] };
// Uppmätt ur nicke-forsta-c2.jpg mot nicke-faceless.jpg (ansikte_matt.py). Nästan samma mått som Milles. Det svarta huvudet
// slutar vid y ca 303 ovanför ögonen (spetsen i mitten 353), så brynen (52 px ovanför ögat) ligger kvar på det röda.
const OGON = [[418, 401], [601, 400]], KINDER = [[378, 460], [643, 457]], FOTTER = 942, MY = 4;
// Uttrycket kawaii (som Milles, kawaii-matt.md): huvudets bredd W vid ögonhöjd 520 px. Ögon 1,4 × 1,5, 0,425 W isär (221 px),
// 0,035 W lägre (18 px); kinderna 10 px lägre och 8 px längre ut; munnen densamma.
const KAWAII = { ogon: [[399, 420], [620, 419]], skala: [1.4, 1.5], kinder: [[369, 469], [651, 467]] };
// Kinderna ljusrosa som i konsten (#f8acb8), annars syns de inte mot det röda. Öppen mun mörkare än Milles, av samma skäl.
const LINJE = '#2a1d1a', MUNLINJE = '#2a1d1a', MUNFARG = '#4a1418', KIND = '#f8acb8';

// Alla uttryck har samma parametrar, så att de går att blanda. Det som inte anges är neutralt.
// ogonS [sx, sy] ögonens storlek · titt [x, y] blickriktning · ogonY ögon och bryn upp (−) / ner (+)
// glad [v, h] öga → ^-båge (0–1) · sov öga → sluten u-båge (0–1, som Luddes) · kawaii stora glittriga ögon (0–1, se KAWAII) · lock [v, h] ögonlock ner (0–1) · bryn synlighet · brynY [v, h] höjd · brynV inre änden upp (grader)
// kind kindernas styrka · le leendet 1 … −1 (lite surt) · leBred bredd · leX munnen åt sidan · streck munlinjernas synlighet
// mun [rx, ry, d, cy] öppen mun (d 0 = rund, 1 = platt överkant) · oron [v, h] öronen hänger (+) / spetsas (−) i grader
// armar [v, h] armarna upp (+) / ner (−) i grader, vila 8 · luta hela figuren i grader · strack kroppen sträcks (+) / sjunker (−)
const NEUTRAL = { ogonS: [1, 1], titt: [0, 0], ogonY: 0, glad: [0, 0], lock: [0, 0], bryn: 0, brynY: [0, 0], brynV: 0,
  kind: 0.75, le: 1, leBred: 1, leX: 0, streck: 1, mun: [0, 0, 0, 462], oron: [0, 0], armar: [8, 8], luta: 0, strack: 1, sov: 0, kawaii: 0 };

const UTTRYCK = {
  neutral:   { namn: 'neutral' },
  glad:      { namn: 'glad', kind: 1, le: 1.3, leBred: 1.15, ogonY: -2, oron: [-4, -4], armar: [16, 16] },
  jatteglad: { namn: 'jätteglad', glad: [1, 1], kind: 1, streck: 0, mun: [22, 20, 1, 456], oron: [-8, -8], armar: [20, 20], strack: 1.03 },
  forvanad:  { namn: 'förvånad', ogonS: [1.2, 1.16], bryn: 1, brynY: [-12, -12], kind: 0.6, streck: 0, mun: [9, 11, 0, 466],
               oron: [-9, -9], armar: [22, 22], strack: 1.04 },
  nyfiken:   { namn: 'nyfiken', titt: [11, -2], bryn: 0.9, brynY: [0, -8], le: 0.6, leBred: 0.8, leX: 4, oron: [-2, 10], luta: 5 },
  tanker:    { namn: 'tänker', titt: [-7, -12], bryn: 0.9, brynY: [-9, 0], le: 0.4, leBred: 0.55, leX: 10, oron: [6, -2], luta: -3 },
  ledsen:    { namn: 'lite ledsen', titt: [0, 4], ogonS: [0.95, 0.95], bryn: 1, brynY: [4, 4], brynV: 24,
               kind: 0.55, le: -0.7, leBred: 0.75, oron: [24, 24], armar: [-4, -4], luta: 2, strack: 0.97 },
  somnig:    { namn: 'sömnig', titt: [0, 3], lock: [0.66, 0.66], kind: 0.7, streck: 0, mun: [10, 13, 0, 468],
               oron: [16, 16], armar: [2, 2], luta: 3, strack: 0.97 },
  fnissig:   { namn: 'fnissig', glad: [1, 1], kind: 1, streck: 0, mun: [10, 9, 1, 456], leX: 3, oron: [-4, 8], armar: [24, 24], luta: 4, strack: 0.98 },
  blinkar:   { namn: 'blinkar', glad: [0, 1], kind: 1, le: 1.3, leBred: 1.1, leX: 5, oron: [0, -6], armar: [8, 30], luta: -3 },
  kawaii:    { namn: 'kawaii', kawaii: 1, kind: 1, le: 1.2, leBred: 0.9, oron: [-4, -4], armar: [16, 16], strack: 1.02 },
  // sover (som Luddes v2): ögonen är slutna u-bågar (inte locket, då syns en bit av pupillen under), en liten nöjd mun
  sover:     { namn: 'sover', sov: 1, ogonY: 4, kind: 0.85, le: 0.5, leBred: 0.7, oron: [10, 10], armar: [0, 0], strack: 0.97 },
  stolt:     { namn: 'stolt', glad: [1, 1], ogonY: -8, kind: 1, le: 1.2, leBred: 1.1, oron: [-6, -6], armar: [-8, -8], strack: 1.04 },
};
// fnissig har ingen hand för munnen, armarna når inte dit. Axlarna dras upp i stället.

// Poser: kropp, armar, ben och öron. De läggs ovanpå uttrycket, så pose('hurra') + ansikte('jatteglad') går ihop.
// luta hela figuren (grader, kring fötterna) · rikt −1 … 1 riktningspose åt vänster/höger (ansiktet glider dit, öronen lutar,
// båda armarna ut på den sidan, se rita) · upp −1 … 1 tittar upp/ner (ansiktet flyttas) · bred kroppens bredd (+/−) · strack kroppens
// höjd (+/−) · sank kroppen ner (+) / upp (−) i px · armar [v, h] upp (+) i grader, läggs till uttryckets · fram [v, h] armen
// framför kroppen (0/1) · benFram benen framför kroppen (0/1) · oron [v, h] hänger (+) i grader · ben [v, h] utåt (+) i grader · benY [v, h] foten upp (−) i px · benS [v, h] benet längre (+)
// lyft hela figuren upp (−) i px, skuggan krymper · vick antennernas vinkel i grader · x hela figuren åt sidan i px
const POSE0 = { luta: 0, rikt: 0, upp: 0, bred: 0, strack: 0, sank: 0, armar: [0, 0], fram: [0, 0], oron: [0, 0],
  benFram: 0, ben: [0, 0], benY: [0, 0], benS: [0, 0], lyft: 0, vick: 0, x: 0, klapp: 0, gang: 0, sving: 0, armY: 0 };
const POSER = {
  neutral:   { namn: 'neutral' },
  lutaV:     { namn: 'lutar vänster', luta: -5, oron: [-4, 4] },
  lutaH:     { namn: 'lutar höger', luta: 5, oron: [4, -4] },
  vanster:   { namn: 'riktning vänster', rikt: -1 },
  hoger:     { namn: 'riktning höger', rikt: 1 },
  haller:    { namn: 'håller fram', rikt: -1, armar: [25, 0] },
  nar:       { namn: 'sträcker sig efter', rikt: 1, armar: [0, 55], luta: 3, strack: 0.03, upp: 0.4, oron: [-4, -4] },
  upp:       { namn: 'tittar upp', upp: 1, strack: 0.02, oron: [-4, -4] },
  ner:       { namn: 'tittar ner', upp: -1, strack: -0.02, oron: [6, 6] },
  pekar:     { namn: 'pekar', armar: [0, 32], luta: 3 },
  hurra:     { namn: 'hurra', armar: [80, 80], strack: 0.03, oron: [-6, -6] },   // + jätteglad 20 = 70°: armarna glider ut ur kroppen (UT) och syns utanför
  magen:     { namn: 'händer på magen', armar: [-95, -95], fram: [1, 1], klapp: 40 },   // händerna vid magens kanter (korta armar)
  blyg:      { namn: 'blyg', armar: [-25, -25], bred: -0.03, strack: -0.03, luta: -4, upp: -0.4, oron: [8, 4] },
  sitter:    { namn: 'sitter', ben: [40, 40], benY: [-40, -40], sank: 48, bred: 0.03, armar: [6, 6] },
  strack:    { namn: 'sträcker på sig', strack: 0.04, sank: -6, benS: [0.06, 0.06], armar: [30, 30], oron: [-5, -5] },
  huka:      { namn: 'hukar (före hopp)', strack: -0.08, bred: 0.05, ben: [6, 6], armar: [-10, -10], oron: [6, 6] },
  stampar:   { namn: 'stampar', ben: [0, 8], benY: [0, -16], luta: -2 },
  lyssnar:   { namn: 'lyssnar', luta: 6, oron: [-6, 14] },
  // sover (som Luddes v2): sitter ihopsjunken, huvudet lite nerböjt och åt sidan, händerna vilar på magen (som 'magen'),
  // öronen hänger lite, antennerna inrullad mot kroppen
  sover:     { namn: 'sover', ben: [40, 40], benY: [-40, -40], sank: 56, bred: 0.04, strack: -0.03, upp: -0.6, luta: 4,
               armar: [-95, -95], fram: [1, 1], klapp: 40, oron: [10, 10] },
  // ligger på magen med händerna under hakan och sover (Sannas val 2026-11-07, som Luddes liggMage): antennerna inrullad
  liggMage:  { namn: 'på magen, händerna under hakan', strack: -0.3, bred: 0.18, sank: 30, upp: -0.9,
               armar: [-120, -120], fram: [1, 1], klapp: 80, armY: -38, ben: [85, 85], benY: [-70, -70], oron: [14, 14] },
};
// Armar och ben byter lager (bakom/framför kroppen) vid fram 0,5. Ett hopp i lagren, men armen är gömd bakom kroppen just då.

const mix = (a, b, k) => Array.isArray(a) ? a.map((v, i) => mix(v, b[i], k)) : a + (b - a) * k;
const fyll = (N, T, u) => typeof u === 'string' ? { ...N, ...T[u] } : { ...N, ...u };
const blandare = (N, T) => (a, b, k) => { const A = fyll(N, T, a), B = fyll(N, T, b), ut = {};
  for (const n in N) ut[n] = mix(A[n], B[n], Math.max(0, Math.min(1, k))); return ut; };
// Blanda två uttryck eller två poser (namn eller parameterobjekt), k 0 = a, 1 = b.
const blanda = blandare(NEUTRAL, UTTRYCK), blandaPose = blandare(POSE0, POSER), param = u => fyll(NEUTRAL, UTTRYCK, u);

function figur(x, y, skala) {                 // en nyckelpiga med fötterna i (x, y)
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g'), id = document.querySelectorAll('#figurer > g').length;
  const del = (n, fil = n) => `<image class="${n}" href="cut/nicke-${fil}.png" width="1024" height="1024"/>`;
  g.setAttribute('transform', `translate(${x} ${y}) scale(${skala}) translate(-512 ${-FOTTER})`);
  // arm-l2/arm-r2: kopior av armarna för riktningsposen (båda armarna ut på samma sida, den ena under den andra).
  g.innerHTML = `<ellipse class="skugga" cx="512" cy="${FOTTER - 30}" rx="300" ry="34" fill="#000" opacity="0.1"/>
    <g class="figuren">${['ear-l', 'ear-r', 'leg-l', 'leg-r'].map(n => del(n)).join('')}
    ${del('arm-l2', 'arm-l')}${del('arm-r2', 'arm-r')}${del('arm-l')}${del('arm-r')}
    <g class="kropp"><image href="cut/nicke-body.png" width="1024" height="1024"/>
    <g class="drag">
    ${KINDER.map(([x, y]) => `<ellipse class="kind" cx="${x}" cy="${y}" rx="33" ry="24" fill="${KIND}"/>`).join('')}
    ${OGON.map((_, i) => `<g class="oga">
      <clipPath id="lock-${id}-${i}"><path class="lockklipp" d="M-40 -26 H40 V60 H-40Z"/></clipPath>
      <g clip-path="url(#lock-${id}-${i})"><ellipse rx="18" ry="26" fill="${LINJE}"/><circle class="glans" cx="-6" cy="-10" r="6" fill="#fff"/>
        <g class="glans-k" opacity="0"><circle cx="-5.3" cy="-9.9" r="7" fill="#fff"/><circle cx="5.6" cy="9.4" r="2.5" fill="#fff"/></g></g>
      <path class="lock" fill="none" stroke="${LINJE}" stroke-width="6" stroke-linecap="round"/></g>
      <path class="glad" d="M-20 6 Q0 -18 20 6" fill="none" stroke="${LINJE}" stroke-width="7" stroke-linecap="round"/>
      <path class="sov" d="M-19 -2 Q0 14 19 -2" fill="none" stroke="${LINJE}" stroke-width="6" stroke-linecap="round"/>
      <path class="bryn" d="M-16 3 Q0 -6 16 3" fill="none" stroke="${LINJE}" stroke-width="6" stroke-linecap="round"/>`).join('')}
    <g class="munnen"><path class="mun" fill="${MUNFARG}"/>
    <g fill="none" stroke="${MUNLINJE}" stroke-width="6" stroke-linecap="round"><path class="le"/></g></g>
    </g></g>${del('leg-l')}${del('leg-r')}${del('arm-l', 'arm-l-fram')}${del('arm-r', 'arm-r-fram')}</g>`;
  // Armarna framför kroppen (gången, klappen, magen) är nicke-arm-*-fram.png: den vita kanten tonas bort mot roten,
  // så att den svarta armen växer ut ur kroppen i stället för att sväva framför magen. Armarna är ritade runda stumpar
  // (rund rot, lite bredare rund hand), så de ser hela ut åt alla håll, också utanför kroppen när de lyfts.
  document.getElementById('figurer').appendChild(g);
  return g;
}

function rita(fig, f, p = POSE0) {
  const q = s => fig.querySelector(s), alla = s => [...fig.querySelectorAll(s)];
  const r = Math.max(-1, Math.min(1, p.rikt + (fig.riktning || 0))), a = Math.abs(r), sida = Math.sign(r);   // −1 vänster, 1 höger
  const u = p.upp, sx = 1 + p.bred, sy = f.strack + p.strack, sank = p.sank;
  // Kroppen sträcks från fötterna och breddas kring mitten, så öron och armar flyttas med.
  const lyft = y => -(sy - 1) * (FOTTER - y) + sank;
  const del = (n, grader, dx, dy, skala = [1, 1]) => { const [x, y] = RIGG[n.replace('2', '')];
    const t = `translate(${(sx - 1) * (x - 512) + dx} ${dy}) rotate(${grader} ${x} ${y}) translate(${x} ${y}) scale(${skala[0]} ${skala[1]}) translate(${-x} ${-y})`;
    alla('.' + n).forEach(e => e.setAttribute('transform', t)); };
  q('.figuren').setAttribute('transform', `translate(${p.x} ${p.lyft}) rotate(${f.luta + p.luta + 2 * r} 512 ${FOTTER})`);
  const hojd = Math.min(1, -p.lyft / 220);
  q('.skugga').setAttribute('rx', 300 * (1 - 0.4 * hojd)); q('.skugga').setAttribute('cx', 512 + p.x); q('.skugga').setAttribute('opacity', 0.1 * (1 - 0.3 * hojd));
  q('.kropp').setAttribute('transform', `translate(0 ${sank}) translate(512 ${FOTTER}) scale(${sx} ${sy}) translate(-512 ${-FOTTER})`);

  // Riktningsposen (som i bil-test.html): kroppen framifrån, ansiktet glider ~36 px åt sidan, smalnar och lutar,
  // öronen lutar dit, och båda armarna kommer ut på den sidan: den närmre lite högre, kopian 85 px under.
  // Den bortre armen glider in bakom kroppen (vriden skulle dess rot sticka ut på andra sidan) och kopian glider ut
  // bakom kroppen på den närmre sidan: armarna åker in och ut, de tonar aldrig.
  // Antennerna (ear-l, ear-r): vrids kring roten som öron, följer ansiktet ~18 px åt sidan i riktningsposen och lutar dit.
  // vick (grader) lutar båda åt samma håll: lugn gungning, en snabb vickning ibland, i takt med stegen.
  const ora = [10, 6];                       // [närmre, bortre] antennen
  const nara = n => (n === 'l') === (sida < 0);
  const orat = (n, i) => { const rot = (i ? 1 : -1) * (f.oron[i] + p.oron[i]) + sida * a * (nara(n) ? ora[0] : ora[1]) + 0.6 * p.vick;
    del('ear-' + n, rot, 18 * r, lyft(RIGG['ear-' + n][1]) + 4 * a - 6 * u); };
  orat('l', 0); orat('r', 1);
  ['l', 'r'].forEach((n, i) => { const s = i ? -1 : 1, A = f.armar[i] + p.armar[i], vinkel = s * A;
    // Lyfts en arm glider den ut och upp ur kroppen (UT), annars göms stumpen bakom ägget när den vrids uppåt.
    const ut = Math.max(0, Math.min(1, (A - UT.fran) / UT.over)) * (1 - p.fram[i]);
    const y0 = lyft(RIGG['arm-' + n][1]) + 20 * p.fram[i] + p.armY - UT.upp * ut;
    const dx = s * (p.klapp || 70 * p.fram[i]) - s * UT.ut * ut;    // framför kroppen: händerna in på magen (eller ihop, klapp)
    if (p.gang > 0) {     // gången (som förebilden): bakre armen framför kroppen ut över kanten, främre armen tittar fram, de pendlar i otakt
      const sd = sida || 1, bak = (n === 'l') === (sd > 0), g = p.gang;
      const [tv, tdx, tdy] = bak ? [sd * (-18 + 14 * p.sving), sd * 55, 20] : [sd * (-10 - 14 * p.sving), -sd * 60, 10];
      del('arm-' + n, mix(vinkel, tv, g), mix(dx, tdx, g), y0 + tdy * g);
      alla('.arm-' + n).forEach((e, j) => e.setAttribute('opacity', (bak && g > 0.5 ? 1 : 0) === j ? 1 : 0));
      q('.arm-' + n + '2').setAttribute('opacity', 0); return; }
    const IN = 200;                                   // så långt in bakom kroppen en arm göms (figurens px)
    if (nara(n)) { del('arm-' + n, vinkel, dx, y0 - 45 * a); del('arm-' + n + '2', vinkel - s * 16 * a, dx + s * (10 * a + IN * (1 - a)), y0 + 40 * a); }
    else del('arm-' + n, vinkel, dx + s * IN * a, y0);
    const syns = nara(n) || a < 0.98 ? 1 : 0;
    // Armen framför kroppen (rot utan kant) först när den nästan är på plats, annars syns roten när den glider ut över kanten.
    const vis = p.fram[i] > 0.85 ? 1 : 0;   // 0 bakom kroppen, 1 framför
    alla('.arm-' + n).forEach((e, j) => e.setAttribute('opacity', (vis === j ? 1 : 0) * syns));
    q('.arm-' + n + '2').setAttribute('opacity', nara(n) && a > 0 ? 1 : 0); });
  const lager = (n, fram) => alla('.' + n).forEach((e, j) => e.setAttribute('opacity', (fram > 0.5) === (j === 1) ? 1 : 0));
  lager('leg-l', p.benFram); lager('leg-r', p.benFram);
  del('leg-l', p.ben[0], 0, sank + p.benY[0], [1, 1 + p.benS[0]]);
  del('leg-r', -p.ben[1], 0, sank + p.benY[1], [1, 1 + p.benS[1]]);

  // Hela ansiktet glider med riktningen och blicken, direkt på den röda kroppen (ingen nos- eller magfläck).
  const fx = 36 * r, fy = 4 * a - 10 * u;
  q('.drag').setAttribute('transform', `translate(${fx} ${fy}) rotate(${5 * r} 512 430) translate(512 430) scale(${1 - 0.08 * a} 1) translate(-512 -430)`);
  const K = Math.max(0, Math.min(1, f.kawaii)), OG = mix(OGON, KAWAII.ogon, K), OS = mix([1, 1], KAWAII.skala, K);
  const ogon = alla('.oga'), lock = alla('.lock'), klipp = alla('.lockklipp'), glad = alla('.glad'), sov = alla('.sov'), bryn = alla('.bryn');
  alla('.glans').forEach(e => e.setAttribute('opacity', 1 - K)); alla('.glans-k').forEach(e => e.setAttribute('opacity', K));
  alla('.kind').forEach((e, i) => { const [x, y] = mix(KINDER[i], KAWAII.kinder[i], K); e.setAttribute('cx', x); e.setAttribute('cy', y); });
  OG.forEach(([x, y], i) => {
    const dy = f.ogonY - 4 * u;               // ögonen följer blicken lite mer än resten av ansiktet
    ogon[i].setAttribute('transform', `translate(${x + f.titt[0]} ${y + dy + f.titt[1]}) scale(${f.ogonS[0] * OS[0]} ${f.ogonS[1] * OS[1]})`);
    ogon[i].setAttribute('opacity', (1 - f.glad[i]) * (1 - f.sov));
    sov[i].setAttribute('transform', `translate(${x} ${y + dy}) scale(${1 + 0.3 * K} ${1 + 0.15 * K})`); sov[i].setAttribute('opacity', f.sov);   // kawaii: bredare båge
    // Locket: en böjd kant som både klipper ögat och ritas som linje, så att det inte blir hörn.
    const ly = -26 + f.lock[i] * 40, w = 17 * Math.sqrt(Math.max(0, 1 - (ly / 25) ** 2));
    klipp[i].setAttribute('d', `M-40 ${ly} H${-w} Q0 ${ly + 8} ${w} ${ly} H40 V60 H-40Z`);
    lock[i].setAttribute('d', `M${-w} ${ly} Q0 ${ly + 8} ${w} ${ly}`);
    lock[i].setAttribute('opacity', Math.min(1, f.lock[i] * 8));
    glad[i].setAttribute('transform', `translate(${x} ${y + dy}) scale(${1 + 0.25 * K})`);
    glad[i].setAttribute('opacity', f.glad[i]);
    const s = i ? 1 : -1;                     // inre änden upp: vänster bryn moturs, höger medurs
    bryn[i].setAttribute('transform', `translate(${x + 0.8 * f.titt[0]} ${y - 52 - 14 * K + f.brynY[i] + dy}) rotate(${s * f.brynV})`);
    bryn[i].setAttribute('opacity', f.bryn);
  });
  alla('.kind').forEach(c => c.setAttribute('opacity', f.kind));

  // Nyckelpigans mun (uppmätt ur nicke-forsta-c2.jpg): ett enda leende 478–541, ändarna i 443 och botten i 465, inget nosstreck.
  const cx = 510 + f.leX, b = f.leBred, le = f.le, ey = 465 - 22 * le;
  q('.le').setAttribute('d', `M${cx - 31 * b} ${ey} Q${cx} ${465 + 22 * le} ${cx + 31 * b} ${ey}`);
  q('.le').setAttribute('opacity', f.streck);
  const [rx, ry, d, my0] = f.mun, my = my0 + MY, h = ry * 4 / 3, topp = h * (1 - d);
  q('.mun').setAttribute('d', `M${cx - rx} ${my} C${cx - rx} ${my - topp} ${cx + rx} ${my - topp} ${cx + rx} ${my}
    C${cx + rx} ${my + h} ${cx - rx} ${my + h} ${cx - rx} ${my}Z`);
}

// I avsnitt: ansikte('glad', 0.5) blandar halvvägs från neutral, pose('hurra', k) likadant för kroppen. De två går ihop.
// namn kan också vara ett objekt från blanda(a, b, k) / blandaPose(a, b, k). fig är vilken nyckelpiga (standard: det första på sidan).
const forsta = () => document.querySelector('#figurer > g');
function ansikte(namn, k = 1, fig = forsta()) { fig.ansikte = blanda('neutral', namn, k); rita(fig, fig.ansikte, fig.pose); }
function pose(namn, k = 1, fig = forsta()) { fig.pose = blandaPose('neutral', namn, k); rita(fig, fig.ansikte || param('neutral'), fig.pose); }
// riktning('vanster' | 'hoger', k): riktningsposen ovanpå posen, k 0–1. riktning(null) tar bort den.
function riktning(sida, k = 1, fig = forsta()) { fig.riktning = sida ? (sida === 'hoger' ? 1 : -1) * k : 0;
  rita(fig, fig.ansikte || param('neutral'), fig.pose || POSE0); }
// Rörelser: hela uttryck + pose räknas ur t (sekunder), så att en film kan renderas bild för bild.
// rorelse('klappa' | 'hoppa' | 'dansa' | 'ga', t, fig). Loopar: klappa 3 s, hoppa 2,4 s, dansa 4 s, ga 8 s.
const P = o => ({ ...POSE0, ...o }), kl = (a, b, x) => Math.max(a, Math.min(b, x));
const blinka = (f, t, period = 3.1) => (t % period) < 0.12 ? { ...f, lock: [1, 1] } : f;
// Ett steg i gången (t sekunder, amp 0–1 stegens styrka, rikt −1 … 1 gångriktningen): riktningsposen åt det hållet,
// så att ansiktet och magen glider dit. Bakre armen ligger framför kroppen och sticker ut över kanten, den främre tittar fram
// på andra sidan, och de pendlar i otakt (gang 0–1, sving −1 … 1, se rita). Öronen rör sig bara lite.
const steg = (t, amp, rikt) => {
  const fi = t * 2.4 * Math.PI, f = Math.sin(fi) * amp, vy = Math.cos(fi) * Math.sign(Math.sin(fi)) * 12 * amp;
  const ora = kl(-8, 8, vy * 0.3), fl = Math.sin(t * 5);
  return [{ ...blanda('neutral', 'glad', 0.6), titt: [5 * Math.sign(rikt) * amp, 0] }, P({ rikt, luta: 4 * f, lyft: -Math.abs(f) * 12,
    ben: [16 * f, 16 * f], benY: [-40 * Math.max(0, -f), -40 * Math.max(0, f)], gang: Math.abs(rikt), sving: f,
    oron: [ora + fl, ora - fl] })];
};
// Klappen (som Milles): stumparna når inte varandra, så de kommer fram från sidorna och klappar mot magen vid kroppens kanter.
// Vinkel v + dv·c (c = 0 vid klappen), in − din·c px in över magen, ner px lägre.
const KLAPP = { v: -128, dv: 30, in: 50, din: 22, ner: 10 };
const ROR = {
  klappa: t => {      // armarna fram, händerna möts framför bröstet, en liten studs på varje klapp
    const T = t % 3, in_ = mjuk(kl(0, 1, T / 0.4)) * mjuk(kl(0, 1, (3 - T) / 0.4));
    const c = T > 0.4 && T < 2.6 ? Math.abs(Math.sin(Math.PI * (T - 0.4) / 0.36)) : 1;   // 0 = händerna möts
    const smack = in_ * (1 - c) ** 4;
    const f = blanda('glad', 'jatteglad', in_);
    return [blinka(f, t), P({ fram: [in_, in_], armar: mix([0, 0], [KLAPP.v + KLAPP.dv * c, KLAPP.v + KLAPP.dv * c], in_),
      klapp: in_ * (KLAPP.in - KLAPP.din * c), armY: in_ * KLAPP.ner, strack: -0.025 * smack, bred: 0.02 * smack, lyft: 6 * smack, oron: [4 * smack, 4 * smack],
      vick: Math.sin(t * 3) * 3 })];
  },
  hoppa: t => {       // som i rigg-test.html: huk 0,35 s, 1 s i luften, landning 0,3 s
    const k = t % 2.4, l = k > 0.35 && k < 1.35 ? (k - 0.35) / 1.0 : -1;
    let lyft = 0, vy = 0, sy = 0, sx = 0, arm = 0, fot = 0, glad = 0;
    if (l >= 0) { lyft = -4 * 220 * l * (1 - l); vy = -4 * 220 * (1 - 2 * l) / 30; sy = 0.08; sx = -0.06; arm = 32; fot = -30; glad = 1; }
    else { const tryck = k <= 0.35 ? Math.sin(k / 0.35 * Math.PI) : Math.sin(kl(0, 1, (k - 1.35) / 0.3) * Math.PI);
      sy = -0.12 * tryck; sx = 0.1 * tryck; arm = -12 * tryck; }
    const ora = kl(-25, 25, vy * 0.9);
    return [blinka(blanda('glad', 'jatteglad', glad), t), P({ lyft, strack: sy, bred: sx, armar: [arm, arm], benY: [fot, fot],
      oron: [ora, ora], vick: Math.sin(t * 3) * 3 })];
  },
  ga: t => {          // går fram och tillbaka (8 s), saktar in och vänder vid kanterna
    const T = t % 8, fart = Math.cos(T / 8 * 2 * Math.PI);
    const [f, p] = steg(T, Math.min(1, Math.abs(fart) * 1.6), kl(-1, 1, fart * 1.6));
    return [blinka(f, t), { ...p, x: 520 * Math.sin(T / 8 * 2 * Math.PI), vick: 14 * Math.sin(T * 2.4 * Math.PI) * Math.min(1, Math.abs(fart) * 1.6) }];
  },
  ligga: t => {       // ligger på magen med händerna under hakan och sover: ett andetag var 4:e sekund
    const a = (1 - Math.cos(2 * Math.PI * t / 4)) / 2;
    return [{ ...param('sover') }, { ...blandaPose('neutral', 'liggMage', 1), strack: -0.3 + 0.02 * a, bred: 0.18 + 0.015 * a }]; },
  sova: t => {        // sover: lugna andetag (4 s per andetag), magen höjs och breddas lite, öronen följer med
    const a = (1 - Math.cos(2 * Math.PI * t / 4)) / 2;
    return [{ ...param('sover') }, { ...blandaPose('neutral', 'sover', 1), strack: -0.03 + 0.02 * a, bred: 0.04 + 0.012 * a,
      oron: [10 - 3 * a, 10 - 3 * a], upp: -0.6 + 0.08 * a }];
  },
  dansa: t => {       // gungar i takt (1 s per gung), armarna turas om upp, foten lyfts på motsatt sida, antennerna viftar
    const T = t % 4, in_ = mjuk(kl(0, 1, T / 0.4)) * mjuk(kl(0, 1, (4 - T) / 0.4)), fi = 2 * Math.PI * T, s = Math.sin(fi) * in_;
    const studs = Math.abs(Math.sin(fi)) * in_, eft = Math.sin(fi - 0.8) * in_;
    const f = blanda('glad', 'jatteglad', in_);
    return [blinka(f, t), P({ luta: 5 * s, lyft: -14 * studs, strack: 0.02 * studs,
      armar: [in_ * 26 + 26 * s, in_ * 26 - 26 * s], benY: [-18 * Math.max(0, s), -18 * Math.max(0, -s)], ben: [6 * Math.max(0, s), 6 * Math.max(0, -s)],
      oron: [6 * eft, -6 * eft], vick: 14 * Math.sin(2 * fi) * in_ })];
  },
};
// Rörelsen styr armarna själv, så uttryckets armar (jätteglad lyfter dem) räknas inte med.
function rorelse(namn, t, fig = forsta()) { const [f0, p] = ROR[namn](t), f = { ...f0, armar: NEUTRAL.armar };
  fig.ansikte = f; fig.pose = p; rita(fig, f, p); }
Object.assign(window, { UTTRYCK, NEUTRAL, POSER, POSE0, blanda, blandaPose, ansikte, pose, riktning, rorelse, ROR });

// Arket med poser visar varje pose med ett uttryck som passar.
const PAR = { neutral: 'neutral', lutaV: 'glad', lutaH: 'nyfiken', vanster: 'glad', hoger: 'nyfiken', haller: 'glad', nar: 'nyfiken', upp: 'forvanad', ner: 'ledsen',
  pekar: 'nyfiken', hurra: 'jatteglad', magen: 'glad', blyg: 'fnissig', sitter: 'glad', strack: 'somnig', huka: 'glad',
  stampar: 'tanker', lyssnar: 'nyfiken', sover: 'sover', liggMage: 'sover' };

const sok = new URLSearchParams(location.search), bara = sok.get('bara'), enPose = sok.get('pose');
const etikett = (x, y, s, storlek) => document.getElementById('etiketter').insertAdjacentHTML('beforeend',
  `<text x="${x}" y="${y}" font-size="${storlek}">${s}</text>`);
const mjuk = k => k * k * (3 - 2 * k);
let render;
if ((bara && UTTRYCK[bara]) || (enPose && POSER[enPose])) {
  // ?bara=<uttryck> och/eller ?pose=<pose>: en stor nyckelpiga som går neutral → uttryck/pose → neutral på 4 s.
  const fig = figur(960, 1000, 0.92), u = UTTRYCK[bara] ? bara : 'neutral', po = POSER[enPose] ? enPose : 'neutral';
  etikett(1500, 120, [POSER[po].namn, UTTRYCK[u].namn].filter(n => n !== 'neutral').join(' · ') || 'neutral', 56);
  render = t => { const T = t % 4, k = mjuk(T < 0.6 ? 0 : T < 1.2 ? (T - 0.6) / 0.6 : T < 2.8 ? 1 : T < 3.4 ? 1 - (T - 2.8) / 0.6 : 0);
    ansikte(u, k, fig); pose(po, k, fig); document.getElementById('brus').setAttribute('seed', Math.floor(t * 10) % 50 + 1); };
} else if (ROR[sok.get('rorelse')] || sok.get('rorelse') === 'alla') {
  // ?rorelse=klappa|hoppa|dansa: en stor nyckelpiga. ?rorelse=alla: alla tre bredvid varandra.
  const namn = sok.get('rorelse') === 'alla' ? ['klappa', 'hoppa', 'dansa'] : [sok.get('rorelse')];
  const NAMN = { klappa: 'klappar händerna', hoppa: 'hoppar', dansa: 'dansar', ga: 'går', sova: 'sover', ligga: 'ligger och sover' };
  const figs = namn.map((n, i) => { const x = namn.length > 1 ? 330 + 630 * i : 960;
    etikett(x, 1060, NAMN[n], 40); return figur(x, 1000, namn.length > 1 ? 0.62 : 0.75); });
  render = t => { namn.forEach((n, i) => rorelse(n, t, figs[i])); document.getElementById('brus').setAttribute('seed', Math.floor(t * 10) % 50 + 1); };
} else if (sok.get('film')) {
  // ?film=1: testfilm i v2-skogen (som rigg-test.html, zoom 2, kameran följer). Avsnitt efter varandra, 0,5 s mjuk övergång mellan dem.
  const S = '../../../stiltest-premium/', MARK = 915, Z = 2;
  document.getElementById('scen').innerHTML = `<image href="${S}skogen-monster-mild-a.png" width="1920" height="1080" preserveAspectRatio="xMidYMid slice"/>
    <image href="${S}cut/egen/trad.png" x="150" y="230" height="700" width="431"/>`;
  document.getElementById('forgrund').innerHTML = `<image href="${S}cut/egen/gras.png" x="500" y="790" height="180" width="202"/>
    <image href="${S}cut/egen/gras.png" x="-1420" y="790" height="180" width="202" transform="scale(-1 1)"/>`;
  // Nyckelpigan står på två ben och är lika stor som de andra tvåbenta: SKALA 0,5 (art direction v2 "Storlek i världen").
  const SK = 0.5, fig = figur(960, MARK, SK);
  // Sovbilden (Sannas val C, 2026-11-08, som Milles): den ritade sovande nyckelpigan i en egen grupp i figuren, skalad kring
  // (cx, FOTTER), och tre z i kod. PLATSHÅLLARE: sovbilden finns inte än (fil: null). Då ligger riggen kvar och byter i hoppets
  // topp till uttrycket och posen 'sover', med samma landning och andning. När bilden finns: klipp den med
  // .claude/skills/lk-figur/scripts/sovbild.py till cut/nicke-sover.png, tunn_kant.py 12, och fyll i fil, cx och botten här.
  const SOV = { fil: null, cx: 512, botten: 820, skala: 0.86 };
  fig.insertAdjacentHTML('beforeend', `<g class="sovbild" opacity="0">${SOV.fil ? `<image href="${SOV.fil}" width="1024" height="1024" y="${FOTTER - SOV.botten}"/>` : ''}</g>
    <g class="zzz">${[0, 1, 2].map(() => `<path class="z" d="M-22 -22 H22 L-22 22 H22" fill="none" stroke="#7a4a32" stroke-width="9"
      stroke-linecap="round" stroke-linejoin="round" opacity="0"/>`).join('')}</g>`);
  fig.querySelectorAll('.z').forEach(z => z.insertAdjacentHTML('beforebegin',
    `<path class="zk" d="M-22 -22 H22 L-22 22 H22" fill="none" stroke="#fff" stroke-width="21" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>`));
  const fjader = u => 1 - Math.exp(-6 * u) * Math.cos(11 * u);   // landar och svänger in, 0 → 1
  // Sovavsnittet (6,4 s): huk 0–0,3 s, hopp 0,3–1,2 s (70 px), bytet till sovbilden i toppen (0,75 s), landar och studsar
  // in 1,2–1,8 s, andas och zzz, hoppar upp ur sovbilden 5,0–5,9 s (riggen tar över i toppen, 5,45 s) och landar stående.
  const SOVD = 6.4, H = 70, hopp = (tl, t0) => { const h = kl(0, 1, (tl - t0) / 0.9); return h > 0 && h < 1 ? -4 * H * h * (1 - h) : 0; };
  const sovRigg = tl => { const lyft = tl < 4 ? hopp(tl, 0.3) : hopp(tl, 5.0), land = mjuk(kl(0, 1, (tl - 5.9) / 0.15)) * (1 - mjuk(kl(0, 1, (tl - 6.05) / 0.3)));
    return [tl < 4 ? { ...param('somnig'), streck: 0 } : blanda('sover', 'somnig', mjuk(kl(0, 1, (tl - 5.2) / 0.4))),
      P({ lyft, armar: [0, 0], strack: tl < 0.3 ? -0.08 * mjuk(tl / 0.3) : (lyft ? 0.04 : -0.06 * land) }), ]; };
  const sovbild = ts => {                   // ts = tid i sovavsnittet; ger [sover, kropp [sx, sy], dy] eller null
    if (ts < 0.75 || ts > 5.45) return null;
    const a = (1 - Math.cos(2 * Math.PI * Math.max(0, ts - 1.8) / 4)) / 2, andas = [1 + 0.012 * a, 1 + 0.022 * a];
    if (ts < 1.2) return [[0.97, 1.03], -4 * H * (0.5 + (ts - 0.75) / 0.9) * (0.5 - (ts - 0.75) / 0.9)];
    if (ts > 5.0) { const h = (ts - 5.0) / 0.9; return [[0.97, 1.03], -4 * H * h * (1 - h)]; }
    const u = fjader(kl(0, 1, (ts - 1.2) / 0.6));
    return [[andas[0] * (1.1 - 0.1 * u), andas[1] * (0.85 + 0.15 * u)], 0]; };
  // Antennerna: lugn gungning, och en snabb vickning i 0,6 s var 4,5:e sekund (som Kanels).
  const vick = t => Math.sin(t * 3) * 3 + ((t % 4.5) > 3.6 && (t % 4.5) < 4.2 ? Math.sin(t * 34) * 18 : 0);
  const gang = (x0, x1, d) => tl => {          // går från x0 till x1 (figurens px), saktar in och vänder sig mot tittaren i början och slutet
    const kant = Math.min(tl, d - tl), [f, p] = steg(tl, mjuk(kl(0, 1, kant / 0.3)), Math.sign(x1 - x0) * mjuk(kl(0, 1, kant / 0.5)));
    return [f, { ...p, x: x0 + (x1 - x0) * mjuk(tl / d), vick: 14 * Math.sin(tl * 2.4 * Math.PI) * mjuk(kl(0, 1, kant / 0.3)) }]; };   // antennerna vickar i takt med stegen
  const vinka = d => tl => {                   // höger arm upp och vinkar, munnen öppnas på "hej"
    const upp = mjuk(kl(0, 1, Math.min(tl / 0.4, (d - tl) / 0.4))), prat = tl > 0.5 && tl < 1.1 ? Math.sin((tl - 0.5) / 0.6 * Math.PI) : 0;
    return [blanda('glad', 'jatteglad', prat), P({ armar: [0, upp * (82 + 18 * Math.sin(tl * 13))],   // + uttryckets 16–20: armen glider ut ur kroppen (UT) och vinkar utanför
      luta: Math.sin(tl * 7) * 2 * upp,
      oron: [-3 * upp, 3 * Math.sin(tl * 6) * upp], vick: vick(tl) })]; };
  const stilla = (u, po, k0 = 0) => tl => [blanda('neutral', u, 1), { ...blandaPose('neutral', po, 1), vick: vick(tl) }];
  const ror = (namn, t0 = 0) => tl => { const [f, p] = ROR[namn](tl + t0); return [{ ...f, armar: NEUTRAL.armar }, p]; };
  const AVSNITT = [
    [3.2, gang(-2300, 0, 3.2)],
    [2.6, vinka(2.6)],
    [2.2, stilla('nyfiken', 'lyssnar')],
    [2.4, tl => [blanda('nyfiken', 'kawaii', mjuk(kl(0, 1, (tl - 1.2) / 0.5))), { ...blandaPose('neutral', 'nar', 1), vick: vick(tl) }]],
    // hurra: armarna upp och ner igen inom avsnittet, så att de inte flyger genom luften in i klappen
    [3, tl => [blanda('tanker', 'jatteglad', mjuk(kl(0, 1, (tl - 1.4) / 0.3))),
      { ...blandaPose('neutral', 'hurra', mjuk(kl(0, 1, (tl - 1.4) / 0.3)) * mjuk(kl(0, 1, (3 - tl) / 0.5))), vick: vick(tl) }]],
    [3, ror('klappa')],
    [4.8, ror('hoppa')],
    [4, ror('dansa')],
    // somnar: sömnig och gäspar, hoppar till sovbilden och sover (6,4 s), sträcker på sig, vinkar
    [3, tl => { const s = blanda('glad', 'somnig', mjuk(kl(0, 1, (tl - 0.6) / 0.8))), gap = Math.sin(Math.PI * kl(0, 1, (tl - 1.6) / 0.9));
      return [{ ...s, lock: s.lock.map(v => Math.min(1, v + 0.3 * Math.max(0, Math.sin(tl * 2.2)))), mun: mix(s.mun, [16, 20, 0, 470], gap) },
        P({ armar: [0, 0], vick: vick(tl) })]; }],
    // somnar (C): litet hopp, den ritade sovbilden landar liggande, andas, zzz; hoppar upp igen (se sovbild)
    [SOVD, sovRigg],
    [1.8, tl => [blanda('somnig', 'glad', mjuk(kl(0, 1, (tl - 1.1) / 0.5))), { ...blandaPose('neutral', 'strack', Math.sin(Math.PI * kl(0, 1, tl / 1.6))), vick: vick(tl) }]],
    [2.4, vinka(2.4)],
    [3, gang(0, 2600, 3)],
  ];
  const LANGD = AVSNITT.reduce((s, [d]) => s + d, 0);
  const lage = t => { let t0 = 0; t = kl(0, LANGD - 0.001, t);
    for (let i = 0; i < AVSNITT.length; i++) { const [d, fn] = AVSNITT[i];
      if (t < t0 + d) { const tl = t - t0; let [f, p] = fn(tl);
        if (i && tl < 0.5) { const [d0, fn0] = AVSNITT[i - 1], [f0, p0] = fn0(d0), k = mjuk(tl / 0.5);
          f = blanda(f0, f, k); p = blandaPose(p0, p, k); }
        return [blinka(f, t), p]; }
      t0 += d; } };
  window.LANGD = LANGD;
  render = t => { const [f, p] = lage(t); fig.ansikte = f; fig.pose = p; rita(fig, f, p);
    // sovbilden tar över riggen i sovavsnittet
    const T0 = AVSNITT.slice(0, AVSNITT.findIndex(([, fn]) => fn === sovRigg)).reduce((s, [d]) => s + d, 0), ts = t - T0;
    const sb = sovbild(ts), sbg = fig.querySelector('.sovbild');
    fig.querySelector('.figuren').setAttribute('opacity', sb && SOV.fil ? 0 : 1); sbg.setAttribute('opacity', sb ? 1 : 0);
    if (sb && !SOV.fil) { const [[sx, sy], dy] = sb, so = blandaPose('neutral', 'sover', 1);   // platshållaren: riggen sover
      rita(fig, param('sover'), { ...so, lyft: dy, strack: so.strack + sy - 1, bred: so.bred + sx - 1, armar: [-6, -6], fram: [0, 0], klapp: 0 }); }
    if (sb) { const [[sx, sy], dy] = sb;
      sbg.setAttribute('transform', `translate(0 ${dy}) translate(${SOV.cx} ${FOTTER}) scale(${SOV.skala * sx} ${SOV.skala * sy}) translate(${-SOV.cx} ${-FOTTER})`); }
    // zzz: tre z flyter upp och tonar, 0,7 s isär, när han har landat och sover
    fig.querySelectorAll('.z').forEach((z, j) => { const t1 = ts - 2.0 - j * 0.7, u = ((t1 % 2.1) + 2.1) % 2.1 / 2.1;
      const syns = t1 > 0 && ts < 5.0 ? Math.sin(Math.PI * u) * (1 - mjuk(kl(0, 1, (ts - 4.4) / 0.5))) : 0;
      const tr = `translate(${610 + 90 * u + 25 * Math.sin(u * 5)} ${420 - 260 * u}) scale(${1 + 0.9 * u})`;
      [z, z.previousElementSibling].forEach(e => { e.setAttribute('transform', tr); e.setAttribute('opacity', syns); }); });
    // Kameran följer nyckelpigan med eftersläp (medel av de senaste 0,6 s) och 70 % av hoppet, aldrig utanför bakgrunden.
    let fx = 0; for (let i = 0; i < 12; i++) fx += (960 + SK * lage(t - i * 0.05)[1].x) / 12;
    const tx = kl(1920 - 1920 * Z, 0, 1000 - fx * Z), ty = kl(1080 - 1080 * Z, 0, 1030 - MARK * Z - 0.7 * p.lyft);
    document.getElementById('kamera').setAttribute('transform', `translate(${tx} ${ty}) scale(${Z})`);
    document.getElementById('brus').setAttribute('seed', Math.floor(t * 10) % 50 + 1); };
} else if (sok.get('ark') === 'kawaii') {
  // ?ark=kawaii: neutral → kawaii (k 0, 0,5, 1).
  [0, 0.5, 1].forEach((k, i) => { const x = 400 + 560 * i, fig = figur(x, 820, 0.62); ansikte('kawaii', k, fig);
    etikett(x, 880, k ? `kawaii ${k}` : 'neutral', 36); });
  render = () => {};
} else if (sok.get('ark') === 'poser') {
  Object.keys(POSER).forEach((n, i) => {
    const x = 160 + 320 * (i % 6), y = 300 + 350 * Math.floor(i / 6), fig = figur(x, y, 0.3);
    ansikte(PAR[n], 1, fig); pose(n, 1, fig);
    etikett(x, y + 42, POSER[n].namn, 26); etikett(x, y + 70, UTTRYCK[PAR[n]].namn, 20);
  });
  render = () => {};
} else {
  Object.keys(UTTRYCK).forEach((n, i) => {
    const x = 160 + 320 * (i % 6), y = 330 + 345 * Math.floor(i / 6);   // tre rader (13 uttryck)
    ansikte(n, 1, figur(x, y, 0.28)); etikett(x, y + 40, UTTRYCK[n].namn, 30);
  });
  etikett(1600, 1000, 'Nicke', 48); etikett(1600, 1050, 'uttryck', 36);
  render = () => {};
}
window.render = render;
const start = performance.now();
// window.stilla = true stoppar loopen, så att render(t) kan anropas bild för bild.
(function loop() { if (!window.stilla) render((performance.now() - start) / 1000); requestAnimationFrame(loop); })();
