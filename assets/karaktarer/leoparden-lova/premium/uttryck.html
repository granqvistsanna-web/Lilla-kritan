<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lova premium – uttryck och poser</title>
<style>
  body { margin:0; background:#222; display:grid; place-items:center; min-height:100vh; }
  svg { width:min(100vw, 1280px); height:auto; display:block; }
  text { font-family: Fredoka, "Arial Rounded MT Bold", system-ui, sans-serif; fill:#5a3b2e; text-anchor:middle; }
</style>
</head>
<body>
<!-- Leopardens uttryck i kod (gjort som Milles och Bulles), över det ansiktslösa v2-urklippet. Nosfläcken och magen är egna bilder (flackar.py). Ett ark med alla uttryck, eller ?bara=<namn> för ett stort
     som går neutral → uttryck → neutral. I avsnitt: window.ansikte(namn, k) med k 0–1 från neutral. -->
<svg viewBox="0 0 1920 1080">
  <defs>
    <filter id="boil" filterUnits="userSpaceOnUse" x="-100" y="-100" width="2120" height="1280">
      <feTurbulence id="brus" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
      <feDisplacementMap in="SourceGraphic" scale="5"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="#f6efe3"/>
  <g id="kamera"><g id="scen"></g><g id="figurer" filter="url(#boil)"></g><g id="forgrund"></g></g>
  <g id="etiketter"></g>
</svg>
<script src="../../../../verktyg/blinka.js"></script>
<script src="../../../../verktyg/rigg-motor.js"></script>
<script>
// Vridpunkter ur lova-rigg.json. Öronen är hela runda skivor bakom huvudet (som Bulles) och vrids kring roten en bit in i huvudet.
const RIGG = { 'arm-l': [245, 575], 'arm-r': [776, 572], 'leg-l': [430, 840], 'leg-r': [608, 833],
               'ear-l': [381, 296], 'ear-r': [655, 284], 'tail': [707, 781] };
// Uppmätt ur lova-forsta.jpg mot lova-faceless.jpg (ansikte_matt.py). Munnen sitter 37 px lägre än Milles (MY).
const OGON = [[420, 402], [601, 401]], KINDER = [[383, 452], [637, 452]], FOTTER = 922, MY = 41;
// Kawaii-ögon (uttrycket 'kawaii', för glädje och förundran, aldrig standardansiktet). Mått mot huvudets bredd W vid ögonhöjd (520 px,
// som kawaii-matt.md): ögon 1,4 × bredare och 1,5 × högre, 0,425 W isär, 0,035 W lägre; kinderna 10 px lägre och 8 px längre ut.
const KAWAII = { ogon: [[400, 420], [621, 419]], skala: [1.4, 1.5], kinder: [[375, 462], [645, 462]] };
// Den ritade sovbilden (cut/lova-sover.png, sovbild.py ur original/lova-sover-flow.jpg): kroppen x 129–934, botten 902.
// Skalas 0,86 kring (cx, FOTTER), ungefär lika stor som den stående kroppen (som Bulles).
const SOV = { cx: 531, botten: 902, skala: 0.86 };
const LINJE = '#2a1d1a', MUNLINJE = '#3a2a22', MUNFARG = '#7a2a1c', KIND = '#ec8f96';

// Alla uttryck har samma parametrar, så att de går att blanda. Det som inte anges är neutralt.
// ogonS [sx, sy] ögonens storlek · titt [x, y] blickriktning · ogonY ögon och bryn upp (−) / ner (+)
// glad [v, h] öga → ^-båge (0–1) · sov öga → sluten u-båge (0–1, som Luddes) · lock [v, h] ögonlock ner (0–1) · bryn synlighet · brynY [v, h] höjd · brynV inre änden upp (grader)
// kind kindernas styrka · le leendet 1 … −1 (lite surt) · leBred bredd · leX munnen åt sidan · streck munlinjernas synlighet
// mun [rx, ry, d, cy] öppen mun (d 0 = rund, 1 = platt överkant) · oron [v, h] öronen hänger (+) / spetsas (−) i grader
// armar [v, h] armarna upp (+) / ner (−) i grader, vila 8 · luta hela figuren i grader · strack kroppen sträcks (+) / sjunker (−)
const NEUTRAL = { ogonS: [1, 1], titt: [0, 0], ogonY: 0, glad: [0, 0], lock: [0, 0], bryn: 0, brynY: [0, 0], brynV: 0,
  kind: 0.75, le: 1, leBred: 1, leX: 0, streck: 1, mun: [0, 0, 0, 462], oron: [0, 0], armar: [8, 8], luta: 0, strack: 1, sov: 0, kawaii: 0,
  glimt: 0, tand: 0, tunga: 0, tandNere: 1, tander: [1, 1, 1, 1, 1, 1, 1, 1],
  tungan: [0, 0, 0], tar: [0, 0.3] };   // tandmunnen, se verktyg/rigg-motor.js

const UTTRYCK = {
  neutral:   { namn: 'neutral' },
  glad:      { namn: 'glad', kind: 1, le: 1.3, leBred: 1.15, ogonY: -2, oron: [-4, -4], armar: [16, 16] },
  jatteglad: { namn: 'jätteglad', glad: [1, 1], kind: 1, streck: 0, mun: [22, 20, 1, 456], oron: [-8, -8], armar: [40, 40], strack: 1.03 },
  forvanad:  { namn: 'förvånad', ogonS: [1.2, 1.16], bryn: 1, brynY: [-12, -12], kind: 0.6, streck: 0, mun: [9, 11, 0, 466],
               oron: [-9, -9], armar: [22, 22], strack: 1.04 },
  nyfiken:   { namn: 'nyfiken', titt: [11, -2], bryn: 0.9, brynY: [0, -8], le: 0.6, leBred: 0.8, leX: 4, oron: [-2, 10], luta: 5 },
  tanker:    { namn: 'tänker', titt: [-7, -12], bryn: 0.9, brynY: [-9, 0], le: 0.4, leBred: 0.55, leX: 10, oron: [6, -2], luta: -3 },
  ledsen:    { namn: 'lite ledsen', titt: [0, 6], ogonS: [1.05, 1.05], lock: [0.08, 0.08], bryn: 1, brynY: [-4, -4], brynV: 30,
               kind: 0.55, le: -0.65, leBred: 0.6, oron: [28, 28], armar: [-6, -6], luta: 2, strack: 0.97 },
  // arg: sur och bestämd, inte läskig (små barn): brynen ner mot nosen, lite sänkta lock, munnen neråt, röda kinder, öronen bakåt
  arg:       { namn: 'arg', titt: [0, 2], lock: [0.22, 0.22], bryn: 1, brynY: [9, 9], brynV: -22, kind: 1, le: -0.9, leBred: 0.7,
               oron: [10, 10], armar: [-6, -6], strack: 0.98 },
  // mums: glada blundande ögon, ett litet gap och tungan som slickar mungipan, kinderna uppe
  mums:      { namn: 'mums', glad: [1, 1], kind: 1, ogonY: -2, streck: 0, mun: [8, 9, 0, 456], tungan: [0.8, 0.75, 130], oron: [-4, -4], armar: [10, 10], luta: 3, strack: 1.01 },
  // skrattar (som Bulles): glada blundande ögon och ett stort gap, kinderna uppe, öronen spetsade (skrattet i rörelse är ROR.skratta)
  skrattar:  { namn: 'skrattar', glad: [1, 1], kind: 1, ogonY: -2, streck: 0, mun: [30, 30, 1, 456], oron: [-10, -10], armar: [30, 30], luta: -3, strack: 1.04 },
  // usch: ögonen hopknipna, brynen ner och ihop, tungan ut, öronen bakåt (roligt, inte otäckt)
  usch:      { namn: 'usch', lock: [0.8, 0.8], bryn: 1, brynY: [12, 12], brynV: -28, kind: 0.8, le: -1, leBred: 0.8, mun: [12, 14, 0, 466],
               tungan: [1, 0, 0], oron: [20, 20], armar: [-6, -6], luta: -2, strack: 0.97 },
  // gråter: ledsna ögon med en glansig tårbula, brynen högt uppe i mitten, munnen en darrig båge neråt, en tår per öga som rinner (ledsen med tår, ingen förtvivlan)
  gratar:    { namn: 'gråter', titt: [0, 6], ogonS: [1.08, 1.1], lock: [0.1, 0.1], bryn: 1, brynY: [-6, -6], brynV: 34, kind: 0.9, le: -1, leBred: 0.6,
               tar: [1, 0.35], oron: [30, 30], armar: [-8, -8], luta: 2, strack: 0.96 },
  somnig:    { namn: 'sömnig', titt: [0, 3], lock: [0.66, 0.66], kind: 0.7, streck: 0, mun: [10, 13, 0, 468],
               oron: [16, 16], armar: [2, 2], luta: 3, strack: 0.97 },
  fnissig:   { namn: 'fnissig', glad: [1, 1], kind: 1, streck: 0, mun: [10, 9, 1, 456], leX: 3, oron: [-4, 8], armar: [24, 24], luta: 4, strack: 0.98 },
  blinkar:   { namn: 'blinkar', glad: [0, 1], kind: 1, le: 1.3, leBred: 1.1, leX: 5, oron: [0, -6], armar: [8, 30], luta: -3 },
  // sover (som Luddes v2): ögonen är slutna u-bågar (inte locket, då syns en bit av pupillen under), en liten nöjd mun
  sover:     { namn: 'sover', sov: 1, ogonY: 4, kind: 0.85, le: 0.5, leBred: 0.7, oron: [10, 10], armar: [0, 0], strack: 0.97 },
  // ivrig (som Bulles): jätteglad med öppna ögon, stort glatt gap. 028/029 byggde den i scenkoden (jätteglad utan bågarna).
  ivrig:     { namn: 'ivrig', kind: 1, streck: 0, mun: [22, 20, 1, 456], oron: [-8, -8], armar: [40, 40], strack: 1.03 },
  kawaii:    { namn: 'kawaii', kawaii: 1, kind: 1, le: 1.2, leBred: 1.1, ogonY: -2, oron: [-6, -6], armar: [20, 20], strack: 1.02 },
  // stolt: stora glittriga ögon med halvt sänkta lock som tittar lite uppåt, lätt lyfta bryn, litet leende och röda kinder (hakan upp och bröstet ut ger posen stolt). Förut: glada bågar, som jätteglad.
  stolt:     { namn: 'stolt', titt: [0, -3], kawaii: 0.7, lock: [0.2, 0.2], ogonY: -2, bryn: 0.9, brynY: [-8, -8], brynV: 6, kind: 1, le: 1.3, leBred: 0.9,
               oron: [-6, -6], armar: [-8, -8], strack: 1.04 },
  // Tänderna (som pandan och hunden, Sanna 2026-11-11: gulligt, inte argt): små runda tänder, varmt rosaröd mun, stor tunga,
  // tandleendet visar bara övre raden. Tänderna syns först från 100 px bredd och 26 px höjd (tandmunRita). Uppmätt: nosen till 471, leendet 485–506, nosfläcken (lova-nos.png) x 440–583, y 427–541: tandleendet 100 px brett, överkant 482.
  flinar:    { namn: 'visar tänderna', glad: [1, 1], kind: 1, streck: 0, tand: 1, tandNere: 0, tunga: 1, oron: [-5, -5], armar: [20, 20], strack: 1.03, mun: [50, 27, 1, 441] },
};
// ponytail: fnissig har ingen hand för munnen, armarna når inte dit (ca 115 px långa, munnen 300 px bort). Axlarna dras upp i stället.

// Poser: kropp, armar, ben och öron. De läggs ovanpå uttrycket, så pose('hurra') + ansikte('jatteglad') går ihop.
// luta hela figuren (grader, kring fötterna) · rikt −1 … 1 riktningspose åt vänster/höger (ansiktet glider dit, öronen lutar,
// båda armarna ut på den sidan, se rita) · upp −1 … 1 tittar upp/ner (ansiktet flyttas) · bred kroppens bredd (+/−) · strack kroppens
// höjd (+/−) · sank kroppen ner (+) / upp (−) i px · armar [v, h] upp (+) i grader, läggs till uttryckets · fram [v, h] armen
// framför kroppen (0/1) · benFram benen framför kroppen (0/1) · oron [v, h] hänger (+) i grader · ben [v, h] utåt (+) i grader · benY [v, h] foten upp (−) i px · benS [v, h] benet längre (+)
// lyft hela figuren upp (−) i px, skuggan krymper · svans svansens vinkel i grader · x hela figuren åt sidan i px
// boj kroppen böjer sig från fötterna i grader (+ åt höger): huvudet lutar sig dit, fötterna står kvar platt (luta vrider hela figuren)
// bada 0–1: båda armarna ut på riktningens sida (riktningsposerna, håller, når); utan den vänder rikt bara ansiktet, magen och öronen
const POSE0 = { luta: 0, rikt: 0, upp: 0, bred: 0, strack: 0, sank: 0, armar: [0, 0], fram: [0, 0], oron: [0, 0],
  benFram: 0, ben: [0, 0], benY: [0, 0], benS: [0, 0], lyft: 0, svans: 0, x: 0, klapp: 0, gang: 0, sving: 0, armY: 0, hand: 0, gnista: 0,
  sovbild: 0, sovS: [1, 1], zt: -1, skak: [0, 0], nick: [0, 0], boj: 0, bada: 0,
  ligg: 0, golv: [0, 0],   // kroppsrörelserna (sätta sig, lägga sig, trappa, stege) i verktyg/rigg-motor.js
  hall: [0, 0], rack: [0, 0], sakV: 0, sakGrepp: 0, sakLager: 1, sakFri: [512, FOTTER, 0], sakMun: 0, sakBett: 0, sakPa: 0 };   // saker i handen (plocka)   // sovbild: den ritade sovbilden i stället för riggen (0/1) · sovS dess skala kring botten · zt sekunder sedan hon somnade (zzz), −1 = inga
const POSER = {
  neutral:   { namn: 'neutral' },
  lutaV:     { namn: 'lutar vänster', luta: -1.5, boj: -4.5, oron: [-4, 4] },
  lutaH:     { namn: 'lutar höger', luta: 1.5, boj: 4.5, oron: [4, -4] },
  vanster:   { namn: 'riktning vänster', rikt: -1, bada: 1 },
  hoger:     { namn: 'riktning höger', rikt: 1, bada: 1 },
  haller:    { namn: 'håller fram', rikt: -1, bada: 1, armar: [25, 0] },
  nar:       { namn: 'sträcker sig efter', rikt: 1, bada: 1, armar: [0, 55], luta: 1, boj: 2.5, strack: 0.03, upp: 0.4, oron: [-4, -4] },
  upp:       { namn: 'tittar upp', upp: 1, strack: 0.02, oron: [-4, -4] },
  ner:       { namn: 'tittar ner', upp: -1, strack: -0.02, oron: [6, 6] },
  pekar:     { namn: 'pekar', armar: [0, 32], luta: 1, boj: 2.5 },
  hurra:     { namn: 'hurra', armar: [70, 70], strack: 0.03, oron: [-6, -6] },
  magen:     { namn: 'händer på magen', armar: [-95, -95], fram: [1, 1], klapp: 40 },   // händerna vid magens kanter (korta armar)
  blyg:      { namn: 'blyg', armar: [-25, -25], bred: -0.03, strack: -0.03, luta: -1.5, boj: -3.5, upp: -0.4, oron: [8, 4] },
  sitter:    { namn: 'sitter', ben: [40, 40], benY: [-40, -40], sank: 48, bred: 0.03, armar: [6, 6] },
  strack:    { namn: 'sträcker på sig', strack: 0.04, sank: -6, benS: [0.06, 0.06], armar: [30, 30], oron: [-5, -5] },
  huka:      { namn: 'hukar (före hopp)', strack: -0.08, bred: 0.05, ben: [6, 6], armar: [-10, -10], oron: [6, 6] },
  stampar:   { namn: 'stampar', ben: [0, 8], benY: [0, -16], luta: -2 },
  lyssnar:   { namn: 'lyssnar', luta: 2, boj: 5.5, oron: [-6, 14] },
  // stolt: bröstet ut och hakan upp (ansiktet och blicken lite uppåt), armarna lite ut
  stolt:     { namn: 'stolt', strack: 0.05, bred: 0.02, upp: 0.55, sank: -4, armar: [8, 8], oron: [-4, -4] },
  // sover (som Ludde v2, vald 2026-11-07): ligger på magen med tassarna under hakan, svansen rullad upp bakom
  liggMage:  { namn: 'ligger på magen', strack: -0.3, bred: 0.18, sank: 30, upp: -0.9,
               armar: [-160, -160], fram: [1, 1], klapp: 55, ben: [85, 85], benY: [-70, -70], oron: [10, 10], svans: 10 },
};
// ponytail: armar och ben byter lager (bakom/framför kroppen) vid fram 0,5. Ett hopp i lagren, men armen är gömd bakom kroppen just då.

// Blanda två uttryck eller två poser (namn eller parameterobjekt), k 0 = a, 1 = b.
const blanda = blandare(NEUTRAL, UTTRYCK), blandaPose = blandare(POSE0, POSER), param = u => fyll(NEUTRAL, UTTRYCK, u);

function figur(x, y, skala) {                 // en leopard med fötterna i (x, y)
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g'), id = document.querySelectorAll('#figurer > g').length;
  const del = (n, fil = n) => `<image class="${n}" href="cut-tunn/lova-${fil}.png" width="1024" height="1024"/>`;
  g.setAttribute('transform', `translate(${x} ${y}) scale(${skala}) translate(-512 ${-FOTTER})`);
  // arm-l2/arm-r2: kopior av armarna för riktningsposen (båda armarna ut på samma sida, den ena under den andra).
  g.innerHTML = `<ellipse class="skugga" cx="512" cy="${FOTTER - 30}" rx="300" ry="34" fill="#000" opacity="0.1"/>
    <g class="figuren">${['ear-l', 'ear-r', 'tail', 'leg-l', 'leg-r'].map(n => del(n)).join('')}
    ${del('arm-l2', 'arm-l')}${del('arm-r2', 'arm-r')}${del('arm-l')}${del('arm-r')}
    <g class="kropp"><image href="cut-tunn/lova-body-tom.png" width="1024" height="1024"/>
    <image class="mage" href="cut-tunn/lova-mage.png" width="1024" height="1024"/>
    <g class="drag"><image href="cut-tunn/lova-nos.png" width="1024" height="1024"/><path class="nasa" d="M512 439 C530 439 543 441 543 449 C543 458 524 471 512 471 C500 471 481 458 481 449 C481 441 494 439 512 439 Z" fill="#5d3e34"/>
    ${KINDER.map(([x, y]) => `<ellipse class="kind" cx="${x}" cy="${y}" rx="29" ry="18" fill="${KIND}"/>`).join('')}
    ${OGON.map((_, i) => `<g class="oga">
      <clipPath id="lock-${id}-${i}"><path class="lockklipp" d="M-40 -26 H40 V60 H-40Z"/></clipPath>
      <g clip-path="url(#lock-${id}-${i})"><ellipse rx="17.5" ry="26" fill="${LINJE}"/><circle class="glans" cx="-6" cy="-10" r="6" fill="#fff"/>
        <g class="glans-k" opacity="0"><circle cx="-5.3" cy="-9.9" r="7" fill="#fff"/><circle cx="5.6" cy="9.4" r="2.5" fill="#fff"/></g></g>
      <path class="lock" fill="none" stroke="${LINJE}" stroke-width="6" stroke-linecap="round"/></g>
      <path class="glad" d="M-20 6 Q0 -18 20 6" fill="none" stroke="${LINJE}" stroke-width="7" stroke-linecap="round"/>
      <path class="sov" d="M-19 -2 Q0 14 19 -2" fill="none" stroke="${LINJE}" stroke-width="6" stroke-linecap="round"/>
      <path class="bryn" d="M-16 3 Q0 -6 16 3" fill="none" stroke="${LINJE}" stroke-width="6" stroke-linecap="round"/>`).join('')}
    <g class="munnen"><path class="mun" fill="${MUNFARG}"/>${tandmun(id, '#a33b45')}
    <g fill="none" stroke="${MUNLINJE}" stroke-width="5" stroke-linecap="round"><path class="nos"/><path class="le"/></g></g>
    </g></g>${del('leg-l')}${del('leg-r')}${del('arm-l', 'arm-l-fram')}${del('arm-r', 'arm-r-fram')}${del('arm-l', 'arm-l-klapp')}${del('arm-r', 'arm-r-klapp')}
    <g class="gnista">${[0, 1, 2, 3].map(() => `<path fill="none" stroke="#fff" stroke-width="20" stroke-linecap="round"/><path fill="none"
      stroke="#7a4a32" stroke-width="9" stroke-linecap="round"/>`).join('')}</g></g>
    <g class="sovbild" opacity="0"><image href="cut-tunn/lova-sover.png" width="1024" height="1024" y="${FOTTER - SOV.botten}"/></g>
    <g class="zzz">${[0, 1, 2].map(() => `<g class="z" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-22 -22 H22 L-22 22 H22" stroke="#fff" stroke-width="21"/>
      <path d="M-22 -22 H22 L-22 22 H22" stroke="#7a4a32" stroke-width="9"/></g>`).join('')}</g>`;
  // Armarna framför kroppen (gången, klappen, magen) är lova-arm-*-fram.png: roten saknar vit kant och smälter in i
  // kroppens krita (armarna är ritade av samma kritbit), annars ser armen ut att sväva framför magen.
  document.getElementById('figurer').appendChild(g);
  return g;
}

function rita(fig, f, p = POSE0) {
  const q = s => fig.querySelector(s), alla = s => [...fig.querySelectorAll(s)];
  const r = Math.max(-1, Math.min(1, p.rikt + (fig.riktning || 0))), a = Math.abs(r), sida = Math.sign(r);   // −1 vänster, 1 höger
  const u = p.upp, sx = 1 + p.bred, sy = f.strack + p.strack, sank = p.sank;
  // Kroppen sträcks från fötterna och breddas kring mitten, så öron och armar flyttas med.
  const lyft = y => -(sy - 1) * (FOTTER - y) + sank;
  const del = (n, grader, dx, dy, skala = [1, 1]) => { const [x, y] = RIGG[n.replace('2', '')];
    const t = `translate(${(sx - 1) * (x - 512) + dx} ${dy}) rotate(${grader} ${x} ${y}) translate(${x} ${y}) scale(${skala[0]} ${skala[1]}) translate(${-x} ${-y})`;
    alla('.' + n).forEach(e => e.setAttribute('transform', t)); };
  q('.figuren').setAttribute('transform', `translate(${p.x} ${p.lyft}) rotate(${f.luta + p.luta + 2 * r} 512 ${FOTTER})`);
  // Sovbilden (övergång C): riggen göms och den ritade sovbilden visas, med samma lyft (hoppet) och sin egen skala (landning, andning).
  const sb = p.sovbild > 0.5;
  q('.figuren').setAttribute('opacity', sb ? 0 : 1); q('.sovbild').setAttribute('opacity', sb ? 1 : 0);
  q('.sovbild').setAttribute('transform', `translate(${p.x} ${p.lyft}) translate(${SOV.cx} ${FOTTER}) scale(${SOV.skala * p.sovS[0]} ${SOV.skala * p.sovS[1]}) translate(${-SOV.cx} ${-FOTTER})`);
  // zzz: tre z (vit kant via paint-order) flyter upp och tonar, 0,7 s isär, medan hon sover
  alla('.z').forEach((z, j) => { const T = p.zt - j * 0.7, u = ((T % 2.1) + 2.1) % 2.1 / 2.1;
