<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blå dinon premium – uttryck och poser</title>
<style>
  body { margin:0; background:#222; display:grid; place-items:center; min-height:100vh; }
  svg { width:min(100vw, 1280px); height:auto; display:block; }
  text { font-family: Fredoka, "Arial Rounded MT Bold", system-ui, sans-serif; fill:#5a3b2e; text-anchor:middle; }
</style>
</head>
<body>
<!-- Blå dinons uttryck i kod (gjort som Pims), över det ansiktslösa v2-urklippet. Ögonen med glans, kinder och mun ritas i kod.
     Magfläcken (dinon-bla-mage.png) är en egen bild som följer ansiktet till 40 %. Kammen (klassen ear-l) sitter framför kroppen
     och vrids kring sin rot på hjässan. Ett ark med alla uttryck, ?prov=borsta&zoom=… (borstasångens provbild), eller
     ?bara=<namn> för ett stort som går neutral → uttryck → neutral. I avsnitt: window.ansikte(namn, k) med k 0–1 från neutral. -->
<svg viewBox="0 0 1920 1080">
  <defs>
    <filter id="boil" filterUnits="userSpaceOnUse" x="-100" y="-100" width="2120" height="1280">
      <feTurbulence id="brus" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
      <feDisplacementMap in="SourceGraphic" scale="5"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="#f6efe3"/>
  <g id="kamera"><g id="scen"></g><g id="figurer" filter="url(#boil)"></g><g id="forgrund"></g></g>
  <g id="etiketter"></g>
</svg>
<script src="../../../../verktyg/blinka.js"></script>
<script src="../../../../verktyg/rigg-motor.js"></script>
<script>
// Vridpunkter ur dinon-bla-rigg.json (skript/bla_delar.py). Kammen (ear-l) är konstens mörkblå krita, ligger framför kroppen
// och vrids kring roten på hjässan; den har ingen vit kant där den ligger över kroppen. Svansen är konstens mörkblå krita med
// lång rundad rot (80 px in under kroppen) och benen konstens ben med lång rot i egen färg. Armarna är ritade (som Pims):
// runda stumpar i ett stycke i kroppens blå krita, vridpunkten 12 px innanför kroppens kant.
// Armar flyger inte (art-direction-v2): mellan vila och uppe (GOM.fran–GOM.till grader) glider armen in bakom kroppen
// (GOM.in px) och vrids där, gömd. Uppe (från UT.fran, fullt vid UT.till) glider den ut 36 px och upp 20 px, och roten
// stannar ändå inne i kroppens kant. Så syns en arm bara i vila (under ca 26°) eller uppe (över ca 80°), aldrig på väg.
const GOM = { fran: 26, till: 80, ramp: 12, in: 110 }, UT = { fran: 68, till: 90, ut: 36, upp: 20 };
const RIGG = { 'arm-l': [275, 580], 'arm-r': [712, 580], 'leg-l': [428, 809], 'leg-r': [578, 800], 'ear-l': [499, 263], 'tail': [649, 797] };
// Uppmätt ur original/dinon-bla-1.jpeg mot dinon-bla-faceless.jpg (ansikte_matt.py): ögon (409, 405) och (567, 405) rx 19 ry 26,
// kinder (379, 454) och (598, 453) rx 28 ry 16, munnen ett litet U kring (488, 453), 58 px brett. Ansiktets mitt CX = 488 (ägget lutar
// lite, kroppens mitt är 494). Magfläcken 370–613 × 539–772. Kroppen 219–821, fötterna till 918: figuren 700 px hög utan kammen.
// Den öppna munnen sitter MY px under uttryckens tal (de är skrivna för en mun på y 462).
const OGON = [[409, 405], [567, 405]], OGONR = [19, 26], KINDER = [[379, 454], [598, 453]], KINDR = [28, 16], FOTTER = 922, MY = -8, CX = 488;
const LE = [488, 446, 29, 18];             // leendet: mitt x, ändarnas y, halv bredd, djup
// Uttrycket kawaii (som Pims): ögon 1,4 × 1,5, lite längre isär och lägre; kinderna 10 px lägre och 8 px längre ut.
const KAWAII = { ogon: [[396, 420], [580, 420]], skala: [1.4, 1.5], kinder: [[371, 472], [606, 471]] };
// Kinderna rosa som i konsten, ögonen nästan svarta med vit glans, leendet mörkblått, den öppna munnen mörkröd.
const LINJE = '#2a1d1a', MUNLINJE = '#2f4a6b', MUNFARG = '#7a2a1c', KIND = '#f3a0b4';

// Alla uttryck har samma parametrar, så att de går att blanda. Det som inte anges är neutralt.
// ogonS [sx, sy] ögonens storlek · titt [x, y] blickriktning · ogonY ögon och bryn upp (−) / ner (+)
// glad [v, h] öga → ^-båge (0–1) · sov öga → sluten u-båge (0–1, som Luddes) · kawaii stora glittriga ögon (0–1, se KAWAII) · lock [v, h] ögonlock ner (0–1) · bryn synlighet · brynY [v, h] höjd · brynV inre änden upp (grader)
// kind kindernas styrka · le leendet 1 … −1 (lite surt) · leBred bredd · leX munnen åt sidan · streck munlinjernas synlighet
// mun [rx, ry, d, cy] öppen mun (d 0 = rund, 1 = platt överkant) · oron [v, h] kammen hänger (+) / reser sig (−) i grader (första talet; dinon har ingen andra)
// armar [v, h] armarna upp (+) / ner (−) i grader, vila 8 · luta hela figuren i grader · strack kroppen sträcks (+) / sjunker (−)
const NEUTRAL = { ogonS: [1, 1], titt: [0, 0], ogonY: 0, glad: [0, 0], lock: [0, 0], bryn: 0, brynY: [0, 0], brynV: 0,
  kind: 0.75, le: 1, leBred: 1, leX: 0, streck: 1, mun: [0, 0, 0, 462], oron: [0, 0], armar: [8, 8], luta: 0, strack: 1, sov: 0, kawaii: 0,
  glimt: 0, tand: 0, tunga: 0, tandNere: 1, tander: [1, 1, 1, 1, 1, 1, 1, 1] };   // tandmunnen (030), se verktyg/rigg-motor.js

const UTTRYCK = {
  neutral:   { namn: 'neutral' },
  glad:      { namn: 'glad', kind: 1, le: 1.3, leBred: 1.15, ogonY: -2, oron: [-4, -4], armar: [16, 16] },
  jatteglad: { namn: 'jätteglad', glad: [1, 1], kind: 1, streck: 0, mun: [22, 20, 1, 456], oron: [-8, -8], armar: [20, 20], strack: 1.03 },
  forvanad:  { namn: 'förvånad', ogonS: [1.2, 1.16], bryn: 1, brynY: [-12, -12], kind: 0.6, streck: 0, mun: [9, 11, 0, 466],
               oron: [-9, -9], armar: [22, 22], strack: 1.04 },
  nyfiken:   { namn: 'nyfiken', titt: [11, -2], bryn: 0.9, brynY: [0, -8], le: 0.6, leBred: 0.8, leX: 4, oron: [-2, 10], luta: 5 },
  tanker:    { namn: 'tänker', titt: [-7, -12], bryn: 0.9, brynY: [-9, 0], le: 0.4, leBred: 0.55, leX: 10, oron: [6, -2], luta: -3 },
  ledsen:    { namn: 'lite ledsen', titt: [0, 6], ogonS: [1.05, 1.05], lock: [0.08, 0.08], bryn: 1, brynY: [-4, -4], brynV: 30,
               kind: 0.55, le: -0.65, leBred: 0.6, oron: [28, 28], armar: [-6, -6], luta: 2, strack: 0.97 },
  // arg: sur och bestämd, inte läskig (små barn): brynen ner mot nosen, lite sänkta lock, munnen neråt, röda kinder, öronen bakåt
  arg:       { namn: 'arg', titt: [0, 2], lock: [0.22, 0.22], bryn: 1, brynY: [9, 9], brynV: -22, kind: 1, le: -0.9, leBred: 0.7,
               oron: [10, 10], armar: [-6, -6], strack: 0.98 },
  somnig:    { namn: 'sömnig', titt: [0, 3], lock: [0.66, 0.66], kind: 0.7, streck: 0, mun: [10, 13, 0, 468],
               oron: [16, 16], armar: [2, 2], luta: 3, strack: 0.97 },
  fnissig:   { namn: 'fnissig', glad: [1, 1], kind: 1, streck: 0, mun: [10, 9, 1, 456], leX: 3, oron: [-4, 8], armar: [24, 24], luta: 4, strack: 0.98 },
  blinkar:   { namn: 'blinkar', glad: [0, 1], kind: 1, le: 1.3, leBred: 1.1, leX: 5, oron: [0, -6], armar: [8, 22], luta: -3 },
  kawaii:    { namn: 'kawaii', kawaii: 1, kind: 1, le: 1.2, leBred: 0.9, oron: [-4, -4], armar: [16, 16], strack: 1.02 },
  // sover (som Luddes v2): ögonen är slutna u-bågar (inte locket, då syns en bit av pupillen under), en liten nöjd mun
  sover:     { namn: 'sover', sov: 1, ogonY: 4, kind: 0.85, le: 0.5, leBred: 0.7, oron: [10, 10], armar: [0, 0], strack: 0.97 },
  stolt:     { namn: 'stolt', glad: [1, 1], ogonY: -8, kind: 1, le: 1.2, leBred: 1.1, oron: [-6, -6], armar: [-8, -8], strack: 1.04 },
  // Borstasången: gapet och det breda tandleendet, samma storlek mot ansiktet som de andras (pandans 136 px på 182 px mellan
  // ögonen, här 118 px på 158 px). Under leendet, mellan kinderna och ovanför magfläcken. Glatt gap: platt överkant och rund botten.
  gapar:     { namn: 'gapar', titt: [0, -2], kind: 1, streck: 0,
               mun: [59, 50, 0.55, 470], tand: 1, tunga: 1, oron: [-3, -3], strack: 1.02 },
  flinar:    { namn: 'visar tänderna', glad: [1, 1], kind: 1, streck: 0, mun: [56, 29, 1, 456], tand: 1, tandNere: 0, tunga: 1, oron: [-5, -5],
               armar: [20, 20], strack: 1.03 },
};
// fnissig har ingen hand för munnen, armarna når inte dit. Axlarna dras upp i stället.

// Poser: kropp, armar, ben och öron. De läggs ovanpå uttrycket, så pose('hurra') + ansikte('jatteglad') går ihop.
// luta hela figuren (grader, kring fötterna) · rikt −1 … 1 riktningspose åt vänster/höger (ansiktet glider dit, öronen lutar,
// båda armarna ut på den sidan, se rita) · upp −1 … 1 tittar upp/ner (ansiktet flyttas) · bred kroppens bredd (+/−) · strack kroppens
// höjd (+/−) · sank kroppen ner (+) / upp (−) i px · armar [v, h] upp (+) i grader, läggs till uttryckets · fram [v, h] armen
// framför kroppen (0/1) · benFram benen framför kroppen (0/1) · oron [v, h] hänger (+) i grader · ben [v, h] utåt (+) i grader · benY [v, h] foten upp (−) i px · benS [v, h] benet längre (+)
// lyft hela figuren upp (−) i px, skuggan krymper · svans svansens vinkel i grader · x hela figuren åt sidan i px
// boj kroppen böjer sig från fötterna i grader (+ åt höger): huvudet lutar sig dit, fötterna står kvar platt (luta vrider hela figuren)
// bada 0–1: båda armarna ut på riktningens sida (riktningsposerna, håller, når); utan den vänder rikt bara ansiktet, magen och öronen
const POSE0 = { luta: 0, rikt: 0, upp: 0, bred: 0, strack: 0, sank: 0, armar: [0, 0], fram: [0, 0], oron: [0, 0],
  benFram: 0, ben: [0, 0], benY: [0, 0], benS: [0, 0], lyft: 0, svans: 0, x: 0, klapp: 0, gang: 0, sving: 0, armY: 0, hand: 0, gnista: 0, skak: [0, 0], nick: [0, 0], boj: 0, bada: 0,
  borste: 0, borstV: 0, borstX: -1, borstY: 0, borstNer: 0, skum: 0 };
// borste 0–1 tandborsten i vänstra handen (bildens vänster) · borstV borstens vinkel, vickar · borstX −1 … 1 borsthuvudet över munnens
// bredd (−1 = mungipan) · borstY −1 övre raden … 1 nedre · borstNer px borsten och handen sänkta · skum 0–1 (verktyg/rigg-motor.js)
const POSER = {
  neutral:   { namn: 'neutral' },
  lutaV:     { namn: 'lutar vänster', luta: -1.5, boj: -4.5, oron: [-4, 4] },
  lutaH:     { namn: 'lutar höger', luta: 1.5, boj: 4.5, oron: [4, -4] },
  vanster:   { namn: 'riktning vänster', rikt: -1, bada: 1 },
  hoger:     { namn: 'riktning höger', rikt: 1, bada: 1 },
  haller:    { namn: 'håller fram', rikt: -1, bada: 1, armar: [25, 0] },
  nar:       { namn: 'sträcker sig efter', rikt: 1, bada: 1, armar: [0, 92], luta: 1, boj: 2.5, strack: 0.03, upp: 0.4, oron: [-4, -4] },
  upp:       { namn: 'tittar upp', upp: 1, strack: 0.02, oron: [-4, -4] },
  ner:       { namn: 'tittar ner', upp: -1, strack: -0.02, oron: [6, 6] },
  pekar:     { namn: 'pekar', armar: [0, 16], luta: 1, boj: 2.5 },
  hurra:     { namn: 'hurra', armar: [80, 80], strack: 0.03, oron: [-6, -6] },   // + jätteglad 20 = 100°: uppe, utanför kroppen (UT)
  magen:     { namn: 'händer på magen', armar: [-72, -72], fram: [1, 1], klapp: 40 },   // händerna vid magens kanter (korta armar)
  blyg:      { namn: 'blyg', armar: [-25, -25], bred: -0.03, strack: -0.03, luta: -1.5, boj: -3.5, upp: -0.4, oron: [8, 4] },
  sitter:    { namn: 'sitter', ben: [40, 40], benY: [-40, -40], sank: 48, bred: 0.03, armar: [6, 6] },
  strack:    { namn: 'sträcker på sig', strack: 0.04, sank: -6, benS: [0.06, 0.06], armar: [95, 95], oron: [-5, -5] },
  huka:      { namn: 'hukar (före hopp)', strack: -0.08, bred: 0.05, ben: [6, 6], armar: [-10, -10], oron: [6, 6] },
  stampar:   { namn: 'stampar', ben: [0, 8], benY: [0, -16], luta: -2 },
  lyssnar:   { namn: 'lyssnar', luta: 2, boj: 5.5, oron: [-6, 14] },
  // 030: borsten leds av munnen (borstX, borstY) och vänstra armen följer i ett stycke: hela armen syns
  // (-fram-kopian) och står rakt upp framför kroppen (−228 + vilans 8 = −220 från vilovinkeln 130°) med handen i borstens
  // grepp och den runda roten innanför kroppens kant. Rörelsen: ROR.borsta / borstDel (verktyg/rigg-motor.js).
  borstar:   { namn: 'borstar tänderna', armar: [-228, 0], fram: [1, 0], borste: 1 },
};
// Armar och ben byter lager (bakom/framför kroppen) vid fram 0,5. Ett hopp i lagren, men armen är gömd bakom kroppen just då.

// Blanda två uttryck eller två poser (namn eller parameterobjekt), k 0 = a, 1 = b.
const blanda = blandare(NEUTRAL, UTTRYCK), blandaPose = blandare(POSE0, POSER), param = u => fyll(NEUTRAL, UTTRYCK, u);

// Tandborsten: armens vilovinkel och längd (klapparm.py) och borstens lutning (grader, snett upp mot munnen).
const BORSTE = '../../../rekvisita/tandborsten/cut/tandborsten.png', BORSTARM = { axel: 130, L: 121, lut: -20 };

function figur(x, y, skala) {                 // en dino med fötterna i (x, y)
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g'), id = document.querySelectorAll('#figurer > g').length;
  const del = (n, fil = n) => `<image class="${n}" href="cut/dinon-bla-${fil}.png" width="1024" height="1024"/>`;
  g.setAttribute('transform', `translate(${x} ${y}) scale(${skala}) translate(-512 ${-FOTTER})`);
  // arm-l2/arm-r2: kopior av armarna för riktningsposen (båda armarna ut på samma sida, den ena under den andra).
  g.innerHTML = `<ellipse class="skugga" cx="512" cy="${FOTTER - 18}" rx="300" ry="34" fill="#000" opacity="0.1"/>
    <g class="figuren">${['tail', 'leg-l', 'leg-r'].map(n => del(n)).join('')}
    ${del('arm-l2', 'arm-l')}${del('arm-r2', 'arm-r')}${del('arm-l')}${del('arm-r')}
    <g class="kropp"><image href="cut/dinon-bla-body-tom.png" width="1024" height="1024"/>
    <image class="mage" href="cut/dinon-bla-mage.png" width="1024" height="1024"/>
    <g><g class="drag">
    ${KINDER.map(([x, y]) => `<ellipse class="kind" cx="${x}" cy="${y}" rx="${KINDR[0]}" ry="${KINDR[1]}" fill="${KIND}"/>`).join('')}
    ${OGON.map((_, i) => `<g class="oga">
      <clipPath id="lock-${id}-${i}"><path class="lockklipp" d="M-40 -26 H40 V60 H-40Z"/></clipPath>
      <g clip-path="url(#lock-${id}-${i})"><ellipse rx="${OGONR[0]}" ry="${OGONR[1]}" fill="${LINJE}"/><circle class="glans" cx="-6" cy="-10" r="6" fill="#fff"/>
        <g class="glans-k" opacity="0"><circle cx="-5.3" cy="-9.9" r="7" fill="#fff"/><circle cx="5.6" cy="9.4" r="2.5" fill="#fff"/></g></g>
      <path class="lock" fill="none" stroke="${LINJE}" stroke-width="6" stroke-linecap="round"/></g>
      <path class="glad" d="M-20 6 Q0 -18 20 6" fill="none" stroke="${LINJE}" stroke-width="7" stroke-linecap="round"/>
      <path class="sov" d="M-19 -2 Q0 14 19 -2" fill="none" stroke="${LINJE}" stroke-width="6" stroke-linecap="round"/>
      <path class="bryn" d="M-16 3 Q0 -6 16 3" fill="none" stroke="${LINJE}" stroke-width="6" stroke-linecap="round"/>`).join('')}
    <g class="munnen"><path class="mun" fill="${MUNFARG}"/>${tandmun(id, '#b8545e', { spetsiga: [1, 2] })}
    <g fill="none" stroke="${MUNLINJE}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path class="le"/></g></g>
    </g></g></g>${del('ear-l')}${borsteBild(BORSTE)}${del('leg-l')}${del('leg-r')}${del('arm-l', 'arm-l-fram')}${del('arm-r', 'arm-r-fram')}${del('arm-l', 'arm-l-klapp')}${del('arm-r', 'arm-r-klapp')}
    <g class="gnista">${[0, 1, 2, 3].map(() => `<path fill="none" stroke="#fff" stroke-width="20" stroke-linecap="round"/><path fill="none"
      stroke="#2f5f96" stroke-width="9" stroke-linecap="round"/>`).join('')}</g></g>`;
  // Armarna framför kroppen (gången, klappen, magen) är -fram-kopiorna (vita kanten tonad mot roten) och -klapp-kopiorna
  // (bara handen syns, lite mörkare så att den syns mot kroppens blå).
  document.getElementById('figurer').appendChild(g);
  return g;
}

function rita(fig, f, p = POSE0) {
  const q = s => fig.querySelector(s), alla = s => [...fig.querySelectorAll(s)];
  const r = Math.max(-1, Math.min(1, p.rikt + (fig.riktning || 0))), a = Math.abs(r), sida = Math.sign(r);   // −1 vänster, 1 höger
  const u = p.upp, sx = 1 + p.bred, sy = f.strack + p.strack, sank = p.sank;
  // Kroppen sträcks från fötterna och breddas kring mitten, så öron och armar flyttas med.
  const lyft = y => -(sy - 1) * (FOTTER - y) + sank;
  // Borsten leds av munnen: borsthuvudets plats (mal) och handens (grepp) i figurens ruta, med ansiktets glidning och kroppens sträckning.
  const bm = borstMal(p, LE[0] + f.leX, [f.mun[0], f.mun[1], f.mun[2], f.mun[3] + MY]), mal = [512 + sx * (bm[0] + 36 * r - 512), FOTTER + sy * (bm[1] + 4 * a - 10 * u - FOTTER) + sank];
  const grepp = borstGrepp(mal, BORSTARM.lut);
  const del = (n, grader, dx, dy, skala = [1, 1]) => { const [x, y] = RIGG[n.replace('2', '')];
    const t = `translate(${(sx - 1) * (x - 512) + dx} ${dy}) rotate(${grader} ${x} ${y}) translate(${x} ${y}) scale(${skala[0]} ${skala[1]}) translate(${-x} ${-y})`;
    alla('.' + n).forEach(e => e.setAttribute('transform', t)); };
  q('.figuren').setAttribute('transform', `translate(${p.x} ${p.lyft}) rotate(${f.luta + p.luta + 2 * r} 512 ${FOTTER})`);
  const hojd = Math.min(1, -p.lyft / 220);
  q('.skugga').setAttribute('rx', 300 * (1 - 0.4 * hojd)); q('.skugga').setAttribute('cx', 512 + p.x); q('.skugga').setAttribute('opacity', 0.1 * (1 - 0.3 * hojd));
  q('.kropp').setAttribute('transform', `translate(0 ${sank}) translate(512 ${FOTTER}) scale(${sx} ${sy}) translate(-512 ${-FOTTER})`);

  // Riktningsposen (som i bil-test.html): kroppen framifrån, ansiktet glider ~36 px åt sidan, smalnar och lutar,
  // öronen lutar dit, och båda armarna kommer ut på den sidan: den närmre lite högre, kopian 85 px under.
  // Den bortre armen glider in bakom kroppen (vriden skulle dess rot sticka ut på andra sidan) och kopian glider ut
  // bakom kroppen på den närmre sidan: armarna åker in och ut, de tonar aldrig.
  // Kammen (ear-l) sitter på hjässan, framför kroppen: vrids kring roten (oron + = hänger åt höger, dit den böjer sig), följer
  // ansiktet 18 px åt sidan i riktningsposen och lutar lite dit. Den rör sig lite och släpar mjukt (±8° i hoppet).
  const nara = n => (n === 'l') === (sida < 0), aa = armSida(fig, p, a);   // aa: så mycket armarna följer riktningen (verktyg/rigg-motor.js)
  del('ear-l', f.oron[0] + p.oron[0] + 6 * r, 18 * r, lyft(RIGG['ear-l'][1]) + 4 * a - 6 * u);
  ['l', 'r'].forEach((n, i) => { const s = i ? -1 : 1, A = f.armar[i] + p.armar[i], vinkel = s * A;
    const sm = x => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); }, bak = 1 - p.fram[i];
    const gom = bak * sm((A - GOM.fran) / GOM.ramp) * sm((GOM.till - A) / GOM.ramp), ut = bak * sm((A - UT.fran) / (UT.till - UT.fran));
    let y0 = lyft(RIGG['arm-' + n][1]) + 20 * p.fram[i] + p.armY - UT.upp * ut;
    let dx = s * (p.klapp || 70 * p.fram[i]) + s * GOM.in * gom - s * UT.ut * ut;
    if (!i && p.borste) [dx, y0] = borstArm(p, grepp, BORSTARM, vinkel, RIGG['arm-l'], sx, dx, y0);   // borstarmen följer borsten    // framför kroppen: händerna in på magen (eller ihop, klapp)
    if (p.gang > 0) {     // gången (som förebilden): bakre armen framför kroppen ut över kanten, främre armen tittar fram, de pendlar i otakt
      const sd = sida || 1, bak = (n === 'l') === (sd > 0), g = p.gang;
      const [tv, tdx, tdy] = bak ? [sd * (-18 + 14 * p.sving), sd * 55, 20] : [sd * (-10 - 14 * p.sving), -sd * 60, 10];
      del('arm-' + n, mix(vinkel, tv, g), mix(dx, tdx, g), y0 + tdy * g);
      alla('.arm-' + n).forEach((e, j) => e.setAttribute('opacity', (bak && g > 0.5 ? 1 : 0) === j ? 1 : 0));
      q('.arm-' + n + '2').setAttribute('opacity', 0); return; }
    const IN = 200;                                   // så långt in bakom kroppen en arm göms (figurens px)
    // Lyft arm (ut) i riktningsposen: inget extra lyft (roten stannar i kroppen), och kopian glider in bakom kroppen igen.
    const v2 = aa * (1 - ut);
    if (nara(n)) { del('arm-' + n, vinkel, dx, y0 - 45 * v2); del('arm-' + n + '2', vinkel - s * 16 * aa, dx + s * (10 * v2 + IN * (1 - v2)), y0 + 40 * v2); }
    else del('arm-' + n, vinkel, dx + s * IN * aa, y0);
    const syns = nara(n) || aa < 0.98 ? 1 : 0;
    // Armen framför kroppen (rot utan kant) först när den nästan är på plats, annars syns roten när den glider ut över kanten.
    const vis = p.fram[i] > 0.85 ? (p.hand > 0.5 ? 2 : 1) : 0;   // 0 bakom kroppen, 1 framför, 2 framför med bara handen (riktiga klappen)
    alla('.arm-' + n).forEach((e, j) => e.setAttribute('opacity', (vis === j ? 1 : 0) * syns));
    q('.arm-' + n + '2').setAttribute('opacity', nara(n) && aa > 0 ? 1 : 0); });
  // Klappgnistan: fyra korta kritstreck ut från händerna där de möts, i 0,25 s efter varje klapp (p.gnista 0–1, 0 = ingen).
  const g = p.gnista, gx = (RIGG['arm-l'][0] + RIGG['arm-r'][0]) / 2, gy = lyft(RIGG['arm-l'][1]) + RIGG['arm-l'][1] + 20 + p.armY - KLAPPNY.spets;
  alla('.gnista path').forEach((e, j) => { const v = [-172, -142, -38, -8][Math.floor(j / 2)] * Math.PI / 180;   // åt sidorna och uppåt, inte rakt upp i ansiktet
    const r0 = KLAPPNY.gnista[0] + 22 * g, r1 = r0 + KLAPPNY.gnista[1] * (0.5 + 0.5 * Math.sin(Math.PI * Math.min(1, 2 * g)));
    e.setAttribute('d', `M${gx + r0 * Math.cos(v)} ${gy + r0 * Math.sin(v)} L${gx + r1 * Math.cos(v)} ${gy + r1 * Math.sin(v)}`);
    e.setAttribute('opacity', g > 0 && g < 1 ? Math.min(1, 3 * Math.sin(Math.PI * g)) : 0); });
  const lager = (n, fram) => alla('.' + n).forEach((e, j) => e.setAttribute('opacity', (fram > 0.5) === (j === 1) ? 1 : 0));
  lager('leg-l', p.benFram); lager('leg-r', p.benFram);
  del('leg-l', p.ben[0], 0, sank + p.benY[0], [1, 1 + p.benS[0]]);
  del('leg-r', -p.ben[1], 0, sank + p.benY[1], [1, 1 + p.benS[1]]);
  del('tail', p.svans, 0, lyft(RIGG.tail[1]));

  // Hela ansiktet glider med riktningen och blicken, magfläcken följer till 40 %.
  const fx = 36 * r, fy = 4 * a - 10 * u;
  q('.mage').setAttribute('transform', `translate(${0.4 * fx} ${0.4 * fy})`);
  q('.drag').setAttribute('transform', `translate(${fx} ${fy}) rotate(${5 * r} ${CX} 430) translate(${CX} 430) scale(${1 - 0.08 * a} 1) translate(${-CX} -430)`);
  const K = Math.max(0, Math.min(1, f.kawaii)), OG = mix(OGON, KAWAII.ogon, K), OS = mix([1, 1], KAWAII.skala, K);
  const ogon = alla('.oga'), lock = alla('.lock'), klipp = alla('.lockklipp'), glad = alla('.glad'), sov = alla('.sov'), bryn = alla('.bryn');
  alla('.glans').forEach(e => e.setAttribute('opacity', 1 - K)); alla('.glans-k').forEach(e => e.setAttribute('opacity', K));
  alla('.kind').forEach((e, i) => { const [x, y] = mix(KINDER[i], KAWAII.kinder[i], K); e.setAttribute('cx', x); e.setAttribute('cy', y); });
  OG.forEach(([x, y], i) => {
    const dy = f.ogonY - 4 * u;               // ögonen följer blicken lite mer än resten av ansiktet
    // Öppet öga → ^-båge eller sluten båge: ögat kläms ihop (som en blinkning) och byts mot bågen vid 0,5, i stället för att
    // tonas mot den (halvgenomskinliga grå ögon, Sanna 2026-11-09). Ögat är alltid helt svart eller helt borta.
    const stang = Math.max(f.glad[i], f.sov), byt = stang >= 0.5, kram = 1 - 0.5 * Math.min(1, stang / 0.5);
    ogon[i].setAttribute('transform', `translate(${x + f.titt[0]} ${y + dy + f.titt[1]}) scale(${f.ogonS[0] * OS[0]} ${f.ogonS[1] * OS[1] * kram})`);
    ogon[i].setAttribute('opacity', byt ? 0 : 1);
    sov[i].setAttribute('transform', `translate(${x} ${y + dy}) scale(${1 + 0.3 * K} ${1 + 0.15 * K})`); sov[i].setAttribute('opacity', byt && f.sov >= f.glad[i] ? 1 : 0);   // kawaii: bredare båge
    // Locket: en böjd kant som både klipper ögat och ritas som linje, så att det inte blir hörn.
    const ly = -OGONR[1] + f.lock[i] * 40, w = (OGONR[0] - 1) * Math.sqrt(Math.max(0, 1 - (ly / 25) ** 2));
    klipp[i].setAttribute('d', `M-40 ${ly} H${-w} Q0 ${ly + 8} ${w} ${ly} H40 V60 H-40Z`);
    lock[i].setAttribute('d', `M${-w} ${ly} Q0 ${ly + 8} ${w} ${ly}`);
    lock[i].setAttribute('opacity', Math.min(1, f.lock[i] * 8));
    glad[i].setAttribute('transform', `translate(${x} ${y + dy}) scale(${1 + 0.25 * K})`);
    glad[i].setAttribute('opacity', byt && f.glad[i] > f.sov ? 1 : 0);
    const s = i ? 1 : -1;                     // inre änden upp: vänster bryn moturs, höger medurs
    // brynen följer ögat (som Milles): hela blicken i sidled, halva i höjdled, och lyfts när ögat är större
    const oy = f.ogonS[1] * OS[1];
    bryn[i].setAttribute('transform', `translate(${x + f.titt[0]} ${y + dy + 0.5 * f.titt[1] - 52 - 30 * (oy - 1) + f.brynY[i]}) rotate(${s * f.brynV})`);
    bryn[i].setAttribute('opacity', f.bryn);
  });
  alla('.kind').forEach(c => c.setAttribute('opacity', f.kind));

  // Munnen (uppmätt ur konsten): ett litet U, LE = [mitt x, ändarnas y, halv bredd, djup].
  const cx = LE[0] + f.leX, b = f.leBred, le = f.le, ey = LE[1] - 0.25 * LE[3] * le, ly = LE[1] + LE[3] * le;
  q('.le').setAttribute('d', `M${cx - LE[2] * b} ${ey} Q${cx} ${ly} ${cx + LE[2] * b} ${ey}`);
  q('.le').setAttribute('opacity', f.streck);
  const [rx, ry, d, my0] = f.mun, my = my0 + MY, h = ry * 4 / 3, topp = h * (1 - d);
  q('.mun').setAttribute('d', `M${cx - rx} ${my} C${cx - rx} ${my - topp} ${cx + rx} ${my - topp} ${cx + rx} ${my}
    C${cx + rx} ${my + h} ${cx - rx} ${my + h} ${cx - rx} ${my}Z`);
  tandmunRita(fig, f, cx, [rx, ry, d, my]);
  borsteRita(fig, p, grepp, mal);   // borsten: handen i greppet, huvudet i målet (stilla posen: mungipan, skymmer högst två tänder)
  huvud(fig, p);   // skakar på huvudet / nickar: skak och nick i posen (verktyg/rigg-motor.js)
}

const blinka = skapaBlinka(33);   // verktyg/blinka.js, eget frö per figur
// Kantklappen (?klapp=kant): stumparna klappar mot magens kanter. Vinkel v + dv·c (c = 0 vid klappen), in − din·c px in över magen.
const KLAPP = { v: -105, dv: 30, in: 50, din: 22, ner: 10 };
// Den riktiga klappen (som Pims): händerna möts mitt framför bröstet tre gånger, -klapp-kopiorna (bara handen syns).
// kontakt/oppen [vinkel, in px], y armarna upp (−) px, spets handens höjd över vridpunkten vid kontakten, gnista [avstånd, längd].
const KLAPPTYP = new URLSearchParams(location.search).get('klapp') === 'kant' ? 'kant' : 'ny';
const KLAPPNY = { kontakt: [-144, 105], oppen: [-126, 65], y: -45, spets: 31, gnista: [50, 22] };
// Figurens egna tal för rörelserna i verktyg/rigg-motor.js (det som inte står här är motorns standard).
// Kammen släpar lite i hoppet (±8°). Den långa svansen rör sig lugnt (±4° i gången och dansen) och släpar efter i höjdled:
// slap() lägger till ett litet eftersläp ur hur fort figuren rör sig upp eller ner (jämför med läget 0,1 s tidigare).
const RORELSE = { hopp: { ora: [8, 0.35] }, svansGang: 4, svansDans: 4, boj: true, blick: 33 };
const STD = rorelser(), slap = namn => t => { const [f, p] = STD[namn](t), [, q] = STD[namn](t - 0.1);
  return [f, { ...p, svans: p.svans + kl(-6, 6, (q.lyft - p.lyft) * 0.07) }]; };
const ROR = {
  ...kanslorRorelser(),
  ...STD,
  hoppa: slap('hoppa'), dansa: slap('dansa'),
  borsta,
};
Object.assign(window, { UTTRYCK, NEUTRAL, POSER, POSE0, blanda, blandaPose, ansikte, pose, riktning, rorelse, ROR, param });

// Arket med poser visar varje pose med ett uttryck som passar.
const PAR = { neutral: 'neutral', lutaV: 'glad', lutaH: 'nyfiken', vanster: 'glad', hoger: 'nyfiken', haller: 'glad', nar: 'nyfiken', upp: 'forvanad', ner: 'ledsen',
  pekar: 'nyfiken', hurra: 'jatteglad', magen: 'glad', blyg: 'fnissig', sitter: 'glad', strack: 'somnig', huka: 'glad',
  stampar: 'arg', lyssnar: 'nyfiken', borstar: 'gapar' };

const sok = new URLSearchParams(location.search), bara = sok.get('bara'), enPose = sok.get('pose');
const etikett = (x, y, s, storlek) => document.getElementById('etiketter').insertAdjacentHTML('beforeend',
  `<text x="${x}" y="${y}" font-size="${storlek}">${s}</text>`);
const medTander = u => u === 'gapar' || u === 'flinar' ? { ...param(u), tander: TANDMUN.prov } : u;   // arken visar två matta tänder
let render;
if (sok.get('prov') === 'borsta') { if (sok.get('lut')) BORSTARM.lut = +sok.get('lut'); render = provBorsta(sok.get('zoom'), sok.get('rorelse')); }   // 030: provbilden i badrummet (verktyg/rigg-motor.js)
else if ((bara && UTTRYCK[bara]) || (enPose && POSER[enPose])) {
  // ?bara=<uttryck> och/eller ?pose=<pose>: en stor dino som går neutral → uttryck/pose → neutral på 4 s.
  const fig = figur(960, 1000, 0.92), u = UTTRYCK[bara] ? bara : 'neutral', po = POSER[enPose] ? enPose : 'neutral';
  etikett(1500, 120, [POSER[po].namn, UTTRYCK[u].namn].filter(n => n !== 'neutral').join(' · ') || 'neutral', 56);
  render = t => { const T = t % 4, k = mjuk(T < 0.6 ? 0 : T < 1.2 ? (T - 0.6) / 0.6 : T < 2.8 ? 1 : T < 3.4 ? 1 - (T - 2.8) / 0.6 : 0);
    ansikte(medTander(u), k, fig); pose(po, k, fig); document.getElementById('brus').setAttribute('seed', Math.floor(t * 10) % 50 + 1); };
} else if (ROR[sok.get('rorelse')] || sok.get('rorelse') === 'alla') {
  // ?rorelse=klappa|hoppa|dansa: en stor dino. ?rorelse=alla: alla tre bredvid varandra.
  const namn = sok.get('rorelse') === 'alla' ? ['klappa', 'hoppa', 'dansa'] : [sok.get('rorelse')];
  const NAMN = { ledsen: 'ledsen och suckar', arg: 'sur och stampar', klappa: 'klappar händerna', hoppa: 'hoppar', dansa: 'dansar', ga: 'går', skaka: 'skakar på huvudet', nicka: 'nickar', sova: 'sover', ligga: 'ligger och sover', borsta: 'borstar tänderna' };
  const figs = namn.map((n, i) => { const x = namn.length > 1 ? 330 + 630 * i : 960;
    etikett(x, 1060, NAMN[n], 40); return figur(x, 1000, namn.length > 1 ? 0.62 : 0.75); });
  render = t => { namn.forEach((n, i) => rorelse(n, t, figs[i])); document.getElementById('brus').setAttribute('seed', Math.floor(t * 10) % 50 + 1); };
} else if (sok.get('film')) {
  // ?film=1: testfilm i v2-skogen (som rigg-test.html, zoom 2, kameran följer). Avsnitt efter varandra, 0,5 s mjuk övergång mellan dem.
  const S = '../../../stiltest-premium/', MARK = 915, Z = 2;
  document.getElementById('scen').innerHTML = `<image href="${S}skogen-monster-mild-a.png" width="1920" height="1080" preserveAspectRatio="xMidYMid slice"/>
    <image href="${S}cut/egen/trad.png" x="150" y="230" height="700" width="431"/>`;
  document.getElementById('forgrund').innerHTML = `<image href="${S}cut/egen/gras.png" x="500" y="790" height="180" width="202"/>
    <image href="${S}cut/egen/gras.png" x="-1420" y="790" height="180" width="202" transform="scale(-1 1)"/>`;
  const SK = 0.5, fig = figur(960, MARK, SK);
  // Svansen: lång, så den gungar lugnt (±3°) och viftar lite (±4°) i 0,6 s var 4,5:e sekund, mjukt in och ut.
  const svans = t => { const T = t % 4.5, k = kl(0, 1, (T - 3.6) / 0.6); return Math.sin(t * 2.2) * 3 + Math.sin(Math.PI * k) * Math.sin(k * 2 * Math.PI) * 4; };
  const { gang, vinka, stilla, ror } = filmHjalp({ svans: t => svans(t) });   // verktyg/rigg-motor.js
  const AVSNITT = [
    [3.2, gang(-2300, 0, 3.2)],
    [2.6, vinka(2.6)],
    [5, stilla('neutral', 'neutral')],   // står och väntar: ser sig om (vila i verktyg/rigg-motor.js)
    [2.2, stilla('nyfiken', 'lyssnar')],
    [2.4, tl => [blanda('nyfiken', 'kawaii', mjuk(kl(0, 1, (tl - 1.2) / 0.5))), { ...blandaPose('neutral', 'nar', 1), svans: svans(tl) }]],
    // hurra: armarna upp och ner igen inom avsnittet, så att de inte flyger genom luften in i klappen
    [3, tl => [blanda('tanker', 'jatteglad', mjuk(kl(0, 1, (tl - 1.4) / 0.3))),
      { ...blandaPose('neutral', 'hurra', mjuk(kl(0, 1, (tl - 1.4) / 0.3)) * mjuk(kl(0, 1, (3 - tl) / 0.5))), svans: svans(tl) }]],
    [3, ror('klappa')],
    [4.8, ror('hoppa')],
    [4, ror('dansa')],
    [2.4, vinka(2.4)],
    [3, gang(0, 2600, 3)],
  ];
  const LANGD = AVSNITT.reduce((s, [d]) => s + d, 0), lage = filmSekvens(AVSNITT, LANGD);
  window.LANGD = LANGD;
  render = t => { const [f, p] = lage(t); fig.ansikte = f; fig.pose = p; rita(fig, f, p);
    filmKamera(t, lage, p, SK, MARK, Z);
    document.getElementById('brus').setAttribute('seed', Math.floor(t * 10) % 50 + 1); };
} else if (sok.get('ark') === 'kawaii') {
  // ?ark=kawaii: neutral → kawaii (k 0, 0,5, 1).
  [0, 0.5, 1].forEach((k, i) => { const x = 400 + 560 * i, fig = figur(x, 820, 0.62); ansikte('kawaii', k, fig);
    etikett(x, 880, k ? `kawaii ${k}` : 'neutral', 36); });
  render = () => {};
} else if (sok.get('ark') === 'poser') {
  Object.keys(POSER).forEach((n, i) => {
    const x = 160 + 320 * (i % 6), y = 300 + 350 * Math.floor(i / 6), fig = figur(x, y, 0.3);
    ansikte(medTander(PAR[n]), 1, fig); pose(n, 1, fig);
    etikett(x, y + 42, POSER[n].namn, 26); etikett(x, y + 70, UTTRYCK[PAR[n]].namn, 20);
  });
  render = () => {};
} else {
  Object.keys(UTTRYCK).forEach((n, i) => {
    const x = 160 + 320 * (i % 6), y = 330 + 345 * Math.floor(i / 6);   // tre rader (15 uttryck)
    ansikte(medTander(n), 1, figur(x, y, 0.28)); etikett(x, y + 40, UTTRYCK[n].namn, 30);
  });
  etikett(1600, 1000, 'blå dinon', 48); etikett(1600, 1050, 'uttryck', 36);
  render = () => {};
}
window.render = render;
const start = performance.now();
// window.stilla = true stoppar loopen, så att render(t) kan anropas bild för bild.
(function loop() { if (!window.stilla) render((performance.now() - start) / 1000); requestAnimationFrame(loop); })();
</script>
