<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ulla premium – uttryck och poser</title>
<style>
  body { margin:0; background:#222; display:grid; place-items:center; min-height:100vh; }
  svg { width:min(100vw, 1280px); height:auto; display:block; }
  text { font-family: Fredoka, "Arial Rounded MT Bold", system-ui, sans-serif; fill:#5a3b2e; text-anchor:middle; }
</style>
</head>
<body>
<!-- Ullas uttryck i kod (gjort som Ruts och Elsas), över det ansiktslösa v2-urklippet. De krämvita ögonskivorna är en egen bild (ulla-nos.png) som följer ansiktet,
     magen (ulla-mage.png) följer 40 %. Näbben (två halvor, som Pips), ögon och kinder ritas i kod. Ett ark med alla uttryck, eller ?bara=<namn> för ett stort
     som går neutral → uttryck → neutral. I avsnitt: window.ansikte(namn, k) med k 0–1 från neutral. -->
<svg viewBox="0 0 1920 1080">
  <defs>
    <!-- Ögonskivorna går nära kroppens kant: ansiktet maskas med kroppens fyllning, så att de aldrig sticker ut
         över kanten när ansiktet glider åt sidan (riktningsposen). -->
    <mask id="ansiktsmask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024" style="mask-type:alpha">
      <image href="cut/ulla-kropp-mask.png" width="1024" height="1024"/></mask>
    <filter id="boil" filterUnits="userSpaceOnUse" x="-100" y="-100" width="2120" height="1280">
      <feTurbulence id="brus" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
      <feDisplacementMap in="SourceGraphic" scale="5"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="#f6efe3"/>
  <g id="kamera"><g id="scen"></g><g id="figurer" filter="url(#boil)"></g><g id="forgrund"></g></g>
  <g id="etiketter"></g>
</svg>
<script src="../../../../verktyg/blinka.js"></script>
<script src="../../../../verktyg/rigg-motor.js"></script>
<script>
// Vridpunkter ur ulla-rigg.json. Örontofsarna och benen är ur konsten med lång rot (langre_rot.py, 80 px in under kroppen i
// delens egen färg, rensade med skript/ulla_rensa.py) och vrids kring leden. Vingarna är armarna: ritade runda vingstumpar i ett
// stycke (skript/ulla_arm.py), vridpunkten 12 px innanför kroppens kant. Ugglan har ingen svans.
// Armar flyger inte (art-direction-v2): mellan vila och uppe (GOM.fran–GOM.till grader) glider armen in bakom kroppen
// (GOM.in px) och vrids där, gömd. Uppe (från UT.fran, fullt vid UT.till) glider den ut 36 px och upp 20 px, och roten
// stannar ändå inne i kroppens kant. Så syns en arm bara i vila (under ca 26°) eller uppe (över ca 80°), aldrig på väg.
const GOM = { fran: 26, till: 80, ramp: 12, in: 110 }, UT = { fran: 68, till: 90, ut: 36, upp: 20 };
const RIGG = { 'arm-l': [241, 570], 'arm-r': [776, 570], 'leg-l': [431, 838], 'leg-r': [602, 838],
               'ear-l': [335, 229], 'ear-r': [683, 229] };
// Uppmätt ur original/ulla-forsta-a.jpg (nedskalad till 1024) mot ulla-faceless.png (pixeljusterade): ögon (418, 402) och
// (601, 401) rx 17 ry 25, kinder (381, 448) och (638, 446) rx 27 ry 18, näbben 483–539 × 410–472 med spetsen i (511, 472).
// Ögonskivorna (ulla-nos.png) 310–709 × 293–499, magen (ulla-mage.png) 348–675 × 551–812. Kroppen 190–936: 746 px hög.
const OGON = [[418, 402], [601, 401]], KINDER = [[381, 448], [638, 446]], FOTTER = 940;
// Örontofsarna är små och spetsiga: de rör sig 60 % så mycket som de andras öron (ORA), annars ser de ut att flyga av.
const ORA = 0.6;
// Uttrycket kawaii (som Ruts, samma ögon): ögon 1,4 × 1,5, lite isär och lägre; kinderna 10 px lägre och 8 px längre ut.
const KAWAII = { ogon: [[399, 420], [620, 419]], skala: [1.4, 1.5], kinder: [[373, 458], [646, 456]] };
// Näbben (som Pips, ritad i kod efter konsten): en övre halva med rundad överkant och en undre halva med spetsen, gulorange
// med konstens mörkgula kontur och en liten ljus glans. Leendet är ett streck i skarven mellan halvorna. Öppen mun: den
// undre halvan glider ner över en mörk mun.
const NABB = '#feb944', NABBKANT = '#cc952f';
const NABB_UPP = 'M485 428 Q486 410 510 410 Q536 410 537 428 Q536 437 531 444 Q511 449 491 444 Q486 437 485 428Z';
const NABB_NER = 'M491 443 Q511 449 531 443 Q522 460 511 472 Q500 460 491 443Z';
// Kinderna rosa som i konsten, den öppna munnen mörkröd.
const LINJE = '#2a1d1a', MUNFARG = '#7a2a1c', KIND = '#f6abb0';

// Alla uttryck har samma parametrar, så att de går att blanda. Det som inte anges är neutralt.
// ogonS [sx, sy] ögonens storlek · titt [x, y] blickriktning · ogonY ögon och bryn upp (−) / ner (+)
// glad [v, h] öga → ^-båge (0–1) · sov öga → sluten u-båge (0–1, som Luddes) · kawaii stora glittriga ögon (0–1, se KAWAII) · lock [v, h] ögonlock ner (0–1) · bryn synlighet · brynY [v, h] höjd · brynV inre änden upp (grader)
// kind kindernas styrka · le leendet 1 … −1 (lite surt) · leBred bredd · leX munnen åt sidan · streck munlinjernas synlighet
// mun [rx, ry, d, cy] öppen näbb: ry hur långt den undre halvan glider ner, rx munnens bredd (d, cy används inte för ugglan) · oron [v, h] öronen hänger (+) / spetsas (−) i grader
// armar [v, h] armarna upp (+) / ner (−) i grader, vila 8 · luta hela figuren i grader · strack kroppen sträcks (+) / sjunker (−)
const NEUTRAL = { ogonS: [1, 1], titt: [0, 0], ogonY: 0, glad: [0, 0], lock: [0, 0], bryn: 0, brynY: [0, 0], brynV: 0,
  kind: 0.75, le: 1, leBred: 1, leX: 0, streck: 1, mun: [0, 0, 0, 462], oron: [0, 0], armar: [8, 8], luta: 0, strack: 1, sov: 0, kawaii: 0 };

const UTTRYCK = {
  neutral:   { namn: 'neutral' },
  glad:      { namn: 'glad', kind: 1, le: 1.3, leBred: 1.15, ogonY: -2, oron: [-4, -4], armar: [16, 16] },
  jatteglad: { namn: 'jätteglad', glad: [1, 1], kind: 1, streck: 0, mun: [22, 20, 1, 456], oron: [-8, -8], armar: [20, 20], strack: 1.03 },
  forvanad:  { namn: 'förvånad', ogonS: [1.2, 1.16], bryn: 1, brynY: [-12, -12], kind: 0.6, streck: 0, mun: [9, 11, 0, 466],
               oron: [-9, -9], armar: [22, 22], strack: 1.04 },
  nyfiken:   { namn: 'nyfiken', titt: [11, -2], bryn: 0.9, brynY: [0, -8], le: 0.6, leBred: 0.8, leX: 4, oron: [-2, 10], luta: 5 },
  tanker:    { namn: 'tänker', titt: [-7, -12], bryn: 0.9, brynY: [-9, 0], le: 0.4, leBred: 0.55, leX: 10, oron: [6, -2], luta: -3 },
  ledsen:    { namn: 'lite ledsen', titt: [0, 4], ogonS: [0.95, 0.95], bryn: 1, brynY: [4, 4], brynV: 24,
               kind: 0.55, le: -0.7, leBred: 0.75, oron: [24, 24], armar: [-4, -4], luta: 2, strack: 0.97 },
  // arg: sur och bestämd, inte läskig (små barn): brynen ner mot näbben, lite sänkta lock, munnen neråt, röda kinder, tofsarna bakåt
  arg:       { namn: 'arg', titt: [0, 2], lock: [0.22, 0.22], bryn: 1, brynY: [9, 9], brynV: -22, kind: 1, le: -0.9, leBred: 0.7,
               oron: [10, 10], armar: [-6, -6], strack: 0.98 },
  somnig:    { namn: 'sömnig', titt: [0, 3], lock: [0.66, 0.66], kind: 0.7, streck: 0, mun: [10, 13, 0, 468],
               oron: [16, 16], armar: [2, 2], luta: 3, strack: 0.97 },
  fnissig:   { namn: 'fnissig', glad: [1, 1], kind: 1, streck: 0, mun: [10, 9, 1, 456], leX: 3, oron: [-4, 8], armar: [24, 24], luta: 4, strack: 0.98 },
  blinkar:   { namn: 'blinkar', glad: [0, 1], kind: 1, le: 1.3, leBred: 1.1, leX: 5, oron: [0, -6], armar: [8, 22], luta: -3 },
  kawaii:    { namn: 'kawaii', kawaii: 1, kind: 1, le: 1.2, leBred: 0.9, oron: [-4, -4], armar: [16, 16], strack: 1.02 },
  // sover (som Luddes v2): ögonen är slutna u-bågar (inte locket, då syns en bit av pupillen under), en liten nöjd mun
  sover:     { namn: 'sover', sov: 1, ogonY: 4, kind: 0.85, le: 0.5, leBred: 0.7, oron: [10, 10], armar: [0, 0], strack: 0.97 },
  stolt:     { namn: 'stolt', glad: [1, 1], ogonY: -8, kind: 1, le: 1.2, leBred: 1.1, oron: [-6, -6], armar: [-8, -8], strack: 1.04 },
};
// fnissig har ingen hand för munnen, armarna når inte dit. Axlarna dras upp i stället.

// Poser: kropp, armar, ben och öron. De läggs ovanpå uttrycket, så pose('hurra') + ansikte('jatteglad') går ihop.
// luta hela figuren (grader, kring fötterna) · rikt −1 … 1 riktningspose åt vänster/höger (ansiktet glider dit, öronen lutar,
// båda armarna ut på den sidan, se rita) · upp −1 … 1 tittar upp/ner (ansiktet flyttas) · bred kroppens bredd (+/−) · strack kroppens
// höjd (+/−) · sank kroppen ner (+) / upp (−) i px · armar [v, h] upp (+) i grader, läggs till uttryckets · fram [v, h] armen
// framför kroppen (0/1) · benFram benen framför kroppen (0/1) · oron [v, h] hänger (+) i grader · ben [v, h] utåt (+) i grader · benY [v, h] foten upp (−) i px · benS [v, h] benet längre (+)
// lyft hela figuren upp (−) i px, skuggan krymper · svans svansens vinkel i grader · x hela figuren åt sidan i px
// bada 0–1: båda armarna ut på riktningens sida (riktningsposerna, håller, når); utan den vänder rikt bara ansiktet, magen och öronen
// boj kroppen böjer sig från fötterna i grader (+ åt höger): huvudet lutar sig dit, fötterna står kvar platt (luta vrider hela figuren)
const POSE0 = { luta: 0, rikt: 0, upp: 0, bred: 0, strack: 0, sank: 0, armar: [0, 0], fram: [0, 0], oron: [0, 0],
  benFram: 0, ben: [0, 0], benY: [0, 0], benS: [0, 0], lyft: 0, svans: 0, x: 0, klapp: 0, gang: 0, sving: 0, armY: 0, hand: 0, gnista: 0, skak: [0, 0], nick: [0, 0], boj: 0, bada: 0, ligg: 0, golv: [0, 0] };
const POSER = {
  neutral:   { namn: 'neutral' },
  lutaV:     { namn: 'lutar vänster', luta: -1.5, boj: -4.5, oron: [-4, 4] },
  lutaH:     { namn: 'lutar höger', luta: 1.5, boj: 4.5, oron: [4, -4] },
  vanster:   { namn: 'riktning vänster', rikt: -1, bada: 1 },
  hoger:     { namn: 'riktning höger', rikt: 1, bada: 1 },
  haller:    { namn: 'håller fram', rikt: -1, bada: 1, armar: [25, 0] },
  nar:       { namn: 'sträcker sig efter', rikt: 1, bada: 1, armar: [0, 92], luta: 1, boj: 4, strack: 0.03, upp: 0.4, oron: [-4, -4] },
  upp:       { namn: 'tittar upp', upp: 1, strack: 0.02, oron: [-4, -4] },
  ner:       { namn: 'tittar ner', upp: -1, strack: -0.02, oron: [6, 6] },
  pekar:     { namn: 'pekar', armar: [0, 16], luta: 1, boj: 3 },
  hurra:     { namn: 'hurra', armar: [80, 80], strack: 0.03, oron: [-6, -6] },   // + jätteglad 20 = 100°: uppe, utanför kroppen (UT)
  magen:     { namn: 'händer på magen', armar: [-72, -72], fram: [1, 1], klapp: 40 },   // händerna vid magens kanter (korta armar)
  blyg:      { namn: 'blyg', armar: [-25, -25], bred: -0.03, strack: -0.03, luta: -1, boj: -4, upp: -0.4, oron: [8, 4] },
  sitter:    { namn: 'sitter', ben: [40, 40], benY: [-40, -40], sank: 48, bred: 0.03, armar: [6, 6] },
  strack:    { namn: 'sträcker på sig', strack: 0.04, sank: -6, benS: [0.06, 0.06], armar: [95, 95], oron: [-5, -5] },
  huka:      { namn: 'hukar (före hopp)', strack: -0.08, bred: 0.05, ben: [6, 6], armar: [-10, -10], oron: [6, 6] },
  stampar:   { namn: 'stampar', ben: [0, 8], benY: [0, -16], luta: -2 },
  lyssnar:   { namn: 'lyssnar', luta: 2, boj: 5, oron: [-6, 14] },
  // sover (som Luddes v2): sitter ihopsjunken, huvudet lite nerböjt och åt sidan, vingarna vilar på magen (som 'magen'),
  // tofsarna hänger lite
  sover:     { namn: 'sover', ben: [40, 40], benY: [-40, -40], sank: 56, bred: 0.04, strack: -0.03, upp: -0.6, luta: 4,
               armar: [-72, -72], fram: [1, 1], klapp: 40, oron: [10, 10] },
  // ligger på magen med vingarna under hakan och sover (som Luddes liggMage)
  liggMage:  { namn: 'på magen, händerna under hakan', strack: -0.3, bred: 0.18, sank: 30, upp: -0.9,
               armar: [-120, -120], fram: [1, 1], klapp: 80, armY: -38, ben: [85, 85], benY: [-70, -70], oron: [14, 14] },
};
// Armar och ben byter lager (bakom/framför kroppen) vid fram 0,5. Ett hopp i lagren, men armen är gömd bakom kroppen just då.

// Blanda två uttryck eller två poser (namn eller parameterobjekt), k 0 = a, 1 = b.
const blanda = blandare(NEUTRAL, UTTRYCK), blandaPose = blandare(POSE0, POSER), param = u => fyll(NEUTRAL, UTTRYCK, u);

function figur(x, y, skala) {                 // en uggla med fötterna i (x, y)
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g'), id = document.querySelectorAll('#figurer > g').length;
  const del = (n, fil = n) => `<image class="${n}" href="cut/ulla-${fil}.png" width="1024" height="1024"/>`;
  g.setAttribute('transform', `translate(${x} ${y}) scale(${skala}) translate(-512 ${-FOTTER})`);
  // arm-l2/arm-r2: kopior av armarna för riktningsposen (båda armarna ut på samma sida, den ena under den andra).
  g.innerHTML = `<ellipse class="skugga" cx="512" cy="${FOTTER - 18}" rx="300" ry="34" fill="#000" opacity="0.1"/>
    <g class="figuren">${['ear-l', 'ear-r', 'leg-l', 'leg-r'].map(n => del(n)).join('')}
    ${del('arm-l2', 'arm-l')}${del('arm-r2', 'arm-r')}${del('arm-l')}${del('arm-r')}
    <g class="kropp"><image href="cut/ulla-body-tom.png" width="1024" height="1024"/>
    <image class="mage" href="cut/ulla-mage.png" width="1024" height="1024"/>
    <g mask="url(#ansiktsmask)"><g class="drag"><image href="cut/ulla-nos.png" width="1024" height="1024"/>
    ${KINDER.map(([x, y]) => `<ellipse class="kind" cx="${x}" cy="${y}" rx="27" ry="18" fill="${KIND}"/>`).join('')}
    ${OGON.map((_, i) => `<g class="oga">
      <clipPath id="lock-${id}-${i}"><path class="lockklipp" d="M-40 -26 H40 V60 H-40Z"/></clipPath>
      <g clip-path="url(#lock-${id}-${i})"><ellipse rx="17" ry="25" fill="${LINJE}"/><circle class="glans" cx="-6" cy="-10" r="6" fill="#fff"/>
        <g class="glans-k" opacity="0"><circle cx="-5.3" cy="-9.9" r="7" fill="#fff"/><circle cx="5.6" cy="9.4" r="2.5" fill="#fff"/></g></g>
      <path class="lock" fill="none" stroke="${LINJE}" stroke-width="6" stroke-linecap="round"/></g>
      <path class="glad" d="M-20 6 Q0 -18 20 6" fill="none" stroke="${LINJE}" stroke-width="7" stroke-linecap="round"/>
      <path class="sov" d="M-19 -2 Q0 14 19 -2" fill="none" stroke="${LINJE}" stroke-width="6" stroke-linecap="round"/>
      <path class="bryn" d="M-16 3 Q0 -6 16 3" fill="none" stroke="${LINJE}" stroke-width="6" stroke-linecap="round"/>`).join('')}
    <g class="munnen" stroke="${NABBKANT}" stroke-width="3.5" stroke-linejoin="round"><ellipse class="mun" fill="${MUNFARG}" stroke="none"/>
    <path class="nabb-ner" d="${NABB_NER}" fill="${NABB}"/><path d="${NABB_UPP}" fill="${NABB}"/>
    <ellipse cx="522" cy="424" rx="3.5" ry="7" fill="#fff" stroke="none" opacity="0.55" transform="rotate(-12 522 424)"/>
    <path class="le" fill="none" stroke-width="3.5" stroke-linecap="round"/></g>
    </g></g></g>${del('leg-l')}${del('leg-r')}${del('arm-l', 'arm-l-fram')}${del('arm-r', 'arm-r-fram')}${del('arm-l', 'arm-l-klapp')}${del('arm-r', 'arm-r-klapp')}
    <g class="gnista">${[0, 1, 2, 3].map(() => `<path fill="none" stroke="#fff" stroke-width="20" stroke-linecap="round"/><path fill="none"
      stroke="#7a4a32" stroke-width="9" stroke-linecap="round"/>`).join('')}</g></g>`;
  // Den riktiga klappen (?klapp=kant ger den gamla) använder -klapp-kopian: som -fram men med HELA roten tonad i alfa
  // (skript/klapparm.py), så att bara handen syns och armen växer ut ur kroppen också över magen och ögonskivorna.
  // Vingarna framför kroppen (gången, klappen, magen) är ulla-arm-*-fram.png: den vita kanten och den mörkare konturen tonas bort
  // mot roten, så att vingen växer ut ur magen i stället för att sväva framför den. Vingarna är ritade runda stumpar
  // (rund rot, lite bredare rund ände), så de ser hela ut åt alla håll, också utanför kroppen när de lyfts.
  document.getElementById('figurer').appendChild(g);
  return g;
}

function rita(fig, f, p = POSE0) {
  const q = s => fig.querySelector(s), alla = s => [...fig.querySelectorAll(s)];
  const r = Math.max(-1, Math.min(1, p.rikt + (fig.riktning || 0))), a = Math.abs(r), sida = Math.sign(r);   // −1 vänster, 1 höger
  const u = p.upp, sx = 1 + p.bred, sy = f.strack + p.strack, sank = p.sank;
  // Kroppen sträcks från fötterna och breddas kring mitten, så öron och armar flyttas med.
  const lyft = y => -(sy - 1) * (FOTTER - y) + sank;
  const del = (n, grader, dx, dy, skala = [1, 1]) => { const [x, y] = RIGG[n.replace('2', '')];
    const t = `translate(${(sx - 1) * (x - 512) + dx} ${dy}) rotate(${grader} ${x} ${y}) translate(${x} ${y}) scale(${skala[0]} ${skala[1]}) translate(${-x} ${-y})`;
    alla('.' + n).forEach(e => e.setAttribute('transform', t)); };
  q('.figuren').setAttribute('transform', `translate(${p.x} ${p.lyft}) rotate(${f.luta + p.luta + 2 * r} 512 ${FOTTER})`);
  const hojd = Math.min(1, -p.lyft / 220);
  q('.skugga').setAttribute('rx', 300 * (1 - 0.4 * hojd)); q('.skugga').setAttribute('cx', 512 + p.x); q('.skugga').setAttribute('opacity', 0.1 * (1 - 0.3 * hojd));
  q('.kropp').setAttribute('transform', `translate(0 ${sank}) translate(512 ${FOTTER}) scale(${sx} ${sy}) translate(-512 ${-FOTTER})`);

  // Riktningsposen (som i bil-test.html): kroppen framifrån, ansiktet glider ~36 px åt sidan, smalnar och lutar,
  // öronen lutar dit, och båda armarna kommer ut på den sidan: den närmre lite högre, kopian 85 px under.
  // Den bortre armen glider in bakom kroppen (vriden skulle dess rot sticka ut på andra sidan) och kopian glider ut
  // bakom kroppen på den närmre sidan: armarna åker in och ut, de tonar aldrig.
  // Örontofsarna står upp på huvudets topp: vrids kring leden (oron + = hänger utåt), 60 % så mycket som de andras öron
  // (ORA), följer ansiktet ~18 px åt sidan i riktningsposen och lutar dit.
  const ora = [10, 6];                       // [närmre, bortre] örat
  const nara = n => (n === 'l') === (sida < 0), aa = armSida(fig, p, a);   // aa: så mycket armarna följer riktningen (verktyg/rigg-motor.js)
  const orat = (n, i) => { const rot = (i ? 1 : -1) * ORA * (f.oron[i] + p.oron[i]) + sida * a * (nara(n) ? ora[0] : ora[1]);
    del('ear-' + n, rot, 18 * r, lyft(RIGG['ear-' + n][1]) + 4 * a - 6 * u); };
  orat('l', 0); orat('r', 1);
  ['l', 'r'].forEach((n, i) => { const s = i ? -1 : 1, A = f.armar[i] + p.armar[i], vinkel = s * A;
    const sm = x => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); }, bak = 1 - p.fram[i];
    const gom = bak * sm((A - GOM.fran) / GOM.ramp) * sm((GOM.till - A) / GOM.ramp), ut = bak * sm((A - UT.fran) / (UT.till - UT.fran));
    const y0 = lyft(RIGG['arm-' + n][1]) + 20 * p.fram[i] + p.armY - UT.upp * ut;
    const dx = s * (p.klapp || 70 * p.fram[i]) + s * GOM.in * gom - s * UT.ut * ut;    // framför kroppen: händerna in på magen (eller ihop, klapp)
    if (p.gang > 0) {     // gången (som förebilden): bakre armen framför kroppen ut över kanten, främre armen tittar fram, de pendlar i otakt
      const sd = sida || 1, bak = (n === 'l') === (sd > 0), g = p.gang;
