<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hugo – riggtest</title>
<style>
  body { margin:0; background:#222; display:grid; place-items:center; min-height:100vh; }
  svg { width:min(100vw, 1280px); height:auto; display:block; }
</style>
</head>
<body>
<!-- LK-figur v2, mall från kaninen-kanel/premium/rigg-test.html (skillen lk-figur). Läggs i assets/karaktarer/<mapp>/premium/.
     Byt hugo, Hugo, ../../../stiltest-premium/skogen-monster-mild-a.png, ../../../stiltest-premium/cut/egen (assets/stiltest-premium/cut/egen, relativt), ../../../ljud/effekter/puff/puff-2.m4a (svansljud).
     Siffrorna i RIGG, OGON, KINDER, FOTTER, munnen och kinderna är Kanels: mät om dem för den nya figuren.
     Lagerordning: öron, svans, ben, armar bakom kroppen; kropp-tom, mage, ansikte (nos, kinder, ögon, mun) överst. -->
<svg viewBox="0 0 1920 1080">
  <defs>
    <filter id="boil" filterUnits="userSpaceOnUse" x="-100" y="-100" width="2120" height="1280">
      <feTurbulence id="brus" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
      <feDisplacementMap in="SourceGraphic" scale="5"/>
    </filter>
  </defs>
  <g id="kamera">
  <image href="../../../stiltest-premium/skogen-monster-mild-a.png" width="1920" height="1080" preserveAspectRatio="xMidYMid slice"/>
  <image href="../../../stiltest-premium/cut/egen/trad.png" x="150" y="230" height="700" width="431"/>
  <ellipse id="skugga" cx="960" cy="915" rx="170" ry="20" fill="#000" opacity="0.13"/>
  <g filter="url(#boil)">
    <g id="figur">
      <image id="tail" href="cut/hugo-tail.png" width="1024" height="1024"/>
      <image id="leg-l" href="cut/hugo-leg-l.png" width="1024" height="1024"/>
      <image id="leg-r" href="cut/hugo-leg-r.png" width="1024" height="1024"/>
      <image id="arm-l" href="cut/hugo-arm-l.png" width="1024" height="1024"/>
      <image id="arm-r" href="cut/hugo-arm-r.png" width="1024" height="1024"/>
      <g id="kropp">
        <image href="cut/hugo-body.png" width="1024" height="1024"/>
        <!-- Hugos hängöron ligger framför huvudet, som i konsten, och trycks ihop med kroppen -->
        <image id="ear-l" href="cut/hugo-ear-l.png" width="1024" height="1024"/>
        <image id="ear-r" href="cut/hugo-ear-r.png" width="1024" height="1024"/>
        <g id="ansikte"></g>
      </g>
    </g>
  </g>
  <!-- förgrund: bara två grästuvor, en på var sida om figuren -->
  <image href="../../../stiltest-premium/cut/egen/gras.png" x="500" y="790" height="180" width="202"/>
  <image href="../../../stiltest-premium/cut/egen/gras.png" x="-1420" y="790" height="180" width="202" transform="scale(-1 1)"/>
  </g>
</svg>
<script>
// MÄT OM: vridpunkter ur <namn>-rigg.json
const RIGG = { 'arm-l': [211, 578], 'leg-l': [433, 838], 'leg-r': [605, 833], 'arm-r': [809, 574], 'ear-l': [350, 269], 'ear-r': [665, 269], 'tail': [766, 713] };
// Kamera: närbild som följer figuren (standard), eller hela scenen med ?vy=hela (tittut, där man ska se gömställena).
const HELA = new URLSearchParams(location.search).get('vy') === 'hela', ZOOM = HELA ? 1 : 2;
// MÄT OM: ögon- och kindmitt i 1024-rutan, FOTTER = fötternas underkant i rutan, SKALA = så att filkant × SKALA ≈ 5 px
const OGON = [[417, 402], [602, 401]], KINDER = [[387, 456], [639, 454]];
const FOTTER = 923, SKALA = 0.5, MARK = 915;
const $ = id => document.getElementById(id);

// Ansiktet: ovala ögon med fast glansprick, glada ^ ^-bågar, rosa kinder och munnen under nosen.
$('ansikte').innerHTML = '<ellipse cx="512" cy="424" rx="22" ry="14" fill="#2a1d1a"/><ellipse cx="505" cy="419" rx="6" ry="3.5" fill="#fff" opacity="0.8"/>' +
  KINDER.map(([x, y]) => `<ellipse class="kind" cx="${x}" cy="${y}" rx="27" ry="16" fill="#ec8f96" opacity="0.85"/>`).join('') +
  OGON.map(([x, y]) => `<g transform="translate(${x} ${y})">
    <g class="oga"><ellipse class="pupill" rx="19" ry="27" fill="#2a1d1a"/><circle class="glans" cx="-6" cy="-10" r="6" fill="#fff"/></g>
    <path class="glad" d="M-20 6 Q0 -18 20 6" fill="none" stroke="#2a1d1a" stroke-width="7" stroke-linecap="round" opacity="0"/></g>`).join('') +
  `<g id="mun" fill="none" stroke="#3a2a22" stroke-width="5" stroke-linecap="round">
     <path id="le" d="M512 438 L512 452 M482 452 Q497 468 512 452 Q527 468 542 452"/>
     <ellipse id="oppen" cx="512" cy="460" rx="16" ry="0" fill="#7a2a1c" stroke="none"/></g>`;

const vrid = (id, grader, dy = 0) => { const [x, y] = RIGG[id];
  $(id).setAttribute('transform', `translate(0 ${dy}) rotate(${grader} ${x} ${y})`); };
const lerp = (a, b, k) => a + (b - a) * Math.max(0, Math.min(1, k));
const mjuk = k => k * k * (3 - 2 * k);

// Svansviftets ljud (platshållare tills det finns ett eget). Klicka på sidan en gång så att webbläsaren tillåter ljud.
const puff = new Audio('../../../ljud/effekter/puff/puff-2.m4a'); let viftar = false;
const kx = t => { const T = ((t % 9) + 9) % 9; return T >= 3 && T < 7 ? 960 + Math.sin((T - 3) / 4 * Math.PI * 2) * 300 : 960; };

// t i sekunder. 0–3 vinkar och säger hej, 3–7 går, 7–9 hoppar, sedan om.
function render(t) {
  const T = t % 9, gang = T >= 3 && T < 7, hopp = T >= 7;
  let x = 960, y = 0, vy = 0, sx = 1, sy = 1, tilt = 0, glad = 0, mun = 0;
  let armL = 8, armR = -8, benL = 0, benR = 0, lyftL = 0, lyftR = 0;

  if (T < 3) {                       // vinka med höger arm, glada ögon och "hej!"
    const upp = mjuk(Math.min(T / 0.4, 1)) * mjuk(Math.min((3 - T) / 0.4, 1));
    armR = lerp(-8, -38, upp) + Math.sin(T * 14) * 14 * upp;  // armen pekar redan åt sidan: över ~-55° försvinner den bakom kroppen
    tilt = Math.sin(T * 7) * 2 * upp;
    glad = upp; mun = T > 0.5 && T < 1.1 ? Math.sin((T - 0.5) / 0.6 * Math.PI) : 0;
  }
  if (gang) {                        // gå: benen turas om, kroppen gungar och studsar
    const s = (T - 3) * 2.4, f = Math.sin(s * Math.PI), amp = mjuk(Math.min((T - 3) / 0.3, (7 - T) / 0.3, 1));
    x = kx(t);
    benL = f * 16 * amp; benR = -f * 16 * amp;
    lyftL = Math.max(0, -f) * -40 * amp; lyftR = Math.max(0, f) * -40 * amp;
    tilt = f * 5 * amp; y = -Math.abs(f) * 12 * amp; vy = Math.cos(s * Math.PI) * Math.sign(f) * 12 * amp;
    armL = 8 - f * 20 * amp; armR = -8 - f * 20 * amp;
  }
  if (hopp) {                        // hopp med squash före och efter landning
    const k = T - 7, luft = k > 0.35 && k < 1.35 ? (k - 0.35) / 1.0 : -1;
    if (luft >= 0) { y = -4 * 260 * luft * (1 - luft); vy = -4 * 260 * (1 - 2 * luft) / 30;
      sy = 1.08; sx = 0.94; armL = 40; armR = -40; lyftL = lyftR = -30; glad = 1; }
    else { const tryck = k <= 0.35 ? Math.sin(k / 0.35 * Math.PI) : Math.sin(Math.min((k - 1.35) / 0.3, 1) * Math.PI);
      sy = 1 - 0.12 * tryck; sx = 1 + 0.1 * tryck; }
  }

  // Öronen släpar efter kroppens fart upp och ner och fladdrar lite, svansen viftar.
  const fladder = Math.sin(t * 5) * 2;
  const ora = Math.max(-12, Math.min(12, vy * 0.5));
  vrid('ear-l', -ora + fladder); vrid('ear-r', ora - fladder);
  // Svansen: vilar nästan stilla, men viftar snabbt en kort stund då och då (med ett mjukt puff-ljud).
  const vift = (t % 4.5) > 3.6 && (t % 4.5) < 4.2 ? Math.sin(((t % 4.5) - 3.6) / 0.6 * Math.PI) : 0;
  vrid('tail', Math.sin(t * 3) * 3 + Math.sin(t * 34) * 18 * vift);
  if (vift > 0 && !viftar && !window.stilla) { viftar = true; puff.currentTime = 0; puff.play().catch(() => {}); }
  if (!vift) viftar = false;
  vrid('arm-l', armL); vrid('arm-r', armR); vrid('leg-l', benL, lyftL); vrid('leg-r', benR, lyftR);
  $('kropp').setAttribute('transform', `translate(512 ${FOTTER}) scale(${sx} ${sy}) translate(-512 ${-FOTTER})`);
  $('figur').setAttribute('transform',
    `translate(${x} ${MARK + y}) scale(${SKALA}) rotate(${tilt} 0 0) translate(-512 ${-FOTTER})`);
  const h = -y / 260; $('skugga').setAttribute('cx', x); $('skugga').setAttribute('rx', 170 * (1 - 0.4 * h));

  // Ansiktet: blinka, titta åt gångriktningen, glada bågar, kinderna lyser lite när hon är glad.
  const blink = (T % 3.1) < 0.12 ? 0.08 : 1, titt = gang ? Math.sign(Math.cos((T - 3) / 4 * Math.PI * 2)) * 7 : 0;
  document.querySelectorAll('.oga').forEach(o => { o.setAttribute('transform', `translate(${titt} 0) scale(1 ${blink})`);
    o.setAttribute('opacity', 1 - glad); });
  document.querySelectorAll('.glad').forEach(g => g.setAttribute('opacity', glad));
  document.querySelectorAll('.kind').forEach(c => c.setAttribute('opacity', 0.75 + 0.25 * glad));
  $('le').setAttribute('opacity', mun > 0.15 ? 0 : 1);
  $('oppen').setAttribute('ry', mun * 16);
  // Kameran följer med lite eftersläp (medel av de senaste 0,6 s), fötterna nära bildens underkant, aldrig utanför bakgrunden.
  let fx = 0; for (let i = 0; i < 12; i++) fx += kx(t - i * 0.05) / 12;
  const tx = Math.min(0, Math.max(1920 - 1920 * ZOOM, 1000 - fx * ZOOM));
  const ty = Math.min(0, Math.max(1080 - 1080 * ZOOM, 1030 - (MARK + y * 0.7) * ZOOM));  // följer med 70 % av hoppet
  $('kamera').setAttribute('transform', `translate(${tx} ${ty}) scale(${ZOOM})`);
  $('brus').setAttribute('seed', Math.floor(t * 30 / 3) % 50 + 1);
}
window.render = render;
const start = performance.now();
// window.stilla = true stoppar loopen, så att render(t) kan anropas bild för bild.
(function loop() { if (!window.stilla) render((performance.now() - start) / 1000); requestAnimationFrame(loop); })();
</script>
</body>
</html>
