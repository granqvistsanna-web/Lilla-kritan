<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hunden v2 – uttryck och poser</title>
<style>
  body { margin:0; background:#222; display:grid; place-items:center; min-height:100vh; }
  svg { width:min(100vw, 1280px); height:auto; display:block; }
  text { font-family: Fredoka, "Arial Rounded MT Bold", system-ui, sans-serif; fill:#5a3b2e; text-anchor:middle; }
</style>
</head>
<body>
<!-- Hugos uttryck och poser i kod, över det ansiktslösa v2-urklippet. Samma API som lejonet-lage/premium/uttryck.html:
     ansikte(namn, k), pose(namn, k), riktning(sida, k), blanda(a, b, k), blandaPose(a, b, k), rorelse(namn, t).
     Ett ark med alla uttryck, ?ark=poser, ?bara=<uttryck>, ?pose=<pose>, ?rorelse=<namn>|alla, ?film=1.
     Skillnader mot Lage: hängöronen sitter inne i kroppsgruppen, efter kroppsbilden och före ansiktet (små utslag, högst ±12°),
     svansen ligger först i kroppsgruppen (bakom kroppen), ingen mage och ingen nosfläck (nosen och munnen ritas i kod),
     korta armar (klappen är klapp på magen vid kanterna) och -fram-armar när armen ligger framför kroppen. -->
<svg viewBox="0 0 1920 1080">
  <defs>
    <filter id="boil" filterUnits="userSpaceOnUse" x="-100" y="-100" width="2120" height="1280">
      <feTurbulence id="brus" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
      <feDisplacementMap in="SourceGraphic" scale="5"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="#f6efe3"/>
  <g id="kamera"><g id="scen"></g><g id="figurer" filter="url(#boil)"></g><g id="forgrund"></g></g>
  <g id="etiketter"></g>
</svg>
<script src="../../../../verktyg/blinka.js"></script>
<script src="../../../../verktyg/rigg-motor.js"></script>
<script>
// Vridpunkter ur hugo-rigg.json. Öronen vrids kring sin bas, framför huvudet.
const RIGG = { 'arm-l': [211, 578], 'leg-l': [433, 838], 'leg-r': [605, 833], 'arm-r': [809, 574],
               'ear-l': [350, 269], 'ear-r': [665, 269], 'tail': [766, 713] };
const OGON = [[417, 402], [602, 401]], KINDER = [[387, 456], [639, 454]], FOTTER = 923;
// Munnen: Hugos nos sitter på (512, 424) och munlinjen ligger kring y 438–452. Öppen mun räknas från y 452, i skala 1.
const MUNY = 0, MUNS = 1;
// Hängöronen sitter fast i huvudet och rör sig lite: uttryckens och posernas öronvinklar (gjorda för Lages ståöron) skalas ner
// och klipps vid ±12° (som i rigg-test.html).
const ORONS = 0.4, ORONMAX = 12;
const LINJE = '#2a1d1a', MUNLINJE = '#3a2a22', MUNFARG = '#7a2a1c', KIND = '#ec8f96';

// Alla uttryck har samma parametrar, så att de går att blanda. Det som inte anges är neutralt.
// ogonS [sx, sy] ögonens storlek · titt [x, y] blickriktning · ogonY ögon och bryn upp (−) / ner (+)
// glad [v, h] öga → ^-båge (0–1) · lock [v, h] ögonlock ner (0–1) · bryn synlighet · brynY [v, h] höjd · brynV inre änden upp (grader)
// kind kindernas styrka · le leendet 1 … −1 (lite surt) · leBred bredd · leX munnen åt sidan · streck munlinjernas synlighet
// mun [rx, ry, d, cy] öppen mun (d 0 = rund, 1 = platt överkant) · oron [v, h] öronen hänger (+) / lyfts (−) i grader (skalas ner, se ORONS)
// armar [v, h] armarna upp (+) / ner (−) i grader, vila 8 · luta hela figuren i grader · strack kroppen sträcks (+) / sjunker (−)
const NEUTRAL = { ogonS: [1, 1], titt: [0, 0], ogonY: 0, glad: [0, 0], lock: [0, 0], bryn: 0, brynY: [0, 0], brynV: 0,
  kind: 0.75, le: 1, leBred: 1, leX: 0, streck: 1, mun: [0, 0, 0, 462], oron: [0, 0], armar: [8, 8], luta: 0, strack: 1 };

const UTTRYCK = {
  neutral:   { namn: 'neutral' },
  glad:      { namn: 'glad', kind: 1, le: 1.3, leBred: 1.15, ogonY: -2, oron: [-4, -4], armar: [16, 16] },
  jatteglad: { namn: 'jätteglad', glad: [1, 1], kind: 1, streck: 0, mun: [20, 17, 1, 452], oron: [-8, -8], armar: [40, 40], strack: 1.03 },
  forvanad:  { namn: 'förvånad', ogonS: [1.2, 1.16], bryn: 1, brynY: [-12, -12], kind: 0.6, streck: 0, mun: [8, 10, 0, 462],
               oron: [-9, -9], armar: [22, 22], strack: 1.04 },
  nyfiken:   { namn: 'nyfiken', titt: [11, -2], bryn: 0.9, brynY: [0, -8], le: 0.6, leBred: 0.8, leX: 4, oron: [-2, 10], luta: 5 },
  tanker:    { namn: 'tänker', titt: [-7, -12], bryn: 0.9, brynY: [-9, 0], le: 0.4, leBred: 0.55, leX: 10, oron: [6, -2], luta: -3 },
  ledsen:    { namn: 'lite ledsen', titt: [0, 4], ogonS: [0.95, 0.95], bryn: 1, brynY: [4, 4], brynV: 24,
               kind: 0.55, le: -0.7, leBred: 0.75, oron: [24, 24], armar: [-4, -4], luta: 2, strack: 0.97 },
  somnig:    { namn: 'sömnig', titt: [0, 3], lock: [0.66, 0.66], kind: 0.7, streck: 0, mun: [9, 11, 0, 462],
               oron: [16, 16], armar: [2, 2], luta: 3, strack: 0.97 },
  fnissig:   { namn: 'fnissig', glad: [1, 1], kind: 1, streck: 0, mun: [9, 8, 1, 452], leX: 3, oron: [-4, 8], armar: [24, 24], luta: 4, strack: 0.98 },
  blinkar:   { namn: 'blinkar', glad: [0, 1], kind: 1, le: 1.3, leBred: 1.1, leX: 5, oron: [0, -6], armar: [8, 30], luta: -3 },
  stolt:     { namn: 'stolt', glad: [1, 1], ogonY: -8, kind: 1, le: 1.2, leBred: 1.1, oron: [-6, -6], armar: [-8, -8], strack: 1.04 },
  gaspar:    { namn: 'gäspar', lock: [0.85, 0.85], bryn: 0.6, brynY: [-6, -6], kind: 0.8, streck: 0, mun: [18, 24, 0, 462],
               oron: [8, 8], armar: [34, 34], luta: -2, strack: 1.05 },
};
// ponytail: fnissig har ingen hand för munnen, Hugos armar är för korta. Axlarna dras upp i stället.

// Poser: kropp, armar, ben och öron. De läggs ovanpå uttrycket, så pose('hurra') + ansikte('jatteglad') går ihop.
// luta hela figuren (grader, kring fötterna) · rikt −1 … 1 riktningspose åt vänster/höger (ansiktet glider dit, öronen lutar,
// båda armarna ut på den sidan, se rita) · upp −1 … 1 tittar upp/ner (ansiktet flyttas) · bred kroppens bredd (+/−) · strack kroppens
// höjd (+/−) · sank kroppen ner (+) / upp (−) i px · armar [v, h] upp (+) i grader, läggs till uttryckets · fram [v, h] armen
// framför kroppen (0/1) · benFram benen framför kroppen (0/1) · oron [v, h] hänger (+) i grader · ben [v, h] utåt (+) i grader · benY [v, h] foten upp (−) i px · benS [v, h] benet längre (+)
// lyft hela figuren upp (−) i px, skuggan krymper · svans svansens vinkel i grader · x hela figuren åt sidan i px
const POSE0 = { luta: 0, rikt: 0, upp: 0, bred: 0, strack: 0, sank: 0, armar: [0, 0], fram: [0, 0], oron: [0, 0],
  benFram: 0, ben: [0, 0], benY: [0, 0], benS: [0, 0], lyft: 0, svans: 0, x: 0, klapp: 0, gang: 0, sving: 0, armY: 0, hand: 0, gnista: 0 };
const POSER = {
  neutral:   { namn: 'neutral' },
  lutaV:     { namn: 'lutar vänster', luta: -5, oron: [-4, 4] },
  lutaH:     { namn: 'lutar höger', luta: 5, oron: [4, -4] },
  vanster:   { namn: 'riktning vänster', rikt: -1 },
  hoger:     { namn: 'riktning höger', rikt: 1 },
  haller:    { namn: 'håller fram', rikt: -1, armar: [25, 0] },
  nar:       { namn: 'sträcker sig efter', rikt: 1, armar: [0, 55], luta: 3, strack: 0.03, upp: 0.4, oron: [-4, -4] },
  upp:       { namn: 'tittar upp', upp: 1, strack: 0.02, oron: [-4, -4] },
  ner:       { namn: 'tittar ner', upp: -1, strack: -0.02, oron: [6, 6] },
  pekar:     { namn: 'pekar', armar: [0, 32], luta: 3 },
  hurra:     { namn: 'hurra', armar: [70, 70], strack: 0.03, oron: [-6, -6] },
  magen:     { namn: 'händer på magen', armar: [-95, -95], fram: [1, 1] },
  blyg:      { namn: 'blyg', armar: [-25, -25], bred: -0.03, strack: -0.03, luta: -4, upp: -0.4, oron: [8, 4] },
  sitter:    { namn: 'sitter', ben: [40, 40], benY: [-40, -40], sank: 48, bred: 0.03, armar: [6, 6] },
  strack:    { namn: 'sträcker på sig', strack: 0.04, sank: -6, benS: [0.06, 0.06], armar: [30, 30], oron: [-5, -5] },
  huka:      { namn: 'hukar (före hopp)', strack: -0.08, bred: 0.05, ben: [6, 6], armar: [-10, -10], oron: [6, 6] },
  stampar:   { namn: 'stampar', ben: [0, 8], benY: [0, -16], luta: -2 },
  lyssnar:   { namn: 'lyssnar', luta: 6, oron: [-6, 14] },
};
// ponytail: benen byter lager (bakom/framför kroppen) vid benFram 0,5, armarna först vid fram 0,85 (då byts också till -fram-bilden).

// Blanda två uttryck eller två poser (namn eller parameterobjekt), k 0 = a, 1 = b.
const blanda = blandare(NEUTRAL, UTTRYCK), blandaPose = blandare(POSE0, POSER), param = u => fyll(NEUTRAL, UTTRYCK, u);

function figur(x, y, skala) {                 // en hund med fötterna i (x, y)
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g'), id = document.querySelectorAll('#figurer > g').length;
  const del = (n, fil = n) => `<image class="${n}" href="cut/hugo-${fil}.png" width="1024" height="1024"/>`;
  g.setAttribute('transform', `translate(${x} ${y}) scale(${skala}) translate(-512 ${-FOTTER})`);
  // arm-l2/arm-r2: kopior av armarna för riktningsposen (båda armarna ut på samma sida, den ena under den andra).
  // Armen framför kroppen är -fram-bilden (kanten tonar ut mot roten). Svansen ligger först i kroppsgruppen, bakom kroppen,
  // och hängöronen efter kroppsbilden men före ansiktet.
  g.innerHTML = `<ellipse class="skugga" cx="512" cy="${FOTTER - 30}" rx="300" ry="34" fill="#000" opacity="0.1"/>
    <g class="figuren">${['leg-l', 'leg-r'].map(n => del(n)).join('')}
    ${del('arm-l2', 'arm-l')}${del('arm-r2', 'arm-r')}${del('arm-l')}${del('arm-r')}
    <g class="kropp">${del('tail')}<image href="cut/hugo-body.png" width="1024" height="1024"/>${del('ear-l')}${del('ear-r')}
    <g class="drag"><ellipse cx="512" cy="424" rx="22" ry="14" fill="${LINJE}"/><ellipse cx="505" cy="419" rx="6" ry="3.5" fill="#fff" opacity="0.8"/>
    ${KINDER.map(([x, y]) => `<ellipse class="kind" cx="${x}" cy="${y}" rx="27" ry="16" fill="${KIND}"/>`).join('')}
    ${OGON.map((_, i) => `<g class="oga">
      <clipPath id="lock-${id}-${i}"><path class="lockklipp" d="M-40 -28 H40 V60 H-40Z"/></clipPath>
      <g clip-path="url(#lock-${id}-${i})"><ellipse rx="19" ry="27" fill="${LINJE}"/><circle cx="-6" cy="-10" r="6" fill="#fff"/></g>
      <path class="lock" fill="none" stroke="${LINJE}" stroke-width="6" stroke-linecap="round"/></g>
      <path class="glad" d="M-20 6 Q0 -18 20 6" fill="none" stroke="${LINJE}" stroke-width="7" stroke-linecap="round"/>
      <path class="bryn" d="M-16 3 Q0 -6 16 3" fill="none" stroke="${LINJE}" stroke-width="6" stroke-linecap="round"/>`).join('')}
    <g class="munnen"><path class="mun" fill="${MUNFARG}"/>
    <g fill="none" stroke="${MUNLINJE}" stroke-width="5" stroke-linecap="round"><path class="nos"/><path class="le"/></g></g>
    </g></g>${['leg-l', 'leg-r'].map(n => del(n)).join('')}
    ${del('arm-l', 'arm-l-fram')}${del('arm-r', 'arm-r-fram')}${del('arm-l', 'arm-l-klapp')}${del('arm-r', 'arm-r-klapp')}
    <g class="gnista">${[0, 1, 2, 3].map(() => `<path fill="none" stroke="#fff" stroke-width="20" stroke-linecap="round"/><path fill="none"
      stroke="#7a4a32" stroke-width="9" stroke-linecap="round"/>`).join('')}</g></g>`;
  // Den riktiga klappen (?klapp=kant ger den gamla) använder -klapp-kopian (verktyg/klapparm.py): som -fram men med HELA roten
  // tonad i alfa, så att bara handen syns och armen växer ut ur kroppen också där den ligger över magen.
  document.getElementById('figurer').appendChild(g);
  return g;
}

function rita(fig, f, p = POSE0) {
  const q = s => fig.querySelector(s), alla = s => [...fig.querySelectorAll(s)];
  const r = Math.max(-1, Math.min(1, p.rikt + (fig.riktning || 0))), a = Math.abs(r), sida = Math.sign(r);   // −1 vänster, 1 höger
  const u = p.upp, sx = 1 + p.bred, sy = f.strack + p.strack, sank = p.sank;
  // Kroppen sträcks från fötterna och breddas kring mitten, så armar och ben flyttas med. Öron och svans ligger inne i
  // kroppsgruppen och följer den av sig själva (inne = true).
  const lyft = y => -(sy - 1) * (FOTTER - y) + sank;
  const del = (n, grader, dx, dy, skala = [1, 1], inne = false) => { const [x, y] = RIGG[n.replace('2', '')];
    const t = `translate(${inne ? dx : (sx - 1) * (x - 512) + dx} ${dy}) rotate(${grader} ${x} ${y}) translate(${x} ${y}) scale(${skala[0]} ${skala[1]}) translate(${-x} ${-y})`;
    alla('.' + n).forEach(e => e.setAttribute('transform', t)); };
  q('.figuren').setAttribute('transform', `translate(${p.x} ${p.lyft}) rotate(${f.luta + p.luta + 2 * r} 512 ${FOTTER})`);
  const hojd = Math.min(1, -p.lyft / 220);
  q('.skugga').setAttribute('rx', 300 * (1 - 0.4 * hojd)); q('.skugga').setAttribute('cx', 512 + p.x); q('.skugga').setAttribute('opacity', 0.1 * (1 - 0.3 * hojd));
  q('.kropp').setAttribute('transform', `translate(0 ${sank}) translate(512 ${FOTTER}) scale(${sx} ${sy}) translate(-512 ${-FOTTER})`);

  // Riktningsposen (som i bil-test.html): kroppen framifrån, ansiktet glider ~36 px åt sidan, smalnar och lutar,
  // öronen lutar dit, och båda armarna kommer ut på den sidan: den närmre lite högre, kopian 85 px under.
  // Den bortre armen glider in bakom kroppen (vriden skulle dess rot sticka ut på andra sidan) och kopian glider ut
  // bakom kroppen på den närmre sidan: armarna åker in och ut, de tonar aldrig.
  const ora = [5, 2], oraY = [-6, 1];        // [närmre, bortre] örat, små utslag på hängöron
  const nara = n => (n === 'l') === (sida < 0);
  const orat = (n, i) => { const rot = Math.max(-ORONMAX, Math.min(ORONMAX, (i ? 1 : -1) * ORONS * (f.oron[i] + p.oron[i]) + sida * a * (nara(n) ? ora[0] : ora[1])));
    // Hugos hängöron ligger framför huvudet: de vrids bara kring basen (högst ±12°).
    del('ear-' + n, rot, 0, a * (nara(n) ? oraY[0] : oraY[1]), [1, 1], true); };
  orat('l', 0); orat('r', 1);
  ['l', 'r'].forEach((n, i) => { const s = i ? -1 : 1, vinkel = s * (f.armar[i] + p.armar[i]), y0 = lyft(RIGG['arm-' + n][1]) + 20 * p.fram[i] + (p.armY || 0);
    const dx = s * (p.klapp || 40 * p.fram[i]);    // framför kroppen: händerna in på magen vid kanten (klapp: kort väg)
    if (p.gang > 0) {     // gången (som förebilden): bakre armen framför kroppen ut över kanten, främre armen tittar fram, de pendlar i otakt
      const sd = sida || 1, bak = (n === 'l') === (sd > 0), g = p.gang;
      const [tv, tdx, tdy] = bak ? [sd * (-18 + 14 * p.sving), sd * 32, 20] : [sd * (-10 - 14 * p.sving), -sd * 36, 10];
      del('arm-' + n, mix(vinkel, tv, g), mix(dx, tdx, g), y0 + tdy * g);
      alla('.arm-' + n).forEach((e, j) => e.setAttribute('opacity', (bak && g > 0.5 ? 1 : 0) === j ? 1 : 0));
      q('.arm-' + n + '2').setAttribute('opacity', 0); return; }
    const IN = 200;                                   // så långt in bakom kroppen en arm göms (figurens px)
    if (nara(n)) { del('arm-' + n, vinkel, dx, y0 - 45 * a); del('arm-' + n + '2', vinkel - s * 16 * a, dx + s * (10 * a + IN * (1 - a)), y0 + 40 * a); }
    else del('arm-' + n, vinkel, dx + s * IN * a, y0);
    const syns = nara(n) || a < 0.98 ? 1 : 0;
    const vis = p.fram[i] > 0.85 ? (p.hand > 0.5 ? 2 : 1) : 0;   // 0 bakom kroppen, 1 framför, 2 framför med bara handen (riktiga klappen)
    alla('.arm-' + n).forEach((e, j) => e.setAttribute('opacity', (vis === j ? 1 : 0) * syns));
    q('.arm-' + n + '2').setAttribute('opacity', nara(n) && a > 0 ? 1 : 0); });
  // Klappgnistan: fyra korta kritstreck ut från händerna där de möts, i 0,25 s efter varje klapp (p.gnista 0–1, 0 = ingen).
  const g = p.gnista || 0, gx = (RIGG['arm-l'][0] + RIGG['arm-r'][0]) / 2, gy = lyft(RIGG['arm-l'][1]) + RIGG['arm-l'][1] + 20 + (p.armY || 0) - KLAPPNY.spets;
  alla('.gnista path').forEach((e, j) => { const v = [-172, -142, -38, -8][Math.floor(j / 2)] * Math.PI / 180;   // åt sidorna och uppåt, inte rakt upp i ansiktet
    const r0 = KLAPPNY.gnista[0] + 22 * g, r1 = r0 + KLAPPNY.gnista[1] * (0.5 + 0.5 * Math.sin(Math.PI * Math.min(1, 2 * g)));
    e.setAttribute('d', `M${gx + r0 * Math.cos(v)} ${gy + r0 * Math.sin(v)} L${gx + r1 * Math.cos(v)} ${gy + r1 * Math.sin(v)}`);
    e.setAttribute('opacity', g > 0 && g < 1 ? Math.min(1, 3 * Math.sin(Math.PI * g)) : 0); });
  const lager = (n, fram) => alla('.' + n).forEach((e, j) => e.setAttribute('opacity', (fram > 0.5) === (j === 1) ? 1 : 0));
  lager('leg-l', p.benFram); lager('leg-r', p.benFram);
  del('leg-l', p.ben[0], 0, sank + p.benY[0], [1, 1 + p.benS[0]]);
  del('leg-r', -p.ben[1], 0, sank + p.benY[1], [1, 1 + p.benS[1]]);
  del('tail', p.svans, 0, 0, [1, 1], true);

  // Hela ansiktet (nos, kinder, ögon, mun, ritade i kod) glider med riktningen och blicken. Ingen mage och ingen nosfläck.
  const fx = 36 * r, fy = 4 * a - 10 * u;
  q('.drag').setAttribute('transform', `translate(${fx} ${fy}) rotate(${5 * r} 512 450) translate(512 450) scale(${1 - 0.08 * a} 1) translate(-512 -450)`);
  const ogon = alla('.oga'), lock = alla('.lock'), klipp = alla('.lockklipp'), glad = alla('.glad'), bryn = alla('.bryn');
  OGON.forEach(([x, y], i) => {
    const dy = f.ogonY - 4 * u;               // ögonen följer blicken lite mer än resten av ansiktet
    ogon[i].setAttribute('transform', `translate(${x + f.titt[0]} ${y + dy + f.titt[1]}) scale(${f.ogonS[0]} ${f.ogonS[1]})`);
    ogon[i].setAttribute('opacity', 1 - f.glad[i]);
    // Locket: en böjd kant som både klipper ögat och ritas som linje, så att det inte blir hörn.
    const ly = -28 + f.lock[i] * 44, w = 19 * Math.sqrt(Math.max(0, 1 - (ly / 27) ** 2));
    klipp[i].setAttribute('d', `M-40 ${ly} H${-w} Q0 ${ly + 8} ${w} ${ly} H40 V60 H-40Z`);
    lock[i].setAttribute('d', `M${-w} ${ly} Q0 ${ly + 8} ${w} ${ly}`);
    lock[i].setAttribute('opacity', Math.min(1, f.lock[i] * 8));
    glad[i].setAttribute('transform', `translate(${x} ${y + dy})`);
    glad[i].setAttribute('opacity', f.glad[i]);
    const s = i ? 1 : -1;                     // inre änden upp: vänster bryn moturs, höger medurs
    bryn[i].setAttribute('transform', `translate(${x + 0.8 * f.titt[0]} ${y - 52 + f.brynY[i] + dy}) rotate(${s * f.brynV})`);
    bryn[i].setAttribute('opacity', f.bryn);
  });
  alla('.kind').forEach(c => c.setAttribute('opacity', f.kind));

  // Hugos mun: strecket från nosens underkant (438) ner till 452, där de två båg-ändarna möts (som i rigg-test.html).
  const cx = 512 + f.leX * MUNS, b = f.leBred, le = f.le, ey = 452 - 4 * (le - 1), cy = 452 + 16 * le;
  q('.le').setAttribute('d', `M${cx - 30 * b} ${ey} Q${cx - 15 * b} ${cy} ${cx} 452 Q${cx + 15 * b} ${cy} ${cx + 30 * b} ${ey}`);
  q('.le').setAttribute('opacity', f.streck);
  const rx = f.mun[0] * MUNS, ry = f.mun[1] * MUNS, d = f.mun[2], my = f.mun[3] + MUNY, h = ry * 4 / 3, topp = h * (1 - d);
  q('.mun').setAttribute('d', `M${cx - rx} ${my} C${cx - rx} ${my - topp} ${cx + rx} ${my - topp} ${cx + rx} ${my}
    C${cx + rx} ${my + h} ${cx - rx} ${my + h} ${cx - rx} ${my}Z`);  // Strecket från nosen når alltid munnen: leendets mitt (452), eller den öppna munnens överkant.
  q('.nos').setAttribute('d', `M512 438 L${cx} ${my - 0.75 * topp + (452 - (my - 0.75 * topp)) * f.streck}`);
}

const blinka = skapaBlinka(10);   // verktyg/blinka.js, eget frö per figur
// Den riktiga klappen (som Ullas och Ruts, 2026-11-10): armarna kommer fram som i den gamla klappen (0–0,4 s), glider sedan in
// framför magen (0,4–0,75 s) och vrids lite uppåt, och händerna möts mitt framför bröstet tre gånger i takt (1,0, 1,5, 2,0 s),
// en liten studs och fyra kritstreck vid varje klapp; sedan samma väg tillbaka. Armarna är -klapp-kopiorna (bara handen syns),
// vridpunkten skjuts in över magen så att den korta armen räcker till mitten. ?klapp=kant ger den gamla klappen (KLAPP).
// kontakt/oppen [vinkel, in px], y armarna upp (−) px, spets handens höjd över vridpunkten vid kontakten, gnista [avstånd, längd].
// Uppmätt: armen L = 88 px, i vila 131° (vridpunkt → hand); kontakt -146° ger handen ca 15° uppåt; in = mitten − vridpunkt − L·cos 15° + 3.
const KLAPP = { v: -95, dv: 26, in: 40, din: 16, ner: 0 };   // den gamla klappen, oförändrad
const KLAPPTYP = new URLSearchParams(location.search).get('klapp') === 'kant' ? 'kant' : 'ny';
const KLAPPNY = { kontakt: [-146, 217], oppen: [-128, 177], y: -85, spets: 23, gnista: [44, 22] };
// Figurens egna tal för rörelserna i verktyg/rigg-motor.js (det som inte står här är motorns standard).
const RORELSE = { svansGang: 'vila', svansDans: 14, dansArmar: (in_, s) => [in_ * 26 + 26 * s, in_ * 26 - 26 * s], hoppArm: () => 32, kant: { v: -95, dv: 26, in: 40, din: 16, ner: 0 } };
const ROR = {
  ...rorelser(),
};
Object.assign(window, { UTTRYCK, NEUTRAL, POSER, POSE0, blanda, blandaPose, ansikte, pose, riktning, rorelse, ROR });

// Arket med poser visar varje pose med ett uttryck som passar.
const PAR = { neutral: 'neutral', lutaV: 'glad', lutaH: 'nyfiken', vanster: 'glad', hoger: 'nyfiken', haller: 'glad', nar: 'nyfiken', upp: 'forvanad', ner: 'ledsen',
  pekar: 'nyfiken', hurra: 'jatteglad', magen: 'glad', blyg: 'fnissig', sitter: 'glad', strack: 'somnig', huka: 'glad',
  stampar: 'tanker', lyssnar: 'nyfiken' };   // gaspar finns bara som uttryck

const sok = new URLSearchParams(location.search), bara = sok.get('bara'), enPose = sok.get('pose');
const etikett = (x, y, s, storlek) => document.getElementById('etiketter').insertAdjacentHTML('beforeend',
  `<text x="${x}" y="${y}" font-size="${storlek}">${s}</text>`);
let render;
if ((bara && UTTRYCK[bara]) || (enPose && POSER[enPose])) {
  // ?bara=<uttryck> och/eller ?pose=<pose>: en stor hund som går neutral → uttryck/pose → neutral på 4 s.
  const fig = figur(960, 1000, 0.92), u = UTTRYCK[bara] ? bara : 'neutral', po = POSER[enPose] ? enPose : 'neutral';
  etikett(1500, 120, [POSER[po].namn, UTTRYCK[u].namn].filter(n => n !== 'neutral').join(' · ') || 'neutral', 56);
  render = t => { const T = t % 4, k = mjuk(T < 0.6 ? 0 : T < 1.2 ? (T - 0.6) / 0.6 : T < 2.8 ? 1 : T < 3.4 ? 1 - (T - 2.8) / 0.6 : 0);
    ansikte(u, k, fig); pose(po, k, fig); document.getElementById('brus').setAttribute('seed', Math.floor(t * 10) % 50 + 1); };
} else if (ROR[sok.get('rorelse')] || sok.get('rorelse') === 'alla') {
  // ?rorelse=klappa|hoppa|dansa|ga: en stor hund. ?rorelse=alla: klappa, hoppa och dansa bredvid varandra.
  const namn = sok.get('rorelse') === 'alla' ? ['klappa', 'hoppa', 'dansa'] : [sok.get('rorelse')];
  const NAMN = { klappa: 'klappar händerna', hoppa: 'hoppar', dansa: 'dansar', ga: 'går' };
  const figs = namn.map((n, i) => { const x = namn.length > 1 ? 330 + 630 * i : 960;
    etikett(x, 1060, NAMN[n], 40); return figur(x, 1000, namn.length > 1 ? 0.62 : 0.75); });
  render = t => { namn.forEach((n, i) => rorelse(n, t, figs[i])); document.getElementById('brus').setAttribute('seed', Math.floor(t * 10) % 50 + 1); };
} else if (sok.get('film')) {
  // ?film=1: testfilm i v2-skogen (som rigg-test.html, zoom 2, kameran följer). Avsnitt efter varandra, 0,5 s mjuk övergång mellan dem.
  const S = '../../../stiltest-premium/', MARK = 915, Z = 2;
  document.getElementById('scen').innerHTML = `<image href="${S}skogen-monster-mild-a.png" width="1920" height="1080" preserveAspectRatio="xMidYMid slice"/>
    <image href="${S}cut/egen/trad.png" x="150" y="230" height="700" width="431"/>`;
  document.getElementById('forgrund').innerHTML = `<image href="${S}cut/egen/gras.png" x="500" y="790" height="180" width="202"/>
    <image href="${S}cut/egen/gras.png" x="-1420" y="790" height="180" width="202" transform="scale(-1 1)"/>`;
  const fig = figur(960, MARK, 0.5), svans = t => Math.sin(t * 3) * 3;
  const { gang, vinka, stilla, ror } = filmHjalp({ svans: t => svans(t), vinkArm: [38, 16] });   // verktyg/rigg-motor.js
  const AVSNITT = [
    [3.2, gang(-2300, 0, 3.2)],
    [2.6, vinka(2.6)],
    [2.2, stilla('nyfiken', 'lyssnar')],
    [2.4, tl => [blanda('nyfiken', 'forvanad', mjuk(kl(0, 1, (tl - 1.6) / 0.4))), { ...blandaPose('neutral', 'nar', 1), svans: svans(tl) }]],
    // hurra: armarna upp och ner igen inom avsnittet, så att de inte flyger genom luften in i klappen
    [3, tl => [blanda('tanker', 'jatteglad', mjuk(kl(0, 1, (tl - 1.4) / 0.3))),
      { ...blandaPose('neutral', 'hurra', mjuk(kl(0, 1, (tl - 1.4) / 0.3)) * mjuk(kl(0, 1, (3 - tl) / 0.5))), svans: svans(tl) }]],
    [3, ror('klappa')],
    [4.8, ror('hoppa')],
    [4, ror('dansa')],
    [3, tl => { const s = blanda('glad', 'somnig', mjuk(kl(0, 1, (tl - 0.6) / 0.8)));
      return [{ ...s, lock: s.lock.map(v => Math.min(1, v + 0.3 * Math.max(0, Math.sin(tl * 2.2)))) }, { ...blandaPose('neutral', 'sitter', 1), svans: svans(tl) }]; }],
    // en stor gäspning sittande, armarna upp en bit
    [2.4, tl => { const g = Math.sin(Math.PI * kl(0, 1, (tl - 0.2) / 2.0));
      return [blanda('somnig', 'gaspar', g), { ...blandaPose('sitter', { ...POSER.sitter, armar: [30, 30], strack: 0.04 }, g), svans: svans(tl) }]; }],
    [1.8, tl => [blanda('somnig', 'glad', mjuk(kl(0, 1, (tl - 1.1) / 0.5))), { ...blandaPose('neutral', 'strack', Math.sin(Math.PI * kl(0, 1, tl / 1.6))), svans: svans(tl) }]],
    [2.4, vinka(2.4)],
    [3, gang(0, 2600, 3)],
  ];
  const LANGD = AVSNITT.reduce((s, [d]) => s + d, 0);
  const hugo = t => { let t0 = 0; t = kl(0, LANGD - 0.001, t);
    for (let i = 0; i < AVSNITT.length; i++) { const [d, fn] = AVSNITT[i];
      if (t < t0 + d) { const tl = t - t0; let [f, p] = fn(tl);
        if (i && tl < 0.5) { const [d0, fn0] = AVSNITT[i - 1], [f0, p0] = fn0(d0), k = mjuk(tl / 0.5);
          f = blanda(f0, f, k); p = blandaPose(p0, p, k); }
        return [blinka(f, t), liv(f, p, t)]; }
      t0 += d; } };
  window.LANGD = LANGD;
  render = t => { const [f, p] = hugo(t); fig.ansikte = f; fig.pose = p; rita(fig, f, p);
    // Kameran följer hunden med eftersläp (medel av de senaste 0,6 s) och 70 % av hoppet, aldrig utanför bakgrunden.
    let fx = 0; for (let i = 0; i < 12; i++) fx += (960 + 0.5 * hugo(t - i * 0.05)[1].x) / 12;
    const tx = kl(1920 - 1920 * Z, 0, 1000 - fx * Z), ty = kl(1080 - 1080 * Z, 0, 1030 - MARK * Z - 0.7 * p.lyft);
    document.getElementById('kamera').setAttribute('transform', `translate(${tx} ${ty}) scale(${Z})`);
    document.getElementById('brus').setAttribute('seed', Math.floor(t * 10) % 50 + 1); };
} else if (sok.get('ark') === 'poser') {
  Object.keys(POSER).forEach((n, i) => {
    const x = 160 + 320 * (i % 6), y = 300 + 350 * Math.floor(i / 6), fig = figur(x, y, 0.3);
    ansikte(PAR[n], 1, fig); pose(n, 1, fig);
    etikett(x, y + 42, POSER[n].namn, 26); etikett(x, y + 70, UTTRYCK[PAR[n]].namn, 20);
  });
  render = () => {};
} else {
  Object.keys(UTTRYCK).forEach((n, i) => {
    const x = 160 + 320 * (i % 6), y = i < 6 ? 455 : 975;
    ansikte(n, 1, figur(x, y, 0.36)); etikett(x, y + 52, UTTRYCK[n].namn, 36);
  });
  etikett(960, 56, 'hunden · uttryck', 40);   // tolv uttryck fyller rutnätet, rubriken ligger överst
  render = () => {};
}
window.render = render;
const start = performance.now();
// window.stilla = true stoppar loopen, så att render(t) kan anropas bild för bild.
(function loop() { if (!window.stilla) render((performance.now() - start) / 1000); requestAnimationFrame(loop); })();
</script>
