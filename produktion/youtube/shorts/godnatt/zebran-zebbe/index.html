<!doctype html>
<meta charset="utf-8">
<title>Godnattsagan – Zebran Zebbe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=block">
<script>
// Godnattsagan: Zebran Zebbe (manus.md i samma mapp, regler i format/shorts.md#godnattsagan). 9:16, 1080×1920.
// Tio sidor vid Dammen på natten. Varje sida: texten tonas in, inläsningen (sida-N.m4a här) börjar efter 1 s, och sidan
// står kvar inläsningen + 3 s (sida 9–10 + 4 s). Saknas filen gäller tiden i SIDOR. En sak rör sig per sida.
// Förhandsvisning: http://127.0.0.1:8765/produktion/youtube/shorts/godnatt/zebran-zebbe/ (python3 -m http.server 8765 i repots rot)
// Rendering: node avsnitt/004-bussen-badar/scener/render.mjs produktion/youtube/shorts/godnatt/zebran-zebbe --staende
// Byggd från lejonet-lage/index.html (mallen) 2026-11-06.

const SIDOR = [   // [rader, sekunder om inläsningen saknas]
  [['Det är kväll vid dammen.', 'Zebran är sömnig.', 'Är du också sömnig?'], 11],
  [['Godnatt, måne.'], 9],
  [['Godnatt, näckros.'], 10],
  [['Godnatt, vass.'], 10],
  [['Zebran räknar sina ränder.', 'En … två … tre …', 'Zebran gäspar. Gääsp.', 'Kan du också gäspa?'], 16],
  [['Zebran lägger sig vid dammen.', 'Benen blir tunga.', 'Så tunga.'], 13],
  [['Vattnet är stilla.', 'Gräset är mjukt.', 'Allt är så mjukt.'], 13],
  [['Zebran andas in … och ut.', 'In … och ut.', 'Kan du också?'], 16],
  [['Månen blundar.', 'Näckrosen blundar.', 'Vassen blundar.'], 15],
  [['Zebran blundar.', 'Nu sover zebran.', 'Godnatt, zebra.', 'Godnatt, du.'], 15],
];
const MUSIK = 'assets/ljud/musik/godnatt-bad-loop.m4a';   // godnatt-bad.m4a med 3 s överton från slutet in i början, så att den går runt
const MANE = 'assets/bakgrunder/nattkullen-saker/mane.png';
const effekt = (n, k = 1) => `assets/ljud/effekter/${n}/${n}-${k}.m4a`;
const MIN_SIDA = 8;   // korta sidor ("Godnatt, måne.") får ändå tid för sin rörelse
// Dammen på natten (bakgrunder/dammen-natt.md), 768×1376 fylld till 1080×1920: världen = bildens punkt · 1,406 − 8 i y.
// Punkterna uppmätta i bilden: dammens mitt, näckrosens mitt och vassens rot. Dammens färg täcker bildens egen näckros.
const DAMM = { bild: 'assets/bakgrunder/dammen-natt/dammen-natt.png', farg: '#5e80a4',
  vatten: [786, 1363], nackros: [830, 1321], vass: [967, 1314] };
// zebran i bildernas 1024-ruta: konst = punkten mellan hovarna, som står på L.fot. Stående: ögon och mun uppmätta mot
// zebran-zebbe.png (bilden med ansikte). Liggande (ligger/zebran-zebbe-ligger.png, Google Flow 2026-11-06) uppmätt i bilden
const ZEBBE = { s: 0.62, fot: [270, 1440],
  star: { konst: [515, 922], ogon: [[414, 401], [603, 400]], mun: [505, 530] },
  ligger: { fil: 'assets/karaktarer/zebran-zebbe/ligger/zebran-zebbe-ligger.png', konst: [512, 862], ogon: [[428, 505], [598, 505]], mun: [512, 735] } };
const GODNATT_LJUD = 'bobo', BOBO = [1, 2, 4];   // TILLFÄLLIGT: lånar lejonets "bo bo" tills zebrans mjuka frust finns i assets/ljud/effekter/
const DELA = 960;   // den delade bildens skarv (sida 2–4)
// närbilderna, [mitt x, mitt y, zoom] i världen: det zebran säger godnatt till, och zebrans ansikte.
// Kameran får inte visa utanför världen: mitt x ska ligga mellan 540/zoom och 1080 − 540/zoom.
const NARA = { mane: [790, 282, 2.0], nackros: [830, 1300, 3.0], vass: [834, 1040, 2.2], zebra: [264, 1145, 3.6] };
// tider inom sidan som andel av sidans rörelse (0 → 1); flytta efter inläsningen
const GASP = [0.5, 0.78];          // sida 5: munnen öppnas på "Gääsp" och stängs igen
const TUNGA = 0.45;                // sida 6: kroppen sjunker lite till på "tunga" (efter att han lagt sig)
const ANDAS_FAS = 0;               // sida 8: s att flytta andningen (5 s per andetag) så att den sväller på "in" och sjunker på "ut"
const BLUNDA = [0.1, 0.4, 0.7];    // sida 9: när månen, näckrosen och vassen blundar, i den ordning de sägs

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const del = (a, b, t) => clamp((t - a) / (b - a));
const inUt = k => k < 0.5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2;
// en m4a-fils längd ur mvhd-boxen (samma som i gissa.js), eller null om filen saknas
const langd = async fil => {
  const r = await fetch('/' + fil).catch(() => null); if (!r?.ok) return null;
  const b = new DataView(await r.arrayBuffer());
  for (let i = 0; i < b.byteLength - 32; i++) if (b.getUint32(i) === 0x6d766864) {
    const v1 = b.getUint8(i + 4) === 1, o = i + (v1 ? 24 : 16);
    return (v1 ? Number(b.getBigUint64(o + 4)) : b.getUint32(o + 4)) / b.getUint32(o);
  }
  return null;
};

addEventListener('DOMContentLoaded', async () => {
  const render = new URLSearchParams(location.search).has('staende');
  const mapp = decodeURIComponent(location.pathname).replace(/^\//, '').replace(/index\.html$/, '');
  document.head.insertAdjacentHTML('beforeend', `<style>
    html,body{margin:0;height:100%;background:#15182b;font:15px/1.4 system-ui,sans-serif;color:#eee}
    body{display:flex;gap:24px;align-items:center;justify-content:center}
    svg{height:${render ? '100vh' : '96vh'};aspect-ratio:9/16;display:block}
    aside{width:260px} button{font:inherit;padding:8px 14px;margin:0 6px 8px 0;cursor:pointer}
    .zon{display:none} .visa-zon .zon{display:block}</style>`);

  const img = (href, x, y, w, h, extra = '') => `<image href="/${href}" x="${x}" y="${y}" width="${w}" height="${h}" ${extra}/>`;
  const L = ZEBBE, [fx, fy] = L.fot;
  // zebrans ansikte i kod (i bildens 1024-ruta): ögon som kan blunda, ett litet leende och en mun som öppnar sig
  const zebraAnsikte = (p, ogon, mun) => ogon.map(([x, y], i) => `<g transform="translate(${x} ${y})"><g id="${p}oga${i}"><circle r="25" fill="#fff" stroke="#1d1d1d" stroke-width="6"/><circle r="10" fill="#1d1d1d"/></g>
    <path id="${p}stangt${i}" d="M-24 -2 Q0 18 24 -2" fill="none" stroke="#1d1d1d" stroke-width="7" stroke-linecap="round" opacity="0"/></g>`).join('') +
    `<g transform="translate(${mun[0]} ${mun[1]}) scale(1.5)">
    <path id="${p}gap" fill="#5a2418" stroke="#1d1d1d" stroke-width="4" stroke-linejoin="round"/><ellipse id="${p}tunga" fill="#e8837a"/>
    <path d="M-20 -3 Q0 11 20 -3" fill="none" stroke="#1d1d1d" stroke-width="4" stroke-linecap="round"/></g>`;
  // munnen öppen o (0–1,2): överläppen är leendets båge (mindre än lejonets ω, sömnigare), underkäken sjunker ner, tungan syns längst ner
  const munForm = o => `M-20 -3 Q0 11 20 -3 Q${16 + 4 * o} ${-2 + 26 * o} 0 ${2 + 34 * o} Q${-16 - 4 * o} ${-2 + 26 * o} -20 -2 Z`;
  // ansikte i kod på månen, näckrosen och vassen: två prickögon, stängda bågar och ett litet leende
  const ansikte = (id, x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})">${[-14, 14].map((ox, j) =>
    `<ellipse id="${id}-o${j}" cx="${ox}" rx="5.5" ry="7" fill="#1d1d1d"/><path id="${id}-s${j}" d="M${ox - 8} -1 Q${ox} 7 ${ox + 8} -1" fill="none" stroke="#1d1d1d" stroke-width="3.5" stroke-linecap="round" opacity="0"/>`).join('')}
    <path d="M-8 13 Q0 21 8 13" fill="none" stroke="#1d1d1d" stroke-width="3.5" stroke-linecap="round"/></g>`;
  // näckrosen i kod (tills den finns som urklipp), ovanpå bildens egen: en fläck i dammens färg täcker den, sedan rosa kronblad
  // som kan slutas och en gul mitt med ansikte
  const KRONBLAD = [-80, -55, -28, 0, 28, 55, 80];
  const nackros = `<g transform="translate(${DAMM.nackros[0]} ${DAMM.nackros[1]})"><ellipse cy="0" rx="74" ry="48" fill="${DAMM.farg}"/><g filter="url(#rim)">
    ${KRONBLAD.map((v, i) => `<ellipse id="kb${i}" cy="-24" rx="12" ry="30" fill="${i % 2 ? '#e58fb8' : '#f0a6c8'}" stroke="#c7608f" stroke-width="2"/>`).join('')}
    <ellipse cy="-4" rx="24" ry="16" fill="#f4c64a"/>${ansikte('nf', 0, -8, 0.8)}</g></g>`;
  // vassen i kod (tills den finns som urklipp), ovanpå bildens egen och lika stor: strån med kolvar som gungar runt roten;
  // ansiktet på den mittersta, största kolven
  const STRAN = [[-20, 220, -30], [-8, 245, -15], [4, 270, 12], [16, 235, 42], [26, 195, 50]];   // [x vid roten, höjd, lutning]
  const [mx, mh, ml] = STRAN[2];
  const vass = `<g transform="translate(${DAMM.vass[0]} ${DAMM.vass[1]})"><g id="vass" filter="url(#rim)">
    ${STRAN.map(([x, h, l]) => `<path d="M${x} 0 Q${x + l / 2} ${-h / 2} ${x + l} ${-h}" fill="none" stroke="#5d8a3f" stroke-width="8" stroke-linecap="round"/>`).join('')}
    <path d="M24 0 Q50 -80 82 -130" fill="none" stroke="#6f9c4a" stroke-width="7" stroke-linecap="round"/>
    ${STRAN.map(([x, h, l], i) => i === 2 ? '' : `<ellipse cx="${x + l}" cy="${-h + 30}" rx="10" ry="26" fill="#8a5a3a"/>`).join('')}
    <ellipse cx="${mx + ml}" cy="${-mh + 30}" rx="20" ry="44" fill="#8a5a3a"/>${ansikte('vf', mx + ml, -mh + 28, 0.75)}</g></g>`;
  const pose = (q, id, fil, p) => `<g id="${id}"><g transform="translate(${fx - q.konst[0] * L.s} ${fy - q.konst[1] * L.s}) scale(${L.s})">${img(fil, 0, 0, 1024, 1024)}${zebraAnsikte(p, q.ogon, q.mun)}</g></g>`;
  // världen ritas en gång (i defs) och visas med <use>: hel bild, eller delad i två närbilder på sida 2–4
  document.body.innerHTML = `<svg viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="boil" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence id="boil-brus" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
        <feDisplacementMap in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G"/></filter>
      <filter id="rim" x="-20%" y="-20%" width="140%" height="140%"><feMorphology in="SourceAlpha" operator="dilate" radius="4" result="d"/>
        <feFlood flood-color="#fff"/><feComposite in2="d" operator="in" result="v"/><feMerge><feMergeNode in="v"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <clipPath id="klipp-upp"><rect width="1080" height="${DELA}"/></clipPath>
      <clipPath id="klipp-ner"><rect y="${DELA}" width="1080" height="${1920 - DELA}"/></clipPath>
      <g id="varld">
        ${img(DAMM.bild, 0, 0, 1080, 1920, 'preserveAspectRatio="xMidYMid slice"')}
        <ellipse id="ring" cx="${DAMM.vatten[0]}" cy="${DAMM.vatten[1]}" fill="none" stroke="#c9dcf2" stroke-width="5" opacity="0"/>
        <g filter="url(#boil)">
          <g id="mane">${img(MANE, 650, 120, 300, 325)}${ansikte('mf', 712, 282, 1.5)}</g>
          ${vass}<g id="nackros">${nackros}</g>
          <g id="andas">
            ${pose(L.star, 'star', 'assets/karaktarer/zebran-zebbe/cut/zebran-zebbe-faceless.png', 's')}
            ${L.ligger ? pose(L.ligger, 'ligger', L.ligger.fil, 'l') : ''}
          </g>
        </g>
      </g>
    </defs>
    <use href="#varld" id="hel"/>
    <g id="delad" opacity="0">
      <g clip-path="url(#klipp-upp)"><use href="#varld" id="upp"/></g>
      <g clip-path="url(#klipp-ner)"><use href="#varld" id="ner"/></g>
      <rect y="${DELA - 5}" width="1080" height="10" rx="5" fill="#F8F2DD"/>
    </g>
    <text id="text" x="540" text-anchor="middle" fill="#F8F2DD" font-family="Fredoka" font-weight="600" font-size="64"></text>
    <rect id="morker" width="1080" height="1920" fill="#000" opacity="0"/>
    <g class="zon"><rect y="1440" width="1080" height="480" fill="#e5302a" opacity=".15"/></g>
  </svg>`;
  const $ = id => document.getElementById(id);
  const MUN = await fetch('/' + mapp + 'mun.json').then(r => r.json()).catch(() => ({}));   // munrörelsen ur inläsningen, 30 värden per s

  // sidornas tider: inläsningen + 4 s (1 s in, 3 s efter), sida 9–10 + 5 s, minst MIN_SIDA, annars tiden i SIDOR
  const las = await Promise.all(SIDOR.map((_, i) => langd(`${mapp}sida-${i + 1}.m4a`)));
  let t = 0;
  const T = SIDOR.map(([rader, sek], i) => { const t0 = t; t += las[i] ? Math.max(MIN_SIDA, las[i] + (i >= 8 ? 5 : 4)) : sek; return { t0, t1: t, rader }; });
  const DURATION = t + 0.5;

  const boTid = n => T[n].t0 + 1 + (las[n] ?? 2) + 0.35;
  const sida = (n, tt) => del(T[n].t0 + 1, T[n].t1 - 1, tt);   // sidans rörelse, 0 → 1
  const kamera = ([cx, cy, z], py) => `translate(${540 - z * cx} ${py - z * cy}) scale(${z})`;
  function rita(tt) {
    $('boil-brus').setAttribute('seed', Math.floor(tt * 8) % 50 + 1);
    const i = T.findIndex(p => tt < p.t1), n = i === -1 ? T.length - 1 : i, p = T[n];
    // delad bild på sida 2–4: in under första sekunden av sida 2, ut under sista sekunden av sida 4
    const delad = inUt(Math.min(del(T[1].t0, T[1].t0 + 1, tt), 1 - del(T[3].t1 - 1, T[3].t1, tt)));
    $('delad').setAttribute('opacity', delad);
    // texten: aktuell sida, in och ut på 1 s; i den delade bilden längst ner i den övre halvan
    const rader = p.rader, lh = 84, y0 = (n >= 1 && n <= 3 ? DELA - 80 : 760) - (rader.length - 1) * lh / 2;
    if ($('text').dataset.n !== String(n)) {
      $('text').dataset.n = n;
      $('text').innerHTML = rader.map((r, i) => `<tspan x="540" y="${y0 + i * lh}">${r}</tspan>`).join('');
    }
    $('text').setAttribute('opacity', Math.min(del(p.t0, p.t0 + 1, tt), n === T.length - 1 ? 1 : 1 - del(p.t1 - 1, p.t1, tt)));   // sista texten släcks med mörkret
    // zebran andas hela tiden, djupare när han sover
    // sida 8 är sidans enda rörelse: två synligt djupa andetag, 5 s vart (in sväller, ut sjunker), sedan lite lugnare när han sover.
    // Samma takt hela filmen, bara djupet ändras (mjukt under sidans första sekund), så att andningen aldrig hoppar.
    const djup = n < 7 ? 0.008 : lerp(n === 7 ? 0.008 : 0.03, n === 7 ? 0.03 : 0.018, del(p.t0, p.t0 + 1, tt));
    const andas = djup * Math.sin(2 * Math.PI * (tt - ANDAS_FAS) / 5);
    // 6: kroppen sjunker några px till på "tunga" och ligger kvar så
    const sjunk = 10 * inUt(del(TUNGA, TUNGA + 0.15, sida(5, tt)));
    $('andas').setAttribute('transform', `translate(${fx} ${fy + sjunk}) scale(${1 - andas / 2} ${1 + andas}) translate(${-fx} ${-fy})`);
    // 2: månen lyser upp och förblir ljus
    const m = inUt(sida(1, tt));
    $('mane').setAttribute('opacity', lerp(0.6, 1, m));
    $('mane').setAttribute('transform', `translate(800 282) rotate(${2 * Math.sin(2 * Math.PI * tt / 9)}) scale(${lerp(0.97, 1.03, m)}) translate(-800 -282)`);
    // 3: näckrosen vaknar och sluter sakta sina kronblad (de stannar slutna); mitten med ansiktet syns hela tiden
    const k3 = sida(2, tt), slut = inUt(del(0.25, 0.9, k3));
    KRONBLAD.forEach((v, i) => $('kb' + i).setAttribute('transform', `rotate(${v * lerp(1, 0.22, slut)}) scale(${lerp(1, 0.8, slut)} ${lerp(1, 1.1, slut)})`));
    // 4: vassen vaknar och gungar sakta, mer under sidan och sedan lite hela tiden
    const k4 = sida(3, tt), gung = n < 3 ? 0.6 : n === 3 ? lerp(0.6, 4, Math.sin(Math.PI * k4)) : 1.2;
    $('vass').setAttribute('transform', `rotate(${gung * Math.sin(2 * Math.PI * tt / 4.5)})`);
    // närbilderna: överst det zebran säger godnatt till (kameran glider vidare under sidans första sekund), nederst zebrans ansikte
    const MAL = [NARA.mane, NARA.nackros, NARA.vass];
    const a = Math.min(2, Math.max(0, n - 1)), b = Math.min(2, a + 1), kk = n >= 1 && n < 3 ? inUt(del(T[n + 1].t0, T[n + 1].t0 + 1, tt)) : 0;
    $('upp').setAttribute('transform', kamera(MAL[a].map((v, j) => lerp(v, MAL[b][j], kk)), DELA / 2));
    $('ner').setAttribute('transform', kamera(NARA.zebra, (DELA + 1440) / 2));
    // 5: gäspningen, som Lages: munnen blir ett stort O och ögonen kniper ihop
    const k5 = sida(4, tt), gap = inUt(del(GASP[0] - 0.12, GASP[0] + 0.05, k5)) * (1 - inUt(del(GASP[1], GASP[1] + 0.15, k5)));
    // sida 2–4: zebran säger godnatt, munnen följer inläsningen
    // munnen följer ljudstyrkan, utjämnad över tre bildrutor så att den inte fladdrar
    const kurva = (arr, x) => { const i = Math.floor(x * 30), v = j => (j >= 0 && arr?.[j]) || 0; return (v(i - 1) + 2 * v(i) + v(i + 1)) / 4; };
    const env = n >= 1 && n <= 3 ? kurva(MUN[n + 1], tt - p.t0 - 1) : 0;
    // efter repliken säger zebran godnatt med sitt ljud (GODNATT_LJUD), munnen följer med
    const bo = n >= 1 && n <= 3 ? kurva(MUN[GODNATT_LJUD + '-' + BOBO[n - 1]], tt - boTid(n)) : 0;
    const mun = Math.max(1.2 * gap, env, bo);
    $('sgap').setAttribute('d', munForm(mun)); $('sgap').setAttribute('opacity', mun > 0.03 ? 1 : 0);
    $('stunga').setAttribute('cx', 0); $('stunga').setAttribute('cy', -2 + 28 * mun); $('stunga').setAttribute('rx', 11 * Math.min(1, mun * 1.5)); $('stunga').setAttribute('ry', 6 * mun);
    // 6: han lägger sig vid dammen: den stående bilden trycks ihop och tonas ut, den liggande tonas in (klart vid 0,4)
    const k6 = sida(5, tt);
    const ut = inUt(del(0.05, 0.35, k6)), in_ = inUt(del(0.15, 0.4, k6));
    $('star').setAttribute('opacity', 1 - ut);
    $('star').setAttribute('transform', `translate(${fx} ${fy}) scale(1 ${1 - 0.3 * ut}) translate(${-fx} ${-fy})`);
    $('ligger').setAttribute('opacity', in_);
    $('ligger').setAttribute('transform', `translate(${fx} ${fy}) scale(1 ${lerp(0.85, 1, in_)}) translate(${-fx} ${-fy})`);
    // 7: en enda mjuk ring breder ut sig på vattnet och tonar bort
    const k7 = sida(6, tt), rx = lerp(30, 230, inUt(k7));
    $('ring').setAttribute('rx', rx); $('ring').setAttribute('ry', rx * 0.3);
    $('ring').setAttribute('opacity', 0.7 * del(0, 0.08, k7) * (1 - inUt(k7)));
    // 10: zebrans ögon sluts långsamt under sidans första tredjedel och förblir stängda
    const blink = off => ((tt + off) % 5.5) < 0.16;   // en lugn blinkning var 5,5 s, olika för var och en
    const sov = inUt(del(0, 0.35, sida(9, tt)));
    const blund = Math.max(sov, gap > 0.6 ? 1 : 0, blink(0) ? 0.94 : 0);
    for (const q of ['s', 'l']) for (const i of [0, 1]) {
      $(q + 'oga' + i).setAttribute('transform', `scale(1 ${Math.max(0.06, 1 - blund)})`);
      $(q + 'oga' + i).setAttribute('opacity', blund > 0.92 ? 0 : 1);
      $(q + 'stangt' + i).setAttribute('opacity', del(0.85, 1, blund));
    }
    // ansiktena: månen, näckrosen och vassen vaknar på sin godnatt-sida och blundar en i taget på sida 9
    const k9 = sida(8, tt);
    const ogon = (id, vaken, off, nr) => { const o = vaken * (1 - inUt(del(BLUNDA[nr], BLUNDA[nr] + 0.12, k9))) * (blink(off) ? 0.1 : 1);
      for (const j of [0, 1]) { $(`${id}-o${j}`).setAttribute('ry', 7 * Math.max(0.08, o)); $(`${id}-o${j}`).setAttribute('opacity', o > 0.15 ? 1 : 0); $(`${id}-s${j}`).setAttribute('opacity', o > 0.15 ? 0 : 1); } };
    ogon('mf', m > 0.5 ? 1 : 0, 2.1, 0);
    ogon('nf', k3 > 0.1 || n > 2 ? 1 : 0, 3.4, 1);
    ogon('vf', k4 > 0.1 || n > 3 ? 1 : 0, 0.9, 2);
    // 10: när zebran blundar mörknar bilden till svart
    $('morker').setAttribute('opacity', inUt(del(lerp(T[9].t0 + 1, T[9].t1 - 1, 0.4), T[9].t1, tt)));
  }

  // ljud i render.mjs format: musiken lågt hela vägen och uttonad på sista sidan, inläsningen 1 s in på varje sida
  const ljud = [
    { t: 0, fil: MUSIK, vol: 0.25, loop: true, langd: DURATION, fade: T[9].t1 - T[9].t0 },
    ...T.map((p, i) => ({ t: p.t0 + 1, fil: las[i] ? `${mapp}sida-${i + 1}.m4a` : null, vol: 2.5, tal: p.rader.join(' ') })),
    // effekter, mjuka och låga: månen blänker, näckrosen sluter sig, vinden i vassen, gräset prasslar, en droppe i dammen
    { t: lerp(T[1].t0 + 1, T[1].t1 - 1, 0.4), fil: effekt('glimt'), vol: 0.6 },
    { t: lerp(T[2].t0 + 1, T[2].t1 - 1, 0.25), fil: effekt('glimt', 2), vol: 0.35 },
    { t: T[3].t0 + 1, fil: effekt('swoosh'), vol: 0.2 },
    ...BOBO.map((k, i) => ({ t: boTid(i + 1), fil: effekt(GODNATT_LJUD, k), vol: 1.6 })),
    { t: T[5].t0 + 1, fil: 'produktion/sfx/new/leaves-3.mp3', vol: 0.5, langd: lerp(1, T[5].t1 - T[5].t0 - 1, 0.45), fade: 1 },
    { t: T[6].t0 + 1, fil: effekt('plask'), vol: 0.15 },
  ];
  await document.fonts.load('600 64px Fredoka');
  await Promise.all([...document.querySelectorAll('image')].map(i => new Promise(r => { const im = new Image(); im.onload = im.onerror = r; im.src = i.getAttribute('href'); })));
  window.LJUD = ljud.filter(c => c.fil);
  window.DURATION = DURATION;
  window.seek = rita;
  window.ready = true;   // render.mjs väntar på den
  if (render) { rita(0); return; }

  // ---------- förhandsvisningen (som i gissa.js) ----------
  document.body.insertAdjacentHTML('beforeend', `<aside><button id="spela">▶ Spela</button><button id="om">↺ Om</button>
    <div id="tid"></div><label><input type="checkbox" id="zon"> visa YouTube-zonen</label>
    <p style="opacity:.7">Sidor utan inläsning läses av talsyntesen.</p></aside>`);
  const spela = c => {
    if (!c.fil) { const u = new SpeechSynthesisUtterance(c.tal); u.lang = 'sv-SE'; u.rate = 0.75; return speechSynthesis.speak(u); }
    const a = new Audio('/' + c.fil); a.volume = Math.min(1, c.vol * 0.4); a.loop = !!c.loop; a.play();
    if (c.langd) setTimeout(() => a.pause(), c.langd * 1000);
  };
  let start = null, senast = 0;
  const ruta = nu => {
    const tt = start === null ? senast : (nu - start) / 1000;
    if (start !== null) for (const c of ljud) if (c.t > senast - 1e-6 && c.t <= tt) spela(c);
    senast = tt;
    rita(Math.min(tt, DURATION));
    $('tid').textContent = `${tt.toFixed(1)} / ${DURATION.toFixed(1)} s`;
    if (start !== null && tt >= DURATION) start = null;
    requestAnimationFrame(ruta);
  };
  $('spela').onclick = () => { start = performance.now() - senast * 1000; };
  $('om').onclick = () => { speechSynthesis.cancel(); start = performance.now(); senast = -1e-3; };
  $('zon').onchange = e => document.body.classList.toggle('visa-zon', e.target.checked);
  window.hoppa = t => { senast = t; };
  requestAnimationFrame(ruta);
});
</script>
