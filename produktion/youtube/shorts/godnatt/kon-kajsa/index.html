// Godnattsagan "Kon nattar nallen" (omskriven 2026-11-09: mindre text, en röd tråd, tydligt mål). Texten i ../inlasning.md / sidor.txt.
// Intro: kon, nallen, de leker, det blir kväll (skymningen mörknar till natt, månen och stjärnorna tänds). Målet: "Dags att sova,

// Nallen i famnen ligger i riggen mellan kroppen och -fram-armarna. Liggande kon: kajsa-sover.png med öppna v2-ögon i kod tills hon blundar.
// Mellan sidorna glider kameran lugnt till nästa bild (BYT). Bokomslaget: ../bok.js.
// Förhandsvisning: http://127.0.0.1:8765/produktion/youtube/shorts/godnatt/kon-kajsa/ (python3 -m http.server 8765 i repots rot)
// Rendering: node avsnitt/004-bussen-badar/scener/render.mjs produktion/youtube/shorts/godnatt/kon-kajsa --staende
// Inläsningen: en tagning, delad med verktyg/dela-tagning.py och sidor.txt till sida-1.m4a … sida-15.m4a här.

const SIDOR = [   // [rader, sekunder om inläsningen saknas]; texten exakt som inläsningen, utan taggarna
  [['Det här är kon.'], 7],
  [['Och det här är nallen.'], 7],
  [['De har lekt hela dagen.'], 8],
  [['Nu är det kväll.'], 8],
  [['Dags att sova, nallen!'], 7],
  [['– Nej! säger nallen.'], 7],
  [['Vill du ha välling?', 'Mmm.'], 10],
  [['Sover du, nallen?', '– Nej!'], 8],
  [['Kon gungar nallen.', 'Fram … och tillbaka.'], 10],
  [['Sover du, nallen?', '– Nej!'], 8],
  [['Kon nynnar.', 'Mmm … mmm.'], 10],
  [['Sover du, nallen?', 'Gääsp.'], 9],
  [['Ner på kudden.'], 10],
  [['Nu sover nallen.'], 9],
  [['Och kon också.', 'Sov gott.'], 10],

const S_ = { kon: 0, nalle: 1, lekt: 2, kvall: 3, dags: 4, nej: 5, valling: 6, fraga1: 7, gungar: 8, fraga2: 9, nynnar: 10, fraga3: 11, kudde: 12, nallenSover: 13, konSover: 14 };
const FRAGOR = [S_.fraga1, S_.fraga2, S_.fraga3];
const MUSIK = 'assets/ljud/musik/godnatt-bad-loop.m4a';
const SAKER = 'assets/bakgrunder/nattkullen-saker';
const effekt = (n, k = 1) => `assets/ljud/effekter/${n}/${n}-${k}.m4a`;
const MIN_SIDA = 7;
// appelbacken.png (1920×1080) i skala 16/9 så att den fyller höjden: backens topp y 949, det vita golvet från y 1728 (målas över
// med gräs). Världen är 3413 bred.
const PLATS = { fil: 'assets/bakgrunder/appelbacken/appelbacken.png', s: 1920 / 1080, b: 1920 * 1920 / 1080, gras: '#4FA34A' };
// kon i art direction v2: riggen ur assets/karaktarer/kon-kajsa/premium/uttryck.html (../v2-rigg.js), fötterna (FOTTER 925) i fot
const KON = { s: 0.6, fot: [1800, 1300] };
// liggande: premium/cut/kajsa-sover.png (slutna ögon i bilden), skala s·0.96 (ögonen 190 px isär mot riggens 182),
// punkten fast = (480, 800) i bilden står på ligg; öppna v2-ögon ritas på krämfläckar över de slutna tills hon blundar
const LIGG = { fil: 'assets/karaktarer/kon-kajsa/premium/cut/kajsa-sover.png', s: 0.96, fast: [480, 800], ligg: [1800, 1310],
  ogon: [[288, 532], [478, 535]], ansikte: [383, 560], kram: '#fcf3e7',
  arm: { fil: 'assets/karaktarer/kon-kajsa/premium/cut/kajsa-arm-l-fram.png', vrid: [222, 569], fast: [212, 655] } };
// v2-nallen framifrån (nalle-v2-ljus.png, ansiktet i kod). fot = punkten mitt under fötterna.
// I famnen ligger nallen i riggen (riggens 1024-ruta), annars i världen. Ögonfläckarna och munnen i bildens pixlar.
const NALLE = { ...NALLE2,   // v2-nallen (../nalle-v2.js), ansiktet i kod
  hojd: 300,             // i riggens px (= 180 i världen)
  fri: [2230, 1300],     // där nallen sitter och leker (världen)
  famn: [512, 880],      // i famnen (riggen)
  kudde: [1530, 1292] }; // på kudden (världen)
const KUDDEN = { fil: 'assets/rekvisita/kudde/cut/kudde-v1-ludde.png', b: 867, h: 854, bredd: 440, ligger: 0.55, mitt: [1600, 1336] };
const FLASKA = { fil: 'assets/rekvisita/vallingflaska/cut/vallingflaska-v1.png', b: 496, h: 857, hojd: 270, yta: [48, 410, 400], sjunker: 170, glas: '#E0EEF1' };
const MANEN = [130, 40, 170];   // månen i bilden (står still när kameran glider): [x, y, bredd]
const STJARNOR = [[470, 70, 40], [760, 40, 36], [1000, 150, 40], [880, 520, 34], [60, 560, 38]];
const TEXT_Y = 400;
// En bild per sida: m = punkten i världen, z = zoom, a = var punkten hamnar i bild. kon: z = mitt på kons huvud (liggande: ansiktet).
const SKOTT = [
  { kon: 1.8 },                                   // 1 det här är kon
  { m: [2240, 1210], z: 2.4, a: [540, 1250] },    // 2 och det här är nallen
  { m: [1930, 1150], z: 1.0, a: [540, 1200] },    // 3 de leker
  { m: [1850, 1100], z: 1.0, a: [540, 1200] },    // 4 det blir kväll
  { m: [1930, 1150], z: 1.35, a: [540, 1250] },   // 5 dags att sova
  { m: [2120, 1180], z: 1.6, a: [540, 1250] },    // 6 nej!
  { kon: 1.7 },                                   // 7 välling
  { kon: 2.0 },                                   // 8 sover du? nej!
  { kon: 1.5 },                                   // 9 gungar
  { kon: 2.0 },                                   // 10 sover du? nej!
  { kon: 1.7 },                                   // 11 nynnar
  { kon: 2.1 },                                   // 12 sover du? gääsp
  { m: [1720, 1160], z: 1.35, a: [540, 1250] },   // 13 ner på kudden
  { kon: 1.9 },                                   // 14 nu sover nallen
  { kon: 1.75 },                                  // 15 och kon också
];
const KON_Y = 1120;   // där kons huvud hamnar i närbilderna
const BYT = 2;
const INTRO = bok.INTRO, OUTRO = bok.OUTRO, BOK = { titel: ['Kon nattar', 'nallen'], figur: LIGG.fil, figurY: 1060 };

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const del = (a, b, t) => clamp((t - a) / (b - a));
const inUt = k => k < 0.5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2;
const puckel = (x, c, w) => Math.abs(x - c) < w / 2 ? Math.sin(Math.PI * (x - c + w / 2) / w) ** 2 : 0;
const langd = async fil => {
  const r = await fetch('/' + fil).catch(() => null); if (!r?.ok) return null;
  const b = new DataView(await r.arrayBuffer());
  for (let i = 0; i < b.byteLength - 32; i++) if (b.getUint32(i) === 0x6d766864) {
    const v1 = b.getUint8(i + 4) === 1, o = i + (v1 ? 24 : 16);
    return (v1 ? Number(b.getBigUint64(o + 4)) : b.getUint32(o + 4)) / b.getUint32(o);
  }
  return null;
};

addEventListener('DOMContentLoaded', async () => {
  const render = new URLSearchParams(location.search).has('staende');
  const mapp = decodeURIComponent(location.pathname).replace(/^\//, '').replace(/index\.html$/, '');
  document.head.insertAdjacentHTML('beforeend', `<style>
    html,body{margin:0;height:100%;background:#15182b;font:15px/1.4 system-ui,sans-serif;color:#eee}
    body{display:flex;gap:24px;align-items:center;justify-content:center}
    svg{height:${render ? '100vh' : '96vh'};aspect-ratio:9/16;display:block}
    aside{width:260px} button{font:inherit;padding:8px 14px;margin:0 6px 8px 0;cursor:pointer}
    .zon{display:none} .visa-zon .zon{display:block}</style>`);

  const img = (href, x, y, w, h, extra = '') => `<image href="/${href}" x="${x}" y="${y}" width="${w}" height="${h}" ${extra}/>`;
  const P = PLATS, S = KON.s, [fx, fy] = KON.fot, N = NALLE, L = LIGG, ls = S * L.s;
  const prickOga = (id, j, x, y, s, f = '#1d1d1d') => `<g transform="translate(${x} ${y}) scale(${s})"><ellipse id="${id}-o${j}" rx="5.5" ry="7" fill="${f}"/><path id="${id}-s${j}" d="M-8 -1 Q0 7 8 -1" fill="none" stroke="${f}" stroke-width="3.5" stroke-linecap="round" opacity="0"/></g>`;
  const ansikte = (id, x, y, s, f = '#1d1d1d') => `<g transform="translate(${x} ${y}) scale(${s})">
    ${[-24, 24].map(ox => `<ellipse cx="${ox}" cy="10" rx="7" ry="4.5" fill="#F29AA2" opacity=".55"/>`).join('')}${[-14, 14].map((ox, j) =>
    `<ellipse id="${id}-o${j}" cx="${ox}" rx="5.5" ry="7" fill="${f}"/><circle cx="${ox - 1.8}" cy="-2.6" r="1.6" fill="#fff" class="${id}-glans"/>
     <path id="${id}-s${j}" d="M${ox - 8} -1 Q${ox} 7 ${ox + 8} -1" fill="none" stroke="${f}" stroke-width="3.5" stroke-linecap="round" opacity="0"/>
     <path id="${id}-g${j}" d="M${ox - 7} 3 Q${ox} -6 ${ox + 7} 3" fill="none" stroke="${f}" stroke-width="3.5" stroke-linecap="round" opacity="0"/>`).join('')}
    <path d="M-8 13 Q0 21 8 13" fill="none" stroke="${f}" stroke-width="3.5" stroke-linecap="round"/></g>`;
  // nallen: fötterna i (0, 0), höjd h. Ögonen på ljusa fläckar som i de andra sagorna, och en mun på nosen (Nej!, gäspningen).
  const nalle = (id, h) => `<g id="${id}"><g transform="scale(${h / N.konst}) translate(${-N.b / 2} ${-N.fot})">${img(N.fil, 0, 0, N.b, N.h)}
    <g id="${id}-ansikte"></g></g></g>`;
  const not = i => `<g id="not${i}" opacity="0"><g fill="#F8F2DD" stroke="#F8F2DD" stroke-linecap="round" stroke-width="7">
    <ellipse rx="15" ry="11" transform="rotate(-20)" stroke="none"/><path d="M12 -4 V-62" fill="none"/><path d="M12 -62 Q30 -50 32 -30" fill="none"/></g></g>`;
  const [mx, my, mb] = MANEN, kh = KUDDEN.bredd * KUDDEN.h / KUDDEN.b * KUDDEN.ligger, A = L.arm;
  const platta = `<g transform="scale(${P.s})">${img(P.fil, 0, 0, 1920, 1080)}<rect y="962" width="1920" height="118" fill="${P.gras}"/></g>`;
  document.body.innerHTML = `<svg viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="boil" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence id="boil-brus" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
        <feDisplacementMap in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G"/></filter>
      <filter id="skymning" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0.66 0 0 0 0.08  0 0.6 0 0 0.04  0 0 0.72 0 0.1  0 0 0 1 0"/></filter>
      <filter id="natt" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0.33 0 0 0 0.02  0 0.4 0 0 0.03  0 0 0.62 0 0.1  0 0 0 1 0"/></filter>
      <radialGradient id="manglod"><stop offset="0" stop-color="#FFF1C4" stop-opacity=".5"/><stop offset=".55" stop-color="#FFF1C4" stop-opacity=".18"/><stop offset="1" stop-color="#FFF1C4" stop-opacity="0"/></radialGradient>
      <filter id="ljusare" color-interpolation-filters="sRGB"><feComponentTransfer><feFuncR type="linear" slope="1.12"/><feFuncG type="linear" slope="1.12"/><feFuncB type="linear" slope="1.05"/></feComponentTransfer></filter>
    </defs>
    <rect width="1080" height="1920" fill="#101a4a"/>
    <g id="kamera"><g id="varld">
      <g filter="url(#skymning)">${platta}</g>
      <g id="natten" filter="url(#natt)">${platta}</g>
      <g filter="url(#boil)">
        <g id="kudde" opacity="0">${img(KUDDEN.fil, -KUDDEN.bredd / 2, -kh, KUDDEN.bredd, kh, 'preserveAspectRatio="none"')}</g>
        <g id="ligger" opacity="0"><g transform="translate(${L.ligg[0] - L.fast[0] * ls} ${L.ligg[1] - L.fast[1] * ls}) scale(${ls})">
          ${img(L.fil, 0, 0, 1024, 1024)}
          <g id="lvaken">${L.ogon.map(([x, y], i) => `<g transform="translate(${x} ${y})"><ellipse rx="34" ry="22" fill="${L.kram}"/>
            <g id="loga${i}"><ellipse rx="18" ry="26" fill="#2a1d1a"/><circle cx="-6" cy="-10" r="6" fill="#fff"/></g></g>`).join('')}</g>
          <g id="klapparm"><g id="klapparm-vrid">${img(A.fil, -A.vrid[0], -A.vrid[1], 1024, 1024)}</g></g>
        </g></g>
        <g id="kon"><g id="figur"></g></g>
        <g id="nalleV-flytt" opacity="0">${nalle('nalleV', N.hojd * S)}</g>
        <g id="noter">${[0, 1, 2, 3, 4].map(not).join('')}</g>
      </g>
    </g></g>
    <g id="himmel" opacity="0">
      <g filter="url(#boil)">
        <g id="manen-g"><circle cx="${mx}" cy="${my + mb * 0.55}" r="${mb * 1.05}" fill="url(#manglod)"/>
        <g id="mane">${img(SAKER + '/mane.png', mx - mb / 2, my, mb, mb * 325 / 300, 'filter="url(#ljusare)"')}${ansikte('mf', mx - 22, my + mb * 0.48, 0.9)}</g></g>
        <g id="stjarnor">${STJARNOR.map(([x, y, w], i) => `<g transform="translate(${x} ${y})"><g id="stjarna${i}">${img(SAKER + '/stjarna.png', -w / 2, -w / 2, w, w * 797 / 823)}</g></g>`).join('')}</g>
      </g>
    </g>
    <text id="text" x="540" text-anchor="middle" fill="#F8F2DD" stroke="#0b1236" stroke-width="12" stroke-opacity=".55" stroke-linejoin="round" paint-order="stroke" font-family="Fredoka" font-weight="600" font-size="72"></text>
    ${bok.svg(BOK)}
    <rect id="morker" width="1080" height="1920" fill="#000" opacity="0"/>
    <g class="zon"><rect y="1440" width="1080" height="480" fill="#e5302a" opacity=".15"/></g>
  </svg>`;
  const $ = id => document.getElementById(id);
  const KAJSA = await v2rigg('kon-kajsa'), ko = KAJSA.figur(fx, fy, S, $('figur')), blinka = skapaBlinka(14), FOTTER = KAJSA.FOTTER;
  ko.querySelector('.skugga').setAttribute('opacity', 0.1);
  // nallen i famnen: i riggen, mellan kroppen och -fram-armarna. Flaskan i riggens ruta men utanför .figuren.
  ko.querySelector('.kropp').insertAdjacentHTML('afterend', `<g id="nalleR-flytt">${nalle('nalleR', N.hojd)}</g>`);
  ko.insertAdjacentHTML('beforeend', `<g id="flaska" opacity="0"><g id="flaska-rorelse">
    <g transform="scale(${FLASKA.hojd / FLASKA.h}) translate(${-FLASKA.b / 2} -18)">${img(FLASKA.fil, 0, 0, FLASKA.b, FLASKA.h)}
      <rect id="flaska-tom" x="${FLASKA.yta[0]}" y="${FLASKA.yta[1]}" width="${FLASKA.yta[2]}" height="0" rx="18" fill="${FLASKA.glas}"/></g></g></g>`);
  // vita kanter (vita-kanter): plattan är bakgrund; riggen (med nallen i famnen) som en helhet; sovbilden har kanten i bilden;
  // nallen i världen, kudden, flaskan och månen får hela regeln; bokens bilder har sin egen
  const K = window.kant;
  K?.lagg(ko.querySelector('.figuren'));
  for (const id of ['nalleV', 'kudde', 'flaska', 'mane']) K?.lagg($(id), { andel: 0.01 });
  STJARNOR.forEach((_, i) => K?.lagg($('stjarna' + i)));
  const MUN = await fetch('/' + mapp + 'mun.json').then(r => r.json()).catch(() => ({}));

  const las = await Promise.all(SIDOR.map((_, i) => langd(`${mapp}sida-${i + 1}.m4a`)));
  let t = INTRO;
  const T = SIDOR.map(([rader, sek], i) => { const t0 = t; t += las[i] ? Math.max(MIN_SIDA, las[i] + 5) : sek; return { t0, t1: t, rader }; });
  const DURATION = t + OUTRO, SIST = T.length - 1;
  const sida = (n, tt) => del(T[n].t0 + 1, T[n].t1 - 1, tt);
  const pa = (n, k) => lerp(T[n].t0 + 1, T[n].t1 - 1, k);
  const sidaNr = tt => { const i = T.findIndex(p => tt < p.t1); return i === -1 ? SIST : Math.max(0, i); };
  const kurva = (arr, x) => { const i = Math.floor(x * 30), v = j => (j >= 0 && arr?.[j]) || 0; return (v(i - 1) + 2 * v(i) + v(i + 1)) / 4; };
  const iRigg = ([x, y]) => [(x - fx) / S + 512, (y - fy) / S + FOTTER];   // världen → riggens ruta

  // sidornas rörelser (andel av sidan)
  const NEJ = [0.5, 0.85];   // när nallen säger/skakar "Nej!" på omkvädessidorna (efter frågan)
  const VALL = { hopp: [0.02, 0.24], in: [0.24, 0.32], dricker: [0.34, 0.7], ut: [0.82, 0.97] };   // sida 7: upp i famnen, välling
  const NOTER = [0.08, 0.24, 0.4, 0.56, 0.72];   // sida 11
  const GASP = [0.48, 0.86];   // sida 12: nallen gäspar
  const LAGG = { kudde: [0, 0.18], ner: [0.12, 0.3], flytt: [0.2, 0.48], byt: 0.48, ut: [0.5, 0.66], in: [0.6, 0.82] };   // sida 13
  const KLAPP = [0.3, 0.55];   // sida 14: kon klappar nallen när den somnar
  const BLUND = { nalle: 0.12, kon: 0.15, mane: 0.4 };

  // gungandet: sida 9 vaggar kon kring fötterna, stannar när hon frågar (sida 10), lite igen när hon nynnar (sida 11)
  const ramp = (n, tt) => inUt(del(T[n].t0 + 0.3, T[n].t0 + 1.8, tt));
  const gungA = tt => 4.5 * ramp(S_.gungar, tt) - 4.5 * ramp(S_.fraga2, tt) + 2.5 * ramp(S_.nynnar, tt) - 2.5 * ramp(S_.fraga3, tt);
  const gung = tt => gungA(tt) * Math.sin(2 * Math.PI * (tt - T[S_.gungar].t0) / 3.4);

  // var nallen är: sitter och leker i gräset (världen), hoppar upp i famnen (sida 7), i famnen, flyttas till kudden (sida 13)
  const nallePlats = tt => {
    const n = sidaNr(tt), k7 = sida(S_.valling, tt), k13 = sida(S_.kudde, tt);
    if (k13 >= LAGG.byt) return { var: 'v', pos: N.kudde, rot: 0 };
    const backar = 40 * inUt(del(0.5, 0.75, sida(S_.nej, tt)));   // "Nej!": hoppar en bit bakåt
    const fri = iRigg([N.fri[0] + backar, N.fri[1]]), famn = N.famn, kud = iRigg(N.kudde);
    if (k13 > LAGG.flytt[0]) { const k = inUt(del(...LAGG.flytt, k13));
      return { var: 'r', pos: [lerp(famn[0], kud[0], k), lerp(famn[1], kud[1], k) - 140 * Math.sin(Math.PI * k)], rot: -6 * Math.sin(Math.PI * k) }; }
    const hk = del(...VALL.hopp, k7);
    if (hk >= 1) {   // i famnen: skakar på sig på "Nej!"
      const skak = FRAGOR.slice(0, 2).includes(n) ? 11 * Math.sin(2 * Math.PI * tt * 2.4) * Math.sin(Math.PI * del(...NEJ, sida(n, tt))) : 0;
      return { var: 'r', pos: famn, rot: skak }; }
    if (hk > 0) { const k = inUt(hk); return { var: 'r', pos: [lerp(fri[0], famn[0], k), lerp(fri[1], famn[1], k) - 260 * Math.sin(Math.PI * hk)], rot: -10 * Math.sin(Math.PI * hk) }; }
    // sida 2: två små hej-hopp; sida 3: leker, hoppar fram och tillbaka; sida 6: skakar på sig och hoppar bakåt
    const kn = sida(n, tt), fas = (tt % 1.1) / 1.1;
    const hopp = n === S_.nalle && kn > 0.15 && kn < 0.6 ? Math.sin(Math.PI * fas) : n === S_.lekt ? Math.sin(Math.PI * fas) : n === S_.nej ? 0.6 * Math.sin(Math.PI * del(0.5, 0.75, kn)) : 0;
    const sx = n === S_.lekt ? 150 * Math.sin(2 * Math.PI * (tt - T[S_.lekt].t0) / 4) * inUt(del(0, 0.2, kn)) * (1 - inUt(del(0.8, 1, kn))) : 0;
    const skak = n === S_.nej ? 11 * Math.sin(2 * Math.PI * tt * 2.4) * Math.sin(Math.PI * del(...NEJ, kn)) : 0;
    return { var: 'r', pos: [fri[0] + sx / S, fri[1] - 70 * hopp / S], rot: skak + 6 * hopp * Math.sin(2 * Math.PI * tt / 4.4) };
  };
  const liggIn = tt => inUt(del(...LAGG.in, sida(S_.kudde, tt)));
  const huvud = tt => { const k = liggIn(tt), st = [fx, fy + (430 - FOTTER) * S], li = [L.ligg[0] + (L.ansikte[0] - L.fast[0]) * ls, L.ligg[1] + (L.ansikte[1] - L.fast[1]) * ls];
    return [lerp(st[0], li[0] - 60, k), lerp(st[1], li[1] - 40, k)]; };

  const vy = (j, tt) => {
    const s = SKOTT[j]; let Z, tx, ty;
    if (s.kon) { const [hx, hy] = huvud(tt); Z = s.kon; tx = 540 - Z * hx; ty = KON_Y - Z * hy; }
    else { Z = s.z; tx = s.a[0] - Z * s.m[0]; ty = s.a[1] - Z * s.m[1]; }
    tx = clamp(tx, 1080 - Z * P.b, 0); ty = clamp(ty, 1920 - Z * 1920, 0);
    return [(540 - tx) / Z, (960 - ty) / Z, Z];
  };
  const kamera = (n, tt) => {
    const b = vy(n, tt), a = n === 0 ? b : vy(n - 1, tt), k = inUt(del(T[n].t0, T[n].t0 + BYT, tt));
    const Z = Math.exp(lerp(Math.log(a[2]), Math.log(b[2]), k)), cx = lerp(a[0], b[0], k), cy = lerp(a[1], b[1], k);
    return [540 - Z * cx, 960 - Z * cy, Z];
  };
  const ogon = (id, o) => { for (const j of [0, 1]) { $(`${id}-o${j}`).setAttribute('ry', 7 * Math.max(0.08, o)); $(`${id}-o${j}`).setAttribute('opacity', o > 0.15 ? 1 : 0);
    $(`${id}-s${j}`).setAttribute('opacity', o > 0.15 ? 0 : 1); } };
  const blink = (tt, off, per = 5.5) => ((tt + off) % per) < 0.16;

  function rita(tt) {
    $('boil-brus').setAttribute('seed', Math.floor(tt * 8) % 50 + 1);
    const n = sidaNr(tt), p = T[n], kn = sida(n, tt);
    const lh = 100, y0 = TEXT_Y - (p.rader.length - 1) * lh / 2;
    if ($('text').dataset.n !== '' + n) { $('text').dataset.n = n; $('text').innerHTML = p.rader.map((r, i) => `<tspan x="540" y="${y0 + i * lh}">${r}</tspan>`).join(''); }
    $('text').setAttribute('opacity', Math.min(del(p.t0 + 0.3, p.t0 + 1.5, tt), n === SIST ? 1 : 1 - del(p.t1 - 1.2, p.t1, tt)));

    // --- kvällen (sida 4): skymningen mörknar till natt, månen och stjärnorna tänds
    const kvall = inUt(del(0.05, 0.6, sida(S_.kvall, tt)));
    $('natten').setAttribute('opacity', kvall);
    $('himmel').setAttribute('opacity', kvall);

    const k7 = sida(S_.valling, tt), k11 = sida(S_.nynnar, tt), k12 = sida(S_.fraga3, tt), k13 = sida(S_.kudde, tt), k14 = sida(S_.nallenSover, tt), kS = sida(SIST, tt);
    const fraga = FRAGOR.includes(n) || n === S_.nej;
    // --- nallen
    const np = nallePlats(tt);
    const nGap = n === S_.fraga3 ? inUt(del(GASP[0], GASP[0] + 0.1, kn)) * (1 - inUt(del(GASP[1] - 0.1, GASP[1], kn))) : 0;
    const nNej = fraga && n !== S_.fraga3 ? 0.55 * puckel(kn, NEJ[0] + 0.08, 0.2) : 0;   // munnen på "Nej!"
    const nKlapp = n === S_.nallenSover ? KLAPP.reduce((s, c) => s + puckel(k14, c + 0.03, 0.1), 0) : 0;
    const nAndas = n >= S_.nallenSover ? 0.012 * Math.sin(2 * Math.PI * tt / 5.5) : 0;
    const tryck = 0.05 * nKlapp + nAndas;
    const nTf = ([x, y], rot) => `translate(${x} ${y}) rotate(${rot}) scale(${1 + tryck / 2} ${1 - 0.05 * nKlapp + nAndas})`;
    $('nalleR-flytt').setAttribute('transform', np.var === 'r' ? nTf(np.pos, np.rot) : '');
    $('nalleR-flytt').setAttribute('opacity', np.var === 'r' ? 1 : 0);
    $('nalleV-flytt').setAttribute('opacity', np.var === 'v' ? 1 : 0);
    $('nalleV').setAttribute('transform', nTf(np.pos, 0));
    // nallens ögon: pigga, lite tunga när kon nynnar, sluts i gäspningen, blundar på sida 14
    const nTung = n < S_.nynnar ? 1 : n === S_.nynnar ? lerp(1, 0.55, k11) : 0.5;
    const nOga = n > S_.nallenSover || (n === S_.nallenSover && k14 > BLUND.nalle) ? 0 : nGap > 0.3 ? 0 : nTung * (blink(tt, 1.9, 4.2) ? 0.1 : 1);
    const nMun = Math.max(nGap, nNej), nf = nalleAnsikte(1 - nOga, nMun);
    $('nalleR-ansikte').innerHTML = nf; $('nalleV-ansikte').innerHTML = nf;

    // --- kon stående: pose och ansikte
    $('kon').setAttribute('transform', `rotate(${gung(tt)} ${fx} ${fy})`);
    const k5 = sida(S_.dags, tt), k6 = sida(S_.nej, tt);
    const haller = inUt(del(VALL.hopp[0] + 0.12, VALL.hopp[1] + 0.06, k7)) * (1 - inUt(del(...LAGG.ner, k13)));
    const nar = Math.max(inUt(del(0.15, 0.45, k5)) * (1 - inUt(del(0.15, 0.45, k6))), inUt(del(0, 0.1, k7)) * (1 - inUt(del(0.14, 0.28, k7))));
    const lagger = inUt(del(LAGG.ner[0], LAGG.flytt[1], k13)) * (1 - inUt(del(LAGG.flytt[1], LAGG.ut[1], k13)));
    let po = KAJSA.blandaPose('neutral', 'nar', nar);
    po = KAJSA.blandaPose(po, { ...KAJSA.POSE0, armar: [-70, -70], fram: [1, 1], klapp: 150, upp: -0.35, armY: 70 }, haller);
    if (lagger > 0) po = KAJSA.blandaPose(po, { ...KAJSA.POSE0, rikt: -0.6, upp: -0.8, luta: -4, strack: -0.04, armar: [-10, 10] }, lagger);
    // sida 1: vinkar (höger arm uppe, ut ur kroppen); sida 3: leker, små hopp
    const vinka = n === S_.kon ? inUt(del(0.1, 0.25, kn)) * (1 - inUt(del(0.7, 0.85, kn))) : 0;
    if (vinka > 0) po = { ...po, armar: [po.armar[0], lerp(po.armar[1], 92 + 12 * Math.sin(tt * 7), vinka)] };
    const lek = n === S_.lekt ? inUt(del(0.05, 0.15, kn)) * (1 - inUt(del(0.85, 0.95, kn))) : 0;
    if (lek > 0) { const [, hp] = KAJSA.ROR.hoppa(tt - T[S_.lekt].t0); po = KAJSA.blandaPose(po, { ...hp, lyft: 0.45 * hp.lyft, armar: [hp.armar[0] + 8, hp.armar[1] + 8] }, lek); }
    const nyn = n === S_.nynnar ? NOTER.reduce((s, c) => s + puckel(k11, c + 0.04, 0.12), 0) : 0;
    const andas = 0.008 * Math.sin(2 * Math.PI * tt / 4);
    po = { ...po, strack: po.strack + andas - 0.01 * nyn, bred: po.bred - andas / 2, sank: po.sank + 4 * nyn,
      svans: 6 * Math.sin(tt * 1.3), oron: [po.oron[0] + 4, po.oron[1] + 4] };
    const f = KAJSA.blanda('neutral', 'somnig', n < S_.kvall ? 0 : n < S_.nynnar ? 0.3 : 0.5);
    const glad = (n === S_.kon && kn > 0.1 && kn < 0.85) || n === S_.lekt || (n === S_.dags && kn > 0.1) || (n === S_.valling && k7 > 0.7);
    if (glad) { f.glad = [1, 1]; f.lock = [0, 0]; }
    // blicken: på nallen (höger) när den sitter i gräset, upp mot månen när det blir kväll, ner på nallen i famnen
    f.titt = n === S_.kvall && kn < 0.6 ? [-8, -10] : n >= S_.nalle && n <= S_.nej ? [9, 4] : haller > 0.5 ? [-2, 7] : [0, 0];
    const tal = kurva(MUN[n + 1], tt - p.t0 - 1);
    const om = n === S_.nej || (FRAGOR.includes(n) && kn > NEJ[0]) ? 0 : tal;   // kon pratar inte när nallen svarar
    f.mun = [16 * om, 26 * om, 0, 462];
    f.streck = 1 - del(0.05, 0.25, om);
    f.le = n === S_.nynnar ? 0.5 : f.le;
    KAJSA.rita(ko, blinka(f, tt), po);

    // --- flaskan (sida 7): till nallens nos, vällingen sjunker, bort igen. Den vänds aldrig.
    const fram = inUt(del(...VALL.in, k7)) * (1 - inUt(del(...VALL.ut, k7))), dricker = inUt(del(...VALL.dricker, k7));
    const nNos = [N.famn[0] + (N.mun[0] - N.b / 2) * N.hojd / N.konst, N.famn[1] - (N.fot - N.mun[1]) * N.hojd / N.konst - 4];
    $('flaska').setAttribute('opacity', fram > 0.01 ? clamp(fram * 3) : 0);
    $('flaska').setAttribute('transform', `translate(${nNos[0]} ${nNos[1]})`);
    const suger = k7 > VALL.dricker[0] && k7 < VALL.dricker[1] ? 1 : 0;
    $('flaska-rorelse').setAttribute('transform', `translate(${380 * (1 - fram)} ${4 * Math.sin(2 * Math.PI * tt * 1.6) * suger}) rotate(${-50 * fram})`);
    $('flaska-tom').setAttribute('height', FLASKA.sjunker * dricker);

    // --- kudden, och kon som lägger sig (stående tonas över i liggande)
    const kud = inUt(del(...LAGG.kudde, k13));
    $('kudde').setAttribute('opacity', kud);
    $('kudde').setAttribute('transform', `translate(${KUDDEN.mitt[0]} ${KUDDEN.mitt[1] + 40 * (1 - kud)})`);
    const ut = inUt(del(...LAGG.ut, k13)), in_ = liggIn(tt);
    $('figur').setAttribute('opacity', 1 - ut);
    $('figur').setAttribute('transform', `translate(${fx} ${fy}) scale(1 ${1 - 0.3 * ut}) translate(${-fx} ${-fy})`);
    $('ligger').setAttribute('opacity', in_);
    const [lx, ly] = L.ligg;
    const lAndas = n >= S_.nallenSover ? 0.015 * Math.sin(2 * Math.PI * tt / 5.5) : 0.008 * Math.sin(2 * Math.PI * tt / 4);
    $('ligger').setAttribute('transform', `translate(${lx} ${ly}) scale(${1 - lAndas / 3} ${lerp(0.85, 1, in_) * (1 + lAndas)}) translate(${-lx} ${-ly})`);
    // liggande: öppna ögon tills hon blundar (sida 15); på sida 14 klappar hon nallen
    const lBlund = n === SIST ? inUt(del(BLUND.kon, BLUND.kon + 0.15, kS)) : (blink(tt, 0.6) ? 0.94 : 0);
    for (const i of [0, 1]) $('loga' + i).setAttribute('transform', `scale(1 ${Math.max(0.06, 1 - lBlund)})`);
    $('lvaken').setAttribute('opacity', 1 - del(0.6, 0.92, lBlund));
    const armSyns = n === S_.nallenSover ? inUt(del(0.15, 0.25, k14)) * (1 - inUt(del(0.75, 0.88, k14))) : 0;
    const klappV = KLAPP.reduce((s, c) => s + puckel(k14, c, 0.16), 0);
    $('klapparm').setAttribute('transform', `translate(${A.fast[0]} ${A.fast[1]})`);
    $('klapparm').setAttribute('opacity', armSyns > 0.02 ? 1 : 0);
    $('klapparm-vrid').setAttribute('transform', `rotate(${lerp(-20, 48, armSyns) + 14 * klappV})`);

    // --- noterna (sida 11): stiger från kons mule, vaggar och tonas bort
    const munV = [fx + (510 - 512) * S, fy + (540 - FOTTER) * S];
    NOTER.forEach((c, i) => { const k = del(c, c + 0.32, k11), sv = Math.sin(2 * Math.PI * k * 1.3 + i);
      $('not' + i).setAttribute('transform', `translate(${munV[0] + 70 + 40 * sv + 30 * (i % 2)} ${munV[1] - 40 - 260 * k}) rotate(${12 * sv}) scale(${0.8 + 0.3 * k})`);
      $('not' + i).setAttribute('opacity', n === S_.nynnar && k > 0 && k < 1 ? Math.min(1, 5 * k, 3 * (1 - k)) * 0.95 : 0); });

    // kameran
    const [tx, ty, Z] = kamera(n, tt);
    $('kamera').setAttribute('transform', `translate(${tx} ${ty}) scale(${Z})`);

    // månen: vaknar när det blir kväll och ler, blundar på sista sidan; stjärnorna andas
    const manVaken = sida(S_.kvall, tt) > 0.45 && !(n === SIST && kS > BLUND.mane) ? 1 : 0, manGlad = n === S_.kvall && kn > 0.6;
    const o = manVaken * (blink(tt, 2.1) ? 0.1 : 1), oppna = o > 0.15 && !manGlad;
    for (const j of [0, 1]) { $(`mf-o${j}`).setAttribute('ry', 7 * Math.max(0.08, o)); $(`mf-o${j}`).setAttribute('opacity', oppna ? 1 : 0);
      $(`mf-s${j}`).setAttribute('opacity', o > 0.15 || manGlad ? 0 : 1); $(`mf-g${j}`).setAttribute('opacity', manGlad ? 1 : 0); }
    document.querySelectorAll('.mf-glans').forEach(e => e.setAttribute('opacity', oppna ? 1 : 0));
    $('mane').setAttribute('transform', `translate(${mx} ${my + mb * 0.55}) rotate(${2 * Math.sin(2 * Math.PI * tt / 9)}) scale(${lerp(0.9, 1, kvall)}) translate(${-mx} ${-(my + mb * 0.55)})`);
    STJARNOR.forEach((_, i) => $('stjarna' + i).setAttribute('transform', `scale(${(0.6 + 0.4 * del(0.15 * i, 0.15 * i + 0.4, kvall)) * (1 + 0.06 * Math.sin(2 * Math.PI * (tt / 3.5 + i * 0.37)))})`));

    bok.rita(tt, INTRO, T[SIST].t1);
    $('morker').setAttribute('opacity', inUt(del(DURATION - 1.5, DURATION, tt)));
    K?.uppdatera();
  }

  const ljud = [
    { t: 0, fil: MUSIK, vol: 0.25, loop: true, langd: DURATION, fade: T[SIST].t1 - T[SIST].t0 + OUTRO },
    ...bok.ljud(T[SIST].t1, effekt),
    ...T.map((p, i) => ({ t: p.t0 + 1, fil: las[i] ? `${mapp}sida-${i + 1}.m4a` : null, vol: 2.5, tal: p.rader.join(' ').replace('– ', '') })),
    { t: pa(S_.nalle, 0.2), fil: effekt('hopp-mjuk'), vol: 0.15 },
    { t: pa(S_.kvall, 0.45), fil: effekt('glimt'), vol: 0.6 },
    { t: pa(S_.nej, 0.52), fil: effekt('hopp-mjuk', 2), vol: 0.15 },
    { t: pa(S_.valling, VALL.hopp[0] + 0.02), fil: effekt('hopp-mjuk', 3), vol: 0.18 },
    { t: pa(S_.valling, VALL.hopp[1]), fil: effekt('landa-mjuk'), vol: 0.18 },
    { t: pa(S_.valling, VALL.dricker[0] + 0.1), fil: effekt('slurp'), vol: 0.22 },
    { t: pa(S_.kudde, LAGG.kudde[0]), fil: effekt('swoosh'), vol: 0.12 },
    { t: pa(S_.kudde, LAGG.ut[0]), fil: effekt('prassel-tyg'), vol: 0.3 },
    ...KLAPP.map(c => ({ t: pa(S_.nallenSover, c), fil: effekt('tass-klapp'), vol: 0.1 })),
  ];
  await document.fonts.load('600 72px Fredoka');
  await Promise.all([...document.querySelectorAll('image')].map(i => new Promise(r => { const im = new Image(); im.onload = im.onerror = r; im.src = i.getAttribute('href'); })));
  window.LJUD = ljud.filter(c => c.fil);
  window.DURATION = DURATION;
  window.seek = rita;
  window.ready = true;
  if (render) { rita(0); return; }

  document.body.insertAdjacentHTML('beforeend', `<aside><button id="spela">▶ Spela</button><button id="om">↺ Om</button>
    <div id="tid"></div><label><input type="checkbox" id="zon"> visa YouTube-zonen</label>
    <p style="opacity:.7">Sidor utan inläsning läses av talsyntesen.</p></aside>`);
  const spela = c => {
    if (!c.fil) { const u = new SpeechSynthesisUtterance(c.tal); u.lang = 'sv-SE'; u.rate = 0.75; return speechSynthesis.speak(u); }
    const a = new Audio('/' + c.fil); a.volume = Math.min(1, c.vol * 0.4); a.loop = !!c.loop; a.play();
    if (c.langd) setTimeout(() => a.pause(), c.langd * 1000);
  };
  let start = null, senast = 0;
  const ruta = nu => {
    const tt = start === null ? senast : (nu - start) / 1000;
    if (start !== null) for (const c of ljud) if (c.t > senast - 1e-6 && c.t <= tt) spela(c);
    senast = tt;
    rita(Math.min(tt, DURATION));
    $('tid').textContent = `${tt.toFixed(1)} / ${DURATION.toFixed(1)} s`;
    if (start !== null && tt >= DURATION) start = null;
    requestAnimationFrame(ruta);
  };
  $('spela').onclick = () => { start = performance.now() - senast * 1000; };
  $('om').onclick = () => { speechSynthesis.cancel(); start = performance.now(); senast = -1e-3; };
  $('zon').onchange = e => document.body.classList.toggle('visa-zon', e.target.checked);
  window.hoppa = t => { senast = t; };
  requestAnimationFrame(ruta);
});
</script>
