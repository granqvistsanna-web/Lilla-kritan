<!doctype html>
<meta charset="utf-8">
<title>Godnattsagan – Lejonet Lage</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=block">
<script src="/verktyg/kant.js"></script>
<script src="/verktyg/blinka.js"></script>
<script>
// Godnattsagan: Lejonet Lage (manus.md i samma mapp, regler i format/shorts.md#godnattsagan). 9:16, 1080×1920.
// Åtta sidor på Nattkullen. Varje sida: texten tonas in, Sannas inläsning (sida-N.m4a här) börjar efter 1 s, och sidan
// står kvar inläsningen + 3 s. Saknas filen gäller tiden i manus. En sak rör sig per sida.
// Förhandsvisning: http://127.0.0.1:8765/produktion/youtube/shorts/godnatt/lejonet-lage/ (python3 -m http.server 8765 i repots rot)
// Rendering: node avsnitt/004-bussen-badar/scener/render.mjs produktion/youtube/shorts/godnatt/lejonet-lage --staende
// ponytail: en film, så ingen motor än. Blir det fler godnattsagor: lyft ut allt utom SIDOR till godnatt.js.

const SIDOR = [   // [rader, sekunder om inläsningen saknas]
  [['Det är kväll.', 'Lejonet är trött.'], 9],
  [['Godnatt, måne.'], 9],
  [['Godnatt, stjärnor.'], 9],
  [['Godnatt, moln.'], 9],
  [['Lejonet ska ryta. Rrroar …', 'Nej, det blev visst', 'en gäspning. Gääsp.'], 12],
  [['Lejonet kryper ner', 'i det mjuka gräset.'], 10],
  [['Lejonet blundar.', 'Kan du också blunda?'], 10],
  [['Godnatt, lejon!'], 9],
];
const MUSIK = 'assets/ljud/musik/godnatt-bad-loop.m4a';   // godnatt-bad.m4a med 3 s överton från slutet in i början, så att den går runt
const SAKER = 'assets/bakgrunder/nattkullen-saker';
const effekt = (n, k = 1) => `assets/ljud/effekter/${n}/${n}-${k}.m4a`;
const MIN_SIDA = 8;   // korta sidor ("Godnatt, måne.") får ändå tid för sin rörelse
const STJARNOR = [[150, 200, 60], [420, 110, 46], [330, 300, 42], [560, 430, 40], [975, 520, 52]];   // [x, y, bredd], tindrar i den ordningen
// Lage i art direction v2 (skill lk-figur). Stående = det släta lejonet i premium-v3/ (sedan 2026-11-10; delar i cut/, vridpunkter
// i lage-rigg.json, ansiktet som i uttryck.html, öronen sitter i kroppen). Liggande = premium-v3/cut/lage-ligger.png (Flow, slät, samma ruta som den gamla krit-liggbilden)
// (Google Flow 2026-11-09), med ögon och mun i kod så att han kan blunda på sida 7.
// I bildernas 1024-ruta: konst = punkten mellan fötterna (stående) / under magen (liggande), som står på L.fot.
const KAR = 'assets/karaktarer/lejonet-lage/premium-v3/cut/lage-';
const RIGG = { 'arm-l': [236, 574], 'arm-r': [786, 572], 'tail': [713, 773] };
const LAGE = { fot: [540, 1440],
  star: { s: 0.62, konst: [512, 940], ogon: [[420, 401], [601, 401]], mun: [512, 506], oga: 1 },
  // liggande skalad 0,86 av den stående (som de andra sovbilderna), ligger lite nere i gräset som v1-bilden gjorde;
  // ansiktet uppmätt med ansikte_matt.py ur original/lage-sover-flow.jpg mot lage-ligger-flow.jpg (samma ruta)
  ligger: { s: 0.62 * 0.86, konst: [502, 795], ogon: [[246, 607], [440, 595]], mun: [344, 679], oga: 1.07 } };
const BAKAD = 10;   // riggens och sovbildens inbakade vita kant (1024-px): skalas bort, kant.js lägger en ny runt hela lejonet
const LINJE = '#2a1d1a', MUNLINJE = '#3a2a22', MUNFARG = '#7a2a1c', KIND = '#ec8f96';
const DELA = 960;   // den delade bildens skarv (sida 2–4)
// närbilderna, [mitt x, mitt y, zoom] i världen: det lejonet säger godnatt till, och lejonets ansikte
const NARA = { mane: [790, 282, 2.0], stjarnor: [330, 290, 1.4], moln: [205, 440, 2.3], lejon: [540, 1129, 3.6] };   // lejonet (v2-riggen): tätt på munnen, ögonen precis under skarven

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const del = (a, b, t) => clamp((t - a) / (b - a));
const inUt = k => k < 0.5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2;
// en m4a-fils längd ur mvhd-boxen (samma som i gissa.js), eller null om filen saknas
const langd = async fil => {
  const r = await fetch('/' + fil).catch(() => null); if (!r?.ok) return null;
  const b = new DataView(await r.arrayBuffer());
  for (let i = 0; i < b.byteLength - 32; i++) if (b.getUint32(i) === 0x6d766864) {
    const v1 = b.getUint8(i + 4) === 1, o = i + (v1 ? 24 : 16);
    return (v1 ? Number(b.getBigUint64(o + 4)) : b.getUint32(o + 4)) / b.getUint32(o);
  }
  return null;
};

addEventListener('DOMContentLoaded', async () => {
  const render = new URLSearchParams(location.search).has('staende');
  const mapp = decodeURIComponent(location.pathname).replace(/^\//, '').replace(/index\.html$/, '');
  document.head.insertAdjacentHTML('beforeend', `<style>
    html,body{margin:0;height:100%;background:#15182b;font:15px/1.4 system-ui,sans-serif;color:#eee}
    body{display:flex;gap:24px;align-items:center;justify-content:center}
    svg{height:${render ? '100vh' : '96vh'};aspect-ratio:9/16;display:block}
    aside{width:260px} button{font:inherit;padding:8px 14px;margin:0 6px 8px 0;cursor:pointer}
    .zon{display:none} .visa-zon .zon{display:block}</style>`);

  const img = (href, x, y, w, h, extra = '') => `<image href="/${href}" x="${x}" y="${y}" width="${w}" height="${h}" ${extra}/>`;
  const L = LAGE, [fx, fy] = L.fot;
  // lejonets ansikte i kod, som i premium/uttryck.html: ovala ögon med ett lock som går ner (blinkning, gäspning, sömn) och
  // blir en sluten u-båge, rosa kinder, nosstreck och leende, och en öppen mun (prat och gäspning). Mått i riggens 1024-ruta,
  // på den liggande flyttat till dess ögon och mun och skalat q.oga.
  const lejonAnsikte = (p, q) => q.ogon.map(([x, y], i) => `<g transform="translate(${x} ${y}) scale(${q.oga})">
      <ellipse cx="${i ? 37 : -37}" cy="52" rx="26" ry="16" fill="${KIND}" opacity=".75"/>
      <g id="${p}oga${i}"><clipPath id="${p}lock${i}"><path id="${p}klipp${i}" d="M-40 -27 H40 V60 H-40Z"/></clipPath>
        <g clip-path="url(#${p}lock${i})"><ellipse rx="18" ry="26" fill="${LINJE}"/><circle cx="-6" cy="-10" r="6" fill="#fff"/></g>
        <path id="${p}linje${i}" fill="none" stroke="${LINJE}" stroke-width="6" stroke-linecap="round" opacity="0"/></g>
      <path id="${p}sov${i}" d="M-19 -2 Q0 14 19 -2" fill="none" stroke="${LINJE}" stroke-width="6" stroke-linecap="round" opacity="0"/></g>`).join('') +
    `<g transform="translate(${q.mun[0]} ${q.mun[1]}) scale(${q.oga})"><path id="${p}mun" fill="${MUNFARG}"/>
      <g fill="none" stroke="${MUNLINJE}" stroke-width="6" stroke-linecap="round"><path id="${p}nos" d="M0 -21 L0 0"/>
      <path id="${p}le" d="M-34 -3 Q-17 22 0 0 Q17 22 34 -3"/></g></g>`;
  // munnen öppen: en rund mun under nosen, rx × ry, mitt my (munnens egna enheter, 0 = där nosstrecket slutar)
  const munForm = (rx, ry, my) => { const h = ry * 4 / 3;
    return `M${-rx} ${my} C${-rx} ${my - h} ${rx} ${my - h} ${rx} ${my} C${rx} ${my + h} ${-rx} ${my + h} ${-rx} ${my}Z`; };
  // ansikte i kod på månen, stjärnorna och molnet: två prickögon, stängda bågar och ett litet leende
  const ansikte = (id, x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})">${[-14, 14].map((ox, j) =>
    `<ellipse id="${id}-o${j}" cx="${ox}" rx="5.5" ry="7" fill="#1d1d1d"/><path id="${id}-s${j}" d="M${ox - 8} -1 Q${ox} 7 ${ox + 8} -1" fill="none" stroke="#1d1d1d" stroke-width="3.5" stroke-linecap="round" opacity="0"/>`).join('')}
    <path d="M-8 13 Q0 21 8 13" fill="none" stroke="#1d1d1d" stroke-width="3.5" stroke-linecap="round"/></g>`;
  const placera = q => `translate(${fx - q.konst[0] * q.s} ${fy - q.konst[1] * q.s}) scale(${q.s})`;
  // bort med den inbakade vita kanten: alfa krymps BAKAD (bildens enheter); kant.js lägger sedan en kant runt hela lejonet
  const bit = n => img(KAR + n + '.png', 0, 0, 1024, 1024, `id="${n}"`);
  const star = `<g id="star"><g transform="${placera(L.star)}"><g class="k"><g filter="url(#skala)">
      ${bit('tail')}${bit('leg-l')}${bit('leg-r')}${bit('arm-l')}${bit('arm-r')}${img(KAR + 'body-tom.png', 0, 0, 1024, 1024)}${img(KAR + 'nos.png', 0, 0, 1024, 1024)}
      </g></g>${lejonAnsikte('s', L.star)}</g></g>`;
  const ligger = `<g id="ligger"><g transform="${placera(L.ligger)}"><g class="k"><g filter="url(#skala)">${img(KAR + 'ligger.png', 0, 0, 1024, 1024)}</g></g>
      ${lejonAnsikte('l', L.ligger)}</g></g>`;
  // världen ritas en gång och visas själv (hel bild) eller med <use> i två närbilder (sida 2–4), som i fjarilen-fia.
  // Allt med klass "k" får en vit kant av kant.js (skill vita-kanter).
  document.body.innerHTML = `<svg viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="skala" x="-2%" y="-2%" width="104%" height="104%">
        <feMorphology in="SourceAlpha" operator="erode" radius="${BAKAD}" result="a"/><feComposite in="SourceGraphic" in2="a" operator="in"/></filter>
      <filter id="boil" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence id="boil-brus" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
        <feDisplacementMap in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G"/></filter>
      <clipPath id="klipp-upp"><rect width="1080" height="${DELA}"/></clipPath>
      <clipPath id="klipp-ner"><rect y="${DELA}" width="1080" height="${1920 - DELA}"/></clipPath>
    </defs>
      <g id="varld">
        ${img('assets/bakgrunder/nattkullen/nattkullen.png', 0, 0, 1080, 1920, 'preserveAspectRatio="xMidYMid slice"')}
        <g filter="url(#boil)">
          <g id="mane">${img(SAKER + '/mane.png', 650, 120, 300, 325)}${ansikte('mf', 712, 282, 1.5)}</g>
          ${STJARNOR.map(([x, y, w], i) => `<g transform="translate(${x} ${y})"><g id="stjarna${i}">${img(SAKER + '/stjarna.png', -w / 2, -w / 2, w, w * 797 / 823)}${ansikte('sf' + i, 0, 2, w / 75)}</g></g>`).join('')}
          <g id="moln">${img(SAKER + '/moln.png', 70, 350, 260, 260 * 567 / 845)}${ansikte('cf', 205, 455, 1.3)}</g>
          <g id="andas">
            ${star}
            ${ligger}
          </g>
        </g>
      </g>
    <g id="delad" opacity="0">
      <g clip-path="url(#klipp-upp)"><use href="#varld" id="upp"/></g>
      <g clip-path="url(#klipp-ner)"><use href="#varld" id="ner"/></g>
      <rect y="${DELA - 5}" width="1080" height="10" rx="5" fill="#F8F2DD"/>
    </g>
    <text id="text" x="540" text-anchor="middle" fill="#F8F2DD" font-family="Fredoka" font-weight="600" font-size="64"></text>
    <rect id="morker" width="1080" height="1920" fill="#000" opacity="0"/>
    <g class="zon"><rect y="1440" width="1080" height="480" fill="#e5302a" opacity=".15"/></g>
  </svg>`;
  const $ = id => document.getElementById(id);
  document.querySelectorAll('#varld .k').forEach(g => window.kant?.lagg(g, { andel: 0.01 }));
  const MUN = await fetch('/' + mapp + 'mun.json').then(r => r.json()).catch(() => ({}));   // munrörelsen ur inläsningen, 30 värden per s

  // sidornas tider: inläsningen + 4 s (1 s in, 3 s efter), minst MIN_SIDA, annars tiden i manus
  const las = await Promise.all(SIDOR.map((_, i) => langd(`${mapp}sida-${i + 1}.m4a`)));
  let t = 0;
  const T = SIDOR.map(([rader, sek], i) => { const t0 = t; t += las[i] ? Math.max(MIN_SIDA, las[i] + 4) : sek; return { t0, t1: t, rader }; });
  const DURATION = t + 0.5;

  const BOBO = [1, 2, 4];   // vilken bobo-tagning på sida 2, 3 och 4
  const boTid = n => T[n].t0 + 1 + (las[n] ?? 2) + 0.35;
  const sida = (n, tt) => del(T[n].t0 + 1, T[n].t1 - 1, tt);   // sidans rörelse, 0 → 1
  const kamera = ([cx, cy, z], py) => `translate(${540 - z * cx} ${py - z * cy}) scale(${z})`;
  const blinkS = skapaBlinka(3), blinkL = skapaBlinka(5);
  function rita(tt) {
    $('boil-brus').setAttribute('seed', Math.floor(tt * 8) % 50 + 1);
    const i = T.findIndex(p => tt < p.t1), n = i === -1 ? T.length - 1 : i, p = T[n];
    // delad bild på sida 2–4: in under första sekunden av sida 2, ut under sista sekunden av sida 4
    const delad = inUt(Math.min(del(T[1].t0, T[1].t0 + 1, tt), 1 - del(T[3].t1 - 1, T[3].t1, tt)));
    $('delad').setAttribute('opacity', delad);
    // texten: aktuell sida, in och ut på 1 s; i den delade bilden längst ner i den övre halvan
    const rader = p.rader, lh = 84, y0 = (n >= 1 && n <= 3 ? DELA - 80 : 760) - (rader.length - 1) * lh / 2;
    if ($('text').dataset.n !== String(n)) {
      $('text').dataset.n = n;
      $('text').innerHTML = rader.map((r, i) => `<tspan x="540" y="${y0 + i * lh}">${r}</tspan>`).join('');
    }
    $('text').setAttribute('opacity', Math.min(del(p.t0, p.t0 + 1, tt), n === 7 ? 1 : 1 - del(p.t1 - 1, p.t1, tt)));   // sista texten släcks med mörkret
    // lejonet andas hela tiden, djupare när han sover
    const andas = n === 7 ? 0.015 * Math.sin(2 * Math.PI * (tt - p.t0) / 5.5) : 0.008 * Math.sin(2 * Math.PI * tt / 4);
    $('andas').setAttribute('transform', `translate(${fx} ${fy}) scale(${1 - andas / 2} ${1 + andas}) translate(${-fx} ${-fy})`);
    // 2: månen lyser upp och förblir ljus
    const m = inUt(sida(1, tt));
    $('mane').setAttribute('opacity', lerp(0.6, 1, m));
    $('mane').setAttribute('transform', `translate(800 282) rotate(${2 * Math.sin(2 * Math.PI * tt / 9)}) scale(${lerp(0.97, 1.03, m)}) translate(-800 -282)`);
    // 3: stjärnorna tindrar, en i taget, och förblir ljusa
    const k3 = sida(2, tt);
    STJARNOR.forEach((_, i) => {
      const k = del(i / STJARNOR.length, (i + 1) / STJARNOR.length, k3);
      $('stjarna' + i).setAttribute('opacity', lerp(0.4, 1, inUt(k)));
      $('stjarna' + i).setAttribute('transform', `scale(${1 + 0.22 * Math.sin(Math.PI * k) + 0.05 * inUt(k) * Math.sin(2 * Math.PI * (tt / 3 + i * 0.37))})`);
    });
    // 4: molnet glider sakta åt höger
    const drift = 260 * inUt(sida(3, tt));
    $('moln').setAttribute('transform', `translate(${drift} ${5 * Math.sin(2 * Math.PI * tt / 6)})`);
    // närbilderna: överst det lejonet säger godnatt till (kameran glider vidare under sidans första sekund), nederst lejonets ansikte
    const MAL = [NARA.mane, NARA.stjarnor, [NARA.moln[0] + drift, NARA.moln[1], NARA.moln[2]]];
    const a = Math.min(2, Math.max(0, n - 1)), b = Math.min(2, a + 1), kk = n >= 1 && n < 3 ? inUt(del(T[n + 1].t0, T[n + 1].t0 + 1, tt)) : 0;
    $('upp').setAttribute('transform', kamera(MAL[a].map((v, j) => lerp(v, MAL[b][j], kk)), DELA / 2));
    $('ner').setAttribute('transform', kamera(NARA.lejon, (DELA + 1440) / 2));
    // 5: gäspningen, munnen blir ett stort O och ögonen kniper ihop
    const k5 = sida(4, tt), gap = inUt(del(0.15, 0.45, k5)) * (1 - inUt(del(0.7, 0.95, k5)));
    // sida 2–4: lejonet säger godnatt, munnen följer inläsningen
    // munnen följer ljudstyrkan, utjämnad över tre bildrutor så att den inte fladdrar
    const kurva = (arr, x) => { const i = Math.floor(x * 30), v = j => (j >= 0 && arr?.[j]) || 0; return (v(i - 1) + 2 * v(i) + v(i + 1)) / 4; };
    const env = n >= 1 && n <= 3 ? kurva(MUN[n + 1], tt - p.t0 - 1) : 0;
    // efter repliken säger lejonet "bo bo!" (Nalles röst ur Lilla Kvack, assets/ljud/effekter/bobo), munnen följer med
    const bo = n >= 1 && n <= 3 ? kurva(MUN['bobo-' + BOBO[n - 1]], tt - boTid(n)) : 0;
    // munnen: prat (rund och liten) eller gäspning (stor, som uttrycket gaspar), leendet tonas bort när den öppnas
    const o = Math.min(1, Math.max(env, bo)), oppen = Math.max(o, gap);
    const [rx, ry, my] = gap > o ? [31 * gap, 41 * gap, 32 * gap] : [10 + 6 * o, 20 * o, 20 * o - 2];
    $('smun').setAttribute('d', oppen > 0.03 ? munForm(rx, ry, my) : '');
    const streck = 1 - del(0.05, 0.2, oppen);
    $('sle').setAttribute('opacity', streck); $('snos').setAttribute('d', `M0 -21 L0 ${-14 + 14 * streck}`);
    // gäspningen: armarna upp (som uttrycket gaspar); annars gungar svansen sakta
    const vrid = (id, grader) => $(id).setAttribute('transform', `rotate(${grader} ${RIGG[id][0]} ${RIGG[id][1]})`);
    vrid('arm-l', 34 * gap); vrid('arm-r', -34 * gap);
    vrid('tail', 4 * Math.sin(2 * Math.PI * tt / 5));
    // 6: han kryper ner i gräset: den stående bilden trycks ihop och tonas ut, den liggande tonas in
    const k6 = sida(5, tt);
    const ut = inUt(del(0.15, 0.6, k6)), in_ = inUt(del(0.35, 0.8, k6));
    $('star').setAttribute('opacity', 1 - ut);
    $('star').setAttribute('transform', `translate(${fx} ${fy}) scale(1 ${1 - 0.3 * ut}) translate(${-fx} ${-fy})`);
    $('ligger').setAttribute('opacity', in_);
    $('ligger').setAttribute('transform', `translate(${fx} ${fy}) scale(1 ${lerp(0.85, 1, in_)}) translate(${-fx} ${-fy})`);
    // 7: ögonen sluts långsamt och förblir stängda (locket går ner och blir en sluten u-båge); blinkningar däremellan
    const sov = inUt(sida(6, tt));
    const ogat = (p, i, l) => { const ly = -27 + l * 42, w = 18 * Math.sqrt(Math.max(0, 1 - (ly / 26) ** 2)), stangd = del(0.85, 1, l);
      $(p + 'klipp' + i).setAttribute('d', `M-40 ${ly} H${-w} Q0 ${ly + 8} ${w} ${ly} H40 V60 H-40Z`);
      $(p + 'linje' + i).setAttribute('d', `M${-w} ${ly} Q0 ${ly + 8} ${w} ${ly}`);
      $(p + 'linje' + i).setAttribute('opacity', Math.min(1, l * 8));
      $(p + 'oga' + i).setAttribute('opacity', 1 - stangd); $(p + 'sov' + i).setAttribute('opacity', stangd); };
    for (const [p, l0, b] of [['s', 0.85 * gap, blinkS], ['l', sov, blinkL]]) {
      const l = b({ lock: [l0, l0], ogonS: [1, 1], glad: [0], sov: l0 > 0.5 ? 1 : 0 }, tt).lock[0];
      for (const i of [0, 1]) ogat(p, i, Math.min(1, l));
    }
    const blink = off => ((tt + off) % 5.5) < 0.16;   // månen, stjärnorna och molnet blinkar lugnt var 5,5 s
    // ansiktena: månen och stjärnorna vaknar när de lyser upp, alla somnar med lejonet (sida 7)
    const ogon = (id, vaken, off) => { const o = vaken * (1 - sov) * (blink(off) ? 0.1 : 1);
      for (const j of [0, 1]) { $(`${id}-o${j}`).setAttribute('ry', 7 * Math.max(0.08, o)); $(`${id}-o${j}`).setAttribute('opacity', o > 0.15 ? 1 : 0); $(`${id}-s${j}`).setAttribute('opacity', o > 0.15 ? 0 : 1); } };
    ogon('mf', m > 0.5 ? 1 : 0, 2.1);
    STJARNOR.forEach((_, i) => ogon('sf' + i, del(i / STJARNOR.length, (i + 1) / STJARNOR.length, k3) > 0.5 ? 1 : 0, 0.7 + i * 1.3));
    ogon('cf', 1, 3.6);
    // 8: bilden mörknar till svart
    $('morker').setAttribute('opacity', inUt(del(T[7].t0 + 1, T[7].t1, tt)));
    window.kant?.uppdatera();
  }

  // ljud i render.mjs format: musiken lågt hela vägen och uttonad på sista sidan, inläsningen 1 s in på varje sida
  const ljud = [
    { t: 0, fil: MUSIK, vol: 0.25, loop: true, langd: DURATION, fade: T[7].t1 - T[7].t0 },
    ...T.map((p, i) => ({ t: p.t0 + 1, fil: las[i] ? `${mapp}sida-${i + 1}.m4a` : null, vol: 2.5, tal: p.rader.join(' ') })),
    // effekter, mjuka och låga: månen blänker, stjärnorna plingar en i taget, molnet glider, gräset prasslar
    { t: lerp(T[1].t0 + 1, T[1].t1 - 1, 0.4), fil: effekt('glimt'), vol: 0.6 },
    ...STJARNOR.map((_, i) => ({ t: lerp(T[2].t0 + 1, T[2].t1 - 1, (i + 0.5) / STJARNOR.length), fil: effekt('ding', i % 4 + 1), vol: 0.3 })),
    { t: T[3].t0 + 1, fil: effekt('swoosh'), vol: 0.25 },
    ...BOBO.map((k, i) => ({ t: boTid(i + 1), fil: effekt('bobo', k), vol: 1.6 })),
    { t: T[5].t0 + 1, fil: 'produktion/sfx/new/leaves-3.mp3', vol: 0.5, langd: T[5].t1 - T[5].t0 - 2, fade: 1 },
  ];
  await document.fonts.load('600 64px Fredoka');
  await Promise.all([...document.querySelectorAll('image')].map(i => new Promise(r => { const im = new Image(); im.onload = im.onerror = r; im.src = i.getAttribute('href'); })));
  window.LJUD = ljud.filter(c => c.fil);
  window.DURATION = DURATION;
  window.seek = rita;
  window.ready = true;   // render.mjs väntar på den
  if (render) { rita(0); return; }

  // ---------- förhandsvisningen (som i gissa.js) ----------
  document.body.insertAdjacentHTML('beforeend', `<aside><button id="spela">▶ Spela</button><button id="om">↺ Om</button>
    <div id="tid"></div><label><input type="checkbox" id="zon"> visa YouTube-zonen</label>
    <p style="opacity:.7">Sidor utan inläsning läses av talsyntesen.</p></aside>`);
  const spela = c => {
    if (!c.fil) { const u = new SpeechSynthesisUtterance(c.tal); u.lang = 'sv-SE'; u.rate = 0.75; return speechSynthesis.speak(u); }
    const a = new Audio('/' + c.fil); a.volume = Math.min(1, c.vol * 0.4); a.loop = !!c.loop; a.play();
    if (c.langd) setTimeout(() => a.pause(), c.langd * 1000);
  };
  let start = null, senast = 0;
  const ruta = nu => {
    const tt = start === null ? senast : (nu - start) / 1000;
    if (start !== null) for (const c of ljud) if (c.t > senast - 1e-6 && c.t <= tt) spela(c);
    senast = tt;
    rita(Math.min(tt, DURATION));
    $('tid').textContent = `${tt.toFixed(1)} / ${DURATION.toFixed(1)} s`;
    if (start !== null && tt >= DURATION) start = null;
    requestAnimationFrame(ruta);
  };
  $('spela').onclick = () => { start = performance.now() - senast * 1000; };
  $('om').onclick = () => { speechSynthesis.cancel(); start = performance.now(); senast = -1e-3; };
  $('zon').onchange = e => document.body.classList.toggle('visa-zon', e.target.checked);
  window.hoppa = t => { senast = t; };
  requestAnimationFrame(ruta);
});
</script>
