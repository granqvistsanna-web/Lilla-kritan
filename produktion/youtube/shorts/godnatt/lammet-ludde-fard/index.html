  for (let i = 0; i <= n; i++) { const a = 2 * Math.PI * i / n - Math.PI / 2, x = (r * Math.cos(a)).toFixed(1), y = (r * Math.sin(a)).toFixed(1);
    if (!i) { d = `M${x} ${y}`; continue; } const m = a - Math.PI / n, R = r + 2 * b; d += ` Q${(R * Math.cos(m)).toFixed(1)} ${(R * Math.sin(m)).toFixed(1)} ${x} ${y}`; }

const del = (a, b, t) => clamp((t - a) / (b - a));
const inUt = k => k < 0.5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2;
const langd = async fil => {
  const r = await fetch('/' + fil).catch(() => null); if (!r?.ok) return null;
  const b = new DataView(await r.arrayBuffer());
  for (let i = 0; i < b.byteLength - 32; i++) if (b.getUint32(i) === 0x6d766864) {
    const v1 = b.getUint8(i + 4) === 1, o = i + (v1 ? 24 : 16);
    return (v1 ? Number(b.getBigUint64(o + 4)) : b.getUint32(o + 4)) / b.getUint32(o);
  }
  return null;
};

  // himlens bakgrund under världen: världens himmel är nattfärgad badplatsen, så den svarta rutan syns bara utanför bilden
  const $ = id => document.getElementById(id);
  // det stående lammet: v2-riggen (delarna har inbakad vit kant), fötterna i #lamm:s origo
  const LUDDE = await v2rigg('lammet-ludde'), lamm = LUDDE.figur(0, 0, L.s, $('star')), blinka = skapaBlinka(9);
  // vita kanter (skill vita-kanter): alla klippta saker får grundkanten ovanpå bildens egen; badplatsen och rummet är bakgrunder och får ingen, bubblorna är redan vita skivor
  // v2-riggen får kanten som en helhet (inga skarvar mellan delarna), sovbilden har ingen inbakad kant
  document.querySelectorAll('image').forEach(im => { if (![PLATS.fil, RUM.fil].some(f => im.getAttribute('href') === '/' + f) && !im.closest('#bubblor') && !im.closest('#star')) window.kant?.lagg(im, im.getAttribute('href').includes('ludde-sover') ? { andel: 0.01 } : {}); });
  window.kant?.lagg(lamm.querySelector('.figuren'));
  const MUN = await fetch('/' + mapp + 'mun.json').then(r => r.json()).catch(() => ({}));

  const las = await Promise.all(SIDOR.map((_, i) => langd(`${mapp}sida-${i + 1}.m4a`)));
  let t = INTRO;
  const T = SIDOR.map(([rader, sek], i) => { const t0 = t;
    if (TAKTER[i] && las[i]) {   // takt för takt: { t = när takten börjar i filmen, fran = var i inläsningen, len, paus, text }
      let s = t0 + 1; const takt = TAKTER[i].map(([a, b, paus, text], j) => { const k = { t: s, fran: a, len: b - a, paus, text: text ?? rader[j] }; s += b - a + paus; return k; });
      t = s + 1; return { t0, t1: t, rader, takt };
    }
    t += las[i] ? Math.max(MIN_SIDA, las[i] + 6) : sek; return { t0, t1: t, rader }; });
  const taktNu = (p, tt) => p.takt ? Math.max(0, p.takt.findLastIndex(b => tt >= b.t - 0.2)) : 0;   // vilken takt som pågår
  const talSlut = n => T[n].takt ? T[n].takt.at(-1).t + T[n].takt.at(-1).len : T[n].t0 + 1 + (las[n] ?? 0);   // när berättaren tystnar
  const ga = n => { const b = T[n].takt[0], d = b.len + b.paus; return [b.t + 0.15 * d, b.t + 0.9 * d]; };   // när lammet går (första takten)
  const bubTid = i => T[9].takt[i].t + 0.1;   // bubblorna kommer på sin takt
  const DURATION = t + OUTRO, SIST = T.length - 1;
  const sida = (n, tt) => del(T[n].t0 + 1, T[n].t1 - 1, tt);
  const kurva = (arr, x) => { const i = Math.floor(x * 30), v = j => (j >= 0 && arr?.[j]) || 0; return (v(i - 1) + 2 * v(i) + v(i + 1)) / 4; };
  const camX = x => clamp(x, 540, P.b - 540);

  // lammets väg: [sida, från, till]; tripp-tripp med lugna små hopp (fyra per sträcka)
  const VAG = [[4, 'sand', 'vatten'], [5, 'vatten', 'trad'], [6, 'dorr', 'hem']];   // sida 7: in i rummet
  const HOPP = 4;
  const lammPlats = tt => {
    let [x, y] = STOPP.sand, hopp = 0;
    for (const [n, a, b] of VAG) {
      const k = del(...ga(n), tt);
      if (k > 0) { const e = inUt(k); x = lerp(STOPP[a][0], STOPP[b][0], e); y = lerp(STOPP[a][1], STOPP[b][1], e); hopp = k < 1 ? Math.abs(Math.sin(Math.PI * HOPP * k)) : 0; }
    }
    return [x, y, hopp];
  };

  // kameran: en bild per sida (SKOTT), alltid inom sin plats. I början av sidan glider den lugnt dit från förra sidans bild
  // (mitten och zoomen glider), utom in i rummet, som är en annan plats.
  const vy = (j, tt) => {   // sidan j:s bild: mitten i världen och zoomen
    const s = SKOTT[j]; let Z, tx, ty;
    if (s.folj) { const [lx, ly] = lammPlats(tt); Z = FOLJ_Z; tx = 540 - Z * lx; ty = 1150 - Z * (ly - 150); }
    else { Z = s.z; tx = s.a[0] - Z * s.m[0]; ty = s.a[1] - Z * s.m[1]; }
    if (j >= 6) { tx = clamp(tx, 1080 - Z * (RUM.x + 1080), -Z * RUM.x); ty = clamp(ty, 1920 - Z * 1920, 0); }   // aldrig utanför rummet
    else { tx = clamp(tx, 1080 - Z * P.b, 0); ty = clamp(ty, 1920 - Z * 1960, -Z * P.y); }   // aldrig utanför badplatsens bild
    return [(540 - tx) / Z, (960 - ty) / Z, Z];
  };
  const kamera = (n, tt) => {
    const b = vy(n, tt), a = n === 0 || n === 6 ? b : vy(n - 1, tt), k = inUt(del(T[n].t0, T[n].t0 + BYT, tt));
    const Z = Math.exp(lerp(Math.log(a[2]), Math.log(b[2]), k)), cx = lerp(a[0], b[0], k), cy = lerp(a[1], b[1], k);
    return [540 - Z * cx, 960 - Z * cy, Z];
  };

  function rita(tt) {
    $('boil-brus').setAttribute('seed', Math.floor(tt * 8) % 50 + 1);
    const i = T.findIndex(p => tt < p.t1), n = i === -1 ? SIST : i, p = T[n];
    // texten
    const jt = EN_I_TAGET.includes(n) && p.takt ? taktNu(p, tt) : -1, rader = jt >= 0 ? [p.rader[jt]] : p.rader, lh = 90, y0 = TEXT_Y - (rader.length - 1) * lh / 2;
    if ($('text').dataset.n !== n + ':' + jt) { $('text').dataset.n = n + ':' + jt; $('text').innerHTML = rader.map((r, i) => `<tspan x="540" y="${y0 + i * lh}">${r}</tspan>`).join(''); }
    let textOp = Math.min(del(p.t0 + 0.3, p.t0 + 1.8, tt), n === SIST ? 1 : 1 - del(p.t1 - 1.5, p.t1, tt));
    if (jt >= 0) { const b = p.takt[jt], nasta = p.takt[jt + 1];   // en mening i taget: tonas ut före nästa takt och in på sin
      if (jt > 0) textOp = Math.min(textOp, del(b.t - 0.2, b.t + 0.5, tt));
      if (nasta) textOp = Math.min(textOp, 1 - del(nasta.t - 0.9, nasta.t - 0.3, tt)); }
    $('text').setAttribute('opacity', textOp);

    // lammet: var det är, om det står eller ligger
    const [lx, ly, hopp] = lammPlats(tt);
    const k2 = sida(1, tt), k9 = sida(8, tt);
    const upp = inUt(del(0.7, 0.95, k2)), ner = inUt(del(0.15, 0.6, k9));   // reser sig i slutet av sida 2, lägger sig på sida 9
    const ligger = 1 - upp + ner;
    const kittel = n <= 1 ? 6 * Math.sin(2 * Math.PI * tt * 3) * del(0.05, 0.2, k2) * (1 - del(0.55, 0.7, k2)) : 0;   // sanden kittlar: lammet vickar
    $('lamm').setAttribute('transform', `translate(${lx + kittel} ${ly - 45 * hopp})`);
    const andas = n === SIST ? 0.015 * Math.sin(2 * Math.PI * (tt - p.t0) / 5.5) : 0.008 * Math.sin(2 * Math.PI * tt / 4);
    $('andas').setAttribute('transform', `scale(${1 - andas / 2} ${1 + andas})`);
    $('star').setAttribute('opacity', clamp(1 - ligger));
    $('ligger').setAttribute('opacity', clamp(ligger));

    // kameran (se kamera ovan); mjuk toning bara när lammet går in i rummet (sida 6 → 7)
    const iRum = n >= 6, [tx, ty, Z] = kamera(n, tt);
    $('kamera').setAttribute('transform', `translate(${tx} ${ty}) scale(${Z})`);
    $('blad').setAttribute('opacity', inUt(n === 5 ? del(p.t1 - BLAD, p.t1, tt) : n === 6 ? 1 - del(p.t0, p.t0 + BLAD, tt) : 0));

    // munnen: sida 3 följer inläsningen, sida 8 gäspar
    const k8 = sida(7, tt), gap = inUt(del(0.08, 0.3, k8)) * (1 - inUt(del(0.5, 0.7, k8)));
    const env = n === 2 ? kurva(MUN['3'], tt - p.t0 - 1) : 0;
    const baa = BAA.reduce((m, [sid, k]) => { const a = talSlut(sid) + 0.4, [, d] = BAA_FIL[k];
      return Math.max(m, 0.75 * Math.sin(Math.PI * del(a - 0.05, a + d, tt))); }, 0);
    const mun = Math.max(env, baa);

    // ögonen och blicken, sida för sida: sömnig i sanden, fnissar när det kittlar, tittar upp på månen och på flaskan,
    // ser dit det går och på det det säger godnatt till, ler med ögonen när det bräker, tunga lock på kudden
    const blink = off => ((tt + off) % 5.5) < 0.16;
    const kS = sida(SIST, tt), sov = inUt(del(0, 0.3, kS)), kn = sida(n, tt);
    let u = { oppen: 1, titt: [0, 0] };
    if (n === 0) u = { oppen: 0.6, titt: [0.3, 0.3] };
    if (n === 1) u = kn > 0.05 && kn < 0.55 ? { lage: 'glad' } : { oppen: 0.85 };   // kittel, kittel
    if (n === 2) u = kn > 0.6 && kn < 0.9 ? { lage: 'glad' } : { titt: [0.55, -1] };   // upp mot månen, ler efter godnatt
    if (n === 3) u = kn > 0.42 && kn < 0.62 ? { lage: 'glad' } : { titt: kn < 0.42 ? [0.75, 0.45] : [0, 0] };   // på flaskan; mmm
    const ler = m => { const b = T[m].takt[2]; return n === m && tt > b.t + b.len + 0.4 && tt < b.t + b.len + 2; };   // ler efter godnatt-takten
    const steg = VAG.find(([v]) => v === n);
    if (steg) { const dx = STOPP[steg[2]][0] - STOPP[steg[1]][0], mot = n === 4 ? [0.8, 0.5] : n === 5 ? [-0.5, -0.9] : [0, 0];
      u = tt < ga(n)[1] ? { titt: [Math.sign(dx) * 0.8, 0] } : n < 6 ? (ler(n) ? { lage: 'glad' } : { titt: mot }) : { titt: [0, 0] }; }   // dit det går, sen på vattnet / trädet, ler efter godnatt
    if (n === 7) u = gap > 0.6 ? { lage: 'sov' } : { oppen: 0.8 };
    if (n === 8) u = { oppen: lerp(0.7, 0.45, inUt(kn)) };
    const bubN = n === 9 ? BUBBLOR.filter((_, i) => tt >= bubTid(i)).length : 0;   // hur många bubblor som syns
    if (n === 9) u = bubN ? { oppen: 0.6, titt: [(BUBBLOR[bubN - 1].c[0] - 470) / 420, -1] } : { oppen: 0.45 };   // tittar på bubblan som kom
    if (n === SIST) u = sov > 0.5 ? { lage: 'sov' } : { oppen: 0.35 * (1 - sov) };
    if (baa > 0.15) u = { lage: 'glad' };   // bää!
    // det stående lammet (v2-riggen): ögonläget blir lock / glada bågar / slutna bågar och blicken, munnen öppnas efter
    // inläsningen och bräkandet, gäspningen är ett stort O; öronen hänger lugnt, svansen vickar. På vägen (sida 5–7): riktnings-
    // posen åt det håll det går med gångens armar och ben (uttryck.html, variant B), i takt med de små hoppen.
    const lage = u.lage ?? 'oppen', oppen = clamp(u.oppen ?? 1), titt = u.titt ?? [0, 0], om = Math.min(1.2, mun);
    const f = LUDDE.param('neutral');
    f.glad = lage === 'glad' ? [1, 1] : [0, 0];
    f.sov = lage === 'sov' || oppen < 0.12 || gap > 0.6 ? 1 : 0;
    f.lock = [0.9 * (1 - oppen), 0.9 * (1 - oppen)];
    f.titt = [11 * titt[0], 9 * titt[1]];
    f.kind = lage === 'glad' ? 1 : 0.75;
    f.mun = [8 + 6 * om + 8 * gap, 15 * om + 24 * gap, 0.2, 464 + 4 * gap];
    f.streck = 1 - del(0.05, 0.25, Math.max(om, gap));
    const ve = VAG.find(([v]) => v === n), kg = ve ? del(...ga(n), tt) : 0, gang = kg > 0 && kg < 1 ? Math.min(1, kg / 0.08, (1 - kg) / 0.08) : 0;
    const sida_ = ve ? Math.sign(STOPP[ve[2]][0] - STOPP[ve[1]][0]) : 0, sving = Math.cos(Math.PI * HOPP * kg) * gang;
    const ora = 8 * sving;
    f.oron = [4 + 1.5 * Math.sin(tt * 0.9) + ora, 4 - 1.5 * Math.sin(tt * 0.9) + ora];
    const po = { ...LUDDE.POSE0, rikt: sida_ * gang, gang, sving, luta: 3 * sving, ben: [10 * sving, 10 * sving],
      benY: [-24 * hopp * gang, -24 * hopp * gang], svans: 3 * Math.sin(tt * 3) + 8 * sving };
    LUDDE.rita(lamm, blinka(f, tt), po);
    // det liggande lammet: v2-ögon på ullfläcken, locket trycker ihop ögat, glada bågar, slutna = bildens egna
    const lo = lage === 'oppen' && blink(0) ? 0 : oppen;
    for (const j of [0, 1]) {
      $('loga' + j).setAttribute('transform', `translate(${6 * titt[0]} ${5 * titt[1]}) scale(0.9 ${0.9 * Math.max(0.06, lo)})`);
      $('loga' + j).setAttribute('opacity', lage === 'glad' ? 0 : 1);
      $('loga' + j + '-glad').setAttribute('opacity', lage === 'glad' ? 1 : 0);
    }
    $('lvaken').setAttribute('opacity', lage === 'sov' || lo < 0.12 ? 0 : 1);   // under ullfläcken: bildens slutna ögon

    // ansiktena: månen vaknar på sida 3, vattnet på sida 5, trädet på sida 6; nallen är vaken.
    // Vattnet och trädet somnar när kameran glider förbi på sida 10, månen och nallen med lammet.
    const ogon = (id, vaken, off, glad = false) => { const o = vaken * (blink(off) ? 0.1 : 1), oppna = o > 0.15 && !glad;
      for (const j of [0, 1]) { $(`${id}-o${j}`).setAttribute('ry', 7 * Math.max(0.08, o)); $(`${id}-o${j}`).setAttribute('opacity', oppna ? 1 : 0);
        $(`${id}-s${j}`).setAttribute('opacity', o > 0.15 || glad ? 0 : 1); $(`${id}-g${j}`).setAttribute('opacity', glad && vaken ? 1 : 0); }
      document.querySelectorAll(`.${id}-glans`).forEach(e => e.setAttribute('opacity', oppna ? 1 : 0)); };
    const halsar = (sid, a = 0.55, b = 0.85) => n === sid && sida(sid, tt) > a && sida(sid, tt) < b;   // ler med ögonen efter sitt godnatt
    const vakenM = sida(2, tt) > 0.35 ? 1 : 0, vakenV = tt >= T[4].takt[2].t + 0.4 ? 1 : 0, vakenT = tt >= T[5].takt[2].t + 0.4 ? 1 : 0;   // vaknar på sitt godnatt
    ogon('mf', vakenM * (1 - sov), 2.1, halsar(2));
    ogon('vf', vakenV, 3.3, ler(4));
    ogon('tf', vakenT, 1.2, ler(5));
    ogon('nf', kS > 0.2 ? 0 : 1, 4.4);
    $('hemma').setAttribute('opacity', inUt(del(T[6].takt[1].t - 0.3, T[6].takt[1].t + 0.5, tt)));   // kudden och nallen dyker upp på "Där är kudden"
    $('vatten').setAttribute('opacity', vakenV);
    $('trad').setAttribute('opacity', vakenT);
    // hemma syns månen i fönstret och inga stjärnor; på sida 10 kommer bubblorna, en i taget, och tonas bort med texten
    const [fx, fy, fr] = RUM.fonster, ms = 1.25 * fr / mb, mcy = my + mb * 0.55;
    $('manen-g').setAttribute('transform', iRum ? `translate(${tx + Z * (RUM.x + fx)} ${ty + Z * fy}) scale(${Z * ms}) translate(${-mx} ${-mcy})` : '');
    $('stjarnor').setAttribute('opacity', iRum ? 0 : 1);
    $('bubblor').setAttribute('opacity', n === 9 ? 1 - del(p.t1 - 1.5, p.t1 - 0.5, tt) : 0);
    BUBBLOR.forEach((b, i) => { const e = del(bubTid(i), bubTid(i) + 0.7, tt);   // ploppar mjukt fram, och är lite större under sin takt
      const nu = i === BUBBLOR.length - 1 ? 1 : 1 - inUt(del(bubTid(i + 1), bubTid(i + 1) + 0.8, tt)), s = inUt(e) * (1 + 0.1 * Math.sin(Math.PI * e)) * (0.95 + 0.07 * nu);
      $('bub' + i).setAttribute('transform', `scale(${s})`);
      $('bubf' + i).setAttribute('transform', `translate(0 ${5 * Math.sin(2 * Math.PI * (tt / 3.4 + i * 0.27))})`); });

    // månen lyser upp på sida 3; stjärnorna andas; trädet gungar lite när det vaknar
    const m = inUt(sida(2, tt));
    $('mane').setAttribute('transform', `translate(${mx} ${my + mb * 0.55}) rotate(${2 * Math.sin(2 * Math.PI * tt / 9)}) scale(${lerp(0.97, 1.03, m)}) translate(${-mx} ${-(my + mb * 0.55)})`);
    STJARNOR.forEach((_, i) => $('stjarna' + i).setAttribute('transform', `scale(${1 + 0.06 * Math.sin(2 * Math.PI * (tt / 3.5 + i * 0.37))})`));
    $('trad').setAttribute('transform', `translate(${TRAD[0]} ${TRAD[1] + 200}) rotate(${1.5 * Math.sin(2 * Math.PI * tt / 5) * vakenT}) translate(${-TRAD[0]} ${-TRAD[1] - 200})`);
    $('vatten').setAttribute('transform', `translate(0 ${4 * Math.sin(2 * Math.PI * tt / 3)})`);

    // sida 4: vällingflaskan glider fram till munnen, lutar och vällingen sjunker; sen glider den bort. Den vänds aldrig.
    const k4 = sida(3, tt), fram = inUt(del(0, 0.15, k4)) * (1 - inUt(del(0.6, 0.75, k4))), dricker = inUt(del(0.15, 0.6, k4));
    $('flaska').setAttribute('opacity', fram > 0.01 ? clamp(fram * 3) : 0);
    $('flaska-rorelse').setAttribute('transform', `translate(${260 * (1 - fram)} ${3 * Math.sin(2 * Math.PI * tt * 1.6) * (k4 > 0.15 && k4 < 0.6 ? 1 : 0)}) rotate(${-50 * fram})`);
    $('flaska-tom').setAttribute('height', FLASKA.sjunker * dricker);

    bok.rita(tt, INTRO, T[SIST].t1);   // bilderboken
    $('morker').setAttribute('opacity', inUt(del(DURATION - 1.5, DURATION, tt)));
    window.kant?.uppdatera();
  }

  const ljud = [
    { t: 0, fil: MUSIK, vol: 0.25, loop: true, langd: DURATION, fade: T[SIST].t1 - T[SIST].t0 + OUTRO },
    ...bok.ljud(T[SIST].t1, effekt),                                     // bokomslaget
    ...T.flatMap((p, i) => p.takt   // en takt i taget: bara den biten av inläsningen
      ? p.takt.map(b => ({ t: b.t, fil: `${mapp}sida-${i + 1}.m4a`, ss: b.fran, langd: b.len + 0.04, fade: 0.04, vol: 2.5, tal: b.text }))
      : [{ t: p.t0 + 1, fil: las[i] ? `${mapp}sida-${i + 1}.m4a` : null, vol: 2.5, tal: p.rader.join(' ') }]),
    { t: T[1].t0 + 1, fil: effekt('sand'), vol: 0.4 },
    ...BAA.map(([sid, k, vol]) => ({ t: talSlut(sid) + 0.4 - BAA_FIL[k][0], fil: effekt('ba', k), vol })),
    { t: lerp(T[2].t0 + 1, T[2].t1 - 1, 0.35), fil: effekt('glimt'), vol: 0.6 },
    { t: T[2].t0 + 1 + (las[2] ?? 1.5) + 0.4, fil: effekt('ding', 1), vol: 0.3 },
    // tripp, tripp: ett mjukt steg vid varje landning
    ...VAG.flatMap(([n]) => Array.from({ length: HOPP }, (_, j) => ({ t: lerp(...ga(n), (j + 1) / HOPP), fil: effekt('steg', j % 3 + 1), vol: 0.25 }))),
    { t: lerp(T[4].t0 + 1, T[4].t1 - 1, 0.67), fil: effekt('plask', 1), vol: 0.3 },
    { t: lerp(T[5].t0 + 1, T[5].t1 - 1, 0.67), fil: effekt('prassel-lov'), vol: 0.35 },
    { t: lerp(T[8].t0 + 1, T[8].t1 - 1, 0.2), fil: effekt('prassel-tyg'), vol: 0.4 },
    ...BUBBLOR.map((_, i) => ({ t: bubTid(i), fil: effekt('plopp'), vol: 0.15 })),   // bubblorna: ett mjukt plopp
  ];
  await document.fonts.load('600 64px Fredoka');
  await Promise.all([...document.querySelectorAll('image')].map(i => new Promise(r => { const im = new Image(); im.onload = im.onerror = r; im.src = i.getAttribute('href'); })));
  window.LJUD = ljud.filter(c => c.fil);
  window.DURATION = DURATION;
  window.seek = rita;
  window.ready = true;
  if (render) { rita(0); return; }

  document.body.insertAdjacentHTML('beforeend', `<aside><button id="spela">▶ Spela</button><button id="om">↺ Om</button>
    <div id="tid"></div><label><input type="checkbox" id="zon"> visa YouTube-zonen</label>
    <p style="opacity:.7">Sidor utan inläsning läses av talsyntesen.</p></aside>`);
  const spela = c => {
    if (!c.fil) { const u = new SpeechSynthesisUtterance(c.tal); u.lang = 'sv-SE'; u.rate = 0.75; return speechSynthesis.speak(u); }
    const a = new Audio('/' + c.fil); if (c.ss) a.currentTime = c.ss; a.volume = Math.min(1, c.vol * 0.4); a.loop = !!c.loop; a.play();
    if (c.langd) setTimeout(() => a.pause(), c.langd * 1000);
  };
  let start = null, senast = 0;
  const ruta = nu => {
    const tt = start === null ? senast : (nu - start) / 1000;
    if (start !== null) for (const c of ljud) if (c.t > senast - 1e-6 && c.t <= tt) spela(c);
    senast = tt;
    rita(Math.min(tt, DURATION));
    $('tid').textContent = `${tt.toFixed(1)} / ${DURATION.toFixed(1)} s`;
    if (start !== null && tt >= DURATION) start = null;
    requestAnimationFrame(ruta);
  };
  $('spela').onclick = () => { start = performance.now() - senast * 1000; };
  $('om').onclick = () => { speechSynthesis.cancel(); start = performance.now(); senast = -1e-3; };
  $('zon').onchange = e => document.body.classList.toggle('visa-zon', e.target.checked);
  window.hoppa = t => { senast = t; };
  requestAnimationFrame(ruta);
});
</script>
