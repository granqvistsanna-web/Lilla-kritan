    const v1 = b.getUint8(i + 4) === 1, o = i + (v1 ? 24 : 16);
    return (v1 ? Number(b.getBigUint64(o + 4)) : b.getUint32(o + 4)) / b.getUint32(o);

  // vita kanter (skill vita-kanter): alla klippta saker får grundkanten ovanpå bildens egen, också molnen (Sanna 2026-11-07).
  // Riggen får en kant runt hela figuren (inte en per del), så att lederna inte får egna kanter.
  document.querySelectorAll('image').forEach(im => { if (!im.closest('#n-rigg')) window.kant?.lagg(im); });
  window.kant?.lagg($('n-rigg'));

  const las = await Promise.all(SIDOR.map((_, i) => langd(`${mapp}sida-${i + 1}.m4a`)));
  let t = INTRO;
  const T = SIDOR.map(([rader, sek], i) => { const t0 = t;
    if (TAKTER[i] && las[i]) {   // takt för takt: { t = när takten börjar i filmen, fran = var i inläsningen, len, paus, text }
      let s = t0 + 1; const takt = TAKTER[i].map(([a, b, paus, text]) => { const k = { t: s, fran: a, len: b - a, paus, text }; s += b - a + paus; return k; });
      t = s + 1; return { t0, t1: t, tal0: t0 + 1, rader, takt };
    }
    const [fore, lang] = LUGN[i] ?? [1, 0];
    t += las[i] ? Math.max(MIN_SIDA, las[i] + 6, lang) : sek; return { t0, t1: t, tal0: t0 + fore, rader }; });
  const taktNu = (p, tt) => p.takt ? Math.max(0, p.takt.findLastIndex(b => tt >= b.t - 0.2)) : 0;   // vilken takt som pågår
  const blundTid = j => { const b = T[9].takt[j]; return b.t + ORD.blundar[j] - b.fran; };   // när den j:te blundar (i filmen)
  const DURATION = t + OUTRO, SIST = T.length - 1;
  const sida = (n, tt) => del(T[n].tal0, T[n].t1 - 1, tt);
  const tal = (n, tt) => tt - T[n].tal0;   // sekunder in i sidans inläsning
  // kameran: en bild per sida (SKOTT). I början av sidan glider den lugnt dit från förra sidans bild (mitten och zoomen glider), ingen dipp.
  const vy = j => { const s = SKOTT[j]; return [s.m[0] + (540 - s.a[0]) / s.z, s.m[1] + (960 - s.a[1]) / s.z, s.z]; };   // bildens mitt i världen och zoom
  const kamera = (n, tt) => { const a = vy(Math.max(0, n - 1)), b = vy(n), k = inUt(del(T[n].t0, T[n].t0 + BYT, tt));
    const Z = Math.exp(lerp(Math.log(a[2]), Math.log(b[2]), k)), cx = lerp(a[0], b[0], k), cy = lerp(a[1], b[1], k);
    return [540 - Z * cx, 960 - Z * cy, Z]; };

  function rita(tt) {
    $('boil-brus').setAttribute('seed', Math.floor(tt * 8) % 50 + 1);
    const i = T.findIndex(p => tt < p.t1), n = i === -1 ? SIST : i, p = T[n];
    // texten
    const jt = p.takt ? taktNu(p, tt) : -1, rader = jt >= 0 ? [p.takt[jt].text] : p.rader, lh = 84, y0 = TEXT_Y - (rader.length - 1) * lh / 2;
    if ($('text').dataset.n !== n + ':' + jt) { $('text').dataset.n = n + ':' + jt; $('text').innerHTML = rader.map((r, i) => `<tspan x="540" y="${y0 + i * lh}">${r}</tspan>`).join(''); }
    let textOp = Math.min(del(p.t0 + 0.3, p.t0 + 1.8, tt), n === SIST ? 1 : 1 - del(p.t1 - 1.5, p.t1, tt));
    if (jt >= 0) { const b = p.takt[jt], nasta = p.takt[jt + 1];   // en mening i taget: tonas ut före nästa takt och in på sin
      if (jt > 0) textOp = Math.min(textOp, del(b.t - 0.2, b.t + 0.5, tt));
      if (nasta) textOp = Math.min(textOp, 1 - del(nasta.t - 0.9, nasta.t - 0.3, tt)); }
    $('text').setAttribute('opacity', textOp);

    // nyckelpigan svävar och guppar lugnt (sida 1–6), flyger ner och landar på molnet (sida 7), sjunker lite på sida 8
    const k7 = sida(6, tt), landa = inUt(del(0.05, 0.5, k7)), sjunk = inUt(sida(7, tt)) * 12;
    const svav = (1 - landa) * (14 * Math.sin(2 * Math.PI * tt / 3.2));
    const lut = (1 - landa) * 3 * Math.sin(2 * Math.PI * tt / 4.1);
    const x = lerp(SVAVA[0], LANDA[0], landa), y = lerp(SVAVA[1], LANDA[1], landa) + svav - 40 * Math.sin(Math.PI * landa) + sjunk;
    $('nicke').setAttribute('transform', `translate(${x} ${y}) rotate(${lut})`);
    const ner = inUt(del(0.1, 0.4, sida(7, tt))) + (n > 7 ? 1 : 0);   // lägger sig på sida 8: "Prickarna blir tunga"
    $('star').setAttribute('opacity', clamp(1 - ner)); $('ligger').setAttribute('opacity', clamp(ner));
    // andas: lugnt hela tiden, stort på sida 9 i takt med "in … och ut"
    let andning = 0.008 * Math.sin(2 * Math.PI * tt / 4);
    const t9 = tal(8, tt);
    for (const [a, b, c] of ORD.andas) if (t9 > a - 0.2 && t9 < c + 0.6) andning = 0.05 * (t9 < b ? inUt(del(a - 0.2, b, t9)) : 1 - inUt(del(b, c + 0.6, t9)));
    if (n === SIST) andning = 0.015 * Math.sin(2 * Math.PI * (tt - p.t0) / 5.5);
    $('andas').setAttribute('transform', `scale(${1 + andning / 2} ${1 + andning})`);

    // sida 6: varje prick hoppar till när den räknas, och en gul ring vidgas ut från den
    const t6 = tal(5, tt);
    N.prickar.forEach((_, j) => { const k = n === 5 ? del(ORD.rakna[j] - 0.05, ORD.rakna[j] + 0.7, t6) : 0, pop = Math.sin(Math.PI * del(0, 0.5, k));
      $('prick' + j).setAttribute('opacity', pop > 0.01 ? 1 : 0); $('prick' + j).setAttribute('transform', `scale(${1 + 0.2 * pop})`);
      $('ring' + j).setAttribute('opacity', k > 0 && k < 1 ? 1 - k : 0); $('ring' + j).setAttribute('transform', `scale(${0.9 + 0.6 * k})`); });

    // munnen: leende, gäspar på sida 6 (O-mun)
    const gap = n === 5 ? inUt(del(ORD.gasp[0], ORD.gasp[0] + 0.5, t6)) * (1 - inUt(del(ORD.gasp[1] - 0.4, ORD.gasp[1], t6))) : 0;
    {   // riggens öppna mun (uttryck.html), en stor gäspning ([26, 34] i stället för filmens [16, 20], som syns på håll), växer med gap
      const [cx, my, rx, h] = [N.mun[0], 478, 26 * Math.sqrt(gap), 34 * gap * 4 / 3];
      $('ngap').setAttribute('d', `M${cx - rx} ${my} C${cx - rx} ${my - h} ${cx + rx} ${my - h} ${cx + rx} ${my} C${cx + rx} ${my + h} ${cx - rx} ${my + h} ${cx - rx} ${my}Z`);
      $('ngap').setAttribute('opacity', gap > 0.03 ? 1 : 0); $('nle').setAttribute('opacity', gap > 0.03 ? 0 : 1); }
    // riggen: antennerna gungar lugnt (och släpar efter guppet), armarna vilar och fladdrar lite medan den svävar,
    // benen dinglar; när den har landat är allt stilla. Ingenting vänds runt.
    const svavar = 1 - landa, vrid = (n, g, dy = 0) => { const [px, py] = N.rigg[n]; $('n-' + n).setAttribute('transform', `translate(0 ${dy}) rotate(${g} ${px} ${py})`); };
    const vick = 3 * Math.sin(tt * 3) - 6 * Math.cos(2 * Math.PI * tt / 3.2) * svavar;
    vrid('ear-l', -4 + vick); vrid('ear-r', 4 + vick);
    const fl = svavar * 5 * Math.sin(2 * Math.PI * tt / 1.6);
    vrid('arm-l', 8 + fl); vrid('arm-r', -8 - fl);
    const ding = svavar * 5 * Math.sin(2 * Math.PI * tt / 3.2 + 0.8);
    vrid('leg-l', ding); vrid('leg-r', ding);

    // ögonen och blicken, sida för sida: tittar på det den säger godnatt till, följer prickarna när de räknas,
    // ler med ögonen när något är mysigt, locken blir tunga mot slutet
    const blink = off => ((tt + off) % 5.5) < 0.16;
    const kS = sida(SIST, tt), sov = inUt(del(0, 0.3, kS)), kn = sida(n, tt);
    let u = { oppen: 1, titt: [0, 0] };
    const ogonMitt = [(N.ogon[0][0] + N.ogon[1][0]) / 2, (N.ogon[0][1] + N.ogon[1][1]) / 2];
    if (n === 0) u = { oppen: 0.72, titt: kn < 0.55 ? [0.5, -0.2] : [0, 0] };                       // sömnig; "Är du också sömnig?" mot dig
    if (n === 1) u = kn > 0.45 && kn < 0.7 ? { lage: 'glad' } : { titt: [0.55, 0.55] };             // tittar på flaskan; mmm
    if (n === 2) u = { titt: [0.6, -0.9] };   // upp mot månen
    if (n === 3) u = { titt: [-0.9, 0.1] };   // åt molnet
    if (n === 4) u = { titt: [-0.7, -0.7] };  // upp mot stjärnan
    if (n === 5) {   // följer prickarna med blicken, ler efter sju, gäspar, sen mot dig
      const j = ORD.rakna.findLastIndex(s => t6 >= s - 0.15);
      if (j >= 0 && t6 < ORD.rakna[6] + 0.9) { const [px, py] = N.prickar[j], dx = px - ogonMitt[0], dy = py - ogonMitt[1], l = Math.hypot(dx, dy); u = { titt: [dx / l, dy / l] }; }
      else if (t6 >= ORD.rakna[6] + 0.9 && t6 < ORD.gasp[0]) u = { lage: 'glad' };
      else if (gap > 0.6) u = { lage: 'sov' };
      else u = { oppen: t6 > ORD.gasp[1] ? 0.85 : 1 };
    }
    if (n === 6) u = kn < 0.45 ? { titt: [0, 0.8] } : kn < 0.62 ? { titt: [0.95, 0.1] } : kn < 0.85 ? { lage: 'glad' } : { titt: [0.6, 0.1], oppen: 0.85 };   // ner mot molnet, på nallen, glad
    if (n === 7) u = { oppen: lerp(0.75, 0.42, inUt(kn)), titt: [0.35, 0.25] };   // prickarna blir tunga
    if (n === 8) u = { oppen: 0.36 + 3 * Math.max(0, andning), titt: [0, 0.2] };      // vidgas lite på "in"
    if (n === 9) { const j = [0, 1, 2, 3].findIndex(i => tt < blundTid(i) + 0.3);   // tittar på bubblan med den som blundar
      u = { oppen: 0.42, titt: j === -1 ? [0, 0.3] : [(BUBBLOR[j].c[0] - 520) / 400, -0.9] }; }
    if (n === SIST) u = sov > 0.5 ? { lage: 'sov' } : { oppen: 0.35 * (1 - sov) };
    if ((u.lage ?? 'oppen') === 'oppen' && blink(0)) u = { ...u, oppen: 0 };
    for (const j of [0, 1]) { sattOga('noga' + j, u); sattOga('loga' + j, u); }
    $('lvaken').setAttribute('opacity', u.lage === 'sov' ? 0 : 1);   // under fläckarna: bildens slutna ögon
    {   // riggens leende (uttryck.html): le och leBred, större när glad, mindre när trött; kinderna starkare när glad
      const [le, b] = u.lage === 'glad' ? [1.3, 1.15] : n >= 7 ? [0.6, 0.8] : [1, 1], cx = N.mun[0], ey = 465 - 22 * le;
      $('nle').setAttribute('d', `M${cx - 31 * b} ${ey} Q${cx} ${465 + 22 * le} ${cx + 31 * b} ${ey}`);
      document.querySelectorAll('.n-kind').forEach(e => e.setAttribute('opacity', u.lage === 'glad' ? 1 : 0.75)); }

    // sida 2: vällingflaskan glider fram till munnen, lutar och vällingen sjunker; sen glider den bort. Den vänds aldrig.
    const k2 = sida(1, tt), fram = inUt(del(0, 0.15, k2)) * (1 - inUt(del(0.65, 0.8, k2))), dricker = inUt(del(0.15, 0.65, k2));
    $('flaska').setAttribute('opacity', fram > 0.01 ? clamp(fram * 3) : 0);
    $('flaska-rorelse').setAttribute('transform', `translate(${240 * (1 - fram)} ${3 * Math.sin(2 * Math.PI * tt * 1.6) * (k2 > 0.15 && k2 < 0.65 ? 1 : 0)}) rotate(${-50 * fram})`);
    $('flaska-tom').setAttribute('height', FLASKA.sjunker * dricker);

    // ansiktena: månen vaknar på sida 3, molnet på sida 4, stjärnan på sida 5; nallen är vaken.
    // Alla somnar i tur och ordning på sida 10.
    const ogon = (id, vaken, off, glad = false) => { const o = vaken * (blink(off) ? 0.1 : 1), oppna = o > 0.15 && !glad;
      for (const j of [0, 1]) { $(`${id}-o${j}`).setAttribute('ry', 7 * Math.max(0.08, o)); $(`${id}-o${j}`).setAttribute('opacity', oppna ? 1 : 0);
        $(`${id}-s${j}`).setAttribute('opacity', o > 0.15 || glad ? 0 : 1); $(`${id}-g${j}`).setAttribute('opacity', glad && vaken ? 1 : 0); }
      document.querySelectorAll(`.${id}-glans`).forEach(e => e.setAttribute('opacity', oppna ? 1 : 0)); };
    const halsar = (sid, a = 0.55, b = 0.85) => n === sid && sida(sid, tt) > a && sida(sid, tt) < b;   // ler med ögonen efter sitt godnatt
    const vaknar = (sid, tt) => n > sid || (n === sid && sida(sid, tt) > 0.3) ? 1 : 0;
    const somnat = j => n > 9 || (n === 9 && tt > blundTid(j)) ? 0 : 1;
    ogon('mf', vaknar(2, tt) * somnat(0), 2.1, halsar(2));
    ogon('of', vaknar(3, tt) * somnat(1), 3.3, halsar(3));
    ogon('sf', vaknar(4, tt) * somnat(2), 1.2, halsar(4));
    ogon('nf', somnat(3), 4.4);
    $('nalle').setAttribute('opacity', inUt(del(0.35, 0.6, k7)) + (n > 6 ? 1 : 0));   // nallen dyker upp på "Nallen får sova bredvid"

    // månen lyser upp på sida 3, molnet guppar till på sida 4, stjärnan glittrar på sida 5
    const m = inUt(sida(2, tt));
    $('mane').setAttribute('transform', `translate(${mx} ${my + mb * 0.55}) rotate(${2 * Math.sin(2 * Math.PI * tt / 9)}) scale(${lerp(0.97, 1.03, m)}) translate(${-mx} ${-(my + mb * 0.55)})`);
    const k4 = sida(3, tt), k5 = sida(4, tt);
    $('namn-moln').setAttribute('transform', `translate(${6 * Math.sin(2 * Math.PI * tt / 7)} ${-18 * Math.sin(Math.PI * del(0.25, 0.55, k4))})`);
    $('litet-moln').setAttribute('transform', `translate(${-8 * Math.sin(2 * Math.PI * tt / 9)} 0)`);
    $('stor-stjarna').setAttribute('transform', `scale(${1 + 0.05 * Math.sin(2 * Math.PI * tt / 3.5) + 0.12 * Math.sin(Math.PI * del(0.25, 0.55, k5))})`);
    STJARNOR.forEach((_, i) => $('stjarna' + i).setAttribute('transform', `scale(${1 + 0.06 * Math.sin(2 * Math.PI * (tt / 3.5 + i * 0.37))})`));
    // små stjärnor som hamnar bakom texten i en närbild tonas bort, så att orden syns
    // kameran (se kamera ovan); små stjärnor som glider in bakom texten tonas mjukt bort, så att orden syns
    const [tx, ty, z0] = kamera(n, tt), halv = (p.rader.length * 84) / 2 + 60;
    STJARNOR.forEach(([x, y], i) => { const bx = tx + z0 * x, by = ty + z0 * y;
      $('stjarna' + i).setAttribute('opacity', Math.abs(bx - 540) < 500 ? clamp((Math.abs(by - TEXT_Y) - halv) / 80) : 1); });
    { const [x, y, w] = MOLN.litet, bx = tx + z0 * x, by = ty + z0 * y, r = z0 * w / 2;   // lilla molnet likaså
      $('litet-moln').setAttribute('opacity', bx - r < 1020 ? clamp((Math.abs(by - TEXT_Y) - halv - r * 0.4) / 80) : 1); }

    $('kamera').setAttribute('transform', `translate(${tx} ${ty}) scale(${z0})`);

    // sida 10: himlen töms och bubblorna ploppar fram en i taget; de tonas bort med texten
    const tom = n === 9 ? inUt(del(p.t0, p.t0 + 1.5, tt)) : n === 10 ? 1 - inUt(del(p.t0, p.t0 + 1.5, tt)) : 0;   // himlen töms mjukt och fylls igen
    $('himmel-saker').setAttribute('opacity', 1 - tom);
    BUBBLOR.forEach((b, i) => { const t0 = blundTid(i) - 0.8, e = n === 9 ? del(t0, t0 + 0.7, tt) : 0;   // ploppar mjukt fram och är lite större under sin takt
      const nu = i === BUBBLOR.length - 1 ? 1 : 1 - inUt(del(blundTid(i + 1) - 0.8, blundTid(i + 1), tt));
      $('bub' + i).setAttribute('opacity', e > 0 ? 1 - del(p.t1 - 1.2, p.t1 - 0.4, tt) : 0);
      $('bubs' + i).setAttribute('transform', `scale(${inUt(e) * (1 + 0.1 * Math.sin(Math.PI * e)) * (0.95 + 0.07 * nu)})`);
      $('bubf' + i).setAttribute('transform', `translate(0 ${5 * Math.sin(2 * Math.PI * (tt / 3.4 + i * 0.27))})`); });

    bok.rita(tt, INTRO, T[SIST].t1);   // bilderboken
    $('morker').setAttribute('opacity', inUt(del(DURATION - 1.5, DURATION, tt)));
    window.kant?.uppdatera();
  }

  const vid = (n, k) => lerp(T[n].tal0, T[n].t1 - 1, k);
  const ljud = [
    { t: 0, fil: MUSIK, vol: 0.25, loop: true, langd: DURATION, fade: T[SIST].t1 - T[SIST].t0 + OUTRO },
    ...bok.ljud(T[SIST].t1, effekt),                                     // bokomslaget
    ...T.flatMap((p, i) => p.takt   // en takt i taget: bara den biten av inläsningen
      ? p.takt.map(b => ({ t: b.t, fil: `${mapp}sida-${i + 1}.m4a`, ss: b.fran, langd: b.len + 0.04, fade: 0.04, vol: 2.5, tal: b.text }))
      : [{ t: p.tal0, fil: las[i] ? `${mapp}sida-${i + 1}.m4a` : null, vol: 2.5, tal: p.rader.join(' ') }]),
    { t: INTRO + 0.6, fil: effekt('surr'), vol: 0.15 },   // när boken slagits upp
    { t: vid(2, 0.3), fil: effekt('glimt'), vol: 0.6 },
    { t: T[2].tal0 + (las[2] ?? 1.5) + 0.4, fil: effekt('ding', 1), vol: 0.3 },
    { t: vid(3, 0.3), fil: effekt('plupp'), vol: 0.3 },
    { t: vid(4, 0.3), fil: effekt('glitter'), vol: 0.35 },
    ...ORD.rakna.map((s, j) => ({ t: T[5].tal0 + s, fil: effekt('pick'), vol: 0.18 })),
    ...BUBBLOR.map((_, i) => ({ t: blundTid(i) - 0.8, fil: effekt('plopp'), vol: 0.15 })),   // bubblorna: ett mjukt plopp
    { t: vid(6, 0.05), fil: effekt('surr'), vol: 0.15 },
    { t: vid(6, 0.5), fil: effekt('pling'), vol: 0.3 },
  ];
  await document.fonts.load('600 60px Fredoka');
  await Promise.all([...document.querySelectorAll('image')].map(i => new Promise(r => { const im = new Image(); im.onload = im.onerror = r; im.src = i.getAttribute('href'); })));
  window.LJUD = ljud.filter(c => c.fil);
  window.DURATION = DURATION;
  window.seek = rita;
  window.ready = true;
  if (render) { rita(0); return; }

  document.body.insertAdjacentHTML('beforeend', `<aside><button id="spela">▶ Spela</button><button id="om">↺ Om</button>
    <div id="tid"></div><label><input type="checkbox" id="zon"> visa YouTube-zonen</label>
    <p style="opacity:.7">Sidor utan inläsning läses av talsyntesen.</p></aside>`);
  const spela = c => {
    if (!c.fil) { const u = new SpeechSynthesisUtterance(c.tal); u.lang = 'sv-SE'; u.rate = 0.75; return speechSynthesis.speak(u); }
    const a = new Audio('/' + c.fil); if (c.ss) a.currentTime = c.ss; a.volume = Math.min(1, c.vol * 0.4); a.loop = !!c.loop; a.play();
    if (c.langd) setTimeout(() => a.pause(), c.langd * 1000);
  };
  let start = null, senast = 0;
  const ruta = nu => {
    const tt = start === null ? senast : (nu - start) / 1000;
    if (start !== null) for (const c of ljud) if (c.t > senast - 1e-6 && c.t <= tt) spela(c);
    senast = tt;
    rita(Math.min(tt, DURATION));
    $('tid').textContent = `${tt.toFixed(1)} / ${DURATION.toFixed(1)} s`;
    if (start !== null && tt >= DURATION) start = null;
    requestAnimationFrame(ruta);
  };
  $('spela').onclick = () => { start = performance.now() - senast * 1000; };
  $('om').onclick = () => { speechSynthesis.cancel(); start = performance.now(); senast = -1e-3; };
  $('zon').onchange = e => document.body.classList.toggle('visa-zon', e.target.checked);
  window.hoppa = t => { senast = t; };
  requestAnimationFrame(ruta);
});
</script>
