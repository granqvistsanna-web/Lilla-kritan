<!doctype html>
<meta charset="utf-8">
<title>Julkalendern – lucka 20: fyra ljus</title>
<script src="/verktyg/blinka.js"></script><script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script src="/produktion/youtube/shorts/jul/lucka.js"></script><script src="/produktion/youtube/shorts/jul/djur.js"></script>
<script>
// Julkalendern, lucka 20, fjärde advent (produktion/youtube/julkalender-plan.md, variant A): samma scen som lucka 6, på kvällen.
// Den lilla gula kritan kommer in och tänder alla fyra ljusen, ett i taget, och väntar en stund vid veken före varje låga.
// Björnen känner hela vägen: nyfiken när kritan kommer, rycker till vid första lågan, stora ögon medan de andra tänds, klappar
// av glädje när alla fyra brinner, och vaggar lugnt medan vi räknar igen och lågorna blinkar till, en i taget.
// "Ett … två … tre … fyra." (20-ett-till-fyra) är inte inspelad: lågorna ligger 1,2 s isär, där orden väntas (0,1, 1,3, 2,5 och 3,7 s
// in i repliken). När den är inspelad: mät orden och sätt tand och blink efter dem, eller spela orden var för sig som i lucka 6.
// Repliker i assets/ljud/roster/jul/ (20-… är nya och tysta tills de är inspelade). Björnens läten (brum-gullig) kommer efter
// replikerna, glimt på varje låga (tysta filer: styrka 7,8 och 4,3), tass-klapp där tassarna möts.
const RAKNA = vid => ['jul/20-ett-till-fyra', 'Ett … två … tre … fyra.', vid], glimt = (vid, k) => ['glimt', vid, k, k === 1 ? 7.8 : 4.3];
julDjur.kor({
  lucka: 20, figur: 'bjornen-bulle', vinkArm: [38, 16], skala: 0.8, x: 220, sak: 'ljus', kvall: true,
  scen: [
    [3.2, 'vinka', { sag: [['jul/bjorn-hej', 'Hej björnen!', 0.6]], ljud: [['brum-gullig', 1.6, '1c']] }],
    [3.9, 'nyfiken', { tand: [3.8], sag: [['jul/kritan-tander-ljusen', 'Kritan tänder ljusen.', 1.1], RAKNA(3.7)], ljud: [glimt(3.8, 1)] }],
    [1.5, 'oj', { tand: [1.1], ljud: [glimt(1.1, 2)] }],
    [3.0, 'tittar', { uttryck: 'kawaii', tand: [0.8, 2.0], ljud: [glimt(0.8, 1), glimt(2.0, 2)] }],
    [3.5, 'klappa', { ljud: [['tass-klapp', 1.0, 1, 1.3], ['tass-klapp', 1.5, 2, 1.3], ['tass-klapp', 2.0, 1, 1.3], ['brum-gullig', 2.2, 3]] }],
    [4.2, 'tittar', { sag: [['jul/20-fyra-ljus', 'Fyra ljus! Snart är det jul.', 0.4]], ljud: [['brum-gullig', 3.0, 4, 1.5, 1.0]] }],
    [1.3, 'stilla', { sag: [['jul/rakna-med-mig', 'Räkna med mig.', 0.2]] }],
    [6.6, 'vagga', { ser: true, uttryck: 'kawaii', blink: [0.8, 2.0, 3.2, 4.4], sag: [RAKNA(0.7)], ljud: [glimt(0.8, 1), glimt(2.0, 2), glimt(3.2, 1), glimt(4.4, 2)] }],
    [2.8, 'vinka', { uttryck: 'fnissig', sag: [['jul/bjorn-hejda', 'Hej då björnen!', 0.5]], ljud: [['brum-gullig', 1.85, '1d']] }],
  ],
});
</script>
