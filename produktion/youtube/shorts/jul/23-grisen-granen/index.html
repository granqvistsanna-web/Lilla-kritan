<title>Julkalendern – lucka 23: vi klär granen</title>
<script src="/verktyg/blinka.js"></script><script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script src="/produktion/youtube/shorts/jul/lucka.js"></script><script src="/produktion/youtube/shorts/jul/djur.js"></script>
<script>
// Julkalendern, lucka 23, tre minuter (produktion/youtube/julkalender-granskning.md, lucka 23, godkänd 2026-11-12): granen (samma gran som i lucka 1 och 22) står i snön
// bredvid grisen, som har en tomteluva på sig (rekvisita/tomteluva.md). Tre kulor hoppar upp i granen (det byggda), och grisen går runt granen och tittar nöjd. Sedan rullar kulorna
// iväg (problemet: rullar iväg). Grisen jagar dem, och andra gången glider luvan ner över ögonen: grisen ser ingenting, fnissar och skjuter upp den, och blir ledsen. Hunden kommer in.
// Barnets tur (paus 5 s): räkna kulorna, som skimrar där de ligger. Hunden hämtar tre kulor och grisen hänger upp dem (ding för varje). Stjärnan landar i toppen (det byggda), och sist
// ritar kritan en likadan luva till hunden (konturen, sedan bilden), och de dansar i tomteluvor. Nya saker i motorn: hattar (luvorna på huvudet), luva (glider ner), luvaupp.
// Berättelsen 2026-11-12 (berattelse-granskning-2026-11-12.md, J23): barnets räknande driver hämtningen ("En!" → hunden hämtar en kula och grisen hänger upp den, ding,
// "Två!", "Tre!"; orden ur 23-rakna-kulorna), grisen är förvånad 1 s innan Malin säger "Oj!", tre jaktförsök där nr 2 och 3 är kortare (luvan glider ner på det sista),
// hunden kommer in, visar att den är snabb och hälsar med en nosbuff, och segern är granen som lyser (lyser) medan båda tittar upp på den (uppat), ingen dans.
// Ej inspelade (platshållare, tysta tills Sanna spelat in dem): 23-hunden-ar-snabb [excited] Hunden är snabb!   23-granen-lyser [amazed] Titta, granen lyser!
// Nya repliker i assets/ljud/roster/jul/ är tysta tills de är inspelade (förhandsvisningen läser dem):
//   23-har-tomteluva [excited] Titta, grisen har en tomteluva!   23-ser-ingenting [surprised] Oj! Grisen ser ingenting!   23-blir-ledsen [sadly] Grisen blir ledsen. Kulorna är borta.
//   23-hunden-kan-leta [excited] Hunden kan leta!   23-luva-till-hunden [playfully] Kritan ritar en luva till hunden också!
//   (gris-hej, 23-vi-klar-granen, 23-en-kula, 23-kulan-rullade, 23-jagar, titta-hunden, 23-rakna-kulorna, 23-hamta, 07-hittade-dem "Hunden hittade dem!", 23-stjarnan-i-toppen,
//    23-peka-pa-stjarnan, hurra-det-gick, tack-hunden, 24-god-jul, gris-hejda och hund-hejda finns eller delas med andra luckor)
// "En kula. En till. Och en till!" (23-en-kula, 3,3 s) har orden vid 0, 1,32 och 2,49 s: kulorna landar vid orden (0,85, 2,2 och 3,4 s). Grisens läten (noff-gullig, noff-fniss) kommer efter replikerna.
const TOPPEN = [0, -870];   // stjärnan i toppen, räknat från granens fot: dit pekar grisen
const T = [[172, -300], [412, -452], [248, -610]], MARK = 'kula1 kulag2 kula3'.split(' '), SPOT = [760, -700, 660], HEM = 620, MUN = [-125, -110];   // kulornas platser i granen (scenen), ting-namn, var de ligger, hundens plats, munnen
// en kula rullar ur granen: faller (0,7 s) och rullar till sin plats (rot = vridning efter sträckan)
const rull = (i, t0, spot) => [[t0, T[i][0], T[i][1], 1, 1, 0], [t0 + 0.7, T[i][0] + Math.sign(spot - T[i][0]) * 70, -44, 1, 1, 0], [t0 + 3.2, spot, -44, 1, 1, (spot - T[i][0]) / 40 * 57.3]];
// en runda: Malin säger talet (s0 före), kulan skimrar, hunden springer till kulan, tar den i munnen, springer tillbaka och kulan flyger upp i granen (ding)
const runda = (i, L, s0 = 0.9) => { const dx = SPOT[i] - HEM + (SPOT[i] < HEM ? 130 : 0), [tx, ty] = T[i], rot = (SPOT[i] - T[i][0]) / 40 * 57.3, tid = Math.abs(dx) > 600 ? 3.2 : 1.8,
    a = s0 + tid, b = a + 1.2, c = b + tid;
  return { med: { 0: ['hamta', { gang: [[0, 0], [s0, 0], [a, dx], [b, dx], [c, 0], [L, 0]], ner: [[a, b]] }] },
    ting: { [MARK[i]]: [[b - 0.6, SPOT[i], -44, 1, 1, rot, 0, 0], [b, MUN[0], MUN[1], 1, 1, 0, 0, 1], [c, MUN[0], MUN[1], 1, 1, 0, 0, 1], [c + 0.8, (HEM + MUN[0] + tx) / 2, ty - 160, 1, 1, 0, 0, 0], [c + 1.5, tx, ty, 1, 1, 0, 0, 0]],
      ['glans' + (i + 1)]: [[0.25, SPOT[i], -130, 0.55, 0.35], [0.7, SPOT[i], -130, 1.25, 1], [1.2, SPOT[i], -130, 0.5, 0]] },
    vid: c + 1.5, ljud: [['pling', 0.7, i + 1, 1.2], ['smasteg', s0 + 0.1, 1, 1.5], ['smasteg', b + 0.2, 1, 1.5], ['ding', c + 1.5, 1 + i, 1.0]] }; };
// talen ur 23-rakna-kulorna ("Kan du räkna kulorna? En, två, tre!", orden vid 0, 2,14, 3,27 och 4,65 s)
const TAL = { fraga: ['Kan du räkna kulorna?', 0, 1.35], 1: ['En!', 2.05, 0.65], 2: ['Två!', 3.2, 0.7], 3: ['Tre!', 4.58, 0.67] }, tal = (n, v) => ['jul/23-rakna-kulorna', TAL[n][0], v, TAL[n][1], TAL[n][2]];
const LUVA = [512, 252, 0.6, -8], NER = 175;   // luvans plats och skala på huvudet (figurens ruta) och hur långt den glider ner (över ögonen)
julDjur.kor({
  lucka: 23, figur: 'grisen-greta', vinkArm: [38, 16], skala: 0.85, x: -270, sak: 'gran',
  gaster: [['hunden-hugo', HEM, 0.8, 0]],
  hattar: [[-1, 'luva', ...LUVA], [0, 'luva-hund', 512, 280, 0.56, 8]],
  scen: [
    // A–B: det byggda, och grisen har en tomteluva
    [2.8, 'vinka', { sag: [['jul/gris-hej', 'Hej grisen!', 0.75]], ljud: [['noff-gullig', 1.90, 1, 1.5, 1.2]] }],
    [3.4, 'nicka', { sag: [['jul/23-har-tomteluva', 'Titta, grisen har en tomteluva!', 0.4]] }],
    [2.6, 'tittar', { sag: [['jul/23-vi-klar-granen', 'Nu klär vi granen.', 0.6]] }],
    [5.2, 'tittar', { kulor: [0.85, 2.2, 3.4], sag: [['jul/23-en-kula', 'En kula. En till. Och en till!', 0.9]], ljud: [['ding', 0.85, 1, 1.0], ['ding', 2.2, 1, 1.0], ['ding', 3.4, 1, 1.0]] }],
    // B, nytt: grisen går runt granen och tittar nöjd, kulorna plingar
    [10.0, 'ga', { gang: [[0, 0], [3.5, 120], [6, 120], [9.5, 0]], ser: false, ljud: [['pling', 1.6, 1, 1.6], ['pling', 4.8, 2, 1.6], ['pling', 8.0, 3, 1.6]] }],
    // C: kulorna rullar ur granen, en i taget, och iväg över snön. Grisen blir förvånad när den första faller (1 s) innan Malin säger något
    [0.8, 'tittar', { kulaborta: 0, ting: { kula1: rull(0, 0.4, SPOT[0]), kulag2: [[0, T[1][0], T[1][1], 1, 1, 0]].concat(rull(1, 3.2, SPOT[1]).slice(1)), kula3: [[0, T[2][0], T[2][1], 1, 1, 0]].concat(rull(2, 5.0, SPOT[2]).slice(1)) }, ljud: [['rull', 0.4, 1, 1.5, 2.5]] }],
    [5.4, 'oj', { sag: [['jul/23-kulan-rullade', 'Oj! Kulan rullade iväg!', 1.8]], ljud: [['rull', 2.4, 1, 1.5, 2.5], ['rull', 4.2, 1, 1.5, 2.0]] }],
    [2.0, 'tittar', {}],
    // D: grisen jagar kulorna tre gånger, försök 2 och 3 kortare; på det sista glider luvan ner över ögonen och grisen går tillbaka utan att se. Den fnissar och skjuter upp luvan, och blir ledsen
    [7.0, 'ga', { gang: [[0, 0], [2.8, 870], [4.2, 870], [7.0, 0]], nyfiken: true, sag: [['jul/23-jagar', 'Grisen jagar kulorna.', 0.8]], ljud: [['smasteg', 0.8, 1, 1.5], ['smasteg', 4.4, 1, 1.5]] }],
    [4.6, 'ga', { gang: [[0, 0], [1.8, -430], [2.6, -430], [4.4, 0]], nyfiken: true, ljud: [['smasteg', 0.4, 1, 1.5], ['smasteg', 2.7, 1, 1.5]] }],
    [4.4, 'ga', { gang: [[0, 0], [1.6, 300], [2.2, 300], [4.0, 0]], luva: [[1.2, 0], [1.7, NER]], sag: [['jul/23-ser-ingenting', 'Oj! Grisen ser ingenting!', 2.4]], ljud: [['smasteg', 0.4, 1, 1.5], ['smasteg', 2.3, 1, 1.5]] }],
    [4.5, 'luvaupp', { vid: 1.4, luva: [[1.2, NER], [1.7, 0]], ljud: [['noff-fniss', 0.4, 2, 1.5, 1.2]] }],
    [5.0, 'tittar', { uttryck: 'ledsen', sag: [['jul/23-blir-ledsen', 'Grisen blir ledsen. Kulorna är borta.', 0.5]] }],
    // E: hunden kommer in, visar att den är snabb (en snabb sväng fram och tillbaka) och hälsar på grisen med en nosbuff
    [3.0, 'tittar', { uttryck: 'ledsen', in: 0, sag: [['jul/titta-hunden', 'Titta, där kommer hunden!', 1.1]], ljud: [['hopp-mjuk', 0.1, 6], ['landa-mjuk', 1.05, 6]] }],
    [2.8, 'tittar', { med: { 0: ['hamta', { gang: [[0, 0], [0.5, -170], [1.0, 0]] }] }, sag: [['jul/23-hunden-ar-snabb', 'Hunden är snabb!', 1.2]], ljud: [['swoosh', 0.1, 1, 1.0]] }],
    [5.6, 'nicka', { uttryck: 'glad', med: { 0: ['nospuss', 20] }, ljud: [['nos', 2.65, 2, 1.2], ['noff-fniss', 3.0, 1, 1.4, 1.2]] }],
    // barnets tur: varje tal barnet säger med Malin skickar hunden efter en kula, och grisen hänger upp den (ding)
    [3.6, 'stilla', { med: { 0: 'vanta' }, sag: [tal('fraga', 0.4)] }],
    [8.0, 'putta', { ...runda(0, 8.0), arm: 70, sag: [tal(1, 0.2)] }],
    [8.0, 'putta', { ...runda(2, 8.0), arm: 70, sag: [tal(2, 0.2)] }],
    [10.8, 'putta', { ...runda(1, 10.8), arm: 70, sag: [tal(3, 0.2)] }],
    [3.0, 'stilla', { uttryck: 'stolt', sag: [['jul/07-hittade-dem', 'Hunden hittade dem!', 0.4]] }],
    // kritan ritar en luva till hunden, som tack
    [6.0, 'nyfiken', { med: { 0: 'vanta' }, rit: [[0.6, 'luva-hund', 2.6]], sag: [['jul/23-luva-till-hunden', 'Kritan ritar en luva till hunden också!', 1.2]], ljud: [['vov-ja', 4.8, 1, 1.0]] }],
    // G: segern är granen själv: stjärnan landar i toppen, granen tänds och båda tittar upp på den
    [3.0, 'oj', { ser: TOPPEN, stjarna: 1.2, med: { 0: 'uppat' }, sag: [['jul/23-stjarnan-i-toppen', 'Och stjärnan i toppen!', 1.5]], ljud: [['tindra', 1.2, 3, 1.3]] }],
    [4.6, 'tittar', { ser: TOPPEN, lyser: 0.2, med: { 0: 'uppat' }, sag: [['jul/23-granen-lyser', 'Titta, granen lyser!', 1.7]], ljud: [['glitter', 0.3, 1, 1.4], ['noff-gullig', 3.6, 2, 1.5, 1.0]] }],
    [2.4, 'tittar', { ser: TOPPEN, med: { 0: 'uppat' }, sag: [['jul/23-peka-pa-stjarnan', 'Kan du peka på stjärnan?', 0.2]] }],
    [4.6, 'peka', { ser: TOPPEN, arm: 78, skimrar: 3.0, med: { 0: 'uppat' }, ljud: [['glitter', 3.0, 1, 1.6]] }],
    [5.4, 'nicka', { uttryck: 'stolt', med: { 0: 'vanta' }, sag: [['jul/tack-hunden', 'Tack, hunden!', 0.6], ['jul/24-god-jul', 'God jul!', 2.6]], ljud: [['vov-ja', 1.9, 1, 1.0]] }],
    // I: hej då
    [2.4, 'vinka', { med: { 0: 'stilla' }, sag: [['jul/gris-hejda', 'Hej då grisen!', 0.5]], ljud: [['noff-gullig', 1.7, 3, 1.5, 1.1]] }],
    [3.0, 'stilla', { med: { 0: 'vinka' }, sag: [['tittut/hund-hejda', 'Hej då hunden!', 0.5]], ljud: [['vov', 1.7, 1, 1.2, 0.3]] }],
  ],
});
</script>
