  const liten = vid('01-stjarnan-sa-liten'), vadGor = vid('vad-gor-vi-nu'), ledsen = [liten - 0.75, vadGor + 0.2], strack = [liten + 0.9, vadGor + 1.2];

  const an = svg.querySelector('#ansikte'), oga2 = x => `<g class="oga" transform="translate(${x} -22)"><ellipse cy="8" rx="14" ry="19" fill="#2a1d1a"/><circle cx="-4" cy="5" r="5" fill="#fff"/></g>`;

  const mitt = ram('lager-mitt'), sudd = ram('lager-sudd'), bump = (t, a, d) => Math.sin(Math.PI * Math.min(1, Math.max(0, (t - a) / d)));
  // 5. Reaktionsslagen 2026-11-16: blicken (ögonen glider mot det stjärnan tittar på, i ansiktets egna pixlar) och ett litet skutt efter stråle 2.
  //    Stegens början räknas ur replikerna: steg = replik − (sekunder in + sen 0,35). Reaktionen efter stråle i börjar 1,48 s efter strålsteget
  //    (strålen 0,28 + andning 0,6, flygningen vanta 0 + andning 0,6), alltså replik + 0,53, medan stjärnan fortfarande växer (klar ca 0,2 s in).
  const sudd0 = vid('01-suddgummit-kan-sudda') - 1.15, liten0 = liten - 1.45, r1 = vid('01-en-strale') + 0.53, r2 = vid('01-en-strale-till') + 0.53, hopp = r2 + 0.25;
  const BLICK = [[sudd0 + 0.2, sudd0 + 3.0, 16, 8], [liten0 + 0.3, vadGor + 0.2, 0, 9], [r1 + 0.3, r1 + 2.2, 0, -9], [r2 + 0.3, r2 + 0.9, -8, -6]];
  const rita2 = window.render;
  window.seek = window.render = t => {
    rita2(t);
    for (const [a, b, dx, dy] of BLICK) { const k = Math.min(1, Math.max(0, (t - a) / 0.15), Math.max(0, (b - t) / 0.15)); if (k <= 0) continue;
      for (const o of an.querySelectorAll('.oga')) o.setAttribute('transform', o.getAttribute('transform') + ` translate(${(dx * k).toFixed(1)} ${(dy * k).toFixed(1)})`); }
    // a) ledsen min (göms i en snabb hopknipning, som rita.js gör vid byten) och två lugna sträckningar kring fotspetsen (960, 737)
    const ar = t > ledsen[0] && t < ledsen[1], nara = Math.min(...ledsen.map(c => Math.abs(t - c)));
    if (ar) { for (const g of an.querySelectorAll('[class^="k-"]')) g.setAttribute('opacity', g === ledsenG ? 1 : 0); } else ledsenG.setAttribute('opacity', 0);
    if (nara < 0.08) an.setAttribute('transform', an.getAttribute('transform') + ` scale(1 ${(0.35 + 0.65 * nara / 0.08).toFixed(3)})`);
    const u = (t - strack[0]) / (strack[1] - strack[0]), sp = u > 0 && u < 1 ? Math.sin(Math.PI * u * 2) ** 2 : 0, vick = u > 0 && u < 1 ? Math.sin(Math.PI * u * 4) * Math.sin(Math.PI * u) : 0;
    mitt.setAttribute('transform', `translate(0 ${(skutt((t - fri) / 0.6, 40) + skutt((t - hopp) / 0.5, 50)).toFixed(1)}) rotate(${(9 * vick).toFixed(2)} 960 737) translate(960 737) scale(${(1 - 0.05 * sp).toFixed(3)} ${(1 + 0.28 * sp).toFixed(3)}) translate(-960 -737)`);
    // b) kritan nickar: spetsen ner och upp, kring spetsen

    sudd.setAttribute('transform', `translate(${x.toFixed(1)} ${(y + skutt((t - ritad) / 0.5, 26)).toFixed(1)}) rotate(${(-14 * bug).toFixed(2)} 1420 860)`);

  };
