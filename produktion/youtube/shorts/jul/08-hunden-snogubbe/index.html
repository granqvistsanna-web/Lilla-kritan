<script>
// Julkalendern, lucka 8, tre minuter (produktion/youtube/julkalender-plan.md, avsnitt 6.3; omgjord efter berattelse-granskning-2026-11-12.md):
// hunden bygger en snögubbe av tre bollar som kritan ritar, och kritan ritar morotsnäsan (det byggda). Hunden går runt den, nöjd, och nosar på näsan …
// det kittlar, och hunden nyser (nysa): näsan flyger upp i granen (orsaken syns) och snögubben blir sur (ler: munnen). Hunden är förvånad och sedan
// ledsen en stund innan Malin pratar. Hunden letar på tre ställen (försök 2 och 3 kortare) och hittar den inte. Leoparden kommer: "Leoparden kan klättra!",
// och hälsar med nosen (nospuss). Barnets tur (paus ca 5 s): moroten skimrar i granen. Leoparden klättrar upp och tar den, ger den till hunden, som trycker

  lucka: 8, badd: 'jul-badd-2', figur: 'hunden-hugo', vinkArm: [36, 26], vinkHand: 0, skala: 0.85, x: -200, sak: 'snogubbe',

    [5.4, 'putta', { vid: 4.0, rit: [[1.0, 'boll2', 1.8]], sag: [[BOLL, 'Och en till!', 4.7, 2.72, 0.96]], ljud: [puff(4.7, 3)] }],

    [3.2, 'tittar', { ser: true, uttryck: 'ledsen', sag: [['jul/08-blir-ledsen', 'Hunden blir ledsen.', 1.0]] }],

    // Barnets tur: var är moroten? Den skimrar uppe i granen efter 3 s (paus ca 5 s)
    [7.5, 'stilla', { med: { 0: 'vanta' }, sag: [['jul/08-var-ar-moroten', 'Kan du se var moroten är? Kan du peka?', 0.4]], ting: { bak_morot: [[0, CX, CY, 1, 1]], ...glans(3.4, 7.5) }, ljud: [['glitter', 3.4, 1, 1.6, 2.0]] }],
    [4.0, 'stilla', { med: { 0: 'vanta' }, sag: [['jul/08-ja-dar-ar-den', 'Ja, där är den!', 2.0]], ting: { ...glans(0, 3.0) } }],
    // F: leoparden klättrar upp och tar moroten och ger den till hunden, som går fram och trycker fast den med tre små tryck

    [6.0, 'ga', { gang: [[0, 0], [3.5, 350], [6, 350]], ting: { bak_morot: [[0, 150, -330, 1, 1, 0, 1, 0]] }, med: { 0: 'stilla' }, ljud: [['smasteg', 0.8, 1, 1.5], ['smasteg', 2.5, 1, 1.5]] }],
    [4.0, 'putta', { vid: 2.0, arm: 70, ting: { bak_morot: [[0.4, 190, -380, 0.9, 1, 0, 1, 0], [2.0, 190, -380, 0.9, 1, 0, 1, 0], [2.4, 228, -405, 0.8, 1, 0, 1, 0]] }, ljud: [['pop', 2.0, 2, 1.0]] }],
    [2.6, 'putta', { vid: 1.0, arm: 70, ting: { bak_morot: [[1.0, 228, -405, 0.8, 1, 0, 1, 0], [1.4, 252, -420, 0.7, 1, 0, 1, 0]] }, ljud: [['pop', 1.0, 2, 1.0]] }],
    [2.6, 'putta', { vid: 1.0, arm: 70, ting: { bak_morot: [[1.0, 252, -420, 0.7, 1, 0, 1, 0], [1.4, 264, -433, 0.62, 1, 0, 1, 0], [1.5, MORAT[0], MORAT[1], 0.62, 0, 0, 0, 0]] }, nasaback: 1.5, ljud: [['pop', 1.0, 2, 1.0]] }],
    // G: segern är problemet, fast bra: näsan sitter och snögubben ler (ingen dans). Sedan vinkar vi till snögubben och tackar leoparden
    [4.2, 'tittar', { ser: true, ler: 0.3, uttryck: 'jatteglad', ljud: [['glitter', 0.3, 2, 1.4, 1.5], ['vov-ja', 2.6, 1, 1.0]], sag: [['jul/08-glad-igen', 'Snögubben är glad igen!', 0.9]] }],
    [2.2, 'stilla', { sag: [['jul/08-kan-du-vinka', 'Kan du vinka till snögubben?', 0.2]] }],
    [4.0, 'vinka', { ser: true, ljud: [['vov', 1.0, 1, 1.8, 1.0]] }],   // voff voff till snögubben
    [3.4, 'fniss', { mot: -1, vid: 1.8, med: { 0: 'nicka' }, sag: [['jul/tack-leoparden', 'Tack, leoparden!', 0.6]] }],

    [3.0, 'stilla', { med: { 0: 'vinka' }, sag: [['tittut/leopard-hejda', 'Hej då leoparden!', 0.5, 0, null, 4.4]], ljud: [['spinn-gullig', 2.0, '8c', 0.9]] }],
  ],
