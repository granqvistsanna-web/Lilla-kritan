<!doctype html>
<meta charset="utf-8">
<title>Julkalendern – lucka 2: lammet leker tittut i snön</title>
<script src="/verktyg/blinka.js"></script><script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script src="/produktion/youtube/shorts/jul/lucka.js"></script><script src="/produktion/youtube/shorts/jul/djur.js"></script>
<script>
// Julkalendern, lucka 2, tre minuter (produktion/youtube/julkalender-plan.md, avsnitt 6.3): tittut med luckan. Lammet leker tittut bakom luckan, två varv (det byggda), men
// tredje varvet sitter luckan fast (problemet: fastnat): den rycker men öppnas inte, och lammet puttar inifrån tre gånger. Björnen kommer in från höger och står vid luckans
// kant. Barnets tur (paus 5 s): räkna med björnen. Björnen drar tre gånger, och luckan går upp lite för varje drag, och sedan poppar den upp: Tittut! Sist leker de tittut med björnen
// och klappar tre gånger (paus 4 s). Luckan täcker hela bilden när den är stängd (dorr 1), så de bitar där lammet är bakom den visar bara luckan som rycker; luckans kant
// (dorr 0,8) lämnar en remsa till höger där björnen syns. Nya saker i motorn: luckan som fastnar (ryck, dorr), gästen drar (med: dra). Nya repliker i assets/ljud/roster/jul/ är tysta
// tills de är inspelade (förhandsvisningen läser dem):
//   02-sitter-fast [surprised] Oj! Luckan sitter fast!   02-nej-fast [sadly] Nej, den sitter fast.   nu-forsoker-vi-igen [encouraging] Nu försöker vi igen.   titta-bjornen [excited] Titta, där kommer björnen!
//   kan-du-hjalpa-till [warm] Kan du hjälpa till?   (rakna-med-mig finns)   02-dra [encouraging] Dra, dra, dra!   02-ett-tva-tre [cheerfully] Ett! Två! Tre!   hurra-det-gick [excited] Hurra! Det gick!   tack-bjornen [warm] Tack, björnen!
//   02-vill-inte-oppnas [concerned] Den vill inte öppnas.   02-lammet-puttar [curious] Lammet puttar. Men luckan rör sig inte.   bjornen-ar-stark [excited] Björnen är stark!
//   02-en-tomteluva [surprised] En tomteluva!   02-en-stjarna [surprised] En stjärna!   (09-en-rosett finns)
//   02-lammet-ar-glad [happily] Där var lammet! Lammet är glatt!   02-var-ar-bjornen [curious] Var är björnen?   02-klappa-tre [warm] Kan du också klappa tre gånger?   (bjorn-hejda och tittut/lamm-hejda finns; "Oj, där är du!" = tittut/dar-ar-du-3)
// Replikerna i tittut-varven är tittut-seriens gemensamma tagningar (assets/ljud/roster/tittut/), var och en använd en gång och avlyssnad. ba-1 har två bräk (langd 0,95), ba-2 börjar med 1,3 s tystnad (ss 1,31).
const KNARR = vid => ['gung-knarr', vid, 1, 3.2], DUNK = vid => ['dunk', vid, 1, 2.2], klapp = vid => [['tass-klapp', vid, 1, 1.3], ['tass-klapp', vid + 0.5, 2, 1.3], ['tass-klapp', vid + 1.0, 1, 1.3]];
// Varje tittut har lammet en ny julsak (Sanna 2026-11-12: överraskning varje gång): tomteluva, rosett vid örat, stjärna. Saken byts när luckan stängt helt
// (pyntVid), och stjärnan syns först när luckan poppar upp (under björnens drag har lammet ingen sak).
const GR = [0, -66, -115], PV = 0.9;   // björnens plats vid luckans kant i de tre dragen (scenens px från 845; -115 = 730, där den står efteråt), stjärnan poppar vid hoppets topp
const PYNT = [['luva', 'tomteluva', [450, 840], 512, 252, 0.5, -8], ['rosett', 'rosett', [512, 523], 320, 250, 0.36, -18], ['stjarna', 'stjarna-gul', [512, 880], 560, 230, 0.25, 10]];
julDjur.kor({
  lucka: 2, figur: 'lammet-ludde', vinkArm: [38, 16], pynt: PYNT, skala: 0.8, snoa: true,   // samma storlek som björnen (0,8 som lucka 7), snön faller hela tiden
  jacka: '#3F7FBF', jackor: { 0: '#4A8F55' },   // vinterjackor som lucka 3 och 5
  gaster: [['bjornen-bulle', 845, 0.8, 1]], sak: 'rullboll',
  scen: [
    // A–B: tre varv tittut, en ny julsak varje gång
    [2.8, 'vinka', { sag: [['tittut/lamm-hej', 'Hej lammet!', 0.75]], ljud: [['ba', 2.25, 1, 1.5, 0.95]] }],
    [1.6, 'borta', { sag: [['tittut/borta-4', 'Oj, borta!', 0.45]] }],
    [1.3, 'glant', { ljud: [['ba-fniss', 0.3, 1]] }],
    [2.0, 'borta', { pynt: 'luva', pyntVid: 0.8, sag: [['tittut/lamm-var', 'Var är lammet?', 0.4]] }],
    [5.0, 'hoppa', { sag: [['tittut/tittut-1', 'Tittut!', 0.45], ['jul/02-en-tomteluva', 'En tomteluva!', 2.6]] }],
    [1.9, 'borta', { pynt: 'rosett', pyntVid: 0.8, sag: [['tittut/borta-igen-1', 'Borta igen!', 0.5, 0, null, 4.5]] }],   // tyst tagning: högre styrka
    [4.0, 'klappa', { sag: [['tittut/tittut-5', 'Tittut!', 0.45], ['jul/09-en-rosett', 'En rosett!', 2.4]] }],
    [1.6, 'borta', { pynt: null, pyntVid: 0.8, sag: [['tittut/borta-6', 'Vips! Borta!', 0.45]] }],
    // C: luckan stannar stängd; den rycker men öppnas inte. D: lammet puttar inifrån en gång och fnissar (kortat 2026-11-12, Sanna: för långt)
    [5.2, 'borta', { ryck: [1.8], sag: [['jul/02-sitter-fast', 'Oj! Luckan sitter fast!', 2.2]], ljud: [KNARR(1.7)] }],
    [5.8, 'borta', { ryck: [1.0], ryckstyrka: 0.07, sag: [['jul/02-lammet-puttar', 'Lammet puttar. Men luckan rör sig inte.', 1.3]], ljud: [DUNK(0.8), KNARR(1.0), ['ba-fniss', 4.9, 4]] }],
    // E: björnen kommer in från höger, landar och nickar till lammet, och står vid luckans kant (dorr 0,757: hela björnen syns i glipan, med tassen vid kanten). Barnets tur: svara björnen (paus 5 s)
    // ("Räkna med mig." struken, Sanna 2026-11-13)
    [3.4, 'stilla', { dorr: 0.757, in: 0, med: { 0: ['nicka', { vid: 1.3 }] }, sag: [['jul/titta-bjornen', 'Titta, där kommer björnen!', 0.6]], ljud: [['hopp-mjuk', 0.1, 5], ['landa-mjuk', 1.05, 5]] }],
    [2.2, 'stilla', { dorr: 0.757, med: { 0: 'vanta' }, sag: [['jul/kan-du-hjalpa-till', 'Kan du hjälpa till?', 0.3]] }],
    [5.0, 'stilla', { dorr: 0.757, med: { 0: ['nicka', { vid: 0.5 }] }, ljud: [['ba', 2.0, 1, 1.2, 2.85]] }],   // björnen nickar, lammet svarar bä-bä bakom luckan (Sanna 2026-11-13, 0:53)
    // F: björnen drar tre gånger (Sanna 2026-11-13, 1:07: bättre dra). Den går fram till luckans kant och tar tag (tassen bakom kanten), lutar sig bakåt,
    // och luckan rycker upp en bit medan den lutar sig (dörrens steg börjar när draget är som störst). Greppet hålls mellan dragen; björnen tar ett steg
    // efter kanten och drar igen. Tredje draget poppar luckan upp. GR = björnens plats (dx) vid kanten för varje drag.
    [3.4, 'stilla', { dorr: 0.757, med: { 0: ['dra', { vid: [3.2], kraft: 1.6, ramp: 'in', dx: GR[0], dxFran: 0, dxTid: 0.9 }] }, sag: [['jul/02-dra', 'Dra, dra, dra!', 1.0]], ljud: [KNARR(2.9)] }],
    [1.5, 'stilla', { dorr: 0.728, med: { 0: ['dra', { vid: [-0.2], kraft: 1.6, ramp: 'ingen', dx: GR[0] }] }, ljud: [DUNK(0.2)] }],
    [2.0, 'stilla', { dorr: 0.728, med: { 0: ['dra', { vid: [1.8], kraft: 1.6, ramp: 'ingen', dx: GR[1], dxFran: GR[0], dxTid: 0.8 }] }, sag: [['jul/02-ett-tva-tre', 'Ett! Två! Tre!', 0.1]], ljud: [KNARR(1.5)] }],
    [1.5, 'stilla', { dorr: 0.706, med: { 0: ['dra', { vid: [-0.2], kraft: 1.6, ramp: 'ingen', dx: GR[1] }] }, ljud: [DUNK(0.2)] }],
    [2.0, 'stilla', { dorr: 0.706, med: { 0: ['dra', { vid: [1.8], kraft: 1.8, ramp: 'ingen', dx: GR[2], dxFran: GR[1], dxTid: 0.8 }] }, ljud: [KNARR(1.5)] }],
    // luckan poppar upp, lammet hoppar, och stjärnan poppar fram på huvudet högst upp i hoppet (Sanna 2026-11-13, 1:15: stjärnan kom konstigt)
    [3.6, 'hoppa', { dorr: 0, pynt: 'stjarna', pyntVid: PV, pyntPop: 0.45, med: { 0: ['dra', { vid: [-0.2], kraft: 1.8, ramp: 'ut', dx: GR[2] }] }, sag: [['tittut/tittut-6', 'Tittut!', 0.45], ['jul/02-en-stjarna', 'En stjärna!', 1.9]], ljud: [['duns', 0.15, 1, 2.0], ['glimt', PV, 1, 3]] }],
    // lammet och björnen tittar på varandra och fnissar en gång
    [1.8, 'fniss', { dorr: 0, vid: 0.7, med: { 0: ['fniss', { vid: 0.7, dx: GR[2] }] }, ljud: [['ba-fniss', 0.4, 2]] }],
    [3.0, 'stilla', { uttryck: 'skrattar', dorr: 0, med: { 0: ['stilla', { dx: GR[2] }] }, sag: [['jul/02-lammet-ar-glad', 'Där var lammet! Lammet är glatt!', 0.3]] }],
    // bollen (Sanna 2026-11-13: djuren rullar den röda bollen till varandra, lugnt): kritan ritar den framför lammet, lammet puttar den till björnen,
    // björnen knuffar tillbaka, och en gång till. Replikerna är tagningarna från zebran plockar undan (inga djurnamn i dem)
    [3.0, 'stilla', { dorr: 0, rit: [[0.2, 'boll', 2.4]], med: { 0: ['stilla', { dx: GR[2] }] } }],
    [5.8, 'putta', { dorr: 0, vid: 0.7, rull: [300, 480, 0.75, 2.6], med: { 0: ['stilla', { dx: GR[2] }] }, sag: [['zebran-plockar-undan/21-rulla-till-dig', 'Ska vi leka lite? Rulla, rulla till dig!', 1.0]], ljud: [['rull', 0.75, 1, 1.5]] }],
    [4.4, 'tittar', { dorr: 0, rull: [480, 300, 2.1, 4.0], med: { 0: ['knuffa', { gang: [[0, 0]], knuff: [[1.9, 2.3]], dx: GR[2] }] }, sag: [['zebran-plockar-undan/22-rulla-tillbaka', 'Kan du rulla tillbaka?', 0.2]], ljud: [['rull', 2.1, 1, 1.5]] }],
    [3.2, 'putta', { dorr: 0, vid: 0.5, rull: [300, 480, 0.55, 2.4], med: { 0: ['stilla', { dx: GR[2] }] }, sag: [['zebran-plockar-undan/24-till-dig-tillbaka', 'Till dig och tillbaka!', 0.8]], ljud: [['rull', 0.55, 1, 1.5]] }],
    [2.8, 'tittar', { dorr: 0, rull: [480, 300, 0.6, 2.5], med: { 0: ['knuffa', { gang: [[0, 0]], knuff: [[0.4, 0.8]], dx: GR[2] }] }, ljud: [['rull', 0.6, 1, 1.5]] }],
    // G: firande. Barnets tur: klappa tre gånger (paus 4 s)
    [2.6, 'hoppa', { uttryck: 'stolt', dorr: 0, med: { 0: ['hoppa', { dx: GR[2] }] }, sag: [['jul/hurra-det-gick', 'Hurra! Det gick!', 0.8]], ljud: [['hopp-mjuk', 0.35, 1], ['landa-mjuk', 1.35, 1]] }],
    // på "Tack, björnen!" tittar lammet på björnen, och björnen nickar och brummar (Sanna 2026-11-13, 1:37)
    [3.4, 'fniss', { dorr: 0, vid: 9, med: { 0: ['nicka', { vid: 1.0, dx: GR[2] }] }, sag: [['jul/tack-bjornen', 'Tack, björnen!', 0.2]], ljud: [['brum-gullig', 1.4, 3]] }],
    [2.6, 'stilla', { med: { 0: ['stilla', { dx: GR[2] }] }, sag: [['jul/02-klappa-tre', 'Kan du också klappa tre gånger?', 0.2]] }],
    // båda klappar tre gånger, två gånger om, och klappljuden ligger på klapparna (Sanna 2026-11-13, 1:37: förut klappade lammet bara en gång och björnen tre)
    [3.0, 'klappa', { med: { 0: ['klappa', { dx: GR[2] }] }, ljud: klapp(1.0) }],
    [3.0, 'klappa', { med: { 0: ['klappa', { dx: GR[2] }] }, ljud: klapp(1.0) }],
    [2.6, 'stilla', { med: { 0: ['stilla', { dx: GR[2] }] } }],
    // H: hej då
    [2.6, 'vinka', { med: { 0: ['stilla', { dx: GR[2] }] }, sag: [['tittut/lamm-hejda', 'Hej då lammet!', 0.5]], ljud: [['ba', 1.75, 2, 1.5, 0.95, 1.31]] }],
    [2.4, 'stilla', { med: { 0: ['vinka', { dx: GR[2] }] }, sag: [['jul/bjorn-hejda', 'Hej då björnen!', 0.5]], ljud: [['brum-gullig', 1.85, '1d']] }],
  ],
});
</script>
