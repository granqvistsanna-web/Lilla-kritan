<title>Julkalendern – lucka 2: lammet leker tittut i snön</title>
<script src="/verktyg/blinka.js"></script><script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script src="/produktion/youtube/shorts/jul/lucka.js"></script><script src="/produktion/youtube/shorts/jul/djur.js"></script>
<script>
// Julkalendern, lucka 2, tre minuter (produktion/youtube/julkalender-plan.md, avsnitt 6.3): tittut med luckan. Lammet leker tittut bakom luckan, två varv (det byggda), men
// tredje varvet fastnar luckan på glänt (problemet): lammet syns ledset i springan och puttar två gånger (granskning 2026-11-15). Björnen kommer in från höger och står vid luckans
// kant. Barnets tur: räkna dragen (Ett! Två! Tre!, ett tal per drag). Björnen drar tre gånger, och luckan går upp en tydlig bit för varje drag, och sedan poppar den upp: Tittut! Närbild på lammets glada ansikte, hurra och tack, bollen,
// och klappar tre gånger (paus 4 s). Luckan täcker hela bilden när den är stängd (dorr 1), så de bitar där lammet är bakom den visar bara luckan som rycker; luckans kant
// (dorr 0,8) lämnar en remsa till höger där björnen syns. Nya saker i motorn: luckan som fastnar (ryck, dorr), gästen drar (med: dra). Nya repliker i assets/ljud/roster/jul/ är tysta
// tills de är inspelade (förhandsvisningen läser dem):
//   02-sitter-fast [surprised] Oj! Luckan sitter fast!   02-nej-fast [sadly] Nej, den sitter fast.   nu-forsoker-vi-igen [encouraging] Nu försöker vi igen.   titta-bjornen [excited] Titta, där kommer björnen!
//   kan-du-hjalpa-till [warm] Kan du hjälpa till?   (rakna-med-mig finns)   02-dra [encouraging] Dra, dra, dra!   02-ett-tva-tre [cheerfully] Ett! Två! Tre!   hurra-det-gick [excited] Hurra! Det gick!   tack-bjornen [warm] Tack, björnen!
//   02-vill-inte-oppnas [concerned] Den vill inte öppnas.   02-lammet-puttar [curious] Lammet puttar. Men luckan rör sig inte.   bjornen-ar-stark [excited] Björnen är stark!
//   02-en-tomteluva [surprised] En tomteluva!   02-en-stjarna [surprised] En stjärna!   (09-en-rosett finns)
//   02-lammet-ar-glad [happily] Där var lammet! Lammet är glatt!   02-var-ar-bjornen [curious] Var är björnen?   02-klappa-tre [warm] Kan du också klappa tre gånger?   (bjorn-hejda och tittut/lamm-hejda finns; "Oj, där är du!" = tittut/dar-ar-du-3)
// Replikerna i tittut-varven är tittut-seriens gemensamma tagningar (assets/ljud/roster/tittut/), var och en använd en gång och avlyssnad. ba-1 har två bräk (langd 0,95), ba-2 börjar med 1,3 s tystnad (ss 1,31).
const KNARR = vid => ['gung-knarr', vid, 1, 3.2], DUNK = vid => ['dunk', vid, 1, 2.2];
// Varje tittut har lammet en ny julsak (Sanna 2026-11-12: överraskning varje gång): tomteluva, rosett vid örat, stjärna. Saken byts när luckan stängt helt
// (pyntVid), och stjärnan syns först när luckan poppar upp (under björnens drag har lammet ingen sak).
const K = 0.68, D = [K, 0.58, 0.5], GR = D.map(k => Math.round((k - 0.757) * 1920 / 0.74)), GB = 90, GS = -115, PV = 0.9;   // K = luckan som fastnat på glänt (QA 2026-11-15: mindre lucka); D = luckan efter varje drag; GR = björnens plats vid kanten (scenens px från 845, följer kanten; 0,757 = 845); GB = där den står fritt innan den tar tag; GS = där den står efteråt (730); stjärnan poppar vid hoppets topp
const PYNT = [['luva', 'tomteluva', [450, 840], 512, 252, 0.5, -8], ['rosett', 'rosett', [512, 523], 320, 250, 0.36, -18], ['stjarna', 'stjarna-gul', [512, 880], 560, 230, 0.25, 10]];
julDjur.kor({
  lucka: 2, baddFil: 'assets/ljud/musik/jul/karol-pynta-salen.mp3', baddLangd: 125.022, baddVol: 0.3, figur: 'lammet-ludde', vinkArm: [38, 16], pynt: PYNT, skala: 0.8, x: -300, snoa: true, bakgrund: '/assets/bakgrunder/julskogen/julskogen.png', vid: [0.74, 870],   // samma storlek som björnen (0,8 som lucka 7), snön faller hela tiden
  jacka: '#3F7FBF', jackor: { 0: '#4A8F55' },   // vinterjackor som lucka 3 och 5
  gaster: [['bjornen-bulle', 845, 0.8, 1]], sak: 'rullboll',
  scen: [
    // A–B: tre varv tittut, en ny julsak varje gång
    [2.8, 'vinka', { sag: [['tittut/lamm-hej', 'Hej lammet!', 0.75]], ljud: [['ba', 2.25, 1, 1.5, 0.95]] }],
    [1.6, 'borta', { sag: [['tittut/borta-4', 'Oj, borta!', 0.45]] }],
    [1.3, 'glant', { ljud: [['ba-fniss', 0.3, 1]] }],
    [2.0, 'borta', { pynt: 'luva', pyntVid: 0.8, sag: [['tittut/lamm-var', 'Var är lammet?', 0.4]] }],
    [5.0, 'hoppa', { sag: [['tittut/tittut-1', 'Tittut!', 0.45], ['jul/02-en-tomteluva', 'En tomteluva!', 2.6]] }],
    [1.9, 'borta', { pynt: 'rosett', pyntVid: 0.8, sag: [['tittut/borta-igen-1', 'Borta igen!', 0.5, 0, null, 4.5]] }],   // tyst tagning: högre styrka
    [4.0, 'klappa', { sag: [['tittut/tittut-5', 'Tittut!', 0.45], ['jul/09-en-rosett', 'En rosett!', 2.4]] }],
    [1.6, 'borta', { pynt: null, pyntVid: 0.8, sag: [['tittut/borta-6', 'Vips! Borta!', 0.45]] }],
    // C (granskning 2026-11-15, J02:1): luckan försöker öppnas men fastnar på glänt (K). Lammet syns i springan: förvånat, sedan ledset, och puttar på luckan
    // två gånger inifrån (luckan rycker lite vid varje putt). Sedan går lammet in igen när björnen kommer, så att björnen får plats i glipan.
    [4.6, 'glant', { kant: K, kantDx: 110, dorr: K, uttryck: 'forvanad', ryck: [1.4], sag: [['jul/02-sitter-fast', 'Oj! Luckan sitter fast!', 1.9]], ljud: [KNARR(0.2), KNARR(1.3)] }],
    [5.2, 'glantputt', { kant: K, kantDx: 110, dorr: K, uttryck: 'ledsen', vid: [0.6, 2.0], ryck: [0.6, 2.0], ryckstyrka: 0.03, sag: [['jul/02-lammet-puttar', 'Lammet puttar. Men luckan rör sig inte.', 1.0]], ljud: [DUNK(0.55), ['dunk', 1.95, 2, 2.2]] }],
    [2.4, 'glant', { kant: K, kantDx: 110, dorr: K, uttryck: 'ledsen', sag: [['jul/02-vill-inte-oppnas', 'Den vill inte öppnas.', 0.3]] }],
    // E: björnen kommer in från höger, landar och nickar till lammet, och står vid luckans kant (hela björnen syns i glipan, tassen vid kanten)
    [3.4, 'borta', { dorr: K, in: 0, med: { 0: ['nicka', { vid: 1.3, dx: GB }] }, sag: [['jul/titta-bjornen', 'Titta, där kommer björnen!', 0.6]], ljud: [['hopp-mjuk', 0.1, 5], ['landa-mjuk', 1.05, 5]] }],
    [2.2, 'borta', { dorr: K, med: { 0: ['vanta', { dx: GB }] }, sag: [['jul/bjornen-ar-stark', 'Björnen är stark!', 0.2]] }],
    // björnen nickar, lammet svarar bä-bä bakom luckan (Sanna 2026-11-13). Barnets tur: räkna dragen (ett tal per drag, J02:3)
    [3.4, 'borta', { dorr: K, med: { 0: ['nicka', { vid: 1.4, dx: GB }] }, sag: [['jul/kan-du-hjalpa-till', 'Kan du hjälpa till?', 0.2]], ljud: [['brum-gullig', 1.6, 2], ['ba', 2.3, 1, 1.2, 0.95]] }],
    // F: björnen drar tre gånger (J02:2). Den går fram till kanten och tar tag, lutar sig bakåt, och luckan går upp en tydlig bit (D) när draget är som störst.
    // Sedan släpper den, går efter kanten (hamta) och tar tag igen. Malin räknar ett tal per drag ur 02-ett-tva-tre (ss, langd). Tredje draget poppar luckan upp.
    [1.4, 'borta', { dorr: K, med: { 0: ['hamta', { gang: [[0, 0], [1.2, GR[0] - GB]], dx: GB }] } }],   // björnen går fram till kanten
    [3.0, 'borta', { dorr: K, med: { 0: ['dra', { vid: [2.8], kraft: 1.6, ramp: 'in', dx: GR[0] }] }, sag: [['jul/02-dra', 'Dra, dra, dra!', 0.5]], ljud: [KNARR(2.8), ['brum-gullig', 2.6, 5]] }],
    [1.5, 'borta', { dorr: D[1], med: { 0: ['dra', { vid: [-0.2], kraft: 1.6, ramp: 'ut', dx: GR[0] }] }, sag: [['jul/02-ett-tva-tre', 'Ett!', 0.25, 0, 0.65]], ljud: [DUNK(0.25)] }],
    [1.5, 'borta', { dorr: D[1], med: { 0: ['hamta', { gang: [[0, 0], [1.3, GR[1] - GR[0]]], dx: GR[0] }] } }],
    [2.0, 'borta', { dorr: D[1], med: { 0: ['dra', { vid: [1.8], kraft: 1.6, ramp: 'in', dx: GR[1] }] }, ljud: [KNARR(1.8), ['brum-gullig', 1.6, 6]] }],
    [1.5, 'borta', { dorr: D[2], med: { 0: ['dra', { vid: [-0.2], kraft: 1.6, ramp: 'ut', dx: GR[1] }] }, sag: [['jul/02-ett-tva-tre', 'Två!', 0.25, 1.1, 0.75]], ljud: [['dunk', 0.25, 3, 2.2]] }],
    [1.5, 'borta', { dorr: D[2], med: { 0: ['hamta', { gang: [[0, 0], [1.3, GR[2] - GR[1]]], dx: GR[1] }] } }],
    [2.0, 'borta', { dorr: D[2], med: { 0: ['dra', { vid: [1.8], kraft: 1.8, ramp: 'in', dx: GR[2] }] }, ljud: [KNARR(1.8), ['brum-gullig', 1.6, 7]] }],
    // luckan poppar upp på "Tre!", lammet hoppar, och stjärnan poppar fram på huvudet högst upp i hoppet (Sanna 2026-11-13)
    [4.0, 'hoppa', { dorr: 0, pynt: 'stjarna', pyntVid: PV, pyntPop: 0.45, med: { 0: ['dra', { vid: [-0.2], kraft: 1.8, ramp: 'ut', dx: GR[2] }] }, sag: [['jul/02-ett-tva-tre', 'Tre!', 0.15, 2.35, 0.64], ['tittut/tittut-6', 'Tittut!', 0.9], ['jul/02-en-stjarna', 'En stjärna!', 2.3]], ljud: [['duns', 0.15, 1, 2.0], ['glimt', PV, 1, 3]] }],
    // närbild på lammets glada ansikte (J02:5); under tiden går björnen tillbaka till sin plats (GS)
    [3.0, 'stilla', { uttryck: 'skrattar', dorr: 0, nara: true, med: { 0: ['hamta', { gang: [[0.2, 0], [2.7, GS - GR[2]]], dx: GS }] }, sag: [['jul/02-lammet-ar-glad', 'Där var lammet! Lammet är glatt!', 0.3]] }],
    // lammet och björnen tittar på varandra och fnissar, sedan hurra och tack direkt (J02:4), och bollen efteråt som lek
    [1.8, 'fniss', { dorr: 0, vid: 0.7, med: { 0: ['fniss', { vid: 0.7, dx: GS }] }, ljud: [['ba-fniss', 0.4, 2], ['brum-fniss', 0.6, 2]] }],
    [2.6, 'hoppa', { uttryck: 'stolt', dorr: 0, med: { 0: ['hoppa', { dx: GS }] }, sag: [['jul/hurra-det-gick', 'Hurra! Det gick!', 0.8]], ljud: [['hopp-mjuk', 0.35, 1], ['landa-mjuk', 1.35, 1]] }],
    // på "Tack, björnen!" tittar lammet på björnen, och björnen nickar och brummar (Sanna 2026-11-13)
    [3.0, 'fniss', { dorr: 0, vid: 9, med: { 0: ['nicka', { vid: 1.0, dx: GS }] }, sag: [['jul/tack-bjornen', 'Tack, björnen!', 0.2]], ljud: [['brum-gullig', 1.4, 3]] }],
    // bollen (Sanna 2026-11-13: djuren rullar den röda bollen till varandra, lugnt): kritan ritar den framför lammet, lammet puttar den till björnen,
    // björnen knuffar tillbaka, och en gång till. Replikerna är tagningarna från zebran plockar undan (inga djurnamn i dem)
    [3.0, 'stilla', { dorr: 0, rit: [[0.2, 'boll', 2.4]], med: { 0: ['stilla', { dx: GS }] } }],
    [6.4, 'putta', { dorr: 0, vid: 0.7, rull: [70, 440, 0.75, 3.2], med: { 0: ['stilla', { dx: GS }] }, sag: [['zebran-plockar-undan/21-rulla-till-dig', 'Ska vi leka lite? Rulla, rulla till dig!', 1.0]], ljud: [['rull', 0.75, 1, 1.5]] }],
    [4.8, 'tittar', { dorr: 0, rull: [440, 70, 2.1, 4.4], med: { 0: ['knuffa', { gang: [[0, 0]], knuff: [[1.9, 2.3]], dx: GS }] }, sag: [['zebran-plockar-undan/22-rulla-tillbaka', 'Kan du rulla tillbaka?', 0.2]], ljud: [['rull', 2.1, 1, 1.5]] }],
    [3.6, 'putta', { dorr: 0, vid: 0.5, rull: [70, 440, 0.55, 2.9], med: { 0: ['stilla', { dx: GS }] }, sag: [['zebran-plockar-undan/24-till-dig-tillbaka', 'Till dig och tillbaka!', 0.8]], ljud: [['rull', 0.55, 1, 1.5]] }],
    [3.2, 'tittar', { dorr: 0, rull: [440, 70, 0.6, 3.0], med: { 0: ['knuffa', { gang: [[0, 0]], knuff: [[0.4, 0.8]], dx: GS }] }, ljud: [['rull', 0.6, 1, 1.5]] }],
    // G: barnets tur: klappa tre gånger (paus 4 s)
    [2.6, 'stilla', { med: { 0: ['stilla', { dx: GS }] }, sag: [['jul/02-klappa-tre', 'Kan du också klappa tre gånger?', 0.2]] }],
    // båda klappar tre gånger, två gånger om, och klappljuden ligger på klapparna (Sanna 2026-11-13)
    [3.0, 'klappa', { nara: true, med: { 0: ['klappa', { dx: GS }] } }],   // närbild på lammet som klappar (QA 2026-11-15)
    [3.0, 'klappa', { med: { 0: ['klappa', { dx: GS }] } }],
    [2.6, 'stilla', { med: { 0: ['stilla', { dx: GS }] } }],
    // H: hej då
    [2.6, 'vinka', { med: { 0: ['stilla', { dx: GS }] }, sag: [['tittut/lamm-hejda', 'Hej då lammet!', 0.5]], ljud: [['ba', 1.75, 2, 1.5, 0.95, 1.31]] }],
    [2.4, 'stilla', { med: { 0: ['vinka', { dx: GS }] }, sag: [['jul/bjorn-hejda', 'Hej då björnen!', 0.5]], ljud: [['brum-gullig', 1.85, '1d']] }],
  ],
});
</script>
