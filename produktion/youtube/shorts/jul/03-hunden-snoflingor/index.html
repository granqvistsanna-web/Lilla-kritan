<meta charset="utf-8">
<title>Julkalendern – lucka 3: hunden och den glittrande flingan</title>
<script src="/verktyg/blinka.js"></script><script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script src="/produktion/youtube/shorts/jul/lucka.js"></script><script src="/produktion/youtube/shorts/jul/djur.js"></script>
<script>
// Julkalendern, lucka 3 (nytt manus 2026-11-12, omgång 3 2026-11-13 efter Sannas feedback: snabbare, vinden, grisen blåser, hurra direkt):
// vinterkullen med en gran, hunden och grisen.
// 1 Hunden fångar två flingor på nosen. 2 En stor flinga som glittrar dalar ner, och hunden vill äta den: hoppar med öppen mun.
// 3 En vindpust (tre långa vindstreck) blåser iväg flingan upp i granens topp. 4 Hunden går dit och hoppar men når inte,
// och blir ledsen. 5 Grisen kommer och försöker blåsa ner flingan: den gungar men sitter fast. Barnets tur: blåsa (paus 4,5 s).
// 6 Tre blås: flingan gungar, lossnar och dalar ner. 7 Den landar på hundens nos: "Hurra! Det gick!" direkt, och hunden slickar i sig
// flingan (mums). 8 Snöbollslek med barnet (paus 4 s), tack och hej då.
// Luckans egna ting (tingrit): gflinga = den glittrande flingan, sb = snöbollen, snopuff = snöstänket där den landar.
// Repliker (assets/ljud/roster/jul/, listade i rost*.txt). De tre orden i 03-fff ligger på var sitt blås (ss, langd).
const { bild } = julDjur;
const HX = -470, TRAD = 200, TOPP = [TRAD - 6, -850];   // hundens plats, granen (stammens fot) och flingan i granens topp
const SK = 0.72;   // hunden och grisen lite mindre, så att granen blir hög och flingan i toppen ligger utom räckhåll
const NOS = [14, -368];   // flingans mitt på hundens nos, räknat från fötterna (scenens mått)
const DX = -80;   // där hunden står vid granen
const hopp = (k, pip) => [['hopp-mjuk', 0.35, k], ['vov-pip', pip, (k - 1) % 3 + 1], ['landa-mjuk', 1.35, k]];   // pip: efter repliken
// den glittrande flingan: [sekunder, x, y, grader, följer, storlek, synlig] (skala 1,5), följer = 1 sitter på hunden
const flk = (...n) => n.map(([s, x, y, rot = 0, folj = 0, sk = 1.5, op = 1]) => [s, x, y, sk, op, rot, folj]), fl = (...n) => ({ ting: { gflinga: flk(...n) } });
// vindpusten från vänster: tre långa vindstreck (tingrit vind) sveper förbi hunden snett upp mot granens topp, med en liten krull i slutet
const svep = (vid, dy) => [[vid, -1150, -560 + dy, 0.8, 0, -14, 0], [vid + 0.25, -950, -620 + dy, 1, 1, -14, 0], [vid + 1.1, -150, -860 + dy, 1.1, 1, -14, 0], [vid + 1.5, 120, -930 + dy, 1.1, 0, -14, 0]];
const vind = (vid, flinga) => ({ ting: { gflinga: flinga, vind1: svep(vid, 0), vind2: svep(vid + 0.15, 150), vind3: svep(vid + 0.3, -140) }, ljud: [['vind-hatt', vid - 0.1, 3, 1.6]] });
// blås: grisen fyller kinderna (0,4 s) och släpper luften vid vid: en tydlig puff far från trynet upp till flingan (0,6 s),
// och barnets puff kommer från vänster samtidigt. Flingan rör sig när puffarna når fram (vid + 0,5)
const blas = vid => ({ puff: [[vid, 545, -330, -1, 300, -450], [vid, TOPP[0] - 360, TOPP[1] + 30, 1, 280]], med: { 0: ['blasaKind', { vid: [vid] }] }, ljud: [['sus', vid - 0.05, 1, 2.0, 0.8, 2.0]] });
// snöbollen (assets/rekvisita/snoboll, r 85 px) och snöstänket när den landar; sb: [sekunder, x, y, storlek, synlig]
const SP = [[-120, -20, 26], [-60, -90, 20], [10, -120, 24], [80, -96, 18], [130, -20, 22], [-20, -40, 16]].map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="#B9D3E6" stroke-width="5"/>`).join('');
const SB = bild('snoboll', 1024, 1024, [512, 512], 85 / 378), GR = 640;   // GR: grisens plats
const sb = (...n) => n.map(([s, x, y, sk = 1, op = 1]) => [s, x, y, sk, op, 0, 0]);
julDjur.kor({
  lucka: 3, badd: 'jul-badd-2', figur: 'hunden-hugo', vinkArm: [36, 26], vinkHand: 0, nos: [512, 428], skala: SK, x: HX,   // vinkar stort med vänster arm (svansen sitter till höger)
  jacka: '#3F7FBF', jackor: { 0: '#4A8F55' },
  sak: 'gran', sakPlats: [TRAD, 0],
  gaster: [['grisen-greta', 640, SK, 1]],
  tingrit: {
    // mindre glitter (Sanna 2026-11-13): svagare sken och en liten stjärna
    gflinga: `<circle r="80" fill="url(#sak-sken)" opacity=".3"/>${bild('snoflinga', 1024, 1024, [512, 512], 62 / 437)}
      <path transform="translate(60 -56) scale(.32)" d="M0 -44 Q4 -4 44 0 Q4 4 0 44 Q-4 4 -44 0 Q-4 -4 0 -44 Z" fill="#F6C531" stroke="#fff" stroke-width="10" stroke-linejoin="round" paint-order="stroke"/>`,
    vind: ['#9CC3DE" stroke-width="22', '#fff" stroke-width="11'].map(s => `<path d="M-300 0 Q-150 -36 0 0 Q140 34 250 0 Q310 -24 290 -62 Q262 -86 236 -58" fill="none" stroke="${s}" stroke-linecap="round" stroke-linejoin="round"/>`).join(''),
    snopuff: SP, sb: SB,   // sb1–sb4, snopuff2–4 och vind1–3 använder samma ritning
  },
  scen: [
    // 1: snöflingor på nosen
    [2.6, 'vinka', { sag: [['tittut/hund-hej', 'Hej hunden!', 0.6]], ljud: [['vov', 2.0, 1, 1.8, 1.0]] }],
    [2.3, 'snoar', { sag: [['jul/03-det-snoar', 'Titta, det snöar!', 0.4]] }],
    [2.1, 'fanga', { sag: [['jul/03-en-snoflinga', 'En snöflinga!', 0.5]], ljud: hopp(1, 1.95) }],
    [2.0, 'fanga', { uttryck: 'kawaii', sag: [['jul/03-en-till', 'En till!', 0.5]], ljud: [...hopp(2, 1.5), ['svansvift', 1.4, 1]] }],
    // 2: en stor flinga som glittrar dalar ner, och hunden vill äta den (gapar)
    [5.6, 'snoar', { ...fl([0, HX + 300, -1180, -20], [2.2, HX + 180, -1000, 10], [4.2, HX + 60, -800, -8], [5.6, HX + 30, -730, 2]), ljud: [['glitter', 0.3, 1, 0.8]],
      sag: [['jul/03-jatteflinga', 'Titta! En jätteflinga!', 0.3], ['jul/03-den-glittrar', 'Den glittrar!', 3.4]] }],
    [2.4, 'stilla', { uttryck: 'gapar', ...fl([0, HX + 30, -730, 2], [2.4, HX + 30, -715, -4]), sag: [['jul/03-vill-ata-den', 'Hunden vill äta den!', 0.3]], ljud: [['mums', 1.9, 7, 1.2]] }],
    // 3: hunden hoppar upp med öppen mun, och en vindpust blåser iväg flingan upp i granen (orsaken syns: vindstrecken)
    [3.2, 'fanga', { hojd: 1.3, storlek: 0.001, uttryck: 'gapar',
      ...vind(0.55, flk([0, HX + 30, -715, -4], [0.75, HX + 40, -735, 0], [1.4, HX + 300, -930, 30], [2.2, TOPP[0] - 70, TOPP[1] - 60, -12], [2.7, ...TOPP, 6], [3.2, ...TOPP, 0])),
      sag: [['jul/03-flog-ivag', 'Oj! Den flög iväg.', 1.3]] }],
    [2.4, 'tittar', { uttryck: 'forvanad', sag: [['jul/03-i-granen', 'Flingan sitter i granen!', 0.2]] }],
    // 4: hunden går till granen och hoppar, men når inte
    [2.0, 'ga', { gang: [[0, 0], [1.8, DX - HX]] }],
    [2.4, 'fanga', { hojd: 1.3, storlek: 0.001, uttryck: 'gapar', ljud: [['hopp-mjuk', 0.35, 3], ['landa-mjuk', 1.35, 3]] }],
    [2.2, 'stilla', { uttryck: 'ledsen', ser: true, sag: [['jul/03-nar-inte', 'Hunden når inte.', 0.2]], ljud: [['vov-pip', 1.6, 2, 1.2]] }],
    [2.0, 'stilla', { uttryck: 'ledsen', sag: [['jul/03-blir-ledsen', 'Hunden blir ledsen.', 0.2]] }],
    // 5: grisen kommer och försöker blåsa ner flingan: den gungar men sitter fast. Barnets tur: blåsa (paus 4,5 s)
    [2.6, 'tittar', { in: 0, sag: [['jul/titta-grisen', 'Titta, där kommer grisen!', 0.4]], ljud: [['hopp-mjuk', 0.1, 4], ['landa-mjuk', 1.05, 4]] }],
    [3.0, 'tittar', { ...blas(0.6), sag: [['jul/03-grisen-forsoker', 'Grisen försöker blåsa ner den!', 0.3]],
      ...fl([1.1, ...TOPP, 0], [1.35, ...TOPP, 14], [1.7, ...TOPP, -10], [2.1, ...TOPP, 5], [2.5, ...TOPP, 0]), ljud: [['sus', 0.55, 1, 1.8, 0.8, 2.0], ['gung-knarr', 1.2, 1, 0.8]] }],
    [2.4, 'stilla', { uttryck: 'ledsen', med: { 0: 'vanta' }, sag: [['jul/02-nej-fast', 'Nej, den sitter fast.', 0.2]] }],
    [7.6, 'stilla', { ser: true, med: { 0: 'vanta' }, sag: [['jul/kan-du-hjalpa-till', 'Kan du hjälpa till?', 0.1], ['jul/03-kan-du-blasa', 'Kan du blåsa? Fff!', 1.3]] }],
    // 6: tre blås: flingan gungar, lossnar och dalar ner till hundens nos
    [2.3, 'stilla', { ser: true, ...blas(0.4), sag: [['jul/03-fff', 'Fff!', 0.35, 0, 0.45]], ...fl([0.85, ...TOPP, 0], [1.15, ...TOPP, 16], [1.5, ...TOPP, -10], [1.9, ...TOPP, 6], [2.3, ...TOPP, 0]) }],
    [2.3, 'stilla', { ser: true, ...blas(0.4), sag: [['jul/03-fff', 'Fff!', 0.35, 0.72, 0.45]], ...fl([0.85, ...TOPP, 0], [1.3, TOPP[0] - 50, TOPP[1] + 40, 26], [1.8, TOPP[0] - 40, TOPP[1] + 30, 12], [2.3, TOPP[0] - 46, TOPP[1] + 36, 20]) }],
    [3.6, 'snoar', { ...blas(0.4), sag: [['jul/03-fff', 'Fff!', 0.35, 1.46, 0.62], ['jul/03-nu-kommer-den', 'Nu kommer den!', 1.4]],
      ...fl([0.85, TOPP[0] - 46, TOPP[1] + 36, 20], [1.6, TOPP[0] - 170, TOPP[1] + 120, -14], [2.4, TOPP[0] - 90, TOPP[1] + 200, 12], [3.6, TOPP[0] - 200, TOPP[1] + 290, -6]) }],
    // 7: flingan landar på nosen (följer = 1 från landningen), och genast "Hurra! Det gick!". Sedan slickar hunden i sig den: mums
    [1.8, 'snoar', { ...fl([0, TOPP[0] - 200, TOPP[1] + 290, -6], [1.0, DX + NOS[0], NOS[1] - 90, -4, 0, 0.8], [1.5, NOS[0], NOS[1], 0, 1, 0.55]), ljud: [['glimt', 1.5, 2, 2.4]] }],
    [2.6, 'hoppa', { uttryck: 'jatteglad', med: { 0: 'hoppa' }, sag: [['jul/hurra-det-gick', 'Hurra! Det gick!', 0.2]], ljud: [['hopp-mjuk', 0.35, 1], ['landa-mjuk', 1.35, 1]] }],
    [2.2, 'stilla', { uttryck: 'jatteglad', sag: [['jul/03-pa-nosen', 'Den landade på nosen!', 0.1]] }],
    [2.6, 'stilla', { uttryck: 'mums', ...fl([0.4, NOS[0], NOS[1], 0, 1, 0.55], [1.0, NOS[0], NOS[1] + 20, 0, 1, 0.1, 0]), ljud: [['slurp', 0.5, 3, 1.6], ['mums', 1.0, 6, 1.4]] }],
    [2.6, 'vagga', { uttryck: 'kawaii', sag: [['jul/03-sa-glad', 'Hunden är så glad!', 0.2]], ljud: [['vov', 2.0, 1, 1.8, 0.6]] }],
    [1.8, 'stilla', { uttryck: 'glad', sag: [['jul/tack-grisen', 'Tack, grisen!', 0.2]], ljud: [['noff-gullig', 1.3, 2, 1.2, 0.6]] }],
    // 8: snöbollslek. Grisen gör en snöboll och kastar den mjukt till hunden (puff på magen), hunden fnissar och kastar tillbaka.
    // Barnets tur att kasta (paus 4 s): två snöbollar seglar in från tittaren och landar mjukt i snön framför dem
    [3.2, 'tittar', { med: { 0: ['hamta', { gang: [[0, 0]], ner: [[0.2, 2.7]] }] }, sag: [['jul/03-gor-snoboll', 'Titta! Grisen gör en snöboll.', 0.2]],
      ting: { sb1: sb([0.6, GR - 70, -40, 0.2], [2.4, GR - 70, -44, 1]) }, ljud: [['sand', 0.7, 1, 1.0, 1.6]] }],
    [3.0, 'oj', { med: { 0: ['lyfta', { vid: [0.1] }] }, sag: [['jul/03-oj-puff', 'Oj! Puff!', 1.4]],
      ting: { sb1: sb([0, GR - 70, -44], [0.5, GR - 20, -560], [1.0, 300, -980], [1.45, DX + 30, -250], [1.5, DX + 30, -250, 1, 0]),
        snopuff: [[1.45, DX + 30, -250, 1.1, 0], [1.5, DX + 30, -250, 1.8, 1], [2.2, DX + 30, -280, 2.6, 0]] }, ljud: [['puff', 1.45, 1, 2.0]] }],
    [2.6, 'skaka', { varv: 2, uttryck: 'skrattar', sag: [['jul/03-hunden-fnissar', 'Hunden fnissar!', 0.4, 1.75, 1.47]], ljud: [['vov-fniss', 0.2, 3, 1.4]] }],
    [3.2, 'lyfta', { vid: [0.6], sag: [['jul/03-nu-kastar-hunden', 'Nu kastar hunden!', 0.1]],
      ting: { sb2: sb([0.1, DX - 40, -300, 0.3], [0.6, DX + 10, -620], [1.2, 300, -1000], [1.75, GR - 20, -210], [1.8, GR - 20, -210, 1, 0]),
        snopuff2: [[1.75, GR - 20, -210, 1.1, 0], [1.8, GR - 20, -210, 1.8, 1], [2.5, GR - 20, -240, 2.6, 0]] }, ljud: [['puff', 1.75, 2, 2.0], ['noff-fniss', 2.1, 1, 1.3]] }],
    [6.2, 'stilla', { ser: true, med: { 0: 'vanta' }, sag: [['jul/03-kan-du-kasta', 'Kan du också kasta en snöboll?', 0.2]] }],
    [3.4, 'oj', { snomycket: true, sag: [['jul/03-bra-kastat', 'Ha ha! Bra kastat!', 1.4]],
      ting: { sb3: sb([0, -380, 760, 2.4], [0.5, -330, -260, 1.5], [0.95, -300, -40, 1], [1.0, -300, -40, 1, 0]), sb4: sb([0.25, 760, 760, 2.4], [0.75, 560, -260, 1.5], [1.2, 420, -40, 1], [1.25, 420, -40, 1, 0]),
        snopuff3: [[0.95, -300, -40, 1.1, 0], [1.0, -300, -40, 1.8, 1], [1.7, -300, -70, 2.6, 0]], snopuff4: [[1.2, 420, -40, 1.1, 0], [1.25, 420, -40, 1.8, 1], [1.95, 420, -70, 2.6, 0]] },
      ljud: [['puff', 0.95, 3, 2.0], ['puff', 1.2, 1, 2.0], ['vov-fniss', 2.2, 5, 1.3], ['noff-fniss', 2.5, 2, 1.3]] }],
    [2.4, 'vinka', { med: { 0: 'stilla' }, sag: [['tittut/hund-hejda', 'Hej då hunden!', 0.4]], ljud: [['vov', 1.6, 1, 1.2, 0.3]] }],
    [2.4, 'stilla', { med: { 0: 'vinka' }, sag: [['jul/gris-hejda', 'Hej då grisen!', 0.4]], ljud: [['noff-gullig', 1.6, 3, 1.5, 1.1]] }],
  ],
});
</script>
