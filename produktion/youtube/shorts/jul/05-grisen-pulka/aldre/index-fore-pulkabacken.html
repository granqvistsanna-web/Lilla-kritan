  const gran = (x, y, k) => `<image href="/assets/bakgrunder/skogen-gron-saker/gran.png" x="${(x - 448 * k).toFixed(0)}" y="${(y - 1136 * k).toFixed(0)}" width="${(896 * k).toFixed(0)}" height="${(1200 * k).toFixed(0)}"/>`;
  const GRANAR = Array.from({ length: 16 }, (_, i) => { const x = -200 + i * 290 + 120 * slump(i); return gran(x, yM(x) + 30, 0.16 + 0.08 * slump(i + 5)); }).join('');
  const FL = 46, SPRUT = [];
  // snön som yr: när pulkan åker nerför (lutningen positiv) sprutar snö bakåt och uppåt från medarnas bakände, som sprut i djur.js
  for (let t = 0, n = 0; t < KULL.D; t += 1 / 30) { const x = kullX(t), dx = kullX(t + 1 / 30) - x; if (lut(x) > 6 && dx > 5) for (let k = 0; k < 2; k++, n++)
    SPRUT.push({ t, x: x - 70 * SK / 0.26 + 30 * slump(n), y: yF(x) - 6, vx: -(120 + 260 * slump(n + 1)), vy: -(260 + 300 * slump(n + 2)), r: 7 + 9 * slump(n + 3) }); }
  // himlen ur Vinterkullen (lucka.KULLE, följer kalenderns version): bilden så hög att bara himlen syns (kullen hamnar under bildkanten), bakom den kodritade backen och i kullåket
  const HIMMEL = `<image href="${lucka.KULLE(false)}" width="${VW}" height="${(VH / 0.48).toFixed(0)}" preserveAspectRatio="xMidYMin slice"/>`;
  kamera.querySelector(':scope > rect').insertAdjacentHTML('afterend', `<g id="himmel">${HIMMEL}</g>`);
  svg.querySelector('#djup-flingor ellipse')?.setAttribute('fill', '#F8F4EB');   // backens snö i v2:ans krämvita
  // Sanna 2026-11-17: tillbaka till den gamla bakgrunden (Vinterkullen), pulkagården avvisad (aldre/index-fore-gamla-bg.html)
  kamera.querySelector(':scope > g[filter="url(#boil)"]').insertAdjacentHTML('beforebegin', `<g id="kullar" display="none">
    ${HIMMEL}
    <g filter="url(#lucka-vax)"><g id="kl-langt"><path d="${kurva(yL, -400, VARLD + 400, VH)}" fill="#DCD0EF"/></g>
      <g id="kl-mitt"><path d="${kurva(yM, -400, VARLD + 400, VH)}" fill="#F1ECF6"/>${GRANAR}</g>
      <g id="kl-fram"><path d="${kurva(yF, -400, VARLD + 400, VH)}" fill="#FBF7EF" stroke="#D3C7EA" stroke-width="7"/></g></g>
    <g filter="url(#boil)"><g id="kl-spar"><g id="kl-sprut">${SPRUT.map(() => '<circle r="1" fill="#fff" stroke="#AFC9E0" stroke-width="3" opacity="0"/>').join('')}</g>
      </g></g></g>`);
  kamera.insertAdjacentHTML('beforeend', `<g id="kl-sno" display="none">${Array.from({ length: FL }, (_, i) => `<circle r="${(5 + 6 * slump(i + 50)).toFixed(1)}" fill="#fff" opacity="0.9"/>`).join('')}</g>`);
  const kl = [svg.querySelector('#kullar'), svg.querySelector('#kl-sno')], DOLJ = ['#djup-flingor', '#djup-fram', '#sprut'].map(q => svg.querySelector(q)).filter(Boolean);
  const scen = akare.parentElement, MED = ['#ting', '#tingbak'].map(q => svg.querySelector(q));   // tingen (säcken) följer åkaren dit
  const $ = id => svg.querySelector('#kl-' + id), SC = [...svg.querySelectorAll('#kl-sprut circle')], SN = [...svg.querySelectorAll('#kl-sno circle')];
  const rita = window.seek;
  window.seek = window.render = t => {
    rita(t);
    const b = B.findLast(q => t >= q.t0) ?? {}, tl = t - b.t0;
    // dolly in under närbilderna: kameran (#kamera) har redan zoomen för närbilden, en lugn inåkning läggs utanpå
    const kt = kamera.getAttribute('transform');
    if (kt && b !== KB) { const z = 1 + 0.06 * Math.min(1, tl / b.d); kamera.setAttribute('transform', `translate(${VW / 2} ${VH * 0.5}) scale(${z.toFixed(4)}) translate(${-VW / 2} ${-VH * 0.5}) ${kt}`); }
    const ute = b === KB; kl.forEach(e => ute ? e.removeAttribute('display') : e.setAttribute('display', 'none'));
    DOLJ.forEach(e => ute ? e.setAttribute('display', 'none') : e.removeAttribute('display'));
    if (!ute) { MED.forEach(e => e.removeAttribute('transform')); window.TRE?.(); return; }   // tre: djur.js har redan tecknat före dollyn, tecknas om med den
    const x = kullX(tl), cam = Math.min(VARLD - VW, Math.max(-200, x - VW * (STA ? 0.5 : 0.42)));
    $('langt').setAttribute('transform', `translate(${(-cam * 0.15).toFixed(1)} 0)`); $('mitt').setAttribute('transform', `translate(${(-cam * 0.45).toFixed(1)} 0)`);
    $('fram').setAttribute('transform', `translate(${(-cam).toFixed(1)} 0)`); $('spar').setAttribute('transform', `translate(${(-cam).toFixed(1)} 0)`);
    // åkaren: i bildens pixlar på kullen (x − cam, yF), vriden efter backen och förminskad; räknat om till scenens mått (scen = translate · scale)
    const mx = m => `matrix(${[m.a, m.b, m.c, m.d, m.e, m.f].map(v => +v.toFixed(5)).join(' ')})`;
    const A0 = DOMMatrix.fromMatrix(akare.transform.baseVal.consolidate()?.matrix ?? new DOMMatrix()), S = DOMMatrix.fromMatrix(scen.transform.baseVal.consolidate().matrix);
    const A1 = S.inverse().multiply(new DOMMatrix().translate(x - cam, yF(x)).rotate(lut(x)).scale(SK));
    akare.setAttribute('transform', mx(A1)); MED.forEach(e => e.setAttribute('transform', mx(A1.multiply(A0.inverse()))));
    SPRUT.forEach((q, i) => { const u = tl - q.t, e = SC[i]; if (u < 0 || u > 0.8) return e.setAttribute('opacity', 0);
      e.setAttribute('cx', (q.x + q.vx * u).toFixed(1)); e.setAttribute('cy', (q.y + q.vy * u + 900 * u * u).toFixed(1)); e.setAttribute('r', (q.r * (1 - 0.4 * u / 0.8)).toFixed(1)); e.setAttribute('opacity', (0.95 * (1 - (u / 0.8) ** 2)).toFixed(2)); });
    // snön faller lugnt i förgrunden och glider lite fortare än kullarna (närmast kameran)
    SN.forEach((c, i) => { const fart = 70 + 60 * slump(i + 9), y = ((slump(i + 3) * (VH + 80) + t * fart) % (VH + 80)) - 40, xx = ((slump(i + 7) * (VW + 200) - cam * 1.15 + 20 * Math.sin(t * 0.8 + i)) % (VW + 200) + VW + 200) % (VW + 200) - 100;
      c.setAttribute('cx', xx.toFixed(1)); c.setAttribute('cy', y.toFixed(1)); });
    window.TRE?.();   // three.js (djur.js tre): tecknas om när kullåket står på plats
  };
  // tre: WebGL-ritaren laddar en bild första gången den syns, och kullåket lades till efter att ritaren skapades. Visa kullåket en gång
  // och vänta in granarna, annars saknas de i kullåkets första bildruta (och i första rutan av en renderingsbit som börjar där)
  svg.querySelectorAll('.flinga2').forEach(e => e.setAttribute('display', 'none'));
  // Sanna 2026-11-16 ("a bit less falling snow"): var tredje fallande flinga bort (även i kullåket, kl-sno)
  svg.querySelectorAll('.flinga, .mys-flinga, #kl-sno circle').forEach((e, i) => i % 3 === 2 && e.setAttribute('display', 'none'));
  // Sanna 2026-11-16 (0:14, "have soundtrack start more when clip starts, fade in and out nice"): bädden (karol-jultomten) börjar när
  // klippet börjar (första biten) och tonas in på 2,5 s, öppningsjingeln tonas ut på 1,5 s där, och bädden tonas ut på 3 s mot slutet
  const B0 = B[0].t0, badd = window.LJUD.find(c => c.fil.endsWith('karol-jultomten.mp3')), jingel = window.LJUD.find(c => c.fil.endsWith('jul-oppning.m4a'));
  if (badd && badd.t > B0) Object.assign(badd, { langd: badd.t + badd.langd - B0, t: B0, ss: 0, fadeIn: 2.5, fade: 3 });
  if (jingel && jingel.t < B0) Object.assign(jingel, { langd: B0 + 1.5 - jingel.t, fade: 1.5 });   // "snömycket" används inte; de väntande flingorna syntes överst i närbilderna
  if (window.TRE && KB) { window.seek(KB.t0 + 1); await new Promise(r => setTimeout(r, 1500)); window.seek(KB.t0 + 1); }
  window.seek(+new URLSearchParams(location.search).get('t') || 0);
  window.ready = true;
});
