<title>Julkalendern – lucka 5: grisen åker pulka</title>
<script src="/verktyg/blinka.js"></script><script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script src="/produktion/youtube/shorts/jul/lucka.js"></script><script src="/produktion/youtube/shorts/jul/djur.js"></script>
<script>
// Julkalendern, lucka 5, tre minuter (produktion/youtube/julkalender-plan.md, avsnitt 6.3): kritan ritar en pulka (kälke) bakom grisen, som sätter sig på den och åker nerför backen, tre åk (det byggda),
// och lite till. Sedan lastar grisen tre paket i pulkan, och den sjunker ner i snön: för tung (problemet). Grisen gungar tre gånger men pulkan rör sig inte. Björnen kommer in från vänster och ställer sig
// bakom pulkan. Barnets tur (paus 5 s): heja på grisen. Tre heja, och för varje heja knuffar björnen pulkan ett stycke, tills den börjar glida och åker ner (det byggda). Hunden finns inte här: grisen och björnen
// firar. Ändring mot planen: grisen sitter kvar i pulkan hela tiden (i planen drar den pulkan uppför backen), så problemet är att den lastade pulkan inte vill glida, och björnen knuffar bakifrån.
// Nya saker i motorn: huvudfiguren glider i små steg (ga: glidar) och pulkan följer, backen (gästen och sakerna står på backens linje), paket som ting (paket, paketg) som åker med pulkan, pulkan som sjunker (sjunk).
// Nya repliker i assets/ljud/roster/jul/ är tysta tills de är inspelade (förhandsvisningen läser dem):
//   05-nu-tar-vi [excited] Nu tar vi med julklapparna!   05-for-tung [surprised] Oj! Pulkan är för tung.   05-pust [sighing] Pust! Den rör sig inte.   nu-forsoker-vi-igen [encouraging] Nu försöker vi igen.
//   titta-bjornen [excited] Titta, där kommer björnen!   kan-du-hjalpa-till [warm] Kan du hjälpa till?   05-heja [cheerfully] Kan du heja? Heja, grisen!   05-heja-3 [cheerfully] Heja! Heja! Heja!
//   05-grisen-trott [tired] Grisen blir trött.   05-kan-knuffa [excited] Björnen kan knuffa!   05-nu-aker-pulkan [excited] Nu åker pulkan!
//   bjornen-ar-stark [excited] Björnen är stark! (inspelad, ersätter den aldrig inspelade 05-bjornen-stark, granskning 2026-11-15)   05-nu-ror-den-sig [excited] Nu rör den sig!   hurra-det-gick [excited] Hurra! Det gick!   tack-bjornen [warm] Tack, björnen!   (bjorn-hejda och gris-hejda finns)
// Feedback 2026-11-12 kväll: närmare bild (vid 0,74), snön faller hela tiden (snoa), snö yr bakom pulkan (sprut), björnen lika stor som grisen,
// pulkan fastnar i en snödriva (02-nej-fast "Nej, den sitter fast." i stället för 05-pust), två försök i stället för tre och kortare väntan (ca 135 s).
// Sanna 2026-11-13 runda 3: luvan mindre (0,48), grisen vinkar högre (vinkArm 90), grisen hejar med på varje "Heja!" (heja), kortare väntan (ca 10 s). Gamla: aldre/index-fore-runda3.html
// Repliker i assets/ljud/roster/jul/, läten: noff-gullig och noff-fniss (efter replikerna, kortade med langd), glid när pulkan far iväg. "Grisen åker pulka. Wiii!" är en fil (05-grisen-aker.m4a):
// "Grisen åker pulka." (ss 0, langd 1,5) ligger på första åket och "Wiii!" (ss 2,05) över det andra åket. "En gång till!" sägs före tredje åket (sats 1,1).
const AKER = 'jul/05-grisen-aker', glid = vid => ['glid', vid, 1, 11], BX = -720;   // glid-1 är en mycket tyst fil: styrka 11. BX: björnens plats bakom pulkan
const paket = (id, a, x, y) => ({ [id]: [[a - 0.3, x, y - 1150, 1, 1, 0, 1], [a + 0.7, x, y, 1, 1, 0, 1]] });   // ett paket faller ner i pulkan uppifrån, utanför bild (följer pulkan)
const PX = [-200, -200, -200], PY = [-62, -140, -218];   // (runda 1: tre paket i ett torn; runda 2: en stor säck i stället)
const [SX, SY, SS] = [125, -45, 0.6];   // runda 2 ("big sack of paket instead"): säcken (assets/rekvisita/sack-paket) i grisens knä, från grisen; SS: skala   // paketens platser på pulkans sits: ett torn tätt bakom grisens rygg, från grisen (som sitter på sitsen). Feedback 2026-11-13: björnen låg över paketen
const [DX, DY] = [350, 160], AX = -490, ST = 170, BS = 3 * ST, BL = BS + 90, KL = [120, 120], KLB = [600, 120], ARM = -16;   // BL: där björnen står när pulkan har lossnat (hoppar upp därifrån). ARM: armarna ner, håller i pulkan under åken (runda 2: armarna gömdes)   // BS: där björnen står efter de tre knuffarna (från sin plats). AX: björnens plats på pulkan bakom grisen (åker med), från grisen   // snödrivan framför pulkan (följer pulkan), från grisen
julDjur.kor({
  tingrit: { sack: julDjur.bild('sack-paket', 734, 808, [367, 806], SS) },
  lucka: 5, baddFil: 'assets/ljud/musik/jul/karol-jultomten.mp3', baddLangd: 180.01, baddVol: 0.3, figur: 'grisen-greta', vinkArm: [90, 18], sak: 'pulka', backe: 9, vid: [0.74, 880], snoa: true, sprut: [-640, -10],
  jacka: '#3F7FBF', jackor: { 0: '#4A8F55' }, hattar: [[-1, 'luva', 512, 256, 0.48, -8]],
  gaster: [['bjornen-bulle', BX, 0.95, 1]],
  halsdukar: [[0, 512, 628, 0.44]],   // Sanna 2026-11-14: halsduk på björnen i hela filmen
  scen: [
    // A–B: det byggda, tre åk (snön yr bakom pulkan: sprut)
    [2.8, 'vinka', { sag: [['jul/gris-hej', 'Hej grisen!', 0.75]], ljud: [['noff-gullig', 1.90, 1, 1.5, 1.2]] }],
    [5.3, 'sak', { rit: [[0.6, 'pulka', 2.8]], sag: [['jul/05-en-pulka', 'En pulka!', 3.9]] }],
    [3.6, 'glid', { armar: ARM, klipp: KL, sag: [[AKER, 'Grisen åker pulka.', 0.8, 0, 1.5]], ljud: [glid(0.3)] }],
    [3.3, 'glid', { armar: ARM, klipp: KL, sag: [[AKER, 'Wiii!', 0.6, 2.05, 1.3]], ljud: [glid(0.3)] }],
    [3.8, 'glid', { armar: ARM, klipp: KL, sats: 1.1, sag: [['jul/en-gang-till', 'En gång till!', 0.2]], ljud: [glid(1.1), ['noff-fniss', 1.75, 1, 1.5, 1.9]] }],
    // B: grisen gungar glatt i pulkan
    [4.2, 'vagga', { gung: 0.6, uttryck: 'skrattar', ljud: [['noff-fniss', 1.4, 2, 1.5, 1.2]] }],
    // C: grisen lastar tre paket, och pulkan sjunker ner och fastnar i snön (en snödriva växer fram framför den)
    // granskning 2026-11-15: en orsak, snödrivan (Sannas feedback 11-13/11-14: inte "för tung"). Drivan växer upp tydligt framför pulkan innan repliken, pulkan sjunker ner i den
    [7.2, 'tittar', { sag: [['jul/05-nu-tar-vi', 'Nu tar vi med julklapparna!', 0.6], ['jul/05-fastnat', 'Oj, pulkan verkar ha fastnat i en snödriva.', 3.7]],
      sjunk: [[2.0, 0], [2.6, 16], [3.0, 16], [3.5, 34]],
      ting: { ...paket('sack', 1.0, SX, SY), driva: [[2.0, DX, DY, 0.8, 0, 0, 1], [3.4, DX, DY, 2.0, 1, 0, 1]] },
      ljud: [['dunk', 1.7, 1, 2.0]] }],
    // D: grisen försöker glida, tre försök (det andra och tredje kortare): pulkan sitter fast
    [4.4, 'ga', { armar: ARM, gang: [[0, 0], [0.8, -18], [1.6, 0], [2.4, -18], [3.2, 0]], glidar: true, uttryck: 'arg', nara: [0.8, 4.2], sag: [['jul/02-nej-fast', 'Nej, den sitter fast.', 1.2]], ljud: [['noff-gullig', 3.4, 4, 1.5, 1.0]] }],   // granskning 2026-11-15: kort replik, bara snödrivan som orsak ("för tung att flytta själv" struken)
    [2.4, 'ga', { armar: ARM, gang: [[0, 0], [0.7, -18], [1.4, 0]], glidar: true, uttryck: 'arg' }],
    [3.8, 'ga', { armar: ARM, gang: [[0, 0], [0.6, -18], [1.2, 0]], glidar: true, uttryck: 'ledsen', nara: [1.3, 3.7], sag: [['jul/05-grisen-trott', 'Grisen blir trött.', 1.6]], ljud: [['noff-gullig', 3.0, 4, 1.5, 1.0]] }],
    // E: björnen kommer in från vänster och ställer sig bakom pulkan, de vinkar till varandra. Barnets tur: heja på grisen (paus ca 5,5 s)
    [3.4, 'stilla', { armar: ARM, in: 0, ser: [-60, 0], sag: [['jul/titta-bjornen', 'Titta, där kommer björnen!', 0.6]], ljud: [['hopp-mjuk', 0.1, 6], ['landa-mjuk', 1.05, 6]] }],
    [2.2, 'vinka', { ser: [-60, 0], ljud: [['noff-gullig', 0.6, 2, 1.5, 1.0], ['brum-gullig', 1.2, 2]] }],
    // granskning 2026-11-15: björnen lägger tassarna på pulkan vid "Björnen kan knuffa!" och håller kvar under frågan; släpper 0,5 s före första knuffen. Barnets paus ca 3 s
    [3.9, 'stilla', { armar: ARM, med: { 0: ['knuffa', { gang: [[0, 0]], knuff: [[1.9, 1e9]] }] }, sag: [['jul/bjornen-ar-stark', 'Björnen är stark!', 0.3], ['jul/05-kan-knuffa', 'Björnen kan knuffa!', 2.3]] }],
    [7.0, 'stilla', { armar: ARM, med: { 0: ['knuffa', { gang: [[0, 0]], knuff: [[-1, 6.45]] }] }, sag: [['jul/kan-du-hjalpa-till', 'Kan du hjälpa till?', 0.4], ['jul/05-heja', 'Kan du heja? Heja, grisen!', 1.8]] }],
    // F: tre heja, och för varje heja knuffar björnen pulkan ett stycke (130 px) genom snön
    // Sanna 2026-11-13 runda 3 ("more clear that grisen hejar", "a bit faster pace"): ett "Heja!" ur 05-heja-3 per knuff, och grisen hejar med båda armarna
    // granskning 2026-11-15: större knuffar (ST px på 0,9 s, så att snön yr bakom pulkan: sprut) och pulkan tippar fram lite (tipp)
    [3.4, 'ga', { armar: ARM, gang: [[0, 0], [0.5, 0], [1.4, ST], [3.4, ST]], glidar: true, tipp: [[0.5, 1.6, 4]], heja: [[0.15, 1.5]], med: { 0: ['knuffa', { gang: [[0, 0], [0.5, 0], [1.4, 1 * ST], [3.4, 1 * ST]], knuff: [[0.5, 1.4]] }] }, sag: [['jul/05-heja-3', 'Heja!', 0.2, 0, 0.62]], ljud: [['dunk', 0.6, 1, 2.0], glid(0.7)] }],
    [3.4, 'ga', { armar: ARM, gang: [[0, 0], [0.5, 0], [1.4, ST], [3.4, ST]], glidar: true, tipp: [[0.5, 1.6, 4]], heja: [[0.15, 1.5]], med: { 0: ['knuffa', { gang: [[0, 1 * ST], [0.5, 1 * ST], [1.4, 2 * ST], [3.4, 2 * ST]], knuff: [[0.5, 1.4]] }] }, sag: [['jul/05-heja-3', 'Heja!', 0.2, 0.84, 0.66]], ljud: [['dunk', 0.6, 2, 2.0], glid(0.7)] }],
    [3.7, 'ga', { armar: ARM, gang: [[0, 0], [0.5, 0], [1.4, ST], [3.7, ST]], glidar: true, tipp: [[0.5, 1.6, 4]], heja: [[0.15, 1.5]], med: { 0: ['knuffa', { gang: [[0, 2 * ST], [0.5, 2 * ST], [1.4, 3 * ST], [3.7, 3 * ST]], knuff: [[0.5, 1.4]] }] }, sag: [['jul/05-heja-3', 'Heja!', 0.2, 1.71, 0.73]], ljud: [['dunk', 0.6, 3, 2.0], glid(0.7)] }],
    // loss ur snön: en sista knuff, pulkan lyfter upp ur drivan (som tonar bort) och glider en bit. Björnen hoppar upp direkt, så att pulkan aldrig åker förbi den
    [3.4, 'ga', { armar: ARM, gang: [[0, 0], [0.5, 0], [1.6, 90], [3.4, 90]], glidar: true, tipp: [[0.5, 1.6, 3]], med: { 0: ['knuffa', { gang: [[0, BS], [0.5, BS], [1.6, BL], [3.4, BL]], knuff: [[0.5, 1.6]] }] }, sjunk: [[0.5, 34], [1.3, 0]], ting: { driva: [[0.5, DX, DY, 2.0, 1, 0, 1], [1.2, DX, DY, 2.2, 0, 0, 1]] }, sag: [['jul/05-nu-ror-den-sig', 'Nu rör den sig!', 1.0]], ljud: [glid(0.6), ['noff-fniss', 2.2, 1, 1.5, 1.9]] }],
    [2.2, 'stilla', { armar: ARM, ser: [-60, 0], med: { 0: ['akmed', { x: AX, hopp: [0.4, 1.4], fran: BL, bak: true }] }, ljud: [['hopp-mjuk', 0.4, 1], ['landa-mjuk', 1.35, 1], ['noff-fniss', 1.6, 1, 1.5, 1.2]] }],
    // G: åk ner med paketen och björnen, två gånger (det byggda), och "Kan du säga wiii?". Sedan Wiii! Hurra, tack
    [2.9, 'glid', { armar: ARM, klipp: KLB, med: { 0: ['akmed', { x: AX, bak: true, armar: ARM }] }, sag: [['jul/05-nu-aker-pulkan', 'Nu åker pulkan!', 0.6]], ljud: [glid(0.3)] }],
    [2.9, 'glid', { armar: ARM, klipp: KLB, med: { 0: ['akmed', { x: AX, bak: true, armar: ARM }] }, ljud: [glid(0.3), ['noff-gullig', 1.5, 2, 1.5, 1.0]] }],
    [2.6, 'stilla', { armar: ARM, med: { 0: ['akmed', { x: AX, bak: true }] }, sag: [['jul/05-kan-du-saga-wiii', 'Kan du säga wiii?', 0.2]] }],
    [3.6, 'glid', { armar: ARM, klipp: KLB, sats: 0.6, uttryck: 'stolt', med: { 0: ['akmed', { x: AX, bak: true, armar: ARM }] }, sag: [[AKER, 'Wiii!', 0.7, 2.05, 1.3]], ljud: [glid(0.6)] }],
    [3.6, 'glid', { armar: ARM, klipp: KLB, sats: 0.6, med: { 0: ['akmed', { x: AX, bak: true, armar: ARM }] }, sag: [['jul/hurra-det-gick', 'Hurra! Det gick!', 0.8]], ljud: [glid(0.6), ['brum-gullig', 2.6, 1]] }],
    [2.4, 'stilla', { armar: ARM, med: { 0: ['akmed', { x: AX, bak: true }] }, sag: [['jul/tack-bjornen', 'Tack, björnen!', 0.4]] }],
    // H: hej då, båda sitter kvar i pulkan
    [2.4, 'vinka', { med: { 0: ['akmed', { x: AX, bak: true }] }, sag: [['jul/gris-hejda', 'Hej då grisen!', 0.5]], ljud: [['noff-gullig', 1.7, 3, 1.5, 1.1]] }],
    [3.0, 'stilla', { armar: ARM, med: { 0: ['akmed', { x: AX, ror: 'vinka', bak: true }] }, sag: [['jul/bjorn-hejda', 'Hej då björnen!', 0.5]], ljud: [['brum-gullig', 1.85, '1d']] }],
  ],
});
</script>
