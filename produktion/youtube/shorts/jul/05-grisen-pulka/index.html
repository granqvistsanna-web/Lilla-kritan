<title>Julkalendern – lucka 5: grisen åker pulka</title>

<script>
// Julkalendern, lucka 5, tre minuter (produktion/youtube/julkalender-plan.md, avsnitt 6.3): kritan ritar en pulka (kälke) bakom grisen, som sätter sig på den och åker nerför backen, tre åk (det byggda),
// och lite till. Sedan lastar grisen tre paket i pulkan, och den sjunker ner i snön: för tung (problemet). Grisen gungar tre gånger men pulkan rör sig inte. Björnen kommer in från vänster och ställer sig
// bakom pulkan. Barnets tur (paus 5 s): heja på grisen. Tre heja, och för varje heja knuffar björnen pulkan ett stycke, tills den börjar glida och åker ner (det byggda). Hunden finns inte här: grisen och björnen

//   05-nu-tar-vi [excited] Nu tar vi med julklapparna!   05-for-tung [surprised] Oj! Pulkan är för tung.   05-pust [sighing] Pust! Den rör sig inte.   nu-forsoker-vi-igen [encouraging] Nu försöker vi igen.
//   titta-bjornen [excited] Titta, där kommer björnen!   kan-du-hjalpa-till [warm] Kan du hjälpa till?   05-heja [cheerfully] Kan du heja? Heja, grisen!   05-heja-3 [cheerfully] Heja! Heja! Heja!
//   05-grisen-trott [tired] Grisen blir trött.   05-kan-knuffa [excited] Björnen kan knuffa!   05-nu-aker-pulkan [excited] Nu åker pulkan!
//   05-bjornen-stark [excited] Björnen är stark!  (ny 2026-11-12, berattelse-granskning, väntar på Sannas ja och inspelning)   05-nu-ror-den-sig [excited] Nu rör den sig!   hurra-det-gick [excited] Hurra! Det gick!   tack-bjornen [warm] Tack, björnen!   (bjorn-hejda och gris-hejda finns)
// Feedback 2026-11-12 kväll: närmare bild (vid 0,74), snön faller hela tiden (snoa), snö yr bakom pulkan (sprut), björnen lika stor som grisen,
// pulkan fastnar i en snödriva (02-nej-fast "Nej, den sitter fast." i stället för 05-pust), två försök i stället för tre och kortare väntan (ca 135 s).
// Repliker i assets/ljud/roster/jul/, läten: noff-gullig och noff-fniss (efter replikerna, kortade med langd), glid när pulkan far iväg. "Grisen åker pulka. Wiii!" är en fil (05-grisen-aker.m4a):
// "Grisen åker pulka." (ss 0, langd 1,5) ligger på första åket och "Wiii!" (ss 2,05) över det andra åket. "En gång till!" sägs före tredje åket (sats 1,1).

const paket = (id, a, x, y) => ({ [id]: [[a - 0.3, x, y - 1150, 1, 1, 0, 1], [a + 0.7, x, y, 1, 1, 0, 1]] });   // ett paket faller ner i pulkan uppifrån, utanför bild (följer pulkan)
const PX = [-200, -200, -200], PY = [-62, -140, -218];   // (runda 1: tre paket i ett torn; runda 2: en stor säck i stället)
const [SX, SY, SS] = [125, -45, 0.42];   // runda 2 ("big sack of paket instead"): säcken (assets/rekvisita/sack-paket) i grisens knä, från grisen; SS: skala   // paketens platser på pulkans sits: ett torn tätt bakom grisens rygg, från grisen (som sitter på sitsen). Feedback 2026-11-13: björnen låg över paketen

  tingrit: { sack: julDjur.bild('sack-paket', 734, 808, [367, 806], SS) },
  lucka: 5, badd: 'jul-badd-2', figur: 'grisen-greta', vinkArm: [38, 16], sak: 'pulka', backe: 9, vid: [0.74, 880], snoa: true, sprut: [-640, -10],

  scen: [
    // A–B: det byggda, tre åk (snön yr bakom pulkan: sprut)

    [6.0, 'sak', { rit: [[0.8, 'pulka', 3.0]], sag: [['jul/05-en-pulka', 'En pulka!', 4.2]] }],
    [3.6, 'glid', { armar: ARM, sag: [[AKER, 'Grisen åker pulka.', 0.8, 0, 1.5]], ljud: [glid(0.3)] }],
    [3.3, 'glid', { armar: ARM, sag: [[AKER, 'Wiii!', 0.6, 2.05, 1.3]], ljud: [glid(0.3)] }],
    [3.8, 'glid', { armar: ARM, sats: 1.1, sag: [['jul/en-gang-till', 'En gång till!', 0.2]], ljud: [glid(1.1), ['noff-fniss', 1.75, 1, 1.5, 1.9]] }],
    // B: grisen gungar glatt i pulkan
    [6.0, 'vagga', { uttryck: 'skrattar', nara: [1.6, 4.4], ljud: [['noff-fniss', 2.0, 2, 1.5, 1.2]] }],
    // C: grisen lastar tre paket, och pulkan sjunker ner och fastnar i snön (en snödriva växer fram framför den)
    [10.0, 'tittar', { sag: [['jul/05-nu-tar-vi', 'Nu tar vi med julklapparna!', 0.6]], nara: [6.0, 9.6],
      sjunk: [[1.0, 0], [1.6, 10], [2.8, 10], [3.4, 20], [4.6, 20], [5.2, 34]],
      ting: { ...paket('sack', 1.0, SX, SY), driva: [[3.0, DX, DY, 0.6, 0, 0, 1], [5.4, DX, DY, 1.5, 1, 0, 1]] },
      ljud: [['dunk', 1.7, 1, 2.0]] }],
    // D: grisen försöker glida, tre försök (det andra och tredje kortare): pulkan sitter fast

    [2.4, 'ga', { gang: [[0, 0], [0.7, -18], [1.4, 0]], glidar: true, uttryck: 'arg' }],
    [4.4, 'ga', { gang: [[0, 0], [0.6, -18], [1.2, 0]], glidar: true, uttryck: 'ledsen', nara: [1.4, 4.2], sag: [['jul/05-grisen-trott', 'Grisen blir trött.', 1.9]], ljud: [['noff-gullig', 3.3, 4, 1.5, 1.0]] }],
    // E: björnen kommer in från vänster och ställer sig bakom pulkan, de vinkar till varandra. Barnets tur: heja på grisen (paus ca 5,5 s)
    [3.4, 'stilla', { in: 0, ser: [-60, 0], sag: [['jul/titta-bjornen', 'Titta, där kommer björnen!', 0.6]], ljud: [['hopp-mjuk', 0.1, 6], ['landa-mjuk', 1.05, 6]] }],
    [2.2, 'vinka', { ser: [-60, 0], ljud: [['noff-gullig', 0.6, 2, 1.5, 1.0], ['brum-gullig', 1.2, 2]] }],
    [4.6, 'stilla', { med: { 0: 'vanta' }, sag: [['jul/05-bjornen-stark', 'Björnen är stark!', 0.3], ['jul/05-kan-knuffa', 'Björnen kan knuffa!', 2.6]] }],
    [6.0, 'stilla', { med: { 0: 'vanta' }, sag: [['jul/kan-du-hjalpa-till', 'Kan du hjälpa till?', 0.4], ['jul/05-heja', 'Kan du heja? Heja, grisen!', 1.8]] }],
    [4.0, 'stilla', { med: { 0: 'vanta' } }],
    // F: tre heja, och för varje heja knuffar björnen pulkan ett stycke (130 px) genom snön
    [5.0, 'ga', { gang: [[0, 0], [0.5, 0], [2.0, 130], [5, 130]], glidar: true, med: { 0: ['knuffa', { gang: [[0, 0], [0.5, 0], [2.0, 130], [5, 130]], knuff: [[0.5, 2.0]] }] }, sag: [['jul/05-heja-3', 'Heja! Heja! Heja!', 0.3]], ljud: [['dunk', 0.6, 1, 2.0], glid(0.7)] }],
    [5.0, 'ga', { gang: [[0, 0], [0.5, 0], [2.0, 130], [5, 130]], glidar: true, med: { 0: ['knuffa', { gang: [[0, 130], [0.5, 130], [2.0, 260], [5, 260]], knuff: [[0.5, 2.0]] }] }, ljud: [['dunk', 0.6, 2, 2.0], glid(0.7)] }],
    [5.5, 'ga', { gang: [[0, 0], [0.5, 0], [2.0, 130], [5.5, 130]], glidar: true, med: { 0: ['knuffa', { gang: [[0, 260], [0.5, 260], [2.0, 390], [5.5, 390]], knuff: [[0.5, 2.0]] }] }, ljud: [['dunk', 0.6, 3, 2.0], glid(0.7)] }],
    // loss ur snön: en sista knuff, pulkan lyfter upp ur drivan (som tonar bort) och glider en bit. Björnen hoppar upp direkt, så att pulkan aldrig åker förbi den
    [3.4, 'ga', { gang: [[0, 0], [0.5, 0], [1.6, 90], [3.4, 90]], glidar: true, med: { 0: ['knuffa', { gang: [[0, BS], [0.5, BS], [1.6, BL], [3.4, BL]], knuff: [[0.5, 1.6]] }] }, sjunk: [[0.5, 34], [1.3, 0]], ting: { driva: [[0.5, DX, DY, 1.5, 1, 0, 1], [1.2, DX, DY, 1.7, 0, 0, 1]] }, sag: [['jul/05-nu-ror-den-sig', 'Nu rör den sig!', 1.0]], ljud: [glid(0.6), ['noff-fniss', 2.2, 1, 1.5, 1.9]] }],
    [2.2, 'stilla', { ser: [-60, 0], med: { 0: ['akmed', { x: AX, hopp: [0.4, 1.4], fran: BL, bak: true }] }, ljud: [['hopp-mjuk', 0.4, 1], ['landa-mjuk', 1.35, 1], ['noff-fniss', 1.6, 1, 1.5, 1.2]] }],
    // G: åk ner med paketen och björnen, två gånger (det byggda), och "Kan du säga wiii?". Sedan Wiii! Hurra, tack
    [2.9, 'glid', { armar: ARM, med: { 0: ['akmed', { x: AX, bak: true, armar: ARM }] }, sag: [['jul/05-nu-aker-pulkan', 'Nu åker pulkan!', 0.6]], ljud: [glid(0.3)] }],
    [2.9, 'glid', { armar: ARM, med: { 0: ['akmed', { x: AX, bak: true, armar: ARM }] }, ljud: [glid(0.3), ['noff-gullig', 1.5, 2, 1.5, 1.0]] }],
    [2.6, 'stilla', { med: { 0: ['akmed', { x: AX, bak: true }] }, sag: [['jul/05-kan-du-saga-wiii', 'Kan du säga wiii?', 0.2]] }],
    [3.6, 'glid', { armar: ARM, sats: 0.6, uttryck: 'stolt', med: { 0: ['akmed', { x: AX, bak: true, armar: ARM }] }, sag: [[AKER, 'Wiii!', 0.7, 2.05, 1.3]], ljud: [glid(0.6)] }],
    [3.6, 'glid', { armar: ARM, sats: 0.6, med: { 0: ['akmed', { x: AX, bak: true, armar: ARM }] }, sag: [['jul/hurra-det-gick', 'Hurra! Det gick!', 0.8]], ljud: [glid(0.6), ['brum-gullig', 2.6, 1]] }],
    [2.4, 'stilla', { med: { 0: ['akmed', { x: AX, bak: true }] }, sag: [['jul/tack-bjornen', 'Tack, björnen!', 0.4]] }],
    // H: hej då, båda sitter kvar i pulkan
    [2.4, 'vinka', { med: { 0: ['akmed', { x: AX, bak: true }] }, sag: [['jul/gris-hejda', 'Hej då grisen!', 0.5]], ljud: [['noff-gullig', 1.7, 3, 1.5, 1.1]] }],
    [3.0, 'stilla', { med: { 0: ['akmed', { x: AX, ror: 'vinka', bak: true }] }, sag: [['jul/bjorn-hejda', 'Hej då björnen!', 0.5]], ljud: [['brum-gullig', 1.85, '1d']] }],
