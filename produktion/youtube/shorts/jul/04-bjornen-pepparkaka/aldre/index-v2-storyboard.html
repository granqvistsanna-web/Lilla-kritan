const kinder = () => `<ellipse cx="-60" cy="24" rx="15" ry="9" fill="#F28B9B" opacity=".85"/><ellipse cx="60" cy="24" rx="15" ry="9" fill="#F28B9B" opacity=".85"/>`;

// Musikvideon (plan-musikvideo.md): sångtid s, slag b = (s − SLAG0) / SLAG. Raderna börjar på slag 15 + 8k (whisper: "Pepparkakor" 8,8 s,

const DT = 1 / (2 * SLAG);   // björnens dans: ett gung per två slag

  [127, 'SM', 'lila', 'marsch'],                   // mellanspel: pepparkaksmarschen

  [159, 'SM', 'lila', 'final'],                    // Pepparkaksdans!
  [167, 'K', null, 'slut', { r: 'vagga', o: { uttryck: 'stolt' } }],                 // slutackordet

const LUVA_RIT = sB(79) + 1.0;    // kritan ritar luvan på stjärnan ("gungar fram med luvan sin")
// bitarna: [sekunder, rörelse, val, namn]
const SCEN = [

  [3.4, 'nicka', { uttryck: 'kawaii', sag: [['jul/04-tomteluva', 'Oj! Björnen har en tomteluva!', 0.4]] }],

  [4.8, 'stilla', { rit: [[0.3, 'stjarna', 2.4]], sag: [['jul/04-ritar-stjarna', 'Kritan ritar en stjärna!', 0.7]] }, 'ritstj'],
  [4.8, 'stilla', { busig: [0.4, 200, YT - 165], sag: [['jul/kritan-busig', 'Oj, kritan! Vad busig du är!', 1.7]] }, 'busig'],
  [2.6, 'stilla', { uttryck: 'skrattar', ljud: [['fniss', 0.3, 2, 3.0, 1.0]] }],
  // kakorna sover; barnets tur: klappa (paus ca 5 s)
  [3.4, 'stilla', { uttryck: 'tanker', sag: [['jul/04-sover', 'Sch... Pepparkakorna sover.', 0.6]] }, 'sover'],
  [7.4, 'stilla', { sag: [['jul/04-kan-du-klappa', 'Kan du klappa? Då vaknar de!', 0.3]] }],
  // tre klappar, en kaka i taget vaknar och hoppar upp
  [3.6, 'klappa', { sag: [['jul/04-klapp', 'Klapp! Klapp! Klapp!', 1.0]], ljud: [['tass-klapp', 1.0, 1, 1.3], ['tass-klapp', 1.5, 2, 1.3], ['tass-klapp', 2.0, 1, 1.3], ['pop', 1.05, 1, 1.0], ['pop', 1.55, 2, 1.0], ['pop', 2.05, 1, 1.0]] }, 'klapp'],

  [2.8, 'stilla', { sag: [['jul/04-kan-du-dansa', 'Kan du dansa med?', 0.3]] }],

  [3.2, 'stilla', { uttryck: 'jatteglad', sag: [['jul/04-sa-glada', 'Pepparkakorna är så glada!', 0.4]] }, 'glada'],
  [2.8, 'stilla', { busig: [0, 260, -520], sag: [['jul/tack-kritan', 'Tack, kritan!', 0.6]] }],

];
const START = {}; { let s = 0; for (const [d, , , n] of SCEN) { if (n) START[n] = s; s += d; } START.slut = s; }
const T = (n, s = 0) => START[n] + s;

// tingens nycklar: [sekunder från första biten, x, y, skala, opacitet, grader]
const K = {};
const nyck = (n, ...a) => (K[n] ??= []).push(...a);
const kl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), mjuk = k => k * k * (3 - 2 * k), lerp = (a, b, k) => a + (b - a) * k;
nyck('bord', [0, BORD, 0, 1, 1]);

// Dansen (som 013:s äppelmarsch och 019:s glassar på rad): sats före hoppet, sträckt i luften, tryck när den landar, "o"-mun högst upp,
// en skugga under varje kaka på scenen, gnistor och noter. Inga snurrar: kakorna lutar och gungar bara.
const TS = T('sang');
const SS = 1.7, Y0 = -445, SP = 430, LX = i => (i - 1) * SP;   // scenens kakor: skala, fotlinje, avstånd
const NS = 3.4, NY = -110;                                       // scenen nära: en kaka i taget
const RAD = b => 15 + 8 * Math.floor((b - 15) / 8), RAKNA = [4.2, 5.8, 7.3];   // radens första slag, "en, två, tre" i raden
const skottVid = s => { const b = bS(s); let j = 0; while (j < SKOTT.length - 1 && b >= SKOTT[j + 1][0]) j++; return SKOTT[j]; };
// hopp: [toppen (s), höjd, längd i slag]; landar(n) = landar på slag n
const landar = (n, h, l = 0.9) => [sB(n) - l / 2 * SLAG, h, l], paOrdet = (b, h, l = 0.9) => [sB(b), h, l];
function hoppa(s, lista) { let y = 0, tryck = 0, strack = 0, h0 = 0;
  for (const [topp, h, l = 0.9] of lista) { const d = l * SLAG, a = topp - d / 2, u = (s - a) / d, k = Math.min(1, h / 80);
    if (u > 0 && u < 1) { y -= h * 4 * u * (1 - u); strack = Math.max(strack, 0.1 * k * Math.abs(1 - 2 * u)); h0 = h; }
    const fore = a - s; if (fore > 0 && fore < 0.12) tryck = Math.max(tryck, 0.6 * k * Math.sin(Math.PI / 2 * (1 - fore / 0.12)));   // sats
    const q = s - a - d; if (q > 0 && q < 0.22) tryck = Math.max(tryck, k * Math.sin(Math.PI * q / 0.22)); }   // tryck när den landar
  return { y, tryck, strack, hog: h0 >= 70 && y < -0.5 * h0 }; }
const bumpa = (t, c, w) => Math.sin(Math.PI * kl((t - c) / w + 0.5));   // 0 → 1 → 0 kring c, bredd w
const gung = (b, a = 1) => Math.sin(Math.PI * b) * a;   // ett gung per två slag
const kok = (i, b, a = 1) => ({ dx: 26 * gung(b, a), dy: -14 * Math.abs(gung(b, a)), rot: 7 * gung(b, a) });   // på bordet, i takt
const steg2 = (s, L) => s < L + 2.2 ? 60 * Math.sin(2 * Math.PI * (s - L) / 2.2) : 0;   // "Dansa, dansa": ett sidsteg åt var sida
const varannan = (b0, b1, i, h, jamn = 0) => { const l = []; for (let n = Math.ceil(b0); n < b1; n++) if ((n + i) % 2 === jamn) l.push(landar(n, h)); return l; };
const DANS = {
  intro: (i, s, b) => ({ dx: 12 * gung(b), rot: 4 * gung(b) }),
  redo: (i, s, b) => ({ ...kok(i, b, 0.7), hopp: varannan(8, 14, i, 34), tryck: 0.9 * mjuk(kl((b - 14.1) / 0.4)) }),   // sista slaget: alla hukar, redo
  raknar: (i, s, b) => ({ rot: 3 * gung(b), hopp: [paOrdet(15.6, 90), paOrdet(15 + RAKNA[i], 130)] }),
  bordet: (i, s, b) => { const k = mjuk(kl((b - 27) / 1.5));   // "kom och se": lutar sig fram mot oss
    return { ...kok(i, b), sc: 1 + 0.1 * k, hopp: varannan(24, 27, i, 26) }; },
  hjarta: (i, s, b) => ({ rot: 3 * gung(b), hopp: [paOrdet(bS(19.0), 60, 0.8), paOrdet(bS(20.3), 190, 1.3), paOrdet(bS(21.95), 40, 0.7)],
    tryck: 0.8 * bumpa(s, 21.45, 0.55) }),   // högt på "upp", hukar på "ner"
  gubbe: (i, s, b) => { const v = mjuk(kl((s - 22.9) / 0.3)) * (1 - mjuk(kl((s - 24.5) / 0.3))), mer = mjuk(kl((s - 24.8) / 0.9));
    return { rot: 12 * v * Math.sin(2 * Math.PI * (s - 22.9) / 1.1) + 3 * gung(b) * (1 - v), sc: 1 + 0.12 * mer, ansikte: s > 25.6 ? 'o' : null }; },   // vinkar, "vill ha mer"
  refrang: (i, s, b) => { const L = sB(47), g = mjuk(kl((s - L - 3.4) / 0.4));
    return { dx: steg2(s, L), rot: 9 * g * Math.sin(2 * Math.PI * (s - L - 3.4) / 2.2), hopp: [landar(48, 30), landar(50, 30), [L + 2.9, 220, 1.3]], skratt: [L + 2.5, L + 3.5] }; },
  vag: (i, s, b) => { const L = sB(55); return { dx: steg2(s, L), rot: 3 * gung(b), hopp: [landar(56, 30), landar(58, 30), paOrdet(55 + RAKNA[i], 140)] }; },
  kok: (i, s, b) => ({ ...kok(i, b), hopp: varannan(b - 1, b + 2, i, 28) }),
  klapp: (i, s, b) => ({ ...kok(i, b, b < 114 ? 1 : 0.4), hopp: [paOrdet(111 + RAKNA[i], 100)] }),
  glitter: (i, s, b) => ({ sc: 1 + 0.05 * Math.abs(Math.sin(Math.PI * b)) + 0.06 * mjuk(kl((b - 71) / 2)), rot: 2 * gung(b), ansikte: 'stolt' }),
  luva: (i, s, b) => ({ sc: 1.06 + 0.08 * bumpa(s, 45.3, 1.1), rot: 6 * Math.sin(Math.PI * (b - 79) / 2), ansikte: s > LUVA_RIT + 1.7 ? 'stolt' : null }),   // gungar fram med luvan
  alla: (i, s, b) => { const u = mjuk(kl((b - 87.4) / 3)), byt = i !== 1 && b < 91;   // hjärtat och stjärnan byter plats: hjärtat över, stjärnan under
    const dx = i === 1 ? 0 : (i === 0 ? 1 : -1) * 2 * SP * u, arc = byt ? -(i === 0 ? 210 : 60) * Math.sin(Math.PI * u) : 0;
    return { dx, dy: arc, rot: byt ? 0 : 3 * gung(b), hopp: [...(i === 1 ? varannan(88, 91, 0, 40) : []), paOrdet(87 + RAKNA[[2, 1, 0][i]], 130)], tittar: byt ? (i === 0 ? 1 : -1) : 0 }; },   // vågen från vänster efter bytet
  spegel: (i, s, b) => { const L = sB(103), sp = Math.sin(2 * Math.PI * (b - 103) / 4), g = mjuk(kl((s - L - 3.4) / 0.4)), sid = i - 1;
    return { dx: sid * 110 * sp, rot: -sid * 8 * sp * (1 - g) + 9 * g * Math.sin(2 * Math.PI * (s - L - 3.4) / 2.2),
      hopp: [...(i === 1 ? varannan(103, 108, 0, 50) : []), [L + 2.9, 220, 1.3]], skratt: [L + 2.5, L + 3.5] }; },
  marsch: (i, s, b) => { const n = b - 127, p = n < 8 ? (Math.floor(n) + mjuk(n % 1)) / 8 : 1, steg = n < 8 ? Math.floor(n) : 0;
    return { dx: 1500 * (1 - mjuk(p)), rot: n < 8 ? (steg % 2 ? 6 : -6) : 3 * gung(b), hopp: n < 8 ? [landar(127 + steg + 1, 22, 0.7)] : varannan(136, 143, i, 70) }; },
  rad: (i, s, b) => ({ rot: 2 * gung(b), hopp: [...[151, 152, 153, 154].filter(n => n % 3 === i).map(n => landar(n + 1, 110)), ...[156, 157, 158, 159].map(n => landar(n, 50))], sjunger: b > 155 }),
  final: (i, s, b) => ({ rot: 6 * mjuk(kl((b - 161.5) / 1)) * Math.sin(Math.PI * (b - 161.5) / 2), hopp: [paOrdet(160.2, 230, 1.6)], skratt: [sB(159.6), sB(165)] }),
  slut: (i, s, b) => { const a = 1 - mjuk(kl((b - 168) / 7)); return { ...kok(i, b, a), skratt: [0, sB(170)] }; },
};
// kakan i, sångtid s: läge, skala, tryck/sträck och ansikte
function dans(i, s) {
  const [, v, , namn] = skottVid(s), b = bS(s), d = DANS[namn](i, s, b), hp = hoppa(s, d.hopp ?? []), x0 = KAKOR[i][3];
  const nara = v === 'SN', vem = { hjarta: 0, gubbe: 1, glitter: 2, luva: 2 }[namn];
  const [x, y, sk] = v === 'SN' ? [0, NY, NS] : v === 'S' || v === 'SM' ? [LX(i), Y0, SS] : [x0, YT, 1];
  const tryck = Math.max(hp.tryck, d.tryck ?? 0);
  let ansikte = d.ansikte ?? (hp.hog ? 'o' : 'ans');
  if (d.skratt && s >= d.skratt[0] && s < d.skratt[1]) ansikte = 'skr';
  if (d.sjunger && ansikte === 'ans' && bS(s) % 1 < 0.5) ansikte = 'o';   // munnen öppen på slaget
  return { x: x + (d.dx ?? 0) * (nara ? 0 : 1), y: y + (d.dy ?? 0) + hp.y, mark: y, sk: sk * (d.sc ?? 1), rot: d.rot ?? 0,
    sx: (1 + 0.1 * tryck) * (1 - 0.6 * hp.strack), sy: (1 - 0.14 * tryck) * (1 + hp.strack), op: nara && vem !== i ? 0 : 1, ansikte, scen: v[0] === 'S', nara };
}
