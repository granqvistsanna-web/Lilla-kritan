<!doctype html>
<meta charset="utf-8">
<title>Julkalendern – lucka 4: pepparkaksdansen</title>
<script src="/verktyg/blinka.js"></script><script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script src="/produktion/youtube/shorts/jul/lucka.js"></script><script src="/produktion/youtube/shorts/jul/djur.js"></script>
<script>
// Julkalendern, lucka 4, version B "Pepparkaksdansen" (Sanna valde den 2026-11-12; den större bakversionen ligger i aldre/index-bakar-utkast.html).
// Köket på kvällen, björnen i tomteluva bakom bordet. 1 Hej, tomteluvan. 2 Ett hjärta och en gubbe poppar fram på bordet, kritan ritar den
// tredje kakan, en stjärna, och ritar busigt en mustasch på gubben. 3 Kakorna sover (blundar); barnets tur: klappa (paus). 4 Klapp, klapp,
// klapp: en kaka i taget vaknar och hoppar. 5 Sången "Pepparkaksdansen" (Mureka, 97,75 s, 112 BPM), hel och oklippt, bädden tystnar:
// kakorna hoppar på slagen och björnen dansar. 6 Så glada, tack kritan, kakorna bugar, hej då. Kakorna äts aldrig.
// Repliker: assets/ljud/roster/jul/, de nya i rost-04.txt (ElevenLabs v3, Malin).
const { ritbild } = julDjur;
const SANG = { fil: 'pepparkaksdansen', langd: 97.75 }, SLAG = 0.5455, SLAG0 = 0.648;   // librosa: första slaget 0,648 s, sedan var 0,5455 s
const BX = -330, SKB = 0.92;   // björnen bakom bordets vänstra del
const BORD = -20, YT = -262;   // bordets mitt och bordsskivan där kakorna står
const KS = 0.27;   // kakornas skala (1024-bilderna)
// kakorna: [namn, bild, ankare (fotens mitt i bilden), x på bordet, ansiktets mitt i bilden, ansiktets skala]
const KAKOR = [['hjarta', 'pepparkakshjarta', [512, 875], 20, [512, 400], 2.6], ['gubbe', 'pepparkaksgubbe', [512, 920], 200, [512, 250], 1.8], ['stjarna', 'pepparkaksstjarna', [512, 905], 380, [512, 550], 2.8]];
const kinder = () => `<ellipse cx="-60" cy="24" rx="15" ry="9" fill="#F28B9B" opacity=".85"/><ellipse cx="60" cy="24" rx="15" ry="9" fill="#F28B9B" opacity=".85"/>`;
const vaken = s => `<g transform="scale(${s})"><ellipse cx="-34" cy="-6" rx="13" ry="17" fill="#2A2421"/><ellipse cx="34" cy="-6" rx="13" ry="17" fill="#2A2421"/>
  <circle cx="-30" cy="-12" r="5" fill="#fff"/><circle cx="38" cy="-12" r="5" fill="#fff"/>${kinder()}
  <path d="M-18 22 Q0 42 18 22" fill="none" stroke="#2A2421" stroke-width="9" stroke-linecap="round"/></g>`;
const sover = s => `<g transform="scale(${s})"><path d="M-48 -8 Q-34 6 -20 -8 M20 -8 Q34 6 48 -8" fill="none" stroke="#2A2421" stroke-width="8" stroke-linecap="round"/>${kinder()}
  <ellipse cx="0" cy="28" rx="7" ry="5" fill="#2A2421"/></g>`;
const iKaka = ([, , [ax, ay], , [fx, fy]], svg) => `<g transform="scale(${KS}) translate(${fx - ax} ${fy - ay})">${svg}</g>`;
const kaka = ([n, fil, [ax, ay]]) => n === 'stjarna'
  ? `<g filter="url(#kakkant-s)">${ritbild('__ID__', fil, 1024, 1024, [ax, ay], KS, '#7A4520')}</g>`   // kritan ritar stjärnan
  : `<g transform="scale(${KS}) translate(${-ax} ${-ay})"><g filter="url(#kakkant)"><image href="/assets/rekvisita/${fil}/cut/${fil}.png" width="1024" height="1024"/></g></g>`;
const kant = (id, r) => `<filter id="${id}" x="-10%" y="-10%" width="120%" height="120%"><feMorphology in="SourceAlpha" operator="dilate" radius="${r}" result="d"/><feFlood flood-color="#fff"/>
  <feComposite in2="d" operator="in" result="v"/><feMerge><feMergeNode in="v"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
const TINGRIT = {
  bord: `${kant('kakkant', 14)}${kant('kakkant-s', 14 * KS)}<image href="/assets/rekvisita/bordet/cut/bordet.png" width="998" height="562" transform="scale(1.0 0.5) translate(-499 -547)"/>`,
  mustasch: `<g transform="scale(${KS}) translate(-512 -920)"><path d="M508 296 Q484 322 456 308 Q442 300 448 284 M516 296 Q540 322 568 308 Q582 300 576 284" fill="none" stroke="#3B2A22" stroke-width="22" stroke-linecap="round"/></g>`,
  ...Object.fromEntries(KAKOR.flatMap(k => [[k[0], kaka(k)], ['ans_' + k[0], iKaka(k, vaken(k[5]))], ['sov_' + k[0], iKaka(k, sover(k[5]))]])),
};

// bitarna: [sekunder, rörelse, val, namn]
const SCEN = [
  [2.8, 'vinka', { sag: [['jul/bjorn-hej', 'Hej björnen!', 0.75]], ljud: [['brum-gullig', 1.8, '1c']] }],
  [3.4, 'nicka', { uttryck: 'kawaii', sag: [['jul/04-tomteluva', 'Oj! Björnen har en tomteluva!', 0.4]] }],
  // ett hjärta och en gubbe poppar fram på bordet
  [3.2, 'stilla', { uttryck: 'jatteglad', sag: [['jul/04-titta-kakor', 'Titta! Pepparkakor!', 1.0]], ljud: [['pop', 0.2, 1, 1.4], ['pop', 0.6, 2, 1.4]] }, 'kakor'],
  // kritan ritar den tredje kakan, en stjärna
  [4.8, 'stilla', { rit: [[0.3, 'stjarna', 2.4]], sag: [['jul/04-ritar-stjarna', 'Kritan ritar en stjärna!', 0.7]] }, 'ritstj'],
  [4.8, 'stilla', { busig: [0.4, 200, YT - 165], sag: [['jul/kritan-busig', 'Oj, kritan! Vad busig du är!', 1.7]] }, 'busig'],
  [2.6, 'stilla', { uttryck: 'skrattar', ljud: [['fniss', 0.3, 2, 3.0, 1.0]] }],
  // kakorna sover; barnets tur: klappa (paus ca 5 s)
  [3.4, 'stilla', { uttryck: 'tanker', sag: [['jul/04-sover', 'Sch... Pepparkakorna sover.', 0.6]] }, 'sover'],
  [7.4, 'stilla', { sag: [['jul/04-kan-du-klappa', 'Kan du klappa? Då vaknar de!', 0.3]] }],
  // tre klappar, en kaka i taget vaknar och hoppar upp
  [3.6, 'klappa', { sag: [['jul/04-klapp', 'Klapp! Klapp! Klapp!', 1.0]], ljud: [['tass-klapp', 1.0, 1, 1.3], ['tass-klapp', 1.5, 2, 1.3], ['tass-klapp', 2.0, 1, 1.3], ['pop', 1.05, 1, 1.0], ['pop', 1.55, 2, 1.0], ['pop', 2.05, 1, 1.0]] }, 'klapp'],
  [3.2, 'stilla', { uttryck: 'jatteglad', sag: [['jul/04-de-vaknade', 'Titta! De vaknade!', 0.4]], ljud: [['brum-gullig', 2.4, 2]] }, 'vaknade'],
  [2.8, 'stilla', { sag: [['jul/04-kan-du-dansa', 'Kan du dansa med?', 0.3]] }],
  // sången, hel och oklippt; bädden är tyst under den
  ...(() => { const M = [['dansa', 8], ['vagga', 4.2], ['dansa', 8], ['klappa', 3.2], ['dansa', 8], ['hoppa', 2.6], ['vagga', 4.2]]; const b = []; let s = 0, i = 0;
    while (s < SANG.langd - 0.01) { const [r, d] = M[i++ % M.length], dd = Math.min(d, SANG.langd - s); b.push([dd, dd < 2.4 && r !== 'dansa' ? 'dansa' : r, { tyst: true, uttryck: r === 'dansa' ? undefined : 'jatteglad' }, b.length ? undefined : 'sang']); s += dd; }
    b[0][2].musik = [[SANG.fil, 0, 0.8]]; return b; })(),
  // glada kakor, tack kritan, kakorna bugar, hej då
  [3.2, 'stilla', { uttryck: 'jatteglad', sag: [['jul/04-sa-glada', 'Pepparkakorna är så glada!', 0.4]] }, 'glada'],
  [2.8, 'stilla', { busig: [0, 260, -520], sag: [['jul/tack-kritan', 'Tack, kritan!', 0.6]] }],
  [3.0, 'stilla', { uttryck: 'jatteglad', sag: [['jul/04-hejda-kakor', 'Hej då, pepparkakor!', 0.3]] }, 'bugar'],
  [2.6, 'vinka', { sag: [['jul/bjorn-hejda', 'Hej då björnen!', 0.5]], ljud: [['brum-gullig', 1.85, '1d']] }, 'hejda'],
];
const START = {}; { let s = 0; for (const [d, , , n] of SCEN) { if (n) START[n] = s; s += d; } START.slut = s; }
const T = (n, s = 0) => START[n] + s;

// tingens nycklar: [sekunder från första biten, x, y, skala, opacitet, grader]
const K = {};
const nyck = (n, ...a) => (K[n] ??= []).push(...a);
nyck('bord', [0, BORD, 0, 1, 1]);
const VAKNA = [1.0, 1.5, 2.0];
KAKOR.forEach(([n, , , x], i) => { const tv = T('klapp', VAKNA[i]);
  // fram: hjärtat och gubben poppar fram, stjärnan ritas av kritan (den syns medan konturen dras)
  const t0 = i < 2 ? T('kakor', [0.2, 0.6][i]) : T('ritstj', 0);
  const k = i < 2 ? [[t0 - 0.01, x, YT, 0, 0], [t0, x, YT, 0, 1], [t0 + 0.25, x, YT, 1.12, 1], [t0 + 0.4, x, YT, 1, 1]] : [[t0, x, YT, 1, 1]];
  // vaknar på klappen: ett hopp, och en liten vickning när "de vaknade"
  k.push([tv - 0.05, x, YT, 1, 1], [tv + 0.25, x, YT - 110, 1.06, 1, i % 2 ? 8 : -8], [tv + 0.5, x, YT, 1, 1, 0],
    [T('vaknade', 0.6 + 0.3 * i), x, YT, 1, 1, 0], [T('vaknade', 0.9 + 0.3 * i), x, YT, 1, 1, i % 2 ? -6 : 6], [T('vaknade', 1.3 + 0.3 * i), x, YT, 1, 1, 0]);
  // dansen: ett hopp per takt (två slag), varannan kaka på det andra slaget, lite vridning; slutar på ett slag före "så glada"
  for (let t = T('sang') + SLAG0 + SLAG * (i % 2); t < T('glada') - 0.6; t += 2 * SLAG) k.push([t, x, YT, 1, 1, 0], [t + SLAG, x, YT - 80, 1.03, 1, (Math.round(t / SLAG) % 4 < 2 ? 7 : -7)]);
  k.push([T('glada') - 0.3, x, YT, 1, 1, 0]);
  // bugar: dyker ner lite och upp igen, en i taget
  const b = T('bugar', 0.5 + 0.25 * i); k.push([b, x, YT, 1, 1, 0], [b + 0.35, x, YT + 16, 0.93, 1, 0], [b + 0.9, x, YT, 1, 1, 0]);
  nyck(n, ...k);
  // ansiktena följer kakan: sovansiktet från "sover" tills den vaknar, sedan det vakna
  const syns = (a, c) => k.map(([t, ...r]) => [t, ...r.slice(0, 3), t >= a && t < c ? r[3] : 0, ...r.slice(4)]);
  const ts = T('sover', 0.2);
  nyck('sov_' + n, ...syns(ts + 0.4, tv), [ts, x, YT, 1, 0], [ts + 0.4, x, YT, 1, 1], [tv + 0.02, x, YT, 1, 0]);
  nyck('ans_' + n, ...syns(tv - 0.05, Infinity), [tv - 0.2, x, YT, 1, 0]);
  // mustaschen: kritan ritar den busigt på gubben, sedan följer den gubben
  if (n === 'gubbe') nyck('mustasch', ...syns(T('busig', 1.1), Infinity), [T('busig', 0.95), x, YT, 1, 0], [T('busig', 1.1), x, YT, 1, 1]); });
for (const n in K) K[n].sort((a, b) => a[0] - b[0]);

julDjur.kor({
  lucka: 4, figur: 'bjornen-bulle', vinkArm: [38, 16], skala: SKB, x: BX, plats: 'koket', kvall: true,
  hattar: [[-1, 'luva', 512, 262, 0.6, -6]],
  tingrit: TINGRIT,
  scen: SCEN.map(([d, r, v = {}], i) => [d, r, i ? v : { ...v, ting: Object.fromEntries(Object.entries(K).map(([n, a]) => [n, a.map(([t, x, y, sk, op, rot = 0]) => [t, x, y, sk, op, rot])])) }]),
});
</script>
