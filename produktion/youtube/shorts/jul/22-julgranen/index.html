<!doctype html>
<meta charset="utf-8">
<title>Julkalendern – lucka 22: julgranen</title>
<script src="/produktion/youtube/shorts/gissa/gissa.js"></script>
<script src="/verktyg/blinka.js"></script><script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script src="/produktion/youtube/shorts/jul/lucka.js"></script><script src="/produktion/youtube/shorts/jul/rita.js"></script>
<script>
// Julkalendern, lucka 22 (omgjord 2026-11-12 efter Sannas granskning: allt kritan ritar är bilder, och granen behöver en julgransfot).
// Kritan ritar en gran ("Vad blir det?" – en gran!). Problem 1: kritan ritar en ljusslinga, men den är grå och lyser inte. Kritan
// ritar suddgummit, som suddar bort den grå slingan i tre drag, och kritan ritar en ny slinga med gula ljus; granen lyser.
// Problem 2: granen får ett ansikte, blir trött och lutar, först åt höger och sedan åt vänster (den har ingen fot). Barnets tur:
// hjälp granen att stå rakt; den blir lite rakare. Kritan ritar en julgransfot under den, och granen ställer sig rakt i foten.
// Sist: stå stilla som granen, granen tindrar och dansar, och vi tackar kritan och suddgummit.
// Bilderna: rekvisita/julgran.md (den nakna granen), ljusslinga.md (grå och tänd, samma form, i granbildens ruta), julgransfot.md, suddgummi.md.
// Granen står med stammens fot i (967, 948); allt på mittlagret (granen och den tända slingan) lutar kring den punkten.
// Ny replik (tyst tills den är inspelad): jul/22-julgransfot [excited] Kritan ritar en julgransfot!
const R = 'assets/ljud/roster/', REKV = 'assets/rekvisita/', MITT = [967, 580], FOT = [967, 948], HEM = [1470, 815];
const bild = (namn, o) => ({ bild: `${REKV}${namn}/cut/${namn}.png`, kontur: `${REKV}${namn}/cut/${namn}-kontur.json`, ...o });
const GRAN = { plats: [506.4, 92.2], skala: 0.9 };   // granbildens ruta; slingorna ligger i samma ruta
julRita.kor({
  lucka: 22, andning: 1.5, ansikte: { mitt: [967, 660], fot: FOT },
  steg: [
    bild('julgran', { ...GRAN, farg: '#2E5E3A', sek: 3.8, paus: 3,
      sag: [[R + 'vad-ritar-kritan-1', 'Vad ritar kritan?', 0.9], [R + 'vad-blir-det-1', 'Vad blir det?', 3.2]] }),
    { pop: 'mitt', mitt: MITT, sag: [[R + 'jul/22-en-gran', 'En gran!', 0.1]] },
    // problem 1: slingan blir grå och lyser inte (främre lagret, som suddgummit suddar)
    { ...bild('ljusslinga', { bild: REKV + 'ljusslinga/cut/ljusslinga-gra.png', ...GRAN, lager: 'fram', farg: '#7D838C', bredd: 9, sek: 3.2 }),
      busig: 5.4, sag: [[R + 'jul/22-ljusen-lyser-inte', 'Oj! Ljusen lyser inte.', 3.6], [R + 'jul/kritan-busig', 'Oj, kritan! Vad busig du är!', 6.0]] },   // kritan fnissar
    { vanta: 2.4, sag: [[R + 'jul/vad-gor-vi-nu', 'Hm … vad gör vi nu?', 0.5]] },
    bild('suddgummi', { plats: [1285.7, 630.5], skala: 0.36, lager: 'sudd', sek: 2.6, sag: [[R + 'jul/01-kritan-ritar-suddgummi', 'Kritan ritar ett suddgummi!', 0.8]] }),
    // "Sudd, sudd, sudd!" är en snabb tagning: ett ord per drag (dragen börjar 1,2, 1,9 och 2,6 s in), som i lucka 1
    { sudda: 'fram', over: [720, 1210, 600], hem: HEM, in: 1.2, smula: '#9AA0A8',
      sag: [[R + 'jul/01-sudd-sudd-sudd', 'Sudd,', 1.15, { ss: 0, langd: 0.4 }], [R + 'jul/01-sudd-sudd-sudd', 'sudd,', 1.95, { ss: 0.38, langd: 0.26 }],
        [R + 'jul/01-sudd-sudd-sudd', 'sudd!', 2.65, { ss: 0.62, langd: 0.6 }]] },
    // en ny slinga med gula ljus, på mittlagret (den följer granen när den lutar)
    { ...bild('ljusslinga', { ...GRAN, farg: '#C99A1E', bredd: 9, sek: 3.2 }), sag: [[R + 'jul/22-gula-ljus', 'Gula ljus!', 3.6]] },
    { tindra: 'mitt', mitt: MITT, stralar: [440, 500], ganger: 3, sag: [[R + 'jul/22-granen-lyser', 'Granen lyser.', 0.5]] },
    { vanta: 1.6, kansla: 'glad', sag: [[R + 'jul/01-tack-suddgummit', 'Tack, suddgummit!', 0.3, { vol: 5 }]] },   // suddgummit stannar kvar bredvid
    // problem 2: granen har ingen fot. Den får ett ansikte, blir trött och lutar, först åt höger och sedan åt vänster
    { pop: 'mitt', mitt: [967, 660], ansikte: true, kansla: 'glad', sag: [[R + 'jul/22-granen-vaknar', 'Granen är lite trött.', 0.4]] },
    { flyg: 'mitt', fran: FOT, vrid: 7, kring: FOT, sek: 2.6, kansla: 'forvanad', sag: [[R + 'jul/22-granen-lutar', 'Oj! Granen lutar.', 0.8]] },
    { vanta: 3, kansla: 'forvanad' },
    { flyg: 'mitt', vrid: -7, kring: FOT, sek: 2.6, kansla: 'forvanad', sag: [[R + 'jul/22-andra-hallet', 'Nu lutar den åt andra hållet!', 0.8]] },
    { vanta: 4.5, kansla: 'forvanad', sag: [[R + 'jul/22-behover-hjalp', 'Granen behöver hjälp!', 0.4], [R + 'jul/vad-gor-vi-nu', 'Hm … vad gör vi nu?', 2.4]] },
    // barnets tur: hjälp granen att stå rakt (paus 5 s); granen följer när barnet lutar sig åt vänster
    { vanta: 5, kansla: 'glad', sag: [[R + 'jul/22-hjalp-granen', 'Kan du hjälpa granen att stå rakt?', 0.4]] },
    { flyg: 'mitt', vrid: -3, kring: FOT, sek: 3.5, kansla: 'jatteglad', sag: [[R + 'jul/22-ja-lite-rakare', 'Ja! Den blir lite rakare.', 1.0]] },
    // kritan ritar en julgransfot runt stammen (lagret ovan2, framför granen), och granen ställer sig rakt i den
    bild('julgransfot', { plats: [806.8, 823.7], skala: 0.314, lager: 'ovan2', farg: '#3B3431', sek: 2.8, kansla: 'forvanad',
      sag: [[R + 'jul/22-julgransfot', 'Kritan ritar en julgransfot!', 0.6]] }),
    { flyg: 'mitt', vrid: 0, kring: FOT, sek: 1.6, kansla: 'jatteglad', ljud: [['landa-mjuk', 1.6, 1]], sag: [[R + 'jul/22-star-sjalv', 'Nu står den själv!', 1.8]] },
    { vanta: 2.5, kansla: 'jatteglad', sag: [[R + 'jul/22-foten-haller', 'Foten håller granen.', 0.4]] },
    // barnets andra tur: stå stilla som granen (paus 4 s), medan den tindrar
    { vanta: 5, kansla: 'glad', sag: [[R + 'jul/22-stand-stilla', 'Kan du stå stilla som granen?', 0.4]] },
    { tindra: 'mitt', mitt: MITT, stralar: [440, 500], ganger: 3, kansla: 'jatteglad' },
    // granen dansar lugnt, slingan lyser
    { vanta: 6, ror: 'dansa', kansla: 'jatteglad', sag: [[R + 'jul/22-granen-dansar', 'Granen dansar lugnt.', 0.6]] },
    { vanta: 3, kansla: 'glad', sag: [[R + 'jul/tack-kritan', 'Tack, kritan!', 0.4]] },
    { tack: true, kansla: 'glad', sag: [[R + 'jul/01-tack-suddgummit', 'Tack, suddgummit!', 0.3, { vol: 5 }]] },
  ],
});
</script>
