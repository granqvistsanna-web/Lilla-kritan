  const vingel = window.LJUD.find(c => c.fil.includes('granen-vinglar')).t - 0.3 + 0.2, VINGEL = 2.8;

  const klick = window.LJUD.find(c => c.fil.includes('lampa-klick')).t, badd = window.LJUD.filter(c => c.loop && c.fil.includes('karol-joy')).sort((a, b) => a.t - b.t).at(-1), slut = badd.t + badd.langd;

  const radioSkugga = el('ellipse', { cx: RB[0], cy: 997, rx: 360 * RADIO.skala, ry: 9, fill: '#5A4636', opacity: 0 }, radioG.parentNode); radioG.parentNode.insertBefore(radioSkugga, radioG);
  const noter = el('g', {}, svg.querySelector('#lager-mellan')), NOTF = ['#D9382E', '#6FA8D6', '#E8B730', '#8E6BB8', '#3FA7A0'];
  const not = (x, y, r, c, op) => `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${r.toFixed(1)})" opacity="${op.toFixed(2)}">` +
    ['#fff', c].map((f, j) => `<path d="M8 -2 V-40 Q22 -34 24 -20" fill="none" stroke="${f}" stroke-width="${j ? 6 : 13}" stroke-linecap="round" stroke-linejoin="round"/>` +
      `<ellipse cx="0" cy="0" rx="${j ? 11 : 14.5}" ry="${j ? 8 : 11.5}" transform="rotate(-22)" fill="${f}"/>`).join('') + '</g>';
  window.seek = window.render = t => {
    rita(t); yttre.setAttribute('opacity', t >= landa ? 1 : 0);
    const vu = t - vingel;
    if (vu > 0 && vu < VINGEL) { const w = 7 * Math.min(1, vu / 0.25) * (1 - vu / VINGEL) * Math.sin(2 * Math.PI * vu / 1.3), rot = `rotate(${w.toFixed(2)} ${FOT[0]} ${FOT[1]}) `;

    radioG.setAttribute('transform', rin ? `translate(${RB[0]} ${RB[1]}) rotate(${(2.5 * Math.sin(Math.PI * ru * 0.9) * rin).toFixed(2)}) scale(${(1 + 0.02 * slag * rin).toFixed(4)} ${(1 + 0.045 * slag * rin).toFixed(4)}) translate(${-RB[0]} ${-RB[1]}) ${radioLage}` : radioLage);
