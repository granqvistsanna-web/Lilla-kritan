<title>Julkalendern – lucka 6: adventsljusen</title>
<script src="/verktyg/blinka.js"></script><script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script src="/produktion/youtube/shorts/jul/lucka.js"></script><script src="/produktion/youtube/shorts/jul/djur.js"></script>
<script>
// Julkalendern, lucka 6, andra advent (produktion/youtube/julkalender-plan.md, variant A, ca 34 s): kväll. Fyra ljus står i
// snön till vänster om leoparden (svansen är till höger). Den lilla gula kritan kommer in (först, sedan "Kritan tänder ljusen.")
// och väntar vid veken en stund före varje låga. Leoparden känner hela vägen: nyfiken när kritan kommer, rycker till när första
// lågan tänds, hoppar av glädje när den andra brinner, nöjd med slutna ögon i den stilla stunden, stora blanka ögon medan vi
// räknar och den vaggar lugnt, och fnissigt varm när den vinkar hej då (uttryck: bitens eget ansikte, hela uttryck, inga blandningar).
// Varje reaktion börjar strax efter det som orsakar den: lågan tänds sist i biten före (tand), reaktionen är nästa bit.
// "Ett … två." är en fil (06-ett-tva.m4a, en tyst tagning: styrka 7): "Ett." och "Två." spelas var för sig (ss, langd).
// Repliker i assets/ljud/roster/jul/ (06-sa-fint-det-lyser är ny och tyst tills den är inspelad), hej och hej då är
// tittut-seriens (leopard-hejda är tyst: styrka 4,4). Leopardens läten (spinn-gullig, spinn-fniss) kommer efter replikerna,
// hej då-lätet lägre än berättaren. glimt på varje låga (tysta filer: styrka 7,8 och 4,3).
const ETT = (vid) => ['jul/06-ett-tva', 'Ett.', vid, 0, 0.66, 7], TVA = (vid) => ['jul/06-ett-tva', 'Två.', vid, 1.32, 0.84, 7];
const glimt = (vid, k) => ['glimt', vid, k, k === 1 ? 7.8 : 4.3];
julDjur.kor({
  lucka: 6, figur: 'leoparden-lova', vinkArm: [38, 16], skala: 0.8, x: 220, sak: 'ljus', kvall: true,
  scen: [
    [3.2, 'vinka', { sag: [['tittut/leopard-hej', 'Hej leoparden!', 0.6, 0, 1.5]], ljud: [['spinn-gullig', 2.2, '1c']] }],
    [3.9, 'nyfiken', { tand: [3.8], sag: [['jul/kritan-tander-ljusen', 'Kritan tänder ljusen.', 1.1], ETT(3.7)], ljud: [glimt(3.8, 1)] }],
    [2.6, 'oj', { tand: [2.5], sag: [TVA(2.4)], ljud: [['spinn-gullig', 0.5, 2], glimt(2.5, 2)] }],
    [2.7, 'hoppa', { ljud: [['hopp-mjuk', 0.35, 1], ['spinn-fniss', 0.9, 1, 2.5], ['landa-mjuk', 1.35, 1]] }],
    [3.2, 'tittar', { sag: [['jul/06-tva-ljus', 'Två ljus! Det är advent.', 0.4]], ljud: [['spinn-gullig', 2.7, 4]] }],
    [3.0, 'nicka', { ser: true, uttryck: 'stolt', sag: [['jul/06-sa-fint-det-lyser', 'Så fint det lyser.', 0.9]] }],
    [1.3, 'stilla', { sag: [['jul/rakna-med-mig', 'Räkna med mig.', 0.2]] }],
    [5.0, 'vagga', { ser: true, uttryck: 'kawaii', blink: [0.8, 2.7], sag: [ETT(0.7), TVA(2.6)], ljud: [glimt(0.8, 1), glimt(2.7, 2)] }],
    [2.8, 'vinka', { uttryck: 'fnissig', sag: [['tittut/leopard-hejda', 'Hej då leoparden!', 0.5, 0, null, 4.4]], ljud: [['spinn-gullig', 1.95, '8c', 0.9]] }],
  ],
});
</script>
