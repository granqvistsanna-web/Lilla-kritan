<title>Julkalendern – lucka 9: paketet under granen</title>
<script src="/produktion/youtube/shorts/gissa/gissa.js"></script>
<script src="/verktyg/blinka.js"></script><script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script src="/produktion/youtube/shorts/jul/lucka.js"></script><script src="/produktion/youtube/shorts/jul/rita.js"></script>
<script>
// Julkalendern, lucka 9 (omgjord 2026-11-12 efter Sannas granskning: "paket ligger under granen", allt kritan ritar är bilder,
// snön kommer från ett moln som kritan ritar, granen står i en julgransfot). Kritan ritar en julgransfot och en julgran i den ("Åh, en
// julgran!"), och ett paket under granen, som får ett ansikte. Problem 1: bandet trasslar sig; kritan ritar suddgummit, som suddar bort
// härvan, och sedan en fin rosett. Problem 2: kritan ritar ett moln, och det börjar snöa på paketet; snön lägger sig i en hög ovanpå
// och paketet blir surt. Barnets tur: blåsa bort molnet (tre blås, molnet åker iväg åt höger). Suddgummit torkar bort snön, paketet
// dansar, och vi tackar kritan och suddgummit.
// Bilderna: rekvisita/julgransfot.md, bandtrassel.md och moln.md (snomoln: moln-stor omfärgat till gråblått, så att det syns mot papperet;
// Flow 2026-11-12), julgran.md, paket.md, rosett.md, snotuss.md, suddgummi.md.
// Bildernas plats räknas ur paketets mått: paketets täta yta är x 116–908, y 193–831 i bildens pixlar.
// Bus (Sanna 2026-11-12): kritan ritar bandtrasslet och snöhögen själv, fnissar ("Busiga krita!") och fixar det sedan.
// Nya repliker (tysta tills de är inspelade, rost-nya.txt): jul/09-trassligt-band, jul/busiga-krita, jul/09-gor-det-fint, jul/09-sno-pa-paketet.
// Fniss: assets/ljud/effekter/fniss (som kritan i lucka 8).
// Äldre: inga nya repliker. 03-kan-du-blasa ("Kan du blåsa? Fff!") och 03-fff ("Fff! Fff! Fff!") delas med lucka 3 och är tysta tills de är inspelade;
// när 03-fff finns, sätt ss/langd så att ett "Fff!" hör till varje blås nedan.
const { FARG: F } = gissa, R = 'assets/ljud/roster/', REKV = 'assets/rekvisita/';
const PS = 0.5, PP = [1000 - 116 * PS, 1020 - 831 * PS];          // paketet: vänsterkant x 1000, botten y 1020 (framför granens högra kant)
const PB = (x, y) => [PP[0] + x * PS, PP[1] + y * PS];           // en punkt i paketbildens pixlar -> scenen
const MITT = PB(512, 512), HEM = [1640, 930];                     // paketets mitt (1198, 860), suddgummits plats
const bild = (namn, o) => ({ bild: `${REKV}${namn}/cut/${namn}.png`, kontur: `${REKV}${namn}/cut/${namn}-kontur.json`, ...o });
const blas = (vid, ss) => ({ sag: [[R + 'jul/03-fff', 'Fff!', vid, { ss, langd: 0.7 }]], ljud: [['sus', vid, 1, { vol: 2.0, ss: 1.0, langd: 1.6 }]] });
julRita.kor({
  lucka: 9, andning: 1.6, ansikte: { mitt: PB(513, 695), fot: PB(513, 810), skala: 0.69 },
  steg: [
    // granen i sin julgransfot: foten först, sedan granen (konturen, barnet gissar, och bilden fylls i)
    bild('julgransfot', { plats: [602.8, 684.7], skala: 0.386, lager: 'mellan', farg: '#3B3431', sek: 2.6, sag: [[R + 'vad-ritar-kritan-1', 'Vad ritar kritan?', 0.9]] }),
    bild('julgran', { plats: [359.7, 15.2], skala: 0.86, lager: 'bak', farg: '#2E5E3A', sek: 3.6, paus: 3, sag: [[R + 'vad-blir-det-1', 'Vad blir det?', 2.4]] }),
    { pop: 'bak', mitt: [800, 438], sag: [[R + 'jul/01-ah-en-julgran', 'Åh, en julgran!', 0.1]] },
    // paketet under granen
    bild('paket', { plats: PP, skala: PS, farg: '#8E2A22', sek: 3.2, paus: 3, sag: [[R + 'vad-blir-det-1', 'Vad blir det?', 2.6]] }),
    { pop: 'mitt', mitt: MITT, ansikte: true, kansla: 'glad', sag: [[R + 'jul/09-ett-paket', 'Ett paket!', 0.1]] },
    { vanta: 1.5, kansla: 'jatteglad', sag: [[R + 'jul/09-under-granen', 'Paketet ligger under granen.', 0.3]] },
    // bus 1 (Sanna 2026-11-12: "oj vilket trassligt band kritan ritade och kritan fnissar busiga krita, sen får den fixa"): kritan ritar
    // ett trassligt band på paketet, vickar och fnissar, och sedan fixar den det (suddgummit och rosetten)
    bild('bandtrassel', { plats: [1004.3, 433.6], skala: 0.378, lager: 'fram', farg: '#B8891B', sek: 2.6, kansla: 'forvanad', kanslaVid: 2.6, busig: 3.0,
      ljud: [['fniss', 3.05, 1, { vol: 2 }]], sag: [[R + 'jul/09-trassligt-band', 'Oj, vilket trassligt band kritan ritade!', 3.7]] }),
    { vanta: 2.4, busig: 0.2, kansla: 'forvanad', ljud: [['fniss', 0.25, 3, { vol: 2 }]], sag: [[R + 'jul/busiga-krita', 'Busiga krita!', 0.9]] },
    { vanta: 2.8, ror: 'skaka', kansla: 'arg', ljud: [['fnys', 0.3, 1], ['fnys', 1.7, 2]], sag: [[R + 'jul/09-blir-arg', 'Paketet blir arg!', 0.6]] },
    { vanta: 2.2, kansla: 'arg', sag: [[R + 'jul/09-gor-det-fint', 'Kritan, kan du göra det fint?', 0.3]] },
    bild('suddgummi', { plats: [HEM[0] - 184.3, HEM[1] - 184.5], skala: 0.36, lager: 'sudd', sek: 2.6, ljud: [['pip', 3.75, 1]], sag: [[R + 'jul/01-kritan-ritar-suddgummi', 'Kritan ritar ett suddgummi!', 0.8]] }),
    // "Sudd, sudd, sudd!": ett ord per drag (dragen börjar 1,2, 1,9 och 2,6 s in), som i lucka 1
    { sudda: 'fram', over: [1070, 1330, 630], hem: HEM, in: 1.2, ljud: [['pip', 0.95, 1]], smula: '#E8B730', kansla: 'forvanad', kanslaVid: 1.2,
      sag: [[R + 'jul/01-sudd-sudd-sudd', 'Sudd,', 1.15, { ss: 0, langd: 0.4 }], [R + 'jul/01-sudd-sudd-sudd', 'sudd,', 1.95, { ss: 0.38, langd: 0.26 }],
        [R + 'jul/01-sudd-sudd-sudd', 'sudd!', 2.65, { ss: 0.62, langd: 0.6 }]] },
    // rosetten: knuten på paketets överkant
    bild('rosett', { plats: PB(161.2, -108.4), skala: 0.686 * PS, farg: '#B8891B', sek: 2.4, kansla: 'glad', sag: [[R + 'jul/09-en-rosett', 'En rosett!', 2.6]] }),
    { tindra: 'mitt', mitt: MITT, stralar: [250, 300], ganger: 3, ror: 'dansa', kansla: 'jatteglad', sag: [[R + 'jul/09-glad-igen', 'Paketet är glad igen!', 0.5], [R + 'jul/09-oppnar-pa-julafton', 'Vi öppnar det på julafton.', 2.6]] },
    { vanta: 1.6, kansla: 'glad', ljud: [['pip', 1.0, 1]], sag: [[R + 'jul/01-tack-suddgummit', 'Tack, suddgummit!', 0.3, { vol: 5 }]] },   // suddgummit bugar   // suddgummit stannar kvar bredvid
    // bus 2: kritan ritar ett moln över paketet, det börjar snöa, och kritan ritar en snöhög på paketet och fnissar
    bild('moln', { bild: REKV + 'moln/cut/snomoln.png', kontur: REKV + 'moln/cut/snomoln-kontur.json', plats: [996, 120], skala: 0.31, lager: 'ovan2', farg: '#6F86A8', sek: 2.6, busig: 3.9,
      ljud: [['fniss', 3.95, 5, { vol: 2 }]], sag: [[R + 'jul/01-ett-moln', 'Ett moln!', 2.7]] }),   // molnet är kritans bus också: den fnissar
    { vanta: 3.5, snoar: [1060, 1340, 330, 640], kansla: 'forvanad', kanslaVid: 1.0, sag: [[R + 'jul/03-det-snoar', 'Titta, det snöar!', 1.2]] },
    // kritan ritar snöhögen ovanpå paketet och fnissar
    bild('snotuss', { plats: PB(171.2, -312.3), skala: 0.652 * PS, lager: 'ovan', farg: '#9FB6D6', sek: 2.4, kansla: 'forvanad', kanslaVid: 1.0, busig: 2.9,
      ljud: [['fniss', 2.95, 2, { vol: 2 }]], sag: [[R + 'jul/09-sno-pa-paketet', 'Oj! Kritan ritade snö på paketet!', 3.6]] }),
    { vanta: 2.4, busig: 0.2, kansla: 'forvanad', ljud: [['fniss', 0.25, 4, { vol: 2 }]], sag: [[R + 'jul/busiga-krita', 'Busiga krita!', 0.9]] },
    { vanta: 2.8, kansla: 'arg', kanslaVid: 0.2, ljud: [['fnys', 0.3, 3]], sag: [[R + 'jul/09-tycker-inte-om-sno', 'Paketet tycker inte om snö!', 0.8]] },
    // barnets tur: blåsa bort molnet. Det slutar snöa på första blåset, och molnet åker åt höger, lite för varje blås
    { vanta: 6, kansla: 'forvanad', sag: [[R + 'jul/03-kan-du-blasa', 'Kan du blåsa? Fff!', 0.4]] },
    // molnet åker uppåt och bort (och blir mindre), så att det inte korsar kritan som väntar uppe till höger
    { flyg: 'ovan2', fran: [1198, 230], till: [1240, 160], skala: 0.85, sek: 1.0, hojd: 0, snoar: false, ...blas(0.1, 0) },
    { flyg: 'ovan2', till: [1300, 70], skala: 0.65, sek: 1.0, hojd: 0, ...blas(0.1, 0.8) },
    { flyg: 'ovan2', till: [1400, -260], skala: 0.4, sek: 1.4, hojd: 0, kansla: 'glad', kanslaVid: 1.4, ...blas(0.1, 1.6) },
    { vanta: 1.2, kansla: 'glad', sag: [[R + 'jul/09-molnet-aker-bort', 'Molnet åker bort!', 0.1]] },
    { vanta: 2.2, kansla: 'glad', sag: [[R + 'jul/09-gor-det-fint', 'Kritan, kan du göra det fint?', 0.3]] },
    // suddgummit torkar bort snön, ett hörn i taget
    { sudda: 'ovan', over: [1070, 1330, 610], hem: HEM, in: 1.6, ljud: [['pip', 0.95, 1]], smula: '#9FB6D6', kansla: 'glad',
      sag: [[R + 'jul/09-ett-horn', 'Ett hörn.', 1.55], [R + 'jul/09-ett-till', 'Ett till.', 2.35], [R + 'jul/09-och-ett-till', 'Och ett till!', 3.05]] },
    { vanta: 1.5, kansla: 'jatteglad', sag: [[R + 'jul/09-torrt-och-glatt', 'Nu är paketet torrt och glatt!', 0.3]] },
    // barnets tur: dansa som paketet
    { vanta: 5, kansla: 'glad', sag: [[R + 'jul/09-kan-du-dansa', 'Kan du dansa som paketet?', 0.4]] },
    { tindra: 'mitt', mitt: MITT, stralar: [250, 300], ganger: 3, ror: 'dansa', kansla: 'jatteglad', sag: [[R + 'jul/nu-dansar-vi', 'Nu dansar vi!', 0.3]] },
    { vanta: 3, kansla: 'glad', sag: [[R + 'jul/tack-kritan', 'Tack, kritan!', 0.4]] },
    { tack: true, kansla: 'glad', ljud: [['pip', 0.2, 1]], sag: [[R + 'jul/01-tack-suddgummit', 'Tack, suddgummit!', 0.3, { vol: 5 }]] },
  ],
}).then(() => {
  // Bara i lucka 9 (som lucka 1, utan att röra rita.js): stammen går ner i julgransfoten (Sanna 2026-11-12: "place gran better inside the julgransfot").
  // Foten ligger framför granen och är ogenomskinlig, så stammen såg ut att sluta ovanpå kanten. Granen ritas en gång till i fotens grupp, men bara
  // i skålens öppning (ellipsen (512, 279), 250 × 48 i fotbildens pixlar) och ovanför den, så att stammen syns nere i skålen, framför bakkanten,
  // och skålens framkant ligger framför stammen. Lappen klipps också av fotens och granens egna växande cirklar och följer granens lager (pop).
  const NS = 'http://www.w3.org/2000/svg', svg = document.querySelector('svg'), defs = svg.querySelector('defs');
  const el = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
  const hitta = n => [...svg.querySelectorAll('image')].find(i => i.getAttribute('href').endsWith(n + '.png'));
  const fot = hitta('julgransfot'), gran = hitta('julgran');
  el('path', { d: 'M0 0 H1024 V279 H762 A250 48 0 0 1 262 279 H0 Z' }, el('clipPath', { id: 'fot-oppning' }, defs));
  const lapp = el('g', {}, el('g', { 'clip-path': 'url(#fot-oppning)' }, el('g', { 'clip-path': fot.getAttribute('clip-path') }, fot.parentNode)));
  el('image', { href: gran.getAttribute('href'), width: 1024, height: 1024, 'clip-path': gran.getAttribute('clip-path') },
    el('g', { transform: gran.parentNode.getAttribute('transform') }, lapp));
  const bak = svg.querySelector('#lager-bak'), FOT = fot.parentNode.getAttribute('transform').match(/translate\(([-\d.]+) ([-\d.]+)\) scale\(([\d.]+)\)/);
  const tillbaka = `scale(${1 / FOT[3]}) translate(${-FOT[1]} ${-FOT[2]})`, rita = window.render;
  // Suddgummit får personlighet (berättelsegranskningen 2026-11-12): ett glatt skutt när det är färdigritat (med sitt pip, stegets ljud)
  // och en liten bugning på första "Tack, suddgummit!". Tiderna läses ur replikerna i window.LJUD.
  const tid = n => (window.LJUD ?? []).filter(c => c.fil.includes(n)).map(c => c.t);
  const PIP = tid('pip/pip-1'), SKUTT = PIP[0] - 0.05, BUG = PIP[2] - 0.1;   // pipen: färdigritat, 1:a suddet, 1:a tacket, 2:a suddet, tacket
  const sudd = svg.querySelector('#lager-sudd'), bump = (a, d, t) => t > a && t < a + d ? Math.sin(Math.PI * (t - a) / d) : 0;
  window.seek = window.render = t => {
    rita(t); lapp.setAttribute('transform', `${tillbaka} ${bak.getAttribute('transform') ?? ''}`);
    const hopp = 40 * bump(SKUTT, 0.55, t), bug = 14 * bump(BUG, 1.0, t);
    if (hopp || bug) sudd.setAttribute('transform', `translate(0 ${-hopp}) rotate(${-bug} ${HEM[0] - 60} ${HEM[1] + 70}) ${sudd.getAttribute('transform') ?? ''}`);
  };
  window.render(+new URLSearchParams(location.search).get('t') || 0);
});
</script>
