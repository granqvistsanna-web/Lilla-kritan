// Ur motorn: dörren (ting dorr/dorroppen), gästen dyker upp i dörren (dyker), hamta (gästen går, gang), och med: { 0: [rörelse, { dx }] } (gästen ute på isen).
// 2026-11-15 (julkalender-granskning-2026-11-15.md, granskning D, J13 2/2/2): bara inspelade repliker (inga tysta platshållare), knackningen tillbaka som

// med armarna och lutar sig, närbild på det förvånade ansiktet), närbilder (kam/nara) genom hela sången som i J23, och figurerna isär (lammet slutar
// till vänster om grisen, grisen bredvid dörren). Barnets tur med stegen: 13-kan-du-sma-steg "Kan du också gå med små steg?" (inspelad 2026-11-15, godkänd av Sanna).
// 2026-11-15 kväll (QA): lammet går själv över isen med små steg (barnets tur), kommer fram till dörren och knackar på den med armen (dörren skakar
// och kransen gungar på varje knack), och grisen tittar ut sömnig i dörren och stannar där. Grisen går inte längre över isen. Lammet backar sedan
// några steg så att grisens närbild inte klipper lammets ansikte.
// Sidans egna rörelser ovanpå motorn (inga delade filer ändras): vifta: [[från, till]] = lammet viftar med armarna och vinglar när det halkar,
// gaspa: [sekunder] = grisen gäspar (munnen öppnas, ögonen nästan stängda), vaken: sekunder = när grisen vaknar (före det är den sömnig, ögonen tunga).
const glimt = (vid, k) => ['glimt', vid, k, k === 1 ? 7.8 : 4.3], steg = (d, k) => [0, 1, 2].map(i => ['tass', 0.2 + (d - 0.4) / 3 * (i + 0.8), k + i, 1.6]);
const RAKNA = vid => ['jul/20-ett-till-fyra', 'Ett … två … tre … fyra.', vid];
// platserna i scenen (x, 0 = mitt i bild, bildens x = 960 + 0,82 · x): lammet börjar i LX och står efter tre steg i L1 vid isens vänstra kant;
// isen (blankis) mitt i ICE, skala IS; dörren i DX; grisen står i dörröppningen (GF = DX) från att dörren öppnas.
// 2026-11-16 (Sannas feedback): dörren större (DS 1,05) och i en husvägg (HUS, ritad i kod bakom dörren), grisen lika stor som lammet (0,66), snön faller (snoa),
// djup (parallax när kameran åker in), isklivet omgjort (lammet tittar ner, provar med foten, glider med benen isär), sången filmisk (närbilder på lammets ansikte
// mot enfärgad kvällsblå bakgrund = solo, lugna inåkningar, grisen går ut till lammet), och räkningen och tacket ligger över sångens instrumentala slut.

const HUS = `<g transform="translate(${DX} 0)"><g filter="url(#hus-vax)">

// sången: 74,8 slag i minuten (uppmätt; Mureka säger 76), första slaget 0,29 s in. sang(från, till, rörelse, …) = en bit från och till sekunder i sången, utan bädd;

const SP = 60 / 74.8, SF = 0.29, SANG = 107.4;

    // 2026-11-16 (Sanna, 0:44): i glidningen bytte motorn hårt mellan förvånad och glad efter farten, så ansiktet blinkade. Nu tonar det mjukt till förvånat och håller
    const fv = fonk(F0.forv, t, 0.45); if (fv > 0) f = { ...R.blanda(f, 'forvanad', fv), titt: f.titt };
    if (sp > 0) p = { ...p, ben: [(p.ben?.[0] ?? 0) + 16 * sp, (p.ben?.[1] ?? 0) - 16 * sp], sank: (p.sank ?? 0) + 14 * sp };
    if (pr > 0) { const a = F0.prova.find(([a, c]) => t > a - 0.4 && t < c + 0.4)?.[0] ?? t, tr = Math.abs(Math.sin(Math.PI * kl1((t - a) / 1.5) * 2));   // två tramp på 1,5 s
      p = { ...p, benY: [(p.benY?.[0] ?? 0), -34 * pr * (0.35 + 0.65 * tr)], ben: [(p.ben?.[0] ?? 0), (p.ben?.[1] ?? 0) - 6 * pr], luta: (p.luta ?? 0) - 2.5 * pr, rikt: 0.35 * pr };
      f = { ...R.blanda('neutral', 'nyfiken', 1), titt: [6 * pr, 10 * pr] }; p = { ...p, boj: (p.boj ?? 0) + 5 * pr }; }
    return rita0(fig, f, p); };
