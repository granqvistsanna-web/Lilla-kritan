<title>Julkalendern – lucka 13: Lucia</title>
<script src="/verktyg/blinka.js"></script><script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script src="/produktion/youtube/shorts/jul/lucka.js"></script><script src="/produktion/youtube/shorts/jul/djur.js"></script>
<script>
// Julkalendern, lucka 13, Lucia och tredje advent, tre minuter (produktion/youtube/julkalender-plan.md, avsnitt 6.3): kväll. Lammet står med en ljuskrona
// (det byggda: ljusen tänds, tre steg på tå) och räknar ljusen. Under snön ligger en blank isfläck, och lammet glider (problemet: för hal): tre försök, och lammet
// halkar lugnt åt sidan varje gång, men kronan sitter kvar. Grisen kommer in från höger på tå. Barnets tur (paus 5 s): gå på tå, så tyst. Lammet och grisen tassar
// tillsammans över isen, tre gånger, och kronans ljus blinkar i takt. Sist står de bredvid varandra, ljusen blinkar ett i taget (räknat), och de går ut, tyst.
// Nya saker i motorn: isfläcken (ting bak_is), huvudfiguren glider (ga: glidar), gästen kommer in på tå (in + tass) och går (hamta), kronans lågor blinkar (blink).
// Nya repliker i assets/ljud/roster/jul/ är tysta tills de är inspelade (förhandsvisningen läser dem):
//   13-hal [surprised] Oj! Det är hal!     nu-forsoker-vi-igen [encouraging] Nu försöker vi igen.     titta-grisen [excited] Titta, där kommer grisen!
//   13-nu-gar-vi [warm] Nu går vi tillsammans.     13-lugnt [softly] Nu är det lugnt och fint.     tack-grisen [warm] Tack, grisen!   (gris-hejda finns inte här: de går ut tyst)
// 13-tass (3,3 s, orden vid 0, 1,22 och 2,56 s) och 20-ett-till-fyra (5,0 s, orden vid 0,1, 1,24, 2,75 och 4,2 s) är inspelade. glimt på varje ljus (styrka 7,8 och 4,3), tass på varje steg.
const glimt = (vid, k) => ['glimt', vid, k, k === 1 ? 7.8 : 4.3], steg = (d, k) => [0, 1, 2].map(i => ['tass', 0.2 + (d - 0.4) / 3 * (i + 0.8), k + i, 1.6]);
const RAKNA = vid => ['jul/20-ett-till-fyra', 'Ett … två … tre … fyra.', vid], ICE = 100;
julDjur.kor({
  lucka: 13, figur: 'lammet-ludde', skala: 0.85, x: -350, sak: 'krona', kvall: true,
  gaster: [['grisen-greta', 700, 0.85, 1]],
  scen: [
    // A–B: det byggda
    [3.2, 'stilla', { sag: [['jul/13-det-ar-lucia', 'Det är Lucia.', 0.8]] }],
    [5.8, 'tittar', { tand: [0.8, 1.9, 3.0, 4.1], sag: [['jul/13-ljus-i-kronan', 'Lammet har ljus i sin krona.', 2.3]], ljud: [glimt(0.8, 1), glimt(1.9, 2), glimt(3.0, 1), glimt(4.1, 2)] }],
    [4.4, 'tassa', { steg: 3, sag: [['jul/13-tass', 'Tass … tass … tass.', 1.35]], ljud: steg(4.4, 1) }],
    // B, nytt: lammet räknar ljusen, och går tre steg till
    [9.0, 'stilla', { blink: [0.6, 1.8, 3.3, 4.8], sag: [RAKNA(0.5)], ljud: [glimt(0.6, 1), glimt(1.8, 2), glimt(3.3, 1), glimt(4.8, 2)] }],
    [5.0, 'tassa', { steg: 3, ljud: steg(5.0, 4) }],
    // C: under snön ligger en blank isfläck, och lammet glider ett litet stycke
    [12.0, 'ga', { gang: [[0, 0], [2.5, 0], [5.5, 110], [12, 110]], glidar: true, ting: { bak_is: [[0, ICE, 4, 1, 0], [1.2, ICE, 4, 1, 1]] }, sag: [['jul/13-hal', 'Oj! Det är hal!', 4.4]], ljud: [['glid', 2.6, 1, 11, 2.4]] }],
    // D: tre försök, och lammet halkar lugnt åt sidan varje gång. Kronan sitter kvar
    [8.0, 'ga', { gang: [[0, 0], [2, 60], [2.4, 60], [4.4, -90], [8, -90]], glidar: [[2.4, 4.4]], nyfiken: false, sag: [['jul/nu-forsoker-vi-igen', 'Nu försöker vi igen.', 0.6]], ljud: [['tass', 1.0, 1, 1.6], ['glid', 2.5, 1, 11, 2.0]] }],
    [8.0, 'ga', { gang: [[0, 0], [2, -60], [2.4, -60], [4.4, 90], [8, 90]], glidar: [[2.4, 4.4]], ljud: [['tass', 1.0, 2, 1.6], ['glid', 2.5, 1, 11, 2.0]] }],
    [8.0, 'ga', { gang: [[0, 0], [2, 60], [2.4, 60], [4.4, -90], [8, -90]], glidar: [[2.4, 4.4]], ljud: [['tass', 1.0, 3, 1.6], ['glid', 2.5, 1, 11, 2.0]] }],
    // E: grisen kommer in på tå. Barnets tur: gå på tå, så tyst (paus 5 s)
    [9.0, 'stilla', { in: 0, tass: true, sag: [['jul/titta-grisen', 'Titta, där kommer grisen!', 0.8]], ljud: [['tass', 0.8, 1, 1.6], ['tass', 1.7, 2, 1.6], ['tass', 2.6, 3, 1.6]] }],
    [10.0, 'stilla', { med: { 0: 'vanta' }, sag: [['jul/13-ga-pa-ta', 'Kan du gå på tå, så tyst?', 0.4]] }],
    [12.0, 'stilla', { med: { 0: 'vanta' } }],
    // F: lammet och grisen tassar tillsammans över isen, tre gånger, och kronans ljus blinkar i takt
    [11.0, 'ga', { gang: [[0, 0], [3.4, 40], [11, 40]], med: { 0: ['hamta', { gang: [[0, 0], [3.4, 40], [11, 40]] }] }, blink: [3.6, 4.4, 5.2, 6.0], sag: [['jul/13-tass', 'Tass … tass … tass.', 0.4], ['jul/13-nu-gar-vi', 'Nu går vi tillsammans.', 5.0]], ljud: [['tass', 0.6, 1, 1.6], ['tass', 1.8, 2, 1.6], ['tass', 3.0, 3, 1.6]] }],
    [11.0, 'ga', { gang: [[0, 0], [3.4, 40], [11, 40]], med: { 0: ['hamta', { gang: [[0, 0], [3.4, 40], [11, 40]] }] }, ljud: [['tass', 0.6, 1, 1.6], ['tass', 1.8, 2, 1.6], ['tass', 3.0, 3, 1.6]] }],
    [12.0, 'ga', { gang: [[0, 0], [3.4, 40], [12, 40]], med: { 0: ['hamta', { gang: [[0, 0], [3.4, 40], [12, 40]] }] }, ljud: [['tass', 0.6, 1, 1.6], ['tass', 1.8, 2, 1.6], ['tass', 3.0, 3, 1.6]] }],
    // G: det byggda (tre steg, stolt), och de står bredvid varandra medan ljusen blinkar ett i taget
    [4.4, 'ga', { gang: [[0, 0], [4.0, 60]], ljud: steg(4.4, 4) }],
    [2.8, 'stilla', { uttryck: 'stolt', ljud: [['ba-gullig', 0.4, 4, 1.2]] }],
    [16.0, 'stilla', { med: { 0: 'vanta' }, blink: [0.6, 1.8, 3.3, 4.8], sag: [RAKNA(0.5)], ljud: [glimt(0.6, 1), glimt(1.8, 2), glimt(3.3, 1), glimt(4.8, 2)] }],
    // H: lugn avslutning, de går ut, tyst
    [8.0, 'ga', { gang: [[0, 0], [2, 0], [7.5, 1100]], med: { 0: ['hamta', { gang: [[0, 0], [2, 0], [7.5, 1100]] }] }, sag: [['jul/13-lugnt', 'Nu är det lugnt och fint.', 0.4], ['jul/tack-grisen', 'Tack, grisen!', 4.0]], ljud: [['tass', 2.6, 1, 1.6], ['tass', 3.8, 2, 1.6], ['tass', 5.0, 3, 1.6]] }],
  ],
});
</script>
