<!doctype html>
<meta charset="utf-8">
<title>Sov gott – kaninen sover</title>
<style>html,body{margin:0;height:100%;background:#000}svg{width:100vw;height:100vh;display:block}</style>
<body>
<script>
// Sov gott med Lilla Kritan: kaninen sover i sängen. 3 min som går runt utan skarv (allt rör sig i perioder som delar LOOP),
// loopas sedan till 1 h med ffmpeg. Bilden: assets/bakgrunder/sovrummet/sovrummet-kanin.png = tagning B (OpenArt, Nano Banana 2.1)
// beskuren till 2202×1238. Kaninens huvud och tass är urklippta ur bilden (kanin-huvud.png, kanin-tass.png) och ligger på
// sovrummet-tom-kudde.png, där OpenArt har målat kudden och väggen bakom dem, så att de kan röra sig.
// Lager: himlen med månen och snön -> rummet (tom kudde, hål i glaset) -> täckets kulle i remsor (andetaget) -> huvudet med
// ögonen i kod -> tassen -> noterna -> lampans sken, vinjett.
// Varje varv: andas hela tiden, tassen kryper till sig två gånger, och en gång vaknar kaninen lite, tittar på noterna,
// blinkar, somnar om och suckar.
// Förhandsvisning: python3 -m http.server 8765 i repots rot, http://127.0.0.1:8765/produktion/youtube/sov-gott/kaninen-sover/
// Rendering: node avsnitt/004-bussen-badar/scener/render.mjs produktion/youtube/sov-gott/kaninen-sover
const RUM = '/assets/bakgrunder/sovrummet/', W = 2202, H = 1238;
const LOOP = 180, ANDETAG = 5;                   // ett andetag var 5:e sekund
const KULLE = { x: 800, y: 660, w: 632, h: 425, botten: 1080, lyft: 0.022 };   // täcket över kroppen; höjs högst 2,2 % kring sängkanten
const HUVUD = { x: 270, y: 470, w: 570, h: 435, vrid: [770, 860] };   // vrider kring halsen, där huvudet går in under täcket
const TASS = { x: 700, y: 680, w: 140, h: 225, vrid: [752, 735] };    // vrider kring handleden uppe vid kinden
// ansiktet i kod (de inritade ögonen och munnen är bortretuscherade ur kanin-huvud.png): stängda ögon som bågar där bilden hade
// dem, öppna ögon med glans, munnen som ett litet w under nosen och en gäspning. Huvudet lutar -39°.
const OGON = [{ c: [683, 706], stangt: 'M664 713 Q690 728 701 687' }, { c: [571, 798], stangt: 'M551 804 Q578 818 588 779' }], LUTNING = -39;
const MUN = { c: [652, 788], le: 'M0 -10 L0 0 M-17 -2 Q-9 10 0 0 Q9 10 17 -2', gap: [654, 798] };   // munnen i huvudets lutning, c = där strecket möter bågarna
const LINJE = '#2f1c17';
const FONSTER = [610, 0, 620, 690];
const LAMPA = [1690, 650];
// händelser i varvet [start, längd] i sekunder
const TASSAR = [[35, 2.2], [128, 2.2]];
const VAKNAR = 72;   // vaknar 72–92 s

const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ss = (a, b, x) => { const k = clamp((x - a) / (b - a)); return k * k * (3 - 2 * k); };
const bump = (t, a, upp, kvar, ner) => ss(a, a + upp, t) * (1 - ss(a + upp + kvar, a + upp + kvar + ner, t));   // 0 -> 1 -> 0
let slump = 7; const rnd = () => (slump = (slump * 16807) % 2147483647) / 2147483647;
const SNO = Array.from({ length: 30 }, () => ({ x: FONSTER[0] + rnd() * FONSTER[2], y: rnd(), r: 4 + rnd() * 6,
  varv: 3 + Math.floor(rnd() * 3), vag: 6 + rnd() * 12, fas: rnd() * 6.28 }));   // varv = hur många gånger flingan faller per LOOP
const REMSOR = Array.from({ length: KULLE.w / 8 }, (_, i) => { const x = KULLE.x + i * 8 + 4;
  return { x: KULLE.x + i * 8, v: ss(800, 940, x) * (1 - 0.55 * ss(1080, 1430, x)) }; });
// noterna: stiger från lampan och tonas bort, 20 s per not, fem förskjutna
const NOTFORM = [
  `<ellipse rx="15" ry="11" transform="rotate(-20)"/><line x1="13" y1="-4" x2="13" y2="-62" stroke-width="7"/>`,
  `<ellipse rx="15" ry="11" transform="rotate(-20)"/><line x1="13" y1="-4" x2="13" y2="-62" stroke-width="7"/><path d="M13 -62 Q36 -50 30 -28" fill="none" stroke-width="7"/>`,
  `<ellipse rx="15" ry="11" transform="rotate(-20)"/><ellipse cx="44" cy="-8" rx="15" ry="11" transform="rotate(-20 44 -8)"/><line x1="13" y1="-4" x2="13" y2="-62" stroke-width="7"/><line x1="57" y1="-12" x2="57" y2="-70" stroke-width="7"/><line x1="13" y1="-62" x2="57" y2="-70" stroke-width="11"/>`];
const NOTER = [0, 1, 2, 0, 1].map((form, i) => ({ form, s: 0.9 + 0.25 * ((i * 7) % 3) / 2, vrid: [-8, 6, -4, 10, -10][i],
  x0: [1600, 1720, 1650, 1780, 1690][i], drift: [180, 90, 250, 60, 160][i], fas: i / 5 }));
const PERIOD = 20, NOT_Y = [560, 110];

document.body.insertAdjacentHTML('beforeend', `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice">
  <defs>
    ${REMSOR.map((r, i) => `<clipPath id="r${i}"><rect x="${r.x}" y="0" width="8.6" height="${H}"/></clipPath>`).join('')}
    <filter id="krita" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="5" xChannelSelector="R" yChannelSelector="G"/></filter>
    <radialGradient id="sken"><stop offset="0" stop-color="#ffcf7a" stop-opacity="0.32"/><stop offset="0.5" stop-color="#ffcf7a" stop-opacity="0.1"/><stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/></radialGradient>
    <radialGradient id="vinjett" cx="0.5" cy="0.55" r="0.75"><stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.14"/></radialGradient>
  </defs>
  <rect x="${FONSTER[0]}" y="${FONSTER[1]}" width="${FONSTER[2]}" height="${FONSTER[3]}" fill="#18203c"/>
  <image href="/assets/bakgrunder/appeltradet-natt/mane.png" x="1030" y="80" width="120" height="130" opacity="0.92"/>
  <g id="sno" fill="#e9e6df" opacity="0.85">${SNO.map((f, i) => `<circle id="f${i}" r="${f.r}"/>`).join('')}</g>
  <image href="${RUM}sovrummet-tom-kudde-utan-glas.png" width="${W}" height="${H}"/>
  ${REMSOR.map((r, i) => `<g clip-path="url(#r${i})"><image id="k${i}" href="${RUM}tacke-kulle.png" x="${KULLE.x}" y="${KULLE.y}" width="${KULLE.w}" height="${KULLE.h}"/></g>`).join('')}
  <image href="${RUM}kanin-led.png" x="715" y="700" width="85" height="100"/>
  <g id="huvud">
    <image href="${RUM}kanin-huvud.png" x="${HUVUD.x}" y="${HUVUD.y}" width="${HUVUD.w}" height="${HUVUD.h}"/>
    <g fill="none" stroke="${LINJE}" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
      ${OGON.map((o, i) => `<path id="stangt${i}" d="${o.stangt}"/>`).join('')}
      <path id="le" d="${MUN.le}" stroke-width="6" transform="translate(${MUN.c[0]} ${MUN.c[1]}) rotate(${LUTNING})"/></g>
    <g transform="translate(${MUN.gap[0]} ${MUN.gap[1]}) rotate(${LUTNING})"><ellipse id="gap" rx="9" ry="12" fill="#7a2a1c" stroke="${LINJE}" stroke-width="4" opacity="0"/></g>
    ${OGON.map((o, i) => `<g id="oga${i}" opacity="0" transform="translate(${o.c[0]} ${o.c[1]}) rotate(${LUTNING})"><g id="titt${i}"><g id="lock${i}">
      <ellipse rx="10" ry="13" fill="${LINJE}"/><circle cx="-3" cy="-5" r="3.6" fill="#fff"/></g></g></g>`).join('')}
  </g>
  <image id="tass" href="${RUM}kanin-tass.png" x="${TASS.x}" y="${TASS.y}" width="${TASS.w}" height="${TASS.h}"/>
  <g fill="#efe2c4" stroke="#efe2c4" stroke-linecap="round" filter="url(#krita)">${NOTER.map((n, i) => `<g id="n${i}" opacity="0"><g transform="scale(${n.s}) rotate(${n.vrid})">${NOTFORM[n.form]}</g></g>`).join('')}</g>
  <ellipse id="sken" cx="${LAMPA[0]}" cy="${LAMPA[1]}" rx="360" ry="320" fill="url(#sken)" style="mix-blend-mode:screen"/>
  <rect width="${W}" height="${H}" fill="url(#vinjett)"/>
</svg>`);

const seek = t => {
  t = ((t % LOOP) + LOOP) % LOOP;
  const v = t - VAKNAR;
  // andas: jämnt, och en djup suck när hon har somnat om (v 16–21)
  const suck = bump(v, 15.5, 2.2, 0.4, 2.6);
  const a = (1 - Math.cos(2 * Math.PI * t / ANDETAG)) / 2 * (1 - suck) + suck * 1.9;
  REMSOR.forEach((r, i) => { const s = 1 + KULLE.lyft * a * r.v;
    $('k' + i).setAttribute('transform', `translate(0 ${KULLE.botten}) scale(1 ${s.toFixed(5)}) translate(0 ${-KULLE.botten})`); });
  // vaknar: huvudet lyfts lite (v 0–2), ögonen öppnas sömnigt (v 1–2,2), tittar mot noterna (v 3–4), blinkar (v 5,6 och 8,2),
  // ögonen sluts långsamt (v 9,5–11,5), huvudet sjunker tillbaka (v 10–13)
  const lyft = bump(v, 0, 2, 8, 3.2);
  $('huvud').setAttribute('transform', `rotate(${(5 * lyft + 0.6 * a * (1 - lyft)).toFixed(3)} ${HUVUD.vrid[0]} ${HUVUD.vrid[1]}) translate(0 ${(-4 * lyft).toFixed(2)})`);
  // ögonen: 0 = sover (bågarna), öppnas sömnigt v 1–2,2, tittar mot noterna v 3–7, blinkar v 5,6, gäspar v 8,6–10,4 med
  // ögonen hårt stängda, och sedan är de stängda igen
  const blink = k => 1 - bump(v, k, 0.09, 0.05, 0.12);
  const gap = bump(v, 8.6, 0.7, 0.5, 0.6);
  const oppen = (0.75 * ss(1, 2.2, v) + 0.15 * ss(3, 3.6, v)) * (1 - ss(8.2, 8.6, v)) * blink(5.6);
  const titta = ss(3, 4, v) * (1 - ss(7, 8.2, v));
  const visa = ss(0.12, 0.3, oppen);
  OGON.forEach((_, i) => {
    $('stangt' + i).setAttribute('opacity', (1 - visa).toFixed(3));
    $('oga' + i).setAttribute('opacity', visa.toFixed(3));
    $('lock' + i).setAttribute('transform', `scale(1 ${Math.max(0.1, oppen).toFixed(3)})`);
    $('titt' + i).setAttribute('transform', `translate(${(4 * titta).toFixed(2)} ${(-2 * titta).toFixed(2)})`);
  });
  $('le').setAttribute('opacity', (1 - ss(0, 0.4, gap)).toFixed(3));
  $('gap').setAttribute('opacity', ss(0, 0.3, gap).toFixed(3));
  $('gap').setAttribute('transform', `scale(${(0.7 + 0.3 * gap).toFixed(3)} ${(0.3 + 0.7 * gap).toFixed(3)})`);
  // tassen kryper till sig: vrids lite, glider in och tillbaka
  const ts = TASSAR.reduce((m, [s, l]) => Math.max(m, bump(t, s, l * 0.4, l * 0.2, l * 0.4)), 0) + 0.6 * lyft;
  $('tass').setAttribute('transform', `rotate(${(-7 * ts).toFixed(3)} ${TASS.vrid[0]} ${TASS.vrid[1]}) translate(${(-5 * ts).toFixed(2)} ${(-3 * ts).toFixed(2)})`);
  SNO.forEach((f, i) => {
    const k = (f.y + f.varv * t / LOOP) % 1, y = FONSTER[1] - 20 + k * (FONSTER[3] + 40);
    const x = f.x + f.vag * Math.sin(2 * Math.PI * 9 * t / LOOP + f.fas);
    $('f' + i).setAttribute('cx', x.toFixed(1)); $('f' + i).setAttribute('cy', y.toFixed(1));
  });
  NOTER.forEach((n, i) => {
    const k = (t / PERIOD + n.fas) % 1, y = NOT_Y[0] + (NOT_Y[1] - NOT_Y[0]) * k;
    const x = n.x0 + n.drift * k + 22 * Math.sin(2 * Math.PI * (2 * k + n.fas));
    const g = $('n' + i); g.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(6 * Math.sin(2 * Math.PI * (k + n.fas))).toFixed(2)})`);
    g.setAttribute('opacity', (0.6 * ss(0, 0.15, k) * (1 - ss(0.65, 1, k))).toFixed(3));
  });
  $('sken').setAttribute('opacity', (0.85 + 0.15 * Math.sin(2 * Math.PI * t / 20)).toFixed(3));
};
window.DURATION = LOOP; window.seek = seek;
Promise.all([...document.querySelectorAll('image')].map(i => new Promise(r => {
  const im = new Image(); im.onload = im.onerror = r; im.src = i.getAttribute('href'); }))).then(() => { seek(0); window.ready = true; });
if (!navigator.webdriver) { const s = performance.now(); const f = () => { seek((performance.now() - s) / 1000); requestAnimationFrame(f); }; requestAnimationFrame(f); }
</script>
