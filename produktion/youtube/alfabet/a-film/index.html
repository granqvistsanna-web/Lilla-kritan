// ---------- Rörelserna (en figur, en bit): (tl = sekunder in i biten, o, R = riggen) → { f, p, x, vila } ----------
const P = (R, bas = 'neutral', extra = {}) => ({ ...R.blandaPose('neutral', bas, 1), ...extra });
const MOT = {
  stilla: (tl, o, R) => ({ f: o.u || 'glad', p: P(R, o.pose, o.p), vila: true }),
  svans: (tl, o, R) => ({ f: 'nyfiken', p: P(R, 'vanster', { svans: 25 * Math.sin(tl * 6) }) }),   // står utanför bild, svansen vickar in
  skutt: (tl, o, R) => { const u = kl(tl / o.d), n = o.n, i = Math.min(n - 1, Math.floor(u * n)), k = u * n - i;   // n hopp lika långa
    const luft = u < 1 ? Math.sin(Math.PI * k) : 0;
    return { f: R.blanda('glad', 'jatteglad', luft), x: lerp(o.fran, o.x, (i + mjuk(k)) / n), p: P(R, 'hoger', { lyft: -150 * luft, strack: 0.06 * luft, armar: [30 * luft, 30 * luft] }) }; },
  ga: (tl, o, R) => { const u = kl(tl / o.d), s = Math.sin(tl * Math.PI / 0.28) * (u < 1 ? 1 : 0);   // lugna små steg
    return { f: 'glad', x: lerp(o.fran, o.x, mjuk(u)), p: P(R, o.x > o.fran ? 'hoger' : 'vanster', { lyft: -14 * Math.abs(s), luta: 3 * s, ben: [12 * s, -12 * s] }) }; },
  vagga: (tl, o, R) => { const u = kl(tl / o.d), s = Math.sin(tl * Math.PI / 0.3) * (u < 1 ? 1 : 0);   // alpackan trippar in med små steg
    return { f: 'glad', x: lerp(o.fran, o.x, mjuk(u)), p: P(R, 'vanster', { lyft: -12 * Math.abs(s), luta: 2.5 * s, ben: [12 * s, -12 * s] }) }; },
  hopp: (tl, o, R) => { const [f, p] = R.ROR.hoppa(Math.min(tl, 1.68)); return { f: o.u || f, p }; },
  peka: (tl, o, R) => { const n = o.ivrig ? 0.25 * Math.sin(tl * 2 * Math.PI / 0.55) : 0, h = o.hopp != null ? bage(kl((tl - o.hopp) / 0.5)) : 0;
    return { f: o.u || 'glad', p: P(R, 'hoger', { armar: [0, 72], upp: 0.5 + n, lyft: -60 * h }) }; },
  magen: (tl, o, R) => ({ f: o.u || 'tanker', p: P(R, 'magen', { klapp: 40 + 14 * Math.sin(tl * 2 * Math.PI / 0.5) }) }),
  nar: (tl, o, R) => ({ f: o.u, p: P(R, 'nar') }),
  // armarna stannar ovanför riggens gömzon (GOM 26–80°), annars blinkar de bakom kroppen (Sanna 2026-11-16, prov 3 0:57)
  sving: (tl, o, R) => { const s = Math.sin(tl * 2 * Math.PI / 1.1), in_ = mjuk(kl(tl / 0.35)); return { f: 'jatteglad', p: P(R, 'neutral', { armar: [lerp(16, 102 + 14 * s, in_), lerp(16, 102 - 14 * s, in_)], luta: 2 * s }) }; },
  vinka: (tl, o, R) => ({ f: o.u || 'glad', p: P(R, 'hurra', { armar: [0, 104 + 12 * Math.sin(tl * 2 * Math.PI / 0.7)] }) }),
  mums: (tl, o, R) => ({ f: tl < 0.4 ? 'glad' : 'mums', p: P(R, o.pose || 'hoger', { luta: 5, strack: 0.025 * Math.sin(tl * 2 * Math.PI / 0.33) * (tl > 0.4) }) }),
  luktar: (tl, o, R) => ({ f: 'nyfiken', p: P(R, 'hoger', { luta: 6 + Math.sin(tl * 7), upp: 0.2 }) }),
  // Aaa … aaa … atjo! (a29: a:na vid 0,04 och 1,7, atjo vid 3,15): drar in luft två gånger, sedan ett ryck framåt
  nys: (tl, o, R) => { const t = tl - o.vid, in1 = mjuk(kl((t - 0.1) / 0.8)) * (1 - mjuk(kl((t - 1.2) / 0.4))), in2 = mjuk(kl((t - 1.75) / 1.2)), at = kl((t - 3.15) / 0.12), ut = mjuk(kl((t - 3.5) / 0.8));
    const inn = Math.max(0.6 * in1, in2) * (1 - at), ryck = at * (1 - ut);
    return { f: ryck > 0.1 ? 'skrattar' : inn > 0.1 ? 'forvanad' : 'glad',
      p: P(R, 'neutral', { upp: 0.9 * inn - 0.4 * ryck, strack: 0.05 * inn - 0.07 * ryck, luta: 8 * ryck, armar: [10 * ryck, 10 * ryck] }) }; },
  lyssna: (tl, o, R) => ({ f: 'nyfiken', p: P(R, 'lyssnar', { oron: [-12, -12], luta: 2 + Math.sin(tl * 1.3) }) }),
  fniss: (tl, o, R) => ({ f: 'fnissig', p: P(R, 'neutral', { strack: 0.015 * Math.sin(tl * 2 * Math.PI / 0.22) * (tl < 1.4) }) }),
  nicka: (tl, o, R) => { const [f, p] = R.nicka(R.param('glad'), P(R), Math.min(tl, 1.6)); return { f, p }; },
};
// En figurs bitar [t, rörelse, o] → { f, p, x }. Varje bit blandas in från den förra på 0,35 s; x följer med från biten före.
function figurLage(lista, t, R, hem) {
  let x = hem; const ut = lista.map(([t0, m, o]) => { const xx = o.x ?? x; x = o.x ?? x; return [t0, m, { ...o, x: xx }]; });
  let i = ut.findLastIndex(b => b[0] <= t); if (i < 0) i = 0;
