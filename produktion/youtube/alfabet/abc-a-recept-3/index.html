// Förhandsvisning: python3 -m http.server 8765 i repots rot, http://127.0.0.1:8765/produktion/youtube/alfabet/abc-a-recept-3/
// Förhandsvisning som film: node avsnitt/020-grisen-badar/scener/render.mjs produktion/youtube/alfabet/abc-a-recept-3 --snabb
(async () => {

const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; };

// ---------- teckningarna, i egna koordinater kring (0, 0), ca 500 höga ----------
// Ordningen är gissningen: först det som kan vara mycket, sist det som avslöjar (fragaFore = frågan kommer före det strecket).
// ogon [x, y, r] och kinder [x, y] ritas i kod på bilden, i teckningens mått (ingen mun), och ögonen blinkar (Sanna 2026-11-18).
// bild: [fil, bredd, höjd, höjd i teckningens mått, nederkant] – urklippet teckningen blir på svaret (ankaret i nederkantens mitt).
// ram: [dx, dy, skala] för teckningar i andra koordinater (bilen är Gissa teckningens kotte).

// kon är vit och får en ljusgrön platta, annars syns den dåligt).
const BEIGE = '#EBCB9F', MORKORANGE = '#D96A1C';
// ett ägg: smalare upptill, bredast en bit under mitten (topp, halva bredden, höjden under toppen)
const agg = (cx, top, rx, h) => { const b = top + h * 2.1; return `M${cx} ${top} C${cx + rx * .52} ${top} ${cx + rx} ${top + h * .45} ${cx + rx} ${top + h * 1.2} C${cx + rx} ${b - h * .35} ${cx + rx * .6} ${b} ${cx} ${b} C${cx - rx * .6} ${b} ${cx - rx} ${b - h * .35} ${cx - rx} ${top + h * 1.2} C${cx - rx} ${top + h * .45} ${cx - rx * .52} ${top} ${cx + 4} ${top - 1}`; };
// en path ur ett urklipps kontur (bildens pixlar) i teckningens mått, som bild: [fil, bredd, höjd, höjd i teckningens mått, nederkant]
const iTeckning = (d, w, h, H, botten) => { const q = H / h; let i = 0;
  return d.replace(/-?\d+(\.\d+)?/g, v => (i++ % 2 ? botten - H + v * q : (v - w / 2) * q).toFixed(1)); };

const passa = (f, w, h, y0, y1, H) => [f, w, h, h * H / (y1 - y0), 250 + h * H / (y1 - y0) - y1 * H / (y1 - y0)];
const APELSIN = ['apelsin/cut/apelsin', 726, 771, 410, 238];   // som i recept 1 (abc-a/), med ögon, kinder och mun i kod
const ANANAS = ['ananas/cut/ananas-kropp', 512, 939, 520, 250];   // kroppen; kronan är en egen bild som svajar (abc-a/)

const ifyllt = (cx, cy, r, sy) => spiral(cx, cy, r, 3).replace(/(-?[\d.]+) (-?[\d.]+)/g, (m, x, y) => `${x} ${(cy + (y - cy) * sy).toFixed(1)}`);   // en fylld oval fläck

    streck: [['kontur', await kontur('rekvisita/ananas/cut/ananas', ...ANANAS.slice(1)), '#A8741C', 15, 6.5]] },

      ['hjul-f', iTeckning(ell(744, 726, 104, 104), ...BIL.slice(1)), '#3B3431', 13, 0.9]] },

// ---------- scenen ----------
document.head.insertAdjacentHTML('beforeend', `<style>

const GOLV = 750;   // golvets kant mot väggen (papperet); golvet är de nedersta 330 px
document.body.innerHTML = `<div id="scen"><svg id="botten" viewBox="0 0 1920 1080" xmlns="${NS}"><defs>${DEFS}

const defs = document.querySelector('defs'), sakerG = document.getElementById('saker'), kritaG = document.getElementById('krita');
const ladda = f => new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = '/' + f; });

for (const [namn, s] of Object.entries(SAKER)) {
  s.namn = namn;
  s.o = el('g', {}, sakerG);   // läge, skala, lutning och hopp
  s.g = el('g', { filter: 'url(#boil)' }, s.o);   // teckningen
  const [rx, ry, rs] = s.ram ?? [0, 0, 1];
  const vax = el('g', { filter: 'url(#vax)', transform: `scale(${rs}) translate(${rx} ${ry})` }, s.g), klipp = {};
  for (const id of new Set(s.streck.map(x => x[5]).filter(Boolean))) {
    el('path', { d: s.streck.find(x => x[0] === id)[1] }, el('clipPath', { id: `k-${namn}-${id}` }, defs));
    klipp[id] = el('g', { 'clip-path': `url(#k-${namn}-${id})` }, vax);
  }

  for (const id in klipp) vax.appendChild(s.drag[id]);   // konturerna ovanpå sina fyllnader
  const kg = kant.lagg(el('g', {}, s.o), { andel: 0.02 }); kg.appendChild(s.g); s.kg = kg; s.KANT = kg.getAttribute('filter'); kg.removeAttribute('filter');
  // Markskuggan (ABC-b3, feedback 2026-11-21): ligger på golvet i scenens px, inte i saken, så att den stannar på golvet när
  // saken hoppar eller svävar och bara krymper och ljusnar. En mjuk, bred skugga och en mörkare kontaktskugga, gradienter utan filter.
  s.mark = [el('ellipse', { fill: 'url(#sakskugga-g)', opacity: 0 }, document.getElementById('sakskuggor')),
    el('ellipse', { fill: 'url(#sakkarna-g)', opacity: 0 }, document.getElementById('sakskuggor'))];
  s.b = el('g', { opacity: 0 }, s.o);
  s.fyll = el('circle', { r: 0, fill: '#fff', filter: 'url(#boil)' }, el('mask', { id: `fyll-${namn}`, maskUnits: 'userSpaceOnUse', x: -700, y: -700, width: 1400, height: 1400 }, defs));   // bilden fylls i inifrån på svaret   // bilden som teckningen blir (urklippet har sin vita kant inbakad)
  s.liv = el('g', {}, s.b);
  if (s.bild) { const [f, w, h, H, botten] = s.bild, q = H / h; const tr = `translate(${-w * q / 2} ${botten - H}) scale(${q})`;
    if (s.krona) s.kronaEl = await bildEl(s.krona[0], w, h, '', el('g', { transform: tr }, s.liv));
    s.delEl = [];   // ekorrens delar bakom kroppen, var och en vriden kring sin led i levande()
    const delEl = async ([d, px, py, typ]) => s.delEl.push([typ, await bildEl(f.replace(/body$/, d), w, h, '', el('g', { transform: tr }, s.liv)), px, py]);

      for (const [hf, hx, hy, hr] of s.hjul) s.hjulEl.push([await bildEl(hf, w, h, '', el('g', { transform: tr }, s.liv)), hx, hy, hr]); }

}
// apan blir riggen: fötterna på teckningens mark
for (const s of Object.values(SAKER)) if (s.rigg) {   // riggarna (elefanten, katten, hunden): fötterna på teckningens mark
