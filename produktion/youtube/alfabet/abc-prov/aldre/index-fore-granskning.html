};

    const [f, bx, by, bs] = s.bildRam, g = el('g', { transform: `scale(${rs}) translate(${rx} ${ry}) translate(${bx} ${by}) scale(${bs})` }, s.liv);
    await bildEl(f, 1024, 1024, '', g);   // kroppen först, hjulen ovanpå (som i Gissa teckningen)
    s.hjulEl = [];
    for (const [hf, hx, hy] of s.hjul ?? []) s.hjulEl.push([await bildEl(hf, 1024, 1024, '', g), hx, hy]);
  }
  s.kf = []; s.hopp = []; s.T = {}; s.levande = []; s.fram = [];

const K = await bokstavsklossar(document.getElementById('klossar'), [{ fram: 'A', farg: A_ROD, drag: A_DRAG, rund: 0.12 }]);

// ---------- tidslinjen: repliker efter sina riktiga längder ----------
const TAL = { 'a01-t1-lang': 'Lyssna! Aaaa.', 'a03-t1': 'Vem är det?', 'a04-t1-lang': 'Aaapa!', 'a05-t1': 'En apa!', 'a06-t1': 'Säg du: apa!',

const D = Object.fromEntries(await Promise.all(Object.keys(TAL).map(async n => [n, await langd(fil(n), 1.5)])));
const LJUD = [], sag = (t, n) => (LJUD.push({ t, fil: fil(n), vol: 2.5, tal: TAL[n] }), t + D[n]);
const fx = (t, n, vol = 0.8, mer = {}) => LJUD.push({ t, fil: effekt(n), vol, ...mer });
const TEMPO = 0.8, MELLAN = 0.12, PAUS = 4, MITT = [960, 560, 1.25];
const { apa, apelsin, ananas, bil, rutnat } = SAKER;
const A = { kf: [], hopp: [] };   // A-klossen: [t, x, y, sidan i px] i skärmen
const PLATS = [[425, 190], [655, 190], [885, 190]], PSK = 0.34;   // raden bredvid A-klossen i hörnet
const RUTA = [[760, 410], [1160, 410], [760, 750], [1160, 750]], RSK = 0.4;   // rutnätets fyra rutor (mitten 960, 580)

const lageKf = (s, t) => { const kf = s.kf, i = kf.findIndex(k => k[0] > t); return (i === -1 ? kf.at(-1) : kf[Math.max(0, i - 1)]).slice(1); };

  s.kf.push([0, ...lage]); s.syns = t - 0.1;
  const tempo = s.tempo ?? TEMPO;
  for (const x of s.streck) { s.T[x[0]] = [t, t + x[4] * tempo]; t += x[4] * tempo + MELLAN; }
  return t - MELLAN;
};

// 1. Bokstaven: klossen faller ner (duns), kritan ritar A:et på den medan Malin säger "Lyssna! Aaaa."
const FALL = 0.5; A.kf.push([0, 960, 520, 380]); fx(FALL + 0.45, 'duns', 1.2);
A.rita = [1.3, 3.9];
for (let i = 0; i < 3; i++) fx(1.3 + i * 0.87, 'skrrrrt-lang', 4, { loop: true, langd: 0.8, fade: 0.1 });
const s1 = sag(1.3, 'a01-t1-lang');
A.svar = Math.max(A.rita[1], s1) + 0.4; fx(A.svar, 'pling', 0.5); A.hopp.push(A.svar + 0.1);
let t = flytta(A, A.svar + 1.3, 180, 190, 200, 1.0); fx(t - 1.0, 'swoosh', 0.6);

// 2–4. Tre gissningar: teckningen blir bilden på svaret, blir levande och sedan ett klistermärke i raden
function gissning(s, plats, levande, extra) {
  const klar = ritaSak(s, t + 0.6);
  const fraga = Math.max(s.T[s.fragaFore][0] - 0.2, t + 1.5), tyst = Math.max(klar, sag(fraga, s.fraga)) + 0.3;

  let u = sag(s.svar, s.lang); A.hopp.push(s.svar + 0.2);
  s.levande.push([s.svar + 0.4, levande]);
  u = sag(u + 0.5, s.kort);
  u = extra ? extra(u) : u;
  t = flytta(s, u + 0.6, ...PLATS[plats], PSK); fx(t - 0.9, 'klistra', 0.8);
}
gissning(apa, 0, 'hoppa', u => { const v = sag(u + 0.5, 'a06-t1'); apa.levande.push([u + 0.5, 'vinka', v + 2.3]); u = v + 2.5;
  A.hopp.push(u + 0.9); fx(u + 0.1, 'jippi', 0.6); apa.levande.push([u + 0.1, 'hoppa']); return sag(u, 'a07-t1'); });
fx(apa.svar + 0.5, 'hopp-mjuk', 0.8);
gissning(apelsin, 1, 'studsa'); fx(apelsin.svar + 0.75, 'studs', 0.7); fx(apelsin.svar + 1.25, 'studs', 0.5);

[apa, apelsin, ananas].forEach((s, i) => { const t0 = klar + 0.3 + i * 0.45; flytta(s, t0, ...RUTA[i], RSK); fx(t0, 'swoosh', 0.4); });

// en ruta i taget: saken växer lite och hoppar medan Malin säger ordet; klossen hoppar bara på a-orden
for (const [s, ord] of [[apa, 'a04-t1-lang'], [apelsin, 'a19-t1-lang'], [ananas, 'a26-t1-lang'], [bil, 'p-bil']]) {
  s.fram.push([u - 0.2, u + D[ord] + 0.3]); s.hopp.push(u);
  if (s !== bil) A.hopp.push(u + 0.15);
  u = sag(u, ord) + 0.9;
}
u = sag(u, 'p-vilken') + PAUS;   // gissningspausen
fx(u, 'pling', 0.6); bil.fram.push([u - 0.1, u + 2.2]); bil.hopp.push(u + 0.05);
u = sag(u, 'p-bilen') + 0.4;
u = sag(u, 'p-inte') + 0.2;
fx(u, 'tuta-tut', 1.2); bil.hopp.push(u);
bil.kf.push([u + 0.8, ...RUTA[3], RSK], [u + 2.6, 2300, RUTA[3][1], RSK]); fx(u + 0.8, 'brum', 1.0, { loop: true, langd: 1.8, fade: 0.6 });
t = u + 2.6;

// 6. Alla tillsammans: klossen i mitten, sakerna i rad under och hoppar på sina ord
rutnat.ut = [t, t + 0.8];
flytta(A, t, 960, 330, 300, 1.0); flytta(apa, t, 560, 790, 0.6, 1.0); flytta(apelsin, t, 960, 800, 0.6, 1.0); flytta(ananas, t, 1360, 790, 0.6, 1.0);
fx(t, 'swoosh', 0.6); t += 1.6;
for (const s of [apa, apelsin, ananas]) { s.hopp.push(t + 0.1); fx(t + 0.1, 'pling', 0.4); t = sag(t, s.lang) + 0.5; }
A.hopp.push(t + 0.2, t + D['a40-t1-lang'] - 1.0);
t = sag(t, 'a40-t1-lang') + 0.5;
for (const s of [A, apa, apelsin, ananas]) s.hopp.push(t + 0.1);
apa.levande.push([t, 'vinka', t + D['a41-t1'] + 1.2]);
t = sag(t, 'a41-t1');
const UT = [t + 0.6, t + 1.6], DURATION = UT[1] + 0.5;
LJUD.unshift({ t: 0, fil: 'assets/ljud/musik/gissa-bad.m4a', vol: 0.5, loop: true, langd: DURATION, fade: 1.0 });
const STRECK = [];   // alla streck i tidsordning, för kritan
for (const s of Object.values(SAKER)) for (const x of s.streck) STRECK.push([s, x[0], ...s.T[x[0]], x[2]]);
STRECK.sort((a, b) => a[2] - b[2]);
for (const [, , a, b] of STRECK) fx(a, 'skrrrrt-lang', 4, { loop: true, langd: b - a, fade: 0.1 });

// ---------- en bildruta ----------
const lage = (s, t) => {   // [x, y, skala] ur nyckelrutorna, lugnt in och ut mellan dem
  const kf = s.kf, i = kf.findIndex(k => k[0] > t);
  if (i === -1) return kf.at(-1).slice(1);
  if (i === 0) return kf[0].slice(1);
  const a = kf[i - 1], b = kf[i], k = inUt(del([a[0], b[0]], t));
  return [lerp(a[1], b[1], k), lerp(a[2], b[2], k), lerp(a[3], b[3], k)];
};
const VILA = [1530, 640];
function kritan(t) {
  const nu = STRECK.find(([, , a, b]) => t >= a && t < b);
  const pa = ([s, id], k) => { const [x, y, sk] = lage(s, t), [lx, ly] = s.drag[id].spets(k), [rx, ry, rs] = s.ram ?? [0, 0, 1];
    return [x + sk * rs * (lx + rx), y + sk * rs * (ly + ry)]; };
  if (nu) { const p = pa(nu, inUt(del([nu[2], nu[3]], t))); return [p[0], p[1] + Math.sin(t * 107) * 1.2, nu[4]]; }
  const fore = STRECK.filter(x => x[3] <= t).at(-1), efter = STRECK.find(x => x[2] > t);
  const vila = [VILA[0], VILA[1] + Math.sin(t * 3.7) * 8];
  if (fore && efter && efter[2] - fore[3] < 1) {   // lyfter till nästa streck
    const q = pa(fore, 1), r = pa(efter, 0), k = inUt(del([fore[3], efter[2]], t));
    return [lerp(q[0], r[0], k), lerp(q[1], r[1], k) - 50 * Math.sin(Math.PI * k), efter[4]];
  }
  if (efter && t > efter[2] - 0.7) { const r = pa(efter, 0), k = inUt(del([efter[2] - 0.7, efter[2]], t)); return [lerp(vila[0], r[0], k), lerp(vila[1], r[1], k), efter[4]]; }
  if (fore && t < fore[3] + 0.8) { const q = pa(fore, 1), k = inUt(del([fore[3], fore[3] + 0.8], t)); return [lerp(q[0], vila[0], k), lerp(q[1], vila[1], k), fore[4]]; }
  return [...vila, fore?.[4] ?? F.svart];
}
// A-klossens krita (klossar.js, den röda kritbilden): en punkt på klossens framsida medan A:et ritas, in från höger uppifrån
const klossKrita = t => skarm => {
  const [a, b] = A.rita; if (t < a - 0.6 || t > b + 0.6) return null;
  const k = clamp((t - a) / (b - a)), i = Math.min(2, Math.floor(k * 3)), u = k * 3 - i, [p, q] = A_DRAG[i], m = K.TRAV / K.PX;
  const [x, y] = skarm(0, m * lerp(p[0], q[0], u), -m * lerp(p[1], q[1], u)), in_ = inUt(clamp((t - a + 0.6) / 0.5)) * inUt(clamp((b + 0.6 - t) / 0.5));
  return { syns: true, x: lerp(2200, x, in_), y: lerp(-300, y, in_) };
};
// livet: apan (riggen) hoppar och vinkar; apelsinen studsar två gånger; ananasen vickar på bladen
function levande(s, t) {
  if (s === apa) {
    let f = RA.param('glad'), p = P();
    [f, p] = RA.vila(f, p, t);
    for (const [t0, typ, t1] of s.levande) {
      if (typ === 'hoppa' && t >= t0 && t < t0 + 1.68) [f, p] = RA.ROR.hoppa(t - t0);
      if (typ === 'vinka' && t >= t0 && t < t1 + 0.35) {
        const k = inUt(clamp((t - t0) / 0.35)) * inUt(clamp((t1 + 0.35 - t) / 0.35));
        p = RA.blandaPose(p, P('hurra', { armar: [0, 104 + 12 * Math.sin((t - t0) * 2 * Math.PI / 0.7)] }), k);
        f = RA.blanda(f, RA.param('jatteglad'), k);
      }
    }
    if (typeof f === 'string') f = RA.param(f);
    RA.rita(apaFig, RA.blinka(f, t), p);
    return;
  }
  if (s.hjulEl) {   // bilen: hjulen rullar med sträckan när den kör
    const [x, , sk] = lage(s, t), r = 106 * 0.8 * 0.62 * sk, a = (x - RUTA[3][0]) / r * 180 / Math.PI;
    for (const [im, hx, hy] of s.hjulEl) im.setAttribute('transform', `rotate(${a.toFixed(1)} ${hx} ${hy})`);
  }
  const bit = s.levande.filter(([t0]) => t0 <= t).at(-1);
  if (!bit) return s.liv.setAttribute('transform', '');
  const [t0, typ] = bit, d = t - t0;
  if (typ === 'studsa') {   // två studsar, tryck ihop vid landningen
    const h = 90 * bage(d / 0.5) + 45 * bage((d - 0.5) / 0.4), tr = 0.12 * bage((d - 0.45) / 0.15) + 0.07 * bage((d - 0.88) / 0.14);
    s.liv.setAttribute('transform', `translate(0 ${(-h).toFixed(1)}) translate(0 250) scale(${(1 + tr * 0.7).toFixed(3)} ${(1 - tr).toFixed(3)}) translate(0 -250)`);
  } else if (typ === 'vicka') {   // vickar kring botten, lugnar sig
    const v = 7 * Math.sin(d * 2 * Math.PI / 0.6) * (1 - clamp(d / 1.8));
    s.liv.setAttribute('transform', `rotate(${v.toFixed(2)} 0 250)`);
  }
}
const aGung = t => A.hopp.reduce((s, h) => { const d = t - h; return d < 0 || d > 1.2 ? s : s + 0.16 * Math.sin(d * 2 * Math.PI / 0.45) * (1 - d / 1.2); }, 0);
function rita(t) {
  for (const s of Object.values(SAKER)) {
    for (const [id] of s.streck) s.drag[id].rita(inUt(del(s.T[id], t)));
    const [x, y, sk] = lage(s, t), pop = s.svar !== undefined && t > s.svar ? 1 + 0.08 * Math.sin(Math.PI * clamp((t - s.svar) / 0.5)) : 1;
    const fram = s.fram.reduce((f, [a, b]) => f + 0.18 * inUt(clamp((t - a) / 0.3)) * inUt(clamp((b - t) / 0.3)), 0);   // rutan som Malin pratar om
    const hopp = s.hopp.reduce((h, h0) => h - 30 / sk * bage((t - h0) / 0.45), 0);
    const st = s.dekal ? clamp((1.0 - sk) / 0.3) : 0;   // klistermärke när den är liten (i raden och rutnätet)
    s.o.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${(sk * pop * (1 + fram)).toFixed(4)}) translate(0 ${hopp.toFixed(1)}) rotate(${((s.lut ?? 0) * st).toFixed(2)})`);
    s.o.style.display = t >= s.syns ? '' : 'none';
    s.o.style.opacity = s.ut ? 1 - del(s.ut, t) : 1;
    if (s.dekal) s.dekal.setAttribute('opacity', st.toFixed(3));
    const b = s.svar === undefined ? 0 : del([s.svar, s.svar + 0.35], t);   // på svaret tonar teckningen över i bilden, mitt i poppen
    s.svar !== undefined && t >= s.svar && b < 1 ? s.kg.setAttribute('filter', s.KANT) : s.kg.removeAttribute('filter');
    s.kg.style.opacity = 1 - b; s.b.setAttribute('opacity', b);
    if (b > 0) levande(s, t);
  }
  sakerG.style.opacity = 1 - del(UT, t);
  const [kx, ky, kf] = kritan(t), syns = t > A.rita[1] + 0.6 && t < STRECK.at(-1)[3] + 1.2;   // kritan går när allt är ritat
  kritaG.style.display = syns ? '' : 'none';
  kritaG.querySelector('.farg').setAttribute('fill', kf === F.svart ? '#3B3431' : kf);
  kritaG.firstChild.setAttribute('transform', `translate(${kx.toFixed(1)} ${ky.toFixed(1)}) rotate(38) scale(${(0.8 * clamp((t - A.rita[1] - 0.6) / 0.4)).toFixed(3)})`);
  for (const f of document.querySelectorAll('[id=boil-brus]')) f.setAttribute('seed', 1 + Math.floor(t * 8) % 4);
  kant.uppdatera();
  // A-klossen: faller, ritas, gungar på varje a, flyger till hörnet och sist till mitten; en mjuk skugga under
  const [ax, ay, as] = lage(A, t), fu = clamp((t - FALL) / 0.45), d = t - FALL - 0.45, tr = d > 0 && d < 0.22 ? 0.13 * Math.sin(Math.PI * d / 0.22) : 0;
  const hopp = A.hopp.reduce((h, h0) => h + 40 * bage((t - h0) / 0.45), 0), ky0 = fu < 1 ? lerp(-400, ay, fu * fu) : ay;
  K.rita({ klossar: [{ x: ax, y: ky0 - hopp + as * tr / 2, s: as, z: 0, rx: 0.24, ry: -0.18 + 0.08 * Math.sin(t * 2 * Math.PI / 7),
    rz: aGung(t), sy: 1 - tr, sx: 1 + tr * 0.6, syns: t >= FALL, k: clamp((t - A.rita[0]) / (A.rita[1] - A.rita[0])) }],
    krita: klossKrita(t), opacitet: 1 - del(UT, t) });
  const sk = document.getElementById('klosskugga'), luft = clamp(1 - (ay - ky0 + hopp) / 400);
  for (const [k, v] of Object.entries({ cx: ax, cy: ay + as * 0.62, rx: as * 0.62 * (0.8 + 0.2 * luft), ry: as * 0.09 })) sk.setAttribute(k, v.toFixed(1));
  sk.setAttribute('opacity', ((t >= FALL ? fu : 0) * luft * (1 - del(UT, t))).toFixed(3));
}

await Promise.all(LJUD.map(async c => { if (!(await fetch('/' + c.fil, { method: 'HEAD' }).catch(() => ({}))).ok) c.fil = null; }));
Object.assign(window, { LJUD: LJUD.filter(c => c.fil), DURATION, seek: rita, render: rita, ready: true });
rita(0);
if (render) return;

// ---------- förhandsvisningen ----------
document.body.insertAdjacentHTML('beforeend', `<div id="styr"><button id="spela">▶ Spela</button><button id="om">↺ Om</button> <span id="tid"></span></div>`);
const tala = text => { const u = new SpeechSynthesisUtterance(text); u.lang = 'sv-SE'; u.rate = 0.8; speechSynthesis.speak(u); };
const spela = c => {
  if (!c.fil) return c.tal && tala(c.tal);
  const a = new Audio('/' + c.fil); a.volume = Math.min(1, c.vol * 0.4); a.loop = !!c.loop; a.play();
  if (c.langd) setTimeout(() => a.pause(), c.langd * 1000);
};
let start = null, senast = 0;
const ruta = nu => {
  const tt = start === null ? senast : (nu - start) / 1000;
  if (start !== null) for (const c of LJUD) if (c.t > senast - 1e-6 && c.t <= tt) spela(c);
  senast = tt; rita(Math.min(tt, DURATION));
  document.getElementById('tid').textContent = `${tt.toFixed(1)} / ${DURATION.toFixed(1)} s`;
  requestAnimationFrame(ruta);
};
document.getElementById('spela').onclick = () => { start = performance.now() - senast * 1000; };
document.getElementById('om').onclick = () => { start = performance.now(); senast = -1e-3; };
window.hoppa = x => { senast = x; };
requestAnimationFrame(ruta);
})();
</script>
