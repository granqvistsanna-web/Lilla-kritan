<title>Tittut – björnen i julskogen (art direction v2)</title>

<!-- Tittut: björnen i julskogen (2026-11-13, plan: produktion/youtube/shorts/jul/plan-tittut-bjornen.md). Platsen och gömställena
     (julgranen, pakethögen och pepparkakshuset) delas med grisens tittut: bakgrunder/julskogen.md. Repliker i rost.txt här
     (Malin, tagning 2, roster/tittut/bjorn-julskog/). Björnens läten: brum-glad och brum-fniss (kopior ur brum-gullig). -->
<script src="../../scener/kit.js"></script><script src="../../../../../verktyg/kant.js"></script>
<script src="../../tittut.js"></script>
<script>
tittut({
  // v3 (format/tittut.md, Sanna 2026-11-28): kortare, ett lägesord per runda (bakom pepparkakshuset, under granen, i säcken),
  // snö på huvudet under granen, klipp till närbilder och en final mot kameran. Malins nya repliker: julskogen/tagning-v3.txt
  varv: 1, bortaVarje: true, svarVarje: true, enKik: true, klippKamera: true, final: true,
  kul: false, lugn: 0.7,          // granskning 2026-11-28: kortare hej och kortare promenader mellan rundorna
  snoHatt: { runda: 1, at: [490, 125, 1.3] },
  plats: 'julskogen',
  platsVol: 0,                    // Sanna 2026-11-19 (J06): "remove winter wind sound" (vinterljud-2 var 0,6)
  badd: 'assets/ljud/musik/jul/karol-joy-to-the-world.mp3', baddVol: 0.28,   // Sanna 2026-11-19 (J06): "lower winter soundtrack" 0,42 → 0,28;   // Sanna 2026-11-15: Joy to the World instrumental, låg (som J22/J23); kväll: "a bit louder music" 0,3 → 0,42                  // Sanna 2026-11-13: "subtle … low"; vinterljud-2 (mjuk vind) hörs, 1,2 var för den gamla basslingan
  figur: 'bjornen-bulle-v2',
  ljud: 'brum-glad',              // glatt brum vid hej, varannan tittut och hej då
  fniss: 'brum-fniss',            // björnens fniss
  ja: 'brum-glad',                // svarar med ett glatt brum när den nickar
  munTid: 1.3,
  hojd: 370,
  start: [1250, 1060],            // hej och hej då: fri snö mellan granen och pepparkakshuset
  kant: 1,                        // kommer in och går ut till höger
  saker: {                        // delad uppsättning med grisen (bakgrunder/julskogen.md)
    sack:          [560, 960, { h: 440, farg: '#D9382E', inSida: true }],   // säcken med paket, framför granens nedersta gren (Sanna 2026-11-15: "move julgranssäck in front")
    gran:          [800, 900, { h: 1300, farg: '#397653' }],  // Sanna 2026-11-14: större och mer i mitten, bara nedre delen syns; 2026-11-15: "place tree back", bakom säcken
    pepparkakshus: [1650, 940, { h: 460, farg: '#B5743B', inSida: true }],  // lite större och lägre (närmare); 2026-11-15: "avoid … going through house": går runt hörnet och in bakom, hoppar inte över taket
  },
  retas: 'oron',                 // granskning 2026-11-28: bara öronen i kiken (hela huvudet över taket såg ut som själva tittut)
  ben: 0.4,
  gang: true,
  mjukaSteg: true, klattra: false,   // går på snön framför sakerna, aldrig uppe på taket
  // Sanna 2026-11-19 (J06): ingen "Var gömmer du dig nu?", "tittut" lite senare, tätare närbilder, fler reaktionsansikten
  gomma: false,
  tittutSen: 0.3,
  narbild: 1.7,
  reaktioner: true,
  reaktion: 0.3,                  // v3 2026-11-28: 0,6 → 0,3, kortare
  rost: 'bjorn-jul-v3',          // egna repliker med paketen, granen och pepparkakshuset (rost.txt här)
  rundor: [
    ['pepparkakshus', 'ur'],
    ['gran', 'sida'],
    ['sack', 'upp'],          // granskning 2026-11-28: upp ur säcken och hoppar ut över kanten (inte ut genom sidan)
  ],
  skakar: ['sack'],
  utSida: { gran: 1 },   // granskning 2026-11-28: ut åt höger, bort från säcken (läste som 'bakom säcken'); förr -1          // 2026-11-15: granens grenar når nästan till huset, ingen plats för björnen emellan; ut på den öppna vänstra sidan
  hejdaDjur: true,                // "Hej då björnen!" (roster/tittut/bjorn-hejda.m4a) vid vinket
  kort: [0],
  // Sanna 2026-11-13: "add clothes to bear", "add light falling snow in bg"
  luva: [512, 262, 0.36, -6],     // tomteluvan, som björnen i julkalendern; 2026-11-19 (J06): "make hat smaller" 0,46 → 0,36
  halsduk: { y: 552, farg: '#4A8F55' },
  sno: 60,
  nara: [                         // snö i förgrunden, i hörnen nära kameran (parallax), utanför björnens väg
    { fil: 'assets/bakgrunder/julskogen-saker/snodriva.png', x: -150, y: 1110, h: 250 },   // 2026-11-15: längre ut i hörnet, dolde björnen bredvid säcken (0:42); kväll: ännu längre, björnen går nu ut på granens vänstra sida
    { fil: 'assets/bakgrunder/julskogen-saker/snobuskar.png', x: 2000, y: 1100, h: 220 },
  ],
});
</script>
