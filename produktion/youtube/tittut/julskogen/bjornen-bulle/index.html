<meta charset="utf-8">
<title>Tittut – björnen i julskogen (art direction v2)</title>
<style>html, body { margin:0; background:#FBF7EE; overflow:hidden; } svg { width:100vw; height:100vh; display:block; }</style>
</head>
<body>
<!-- Tittut: björnen i julskogen (2026-11-13, plan: produktion/youtube/shorts/jul/plan-tittut-bjornen.md). Platsen och gömställena
     (julgranen, pakethögen och pepparkakshuset) delas med grisens tittut: bakgrunder/julskogen.md. Repliker i rost.txt här
     (Malin, tagning 2, roster/tittut/bjorn-julskog/). Björnens läten: brum-glad och brum-fniss (kopior ur brum-gullig). -->
<script src="../../scener/kit.js"></script><script src="../../../../../verktyg/kant.js"></script>
<script src="../../tittut.js"></script>
<script>
tittut({
  plats: 'julskogen',
  platsVol: 0.6,
  badd: 'assets/ljud/musik/jul/karol-joy-to-the-world.mp3', baddVol: 0.42,   // Sanna 2026-11-15: Joy to the World instrumental, låg (som J22/J23); kväll: "a bit louder music" 0,3 → 0,42                  // Sanna 2026-11-13: "subtle … low"; vinterljud-2 (mjuk vind) hörs, 1,2 var för den gamla basslingan
  figur: 'bjornen-bulle-v2',
  ljud: 'brum-glad',              // glatt brum vid hej, varannan tittut och hej då
  fniss: 'brum-fniss',            // björnens fniss
  ja: 'brum-glad',                // svarar med ett glatt brum när den nickar
  munTid: 1.3,
  hojd: 370,
  start: [1250, 1060],            // hej och hej då: fri snö mellan granen och pepparkakshuset
  kant: 1,                        // kommer in och går ut till höger
  saker: {                        // delad uppsättning med grisen (bakgrunder/julskogen.md)
    sack:          [560, 960, { h: 440, farg: '#D9382E', inSida: true }],   // säcken med paket, framför granens nedersta gren (Sanna 2026-11-15: "move julgranssäck in front")
    gran:          [800, 900, { h: 1300, farg: '#397653' }],  // Sanna 2026-11-14: större och mer i mitten, bara nedre delen syns; 2026-11-15: "place tree back", bakom säcken
    pepparkakshus: [1650, 940, { h: 460, farg: '#B5743B', inSida: true }],  // lite större och lägre (närmare); 2026-11-15: "avoid … going through house": går runt hörnet och in bakom, hoppar inte över taket
  },
  retas: 'huvud',
  ben: 0.4,
  gang: true,
  mjukaSteg: true, klattra: false,   // går på snön framför sakerna, aldrig uppe på taket
  varv: 2,
  rost: 'bjorn-julskog',          // egna repliker med paketen, granen och pepparkakshuset (rost.txt här)
  rundor: [
    ['sack', 'upp'],
    ['gran', 'sida'],
    ['pepparkakshus', 'ur'],      // huvudet kommer upp över taket
    ['gran', 'sida'],
    ['pepparkakshus', 'ur', 'sack'],   // överraskningen: gömmer sig bakom huset, kommer upp ur säcken
  ],
  skakar: ['sack'],
  hejdaDjur: true,                // "Hej då björnen!" (roster/tittut/bjorn-hejda.m4a) vid vinket
  kort: [0],
  // Sanna 2026-11-13: "add clothes to bear", "add light falling snow in bg"
  luva: [512, 262, 0.46, -6],     // tomteluvan, som björnen i julkalendern
  halsduk: { y: 552, farg: '#4A8F55' },
  sno: 60,
  nara: [                         // snö i förgrunden, i hörnen nära kameran (parallax), utanför björnens väg
    { fil: 'assets/bakgrunder/julskogen-saker/snodriva.png', x: -40, y: 1095, h: 250 },   // 2026-11-15: längre ut i hörnet, dolde björnen bredvid säcken (0:42)
    { fil: 'assets/bakgrunder/julskogen-saker/snobuskar.png', x: 2000, y: 1100, h: 220 },
  ],
});
</script>
</body>
</html>
