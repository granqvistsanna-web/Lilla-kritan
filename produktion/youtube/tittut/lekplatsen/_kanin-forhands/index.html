<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Tittut – kaninen på lekplatsen (art direction v2)</title>
<style>html, body { margin:0; background:#FBF7EE; overflow:hidden; } svg { width:100vw; height:100vh; display:block; }</style>
</head>
<body>
<!-- Tittut: kaninen på lekplatsen (Sanna 2026-11-11, plan.md i den här mappen). v2-Kanel med gunganden, äppelträdet och stöveln,
     som ingen annan lekplatsfilm använder. Fem rundor, överraskningen i den sista. -->
<script src="../../scener/kit.js"></script><script src="../../../../../verktyg/kant.js"></script>
<script src="../../tittut.js"></script>
<script>
tittut({
  plats: 'lekplatsen',
  figur: 'kaninen-kanel-v2',
  ljud: 'hej-babbel',
  fniss: 'fniss',
  ja: 'ja-babbel',
  munTid: 1.3,
  hojd: 420,                      // lite mindre än i skogen-gron, så att hon får plats bakom stöveln och stammen
  start: [760, 990],              // hej och hej då: fri mark mellan anden och trädet
  kant: -1,                       // in och ut till vänster, framför anden (de andra lekplatsfilmerna kommer från höger)
  saker: {
    gunganka:  [340, 905, { h: 660, farg: '#F2C230', hel: true, vick: 5 }],   // stor (Sanna 2026-11-11); hel: benen döljs bredvid fjädern; vick: gungar på fjädern
    appeltrad: [1080, 860, { h: 1280, farg: '#8A5A34', gom: 14 }],   // det stora äppelträdet (013:s med tjockare stam och tunn kant), bakom de andra
    stovel:    [1640, 905, { h: 660, farg: '#F5C531', gom: -63 }],   // gom: bakom skaftet, inte tån; h under 672 så att den räknas som låg
  },
  retas: 'oron',                  // öronspetsarna kikar och vickar först, sedan huvudet
  ben: 0.4,
  gang: true,
  mjukaSteg: true, klattra: false, lugn: 1.3,
  platsVol: 1.1,
  gommaForst: true,
  varv: 2,
  rost: 'kanin-lekplats',         // kaninens repliker med anden, stöveln och trädet (plan.md)
  rundor: [
    ['gunganka', 'upp'],          // upp över andryggen
    ['stovel', 'ur'],             // huvudet upp ur stöveln
    ['appeltrad', 'sida'],        // ut vid sidan av stammen
    ['gunganka', 'sida'],         // "En gång till!": ut vid andens stjärt
    ['appeltrad', 'ur', 'stovel'],  // överraskningen: bakom trädet, upp ur stöveln
  ],
  bortaVarje: true, darVarje: true, retasSkala: 0.7,   // tillfällig kopia för förhandsvisningen
  skakar: ['gunganka'],           // anden skakar till när hon är där (ärlig ledtråd), och gungar med vick
  kort: [0],
});
</script>
</body>
</html>
