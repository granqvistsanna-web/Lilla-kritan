<!doctype html>
<meta charset="utf-8">
<title>Gröna dörren – julkomposition</title>
<style>html,body{margin:0;background:#000}svg{display:block;width:100vw;height:100vh}</style>
<body>
<svg id="s" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice"></svg>
<script>
// Gröna dörren (jul): plattan assets/bakgrunder/grona-dorren/grona-dorren-v2.jpeg (1376 × 768, Flow 2026-11-16, ljusa streck tonade med
// verktyg/lugna_streck.py --ljusa): rosa vägg, välvd dörr med limegrön karm, turkost bord med gul lampa.
// I kod: en platt grangirlang längs dörrens båge med röda bär och en rosett, en stor gul adventsstjärna av papper som hänger
// mitt på väggen och lyser, lampans sken, en svag kvällston, en randig matta och ett varmt golv.
// Plattan fyller höjden: K = 1080 / 768, OX = −7,5. Mått i scenen: golvlinjen y 805, dörren x 140–513 (bågens mitt (327, 323),
// radie ut till karmen 187), lampskärmens mitt (1815, 555), bordsskivan y 693 (x 1701 → kanten).
// render.mjs-protokoll: window.ready, window.seek(t), window.DURATION (loopar efter 6 s).
const A = '/assets/', GOLV = 805, BAGE = { x: 327, y: 323, r: 200 }, LAMPA = { x: 1815, y: 555 };
const STJ = { x: 1040, y: 360, r: 110 };
const plate = `width="1920" height="1080" preserveAspectRatio="xMidYMid slice"`;
const stjarna = (cx, cy, r, ri) => 'M' + Array.from({ length: 10 }, (_, i) => { const v = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? ri : r; return `${(cx + q * Math.cos(v)).toFixed(1)} ${(cy + q * Math.sin(v)).toFixed(1)}`; }).join(' L') + 'Z';
// girlangen följer bågen och går en bit ner på sidorna
const V0 = Math.PI * 1.0, V1 = Math.PI * 2.0, SIDA = 110;
const girlang = `M${BAGE.x - BAGE.r} ${BAGE.y + SIDA} V${BAGE.y} A${BAGE.r} ${BAGE.r} 0 0 1 ${BAGE.x + BAGE.r} ${BAGE.y} V${BAGE.y + SIDA}`;
const BAR = [1.08, 1.25, 1.42, 1.58, 1.75, 1.92].map(u => [BAGE.x + BAGE.r * Math.cos(u * Math.PI), BAGE.y + BAGE.r * Math.sin(u * Math.PI)])
  .concat([[BAGE.x - BAGE.r, BAGE.y + 60], [BAGE.x + BAGE.r, BAGE.y + 70]]);

document.getElementById('s').innerHTML = `
<defs>
  <filter id="vax" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/>
    <feDisplacementMap in="SourceGraphic" scale="5"/></filter>
  <filter id="korn"><feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" seed="9"/><feColorMatrix values="0 0 0 0 .35  0 0 0 0 .2  0 0 0 0 .1  0 0 0 -1.6 1.05"/>
    <feComposite in2="SourceGraphic" operator="in"/></filter>
  <radialGradient id="lampsken"><stop offset="0" stop-color="#FFE38A" stop-opacity=".85"/><stop offset="1" stop-color="#FFE38A" stop-opacity="0"/></radialGradient>
  <radialGradient id="rumsken"><stop offset="0" stop-color="#FFD98A" stop-opacity=".5"/><stop offset=".5" stop-color="#FFC27A" stop-opacity=".14"/><stop offset="1" stop-color="#FFC27A" stop-opacity="0"/></radialGradient>
  <radialGradient id="vinjett" cx=".5" cy=".5" r=".75"><stop offset=".6" stop-color="#2A0A1A" stop-opacity="0"/><stop offset="1" stop-color="#2A0A1A" stop-opacity=".13"/></radialGradient>
</defs>
<image href="${A}bakgrunder/grona-dorren/grona-dorren-v2.jpeg" ${plate}/>

<!-- kvällston, lampans sken -->
<rect width="1920" height="1080" fill="#2A2560" opacity=".1"/>
<ellipse id="rumsken" cx="${LAMPA.x}" cy="${LAMPA.y + 40}" rx="560" ry="440" fill="url(#rumsken)"/>
<circle id="lampglod" cx="${LAMPA.x}" cy="${LAMPA.y}" r="110" fill="url(#lampsken)"/>

<!-- grangirlangen längs dörrens båge -->
<g filter="url(#vax)">
  <path d="${girlang}" fill="none" stroke="#fff" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="${girlang}" fill="none" stroke="#2F7D46" stroke-width="31" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="${girlang}" fill="none" stroke="#3E9457" stroke-width="10" stroke-dasharray="2 22" stroke-linecap="round"/>
  ${BAR.map(([x, y]) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7" fill="#D9443A"/>`).join('')}
  <g transform="translate(${BAGE.x} ${BAGE.y - BAGE.r}) scale(1.4)">
    <path d="M0 0 L-34 -20 L-30 20 Z M0 0 L34 -20 L30 20 Z" fill="#D9443A" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
    <circle r="10" fill="#C8302A" stroke="#fff" stroke-width="4"/>
  </g>
</g>

<!-- adventsstjärnan på väggen -->
<path d="M${STJ.x} 0 V${STJ.y - STJ.r}" stroke="#F4EBDA" stroke-width="3" id="stjsnore"/>
<circle id="stjsken" cx="${STJ.x}" cy="${STJ.y}" r="${STJ.r * 2.4}" fill="url(#lampsken)"/>
<g id="stj" filter="url(#vax)">
  <path d="${stjarna(STJ.x, STJ.y, STJ.r, STJ.r * 0.48)}" fill="#FFD25E" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
  <path d="${stjarna(STJ.x, STJ.y, STJ.r * 0.62, STJ.r * 0.3)}" fill="#F2B33D"/>
  <path d="${stjarna(STJ.x, STJ.y, STJ.r * 0.32, STJ.r * 0.16)}" fill="#FFE3A0"/>
  <path d="M${STJ.x - 18} ${STJ.y + STJ.r * 0.42} L${STJ.x - 26} ${STJ.y + STJ.r * 1.3} M${STJ.x} ${STJ.y + STJ.r * 0.42} V${STJ.y + STJ.r * 1.4} M${STJ.x + 18} ${STJ.y + STJ.r * 0.42} L${STJ.x + 26} ${STJ.y + STJ.r * 1.3}" stroke="#F2B33D" stroke-width="5" stroke-linecap="round"/>
</g>

<!-- varmt golv och en randig matta -->
<rect y="${GOLV}" width="1920" height="${1080 - GOLV}" fill="#EBC79A" style="mix-blend-mode:multiply" opacity=".45"/>
<g stroke="#B9875A" stroke-width="3" opacity=".16" filter="url(#vax)">${[855, 922, 1008].map(y => `<path d="M0 ${y} H1920"/>`).join('')}</g>
<g filter="url(#vax)" stroke="#fff" stroke-width="5">
  <ellipse cx="1080" cy="962" rx="370" ry="72" fill="#2F9E5B"/>
  <ellipse cx="1080" cy="962" rx="308" ry="58" fill="#D9443A" stroke="none"/>
  <ellipse cx="1080" cy="962" rx="246" ry="45" fill="#2F9E5B" stroke="none"/>
  <ellipse cx="1080" cy="962" rx="180" ry="31" fill="#D9443A" stroke="none"/>
</g>
<ellipse cx="1080" cy="965" rx="370" ry="72" fill="#fff" filter="url(#korn)" opacity=".3"/>

<rect width="1920" height="1080" fill="url(#vinjett)"/>`;

const $ = id => document.getElementById(id), DURATION = 6, TAU = Math.PI * 2;
const vag = (t, n, fas = 0) => Math.sin(TAU * n * t / DURATION + fas);
function seek(t) {
  t = ((t % DURATION) + DURATION) % DURATION;
  $('rumsken').setAttribute('opacity', 0.9 + 0.1 * vag(t, 1));
  $('lampglod').setAttribute('opacity', 0.85 + 0.15 * vag(t, 1));
  const v = (0.8 * vag(t, 1)).toFixed(2);
  ['stj', 'stjsken', 'stjsnore'].forEach(id => $(id).setAttribute('transform', `rotate(${v} ${STJ.x} 0)`));
  $('stjsken').setAttribute('opacity', (0.85 + 0.15 * vag(t, 2)).toFixed(2));
}
window.DURATION = DURATION; window.seek = seek;
Promise.all([...document.querySelectorAll('image')].map(im => new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = im.getAttribute('href'); })))
  .then(() => { seek(0); window.ready = true;
    if (!navigator.webdriver) { const t0 = performance.now(); const go = () => { seek((performance.now() - t0) / 1000); requestAnimationFrame(go); }; go(); } });
</script>
