<!doctype html>
<meta charset="utf-8">
<title>Julsovrummet – julkomposition</title>
<style>html,body{margin:0;background:#000}svg{display:block;width:100vw;height:100vh}</style>
<body>
<script src="/produktion/rum/sno.js"></script>
<script src="/produktion/youtube/shorts/godnatt/nalle-v2.js"></script>
<svg id="s" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice"></svg>
<script>
// Julsovrummet (jul): plattan assets/bakgrunder/julsovrummet/julsovrummet-valvt-v2.jpeg (2752 × 1536, Flow 2026-11-16, vald av
// Sanna 2026-11-17 för de prydligare gardinerna; ljusa streck tonade med verktyg/lugna_streck.py --ljusa): rosa randig vägg, välvt fönster med lila
// gardiner, nattduksbord med lampa. (Den första plattan, julsovrummet-v2.jpeg med fyrkantigt fönster, ligger kvar.)
// I kod: kvällshimmel med en ritad måne och snö (produktion/rum/sno.js) i fönstret, en ljusslinga över gardinerna, lampans varma sken,
// nalle v2 (nalle-v2-ljus-tunn, ansiktet i kod ur nalle-v2.js) vid bordet, en randig matta, ett varmt golv och en svag kvällston. Jul (Sanna 2026-11-17): nallen har tomteluva
// (ingen gran, Sanna 2026-11-17).
// Plattan fyller höjden: K = 1080 / 1536, OX = −7,5. Mått i scenen: golvlinjen y 819, fönstrets glas x 430–711, y 148–539,
// gardinerna x 293–851 med överkanten y 112, lampskärmens mitt (1770, 585), bordsskivan y 641.
// render.mjs-protokoll: window.ready, window.seek(t), window.DURATION (loopar efter 6 s).
const A = '/assets/', R = A + 'rekvisita/', GOLV = 819, F = { x0: 430, x1: 711, y0: 148, y1: 539 }, LAMPA = { x: 1770, y: 585 };
const SNO = snoFonster(F, 6);
const MANE = { x: 640, y: 262, r: 40, cx: 659, cy: 246, cr: 33 };   // skivan och cirkeln som skär ut skäran
const NALLE = { x: 1530, bot: 848, s: 0.19 };   // nallen sitter på golvet till vänster om bordet, botten på bot
// ljusslingan: två bågar längs gardinstången, små lampor
const SL = [285, 572, 860], SLY = 108, SLH = 34;
const slLampor = SL.slice(1).flatMap((x, i) => [0.15, 0.32, 0.5, 0.68, 0.85].map(u => [SL[i] + (x - SL[i]) * u, SLY + 4 * SLH * u * (1 - u) + 6]));
const plate = `width="1920" height="1080" preserveAspectRatio="xMidYMid slice"`;

document.getElementById('s').innerHTML = `
<defs>${SNO.defs}
  <filter id="vax" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/>
    <feDisplacementMap in="SourceGraphic" scale="5"/></filter>
  <filter id="korn"><feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" seed="9"/><feColorMatrix values="0 0 0 0 .35  0 0 0 0 .2  0 0 0 0 .1  0 0 0 -1.6 1.05"/>
    <feComposite in2="SourceGraphic" operator="in"/></filter>
  <radialGradient id="lampsken"><stop offset="0" stop-color="#FFE38A" stop-opacity=".85"/><stop offset="1" stop-color="#FFE38A" stop-opacity="0"/></radialGradient>
  <radialGradient id="rumsken"><stop offset="0" stop-color="#FFD98A" stop-opacity=".55"/><stop offset=".5" stop-color="#FFC27A" stop-opacity=".15"/><stop offset="1" stop-color="#FFC27A" stop-opacity="0"/></radialGradient>
  <radialGradient id="manesken"><stop offset="0" stop-color="#FFF3C4" stop-opacity=".45"/><stop offset="1" stop-color="#FFF3C4" stop-opacity="0"/></radialGradient>
  <radialGradient id="vinjett" cx=".5" cy=".5" r=".75"><stop offset=".6" stop-color="#2A1030" stop-opacity="0"/><stop offset="1" stop-color="#2A1030" stop-opacity=".13"/></radialGradient>
  <linearGradient id="kvall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F2E5E"/><stop offset="1" stop-color="#40598F"/></linearGradient>
  <mask id="glas" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080"><image href="${A}bakgrunder/julsovrummet/fonster-mask-valvt.png" ${plate}/></mask>
  <mask id="mane-skara"><rect width="1920" height="1080" fill="#fff"/><circle cx="${MANE.cx}" cy="${MANE.cy}" r="${MANE.cr}" fill="#000"/></mask>
  <mask id="mane-kant"><rect width="1920" height="1080" fill="#fff"/><circle cx="${MANE.cx}" cy="${MANE.cy}" r="${MANE.cr - 3}" fill="#000"/></mask>
</defs>
<image href="${A}bakgrunder/julsovrummet/julsovrummet-valvt-v2.jpeg" ${plate}/>

<!-- fönstret: kvällshimmel, månen, stjärnor, snö på marken och snö som faller -->
<g mask="url(#glas)">
  <rect x="${F.x0 - 10}" y="${F.y0 - 10}" width="${F.x1 - F.x0 + 20}" height="${F.y1 - F.y0 + 20}" fill="url(#kvall)"/>
  <circle cx="${MANE.x}" cy="${MANE.y}" r="${MANE.r * 2.6}" fill="url(#manesken)"/>
  <g filter="url(#vax)"><circle cx="${MANE.x}" cy="${MANE.y}" r="${MANE.r + 3}" fill="#fff" mask="url(#mane-kant)"/>
    <circle cx="${MANE.x}" cy="${MANE.y}" r="${MANE.r}" fill="#F7E3A1" mask="url(#mane-skara)"/></g>
  <circle cx="${MANE.x}" cy="${MANE.y}" r="${MANE.r}" fill="#C9A24A" filter="url(#korn)" opacity=".25" mask="url(#mane-skara)"/>
  ${[[0.15, 0.14], [0.38, 0.08], [0.28, 0.4], [0.55, 0.28], [0.12, 0.6]].map(([a, b]) => `<circle cx="${F.x0 + a * (F.x1 - F.x0)}" cy="${F.y0 + b * (F.y1 - F.y0)}" r="3.5" fill="#FFF3C4"/>`).join('')}
  <path d="M${F.x0 - 10} ${F.y1 - 34} Q${F.x0 + 90} ${F.y1 - 64} ${F.x0 + 180} ${F.y1 - 44} T${F.x1 + 10} ${F.y1 - 48} V${F.y1 + 10} H${F.x0 - 10}Z" fill="#EEF3FA"/>
  ${SNO.svg}
</g>

<!-- kvällston över rummet, lampans varma sken ovanpå -->
<rect width="1920" height="1080" fill="#2A2560" opacity=".12"/>
<ellipse id="rumsken" cx="${LAMPA.x}" cy="${LAMPA.y + 40}" rx="620" ry="480" fill="url(#rumsken)"/>
<circle id="lampglod" cx="${LAMPA.x}" cy="${LAMPA.y}" r="110" fill="url(#lampsken)"/>

<!-- ljusslingan över gardinerna -->
<path d="${SL.slice(1).map((x, i) => `M${SL[i]} ${SLY} Q${(SL[i] + x) / 2} ${SLY + 2 * SLH} ${x} ${SLY}`).join(' ')}" fill="none" stroke="#4A3626" stroke-width="2.5" opacity=".6"/>
<g id="slinga">${slLampor.map(([x, y]) => `<g><circle cx="${x}" cy="${y}" r="20" fill="url(#lampsken)"/><circle cx="${x}" cy="${y}" r="7" fill="#FFF6D8"/><circle cx="${x}" cy="${y}" r="5.5" fill="#FFC928"/></g>`).join('')}</g>

<!-- varmt golv och en randig matta -->
<rect y="${GOLV}" width="1920" height="${1080 - GOLV}" fill="#EBC79A" style="mix-blend-mode:multiply" opacity=".45"/>
<g stroke="#B9875A" stroke-width="3" opacity=".16" filter="url(#vax)">${[868, 932, 1016].map(y => `<path d="M0 ${y} H1920"/>`).join('')}</g>
<g filter="url(#vax)" stroke="#fff" stroke-width="5">
  <ellipse cx="1080" cy="965" rx="370" ry="72" fill="#8E6BB8"/>
  <ellipse cx="1080" cy="965" rx="308" ry="58" fill="#7FD1B9" stroke="none"/>
  <ellipse cx="1080" cy="965" rx="246" ry="45" fill="#8E6BB8" stroke="none"/>
  <ellipse cx="1080" cy="965" rx="180" ry="31" fill="#7FD1B9" stroke="none"/>
</g>
<ellipse cx="1080" cy="968" rx="370" ry="72" fill="#fff" filter="url(#korn)" opacity=".3"/>

<!-- nallen (v2, ansiktet i kod, glad och vaken) med tomteluva -->
<ellipse cx="${NALLE.x}" cy="${NALLE.bot - 2}" rx="${360 * NALLE.s}" ry="8" fill="#2A1030" opacity=".14"/>
<g transform="translate(${NALLE.x - 424 * NALLE.s} ${NALLE.bot - 831 * NALLE.s}) scale(${NALLE.s})">
  <image href="${R}nalle/cut/nalle-v2-ljus-tunn.png" width="848" height="856"/>${nalleAnsikte()}
  <image href="${R}tomteluva/cut/tomteluva.png" x="150" y="-302" width="${1024 * 0.62}" height="${1024 * 0.62}" transform="rotate(-8 424 170)"/>
</g>

<rect width="1920" height="1080" fill="url(#vinjett)"/>`;

const $ = id => document.getElementById(id), DURATION = 6, TAU = Math.PI * 2;
const vag = (t, n, fas = 0) => Math.sin(TAU * n * t / DURATION + fas);
function seek(t) {
  t = ((t % DURATION) + DURATION) % DURATION;
  SNO.seek(t);
  $('rumsken').setAttribute('opacity', 0.9 + 0.1 * vag(t, 1));
  $('lampglod').setAttribute('opacity', 0.85 + 0.15 * vag(t, 1));
  [...$('slinga').children].forEach((c, i) => c.setAttribute('opacity', 0.6 + 0.4 * vag(t, 1, i * 1.7)));
}
window.DURATION = DURATION; window.seek = seek;
Promise.all([...document.querySelectorAll('image')].map(im => new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = im.getAttribute('href'); })))
  .then(() => { seek(0); window.ready = true;
    if (!navigator.webdriver) { const t0 = performance.now(); const go = () => { seek((performance.now() - t0) / 1000); requestAnimationFrame(go); }; go(); } });
</script>
