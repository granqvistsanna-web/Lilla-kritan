<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;background:#000}svg{display:block}</style>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <filter id="boil" filterUnits="userSpaceOnUse" x="-100" y="-100" width="2120" height="1280">
      <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
      <feDisplacementMap id="disp" in="SourceGraphic" scale="6"/>
    </filter>
    <radialGradient id="glow"><stop offset="0" stop-color="#fff6c8" stop-opacity=".9"/><stop offset="1" stop-color="#fff6c8" stop-opacity="0"/></radialGradient>
    <radialGradient id="blush"><stop offset="0" stop-color="#f09a8c" stop-opacity=".85"/><stop offset=".6" stop-color="#f2a596" stop-opacity=".55"/><stop offset="1" stop-color="#f2a596" stop-opacity="0"/></radialGradient>
  </defs>
  <g id="cam">
    <!-- Extra sky past the plate's right and top edges (offset copies of its empty sky, under the plate), so the opening close-up can centre the moon. -->
    <image href="../../backgrounds/evening-empty-moon.png" x="700" y="-450" width="1920" height="1080" preserveAspectRatio="xMidYMid slice"/>
    <image href="../../backgrounds/evening-empty-moon.png" x="-1220" y="-450" width="1920" height="1080" preserveAspectRatio="xMidYMid slice"/>
    <image href="../../backgrounds/evening-empty-moon.png" x="1000" width="1920" height="1080" preserveAspectRatio="xMidYMid slice"/>
    <image href="../../backgrounds/evening-empty-moon.png" width="1920" height="1080" preserveAspectRatio="xMidYMid slice"/>
    <!-- Set: just a hint of the red house at the right edge, and the pillow lying flat on the grass as Kvack's bed. -->
    <g id="set" filter="url(#boil)">
      <image id="house" href="../../props/cut/house-red.png" x="1500" y="163" width="900" height="900"/>
      <image href="../../props/cut/pillow-bed.png" x="1020" y="761" width="460" height="220" preserveAspectRatio="none"/>
    </g>
    <g id="stars"></g>
    <!-- Moon face, drawn in code on the empty moon: soft blush, sleepy half-lidded eyes under a curved lid, brows and a smiling mouth. -->
    <g id="moon" filter="url(#boil)" stroke="#3a3530" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <ellipse class="cheek" cx="-68" cy="28" rx="34" ry="24" fill="url(#blush)" stroke="none"/>
      <ellipse class="cheek" cx="68" cy="28" rx="34" ry="24" fill="url(#blush)" stroke="none"/>
      <path class="brow" stroke-width="5"/><path class="brow" stroke-width="5"/>
      <g class="eye" transform="translate(-44 -12)"><path class="pupil" fill="#3a3530" stroke="none"/><circle class="shine" fill="#fff8e0" stroke="none"/><path class="lid"/></g>
      <g class="eye" transform="translate(44 -12)"><path class="pupil" fill="#3a3530" stroke="none"/><circle class="shine" fill="#fff8e0" stroke="none"/><path class="lid"/></g>
      <path id="mouth" fill="#8a3e30"/>
    </g>
    <g id="actors" filter="url(#boil)"></g>
    <g id="sleeper" filter="url(#boil)" opacity="0"><image href="../../characters/cut/duckling-sleeping.png" width="1024" height="1024"/></g>
    <g id="bottle" filter="url(#boil)"><image href="../../props/cut/milk-bottle-blob.png" width="170" height="170" x="-84.5" y="-20.3"/></g>
    <g id="zs" filter="url(#boil)" fill="none" stroke="#fff8e0" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"></g>
  </g>
  <!-- Ending: crayon iris closing on sleeping Kvack (same look as assembly/iris.sh), then one star glint in the black. -->
  <path id="iris" fill="#000" fill-rule="evenodd"/>
  <g filter="url(#boil)"><path id="irisRim" fill="none" stroke="#fff8e0" stroke-linejoin="round"/></g>
  <path id="glint" d="M0 -1 L.16 -.16 L1 0 L.16 .16 L0 1 L-.16 .16 L-1 0 L-.16 -.16Z" fill="#fff8e0" opacity="0"/>
</svg>
<script src="../legs.js"></script>
<script src="../cast.js"></script>
<script src="dream.js"></script>
<script>
// Bedtime (piano scene, episode outro): night on the evening plate, a hint of her red house at the edge. It opens close on the
// moon as it dances to the song and eases out to the whole night while sleepy Kvack waddles in. She drinks her milk bottle (a few gulps, a happy sigh), looks up at the dancing moon, gives a slow yawn,
// hops onto her pillow, nods off and sleeps with slow breaths. The moon dances to the song and closes its eyes too, and the stars
// glimmer. After the last sung word a crayon iris closes on sleeping Kvack, holds on her over the music box, shuts, and one
// star glints in the black to end the episode. Archived before the iris: archive/bedtime-before-iris.html.
// Archived before the milk beat: archive/bedtime-index-before-milk.html; before the new moon face and opening zoom: archive/bedtime-before-moon.html.
// Kvack's beats were timed to the first outro song (music/outro.m4a). The moon sings music/outro-v4.mp3 ("Godnatt Kvack",
// music/suno-prompts.md 3d; 107.7 BPM, a 4-bar intro, then 10 lines of 2 bars). Line 1 lands at bedtime 2.5, so each line meets its
// beat: moon 2.5, milk 7.0, yawn 11.5, sleep 15.4, dream ball 20.5, Nalle 25.0, bee 29.5, berries 34.0, bubble 38.5, goodnight 42.9.
// Sound cues for the edit are in window.SFX. Render: node ~/.claude/skills/launch-video/scripts/render.mjs <this folder>
const DUR = 52, GROUND = 925, H = 400, FADE = [47, 52], $ = id => document.getElementById(id);
const MOON = [1735, 172, 130]; // centre and radius in the 1920×1080 plate
const IRIS = [45.8, 48.0, 49.6, 50.6], IRIS_R = 230, GLINT = 50.75; // closes, small hole on Kvack, holds, shuts; then the glint
const OPEN = [2.0, 2.0, 5.2, 600]; // opening close-up centred on the moon: zoom, zoom out from and to (done before the milk lift at 5.4),
// and how far right the house starts, so its roof is out of the close-up; it slides home as the camera pulls out
const STARS = [[748, 76, 35], [1394, 82, 37], [1194, 208, 33], [446, 216, 30], [70, 406, 35], [1842, 467, 36]];

// Kvack: a slow sleepy walk (6 steps) from 380 to 860, past the bottle. She faces screen left (bill and wing on that side), so she
// lifts the bottle behind her with the raised wing and drinks teat-first, looks up at the moon, yawns, hops onto the pillow,
// nods off and lies down on it to sleep.
const WALK = [.4, 5.2, 6], X0 = 380, X1 = 860;
const PX = 1250, PH = 85, LIE = [14.6, .8]; // pillow centre, how far above the grass she sits on it; snuggle-down start and length
const BEAK = [425, 402]; // where the teat goes on the bill, in the duckling art (the bill faces front, her wing is screen left)
const BOTTLE = [630, 801], DRINK = [5.4, 5.9, 7.9, 8.4], GULPS = [6.2, 6.8, 7.4], SIGH = 8.5; // teat tip when standing; lift up, hold, put down
const YAWN = [10.4, 12.2], SIT = [13.4, 14.1], SLEEP = 16.0, BREATH = 3.2; // breath: seconds per slow sleep breath
const KFACE = [[0, 5.2, 'half', .5], [5.2, 5.9, 'open', -1, 8], [5.9, 7.9, 'closed'], [7.9, 9.0, 'happy'], [9.0, 10.2, 'open', 1, -9],
  [YAWN[0], YAWN[1], 'closed'], [YAWN[1], 14.6, 'half', .3],
  [14.6, 15.3, 'closed'], [15.3, 15.8, 'half', 0], [15.8, 99, 'closed']]; // [from, to, eyes, look, lookY]; she nods off, peeks once, then sleeps
const BLINKS = [2.6, 4.4, 13.0];
const SNORES = Array.from({ length: 10 }, (_, i) => SLEEP + 1.2 + BREATH * i); // breath peaks
// a "z" floats up from her head at each time; after the dream ends (~37) they come twice as often, a sleepy zzz trail
const ZS = [...Array.from({ length: 16 }, (_, i) => 17 + 1.8 * i), ...Array.from({ length: 5 }, (_, i) => 37.9 + 1.8 * i)];

// Moon: no lip sync; it smiles and dances to the song, blinks, and squints happily when she looks up (9.1), falls asleep (16.6)
// and dreams of the ball (20.6), then sleeps too and only sways.
const MOON_SMILE = 9.1, MOON_REACT = [MOON_SMILE, 16.6, 20.6], MOON_BLINKS = [1.6, 6.5, 9.1, 14.8, 22.0], MOON_SLEEP = [28.2, .9];
const TWINKLES = [.9, 33.4, 37.7, 41.6]; // the stars answer with a soft bright wave, left to right: hello to the moon, then the dream's end and goodnight
const SONG_AT = 6.39; // song time at bedtime 0 (build-draft.sh adelay), so the moon dances on the song's beat
const BEAT = [.63, .5609], DANCE = 2.5; // song's first beat and beat length (librosa); the moon grins and dances to the intro until the words
// Cutaway: the camera pushes in on the dancing moon while Kvack hops onto the pillow and lies down, and pulls back once she's asleep.
const CUT = [12.9, 13.6, 16.4, 17.4];
const PINGS = STARS.map((_, i) => Array.from({ length: 14 }, (_, k) => 1.2 + i * .55 + k * 3.6)); // each star glints on its own beat

window.SFX = [...stepTimes(WALK).map(t => [t, 'step']), [DRINK[1], 'slurp'], [MOON_SMILE, 'twinkle'], [SIGH, 'mmm'], [YAWN[0] + .1, 'yawn'], [SIT[0] + .3, 'sigh'],
  ...SNORES.map(t => [t, 'snore']), ...TWINKLES.map(t => [t, 'twinkle']), [GLINT, 'twinkle'], ...DREAM_SFX].sort((a, b) => a[0] - b[0]);

$('stars').innerHTML = STARS.map(([x, y, r]) => `<circle class="star" cx="${x}" cy="${y}" r="${r * 1.6}" fill="url(#glow)" style="mix-blend-mode:screen"/>`).join('')
  + STARS.map(() => '<path class="spark" d="M0 -1 L.16 -.16 L1 0 L.16 .16 L0 1 L-.16 .16 L-1 0 L-.16 -.16Z" fill="#fff8e0"/>').join('');
$('zs').innerHTML = ZS.map(() => '<path class="z" d="M-14 -16 H14 L-14 16 H14"/>').join('');
const kvack = addActor($('actors'), 'k', 'kvack');
setupShot(DUR);


function moonFace(t) {
  // Dance: a sway each beat (side to side over two beats) with a dip on the beat; biggest to the intro, gentle once it sleeps.
  const ph = (t + SONG_AT - BEAT[0]) / BEAT[1], dance = 1 - ease(clamp((t - DANCE + .6) / .8));
  const g = lerp(.35, lerp(.7, 1, dance), 1 - ease(clamp((t - MOON_SLEEP[0]) / 2)));
  const [mx, my, mr] = MOON, bob = 10 * g * (1 - Math.abs(Math.sin(Math.PI * ph))), sway = 9 * g * Math.sin(Math.PI * ph);
  $('moon').setAttribute('transform', `translate(${mx} ${my + bob}) rotate(${sway}) scale(${mr / 130})`);
  const blink = MOON_BLINKS.some(b => Math.abs(t - b) < .09);
  const open = blink ? 0 : 1 - ease(clamp((t - MOON_SLEEP[0]) / MOON_SLEEP[1]));
  const happy = Math.max(dance, ...MOON_REACT.map(r => Math.sin(Math.PI * clamp((t - r) / 1.4)))); // happy squints: the intro dance and each reaction
  const lx = t > 8.7 && t < 10.2 ? 0 : -2; // eyes on her, a touch to the left
  // Eyes: a round dark pupil under a domed lid. The dome drops into a closed "‿" when shut and lifts into a "◠" when happy.
  const h = 17 * open * (1 - happy), c = lerp(lerp(16, -12, open), -20, happy);
  document.querySelectorAll('#moon .eye').forEach(e => {
    e.querySelector('.pupil').setAttribute('d', `M${lx - 13} 2 Q${lx} ${c} ${lx + 13} 2 A13 ${h} 0 0 1 ${lx - 13} 2Z`);
    const sh = e.querySelector('.shine');
    sh.setAttribute('cx', lx - 4); sh.setAttribute('cy', 1); sh.setAttribute('r', h > 8 ? 4 : 0);
    e.querySelector('.lid').setAttribute('d', `M${lx - 18} 4 Q${lx} ${c - 4} ${lx + 18} 4`);
  });
  // Brows: soft arcs that lift when it is happy.
  const lift = .6 * happy, by = -40 - 8 * lift;
  document.querySelectorAll('#moon .brow').forEach((b, i) => {
    const ex = i ? 46 : -46;
    b.setAttribute('d', `M${ex - 12} ${by + 3} Q${ex} ${by - 6} ${ex + 12} ${by + 3}`);
  });
  document.querySelectorAll('#moon .cheek').forEach(ch => ch.setAttribute('ry', 24 + 4 * happy));
  // Mouth: a closed smile, wider when happy.
  const smile = 24 + 4 * happy;
  $('mouth').setAttribute('d', `M-28 34 C-17 ${34 + smile} 17 ${34 + smile} 28 34 C17 ${38 + smile * .8} -17 ${38 + smile * .8} -28 34Z`);
}

window.seek = (t, f = 0) => {
  $('turb').setAttribute('seed', Math.floor(f / 3) % 50 + 1);
  // Camera: it opens close on the dancing moon, then eases out to the whole night (OPEN) before she lifts her bottle;
  // a slow drift in on Kvack while she settles, then a slow pull back out that brings the moon back in as it falls asleep.
  const zw = t < 16 ? lerp(1, 1.12, ease(clamp((t - 3.5) / 11))) : lerp(1.12, 1, ease(clamp((t - 16) / (FADE[0] - 16))));
  const fit = (z, x, y) => [Math.min(0, Math.max(1920 - 1920 * z, x)), Math.min(0, Math.max(1080 - 1080 * z, y))]; // never past the plate
  const [wx, wy] = fit(zw, 960 - zw * 980, 540 - zw * 560);
  // Ease the zoom evenly (in log scale) and slide the frame's top left corner from the close-up (moon in the middle,
  // over the extra sky) to the wide shot.
  const cut = ease(clamp((t - CUT[0]) / (CUT[1] - CUT[0]))) * (1 - ease(clamp((t - CUT[2]) / (CUT[3] - CUT[2]))));
  const k = ease(clamp((t - OPEN[1]) / (OPEN[2] - OPEN[1]))) * (1 - cut), z = OPEN[0] ** (1 - k) * zw ** k;
  const tx = -z * lerp(MOON[0] - 960 / OPEN[0], -wx / zw, k), ty = -z * lerp(MOON[1] - 540 / OPEN[0], -wy / zw, k);
  $('house').setAttribute('transform', `translate(${OPEN[3] * (1 - k)} 0)`);
  $('cam').setAttribute('transform', `translate(${tx} ${ty}) scale(${z})`);
  $('disp').setAttribute('scale', 6 / z); // the same crayon wobble on screen at any zoom
  // Iris: a wobbly 9-scallop circle round sleeping Kvack (her body centre, art y 513 → plate y 717), turning slowly.
  const [ix, iy] = [tx + z * PX, ty + z * 717];
  const ir = t < IRIS[1] ? lerp(1700 * z, IRIS_R, ease(clamp((t - IRIS[0]) / (IRIS[1] - IRIS[0])))) : lerp(IRIS_R, 0, ease(clamp((t - IRIS[2]) / (IRIS[3] - IRIS[2]))));
  const ring = 'M' + Array.from({ length: 145 }, (_, i) => {
    const a = i / 144 * 2 * Math.PI, r = ir * (1 + .07 * Math.sin(9 * a + t * .8));
    return `${(ix + r * Math.cos(a)).toFixed(1)} ${(iy + r * Math.sin(a)).toFixed(1)}`;
  }).join('L') + 'Z';
  $('iris').setAttribute('d', `M-50 -50H1970V1130H-50Z ${ring}`);
  $('irisRim').setAttribute('d', ir > 1 ? ring : '');
  $('irisRim').setAttribute('stroke-width', Math.min(20, ir / 4));
  const gl = pulse(t, [GLINT], 1.2);
  $('glint').setAttribute('transform', `translate(${ix} ${iy}) rotate(${30 * gl}) scale(${70 * ease(gl)})`);
  $('glint').setAttribute('opacity', gl);
  moonFace(t);
  const tw = i => pulse(t, TWINKLES.map(w => w + i * .12), .9);
  document.querySelectorAll('.star').forEach((s, i) => {
    s.setAttribute('opacity', .35 + .25 * Math.sin(t * 1.4 + i * 1.7) + .5 * tw(i));
    s.setAttribute('r', STARS[i][2] * (1.6 + .6 * tw(i)));
  });
  document.querySelectorAll('.spark').forEach((s, i) => { // a four-point glint that pops and shrinks back
    const [x, y, r] = STARS[i], k = ease(Math.max(tw(i), .7 * pulse(t, PINGS[i], .8)));
    s.setAttribute('transform', `translate(${x} ${y}) rotate(${20 * k}) scale(${r * 1.5 * k})`);
    s.setAttribute('opacity', k);
  });

  // Kvack. Sitting squashes her and tucks the legs; she hops onto the pillow, sits, then snuggles down: the rig squashes
  // and dissolves into the lying-down drawing (characters/cut/duckling-sleeping.png), which breathes on the pillow.
  const wd = waddle(t, WALK, 5), xw = lerp(X0, X1, clamp((t - WALK[0]) / (WALK[1] - WALK[0])));
  const sit = ease(clamp((t - SIT[0]) / (SIT[1] - SIT[0]))), sleep = ease(clamp((t - 14.4) / 2.5)), lie = ease(clamp((t - LIE[0]) / LIE[1]));
  const x = lerp(xw, PX, sit);
  const lift = ease(clamp((t - DRINK[0]) / (DRINK[1] - DRINK[0]))) * (1 - ease(clamp((t - DRINK[2]) / (DRINK[3] - DRINK[2]))));
  const gulp = pulse(t, GULPS, .35);
  const settle = .06 * Math.sin((t - SIT[1]) * 9) * Math.exp(-(t - SIT[1]) * 4) * (t > SIT[1]); // a little bounce as she plops down
  const breath = t > SLEEP ? Math.sin(2 * Math.PI * (t - SLEEP - .4) / BREATH) * ease(clamp((t - SLEEP) / 1.5)) : 0; // peaks on SNORES
  const yawnK = clamp((t - YAWN[0]) / (YAWN[1] - YAWN[0])), yawn = 1.3 * Math.sin(Math.PI * yawnK);
  const [, , eyes, look = 0, lookY = 0] = KFACE.find(e => t >= e[0] && t < e[1]) || KFACE.at(-1);
  const p = { t, x, y: GROUND - (wd.bob || 0) + (31 - PH) * sit - 160 * Math.sin(Math.PI * sit), h: H, ground: GROUND, step: wd.step, stride: wd.stride,
    tilt: wd.tilt + 8 * sleep - 4 * Math.sin(Math.PI * yawnK) + 1.5 * breath * sleep + 7 * lift, // head back to drink
    sx: (1 + .07 * sit - settle + .15 * lie) * (1 + .012 * breath), sy: (1 - .1 * sit + settle - .25 * lie) * (1 + .035 * breath + .04 * yawn / 1.3 + .03 * gulp),
    tuck: 1 - .6 * sit, eyes, look, lookY, blink: BLINKS.some(b => Math.abs(t - b) < .09), open: Math.max(yawn, .25 * gulp), up: lift };
  if (!sit) delete p.tuck;
  pose(kvack, 'kvack', p);
  kvack.style.opacity = 1 - lie;
  // Lying-down drawing: body bottom (art y 768) sunk a little into the pillow, centred on it, at the rig's scale; breathes from the bottom.
  $('sleeper').style.opacity = lie;
  $('sleeper').setAttribute('transform', `translate(${PX} 845) scale(${.5 * (1 + .02 * breath)} ${.5 * (1 + .06 * breath)}) translate(-509 -768)`);

  // Bottle: her raised wing lifts it from the grass and holds it with the teat in the tip of her bill, bottom tipped up;
  // it wobbles on each gulp, then goes back down. It sits behind her on the grass and in front of her while held.
  const [kx, ky] = headPoint('kvack', p, BEAK), bx = lerp(BOTTLE[0], kx - 4, lift), by = lerp(BOTTLE[1], ky + 2, lift);
  $('bottle').setAttribute('transform', `translate(${bx} ${by}) rotate(${115 * lift - 8 * gulp})`);
  $('actors')[lift > 0 ? 'after' : 'before']($('bottle'));

  // Z's float up and to the right from her head, wobbling, and fade out.
  const [hx, hy] = lie > .5 ? [PX + .5 * (330 - 509), 845 + .5 * (285 - 768) * (1 + .06 * breath)] : headPoint('kvack', p); // sleeper's hairs
  document.querySelectorAll('.z').forEach((zz, i) => {
    const k = (t - ZS[i]) / 3.2, on = k >= 0 && k < 1;
    zz.style.display = on ? '' : 'none';
    if (on) zz.setAttribute('transform', `translate(${hx + 60 + 120 * k + 14 * Math.sin(k * 9)} ${hy - 20 - 220 * k}) scale(${.9 + 1.3 * k}) rotate(${-12 + 10 * Math.sin(k * 6)})`),
      zz.setAttribute('opacity', Math.min(1, k * 5, (1 - k) * 3));
  });
  dream(t, [hx, hy]); // dream bubble while she sleeps: dream.js
};
seek(0);
</script>
