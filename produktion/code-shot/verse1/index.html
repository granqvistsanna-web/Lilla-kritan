<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;background:#fff}svg{display:block}</style>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- Hand-drawn "boil": the edges wobble, re-seeded ~10 times a second. -->
    <filter id="boil" filterUnits="userSpaceOnUse" x="-100" y="-100" width="2120" height="1280">
      <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
      <feDisplacementMap in="SourceGraphic" scale="6"/>
    </filter>
    <!-- Duckling layers, in the source image's own 1024px coordinates. -->
    <clipPath id="above"><rect width="1024" height="800"/></clipPath>
    <clipPath id="below"><rect y="800" width="1024" height="224"/></clipPath>
    <clipPath id="wingClip"><ellipse cx="660" cy="560" rx="80" ry="68"/></clipPath>
    <clipPath id="beakTop"><rect width="1024" height="408"/></clipPath>
    <clipPath id="beakBot"><rect y="408" width="1024" height="616"/></clipPath>
  </defs>
  <g id="cam">
  <image href="../../backgrounds/morning-garden.png" width="1920" height="1080" preserveAspectRatio="xMidYMid slice"/>
  <circle cx="217" cy="189" r="106" fill="#f7d65a" opacity=".75" style="mix-blend-mode:multiply"/> <!-- warms the plate's pale sun, keeps its grain -->
  <g id="rays" filter="url(#boil)" stroke-linecap="round"></g>
  <g filter="url(#boil)">
    <image id="ball" href="../../characters/cut/ball-red-crayon.png" width="1024" height="1024"/>
    <g id="duck">
      <g id="legs"><image href="../../characters/cut/duckling-faceless.png" width="1024" height="1024" clip-path="url(#below)"/></g>
      <g id="body">
        <image href="../../characters/cut/duckling-faceless.png" width="1024" height="1024" clip-path="url(#above)"/>
        <!-- Patch of plain body texture over the drawn wing, so only the moving wing shows. -->
        <g clip-path="url(#wingClip)"><image href="../../characters/cut/duckling-faceless.png" width="1024" height="1024" x="170" y="20"/></g>
        <g id="wing" clip-path="url(#wingClip)"><image href="../../characters/cut/duckling-faceless.png" width="1024" height="1024"/></g>
        <!-- Face, drawn in code. -->
        <ellipse id="mouth" cx="395" cy="410" rx="62" ry="0" fill="#7a2a1c"/>
        <image id="beakLow" href="../../characters/cut/duckling-beak.png" width="1024" height="1024" clip-path="url(#beakBot)"/>
        <image href="../../characters/cut/duckling-beak.png" width="1024" height="1024" clip-path="url(#beakTop)"/>
        <g id="eyeL">
          <g class="open"><circle r="26" fill="#fff" stroke="#1d1d1d" stroke-width="6"/><circle class="pupil" r="10" fill="#1d1d1d"/></g>
          <path class="happy" d="M-22 8 Q0 -18 22 8" fill="none" stroke="#1d1d1d" stroke-width="7" stroke-linecap="round"/>
        </g>
        <g id="eyeR">
          <g class="open"><circle r="26" fill="#fff" stroke="#1d1d1d" stroke-width="6"/><circle class="pupil" r="10" fill="#1d1d1d"/></g>
          <path class="happy" d="M-22 8 Q0 -18 22 8" fill="none" stroke="#1d1d1d" stroke-width="7" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </g>
  </g>
</svg>
<script>
// Verse 1 (song v2 20.055–30.349): sun push-in, Kvack waddles into the garden, the red ball bounces in, she bumps it away.
// Render: node ~/.claude/skills/launch-video/scripts/render.mjs <this folder>
// Add the song: ffmpeg -i launch.mp4 -ss 20.055 -i "audio/Lilla Kvack v2.m4a" -map 0:v -map 1:a -t 10.294 -c:v copy -c:a aac out.mp4
const GROUND = 920, X = 760, STEP = 0.3235;
function bounce(t0, t1, x0, x1, y, hops, height, steps = 32) {
  const keys = [], d = (t1 - t0) / hops, dx = (x1 - x0) / hops;
  for (let i = 0; i < hops; i++) {
    const h = height * Math.pow(0.6, i);
    for (let s = 0; s <= steps; s++) {
      if (i && !s) continue;
      const k = s / steps;
      keys.push([t0 + d * (i + k), x0 + dx * (i + k), y - h * 4 * k * (1 - k)]);
    }
  }
  return keys;
}
const hop = (t0, t1, x0, x1, h) => bounce(t0, t1, x0, x1, GROUND, 1, h).slice(1);

// Clip time 0 = song 20.055. Lines: 0–2.627 (sun), 2.627–5.193 (walk in), 5.193–7.748 (ball), 7.748–10.294 (bump).
const KEYS = [
  [0, -300, GROUND], [2.627, -300, GROUND], [4.25, X, GROUND],   // waddles in
  [8.0, X, GROUND], ...hop(8.0, 8.3, X, X + 60, 40),             // bump
  [9.0, X + 60, GROUND], ...hop(9.0, 9.35, X + 60, X + 60, 90), ...hop(9.65, 10.0, X + 60, X + 60, 90), // happy hops
  [10.294, X + 60, GROUND],
];
const R = 40, BX = X + 200; // ball radius; where the ball stops, at Kvack's feet
const BALL_KEYS = [
  [0, 2150, GROUND - R], [5.25, 2150, GROUND - R], ...bounce(5.3, 7.0, 2050, BX, GROUND - R, 4, 260),
  [8.28, BX, GROUND - R], [9.6, 1750, GROUND - R], [10.294, 1790, GROUND - R], // bumped: rolls away, slowing down
];
const WALK = [2.627, 4.25];
const FACE = [ // [from, to, eyes, look]; eyes: open | happy | big; look: -1 left, 1 right, 'ball'
  [0, 4.35, 'open', 0], [4.35, 4.75, 'open', -1], [4.75, 5.3, 'open', 1], [5.3, 5.7, 'big', 'ball'],
  [5.7, 7.1, 'open', 'ball'], [7.1, 8.0, 'happy'], [8.0, 9.0, 'open', 'ball'], [9.0, 10.294, 'happy'],
];
const BLINKS = [3.4, 7.5];
// Sung lines: [start, eighth length, syllables]
const LINES = [[0, 0.328, 7], [2.627, 0.321, 7], [5.193, 0.319, 7], [7.748, 0.318, 7]];

const lerp = (a, b, k) => a + (b - a) * k;
function at(keys, t) {
  let i = keys.findIndex(k => k[0] > t);
  if (i === -1) return keys.at(-1);
  if (i === 0) return keys[0];
  const a = keys[i - 1], b = keys[i], k = (t - a[0]) / (b[0] - a[0]);
  return [t, lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
}
function squash(keys, t, ground) {
  const lift = t => ground - at(keys, t)[2], air = t => lift(t) > 1;
  // Squash eases in and out around each touchdown instead of snapping; stretch with vertical speed.
  let d = 1;
  for (let k = -45; k <= 45; k++) if (air(t + k * .004) !== air(t)) d = Math.min(d, Math.abs(k) / 45); // touchdown within ±0.18s, fine steps
  let peak = 0;
  for (let k = -30; k <= 30; k++) peak = Math.max(peak, lift(t + k * .01));
  const a = (1 - d) ** 2 * Math.min(1, peak / 80);
  const vy = Math.abs(lift(t + .02) - lift(t - .02)) / .04, st = 1 + Math.min(vy / 4000, .14);
  return [1 / Math.sqrt(st) + .12 * a, st - .16 * a];
}
const ease = k => k * k * (3 - 2 * k);
function sing(t) {
  for (const [s, e, n] of LINES) {
    const i = Math.floor((t - s) / e), ph = (t - s) / e - i;
    if (i >= 0 && i < n) return ph < .7 ? Math.sin(Math.PI * ph / .7) : 0;
  }
  return 0;
}

const $ = id => document.getElementById(id);
const K = 400 / 805, BALL = 770;
const EYES = { eyeL: [320, 335], eyeR: [537, 345] };
// Sun rays drawn in code around the sun in the plate: alternating long and short crayon strokes that turn slowly and pulse.
const SUN = [217, 189, 110];
$('rays').innerHTML = Array.from({ length: 14 }, (_, i) =>
  `<line class="ray" stroke="${i % 2 ? '#f2b544' : '#f5d75a'}" stroke-width="${i % 2 ? 13 : 17}"/>`).join('');
window.DURATION = 10.294;
window.ready = Promise.all([...document.querySelectorAll('image')].map(i =>
  new Promise(r => { i.addEventListener('load', r); setTimeout(r, 3000); })));

window.seek = (t, f = 0) => {
  $('turb').setAttribute('seed', Math.floor(f / 3) % 50 + 1);

  // Camera: slow push-in on the sun for the first line, then a cut to the wide garden.
  const z = t < 2.627 ? lerp(1.35, 1.75, ease(t / 2.627)) : 1, [cx, cy] = [210, 190];
  const tx = Math.min(0, Math.max(1920 - 1920 * z, 960 - z * cx)), ty = Math.min(0, Math.max(1080 - 1080 * z, 540 - z * cy));
  $('cam').setAttribute('transform', `translate(${tx} ${ty}) scale(${z})`);

  // Sun rays.
  const [scx, scy, sr] = SUN;
  $('rays').setAttribute('transform', `rotate(${t * 9} ${scx} ${scy})`);
  $('rays').querySelectorAll('.ray').forEach((l, i) => {
    const ang = i / 14 * 2 * Math.PI, len = (i % 2 ? 45 : 75) * (1 + .18 * Math.sin(t * 3.2 + i * 1.3));
    const r0 = sr + 28, r1 = r0 + len;
    l.setAttribute('x1', scx + r0 * Math.cos(ang)); l.setAttribute('y1', scy + r0 * Math.sin(ang));
    l.setAttribute('x2', scx + r1 * Math.cos(ang)); l.setAttribute('y2', scy + r1 * Math.sin(ang));
  });

  // Ball.
  const [, bx, by] = at(BALL_KEYS, t), [bsx, bsy] = squash(BALL_KEYS, t, GROUND - R);
  const spin = -(2150 - bx) / R * 180 / Math.PI % 360;
  $('ball').setAttribute('transform', `translate(${bx} ${by + R}) scale(${bsx * 2 * R / BALL} ${bsy * 2 * R / BALL}) translate(0 -385) rotate(${spin}) translate(-512 -515)`);

  // Kvack: waddle while walking (rock + bob on each step), flipped to face right.
  let [, x, y] = at(KEYS, t), [sx, sy] = squash(KEYS, t, GROUND), tilt = 0;
  if (t >= WALK[0] && t < WALK[1]) {
    const p = (t - WALK[0]) / STEP;
    tilt = 7 * Math.sin(Math.PI * p);
    y -= 14 * Math.sin(Math.PI * p) ** 2;
  }
  if (t >= 8.0 && t < 8.35) tilt = -10 * Math.sin(Math.PI * (t - 8.0) / .35); // lean into the bump
  sy *= 1 + .015 * Math.sin(t * 3);
  $('duck').setAttribute('transform', `translate(${x} ${y}) rotate(${tilt}) scale(${-K} ${K}) translate(-510 -905)`);
  $('body').setAttribute('transform', `translate(510 800) scale(${sx} ${sy}) translate(-510 -800)`);
  const tuck = 1 - .2 * Math.min(1, Math.max(0, GROUND - y - 15) / 40); // legs tuck in gradually
  $('legs').setAttribute('transform', `translate(510 800) scale(1 ${tuck}) translate(-510 -800)`);
  const wave = t >= 9.0 ? -55 + 30 * Math.sin((t - 9.0) * 2 * Math.PI * 2.5) : 0;
  $('wing').setAttribute('transform', wave ? `translate(120 -30) rotate(${wave} 610 520)` : '');

  // Face. The art faces left and is flipped, so a screen-right look is a negative x in image space.
  const [, , eyes, look] = FACE.find(e => t >= e[0] && t < e[1]) || FACE.at(-1);
  const dir = look === 'ball' ? Math.max(-1, Math.min(1, (bx - x) / 300)) : look || 0;
  const blink = BLINKS.some(b => Math.abs(t - b) < .06) ? .08 : 1, big = eyes === 'big' ? 1.3 : 1;
  for (const [id, [ex, ey]] of Object.entries(EYES)) {
    const e = $(id), happy = eyes === 'happy';
    e.setAttribute('transform', `translate(${ex} ${ey}) scale(${big} ${big * blink})`);
    e.querySelector('.open').style.display = happy ? 'none' : '';
    e.querySelector('.happy').style.display = happy ? '' : 'none';
    const pupil = e.querySelector('.pupil');
    pupil.setAttribute('cx', -dir * 9);
    pupil.setAttribute('cy', look === 'ball' ? Math.min(6, (by - 700) / 40) : 0);
  }
  const open = Math.max(sing(t), eyes === 'big' ? .8 : 0);
  $('beakLow').setAttribute('transform', `translate(0 ${open * 26})`);
  $('mouth').setAttribute('ry', open * 22);
};
seek(0);
</script>
