<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miniatyrer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Roboto:wght@400;500&display=block">
<style>
  :root { --bg:#fff; --fg:#0f0f0f; --mute:#606060; --bar:#f2f2f2; --chip:#0f0f0f; --chipfg:#fff; }
  :root[data-theme="dark"] { --bg:#0f0f0f; --fg:#f1f1f1; --mute:#aaa; --bar:#272727; --chip:#f1f1f1; --chipfg:#0f0f0f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:Roboto, system-ui, sans-serif; }
  .bar { position:sticky; top:0; z-index:5; display:flex; gap:6px; flex-wrap:wrap; padding:10px 16px; background:var(--bar); }
  .bar button { font:500 13px Roboto; border:0; border-radius:999px; padding:7px 12px; background:transparent; color:var(--fg); cursor:pointer; }
  .bar button.on { background:var(--chip); color:var(--chipfg); }
  main { padding:20px 16px 60px; max-width:1400px; margin:0 auto; }
  .stora { display:grid; grid-template-columns:repeat(auto-fill, minmax(380px, 1fr)); gap:22px; }
  .stora h3 { font:500 13px Roboto; color:var(--mute); margin:0 0 6px; }
  .stora svg { width:100%; height:auto; display:block; border-radius:12px; }
  .lbl { font:500 12px Roboto; color:var(--mute); margin:34px 0 10px; text-transform:uppercase; letter-spacing:.06em; }
  .rad { display:flex; gap:14px; flex-wrap:wrap; align-items:flex-start; }
  .kort { width:var(--w); }
  .kort .t { position:relative; }
  .kort svg { width:100%; height:auto; display:block; border-radius:8px; }
  .tid { position:absolute; right:5px; bottom:5px; background:rgba(0,0,0,.8); color:#fff; font:500 12px Roboto; padding:1px 4px; border-radius:4px; }
  .kort h4 { margin:8px 0 2px; font:500 13px/1.35 Roboto; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .kort p { margin:0; font-size:12px; color:var(--mute); }
  /* en enda miniatyr, för render: hela fönstret, inga marginaler */
  body.en-bild { background:#000; } body.en-bild .bar { display:none; } body.en-bild main { padding:0; max-width:none; }
  body.en-bild svg { width:100vw; height:100vh; display:block; }
</style>
</head>
<body>
<!-- Miniatyrerna med färgstrimman (skill `miniatyrer`). Öppna från repots rot (python3 -m http.server) på /verktyg/miniatyr.html.
     Granskning: alla stort och i mobilstorlek med tidsbrickan. Tangenter: e språk, d mörkt flöde, k kanalnamn.
     En enda bild för render: ?id=014&en  (verktyg/miniatyr-render.mjs) -->
<div class="bar" id="bar"></div>
<main id="ut"></main>
<script src="miniatyr.js"></script>
<script>
// Varje miniatyr: hjältebilden utan text (1280×720), strimmans färg och per språk videons längd (tid, ur filmen: ffprobe), titeln och
// YouTube-titeln (för flödet). Cirkeln visar längden avrundad till hela minuter (3:05 → 3 min, 3:34 → 4 min); svenska och engelska
// klippen är olika långa, så varje språk har sin egen tid.
// ut: mappen bilderna sparas i (standard: hjältebildens mapp). hjalte: [skala, x, y] = hjältens nederkant mitt i bilden; den hamnar vid (870, 705) och bilden zoomas in. Utan = bilden som den är.
const MINIATYRER = [
  { id:'014', bild:'avsnitt/014-grona-traktorn/thumbnail/miniatyr-utan-text.png', farg:'#3E9B35',
    b:{ hjalte:[1.3, 800, 531], test:'ansiktet närmare' },
    sv:{ tid:'3:37', titel:['Gröna','sången'], yt:'Gröna sången 🚜💚 | Färgsång för barn – leoparden letar grönt | Lilla Kritan' },
    en:{ tid:'3:32', titel:['Green','Song'], yt:'The Green Song 🚜💚 | Color Song for Kids – the leopard looks for green | Tiny Crayon TV' } },
  { id:'007', bild:'avsnitt/007-bruna-ladbilen/thumbnail/miniatyr-utan-text.png', farg:'#8B4E24', hjalte:[1.12, 945, 650],
    sv:{ tid:'3:38', titel:['Bruna','sången'], yt:'Bruna sången 🚚🤎 | Barnsång om färger – björnen letar brunt | lilla kritan' },
    en:{ tid:'3:24', titel:['Brown','Song'], yt:'The Brown Song 🚚🤎 | Color Song for Kids – the bear looks for brown | Tiny Crayon TV' } },
  { id:'006', bild:'avsnitt/006-orange-baten/thumbnail/miniatyr-utan-text.png', farg:'#F26B1D', hjalte:[1.12, 900, 665],
    sv:{ tid:'3:48', titel:['Orangea','sången'], yt:'Orangea sången ⛵🧡 | Barnsång om färger – dinon letar orange | lilla kritan' },
    en:{ tid:'3:33', titel:['Orange','Song'], yt:'The Orange Song ⛵🧡 | Color Song for Kids – the dino looks for orange | Tiny Crayon TV' } },
  { id:'005', bild:'avsnitt/005-rosa-bilen/thumbnail/miniatyr-utan-text.png', farg:'#F06EAA', hjalte:[1.15, 915, 660],
    sv:{ tid:'3:05', titel:['Rosa','sången'], yt:'Rosa sången 🚗💗 | Barnsång om färger – musen letar rosa | lilla kritan' },
    en:{ tid:'3:34', titel:['Pink','Song'], yt:'The Pink Song 🚗💗 | Color Song for Kids – the mouse looks for pink | Tiny Crayon TV' } },
  { id:'004', bild:'avsnitt/004-bussen-badar/thumbnail/miniatyr-utan-text.png', farg:'#F6C21C', hjalte:[1.15, 900, 640],
    sv:{ tid:'3:37', titel:['Vi ska','bada!'], yt:'Vi ska bada! 🚌💦 | Barnsång om bussen, grodan och ankan | lilla kritan' },
    en:{ tid:'4:16', titel:["Let's Go",'Swimming!'], yt:"Let's Go Swimming! 🚌🌊 | Kids Song | Tiny Crayon TV" } },
  { id:'mix-2', ut:'produktion/youtube/mix/mix-2/thumbnail', bild:'avsnitt/005-rosa-bilen/thumbnail/miniatyr-utan-text.png', farg:'#8E44C9', hjalte:[1.15, 915, 660],
    sv:{ tid:'25:10', titel:['Alla','sångerna'], yt:'Alla färgsångerna 🌈 | 25 minuter barnsånger | lilla kritan' },
    en:{ tid:'25:10', titel:['All the','Songs'], yt:'All the Color Songs 🌈 | 25 minutes of kids songs | Tiny Crayon TV' } },
];
// A/B: `b: { … }` på en rad ger en B-bild direkt efter A, med bara det som står i b ändrat (en sak i taget) och `test:` = vad som prövas.
// Den renderas som miniatyr-strimma-b.png och -b-en.png. Testet görs för hand, se skill `miniatyrer` (YouTubes Test & Compare
// fungerar inte för barnvideor).
for (let i = MINIATYRER.length - 1; i >= 0; i--) {
  const a = MINIATYRER[i];
  if (a.b) MINIATYRER.splice(i + 1, 0, { ...a, ...a.b, id: `${a.id}-b`, variant: 'b', b: undefined });
}
const KANAL = { sv:'lilla kritan', en:'tiny crayon tv' }, KANAL_UNDER = { sv:'Lilla Kritan · 1,2 tn visningar', en:'Tiny Crayon TV · 1.2K views' };
const q = new URLSearchParams(location.search);
let lang = q.has('en') ? 'en' : 'sv', medKanal = q.has('kanal');
const ROT = '../';

function hjalteBild(m) {
  if (!m.hjalte) return `<image href="${ROT}${m.bild}" width="1280" height="720"/>`;
  const [s, bx, by] = m.hjalte;
  let tx = 870 - bx * s, ty = 705 - by * s;
  tx = Math.min(0, Math.max(1280 - 1280 * s, tx)); ty = Math.min(0, Math.max(720 - 720 * s, ty));   // bilden täcker alltid rutan
  return `<image href="${ROT}${m.bild}" width="1280" height="720" transform="translate(${tx} ${ty}) scale(${s})"/>`;
}
const svgTom = m => `<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" data-id="${m.id}" role="img" aria-label="${m[lang].yt}"><defs/>${hjalteBild(m)}<g class="topp"/></svg>`;
const minuter = tid => { const [m, sek] = tid.split(':').map(Number); return String(Math.round(m + sek / 60)); };
const kort = (m, w) => `<div class="kort" style="--w:${w}px"><div class="t">${svgTom(m)}<span class="tid">${m[lang].tid}</span></div><h4>${m[lang].yt}</h4><p>${KANAL_UNDER[lang]}</p></div>`;

async function rita() {
  const ut = document.getElementById('ut');
  if (q.has('id')) {
    document.body.classList.add('en-bild');
    ut.innerHTML = svgTom(MINIATYRER.find(m => m.id === q.get('id')));
  } else {
    ut.innerHTML = `<div class="stora">${MINIATYRER.map(m => `<div><h3>${m.id}${m.test ? ` · B: ${m.test}` : ''}</h3>${svgTom(m)}</div>`).join('')}</div>
      <p class="lbl">Mobil, nästa video (168 px)</p><div class="rad">${MINIATYRER.map(m => kort(m, 168)).join('')}</div>
      <p class="lbl">Startsida, dator (320 px)</p><div class="rad">${MINIATYRER.slice(0, 3).map(m => kort(m, 320)).join('')}</div>`;
    document.getElementById('bar').innerHTML = [
      `<button data-k="e" class="${lang === 'en' ? 'on' : ''}">e ${lang === 'sv' ? 'svenska' : 'english'}</button>`,
      `<button data-k="k" class="${medKanal ? 'on' : ''}">k kanalnamn ${medKanal ? 'på' : 'av'}</button>`,
      `<button data-k="d">d mörkt flöde</button>`].join('');
  }
  for (const svg of document.querySelectorAll('svg[data-id]')) {
    const m = MINIATYRER.find(x => x.id === svg.dataset.id);
    await miniatyr.strimma(svg.querySelector('.topp'), { farg: m.farg, titel: m[lang].titel, cirkel: [minuter(m[lang].tid), 'min'], kanal: medKanal ? KANAL[lang] : '' });
  }
  document.body.dataset.klar = '1';
}
function gor(k) {
  if (k === 'e') lang = lang === 'sv' ? 'en' : 'sv';
  else if (k === 'k') medKanal = !medKanal;
  else if (k === 'd') { document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; return; }
  else return;
  rita();
}
document.addEventListener('click', e => { const b = e.target.closest('button[data-k]'); if (b) gor(b.dataset.k); });
document.addEventListener('keydown', e => { if (!e.metaKey && !e.ctrlKey) gor(e.key); });
rita();
</script>
</body>
</html>
