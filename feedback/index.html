<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Feedback</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap">
<link rel="stylesheet" href="https://granqvistsanna-web.github.io/pumice/tokens.css">
<style>
/* Pumice: washes instead of borders, pills for controls, 28px cards, the ink pill is the only accent.
   Signal colours mark content only (status dots, tag dots). Three tabs on top; a video opens in its own view. */
:root { --c-bild: var(--ember); --c-ljud: var(--signal); --c-tempo: #7c4dbd; --c-text: #8a6100; --c-bra: var(--ok); --warn: #8a6100; }
:root[data-theme="dark"] { --c-tempo: #b896ec; --c-text: #e0b04a; --warn: #e0b04a; --ember: #f08a5d; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --c-tempo: #b896ec; --c-text: #e0b04a; --warn: #e0b04a; --ember: #f08a5d; } }

* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink-2); font: 400 15px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
button { font: inherit; color: inherit; }
.inner { max-width: calc(var(--w-wide) + 2 * var(--gutter)); margin: 0 auto;
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px)); }

/* Top bar */
.top { position: sticky; top: 0; z-index: 10; background: var(--frost); backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3); box-shadow: 0 1px 0 var(--hairline); }
.top .inner { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--s-6); min-height: var(--h-topbar); }
.brand { font: 500 18px/1 var(--font-ui); letter-spacing: -0.01em; color: var(--ink); margin: 0; }
.tabs { display: inline-flex; gap: var(--s-1); background: var(--wash); border-radius: var(--r-pill); padding: 3px; }
.tab { border: 0; background: none; height: 34px; padding: 0 var(--s-7); border-radius: var(--r-pill); font-weight: 500; font-size: 14px; color: var(--ink-3); cursor: pointer; display: inline-flex; align-items: center; gap: var(--s-3); white-space: nowrap;
  transition: background var(--t-color), color var(--t-color), box-shadow var(--t-color), transform var(--t-press) var(--spring); }
.tab:hover { color: var(--ink); }
.tab:active { transform: scale(var(--press-chip)); }
.tab[aria-current="true"] { background: var(--thumb); color: var(--ink); box-shadow: var(--shadow-1); }
.right { display: flex; gap: var(--s-6); align-items: center; justify-content: flex-end; }
.updated { font-size: 12px; color: var(--ink-4); font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 760px) {
  .top .inner { grid-template-columns: 1fr auto; padding-block: var(--s-4); row-gap: var(--s-4); }
  .tabs { grid-column: 1 / -1; grid-row: 2; justify-self: stretch; display: flex; }
  .tab { flex: 1; justify-content: center; padding: 0 var(--s-4); }
  .updated { display: none; }
}
@media (max-width: 380px) { .tab { font-size: 13px; } }

main { padding-block: var(--s-9) var(--s-13); }
.vhead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--s-6); margin-bottom: var(--s-8); }
h1 { font: 500 30px/1.08 var(--font-ui); letter-spacing: -0.012em; color: var(--ink); margin: 0 0 var(--s-3); text-wrap: balance; }
h2.sec { font: 500 13px/1.6 var(--font-ui); color: var(--ink-4); margin: var(--s-10) 0 var(--s-6); display: flex; gap: var(--s-4); align-items: center; }
h2.sec:first-of-type { margin-top: 0; }
.lead { color: var(--ink-4); margin: 0; max-width: 60ch; }
.status { font-size: 13px; color: var(--warn); font-weight: 500; }

/* Shared bits */
.cnt { font: 500 11px/18px var(--font-ui); font-variant-numeric: tabular-nums; padding: 0 7px; border-radius: var(--r-pill); background: var(--wash); color: var(--ink-4); }
.tab[aria-current="true"] .cnt:not(.hot) { background: var(--wash); }
.cnt.hot { background: var(--ink); color: var(--on-ink); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-5); flex: none; display: inline-block; }
.dot.granska { background: var(--ember); } .dot.pagar { background: var(--warn); } .dot.klar { background: var(--ok); } .dot.live { background: var(--signal); } .dot.arkiv, .dot.plan { background: var(--rule); }
.num { font: 500 12px var(--font-code); color: var(--ink-4); }
.btn { font: 500 14px var(--font-ui); border: 0; border-radius: var(--r-pill); height: var(--h-button); padding: 0 var(--s-8); cursor: pointer; background: var(--ink); color: var(--on-ink); display: inline-flex; align-items: center; justify-content: center; gap: var(--s-3); white-space: nowrap; text-decoration: none;
  transition: transform var(--t-press) var(--spring), background var(--t-color), opacity var(--t-color); }
.btn:hover { opacity: .88; }
.btn:active { transform: scale(var(--press)); }
.btn.ghost { background: var(--wash); color: var(--ink); }
.btn.ghost:hover { background: var(--wash-2); opacity: 1; }
.btn.small { height: var(--h-chip); padding: 0 var(--s-6); font-size: 13px; }
.btn:disabled { opacity: .4; cursor: default; transform: none; }
.chip { text-decoration: none; border: 0; background: var(--wash); color: var(--ink-2); height: var(--h-chip); padding: 0 var(--s-6); border-radius: var(--r-pill); font-weight: 500; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: var(--s-3);
  transition: background var(--t-color), color var(--t-color), transform var(--t-press) var(--spring); }
.chip:hover { background: var(--wash-2); }
.chip:active { transform: scale(var(--press-chip)); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.chip[data-cat]::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.chip[aria-pressed="true"][data-cat]::before { background: var(--on-ink); }
[data-cat="bild"] { --c: var(--c-bild); } [data-cat="ljud"] { --c: var(--c-ljud); } [data-cat="tempo"] { --c: var(--c-tempo); } [data-cat="text"] { --c: var(--c-text); } [data-cat="bra"] { --c: var(--c-bra); }
.empty { color: var(--ink-4); padding: var(--s-10) 0; text-align: center; }

/* Att granska: cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: var(--s-8) var(--s-7); }
.vcard { display: grid; gap: var(--s-4); border: 0; padding: 0; background: none; text-align: left; cursor: pointer; min-width: 0; }
.thumb { position: relative; aspect-ratio: 16 / 9; border-radius: var(--r-inner); overflow: hidden; background: var(--surface-2); transition: transform var(--t-move) var(--spring), box-shadow var(--t-move); }
.vcard:hover .thumb { transform: translateY(-2px); box-shadow: var(--lift); }
.vcard:active .thumb { transform: scale(.985); }
.thumb video, .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .tl { position: absolute; left: var(--s-4); top: var(--s-4); display: flex; gap: var(--s-2); }
.thumb .tr { position: absolute; right: var(--s-4); top: var(--s-4); }
.pill { font: 500 11px/22px var(--font-ui); padding: 0 var(--s-4); border-radius: var(--r-pill); background: var(--scrim); color: #fff; backdrop-filter: blur(6px); white-space: nowrap; }
.pill.ink { background: var(--ink); color: var(--on-ink); }
.cmeta { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: var(--s-4); align-items: baseline; padding-inline: var(--s-1); }
.cmeta .name { color: var(--ink); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmeta .when { grid-column: 2; font-size: 12.5px; color: var(--ink-4); font-variant-numeric: tabular-nums; }
.cmeta .when.new { color: var(--ember); }

/* Att göra + Alla: lists on a surface */
.panel { background: var(--surface); border-radius: var(--r-card); padding: var(--s-4) var(--s-8); }
.todo-ep + .todo-ep { margin-top: var(--s-6); }
.todo-ep h3 { margin: 0; padding: var(--s-6) 0 var(--s-3); border-bottom: 1px solid var(--hairline); display: flex; gap: var(--s-4); align-items: center; font: 500 16px var(--font-ui); }
.todo-ep h3 button { border: 0; background: none; padding: 0; cursor: pointer; color: var(--ink); text-align: left; font: inherit; }
.todo-ep h3 button:hover { color: var(--ink-3); }
.item { display: grid; grid-template-columns: auto 58px minmax(0, 1fr) auto; gap: var(--s-6); align-items: start; padding: var(--s-6) 0; border-top: 1px solid var(--hairline); }
.todo-ep .item:first-of-type, .comments .item:first-child { border-top: 0; }
.item .t { font: 500 13px/26px var(--font-code); border-radius: var(--r-pill); border: 0; background: var(--wash); color: var(--ink); cursor: pointer; text-align: center; transition: background var(--t-color), transform var(--t-press) var(--spring); }
.item .t:not([disabled]):hover { background: var(--ink); color: var(--on-ink); }
.item .t[disabled] { color: var(--ink-4); cursor: default; font: 500 12px/26px var(--font-ui); }
.item .body { min-width: 0; overflow-wrap: anywhere; color: var(--ink-2); }
.mini { display: flex; flex-wrap: wrap; gap: var(--s-2); margin-bottom: var(--s-2); }
.mini span { --c: var(--ink-4); font: 500 11px/20px var(--font-ui); padding: 0 var(--s-4); border-radius: var(--r-pill); color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); }
.mini span.old { --c: var(--ink-4); background: var(--wash); }
.item.fixed .body, .item.fixed .t { opacity: .45; }
.item.fixed .body { text-decoration: line-through; text-decoration-color: var(--rule); }
.check { appearance: none; width: 22px; height: 22px; margin: 2px 0 0; border-radius: 50%; border: 0; background: var(--wash-2); cursor: pointer; display: grid; place-items: center; transition: background var(--t-color), transform var(--t-press) var(--spring); }
.check:hover { background: var(--fill); }
.check:active { transform: scale(var(--press-icon)); }
.check:checked { background: var(--ok); }
.check:checked::after { content: ""; width: 6px; height: 11px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
.del { border: 0; background: none; color: var(--ink-5); cursor: pointer; font-size: 18px; line-height: 1; min-width: 28px; height: 28px; border-radius: var(--r-pill); }
.del:hover { color: var(--ink); background: var(--wash); }

.filters { display: flex; flex-wrap: wrap; gap: var(--s-3); align-items: center; margin-bottom: var(--s-7); }
.search { height: var(--h-field); width: min(100%, 260px); font: 400 14px var(--font-ui); color: var(--ink); background: var(--wash); border: 0; border-radius: var(--r-pill); padding: 0 var(--s-7); margin-left: auto; }
.search:focus { background: var(--elev); box-shadow: var(--ring); outline: none; }
.rows { display: grid; }
.vrow { display: grid; grid-template-columns: 70px minmax(0, 1fr) 150px 120px 40px; gap: var(--s-6); align-items: center; min-height: var(--h-row); padding: var(--s-3) var(--s-6); margin-inline: calc(-1 * var(--s-6)); border: 0; background: none; text-align: left; cursor: pointer; border-radius: var(--r-row); }
.vrow:hover { background: var(--wash); }
.vrow .name { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vrow .st { display: flex; gap: var(--s-3); align-items: center; font-size: 13px; color: var(--ink-3); }
.vrow .when { font-size: 13px; color: var(--ink-4); font-variant-numeric: tabular-nums; }
@media (max-width: 640px) { .vrow { grid-template-columns: 56px minmax(0, 1fr) 36px; } .vrow .st, .vrow .when { display: none; } }

/* Assets */
.agrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: var(--s-7) var(--s-6); }
.asset { display: grid; gap: var(--s-3); text-decoration: none; color: var(--ink-2); min-width: 0; }
.asset .pic { aspect-ratio: 1; border-radius: var(--r-inner); background: var(--surface); display: grid; place-items: center; overflow: hidden; transition: transform var(--t-move) var(--spring), box-shadow var(--t-move); }
.asset .pic img { width: 100%; height: 100%; object-fit: contain; }
.asset .pic.bg img { object-fit: cover; }
.asset:hover .pic { transform: translateY(-2px); box-shadow: var(--lift); }
.asset span { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-inline: var(--s-1); }

/* Review view */
.back { border: 0; background: none; padding: 0; color: var(--ink-4); cursor: pointer; font-size: 14px; margin-bottom: var(--s-4); display: inline-flex; gap: var(--s-2); }
.back:hover { color: var(--ink); }
.meta { display: flex; flex-wrap: wrap; gap: var(--s-2) var(--s-7); align-items: center; color: var(--ink-4); font-size: 13px; font-variant-numeric: tabular-nums; }
.meta b { color: var(--ink-2); font-weight: 500; }
.acts { display: flex; gap: var(--s-4); align-items: center; }
.more { position: relative; }
.more summary { list-style: none; }
.more summary::-webkit-details-marker { display: none; }
.menu { position: absolute; right: 0; top: calc(100% + 8px); z-index: 5; width: 260px; background: var(--elev); border-radius: var(--r-menu); box-shadow: var(--float), var(--menu-ring); padding: var(--s-4); display: grid; gap: var(--s-1); }
.menu button, .menu a { border: 0; background: none; text-align: left; padding: var(--s-4) var(--s-6); border-radius: var(--r-row); cursor: pointer; color: var(--ink); text-decoration: none; font-size: 14px; }
.menu button:hover, .menu a:hover { background: var(--wash); }
.menu label { font-size: 12px; color: var(--ink-4); padding: var(--s-3) var(--s-6) 0; }
.menu select { margin: 0 var(--s-4) var(--s-3); font: 500 14px var(--font-ui); color: var(--ink); background: var(--wash); border: 0; border-radius: var(--r-pill); height: var(--h-chip); padding: 0 var(--s-6); }
.menu .file { font-size: 12px; color: var(--ink-4); padding: var(--s-3) var(--s-6); overflow-wrap: anywhere; border-top: 1px solid var(--hairline); margin-top: var(--s-2); }

.review { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s-8); align-items: start; }
@media (min-width: 1000px) { .review { grid-template-columns: minmax(0, 1fr) 400px; } .review > .side { grid-column: 2; grid-row: 1 / span 2; position: sticky; top: calc(var(--h-topbar) + var(--s-7)); } .review > #pics { grid-column: 1; } }
/* choosing a background: the options come first on a phone */
@media (max-width: 999px) { .review.pickmode > #pics { order: -1; } }
.player { position: relative; background: var(--solid); border-radius: var(--r-inner); overflow: hidden; aspect-ratio: 16 / 9; display: grid; place-items: center; }
.player video { width: 100%; height: 100%; display: block; }
.player .none { color: var(--solid-ink); text-align: center; padding: var(--s-9); opacity: .85; }
.player .none a { color: inherit; font-weight: 500; }
/* comment markers along the timeline */
.marks { position: relative; height: 22px; margin: var(--s-3) 0 0; }
.marks::before { content: ""; position: absolute; left: 0; right: 0; top: 10px; height: 2px; border-radius: 2px; background: var(--wash-2); }
.mark { position: absolute; top: 3px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; border: 3px solid var(--bg); background: var(--ember); cursor: pointer; padding: 0; transition: transform var(--t-press) var(--spring); }
.mark:hover { transform: scale(1.25); }
.mark.fixed { background: var(--ink-5); }

/* Pick a background */
.picks { display: grid; gap: var(--s-8); }
.pick { border-radius: var(--r-card); padding: var(--s-4); background: var(--surface); transition: box-shadow var(--t-color), background var(--t-color); }
.pick.chosen { background: var(--elev); box-shadow: 0 0 0 2px var(--ink); }
.pick img { width: 100%; display: block; border-radius: calc(var(--r-card) - var(--s-4)); background: var(--wash); }
.pick .bar { display: flex; justify-content: space-between; align-items: center; gap: var(--s-6); padding: var(--s-5) var(--s-4) var(--s-3); }
.pick .bar b { color: var(--ink); font-weight: 500; }
.pick textarea { display: block; width: 100%; box-sizing: border-box; font: inherit; color: var(--ink); background: var(--elev); border: 0; border-radius: calc(var(--r-card) - var(--s-4)); box-shadow: var(--shadow-1); resize: vertical; min-height: 44px; padding: var(--s-4) var(--s-5); line-height: 1.5; outline: none; }
.pick textarea:focus-visible { box-shadow: 0 0 0 2px var(--ink); }
.stills { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: var(--s-6); margin-top: var(--s-6); }
.stills img { width: 100%; display: block; border-radius: var(--r-inner); background: var(--wash); }
.stills figure { margin: 0; } .stills figcaption { font-size: 13px; color: var(--ink-4); padding-top: var(--s-2); }

.side { background: var(--surface); border-radius: var(--r-card); padding: var(--s-6); display: grid; gap: var(--s-6); }
.side h3 { font: 500 16px var(--font-ui); color: var(--ink); margin: var(--s-2) var(--s-3) 0; display: flex; justify-content: space-between; align-items: center; gap: var(--s-4); }
.comments { display: grid; padding-inline: var(--s-3); max-height: 46vh; overflow: auto; }
@media (max-width: 999px) { .comments { max-height: none; } }
.comments .item { grid-template-columns: auto 52px minmax(0, 1fr) auto; gap: var(--s-5); }
.composer { background: var(--elev); border-radius: calc(var(--r-card) - var(--s-6)); padding: var(--s-5); display: grid; gap: var(--s-5); box-shadow: var(--shadow-1); }
.composer textarea { font: inherit; color: var(--ink); background: none; border: 0; resize: vertical; min-height: 76px; padding: var(--s-3) var(--s-4); outline: none; line-height: 1.5; }
.composer .row { display: flex; flex-wrap: wrap; gap: var(--s-3); align-items: center; }
.timechip { font-family: var(--font-code); }
.composer .foot { display: flex; justify-content: space-between; align-items: center; gap: var(--s-4); }
.hint { color: var(--ink-4); font-size: 12px; }
kbd { font: 500 10px/16px var(--font-code); color: var(--ink-4); border-radius: 5px; padding: 0 5px; background: var(--thumb); box-shadow: var(--shadow-1); }

.toast { position: fixed; z-index: 20; left: 50%; transform: translateX(-50%); bottom: calc(var(--s-8) + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--on-ink); padding: 0 var(--s-8); height: var(--h-button); display: flex; align-items: center; border-radius: var(--r-pill); font-size: 14px; font-weight: 500; box-shadow: var(--float); }
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: pop var(--t-open) var(--spring); }
  @keyframes pop { from { transform: translate(-50%, 10px) scale(.96); opacity: 0; } }
  .view:not([hidden]) { animation: rise var(--t-open) var(--rise) both; }
  @keyframes rise { from { transform: translateY(6px); opacity: .6; } }
}
@media (pointer: coarse) { .btn, .chip, .tab, .search { min-height: var(--h-touch); } }
@media (max-width: 520px) { h1 { font-size: 26px; } .panel { padding: var(--s-2) var(--s-7); border-radius: 22px; } .item { grid-template-columns: auto 52px minmax(0, 1fr) auto; gap: var(--s-5); } }
</style>
</head>
<body>
<header class="top">
  <div class="inner">
    <p class="brand">Feedback</p>
    <nav class="tabs" aria-label="Vyer">
      <button class="tab" type="button" data-tab="granska">Att granska <span class="cnt" id="nGranska"></span></button>
      <button class="tab" type="button" data-tab="todo">Att göra <span class="cnt" id="nTodo"></span></button>
      <button class="tab" type="button" data-tab="alla">Alla videor</button>
      <button class="tab" type="button" data-tab="assets">Assets</button>
    </nav>
    <div class="right"><span class="updated" id="updated"></span><button class="btn ghost small" type="button" id="keyBtn">Logga in</button></div>
  </div>
</header>

<main class="inner">
  <div class="status" id="dbStatus" style="margin-bottom:var(--s-6)"></div>

  <section class="view" id="v-granska" hidden>
    <div class="vhead"><div><h1>Att granska</h1><p class="lead" id="granskaLead"></p></div></div>
    <div id="granskaBody"></div>
  </section>

  <section class="view" id="v-todo" hidden>
    <div class="vhead"><div><h1>Att göra</h1><p class="lead" id="todoLead"></p></div>
      <button class="btn ghost" id="copyAllBtn" type="button">Kopiera all feedback</button></div>
    <div class="panel" id="todoBody"></div>
  </section>

  <section class="view" id="v-alla" hidden>
    <div class="vhead"><div><h1>Alla videor</h1><p class="lead" id="allaLead"></p></div></div>
    <div class="filters" id="filters"></div>
    <div class="panel"><div class="rows" id="rows"></div></div>
  </section>

  <section class="view" id="v-assets" hidden>
    <div class="vhead"><div><h1>Assets</h1><p class="lead" id="assetsLead"></p></div></div>
    <div class="filters" id="afilters"></div>
    <div class="agrid" id="agrid"></div>
  </section>

  <section class="view" id="v-video" hidden>
    <button class="back" type="button" id="backBtn">← Tillbaka</button>
    <div class="vhead">
      <div style="min-width:0"><h1 id="epTitle"></h1><div class="meta" id="epMeta"></div></div>
      <div class="acts">
        <details class="more" id="more"><summary class="btn ghost" aria-label="Fler val">•••</summary>
          <div class="menu">
            <label for="statusPick">Status</label><select id="statusPick"></select>
            <button type="button" id="linkBtn">Kopiera länk</button>
            <a id="ytLink" target="_blank" rel="noopener" hidden>Öppna på YouTube</a>
            <div class="file" id="file"></div>
          </div>
        </details>
        <button class="btn ghost" type="button" id="copyBtn">Kopiera feedback</button>
        <button class="btn" type="button" id="nextBtn">Klar, nästa →</button>
      </div>
    </div>
    <div class="review">
      <div class="stage">
        <div class="player" id="player"></div>
        <div class="marks" id="marks"></div>
      </div>
      <div id="pics"></div>
      <aside class="side">
        <h3><span id="countLbl">Kommentarer</span></h3>
        <div class="comments" id="comments"></div>
        <form class="composer" id="form" autocomplete="off">
          <textarea id="note" placeholder="Skriv vad som ska ändras. Videon pausas och tiden sparas."></textarea>
          <div class="row" id="tagRow"></div>
          <div class="foot">
            <button class="chip timechip" type="button" id="timeChip" title="Byt mellan tiden där videon står och hela videon">Hela videon</button>
            <button class="btn small" type="submit" id="addBtn">Spara <kbd style="background:transparent;box-shadow:none;color:inherit;opacity:.7">⌘↵</kbd></button>
          </div>
        </form>
      </aside>
    </div>
  </section>
</main>

<script>
const GROUPS = [
  { name: "Väntar på granskning", eps: [
    ["030","Borsta borsta, gulliga djur"],["033","Borsta borsta, dinosaurier"],
    ["026","Zebran går och lägger sig"],["027","Zebran plockar undan"],
    ["028","Leoparden bygger i sanden"],["029","Leoparden plockar äpplen"] ]},
  { name: "Pågår", eps: [
    ["016","Blinka lilla stjärna"],["017","Mors lilla Olle"],["011","Gula helikoptern"],
    ["031","Borsta borsta, bondgården"],["032","Borsta borsta, apan"],["025","Katten borstar tänderna"],
    ["018","Bada bada"] ]},
  { name: "Julkalender", eps: ["Stjärnan","Lammet tittut","Hunden snöflingor","Björnen pepparkaka","Grisen pulka","Leoparden ljus","Lammet julkula","Hunden snögubbe","Paketet","Ba ba vita lamm","Röda sången","Kaninen äter frukost","Tre pussel","Bruna sången","Lammet klär på sig","Björnen tvättar händerna","Tittut leoparden","Rosa sången","Tittut lammet","Björnen fyra ljus","Blinka lilla stjärna","Julgranen","Grisen granen","Julafton"].map((n, i) => ["J" + String(i + 1).padStart(2, "0"), n]) },
  { name: "Live", eps: [
    ["003","Bussen hälsar på"],["004","Vi ska bada!"],["005","Rosa bilen"],["006","Orangea sången"],
    ["007","Bruna sången"],["013","Röda sången"],["014","Gröna traktorn"],["015","Ba ba vita lamm"],
    ["019","Rosa favoritfärg"],["020","Grisen badar"],["021","Hunden leker"],["022","Kaninen äter frukost"],
    ["023","Björnen tvättar händerna"],["024","Lammet klär på sig"] ]},
];

const STATUSES = [["plan","Plan"],["pagar","Pågår"],["granska","Granska"],["klar","Klar att publicera"],["live","Live"],["arkiv","Arkiv"]];
// Five quick tags. Older notes carry the detailed keys below; they still show with their old names.
const TAGS = [["bild","Bild"],["ljud","Ljud"],["tempo","Tempo"],["text","Text"],["bra","Bra, behåll!"]];
const OLD = { "vit-kant":["bild","Vit kant för tjock"], stump:["bild","Stump/rot syns"], arm:["bild","Arm/vinkel konstig"], ansikte:["bild","Ansikte/ögon/mun"],
  snurr:["bild","Figuren vänds/snurrar"], studs:["bild","För studsigt/hektiskt"], sak:["bild","Sak fel/saknas"], glitch:["bild","Glitch/hopp"], sova:["bild","Sover stående"],
  kamera:["bild","Kamera/zoom"], malin:["ljud","Malin för tidigt/sent"], replik:["ljud","Repliken låter fel"], djurnamn:["ljud","Djurnamn sägs"], ljudniva:["ljud","Ljudnivå"],
  "ljud-saknas":["ljud","Ljud saknas"], "ljud-fel":["ljud","Fel ljudeffekt"], orden:["tempo","Bilden matchar inte orden"], timing:["tempo","Timing/takt"],
  "for-lang":["tempo","För långsamt"], "for-kort":["tempo","För snabbt"], klipp:["tempo","Klipp/övergång"], miniatyr:["text","Miniatyr/YouTube-text"] };
const catOf = k => TAGS.some(t => t[0] === k) ? k : (OLD[k] || [""])[0];
const tagName = k => (TAGS.find(t => t[0] === k) || [, (OLD[k] || [, k])[1]])[1];
const TYPES = [["alla","Alla"],["avsnitt","Avsnitt"],["jul","Julkalender"],["bg","Bakgrunder"],["ovrigt","Övrigt"]];
const typeOf = id => /^\d{3}/.test(id) ? "avsnitt" : /^J\d\d/.test(id) ? "jul" : id.startsWith("B-") ? "bg" : "ovrigt";
const ORDER = ["avsnitt", "jul", "ovrigt", "bg"];

let ALL = GROUPS.flatMap(g => g.eps.map(e => ({ id: e[0], name: e[1], group: g.name })));
let items = [], videos = {}, db = null, loaded = false;
let view = "granska", from = "granska", filter = "alla";
let selected = new Set(), noteTime = null, shownVideo = null, pendingSeek = null;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const MONTHS = ["jan","feb","mar","apr","maj","jun","jul","aug","sep","okt","nov","dec"];
function when(d, short) {
  if (!d) return "";
  const now = new Date(), y = new Date(now); y.setDate(now.getDate() - 1);
  const hm = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  const same = d.toDateString() === now.toDateString();
  const day = same ? "idag" : d.toDateString() === y.toDateString() ? "igår" : d.getDate() + " " + MONTHS[d.getMonth()];
  return short && !same ? day : day + " " + hm;
}
// "2026-11-16 08:10 (förhandsvisning …)" → Date of the first 16 chars, or null
const rDate = s => { const d = s ? new Date(String(s).slice(0, 16).replace(" ", "T")) : null; return d && !isNaN(d) ? d : null; };
const rNote = s => String(s || "").slice(16).trim().replace(/^\((.*)\)$/, "$1");
const fold = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const V = id => videos[id] || {};
const nameOf = id => (ALL.find(e => e.id === id) || { name: id }).name;
const shortName = id => /^B-/.test(id) ? titleOf(id) : nameOf(id);
const titleOf = id => /^B-|-bg$/.test(id) ? nameOf(id).replace(/^(Inne|Ute) · /, "") : id + " " + nameOf(id);
const statusOf = id => V(id).status || { "Väntar på granskning": "granska", "Pågår": "pagar", "Julkalender": "granska", "Live": "live" }[(ALL.find(e => e.id === id) || {}).group] || "plan";
const statusName = st => (STATUSES.find(s => s[0] === st) || [, st])[1];
const hasMedia = id => !!(V(id).video || (V(id).stills || []).length);
const isPick = id => id.endsWith("-bg");
// Open = not fixed, and not a pure "Bra, behåll!" note (a note with no tags counts)
const openItems = () => items.filter(i => !i.fixed && !((i.tags || []).length && i.tags.every(t => t === "bra")));
const seenKey = id => "lk-seen-" + id;
function markSeen(id) { try { localStorage.setItem(seenKey(id), V(id).rendered || ""); } catch (e) {} }
// New = waiting for review, rendered in the last two days, and nothing said about THIS render yet
function isNew(id) {
  const v = V(id), d = rDate(v.rendered);
  if (statusOf(id) !== "granska" || !hasMedia(id) || !d || Date.now() - d > 2 * 864e5) return false;
  try { if (localStorage.getItem(seenKey(id)) === v.rendered) return false; } catch (e) {}
  return !items.some(i => i.ep === id && (i.render === v.rendered || (i.at || 0) > d.getTime()));
}
const byNewest = (a, b) => (rDate(V(b.id).rendered) || 0) - (rDate(V(a.id).rendered) || 0);
const byType = (a, b) => ORDER.indexOf(typeOf(a.id)) - ORDER.indexOf(typeOf(b.id)) || a.id.localeCompare(b.id, "sv");
const isBg = id => typeOf(id) === "bg" || isPick(id);
const fresh = () => ALL.filter(e => !isBg(e.id) && isNew(e.id)).sort(byNewest);
const waiting = () => ALL.filter(e => !isBg(e.id) && statusOf(e.id) === "granska" && hasMedia(e.id) && !isNew(e.id)).sort(byType);
function toast(msg) { const d = document.createElement("div"); d.className = "toast"; d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 1800); }
// Only touch the DOM when the markup changed, so the minute refresh doesn't reload thumbnails or reset scroll
function put(el, html) { if (el._h !== html) { el._h = html; el.innerHTML = html; lazy(el); } }
const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.src = e.target.dataset.src; io.unobserve(e.target); } }), { rootMargin: "300px" }) : null;
function lazy(el) { el.querySelectorAll("video[data-src]").forEach(v => io ? io.observe(v) : (v.src = v.dataset.src)); }

/* ---------- views ---------- */
function go(v) { if (location.hash.slice(1) !== v) location.hash = v; else route(); }
function route() {
  const h = decodeURIComponent(location.hash.slice(1)) || "granska";
  const next = h;
  if (["granska", "todo", "alla", "assets"].includes(next)) from = next;
  if (next !== view) { view = next; selected.clear(); noteTime = null; $("#note").value = ""; scrollTo(0, 0); }
  render();
}
window.addEventListener("hashchange", route);
document.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => go(b.dataset.tab)));

function render() {
  const isList = ["granska", "todo", "alla", "assets"].includes(view);
  const nf = fresh().length, nw = waiting().length, nt = openItems().length;
  $("#nGranska").textContent = nf || nw || ""; $("#nGranska").className = "cnt" + (nf ? " hot" : "");
  $("#nTodo").textContent = nt || "";
  document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-current", String(b.dataset.tab === (isList ? view : from))));
  for (const v of ["granska", "todo", "alla", "assets", "video"]) $("#v-" + v).hidden = v !== (isList ? view : "video");
  updated();
  if (view === "granska") renderGranska();
  else if (view === "todo") renderTodo();
  else if (view === "alla") renderAlla();
  else if (view === "assets") renderAssets();
  else renderVideo();
}
function updated() {
  const t = Math.max(0, ...items.map(i => i.at || 0), ...Object.values(videos).map(v => +(rDate(v.rendered) || 0)));
  $("#updated").textContent = t ? "Uppdaterad " + when(new Date(t)) : "";
}

function card(e) {
  const v = V(e.id), n = openItems().filter(i => i.ep === e.id).length, nu = isNew(e.id), d = rDate(v.rendered);
  const pic = (v.stills || [])[0];
  const media = v.video ? `<video muted playsinline preload="metadata" data-src="${esc(v.video)}#t=4"></video>` : pic ? `<img src="${esc(pic.src)}" alt="" loading="lazy">` : "";
  const tag = isPick(e.id) ? "Välj bakgrund" : v.video ? (v.duration ? fmt(v.duration) : "") : `${(v.stills || []).length} bilder`;
  return `<button class="vcard" type="button" data-go="${esc(e.id)}"><div class="thumb">${media}
    <div class="tl">${nu ? `<span class="pill ink">Ny</span>` : ""}${tag ? `<span class="pill">${esc(tag)}</span>` : ""}</div>
    ${n ? `<div class="tr"><span class="pill ink">${n} öppna</span></div>` : ""}</div>
    <div class="cmeta"><span class="num">${/^B-|-bg$/.test(e.id) ? "" : esc(e.id)}</span><span class="name">${esc(shortName(e.id))}</span>
    <span class="when${nu ? " new" : ""}">${d ? "renderad " + esc(when(d)) : ""}</span></div></button>`;
}
function renderGranska() {
  const f = fresh(), w = waiting();
  $("#granskaLead").textContent = !loaded ? "Laddar…" : f.length ? `${f.length} ${f.length === 1 ? "ny rendering" : "nya renderingar"} sedan du tittade senast.` : "Inga nya renderingar. Allt nytt har du sett.";
  const groups = ORDER.map(t => [t, w.filter(e => typeOf(e.id) === t)]).filter(g => g[1].length);
  put($("#granskaBody"), (f.length ? `<h2 class="sec">Nya renderingar <span class="cnt hot">${f.length}</span></h2><div class="cards">${f.map(card).join("")}</div>` : "")
    + groups.map(([t, eps]) => `<h2 class="sec">${f.length ? "Väntar också · " : ""}${TYPES.find(x => x[0] === t)[1]} <span class="cnt">${eps.length}</span></h2><div class="cards">${eps.map(card).join("")}</div>`).join(""));
}
function itemRow(i, withDel) {
  const v = V(i.ep), d = rDate(i.render);
  const old = i.render && v.rendered && i.render !== v.rendered ? `<span class="old">om renderingen ${esc(when(d) || i.render)}</span>` : "";
  const tags = (i.tags || []).map(t => `<span data-cat="${catOf(t)}">${esc(tagName(t))}</span>`).join("");
  return `<div class="item${i.fixed ? " fixed" : ""}">
    <input type="checkbox" class="check" data-fix="${esc(i.id)}" ${i.fixed ? "checked" : ""} aria-label="Markera som fixad">
    <button type="button" class="t" data-seek="${i.sec}" data-ep="${esc(i.ep)}" ${i.sec >= 0 ? "" : "disabled"}>${i.time ? esc(i.time) : "hela"}</button>
    <div class="body">${tags || old ? `<div class="mini">${tags}${old}</div>` : ""}${esc(i.note || "")}</div>
    ${withDel ? `<button class="del" type="button" data-del="${esc(i.id)}" aria-label="Ta bort">×</button>` : ""}</div>`;
}
const bySec = (a, b) => (a.sec - b.sec) || ((a.at || 0) - (b.at || 0));
function renderTodo() {
  const open = openItems(), eps = [...new Set(open.map(i => i.ep))].map(id => ({ id })).sort(byType);
  $("#todoLead").textContent = !loaded ? "Laddar…" : open.length ? `${open.length} öppna i ${eps.length} ${eps.length === 1 ? "video" : "videor"}. Bocka av när det är fixat.` : "";
  put($("#todoBody"), eps.length ? eps.map(e => `<div class="todo-ep"><h3><button type="button" data-go="${esc(e.id)}">${esc(titleOf(e.id))}</button><span class="dot ${statusOf(e.id)}"></span><span class="cnt">${open.filter(i => i.ep === e.id).length}</span></h3>
    ${open.filter(i => i.ep === e.id).sort(bySec).map(i => itemRow(i, false)).join("")}</div>`).join("")
    : `<div class="empty">${loaded ? "Ingen öppen feedback. Allt är fixat." : "Laddar…"}</div>`);
}
function renderAlla() {
  put($("#filters"), TYPES.map(([k, l]) => `<button class="chip" type="button" data-filter="${k}" aria-pressed="${k === filter}">${l} <span class="cnt">${k === "alla" ? ALL.length : ALL.filter(e => typeOf(e.id) === k).length}</span></button>`).join("")
    + `<input class="search" type="search" id="q" placeholder="Sök, t.ex. 030 eller kanin" aria-label="Sök" value="${esc(($("#q") || {}).value || "")}">`);
  const q = fold(($("#q") || {}).value || "").trim();
  const list = ALL.filter(e => (filter === "alla" || typeOf(e.id) === filter) && (!q || fold(e.id + " " + e.name).includes(q))).sort(byType);
  $("#allaLead").textContent = `${list.length} av ${ALL.length}`;
  const n = id => openItems().filter(i => i.ep === id).length;
  put($("#rows"), list.length ? list.map(e => { const st = statusOf(e.id), d = rDate(V(e.id).rendered), c = n(e.id);
    return `<button class="vrow" type="button" data-go="${esc(e.id)}"><span class="num">${/^B-/.test(e.id) ? "" : esc(e.id)}</span><span class="name">${esc(shortName(e.id))}</span>
      <span class="st"><span class="dot ${st}"></span>${esc(statusName(st))}</span><span class="when">${d ? esc(when(d, true)) : V(e.id).youtube ? "på YouTube" : "–"}</span>
      <span>${c ? `<span class="cnt hot">${c}</span>` : ""}</span></button>`; }).join("") : `<div class="empty">Inget matchar.</div>`);
}
$("#filters").addEventListener("click", e => { const b = e.target.closest("[data-filter]"); if (b) { filter = b.dataset.filter; renderAlla(); } });
$("#filters").addEventListener("input", e => { if (e.target.id === "q") renderAlla(); });
document.addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b && !e.target.closest("[data-seek]")) go(b.dataset.go); });

// Assets: one picture per figure, thing and place, from assets.json (built by verktyg/feedback-assets.py)
const ATYPES = [["alla","Alla"],["karaktarer","Figurer"],["rekvisita","Saker"],["bakgrunder","Bakgrunder"]];
let assets = null, afilter = "alla";
fetch("assets.json").then(r => r.json()).then(a => { assets = a; if (view === "assets") renderAssets(); }).catch(() => { assets = []; });
function renderAssets() {
  const a = assets || [];
  put($("#afilters"), ATYPES.map(([k, l]) => `<button class="chip" type="button" data-afilter="${k}" aria-pressed="${k === afilter}">${l} <span class="cnt">${k === "alla" ? a.length : a.filter(x => x.typ === k).length}</span></button>`).join("")
    + `<input class="search" type="search" id="aq" placeholder="Sök, t.ex. kanin eller snö" aria-label="Sök" value="${esc(($("#aq") || {}).value || "")}">`);
  const q = fold(($("#aq") || {}).value || "").trim();
  const list = a.filter(x => (afilter === "alla" || x.typ === afilter) && (!q || fold(x.name).includes(q)));
  $("#assetsLead").textContent = assets ? `${list.length} av ${a.length}. Klicka för full storlek.` : "Laddar…";
  put($("#agrid"), list.length ? list.map(x => `<a class="asset" href="${esc(x.src)}" target="_blank" rel="noopener"><div class="pic${x.typ === "bakgrunder" ? " bg" : ""}"><img src="${esc(x.thumb)}" alt="" loading="lazy"></div><span>${esc(x.name.replace(/-/g, " "))}</span></a>`).join("")
    : `<div class="empty">${assets ? "Inget matchar." : "Laddar…"}</div>`);
}
$("#afilters").addEventListener("click", e => { const b = e.target.closest("[data-afilter]"); if (b) { afilter = b.dataset.afilter; renderAssets(); } });
$("#afilters").addEventListener("input", e => { if (e.target.id === "aq") renderAssets(); });

/* ---------- one video ---------- */
const nextOf = id => { const q = [...fresh(), ...waiting()].map(e => e.id).filter(x => x !== id); return q[0]; };
function picked(id) { return items.filter(i => i.ep === id && i.pick).sort((a, b) => (b.at || 0) - (a.at || 0))[0]; }
function renderVideo() {
  const id = view, v = V(id);
  if (!ALL.find(e => e.id === id)) { $("#epTitle").textContent = loaded ? "Hittar inte " + id : "Laddar…"; return; }
  $("#backBtn").textContent = "← " + { granska: "Att granska", todo: "Att göra", alla: "Alla videor", assets: "Assets" }[from];
  $("#epTitle").textContent = titleOf(id);
  const st = statusOf(id), d = rDate(v.rendered);
  $("#epMeta").innerHTML = `<span><span class="dot ${st}"></span> ${esc(statusName(st))}</span>` + (d ? `<span>Renderad <b>${esc(when(d))}</b>${rNote(v.rendered) ? " · " + esc(rNote(v.rendered)) : ""}</span>` : "")
    + (v.duration ? `<span>Längd <b>${fmt(v.duration)}</b></span>` : "") + (isNew(id) ? `<span class="pill ink">Ny rendering</span>` : "")
    + (V(id + "-bg").stills ? `<a class="chip" href="#${esc(id)}-bg">${picked(id + "-bg") ? "Bakgrund: " + esc(picked(id + "-bg").pick) : "Välj bakgrund"} →</a>` : "");
  $("#statusPick").innerHTML = STATUSES.map(([k, l]) => `<option value="${k}"${k === st ? " selected" : ""}>${l}</option>`).join("");
  $("#statusPick").disabled = !db;
  $("#file").textContent = v.file ? "Fil: " + v.file : "";
  $("#ytLink").hidden = !v.youtube; if (v.youtube) $("#ytLink").href = v.youtube;
  const nx = nextOf(id); $("#nextBtn").textContent = nx ? "Klar, nästa →" : "Klar ✓";
  const key = id + "|" + (v.video || "") + "|" + (v.stills || []).map(s => s.src).join() + "|" + loaded;
  if (key !== shownVideo) {
    shownVideo = key;
    $("#player").hidden = !v.video && !!(v.stills || []).length;
    $("#player").innerHTML = v.video ? `<video id="vid" controls preload="metadata" playsinline src="${esc(v.video)}"></video>`
      : `<div class="none">${!loaded ? "Laddar…" : v.youtube ? `Den här videon är live.<br><a href="${esc(v.youtube)}" target="_blank" rel="noopener">Öppna på YouTube</a>` : "Ingen film uppladdad än."}</div>`;
    const vid = $("#vid"); if (vid) vid.addEventListener("loadedmetadata", () => { renderMarks(); if (pendingSeek != null) { vid.currentTime = pendingSeek; pendingSeek = null; } });
  }
  // Stills: a background choice gets a "Välj" button per option; other stills just show
  const ch = picked(id);
  document.querySelector(".review").classList.toggle("pickmode", isPick(id));
  put($("#pics"), isPick(id) ? `<div class="picks">${(v.stills || []).map(s => { const on = ch && ch.pick === s.label;
      return `<div class="pick${on ? " chosen" : ""}"><a href="${esc(s.src)}" target="_blank" rel="noopener"><img src="${esc(s.src)}" alt="${esc(s.label)}" loading="lazy"></a>
      <div class="bar"><b>${esc(s.label)}</b>${on ? `<span class="pill ink">Vald</span><button class="btn ghost small" type="button" data-pick="${esc(s.label)}">Spara kommentar</button>` : `<button class="btn small" type="button" data-pick="${esc(s.label)}">Välj den här</button>`}</div>
      <textarea data-pick-note="${esc(s.label)}" rows="1" placeholder="Kommentar (valfritt), t.ex. varmare golv" aria-label="Kommentar till ${esc(s.label)}">${on ? esc(ch.comment || "") : ""}</textarea></div>`; }).join("")}</div>`
    : (v.stills || []).length ? `<div class="stills">${v.stills.map(s => `<figure><a href="${esc(s.src)}" target="_blank" rel="noopener"><img src="${esc(s.src)}" alt="" loading="lazy"></a><figcaption>${esc(s.label || "")}</figcaption></figure>`).join("")}</div>` : "");
  const mine = items.filter(i => i.ep === id).sort(bySec), open = mine.filter(i => !i.fixed).length;
  $("#countLbl").textContent = mine.length ? `Kommentarer · ${open} öppna` : "Kommentarer";
  put($("#comments"), mine.length ? mine.map(i => itemRow(i, true)).join("") : `<div class="empty" style="padding:var(--s-6) 0">Inget sagt om den här än.</div>`);
  if (!$("#tagRow").children.length) $("#tagRow").innerHTML = TAGS.map(([k, l]) => `<button type="button" class="chip" data-cat="${k}" data-tag="${k}" aria-pressed="false">${l}</button>`).join("");
  $("#tagRow").querySelectorAll("[data-tag]").forEach(b => b.setAttribute("aria-pressed", selected.has(b.dataset.tag)));
  showTime(); renderMarks();
}
function renderMarks() {
  const vid = $("#vid"), dur = (vid && vid.duration) || V(view).duration;
  const mine = items.filter(i => i.ep === view && i.sec >= 0);
  $("#marks").hidden = !vid || !dur;
  if (!vid || !dur) return;
  put($("#marks"), mine.map(i => `<button type="button" class="mark${i.fixed ? " fixed" : ""}" data-seek="${i.sec}" style="left:${Math.min(100, i.sec / dur * 100)}%" title="${esc((i.time || "") + " " + (i.note || ""))}"></button>`).join(""));
}
function seek(sec) { const v = $("#vid"); if (!v) return; v.currentTime = Math.max(0, sec - 1); v.play().catch(() => {}); }
document.addEventListener("click", e => {
  const s = e.target.closest("[data-seek]"); if (!s || s.disabled) return;
  const ep = s.dataset.ep || view, sec = Number(s.dataset.seek);
  if (ep !== view) { pendingSeek = Math.max(0, sec - 1); go(ep); } else seek(sec);
});

// Time: the first keystroke pauses the video and keeps where it stands. 0:00 means the whole video.
function grab() {
  const v = $("#vid");
  if (!$("#note").value.trim()) { noteTime = null; showTime(); return; }
  if (noteTime === null && v) { v.pause(); noteTime = v.currentTime > 0.5 ? Math.floor(v.currentTime) : -1; showTime(); }
}
function showTime() { const t = noteTime; $("#timeChip").textContent = t == null ? ($("#vid") ? "Tiden tas när du skriver" : "Hela videon") : t >= 0 ? "Vid " + fmt(t) + "  ×" : "Hela videon"; }
$("#note").addEventListener("input", grab);
$("#timeChip").addEventListener("click", () => { const v = $("#vid"); noteTime = noteTime != null && noteTime >= 0 ? -1 : v ? Math.floor(v.currentTime) : -1; showTime(); });
$("#tagRow").addEventListener("click", e => { const b = e.target.closest("[data-tag]"); if (!b) return; const k = b.dataset.tag; selected.has(k) ? selected.delete(k) : selected.add(k); b.setAttribute("aria-pressed", selected.has(k)); });
$("#form").addEventListener("submit", async e => {
  e.preventDefault();
  const note = $("#note").value.trim();
  if (!note && !selected.size) { toast("Skriv något eller välj en tagg"); return; }
  if (!db) { toast("Sidan laddar fortfarande, försök igen om en sekund"); return; }
  const sec = noteTime == null ? ($("#vid") && $("#vid").currentTime > 0.5 ? Math.floor($("#vid").currentTime) : -1) : noteTime;
  const doc = { ep: view, time: sec >= 0 ? fmt(sec) : "", sec, tags: [...selected], note, fixed: false, at: Date.now(), render: V(view).rendered || "" };
  $("#addBtn").disabled = true;
  try {
    const saving = db.collection("feedback").add(doc);
    if (!token) copy(claudeText(view), "Sparat och kopierat, klistra in hos Claude");   // local save is already done; copy while the click still counts
    const hadKey = !!token; await saving; $("#note").value = ""; noteTime = null; selected.clear(); renderVideo();
    if (token) toast("Sparat"); else if (hadKey) copy(claudeText(view), "Sparat i webbläsaren och kopierat");   // the key just failed
  }
  catch (err) { toast("Kunde inte spara: " + (err.message || err)); }
  $("#addBtn").disabled = false;
});
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && !["granska", "todo", "alla", "assets"].includes(view)) { e.preventDefault(); $("#form").requestSubmit(); }
  if (e.key === "/" && view === "alla" && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) { e.preventDefault(); $("#q").focus(); }
});
// Pick a background: one saved choice per door; picking again changes it
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-pick]"); if (!b) return;
  if (!db) { toast("Sidan laddar fortfarande, försök igen om en sekund"); return; }
  const label = b.dataset.pick, old = picked(view);
  const comment = ([...document.querySelectorAll("[data-pick-note]")].find(t => t.dataset.pickNote === label) || {}).value?.trim() || "";
  const note = "Välj bakgrund: " + label + (comment ? ". " + comment : "");
  b.disabled = true;
  try {
    const saving = old && !old.fixed ? db.doc("feedback/" + old.id).update({ pick: label, comment, note, at: Date.now() })
      : db.collection("feedback").add({ ep: view, time: "", sec: -1, tags: [], note, pick: label, comment, fixed: false, at: Date.now(), render: V(view).rendered || "" });
    if (!token) copy(claudeText(view), "Vald och kopierad, klistra in hos Claude");   // local save is already done; copy while the click still counts
    await saving;
    if (token) toast(old && old.pick === label ? "Kommentar sparad" : "Vald: " + label);
  } catch (err) { toast("Kunde inte spara: " + (err.message || err)); b.disabled = false; }
});
document.addEventListener("change", async e => {
  const id = e.target.dataset.fix; if (!id) return;
  if (!db) { e.target.checked = !e.target.checked; toast("Sidan laddar fortfarande, försök igen om en sekund"); return; }
  try { await db.doc("feedback/" + id).update({ fixed: e.target.checked }); } catch (err) { toast("Kunde inte ändra"); }
});
document.addEventListener("click", async e => {
  const btn = e.target.closest("[data-del]"); if (!btn || !db) return;
  if (btn.dataset.armed !== "1") { btn.dataset.armed = "1"; btn.textContent = "Ta bort?"; setTimeout(() => { if (btn.isConnected) { btn.dataset.armed = ""; btn.textContent = "×"; } }, 2500); return; }
  try { await db.doc("feedback/" + btn.dataset.del).delete(); } catch (err) { toast("Kunde inte ta bort"); }
});
$("#nextBtn").addEventListener("click", () => { markSeen(view); const n = nextOf(view); go(n || "granska"); });
$("#backBtn").addEventListener("click", () => go(from));
$("#statusPick").addEventListener("change", async e => {
  if (!db) return;
  try { await db.doc("videos/" + view).set({ ...V(view), status: e.target.value }); toast("Status ändrad"); } catch (err) { toast("Kunde inte ändra status"); }
});
const claudeText = id => { const open = items.filter(i => i.ep === id && !i.fixed).sort(bySec), v = V(id);
  return `Feedback ${id} ${nameOf(id)}${v.rendered ? " (renderad " + v.rendered + ")" : ""}\n` + (open.length ? open.map(i => `- ${i.time || "hela"}${(i.tags || []).length ? " [" + i.tags.map(tagName).join(", ") + "]" : ""}${i.note ? " " + i.note : ""}`).join("\n") : "- (ingen öppen feedback)"); };
async function copy(txt, msg) { try { await navigator.clipboard.writeText(txt); toast(msg); } catch (err) { toast("Kunde inte kopiera"); } }
$("#copyBtn").addEventListener("click", () => copy(claudeText(view), "Feedbacken kopierad, klistra in hos Claude"));
$("#linkBtn").addEventListener("click", () => { copy(location.origin + location.pathname + "#" + view, "Länk kopierad"); $("#more").open = false; });
$("#copyAllBtn").addEventListener("click", () => copy([...new Set(openItems().map(i => i.ep))].sort().map(claudeText).join("\n\n") || "(ingen öppen feedback)", "Kopierat"));
document.addEventListener("click", e => { if (!e.target.closest("#more")) $("#more").open = false; });

// Storage: feedback.json and videos.json on the repo's `data` branch. Anyone can read; saving needs a GitHub
// token (fine-grained, this repo only, Contents read/write) kept in this browser's localStorage.
const GH = "https://api.github.com/repos/granqvistsanna-web/Lilla-kritan/contents/";
const RAW = "https://raw.githubusercontent.com/granqvistsanna-web/Lilla-kritan/data/";
let token = ""; try { token = localStorage.getItem("lk-gh-token") || ""; } catch (e) {}
const dec = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\n/g, "")), c => c.charCodeAt(0)));
const enc = s => { const u = new TextEncoder().encode(s); let r = ""; for (let i = 0; i < u.length; i += 0x8000) r += String.fromCharCode(...u.subarray(i, i + 0x8000)); return btoa(r); };
const auth = () => ({ Authorization: "Bearer " + token, Accept: "application/vnd.github+json" });
// ponytail: the contents API inlines files up to 1 MB; feedback.json is ~100 KB, switch to the git blobs API if it ever nears that
async function ghGet(file) {
  if (!token) { const r = await fetch(RAW + file + "?t=" + Date.now(), { cache: "no-store" }); if (!r.ok) throw new Error(r.status); return { data: await r.json() }; }
  const r = await fetch(GH + file + "?ref=data", { headers: auth(), cache: "no-store" });
  if (!r.ok) throw new Error([401, 403, 404].includes(r.status) ? "nyckeln fungerar inte" : String(r.status));
  const j = await r.json(); return { sha: j.sha, data: JSON.parse(dec(j.content)) };
}
// Read the newest file, change it, write it back; on a clash (someone saved in between) read again and redo
async function mutate(name, fn, msg) {
  for (let n = 0; n < 4; n++) {
    const { sha, data } = await ghGet(name + ".json"); fn(data);
    const r = await fetch(GH + name + ".json", { method: "PUT", headers: auth(),
      body: JSON.stringify({ message: msg, branch: "data", sha, content: enc(JSON.stringify(data, null, 1) + "\n") }) });
    if (r.ok) { store[name] = data; apply(); return; }
    if (r.status >= 500) { await new Promise(ok => setTimeout(ok, 800 * (n + 1))); continue; }   // GitHub hiccup, or the file was just written
    if (r.status !== 409 && r.status !== 422) throw new Error([401, 403, 404].includes(r.status) ? "nyckeln får inte spara" : String(r.status));
  }
  throw new Error("krockade flera gånger, försök igen");
}
const store = { feedback: {}, videos: {} };
const newId = () => Math.random().toString(36).slice(2, 12) + Date.now().toString(36);
const makeWriter = mutate => ({
  collection: c => ({ add: (doc, id = newId()) => mutate(c, d => { d[id] = doc; }, `feedback ${doc.ep}: ${(doc.note || doc.tags.join(", ")).slice(0, 60)}`) }),
  doc: p => { const [c, id] = p.split("/"); return {
    update: f => mutate(c, d => { if (!d[id]) throw new Error("finns inte längre"); Object.assign(d[id], f); }, `${c} ${id}: ${JSON.stringify(f)}`),
    set: v => mutate(c, d => { d[id] = v; }, `${c} ${id}: ${v.status || "ändrad"}`),
    delete: () => mutate(c, d => { delete d[id]; }, `${c} ${id}: borttagen`) }; }
});
// A key that can't save (wrong rights, expired) is dropped, and the change is saved in the browser instead
const dropKey = () => { token = ""; try { localStorage.removeItem("lk-gh-token"); } catch (e) {} keyLabel(); db = localWriter;
  $("#dbStatus").textContent = "Nyckeln fungerade inte, så den är borttagen. Feedbacken sparas i den här webbläsaren i stället."; };
const writer = makeWriter((...a) => mutate(...a).catch(err => { if (!/nyckeln/.test(err.message)) throw err; dropKey(); return localMutate(...a); }));
// No key: changes live in this browser only (localStorage, on top of what's on GitHub), and "Kopiera till Claude" carries them over.
// The local copy keeps only what differs from GitHub; null marks something removed here.
const LOCAL = "lk-feedback-lokal", remote = { feedback: {}, videos: {} };
const readLocal = () => { try { return JSON.parse(localStorage.getItem(LOCAL)) || { feedback: {}, videos: {} }; } catch (e) { return { feedback: {}, videos: {} }; } };
const merge = (r, l = {}) => { const d = { ...r }; for (const k in l) l[k] === null ? delete d[k] : d[k] = l[k]; return d; };
const localMutate = async (name, fn) => {
  const l = readLocal(), d = JSON.parse(JSON.stringify(merge(remote[name], l[name]))); fn(d);
  const diff = {}; for (const k in d) if (JSON.stringify(d[k]) !== JSON.stringify(remote[name][k])) diff[k] = d[k];
  for (const k in remote[name]) if (!(k in d)) diff[k] = null;
  l[name] = diff; try { localStorage.setItem(LOCAL, JSON.stringify(l)); } catch (e) { throw new Error("webbläsaren sparar inte"); }
  store[name] = d; apply();
};
const localWriter = makeWriter(localMutate);
function apply() {
  // a few old notes have `at` as a date string; make it a number so sorting and "Uppdaterad" work
  items = Object.entries(store.feedback).map(([id, d]) => ({ id, ...d, at: typeof d.at === "number" ? d.at : +new Date(String(d.at || "").replace(" ", "T")) || 0 }));
  videos = store.videos;
  for (const id of Object.keys(videos)) if (!ALL.find(e => e.id === id)) ALL.push({ id, name: videos[id].name || id, group: "" });
  loaded = true; render();
}
async function load() {
  try {
    const [f, v] = await Promise.all([ghGet("feedback.json"), ghGet("videos.json")]);
    remote.feedback = f.data; remote.videos = v.data;
    const l = token ? {} : readLocal();
    store.feedback = merge(f.data, l.feedback); store.videos = merge(v.data, l.videos);
    db = token ? writer : localWriter;
    $("#dbStatus").textContent = token ? "" : "Sparas i den här webbläsaren. Det du skriver kopieras också direkt, klistra in det hos Claude.";
    apply();
  } catch (err) {
    if (token && /nyckeln/.test(err.message)) { dropKey(); return load(); }
    if (!token) db = localWriter;   // can still save in this browser
    $("#dbStatus").textContent = "Kunde inte läsa feedbacken: " + (err.message || err); loaded = true; render(); }
}
function keyLabel() { $("#keyBtn").textContent = token ? "Logga ut" : "Logga in"; }
$("#keyBtn").addEventListener("click", async () => {
  if (token) { if (!confirm("Ta bort nyckeln från den här webbläsaren? Sidan blir bara läsbar.")) return; token = ""; try { localStorage.removeItem("lk-gh-token"); } catch (e) {} keyLabel(); load(); return; }
  const t = (prompt("Klistra in din GitHub-nyckel (fine-grained, bara Lilla-kritan, Contents: Read and write). Den sparas bara i den här webbläsaren.") || "").trim();
  if (!t) return;
  const r = await fetch(GH + "feedback.json?ref=data", { headers: { Authorization: "Bearer " + t } });
  if (!r.ok) { toast("Nyckeln fungerade inte (" + r.status + ")"); return; }
  token = t; try { localStorage.setItem("lk-gh-token", t); } catch (e) {} keyLabel(); toast("Inloggad"); load();
});
keyLabel();
route();
load();
// Pick up what Claude (or another device) saved: every minute while the tab is visible, and when you come back to it
setInterval(() => { if (document.visibilityState === "visible") load(); }, 60000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") load(); });

</script>
