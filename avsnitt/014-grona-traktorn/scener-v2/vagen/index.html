<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>014 v2 vägen</title>
<style>html, body { margin:0; background:#000; overflow:hidden } svg { width:100vw; height:100vh; display:block; }</style></head>
<body>
<!-- 014 Gröna sången v2: vägen och Ärtresan (03–09a–g, avsnittstid 30,0–106,0). Renderas med ../render.mjs.
     Tiderna i koden är avsnittstid (sångtid + 9,0, ur ../../rader.txt). Allt på marken (trafikljuset, Gurra, ärtorna, groddarna)
     glider med vägen: världens x = x0 − (vag(t) − vag(t0)), så inget står still medan traktorn kör. -->
<script src="/verktyg/blinka.js"></script>
<script src="/verktyg/kant.js"></script>
<script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script type="module">
import * as K from '../kit.js';
const { kl, lerp, mjuk, del, bump, f1, lagg } = K;
window.SCEN = ['03', '09a–g'];

// --- Ordtider (avsnittstid) ------------------------------------------------------------------------------------------------
const PUTT = [39.6, 40.0, 40.4], KOR = [77.7, 78.4, 79.0], ZIPP = [91.3, 92.0, 92.5];
// feedback 27/11 (1:08 "match hops to song"): "hopp" sjungs på slagen 84–86 (sångtid 59,3 / 60,0 / 60,7, Whisper), inte 58,7 / 59,7 / 60,7 som i rader.txt; avstampet strax före ordet
const HOPP = [68.25, 68.95, 69.65];
const R1 = { a: 48.1, gront: [48.1, 49.0, 49.8, 50.2], gbk: 50.6, kor: 51.8, ut: 52.6, artor: [52.6, 54.4, 55.3], ekon: [53.5, 54.4, 55.3],
  tak: 56.3, putt: [59.2, 59.6, 60.0, 60.4], titta: 61.7, slut: 62.5, kawaii: true };
const R2 = { a: 93.0, gront: [93.0, 93.7, 94.7, 95.7], gbk: 96.4, kor: 97.15,   // QA 26/11: grönt på "kör" (sångtid 1:28,2)
  ut: 97.7, artor: [97.7, 99.7, 100.7], ekon: [98.7, 99.7, 100.7],
  tak: 101.5, putt: [103.6, 104.0, 104.4, 104.8], titta: 105.4, slut: 106.0, kawaii: false };

// --- Himlen (feedback 27/11, 0:56 "more bold bg blue, turning green on chorus"): starkare blå, grön i refrängerna ------------------
const BLA = [167, 212, 252], GRON = [214, 246, 150];
K.HIMMEL.farg = t => { const g = Math.max(...[R1, R2].map(R => del(R.a - 0.4, R.a + 0.2, t) * (1 - del(R.slut - 0.5, R.slut + 0.3, t))));
  return `rgb(${BLA.map((c, i) => Math.round(lerp(c, GRON[i], g))).join(',')})`; };

// --- Farten och vägen: vag(t) = körd sträcka (px), integrerad ur farten, så att inbromsningar och rusningar blir mjuka ----------
const fart = t => {
  let v = 150;
  v *= 1 - del(63.2, 64.6, t) * (1 - del(69.9, 71.0, t));             // grodan: bromsar in, rullar igen när den landat
  v *= 1 - del(71.3, 72.6, t) * (1 - del(KOR[0] - 0.1, KOR[0] + 0.3, t));   // röda ljuset: stannar, står still till "kör"
  v += 260 * bump(KOR[0] - 0.1, KOR[2] + 1.2, t);                       // kör, kör, kör: fort en stund
  return v;
};
const VAGMINNE = new Map();
function vag(t) {   // ∫ fart från 30,0 (steg 0,02 s), samma t ger alltid samma värde
  const k = Math.round(t * 50); if (VAGMINNE.has(k)) return VAGMINNE.get(k);
  let s = 0; for (let i = 1500; i < k; i++) s += fart(i / 50) / 50; VAGMINNE.set(k, s); return s;
}
const varld = (x0, t0) => x0 - (vag(K.TID) - vag(t0));   // en sak på marken som stod i x0 vid t0

// --- Traktorn och Lova -------------------------------------------------------------------------------------------------------
const TX = 880, FOT = K.VAG_FOT;
const LOVA_HUVUD = () => K.iTraktor([470, 351], { x: TX, fot: FOT });
const NARA = () => K.kamera(1.8, 825, 560);
const HEL = (z = 1) => K.kamera(z, 900, 540);
const L = () => K.FIG.lova.L;
const ans = (a, b = a, k = 1) => K.skarp(L(), a, b, k);   // QA 26/11: inga halvblandade ögon
const pose = (...namn) => Object.assign({}, ...namn.map(n => { const { namn: _, ...p } = L().POSER[n]; return p; }));
// skumpet: ett litet gupp per slag när den kör (sångtid = TID − 9), lugnt
const gupp = (t, h = 5) => h * Math.pow(Math.abs(Math.sin(Math.PI * (t - 9.0) / K.BEAT)), 6) * kl(fart(t) / 150);
function kor({ x = TX, lut = 0, k = 1, flagg = 0, synlig = true } = {}) {
  const t = K.TID, o = vag(t);
  K.vagen(o);
  K.traktor({ x, fot: FOT - gupp(t), rull: o, lut: lut - 0.6 * gupp(t), k, flagg: flagg + 6 * kl((fart(t) - 150) / 260), synlig });
}
function lova(f, p = {}, upp = 0) { const st = kl(upp / STA_H) * (upp > 60);   // reser hon sig: benen rätas ut mot sätet
  K.lovaKor(typeof f === 'string' ? ans(f) : f, st ? { ...L().blandaPose('sitter', 'neutral', st), ...p } : p, { upp: upp + 0.6 * gupp(K.TID) }); }
const STA_H = 22;   // feedback 26/11 (1:28 "head cut by roof, can't stand in tractor"): hon sitter kvar och sträcker bara lite på sig
// står upp i sätet från "Jackan är grön" till sista "zipp" (traktorns px), så att jackan syns ovanför huven
const STA = () => STA_H * del(87.9, 88.6, K.TID) * (1 - del(ZIPP[2] + 0.5, ZIPP[2] + 0.9, K.TID));
// dragkedjan: stängd hela tiden (feedback 26/11, 0:31 "make jacket zipped"); strax före "Zipp, zipp, zipp!" drar hon ner den en bit
// och sedan upp igen i tre ryck
function zipp() { const t = K.TID, ner = 0.65 * del(ZIPP[0] - 0.7, ZIPP[0] - 0.25, t); K.zipp(1 - ner + ZIPP.reduce((z, a) => z + 0.65 * del(a - 0.05, a + 0.18, t) / 3, 0)); }

// puffar ur avgasröret: vita kritmoln som stiger och driver bakåt, ett per "putt"
const AVGAS = () => K.iTraktor([752, 330], { x: TX, fot: FOT });
function puffar(tider) {
  const [ax, ay] = AVGAS();
  for (const a of tider) { const u = (K.TID - a) / 1.3; if (u < 0 || u > 1) continue;
    const r = 16 + 26 * mjuk(u), x = ax - 150 * u, y = ay - 30 - 70 * mjuk(u);
    lagg('framfor', `<g opacity="${f1(1 - mjuk((u - 0.55) / 0.45))}"><circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r + 5)}" fill="#E4E8EC"/><circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}" fill="#fff"/>
      <circle cx="${f1(x + r * 0.7)}" cy="${f1(y + r * 0.2)}" r="${f1(r * 0.7)}" fill="#fff"/></g>`); }
}
// glitter: små vita fyrstrålade stjärnor som tänds och släcks i en ring runt (cx, cy)
function glitter(cx, cy, R, a, d = 1.4) {
  const u = (K.TID - a) / d; if (u < 0 || u > 1) return;
  lagg('pynt', Array.from({ length: 6 }, (_, i) => { const v = i * 1.05 + 0.4, k = bump(i * 0.08, i * 0.08 + 0.55, u), r = 6 + 18 * k;
    const x = cx + R * Math.cos(v), y = cy + R * 0.8 * Math.sin(v), q = r * 0.28;
    return k > 0.02 ? `<path d="M${f1(x)} ${f1(y - r)}L${f1(x + q)} ${f1(y - q)}L${f1(x + r)} ${f1(y)}L${f1(x + q)} ${f1(y + q)}L${f1(x)} ${f1(y + r)}L${f1(x - q)} ${f1(y + q)}L${f1(x - r)} ${f1(y)}L${f1(x - q)} ${f1(y - q)}Z" fill="#fff" stroke="#F2E7A6" stroke-width="2"/>` : ''; }).join(''));
}

// --- Trafikljuset v2 (assets/rekvisita/trafikljus-v2, Sannas Flow-bild 2026-11-26; lamporna ritas i kod) -----------------------------------------------------
const LJUS_BB = [306, 91, 718, 933], LAMPA = { rod: [510, 278, 108, '#F2443A'], gron: [512, 535, 107, '#5FD35A'] };   // trafikljus-v2-rigg.json
document.querySelector('defs').insertAdjacentHTML('beforeend', '<filter id="lampglod" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="28"/></filter>');
function trafikljus(x, fot, h, tand, k = 1, ring = -1) {
  const s = h / (LJUS_BB[3] - LJUS_BB[1]), [mx, my, r, c] = LAMPA[tand] || [];
  let lampa = '';
  if (tand && k > 0.01) lampa = `<g transform="translate(${mx} ${my}) scale(${f1(0.6 + 0.4 * k)})" opacity="${k.toFixed(2)}"><circle r="${f1(r * 1.5)}" fill="${c}" opacity="0.55" filter="url(#lampglod)"/>
    <circle r="${f1(r * 1.04)}" fill="${c}"/><ellipse cx="${f1(-r * 0.33)}" cy="${f1(-r * 0.4)}" rx="${f1(r * 0.22)}" ry="${f1(r * 0.2)}" fill="#fff" opacity="0.6"/></g>`;
  if (ring >= 0 && ring < 1) lampa += `<circle cx="${mx}" cy="${my}" r="${f1(r * (1.1 + 2.4 * mjuk(ring)))}" fill="none" stroke="${c}" stroke-width="${f1(22 * (1 - ring))}" opacity="${f1(1 - ring)}"/>`;
  lagg('bakom', `<g transform="translate(${f1(x)} ${f1(fot)}) scale(${s.toFixed(4)}) translate(${-(LJUS_BB[0] + LJUS_BB[2]) / 2} ${-LJUS_BB[3]})">
    <image href="/assets/rekvisita/trafikljus-v2/cut/trafikljus-v2.png" width="1024" height="1024"/>${lampa}</g>`);
}

// --- Ärtor och groddar (i kod) ------------------------------------------------------------------------------------------------
// en ärta med ansikte: r = radien, glad 0–1 (öppen mun), blink 0–1, kawaii (stora glansögon)
function arta(x, y, r, { lager = 'pynt', mun = 0, blink = 0, kawaii = 0 } = {}) {
  const oy = y - r * 0.12, ox = r * 0.34, oh = r * 0.2 * (1 - blink) + 1.5;
  const ogon = [-1, 1].map(s => kawaii > 0.5
    ? `<ellipse cx="${f1(x + s * ox)}" cy="${f1(oy)}" rx="${f1(r * 0.16)}" ry="${f1(r * 0.2)}" fill="#3a2c28"/><circle cx="${f1(x + s * ox - r * 0.05)}" cy="${f1(oy - r * 0.07)}" r="${f1(r * 0.07)}" fill="#fff"/>`
    : `<ellipse cx="${f1(x + s * ox)}" cy="${f1(oy)}" rx="${f1(r * 0.09)}" ry="${f1(oh / 2 + 1)}" fill="#3a2c28"/>`).join('');
  const munD = mun > 0.3 ? `<path d="M${f1(x - r * 0.2)} ${f1(y + r * 0.18)} Q${f1(x)} ${f1(y + r * 0.5)} ${f1(x + r * 0.2)} ${f1(y + r * 0.18)}Z" fill="#a33b45"/>`
    : `<path d="M${f1(x - r * 0.2)} ${f1(y + r * 0.2)} Q${f1(x)} ${f1(y + r * 0.38)} ${f1(x + r * 0.2)} ${f1(y + r * 0.2)}" fill="none" stroke="#3a2c28" stroke-width="${f1(r * 0.08)}" stroke-linecap="round"/>`;
  lagg(lager, `<g><circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r + 3 + r * 0.04)}" fill="#fff"/><circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}" fill="#80C446"/>
    <circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}" fill="#4E9A2E" opacity="0.25" mask="url(#artskugga)"/>
    <ellipse cx="${f1(x - r * 0.38)}" cy="${f1(y - r * 0.42)}" rx="${f1(r * 0.2)}" ry="${f1(r * 0.13)}" fill="#fff" opacity="0.7" transform="rotate(-30 ${f1(x - r * 0.38)} ${f1(y - r * 0.42)})"/>
    <ellipse cx="${f1(x - r * 0.5)}" cy="${f1(y + r * 0.1)}" rx="${f1(r * 0.13)}" ry="${f1(r * 0.08)}" fill="#F4A6A0" opacity="0.8"/><ellipse cx="${f1(x + r * 0.5)}" cy="${f1(y + r * 0.1)}" rx="${f1(r * 0.13)}" ry="${f1(r * 0.08)}" fill="#F4A6A0" opacity="0.8"/>
    ${ogon}${munD}</g>`);
}
document.querySelector('defs').insertAdjacentHTML('beforeend', `<radialGradient id="artskuggaG" cx="0.35" cy="0.3" r="0.8"><stop offset="0.5" stop-color="#000"/><stop offset="1" stop-color="#fff"/></radialGradient>
  <mask id="artskugga" maskContentUnits="objectBoundingBox"><rect width="1" height="1" fill="url(#artskuggaG)"/></mask>`);
// en grodd: stjälk och två blad, växer ur jorden. k 0–1 = poppar upp (litet överslag), sedan fortsätter den växa (k 1–9: 30 % högre,
// ett andra bladpar vecklas ut), h = höjd. Feedback 26/11 (014 0:49 "clearer sprouts and more growing").
function grodd(x, fot, h, k, lager = 'bakom') {
  if (k <= 0.01) return;
  const pop = k < 1 ? mjuk(k) * (1 + 0.18 * Math.sin(Math.PI * k)) : 1 + 0.3 * mjuk((k - 1) / 8), s = h / 100 * (0.15 + 0.85 * pop);
  const vik = 5 * Math.sin(K.TID * 2.2 + x * 0.01), b2 = mjuk((k - 1.5) / 3);
  lagg(lager, `<g transform="translate(${f1(x)} ${f1(fot)}) scale(${s.toFixed(3)}) rotate(${f1(vik)})"><g stroke="#fff" stroke-width="10" stroke-linejoin="round" paint-order="stroke">
    <path d="M0 4 Q-5 -50 0 -82" fill="none" stroke="#3F8F2A" stroke-width="10" stroke-linecap="round"/>
    ${b2 > 0.02 ? `<g transform="translate(0 -40) scale(${f1(b2)})"><path d="M0 0 Q-34 -14 -38 10 Q-16 16 0 0Z" fill="#6FBF47"/><path d="M0 -4 Q32 -22 40 4 Q18 12 0 -4Z" fill="#80C446"/></g>` : ''}
    <path d="M0 -74 Q-56 -104 -62 -60 Q-26 -48 0 -74Z" fill="#6FBF47"/><path d="M0 -80 Q54 -118 66 -74 Q30 -58 0 -80Z" fill="#80C446"/></g>
    <path d="M-6 -72 Q-34 -78 -46 -64 M6 -80 Q34 -92 50 -78" stroke="#4E9A2E" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/></g>`);
}
// åkern: vägens himmel och vägg ligger kvar, marken blir brun jord med fåror; gron 0–1 = åkern grönskar
function aker(o, gron = 0) {
  K.platta(K.VAG);
  const f = Array.from({ length: 5 }, (_, i) => { const y = 900 + i * 38; return `<path d="M-20 ${y} Q960 ${y - 10} 1940 ${y}" stroke="#5C3C26" stroke-width="${7 + i * 2}" fill="none" stroke-linecap="round" opacity="0.55"/>`; }).join('');
  lagg('bakom', `<rect x="-20" y="868" width="1960" height="240" fill="#8A5A3B"/><rect x="-20" y="868" width="1960" height="240" fill="#6FBF47" opacity="${f1(0.55 * gron)}"/>
    <path d="M-20 870 Q960 856 1940 870" stroke="#fff" stroke-width="10" fill="none"/>${f}
    ${Array.from({ length: 14 }, (_, i) => { const x = ((i * 157 - o * 0.999) % 2200 + 2200) % 2200 - 140; return `<ellipse cx="${f1(x)}" cy="${f1(930 + (i * 37) % 120)}" rx="22" ry="7" fill="#5C3C26" opacity="0.5"/>`; }).join('')}`);
}

// --- Refrängen: Ärtresan (05a–g och 09a–g likadana, R = tiderna) --------------------------------------------------------------
const GRODD_X = [1420, 1640, 1840, 1740], GRODD_STOR = [-40, 200, 450, 700, 960, 1220, 1480, 1720, 1960], GRODD_BAK = [80, 360, 1300, 1560, 1820];   // främre raden syns hela tiden (framför traktorn)
function refrang(R) {
  const t = K.TID, o = vag(t);
  if (t < R.ut) {   // a–c: åkern, en grodd per "Grönt!", trafikljuset blir grönt på "kör", traktorn rusar ut åt höger
    const ruta = mjuk((t - R.kor) / 0.8), x = TX + 1500 * ruta * ruta;
    aker(o, del(R.kor, R.kor + 0.7, t));
    R.gront.forEach((a, i) => grodd(varld(GRODD_X[i], a), 1066, 170, (t - a) / 0.4, 'framfor'));   // en stor grodd per "Grönt!", växer vidare
    GRODD_BAK.forEach((gx, i) => grodd(varld(gx, R.gbk), 884, 120, (t - R.gbk - 0.3 - i * 0.07) / 0.45));   // bakre raden på "Grönt betyder …"
    GRODD_STOR.forEach((gx, i) => grodd(varld(gx, R.kor), 880, 165, (t - R.kor - i * 0.06) / 0.4));   // "kör": en våg över hela åkern (bakom traktorn, som far iväg)
    const lx = varld(1650, R.gbk), up = mjuk((t - R.gbk) / 0.4);
    if (t > R.gbk) trafikljus(lx, 880 + 60 * (1 - up), 470 * up, t >= R.kor ? 'gron' : 'rod', 1, t >= R.kor ? (t - R.kor) / 0.8 : -1);
    K.traktor({ x, fot: FOT - gupp(t, 9), rull: o + 600 * ruta, lut: -3 * ruta, flagg: 14 * ruta });
    const hej = R.gront.reduce((m, a) => Math.max(m, bump(a - 0.05, a + 0.6, t)), 0);
    lova(t >= R.kor ? 'jatteglad' : ans('glad', 'jatteglad', 1.4 * hej), { armar: [6 + 60 * hej, 6 + 60 * hej] }, 6 * hej);
    HEL();
    return;
  }
  // d–g: vägen igen; traktorn susar in från vänster och saktar in, en ärta hoppar in per "Grönt!" och följer som ett litet tåg
  const in_ = mjuk((t - R.ut) / 1.1), x = lerp(TX - 420, TX, in_);   // QA 26/11: redan i bild efter klippet, ingen tom vägbild
  kor({ x, flagg: 10 * (1 - in_) });
  const narbild = t >= R.tak && t < R.putt[0];
  const ARTPLATS = [-500, -640, -780];
  R.artor.forEach((a, i) => {
    if (t < a || (i === 2 && t >= R.tak)) return;   // den tredje hoppar upp på taket på "Grön som en liten ärta"
    const u = (t - a) / 0.7, mal = x + ARTPLATS[i], start = -120;
    const ax = u < 1 ? lerp(start, mal, mjuk(u)) : mal, hopp = Math.abs(Math.sin(Math.PI * (t - a) / (K.BEAT * 1.0)));
    const y = FOT - 48 - (u < 1 ? 150 * Math.sin(Math.PI * kl(u)) : 40 * Math.pow(hopp, 2));
    arta(ax, y, 46, { mun: hopp > 0.7 ? 1 : 0, blink: bump(a + 2 + i, a + 2.15 + i, t) });
  });
  // ärtan på taket: hoppar upp från vägen på "Grön som en liten ärta!", blinkar, sitter kvar och gungar
  const tak = K.iTraktor([400, 128], { x, fot: FOT - gupp(t) });
  if (t >= R.tak) {
    const u = kl((t - R.tak) / 0.9), fr = [x - 780, FOT - 48], y = lerp(fr[1], tak[1], mjuk(u)) - 260 * Math.sin(Math.PI * u);
    const blink = bump(R.tak + 1.6, R.tak + 1.85, t);
    arta(lerp(fr[0], tak[0], mjuk(u)), y - 8 * Math.pow(Math.abs(Math.sin(Math.PI * (t - 9) / K.BEAT)), 2) * (u >= 1), 38,
      { lager: 'framfor', mun: u >= 1 ? 1 : 0, blink, kawaii: R.kawaii && t > R.tak + 0.9 && t < R.putt[0] ? 1 : 0 });
    if (u >= 1 && t < R.tak + 2.2) glitter(tak[0], tak[1], 60, R.tak + 0.9, 1.2);
  }
  puffar(R.putt);
  // Lova: armarna upp per "Grönt!", tittar upp mot ärtan och fnissar, kawaii på taket (bara refräng 1), spanar på "Titta ut!"
  const hej = R.ekon.reduce((m, a) => Math.max(m, bump(a - 0.05, a + 0.6, t)), 0);
  let f = ans('glad', 'jatteglad', 1.4 * hej), p = { armar: [6 + 60 * hej, 6 + 60 * hej] };
  if (t >= R.tak) { const upp = del(R.tak + 0.3, R.tak + 0.8, t) * (1 - del(R.putt[0] - 0.4, R.putt[0], t));
    f = R.kawaii && t > R.tak + 0.9 && t < R.putt[0] ? ans('fnissig', 'kawaii', del(R.tak + 0.9, R.tak + 1.2, t)) : ans('glad', 'fnissig', upp);
    p = { upp: 0.9 * upp, armar: [6, 6] }; }
  if (t >= R.putt[0]) { f = ans('glad', 'skrattar', 1.4 * R.putt.reduce((m, a) => Math.max(m, bump(a - 0.05, a + 0.35, t)), 0)); p = { armar: [6, 6] }; }
  if (t >= R.titta) { const sp = Math.sin(Math.PI * 2 * (t - R.titta) / 1.6); f = ans('nyfiken'); p = { rikt: sp, armar: [6, 50] }; }
  lova(f, p);
  narbild ? K.kamera(lerp(1.4, 1.7, del(R.tak, R.tak + 1.5, t)), x - 40, 470) : HEL();
}

// Feedback 26/11 (1:01 "peas goes away suddenly"): när refrängen slutar hoppar ärtorna iväg åt vänster ut ur bild, ärtan på
// taket hoppar först ner på vägen. Samma platser som i refrängens slut (refrang d–g, x = TX).
function artorUt() {
  const t = K.TID, UT = 62.5, D = 0.42, drift = vag(t) - vag(UT); if (t > 66) return;
  const tak = K.iTraktor([400, 128], { x: TX, fot: FOT });
  [[[TX - 500, FOT - 48], 0.05, 46], [[TX - 640, FOT - 48], 0.18, 46], [tak, 0.0, 38]].forEach(([p0, d, r], i) => {
    const P = [p0]; if (i === 2) P.push([TX - 560, FOT - 48]);   // landar till vänster om bakhjulet
    while (P.at(-1)[0] > -150) P.push([P.at(-1)[0] - 190, FOT - 48]);
    const s = t - UT - d; let x = p0[0], y = p0[1], luft = false;
    if (s > 0) { const k = Math.floor(s / D), u = s / D - k; if (k + 1 >= P.length) return;
      const a = P[k], b = P[k + 1]; x = lerp(a[0], b[0], mjuk(u)); y = lerp(a[1], b[1], mjuk(u)) - (i === 2 && k === 0 ? 160 : 100) * Math.sin(Math.PI * u); luft = u > 0.1 && u < 0.9; }
    if (i < 2 || s > D) x -= drift * (s > 0 ? 1 : 0);
    arta(x, y, r, { lager: i === 2 && s < D ? 'framfor' : 'pynt', mun: luft ? 1 : 0 });
  });
}
