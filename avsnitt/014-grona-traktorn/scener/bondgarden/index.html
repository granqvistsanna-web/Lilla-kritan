<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bondgården – 10 till 14h</title>
<style>
  html, body { margin:0; background:#F6C21C; overflow:hidden; }
  svg { width:100vw; height:100vh; display:block; }
</style>
</head>
<body>
<!-- Avsnitt 014, bondgården (storyboard 10–14h, 1:48.0–2:52.5), ärtvalvet (Sanna valde det ur skissen 2026-11-06).
     Tiderna ur storyboard/bygg.py via kit.manus(), orden ur rader.txt, slagen fästa med kit.takt.
     Platsen: plåten bakgrunder/bondgarden två gånger (x −W och 0, så att ladans dörr hamnar mitt i bild och höet till vänster), ett
     valv av ärtrankor i kod över bänken (många små platta skidor och en enda mogen, som glöder, högst upp), bänken i kod. Inget staket.
     Traktorn står i vänsterkanten med vagnen (../vagnen.js) bakom; helbilden skär traktorn, så att figurerna blir stora.
     10 kritsvep (gult), traktorn rullar in och stannar, Lova hoppar ner och går till bänken. 11a rakt klipp upp mot valvet: den mogna
     skidan. 11b skidan hoppar ner till Pips vinge och knäpper upp, en ärta hoppar till per "en, två, tre"; Lova sätter sig på bänken.
     11b2 Pip ger Lova och Gurra var sin ärta. 11c–11f leken (instrumentalt): ärtan på nosen, Lova jonglerar tre ärtor, Gurras ärta på huvudet,
     Lovas höga kast. 13a ärtan studsar på bänkkanten och ner. 13b rull in under bänken; Lova kliver ner. 13b2 hon når inte.
     13c ledsen, en tår. 13d "Vem kan hjälpa?". 14a närbild på Pip. 14a2 hon hoppar ner och trillar. 14b pick ×3 under bänken.
     14c ärtan till Lova. 14d Lova sätter sig igen, alla håller upp. 14e–f mums, hurra. 14g "Grönt! Nu kör vi!": Pip håller upp den
     tomma skidan som ett grönt ljus, alla tre hejar på bänken i helbilden. 14h samma bild: nya ärtskidor
     poppar ut i valvet, en per slag, alla gungar i takt (ingen traktor som kör, inget sken, Sanna 2026-11-06). Rakt klipp till discot. -->
<script src="../kit.js"></script><script src="../../../../verktyg/kant.js"></script><script src="../ansikten.js"></script><script src="../kritsvep.js"></script>
<script src="../traktorn.js"></script><script src="../trafikljus.js"></script><script src="../refrang.js"></script><script src="../mjukaposer.js"></script>   <!-- refrang.js (09g under svepet) behöver trafikljus.js -->
<script src="../vagnen.js"></script><script src="../artovergang.js"></script>
<script>
const { el, bild, lerp, mjuk, inUt, over, del, clamp, blink, BEAT, ROT } = kit;
const GUL = '#F6C21C';
// plåtens koordinater; bänken 14–400 framför ladans dörr (x 43–218), valvet över den
const G = { SITS: 535, GOLV: 600, GURRA_X: 85, PIP_X: 195, LOVA_SIT: 322, BIL_X: -250, FIG_S: 0.135, BIL_HP: 380, VAGN_H: 128 };
const BANK = [14, 400], BANK_X = 450;            // Lova står vid bänkens ände när hon försöker nå ärtan (13b–14c)
const VALV = { a: 0, b: 392, topp: 330, krona: 170 };   // stolparna x a och b, böjen börjar på y topp, styrpunkten på y krona
const SIT_DY = 12;                               // Lova sittande: fötterna så här långt under sitsen
const SKIDA = `${ROT}assets/rekvisita/artskida/`, SKIDA_BB = [96, 349, 915, 708], SKIDA_C = [505.5, 528.5];
const ARTOR = [[322, 420, 472, 532], [473, 411, 627, 527], [628, 407, 776, 513]];          // arta-1..3 (bbox), i skidans ruta
const ARTA_MITT = [[397, 476], [550, 469], [702, 460]];                                     // artskida-rigg.json
const SKIDA_H = 260, ARTA_H = 15;                                                            // skidan i Pips ruta, lös ärta i plåten
const MOGEN = { x: 196, y: 300, rot: -8, h: 34 }, PLANT_PIV = [505.5, 708], PLANT_SK = MOGEN.h / (708 - 369);   // den mogna skidan i valvet
// Lovas armar (traktorn.js PIV/SPETS), Pips vingar (spetsen uppmätt i riggen) och Gurras ritade armar (bygg.py SPETS)
const LPIV = { r: [808, 572], l: [206, 578] }, LSP = { r: [910, 665], l: [104, 672] };
const PPIV = { r: [809, 572], l: [206, 579] }, PSP = { r: [835, 612], l: [190, 614] };
const GPIV = { r: [807, 570], l: [208, 578] }, GSP = { r: [895, 655], l: [110, 660] };
const UPP_R = [1500, -700], UPP_L = [-480, -700];
const LOVA_ARM = 1.2;   // stående Lova: armarna lite sträckta
// 14g–14h: den tomma öppna skidan ritad i kod (lins() i refrang.js); bredd 1000 kring öppningens mitt
const OS = { B: 1000, HH: 200, LYFT: 42, SKAL: '#7AB440', SOM: '#588E32', INNE: '#B2DE60', GROP: '#86BA48', ART_T: [0.35, 0.5, 0.65] };
const oslins = (y0, upp, ner, n = 60) => {
  const topp = [], botten = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, f = Math.sin(Math.PI * t) ** 0.7, x = (t - 0.5) * OS.B, lyft = OS.LYFT * (2 * t - 1) ** 2;
    topp.push([x, y0 - upp * f - lyft]); botten.push([x, y0 + ner * f - lyft]);
  }
  return { topp, d: 'M' + [...topp, ...botten.reverse()].map(([x, y]) => `${x.toFixed(1)} ${y.toFixed(1)}`).join('L') + 'Z' };
};
function oppenSkida(parent) {
  const g = el('g', {}, parent), inre = el('g', {}, g), { B, HH } = OS, x0 = -B / 2;
  el('path', { d: oslins(0, 0.6 * HH, HH).d, fill: OS.SKAL }, inre);
  el('path', { d: `M${x0 + 8} -42C${x0 - 34} -60 ${x0 - 60} -110 ${x0 - 22} -128`, fill: 'none', stroke: OS.SKAL, 'stroke-width': 17, 'stroke-linecap': 'round' }, inre);
  el('path', { d: oslins(0, 0.48 * HH, 0.5 * HH).d, fill: OS.INNE }, inre);
  for (const t of OS.ART_T) el('ellipse', { cx: (t - 0.5) * B, cy: -OS.LYFT * (2 * t - 1) ** 2 + 0.05 * HH, rx: 0.065 * B, ry: 0.2 * HH, fill: OS.GROP }, inre);
  const fr = oslins(0.32 * HH, 0.02 * HH, 0.68 * HH);
  el('path', { d: fr.d, fill: OS.SKAL }, inre);
  el('path', { d: 'M' + fr.topp.slice(0, 60).map(([x, y], i) => `${x.toFixed(1)} ${(y + 0.12 * HH * Math.sin(Math.PI * i / 59) ** 0.7).toFixed(1)}`).join('L'), fill: 'none', stroke: OS.SOM, 'stroke-width': 9, 'stroke-linecap': 'round' }, inre);
  window.kant?.lagg(g, { andel: 0.01 });
  return g;
}
// valvets linje: vänstra stolpen upp, böjen, högra stolpen ner (u 0–1)
const valvP = u => {
  const { a, b, topp, krona } = VALV, ben = (G.GOLV - topp) / ((G.GOLV - topp) * 2 + (b - a) * 1.25);
  if (u < ben) return [a, lerp(G.GOLV - 4, topp, u / ben)];
  if (u > 1 - ben) return [b, lerp(topp, G.GOLV - 4, (u - 1 + ben) / ben)];
  const s = (u - ben) / (1 - 2 * ben), m = (a + b) / 2;
  return [(1 - s) ** 2 * a + 2 * s * (1 - s) * m + s * s * b, (1 - s) ** 2 * topp + 2 * s * (1 - s) * krona + s * s * topp];
};
const stjarnaD = r => { const k = r * 0.28; return `M0 ${-r}L${k} ${-k}L${r} 0L${k} ${k}L0 ${r}L${-k} ${k}L${-r} 0L${-k} ${-k}Z`; };
const vrid = (piv, sp, deg, sk = 1) => { const a = deg * Math.PI / 180, dx = (sp[0] - piv[0]) * sk, dy = (sp[1] - piv[1]) * sk;
  return [piv[0] + dx * Math.cos(a) - dy * Math.sin(a), piv[1] + dx * Math.sin(a) + dy * Math.cos(a)]; };
const vinkel = (piv, sp, [x, y]) => (Math.atan2(y - piv[1], x - piv[0]) - Math.atan2(sp[1] - piv[1], sp[0] - piv[0])) * 180 / Math.PI;
const bage = (a, b, k, lyft) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k) - 4 * lyft * k * (1 - k)];
const pulser = (t, tider, langd = 0.4) => tider.reduce((m, x) => Math.max(m, Math.sin(Math.PI * clamp((t - x + 0.06) / langd))), 0);
const inom = (t, [a, b]) => t >= a && t < b;

let M, T = {}, CAM, r, vagG, gardG, bil, vagn, lova, lovaG, lovaArm, pip, pipA, gurra, gurraA, skida, mogen, sitsFram, losa = [], tar, glimt, kodSkida, nya = [];
let LOVA_FACE, LOVA_S, LK_S, BIL_HALV, VAGN_DX;
const NYA = [0.2, 0.8, 0.32, 0.68, 0.42, 0.58];   // var i valvet de nya skidorna poppar ut (u längs böjen), i den ordningen

async function bygg() {
  M = await kit.manus();
  const A0 = M.bild('10')[0], AV = A0 - M.av, S = x => x - A0;
  const tk = x => kit.takt(x + AV) - AV;   // scentid → närmaste uppmätta slag
  const efter = { efter: AV - 0.1 };
  const rad = x => M.rad(x, efter), R = x => rad(x).t + M.av - A0;
  const tider = x => { const r0 = rad(x); return [r0.t, ...[...r0.text.matchAll(/\((\d+):(\d+(?:\.\d+)?)/g)].map(m => +m[1] * 60 + +m[2])].map(s => s + M.av - A0); };
  for (const id of ['10', '11a', '11b', '11b2', '11c', '11d', '11e', '11f', '13a', '13b', '13b2', '13c', '13d', '14a', '14a2', '14b', '14c', '14d', '14e', '14f', '14g', '14h']) T[id] = S(M.bild(id)[0]);
  T.SLUT = S(M.bild('14h')[1]);
  // ordtiderna (scentid)
  T.VAD = R('Vad är grönt'); T.ARTOR = R('Ärtorna är gröna'); T.ETT = tider('två, (1:45');   // "en, (1:44.6) två, (1:45.4) tre!"
  T.EN3 = R('En, en, en'); T.VAR = tider('En till var och en');
  T.OJ = R('Oj, oj'); T.RULL = R('Rull, rull'); T.UNDER = R('in under bänken'); T.TRE = R('men vi är tre');
  T.LEDSEN = R('Leoparden är ledsen'); T.SNYFT = R('snyft, snyft'); T.VEM = tider('Vem kan hjälpa'); T.TICK = R('Tick, tack');
  T.KYCK = tider('Kycklingen'); T.NER = R('Hoppar ner'); T.TRILL = R('oj, hon trillar'); T.UPP = R('Upp igen');
  T.PICK = tider('pick, (2:29'); for (let i = 1; i < 3; i++) T.PICK[i] = Math.max(T.PICK[i], T.PICK[i - 1] + 0.3);
  T.HAR = R('Här är ärtan'); T.TACK = R('tack, tack, tack'); T.VAR3 = R('En ärta var'); T.MUMS = R('Mums, mums'); T.HURRA = R('hurra');
  T.GRONT = [R('Grönt! Nu kör vi'), M.rad('Grönt! Nu kör vi', { efter: rad('Grönt! Nu kör vi').t + 0.5 }).t + M.av - A0];
  const h = BEAT / 2;
  T.SV1 = 1.3;                                     // kritsvepet täcker bilden (0 → 0,5), smular bort till 1,75
  T.IN = [0.3, 1.9];                               // traktorn rullar in och stannar
  T.NED = [tk(2.1), tk(2.1) + 0.55];               // Lova hoppar lugnt ner
  T.GA = [T.NED[1] + 0.15, T['11b'] + 0.1];        // och går fram till bänken
  T.SITT1 = [T['11b'] + 0.2, T['11b'] + 0.8];      // och hoppar upp på den
  T.PLOCK = [T['11b'], T['11b'] + 0.6];            // skidan hoppar från valvet till Pips vinge
  T.OPP = Math.max(T.ARTOR + 0.2, T.PLOCK[1] + 0.15);   // och knäpper upp
  const pek = tk(T.EN3);
  T.PEK = [pek, pek + h, pek + 2 * h, T.VAR[0], T.VAR[0] + h, T.VAR[0] + 2 * h, T.VAR[1], T.VAR[1] + h, T.VAR[1] + 2 * h];
  T.GE1 = [T.PEK[0] + 0.05, T.PEK[0] + 0.55];      // Lovas ärta hoppar till hennes tass
  T.GE3 = [T.PEK[2] + 0.05, T.PEK[2] + 0.55];      // Gurras ärta
  // leken (11c–11f, instrumentalt)
  T.NOS = [T['11c'] + 0.5, T['11c'] + 1.0]; T.NOSB = [T['11c'] + 3.1, T['11c'] + 3.5];   // ärtan på nosen och tillbaka i tassen
  T.KAST = [];   // (förr: kasta och fånga mellan Lova och Pip i 11d; nu jonglerar Lova, Sanna 2026-11-06: "maybe lova juggles three peas")
  T.JONG = [T['11d'] + 0.3, T['11d'] + 0.8, T['11e'] - 1.0, T['11e'] - 0.45];   // Pip och Gurra kastar sina ärtor till Lova, hon jonglerar, kastar tillbaka
  T.JONG_P = 3 * BEAT;   // ett varv runt för varje ärta (tre slag)
  T.HUVUD = [T['11e'] + 0.4, T['11e'] + 0.9]; T.HUVUDB = [T['11e'] + 3.2, T['11e'] + 3.6];   // Gurras ärta på huvudet
  T.KAST3 = [tk(T['11f'] + 0.9), tk(T['11f'] + 0.9) + 0.9];   // Lovas höga kast, ut ur bild uppåt
  T.HOPPAR = [T.OJ + 0.2, tk(T.OJ + 1.1), tk(T.OJ + 1.1) + 0.55, tk(T.OJ + 1.1) + 0.95];   // ner ur luften, bänkkanten, golvet, studs
  const rull = tk(T.RULL);
  T.RULLAR = [rull, rull + h, rull + 2 * h, T.UNDER];
  T.GAR = [T.UNDER + 0.2, T.UNDER + 0.9];          // Lova kliver ner från bänken till dess ände
  T.AHNEJ = [T.TRE + 1.9, T.TRE + 2.7];            // hon böjer sig och sträcker tassen in under bänken, når inte
  T.TAR = T.LEDSEN + 0.3;
  T.LAGG = [T.KYCK[1] - 0.2, T.KYCK[1] + 0.3];    // Pip lägger skidan på bänken
  T.HOPP_NER = [T.NER, T.NER + 0.55]; T.UPPE = [T.UPP, T.UPP + 0.4];
  T.UT = T.PICK[2] + 0.12;
  T.HOPP_UPP = [T.HAR, T.HAR + 0.5]; T.KNYCK = [T.HAR + 0.7, T.HAR + 1.2];
  const tack = tk(T.TACK);
  T.TACKV = [tack, tack + h, tack + 2 * h];
  T.SITT2 = [T['14d'] - 0.1, T['14d'] + 0.4];      // Lova sätter sig igen
  T.ALLA = T.VAR3 + 0.9;
  T.ATA = [T.MUMS - 0.35, T.MUMS];
  const mums = tk(T.MUMS);
  T.MUMSAR = [mums, mums + h, mums + 2 * h];
  // 14g–14h: Pip lyfter skidan, nya skidor poppar ut i valvet (en per slag)
  T.LYFT = [T.GRONT[0] - 0.1, T.GRONT[0] + 0.35];
  T.HOPB = [Infinity, Infinity];                   // Lova blir kvar på bänken
  T.POPP = NYA.map((_, i) => T['14g'] + 1.0 + i * BEAT).filter(x => x < T.SLUT - 0.3);
  T.BLINK = [3.6, 6.2, 11.4, 15.0, 22.5, 26.0, 37.0, 46.0, 55.6, 61.5];

  // ---------- duken: vägen under kritsvepet, bondgården sedan, åkern i 14h ----------
  const L = kit.duk(null);
  kit.lager.overst.setAttribute('transform', `translate(${-0.06 * W} ${-0.06 * H}) scale(${1.12 * W / 1920})`);   // kritsvep.js ritar i 1920 × 1080
  vagG = el('g', {}, L.plate);
  bild(ROT + kit.VAG_PLATTA, vagG, { width: W, height: H, preserveAspectRatio: 'xMidYMid slice' });
  kit.vag(vagG);
  gardG = el('g', {}, L.plate);
  for (const x of [-W, 0]) bild(`${ROT}assets/bakgrunder/bondgarden/bondgarden.png`, gardG, { x, width: W, height: H, preserveAspectRatio: 'none' });
  const defs = L.figurer.ownerSVGElement.querySelector('defs');
  // bänkens ben, valvet (stolparna och böjen i trä, rankorna med blad och små platta skidor), den mogna skidan
  const ben = el('g', { fill: '#704626' }, gardG);
  for (const x of [BANK[0] + 18, BANK[1] - 31]) el('rect', { x, y: G.SITS, width: 13, height: G.GOLV - G.SITS }, ben);
  const sits = parent => el('rect', { x: BANK[0], y: G.SITS - 6, width: BANK[1] - BANK[0], height: 18, fill: '#966034' }, parent);
  sits(gardG);
  const linje = (n, f) => 'M' + Array.from({ length: n + 1 }, (_, i) => f(i / n).map(v => v.toFixed(1)).join(' ')).join('L');
  el('path', { d: linje(80, valvP), fill: 'none', stroke: '#C89258', 'stroke-width': 14, 'stroke-linejoin': 'round' }, gardG);
  const rankor = el('g', {}, gardG);
  for (const [fas, amp] of [[0, 7], [2.1, 5]])
    el('path', { d: linje(160, u => { const [x, y] = valvP(u); return [x + amp * Math.sin(u * 46 + fas), y + amp * Math.cos(u * 46 + fas)]; }),
      fill: 'none', stroke: '#34803A', 'stroke-width': 5, 'stroke-linecap': 'round' }, rankor);
  for (let i = 1; i < 40; i++) {   // blad om vartannat på var sida, små platta skidor som hänger ner (inte i den nedersta biten)
    const u = i / 40, [x, y] = valvP(u), s = i % 2 ? 1 : -1, d = 14;
    el('ellipse', { cx: x + s * d, cy: y - 4, rx: 15, ry: 8, transform: `rotate(${s * -25} ${x + s * d} ${y - 4})`, fill: '#62B64A' }, rankor);
    if (y < G.GOLV - 90 && i % 3 !== 1 && Math.abs(x - MOGEN.x) > 30)
      el('ellipse', { cx: x - s * 6, cy: y + 14, rx: 4.5, ry: 12, transform: `rotate(${s * 12} ${x - s * 6} ${y + 14})`, fill: '#A8D46A' }, rankor);
  }
  window.kant?.lagg(rankor, { andel: 0.01 });
  el('path', { d: `M${MOGEN.x} ${valvP(0.5)[1] + 2}V${MOGEN.y - MOGEN.h + 6}`, stroke: '#34803A', 'stroke-width': 4 }, gardG);
  mogen = el('g', { transform: `translate(${MOGEN.x} ${MOGEN.y}) rotate(${MOGEN.rot}) scale(${PLANT_SK.toFixed(4)}) translate(${-PLANT_PIV[0]} ${-PLANT_PIV[1]})` }, gardG);
  bild(`${SKIDA}cut/artskida-stangd.png`, mogen);
  window.kant?.lagg(mogen, { andel: 0.01 });
  // 14g–14h: nya skidor som poppar ut i valvet (samma bild som den mogna), i en kort stjälk under böjen
  nya = NYA.map(u => {
    const [x, y] = valvP(u), g = el('g', {}, gardG);
    el('path', { d: `M${x} ${y + 2}V${y + 14}`, stroke: '#34803A', 'stroke-width': 4 }, g);
    const i = el('g', {}, g);
    bild(`${SKIDA}cut/artskida-stangd.png`, el('g', { transform: `rotate(${(u < 0.5 ? -1 : 1) * 10}) scale(${PLANT_SK.toFixed(4)}) translate(${-PLANT_PIV[0]} -369)` }, i));
    window.kant?.lagg(i, { andel: 0.01 });
    return { g, i, x, y: y + 12 };
  });

  // figurerna bakifrån: vagnen, stående Lova, traktorn, Gurra, Pip, bänkens sits igen, skidan, de lösa ärtorna och tåren
  vagn = vagnen.ny(L.figurer);
  lovaG = el('g', {}, L.figurer);
  bil = await traktorn.ny(L.figurer, M);
  LK_S = M.matt.LOVA_I.k * G.BIL_HP / (bil.BB[3] - bil.BB[1]);
  LOVA_S = 1.15 * LK_S;
  BIL_HALV = (bil.BB[2] - bil.BB[0]) / 2 * G.BIL_HP / (bil.BB[3] - bil.BB[1]);
  VAGN_DX = BIL_HALV + 100 * G.VAGN_H / 120 - 20;   // vagnens mitt bakom traktorns mitt (dragstången in under traktorn)
  lova = await traktorn.lova(lovaG, { s: LOVA_S }, 'kropp');
  lovaArm = await traktorn.lova(lovaG, { s: LOVA_S }, 'armar');
  for (const b of ['leg-l', 'leg-r']) lova.delar[b].style.display = '';
  gurra = await kit.figur('grodan-gurra', { forelder: L.figurer }); gurraA = ansikten.iFigur(gurra);
  pip = await kit.figur('kycklingen-pip', { forelder: L.figurer }); pipA = ansikten.iFigur(pip);
  sitsFram = sits(L.figurer);
  skida = el('g', {}, L.figurer);
  kodSkida = oppenSkida(L.figurer);
  const skInre = el('g', { transform: `translate(${-SKIDA_C[0]} ${-SKIDA_C[1]})` }, skida);
  skida.stangd = bild(`${SKIDA}cut/artskida-stangd.png`, skInre); skida.tom = bild(`${SKIDA}cut/artskida-tom.png`, skInre);
  skida.artor = [1, 2, 3].map(i => bild(`${SKIDA}cut/artskida-arta-${i}.png`, skInre));
  window.kant?.lagg(skida, { andel: 0.01 });
  losa = ARTOR.map((bb, i) => {
    const g = el('g', {}, L.figurer), inre = el('g', {}, g);
    bild(`${SKIDA}cut/artskida-arta-${i + 1}.png`, el('g', { transform: `translate(${-(bb[0] + bb[2]) / 2} ${-(bb[1] + bb[3]) / 2})` }, inre));
    window.kant?.lagg(g, { andel: 0.01 });
    return { g, bb };
  });
  tar = el('path', { d: 'M0 -30C14 -8 22 6 0 24C-22 6 -14 -8 0 -30Z', fill: '#8FD3F4', stroke: '#fff', 'stroke-width': 5 }, L.figurer);
  glimt = el('path', { d: stjarnaD(1), fill: '#fff' }, L.figurer);
  // refrängens sista bild (09g) under kritsvepet
  r = await refrang.ny(M, '09', S);
  await r.bygg(L, bil);

// Lovas läge: i traktorn, hoppar ner, går, sitter på bänken, står vid bänkens ände, hoppar upp i traktorn igen
function lovaLage(t, sate) {
  const sitt = [G.LOVA_SIT, G.SITS + SIT_DY], vid = [BANK_X, G.GOLV + 6];
  const hopp = (a, b, [t0, t1], lyft, s0 = LOVA_S, s1 = LOVA_S) => {
    const q = mjuk(del(t0, t1, t)), hp = mjukaPoser.hopp(t, t0, t1, 0, 0.14, 0.2), [x, y] = bage(a, b, q, lyft);
    return { x, y, s: lerp(s0, s1, q), sx: hp.sx, sy: hp.sy, ben: kit.benHopp(Math.sin(Math.PI * q)), framfor: true };
  };
  const ga = (a, b, [t0, t1]) => {
    const q = del(t0, t1, t), steg = Math.sin(Math.PI * (t - t0) / (BEAT / 2)), ror = q > 0 && q < 1;
    return { x: lerp(a[0], b[0], mjuk(q)), y: a[1] - (ror ? 4 * Math.abs(steg) : 0), s: LOVA_S, ben: ror ? { 'leg-l': 10 * steg, 'leg-r': 10 * steg } : {}, framfor: true };
  };
  const sitter = { x: sitt[0], y: sitt[1], s: LOVA_S, ben: sittBen, framfor: false };
  if (t < T.NED[0]) return null;
  // hon landar till vänster om bänken (fri från Gurra) och går bakom Gurra och Pip, bakom sitsen, inte över dem (granskningen 2026-11-06)
  if (t < T.NED[1]) return { ...hopp(sate, [-25, G.GOLV + 6], T.NED, 30, LK_S, LOVA_S), bakom: true };
  if (t < T.SITT1[0]) return { ...ga([-25, G.GOLV + 6], [G.LOVA_SIT + 40, G.GOLV + 6], T.GA), vanner: t > T.GA[0] };
  if (t < T.SITT1[1]) return { ...hopp([G.LOVA_SIT + 40, G.GOLV + 6], sitt, T.SITT1, 22), framfor: false };
  if (t < T.GAR[0]) return sitter;
  if (t < T.GAR[1]) return hopp(sitt, vid, T.GAR, 18);
  if (t < T.SITT2[0]) return { x: vid[0], y: vid[1], s: LOVA_S, ben: {}, framfor: true };
  if (t < T.SITT2[1]) return { ...hopp(vid, sitt, T.SITT2, 22), framfor: false };
  if (t < T.HOPB[0]) return sitter;
  if (t < T.HOPB[1]) return { ...hopp(sitt, sate, T.HOPB, 60, LOVA_S, LK_S), framfor: false };
  return null;   // i traktorn
}

      else if (t < T.JONG[2]) pos[i] = runt(i);
      else if (i) pos[i] = bage(runt(i), fran[i], mjuk(del(T.JONG[2], T.JONG[3], t)), 30);
      else pos[0] = bage(runt(0), pos[0] || runt(0), mjuk(del(T.JONG[2], T.JONG[3], t)), 10);
    }
  }
  pos.forEach((p, i) => {
    skida.artor[i].style.display = oppen && p === null ? '' : 'none';
    if (p === null && oppen) {
      const hh = Math.sin(Math.PI * clamp((t - T.ETT[i] + 0.05) / 0.35));
      skida.artor[i].setAttribute('transform', `translate(0 ${(-40 * hh).toFixed(1)})`);
    }
    const loss = Array.isArray(p) ? p : null;
    const krymp = loss && t >= T.ATA[0] && t < T.ATA[1] ? 1 - 0.6 * del(...T.ATA, t) : 1;
    satt(losa[i].g, loss || [null], ARTA_H * krymp, losa[i].bb, loss && i === 0 && t > T.RULLAR[0] && t < T.PICK[0] ? 8 * Math.sin(t * 7) : 0);
  });

  // ---------- tåren (13c) och glimten på skidan (14g–14h) ----------
  if (t >= T['13c'] && t < T['13d']) {
    const q = mjuk(del(T.TAR, T.TAR + 0.5, t)), [x, y] = lova.punkt([470, 480 + 50 * mjuk(del(T.TAR + 0.6, T['13d'], t))]);
    const o = lova.punkt([0, 0]), ls = Math.hypot(...lova.punkt([100, 0]).map((v, j) => v - o[j])) / 100;
    tar.style.display = '';
    tar.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${(ls * 0.9 * q).toFixed(4)})`);
  }
  if (stor > 0) {
    const [gx, gy] = sk, gk = del(...(t < T.GRONT[1] ? [T.GRONT[0], T.GRONT[0] + 0.7] : [T.GRONT[1], T.GRONT[1] + 0.7]), t);
    if (gk > 0 && gk < 1) {
      glimt.style.display = '';
      glimt.setAttribute('transform', `translate(${gx + 0.4 * (SKIDA_BB[2] - SKIDA_BB[0]) * skS} ${gy - 0.25 * (SKIDA_BB[2] - SKIDA_BB[0]) * skS}) rotate(${40 * gk}) scale(${(10 * Math.sin(Math.PI * gk)).toFixed(2)})`);
    }
  }
  kit.kamera(...kam, true);   // fri på gården: traktorn och vagnen står till vänster om plåten (plåten ligger två gånger)
}
