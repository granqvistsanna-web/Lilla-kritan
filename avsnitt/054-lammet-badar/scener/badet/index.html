<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Lammet badar</title>
<style>html, body { margin:0; background:#000; overflow:hidden } svg { width:100vw; height:100vh; display:block; }</style>
</head>
<body>
<!-- 054 Lammet badar: hela kodscenen (grind 6). Mått och teckningar som storyboarden (../../storyboard/scen.html), rörelserna som
     041:s scen, tiden och raderna ur rader.json (skrivs av storyboard/bygg.mjs). Kritan går genom verktyg/kritan-ritar.js.
     Rendera: node verktyg/render-delat.mjs avsnitt/054-lammet-badar/scener/badet [--snabb].
     Bara hårda klipp; den enda åkningen är zoomen in i teckningen. Kritan är liten, utan ansikte, knackar aldrig. -->
<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="boil" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="5000">
      <feTurbulence id="brus" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
      <feDisplacementMap in="SourceGraphic" scale="2.5"/>
    </filter>
    <filter id="korn" x="0" y="0" width="1" height="1">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="2"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.47  0 0 0 0 0.36  1.1 0 0 0 -0.47"/>
    </filter>
    <radialGradient id="vinjett" cx="50%" cy="50%" r="75%"><stop offset="0.55" stop-color="#3a2410" stop-opacity="0"/><stop offset="1" stop-color="#3a2410" stop-opacity="0.14"/></radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="#FAF8F2"/>
  <g id="kamera">
    <g id="platta" data-djup-ramp="815:-0.1 905:0 1080:0.18"></g>   <!-- djup-kit: väggen bak, golvet följer fötterna (vägglinjen y 815 uppmätt i plattan) -->
    <g id="vagg" data-djup="-0.1"></g>
    <g id="bak"></g>
    <g id="anga"></g>
    <g filter="url(#boil)"><g id="anka"></g></g>
    <g filter="url(#boil)"><g id="figurer"></g></g>
    <g id="kar"></g>
    <g id="fram" filter="url(#boil)"></g>
    <g id="angaFram"></g>
    <g filter="url(#boil)"><g id="figurerFram"></g></g>
    <g filter="url(#boil)"><g id="saker"></g></g>
    <g id="pilar"></g>
  </g>
  <g id="ram"></g>
  <g id="gomda" opacity="0"></g>
</svg>
<script src="/verktyg/blinka.js"></script>
<script src="/verktyg/kant.js"></script>
<script src="/verktyg/kritan-ritar.js"></script>
<script src="/verktyg/djup3d.js"></script>
<script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script>
const $ = id => document.getElementById(id);
const A = '/assets/', R = A + 'rekvisita/';
const lagg = (id, h) => $(id).insertAdjacentHTML('beforeend', h);
const f1 = v => (+v).toFixed(1);
const kl = (k, a = 0, b = 1) => Math.max(a, Math.min(b, k)), lerp = (a, b, k) => a + (b - a) * k;
const mjuk = k => (k = kl(k), k * k * (3 - 2 * k)), del = (a, b, t) => mjuk((t - a) / (b - a));
const bump = (a, b, t) => (t <= a || t >= b) ? 0 : Math.sin(Math.PI * (t - a) / (b - a));
const lerp2 = (A, B, k) => [lerp(A[0], B[0], k), lerp(A[1], B[1], k)];

// --- Filer och mått (som storyboarden) -------------------------------------------------------------------------------------
const PLATTA = A + 'bakgrunder/badrummet/badrummet-v1.jpeg';
const KAR_S = 0.88, KAR = R + 'badkar/cut/badkar-bla-kran-tunn.png', KAR_W = 1044 * KAR_S, KAR_H = 687 * KAR_S, KAR_LAPP = 240 * KAR_S, KAR_Y0 = 905 - 668 * KAR_S;
const PALL = R + 'pall/cut/pall.png', PALL_KS = 0.5;
const HD = R + 'handduk/cut/handduk-rutig-tunn.png', HD_UK = R + 'handduk/cut/handduk-rutig-utan-knopp-tunn.png', HD_H = 434, HD_W = HD_H * 538 / 1033, HK = HD_H / 1033;
const ANKA_BILD = R + 'badanka/cut/badanka.png', ANKA_H = 120, ANKA_OGA = [228, 122];
const BAT_BILD = R + 'badbat/cut/badbat.png', BAT_H = 115;                                       // båten som kritan ritar (041)
const BORSTE = R + 'borste/cut/borste.png', BO_W = 873, BO_H = 316, BO_K = 150 / 873, BO_SPETS = [260, 40];   // borsten, vridpunkt i borstspetsen

const GOLV = 905, KX = 1420;
const KANT = KAR_Y0 + KAR_LAPP;
const BADKANT = 520;                                // riggens y vid badkarskanten: öronen och ögonen syns
const STA = [430, GOLV];
const PALL_X0 = KX - KAR_W / 2 + 25 - 778 * PALL_KS, PALL_Y0 = GOLV - 548 * PALL_KS;
// pallens två steg (pall.png 781 × 551): nedre stegets ovansida y 212, x 40–330; övre y 4, x 360–760
const STEG1 = [PALL_X0 + 185 * PALL_KS, PALL_Y0 + 238 * PALL_KS], STEG2 = [PALL_X0 + 565 * PALL_KS, PALL_Y0 + 32 * PALL_KS];
const KROK = [150, 300];
const ANKA_VID = [KX - 230, KANT + 2];   // Sanna 26/11 1:31: 14 px lägre, så att ankan flyter i vattnet (förut KANT − 12, svävade över kanten)   // QA 26/11: 30 px till höger, så att tassen inte ligger över näbben när lammet står på pallen
const OVER_KANT = x => x > KX - KAR_W / 2 - 46;   // fötterna når karets vänstra kant: lammet ritas bakom karets framsida
const SKUGGA_KANT = x => kl((KX - KAR_W / 2 - x) / 70);   // kontaktskuggan tonas bort när lammet är över karet
const ANKA_GOMD = [KX + 250, KANT + 22];
const GOMSTUSS = [KX + 370, KANT + 8, 32];   // Sanna 26/11 1:31 "putsa de stora bubblorna till höger": 32 (förut 48), helt innanför karets högra kant (x 1846)   // höger om det röda vredet, så att det syns helt   // tussen vid kranen, mindre (Sanna 26/11, förut 78)
let FOT = 930, GS = 0.572;
// omgång 2: lammet flyttar sig åt höger i badet (LDX) så att båten får plats mellan ankan och lammet
// Sanna 26/11 1:31 "ankan flyger i luften utanför badkaret": ankan stod på karets vänstra kant (karets kant börjar x 1001). Nu inne i vattnet,
// båten och lammet flyttade lika mycket åt höger så att avståndet och bonken är som förut
const LDX = 100, ANKA3 = [1085, ANKA_VID[1]], BATP = [1240, KANT - 8], BAT3 = [1218, KANT - 8];
// borsten ligger på golvet från början (Sanna 25/11: "brush laying on floor"), lammet tar med den upp i badet och tappar den när båten bonkar
const BO_GOLV = [STA[0] + 150, GOLV - 18];   // ligger platt på golvet framför pallen (efter borstningen)
// omgång 2d (Sanna 25/11 "place brush on the floor and lamm dont bring it in to tub", val A "bakom pallen"): borsten ligger på golvet
// (spegelvänd, skaftet åt vänster), glider in bakom pallens nedre steg när lammet landar på det. Skaftet och en bit av det rosa huvudet sticker fram,
// så att barnet känner igen borsten (QA 25/11: syns tydligt från "Ser du borsten?" till "Där är borsten! Bakom pallen!")
// omgång 3 (Sanna 26/11 "other placement closer to bathtub for brush"): borsten ligger mellan pallen och badkaret och glider in bakom pallens högra kant,
// bara det rosa huvudet sticker fram mot badkaret
const BO_START = [1098, GOLV - 18], BO_PALL = [996, GOLV - 88], BO_SKAFTET = [BO_PALL[0] + 5, GOLV - 90];   // QA 26/11: 18 px högre, så att foten är ovanför pallens fot och borsten läses som bakom   // bakom pallen ligger den längre bak på golvet (högre upp), helt ovanför pallens fot   // skaftets ände, sticker fram vid pallens vänstra kant
const boGolv = x => { const u = kl((x - BO_START[0]) / (BO_PALL[0] - BO_START[0])); return [[x, lerp(BO_START[1], BO_PALL[1], u)], 0, x - 105 < PALL_X0 + 386 ? 'vagg' : 'fram', true]; };   // bakom pallen när skaftets ände når pallens högra kant

let L, G, BLINKA, TT = 0, ZOOM = 1, RAD = [], RR = {}, IDX = {}, ROSTER = [], BORTA = {}, DURATION = 0;
const SVART = 0.6;
const LN = n => ROSTER.find(r => +r[0].slice(0, 2) === n).at(-1);   // rader.json: [namn, längd]
const M = (id, n) => RR[id].malin.find(x => x[0] === n)[1];        // när repliken n börjar i raden
const fran = (id, n) => IDX[id] >= IDX[n];
const iFig = ([x, fot], [px, py], s = GS) => [x + (px - 512) * s, fot + (py - FOT) * s];
const IKAR = (sjunk = 0) => [KX - 60, KANT + (FOT - BADKANT) * GS + sjunk * GS];
const IKAR_ANKA = () => [IKAR()[0] - 230, ANKA_VID[1]];

function kamera(zoom = 1, cx = 960, cy = 540) {
  ZOOM = zoom;
  const tx = Math.max(1920 - 1920 * zoom, Math.min(0, 960 - cx * zoom)), ty = Math.max(1080 - 1080 * zoom, Math.min(0, 540 - cy * zoom));
  $('kamera').setAttribute('transform', `translate(${f1(tx)} ${f1(ty)}) scale(${zoom})`);
  $('brus').nextElementSibling.setAttribute('scale', (2.5 / zoom).toFixed(2));   // line boil 2,5 px i bild
}

// --- Badrummet ---------------------------------------------------------------------------------------------------------------
const knopp = () => `<circle cx="${f1(KROK[0])}" cy="${f1(KROK[1] + 58 * HK)}" r="${f1(44 * HK)}" fill="#a9b7c2"/><circle cx="${f1(KROK[0])}" cy="${f1(KROK[1] + 56 * HK)}" r="${f1(36 * HK)}" fill="#c9d5dd"/><circle cx="${f1(KROK[0] - 12 * HK)}" cy="${f1(KROK[1] + 44 * HK)}" r="${f1(11 * HK)}" fill="#fff" opacity="0.8"/>`;
function badrum({ handduk = false, gomstuss = true } = {}) {
  $('platta').innerHTML = `<image href="${PLATTA}" width="1920" height="1080" preserveAspectRatio="xMidYMid slice"/>`;
  lagg('vagg', knopp());
  if (handduk) lagg('vagg', `<image href="${HD}" x="${f1(KROK[0] - HD_W / 2)}" y="${KROK[1]}" width="${f1(HD_W)}" height="${HD_H}"/>`);
  lagg('bak', `<image href="${PALL}" x="${f1(PALL_X0)}" y="${f1(PALL_Y0)}" width="${f1(781 * PALL_KS)}" height="${f1(551 * PALL_KS)}"/>`);
  $('kar').innerHTML = `<image href="${KAR}" x="${f1(KX - KAR_W / 2)}" y="${f1(KAR_Y0)}" width="${f1(KAR_W)}" height="${f1(KAR_H)}"/>`;
  skumKant(gomstuss);
}
const tuss = (x, y, r, kant = '#cfe6ee', fill = '#fff') => [[0, 0, 1], [-0.8, 0.25, 0.7], [0.8, 0.2, 0.75], [-0.35, -0.55, 0.65], [0.4, -0.5, 0.6]]
  .map(([dx, dy, k]) => `<circle cx="${f1(x + dx * r)}" cy="${f1(y + dy * r)}" r="${f1(k * r)}" fill="${fill}" stroke="${kant}" stroke-width="${f1(0.08 * r)}" paint-order="stroke"/>`).join('');
function skumKant(gomstuss) {   // skummet andas lite. Sanna 26/11 "less bubbles in the bathtub overall": 8 tussar i stället för 15, mindre. 1:31 (26/11): bara innanför karets kant (x 1055–1645, förut började de utanför vid 950), jämnare storlek
  let h = ''; for (let i = 0; i < 8; i++) { const u = i / 7, x = KX - 365 + 590 * u, r = (22 + 8 * Math.abs(Math.sin(i * 2.3))) * (1 + 0.04 * Math.sin(TT * 1.7 + i));
    h += tuss(x, KANT + 16 - 0.4 * r, r); }   // lite lägre, så att munnen syns
  if (gomstuss) h += tuss(GOMSTUSS[0], GOMSTUSS[1], GOMSTUSS[2] * (1 + 0.025 * Math.sin(TT * 1.3)));
  lagg('fram', h);
  // glitterbubblorna (djup.skum) borttagna helt, Sanna 26/11 "still too much foam"
}
const droppe = (x, y, s = 1, o = 1) => `<path d="M${f1(x)} ${f1(y - 14 * s)} Q${f1(x + 9 * s)} ${f1(y)} ${f1(x)} ${f1(y + 6 * s)} Q${f1(x - 9 * s)} ${f1(y)} ${f1(x)} ${f1(y - 14 * s)}Z" fill="#a9dcf0" stroke="#fff" stroke-width="${f1(3 * s)}" opacity="${kl(o).toFixed(2)}"/>`;
const stjarna = (x, y, r, o = 1) => `<path transform="translate(${f1(x)} ${f1(y)}) scale(${r.toFixed(2)})" opacity="${kl(o).toFixed(2)}" d="M0 -1 L.2 -.2 L1 0 L.2 .2 L0 1 L-.2 .2 L-1 0 L-.2 -.2Z" fill="#fff6c8" stroke="#e6b422" stroke-width=".06"/>`;
function skimmer(x, y, k, s = 1) { if (k <= 0.01) return;
  lagg('fram', [[-1, -0.7, 1], [1.1, -0.4, 0.8], [0.2, 1.1, 0.7], [-1.2, 0.8, 0.6]].map(([dx, dy, z], i) => stjarna(x + dx * 40 * s, y + dy * 34 * s, 16 * z * k * s * (0.75 + 0.25 * Math.sin(TT * 3 + i * 1.7)), 0.4 + k)).join('')); }
const ull = (x, y, r) => `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}" fill="#FFF8EF" stroke="#DCC8B6" stroke-width="${f1(r * 0.12)}" paint-order="stroke"/>`;
const pol = (x, k = 1) => k > 0.01 ? lagg('bak', `<ellipse cx="${f1(x)}" cy="${GOLV + 6}" rx="${f1(150 * k)}" ry="${f1(16 * k)}" fill="#a9dcf0" opacity=".55"/>`) : 0;

// --- Kritan (verktyg/kritan-ritar.js) ----------------------------------------------------------------------------------------
const kritaRita = kr => { if (kr) lagg('pilar', kritaBild(kr.x, kr.y, kr)); };

// --- Badankan (rekvisita/badanka.md, konturen från 020) ------------------------------------------------------------------------
const ANKA_KONTUR = [[78, 472], [82, 424], [94, 380], [115, 342], [139, 311], [150, 280], [131, 250], [60, 242], [16, 214], [18, 178], [62, 152],
  [102, 152], [110, 118], [124, 86], [144, 58], [169, 35], [199, 19], [230, 8], [263, 3], [297, 3], [330, 12], [361, 28], [388, 50], [410, 80],
  [428, 110], [439, 147], [438, 193], [406, 271], [440, 270], [482, 273], [531, 286], [560, 296], [640, 260], [690, 236], [705, 280], [711, 313],
  [710, 380], [696, 445], [669, 503], [629, 553], [584, 593], [534, 623], [480, 639], [429, 651], [379, 657], [330, 657], [282, 652], [236, 639],
  [189, 624], [147, 598], [112, 563], [88, 520], [78, 472]];
const ANKA_MITT = [358, 360];
// ankan med stjärten i (x, y), skala s, vriden rot; blink 0–1 stänger ögat; klipp = id för fyllnadscirkeln
function anka([x, y], { s = 1, rot = 0, lager = 'anka', hatt = 0, klipp = '', blink = 0 } = {}) {
  const k = s * ANKA_H / 661, t = `translate(${f1(x)} ${f1(y)}) rotate(${f1(rot)}) scale(${k.toFixed(4)}) translate(-358 -658)`;
  const hs = mjuk(hatt), hattH = hs > 0.01 ? `<g transform="translate(300 -20) scale(${hs.toFixed(3)}) translate(-300 20)">${ull(300, -40, 70) + ull(240, -10, 46) + ull(370, -6, 50)}</g>` : '';
  lagg(lager, `<g transform="${t}"><g${klipp ? ` clip-path="url(#${klipp})"` : ''}><image href="${ANKA_BILD}" width="716" height="661"/>
    <ellipse cx="${ANKA_OGA[0]}" cy="${ANKA_OGA[1]}" rx="17" ry="${f1(23 * (1 - 0.9 * blink))}" fill="#2a1d1a"/>${blink < 0.5 ? `<circle cx="${ANKA_OGA[0] - 6}" cy="${ANKA_OGA[1] - 9}" r="6.5" fill="#fff"/>` : ''}</g>${hattH}</g>`);
}
const ankaKontur = ([x, y], s) => { const k = s * ANKA_H / 661; return 'M' + ANKA_KONTUR.map(([px, py]) => `${f1(x + (px - 358) * k)} ${f1(y + (py - 658) * k)}`).join(' L'); };
const gupp = ([x, y], t, a = 1) => [[x, y + 4 * a * Math.sin(t * 2.2)], 3 * a * Math.sin(t * 1.7)];

// --- Båten (041:s badbat och kontur) och borsten ---------------------------------------------------------------------------------
const BAT_KONTUR = [[30, 262], [140, 272], [255, 290], [298, 335], [318, 255], [335, 180], [455, 172], [460, 30], [580, 78], [465, 115], [465, 172],
  [560, 175], [575, 335], [650, 345], [682, 385], [665, 470], [610, 535], [500, 570], [350, 575], [220, 555], [120, 500], [60, 410], [30, 262]];
const batKontur = ([x, y]) => { const k = BAT_H / 600; return 'M' + BAT_KONTUR.map(([px, py]) => `${f1(x + (px - 355) * k)} ${f1(y + (py - 575) * k)}`).join(' L'); };
const BAT_MITT = [BATP[0], BATP[1] - BAT_H * 0.45];
function bat([x, y], rot = 0, klipp = '') {
  const t = `translate(${f1(x)} ${f1(y)}) rotate(${f1(rot)}) scale(${(BAT_H / 600).toFixed(4)}) translate(-355 -575)`;
  lagg('anka', `<g${klipp ? ` clip-path="url(#${klipp})"` : ''}><image transform="${t}" href="${BAT_BILD}" width="708" height="600"/></g>`);
}
const borste = ([x, y], rot = 0, lager = 'saker', spegel = false) => lagg(lager, `<image transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(rot)}) scale(${spegel ? -BO_K.toFixed(4) : BO_K.toFixed(4)} ${BO_K.toFixed(4)}) translate(${-BO_SPETS[0]} ${-BO_SPETS[1]})" href="${BORSTE}" width="${BO_W}" height="${BO_H}"/>`);
// en väg av nycklar: [start, längd, mål, vinkel, lyft] glider dit i en båge; [start, längd, u => [pos, vinkel]] följer ett drag
function vag(tl, [P0, r0], nycklar) { let p = P0, r = r0;
  for (const [t0, d, B, rB, ly = 0] of nycklar) { if (tl < t0) break; const u = mjuk((tl - t0) / d);
    if (typeof B === 'function') { [p, r] = B(u); if (u < 1) break; continue; }
    const A = p, rA = r; p = [lerp(A[0], B[0], u), lerp(A[1], B[1], u) - ly * Math.sin(Math.PI * u)]; r = lerp(rA, rB, u); if (u < 1) break; p = B; r = rB; }
  return [p, r]; }
// drag med borsten i riggens mått: en båge runt (c, rx, ry) från vinkel a0 till a1 (borsten pekar in mot mitten), eller en rak linje
const bue = (pos, c, rx, ry, a0, a1) => u => { const a = a0 + (a1 - a0) * u, r = a * Math.PI / 180; return [iFig(pos, [c[0] + rx * Math.cos(r), c[1] + ry * Math.sin(r)]), a - 90]; };
const linje = (pos, A, B, rot) => u => [iFig(pos, lerp2(A, B, u)), rot];
const BO_HALL = () => iFig(STA, [990, 480]);
// små såpbubblor stiger ur skummet och spricker mjukt
function bubblor(t) { let h = '';   // Sanna 26/11 "less bubbles": 2 (förut 7, sedan 3), svagare
  for (let i = 0; i < 2; i++) { const P = 3.4 + 0.5 * (i % 3), u = (t / P + i * 0.37) % 1, x = 1010 + (i * 283) % 760 + 10 * Math.sin(t * 1.6 + i), y = KANT - 6 - 150 * u, r = 7 + 3 * (i % 3), o = Math.sin(Math.PI * u);
    h += `<g opacity="${(0.6 * o).toFixed(2)}"><circle cx="${f1(x)}" cy="${f1(y)}" r="${r}" fill="#fff" fill-opacity=".3" stroke="#cfe6ee" stroke-width="2.5"/><circle cx="${f1(x - r * 0.35)}" cy="${f1(y - r * 0.35)}" r="${f1(r * 0.25)}" fill="#fff"/></g>`; }
  lagg('fram', h); }
// varm ånga (Sanna 25/11 "nice hot steam from bath", "soften steam and only show when hot is mentioned"): djup-kitets mjuka moln,
// ett bakom karet och lammet och ett tunnare framför (lite närmare, p 0,12). k 0–1: bara kring "varmt" (rad 4).
function anga(t, k) { if (k <= 0.01) return;
  lagg('anga', `<g opacity="${k.toFixed(3)}">${djup.anga({ x: KX - 40, y: KANT - 10, w: 720, hojd: 340, t, o: 0.32 })}</g>`);
  lagg('angaFram', `<g opacity="${k.toFixed(3)}">${djup.anga({ x: KX - 40, y: KANT + 10, w: 560, hojd: 300, t, p: 0.12, o: 0.15, fro: 5, n: 5 })}</g>`); }
// plask: droppar och skumbitar i bågar ut från (x, KANT), u = sekunder sedan plasket
function plaskBild(x, u) { if (u < 0 || u > 0.9) return; let h = '';
  for (let j = 0; j < 9; j++) { const a = (-150 + 120 * j / 8) * Math.PI / 180, v = 380 + 120 * Math.sin(j * 2.7), px = x + (j - 4) * 14 + v * Math.cos(a) * u, py = KANT - 10 + v * Math.sin(a) * u + 700 * u * u, o = 1 - u / 0.9;
    h += j % 3 ? droppe(px, py, 1.1, o) : `<g opacity="${o.toFixed(2)}">${tuss(px, py, 12)}</g>`; }
  lagg('fram', h); }

// --- Handduken ------------------------------------------------------------------------------------------------------------------
const HD_KROK = [KROK[0], KROK[1] + HD_H / 2];
const handduk = ([x, y], v = 0) => lagg('saker', `<g transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(v)})"><image href="${HD_UK}" x="${f1(-HD_W / 2)}" y="${f1(-HD_H / 2)}" width="${f1(HD_W)}" height="${HD_H}"/></g>`);
// konturen och rutorna som kritan ritar (023:s, skalade med 434/300), i scenens koordinater
const HS = HD_H / 300, hdP = ([x, y]) => `${f1(KROK[0] + x * HS)} ${f1(KROK[1] + y * HS)}`;
const HD_DRAG = [
  'M' + [[-14, 30], [-40, 60], [-66, 95], [-74, 140], [-74, 258], [-64, 292], [0, 298], [64, 292], [74, 258], [74, 140], [66, 95], [40, 60], [14, 30], [11, 8], [0, 2], [-11, 8], [-14, 30]].map(hdP).join(' L'),

// skutt i följd: lista = [[start, längd, mål, höjd]] från A. Ger [pos, p, blick]
function skuttar(tl, A, lista, p) {
  let pos = A, blick = 0, prev = A;

function puffa(sel, k, cx, cy, vag, slat) {
  G.querySelectorAll(sel).forEach(g => { const cs = [...g.querySelectorAll('circle')], n = cs.length;
    cs.forEach((c, i) => {
      if (!c.dataset.x) Object.assign(c.dataset, { x: c.getAttribute('cx'), y: c.getAttribute('cy'), r: c.getAttribute('r') });
      const x = +c.dataset.x, y = +c.dataset.y, r = +c.dataset.r;
      const st = vag ? vag(c, i, n) * 0.34 + 0.04 * ((i * 7) % 5) / 5 : 0.45 * i / n, u = kl((k - st) / 0.32), s = backUt(u);
      const sm = slat ? mjuk(slat(x, y, i, n)) : 0, m = 1 - sm, j1 = Math.sin(i * 12.99 + 1.3), j2 = Math.sin(i * 7.31 + 0.7);
      const spret = [0.075, -0.02, 0.035][i % 3] * m;   // oborstad: var tredje tuss står ut lite (QA 25/11, "ullen står åt alla håll"), aldrig dramatiskt

}

// hur mycket handduken torkar just nu (0–1), och lammets lugna lutning med den
const torkar = (tl, a, b) => del(a, a + 0.3, tl) * (1 - del(b - 0.3, b, tl));
const gungLuta = (tl, a, b) => 3 * Math.sin(2 * Math.PI * (tl - a) / 1.9) * torkar(tl, a, b);

const HUVUD = () => iFig(STA, [512, 210]), OVER = () => iFig(STA, [512, -120]), MAGE = () => iFig(STA, [508, 690]);

// bana = [[start, längd, mål, vinkel]], första målet är startplatsen (längd = glidningen dit från förra). gnugg = [a, b]
function hdBana(tl, bana, [ga, gb]) {
  // bana[0] = [start, längd, startplats, vinkel] glider till bana[1]:s plats; bana[2…] = [start, längd, plats, vinkel]
  const [s0, d0, P0, v0] = bana[0];
  let pos = P0, v = v0;
  const steg = [[s0, d0, bana[1][2], bana[1][3]], ...bana.slice(2).map(([s, dd, P, vv]) => [s, dd, P, vv])];
  for (const [s, dd, B, vB] of steg) { if (tl < s) break; const u = mjuk((tl - s) / dd), A = pos;
    pos = [lerp(A[0], B[0], u), lerp(A[1], B[1], u) - 60 * Math.sin(Math.PI * u)]; v = lerp(v, vB, u); if (u < 1) break; pos = B; v = vB; }
  const gx = 12 * Math.sin(2 * Math.PI * (tl - ga) / 1.9) * torkar(tl, ga, gb);   // lugn gungning, ingen snabb gnuggning (041, Sanna 19/11)
  return [[pos[0] + gx, pos[1]], v, bana[0][4] === 'krok' && tl < s0];
}

function lage(t) {
  let i = RAD.findIndex(r => t < r.s + r.d); if (i < 0) i = RAD.length - 1;
  const r = RAD[i], tl = t - r.s, st = S[r.id](tl, r.d);
  if (i > 0) {   // ansikte och pose blandas mjukt in från förra radens slut (0,45 s)
    const fr = RAD[i - 1], f0 = S[fr.id](fr.d, fr.d), gb = del(0, 0.45, tl);
    if (f0.plats === st.plats && st.f && f0.f && gb < 1) { st.f = L.blanda(f0.f, st.f, gb); st.p = L.blandaPose(f0.p, st.p, gb); }
  }
  reaktion(st, r, tl);
  return { ...st, id: r.id, tl, d: r.d };
}

// Reaktionsslag (Sanna 25/11: fler reaktioner, närbilder, skiftande uttryck): när lammet svarar med ett ljud
// klipper bilden till en närbild på ansiktet i ca 1 s, uttrycket byts och öronen följer med.
const REAKT_RADER = ['1b', '2', '4', '6b', '7', 'b3', '9', '10', '11', '13', '14', '15', '17', '20', '21', '22', '24', '25', '26b', '26d'];
const REAKT = {   // ljudets nummer → [uttryck, öron, luta, extra]
  1: ['glad', -8, 0], 2: ['jatteglad', -12, 0], 3: ['fnissig', -6, 4], 4: ['glad', 4, -2, { lock: [0.6, 0.6] }],
  5: ['nyfiken', -4, 5], 6: ['ledsen', 14, -3], 7: ['nyfiken', -6, -5], 8: ['glad', -6, 2], f: ['fnissig', -10, 5] };
function reaktion(st, r, tl) {
  if (!REAKT_RADER.includes(r.id) || !st.f || !(st.pos || st.ikar)) return;
  for (const [fil, o] of RR[r.id].ljud || []) {
    const m = fil.match(/^ba-(gullig|fniss)\/ba-\w+-(\d)/); if (!m) continue;
    let a = o - 0.15, b = o + 1.0; if (r.d - b < 0.5) b = r.d;   // inget kort blixtklipp tillbaka i slutet
    if (tl < a || tl > b) continue;
    const [namn, or, lu, extra = {}] = REAKT[m[1] === 'fniss' ? 'f' : +m[2]];
    const g = del(a, a + 0.25, tl) * (1 - del(b - 0.2, b, tl) * (b < r.d ? 1 : 0)), fn = m[1] === 'fniss' ? Math.sin(tl * 14) * del(o, o + 0.2, tl) : 0;
    st.f = L.blanda(st.f, F(namn, extra), g);
    st.p = { ...st.p, oron: [lerp(st.p.oron?.[0] || 0, or, g), lerp(st.p.oron?.[1] || 0, or, g)], luta: (st.p.luta || 0) + g * (lu + 2 * fn) };
    const z = (st.kam || K_HEL)[0];
    if (z < 2.3) {
      const pos = st.ikar ? [IKAR(st.sjunk || 0)[0] + (st.ldx || 0), IKAR(st.sjunk || 0)[1]] : st.pos;
      st.kam = st.ikar ? [2.8, pos[0] - 20, KANT - 120] : [3.0, pos[0] + (st.reaktDx || 0), pos[1] - 300];   // reaktDx: flytta närbilden åt sidan när en sak ska med (rad 25: borsten i tassen)
    }
    return;
  }
}
