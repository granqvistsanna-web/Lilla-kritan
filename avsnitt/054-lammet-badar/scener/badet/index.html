<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Lammet badar</title>
<style>html, body { margin:0; background:#000; overflow:hidden } svg { width:100vw; height:100vh; display:block; }</style>
</head>
<body>
<!-- 054 Lammet badar: hela kodscenen (grind 6). Mått och teckningar som storyboarden (../../storyboard/scen.html), rörelserna som
     041:s scen, tiden och raderna ur rader.json (skrivs av storyboard/bygg.mjs). Kritan går genom verktyg/kritan-ritar.js.
     Rendera: node verktyg/render-delat.mjs avsnitt/054-lammet-badar/scener/badet [--snabb].
     Bara hårda klipp; den enda åkningen är zoomen in i teckningen. Kritan är liten, utan ansikte, knackar aldrig. -->
<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="boil" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="5000">
      <feTurbulence id="brus" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
      <feDisplacementMap in="SourceGraphic" scale="2.5"/>
    </filter>
    <filter id="korn" x="0" y="0" width="1" height="1">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="2"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.47  0 0 0 0 0.36  1.1 0 0 0 -0.47"/>
    </filter>
    <radialGradient id="vinjett" cx="50%" cy="50%" r="75%"><stop offset="0.55" stop-color="#3a2410" stop-opacity="0"/><stop offset="1" stop-color="#3a2410" stop-opacity="0.14"/></radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="#FAF8F2"/>
  <g id="kamera">
    <g id="platta"></g>
    <g id="vagg"></g>
    <g id="bak"></g>
    <g filter="url(#boil)"><g id="anka"></g></g>
    <g filter="url(#boil)"><g id="figurer"></g></g>
    <g id="kar"></g>
    <g id="fram" filter="url(#boil)"></g>
    <g filter="url(#boil)"><g id="figurerFram"></g></g>
    <g filter="url(#boil)"><g id="saker"></g></g>
    <g id="pilar"></g>
  </g>
  <g id="ram"></g>
  <g id="gomda" opacity="0"></g>
</svg>
<script src="/verktyg/blinka.js"></script>
<script src="/verktyg/kant.js"></script>
<script src="/verktyg/kritan-ritar.js"></script>
<script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script>
const $ = id => document.getElementById(id);
const A = '/assets/', R = A + 'rekvisita/';
const lagg = (id, h) => $(id).insertAdjacentHTML('beforeend', h);
const f1 = v => (+v).toFixed(1);
const kl = (k, a = 0, b = 1) => Math.max(a, Math.min(b, k)), lerp = (a, b, k) => a + (b - a) * k;
const mjuk = k => (k = kl(k), k * k * (3 - 2 * k)), del = (a, b, t) => mjuk((t - a) / (b - a));
const bump = (a, b, t) => (t <= a || t >= b) ? 0 : Math.sin(Math.PI * (t - a) / (b - a));
const lerp2 = (A, B, k) => [lerp(A[0], B[0], k), lerp(A[1], B[1], k)];

// --- Filer och mått (som storyboarden) -------------------------------------------------------------------------------------
const PLATTA = A + 'bakgrunder/badrummet/badrummet-v1.jpeg';
const KAR_S = 0.88, KAR = R + 'badkar/cut/badkar-bla-kran-tunn.png', KAR_W = 1044 * KAR_S, KAR_H = 687 * KAR_S, KAR_LAPP = 240 * KAR_S, KAR_Y0 = 905 - 668 * KAR_S;
const PALL = R + 'pall/cut/pall.png', PALL_KS = 0.5;
const HD = R + 'handduk/cut/handduk-rutig-tunn.png', HD_UK = R + 'handduk/cut/handduk-rutig-utan-knopp-tunn.png', HD_H = 434, HD_W = HD_H * 538 / 1033, HK = HD_H / 1033;
const ANKA_BILD = R + 'badanka/cut/badanka.png', ANKA_H = 120, ANKA_OGA = [228, 122];

const GOLV = 905, KX = 1420;
const KANT = KAR_Y0 + KAR_LAPP;
const BADKANT = 520;                                // riggens y vid badkarskanten: öronen och ögonen syns
const STA = [430, GOLV];
const PALL_X0 = KX - KAR_W / 2 + 25 - 778 * PALL_KS, PALL_Y0 = GOLV - 548 * PALL_KS;
// pallens två steg (pall.png 781 × 551): nedre stegets ovansida y 212, x 40–330; övre y 4, x 360–760
const STEG1 = [PALL_X0 + 185 * PALL_KS, PALL_Y0 + 238 * PALL_KS], STEG2 = [PALL_X0 + 565 * PALL_KS, PALL_Y0 + 32 * PALL_KS];
const KROK = [150, 300];
const ANKA_VID = [KX - 260, KANT - 12];
const ANKA_GOMD = [KX + 250, KANT + 22];
const GOMSTUSS = [KX + 330, KANT - 4, 78];
let FOT = 930, GS = 0.572;

let L, G, BLINKA, TT = 0, ZOOM = 1, RAD = [], RR = {}, IDX = {}, ROSTER = [], BORTA = {}, DURATION = 0;
const SVART = 0.6;
const LN = n => ROSTER.find(r => +r[0].slice(0, 2) === n)[2];
const M = (id, n) => RR[id].malin.find(x => x[0] === n)[1];        // när repliken n börjar i raden
const fran = (id, n) => IDX[id] >= IDX[n];
const iFig = ([x, fot], [px, py], s = GS) => [x + (px - 512) * s, fot + (py - FOT) * s];
const IKAR = (sjunk = 0) => [KX - 60, KANT + (FOT - BADKANT) * GS + sjunk * GS];
const IKAR_ANKA = () => [IKAR()[0] - 230, ANKA_VID[1]];

function kamera(zoom = 1, cx = 960, cy = 540) {
  ZOOM = zoom;
  const tx = Math.max(1920 - 1920 * zoom, Math.min(0, 960 - cx * zoom)), ty = Math.max(1080 - 1080 * zoom, Math.min(0, 540 - cy * zoom));
  $('kamera').setAttribute('transform', `translate(${f1(tx)} ${f1(ty)}) scale(${zoom})`);
  $('brus').nextElementSibling.setAttribute('scale', (2.5 / zoom).toFixed(2));   // line boil 2,5 px i bild
}

// --- Badrummet ---------------------------------------------------------------------------------------------------------------
const knopp = () => `<circle cx="${f1(KROK[0])}" cy="${f1(KROK[1] + 58 * HK)}" r="${f1(44 * HK)}" fill="#a9b7c2"/><circle cx="${f1(KROK[0])}" cy="${f1(KROK[1] + 56 * HK)}" r="${f1(36 * HK)}" fill="#c9d5dd"/><circle cx="${f1(KROK[0] - 12 * HK)}" cy="${f1(KROK[1] + 44 * HK)}" r="${f1(11 * HK)}" fill="#fff" opacity="0.8"/>`;
function badrum({ handduk = false, gomstuss = true } = {}) {
  $('platta').innerHTML = `<image href="${PLATTA}" width="1920" height="1080" preserveAspectRatio="xMidYMid slice"/>`;
  lagg('vagg', knopp());
  if (handduk) lagg('vagg', `<image href="${HD}" x="${f1(KROK[0] - HD_W / 2)}" y="${KROK[1]}" width="${f1(HD_W)}" height="${HD_H}"/>`);
  lagg('bak', `<image href="${PALL}" x="${f1(PALL_X0)}" y="${f1(PALL_Y0)}" width="${f1(781 * PALL_KS)}" height="${f1(551 * PALL_KS)}"/>`);
  $('kar').innerHTML = `<image href="${KAR}" x="${f1(KX - KAR_W / 2)}" y="${f1(KAR_Y0)}" width="${f1(KAR_W)}" height="${f1(KAR_H)}"/>`;
  skumKant(gomstuss);
}
const tuss = (x, y, r, kant = '#cfe6ee', fill = '#fff') => [[0, 0, 1], [-0.8, 0.25, 0.7], [0.8, 0.2, 0.75], [-0.35, -0.55, 0.65], [0.4, -0.5, 0.6]]
  .map(([dx, dy, k]) => `<circle cx="${f1(x + dx * r)}" cy="${f1(y + dy * r)}" r="${f1(k * r)}" fill="${fill}" stroke="${kant}" stroke-width="${f1(0.08 * r)}" paint-order="stroke"/>`).join('');
function skumKant(gomstuss) {   // skummet andas lite
  let h = ''; for (let i = 0; i < 15; i++) { const u = i / 14, x = KX - 480 + 900 * u, r = (24 + 16 * Math.abs(Math.sin(i * 2.3))) * (1 + 0.04 * Math.sin(TT * 1.7 + i));
    h += tuss(x, KANT + 10 - 0.5 * r, r); }
  if (gomstuss) h += tuss(GOMSTUSS[0], GOMSTUSS[1], GOMSTUSS[2] * (1 + 0.025 * Math.sin(TT * 1.3)));
  lagg('fram', h);
}
const droppe = (x, y, s = 1, o = 1) => `<path d="M${f1(x)} ${f1(y - 14 * s)} Q${f1(x + 9 * s)} ${f1(y)} ${f1(x)} ${f1(y + 6 * s)} Q${f1(x - 9 * s)} ${f1(y)} ${f1(x)} ${f1(y - 14 * s)}Z" fill="#a9dcf0" stroke="#fff" stroke-width="${f1(3 * s)}" opacity="${kl(o).toFixed(2)}"/>`;
const stjarna = (x, y, r, o = 1) => `<path transform="translate(${f1(x)} ${f1(y)}) scale(${r.toFixed(2)})" opacity="${kl(o).toFixed(2)}" d="M0 -1 L.2 -.2 L1 0 L.2 .2 L0 1 L-.2 .2 L-1 0 L-.2 -.2Z" fill="#fff6c8" stroke="#e6b422" stroke-width=".06"/>`;
function skimmer(x, y, k, s = 1) { if (k <= 0.01) return;
  lagg('fram', [[-1, -0.7, 1], [1.1, -0.4, 0.8], [0.2, 1.1, 0.7], [-1.2, 0.8, 0.6]].map(([dx, dy, z], i) => stjarna(x + dx * 40 * s, y + dy * 34 * s, 16 * z * k * s * (0.75 + 0.25 * Math.sin(TT * 3 + i * 1.7)), 0.4 + k)).join('')); }
const ull = (x, y, r) => `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}" fill="#FFFDF6" stroke="#D9CBB0" stroke-width="${f1(r * 0.12)}" paint-order="stroke"/>`;
const pol = (x, k = 1) => k > 0.01 ? lagg('bak', `<ellipse cx="${f1(x)}" cy="${GOLV + 6}" rx="${f1(150 * k)}" ry="${f1(16 * k)}" fill="#a9dcf0" opacity=".55"/>`) : 0;

// --- Kritan (verktyg/kritan-ritar.js) ----------------------------------------------------------------------------------------
const kritaRita = kr => { if (kr) lagg('pilar', kritaBild(kr.x, kr.y, kr)); };

// --- Badankan (rekvisita/badanka.md, konturen från 020) ------------------------------------------------------------------------
const ANKA_KONTUR = [[78, 472], [82, 424], [94, 380], [115, 342], [139, 311], [150, 280], [131, 250], [60, 242], [16, 214], [18, 178], [62, 152],
  [102, 152], [110, 118], [124, 86], [144, 58], [169, 35], [199, 19], [230, 8], [263, 3], [297, 3], [330, 12], [361, 28], [388, 50], [410, 80],
  [428, 110], [439, 147], [438, 193], [406, 271], [440, 270], [482, 273], [531, 286], [560, 296], [640, 260], [690, 236], [705, 280], [711, 313],
  [710, 380], [696, 445], [669, 503], [629, 553], [584, 593], [534, 623], [480, 639], [429, 651], [379, 657], [330, 657], [282, 652], [236, 639],
  [189, 624], [147, 598], [112, 563], [88, 520], [78, 472]];
const ANKA_MITT = [358, 360];
// ankan med stjärten i (x, y), skala s, vriden rot; blink 0–1 stänger ögat; klipp = id för fyllnadscirkeln
function anka([x, y], { s = 1, rot = 0, lager = 'anka', hatt = 0, klipp = '', blink = 0 } = {}) {
  const k = s * ANKA_H / 661, t = `translate(${f1(x)} ${f1(y)}) rotate(${f1(rot)}) scale(${k.toFixed(4)}) translate(-358 -658)`;
  const hs = mjuk(hatt), hattH = hs > 0.01 ? `<g transform="translate(300 -20) scale(${hs.toFixed(3)}) translate(-300 20)">${ull(300, -40, 70) + ull(240, -10, 46) + ull(370, -6, 50)}</g>` : '';
  lagg(lager, `<g transform="${t}"><g${klipp ? ` clip-path="url(#${klipp})"` : ''}><image href="${ANKA_BILD}" width="716" height="661"/>
    <ellipse cx="${ANKA_OGA[0]}" cy="${ANKA_OGA[1]}" rx="17" ry="${f1(23 * (1 - 0.9 * blink))}" fill="#2a1d1a"/>${blink < 0.5 ? `<circle cx="${ANKA_OGA[0] - 6}" cy="${ANKA_OGA[1] - 9}" r="6.5" fill="#fff"/>` : ''}</g>${hattH}</g>`);
}
const ankaKontur = ([x, y], s) => { const k = s * ANKA_H / 661; return 'M' + ANKA_KONTUR.map(([px, py]) => `${f1(x + (px - 358) * k)} ${f1(y + (py - 658) * k)}`).join(' L'); };
const gupp = ([x, y], t, a = 1) => [[x, y + 4 * a * Math.sin(t * 2.2)], 3 * a * Math.sin(t * 1.7)];

// --- Handduken ------------------------------------------------------------------------------------------------------------------
const HD_KROK = [KROK[0], KROK[1] + HD_H / 2];
const handduk = ([x, y], v = 0) => lagg('saker', `<g transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(v)})"><image href="${HD_UK}" x="${f1(-HD_W / 2)}" y="${f1(-HD_H / 2)}" width="${f1(HD_W)}" height="${HD_H}"/></g>`);
// konturen och rutorna som kritan ritar (023:s, skalade med 434/300), i scenens koordinater
const HS = HD_H / 300, hdP = ([x, y]) => `${f1(KROK[0] + x * HS)} ${f1(KROK[1] + y * HS)}`;
const HD_DRAG = [
  'M' + [[-14, 30], [-40, 60], [-66, 95], [-74, 140], [-74, 258], [-64, 292], [0, 298], [64, 292], [74, 258], [74, 140], [66, 95], [40, 60], [14, 30], [11, 8], [0, 2], [-11, 8], [-14, 30]].map(hdP).join(' L'),
  ...[[[-66, 150], [66, 150]], [[70, 208], [-70, 208]], [[-68, 262], [68, 262]], [[-34, 104], [-36, 290]], [[0, 294], [0, 96]], [[34, 104], [36, 290]]].map(l => 'M' + l.map(hdP).join(' L'))];
const HD_VIKT = [3, 0.8, 0.8, 0.8, 0.9, 0.9, 0.9];
const HD_MITT = [KROK[0], KROK[1] + 160 * HS];

// --- Lammet --------------------------------------------------------------------------------------------------------------------
// I riggen läggs en gång in: den blöta tonen (maskad med kroppens form), ulltussarna på öronen, magen och runt hela kroppen, och skumhatten.
function lammIn(g) {
  const kg = g.querySelector('g.kropp'), kropp = kg.querySelector(':scope > image'), href = kropp.getAttribute('href');
  g.insertAdjacentHTML('afterbegin', `<defs><mask id="kroppmask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><image href="${href}" width="1024" height="1024"/></mask></defs>`);
  let moln = ''; for (let i = 0; i < 18; i++) { const a = i / 18 * 2 * Math.PI, rr = 70 + 12 * Math.sin(i * 1.7); moln += ull(508 + 300 * Math.cos(a), 500 + 336 * Math.sin(a), rr); }
  g.querySelector('defs').insertAdjacentHTML('afterend', `<g class="ull-moln">${moln}</g>`);   // längst bak, så att armarna syns utanför molnet
  kropp.insertAdjacentHTML('afterend', `<g class="blot" mask="url(#kroppmask)"><rect width="1024" height="1024" fill="#8FA6B8" opacity=".24"/></g>
    <g class="ull-mage">${ull(450, 700, 40) + ull(530, 690, 44) + ull(600, 712, 36) + ull(490, 760, 36) + ull(570, 770, 34)}</g>`);
  kg.insertAdjacentHTML('beforeend', `<g class="skumhatt">${tuss(512, 200, 62)}</g>`);
  g.querySelector('image.ear-l').insertAdjacentHTML('afterend', `<g class="ear-l"><g class="ull-orl">${ull(205, 300, 30) + ull(240, 330, 26) + ull(255, 285, 24)}</g></g>`);
  g.querySelector('image.ear-r').insertAdjacentHTML('afterend', `<g class="ear-r"><g class="ull-orr">${ull(818, 298, 30) + ull(784, 330, 26) + ull(770, 284, 24)}</g></g>`);
}
const P = o => ({ ...L.POSE0, ...o });
const GLADA = ['glad', 'jatteglad', 'fnissig', 'skrattar', 'kawaii'];
const F = (n, o = {}) => ({ ...L.blanda('neutral', n, 1), ...(GLADA.includes(n) ? { glad: [0, 0] } : {}), ...o });   // glada ögon öppna
const liv = (p, t) => { const a = (1 - Math.cos(2 * Math.PI * t / 3.6)) / 2;
  return { ...p, strack: p.strack + 0.014 * a, bred: p.bred + 0.007 * a, oron: p.oron.map((o, i) => o - 2 * a + (i ? -1 : 1) * 1.5 * Math.sin(t * 1.3 + 2 * i)) }; };
function skutt(p, tl, t0, h = 40, d = 0.5) {
  const huk = bump(t0 - 0.18, t0 + 0.02, tl), u = kl((tl - t0) / d), land = bump(t0 + d - 0.02, t0 + d + 0.28, tl), or = u > 0 && u < 1 ? 8 * Math.cos(Math.PI * u) : 0;
  return { ...p, lyft: (p.lyft || 0) - 2 * h * Math.sin(Math.PI * u), strack: p.strack - 0.06 * huk + 0.04 * Math.sin(Math.PI * u) - 0.05 * land, bred: p.bred + 0.04 * huk + 0.035 * land, oron: p.oron.map(o => o + or) };
}
const hoppVag = (tl, a, b, A, B) => { const u = kl((tl - a) / (b - a)); return [lerp(A[0], B[0], mjuk(u)), lerp(A[1], B[1], u)]; };
// skutt i följd: lista = [[start, längd, mål, höjd]] från A. Ger [pos, p, blick]
function skuttar(tl, A, lista, p) {
  let pos = A, blick = 0, prev = A;
  for (const [t0, d, B, h] of lista) {
    if (tl >= t0) pos = hoppVag(tl, t0, t0 + d, prev, B);
    const fore = del(t0 - 0.35, t0 - 0.1, tl) * (1 - del(t0 + d - 0.1, t0 + d + 0.2, tl));
    if (fore > 0.01) blick = Math.sign(B[0] - prev[0]) * fore;
    p = skutt(p, tl, t0, h, d);
    p = { ...p, armar: p.armar.map(a => a + 18 * bump(t0, t0 + d, tl)) };
    prev = B;
  }
  return [pos, p, blick];
}
const VINKA = 100;   // armen bakom kroppen, snett upp förbi ullmolnet (60–110 syns, 150 hamnar bakom huvudet)
const vinka = (p, v, tl) => ({ ...p, armar: [p.armar[0], p.armar[1] + v * (VINKA + 12 * Math.sin(2 * Math.PI * 1.15 * tl))], luta: p.luta - 1.5 * v });
const nick = (f, p, tl, d = 1.2) => tl > 0 && tl < d ? L.nicka(f, p, tl, d, 2) : [f, p];
const huttra = (tl, a, d = 0.9) => (tl > a && tl < a + d) ? 3 * Math.sin(2 * Math.PI * 6 * (tl - a)) * Math.sin(Math.PI * (tl - a) / d) : 0;
// lamm(var, ansikte, pose, { blot, oron, mage, moln, hatt, hattX, ikar, framfor }) – ullens delar 0–1
function lamm(pos, f, p, { blot = 0, oron = 0, mage = 0, moln = 0, hatt = 0, hattX = 0, ikar = false, framfor = false } = {}) {
  $(framfor ? 'figurerFram' : 'figurer').appendChild(G);
  G.setAttribute('transform', `translate(${f1(pos[0])} ${f1(pos[1])}) scale(${GS}) translate(-512 ${-FOT})`);
  L.rita(G, f, p);
  G.querySelector('.blot').setAttribute('opacity', kl(blot).toFixed(2));
  const sk = (sel, k, cx, cy) => G.querySelectorAll(sel).forEach(e => { e.setAttribute('opacity', kl(k * 3).toFixed(2)); e.setAttribute('transform', `translate(${cx} ${cy}) scale(${(0.5 + 0.5 * mjuk(k)).toFixed(3)}) translate(${-cx} ${-cy})`); });
  sk('.ull-orl', oron, 235, 305); sk('.ull-orr', oron, 790, 305); sk('.ull-mage', mage, 520, 720);
  const m = G.querySelector('.ull-moln'), ms = (0.7 + 0.3 * mjuk(moln)) * (1 + 0.015 * Math.sin(TT * 2.1));
  m.setAttribute('opacity', kl(moln * 2).toFixed(2)); m.setAttribute('transform', `translate(508 500) scale(${ms.toFixed(4)}) translate(-508 -500)`);
  const h = G.querySelector('.skumhatt'); h.setAttribute('opacity', kl(hatt).toFixed(2)); h.setAttribute('transform', `translate(${f1(hattX)} ${f1(Math.abs(hattX) * 0.3)}) rotate(${f1(hattX * 0.08)} 512 200)`);
  G.querySelectorAll('.arm-l,.arm-r,.arm-l2,.arm-r2,.leg-l,.leg-r,.tail,.skugga').forEach(e => e.setAttribute('display', ikar ? 'none' : 'inline'));
  if (blot > 0.3 && !ikar) {   // droppar från öronspetsarna och magen faller och tonas bort
    [[200, 380], [826, 378], [478, 840], [548, 846]].forEach(([px, py], i) => { const age = (TT * 0.7 + i * 0.29) % 1, [x, y] = iFig(pos, [px, py]);
      lagg('fram', droppe(x, y + 10 + 70 * age * age, 1, (1 - age) * kl((blot - 0.3) / 0.4))); });
  }
}
const huvud = (pos, [px, py] = [512, 330]) => iFig(pos, [px, py]);
const LAMM_TOPP = () => GOLV - (FOT - 178) * GS;

// --- Kameror [zoom, cx, cy] -------------------------------------------------------------------------------------------------------
const K_HEL = [1, 960, 540];
const K_BAD = () => [1.45, KX - 120, 470];
const K_NARA = (z = 1.9, dy = 0) => [z, STA[0], GOLV - 230 + dy];
const K_HALV = [1.7, STA[0] + 120, 640];
const K_KROK = [2.0, KROK[0] + 100, KROK[1] + 230];
const K_HD = [1.5, 330, 560];
const K_SKUM = [3.2, GOMSTUSS[0] - 40, GOMSTUSS[1] - 10];
const K_ANKA = () => [2.6, ANKA_GOMD[0] - 150, ANKA_GOMD[1] - 30];
const K_LAMM_KAR = [1.25, 900, 560];
const RUM = o => ({ plats: 'bad', kam: K_HEL, pos: STA, ...o });
const BAD = o => ({ plats: 'bad', kam: K_BAD(), pos: IKAR(), ikar: true, ...o });

// --- Raderna: vad som syns per rad, tl = tid in i raden, d = radens längd -------------------------------------------------------
const S = {
  // ritintrot: kritan ritar badankans kontur, väntar svajande, ankan fylls inifrån och blinkar, zoom in
  '01a': tl => ({ plats: 'papper' }),
  '01b': (tl, d) => ({ plats: 'papper', kryp: del(0, d, tl) }),

// bana = [[start, längd, mål, vinkel]], första målet är startplatsen (längd = glidningen dit från förra). gnugg = [a, b]
function hdBana(tl, bana, [ga, gb]) {
  // bana[0] = [start, längd, startplats, vinkel] glider till bana[1]:s plats; bana[2…] = [start, längd, plats, vinkel]
  const [s0, d0, P0, v0] = bana[0];
  let pos = P0, v = v0;
  const steg = [[s0, d0, bana[1][2], bana[1][3]], ...bana.slice(2).map(([s, dd, P, vv]) => [s, dd, P, vv])];
  for (const [s, dd, B, vB] of steg) { if (tl < s) break; const u = mjuk((tl - s) / dd), A = pos;
    pos = [lerp(A[0], B[0], u), lerp(A[1], B[1], u) - 60 * Math.sin(Math.PI * u)]; v = lerp(v, vB, u); if (u < 1) break; pos = B; v = vB; }

  return [[pos[0] + gx, pos[1]], v, bana[0][4] === 'krok' && tl < s0];
}

function lage(t) {
  let i = RAD.findIndex(r => t < r.s + r.d); if (i < 0) i = RAD.length - 1;
  const r = RAD[i], tl = t - r.s, st = S[r.id](tl, r.d);
  if (i > 0) {   // ansikte och pose blandas mjukt in från förra radens slut (0,45 s)
    const fr = RAD[i - 1], f0 = S[fr.id](fr.d, fr.d), gb = del(0, 0.45, tl);
    if (f0.plats === st.plats && st.f && f0.f && gb < 1) { st.f = L.blanda(f0.f, st.f, gb); st.p = L.blandaPose(f0.p, st.p, gb); }
  }
  return { ...st, id: r.id, tl, d: r.d };
}
