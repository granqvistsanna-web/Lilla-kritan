<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Lammet badar scener</title>
<style>html, body { margin:0; background:#000; } svg { width:100vw; height:auto; display:block; }</style>
</head>
<body>
<!-- 054 Lammet badar: kodscenerna för storyboarden. window.rad(id) ritar radens stillbild (id som i rader.mjs).
     Serveras från repots rot (bygg.mjs). Ludde laddas live ur sitt uttryck.html via v2-rigg.js. Gjord ur 041:s scen.html.
     Badrummet som i 020/041 (blå karet med kranen, pallen) plus den tomma kroken i kod (023:s knopp). Badankan från 020,
     den rutiga handduken från 023 (434 px, lika hög som lammet). Den blöta ullen och ulltussarna ritas i kod i riggen. -->
<svg viewBox="0 0 1920 1080">
  <defs>
    <filter id="boil" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="5000">
      <feTurbulence id="brus" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
      <feDisplacementMap in="SourceGraphic" scale="2.5"/>
    </filter>
    <clipPath id="fyllklipp"><circle id="fyllcirkel" r="0"/></clipPath>
  </defs>
  <rect width="1920" height="1080" fill="#FAF8F2"/>
  <g id="kamera">
    <g id="platta"></g>
    <g id="vagg"></g>
    <g id="bak"></g>
    <g filter="url(#boil)"><g id="anka"></g></g>
    <g filter="url(#boil)"><g id="figurer"></g></g>
    <g id="kar"></g>
    <g id="fram" filter="url(#boil)"></g>
    <g filter="url(#boil)"><g id="saker"></g></g>
    <g id="pilar"></g>
  </g>
  <g id="ram"></g>
  <g id="gomda" opacity="0"></g>
</svg>
<script src="/verktyg/blinka.js"></script>
<script src="/verktyg/kant.js"></script>
<script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script>
const $ = id => document.getElementById(id);
const A = '/assets/', R = A + 'rekvisita/';
const lagg = (id, h) => $(id).insertAdjacentHTML('beforeend', h);
const f1 = v => v.toFixed(1);

// --- Filer -----------------------------------------------------------------------------------------------------------------
const PLATTA = A + 'bakgrunder/badrummet/badrummet-v1.jpeg';
const KAR_S = 0.88, KAR = R + 'badkar/cut/badkar-bla-kran-tunn.png', KAR_W = 1044 * KAR_S, KAR_H = 687 * KAR_S, KAR_LAPP = 240 * KAR_S, KAR_Y0 = 905 - 668 * KAR_S;   // som 020/041
const PALL = R + 'pall/cut/pall.png', PALL_KS = 0.5;
const HD = R + 'handduk/cut/handduk-rutig-tunn.png', HD_UK = R + 'handduk/cut/handduk-rutig-utan-knopp-tunn.png', HD_H = 434, HD_W = HD_H * 538 / 1033, HK = HD_H / 1033;
const KRITA = R + 'krita-rod/cut/krita-rod.png', KRITA_SPETS = [742, 132];
const ANKA_BILD = R + 'badanka/cut/badanka.png', ANKA_H = 120, ANKA_OGA = [228, 122];

// --- Mått i scenen (1920 × 1080) -----------------------------------------------------------------------------------------
const GOLV = 905, KX = 1420;
const KANT = KAR_Y0 + KAR_LAPP;                     // badkarskantens överkant, ca 440
const BADKANT = 520;                                // riggens y vid badkarskanten: öronen och ögonen syns
const STA = [430, GOLV];                            // lammet står här (in från vänster, efter badet)
const PALL_X0 = KX - KAR_W / 2 + 25 - 778 * PALL_KS, PALL_Y0 = GOLV - 548 * PALL_KS;
const KROK = [150, 300];                            // krokens mitt; handduken hänger med överkanten här (som 023:s HANDDUK_POS)
const ANKA_VID = [KX - 260, KANT - 12];             // ankan nära lammet i karet
const ANKA_GOMD = [KX + 250, KANT + 22];            // ankan i bortre änden, bakom den stora skumtussen
let FOT = 930, GS = 0.572;

let L, G;
const iFig = ([x, fot], [px, py], s = GS) => [x + (px - 512) * s, fot + (py - FOT) * s];
const IKAR = () => [KX - 60, KANT + (FOT - BADKANT) * GS];

function kamera(zoom = 1, cx = 960, cy = 540) {
  const tx = Math.max(1920 - 1920 * zoom, Math.min(0, 960 - cx * zoom)), ty = Math.max(1080 - 1080 * zoom, Math.min(0, 540 - cy * zoom));
  $('kamera').setAttribute('transform', `translate(${f1(tx)} ${f1(ty)}) scale(${zoom})`);
  $('brus').nextElementSibling.setAttribute('scale', (2.5 / zoom).toFixed(2));
}

// --- Rörelsepilar (storyboardens notation) -------------------------------------------------------------------------------
const pil = (d, x, y, v, s = 6) => `<g fill="none" stroke="#7b3fa0" stroke-width="${s}" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
  <path d="${d}" stroke-dasharray="${3 * s} ${2.4 * s}"/><path d="M${x + 5 * s * Math.cos(v + 2.6)} ${y + 5 * s * Math.sin(v + 2.6)} L${x} ${y} L${x + 5 * s * Math.cos(v - 2.6)} ${y + 5 * s * Math.sin(v - 2.6)}"/></g>`;
const rakpil = (x0, y0, x1, y1, s = 6) => pil(`M${x0} ${y0} L${x1} ${y1}`, x1, y1, Math.atan2(y1 - y0, x1 - x0), s);
const bagpil = (x0, y0, cx, cy, x1, y1, s = 6) => pil(`M${x0} ${y0} Q${cx} ${cy} ${x1} ${y1}`, x1, y1, Math.atan2(y1 - cy, x1 - cx), s);
const ruta = (x, y, b, h) => lagg('pilar', `<rect x="${x}" y="${y}" width="${b}" height="${h}" fill="none" stroke="#7b3fa0" stroke-width="5" stroke-dasharray="18 12" opacity=".8"/>`);

// --- Badrummet: platta, kroken, handduken, karet, pallen, skum ---------------------------------------------------------------
const knopp = () => `<circle cx="${f1(KROK[0])}" cy="${f1(KROK[1] + 58 * HK)}" r="${f1(44 * HK)}" fill="#a9b7c2"/><circle cx="${f1(KROK[0])}" cy="${f1(KROK[1] + 56 * HK)}" r="${f1(36 * HK)}" fill="#c9d5dd"/><circle cx="${f1(KROK[0] - 12 * HK)}" cy="${f1(KROK[1] + 44 * HK)}" r="${f1(11 * HK)}" fill="#fff" opacity="0.8"/>`;
function badrum({ handduk = false, skum = 1, gomstuss = true } = {}) {
  $('platta').innerHTML = `<image href="${PLATTA}" width="1920" height="1080" preserveAspectRatio="xMidYMid slice"/>`;
  lagg('vagg', knopp());
  if (handduk) lagg('vagg', `<image href="${HD}" x="${f1(KROK[0] - HD_W / 2)}" y="${KROK[1]}" width="${f1(HD_W)}" height="${HD_H}"/>`);
  lagg('bak', `<image href="${PALL}" x="${f1(PALL_X0)}" y="${f1(PALL_Y0)}" width="${f1(781 * PALL_KS)}" height="${f1(551 * PALL_KS)}"/>`);
  $('kar').innerHTML = `<image href="${KAR}" x="${f1(KX - KAR_W / 2)}" y="${f1(KAR_Y0)}" width="${f1(KAR_W)}" height="${f1(KAR_H)}"/>`;
  if (skum) skumKant(skum, gomstuss);
}
const papper = () => { $('platta').innerHTML = `<rect x="-200" y="-200" width="2400" height="1500" fill="#FDFBF4"/>`; };

// --- Skum, droppar, skimmer, ulltussar (kod) -------------------------------------------------------------------------------
const tuss = (x, y, r, kant = '#cfe6ee', fill = '#fff') => [[0, 0, 1], [-0.8, 0.25, 0.7], [0.8, 0.2, 0.75], [-0.35, -0.55, 0.65], [0.4, -0.5, 0.6]]
  .map(([dx, dy, k]) => `<circle cx="${f1(x + dx * r)}" cy="${f1(y + dy * r)}" r="${f1(k * r)}" fill="${fill}" stroke="${kant}" stroke-width="${f1(0.08 * r)}" paint-order="stroke"/>`).join('');
const GOMSTUSS = [KX + 330, KANT - 4, 78];          // den stora skumtussen i bortre änden där ankan gömmer sig
function skumKant(k = 1, gomstuss = true) {
  let h = ''; for (let i = 0; i < 15; i++) { const u = i / 14, x = KX - 480 + 900 * u, r = (24 + 16 * Math.abs(Math.sin(i * 2.3))) * (0.4 + 0.6 * k);
    h += tuss(x, KANT + 10 - 0.5 * r * k, r); }
  if (gomstuss) h += tuss(...GOMSTUSS);
  lagg('fram', h);
}
const droppe = (x, y, s = 1) => `<path d="M${x} ${y - 14 * s} Q${x + 9 * s} ${y} ${x} ${y + 6 * s} Q${x - 9 * s} ${y} ${x} ${y - 14 * s}Z" fill="#a9dcf0" stroke="#fff" stroke-width="${3 * s}"/>`;
const stjarna = (x, y, r, o = 1) => `<path transform="translate(${x} ${y}) scale(${r})" opacity="${o}" d="M0 -1 L.2 -.2 L1 0 L.2 .2 L0 1 L-.2 .2 L-1 0 L-.2 -.2Z" fill="#fff6c8" stroke="#e6b422" stroke-width=".06"/>`;
function skimmer(x, y, k, s = 1) { lagg('fram', [[-1, -0.7, 1], [1.1, -0.4, 0.8], [0.2, 1.1, 0.7], [-1.2, 0.8, 0.6]].map(([dx, dy, z]) => stjarna(x + dx * 40 * s, y + dy * 34 * s, 16 * z * k * s, Math.min(1, 0.4 + k))).join('')); }
const ull = (x, y, r) => `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}" fill="#FFFDF6" stroke="#D9CBB0" stroke-width="${f1(r * 0.12)}" paint-order="stroke"/>`;
const pol = (x, k = 1) => `<ellipse cx="${x}" cy="${GOLV + 6}" rx="${f1(150 * k)}" ry="${f1(16 * k)}" fill="#a9dcf0" opacity=".55"/>`;

// --- Kritan ----------------------------------------------------------------------------------------------------------------
const krita = (x, y, v = 125, s = 0.33) => lagg('pilar', `<image href="${KRITA}" width="755" height="265"
  transform="translate(${f1(x)} ${f1(y)}) rotate(${v}) scale(${s}) translate(${-KRITA_SPETS[0]} ${-KRITA_SPETS[1]})"/>`);

// --- Badankan (rekvisita/badanka.md, konturen från 020) --------------------------------------------------------------------
const ANKA_KONTUR = [[78, 472], [82, 424], [94, 380], [115, 342], [139, 311], [150, 280], [131, 250], [60, 242], [16, 214], [18, 178], [62, 152],
  [102, 152], [110, 118], [124, 86], [144, 58], [169, 35], [199, 19], [230, 8], [263, 3], [297, 3], [330, 12], [361, 28], [388, 50], [410, 80],
  [428, 110], [439, 147], [438, 193], [406, 271], [440, 270], [482, 273], [531, 286], [560, 296], [640, 260], [690, 236], [705, 280], [711, 313],
  [710, 380], [696, 445], [669, 503], [629, 553], [584, 593], [534, 623], [480, 639], [429, 651], [379, 657], [330, 657], [282, 652], [236, 639],
  [189, 624], [147, 598], [112, 563], [88, 520], [78, 472]];
function anka([x, y], { s = 1, rot = 0, ritad = 1, fyll = 1, lager = 'anka', hatt = false } = {}) {
  const k = s * ANKA_H / 661, t = `translate(${x} ${y}) rotate(${rot}) scale(${k}) translate(-358 -658)`;
  if (ritad < 1 || fyll < 1) {
    const d = 'M' + ANKA_KONTUR.map(([px, py]) => `${px} ${py}`).join(' L'), [ex, ey] = ANKA_KONTUR[Math.round(Math.min(ritad, 1) * (ANKA_KONTUR.length - 1))];
    lagg('pilar', `<g transform="${t}"><path d="${d}" pathLength="1" fill="none" stroke="#b8860b" stroke-width="${7 / k / (s > 3 ? 2.2 : 1)}" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="${ritad} 2" opacity="${fyll > 0 ? 1 - fyll : 1}"/></g>`);
    if (fyll <= 0) { const a = (rot * Math.PI) / 180, dx = (ex - 358) * k, dy = (ey - 658) * k; return [x + dx * Math.cos(a) - dy * Math.sin(a), y + dx * Math.sin(a) + dy * Math.cos(a)]; }
  }
  const klipp = fyll < 1 ? ` clip-path="url(#fyllklipp)"` : '';
  if (fyll < 1) { $('fyllcirkel').setAttribute('cx', 358); $('fyllcirkel').setAttribute('cy', 360); $('fyllcirkel').setAttribute('r', 520 * fyll); }
  lagg(lager, `<g transform="${t}"><g${klipp}><image href="${ANKA_BILD}" width="716" height="661"/>
    <ellipse cx="${ANKA_OGA[0]}" cy="${ANKA_OGA[1]}" rx="17" ry="23" fill="#2a1d1a"/><circle cx="${ANKA_OGA[0] - 6}" cy="${ANKA_OGA[1] - 9}" r="6.5" fill="#fff"/></g>
    ${hatt ? ull(300, -40, 70) + ull(240, -10, 46) + ull(370, -6, 50) : ''}</g>`);
}

// --- Handduken på väg (utan knopp): mitt (x, y), vriden v grader --------------------------------------------------------------
const handduk = ([x, y], v = 0) => lagg('saker', `<g transform="translate(${f1(x)} ${f1(y)}) rotate(${v})"><image href="${HD_UK}" x="${f1(-HD_W / 2)}" y="${f1(-HD_H / 2)}" width="${f1(HD_W)}" height="${HD_H}"/></g>`);
// Konturen som kritan ritar: 023:s HD_KONTUR och HD_RUTOR skalade med 434/300
const HS = HD_H / 300;
const HD_KONTUR = [[-14, 30], [-40, 60], [-66, 95], [-74, 140], [-74, 258], [-64, 292], [0, 298], [64, 292], [74, 258], [74, 140], [66, 95], [40, 60], [14, 30],
  [11, 8], [0, 2], [-11, 8], [-14, 30]].map(([x, y]) => [KROK[0] + x * HS, KROK[1] + y * HS]);
const HD_RUTOR = [[[-66, 150], [66, 150]], [[-70, 208], [70, 208]], [[-68, 262], [68, 262]], [[-34, 104], [-36, 290]], [[0, 96], [0, 294]], [[34, 104], [36, 290]]]
  .map(l => l.map(([x, y]) => [KROK[0] + x * HS, KROK[1] + y * HS]));
function handdukRitas(k) {      // k 0–1: konturen, sedan rutorna; returnerar kritspetsen
  const d = 'M' + HD_KONTUR.map(p => p.map(f1).join(' ')).join(' L');
  lagg('pilar', `<path d="${d}" pathLength="1" fill="none" stroke="#c2577a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="${Math.min(1, k / 0.7)} 2"/>`);
  const nr = Math.max(0, Math.round((k - 0.7) / 0.3 * HD_RUTOR.length));
  HD_RUTOR.slice(0, nr).forEach(l => lagg('pilar', `<path d="M${l.map(p => p.map(f1).join(' ')).join(' L')}" fill="none" stroke="#c2577a" stroke-width="5" stroke-linecap="round"/>`));
  if (k < 0.7) return HD_KONTUR[Math.round(k / 0.7 * (HD_KONTUR.length - 1))];
  return HD_RUTOR[Math.min(nr, HD_RUTOR.length) - 1]?.[1] || HD_KONTUR[0];
}

// --- Lammet ----------------------------------------------------------------------------------------------------------------
// I riggen läggs en gång in: den blöta tonen (maskad med kroppens form), ulltussarna på öronen, magen och runt hela kroppen,
// och skumhatten. Kroppen är ägget x 216–801, y 178–834 (mitt 508, 506).
function lammIn(g) {
  const kg = g.querySelector('g.kropp'), kropp = kg.querySelector(':scope > image'), href = kropp.getAttribute('href');
  g.insertAdjacentHTML('afterbegin', `<defs><mask id="kroppmask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><image href="${href}" width="1024" height="1024"/></mask></defs>`);
  let moln = ''; for (let i = 0; i < 18; i++) { const a = i / 18 * 2 * Math.PI, rr = 70 + 12 * Math.sin(i * 1.7); moln += ull(508 + 300 * Math.cos(a), 500 + 336 * Math.sin(a), rr); }
  kg.insertAdjacentHTML('beforebegin', `<g class="ull-moln">${moln}</g>`);
  kropp.insertAdjacentHTML('afterend', `<g class="blot" mask="url(#kroppmask)"><rect width="1024" height="1024" fill="#8FA6B8" opacity=".24"/></g>
    <g class="ull-mage">${ull(450, 700, 40) + ull(530, 690, 44) + ull(600, 712, 36) + ull(490, 760, 36) + ull(570, 770, 34)}</g>`);
  kg.insertAdjacentHTML('beforeend', `<g class="skumhatt">${tuss(512, 200, 62)}</g>`);
  g.querySelector('image.ear-l').insertAdjacentHTML('afterend', `<g class="ear-l"><g class="ull-orl">${ull(205, 300, 30) + ull(240, 330, 26) + ull(255, 285, 24)}</g></g>`);
  g.querySelector('image.ear-r').insertAdjacentHTML('afterend', `<g class="ear-r"><g class="ull-orr">${ull(818, 298, 30) + ull(784, 330, 26) + ull(770, 284, 24)}</g></g>`);
}
const ANS = n => L.blanda('neutral', n, 1);
const P = o => ({ ...L.POSE0, ...o });
const F = (n, o = {}) => ({ ...ANS(n), glad: [0, 0], ...o });      // glada uttryck med öppna ögon (receptet)
// lamm(var, ansikte, pose, { blot, ull: ['oron','mage','moln'], hatt, ikar, sjunk, s })
function lamm([x, fot], f, p, { blot = 0, ull: u = [], hatt = false, ikar = false, sjunk = 0, s = GS } = {}) {
  $('figurer').appendChild(G);
  G.setAttribute('transform', `translate(${x} ${fot + sjunk * s}) scale(${s}) translate(-512 ${-FOT})`);
  L.rita(G, f, p);
  G.querySelector('.blot').setAttribute('opacity', blot);
  G.querySelectorAll('.ull-orl,.ull-orr').forEach(e => e.setAttribute('opacity', u.includes('oron') || u.includes('moln') ? 1 : 0));
  G.querySelector('.ull-mage').setAttribute('opacity', u.includes('mage') || u.includes('moln') ? 1 : 0);
  G.querySelector('.ull-moln').setAttribute('opacity', u.includes('moln') ? 1 : 0);
  G.querySelector('.skumhatt').setAttribute('opacity', hatt ? 1 : 0);
  if (ikar) G.querySelectorAll('.arm-l,.arm-r,.arm-l2,.arm-r2,.leg-l,.leg-r,.tail,.skugga').forEach(e => e.setAttribute('opacity', 0));
  if (blot) {   // droppar från öronspetsarna och magen
    const [a, b] = iFig([x, fot], [200, 380], s), [c, d] = iFig([x, fot], [826, 378], s), [e, h] = iFig([x, fot], [508, 840], s);
    lagg('fram', droppe(a, b + 26, 1.1) + droppe(c, d + 40, 1) + droppe(e - 30, h + 10, 1) + droppe(e + 40, h + 40, 0.9));
  }
}
const huvudKar = (px = 512, py = 330) => iFig(IKAR(), [px, py]);
const BAD = () => kamera(1.45, KX - 120, 470);
const NARA = (zoom = 2.0, dy = 0) => kamera(zoom, STA[0], GOLV - 230 * (GS / 0.572) + dy);
const VINKA = { armar: [0, 150] };

// --- Ritintrot: kritan ritar badankan ----------------------------------------------------------------------------------------
function papperAnka(k, fyll) {
  papper(); kamera(1);
  const s = 5.2, X = 960, Y = 540 + 0.5 * ANKA_H * s;
  const spets = anka([X, Y], { s, ritad: k, fyll, lager: 'saker' });
  if (k < 1) krita(...spets, 125, 0.45);
  else if (fyll < 1) krita(X + 380, Y - 520, 140, 0.45);
}

// --- Kritirisen ------------------------------------------------------------------------------------------------------------
function iris(cx, cy, r) {
  const ring = 'M' + Array.from({ length: 145 }, (_, j) => { const a = j / 144 * 2 * Math.PI, rr = r * (1 + 0.05 * Math.sin(9 * a));
    return `${f1(cx + rr * Math.cos(a))} ${f1(cy + rr * Math.sin(a))}`; }).join('L') + 'Z';
  lagg('ram', `<path d="M-50 -50H1970V1130H-50Z ${ring}" fill="#101010" fill-rule="evenodd"/><path d="${ring}" fill="none" stroke="#fff8e0" stroke-width="12" filter="url(#boil)"/>`);
}

// --- Raderna ---------------------------------------------------------------------------------------------------------------
const INTRO = '/produktion/youtube/bilderbok-intro/stills/2.5.jpg';
const LAMM_TOPP = () => GOLV - (FOT - 178) * GS;      // kroppens överkant när lammet står
const RAD = {
  '00': () => { $('platta').innerHTML = `<image href="${INTRO}" width="1920" height="1080"/>`; },
  '01a': () => papperAnka(0.6, 0),
  '01b': () => papperAnka(1, 0),
  '01c': () => { papperAnka(1, 0.7); ruta(560, 140, 800, 800); },

  '1': () => { badrum(); kamera(1); anka(ANKA_VID, { rot: -4 });
    lamm(STA, F('jatteglad'), P({ ...VINKA })); lagg('pilar', bagpil(40, 640, 150, 560, STA[0] - 220, 640, 8)); },
  '1b': () => { badrum(); kamera(1.7, STA[0] + 120, 640); anka(ANKA_VID, { rot: 3 });
    lamm(STA, F('jatteglad', { titt: [12, 0] }), P({ rikt: 0.3, oron: [-10, -10] }));
    lagg('pilar', rakpil(...iFig(STA, [512, 120]), ...iFig(STA, [512, 200]), 5)); },
  '2': () => { badrum(); kamera(1.7, STA[0] + 120, 640); anka(ANKA_VID, { rot: -3 });
    lamm(STA, F('jatteglad', { titt: [14, -4] }), P({ rikt: 0.4, oron: [-12, -12] })); },
  '3': () => { badrum(); kamera(1); anka(ANKA_VID, { rot: 3 });
    lamm([PALL_X0 + 300, PALL_Y0 + 20], F('jatteglad'), P({ armar: [30, 30] }));
    lagg('pilar', bagpil(STA[0] + 40, 560, PALL_X0 + 120, 380, PALL_X0 + 230, 500, 7) + bagpil(PALL_X0 + 360, 330, KX - 420, 140, IKAR()[0] - 60, KANT - 60, 8)); },
  '4': () => { badrum(); BAD(); anka(ANKA_VID, { rot: -3 });
    lamm(IKAR(), F('somnig', { lock: [1, 1], le: 1 }), P({ oron: [6, 6] }), { ikar: true }); },
  '5': () => { badrum(); BAD(); anka([IKAR()[0] - 230, ANKA_VID[1]], { rot: 6 });
    lamm(IKAR(), F('glad', { titt: [-14, 4] }), P({ rikt: -0.3, luta: -4 }), { ikar: true });
    lagg('pilar', rakpil(ANKA_VID[0] + 40, ANKA_VID[1] - 150, IKAR()[0] - 190, ANKA_VID[1] - 150, 6)); },
  '6a': () => { badrum(); BAD(); anka([IKAR()[0] - 230, ANKA_VID[1]], { rot: -4 });
    lamm(IKAR(), F('glad'), P({}), { ikar: true, sjunk: 520 });
    lagg('pilar', rakpil(IKAR()[0], KANT - 260, IKAR()[0], KANT - 80, 7)); },
  '6b': () => { badrum(); BAD(); anka([IKAR()[0] - 230, ANKA_VID[1]], { rot: 4 });
    lamm(IKAR(), F('forvanad', { titt: [0, -10] }), P({}), { ikar: true, hatt: true }); },
  '7': () => { badrum(); kamera(2.0, IKAR()[0] - 60, KANT - 100); anka([IKAR()[0] - 230, ANKA_VID[1]], { rot: -3 });
