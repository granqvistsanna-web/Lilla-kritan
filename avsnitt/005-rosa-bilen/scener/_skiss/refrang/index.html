<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refrängskisser 005</title>
<style>
  :root { --bg: #f4efe6; --ink: #2a2522; --mute: #7a716a; --chip: #fff; --acc: #E2669B; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, sans-serif; }
  .bar { position: sticky; top: 0; z-index: 9; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; background: var(--bg); border-bottom: 1px solid #0001; }
  .bar button { border: 1px solid #0002; background: var(--chip); border-radius: 999px; padding: 6px 12px; font: inherit; cursor: pointer; }
  .bar button.on { background: var(--ink); color: #fff; }
  .bar .rad { margin-left: auto; font-weight: 600; color: var(--acc); min-width: 16em; text-align: right; }
  .vy { display: grid; gap: 16px; padding: 16px; }
  .vy.alla { grid-template-columns: repeat(3, 1fr); }
  .kort h2 { margin: 0 0 4px; font-size: 16px; }
  .kort p { margin: 4px 0 0; color: var(--mute); font-size: 13px; max-width: 70ch; }
  .duk { position: relative; width: 100%; aspect-ratio: 1376 / 768; overflow: hidden; border-radius: 10px; background: #fff; }
  .scen { position: absolute; left: 0; top: 0; width: 1376px; height: 768px; transform-origin: 0 0; }
  .scen img, .scen .lager { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .scen .plat { width: 1376px; height: 768px; }
  .tid { height: 4px; background: #0001; border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .tid i { display: block; height: 100%; width: 0; background: var(--acc); }
  .hjarta { position: absolute; width: 60px; height: 60px; transform-origin: 30px 30px; }
  .hjarta::before, .hjarta::after { content: ""; position: absolute; top: 4px; width: 32px; height: 50px; background: #F06EAA; border-radius: 32px 32px 0 0; border: 0; box-shadow: 0 0 0 5px #fff; }
  .hjarta::before { left: 30px; transform: rotate(-45deg); transform-origin: 0 100%; }
  .hjarta::after { left: -2px; transform: rotate(45deg); transform-origin: 100% 100%; }
  .slag { position: absolute; left: 0; top: 0; width: 1376px; height: 768px; background: #F06EAA; mix-blend-mode: color; opacity: 0; }
</style>
</head>
<body>
<div class="bar">
  <span id="knappar" style="display:contents"></span>
  <button id="spela">▶ Spela refrängen (mellanslag)</button>
  <span class="rad" id="rad"></span>
</div>
<div class="vy" id="vy"></div>

<script>
// Throwaway-skiss. Tider i sångtid (sang.m4a), refräng 1: 0:47.5–1:00.6. Bilder ur assets/ och scener/lager/.
const A = '../../../../../assets/', LAGER = '../../lager/';
const RADER = [[47.5, 'Rosa! (Rosa!) Rosa! (Rosa!)'], [50.5, 'Rosa är min favoritfärg!'], [52.2, 'Rosa! (Rosa!) Rosa! (Rosa!)'],
  [55.0, 'Rosa som ett glassberg!'], [56.4, 'Brum, brum, tut, tut –'], [58.8, 'vad är rosa? Titta ut!']];
const T0 = 46.8, T1 = 60.8, BEAT = 60 / 104;
const ROSA = [47.5, 48.25, 49.0, 49.75, 52.2, 52.9, 53.6, 54.3];   // rop, eko, rop, eko × 2
const TUT = [57.6, 58.2], GLASS = 55.0, TITTA = 58.8;

const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const del = (a, b, t) => cl((t - a) / (b - a));
const mjuk = x => x * x * (3 - 2 * x);
const lerp = (a, b, k) => a + (b - a) * k;
const pop = k => k <= 0 ? 0 : k < 0.6 ? lerp(0, 1.15, k / 0.6) : lerp(1.15, 1, (k - 0.6) / 0.4);
const hoppY = (t, t0, d, h) => { const k = (t - t0) / d; return k > 0 && k < 1 ? -4 * h * k * (1 - k) : 0; };

function mk(tag, cls, parent, attrs = {}) { const e = document.createElement(tag); if (cls) e.className = cls; Object.assign(e, attrs); parent.appendChild(e); return e; }
function img(src, parent, w, h) { const e = mk('img', '', parent, { src }); e.style.width = w + 'px'; if (h) e.style.height = h + 'px'; return e; }
// sätt en bild med underkanten mitt på (x, g), höjd h px, vriden r grader, skala s
const BIL = { w: 881, h: 811 }, MUS = { w: 746, h: 824 }, FL = { w: 1024, h: 1024, bb: [244, 111, 787, 922] };
function satt(e, x, g, h, r = 0, s = 1, ratio = 1) {
  const w = h * ratio;
  e.style.width = w + 'px'; e.style.height = h + 'px';
  e.style.transform = `translate(${x - w / 2}px, ${g - h}px) rotate(${r}deg) scale(${s})`;
  e.style.transformOrigin = `${w / 2}px ${h}px`;
}
function hjarta(parent) { const e = mk('div', 'hjarta', parent); e.style.opacity = 0; return e; }
function hjartaAt(e, x, y, s, o) { e.style.opacity = o; e.style.transform = `translate(${x - 30}px, ${y - 30}px) scale(${s})`; }
function kamera(lager, cx, cy, z) { lager.style.transform = `translate(${688 - cx * z}px, ${384 - cy * z}px) scale(${z})`; }

// glassbergsscenen: plattan, toppen framför, flaggan, musen som klättrar (används av 1 och 3)
const VAG = [[430, 760], [520, 640], [610, 560], [560, 470], [660, 400], [620, 340], [702, 300]];   // stigen upp, nerifrån
function glassberg(L) {
  const g = mk('div', 'lager', L);
  img(A + 'bakgrunder/glassberget/glassberget.png', g, 1376, 768).className = 'plat';
  const flagga = img(A + 'rekvisita/cut/flagga-rosa.png', g, 10, 10);
  const topp = img(A + 'bakgrunder/glassberget/cut/glassberget-topp.png', g, 1376, 768); topp.className = 'plat';
  return { g, flagga, topp };
}
function flaggaPa(fl, t, t0, x = 812, y = 312) {
  const k = mjuk(del(t0, t0 + 0.35, t)), h = 185, s = h / (FL.bb[3] - FL.bb[1]);
  fl.style.opacity = t >= t0 ? 1 : 0;
  fl.style.width = FL.w * s + 'px'; fl.style.height = FL.h * s + 'px';
  const sk = Math.sin(t * 9) * 4.5 * k;
  fl.style.transformOrigin = `${(FL.bb[0] + FL.bb[2]) / 2 * s}px ${FL.bb[3] * s}px`;
  fl.style.transform = `translate(${x - (FL.bb[0] + FL.bb[2]) / 2 * s}px, ${y - FL.bb[3] * s + (1 - k) * -90}px) skewX(${-4.6 + sk}deg)`;
}

const VARIANTER = [
{ id: 1, namn: 'Lugn väg',
  om: 'En helbild på vägen hela tiden. Inga blixtar. På varje "Rosa!" poppar en rosa sak upp vid vägen och står kvar, på ekot vickar den. Rad 3 är en lugn inzoomning med ett hjärta. Glassberget får 5,6 s (rad 6–8): musen klättrar upp steg för steg och sätter flaggan på "Titta ut!".',
  bygg(S) {
    const L = mk('div', 'lager', S);
    const vag = mk('div', 'lager', L); img(LAGER + 'vagen.png', vag, 1376, 768).className = 'plat';
    const saker = [[A + 'bakgrunder/vagen-saker/buske-rosa.png', 250, 560, 150, 870 / 625], [A + 'bakgrunder/vagen-saker/ballong-rosa.png', 1110, 520, 240, 579 / 861],
      [A + 'bakgrunder/vagen-saker/buske-rosa.png', 1180, 565, 130, 870 / 625], [A + 'bakgrunder/vagen-saker/ballong-rosa.png', 330, 500, 210, 579 / 861]]
      .map(([src, x, g, h, r], i) => ({ e: img(src, vag, 10), x, g, h, r, t: ROSA[[0, 2, 4, 6][i]] }));
    const bil = img('bil-mus.png', vag, 10), hj = hjarta(vag);
    const gb = glassberg(L), mus = img('mus.png', gb.g, 10);
    return t => {
      const iGlass = t >= GLASS;
      vag.style.display = iGlass ? 'none' : ''; gb.g.style.display = iGlass ? '' : 'none';
      if (!iGlass) {
        saker.forEach(s => { const eko = ROSA.find(x => x > s.t && x - s.t < 1); const v = eko ? Math.sin(cl((t - eko) / 0.4) * Math.PI) * 6 : 0;
          s.e.style.opacity = t >= s.t ? 1 : 0; satt(s.e, s.x, s.g, s.h, v + Math.sin(t * 2 + s.x) * 1.5, pop(del(s.t, s.t + 0.3, t)), s.r); });
        const b = Math.floor((t - 47.5) / (2 * BEAT)), y = hoppY(t, 47.5 + b * 2 * BEAT, 2 * BEAT * 0.5, 14);
        satt(bil, 688, 700 + y, 330, 0, 1, BIL.w / BIL.h);
        const k3 = mjuk(del(50.4, 51.0, t)) * (1 - mjuk(del(51.9, 52.3, t)));
        kamera(vag, lerp(688, 670, k3), lerp(384, 450, k3), lerp(1, 1.7, k3));
        const hk = del(50.6, 52.1, t); hjartaAt(hj, 700, 390 - 80 * hk, pop(del(50.6, 50.9, t)) * 1.3, t > 50.6 && t < 52.1 ? 1 - hk * 0.6 : 0);
      } else {
        const steg = VAG.length - 1, t0 = GLASS + 0.15, d = (TITTA - 0.3 - t0) / steg, i = cl(Math.floor((t - t0) / d), 0, steg - 1);
        const k = mjuk(cl((t - t0 - i * d) / d)), [x0, y0] = VAG[i], [x1, y1] = VAG[i + 1];
        const done = t >= TITTA - 0.3, x = done ? VAG[steg][0] : lerp(x0, x1, k), y = done ? VAG[steg][1] : lerp(y0, y1, k) + hoppY(k, 0, 1, 1) * 40;
        const jubel = t > TITTA ? hoppY(t, TITTA + 0.35, 0.35, 22) + hoppY(t, TITTA + 0.8, 0.35, 16) : 0;
        satt(mus, x - 20, y + jubel, 150, done ? 0 : Math.sin(k * Math.PI) * 6, 1, MUS.w / MUS.h);
        flaggaPa(gb.flagga, t, TITTA);
        const z = lerp(1.25, 1, mjuk(del(GLASS, TITTA, t)));
        kamera(gb.g, lerp(600, 688, mjuk(del(GLASS, TITTA, t))), lerp(560, 384, mjuk(del(GLASS, TITTA, t))), z);
      }
    };
  } },
{ id: 2, namn: 'Rosa himmel',
  om: 'Världen rodnar en gång när refrängen börjar (mjukt, 0,6 s) och står rosa tills glassberget. Bilen dansar, varje "Rosa!" puffar ett hjärta (ekot ett mindre). Rad 4–5 åker kameran sakta in. På glassberget kör bilen själv uppför och flaggan poppar upp bredvid den.',
  bygg(S) {
    const L = mk('div', 'lager', S);
    const vag = mk('div', 'lager', L); img(LAGER + 'vagen.png', vag, 1376, 768).className = 'plat';
    const tona = mk('div', 'slag', vag);
    const bil = img('bil-mus.png', vag, 10), hj = ROSA.map(() => hjarta(vag));
    const gb = glassberg(L), bil2 = img('bil-mus.png', gb.g, 10);
    return t => {
      const iGlass = t >= GLASS;
      vag.style.display = iGlass ? 'none' : ''; gb.g.style.display = iGlass ? '' : 'none';
      if (!iGlass) {
        tona.style.opacity = 0.8 * mjuk(del(47.2, 47.8, t));
        const b = Math.floor((t - 47.5) / (2 * BEAT)), y = hoppY(t, 47.5 + b * 2 * BEAT, BEAT * 0.9, 26);
        const lut = t > 50.5 && t < 52.2 ? Math.sin((t - 50.5) * Math.PI / (2 * BEAT)) * 5 : 0;
        satt(bil, 688, 700 + y, 360, lut, 1, BIL.w / BIL.h);
        ROSA.forEach((r, i) => { const k = del(r, r + 1.4, t), eko = i % 2;
          hjartaAt(hj[i], 688 + (eko ? 110 : -100) + Math.sin(k * 6) * 12, 380 - 220 * k, pop(del(r, r + 0.25, t)) * (eko ? 0.7 : 1.1), t >= r && k < 1 ? 1 - k : 0); });
        const z = 1 + 0.35 * mjuk(del(52.2, 55.0, t));
        kamera(vag, 688, lerp(384, 520, mjuk(del(52.2, 55.0, t))), z);
      } else {
        const k = mjuk(del(GLASS, TITTA - 0.2, t)), tut = TUT.reduce((a, x) => a + hoppY(t, x, 0.25, 12), 0);
        const x = lerp(380, 690, k), y = lerp(780, 318, k) + tut;
        satt(bil2, x, y, 120, lerp(-22, 0, mjuk(del(0.7, 1, k))), 1, BIL.w / BIL.h);
        flaggaPa(gb.flagga, t, TITTA, 790, 316);
        kamera(gb.g, lerp(560, 688, k), lerp(560, 384, k), lerp(1.4, 1, k));
      }
    };
  } },
{ id: 3, namn: 'Upp på glassberget',
  om: 'Hela refrängen är en resa uppför glassberget (13 s i stället för 1,4 s). Varje "Rosa!" är ett hopp upp till nästa avsats, åtta hopp. Rad 3 vilar bilen och ett hjärta stiger. Rad 6 är bilen uppe, rad 7 tutar den, och på "Titta ut!" poppar flaggan upp. Ett mål barnet kan följa, men vägen syns inte i refrängen.',
  bygg(S) {
    const L = mk('div', 'lager', S);
    const gb = glassberg(L), bil = img('bil-mus.png', gb.g, 10), hj = hjarta(gb.g);
    const P = [[300, 790], [420, 720], [560, 690], [470, 610], [590, 560], [520, 480], [640, 440], [560, 380], [660, 340], [705, 318]];
    return t => {
      let i = 0; ROSA.forEach((r, j) => { if (t >= r) i = j + 1; });
      const start = t < 47.5 ? 0 : 1, iEff = Math.min(i + start, P.length - 1);
      const tj = i ? ROSA[i - 1] : 47.0, k = mjuk(del(tj, tj + 0.32, t));
      let [x0, y0] = P[Math.max(0, iEff - 1)], [x1, y1] = P[iEff];
      if (t >= GLASS) { [x0, y0] = P[8]; [x1, y1] = P[9]; }
      const kk = t >= GLASS ? mjuk(del(GLASS, GLASS + 0.6, t)) : k;
      const tut = TUT.reduce((a, x) => a + hoppY(t, x, 0.25, 10), 0);
      const y = lerp(y0, y1, kk) + hoppY(kk, 0, 1, 1) * 46 + tut;
      const h = lerp(150, 105, del(780, 320, lerp(y0, y1, kk)));
      satt(bil, lerp(x0, x1, kk), y, h, (x1 < x0 ? 6 : -6) * Math.sin(kk * Math.PI), 1, BIL.w / BIL.h);
      const hk = del(50.6, 52.1, t); hjartaAt(hj, lerp(x0, x1, kk), y - h - 40 - 60 * hk, pop(del(50.6, 50.9, t)), t > 50.6 && t < 52.1 ? 1 - hk * 0.5 : 0);
      flaggaPa(gb.flagga, t, TITTA, 790, 318);
      const cy = lerp(y0, y1, kk) - 60, ut = mjuk(del(GLASS, TITTA + 0.5, t));
      kamera(gb.g, lerp(lerp(x0, x1, kk) + 40, 688, ut), lerp(cl(cy, 384 / 1.5, 768 - 384 / 1.5), 384, ut), lerp(1.5, 1, ut));
    };
  } },
];

// ---- runda 2: tydligare glassberg (hel strut på en hög platta), musen svävar upp ----
const HB = { w: 1376, h: 1536 }, TOPP = [705, 318], MARK = 1470;
const KON = [[360, 735], [1050, 735], [705, 1490]];   // strutens hörn (stand-in tills riktig bild finns)
const ROSAX = [47.5, 49.0, 52.2, 53.6];              // ropen (inte ekona): ett steg var + ekona
function hogtBerg(L) {
  const g = mk('div', 'lager', L);
  const svg = (inner, z) => { const d = mk('div', '', g); d.style.cssText = 'position:absolute;left:0;top:0'; d.innerHTML = `<svg width="${HB.w}" height="${HB.h}" viewBox="0 0 ${HB.w} ${HB.h}">${inner}</svg>`; return d; };
  const [a, b, c] = KON;
  const rutor = []; for (let i = -12; i < 14; i++) { rutor.push(`<line x1="${200 + i * 60}" y1="700" x2="${200 + i * 60 + 800}" y2="1500"/>`, `<line x1="${1200 - i * 60}" y1="700" x2="${1200 - i * 60 - 800}" y2="1500"/>`); }
  svg(`<defs><filter id="krita"><feTurbulence baseFrequency=".9" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="6"/></filter>
       <clipPath id="kon"><polygon points="${a} ${b} ${c}"/></clipPath></defs>
    <rect width="${HB.w}" height="${HB.h}" fill="#A9DBF1"/>
    <ellipse cx="320" cy="1250" rx="110" ry="38" fill="#fff" opacity=".85"/><ellipse cx="1120" cy="1080" rx="130" ry="42" fill="#fff" opacity=".85"/>
    <ellipse cx="688" cy="1640" rx="900" ry="200" fill="#9ccf6a" filter="url(#krita)"/>
    <g filter="url(#krita)"><polygon points="${a} ${b} ${c}" fill="#E8B46A" stroke="#fff" stroke-width="10" stroke-linejoin="round"/>
      <g clip-path="url(#kon)" stroke="#C98B45" stroke-width="9" stroke-linecap="round">${rutor.join('')}</g></g>`);
  img(A + 'bakgrunder/glassberget/glassberget.png', g, 1376, 768).className = 'plat';
  // droppar som rinner ner på struten, så det syns att det är glass
  svg(`<g fill="#E07F92" filter="url(#krita)"><path d="M420 760 q12 70 30 0z"/><path d="M560 760 q14 110 34 0z"/><path d="M840 760 q12 80 30 0z"/><path d="M960 760 q14 120 34 0z"/>
    <ellipse cx="452" cy="768" rx="70" ry="22"/><ellipse cx="700" cy="770" rx="160" ry="24"/><ellipse cx="930" cy="768" rx="90" ry="22"/></g>`);
  const flagga = img(A + 'rekvisita/cut/flagga-rosa.png', g, 10, 10);
  return { g, flagga };
}
function kam2(e, cx, cy, z) { kamera(e, cl(cx, 688 / z, HB.w - 688 / z), cl(cy, 384 / z, HB.h - 384 / z), z); }
// steg: på varje "Rosa!" (rop och eko) tar hon ett steg upp, mjukt med en liten gungning
function steg(t, n) { let i = 0, k = 1; ROSA.forEach((r, j) => { if (t >= r) { i = j + 1; k = del(r, r + 0.55, t); } }); return Math.min(n, i - 1 + (t < 47.5 ? 1 : mjuk(k))); }
const gung = (t, x) => Math.sin(t * 2.2 + x) * 6;

VARIANTER.push(
{ id: 4, runda: 2, namn: 'Ballongen lyfter',
  om: 'Den rosa ballongen från vägen kommer tillbaka och knyter sig fast i bilen. På varje "Rosa!" stiger de ett steg, förbi den stora struten, så barnet ser att berget är en glass. På "glassberg" landar bilen på toppen och ballongen stannar kvar. Flaggan på "Titta ut!".',
  bygg(S) {
    const L = mk('div', 'lager', S), gb = hogtBerg(L);
    const ball = img(A + 'bakgrunder/vagen-saker/ballong-rosa.png', gb.g, 10), bil = img('bil-mus.png', gb.g, 10), hj = hjarta(gb.g);
    const P = [[300, MARK]].concat(ROSA.map((_, i) => [lerp(270, 330, (i + 1) / 8) + (i % 2 ? 18 : -18), lerp(MARK, 560, (i + 1) / 8)]));
    return t => {
      const i = steg(t, 8), j = Math.floor(i), k = i - j, [x0, y0] = P[j], [x1, y1] = P[Math.min(8, j + 1)];
      let x = lerp(x0, x1, k), y = lerp(y0, y1, k) + (t > 47.5 ? gung(t, 0) : 0);
      const upp = mjuk(del(GLASS - 0.2, GLASS + 0.9, t));                       // över kanten och ner på toppen
      x = lerp(x, TOPP[0] - 40, upp); y = lerp(y, TOPP[1], upp) - Math.sin(upp * Math.PI) * 110;
      const tut = TUT.reduce((a, q) => a + hoppY(t, q, 0.25, 10), 0), h = 120;
      satt(bil, x, y + tut, h, Math.sin(t * 2.2) * 3 * (1 - upp), 1, BIL.w / BIL.h);
      const ner = mjuk(del(46.8, 47.4, t)), bh = 300;                        // ballongen sänker sig och fäster i taket
      satt(ball, x + 12 + Math.sin(t * 1.7) * 8, y - h * 0.8 - (1 - ner) * 500, bh, Math.sin(t * 1.3) * 5, 1, 579 / 861);
      const hk = del(50.6, 52.1, t); hjartaAt(hj, x + 80, y - h - 30 - 60 * hk, pop(del(50.6, 50.9, t)), t > 50.6 && t < 52.1 ? 1 - hk * 0.5 : 0);
      flaggaPa(gb.flagga, t, TITTA, 800, 316);
      const ut = mjuk(del(TITTA - 0.2, TITTA + 1.2, t));
      kam2(gb.g, lerp(x + 200, 688, ut), lerp(y - 140, 384, ut), lerp(1.35, 1, ut));
    };
  } },
{ id: 5, runda: 2, namn: 'Molntrappa',
  om: 'Rosa moln ligger som en trappa i luften bredvid struten. På varje "Rosa!" kör bilen över till nästa moln, som gungar till när hjulen landar. Lugnare än att hoppa, och molnen visar vägen upp. Sista molnet ligger vid toppen och bilen kör upp på glassen på "glassberg".',
  bygg(S) {
    const L = mk('div', 'lager', S), gb = hogtBerg(L);
    const C = [[300, MARK]].concat(ROSA.map((_, i) => [i % 2 ? 470 : 250, lerp(MARK - 120, 470, i / 7)]));
    const moln = C.slice(1).map(() => img(LAGER + 'moln-rosa.png', gb.g, 10));
    const bil = img('bil-mus.png', gb.g, 10), hj = hjarta(gb.g);
    return t => {
      const i = steg(t, 8), j = Math.floor(i), k = i - j, [x0, y0] = C[j], [x1, y1] = C[Math.min(8, j + 1)];
      moln.forEach((m, n) => { const [mx, my] = C[n + 1], land = ROSA[n], sv = hoppY(t, land + 0.45, 0.4, -10);
        m.style.opacity = mjuk(del(46.6 + n * 0.12, 47.2 + n * 0.12, t)); satt(m, mx + gung(t, n) * 0.6, my + 46 + sv + Math.sin(t * 1.5 + n) * 5, 80, 0, 1, 538 / 195); });
      let x = lerp(x0, x1, k), y = lerp(y0, y1, k) - Math.sin(k * Math.PI) * 50 + (j > 0 ? Math.sin(t * 1.5 + j - 1) * 5 : 0);

function valj(v) { visa = v; try { localStorage.setItem('refrang-vy', visa); localStorage.setItem('refrang-runda', runda); } catch (e) {} bygg(); }

  const b = (txt, on, fn) => { const e = mk('button', on ? 'on' : '', k, { textContent: txt }); e.onclick = fn; };
  b(`Runda ${runda} (r)`, false, () => { runda = runda % 4 + 1; valj(0); });
  iRunda.forEach((v, n) => b(`${n + 1} · ${v.namn}`, visa === v.id, () => valj(v.id)));

function nu() { return spelar && !ljud.paused ? ljud.currentTime : tFri; }
function loop(ms) {

  ritare.forEach(r => r(t));
  const rad = RADER.filter(([x]) => t >= x).pop(); radEl.textContent = rad ? `♪ ${rad[1]}` : '';

function knapp() { document.getElementById('spela').textContent = spelar ? '❚❚ Pausa (mellanslag)' : '▶ Spela refrängen (mellanslag)'; }

}
