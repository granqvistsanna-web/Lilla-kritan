<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vägen 1 – 03a till 05f</title>
<style>
  html, body { margin:0; background:#a9dc7c; overflow:hidden; }
  svg { width:100vw; height:100vh; display:block; }
</style>
</head>
<body>
<!-- Avsnitt 005, vägen 1 (storyboard 03a, 04, 05a–05f). Raka klipp.
     03a närbild: "Musen kör sin rosa bil": musen vinkar till oss med armen bakom kroppen (bara tassen syns utanför kanten), en vink per slag, och blinkar.
     04 körscen (vers 1): bilen vid vänstra tredjedelen gungar lugnt i takt, hjulen snurrar (inga effektstreck, Sanna) och träd och
     buskar vid vägkanten glider förbi. "Vad är rosa?": hon tittar åt ena hållet och sedan åt det andra; "Leta med!": fjärilen Fia fladdrar
     förbi högt uppe och hon följer henne med blicken; "Jag och du": kameran går till ansiktet och hon tittar på oss, "kom och se": hon ler.
     Groovet utan sång: bilen gungar i takt och tutar en gång.
     05a–05f: refrängen (../refrang.js). Klipper rakt till vagen-2 (06, körscenens helbild). -->
<script src="../kit.js"></script><script src="../ansikten.js"></script><script src="../v2-riggar.js"></script><script src="../v2.js"></script><script src="../bilen.js"></script><script src="../../../../verktyg/kant.js"></script><script src="../refrang.js"></script>
<script src="../../../003-bussen-halsar-pa/scener/kritsvep.js"></script>
<script>
const { el, lerp, mjuk, inUt, del, clamp, blink, BEAT, BEAT0 } = kit;

const GV = 735, BIL_H = 480, BIL_X = W / 3, TILT = -1;   // körscenen (bygg.py drive())
const NAR_H = 870, NAR_OGON = 0.42;                      // närbilden (bygg.py närbild())
const VINK = 150, VINK_SPOKE = 115;                      // vinkar bakom kroppen, snett ut och upp: tassen syns utanför kanten (0 ner, 90 ut, 180 upp)
const V = 300;                                           // vägens fart, px/s
const HIMMEL = '#a9dcf3';                                // refrängens himmel: kritsvepet in i den
const KANT_Y = 574;                                      // gräskanten på plattan
// vägkanten i hela 04 (Sanna): lövträd och rosa blomsterbuskar bakom vägen, ca 2 s isär så att 2–3 saker syns samtidigt.
// [scentid när mitten är vid x = W, namn, höjd]; de två första står redan i bild vid klippet till 04.
const L_ = 'lovtrad', B_ = 'buske-rosa', GRAN = 1.5;   // lövträden är v2-granen sedan 2026-11-08 (kit.vagsak), smalare, så 1,5 × högre
const VAGKANT = [[1.0, L_, 160], [3.0, B_, 105], [5.1, L_, 150], [7.2, L_, 175], [9.3, B_, 115], [11.4, L_, 145]];

let KAM, T, r, mitt, bil, fia, saker, kant, kamNar, ansikte, huvud;

async function bygg() {
  const M = await kit.manus();
  const [a0] = M.bild('03a'), [, slut] = M.bild('05f'), S = x => x - a0, rad = x => S(M.rad(x).t + M.av);
  const takt = x => S(kit.takt(x - M.av) + M.av);        // närmaste slag (avsnittstid → scentid)
  const w = x => x - (a0 - M.av);                          // sångtid → scentid (03a börjar vid sångtid 17.7)
  T = { S0: a0 - M.av, K: S(M.bild('04')[0]), R: S(M.bild('05a')[0]), SLUT: S(slut), VERS: rad('Musen kör sin'), DU: rad('Jag och du') };
  // sångtidens ord (stammor/vocals): Vad 21.84, rosa 22.30, Leta 24.18, kom 28.86; groovet utan sång 29.5–31.6
  T.VAD = w(21.84); T.ROSA = w(22.30); T.LETA = w(24.18); T.KOM = w(28.86); T.GROOV = w(29.5);
  T.VINK0 = takt(a0 + 0.5);                                          // vinkningen: en vink per slag
  T.FIA = [w(23.5), w(24.8), w(26.8), w(29)];                        // kommer, är framme vid huvudet, börjar flyga iväg, borta
  T.TUT = [w(30.3)];                                                 // ett tut i groovet, på ett slag
  // vita avgaspuffar medan hon kör (Sanna): en liten puff varannat slag
  T.PUFF = [];
  for (let b = BEAT0 + Math.ceil((T.K + T.S0 - BEAT0) / (2 * BEAT)) * 2 * BEAT - T.S0; b < T.R - 0.8; b += 2 * BEAT) T.PUFF.push(b);
  T.BLINK = [T.DU + 1.4, T.DU + 3.0];
  // kameran: inga raka klipp. Börjar i kritan-ritars sista bild (helbilden), åker in till närbilden (03a), ut till helbilden vid klippet
  // till 04, in mot bilen, till ansiktet på "Jag och du" och ut igen i groovet. [från, till, mål]; mål: 'hel', 'nar', 'bil', 'ansikte'
  T.KAM = [[0, 0.8, 'nar'], [T.K - 0.4, T.K + 0.6, 'hel'], [T.K + 1.2, T.K + 2.2, 'bil'], [T.DU, T.DU + 1.0, 'ansikte'], [T.GROOV, T.GROOV + 1.0, 'hel']];

  const L = kit.duk('avsnitt/005-rosa-bilen/scener/lager/vagen-slat.png');
  mitt = kit.vagstreck(L.plate);                          // mittstrecken rullar med vägen
  saker = el('g', {}, L.plate);                           // vägkanten: med plattan, utan boil
  kant = VAGKANT.map(([tid, namn, h]) => ({ tid, s: kit.vagsak(namn, saker, KANT_Y, namn === L_ ? GRAN * h : h) }));
  kit.lager.overst.setAttribute('transform', 'translate(-130 -90) scale(0.95)');   // kritsvep.js ritar i 1920 × 1080; större än W / 1920 och centrerad, så att strecken vänder utanför bilden (annars skymtar hjulen i gliporna)
  bil = bilen.ny(L.figurer, { kontur: true });
  fia = v2.figur('fjarilen-fia', L.figurer, { h: 120 });   // v2-Fia (2026-11-08, som 007): flaxar med arkets rörelse
  r = await refrang.ny(M, '05', S);
  await r.bygg(L, bil);

  // närbildens kamera: räknas på bilen i vila, så att bilen gungar i bild och inte bilden med bilen
  bil.pose({ x: BIL_X, y: GV, h: BIL_H, tilt: TILT });
  const [nx] = bil.musPunkt([509, 440]), [, oy] = bil.musPunkt([509, 400]), hc = NAR_H * bilen.MUS_K * BIL_H / 806;
  kamNar = [nx, oy + hc * (0.5 - NAR_OGON), H / hc];
  ansikte = bil.musPunkt([509, 420]); huvud = bil.musPunkt([509, 120]);   // nosen och öronens topp, bilen i vila
  KAM = { hel: [W / 2, H / 2, 1], nar: kamNar, bil: [BIL_X, 470, 1.3], ansikte: [ansikte[0], ansikte[1] + 40, 1.7] };   // 'bil': hela bilen med hjulen

  const LJ = kit.ljud;
  LJ('brum', 0, { loop: true, langd: T.R + 0.2, vol: 0.45, fade: 0.6 });
  // mjuka effekter (sången går först, inget talas över den): swoosh på åkningen in i 04, plupp på två avgaspuffar, ett tut i groovet
  LJ('swoosh', T.K - 0.4, { vol: 0.25, fade: 0.5 });
  const puff = m => T.PUFF.reduce((a, b) => Math.abs(b - m) < Math.abs(a - m) ? b : a);
  [T.K + 1.0, T.K + 6.0].forEach(m => LJ('plupp', puff(m), { vol: 0.25, langd: 0.6 }));
  T.TUT.forEach(x => LJ('tuta-tut', x - 0.05, { vol: 0.8, langd: 0.5 }));
  LJ('fladder', T.FIA[0], { langd: T.FIA[3] - T.FIA[0], vol: 0.3, fade: 1.0 });
  T.SVEP = [T.R - 0.75, T.R + 0.5];                     // kritsvepet: täcker vägen under 04:s sista takt, smular bort in i refrängens himmel
  kritsvep.LJUD.forEach((kk, i) => LJ('skrrrrt-kort', T.SVEP[0] + kk * 2 * (T.R - T.SVEP[0]), { variant: i % 4 + 1, vol: 0.6 }));
  LJ('swoosh', T.SVEP[0], { vol: 0.6 });
  kit.kor(render, T.SLUT, { sang: [a0 - M.av, slut - M.av] });
}

// bilen på vägen: gungar lugnt, ett gung (fram och tillbaka) per två slag, och lyfter sig mjukt på varje slag (ingen spets
// när den landar). Tut: en liten mjuk gupp, utan squash (Sanna: hoppen såg hackiga ut)
function korPose(t, mus) {
  const fas = (t + T.S0 - BEAT0) / BEAT;   // slag i sången
  const gupp = T.TUT.reduce((a, b) => a + Math.sin(Math.PI * clamp(del(b - 0.05, b + 0.3, t))) ** 2, 0);
  return { x: BIL_X, y: GV - 2.5 * (1 - Math.cos(2 * Math.PI * fas)) / 2 - 5 * gupp, h: BIL_H,
    tilt: TILT + 0.8 * Math.sin(Math.PI * fas / 2), dist: V * t, ...mus };
}

// fjärilen: kommer in högt uppe från höger, flyger två varv runt Milles huvud (ett platt varv ovanför öronen) och flyger upp och ut till höger
function fiaPlats(t) {
  const [a, b, c, d] = T.FIA, v = 2 * Math.PI * (t - b) / ((c - b) / 2) - Math.PI / 2;
  const varv = [huvud[0] + 230 * Math.cos(v), huvud[1] + 60 - 30 * Math.sin(v)];   // runt öronen (v2: lägre, så att kamerans 'bil' visar henne)
  const inn = mjuk(del(a, b, t)), ut = del(c, d, t) ** 2;
  const p = [lerp(W + 120, varv[0], inn), lerp(120, varv[1], inn)];
  return [lerp(p[0], W + 150, ut), lerp(p[1], -60, ut) + 9 * Math.sin(t * 6.5)];
}
function rendFia(t) {
  const synlig = t > T.FIA[0] && t < T.FIA[3];
  if (!synlig) return fia.pose({ synlig: false });
  const [x, y] = fiaPlats(t), [x1, y1] = fiaPlats(t + 0.1);
  // v2: vingarna flaxar med arkets rörelse (flaxa), kroppen lutar i flygriktningen
  fia.pose({ x, y, tilt: clamp((x1 - x) / 2.5, -14, 14), synlig, humor: 'glad', titt: -0.6, tittY: clamp((y1 - y) / 15, -1, 1),
    blink: 0, rorelse: ['flaxa', t] });
  return [x, y];
}

// musen i körscenen: blinkar; "Vad är rosa?": tittar åt ena hållet på "Vad" och åt det andra på "rosa"; "Leta med!": följer fjärilen med
// blicken; "Jag och du": tittar in i kameran, "kom och se": ler brett. Båda tassarna är kvar på ratten.
function musKor(t, fiaXY) {
  let titt = 0.25, tittY = 0, humor = 'glad', rot = 0;
  if (t >= T.VAD && t < T.LETA) { titt = t < T.ROSA ? -1 : 1; tittY = -0.2; humor = 'nyfiken'; rot = t < T.ROSA ? 4 : -4; }
  else if (t >= T.LETA && t < T.DU && fiaXY) { titt = clamp((fiaXY[0] - ansikte[0]) / 200, -1, 1); tittY = clamp((fiaXY[1] - ansikte[1]) / 200, -1, 1); }
  if (t >= T.DU) { titt = 0; if (t >= T.KOM) humor = 'skrattar'; }
  if (T.TUT.some(x => t > x - 0.05 && t < x + 0.4)) { humor = 'skrattar'; titt = 0; }   // tutar: glad, munnen öppen
  return blunda(t, { humor, titt, tittY, rot });
}

// blinkning: ögonen stängda (sleep-ögonen, en båge) i 0,12 s, inte de hoptryckta öppna ögonen
function blunda(t, mus) {
  return blink(t, T.BLINK) && !['skrattar', 'karleksfull'].includes(mus.humor) ? { ...mus, humor: 'sleep' } : mus;
}

// kameran: från helbilden genom åkningarna i T.KAM, var och en mjuk (in och ut)
function kam(t) {
  let k = KAM.hel;
  for (const [a, b, mal] of T.KAM) if (t > a) { const u = inUt(del(a, b, t)); k = k.map((v, i) => lerp(v, KAM[mal][i], u)); }
  return k;
}

function render(t) {
  const s = r.rita(t);
  kritsvep(t < T.R ? 0.5 * del(T.SVEP[0], T.R, t) : t < T.SVEP[1] ? 0.5 + 0.3 * del(T.R, T.SVEP[1], t) : 0, HIMMEL);   // 0 efteråt: inga smulor kvar
  const egna = [saker, fia.g, mitt.g, mitt.fram];
  if (s) { egna.forEach(g => g.style.display = 'none'); return; }
  egna.forEach(g => g.style.display = '');
  bil.g.style.display = '';

  kant.forEach(({ tid, s }) => s.pa(W + V * (tid - t)));
  mitt.rulla(V * t);

  const fiaXY = rendFia(t);
  let mus;
  if (t < 0.3) mus = { humor: 'glad', titt: 0 };   // samma pose som kritan-ritars sista bild
  else if (t < T.K) {   // 03a: vinkar (blinkar), en vink per slag; armen bakom kroppen (ingen 'fram'), tassen snett ut och upp
    const v = Math.sin(Math.PI * (t - T.VINK0) / BEAT);
    mus = { humor: 'blinkar', arm_r: lerp(VINK_SPOKE, VINK, (1 + v) / 2), titt: 0 };
  } else mus = musKor(t, fiaXY);
  // under kritsvepet tonas bilen bort, så att gliporna mellan strecken visar ljus väg och gräs, inte svarta hjul (smulor)
  bil.pose({ ...korPose(t, mus), opacity: 1 - mjuk(del(T.SVEP[0] + 0.15, T.R - 0.3, t)) });
  bil.puffa(t, T.PUFF);

  kit.kamera(...kam(t));
}

bygg();
</script>
</body>
</html>
