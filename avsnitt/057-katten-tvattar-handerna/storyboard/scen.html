<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Katten tvättar händerna scener</title>
<style>html, body { margin:0; background:#000; } svg { width:100vw; height:auto; display:block; }</style>
</head>
<body>
<!-- 057 Katten tvättar händerna: kodscenerna för storyboarden (förlaga: 023 storyboard/scen.html).
     window.rad(id) ritar radens stillbild (id som i rader.mjs). Serveras från repots rot (bygg.mjs).
     Katten laddas live ur sitt uttryck.html via v2-rigg.js, med de tunna kanterna (cut-tunn, som 044).
     I kod: färgen på tassarna (följer armens transform) och den blå fläcken på högra örat (ligger i örats grupp), de röda
     och gula avtrycken, tvålen, det färgade skummet, skumskägget, de tre färgade bubblorna, vattenstrålen, droppar, skimret,
     målningen (rekvisita/malningen.md). Penseln i ritintrot är rekvisita/pensel (cut/pensel.png + pensel-kontur.json). -->
<svg viewBox="0 0 1920 1080">
  <defs>
    <filter id="boil" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="5000">
      <feTurbulence id="brus" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
      <feDisplacementMap in="SourceGraphic" scale="5"/>
    </filter>
    <clipPath id="fyllklipp"><circle id="fyllcirkel" r="0"/></clipPath>
  </defs>
  <rect width="1920" height="1080" fill="#FAF8F2"/>
  <g id="kamera">
    <g id="platta"></g>
    <g id="bak"></g>
    <g id="pall"></g>
    <g filter="url(#boil)"><g id="figurer"></g></g>
    <g id="mellan"></g>
    <g id="kar"></g>
    <g id="tvalen" filter="url(#boil)"></g>
    <g id="fram" filter="url(#boil)"></g>
    <g id="pilar"></g>
  </g>
  <g id="ram"></g>
  <g id="gomda" opacity="0"></g>
</svg>
<script src="/verktyg/blinka.js"></script>
<script src="/verktyg/kant.js"></script>
<script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script>
const $ = id => document.getElementById(id);
const A = '/assets/';
const PLATTA = A + 'bakgrunder/badrummet/badrummet-v1.jpeg';
// Handfatet (rekvisita/handfatet.md, cut/handfatet.png 802 × 775): läppens överkant y 177, fötterna y 772, kranens pip (598, 84)
// i bilden. Skala HK: 0,68 ger 545 px brett och läppen 405 px över golvet (katten är 414 px hög). W × H = rutan från läppen ner
// till golvet; kantY = bildens del ovanför läppen (kranen). Finns inte bilden ritas platshållaren i stället.
const HK = 0.68, HANDFAT = { bild: A + 'rekvisita/handfatet/cut/handfatet.png', W: 802 * HK, H: (772 - 177) * HK, kantY: 177 * HK };
const PALL = A + 'rekvisita/pall/cut/pall.png', PALL_LAG = [190, 272], PALL_HOG = [555, 66];   // 781 × 551; stegens mitt i bilden (som 020)
const HANDDUK = A + 'rekvisita/handduk/cut/handduk-rutig.png';                               // 538 × 1033
const KRITA = A + 'rekvisita/krita-rod/cut/krita-rod.png', KRITA_SPETS = [742, 132];
const lagg = (id, h) => $(id).insertAdjacentHTML('beforeend', h);

// --- Mått i scenen (1920 × 1080) -----------------------------------------------------------------------------------------
const GOLV = 905;                                   // fötternas linje på golvet (golvkanten i plattan ligger på ca 809)
const GS = 0.57;                                    // kattens skala: öronspets till fot 749 px i riggen → 427 px (bildutsnitt: 430)
const HX = 1180, RIM = GOLV - HANDFAT.H;            // handfatets mitt och läppens överkant (555)
const FATKANT = 700;                                // kattens y (riggens 1024-ruta) vid läppen: armarna (y 532–645) syns ovanför
const BX = HX - 65;                                 // katten står lite till vänster om mitten, kranen sitter till höger
const STA = [600, GOLV];                            // katten står på golvet till vänster om handfatet
let VID, PALL_KS, PALL_X0, PALL_Y0;                 // katten på pallen bakom handfatet; sätts när riggen är laddad (L.FOTTER)
const TVAL = [HX - 205, RIM - 17];                  // tvålen på läppens vänstra ände
const KRAN = [HX + (598 - 401) * HK, RIM - (177 - 84) * HK];   // kranens pip i bilden; strålen ritas i kod ner till läppen
const HANDDUK_POS = [HX + 520, 170, 300];           // [mitt x, överkant y, höjd] på väggen

let L, G;                                           // riggen och kattens grupp
const iFig = ([x, fot], [px, py], s = GS) => [x + (px - 512) * s, fot + (py - L.FOTTER) * s];

// --- Kameran: zoom 1 = hela plattan; visar aldrig utanför bakgrunden -------------------------------------------------------
function kamera(zoom = 1, cx = 960, cy = 540) {
  const tx = Math.max(1920 - 1920 * zoom, Math.min(0, 960 - cx * zoom)), ty = Math.max(1080 - 1080 * zoom, Math.min(0, 540 - cy * zoom));
  $('kamera').setAttribute('transform', `translate(${tx.toFixed(1)} ${ty.toFixed(1)}) scale(${zoom})`);
  $('brus').nextElementSibling.setAttribute('scale', (5 / zoom).toFixed(2));
}
const HEL = () => kamera(1);
const HALV_GOLV = () => kamera(1.45, 960, 600);                            // katten på golvet och handfatet
const HALV = () => kamera(1.6, HX + 10, 500);                              // katten bakom handfatet
const NARA_STA = () => kamera(2, STA[0], STA[1] - (L.FOTTER - 470) * GS);  // närbild, katten på golvet
const NARA_TASS = () => kamera(2.5, BX, RIM - 70);                         // närbild tassarna ovanför läppen
const NARA_ANS = () => kamera(2.5, BX, VID[1] - (L.FOTTER - 420) * GS);    // närbild ansiktet bakom handfatet

// --- Platsen ---------------------------------------------------------------------------------------------------------------
let HANDFAT_FINNS = false;
function badrum({ handduk = true } = {}) {
  const [hx, hy, hh] = HANDDUK_POS, hw = hh * 538 / 1033;
  $('platta').innerHTML = `<image href="${PLATTA}" width="1920" height="1080" preserveAspectRatio="xMidYMid slice"/>` +
    (handduk ? `<image href="${HANDDUK}" x="${hx - hw / 2}" y="${hy}" width="${hw}" height="${hh}"/>` : '');
  $('pall').innerHTML = `<image href="${PALL}" x="${PALL_X0}" y="${PALL_Y0}" width="${781 * PALL_KS}" height="${551 * PALL_KS}"/>`;
  const { W, H, kantY } = HANDFAT, x0 = HX - W / 2, kranD = `M${KRAN[0] + 60} ${RIM + 6} V${KRAN[1] - 6} Q${KRAN[0] + 60} ${KRAN[1] - 40} ${KRAN[0] + 26} ${KRAN[1] - 40} Q${KRAN[0]} ${KRAN[1] - 40} ${KRAN[0]} ${KRAN[1] - 8}`;
  $('kar').innerHTML = `<ellipse cx="${HX}" cy="${GOLV + 4}" rx="${W * 0.3}" ry="14" fill="#000" opacity="0.07"/>` + (HANDFAT_FINNS
    ? `<image href="${HANDFAT.bild}" x="${x0}" y="${RIM - kantY}" width="${W}" height="${H + kantY}" preserveAspectRatio="xMidYMax meet"/>`
    // platshållaren: en skål på en pelare, läppen överst, kranen till höger
    : `<path d="${kranD}" fill="none" stroke="#b9c2c6" stroke-width="28" stroke-linecap="round"/>
        <circle cx="${KRAN[0] + 104}" cy="${RIM - 22}" r="17" fill="#e58a8a"/>
        <rect x="${HX - 78}" y="${RIM + 150}" width="156" height="${H - 150}" rx="14" fill="#e3e9ec"/>
        <path d="M${x0 + 24} ${RIM + 30} Q${x0 + 50} ${RIM + 178} ${HX - 150} ${RIM + 178} H${HX + 150} Q${x0 + W - 50} ${RIM + 178} ${x0 + W - 24} ${RIM + 30}Z" fill="#eef2f4"/>
        <rect x="${x0}" y="${RIM}" width="${W}" height="36" rx="18" fill="#f8fafb"/>`);
  if (!HANDFAT_FINNS) lagg('pilar', `<rect x="${x0 - 12}" y="${RIM - 12}" width="${W + 24}" height="${H + 20}" fill="none" stroke="#c0392b" stroke-width="4" stroke-dasharray="16 12" opacity=".8"/>
      <text x="${HX}" y="${RIM + 112}" style="font:700 30px system-ui;fill:#c0392b;text-anchor:middle">⚠ HANDFAT</text>
      <text x="${HX}" y="${RIM + 146}" style="font:600 20px system-ui;fill:#c0392b;text-anchor:middle">platshållare ${W} × ${H}</text>`);
}
const papper = () => { $('platta').innerHTML = `<rect x="-200" y="-200" width="2400" height="1500" fill="#F6EFE3"/>
  <rect x="120" y="70" width="1680" height="940" rx="14" fill="#FDFBF4" stroke="#e8e0cf" stroke-width="6"/>`; };

// --- Vattenstrålen (i kod) ----------------------------------------------------------------------------------------------------
function strale(slut = RIM) { const [x, y] = KRAN, RIM_ = slut;   // slut: där strålen tar emot (tassen), annars läppen; den går aldrig genom något
  lagg('fram', `<path d="M${x - 8} ${y + 8} Q${x - 11} ${(y + RIM_) / 2} ${x - 8} ${RIM_ + 4} L${x + 8} ${RIM_ + 4} Q${x + 11} ${(y + RIM_) / 2} ${x + 8} ${y + 8}Z" fill="#a9dcf0" opacity="0.9"/>
    <path d="M${x - 2} ${y + 16} V${RIM_ - 8}" stroke="#fff" stroke-width="4" opacity="0.7" stroke-linecap="round"/>`); }

// --- Skum, skumtuss, bubblor, skimmer (ur 020, vitt med kritkant) -----------------------------------------------------------
const tuss = (x, y, r, fyll = '#fff', kant = '#cfe6ee') => [[0, 0, 1], [-0.8, 0.25, 0.7], [0.8, 0.2, 0.75], [-0.35, -0.55, 0.65], [0.4, -0.5, 0.6]]
  .map(([dx, dy, k]) => `<circle cx="${(x + dx * r).toFixed(1)}" cy="${(y + dy * r).toFixed(1)}" r="${(k * r).toFixed(1)}" fill="${fyll}" stroke="${kant}" stroke-width="${(0.08 * r).toFixed(1)}" paint-order="stroke"/>`).join('');
function skum(k = 1, ton) {    // lite skum längs läppen framför katten, k 0–1 = hur mycket; ton = SKUMTON.rod/gul (färgat skum)
  let h = ''; for (let i = 0; i < 7; i++) { const x = BX - 150 + 50 * i, r = (14 + 9 * Math.abs(Math.sin(i * 2.3))) * (0.4 + 0.6 * k);
    h += tuss(x, RIM + 4 - 0.4 * r, r, ...(ton && (ton.sida < 0 ? i < 4 : i > 2) ? ton.f : [])); }
  lagg('fram', h);
}
function skrubb(x, y, r, ton) {   // skumtussen som snurrar över en fläck + två snurrpilar
  lagg('fram', tuss(x, y, r, ...(ton ? ton.f : [])));
  lagg('pilar', [0, 1].map(i => { const a0 = i * Math.PI, R = r * 1.55;
    const p = a => [x + R * Math.cos(a), y + R * 0.75 * Math.sin(a)], [x0, y0] = p(a0 - 0.2), [x1, y1] = p(a0 + 1.6);
    return pil(`M${x0} ${y0} A${R} ${R * 0.75} 0 0 1 ${x1} ${y1}`, x1, y1, a0 + 1.6 + Math.PI / 2, r * 0.09); }).join(''));
}
const stjarna = (x, y, r, o = 1) => `<path transform="translate(${x} ${y}) scale(${r})" opacity="${o}" d="M0 -1 L.2 -.2 L1 0 L.2 .2 L0 1 L-.2 .2 L-1 0 L-.2 -.2Z" fill="#fff6c8" stroke="#e6b422" stroke-width=".06"/>`;
function skimmer(x, y, k, vidd = 1) { lagg('fram', [[-1, -0.7, 1], [1.1, -0.4, 0.8], [0.2, 1.1, 0.7], [-1.2, 0.8, 0.6]].map(([dx, dy, s]) => stjarna(x + dx * 46 * vidd, y + dy * 40 * vidd, 18 * s * k * vidd, Math.min(1, 0.4 + k))).join('')); }
function bubbla(x, y, r, sprack = false, farg = '#dff3fb') {
  if (sprack) { lagg('fram', Array.from({ length: 9 }, (_, i) => { const a = i / 9 * 2 * Math.PI; return `<circle cx="${x + r * Math.cos(a)}" cy="${y + r * Math.sin(a)}" r="${4 + 2 * (i % 2)}" fill="${farg}" stroke="#fff" stroke-width="3"/>`; }).join('')); return; }
  lagg('fram', `<circle cx="${x}" cy="${y}" r="${r}" fill="${farg}" fill-opacity="0.8" stroke="#fff" stroke-width="${Math.max(4, r * 0.07)}"/>
    <path d="M${x - r * 0.6} ${y - r * 0.2} A${r * 0.65} ${r * 0.65} 0 0 1 ${x - r * 0.15} ${y - r * 0.62}" fill="none" stroke="#fff" stroke-width="${Math.max(4, r * 0.09)}" stroke-linecap="round"/>`);
}

// --- Rörelsepilar (storyboardens notation, inte i filmen) -----------------------------------------------------------------
const pil = (d, x, y, v, s = 6) => `<g fill="none" stroke="#c0392b" stroke-width="${s}" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
  <path d="${d}" stroke-dasharray="${3 * s} ${2.4 * s}"/><path d="M${x + 5 * s * Math.cos(v + 2.6)} ${y + 5 * s * Math.sin(v + 2.6)} L${x} ${y} L${x + 5 * s * Math.cos(v - 2.6)} ${y + 5 * s * Math.sin(v - 2.6)}"/></g>`;
const rakpil = (x0, y0, x1, y1, s) => pil(`M${x0} ${y0} L${x1} ${y1}`, x1, y1, Math.atan2(y1 - y0, x1 - x0), s);

// --- Tvålen i kod (ur 020 scener/badet, rekvisita/tval.md); ritad < 1 = kritan ritar konturen, returnerar spetsen ---------------
function tval(x, y, v = 0, s = 1, ritad = 1) {
  const w = 62 * s, h = 38 * s, r = 0.45 * h;
  if (ritad < 1) { const om = 2 * (w + h) - 8 * r + 2 * Math.PI * r;
    lagg('pilar', `<rect x="${x - w / 2}" y="${y - h / 2}" width="${w}" height="${h}" rx="${r}" fill="none" stroke="#8d6bbd" stroke-width="5" stroke-linecap="round" stroke-dasharray="${ritad * om} ${om}"/>`);
    return [x + w / 2 - 4, y + h / 2 - 2]; }
  lagg('tvalen', `<g class="tval" transform="translate(${x} ${y}) rotate(${v})">
    <rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="${r}" fill="#D9C6EF"/>
    <rect x="${-w / 2}" y="${h * 0.18}" width="${w}" height="${h * 0.32}" rx="${r * 0.6}" fill="#BBA4DA" opacity="0.55"/>
    <ellipse cx="${-w * 0.18}" cy="${-h * 0.18}" rx="${w * 0.2}" ry="${h * 0.14}" fill="#F1E8FA"/></g>`);
}

// --- Kritan (röda kritan ur rekvisita/krita-rod) med spetsen i (x, y) --------------------------------------------------------
const krita = (x, y, v = 125, s = 0.33) => lagg('pilar', `<image href="${KRITA}" width="755" height="265"
  transform="translate(${x} ${y}) rotate(${v}) scale(${s}) translate(${-KRITA_SPETS[0]} ${-KRITA_SPETS[1]})"/>`);

// --- Färgen (i kod, som honungen i 023) -------------------------------------------------------------------------------------
// Tassarnas färg (riggens 1024-ruta, vid armens spets i vila) ligger efter armarna och får den synliga armbildens transform
// efter varje rita(), så den följer armen i alla poser. Den blå fläcken ligger i högra örats grupp och följer örat.
const ROD = ['#E8483B', '#B8322A'], GUL = ['#F2C230', '#C99A12'], BLA = ['#5B8FD9', '#3E6DB5'];
const SKUMTON = { rod: { sida: -1, f: ['#F9CFCB', '#E8483B'] }, gul: { sida: 1, f: ['#FCEDB4', '#E2B21F'] }, bla: { f: ['#D6E4F8', '#5B8FD9'] } };
const klick = (x, y, r, [f, k]) => `<g stroke="${k}" stroke-width="2.5" paint-order="stroke">` + [[0, 0, 1, 0.8], [-0.55, 0.3, 0.6, 0.55], [0.45, -0.35, 0.55, 0.5], [0.15, 0.75, 0.3, 0.42]]
  .map(([dx, dy, a, b]) => `<ellipse cx="${x + dx * r}" cy="${y + dy * r}" rx="${a * r}" ry="${b * r}" fill="${f}"/>`).join('')
  + `</g><ellipse cx="${x - 0.3 * r}" cy="${y - 0.25 * r}" rx="${0.28 * r}" ry="${0.16 * r}" fill="#fff" opacity="0.45"/>`;
const TASS = { l: [168, 606], r: [856, 609] }, ORAT = [682, 238];
function fargIn(g) {
  const arm = g.querySelector('.arm-l'); arm.parentNode.insertAdjacentHTML('beforeend', `<g class="farg-l">${klick(...TASS.l, 30, ROD)}</g><g class="farg-r">${klick(...TASS.r, 30, GUL)}</g>`);
  g.querySelector('.ear-r').insertAdjacentHTML('beforeend', `<g class="farg-ora">${klick(...ORAT, 22, BLA)}</g>`);
}
const tassavtryck = (x, y, k = 1, [f, kant] = ROD) => `<g transform="translate(${x} ${y}) scale(${k})" fill="${f}" stroke="${kant}" stroke-width="1.6" stroke-opacity="0.6">
  <ellipse cx="0" cy="3" rx="12" ry="8"/><circle cx="-12" cy="-7" r="4"/><circle cx="-4" cy="-12" r="4.2"/><circle cx="4" cy="-12" r="4.2"/><circle cx="12" cy="-7" r="4"/></g>`;
const SPAR = Array.from({ length: 7 }, (_, i) => [90 + 72 * i, GOLV + (i % 2 ? 6 : 16)]);   // ett avtryck per steg in till STA, rött och gult varannan
const spar = (skimra = false) => { lagg('bak', `<g filter="url(#boil)" opacity="0.95">${SPAR.map(([x, y], i) => tassavtryck(x, y, 1, i % 2 ? GUL : ROD)).join('')}</g>`);
  if (skimra) [1, 3, 5].forEach(i => lagg('fram', stjarna(SPAR[i][0] + 16, SPAR[i][1] - 18, 12))); };
const droppe = (x, y, r = 7) => `<path d="M${x} ${y - 1.8 * r} Q${x + r} ${y - 0.3 * r} ${x + r} ${y + 0.2 * r} A${r} ${r} 0 0 1 ${x - r} ${y + 0.2 * r} Q${x - r} ${y - 0.3 * r} ${x} ${y - 1.8 * r}Z" fill="#a9dcf0" stroke="#fff" stroke-width="2.5"/>`;

// --- Katten ----------------------------------------------------------------------------------------------------------------
// katt(var, ansikte, pose, { farg: { l, r, ora } 0–1, bakom: benen och skuggan dolda bakom handfatet })
const SMUTSIG = { l: 1, r: 1, ora: 1 }, ORA = { l: 0, r: 0, ora: 1 }, REN = { l: 0, r: 0, ora: 0 };
function katt([x, fot], f, p, { farg = SMUTSIG, bakom = false, s = GS } = {}) {
  $('figurer').appendChild(G);
  G.setAttribute('transform', `translate(${x} ${fot}) scale(${s}) translate(-512 ${-L.FOTTER})`);
  L.rita(G, f, p);
  ['l', 'r'].forEach(n => { const syns = [...G.querySelectorAll('.arm-' + n)].find(e => e.getAttribute('opacity') === '1'), h = G.querySelector('.farg-' + n);
    h.setAttribute('transform', syns ? syns.getAttribute('transform') : ''); h.setAttribute('opacity', syns ? 0.95 * (farg[n] || 0) : 0); });
  G.querySelector('.farg-ora').setAttribute('opacity', 0.95 * (farg.ora || 0));
  if (bakom) G.querySelectorAll('.leg-l,.leg-r,.skugga,.tail').forEach(e => e.setAttribute('opacity', 0));
}
const P = o => ({ ...L.POSE0, ...o });
const F = (n, o = {}) => ({ ...L.blanda('neutral', n, 1), ...(['glad', 'jatteglad', 'fnissig', 'stolt'].includes(n) ? { glad: [0, 0] } : {}), ...o });
const klapp = (t, gnista = 0) => ({ ...L.ROR.klappa(t)[1], gnista });
// var en sak syns i scenens mått (mätt ur elementets ruta, så att det följer armar och öron i alla poser)
const iScen = sel => { const inv = $('kamera').getScreenCTM().inverse(), r = G.querySelector(sel).getBoundingClientRect();
  const q = new DOMPoint(r.x + r.width / 2, r.y + r.height / 2).matrixTransform(inv); return [q.x, q.y]; };
const tassMitt = () => { const a = iScen('.farg-l'), b = iScen('.farg-r'); return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; };
const K_TVAL = () => kamera(3.2, TVAL[0] + 110, TVAL[1] - 45);                    // kritan ritar tvålen (023)
const NARA_ORA = () => kamera(3, ...iFig(VID, [640, 300]));
const MED_TAVLAN = () => kamera(1.4, 1010, 470);                                           // katten bakom handfatet och målningen

// --- Penseln (rekvisita/pensel) och målningen (rekvisita/malningen) ---------------------------------------------------------------
const PENSEL = A + 'rekvisita/pensel/cut/pensel.png', PENSEL_KONTUR = A + 'rekvisita/pensel/cut/pensel-kontur.json';
let PK;   // konturens d, laddas vid start
const KRIT = '#7a4a32';
function papperPensel(k, fyll) {           // kritan ritar penseln på papperet: konturen (k), hylsans två streck och ifyllnaden inifrån (fyll)
  papper(); kamera(1);
  const s = 1.15, x0 = 960 - 622 * s, y0 = 540 - 155 * s, t = `translate(${x0} ${y0}) scale(${s})`;
  lagg('bak', `<g id="pensel" transform="${t}" clip-path="url(#fyllklipp)"><image href="${PENSEL}" width="1244" height="309"/></g>
    <g transform="${t}"><path id="penselkontur" d="${PK}" pathLength="1" fill="none" stroke="${KRIT}" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="${k} 2"/>
    ${k >= 1 ? [662, 866].map(x => `<path d="M${x} 84 Q${x + 4} 155 ${x} 226" fill="none" stroke="${KRIT}" stroke-width="9" stroke-linecap="round"/>`).join('') : ''}</g>`);
  $('fyllcirkel').setAttribute('cx', 622); $('fyllcirkel').setAttribute('cy', 155); $('fyllcirkel').setAttribute('r', 700 * fyll);
  if (k < 1) { const e = $('penselkontur'), q = e.getPointAtLength(k * e.getTotalLength()); krita(x0 + q.x * s, y0 + q.y * s, 125, 0.42); }
  else if (fyll < 1) krita(1500, 300, 140, 0.42);
}
const MAL = { x: 800, y: 330, w: 250, h: 192 };
const AVTRYCK = [[-0.3, 0.1, ROD], [0, -0.06, GUL], [0.3, 0.1, BLA]];
function malning(kontur = 1, fyll = [1, 1, 1], papperFyllt = true) {   // kontur 0–1 (papperet, sedan avtrycken), fyll per avtryck 0–1
  const { x, y, w, h } = MAL, avt = AVTRYCK.map(([dx, dy, f], i) => [x + dx * w, y + dy * h + 10, f, i]);
  let g = `<g transform="rotate(-3 ${x} ${y})">`;
  if (papperFyllt) g += `<rect x="${x - w / 2 + 6}" y="${y - h / 2 + 8}" width="${w}" height="${h}" rx="8" fill="#000" opacity="0.08"/>
    <rect x="${x - w / 2}" y="${y - h / 2}" width="${w}" height="${h}" rx="8" fill="#FBF6EC" stroke="#fff" stroke-width="7"/>`;

  }
  lagg('bak', `<g filter="url(#boil)">${g}</g></g>`);
