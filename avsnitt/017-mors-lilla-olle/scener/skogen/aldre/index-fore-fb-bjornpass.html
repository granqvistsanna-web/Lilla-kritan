<!-- Avsnitt 017 Mors lilla Olle: hela sången efter introt i en kodscen, i SÅNGTID (t = 0 är sångens början, sang.mp3 klipps aldrig;
     avsnittstid = sångtid + introts längd). Bild 01–28 ur ../../storyboard.md, tiderna ur ../../rader.txt.
     Skogen, figurerna, kritan och kritirisen: ./skog.js. Olle, mor och björnen är v2-riggarna live ur uttryck.html.
     Rendera från scener/: node render.mjs skogen --snabb   ·   stillbilder: node render.mjs skogen 9 23 45 …
     I kod, inga nya bilder: blåbären (på busken, i korgen, i handen), Olles blå mun, björnens blå prickar, busken och stenen som gungar. -->
<script src="/verktyg/blinka.js"></script>
<script src="/verktyg/kant.js"></script>
<script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script type="module">
import * as S from './skog.js';
const { $, kl, lerp, mjuk, del, bump, f1, lagg, sb, G, BUSK, STENP, KORG_H, ANS, POS, kam, K, vink, nick, hopp } = S;

// --- Platserna (storyboardens x × SK) ----------------------------------------------------------------------------------------
const OX = sb(790);                 // Olle vid busken, hela filmen
const KX = sb(900);                 // korgen på marken mellan Olle och björnen (från bild 04)
const BX0 = sb(1110), BX = 1500;    // björnen framme (09–11) och bredvid Olle (13–28)
const BBAK = BUSK.x - 14;           // björnen bakom busken
const bakFot = upp => G + 3 - 126 * upp;   // björnen bakom busken: upp 0 = bara öronen, 1 = hela huvudet
const SX = STENP.x;                 // björnen bakom stenen
const STENKLIPP = S.STENFORM;       // björnen hukad bakom stenen syns bara ovanför stenens kant, aldrig under den
// runt busken (09, 23, 27): bakom busken går han till XR, där halva kroppen sticker ut förbi v2-buskens högra kant (ca 1657),
// och kommer fram runt kanten (S.runtBusken); HALV = björnens halva bredd i scenen
const XR = 1830, HALV = 235;
const STEN_FRI = STENP.x + 0.688 * STENP.h + 204;    // björnens mitt när han är helt fri från stenen (vänsterkanten förbi stenens högerkant)
const MX = sb(500), MX2 = sb(565);  // mor stannar (21–23), mor bredvid Olle (24–28)
const SANG_SLUT = 135.0, DURATION = SANG_SLUT;

const KAM = { NAR_OLLE: kam(790, 470, 470), TVA8: kam(880, 470, 760), TVA10: kam(940, 450, 820), NAR_BJ: kam(1010, 470, 520),
  TVA: kam(900, 450, 720), NAR_OLLE24: kam(760, 470, 470), TVA25: kam(700, 450, 720), TVA27: kam(860, 450, 800), GISSA: kam(600, 470, 900) };

// --- Blåbären: var de plockas och flyger, hur många som ligger i korgen ------------------------------------------------------
// flyg: { a, b (sångtid), i (buskens bär), till: () => [x, y] } ; korgen ändras när bäret landar (+1) eller äts (−1)
const KORG_IN = () => S.korgTopp(KX, G);
// hand: Olle bär bäret i handen ända ner till korgen (armen följer med) och släpper det sista biten
const FLYG = [
  { a: 18.6, b: 19.8, i: 4, till: KORG_IN, hand: 'olle' },                                     // 04 Olle plockar det första
  { a: 22.9, b: 23.5, i: 6, till: () => S.punkt('olle', [511, 470]) },                          // 05 Olle äter ett (munnen blir blå)
  { a: 68.3, b: 69.3, i: 0, till: KORG_IN, hand: 'olle' }, { a: 69.6, b: 70.3, i: 3, till: KORG_IN }, { a: 70.9, b: 71.9, i: 2, till: KORG_IN, hand: 'olle' },   // 14 ett, två, tre
];
// Olles plock: armen drar sig lite bakåt (förväntan), sträcker sig mot bäret vid t0, och bär det sedan ner till korgen
const plock = (tl, t0) => { const ut = del(t0 - 0.55, t0, tl), ner = del(t0 + 0.05, t0 + 0.8, tl), vand = ut * (1 - del(t0 + 0.6, t0 + 1.2, tl));
  return { arm: 92 * ut * (1 - ner) - 14 * bump(t0 - 1.0, t0 - 0.45, tl), vand }; };
const BITAR = [87.6, 89.0, 90.4];                     // 18 björnen äter ur korgen: tre lugna tuggor, två bär per tugga
const ATER = BITAR.flatMap(a => [a, a]);
const MOR_BAR = [1, 5, 7];                            // 26 mor har plockat en näve (borta från busken vid klippet 117.3)
const korgN = t => 2 + FLYG.filter(f => f.till === KORG_IN && t >= f.b).length - ATER.filter(a => t >= a).length;
const borta = t => [...FLYG.filter(f => t >= f.a).map(f => f.i), ...(t >= 117.3 ? MOR_BAR : [])];
const bagBana = (p0, p1, u, h = 120) => [lerp(p0[0], p1[0], mjuk(u)), lerp(p0[1], p1[1], u) - h * Math.sin(Math.PI * u)];

// --- Hjälp ------------------------------------------------------------------------------------------------------------------
// ett hopp från a till b (scenens x, fot), u 0–1; bak: bakom busken/stenen före/efter toppen
const hoppa = (a, b, u, h = 90) => ({ pos: [lerp(a[0], b[0], mjuk(u)), lerp(a[1], b[1], u) + hopp(u, h)], luft: u > 0 && u < 1 });
const sk = (u, k = 0.08) => ({ strack: -k * bump(0, 0.18, u) + 0.04 * bump(0.18, 0.6, u) });   // huk före hoppet, sträck i luften
// björnen går (inte hoppar): lugna kliv med mjuk in- och uttakt, fötterna glider längs marken/ner bakom busken
// ned: bakom busken kliver han först ner till marken (första delen av sträckan) och går sedan vidare, så att han aldrig hoppar ner
const garBort = (a, b, u, tl, rikt, ned = 1) => { const amp = mjuk(kl(Math.min(u, 1 - u) / 0.25)), [, pw] = S.gaPose('bjorn', tl, rikt, amp);
  return { pos: [lerp(a[0], b[0], mjuk(u)), lerp(a[1], b[1], mjuk(kl(u / ned)))], pw }; };
// björnen från stenen till Olle (13–14, sångtid): reser sig bakom stenen, går ut åt höger bakom den och fram till sin plats
const BJ_UPP = [64.1, 64.9], BJ_GA = [65.4, 69.1];
function bjornFranSten(ts) {
  if (ts < BJ_GA[0]) { const upp = del(BJ_UPP[0], BJ_UPP[1], ts);
    return { bak: true, klipp: STENKLIPP, pos: [SX + 20, lerp(G + 165, G, upp)], f: ANS('bjorn', 'skrattar', { titt: [10, 0] }), p: POS('bjorn', { luta: 3 * upp, rikt: 0.5 }) }; }
  const u = kl((ts - BJ_GA[0]) / (BJ_GA[1] - BJ_GA[0])), g = garBort([SX + 20, G], [BX, G], u, ts, 1);
  return { bak: g.pos[0] < STEN_FRI, pos: g.pos, f: S.R.bjorn.blanda(ANS('bjorn', 'jatteglad'), ANS('bjorn', 'glad', { titt: [-6, 2] }), del(0.5, 1, u)), p: g.pw };
}
const olleVila = (o = {}) => ({ pos: [OX, G], f: ANS('olle', 'glad'), p: POS('olle'), ...o });
// Olle håller för ögonen (11): båda händerna framför ansiktet, ögonen hårt stängda och ett leende; armarna en aning i otakt
const forOgonen = (k, k2 = k) => { const m = (k + k2) / 2; return { fram: [k, k2], hand: m, klapp: 95 * m, armar: [-125 * k, -125 * k2], armY: -183 * m }; };
const BLUNDA = () => ANS('olle', 'fnissig', { glad: [1, 1] });

// --- Ett läge per bild (sångtid) -------------------------------------------------------------------------------------------
// st = { plats: 'papper' | 'skog', kam, figs: { olle|mor|bjorn: { pos, f, p, bak, bla, nos } }, korg: { hand: 'olle' } | { pos }, gung, stenGung, iris }
const B = [
  ['01', 0.0, tl => ({ plats: 'papper', papper: { kontur: tl, inn: tl < S.RIT.in ? tl : null, vanta: tl - 7.0, fyll: del(10.0, 10.9, tl), efter: tl - 10.9 } })],
  ['02', 12.8, (tl, d) => ({ plats: 'papper', papper: { kontur: 99, fyll: 1, efter: 2, kam: [lerp(1, 3.2, mjuk(tl / d) ** 1.6), S.BB.x, S.BB.y], vit: del(d - 0.55, d, tl) } })],
  // 03 Olle går in från vänster med korgen i högra handen och stannar vid busken (lugn gång, mjuk inbromsning)
  // (startar en bit in i bild bakom det vita, så att sträckan blir kortare och gången lugnare)
  ['03', 14.3, tl => { const u = kl(tl / 2.6), stopp = del(2.25, 2.7, tl), [fw, pw] = S.gaPose('olle', tl, 1, 1 - stopp);
    return { kam: K.HEL, vitIn: 1 - del(0, 0.45, tl), korg: { hand: 'olle' },
      figs: { olle: { pos: [lerp(260, OX, 1 - (1 - u) ** 1.4), G], f: S.R.olle.blanda(fw, ANS('olle', 'glad', { titt: [6, -4] }), stopp), p: pw } } }; }],
  // 04 ställer ner korgen, sträcker sig efter ett bär på busken och bär det i handen ner i korgen
  ['04', 17.0, tl => { const ner = del(0, 0.5, tl), { arm, vand } = plock(tl, 1.6);
    return { kam: K.HEL, korg: ner < 1 ? { hand: 'olle', ner: [KX, G], k: ner } : { pos: [KX, G] },
      figs: { olle: olleVila({ f: ANS('olle', 'glad', { titt: [10 * vand + 4, -6 * vand + 6 * del(1.8, 2.3, tl) * (1 - del(2.8, 3.3, tl))] }), p: POS('olle', { upp: -0.4 * ner * (1 - vand) + 0.3 * vand - 0.4 * del(1.8, 2.3, tl) * (1 - del(2.8, 3.3, tl)), rikt: 0.6 * vand, bada: vand, armar: [0, arm], luta: vand, boj: 2.5 * vand }) }) } }; }],
  // 05 närbild: Olle ler mot oss, plockar ett bär och äter det, munnen blir blå; skrattar
  ['05', 21.3, tl => { const na = del(1.0, 1.5, tl) * (1 - del(1.9, 2.4, tl)), mums = bump(1.6, 3.2, tl), sk2 = del(4.3, 4.8, tl);
    return { kam: KAM.NAR_OLLE, korg: { pos: [KX, G] },
      figs: { olle: olleVila({ bla: del(2.2, 2.8, tl), f: S.R.olle.blanda(S.R.olle.blanda(ANS('olle', 'glad'), ANS('olle', 'mums'), mums), ANS('olle', 'skrattar'), sk2),
        p: POS('olle', { rikt: 0.5 * na, bada: na, armar: [0, 80 * na], upp: 0.2 * na + nick(tl, 3.4) }) }) } }; }],
  // 06 Olle står ensam och tittar åt båda hållen
  ['06', 29.9, tl => { const r = -0.7 * del(0.3, 1.0, tl) + 1.4 * del(1.8, 2.5, tl) - 0.7 * del(3.4, 4.0, tl);
    return { kam: K.HEL, korg: { pos: [KX, G] }, figs: { olle: olleVila({ bla: 1, f: ANS('olle', 'ledsen', { titt: [26 * r, 0] }), p: POS('olle', { rikt: r }) }) } }; }],
  // 07 busken prasslar och björnen glider mjukt upp bakom den, först helt dold, sedan två runda öron
  ['07', 34.5, tl => { const upp = -0.75 + 0.9 * del(0.4, 3.2, tl);
    return { kam: K.HEL, korg: { pos: [KX, G] }, gung: bump(0.4, 1.6, tl) + 0.6 * bump(2.6, 3.6, tl),
      figs: { bjorn: { bak: true, pos: [BBAK, bakFot(upp)], f: ANS('bjorn', 'nyfiken'), p: POS('bjorn') },
        olle: olleVila({ bla: 1, f: ANS('olle', 'forvanad', { titt: [12, -4] }), p: POS('olle', { rikt: 0.4 * del(0.6, 1.2, tl) }) }) } }; }],
  // 08 tvåbild: busken gungar, öronen vickar, Olle lutar huvudet
  ['08', 39.2, tl => ({ kam: KAM.TVA8, korg: { pos: [KX, G] }, gung: 0.7 * bump(0.3, 1.5, tl) + 0.7 * bump(2.2, 3.4, tl),
    figs: { bjorn: { bak: true, pos: [BBAK + 10 * Math.sin(tl * 2.2), bakFot(0.15 + 0.15 * del(0.4, 2.0, tl) + 0.04 * Math.sin(tl * 3.1) * del(0, 1, tl))], f: ANS('bjorn', 'busig'), p: POS('bjorn', { oron: [6 * Math.sin(tl * 5), -6 * Math.sin(tl * 5)] }) },
      olle: olleVila({ bla: 1, f: ANS('olle', 'nyfiken', { titt: [12, -8] }), p: POS('olle', { rikt: 0.4, luta: -3, boj: -4 }) }) } })],
  // 09 björnen reser sig lugnt bakom busken, kliver ner och går bakom den till högra kanten, och kommer runt kanten fram till Olle
  ['09', 43.2, tl => { const upp = 0.3 + 0.35 * del(0.1, 1.6, tl), u1 = kl((tl - 1.7) / 1.1), u2 = kl((tl - 2.8) / 1.3);
    const g = tl < 2.8 ? garBort([BBAK, bakFot(0.65)], [XR, G], u1, tl, 1, 0.5) : garBort([XR, G], [BX0, G], u2, tl, -1), runt = del(0.05, 0.85, u2);
    return { kam: K.HEL, korg: { pos: [KX, G] }, gung: bump(0.1, 1.5, tl) + 0.6 * bump(1.8, 3.0, tl),
      figs: { olle: olleVila({ bla: 1, f: S.R.olle.blanda(ANS('olle', 'forvanad', { titt: [12, -8] }), ANS('olle', 'skrattar', { titt: [10, -6] }), del(3.0, 3.5, tl)), p: POS('olle', { rikt: 0.4 }) }),
        bjorn: tl < 1.7 ? { bak: true, pos: [lerp(BBAK + 6, BBAK, del(0, 0.6, tl)), bakFot(upp)], f: ANS('bjorn', 'glad'), p: POS('bjorn') }
          : { bak: runt < 1, runt, pos: g.pos, f: ANS('bjorn', 'glad', { titt: [tl < 2.8 ? 8 : -8, 2] }), p: g.pw } } }; }],
  // 10 tvåbild: Olle vinkar, björnen vinkar tillbaka; "god dag" (rad 0:47.6) med en nick
  ['10', 47.6, tl => { const vo = del(0.2, 0.6, tl) * (1 - del(3.4, 4.0, tl)), vb = del(0.9, 1.3, tl) * (1 - del(3.6, 4.2, tl));
    return { kam: KAM.TVA10, korg: { pos: [KX, G] },
      figs: { olle: olleVila({ bla: 1, f: ANS('olle', 'jatteglad', { titt: [10, -6] }), p: POS('olle', { ...vink(tl, vo, 1), rikt: 0.3, upp: nick(tl, 2.9) }) }),
        bjorn: { pos: [BX0, G], f: ANS('bjorn', 'glad', { titt: [-10, 4] }), p: POS('bjorn', { ...vink(tl, vb, -1), rikt: -0.3, upp: nick(tl, 3.0) }) } } }; }],
  // 11 mellanspel 1: björnen går lugnt bort till stenen och gömmer sig; Olle håller för ögonen
  // (han går bakom stenen först när vänsterkanten har passerat stenens högerkant, så att lagerbytet inte syns)
  ['11', 52.0, tl => { const u = kl((tl - 1.1) / 3.2), g = garBort([BX0, G], [SX, G], u, tl, -1);
    const sjunk = del(4.45, 5.2, tl), forO = del(1.6, 2.15, tl), forO2 = del(1.78, 2.33, tl), framme = tl < 1.1;
    const bj = framme ? { pos: [BX0, G], f: ANS('bjorn', 'fnissig'), p: POS('bjorn', { rikt: -0.6 * del(0.5, 1.1, tl) }) }
      : tl < 4.3 ? { bak: g.pos[0] < STEN_FRI, pos: g.pos, f: ANS('bjorn', 'busig', { titt: [-10, 0] }), p: g.pw }
      : { bak: true, klipp: STENKLIPP, pos: [SX, G + 560 * sjunk], f: ANS('bjorn', 'busig', { titt: [10, 0] }), p: POS('bjorn', { rikt: 0.3, strack: -0.06 * sjunk }) };
    return { kam: K.HEL, korg: { pos: [KX, G] }, stenGung: bump(4.1, 5.1, tl) + bump(4.5, 5.7, tl), figs: { olle: olleVila({ bla: 1, f: S.R.olle.blanda(ANS('olle', 'skrattar', { titt: [-10, 0] }), ANS('olle', 'forvanad', { titt: [-10, 0] }), forO), p: POS('olle', { rikt: -0.4 * (1 - forO) }) }), bjorn: bj } }; }],
  // 12 Olle tar bort händerna, tittar på oss och väntar (Var är björnen? paus 4,5 s) — björnens öron tittar
  // upp över stenen och vickar, så att barnen hinner gissa var han är innan Olle ser honom
  ['12', 58.0, tl => { const k = 1 - del(0.1, 0.65, tl), k2 = 1 - del(0.25, 0.8, tl), l = 0.4 * Math.sin(2 * Math.PI * Math.max(0, tl - 2.4) / 3.2) * del(2.2, 2.8, tl);
    const kik = del(1.1, 2.4, tl);
    return { kam: KAM.GISSA, korg: { pos: [KX, G] },
      figs: { olle: olleVila({ bla: 1, f: S.R.olle.blanda(ANS('olle', 'forvanad', { titt: [-10, 0] }), ANS('olle', 'nyfiken', { titt: [24 * l, 0] }), 1 - k), p: POS('olle', { rikt: l, luta: 2 * l }) }),
        bjorn: { bak: true, klipp: STENKLIPP, pos: [SX + 20, lerp(G + 560, G + 165, mjuk(kik))], f: ANS('bjorn', 'busig', { titt: [12, 0] }), p: POS('bjorn', { oron: [5 * Math.sin(tl * 4.2) * kik, -5 * Math.sin(tl * 4.2) * kik] }) } } }; }],
  // 13 björnen reser sig bakom stenen; glatt skrik och fniss; sedan går han lugnt ut bakom stenen och tillbaka till Olle (in i 14)
  ['13', 64.0, tl => { const v = del(0.5, 0.9, tl);
    return { kam: K.HEL, korg: { pos: [KX, G] }, stenGung: bump(0, 0.9, tl),
      figs: { olle: olleVila({ bla: 1, f: ANS('olle', 'skrattar', { titt: [lerp(-12, 10, del(2.6, 3.8, tl)), 0] }), p: POS('olle', { rikt: lerp(-0.5, 0.4, del(2.6, 3.8, tl)), armar: [70 * v * (1 - del(2.0, 2.6, tl)), 0] }) }), bjorn: bjornFranSten(64.0 + tl) } }; }],
  // 14 de plockar tillsammans: ett (Olle), två (björnen), tre (Olle); Olle bär sina bär i handen ner i korgen
  ['14', 68.0, tl => { const p1 = plock(tl, 0.3), p3 = plock(tl, 2.9), nB = bump(1.3, 2.4, tl), arm = p1.arm + p3.arm, vand = Math.max(p1.vand, p3.vand);
    const bj = 68.0 + tl < BJ_GA[1] ? bjornFranSten(68.0 + tl)
      : { pos: [BX, G], f: ANS('bjorn', 'glad', { titt: [-10 * nB + 8 * (1 - nB) - 16 * del(2.2, 2.8, tl), -4] }), p: POS('bjorn', { rikt: -0.6 * nB, bada: nB, armar: [80 * nB, 0], luta: -2 * nB }) };
    return { kam: K.HEL, korg: { pos: [KX, G] },
      figs: { olle: olleVila({ bla: 1, f: ANS('olle', 'jatteglad', { titt: [10, -4] }), p: POS('olle', { rikt: 0.6 * vand, bada: vand, armar: [0, arm], luta: vand, boj: 2.5 * vand }) }), bjorn: bj } }; }],
  // 15 närbild björnen: luktar på korgen, mmm, slickar sig om nosen
  ['15', 74.0, tl => { const ner = del(0.2, 0.8, tl) * (1 - del(1.8, 2.4, tl)), sl = bump(2.5, 4.0, tl);
    return { kam: KAM.NAR_BJ, korg: { pos: [KX, G] },
      figs: { olle: olleVila({ bla: 1, f: ANS('olle', 'glad', { titt: [10, 2] }), p: POS('olle', { rikt: 0.3 }) }),
        bjorn: { pos: [BX, G], f: S.R.bjorn.blanda(S.R.bjorn.blanda(ANS('bjorn', 'nyfiken', { titt: [-12, 10] }), ANS('bjorn', 'drommer'), del(1.0, 1.4, tl) * (1 - del(2.2, 2.5, tl))), ANS('bjorn', 'mums'), sl),
          p: POS('bjorn', { rikt: -0.6 * ner, upp: -0.6 * ner, boj: -3 * ner, luta: -3 * ner }) } } }; }],
  // 16 tvåbild: Olle klappar björnen försiktigt på magen; björnen fnissar
  ['16', 78.5, tl => { const na = del(0.2, 0.8, tl) * (1 - del(3.2, 3.8, tl)), kl2 = na * 6 * Math.sin(2 * Math.PI * 1.6 * tl);
    return { kam: KAM.TVA, korg: { pos: [KX, G] },
      figs: { olle: olleVila({ bla: 1, f: ANS('olle', 'glad', { titt: [10, 0] }), p: POS('olle', { rikt: 0.6 * na, bada: na, armar: [0, 62 * na + kl2], luta: na }) }),
        bjorn: { pos: [BX, G], f: S.R.bjorn.blanda(ANS('bjorn', 'glad'), ANS('bjorn', 'fnissig'), del(0.9, 1.3, tl) * (1 - del(3.0, 3.5, tl))), p: POS('bjorn', { luta: 3 * Math.sin(tl * 6) * na }) } } }; }],
  // 17 tvåbild: Olle tar upp korgen och räcker fram den
  ['17', 82.4, tl => { const bo = bump(0.2, 1.2, tl), ut = del(1.1, 1.8, tl), upp = del(0.5, 0.8, tl);
    return { kam: KAM.TVA, korg: upp < 1 ? { hand: 'olle', ner: [KX, G], k: 1 - upp } : { hand: 'olle' },

  const r = B[i], tl = t - r.s, st = { plats: 'skog', ...r.fn(tl, r.d) };

  if (i > 0 && st.figs) { const fr = B[i - 1], f0 = fr.fn(fr.d, fr.d), gb = del(0, 0.45, tl);
    if (f0.figs && gb < 1) for (const n in st.figs) { const a = f0.figs[n], b = st.figs[n]; if (!a) continue;
      b.f = S.R[n].blanda(a.f, b.f, gb); b.p = S.R[n].blandaPose(a.p, b.p, gb); } }
  return { ...st, id: r.id, tl };
}

function rita(t) {
  const st = lage(t);

  else ritaSkog(st, t);
  S.slut(t, DURATION);
}
const ORDNING = ['olle', 'mor', 'bjorn'];   // mor framför Olle när hon står bredvid honom (25–28)
function ritaSkog(st, t) {
  S.kamera(st.kam);
  S.skog({ gung: st.gung || 0, stenGung: st.stenGung || 0, borta: borta(t) });
  for (const n of (st.id === '11' ? ['bjorn', 'olle', 'mor'] : ORDNING)) { const o = st.figs?.[n]; if (!o) continue;
    S.figur(n, o.pos, o.f, o.p, { bak: !!o.bak, bla: o.bla || 0, nos: o.nos || 0, klipp: o.klipp || 0 });
    // runt busken: kopian framför busken till höger om en kant som sveper från högra till vänstra sidan (runt 0 → 1)
    if (o.bak && o.runt > 0) S.runtBusken(n, o.pos[0] + (HALV + 90) - 2 * (HALV + 90) * mjuk(o.runt));
    if ((!o.bak || o.runt > 0.5) && o.pos[1] <= G + 1) lagg('skugga', S.markskugga(o.pos[0], G, n === 'olle' ? 300 : 380, G - o.pos[1])); }
  // korgen: på marken, i Olles högra hand, eller på väg ner/upp mellan dem (k 0 = handen, 1 = marken)
  const n = korgN(t), k = st.korg;
  let korgPos = null;
  if (k) { let [x, y] = k.pos || [0, 0];
    if (k.hand) { const [hx, hy] = S.hand(k.hand, 'r'), hp = [hx, hy + KORG_H * 0.95];
      [x, y] = k.ner ? [lerp(hp[0], k.ner[0], mjuk(k.k)), lerp(hp[1], k.ner[1], mjuk(k.k))] : hp; }
    if (!k.hand || k.k >= 1) lagg('skugga', S.markskugga(x, G, 150, G - y));
    lagg('framsak', S.korgSvg(x, y, KORG_H, n)); korgPos = [x, y]; }

  if (st.ater && korgPos) { const mun = S.punkt('bjorn', [512, 476]), [ox, oy] = S.korgTopp(...korgPos);

      [[-12, 0], [12, -4]].forEach(([dx, dy], j) => { const p = bagBana([ox + dx, oy + dy], mun, kl(u * 1.1 - 0.1 * j), 35); lagg('fram', S.bar(p[0], p[1], 13)); }); } }
  // bären som plockas: i Olles hand ner till korgen och släpps sista biten, eller i en båge (björnens, och det Olle äter)
  for (const f of FLYG) { const u = (t - f.a) / (f.b - f.a); if (u <= 0 || u >= 1) continue;
    const p = !f.hand ? bagBana(S.buskBar(f.i), f.till(), u)
      : u < 0.75 ? S.hand(f.hand, 'r') : bagBana(S.hand(f.hand, 'r'), f.till(), (u - 0.75) / 0.25, 12);
    lagg('fram', S.bar(p[0], p[1], 18)); }
  // mors näve blåbär (27): i handen, sedan in i björnens mun
  // Olles händer över ögonen: hudfärgade handflator med en tunn mörkare kant (ingen vit kant, den såg ut som streck i ansiktet)
  if (st.ogon) ['l', 'r'].forEach((sida, i) => { const k = st.ogon[i]; if (k < 0.02) return; const h = S.hand('olle', sida);
    const x = h[0].toFixed(1), y = (h[1] - 15).toFixed(1), rx = (25 * k).toFixed(1), ry = (33 * k).toFixed(1);
    lagg('fram', `<ellipse cx="${x}" cy="${(h[1] - 11).toFixed(1)}" rx="${rx}" ry="${ry}" fill="#B8683F" opacity="${(0.28 * k).toFixed(2)}"/><ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#F1B38A" stroke="#E3A877" stroke-width="1.5" opacity="${k.toFixed(2)}"/><path d="M${(h[1]*0+(+x)-rx*0.55).toFixed(1)} ${(+y-ry*0.15).toFixed(1)}q${(rx*0.1).toFixed(1)} ${(-ry*0.45).toFixed(1)} 0 ${(-ry*0.8).toFixed(1)}M${(+x).toFixed(1)} ${(+y-ry*0.2).toFixed(1)}q0 ${(-ry*0.45).toFixed(1)} 0 ${(-ry*0.9).toFixed(1)}M${(+x+rx*0.55).toFixed(1)} ${(+y-ry*0.15).toFixed(1)}q${(-rx*0.1).toFixed(1)} ${(-ry*0.45).toFixed(1)} 0 ${(-ry*0.8).toFixed(1)}" fill="none" stroke="#E3A877" stroke-width="2" stroke-linecap="round" opacity="${(0.9*k).toFixed(2)}"/>`); });
  if (st.morBar != null) { const h = S.hand('mor', 'r'), mun = S.punkt('bjorn', [512, 476]);
    [[-14, -10], [10, -16], [0, 4]].forEach(([dx, dy], j) => { const p0 = [h[0] + dx, h[1] + dy - 10];
      const p = st.morBar === 'hand' ? p0 : bagBana(p0, mun, kl(st.morBar * 1.2 - 0.1 * j), 150);
      if (st.morBar === 'hand' || st.morBar * 1.2 - 0.1 * j < 1) lagg('fram', S.bar(p[0], p[1], 15)); }); }
  if (st.vitIn) lagg('ram', `<rect x="-50" y="-50" width="2020" height="1180" fill="#FFFFFF" opacity="${st.vitIn.toFixed(3)}"/>`);
  if (st.iris !== undefined && st.iris > 0) S.kritiris(S.irisR(st.iris, 470), S.skarm([1180, 690]), t);
