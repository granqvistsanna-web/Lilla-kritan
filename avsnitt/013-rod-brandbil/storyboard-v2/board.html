<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>013 Röda sången – bildstoryboard v2</title>
<style>
  body { margin:0; background:#222; display:grid; place-items:center; min-height:100vh; }
  svg { width:min(100vw, 1280px); height:auto; display:block; }
</style>
</head>
<body>
<!-- Bildstoryboarden för 013 Röda sången i art direction v2, med kaninen (premium-riggen) och den röda v2-bilen.
     window.render(i) ritar bild nummer i ur BILDER. bygg.mjs renderar en PNG per bild med stills.mjs.
     Figurmotorn (UTTRYCK, POSER, figur, rita, ansikte, pose) hämtas ur premium/uttryck.html och skrivs till
     kanel-motor.js av bygg.mjs, så att den aldrig skrivs av för hand och aldrig hinner glida isär.
     Brandbilen kör alltid åt HÖGER (→). v2-bilen i konsten är vänd åt vänster, så hela scenen speglas i #spegel tills den nya brandbilen (rekvisita/brandbil-rod.md) finns. Den vänds aldrig i bild.
     Stegen och blåljuset finns inte som bild och ritas i kod, som rekvisita/brandbil-rod.md beskriver dem. -->
<script src="kanel-motor.js"></script>
<script src="scen-kit.js"></script>
<script>
// --- Bilderna ---------------------------------------------------------------------------------------------------
// En post per bild: id (som i storyboard.md) och en funktion som ställer upp scenen.
const BILDER = [
  ['00', () => { titelkort(); bil({ x: 520, y: 70, gose: false }); kanin({ iBil: true, uttryck: 'glad', rikt: -0.5 }); kamera(1); }],

  ['01a', () => { papper(); ritat_apple({}); kritan(1300, 330); }],
  ['01b', () => { papper(); ritat_apple({ skaft: 1, blad: 1 }); kritan(1300, 330); }],
  ['01c', () => { papper(); ritat_apple({ skaft: 1, blad: 1, gung: 1 }); }],

  ['02a', () => { korscen(); sak('bakom', BETTAN, 700, 905, 380); bil({ lampa: 1 }); kanin({ iBil: true, uttryck: 'jatteglad', rikt: -1 }); fart(); kamera(1.2, 1000, 760); }],
  ['02b', () => { korscen(); bil({ lampa: 1 }); kanin({ iBil: true, uttryck: 'nyfiken', pose: 'upp', rikt: -0.2 }); ballong(1430, 330); kamera(1.05, 960, 620); }],
  ['03', () => { korscen(); bil({ lampa: 1 }); kanin({ iBil: true, uttryck: 'blinkar', pose: { armar: [0, 34], luta: 3 }, rikt: -0.2 }); narbild(); }],

  // Refrängen: samma backe, samma storlek på brandbilen (KB) och kameran följer den. Uppför (vänster i bild), sicksack
  // och studs på den platta toppen, nerför (höger i bild). Träden och jätteäpplena står på backens kant, som bilen.
  // Refrängen (tagning 4): "Röd, röd, brandbil! (Iii-ooo!)" är alltid samma helbild av hela banan med blåljuset, och brandbilen
  // har kommit en bit längre varje gång; varje rörelserad däremellan är en närbild. Uppför den vänstra kullen, tuta på toppen,
  // studsa på äpplena i svackan, nerför den högra kullen. (Kodens x är speglat: den vänstra kullen i bild ligger på x ca 1460.)
  ['04a', () => { angscen({ hopp: 70 }); bil({ x: -300, lampa: 1, blaljus: 1 }); kanin({ iBil: true, uttryck: 'jatteglad', pose: 'hurra', rikt: -0.6 }); kamera(1); }],
  ['04b', () => { angscen({ hopp: 40 }); bil({ x: -100, lampa: 1, lut: -8, y: -20 }); kanin({ iBil: true, uttryck: 'nyfiken', rikt: -0.7 }); kamera(1.15, 960, 640); }],
  ['04c', () => { angscen({ t: 0.35, hopp: 70 }); bil({ x: -50, lampa: 1, blaljus: 1 }); kanin({ iBil: true, uttryck: 'jatteglad', rikt: -0.6 }); kamera(1); }],
  ['04d', () => { angscen({ hopp: 25, mun: 'o' }); bil({ lampa: 1 }); kanin({ iBil: true, uttryck: 'fnissig', pose: { armar: [0, 46] }, rikt: -0.3 }); kamera(1.8, 950, 360); }],
  ['04e', () => { angscen({ t: 0.7, hopp: 70 }); bil({ lampa: 1, blaljus: 1 }); kanin({ iBil: true, uttryck: 'jatteglad', rikt: -0.6 }); kamera(1); }],
  ['04f', () => { angscen({ hopp: 150 }); bil({ lampa: 1, y: -110 }); kanin({ iBil: true, uttryck: 'jatteglad', pose: 'hurra', rikt: -0.4 }); kamera(1); }],
  ['04g', () => { angscen({ t: 0.2, hopp: 70 }); bil({ lampa: 1, blaljus: 1 }); kanin({ iBil: true, uttryck: 'jatteglad', rikt: -0.6 }); kamera(1); }],
  ['04h', () => { angscen({ hopp: 30, mun: 'o' }); bil({ x: 100, lampa: 1, lut: 8 }); kanin({ iBil: true, uttryck: 'jatteglad', pose: 'hurra', rikt: -0.5 }); kamera(1.15, 960, 640); }],
  ['04i', () => { angscen({ hopp: 70 }); bil({ x: 150, lampa: 1, blaljus: 1 }); kanin({ iBil: true, uttryck: 'jatteglad', pose: 'hurra', rikt: -0.6 }); appelsvep(1480); kamera(1); }],

  ['08a', () => { korscen(); bil({}); kanin({ iBil: true, uttryck: 'nyfiken', rikt: -0.6 }); chilibil(90); kamera(1, 960, 700); }],
  ['08b', () => { korscen(); bil({}); kanin({ iBil: true, uttryck: 'nyfiken', rikt: -0.4 }); chilibil(250); sak('pynt', CHILI, 520, 600, 150, 'rotate(-30 520 525)'); kamera(1.25, 1200, 600); }],
  ['08c', () => { korscen(); bil({}); kanin({ iBil: true, uttryck: { ...blanda('neutral', 'forvanad', 1), mun: [16, 14, 1, 458] }, rikt: 0 }); sak('pynt', CHILI, 1120, 520, 110, 'rotate(-60 1120 465)'); narbild(); }],

  // Mellanspelet, 8 takter utan sång: bilden berättar. Takt 1–2 röd i ansiktet, 3–4 fläktar, 5–6 (musiken blir glad) musen tar
  // slangen, 7–8 det regnar på alla.
  ['09a', () => { korscen(); bil({}); kanin({ iBil: true, uttryck: { ...blanda('neutral', 'forvanad', 1), mun: [20, 16, 1, 458] }, tunga: 1, rikt: 0 }); rosiga(); narbild(); }],
  ['09b', () => { korscen(); bil({}); kanin({ iBil: true, uttryck: { ...blanda('neutral', 'tanker', 1), mun: [14, 12, 1, 458] }, tunga: 0.8, pose: { armar: [60, 60] }, rikt: 0 }); rosiga(); chilibil(250); kamera(1.15, 1150, 640); }],
  ['09c', () => { korscen(); bil({}); kanin({ iBil: true, uttryck: 'jatteglad', rikt: -0.3 }); rosiga(); mus(560, 880, 320, MUS_UPP); slang([1480, 820], [620, 860]); kamera(1, 960, 640); }],
  ['09d', () => { korscen(); bil({}); kanin({ iBil: true, uttryck: 'fnissig', pose: 'hurra', rikt: 0 }); mus(560, 880, 320, MUS_UPP); slang([1480, 820], [620, 860]); vatten([640, 800], [720, 40], -260); droppar(380, 1500, 120, 820, 26); kamera(1, 960, 560); }],

  ['10a', () => { korscen(); bil({}); kanin({ iBil: true, uttryck: 'somnig', pose: 'magen', rikt: 0 }); narbild(); }],
  ['10b', () => { korscen(); bil({}); kanin({ iBil: true, uttryck: { ...blanda('neutral', 'jatteglad', 1), mun: [20, 16, 1, 458] }, tunga: 0.7, pose: 'haller', rikt: 0 }); applet(1180, 560, 100); mus(700, 860, 320); applet(760, 830, 80); kamera(2.6, 950, 420); }],

  ['11a', () => { disco(); bil({ synlig: false }); dansare(); kamera(1); }],
  ['11b', () => { disco(); bil({ synlig: false }); dansare({ hulda: -40 }); kamera(1); }],
  ['11c', () => { disco(); bil({ synlig: false }); dansare({ hugo: 18 }); kamera(1); }],
  ['11d', () => { disco(); bil({ synlig: false }); dansare({ gurra: -110 }); kamera(1); }],
  ['11e', () => { disco(); bil({ synlig: false }); dansare({ musen: -30, musUpp: true }); kamera(1); }],
  ['11g', () => { disco(); bil({ synlig: false }); dansare({ hulda: -40, hugo: -40, gurra: -40, musen: -40 }); kamera(1); }],

  ['12a', () => { disco({ ikoner: 1 }); bil({ synlig: false }); dansare({ hulda: -30, gurra: -60 }); kamera(1); }],
  ['12b', () => { disco({ ikoner: 5 }); bil({ synlig: false }); dansare(); kamera(1); }],
  ['12c', () => { disco({ ikoner: 5 }); bil({ synlig: false }); dansare({ hulda: -30, hugo: -30, gurra: -60, musen: -30, musUpp: true }); kamera(1); }],
  ['12d', () => { disco({ ikoner: 5 }); bil({ x: -80, y: 40, blaljus: 1 }); kanin({ iBil: true, uttryck: 'blinkar', pose: { armar: [0, 56] }, rikt: 0 }); mus(1500, 870, 260); kamera(1.1, 920, 720); }],

  ['13', () => { korscen(); bil({ x: -80, lampa: 1 }); kanin({ iBil: true, uttryck: 'somnig', rikt: 0 }); kamera(1); kritiris(250, 946, 400, { glimt: 1 }); }],
];

window.BILDER = BILDER.map(([id]) => id);
function render(i) {
  i = Math.max(0, Math.min(BILDER.length - 1, Math.round(i)));
  // Kaninen flyttas mellan lagren och rensas aldrig: hennes delar är <image> och skulle följa med en rensning av #sate.
  for (const id of ['bakom', 'framfor', 'pynt', 'ram', 'gose']) $(id).innerHTML = '';
  // Bilen och kaninen göms som standard: bilderna på papperet och i discot har dem inte med.
  $('bil').setAttribute('opacity', 0); KANEL.setAttribute('opacity', 0);
  $('lampa').setAttribute('opacity', 0);
  $('duk').setAttribute('fill', GOLV);
  kamera(1);
  BILDER[i][1]();
  $('brus').setAttribute('seed', (i * 7) % 50 + 1);
}
window.render = render;
if (!window.stilla) render(+(new URLSearchParams(location.search).get('bild') || 0));
</script>
</body>
</html>
