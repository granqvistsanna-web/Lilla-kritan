<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zebran plockar undan storyboard</title>
<style>
:root { --paper:#fbfaf6; --card:#fff; --ink:#2a2620; --muted:#6e675c; --line:#e6e1d6; --rosa:#b8506a }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper:#1d1c22; --card:#26252c; --ink:#f1ede4; --muted:#a8a196; --line:#3a3842; --rosa:#f2a7b8; color-scheme:dark } }
:root[data-theme="dark"] { --paper:#1d1c22; --card:#26252c; --ink:#f1ede4; --muted:#a8a196; --line:#3a3842; --rosa:#f2a7b8; color-scheme:dark }
* { box-sizing:border-box }
body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.5 system-ui,sans-serif }
.wrap { max-width:1240px; margin:0 auto; padding:40px 16px 72px }
h1 { font-size:clamp(30px,6vw,52px); margin:0 } h1 span { color:var(--rosa) }
.lede { color:var(--muted); max-width:72ch }
.frames { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; margin-top:24px }
.frame { margin:0; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden }
.frame img { width:100%; height:auto; display:block }
figcaption { padding:12px 14px 14px; display:grid; gap:6px; font-size:14px } figcaption p { margin:0 }
.t { font:500 12px ui-monospace,monospace; color:var(--muted) }
.said { border-left:3px solid var(--rosa); padding-left:10px }
.ans { color:var(--muted); font-size:13px }
</style></head><body><div class="wrap">
<h1>Zebran plockar undan <span>storyboard</span></h1>
<p class="lede">Avsnitt 027, 3:00.9 med bilderbok-introt. En stillbild per rad i <code>storyboard.md</code>, tagen ur kodscenen. Sovrummet, sängen och täcket är platshållare i kod tills bilderna finns. 27 bilder.</p>
<div class="frames"><figure class="frame"><img src="frames/00.jpg" alt="Bild 00" loading="lazy"><figcaption>
  <div class="t">00 · 0:00.0 · 3.3 s · Intro</div><div class="said">–</div>
  <p>Det gemensamma bilderbok-introt ("bilderbok!" på papperskortet), tonar till samma papper som scenen</p><p class="ans">Ljud: introts jingel · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/01a.jpg" alt="Bild 01a" loading="lazy"><figcaption>
  <div class="t">01a · 0:03.3 · 6.0 s · Papperet, helbild</div><div class="said"><i>"Kritan ritar …"</i> (0:06.2)</div>
  <p>Kritan kommer in och ritar zebrans kontur i lugna drag (7 s): kroppen med manen, öronen, mulen</p><p class="ans">Ljud: kritan ritar, skogsljud under · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/01b.jpg" alt="Bild 01b" loading="lazy"><figcaption>
  <div class="t">01b · 0:09.3 · 7.5 s · Papperet, helbild</div><div class="said"><i>"Hm … vad blir det nu?"</i> (0:09.3)</div>
  <p>Konturen ritas klar (armarna ett drag var, benen, svansen, leendet, ränderna sist), sedan väntar kritan bredvid och vajar: barnet gissar</p><p class="ans">Ljud: kritan ritar · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/01c.jpg" alt="Bild 01c" loading="lazy"><figcaption>
  <div class="t">01c · 0:16.8 · 4.4 s · Papperet, helbild → zoom in</div><div class="said"><i>"Oj! En zebra!"</i> (0:17.7)</div>
  <p>Den riktiga zebran fylls i inifrån. Sista 0,8 s: zoom in i teckningen</p><p class="ans">Ljud: – · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/1.jpg" alt="Bild 1" loading="lazy"><figcaption>
  <div class="t">1 · 0:21.2 · 5.6 s · Sovrummet på dagen, helbild</div><div class="said"><i>"Hej, zebran! Hej, hej!"</i> (0:22.8)</div>
  <p>Zebran går in från höger bakom sängen (riggens gång), stannar mitt bakom sängen och vinkar. Leksakerna ligger på golvet. <b>Hej med vinkning</b></p><p class="ans">Ljud: <code>trav</code>, glatt gnägg · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/2.jpg" alt="Bild 2" loading="lazy"><figcaption>
  <div class="t">2 · 0:26.8 · 5.8 s · Golvet, helbild</div><div class="said"><i>"Oj, oj, oj! Vad mycket leksaker!"</i> (0:27.1)</div>
  <p>Nallen, bilen, ankan, båten och hinken ligger huller om buller framför sängen. Zebran tittar ner på dem</p><p class="ans">Ljud: nyfiket gnägg · Ansikte: fnissig</p></figcaption></figure>
<figure class="frame"><img src="frames/3.jpg" alt="Bild 3" loading="lazy"><figcaption>
  <div class="t">3 · 0:32.6 · 5.5 s · Halvbild</div><div class="said"><i>"Nu ska du väl plocka undan?"</i> (0:32.9)</div>
  <p>Zebran skakar på huvudet: ägget lutar ±6° tre gånger</p><p class="ans">Ljud: trumpet frust · Ansikte: trumpen</p></figcaption></figure>
<figure class="frame"><img src="frames/4.jpg" alt="Bild 4" loading="lazy"><figcaption>
  <div class="t">4 · 0:38.1 · 9.0 s · Närbild zebran</div><div class="said"><i>"Oj då. Zebran vill visst inte plocka undan."</i> (0:38.4) … <i>"Hm … vad gör vi nu?"</i> (0:43.0)</div>
  <p>Zebran vänder bort huvudet (riktningsposen åt vänster), öronen faller. Paus 1 s mellan replikerna</p><p class="ans">Ljud: trumpet frust · Ansikte: trumpen, tittar bort</p></figcaption></figure>
<figure class="frame"><img src="frames/5a.jpg" alt="Bild 5a" loading="lazy"><figcaption>
  <div class="t">5a · 0:47.1 · 8.7 s · Halvbild → närbild golvet bredvid sängen</div><div class="said"><i>"Titta! Kritan ritar något."</i> (0:48.5)</div>
  <p>Kritan kommer in och ritar korgens kontur på golvet till vänster om sängen (4 s), väntar sedan bredvid och vajar: gisspaus 3 s</p><p class="ans">Ljud: kritan ritar · Ansikte: nyfiken</p></figcaption></figure>
<figure class="frame"><img src="frames/5b.jpg" alt="Bild 5b" loading="lazy"><figcaption>
  <div class="t">5b · 0:55.8 · 5.0 s · Samma → golvet och korgen</div><div class="said"><i>"En korg! Varsågod, zebran."</i> (0:56.3)</div>
  <p>Den riktiga korgen fylls i inifrån. <i>Varsågod</i></p><p class="ans">Ljud: glitter · Ansikte: förvånad</p></figcaption></figure>
<figure class="frame"><img src="frames/6.jpg" alt="Bild 6" loading="lazy"><figcaption>
  <div class="t">6 · 1:00.7 · 6.8 s · Golvet och korgen</div><div class="said"><i>"Ska vi säga tack?"</i> (1:00.9) … <i>"Tack!"</i> (1:04.7)</div>
  <p>Zebran tittar på korgen, öronen reser sig. Paus 4 s: barnet säger tack. Efter <i>Tack!</i> nickar zebran</p><p class="ans">Ljud: nyfiket gnägg, sedan förtjust gnägg · Ansikte: nyfiken → jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/7.jpg" alt="Bild 7" loading="lazy"><figcaption>
  <div class="t">7 · 1:07.6 · 6.2 s · Golvet och korgen</div><div class="said"><i>"Oj! Nallen hoppade i korgen!"</i> (1:09.0)</div>
  <p>Nallen gör ett lugnt skutt från golvet ner i korgen</p><p class="ans">Ljud: <code>nalle-hopp</code>, förtjust gnägg · Ansikte: förvånad → fnissig</p></figcaption></figure>
<figure class="frame"><img src="frames/8.jpg" alt="Bild 8" loading="lazy"><figcaption>
  <div class="t">8 · 1:13.8 · 8.2 s · Närbild korgen</div><div class="said"><i>"Ha ha! Nallen vill också hjälpa till."</i> (1:14.6)</div>
  <p>Nallen tittar upp över korgens kant (ögonen i kod)</p><p class="ans">Ljud: långt fniss · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/9.jpg" alt="Bild 9" loading="lazy"><figcaption>
  <div class="t">9 · 1:21.9 · 5.1 s · Halvbild</div><div class="said"><i>"Ska du plocka undan nu?"</i> (1:22.2)</div>
  <p>Zebran tittar på leksakerna och nickar. Radion slås på med ett klick, glad musik och noter (radio-tider.mjs)</p><p class="ans">Ljud: förtjust gnägg, klick, radions musik · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/10.jpg" alt="Bild 10" loading="lazy"><figcaption>
  <div class="t">10 · 1:27.0 · 8.9 s · Golvet och korgen</div><div class="said"><i>"Först bilen och ankan. Ett, två … i korgen!"</i> (1:27.3)</div>
  <p>Bilen lyfter på <i>"ett"</i>, ankan på <i>"två"</i>, båda glider i en mjuk båge och landar i korgen på <i>"i korgen!"</i>. <b>Shorten börjar här</b></p><p class="ans">Ljud: <code>badanka-pip</code>, <code>dunk</code> (på takten, i scenen), förtjust gnägg · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/11.jpg" alt="Bild 11" loading="lazy"><figcaption>
  <div class="t">11 · 1:35.8 · 9.0 s · Samma</div><div class="said"><i>"Och båten och hinken. Ett, två … i korgen!"</i> (1:36.1)</div>
  <p>Samma med båten och hinken</p><p class="ans">Ljud: <code>dunk</code> (på takten) · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/12.jpg" alt="Bild 12" loading="lazy"><figcaption>
  <div class="t">12 · 1:44.8 · 6.8 s · Halvbild</div><div class="said"><i>"Oj, bollen då? Zebran vet inte var."</i> (1:45.1)</div>
  <p>Zebran tittar åt vänster, sedan åt höger (ögonen och ansiktet, huvudet vänds inte)</p><p class="ans">Ljud: frågande gnägg · Ansikte: nyfiken</p></figcaption></figure>
<figure class="frame"><img src="frames/13.jpg" alt="Bild 13" loading="lazy"><figcaption>
  <div class="t">13 · 1:51.6 · 10.1 s · Närbild under sängen (klipp)</div><div class="said"><i>"Kan du hjälpa zebran? Kan du se var bollen är?"</i> (1:51.9)</div>
  <p>En röd bit med gul rand mellan sängbenen. Paus 5 s; efter ca 3 s skimrar den svagt</p><p class="ans">Ljud: tyst · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/14.jpg" alt="Bild 14" loading="lazy"><figcaption>
  <div class="t">14 · 2:01.7 · 6.2 s · Samma</div><div class="said"><i>"Ja, där! Ja, under sängen!"</i> (2:02.0)</div>
  <p>Bollen skimrar tydligt och rullar fram ur sängen</p><p class="ans">Ljud: förtjust gnägg, <code>tindra</code>, <code>rull</code> · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/15.jpg" alt="Bild 15" loading="lazy"><figcaption>
  <div class="t">15 · 2:07.9 · 7.0 s · Sovrummet, helbild</div><div class="said"><i>"Ska vi leka lite? Rulla, rulla … till dig!"</i> (2:08.2)</div>
  <p>Bollen rullar mot tittaren, växer och åker ut nedtill i bild. Kameran står still. <b>Leken (rulla bollen)</b></p><p class="ans">Ljud: <code>rull</code>, fniss · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/16.jpg" alt="Bild 16" loading="lazy"><figcaption>
  <div class="t">16 · 2:14.9 · 10.7 s · Samma, tomt golv</div><div class="said"><i>"Kan du rulla tillbaka?"</i> (2:15.2) … <i>"Rulla, rulla … till zebran!"</i> (2:20.5)</div>
  <p>Paus 4 s: barnet rullar tillbaka. Bollen rullar in nedifrån, blir mindre och stannar framför zebran</p><p class="ans">Ljud: <code>rull</code> · Ansikte: nyfiken → fnissig</p></figcaption></figure>
<figure class="frame"><img src="frames/17.jpg" alt="Bild 17" loading="lazy"><figcaption>
  <div class="t">17 · 2:25.6 · 7.7 s · Samma</div><div class="said"><i>"Till dig … och tillbaka!"</i> (2:26.4)</div>
  <p>En gång till: ut och in igen</p><p class="ans">Ljud: <code>rull</code>, långt fniss · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/18.jpg" alt="Bild 18" loading="lazy"><figcaption>
  <div class="t">18 · 2:33.3 · 8.4 s · Golvet och korgen</div><div class="said"><i>"Nu bollen. Ett, två … i korgen!"</i> (2:33.6)</div>
  <p>Bollen studsar två gånger (<i>"ett, två"</i>) och landar i korgen på <i>"i korgen!"</i>. <b>Shorten slutar här</b></p><p class="ans">Ljud: <code>studs</code> ×2, <code>dunk</code> · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/19.jpg" alt="Bild 19" loading="lazy"><figcaption>
  <div class="t">19 · 2:41.6 · 5.3 s · Sovrummet, helbild</div><div class="said"><i>"Nu är det alldeles städat!"</i> (2:43.0)</div>
  <p>Städat golv, korgen full. Zebran klappar tre lugna klapp (riggens klapp)</p><p class="ans">Ljud: tre <code>tass-klapp</code>, förtjust gnägg · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/20.jpg" alt="Bild 20" loading="lazy"><figcaption>
  <div class="t">20 · 2:47.0 · 5.6 s · Zebran och korgen</div><div class="said"><i>"Hej då, zebran! Hej då, korgen!"</i> (2:47.7)</div>
  <p>Zebran vinkar (armen bakom kroppen, snett ut förbi kanten), korgen bredvid. <b>Hej då med vinkning</b></p><p class="ans">Ljud: hej då-gnägg · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/21.jpg" alt="Bild 21" loading="lazy"><figcaption>
  <div class="t">21 · 2:52.6 · 5.8 s · Samma</div><div class="said"><i>"Hej då! Vi ses snart!"</i> (2:52.9)</div>
  <p>Zebran vinkar klart, armen sjunker</p><p class="ans">Ljud: – · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/22.jpg" alt="Bild 22" loading="lazy"><figcaption>
  <div class="t">22 · 2:58.4 · 2.5 s · Sovrummet → kritirisen</div><div class="said">–</div>
  <p>Kritirisen drar ihop sig runt zebran och korgen</p><p class="ans">Ljud: – · Ansikte: glad</p></figcaption></figure></div>
</div></body></html>
