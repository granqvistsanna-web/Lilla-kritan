     Tiderna och ljuden kommer ur ../../storyboard/rader.mjs (en rad = ett uppslag); scenens t = 0 är rad 01a.
     Rummet, sängen, zebran, kritan, ritintrot och nallen är gemensamma med 026:
     /avsnitt/026-zebran-gar-och-lagger-sig/scener/sovrummet/rum.js.
     Rendera: node ../render.mjs sovrummet (från scener/). Stillbilder: node ../render.mjs sovrummet 12 40 …
     Zebran bär leksakerna till korgen med riggens plocka (Sanna 2026-11-12); Malin räknar när de landar.
     Saknade filer (Malins röst, gnagg-gullig, plattan, sängen) ger tystnad eller platshållare tills de finns. -->

<script type="module">

const { $, kl, lerp, mjuk, del, bump, f1, lagg, K, ZX, VID, RIM, GS, GOLV, BED, ANS, POS, vink, oronVipp, nick, skaka } = R;
const A = '/assets/rekvisita/';

// --- Saker: (x, y) = den synliga underkantens mitt i scenen; bilden ritas med [bx, by] = samma punkt i bilden ---------------

// ankan har ingen inbakad kant → kant.js 1 %; korgen: korg-v3-tunn.png (hålet under handtaget genomskinligt).
const SAK = {

  bat:   { bild: A + 'badbat/cut/badbat-tunn.png', w: 708, h: 600, b: [354, 600], s: 0.18, golv: [995, 1070], grepp: [354, 150], rk: 6 },

};
// korgen (korg-v3-tunn.png, fyllnaden 147–873 × 113–906, öppningens kant y ca 500): på golvet till vänster om sängen
const KORG = { bild: A + 'korg/cut/korg-v3-tunn.png', w: 1024, h: 1024, s: 0.3, x: 330, y: 1012 };
const KORG_PTS = [[498,113],[377,143],[315,179],[247,245],[194,340],[148,498],[161,530],[157,573],[175,702],[216,807],[257,857],[292,878],[420,903],[603,903],[698,888],[752,867],[793,827],[828,763],[854,673],[866,570],[859,523],[873,500],[828,341],[768,237],[710,181],[620,133],[498,113]];
const korgSak = { bild: KORG.bild, w: 1024, h: 1024, s: KORG.s, x: KORG.x, y: KORG.y + (1024 - 906) * KORG.s, pts: KORG_PTS, farg: '#c99a2e', grupp: 'korg' };
const KORG_START = [korgSak.x + (KORG_PTS[0][0] - 512) * KORG.s, korgSak.y + (KORG_PTS[0][1] - 1024) * KORG.s], KORG_VANT = [KORG_START[0] + 110, KORG_START[1] - 40];
// var sakerna hamnar i korgen (underkanten bakom korgens framsida, toppen syns över kanten)
const I_KORG = { nalle: [KORG.x - 5, 912], bil: [KORG.x - 30, 922], anka: [KORG.x + 32, 918], bat: [KORG.x - 18, 926], hink: [KORG.x + 22, 922], boll: [KORG.x + 2, 915] };
const SKUGGA = { nalle: 120, bil: 150, anka: 100, bat: 120, hink: 95, boll: 72 };   // skuggans bredd per sak
const BOLL_FRAM = [ZP[0] + 150, 1062];   // bollen på golvet framför zebrans fötter
const BOLL_HUVUD = [ZP[0] + 6, ZP[1] - (925 - 118) * GS];   // bollens underkant på zebrans huvud (mellan öronen)
// bollen snurrar runt sin mitt (512, 512), de andra sakerna runt sin fot
const sakSvg = (n, [x, y], { v = 0, k = 1 } = {}) => { const o = SAK[n];
  return `<g transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(v)} 0 ${n === 'boll' ? f1((512 - o.b[1]) * o.s * k) : 0}) scale(${(o.s * k).toFixed(4)}) translate(${-o.b[0]} ${-o.b[1]})"><image href="${o.bild}" width="${o.w}" height="${o.h}"/></g>`; };
// radion (Sanna 2026-11-11): på sängens fotände; radio.png när bildsessionen levererat den, annars en kodplatshållare
const RADIO = { bild: A + 'radio/cut/radio.png', x: 1240, y: R.RIM + 6, w: 150 };
let RADIO_PNG = false;
function radio(t, st) { if (!st.radio) return; const { x, y, w } = RADIO, pa = spelar(t), s = pa ? 1 + 0.025 * Math.abs(Math.sin(Math.PI * fas(t))) * (1 - 0.6 * sankt(t)) : 1;
  const kropp = RADIO_PNG ? `<image href="${RADIO.bild}" x="${-w / 2}" y="${-w}" width="${w}" height="${w}" preserveAspectRatio="xMidYMax meet"/>`
    : `<path d="M-46 -104 Q-46 -142 0 -142 Q46 -142 46 -104" fill="none" stroke="#3C978E" stroke-width="11" stroke-linecap="round"/>
       <rect x="-75" y="-108" width="150" height="104" rx="22" fill="#4FB3A9"/><rect x="-75" y="-18" width="150" height="14" rx="7" fill="#3C978E"/>
       <circle cx="-34" cy="-58" r="30" fill="#2F6F69"/>${[[-46, -70], [-34, -70], [-22, -70], [-46, -58], [-34, -58], [-22, -58], [-46, -46], [-34, -46], [-22, -46]].map(([a, b]) => `<circle cx="${a}" cy="${b}" r="3.5" fill="#4FB3A9"/>`).join('')}
       <rect x="8" y="-90" width="56" height="24" rx="6" fill="${pa ? '#FFF1C2' : '#FBF6EC'}"/><rect x="${f1(14 + 40 * ((t * 0.02) % 1) * (pa ? 1 : 0))}" y="-88" width="4" height="20" fill="#E2574C"/>
       <circle cx="22" cy="-40" r="11" fill="#E2574C"/><circle cx="50" cy="-40" r="11" fill="#F2C14E"/>`;
  R.satt('radio', `<g transform="translate(${f1(x)} ${f1(y)}) scale(${(2 - s).toFixed(4)} ${s.toFixed(4)})">${kropp}</g>`);
  // noterna: tre små noter i radions färger stiger och vajar, en ny var 0,8 s; svagare när musiken är nedtonad
  if (!pa) return;
  const syn = del(PA, PA + 0.3, t) * (1 - del(AV - 0.3, AV, t)) * (1 - 0.55 * sankt(t)), F = ['#E2574C', '#4F86B8', '#E2A93A'];
  lagg('fram', [0, 1, 2].filter(i => t - PA >= i * 0.8).map(i => { const p = ((t - PA - i * 0.8) / 2.4) % 1, c = F[i];
    return `<g transform="translate(${f1(x - 60 + 60 * i + 22 * Math.sin(2 * Math.PI * p + i))} ${f1(y - 140 - 220 * p)}) rotate(${f1(12 * Math.sin(2 * Math.PI * p + 2 * i))}) scale(${(1.6 + 0.4 * p).toFixed(3)})" opacity="${(syn * Math.sin(Math.PI * p) ** 0.5).toFixed(3)}">
      <ellipse rx="13" ry="10" transform="rotate(-20)" fill="${c}"/><rect x="8" y="-46" width="5" height="46" fill="${c}"/><path d="M13 -46 Q30 -38 26 -20" stroke="${c}" stroke-width="5" fill="none" stroke-linecap="round"/></g>`; }).join('')); }
// Sanna 2026-11-12: radion finns inte förrän kritan ritar den (rad 4b): konturen ur radio.png:s alfa (lådan med handtaget), sedan
// handtagets hål, högtalaren, skalfönstret, de två rattarna och tre noter ovanför, ett drag var. radio.png har ingen antenn,
// så handtaget står för den (konturen ska bli den bild som fylls i).
const RS = RADIO.w / 804, cirkel = (cx, cy, r, n = 20) => Array.from({ length: n + 1 }, (_, i) => [Math.round(cx + r * Math.sin(2 * Math.PI * i / n)), Math.round(cy - r * Math.cos(2 * Math.PI * i / n))]);
const not = (x, y) => [[x + 46, y - 96], [x + 30, y - 112], [x + 16, y - 120], [x + 16, y - 6], ...cirkel(x, y, 17, 12).slice(3)];
const radioSak = { bild: RADIO.bild, w: 804, h: 678, s: RS, x: RADIO.x, y: RADIO.y, farg: '#d39a1a', grupp: 'radio',
  pts: [[422, 27], [521, 36], [573, 53], [594, 70], [609, 94], [625, 166], [634, 173], [673, 176], [712, 190], [737, 211], [755, 239], [768, 289], [776, 377], [772, 531], [758, 578], [733, 602], [697, 614], [683, 640], [667, 649], [610, 648], [584, 619], [219, 619], [193, 648], [125, 645], [107, 614], [70, 602], [50, 585], [31, 530], [29, 342], [39, 268], [56, 224], [76, 201], [102, 185], [172, 172], [179, 163], [188, 110], [200, 82], [225, 56], [253, 43], [327, 30], [422, 27]],
  drag: [[[250, 165], [262, 112], [290, 100], [520, 100], [548, 112], [557, 165]], cirkel(250, 395, 145, 28), [[466, 270], [694, 270], [694, 366], [466, 366], [466, 270]],
    cirkel(507, 490, 44, 16), cirkel(652, 490, 44, 16), not(150, -60), not(380, -130), not(610, -70)] };
const RADIO_START = [RADIO.x + (422 - 402) * RS, RADIO.y + (27 - 678) * RS], RADIO_VANT = [RADIO.x + 150, RADIO.y - 200];
// Bära (Sanna 2026-11-12): zebran går till saken så att den ligger vid vänster fot, plockar upp den (riggens plocka från golvet),
// bär den till korgen och lägger i den (plocka baklänges). Vid korgen (ZK) är vänsterhanden precis över korgens öppning.
const ZK = [610, 1030], BARS = { '10': ['bil', 'anka'], '11': ['bat', 'hink'] }, B_REP = { '10': 32, '11': 35 };
const KORG_IN = { bil: [338, 926], anka: [376, 921], bat: [326, 928], hink: [368, 924] };   // sakens fot i korgen (bakom framsidan)
const bPlats = n => [SAK[n].golv[0] + (512 - 180) * GS, ZP[1]];   // saken ligger vid vänster fot (riggens golvplock, fri x 180)
const fri = (Z, [x, y]) => [512 + (x - Z[0]) / GS, 925 + (y - Z[1]) / GS, 0];
const sakRigg = n => { const o = SAK[n]; return R.L.sakBild(o.bild, o.w, o.h, { grepp: o.grepp, fot: o.b, skala: o.s / GS, folj: 0, kant: o.rk }); };
// var varje sak är: på golvet, i zebrans hand (riggen ritar den) eller i korgen. t = scenens tid.
function barLage(n) { for (const [rid, saker] of Object.entries(BARS)) { const i = saker.indexOf(n); if (i < 0) continue;
  const b = Rd[rid].s + B0(B_REP[rid]) + barStart(i), slut = b + 2 * BAR.GA + 2 * BAR.PL;
  return t => t < b + BAR.GA ? { var: SAK[n].golv } : t < slut ? { hand: true } : { var: KORG_IN[n], iKorg: true }; } }
// zebrans rad när han bär (rad 10 och 11)
const ga = (tl, d, x0, x1, f0) => { const g = kl(tl / d), [fw, pw] = R.L.ROR.ga(0.25 + 1.4 * g), r = Math.sign(x1 - x0) * 0.7 * (1 - del(d - 0.3, d, tl)) * del(0, 0.25, tl);
  return { x: lerp(x0, x1, mjuk(g)), f: R.L.blanda({ ...fw, titt: [12 * Math.sign(x1 - x0), 4] }, f0, del(d - 0.3, d, tl)), p: { ...pw, x: 0, rikt: r } }; };
const bara = rid => (tl, d) => { const saker = BARS[rid], u = tl - B0(B_REP[rid]), GA = BAR.GA, PL = BAR.PL;
  const B = (o) => RUM({ kam: KG.BAR, bar: true, ...o });
  if (u < 0) return B({ f: R.L.blanda(ANS('nyfiken', { titt: [10, 10] }), ANS('ivrig', { titt: [8, 10] }), del(0.6, 1.2, tl)), p: POS({ upp: -0.3, rikt: 0.3 }) });
  const i = Math.min(1, Math.floor(u / barStart(1))), n = saker[i], w = u - barStart(i), Zt = bPlats(n), Z0 = i === 0 ? ZP : ZK;
  const golv = { fri: fri(Zt, SAK[n].golv), boj: R.L.HAND.golv }, korg = { fri: fri(ZK, KORG_IN[n]), boj: R.L.HAND.golv };
  if (w < GA) { const g = ga(w, GA, Z0[0], Zt[0], ANS('glad', { titt: [6, 10] })); return B({ pos: [g.x, ZP[1]], f: g.f, p: POS(g.p) }); }
  if (w < GA + PL) { const [f, p] = R.L.plockaDel('upp', w - GA, PL, golv); return B({ pos: Zt, sak: n, f, p }); }
  if (w < 2 * GA + PL) { const [f, pe] = R.L.plockaDel('upp', PL, PL, golv), g = ga(w - GA - PL, GA, Zt[0], ZK[0], R.L.blanda(f, ANS('ivrig'), 0.5));
    return B({ pos: [g.x, ZP[1]], sak: n, f: g.f, p: { ...POS(g.p), hall: pe.hall, rack: [0, 0], sakFri: pe.sakFri, sakLager: pe.sakLager, armar: [pe.armar[0], (g.p.armar || [0, 0])[1]] } }); }
  if (w < 2 * GA + 2 * PL) { const [f, p] = R.L.plockaDel('ner', w - 2 * GA - PL, PL, korg); return B({ pos: ZK, sak: n, f: R.L.blanda(f, ANS('kawaii', { titt: [-8, 8] }), del(PL * 0.6, PL, w - 2 * GA - PL)), p }); }
  // båda sakerna i korgen: står vid korgen, glad; i rad 11 går han sist tillbaka till sin plats
  const hem = rid === '11' ? d - 0.4 - GA : 1e9, f0 = R.L.blanda(ANS('kawaii', { titt: [-8, 8] }), ANS('ivrig', { titt: [-4, 2] }), del(barStart(2) + 0.6, barStart(2) + 1.0, u));
  if (tl < hem) return B({ pos: ZK, f: f0, p: POS({ rikt: -0.2 }) });
  const g = ga(tl - hem, GA, ZK[0], ZP[0], ANS('glad')); return B({ pos: [kl(g.x, ZK[0], ZP[0]), ZP[1]], f: g.f, p: POS(g.p) }); };
// korgen i två lager (Sanna 2026-11-12, saker som bärs i): hela korgen bakom zebran (under) och bara framsidan, under öppningens
// framkant, framför (korg). Det som sänks ner syns över kanten och försvinner bakom framkanten, som i en riktig korg.
const KORG_FRAM = KORG.y + (472 - 906) * KORG.s;
const korgSvg = () => `<g transform="translate(${f1(korgSak.x - 512 * KORG.s)} ${f1(korgSak.y - 1024 * KORG.s)}) scale(${KORG.s})"><image href="${KORG.bild}" width="1024" height="1024"/></g>`;
const korg = (pa = true) => { R.satt('korgbak', pa ? korgSvg() : ''); if (pa) $('korg').setAttribute('clip-path', 'url(#korgfram)'); else $('korg').removeAttribute('clip-path'); if (pa) R.satt('korg', korgSvg()); };

// --- Raderna: tider ur storyboarden -------------------------------------------------------------------------------------
let acc = 0;
const RAD = RADER.filter(r => r.id !== '00').map(r => { const s = acc; acc += r.d; return { ...r, s }; });
const Rd = Object.fromEntries(RAD.map(r => [r.id, r]));
let SAK_NU = null;
const SVART = 0.6, DURATION = RAD.at(-1).s + RAD.at(-1).d + SVART;
const GANG = tl => lerp(2150, ZP[0], 1 - (1 - kl(tl / 2.6)) ** 1.6);
const klapp = T => ({ ...R.L.ROR.klappa(T)[1], gnista: 0 });   // riggens klapp: 1.0 = händerna möts
// kameror för 027
// närbilderna när Malin nämner en sak (rader.mjs nara): klipp dit på ordet, kvar några sekunder, klipp tillbaka
const NARA_K = { LEKSAKER: [1.6, 920, 960], KORG: [2.6, KORG.x + 10, 900], RADIO: [2.8, RADIO.x, RADIO.y - 70],
  BIL_ANKA: [2.0, 770, 1000], BAT_HINK: [2.0, 1065, 1000], BOLL: [2.4, BOLL_FRAM[0], BOLL_FRAM[1] - 70] };
const KG = { RADIO_RIT: [1.8, RADIO.x - 140, RADIO.y - 100], GOLV: [1.15, 960, 640], KORG: [1.4, 640, 790], KORG_NARA: [2.6, KORG.x + 10, 900], KORG_RIT: [2.0, KORG.x + 40, 880],
  UNDER: [1.7, SAK.boll.golv[0] - 60, 790], HALV: [1.4, 1000, 760], VINK: [1.4, 700, 780], BAR: [1.25, 800, 770], NARA: [2.4, ZP[0], ZP[1] - (925 - 430) * GS] };

// --- Leksakerna: var varje sak är vid tiden t (ur raderna) --------------------------------------------------------------------
// landningen sätter sig: ett litet efterstuds (8 px, 0,3 s) och sedan stilla
const SATT = u => 8 * bump(0, 0.3, u) + 2.5 * bump(0.3, 0.5, u);
const BANA = {
  bil: barLage('bil'), anka: barLage('anka'), bat: barLage('bat'), hink: barLage('hink'),
  // nallen skuttar lugnt ner i korgen (rad 7, 0,3–1,1 s), sjunker in lite och gungar (Sanna 2026-11-12: inte stelt inklistrad),
  // tittar sedan upp över kanten (rad 8); huvudet syns alltid över kanten och den vaggar lugnt så länge den sitter där
  nalle: t => { const a = Rd['7'].s + 0.3, u = kl((t - a) / 0.8), slut = I_KORG.nalle, l = t - a - 0.8;
    if (u <= 0) return { var: SAK.nalle.golv };
    const pos = [lerp(SAK.nalle.golv[0], slut[0], mjuk(u)), lerp(SAK.nalle.golv[1], slut[1], u) - 130 * Math.sin(Math.PI * u)];
    const r8 = Rd['8'], titt = -14 * del(r8.s + 0.1, r8.s + 0.7, t), sjunk = 24 * del(0, 0.45, l) - 6 * bump(0.3, 0.75, l);
    const vagg = l > 0 ? 7 * Math.sin(2 * Math.PI * l / 1.3) * Math.exp(-l / 1.1) + 1.4 * Math.sin(t * 1.1) : 0;
    return { var: u < 1 ? pos : [slut[0], slut[1] + sjunk + titt], v: u < 1 ? -8 * Math.sin(Math.PI * u) : vagg, iKorg: u >= 1, luft: u > 0 && u < 1, ogon: u >= 1 && t >= r8.s ? [0, -6] : null }; },
  boll: t => bollBana(t),
};
// bollen: under sängen → rullar fram (rad 14) → rullar till dig och tillbaka (15–17) → studsar två gånger och landar i korgen (18)
function bollBana(t) {
  const B = SAK.boll.golv, r14 = Rd['14'], r15 = Rd['15'], r16 = Rd['16'], r17 = Rd['17'], r18 = Rd['18'];
  const rull = (fran, till, u, k0 = 1, k1 = 1) => ({ var: [lerp(fran[0], till[0], mjuk(u)), lerp(fran[1], till[1], mjuk(u))], k: lerp(k0, k1, mjuk(u)), v: 360 * mjuk(u) * Math.sign(till[0] - fran[0] || 1) });
  const UT = [BOLL_FRAM[0] + 40, 1500];
  if (t < r14.s + LANGD(20) + 0.5) return { var: B, under: true };
  if (t < r15.s) { const u = kl((t - (r14.s + LANGD(20) + 0.5)) / 1.4); return { ...rull(B, BOLL_FRAM, u), under: u < 0.35 }; }
  if (t < r16.s) { const a = r15.s + 0.3 + ord(21, 'Rulla') - 0.4, b = r15.s + 0.3 + ord(21, 'dig') + 0.4; return t < a ? { var: BOLL_FRAM } : rull(BOLL_FRAM, UT, kl((t - a) / (b - a)), 1, 4.5); }
  if (t < r17.s) { const L0 = r16.s + 0.3 + LANGD(22) + 4.0, a = L0 - 0.6, b = L0 + ord(23, 'zebran') + 0.4, IN = [BOLL_FRAM[0] + 40, 1130];   /* bollen rullar redan när Malin säger "Rulla" */
    return t < a ? { var: UT, k: 4.5 } : rull(IN, BOLL_FRAM, kl((t - a) / (b - a)), 1.8, 1); }
  if (t < r18.s) { const o = ord(24, 'och'), a = r17.s + 0.3, b = r17.s + 0.8 + o, c = r17.s + 0.8 + ord(24, 'tillbaka') - 0.2, d = r17.s + 0.8 + LANGD(24) + 0.4;   /* bollen rullar 0,5 s innan Malin säger "Till dig" */
    if (t < b) return rull(BOLL_FRAM, UT, kl((t - a) / (b - a)), 1, 4.5);

function lage(t) {
  let i = RAD.findIndex(r => t < r.s + r.d); if (i < 0) i = RAD.length - 1;
  const r = RAD[i], tl = t - r.s, st = S[r.id](tl, r.d);
  for (const [n, w, k, h] of r.nara || []) { const t0 = r.malin.find(m => m[0] === n)[1] + ord(n, w) - 0.05; if (tl >= t0 && tl < t0 + h) st.kam = NARA_K[k]; }
  if (i > 0) {
    const fr = RAD[i - 1], f0 = S[fr.id](fr.d, fr.d), gb = del(0, 0.45, tl);
    if (f0.plats === st.plats && st.f && f0.f && gb < 1) { st.f = R.L.blanda(f0.f, st.f, gb); st.p = R.L.blandaPose(f0.p, st.p, gb); }
  }

}

function gunga(st, t) {
  if (st.plats !== 'rum' || !st.p || !st.pos || !spelar(t) || st.bar) return st;
  const k = del(PA, PA + 0.6, t) * (1 - del(AV - 0.5, AV, t)) * (1 - 0.5 * sankt(t)), s = Math.sin(Math.PI * fas(t));
  return { ...st, pos: [st.pos[0], st.pos[1] - 7 * k * Math.abs(s)], p: { ...st.p, luta: (st.p.luta || 0) + 2.5 * k * Math.sin(Math.PI * fas(t) / 2) } };
}

  if (st.ritRadio) R.ritSak(radioSak, { ritad: st.ritRadio.ritad ?? 1, fyll: st.ritRadio.fyll ?? 1, kritaPos: st.ritRadio.krita ? [st.ritRadio.krita, 125] : null });
  else radio(t, st);
  if (st.radioGlitter > 0.01) R.skimmer(RADIO.x, RADIO.y - 70, st.radioGlitter, t, 1.2);
  if (!st.korg) korg(false);
  if (st.rit) R.ritSak(korgSak, { ritad: st.rit.ritad ?? 1, fyll: st.rit.fyll ?? 1, kritaPos: st.rit.krita ? [st.rit.krita, 125] : null });
  else if (st.korg) korg();
  if (st.glitter > 0.01) R.skimmer(KORG.x, KORG.y - 150, st.glitter, t, 1.8);
  // leksakerna: på golvet, i luften eller i korgen (bakom korgens framsida); bollen under sängen bakom sängramen
