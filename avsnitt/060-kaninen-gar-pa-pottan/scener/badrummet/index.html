<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Kaninen går på pottan</title>
<style>html, body { margin:0; background:#000; overflow:hidden } svg { width:100vw; height:100vh; display:block; }</style>
</head>
<body>
<!-- 060 Kaninen går på pottan: hela kodscenen (grind 6). Mått och utsnitt som storyboarden (../../storyboard/scen.html),
     ramverket som 059:s skog (varm ton, vinjett 0,14, ny brusbild 6 gånger/s, line boil 2,5 px delat med zoomen, kant.js, djup3d).
     Tiderna ur rader.json (skrivs av storyboard/bygg.mjs).
     Rendera: node avsnitt/060-kaninen-gar-pa-pottan/scener/render.mjs avsnitt/060-kaninen-gar-pa-pottan/scener/badrummet [--snabb].
     Bara hårda klipp; åkningarna är zoomen in i teckningen och den långsamma pushen på tredje "Vänta" (rad 16).
     Kritan är liten, utan ansikte, knackar aldrig. Bollen, toarullen, pottan, boken och stjärnan räknas på hela filmens tid. -->
<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="boil" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="5000">
      <feTurbulence id="brus" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
      <feDisplacementMap in="SourceGraphic" scale="2.5"/>
    </filter>
    <filter id="korn" x="0" y="0" width="1" height="1">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="2"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.47  0 0 0 0 0.36  1.1 0 0 0 -0.47"/>
    </filter>
    <filter id="mjukskugga" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="7"/></filter>
    <radialGradient id="vinjett" cx="50%" cy="50%" r="75%"><stop offset="0.55" stop-color="#3a2410" stop-opacity="0"/><stop offset="1" stop-color="#3a2410" stop-opacity="0.14"/></radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="#FAF8F2"/>
  <g id="kamera">
    <g id="platta" data-djup-ramp="810:-0.1 905:0 1080:0.18"></g>
    <g filter="url(#boil)"><g id="bak"></g></g>
    <g filter="url(#boil)"><g id="mitt"></g></g>
    <g filter="url(#boil)"><g id="figurer"></g></g>
    <g filter="url(#boil)"><g id="kar"></g></g>
    <g filter="url(#boil)"><g id="saker"></g></g>
    <g filter="url(#boil)"><g id="fram"></g></g>
    <g id="glans"></g>
    <g id="krita"></g>
  </g>
  <g id="ram"></g>
  <g id="gomda" opacity="0"></g>
</svg>
<script src="/verktyg/blinka.js"></script>
<script src="/verktyg/kant.js"></script>
<script src="/verktyg/kritan-ritar.js"></script>
<script src="/verktyg/djup3d.js"></script>
<script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script>
const $ = id => document.getElementById(id);
const A = '/assets/', R_ = A + 'rekvisita/';
const lagg = (id, h) => $(id).insertAdjacentHTML('beforeend', h);
const f1 = v => (+v).toFixed(1);
const kl = (k, a = 0, b = 1) => Math.max(a, Math.min(b, k)), lerp = (a, b, k) => a + (b - a) * k;
const mjuk = k => (k = kl(k), k * k * (3 - 2 * k)), del = (a, b, t) => mjuk((t - a) / (b - a));
const bump = (a, b, t) => (t <= a || t >= b) ? 0 : Math.sin(Math.PI * (t - a) / (b - a));
const lerp2 = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k)];
const ta = p => typeof p === 'function' ? p() : p;

// --- Bilderna och måtten (som storyboarden) ---------------------------------------------------------------------------------
const PLATTA = A + 'bakgrunder/badrummet/badrummet-v1.jpeg';
const SAK = {   // [fil, bildens storlek, alfarutan x0 y0 x1 y1]
  potta:  [R_ + 'potta/cut/potta-v3.png', [737, 522], [3, 3, 734, 519]],
  rulle:  [R_ + 'toarulle/cut/toarulle.png', [694, 799], [16, 15, 678, 780]],
  toa:    [R_ + 'toalett/cut/toalett.png', [534, 829], [12, 12, 522, 817]],
  bok:    [R_ + 'bilderbok/cut/bilderbok.png', [636, 735], [14, 13, 622, 722]],
  stjarna:[R_ + 'stjarna-gul/cut/stjarna-gul.png', [1024, 1024], [116, 123, 908, 902]],
  morot:  [R_ + 'morot/cut/morot.png', [1024, 572], [67, 130, 957, 443]],
};
const KONTURFIL = { rulle: 'toarulle/cut/toarulle-kontur.json', bok: 'bilderbok/cut/bilderbok-kontur.json', stjarna: 'stjarna-gul/cut/stjarna-gul-kontur.json' };
const HK = 0.68, HANDFAT = { bild: R_ + 'handfatet/cut/handfatet.png', W: 802 * HK, H: (772 - 177) * HK, kantY: 177 * HK };
const PALL = R_ + 'pall/cut/pall.png', PALL_HOG = [555, 66];
const HANDDUK = [R_ + 'handduk/cut/handduk-rutig-tunn.png', 538, 1033];
const KAR_S = 0.88, KAR = R_ + 'badkar/cut/badkar-bla-kran-tunn.png', KAR_W = 1044 * KAR_S, KAR_H = 687 * KAR_S, KAR_Y0 = 905 - 668 * KAR_S;
const DS = 0.5, GOLV = 905, SVART = 0.6;
const HX = 300, RIM = GOLV - HANDFAT.H, BX = HX + 30;   // kaninen bakom handfatet, högra tassen under kranen, ansiktet fritt från kranen (Sanna 27/11: "better tap")
const KRAN = [HX + (598 - 401) * HK, RIM - (177 - 84) * HK];
const HANDDUK_POS = [600, 130, 250];
const TOA = [720, GOLV + 4, 420], TOA_KNAPP = [720, GOLV + 4 - 420 + 22];   // större än kaninen (Sanna 27/11)
const POTTA = [1040, GOLV + 4, 150], POTTA_SLUT = [1040, GOLV + 4, 150];   // större potta så att kaninen sitter i den (Sanna 27/11)   // pottan ställs ner bredvid toaletten efter tömningen (rad 23)
const BD = 72, BY = GOLV - BD / 2 + 3;
const RULLE = [1460, GOLV + 2, 95];                // toarullen på golvet (där ritintrot landar), och där den står efter rad 22
const KX = 2150, KAR_X0 = KX - KAR_W / 2;
const FOT_V = KAR_X0 + 232 * KAR_S;                // badkarets vänstra fot; rullen gömmer sig bakom den
const FLIK = [FOT_V - 48, GOLV - 22];
const BOK_VID = [POTTA[0] - 165, GOLV + 4, 110];
// kaninens platser
const ST = [1230, GOLV], ST1 = [1260, GOLV], STA2 = [1460, GOLV], B_POTTA = [POTTA[0], GOLV + 38];   // sitter nere i pottan
const VID_KAR = [FOT_V - 150, GOLV], MELLAN = [1320, GOLV], TOA_STA = [905, GOLV], STJ_STA = [820, GOLV], SLUT = [1270, GOLV];   // landar fritt från den större pottan (rad 29)
const BOLL_P = POTTA[0] + 150;   // bollen bredvid pottan
let VID, PALL_KS, PALL_X0, PALL_Y0, KNAPP_ARM = 100;

let L, G, BLINKA, TT = 0, ZOOM = 1, RAD = [], RR = {}, ROSTER = [], DURATION = 0, KONTUR = {};
let T_RIT, T_BOK, T_STJ;
const LN = n => ROSTER[n - 1][1];
const M = (id, n) => RR[id].malin.find(x => x[0] === n)[1];
const s_ = id => RR[id].s;
const iFig = ([x, fot], [px, py], s = DS) => [x + (px - 512) * s, fot + (py - L.FOTTER) * s];

function kamera([zoom, cx, cy]) {
  ZOOM = zoom;
  const tx = Math.max(1920 - 1920 * zoom, Math.min(0, 960 - cx * zoom)), ty = Math.max(1080 - 1080 * zoom, Math.min(0, 540 - cy * zoom));
  $('kamera').setAttribute('transform', `translate(${f1(tx)} ${f1(ty)}) scale(${zoom})`);
  $('brus').nextElementSibling.setAttribute('scale', (2.5 / zoom).toFixed(2));
}
// --- Kameror [zoom, cx, cy] (storyboardens utsnitt) -----------------------------------------------------------------------
const K_HEL = [1, 960, 540];
const HALV = ([x, fot], dx = 0) => [1.6, x + dx, fot - 200];
const NARA = ([x, fot], dy = 0) => [2.4, x, fot - 250 + dy];
const POTTAKAM = (z = 1.9, dy = 0) => [z, POTTA[0] + 40, GOLV - 190 + dy];
const ANS = (pos, sitter = false) => () => { const [x, y] = iFig(pos, [512, 440]); return [2.6, x, y + (sitter ? 24 : 0)]; };
const NARA_BOK = () => [3.0, ...iFig(B_POTTA, [512, 520])];
const K_FLIK = [2.6, FLIK[0] - 20, GOLV - 120];
const K_LEK = [1.8, 1150, 705], K_SLUT = [1.7, 1200, 705];   // halvbilderna vid lekytan: badkaret utanför bild (Sanna 27/11)

// --- Saker -----------------------------------------------------------------------------------------------------------------
const sakT = (namn, x, fot, hojd, rot = 0) => { const [, , [x0, y0, x1, y1]] = SAK[namn], s = hojd / (y1 - y0);
  return { s, t: `translate(${f1(x)} ${f1(fot)}) rotate(${f1(rot)}) scale(${s.toFixed(4)}) translate(${-(x0 + x1) / 2} ${-y1})`,
    i: ([px, py]) => { const a = rot * Math.PI / 180, dx = (px - (x0 + x1) / 2) * s, dy = (py - y1) * s; return [x + dx * Math.cos(a) - dy * Math.sin(a), fot + dx * Math.sin(a) + dy * Math.cos(a)]; } }; };
const sak = (lager, namn, x, fot, hojd, { rot = 0, o = 1 } = {}) => { const [f, [w, h]] = SAK[namn];
  lagg(lager, `<image href="${f}" width="${w}" height="${h}" opacity="${kl(o).toFixed(2)}" transform="${sakT(namn, x, fot, hojd, rot).t}"/>`); };
const skugga = (lager, x, fot, rx, o = 0.2) => lagg(lager, `<ellipse cx="${f1(x)}" cy="${f1(fot - 2)}" rx="${f1(rx)}" ry="${f1(rx * 0.12)}" fill="#3a2a1a" opacity="${o}" filter="url(#mjukskugga)"/>`);
// den blå bollen i kod (rekvisita/boll-bla.md): klarblå, en bred vit svängd rand som snurrar när den rullar
function boll([x, y], lager = 'saker') {
  const r = BD / 2, v = (x - 1310) / r * 57.3; skugga('mitt', x, GOLV + 4, r * 0.85);
  lagg(lager, `<g transform="rotate(${f1(v)} ${f1(x)} ${f1(y)})"><circle cx="${f1(x)}" cy="${f1(y)}" r="${r + 4}" fill="#fff"/><circle cx="${f1(x)}" cy="${f1(y)}" r="${r}" fill="#2F6FD6"/>
    <path d="M${f1(x - r * 0.95)} ${f1(y - r * 0.05)} Q${f1(x)} ${f1(y + r * 0.35)} ${f1(x + r * 0.95)} ${f1(y - r * 0.05)}" fill="none" stroke="#fff" stroke-width="${r * 0.32}" stroke-linecap="round" opacity=".92"/></g>`);
}
const glimtD = 'M0 -1 L.2 -.2 L1 0 L.2 .2 L0 1 L-.2 .2 L-1 0 L-.2 -.2Z';
function skimmer(x, y, k, vidd = 1) { if (k <= 0.01) return;
  lagg('glans', [[-1, -0.7, 1], [1.1, -0.4, 0.8], [0.2, 1.1, 0.7], [-1.2, 0.8, 0.6]].map(([dx, dy, s], i) =>
    `<path transform="translate(${f1(x + dx * 40 * vidd)} ${f1(y + dy * 34 * vidd)}) scale(${(16 * s * k * vidd * (0.75 + 0.25 * Math.sin(TT * 3 + i * 1.7))).toFixed(2)})" opacity="${kl(0.4 + k).toFixed(2)}" d="${glimtD}" fill="#fff6c8" stroke="#e6b422" stroke-width=".06"/>`).join('')); }
const tuss = (x, y, r) => r < 1 ? '' : [[0, 0, 1], [-0.8, 0.25, 0.7], [0.8, 0.2, 0.75], [-0.35, -0.55, 0.65], [0.4, -0.5, 0.6]]
  .map(([dx, dy, k]) => `<circle cx="${f1(x + dx * r)}" cy="${f1(y + dy * r)}" r="${f1(k * r)}" fill="#fff" stroke="#cfe6ee" stroke-width="${f1(0.08 * r)}" paint-order="stroke"/>`).join('');
const flik = o => lagg('bak', `<path opacity="${kl(o).toFixed(2)}" d="M${FLIK[0] + 20} ${FLIK[1] - 20} Q${FLIK[0] - 30} ${FLIK[1] - 4} ${FLIK[0] - 62} ${FLIK[1] + 26} L${FLIK[0] - 14} ${FLIK[1] + 28} Q${FLIK[0] - 4} ${FLIK[1] + 8} ${FLIK[0] + 20} ${FLIK[1] + 4}Z" fill="#F7F0E1" stroke="#C9D3DE" stroke-width="4"/>`);
// bokens uppslag i kod (Sanna 27/11: "better book"): gul pärm med tjocklek, två sidor som böjer sig in mot ryggen, en mjuk skugga i fåran,
// bilden mitt på högersidan (moroten, sedan Flow-bilden med kaninen på pottan). vand 0–1 = höger sida vänds över till vänster, oppen 0–1 öppnar boken.
const BOKBILD = [R_ + 'bilderbok/cut/sida-kanin-pa-potta.png', 402, 825];   // andra uppslaget: Flow-bild nr 1 (Sanna 27/11)
const PALS = '#a2633d';
function sidaD(x0, x1, y0, h, sida) {   // en sida: övre och nedre kanten svänger ner mot ryggen
  const dip = h * 0.06, r = sida < 0 ? x0 : x1, g = sida < 0 ? x1 : x0;
  return `M${f1(r)} ${f1(y0)} Q${f1((r + g) / 2)} ${f1(y0 - dip * 0.4)} ${f1(g)} ${f1(y0 + dip)} L${f1(g)} ${f1(y0 + h + dip * 0.6)} Q${f1((r + g) / 2)} ${f1(y0 + h - dip * 0.2)} ${f1(r)} ${f1(y0 + h)}Z`;
}
function sidbild(namn, cx, cy, b, h) {
  if (namn === 'morot') { const T = sakT('morot', cx, cy + h * 0.16, b * 0.19, -14); return `<image href="${SAK.morot[0]}" width="1024" height="572" transform="${T.t}"/>`; }
  if (BOKBILD) { const [fil, w, hh] = BOKBILD, k = Math.min(b * 0.42 / w, h * 0.8 / hh); return `<image href="${fil}" x="${f1(cx - w * k / 2)}" y="${f1(cy - hh * k / 2)}" width="${f1(w * k)}" height="${f1(hh * k)}"/>`; }
  const T = sakT('potta', cx, cy + h * 0.34, h * 0.28), k = h * 0.1, ky = cy + h * 0.02;
  return `<g fill="#e9e2d6" stroke="#b9ad9a" stroke-width="${f1(k * 0.12)}"><ellipse cx="${f1(cx - k * 0.45)}" cy="${f1(ky - k * 1.5)}" rx="${f1(k * 0.28)}" ry="${f1(k * 0.8)}"/>
    <ellipse cx="${f1(cx + k * 0.45)}" cy="${f1(ky - k * 1.5)}" rx="${f1(k * 0.28)}" ry="${f1(k * 0.8)}"/><circle cx="${f1(cx)}" cy="${f1(ky)}" r="${f1(k)}"/></g><image href="${SAK.potta[0]}" width="737" height="522" transform="${T.t}"/>`;
}
function uppslag([x, y], b, bild, { vand = 0, oppen = 1, lager = 'saker', tassar = true } = {}) {
  const h = b * 0.64, y0 = y - h / 2, t = b * 0.035;
  let html = `<g transform="translate(${f1(x)} 0) scale(${oppen.toFixed(3)} 1) translate(${f1(-x)} 0)">
    <rect x="${f1(x - b / 2 - 7)}" y="${f1(y0 - 5)}" width="${f1(b + 14)}" height="${f1(h + 5 + t + 6)}" rx="${f1(b * 0.05)}" fill="#E3A72C"/>
    <rect x="${f1(x - b / 2 - 7)}" y="${f1(y0 - 6)}" width="${f1(b + 14)}" height="${f1(h + 10)}" rx="${f1(b * 0.05)}" fill="#F6C445"/>
    <path d="${sidaD(x - b / 2, x - 2, y0, h, -1)}" fill="#F7F0E1"/><path d="${sidaD(x + 2, x + b / 2, y0, h, 1)}" fill="#F7F0E1"/>
    <path d="M${f1(x - b * 0.03)} ${f1(y0 + h * 0.07)} L${f1(x - b * 0.03)} ${f1(y0 + h)} M${f1(x + b * 0.03)} ${f1(y0 + h * 0.07)} L${f1(x + b * 0.03)} ${f1(y0 + h)}" stroke="#e8dcc4" stroke-width="${f1(b * 0.05)}" opacity="0.7"/>
    <path d="M${f1(x)} ${f1(y0 + h * 0.06)} V${f1(y0 + h + 3)}" stroke="#d6c6a6" stroke-width="${f1(b * 0.012)}"/>
    ${sidbild(vand > 0.5 || bild === 'potta' ? 'potta' : 'morot', x + b / 4, y, b, h)}`;
  if (vand > 0 && vand < 1) { const c = Math.cos(Math.PI * vand);   // sidan som vänds: framsidan (moroten) först, sedan baksidan
    html += `<g transform="translate(${f1(x)} 0) scale(${c.toFixed(3)} 1) translate(${f1(-x)} 0)"><path d="${sidaD(x + 2, x + b / 2, y0 - 4 * Math.sin(Math.PI * vand), h, 1)}" fill="${c > 0 ? '#F7F0E1' : '#EFE6D2'}" stroke="#e3d6bd" stroke-width="2"/>${c > 0 ? sidbild('morot', x + b / 4, y, b, h) : ''}</g>`; }
  html += '</g>';
  // tassarna framför pärmens nedre hörn (håller boken)
  if (tassar) html += [-1, 1].map(sd => `<ellipse cx="${f1(x + sd * (b / 2 + 2) * oppen)}" cy="${f1(y0 + h * 0.78)}" rx="${f1(b * 0.075)}" ry="${f1(b * 0.095)}" fill="${PALS}" stroke="#fff" stroke-width="${f1(b * 0.02)}"/>`).join('');
  lagg(lager, html);
}

// --- Kritan ritar en sak (kontur ur cut/*-kontur.json + detaljstreck, fyllning inifrån) ------------------------------------------
const DETALJ = {
  rulle: ['M40 150 C120 262 580 262 662 150', 'M262 140 C262 96 434 96 434 140 C434 184 262 184 262 140', 'M237 268 C239 420 238 600 237 758'],
  bok: ['M97 30 C99 250 98 450 97 662', 'M300 290 C330 280 370 284 382 300 C356 360 300 425 264 452 C266 400 280 334 300 290', 'M350 292 C342 262 336 240 330 222', 'M366 292 C376 258 390 238 408 226', 'M104 668 C260 672 440 672 600 666'],
  stjarna: [],
};
// rit en sak med foten i (x, fot) och höjden h; k = hur långt konturen ritats, f = fyllningen; ger kritans punkter i scenen
function ritSak(lager, namn, [x, fot, h], k, f, { rot = 0, z = ZOOM, rita = true } = {}) {
  const [fil, [w, hh], [x0, y0, x1, y1]] = SAK[namn], T = sakT(namn, x, fot, h, rot);
  const Rb = ritBana([KONTUR[namn].d, ...DETALJ[namn]], ritfart(kl(k)), { vila: [0.5], attr: `fill="none" stroke="${KRITAN.LINJE}" stroke-width="${f1(KRITAN.BRED / T.s / Math.sqrt(z))}" stroke-linecap="round" stroke-linejoin="round" opacity="${linjeOpacitet(f).toFixed(2)}"` });
  if (rita) {
    if (f > 0) lagg(lager, `<g transform="${T.t}">${f < 1 ? fyllMask('fy' + namn, (x0 + x1) / 2, (y0 + y1) / 2, Math.hypot(x1 - x0, y1 - y0) / 2, f) : ''}<image href="${fil}" width="${w}" height="${hh}"${f < 1 ? ` clip-path="url(#fy${namn})"` : ''}/></g>`);
    if (k > 0 && f < 1) lagg('krita', `<g transform="${T.t}">${Rb.html}</g>`);
  }
  return { spets: T.i(Rb.spets), start: T.i(Rb.start), slut: T.i(Rb.slut), mitt: T.i([(x0 + x1) / 2, (y0 + y1) / 2]) };
}
const kritaRita = kr => { if (kr) lagg('krita', kritaBild(kr.x, kr.y, kr)); };
// kritan genom hela förloppet för en sak som ritas i scenen
function kritanVid(t, T, pts, vanta) {
  const k = (t - T.rit[0]) / (T.rit[1] - T.rit[0]);
  kritaRita(kritaFas(t, T, { start: pts.start, spets: pts.spets, slut: pts.slut, vanta, s: kritaSkala(ZOOM) * (ZOOM > 2 ? 0.7 : 1) }));
  return k;
}

// --- Ritintrot: kritan ritar toarullen (en sak, inte kaninen) ------------------------------------------------------------------
const PAPPER_RULLE = [960, 860, 600];
function ritaPapper(st, t) {
  $('platta').innerHTML = `<rect x="-200" y="-200" width="2400" height="1500" fill="#FBF7EE"/><rect x="-200" y="-200" width="2400" height="1500" filter="url(#korn)"/>`;
  const kryp = 1 + 0.12 * (st.kryp || 0), z = (st.zoom || 1) * kryp;
  kamera([z, 960, PAPPER_RULLE[1] - PAPPER_RULLE[2] / 2]);
  const f = st.fyll || 0, k = (t - T_RIT.rit[0]) / (T_RIT.rit[1] - T_RIT.rit[0]);
  const pts = ritSak('bak', 'rulle', PAPPER_RULLE, k, f, { z });
  kritaRita(kritaFas(t, T_RIT, { start: pts.start, spets: pts.spets, slut: pts.slut, vanta: [960 + 470, 300], s: KRITAN.SKALA_PAPPER / kryp }));
  if (f > 0) lagg('krita', gnistor(960, 560, 380, t - T_RIT.ut[0]));
}

// --- Kaninen ---------------------------------------------------------------------------------------------------------------
function kanin([x, fot], f, p, { luft = false, dold = false } = {}) {
  $('figurer').appendChild(G);
  G.setAttribute('transform', `translate(${f1(x)} ${f1(fot)}) scale(${DS}) translate(-512 ${-L.FOTTER})`);
  L.rita(G, f, p);
  const sk = G.querySelector('.skugga');
  if (sk) { sk.setAttribute('fill', '#3a2a1a'); sk.setAttribute('filter', 'url(#mjukskugga)'); sk.setAttribute('opacity', luft || dold ? 0 : (2.2 * +sk.getAttribute('opacity')).toFixed(3)); }
  G.querySelectorAll('.leg-l,.leg-r,.tail').forEach(e => dold ? e.setAttribute('visibility', 'hidden') : e.removeAttribute('visibility'));
}
// tassens mitt (sida 'l' = bildens vänster) i scenens koordinater, ur armens synliga del
function tass(sida = 'l') {
  const spets = sida === 'l' ? L.HAND.l : L.HAND.r;
  for (const e of [`arm-${sida}-fram`, `arm-${sida}2`, `arm-${sida}`].flatMap(c => [...G.querySelectorAll('.' + c)])) {

    [s_('5') + 0.3, s_('5') + 1.5, 1372, BOLL_P], [T29_PUFF() - 0.2, T29_PUFF() + 0.7, BOLL_P, 1470]];
  let x = 1310;
  for (const [a, b, x0, x1] of segs) { if (t >= b) x = x1; else if (t > a) return lerp(x0, x1, 1 - (1 - (t - a) / (b - a)) ** 2); }

}

  if (t < g0) return { x: FOT_V, rot: 0, flik: 1 };
