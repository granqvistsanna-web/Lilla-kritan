<!doctype html><html lang="sv"><head><meta charset="utf-8"><title>Discot</title>
<style>
  html, body { margin:0; background:#FBF7EE; overflow:hidden; }
  body > svg { position:absolute; inset:0; width:100vw; height:100vh; display:block; }
</style></head><body>
<!-- Avsnitt 006, scen Discot (storyboard 15a–16f), efter 005:s discot: danspausen med statisterna Gurra (hoppa), Fia (snurra) och
     Mille (klappa), alla fem i V-raden, sista refrängen med småbilderna som poppar upp i bågen under kulan, och Disa som
     puttrar in till mitten i båten och vinkar, där slutet/ (17, kritirisen) tar vid. Tiderna ur SHOTS i ../../storyboard/bygg.py
     (kit.manus()), måtten ur bygg.py (SOLO_H/FOT, DUO_H, KULA, IKON_BÅGE/IKON_R, RAD/V_H/V_FOT, EGEN, SLUT_X/Y/H). -->
<script src="../kit.js"></script><script src="../../../../verktyg/kant.js"></script><script src="../ansikten.js"></script><script src="../baten.js"></script><script src="../discoljus.js"></script><script src="../kritsvep.js"></script>
<script>
(async () => {
const { W, H, ROT, el, bild, clamp, lerp, mjuk, inUt, del, hopp, BEAT, BEAT0, benHopp, musArm } = kit;
const LAGER = new URL('../lager/', location.href).href;
const M = await kit.manus();
const T0 = M.bild('15a')[0], B = id => M.bild(id).map(x => x - T0);   // scentid = avsnittstid − 15a
const SANG0 = T0 - M.av;                                              // klipptid (sang-klippt.m4a) vid scenens t = 0
const ID = ['15a', '15b', '15c', '15d', '15e', '15f', '15g', '16a', '16b', '16c', '16d', '16e', '16f'];
const START = Object.fromEntries(ID.map(id => [id, B(id)[0]]));
const SLUT = B('16f')[1];                                             // här tar slutet/ (17) vid
const skott = t => ID.reduce((a, id) => t >= START[id] ? id : a, ID[0]);

// takten i scentid
const fas = t => (t + SANG0 - BEAT0) / BEAT;                          // slag sedan BEAT0
const slag = t => t - (fas(t) % 1) * BEAT;                            // senaste slaget
const nastaSlag = t => slag(t) + ((fas(t) % 1) > 0.02 ? BEAT : 0);
const slagI = (a, b) => { const u = []; for (let s = nastaSlag(a); s < b - 0.05; s += BEAT) u.push(s); return u; };
const taktHopp = (t, h) => { const s = slag(t); return hopp(t, s + 0.08, s + BEAT - 0.06, h, 0.06, 0.08); };
const puls = (t, len = 0.25) => Math.max(0, 1 - (t - slag(t)) / len);   // 1 på slaget, ner till 0
const sv = (t, k = 1) => Math.sin(fas(t) * Math.PI * k);              // −1..1, ett halvt varv per slag (k = 1)
const kort = t => (fas(t) % 4) > 3.5;                                 // slutet av en fras om fyra slag: glada stängda ögon
const blinkar = (t, o) => kit.blink(t, Array.from({ length: 20 }, (_, i) => o + i * 3.1));
const STILL = { y: 0, sx: 1, sy: 1, ben: 0 };

// ---------- mått ur bygg.py ----------
const SOLO_H = 0.58 * H, SOLO_FOT = 0.85 * H, DUO_H = 0.5 * H, HOPP = 45;
const IKON_BAGE = [[288, 162], [488, 198], [688, 210], [888, 198], [1088, 162]], IKON_R = 54;
// V-raden (RAD i bygg.py, _v_rad(): x, höjd, fötter); Fia flyger ovanför Gurras axel, mot Disa
const RAD = { 'grodan-gurra': [204, 0.38 * H, 0.85 * H], 'dinon-disa': [563, 0.48 * H, 0.905 * H], 'ankan-agda': [904, 0.38 * H, 0.85 * H],
  'musen-mille': [1197, 0.35 * H, 0.835 * H], 'fjarilen-fia': [362, 0.15 * H, 0.47 * H] };   // Fia mellan Gurras och Disas huvuden, under småbildernas båge (16d–16e)
const SLUT_BAT = { x: W / 2 - 26, y: 0.9 * H, h: 0.56 * H };               // som slutet/ (BAT): där 17 börjar. Stor och nära (granskningen); flyter på vattnet med skrovet ovanför bildkanten, huvudet under småbildernas båge
const VATTENLINJE = SLUT_BAT.y - 26 * SLUT_BAT.h / (0.5 * H);         // vågorna framför skrovet
const BAT_X0 = 0.38 * W;                                              // 16f: från vänster tredjedel (bygg.py)
// armarnas spetsar i 1024-rutan (bygg.py SPETS / spets_av), för att räkna om en punkt armen pekar mot till grader
const SPETS = { 'grodan-gurra': { 'arm-r': [895, 655], 'arm-l': [110, 660] }, 'ankan-agda': { 'arm-r': [858, 645], 'arm-l': [159, 654] } };
const UPP = [[1500, -700], [-480, -700]], MAGE = [[512, 760], [512, 760]];    // bygg.py RÖR: upp och mage
const DISA_MAGE = [[512, 700], [512, 700]];                                   // Disas armar framför kroppen: in på magen
const GURRA_UPP = [[1807, 186], [-792, 194]];   // Gurras ritade armar: snett upp och ut som i storyboarden (UPP gav dem rakt upp)

// ---------- duken ----------
const L = kit.duk('avsnitt/006-orange-baten/scener/lager/disco-prickar.png');   // ljusprickarna och stjärnorna som i slut.png
kit.lager.overst.setAttribute('transform', `translate(${-0.06 * W} ${-0.06 * H}) scale(${1.12 * W / 1920})`);   // kritsvep.js ritar i 1920 × 1080; 12 % större så att svepet täcker hela bilden, även högerkanten
const scen = L.plate.parentNode;
const defs = scen.querySelector('defs');
defs.insertAdjacentHTML('beforeend', `
  <filter id="sken" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="ikonkant" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="7"/></filter>
  <filter id="korn" x="0" y="0" width="1" height="1"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="2"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.47  0 0 0 0 0.36  1.1 0 0 0 -0.47"/></filter>`);
const ljus = discoljus.ny(L);   // kulan, käglorna och ljusfläckarna (../discoljus.js, samma i slutet/); definierar #kritkorn
const KRITA = { filter: 'url(#kritkorn)' };
// klistermärkets skiva som 005:s dekal (Sanna 2026-11-06: kanterna som rosa sångens): mjuk skugga, tjock vit stansad kant,
// en ljust orange skiva innanför med papperskorn
const klisterSkiva = g => {
  el('circle', { cx: 4, cy: 8, r: IKON_R, fill: '#9b5a2e', opacity: 0.25, filter: 'url(#sken)' }, g);
  const skiva = el('g', KRITA, g);
  el('circle', { r: IKON_R, fill: '#fff', filter: 'url(#ikonkant)' }, skiva);
  el('circle', { r: IKON_R - 9, fill: '#FFE6CF' }, skiva);
  el('circle', { r: IKON_R - 9, fill: '#000', filter: 'url(#korn)', opacity: 0.45 }, g);
};
const disco = el('g', {}, L.plate);
const stjarnaD = r => { const k = r * 0.28; return `M0 ${-r}L${k} ${-k}L${r} 0L${k} ${k}L0 ${r}L${-k} ${k}L${-r} 0L${-k} ${-k}Z`; };

// ---------- småbilderna i bågen under kulan (16a–16f): en vit kritskiva med saken i, som ikoner() i bygg.py ----------
// Klistermärken som i 005:s discot (Sanna, 2026-11-05: "match dance disco with the rosa sång for the sticker words, on words, no
// characters"): i 16a–16c slås saken upp ensam och stor mitt i bild på sitt ord (faller in lite ovanifrån, trycks ihop när den
// fastnar, vickar till), och flyger upp till sin plats i bågen strax innan nästa slås upp. Där trycks den ihop när den landar och
// gungar sedan lugnt i takt. I 16e gungar apelsinen extra.
const ikonG = el('g', {}, disco);
const passa = (g, href, [w0, h0], [bx0, by0, bx1, by1], botten, hh) => {   // bbox-höjden hh, bboxens botten på y = botten, mitt i x
  const s = hh / (by1 - by0), inre = el('g', { transform: `translate(0 ${botten}) scale(${s}) translate(${-(bx0 + bx1) / 2} ${-by1})` }, g);
  bild(href, inre, { width: w0, height: h0 });
  return inre;
};
// [bild, storlek, bbox] (saker i ikoner(): fisken 70, fågeln 90, västen 85, apelsinen 100, båten 95)
const SAKER = [['fisk', 70, [125, 221, 880, 793]], ['fagel', 90, [119, 220, 905, 859]], ['vastbild', 85, [122, 88, 906, 956]],
  ['apelsin', 100, [97, 70, 927, 959]], ['ikon-bat', 95, [25, 560, 988, 1105], 1324]];
const ikoner = IKON_BAGE.map(([x, y], i) => {
  const g = el('g', {}, ikonG), [namn, hs, bb, h0 = 1024] = SAKER[i], hh = hs * IKON_R / 60;
  klisterSkiva(g);
  const sak = el('g', {}, g);   // saken poppar 70 ms efter skivan (efterslänger)
  const inre = passa(sak, `${LAGER}${namn}.png`, [1024, h0], bb, hh * 0.45, hh * 0.9);
  if (namn === 'fisk') ansikten.bygg(inre, ansikten.FISK).satt('glad', { titt: 0.5 });   // lager/fisk.png är utan ansikte
  return { g, sak, x, y };
});
const FALL = 0.18, FLYG_TID = 0.5, STOR = { x: W / 2, y: 0.56 * H, skala: 2.6 };   // fallet in, flygturen upp, den stora mitt i bild
// slå upp: q = tid sedan den fastnade. Fallet in (q < 0) och fjädringen efteråt, tryckt mot sin underkant (som 005:s slag_upp)
function slagUpp(q, tilt) {
  if (q < 0) { const k = clamp(1 + q / FALL); return { dy: -46 * (1 - k * k), rot: tilt + 10 * (1 - k), sx: 1.15 - 0.15 * k, sy: 1.15 - 0.15 * k }; }
  const f = Math.exp(-q * 9) * Math.cos(q * 28);
  return { dy: 0, rot: tilt + 5 * Math.exp(-q * 6) * Math.sin(q * 26), sx: 1 + 0.12 * f, sy: 1 - 0.14 * f };
}
const satIkon = (ik, x, y, { dy, rot, sx, sy }, skala = 1) => ik.g.setAttribute('transform',
  `translate(${x.toFixed(1)} ${(y + dy).toFixed(1)}) rotate(${rot.toFixed(2)}) scale(${skala.toFixed(3)}) translate(0 ${IKON_R}) scale(${sx.toFixed(3)} ${sy.toFixed(3)}) translate(0 ${-IKON_R})`);

// ---------- rörelsesymbolerna: ett klistermärke i övre högra hörnet på varje sjungen rörelse, som 005:s discot ----------
// (Sanna, 2026-11-05: "on rosa the jump and clap and such had a symbol in right upper corner match it"). Samma vita kritskiva
// som småbilderna i bågen, motivet ritat i kod i orange (inga pilar, ingen text); slås upp på ordet och dras av när raden tar slut.
const SYMBOL = { x: 1150, y: 165, skala: 1.5 }, ORANGE = '#F08A24', INK = '#1d1d1d';
const ink = { stroke: INK, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' };
const symboler = {};
{
  // i lager.overst: står still i bildens hörn när kameran rör sig; en mjuk skugga under, så att den vita skivan syns i det ljusa
  const symG = el('g', { transform: `scale(${1920 / (1.12 * W)}) translate(${0.06 * W} ${0.06 * H})` }, L.overst),   // tar ut kritsvepets 1920-skala: bildens egna mått
     skiva = () => { const g = el('g', {}, symG);
    klisterSkiva(g); return { g, m: el('g', KRITA, g) }; };
  let d = skiva(), m = d.m;   // hoppa: en boll som studsar i en prickad båge
  for (const x of [-30, 30]) el('path', { d: `M${x - 10} 30L${x + 10} 30`, ...ink, 'stroke-width': 5 }, m);
  el('path', { d: 'M-30 20C-26 -40 26 -40 30 20', fill: 'none', ...ink, stroke: ORANGE, 'stroke-width': 6, 'stroke-dasharray': '1 11' }, m);
  d.boll = el('circle', { r: 11, fill: ORANGE, ...ink, 'stroke-width': 4 }, m);
  symboler.hoppa = d;
  d = skiva(); m = d.m;       // snurra: en spiral
  let sp = ''; for (let v = 0; v <= 3.6 * Math.PI; v += 0.15) sp += `${sp ? 'L' : 'M'}${(3.5 + 4.4 * v) * Math.cos(v)} ${(3.5 + 4.4 * v) * Math.sin(v)}`;
  d.spiral = el('g', {}, m);
  el('path', { d: sp, fill: 'none', ...ink, 'stroke-width': 12 }, d.spiral);
  el('path', { d: sp, fill: 'none', ...ink, stroke: ORANGE, 'stroke-width': 6 }, d.spiral);
  symboler.snurra = d;
  d = skiva(); m = d.m;       // klappa: två tassar som slår ihop
  d.tassar = [-1, 1].map(sd => { const g = el('g', {}, m);
    el('ellipse', { cx: 0, cy: 2, rx: 14, ry: 21, fill: '#EAD6C2', ...ink, 'stroke-width': 4 }, g);
    el('ellipse', { cx: 0, cy: 9, rx: 7, ry: 7, fill: '#F7B6D2' }, g);
    for (const [x, y] of [[-7, -9], [0, -12], [7, -9]]) el('circle', { cx: x, cy: y, r: 3.2, fill: '#F7B6D2' }, g);
    return { g, sd }; });
  symboler.klappa = d;
  d = skiva(); m = d.m;       // dansa: två noter
  d.noter = el('g', {}, m);
  el('path', { d: 'M-5 16L-5 -21L21 -28L21 9', fill: 'none', ...ink, 'stroke-width': 6 }, d.noter);
  el('path', { d: 'M-5 -21L21 -28L21 -19L-5 -12Z', fill: INK, ...ink, 'stroke-width': 3 }, d.noter);
  for (const [x, y] of [[-13, 17], [13, 10]]) el('ellipse', { cx: x, cy: y, rx: 10, ry: 7, transform: `rotate(-22 ${x} ${y})`, fill: ORANGE, ...ink, 'stroke-width': 4 }, d.noter);
  symboler.dansa = d;
  for (const k in symboler) { symboler[k].g.style.display = 'none'; window.kant?.lagg(symboler[k].g, { andel: 0.01 }); }
}

// ---------- stjärnregn runt den som är i fokus ----------
const regnG = el('g', {}, L.plate);
const regn = [0, 1, 2, 3].map(i => {
  const g = el('g', KRITA, regnG);
  el('circle', { r: 11, fill: '#ffd6aa', opacity: 0.7, filter: 'url(#sken)' }, g);
  el('path', { d: stjarnaD(i % 2 ? 0.013 * W : 0.01 * W), fill: '#fff' }, g);
  return g;
});
function stjarnregn(t, x, y, r) {   // fyra stjärnor i en båge över figuren; de faller lite och tindrar, en i taget
  regnG.style.display = '';
  regn.forEach((g, i) => {
    const v = (150 - i * 40) * Math.PI / 180, k = (fas(t) / 2 + i / 4) % 1;
    g.setAttribute('transform', `translate(${x + r * Math.cos(v)} ${y - r * Math.sin(v) + 26 * k}) rotate(${12 * Math.sin(t * 2 + i)}) scale(${0.75 + 0.35 * Math.sin(k * Math.PI)})`);
    g.setAttribute('opacity', clamp(Math.sin(k * Math.PI) * 1.6));
  });
}

// ---------- figurerna (ritordning bakifrån som alla() i bygg.py: Fia, Mille, Gurra, Agda, Disa) ----------
const skuggG = el('g', {}, L.figurer), figG = el('g', {}, L.figurer);
const turLjus = el('ellipse', { fill: '#FFFBE6', filter: 'url(#ljusoskarpa)', ry: 46, opacity: 0 }, skuggG);   // 15g: ljuset på den som har sin tur
const skugga = () => el('ellipse', { fill: '#46403c', opacity: 0.3, filter: 'url(#kritkant)' }, skuggG);
const satSkugga = (e, x, fot, bred, luft) => { const k = 1 - 0.4 * luft; e.style.display = ''; e.setAttribute('cx', x); e.setAttribute('cy', fot - 4);
  e.setAttribute('rx', bred * 0.7 / 2 * k); e.setAttribute('ry', 16 * k); };
const fig = {};
for (const slug of ['fjarilen-fia', 'musen-mille', 'grodan-gurra', 'ankan-agda']) {
  const f = await kit.figur(slug, { h: SOLO_H, forelder: figG });
  fig[slug] = { f, a: slug === 'ankan-agda' ? null : ansikten.iFigur(f), sk: skugga() };   // Agdas näbb är hennes mun: kit-ansiktet
}
// Gurras och Agdas armar framför kroppen, som figur() i bygg.py ritar dem (bakom kroppen gömdes de när de lyfts)
for (const slug of ['grodan-gurra', 'ankan-agda']) { const f = fig[slug].f; for (const n of ['arm-l', 'arm-r']) f.inre.insertBefore(f.delar[n], f.ansikte); }
{ const f = fig['musen-mille'].f; for (const n of ['arm-l', 'arm-r']) f.inre.append(f.delar[n]); }   // musens armar framför magen, för klappen
const disa = await baten.disa(figG, { h: SOLO_H });
fig['dinon-disa'] = { f: disa, sk: skugga() };
// båten med Disa (16f), som i slutet/: vit kant, vågorna framför
const bat = await baten.ny(L.figurer, { vit: true });
const vagor = baten.vagor(L.figurer, VATTENLINJE);

const BRED = { 'dinon-disa': 711 / 763, 'grodan-gurra': 664 / 758, 'ankan-agda': 663 / 762, 'musen-mille': 741 / 820, 'fjarilen-fia': 0 };   // bredd/höjd (skuggan)
const lerpPt = (p, q, k) => [lerp(p[0], q[0], k), lerp(p[1], q[1], k)];
const skalaHopp = (hp, a) => ({ y: hp.y * a, sx: 1 + (hp.sx - 1) * a, sy: 1 + (hp.sy - 1) * a, ben: hp.ben * a });   // ett hopp med akt
function armGrader(f, sida, [mx, my]) {   // bygg.py vinkel_mot (moturs) → SVG-grader (medurs)
  const [px, py] = f.rigg.delar[sida].vridpunkt, [sx, sy] = SPETS[f.slug][sida];
  return -(Math.atan2(py - my, mx - px) - Math.atan2(py - sy, sx - px)) * 180 / Math.PI;
}

// En figur i bild: x, h (figurens höjd), fot (fötternas y). rorelse: Disa och Agda 'upp' eller 'mage', statisterna sin egen
// (EGEN i bygg.py: Gurra hoppar med armarna upp, Fia snurrar i luften, Mille klappar med armarna upp). Allt på slagen.
// opt: hopp (ett färdigt hopp), hoppar (Disa hoppar i 'upp'), t0/t1 (radens gränser, Fias varv), solo (tittar in i kameran),
// titt (åt vilket håll de tittar), vand (sx-faktor, används inte: figurerna är platta och snurrar inte), akt (0..1 i raden: hur mycket av den stora rörelsen figuren gör;
// 0 = vilar och gungar, Disa och Agda med händerna på magen, 1 = hela rörelsen; glider mellan dem så att poserna aldrig hoppar),
// ogla (0..1: hur långt Fia har kommit i sin ögla)
// Ger { x, y, h } för stjärnregnet.
const SIDA_M = { r: 1, l: -1 };
function pose(slug, t, x, h, fot, rorelse, opt = {}) {
  const { f, a, sk } = fig[slug], k = h / SOLO_H;
  let hp = STILL, tilt = 0, dx = 0, luft = 0;
  const titt = opt.solo ? 0 : clamp((RAD['dinon-disa'][0] - x) / 300, -0.6, 0.6);   // i raden tittar de mot Disa
  const A = opt.akt;
  if (slug === 'dinon-disa') {
    let r = UPP[0], l = UPP[1];
    if (A !== undefined) {   // i raden: glider mellan magen (0) och armarna upp med hopp (1)
      const v = Math.abs(sv(t));
      r = lerpPt(DISA_MAGE[0], [1500, -700 + 300 * v], A); l = lerpPt(DISA_MAGE[1], [-480, -700 + 300 * v], A);
      tilt = lerp(5, 6, A) * sv(t, 0.5); if (opt.hoppar) hp = skalaHopp(taktHopp(t, 0.8 * HOPP * k), A);
      rorelse = A > 0.5 ? 'upp' : 'mage';
    } else if (rorelse === 'upp') { const v = Math.abs(sv(t)); r = [1500, -700 + 300 * v]; l = [-480, -700 + 300 * v];
      tilt = 6 * sv(t, 0.5); if (opt.hoppar !== false) hp = taktHopp(t, 0.8 * HOPP * k); }
    if (rorelse === 'mage') { [r, l] = DISA_MAGE; tilt = 5 * sv(t, 0.5); }
    if (opt.hopp) hp = opt.hopp;
    f.pose({ x, y: fot + hp.y, k, sx: hp.sx * (opt.vand ?? 1), sy: hp.sy, tilt, r, l, delar: benHopp(hp.ben),
      humor: kort(t) ? (rorelse === 'mage' ? 'karleksfull' : 'skrattar') : 'glad', titt: opt.titt ?? (opt.solo ? 0 : 0.3), blink: blinkar(t, 0.4) });
  }
  if (slug === 'ankan-agda') {
    let peka = UPP, grader = null;
    if (A !== undefined) {   // i raden: glider mellan magen (0) och armarna upp (1), i armarnas vinklar
      const v = Math.abs(sv(t)), upp = [[1500, -700 + 300 * v], [-480, -700 + 300 * v]];
      grader = ['arm-r', 'arm-l'].map((n, i) => lerp(armGrader(f, n, MAGE[i]), armGrader(f, n, upp[i]), A));
      tilt = -lerp(5, 6, A) * sv(t, 0.5); if (opt.hoppar) hp = skalaHopp(taktHopp(t, 0.6 * HOPP * k), A);
    } else if (rorelse === 'upp') { const v = Math.abs(sv(t)); peka = [[1500, -700 + 300 * v], [-480, -700 + 300 * v]]; tilt = -6 * sv(t, 0.5); }
    if (rorelse === 'mage') { peka = MAGE; tilt = -5 * sv(t, 0.5); }
    if (opt.hopp) hp = opt.hopp;
    f.pose({ x, y: fot + hp.y, k, sx: hp.sx * (opt.vand ?? 1), sy: hp.sy, tilt, delar: { ...benHopp(hp.ben), 'arm-r': grader ? grader[0] : armGrader(f, 'arm-r', peka[0]), 'arm-l': grader ? grader[1] : armGrader(f, 'arm-l', peka[1]) },
      ogon: kort(t) ? 'happy' : 'open', titt: opt.titt ?? titt, blink: blinkar(t, 1.9) });
  }
  if (slug === 'grodan-gurra') {   // Hoppa, hoppa!: armarna upp och ett hopp på varje slag; med akt 0 armarna nere och ett lugnt gung
    const G = A ?? 1;
    hp = skalaHopp(taktHopp(t, HOPP * k), G);
    const v = hp.ben;

    const x = SLUT_BAT.x + 12 * u + (BAT_X0 - (SLUT_BAT.x - 12 * (SLUT - START['16f']))) * Math.pow(1 - del(START['16f'], SLUT, t), 2);
    const tut = kit.bussTut(t, TUT);
    vagor.g.style.display = '';
    bat.pose({ x, y: SLUT_BAT.y - 4 * Math.abs(Math.sin(Math.PI * f)) + 2.5 * tut.lyft, h: SLUT_BAT.h, tilt: 1.6 * Math.sin(Math.PI * f / 2),
      sx: 1 + 2 * (tut.sx - 1), sy: 1 + 2 * (tut.sy - 1),
      humor: tut.ogon ? 'skrattar' : 'glad', r: [1500, -500 + 700 * Math.sin(f * Math.PI)], blink: blinkar(t, 0.5) });
    vagor.rita(t, 40);
    // kameran svävar (kit.kamera) med scenens egen tid; slutet/ börjar om på 0, så 16f flyttar sig så att klippet inte hoppar
    kam = [W / 2 + 4 * (Math.sin(0) - Math.sin(SLUT * 0.5)), H / 2 + 3 * (Math.sin(1) - Math.sin(SLUT * 0.37 + 1)), 1];
  }
  kit.kamera(...kam);
}

kit.kor(render, SLUT, { sang: [SANG0, SANG0 + SLUT] });
})();
