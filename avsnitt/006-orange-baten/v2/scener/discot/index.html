<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><title>006 v2 · discot (15a–16f, 17)</title>
<style>html,body{margin:0;background:#222;overflow:hidden}svg{display:block;width:100vw;height:auto}</style></head>
<body>
<!-- 006 v2, scen discot: storyboard-v2 15a–16f och kritirisen (17), avsnittstid 2:50.6–3:41.9 (sångtid 2:41.6–3:32.9). Rakt klipp
     från bryggan. v1:s ljusorange discoplatta och orange kula (../../../scener/lager/), fyra v2-figurer live ur riggarna: Disa,
     Agda, Gurra och Fia (Sanna 2026-11-26: fyra dansare, ingen Mille). Solona: Gurra hoppar, Fia flyger en ögla (vänds aldrig),
     Agda klappar. Fisken, fågeln, västen, apelsinen och båten poppar upp i bågen. Hej då: alla vinkar en i taget, Disa med
     riggens vink (kit.js). Sist sluter sig kritirisen runt Disas ansikte och det blir svart; prenumerera-kortet öppnar ur svart. -->
<svg id="scen" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="boil" filterUnits="userSpaceOnUse" x="-100" y="-100" width="2120" height="1280">
      <feTurbulence id="brus" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
      <feDisplacementMap id="flytt" in="SourceGraphic" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="mjuk" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="irisrand" filterUnits="userSpaceOnUse" x="-200" y="-200" width="2320" height="1480">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9"/><feDisplacementMap in="SourceGraphic" scale="26" xChannelSelector="R" yChannelSelector="G"/></filter>
  </defs>
  <g id="kamera">
    <image href="/avsnitt/006-orange-baten/scener/lager/disco-prickar.png" width="1920" height="1080" preserveAspectRatio="none"/>
    <g id="ljus"></g>
    <g filter="url(#boil)">
      <g id="kula"></g>
      <g id="ikoner"></g>
      <g id="figurer"></g>
      <g id="streck"></g>
    </g>
  </g>
  <g id="iris"></g>
</svg>
<script src="/verktyg/blinka.js"></script>
<script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script src="/verktyg/kritan-ritar.js"></script>
<script src="../kit.js"></script>
<script>
const E0 = 170.6, E1 = 221.9, DURATION = E1 - E0;
const R = '/assets/rekvisita/', LAGER = '/avsnitt/006-orange-baten/scener/lager/';
const B0 = 61.3;   // refrängens första slag (avsnittstid); slagen ligger på B0 + n · SLAG
const slagFas = E => ((E - B0) / SLAG % 1 + 1) % 1;

// Figurerna: [rigg, skala, fötter x, y]. Större 2026-11-26 (Sanna: "bigger animals in dance disco"). V-raden: Gurra, Disa (fram, störst), Agda; Fia flyger ovanför till höger.
const FIG = {
  disa: { slug: 'dinon-disa', s: 0.8, x: 960, y: 1050, fro: 11 },
  agda: { slug: 'ankan-agda', s: 0.72, x: 1480, y: 1005, fro: 37 },
  gurra: { slug: 'grodan-gurra', s: 0.72, x: 440, y: 1005, fro: 53 },
  fia: { slug: 'fjarilen-fia', s: 0.42, x: 1800, y: 600, fro: 23 },
};
const HEL = [960, 540, 1], GURRA = [500, 630, 1.2], FIAK = [1560, 470, 1.2], AGDAK = [1430, 630, 1.2], ALLA = [960, 570, 1.05];

// Tider (avsnittstid, storyboard-v2): 15a 170.6 danspaus, 15c 180.2 Gurra, 15d 182.6 Fia, 15e 184.8 Agda, 15f 187.3 alla,
// 16a 199.0 fisken, 16b 200.4 fågeln, 16c 202.7 väst/apelsin/båt, 16d 207.8 magen, 16e 209.9, 16f 212.4 hej då, iris 219.5.
const AGDA_IN = [173.0, 173.8], IKON_T = [199.2, 200.6, 202.9, 203.8, 204.8], HEJ = 212.4, IRIS = 219.5;
const kamAt = E => E < 180.2 ? kamMix(HEL, ALLA, (E - 173.8) / 6) : E < 182.6 ? GURRA : E < 184.8 ? FIAK : E < 187.3 ? AGDAK
  : E < 199.0 ? kamMix(ALLA, HEL, 0.5 - 0.5 * Math.cos((E - 187.3) / 11.7 * 2 * Math.PI)) : E < 212.4 ? HEL : kamMix(HEL, [960, 540, 1.35], (E - 216.5) / 3);
const syns = (n, E) => n === 'disa' || (n === 'agda' && E >= AGDA_IN[0]) || (n === 'gurra' && E >= 180.2) || (n === 'fia' && E >= 182.6);

// Varje figurs [ansikte, pose, dx, dy] vid avsnittstid E (dx, dy flyttar gruppen; poserna tar figurens egen rigg).
function lage(n, F, E) {
  const L = F.L, P = o => ({ ...L.POSE0, ...o }), takt = (E - B0) / (2 * SLAG);   // dansa: ett gung per två slag
  const tittaUpp = E >= 199.0 && E < 207.8, magen = E >= 207.8 && E < 212.4, hej = E >= HEJ;
  if (hej) {   // vinkar en i taget, 0,25 s isär: Gurra, Disa, Agda, Fia
    const u = E - HEJ - { gurra: 0, disa: 0.25, agda: 0.5, fia: 0.75 }[n];
    if (n === 'fia') { const [f, p] = L.ROR.flaxa(E); return [f, p, 0, 0]; }
    if (n === 'disa') return [L.param('jatteglad'), { ...P({}), ...vink(Math.max(0, u), 7.5) }, 0, 0];
    return [L.param('jatteglad'), P({ armar: [0, Math.max(0, Math.min(1, u / 0.4)) * (60 + 15 * Math.sin(2 * Math.PI * 1.25 * u))], luta: 2 * Math.sin(2 * Math.PI * 1.25 * u) }), 0, 0];
  }
  if (magen) return [L.param('glad'), { ...L.blandaPose('neutral', 'magen', 1), luta: 3 * Math.sin(Math.PI * (E - B0) / (2 * SLAG)) }, 0, 0];
  if (n === 'fia') {
    if (E < 185.4 && E >= 182.6) {   // ögla på fyra slag (182.8–185.1), sedan svävar hon; aldrig vänd
      const u = kl((E - 182.8) / (4 * SLAG)), a = mjuk(u) * 2 * Math.PI, [f, p] = L.ROR.flaxa(E);
      return [L.param('jatteglad'), p, -130 * Math.sin(a), -130 + 130 * Math.cos(a) - 0];
    }
    const [f, p] = L.ROR.flaxa(E); return [tittaUpp ? L.param('forvanad') : f, { ...p, upp: tittaUpp ? -1 : 0 }, 0, 0];
  }
  if (n === 'agda' && E < AGDA_IN[1]) { const u = kl((E - AGDA_IN[0]) / (AGDA_IN[1] - AGDA_IN[0]));   // hoppar in från höger
    return [L.param('jatteglad'), P({ armar: [50, 50] }), (1 - u) * 900, -360 * Math.sin(Math.PI * u)]; }
  const solo = { gurra: [180.2, 182.6], agda: [184.8, 187.3] }[n];
  if (solo && E >= solo[0] && E < solo[1]) {
    if (n === 'gurra') { const [f, p] = L.ROR.hoppa((E - solo[0]) * 2.08); return [f, p, 0, 0]; }   // ett hopp per två slag
    const [f, p] = L.ROR.klappa(((E - solo[0] + 0.5) % 1.5) + 0.5); return [L.param('fnissig'), p, 0, 0];   // klapp på slagen
  }
  // dansar (i solot för någon annan: lugnt gung)
  const iSolo = E >= 180.2 && E < 187.3, [f, p] = L.ROR.dansa(((takt % 4) + 4) % 4);
  if (tittaUpp) { const k = del(199.0, 199.6, E); return [L.blanda('forvanad', 'glad', del(199.6, 200.2, E)), { ...p, armar: p.armar.map(a => a * (1 - k)), upp: -k }, 0, 0]; }
  return [iSolo ? L.param('glad') : f, iSolo ? { ...P({}), luta: 2 * Math.sin(E * 2) } : p, 0, 0];
}

// Ikonerna i bågen överst: fisken, fågeln, västen, apelsinen, båten.
const IKON_X = [220, 470, 1250, 1480, 1710], ikonY = x => 140 + 0.00018 * (x - 960) ** 2;
const VAST_IKON = `<g><path d="M-58 50 L-58 -20 Q-50 -48 -20 -50 L-6 -50 L-6 50Z M58 50 L58 -20 Q50 -48 20 -50 L6 -50 L6 50Z" fill="#FF7A21" stroke="#fff" stroke-width="8" stroke-linejoin="round" paint-order="stroke"/>
  <rect x="-58" y="6" width="52" height="9" fill="#FFF6E8"/><rect x="6" y="6" width="52" height="9" fill="#FFF6E8"/><rect x="-10" y="2" width="20" height="16" rx="4" fill="#5b5b66"/></g>`;
const IKON = [
  `<image href="${R}fisk-orange-v2/cut/fisk-orange-v2.png" x="-75" y="-57" width="150" height="114"/>`,
  `<image href="${R}fagel-orange-v2/delar/fagel-hel.png" x="-95" y="-95" width="190" height="190"/>`,
  VAST_IKON,
  `<image href="${R}apelsin-v2/cut/apelsin-v2.png" x="-62" y="-57" width="124" height="113"/>`,
  `<image href="${R}orange-baten-v2/cut/orange-baten-v2.png" x="-95" y="-35" width="190" height="70"/>`,
];
function ikoner(E) {
  $('ikoner').innerHTML = IKON.map((h, i) => { const u = E - IKON_T[i]; if (u < 0) return '';
    const x = IKON_X[i], y = ikonY(x) + 6 * Math.sin(E * 2 + i), extra = i === 3 && E > 209.9 && E < 212.4 ? 1 + 0.12 * Math.abs(Math.sin(Math.PI * (E - 209.9) / SLAG)) : 1;
    return `<g transform="translate(${x} ${y.toFixed(1)}) scale(${(1.35 * pop(u * 0.9) * extra).toFixed(3)}) rotate(${(4 * Math.sin(E * 1.7 + i)).toFixed(1)})">${h}</g>` + gnistor(x, y, 110, u * 1.5, 4); }).join('');
}

// Kulan och ljuset (som 013:s disco()): kulan gungar, fyra mjuka ljuskäglor, ljusfläckar på golvet som byter färg på slaget.
function ljus(E) {
  const s = E - B0, gung = Math.sin(s / SLAG * Math.PI), kagla = v => { const r = v * Math.PI / 180, L = 1300, b = 0.16;
    return `M960 230 L${(960 + L * Math.sin(r - b)).toFixed(0)} ${(230 + L * Math.cos(r - b)).toFixed(0)} L${(960 + L * Math.sin(r + b)).toFixed(0)} ${(230 + L * Math.cos(r + b)).toFixed(0)}Z`; };
  $('ljus').innerHTML = `<g opacity="${(0.2 + 0.06 * gung).toFixed(3)}" filter="url(#mjuk)">${[-50, -18, 18, 50].map((v, i) => `<path d="${kagla(v + 6 * Math.sin(s * 0.7 + i))}" fill="#FFF6EC"/>`).join('')}</g>
    ${[[520, 960, 170], [960, 1010, 200], [1400, 950, 160]].map(([x, y, r], i) => `<ellipse cx="${(x + 120 * Math.sin(s * 0.5 + i * 2)).toFixed(0)}" cy="${y}" rx="${r}" ry="${r * 0.3}" fill="${['#FFF0B0', '#FFFFFF', '#FFD8A8'][(i + Math.floor(s / SLAG / 4)) % 3]}" opacity="0.35" filter="url(#mjuk)"/>`).join('')}`;
  $('kula').innerHTML = `<g transform="rotate(${(2 * Math.sin(s * 1.2)).toFixed(2)} 960 0)"><image href="${LAGER}discokula-orange.png" x="${960 - 150}" y="-30" width="300" height="300"/></g>`;
}

// Kritirisen (som prenumerera-kortets): krämvit vinglig ring runt Disas ansikte, 1400 → 240 på 1,1 s, står 0,35 s, → 0 på 0,5 s, svart.
function iris(E) {
  if (E < IRIS) { $('iris').innerHTML = ''; return; }
  const u = E - IRIS, r = u < 1.1 ? lerp(1400, 240, mjuk(u / 1.1)) : u < 1.45 ? 240 : lerp(240, 0, mjuk((u - 1.45) / 0.5));
  const fig = FIG.disa.fig;
  const c = punkt($('iris'), fig.querySelector('.kropp'), 512, 430);
  $('iris').innerHTML = r < 1 ? '<rect width="1920" height="1080" fill="#000"/>' : `<path fill="#000" fill-rule="evenodd" d="M-50 -50 H1970 V1130 H-50Z M${(c.x - r).toFixed(1)} ${c.y.toFixed(1)} a${r.toFixed(1)} ${r.toFixed(1)} 0 1 0 ${(2 * r).toFixed(1)} 0 a${r.toFixed(1)} ${r.toFixed(1)} 0 1 0 ${(-2 * r).toFixed(1)} 0Z"/>
    <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="${r.toFixed(1)}" fill="none" stroke="#FBF3E0" stroke-width="${Math.min(22, r * 0.12).toFixed(1)}" filter="url(#irisrand)"/>`;
}

function rita(t) {
  if (!FIG.fia.fig) return;
  const E = E0 + t;
  ljus(E); ikoner(E);
  for (const [n, F] of Object.entries(FIG)) {
    F.g.style.display = syns(n, E) ? '' : 'none'; if (!syns(n, E)) continue;
    const [f, p, dx, dy] = lage(n, F, E);
    F.g.setAttribute('transform', `translate(${(F.x + dx).toFixed(1)} ${(F.y + dy).toFixed(1)})`);
    F.L.rita(F.fig, F.blinka(f, E), p);
    if (n === 'disa') vinkStreck($('streck'), F.fig, p.vinkFart || 0);
  }
  const [cx, cy, z] = kamAt(E); kamera(cx, cy, z, E);
  iris(E);
}

const EF = 'assets/ljud/effekter/';
function ljud() {
  const ut = [{ t: AGDA_IN[1], fil: EF + 'boing/boing-1.m4a', vol: 0.6 }, { t: 182.8, fil: EF + 'vingflax/vingflax-1.m4a', vol: 0.6 }];
  IKON_T.forEach((t, i) => ut.push({ t, fil: EF + `pop/pop-${1 + i % 2}.m4a`, vol: 0.7 }));
  ut.push({ t: IRIS + 1.3, fil: EF + 'tindra/tindra-3.m4a', vol: 0.7 });
  return ut.map(c => ({ ...c, t: c.t - E0 }));
}

window.DURATION = DURATION;
window.SANG = [E0 - SANG0, E1 - SANG0 - 0.4];   // sången tonas ut under kritirisen (render.mjs: 0,4 s uttoning i slutet)
window.seek = t => { window.stilla = true; rita(t); };
window.render = window.seek;
window.ready = (async () => {
  for (const n of ['gurra', 'disa', 'agda', 'fia']) { const F = FIG[n];
    F.L = await v2rigg(F.slug); F.g = document.createElementNS(NS, 'g'); $('figurer').appendChild(F.g);
    F.fig = F.L.figur(0, 0, F.s, F.g); F.blinka = skapaBlinka(F.fro);
    if (n === 'fia') F.fig.querySelectorAll('.skugga').forEach(e => e.style.display = 'none'); }
  await Promise.all([LAGER + 'disco-prickar.png', LAGER + 'discokula-orange.png', R + 'fisk-orange-v2/cut/fisk-orange-v2.png', R + 'fagel-orange-v2/delar/fagel-hel.png']
    .map(u => new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = u; })));
  window.LJUD = ljud();
  const q = new URLSearchParams(location.search).get('t');
  rita(q ? +q - E0 : 0);
  return true;
})();
const start = performance.now();
(function loop() { if (!window.stilla && FIG.fia.fig) rita(((performance.now() - start) / 1000) % DURATION); requestAnimationFrame(loop); })();
</script>
</body></html>
