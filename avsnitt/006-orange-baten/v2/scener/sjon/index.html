<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><title>006 v2 · sjön (03–09f)</title>
<style>html,body{margin:0;background:#222;overflow:hidden}svg{display:block;width:100vw;height:auto}</style></head>
<body>
<!-- 006 v2, scen sjön: storyboard-v2 03–09f, avsnittstid 0:33.2–1:59.4 (sångtid 0:24.2–1:50.4), slutar mitt i det orangea kritsvepet.
     Disa i båten (kit.js, som provet), Fia landar på flaggstången (04–04a), fisken (06–06b), fågeln (07–07b), västen och flaggan (08–08c),
     refräng 1 och 2 (05a–05f, 09a–09f) med v1:s orange värld (sjön blir orange, solen, kritans regnbåge, fisken hoppar på ekona, fågeln på "Titta ut!") och apelsinbubblan. Inga repliker (Sanna 2026-11-26).
     ?t=<avsnittstid> visar en bild. Render: node verktyg/render-delat.mjs avsnitt/006-orange-baten/v2/scener/sjon [--snabb] -->
<svg id="scen" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="boil" filterUnits="userSpaceOnUse" x="-100" y="-100" width="2120" height="1280">
      <feTurbulence id="brus" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
      <feDisplacementMap id="flytt" in="SourceGraphic" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- refrängens orange sjö (v1:s sjon-orange): sjöbilden i ljusstyrka → persika himmel, orange vatten, ljusa vågkammar -->
    <filter id="tillorange" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncR type="table" tableValues="0.45 0.6 0.78 0.87 1 1"/><feFuncG type="table" tableValues="0.16 0.24 0.34 0.44 0.8 0.96"/>
        <feFuncB type="table" tableValues="0.04 0.05 0.08 0.12 0.62 0.9"/></feComponentTransfer></filter>
    <clipPath id="torka"><path id="torka-yta" d="M0 0"/></clipPath>
    <clipPath id="ovanhorisont"><rect x="-400" y="-400" width="2800" height="988"/></clipPath>
    <clipPath id="ovanvatten"><rect x="-200" y="-400" width="2400" height="1268"/></clipPath>
  </defs>
  <g id="kamera">
    <g id="sjon"><image href="/assets/bakgrunder/sjon-v2/sjon-v2.png" width="1920" height="1080"/><image href="/assets/bakgrunder/sjon-v2/sjon-v2.png" x="1918" width="1920" height="1080"/></g>
    <g id="orangevarld" clip-path="url(#torka)" style="display:none"><use href="#sjon" filter="url(#tillorange)"/>
      <g clip-path="url(#ovanhorisont)"><g filter="url(#boil)"><g id="sol"></g><g id="bage"></g></g></g></g>
    <g filter="url(#boil)">
      <g id="fagelbak"></g>
      <g id="batlager"></g>
      <g id="fram">
        <g id="fisk" clip-path="url(#ovanvatten)"></g>
        <g id="plask"></g>
        <g id="fagel"></g>
        <g id="bubbla"></g>
        <g id="bagekrita"></g>
      </g>
    </g>
  </g>
  <g id="ram"></g>
</svg>
<script src="/verktyg/blinka.js"></script>
<script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script src="/verktyg/kritan-ritar.js"></script>
<script src="../kit.js"></script>
<script>
const E0 = 33.2, E1 = 119.4, DURATION = E1 - E0;   // avsnittstid; kritsvepet 118.6–120.2, klippet vid 119.4

// Kameror [cx, cy, zoom]. HEL: båten och himlen; NAR: Disa (provet, godkänt); HALV: Disa och fören (fisken, fågeln); REF: refrängen.
// Tätare som v1 (Sanna 2026-11-26 "match close crops better to og video"): helbilden har båten på ca 60 % av bredden, närbilden Disa på ca 70 % av höjden.
// HEL 25 px högre (Sanna 2026-11-26 "flytta kameran upp lite" vid 0:53). REF = HEL: refrängen börjar utan ett litet hoppklipp
// (förut 5 % zoom vid 1:01, "klippen ser för hackiga ut").
const HEL = [975, 560, 1.95], HEL0 = [975, 600, 1.7], NAR = [975, 490, 2.7], HALV = [1130, 590, 1.8], REF = HEL, REFIN = [1090, 520, 2.1], VAST_K = [985, 620, 3.2];
// FISK_K: fisken guppar och hoppar framför fören (06a–06b). Lägre och lite vidare än HALV, så att fisken och plasken syns hela
// (Sanna 2026-11-26 "show the fish more clearly" vid 1:21: förut låg vattenytan i bildens underkant och fisken klipptes av).
const FISK_K = [1190, 650, 1.5];
const B_X = 960, B_Y = 760;
const REF0 = [61.3, 105.0];   // refrängernas början (avsnittstid)   // båtens vattenlinje mitt

let B, FIA, LF;   // båten (kit.js), Fias grupp och rigg
const G = n => B.L.param(n), BP = (a, b, k = 1) => B.L.blandaPose(a, b, k), BF = (a, b, k) => B.L.blanda(a, b, k);
const NEU = () => ({ ...B.L.POSE0 });
// pekar med en arm: höger = Disas egen pekpose, vänster = samma speglad; huvudet vänds dit (aldrig bada: båda armarna på en sida)
const pekH = k => ({ ...BP('neutral', 'pekar', k), rikt: 0.6 * k }), pekV = k => ({ ...NEU(), armar: [16 * k, 0], luta: -k, boj: -2.5 * k, rikt: -0.6 * k });
const klapp = tl => (B.L.ROR.klappa ? B.L.ROR.klappa(tl)[1] : NEU());   // riggens klapp (3 klapp på 1,0, 1,5 och 2,0 s i en 3 s-slinga)
const pulsar = (tl, ts, d = 0.3) => ts.reduce((a, t0) => a + (tl >= t0 && tl < t0 + d ? Math.sin(Math.PI * (tl - t0) / d) : 0), 0);

// --- Refrängen (05a–05f / 09a–09f): sex rader à 2,3 s (fyra slag). Vattnet står still, himlen glöder. ---------------------------
function refrang(E, nr) {
  const R = (t, namn, kam, fn) => [E + t, namn, kam, 0, fn];
  const upp = u => 0.5 + 0.5 * Math.cos(Math.PI * Math.max(0, u - 0.12) / SLAG);   // upp på rösten, ner på ekot
  return [
    R(0, `${nr}a`, REF, tl => [G('jatteglad'), BP('neutral', 'hurra', upp(tl))]),
    R(2.3, `${nr}b`, REF, tl => [G('glad'), { ...BP('neutral', 'magen'), luta: 4 * Math.sin(Math.PI * tl / (2 * SLAG)) }]),
    R(4.6, `${nr}c`, REF, tl => [G('jatteglad'), BP('neutral', 'hurra', upp(tl))]),
    R(6.9, `${nr}d`, REFIN, tl => [BF('glad', 'kawaii', del(0, 0.4, tl)), { ...BP('neutral', 'pekar'), upp: -0.6 }]),   // kawaii (1 och 2 av 3)
    R(9.2, `${nr}e`, REF, tl => [G('jatteglad'), { ...NEU(), armar: Array(2).fill(30 * pulsar(tl, [2 * SLAG, 3 * SLAG], 0.4)) }]),
    R(11.5, `${nr}f`, NAR, tl => tl < 1.15 ? [G('nyfiken'), pekH(1)] : [G('nyfiken'), pekV(del(1.15, 1.6, tl))]),
  ];
}

// --- Skottlistan: [avsnittstid, namn, kamera, fart, (tl, d) => [ansikte, pose]] --------------------------------------------------
const S = [
  [33.2, '03', HEL, 1, () => [G('glad'), NEU()]],
  [35.2, '03a', NAR, 1, tl => [G('jatteglad'), { ...NEU(), ...vink(tl, 2.2) }]],
  [37.4, '03b', NAR, 1, tl => [G('glad'), { ...NEU(), rikt: 0.6 * del(0, 0.5, tl) }]],
  [39.3, '04', HEL0, 1, () => [G('glad'), NEU()]],                       // kameran glider in (se kam()); Fia fladdrar in och landar
  [43.2, '041', NAR, 1, tl => [G('fnissig'), { ...NEU(), rikt: -0.5, armar: Array(2).fill(-6 - 14 * Math.abs(Math.sin(Math.PI * tl / SLAG))) }]],   // klappar på relingen, tittar mot Fia
  [47.6, '042', HEL, 1, () => [G('jatteglad'), NEU()]],                  // båten hoppar på varje tut
  // pekar åt vänster och åt höger: bara den armen lyfts (Disas pekpose, speglad åt vänster) och huvudet vänds dit; riktningsposen
  // (bada) lade båda armarna på samma sida, den ena under den andra.
  [51.2, '04a', HEL, 1, tl => [G('nyfiken'), pekV(del(0, 0.5, tl) - del(4.5, 5.0, tl))]],
  [56.2, '04b', HEL, 1, tl => [G('nyfiken'), pekH(del(0, 0.5, tl))]],
  ...refrang(61.3, '05'),
  // fisken hoppar (75.3): förvånad medan den är i luften, jätteglad med armarna upp när den plaskar ner (reaktionsslaget)
  [74.9, '06', HEL, 1, tl => [tl < 1.6 ? BF('glad', 'forvanad', del(0.3, 0.6, tl)) : BF('forvanad', 'jatteglad', del(1.6, 1.95, tl)),
    { ...NEU(), rikt: 0.6 * del(0.2, 0.6, tl) * (1 - del(1.7, 2.2, tl)), armar: Array(2).fill(34 * pulsar(tl, [1.75], 0.7)) }]],
  [77.5, '06a', FISK_K, 0, tl => tl > 0.4 && tl < 2.8 ? B.L.nicka(G('glad'), BP('neutral', 'pekar'), tl - 0.4) : [G('glad'), BP('neutral', 'pekar')]],
  [80.9, '06b', FISK_K, 0, tl => [G('jatteglad'), klapp(0.5 + tl)]],         // klapp 81.4, 81.9, 82.4 = fiskens plask
  // fågeln flyger in (82.9–85.4): nyfiken uppåt mot den, förvånad när den stannar framför fören
  [82.7, '07', HEL, 1, tl => [BF('nyfiken', 'forvanad', del(2.5, 2.9, tl)), { ...NEU(), rikt: 0.6 * del(0.8, 1.4, tl), upp: -0.4 * del(0.8, 1.4, tl) }]],
  [86.8, '07a', HEL, 0, () => [G('glad'), { ...BP('neutral', 'pekar'), upp: -0.4 }]],
  [90.0, '07b', HALV, 0, tl => [G('fnissig'), { ...NEU(), armar: Array(2).fill(10 + 34 * pulsar(tl, [0, 0.6, 1.2], 0.5)) }]],   // flaxar på pip, pip, pip
  // "Vad mer är orange?" (Sanna 2026-11-26 "more expressions from the dino" vid 1:37): vinkar hej då till fågeln, tänker
  // (tittar upp åt sidan), letar åt höger och vänster, och på "Kan du se?" (08a) tittar hon ner, blir förvånad och sedan glad över västen.
  [92.3, '08', NAR, 1, tl => tl < 2.3 ? [G('jatteglad'), { ...NEU(), ...vink(tl, 2.3), rikt: 0.35 }]
    : tl < 3.4 ? [BF('jatteglad', 'tanker', del(2.3, 2.7, tl)), { ...NEU(), luta: -3 * del(2.3, 2.8, tl), rikt: 0.35 * (1 - del(2.3, 2.8, tl)) }]
    : [BF('tanker', 'nyfiken', del(3.4, 3.8, tl)), { ...NEU(), luta: lerp(-3, 4, del(3.4, 3.9, tl)), rikt: 0.6 * Math.sin(2 * Math.PI * kl((tl - 3.4) / 1.6)) }]],
  [97.2, '08a', NAR, 1, tl => [tl < 0.9 ? BF('nyfiken', 'forvanad', del(0.2, 0.55, tl)) : BF('forvanad', 'jatteglad', del(0.9, 1.3, tl)),
    { ...NEU(), upp: -0.6 * del(0, 0.5, tl) * (1 - del(1.0, 1.5, tl)) }]],   // tittar ner på västen, kameran glider in
  [99.0, '08b', NAR, 1, tl => tl < 1.9 ? [G('stolt'), BP('neutral', 'magen', del(0, 0.4, tl))] : [G('stolt'), { ...pekV(del(1.9, 2.4, tl)), upp: -0.6 }]],
  [103.0, '08c', HEL, 1, tl => [G('jatteglad'), { ...NEU(), armar: Array(2).fill(-6 - 16 * pulsar(tl, [0, 0.6, 1.2], 0.35)) }]],
  ...refrang(105.0, '09'),
  [118.6, '10', HEL, 1, () => [G('glad'), NEU()]],
];

// Vattnets fart: varje skott har fart 0 eller 1, bytet glider över 0,8 s. Sträckan integreras en gång (samma varje rendering).
const fartAt = E => { const { i, tl } = skott(S, E), f0 = i ? S[i - 1][3] : S[0][3]; return lerp(f0, S[i][3], mjuk(tl / 0.8)); };
const STR = (() => { const a = [0]; for (let E = E0; E < E1 + 1; E += 1 / 60) a.push(a.at(-1) + 140 * fartAt(E) / 60); return a; })();
const strAt = E => STR[Math.max(0, Math.round((E - E0) * 60))];

// Läget med inblandning från förra skottet (samma kamera = ingen klippning).
function lage(E) {
  const { i, s, tl, d } = skott(S, E); let [f, p] = s[4](tl, d);
  // refrängen: alla byten glider (också in i 05d/09d, där kameran glider), lite längre (Sanna 2026-11-26 "smoother dancing in chorus too")
  const ref = /^(05|09)[a-f]$/.test(s[1]), BL = ref ? 0.6 : 0.45;
  if (i && tl < BL && (S[i - 1][2] === s[2] || ref)) { const [f0, p0] = S[i - 1][4](s[0] - S[i - 1][0], s[0] - S[i - 1][0]), k = mjuk(tl / BL);
    f = B.L.blanda(f0, f, k); p = { ...p, ...B.L.blandaPose(p0, p, k) }; }
  // Riggen gömmer armen bakom kroppen mellan 26° och 80° (GOM i uttryck.html). Lyfta armar (refrängens hurra och pulsar, flaxet,
  // pekandet) blinkade därför in och ut på varje slag (Sanna 2026-11-26: armen försvinner vid 1:11, hackigt vid 1:04).
  // Riggens vink (som vinkningen, minnet vinkande-arm-bakom-kroppen) håller armen synlig; den tonas in mellan 12° och 24°.
  const A = Math.max(...[0, 1].map(i => (f.armar?.[i] || 0) + (p.armar?.[i] || 0)));
  p = { ...p, vink: Math.max(p.vink || 0, mjuk((A - 12) / 12)) };
  // utanför refrängerna gungar hon lugnt med i takten (ett gung på två slag, ±1,2°), så att hon aldrig står helt still
  if (!ref) p.luta = (p.luta || 0) + 1.2 * Math.sin(Math.PI * (E - REF0[0]) / SLAG);
  return [f, p];
}
function kam(E) {
  const { s, tl, d } = skott(S, E);
  if (s[1] === '04') return kamMix(HEL0, HEL, tl / d);
  if (s[1] === '08a') return kamMix(NAR, VAST_K, tl / d);
  if (s[1].endsWith('d') && s[2] === REFIN) return kamMix(REF, REFIN, tl / 1.2);
  return s[2];
}

// --- Båtens hopp: tut (042, 05e/09e de två första) och dunk (08c) ------------------------------------------------------------
const HOPP = [47.6, 48.2, 48.8, 61.3 + 9.2, 61.3 + 9.2 + SLAG, 105 + 9.2, 105 + 9.2 + SLAG];
const DUNK = [103.0, 103.6, 104.2];
const hoppAt = E => HOPP.reduce((a, t0) => a + (E >= t0 && E < t0 + 0.4 ? 16 * Math.sin(Math.PI * (E - t0) / 0.4) : 0), 0)
  + DUNK.reduce((a, t0) => a + (E >= t0 && E < t0 + 0.3 ? -6 * Math.sin(Math.PI * (E - t0) / 0.3) : 0), 0);

// --- Fia (fjärilen) i båtens koordinater: fladdrar in från höger, landar på flaggstångens topp, skuttar på tut, lyfter i 04a -----
const FIA_SK = 0.2, FIA_IN = [39.8, 42.2], FIA_UT = [51.6, 54.0];
function fia(E) {
  if (E < FIA_IN[0] || E > FIA_UT[1]) { FIA.g.style.display = 'none'; return; }
  FIA.g.style.display = '';
  const [mx, my] = MAST, tf = E - FIA_IN[0];
  let x = mx, y = my, f, p;
  const [ff, pf] = LF.ROR.flaxa(tf), [fv, pv] = LF.ROR.vila(E - FIA_IN[1]);
  if (E < FIA_IN[1]) { const u = mjuk((E - FIA_IN[0]) / (FIA_IN[1] - FIA_IN[0]));
    x = lerp(1500, mx, u); y = lerp(-420, my, u) - 120 * Math.sin(Math.PI * u); const k = del(0.75, 1, u);
    f = ff; p = { ...LF.blandaPose(pf, pv, k), rikt: -0.8 * (1 - k) };
  } else if (E < FIA_UT[0]) { f = fv; p = { ...pv, lyft: -60 * pulsar(E, HOPP.slice(0, 3), 0.4) };   // skuttar på tut
  } else { const u = mjuk((E - FIA_UT[0]) / (FIA_UT[1] - FIA_UT[0]));
    x = lerp(mx, 1600, u); y = lerp(my, -560, u) - 80 * Math.sin(Math.PI * u); f = ff; p = { ...LF.blandaPose(pv, pf, del(0, 0.2, u)), rikt: 0.8 * del(0, 0.3, u) }; }
  FIA.g.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
  LF.rita(FIA.fig, FIA.blinka(f, E), p);
}

// --- Fisken (06–06b): hopp i bågar framför fören, plask med droppar och en ring. Bilden 756 × 574, nosen åt höger. -------------
const FISK = '/assets/rekvisita/fisk-orange-v2/cut/fisk-orange-v2.png', FS = 0.4, VY = 860;   // vattenytan framför båten
// hopp: [start, längd, x0, x1, höjd]
const EKO = REF0.flatMap(r => [0.576, 1.73, 4.6 + 0.576, 4.6 + 1.73].map(d => r + d - 0.1));
const FISKREF = EKO.map((t, i) => [t, 0.6, i % 2 ? 1440 : 1300, i % 2 ? 1300 : 1440, 170]);
const FISKHOPP = [[75.3, 1.4, 1250, 1420, 300], [81.15, 0.5, 1430, 1530, 130], [81.65, 0.5, 1530, 1450, 130], [82.15, 0.5, 1450, 1560, 130]];
function fisk(E) {
  let h = '', plask = '';
  const rita = (x, y, v, speg = 1) => `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${v.toFixed(1)}) scale(${(speg * FS).toFixed(3)} ${FS})">
    <image href="${FISK}" x="-378" y="-287" width="756" height="574"/>
    <ellipse cx="${620 - 378}" cy="${250 - 287}" rx="24" ry="30" fill="#2a1d1a"/><circle cx="${614 - 378}" cy="${240 - 287}" r="8" fill="#fff"/>
    <path d="M${650 - 378} ${318 - 287} Q${676 - 378} ${342 - 287} ${702 - 378} ${314 - 287}" fill="none" stroke="#3a2a22" stroke-width="9" stroke-linecap="round"/></g>`;
  for (const [t0, D, x0, x1, H] of [...FISKHOPP, ...FISKREF]) {
    const u = (E - t0) / D;
    if (u >= 0 && u <= 1) { const x = lerp(x0, x1, u), y = VY + 40 - (H + 40) * 4 * u * (1 - u), v = Math.atan2((H + 40) * 4 * (1 - 2 * u), (x1 - x0)) * -180 / Math.PI * 0.7;
      h = rita(x, y, kl(v, -40, 40), x1 >= x0 ? 1 : -1); }
    [[t0 - 0.05, x0], [t0 + D - 0.08, x1]].forEach(([tp, xp]) => { const w = (E - tp) / 0.7; if (w > 0 && w < 1) plask += plaskRita(xp, VY, w); });
  }
  // 06a: fisken guppar i vattenytan bredvid fören och tittar upp (bara överdelen syns)
  if (E >= 76.7 && E < 81.15) { const k = del(76.9, 77.4, E) * (1 - del(80.9, 81.15, E)); const rr = 70 + 60 * k + 6 * Math.sin(E * 2.4); plask += `<path d="M${(1420 - rr).toFixed(1)} ${VY + 6} A${rr.toFixed(1)} 13 0 0 0 ${(1420 + rr).toFixed(1)} ${VY + 6}" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="40 14" opacity="${(0.75 * k).toFixed(2)}"/>`;
      h = rita(1420, VY + 70 - 95 * k + 6 * Math.sin(E * 3), -12 + 4 * Math.sin(E * 2), -1); }   // en ring på vattnet runt fisken
  $('fisk').innerHTML = h; $('plask').innerHTML = plask;
}

// --- Fågeln (07–08): flyger in från höger (vänd åt vänster), flaxar på stället framför fören, flyger ut uppåt i 08 -------------
const FAGEL = '/assets/rekvisita/fagel-orange-v2/delar/', FG = 0.26, FAGEL_IN = [82.9, 85.4], FAGEL_UT = [92.6, 95.0], SVAV = [1360, 470];
const FAGEL_F = REF0.map(r => [r + 11.6, r + 13.8]);   // rad 8 "Titta ut!": fågeln flyger förbi från höger till vänster, dit Disa pekar
function fagel(E) {
  const ff = FAGEL_F.find(([a, b]) => E >= a && E <= b);
  $('fagelbak').innerHTML = '';
  if (ff) { const u = (E - ff[0]) / (ff[1] - ff[0]), x = lerp(1600, 320, u), y = 320 - 25 * Math.sin(Math.PI * u) + 10 * Math.sin(E * 4.2), sy = 0.65 + 0.35 * Math.cos(2 * Math.PI * 2.5 * E);
    $('fagel').innerHTML = `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${-FG} ${FG}) translate(-511 -511)">
      <g transform="translate(0 613) scale(1 ${sy.toFixed(3)}) translate(0 -613)"><image href="${FAGEL}fagel-vinge.png" width="1024" height="1024"/></g>
      <image href="${FAGEL}fagel-kropp.png" width="1024" height="1024"/>
      <ellipse cx="818" cy="655" rx="15" ry="18" fill="#2a1d1a"/><circle cx="814" cy="648" r="5" fill="#fff"/></g>`;
    $('fagelbak').innerHTML = $('fagel').innerHTML; $('fagel').innerHTML = ''; return; }   // långt bort: bakom Disa
  if (E < FAGEL_IN[0] || E > FAGEL_UT[1]) { $('fagel').innerHTML = ''; return; }
  let [x, y] = SVAV;
  if (E < FAGEL_IN[1]) { const u = mjuk((E - FAGEL_IN[0]) / (FAGEL_IN[1] - FAGEL_IN[0])); x = lerp(2150, SVAV[0], u); y = lerp(300, SVAV[1], u) - 60 * Math.sin(Math.PI * u); }
  else if (E > FAGEL_UT[0]) { const u = mjuk((E - FAGEL_UT[0]) / (FAGEL_UT[1] - FAGEL_UT[0])); x = lerp(SVAV[0], 2200, u); y = lerp(SVAV[1], 80, u); }
