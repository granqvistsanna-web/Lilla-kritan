<body>
<!-- 006 v2, scen sjön: storyboard-v2 03–09f, avsnittstid 0:33.2–1:59.4 (sångtid 0:24.2–1:50.4), slutar mitt i det orangea kritsvepet.
     Disa i båten (kit.js, som provet), Fia landar på flaggstången (04–04a), fisken (06–06b), fågeln (07–07b), västen och flaggan (08–08c),
     refräng 1 och 2 (05a–05f, 09a–09f) med v1:s orange värld (sjön blir orange, solen, kritans regnbåge, fisken hoppar på ekona, fågeln på "Titta ut!") och apelsinbubblan. Inga repliker (Sanna 2026-11-26).
     ?t=<avsnittstid> visar en bild. Render: node verktyg/render-delat.mjs avsnitt/006-orange-baten/v2/scener/sjon [--snabb] -->
<svg id="scen" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="boil" filterUnits="userSpaceOnUse" x="-100" y="-100" width="2120" height="1280">
      <feTurbulence id="brus" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
      <feDisplacementMap id="flytt" in="SourceGraphic" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- refrängens orange sjö (v1:s sjon-orange): sjöbilden i ljusstyrka → persika himmel, orange vatten, ljusa vågkammar -->
    <filter id="tillorange" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncR type="table" tableValues="0.45 0.6 0.78 0.87 1 1"/><feFuncG type="table" tableValues="0.16 0.24 0.34 0.44 0.8 0.96"/>
        <feFuncB type="table" tableValues="0.04 0.05 0.08 0.12 0.62 0.9"/></feComponentTransfer></filter>
    <clipPath id="torka"><path id="torka-yta" d="M0 0"/></clipPath>
    <clipPath id="ovanhorisont"><rect x="-400" y="-400" width="2800" height="988"/></clipPath>
    <clipPath id="ovanvatten"><rect x="-200" y="-400" width="2400" height="1268"/></clipPath>
    <clipPath id="ovanvattenbak"><rect x="-200" y="-400" width="2400" height="1126"/></clipPath>
  </defs>
  <g id="kamera">
    <g id="sjon"><image href="/assets/bakgrunder/sjon-v2/sjon-v2.png" width="1920" height="1080"/><image href="/assets/bakgrunder/sjon-v2/sjon-v2.png" x="1918" width="1920" height="1080"/></g>
    <g id="orangevarld" clip-path="url(#torka)" style="display:none"><use href="#sjon" filter="url(#tillorange)"/>
      <g clip-path="url(#ovanhorisont)"><g filter="url(#boil)"><g id="sol"></g><g id="bage"></g></g></g></g>
    <g filter="url(#boil)">
      <g id="fagelbak"></g>
      <g id="fiskbak" clip-path="url(#ovanvattenbak)"></g>
      <g id="batlager"></g>
      <g id="fram">
        <g id="fisk" clip-path="url(#ovanvatten)"></g>
        <g id="plask"></g>
        <g id="fagel"></g>
        <g id="bubbla"></g>
        <g id="bagekrita"></g>
      </g>
    </g>
  </g>
  <g id="ram"></g>
</svg>
<script src="/verktyg/blinka.js"></script>
<script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script src="/verktyg/kritan-ritar.js"></script>
<script src="../kit.js"></script>
<script>
const E0 = 33.2, E1 = 119.4, DURATION = E1 - E0;   // avsnittstid; kritsvepet 118.6–120.2, klippet vid 119.4

// Kameror [cx, cy, zoom]. HEL: båten och himlen; NAR: Disa (provet, godkänt); HALV: Disa och fören (fisken, fågeln); REF: refrängen.
// Tätare som v1 (Sanna 2026-11-26 "match close crops better to og video"): helbilden har båten på ca 60 % av bredden, närbilden Disa på ca 70 % av höjden.
// HEL 25 px högre (Sanna 2026-11-26 "flytta kameran upp lite" vid 0:53). REF = HEL: refrängen börjar utan ett litet hoppklipp
// (förut 5 % zoom vid 1:01, "klippen ser för hackiga ut").
const HEL = [975, 560, 1.95], HEL0 = [975, 600, 1.7], NAR = [975, 490, 2.7], HALV = [1130, 590, 1.8], REF = HEL, REFIN = [1090, 520, 2.1];
// QA 2026-11-27: VAST_K högre och vidare (förut [985, 620, 3.2] skar bort ögonen på "Kan du se?"); FIA_K: Disa och Fia på
// flaggstången, båda hela (041); FLAGG_K: hela flaggan och Disa ("och flaggan med!"); TITTA_K: Disa och fågeln där hon pekar
// ("Titta ut!", förut flög fågeln bakom huvudet och klipptes av överkanten).
const VAST_K = [975, 545, 2.9], FIA_K = [905, 450, 2.1], FLAGG_K = [925, 470, 2.4], TITTA_K = [1100, 480, 2.3];
// FISK_K: fisken guppar och hoppar framför fören (06a–06b). Lägre och lite vidare än HALV, så att fisken och plasken syns hela
// (Sanna 2026-11-26 "show the fish more clearly" vid 1:21: förut låg vattenytan i bildens underkant och fisken klipptes av).
const FISK_K = [1190, 650, 1.5], FISK_N = [1250, 590, 1.85];   // FISK_K också för hoppet (06), så att hela bågen och plasket syns; FISK_N: Disa och fisken som guppar
const FACE = [987, 455];   // Disas ansikte i scenen (båtens gungning räknas inte), för blicken
const titta = ([f, p], mal, k = 1) => mal ? tittaPa(f, p, FACE, mal, k) : [f, p];
const B_X = 960, B_Y = 760;
const REF0 = [61.3, 105.0];   // refrängernas början (avsnittstid)   // båtens vattenlinje mitt

let B, FIA, LF, FAGELP;   // båten (kit.js), Fias grupp och rigg, fågeln på fören (refräng 2)
const G = n => B.L.param(n), BP = (a, b, k = 1) => B.L.blandaPose(a, b, k), BF = (a, b, k) => B.L.blanda(a, b, k);
const NEU = () => ({ ...B.L.POSE0 });
// pekar med en arm: höger = Disas egen pekpose, vänster = samma speglad; huvudet vänds dit (aldrig bada: båda armarna på en sida)
const pekH = k => ({ ...BP('neutral', 'pekar', k), rikt: 0.6 * k }), pekV = k => ({ ...NEU(), armar: [16 * k, 0], luta: -k, boj: -2.5 * k, rikt: -0.6 * k });
const klapp = tl => (B.L.ROR.klappa ? B.L.ROR.klappa(tl)[1] : NEU());   // riggens klapp (3 klapp på 1,0, 1,5 och 2,0 s i en 3 s-slinga)
const pulsar = (tl, ts, d = 0.3) => ts.reduce((a, t0) => a + (tl >= t0 && tl < t0 + d ? Math.sin(Math.PI * (tl - t0) / d) : 0), 0);

// --- Refrängen (05a–05f / 09a–09f): sex rader à 2,3 s (fyra slag). Vattnet står still, himlen glöder. ---------------------------
function refrang(E, nr) {
  const R = (t, namn, kam, fn) => [E + t, namn, kam, 0, fn];
  const upp = u => 0.5 + 0.5 * Math.cos(Math.PI * Math.max(0, u - 0.12) / SLAG);   // upp på rösten, ner på ekot
  return [
    R(0, `${nr}a`, REF, tl => [G('jatteglad'), BP('neutral', 'hurra', upp(tl))]),
    // kritan ritar regnbågen över henne (E + 2.4–4.0): hon tittar upp, förvånad, sedan jätteglad (QA 2026-11-27)
    R(2.3, `${nr}b`, REF, tl => [tl < 1.0 ? BF('glad', 'forvanad', del(0.15, 0.45, tl)) : BF('forvanad', 'jatteglad', del(1.0, 1.4, tl)),
      { ...BP('neutral', 'magen'), luta: 4 * Math.sin(Math.PI * tl / (2 * SLAG)), upp: 0.6 * del(0.1, 0.5, tl) * (1 - del(1.8, 2.3, tl)) }]),
    R(4.6, `${nr}c`, REF, tl => [G('jatteglad'), BP('neutral', 'hurra', upp(tl))]),
    // pekar på bubblan och tittar upp på den (förut tittade hon ner: upp −0,6). QA 2026-11-28: kawaii-ögonen är helsvarta med
    // glitter, så en liten blick (titt 16/13) läste som att hon tittade in i kameran; nu vänds huvudet tydligt upp mot bubblan
    // (rikt 0,7, upp 0,75) och ögonen går hela vägen upp åt höger.
    R(6.9, `${nr}d`, REFIN, tl => { const k = del(0.1, 0.5, tl), [f, p] = titta([BF('glad', 'kawaii', del(0, 0.4, tl)), { ...BP('neutral', 'pekar'), upp: 0.3 }], BUB, k);
      return [{ ...f, titt: [lerp(f.titt[0], 22, k), lerp(f.titt[1], -20, k)] }, { ...p, rikt: lerp(p.rikt, 0.7, k), upp: lerp(p.upp, 0.75, k), luta: 3 * k }]; }),   // kawaii (1 och 2 av 3)
    R(9.2, `${nr}e`, REF, tl => [G('jatteglad'), { ...NEU(), armar: Array(2).fill(30 * pulsar(tl, [2 * SLAG, 3 * SLAG], 0.4)) }]),
    // "Titta ut!": pekar åt höger, dit fågeln flyger in, och följer den med blicken tills den flyger ut
    R(11.5, `${nr}f`, TITTA_K, tl => titta([G('nyfiken'), pekH(del(0, 0.4, tl))], fagelXY(E + 11.5 + tl), del(0, 0.3, tl))),
  ];
}

// --- Skottlistan: [avsnittstid, namn, kamera, fart, (tl, d) => [ansikte, pose]] --------------------------------------------------
// Tider på slagen: B(n) = refrängens första slag + n slag (104 bpm). "leta med – jag och du!": jag B(−7), du B(−6).
const B_ = n => REF0[0] + n * SLAG, JAG = B_(-7), DU = B_(-6);
const S = [
  [33.2, '03', HEL, 1, () => [G('glad'), NEU()]],
  [35.2, '03a', NAR, 1, tl => [G('jatteglad'), { ...NEU(), ...vinkV(tl, 2.2) }]],   // vinkar med vänster arm, ut mot himlen (QA 2026-11-27)
  [37.4, '03b', NAR, 1, tl => [G('glad'), { ...NEU(), rikt: 0.6 * del(0, 0.5, tl) }]],
  // kameran glider in (se kam()); Fia fladdrar in och landar, Disa följer henne med blicken
  [39.3, '04', HEL0, 1, tl => titta([G('glad'), NEU()], fiaXY(39.3 + tl), del(0.6, 1.2, tl) * (1 - del(3.4, 3.9, tl)))],
  // klappar på relingen på slagen (tassarna lyfts mellan slagen och slår ner på slaget), tittar på Fia: ett kort fniss, sedan glad
  [43.2, '041', FIA_K, 1, tl => { const E = 43.2 + tl, ph = (((E - REF0[0]) / SLAG) % 1 + 1) % 1, a = -4 + 26 * Math.sin(Math.PI * ph) ** 2;
    return titta([tl < 0.7 ? G('fnissig') : BF('fnissig', 'glad', del(0.7, 1.1, tl)), { ...NEU(), armar: [a, a] }], fiaXY(E), del(0.2, 0.6, tl)); }],
  [47.6, '042', HEL, 1, () => [G('jatteglad'), NEU()]],                  // båten hoppar på varje tut
  // "Dinon letar orange nu": tittar först efter Fia som flyger ut uppe till vänster, sedan sveper huvudet vänster–höger på slagen
  [51.2, '04a', HEL, 1, tl => { const E = 51.2 + tl;
    // QA 2026-11-28 (stod nästan still 52,5–54): när Fia är borta lutar hon huvudet, tittar upp åt sidan och funderar ("hm"),
    // och ljusnar till nyfiken lagom till svepet
    const fore = E => { const [f, p] = titta([BF('jatteglad', 'nyfiken', del(51.2, 51.6, E)), NEU()], fiaXY(Math.min(E, 52.5)), del(51.4, 51.8, E)), k = del(52.5, 52.95, E);
      return [{ ...BF('nyfiken', 'tanker', k * (1 - del(53.55, 53.9, E))), titt: [lerp(f.titt[0], -9, k), lerp(f.titt[1], -11, k)] },
        { ...p, luta: -6 * k + 2 * k * Math.sin(2 * Math.PI * (E - 52.5) / 1.2), rikt: lerp(p.rikt || 0, -0.3, k), upp: lerp(p.upp || 0, 0.4, k) }]; };
    if (E < 54.0) return fore(E);
    const sv = Math.sin(Math.PI * (E - 54.0) / (2 * SLAG)) * del(54.0, 54.5, E), ef = fore(53.99);
    const [f, p] = [{ ...G('nyfiken'), titt: [11 * sv, -2] }, { ...NEU(), rikt: 0.6 * sv }], k = del(54.0, 54.4, E);
    return [B.L.blanda(ef[0], f, k), { ...p, ...B.L.blandaPose(ef[1], p, k) }]; }],
  // "leta med – jag och du!": närbild, hon tittar på tittaren och blir glad, händerna på västen på "jag", pekar på "du" och nickar
  [56.2, '04b', NAR, 1, tl => { const E = 56.2 + tl;
    const f = { ...BF('nyfiken', 'glad', del(56.3, 56.8, E)), titt: [0, 0] };   // ögonen öppna, mot tittaren
    const pek = BP('neutral', 'pekar');
    const p = E < DU ? BP('neutral', 'magen', del(JAG - 0.25, JAG + 0.1, E)) : { ...BP('magen', pek, del(DU - 0.15, DU + 0.2, E)) };
    return E > DU + 0.5 && E < DU + 2.1 ? B.L.nicka(f, p, E - DU - 0.5) : [f, p]; }],
  ...refrang(61.3, '05'),
  // fisken hoppar (75.3): hon följer den med blicken, förvånad medan den är i luften, jätteglad med armarna upp när den plaskar ner
  [74.9, '06', FISK_K, 1, tl => titta([tl < 1.6 ? BF('glad', 'forvanad', del(0.3, 0.6, tl)) : BF('forvanad', 'jatteglad', del(1.6, 1.95, tl)),
    { ...NEU(), armar: Array(2).fill(34 * pulsar(tl, [1.75], 0.7)) }], fiskXY(74.9 + tl) || [1560, 860], del(0.2, 0.5, tl))],
  // fisken guppar och tittar upp på henne; hon pekar och tittar på fisken, på tittaren (nickar), och på fisken igen
  // QA 2026-11-28 (båda stod still): fisken gör ett litet glatt skutt på stället (78,0) och hon blir förvånad och fnissar till
  [77.5, '06a', FISK_N, 0, tl => { const E = 77.5 + tl, mot = 1 - del(78.6, 78.9, E) + del(79.5, 79.8, E), sk = pulsar(E, [78.0], 0.7);
    const f0 = B.L.blanda(BF('glad', 'forvanad', pulsar(E, [77.95], 0.35)), G('fnissig'), del(78.25, 78.4, E) * (1 - del(78.6, 78.8, E))), p0 = { ...BP('neutral', 'pekar'), luta: 3 * sk };
    const [f, p] = titta([f0, p0], fiskXY(E) || [1560, 830], mot);
    return E > 78.8 && E < 80.4 ? B.L.nicka(f, p, E - 78.8) : [f, p]; }],
  [80.9, '06b', FISK_K, 0, tl => titta([G('jatteglad'), klapp(0.5 + tl)], fiskXY(80.9 + tl), 0.7)],   // klapp 81.4, 81.9, 82.4 = fiskens plask
  // fågeln flyger in (82.9–85.4): nyfiken, följer den med blicken, förvånad när den stannar framför fören
  [82.7, '07', HEL, 1, tl => titta([BF('nyfiken', 'forvanad', del(2.5, 2.9, tl)), NEU()], fagelXY(82.7 + tl), del(0.3, 0.8, tl))],
  // pekar på fågeln, tittar på tittaren (nickar) och tillbaka
  // QA 2026-11-28 (stod nästan still): fågeln fladdrar upp en bit och ner igen (87,2) och hon blir jätteglad och gungar till
  [86.8, '07a', HEL, 0, tl => { const E = 86.8 + tl, mot = 1 - del(87.9, 88.2, E) + del(88.9, 89.2, E), fl = pulsar(E, [FLADDER], 0.75);
    const [f, p] = titta([BF('glad', 'jatteglad', fl), { ...BP('neutral', 'pekar'), luta: 3 * Math.sin(2 * Math.PI * kl((E - FLADDER) / 0.75)) }], fagelXY(E), mot);
    return E > 88.1 && E < 89.7 ? B.L.nicka(f, p, E - 88.1) : [f, p]; }],
  [90.0, '07b', HALV, 0, tl => [G('fnissig'), { ...NEU(), armar: Array(2).fill(10 + 34 * pulsar(tl, [0, 0.6, 1.2], 0.5)) }]],   // flaxar på pip, pip, pip
  // "Vad mer är orange?" (Sanna 2026-11-26 "more expressions from the dino" vid 1:37): vinkar hej då till fågeln, tänker
  // (tittar upp åt sidan), letar åt höger och vänster, och på "Kan du se?" (08a) tittar hon ner, blir förvånad och sedan glad över västen.
  [92.3, '08', NAR, 1, tl => tl < 2.3 ? [G('jatteglad'), { ...NEU(), ...vink(tl, 2.3), rikt: 0.35 }]
    : tl < 3.4 ? [BF('jatteglad', 'tanker', del(2.3, 2.7, tl)), { ...NEU(), luta: -3 * del(2.3, 2.8, tl), rikt: 0.35 * (1 - del(2.3, 2.8, tl)) }]
    : [BF('tanker', 'nyfiken', del(3.4, 3.8, tl)), { ...NEU(), luta: lerp(-3, 4, del(3.4, 3.9, tl)), rikt: 0.6 * Math.sin(2 * Math.PI * kl((tl - 3.4) / 1.6)) }]],
  [97.2, '08a', NAR, 1, tl => [tl < 0.9 ? BF('nyfiken', 'forvanad', del(0.2, 0.55, tl)) : BF('forvanad', 'jatteglad', del(0.9, 1.3, tl)),
    { ...NEU(), upp: -0.6 * del(0, 0.5, tl) * (1 - del(1.0, 1.5, tl)) }]],   // tittar ner på västen, kameran glider in
  // "Västen är orange": händerna på västen, glad med ett kort stolt slag (förut stolt i 3 s: såg sömnig ut, QA 2026-11-27);
  // "och flaggan med!": pekar bakåt på flaggan och tittar på den, flaggan fladdrar extra
  [99.0, '08b', FLAGG_K, 1, tl => tl < 1.9 ? [B.L.blanda(BF('glad', 'jatteglad', del(1.2, 1.5, tl)), 'stolt', 0.85 * Math.sin(Math.PI * kl((tl - 0.45) / 0.7))), BP('neutral', 'magen', del(0, 0.4, tl))]
    : titta([G('glad'), pekV(del(1.9, 2.4, tl))], FLAGGA, del(1.9, 2.3, tl))],
  [103.0, '08c', HEL, 1, tl => [G('jatteglad'), { ...NEU(), armar: Array(2).fill(-6 - 16 * pulsar(tl, [0, 0.6, 1.2], 0.35)) }]],
  ...refrang(105.0, '09'),
  [118.6, '10', HEL, 1, () => [G('glad'), NEU()]],
];
const FLAGGA = [650, 455];   // flaggans mitt i scenen

// Vattnets fart: varje skott har fart 0 eller 1, bytet glider över 0,8 s. Sträckan integreras en gång (samma varje rendering).
const fartAt = E => { const { i, tl } = skott(S, E), f0 = i ? S[i - 1][3] : S[0][3]; return lerp(f0, S[i][3], mjuk(tl / 0.8)); };
const STR = (() => { const a = [0]; for (let E = E0; E < E1 + 1; E += 1 / 60) a.push(a.at(-1) + 140 * fartAt(E) / 60); return a; })();
const strAt = E => STR[Math.max(0, Math.round((E - E0) * 60))];

// Läget med inblandning från förra skottet (samma kamera = ingen klippning).
function lage(E) {
  const { i, s, tl, d } = skott(S, E); let [f, p] = s[4](tl, d);
  // refrängen: alla byten glider (också in i 05d/09d, där kameran glider), lite längre (Sanna 2026-11-26 "smoother dancing in chorus too")
  const ref = /^(05|09)[a-f]$/.test(s[1]), BL = ref ? 0.6 : 0.45;
  if (i && tl < BL && (S[i - 1][2] === s[2] || ref)) { const [f0, p0] = S[i - 1][4](s[0] - S[i - 1][0], s[0] - S[i - 1][0]), k = mjuk(tl / BL);
    f = B.L.blanda(f0, f, k); p = { ...p, ...B.L.blandaPose(p0, p, k) }; }
  // Riggen gömmer armen bakom kroppen mellan 26° och 80° (GOM i uttryck.html). Lyfta armar (refrängens hurra och pulsar, flaxet,
  // pekandet) blinkade därför in och ut på varje slag (Sanna 2026-11-26: armen försvinner vid 1:11, hackigt vid 1:04).
  // Riggens vink (som vinkningen, minnet vinkande-arm-bakom-kroppen) håller armen synlig; den tonas in mellan 12° och 24°.
  const A = Math.max(...[0, 1].map(i => (f.armar?.[i] || 0) + (p.armar?.[i] || 0)));
  p = { ...p, vink: Math.max(p.vink || 0, mjuk((A - 12) / 12)) };
  // utanför refrängerna gungar hon lugnt med i takten (ett gung på två slag, ±1,2°), så att hon aldrig står helt still
  if (!ref) p.luta = (p.luta || 0) + 1.2 * Math.sin(Math.PI * (E - REF0[0]) / SLAG);
  return [f, p];
}
function kam(E) {
  const { s, tl, d } = skott(S, E);
  if (s[1] === '04') return kamMix(HEL0, HEL, tl / d);
  if (s[1] === '08a') return kamMix(NAR, VAST_K, tl / d);
  if (s[1].endsWith('d') && s[2] === REFIN) return kamMix(REF, REFIN, tl / 1.2);
  return s[2];
}

// --- Båtens hopp: tut (042, 05e/09e de två första) och dunk (08c) ------------------------------------------------------------
const HOPP = [47.6, 48.2, 48.8, 61.3 + 9.2, 61.3 + 9.2 + SLAG, 105 + 9.2, 105 + 9.2 + SLAG];
const DUNK = [103.0, 103.6, 104.2];
const hoppAt = E => HOPP.reduce((a, t0) => a + (E >= t0 && E < t0 + 0.4 ? 16 * Math.sin(Math.PI * (E - t0) / 0.4) : 0), 0)
  + DUNK.reduce((a, t0) => a + (E >= t0 && E < t0 + 0.3 ? -6 * Math.sin(Math.PI * (E - t0) / 0.3) : 0), 0);

// --- Fia (fjärilen) i båtens koordinater: fladdrar in från höger, landar på flaggstångens topp, skuttar på tut, lyfter i 04a -----

}

// --- Fisken (06–06b): hopp i bågar framför fören, plask med droppar och en ring. Bilden 756 × 574, nosen åt höger. -------------
// QA 2026-11-27: hoppet (06) börjar fritt från skrovet (förut x 1250, inne i förens kontur) och filmas i FISK_K, så att hela bågen

// (förut klipptes de av höger- och underkanten).
const FISK = '/assets/rekvisita/fisk-orange-v2/cut/fisk-orange-v2.png', FS = 0.4, VY = 860, FS_R = 0.25, VY_R = 720;   // vattenytan framför båten / bakom
// hopp: [start, längd, x0, x1, höjd]

const BOB = [1560, 76.7, 81.15], BOB_SKUTT = 78.0;   // 06a: fisken guppar där den landade, och skuttar till på stället (QA 2026-11-28)
function hoppXY(E, [t0, D, x0, x1, H], vy) { const u = (E - t0) / D; if (u < 0 || u > 1) return null;
  return [lerp(x0, x1, u), vy + 40 * (vy === VY ? 1 : 0.6) - (H + 40) * 4 * u * (1 - u), Math.atan2((H + 40) * 4 * (1 - 2 * u), (x1 - x0)) * -180 / Math.PI * 0.7]; }
const bobK = E => del(76.9, 77.4, E) * (1 - del(80.9, 81.15, E));
function fiskXY(E) {   // fiskens mitt i scenen (för Disas blick)
  for (const h of FISKHOPP) { const q = hoppXY(E, h, VY); if (q) return q; }

    const su = kl((E - BOB_SKUTT) / 0.5), sv = E >= BOB_SKUTT && E < BOB_SKUTT + 0.5 ? 18 * Math.sin(2 * Math.PI * su) : 0;   // nosen upp, sedan ner

  $('fisk').innerHTML = h; $('fiskbak').innerHTML = hb; $('plask').innerHTML = plask;

    FAGELP.innerHTML = fagelSvg(FOR_P[0], FOR_P[1] - 34 * hopp, FGP, hopp > 0.05 ? flax(E, 4) : 0.45 + 0.04 * Math.sin(E * 3)); $('fagel').innerHTML = ''; return; }
  const q = fagelXY(E); if (!q) { $('fagel').innerHTML = ''; return; }
  const ff = FAGEL_F.find(([a, b]) => E >= a && E <= b), inR2 = E >= R2_IN[0] && E < R2_IN[1];

// --- Refrängens värld (som v1 refrang.js): sjön torkas över till orange på första slaget och tillbaka på sista, en låg sol går

  $('torka-yta').setAttribute('d', E < u0 ? kantD(lerp(-500, 2500, mjuk((E - i0) / (i1 - i0))), false) : kantD(lerp(-500, 2500, mjuk((E - u0) / (u1 - u0))), true));
  // solen: går upp bakom horisonten på första raden, vrider sig sakta. Putsad (Sanna 2026-11-26 "den vita linjen ser konstig ut"):
  // ingen vit ring, en kritkant i en mörkare ton, mjuk ljusare fläck, strålar som smalnar utåt i två längder.
  const su = mjuk((E - r - 0.3) / 1.4), [sx, sy] = [SOL[0], +lerp(HOR + 70, SOL[1], su).toFixed(1)];
  const strale = Array.from({ length: 10 }, (_, i) => { const a = (i * 36 + E * 8) * Math.PI / 180, c = Math.cos(a), s = Math.sin(a), L = i % 2 ? 52 : 58, n = 5, r0 = 40;

  if (k < 1) { const [x, y] = bageP(k, 52); $('bagekrita').innerHTML = kritaBild(x, y, { s: KRITAN.SKALA_PAPPER / 1.35, v: 125 }); }
}

function rita(t) {
