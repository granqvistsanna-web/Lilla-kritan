<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><title>006 v2 · bryggan (11–14g)</title>
<style>html,body{margin:0;background:#222;overflow:hidden}svg{display:block;width:100vw;height:auto}</style></head>
<body>
<!-- 006 v2, scen bryggan: storyboard-v2 11–14g, avsnittstid 1:59.4–2:50.6 (sångtid 1:50.4–2:41.6). Börjar mitt i det orangea
     kritsvepet (sjön slutar där), slutar med ett rakt klipp till discot. Disa i båten (kit.js) lägger till vid v2-bryggan, där
     Agda sitter med korgen. Apelsinen: Agda visar den, räcker den till Disa (nick), den glider ur tassarna, flyter bort ett steg per
     "längre", Agda hoppar i, simmar ut och knuffar den tillbaka ett kliv per "hit", en halva var (i kod), mums, hurra.
     Inga repliker (Sanna 2026-11-26). ?t=<avsnittstid> visar en bild. -->
<svg id="scen" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="boil" filterUnits="userSpaceOnUse" x="-100" y="-100" width="2120" height="1280">
      <feTurbulence id="brus" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
      <feDisplacementMap id="flytt" in="SourceGraphic" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <clipPath id="vattenytan" clipPathUnits="userSpaceOnUse"><rect id="vy" x="-200" y="-400" width="2400" height="2000"/></clipPath>
    <filter id="kritring" x="-30%" y="-30%" width="160%" height="160%"><feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter>
  </defs>
  <g id="kamera">
    <image href="/assets/bakgrunder/sjon-v2/sjon-v2.png" width="1920" height="1080"/>
    <g filter="url(#boil)">
      <g id="ringar"></g>
      <g id="brygga"></g>
      <g id="agda-g" clip-path="url(#vattenytan)"><g id="agda"></g></g>
      <g id="batlager"></g>
      <g id="fram"></g>
    </g>
  </g>
  <g id="ram"></g>
</svg>
<script src="/verktyg/blinka.js"></script>
<script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script src="/verktyg/kritan-ritar.js"></script>
<script src="../kit.js"></script>
<script>
const E0 = 119.4, E1 = 170.6, DURATION = E1 - E0;
const R = '/assets/rekvisita/';
const BRYGGA = R + 'bryggan-v2/cut/bryggan-v2.png', KORG = R + 'korg/cut/korg-v3-tunn.png', APELSIN = R + 'apelsin-v2/cut/apelsin-v2.png',
  BANAN = R + 'banan/cut/banan-v2-tunn.png', APPLE = R + 'applet-rott/cut/applet-rott-v3-tunn.png';

// Platsen: bryggan (1242 × 400: däckets ovansida y 17–180, framkanten till y 244, stolparna ner till y 381) i skala 0,7 till höger.
// Agda och korgen står mitt på däckets ovansida (y 110 i bilden), inte på bakkanten.
// Båten lägger till vid bryggans vänstra ände, vattenlinjen y 800. Agda (skala 0,4) sitter på däcket, korgen bredvid.
const JS = 0.7, JX = 1010, JY = 629, DACK = JY + 110 * JS, B_X1 = 700, B_Y = 800, AX = 1180, AS = 0.4, VY = 915;
const KX = 1430, KS = 0.22, KY = DACK - 915 * KS;   // korgen: botten (y 915 i rutan) på däcket
const RIM = KY + 505 * KS, KORG_APELSIN = [KX + 30, RIM - 16, 0.75];   // korgens öppning; apelsinen ligger i korgen (Sanna 2026-11-26: "place fruits better in basket not behind it")
// Kameror [cx, cy, zoom]. QA 2026-11-27: närbilderna så att den andra figuren är helt ute (förut halva Agda i NAR_D och en bit
// Disa i NAR_A; 2026-11-28: NAR_A på Agda och korgen, hela Agda i bild); VANST: helbild åt vänster med öppet vatten bakom båten, dit apelsinen flyter bort och där Agda simmar.
const HEL = [1075, 560, 1.12], TVA = [960, 600, 1.4], NAR_D = [600, 520, 2.3], NAR_A = [1340, 540, 2.6], VANST = [800, 590, 1.12];

let B, A, LA;   // båten med Disa (kit.js), Agda (grupp, rigg)
const DP = (a, b, k = 1) => B.L.blandaPose(a, b, k), DF = n => B.L.param(n), DB = (a, b, k) => B.L.blanda(a, b, k);
const AP = (a, b, k = 1) => LA.blandaPose(a, b, k), AF = n => LA.param(n), AB = (a, b, k) => LA.blanda(a, b, k);
const D0 = () => ({ ...B.L.POSE0 }), A0 = () => ({ ...LA.POSE0 });
const GRAT = tl => B.L.ROR.grata(tl);   // riggens gråtslinga (verktyg/rigg-motor.js gratDel)
const pekH = k => ({ ...DP('neutral', 'pekar', k), rikt: 0.6 * k }), pekV = k => ({ ...D0(), armar: [16 * k, 0], luta: -k, boj: -2.5 * k, rikt: -0.6 * k });
const sitt = (o = {}) => ({ ...AP('neutral', 'sitter'), ...o });
const haller = (k, upp = 0) => sitt({ rikt: -k, bada: k, armar: [6 + 19 * k + upp, 6] });   // sitter och håller fram något mot Disa (upp: vingen högre)
const pulsar = (tl, ts, d = 0.3) => ts.reduce((a, t0) => a + (tl >= t0 && tl < t0 + d ? Math.sin(Math.PI * (tl - t0) / d) : 0), 0);
const DFACE = [727, 495], AFACE = [1180, 488];   // ansiktenas mitt (för blicken)
const dTitta = ([f, p], mal, k = 1) => tittaPa(f, p, DFACE, mal, k);
const skaka = ([f, p], tl, d = 1.0) => B.L.skakaHuvud(f, p, tl, d, 1.5);

// Slagen (104 bpm) räknade från refrängens första slag 61.3.
const SL = n => 61.3 + n * SLAG;
// "rund, rund, rund" (11b): tassen ritar en cirkel per ord (RUND), en orange kritring följer handen.
const RUND = [SL(112), SL(113), SL(114)], RUND_D = 0.5;
// Luckan (11d): Agda lyfter äpplet (Disa skakar på huvudet), bananen (skakar), apelsinen (stor glad nick, 11e).
const FRUKT = { applet: [128.15, 130.55], banan: [130.85, 132.45], apelsin: [132.75] };
// Överlämningen: Agdas vinge sträcks fram, Disas tass möter den (134.35–135.0), sedan håller Disa upp apelsinen mot himlen.
const OVER = [134.35, 135.0], UPP = [135.2, 135.8];
// mellan rund-orden glider tassen; ringens vinkel θ (0–2π per ord)
const rundTheta = E => { for (const t0 of RUND) if (E >= t0 && E < t0 + RUND_D) return 2 * Math.PI * mjuk((E - t0) / RUND_D); return 0; };
const rundPose = E => { const th = rundTheta(E), k = del(125.55, 125.75, E) * (1 - del(127.6, 127.9, E));
  return { ...D0(), vink: 1, armar: [k * (46 + 20 * Math.sin(th)), 0], armY: -k * 22 * (1 - Math.cos(th)), rikt: -0.15 * k, luta: -1.5 * k }; };

// Skottlistan: [avsnittstid, namn, kamera, (tl) => [[Disa f, p], [Agda f, p]]]
const S = [
  [119.4, '11', HEL, () => [[DF('glad'), D0()], [AF('glad'), sitt()]]],
  // "Titta där! Apelsinen är orange": Agda pekar med vingen på apelsinen i korgen; Disa förvånad, sedan glad, tittar på korgen,
  // på Agda och nickar (QA 2026-11-27: förut förvånad i 4 s)
  [121.0, '11a', HEL, tl => { const E = 121.0 + tl, f = tl < 1.4 ? DB('glad', 'forvanad', del(0.3, 0.6, tl)) : DB('forvanad', 'glad', del(1.4, 1.9, tl));
    const [df, dp] = dTitta([f, D0()], E < 123.6 ? [1440, 690] : AFACE, del(0.3, 0.7, tl));
    return [E > 123.9 && E < 125.3 ? B.L.nicka(df, dp, E - 123.9, 1.4) : [df, dp], [AF('stolt'), (k => sitt({ armar: [6, 6 + 48 * k], rikt: 0.8 * k, bada: 0.8 * k, boj: 2 * k }))(del(0.2, 0.6, tl) * (1 - del(4.0, 4.4, tl)))]]; }],
  // "rund, rund, rund": tassen ritar tre cirklar i luften, en per ord, med en kritring efter (rundRing)
  [125.5, '11b', NAR_D, tl => [[DF('glad'), rundPose(125.5 + tl)], [AF('stolt'), sitt()]]],
  // Luckan: pantomim på grooven, klipp mellan Agda (lyfter en frukt) och Disa (reagerar). Inga repliker.
  [128.0, '11d', NAR_A, tl => [[DF('glad'), D0()], [AF('nyfiken'), haller(del(0.15, 0.55, tl), 20)]]],
  [129.4, '11d2', NAR_D, tl => [skaka(dTitta([DB('glad', 'nyfiken', 0.4), D0()], [1300, 560]), tl), [AF('nyfiken'), haller(1, 20)]]],
  [130.5, '11d3', NAR_A, tl => [[DF('glad'), D0()], [AF('nyfiken'), haller(1, 20 * (1 - Math.sin(Math.PI * del(0, 0.7, tl))))]]],
  [131.6, '11d4', NAR_D, tl => [skaka(dTitta([DB('glad', 'nyfiken', 0.5), D0()], [1300, 560]), tl, 0.8), [AF('nyfiken'), haller(1, 20)]]],
  [132.4, '11d5', NAR_A, tl => [[DF('glad'), D0()], [AB('nyfiken', 'glad', del(0.4, 0.8, tl)), haller(1, 20 * (1 - Math.sin(Math.PI * del(0, 0.7, tl))))]]],
  // apelsinen! stor glad nick, vingen och tassen sträcks mot varandra och möts, sedan håller Disa upp apelsinen mot himlen,
  // tittar på den och sedan på Agda (tacket syns i bild)
  [133.5, '11e', TVA, tl => { const E = 133.5 + tl, r = del(OVER[0] - 0.3, OVER[1], E), u = del(UPP[0], UPP[1], E);
    let d = [DB('glad', 'jatteglad', del(0, 0.25, tl) * (1 - del(0.9, 1.2, tl))), { ...pekH(r), armar: [0, 16 * r + 12 * r * (1 - u) + 52 * u], boj: 2.5 * r + 3 * r * (1 - u) }];
    if (E < 134.4) d = B.L.nicka(d[0], d[1], tl, 0.9, 2);
    if (E > UPP[0]) d = dTitta(d, E < 136.9 ? [880, 380] : AFACE, del(UPP[0], UPP[1], E));
    if (E > 137.0 && E < 138.0) d = B.L.nicka(d[0], d[1], E - 137.0, 1.0, 1);
    return [d, [AF('glad'), { ...haller(1 - del(OVER[1] + 0.1, OVER[1] + 0.6, E), 20 + 16 * r * (1 - del(OVER[1], OVER[1] + 0.5, E))), boj: -4 * r * (1 - del(OVER[1], OVER[1] + 0.5, E)) }]]; }],
  [138.0, '13a', TVA, tl => [[DB('glad', 'forvanad', del(0, 0.3, tl)), { ...pekH(1 - del(0.3, 0.8, tl)), armar: [0, 68 * (1 - del(0.1, 0.6, tl))] }], [AF('forvanad'), sitt()]]],
  // Agdas reaktion i närbild (QA 2026-11-27): förvånad, sedan orolig, tittar ner mot vattnet där apelsinen föll
  [140.3, '13b', NAR_A, tl => [[DF('forvanad'), { ...D0(), rikt: 0.6 }], [AB('forvanad', 'ledsen', del(0.8, 1.4, tl)), sitt({ rikt: -0.6, upp: -0.4 * del(0.2, 0.6, tl) })]]],
  // "Längre, längre, längre bort": helbild åt vänster, apelsinen flyter ut på öppet vatten
  [142.6, '13c', VANST, tl => [[DB('forvanad', 'ledsen', del(0, 1.5, tl)), { ...D0(), rikt: -0.5 }], [AF('ledsen'), sitt({ rikt: -0.6 })]]],
  // gråter med riggens gråt (Sanna 2026-11-26 "improve crying animation"): en tår per öga som rinner, darrande mun, tre små snyftningar
  [147.1, '13d', NAR_D, tl => { const [gf, gp] = GRAT(tl), k = del(0, 0.6, tl); return [[B.L.blanda(DF('ledsen'), gf, k), { ...D0(), ...gp }], [AF('ledsen'), sitt()]]; }],
  [151.8, '13e', NAR_D, tl => [[B.L.blanda(GRAT(4.7 + tl)[0], DF('nyfiken'), del(0, 0.8, tl)), { ...D0(), luta: 5 * del(0.3, 0.9, tl) }], [AF('ledsen'), sitt()]]],
  // Agda pekar med vingen ut mot apelsinen (åt vänster), som blänker
  [154.3, '13f', VANST, tl => [[DF('nyfiken'), { ...D0(), rikt: -0.5 }], [AF('nyfiken'), (k => sitt({ armar: [6 + 50 * k, 6], rikt: -0.8 * k, bada: 0.8 * k, boj: -2 * k }))(del(0.2, 0.6, tl))]]],
  [156.6, '14a', VANST, tl => [[DF('glad'), D0()], [AF('stolt'), AP('sitter', 'stolt', del(0, 0.6, tl))]]],
  [158.0, '14b', VANST, tl => [[DF('jatteglad'), { ...D0(), rikt: -0.3 }], [AF('jatteglad'), tl < 0.3 ? AP('stolt', 'huka', tl / 0.3) : { ...AP('neutral', 'hurra', 0.6), rikt: -0.5 }]]],
  [160.0, '14c', VANST, tl => [[DF('glad'), { ...D0(), rikt: -0.6 }], [AF('glad'), { ...A0(), rikt: -0.8, armar: [-20 + 14 * Math.sin(tl * 9), -20 - 14 * Math.sin(tl * 9)] }]]],
  // "Hit med apelsinen": apelsinen hoppar upp på Agdas huvud och hon simmar tillbaka, ett kliv per "hit"; Disa sträcker sig ner mot den
  [162.1, '14d', VANST, tl => [dTitta([DF('jatteglad'), pekV(del(0.3, 0.8, tl))], apelsinPlats(162.1 + tl) || [700, 880]),
    [AF('glad'), { ...A0(), rikt: 0.8 * del(0.5, 0.9, tl), armar: Array(2).fill(30 * pulsar(tl, [0.5, 1.1, 1.7], 0.4)) }]]],
  // "En halva var": den hela apelsinen i Disas tass poppar isär i två halvor på "halva" (DELA), en till var
  [164.5, '14e', TVA, () => [[DF('glad'), pekH(1)], [AF('glad'), haller(1)]]],
  // mums på varje tugga: uttrycket glider fram och tillbaka med tuggan i stället för att byta tvärt
  [166.8, '14f', TVA, tl => { const k = pulsar(tl, BETT, 0.42); return [[DB('fnissig', 'jatteglad', k), pekH(1)], [AB('fnissig', 'mums', k), haller(1)]]; }],
  [168.2, '14g', TVA, tl => [[DB('glad', 'kawaii', del(0, 0.4, tl)), DP('neutral', 'hurra', del(0.1, 0.5, tl))],   // kawaii 3 av 3
    [AB('jatteglad', 'kawaii', del(0, 0.4, tl)), sitt({ armar: [70 * del(0.1, 0.5, tl), 70 * del(0.1, 0.5, tl)] })]]],
];
const BETT = [0.2, 0.7, 1.2];   // mums, mums, mums (sekunder in i 14f)
const DELA = 164.95;

function lage(E) {
  const { i, s, tl } = skott(S, E); let [[df, dp], [af, ap]] = s[3](tl);
  if (i && tl < 0.45 && S[i - 1][2] === s[2]) { const [[df0, dp0], [af0, ap0]] = S[i - 1][3](s[0] - S[i - 1][0]), k = mjuk(tl / 0.45);
    df = B.L.blanda(df0, df, k); dp = { ...dp, ...B.L.blandaPose(dp0, dp, k) }; af = LA.blanda(af0, af, k); ap = { ...ap, ...LA.blandaPose(ap0, ap, k) }; }
  // lyfta armar (26–80°) göms bakom kroppen i riggen; riggens vink håller dem synliga (som i sjön)
  const A = Math.max(...[0, 1].map(i => (df.armar?.[i] || 0) + (dp.armar?.[i] || 0)));
  dp = { ...dp, vink: Math.max(dp.vink || 0, mjuk((A - 12) / 12)) };
  return [[df, dp], [af, ap]];
}

// Båten: puttrar in från vänster och lägger till (119.4–121.0), sedan ligger den still och gungar lätt.
const batX = E => lerp(260, B_X1, mjuk((E - 119.4) / 1.6)), batFart = E => 1 - del(120.4, 121.2, E);

// Apelsinen i vattnet: [x, y, skala]. "Längre bort" (QA 2026-11-27: förut stannade den vid bryggans sista stolpe): åt vänster
// framför båten och ut på öppet vatten, ett steg per "längre". "Hit": hoppar upp på Agdas huvud, hon simmar tillbaka med den.
const LANGRE = [142.6, 143.5, 144.4], HIT = [162.6, 163.2, 163.8];
const DRIV = [[985, 905, 1], [770, 897, 0.9], [545, 883, 0.8], [330, 868, 0.72]];
const stegP = (E, ts, P, d) => { let q = P[0]; ts.forEach((t0, j) => { q = q.map((v, n) => lerp(v, P[j + 1][n], mjuk((E - t0) / d))); }); return q; };
function apelsinPlats(E) {
  const bob = 5 * Math.sin(E * 3.1);
  if (E < 138.6 || E >= 164.5) return null;
  if (E < 142.6) return [lerp(1000, 985, del(140.3, 142.6, E)), 905 + bob, 1];
  if (E < HIT[0]) { const [x, y, sk] = stegP(E, LANGRE, DRIV, 0.5); return [x, y + bob, sk]; }
  const h = huvud(); if (!h) return null;
  if (E < HIT[0] + 0.35) { const u = mjuk((E - HIT[0]) / 0.35), [x, y, sk] = DRIV[3]; return [lerp(x, h.x, u), lerp(y, h.y - 34, u) - 60 * Math.sin(Math.PI * u), sk]; }
  return [h.x, h.y - 34, 0.72];
}
const huvud = () => A?.fig ? punkt($('fram'), A.fig.querySelector('.kropp'), 512, 150) : null;   // toppen av Agdas huvud
// Agda: var hon är (gruppens fötter), om hon är i vattnet och var hennes vattenlinje är.
const AGDA_IN = [1140, VY + 125], AGDA_FRAM = [490, 990];
const agdaSkala = y => 1 + 0.12 * kl((y - DACK) / (VY + 125 - DACK));   // närmare kameran = lite större (framför bryggan)
function agdaPlats(E) {
  if (E < 158.3 || E >= 164.5) return [AX, DACK, false];
  // hoppet (QA 2026-11-27): rakt fram ut över däckets framkant, mot kameran: först upp, sedan ner framför bryggan i det närmre
  // vattnet och lite större (närmare). Förut åt sidan över båten och Disa.
  if (E < 159.0) { const u = (E - 158.3) / 0.7; return [lerp(AX, AGDA_IN[0], u), lerp(DACK, AGDA_IN[1], u * u) - 230 * Math.sin(Math.PI * u), u > 0.8]; }
  const bob = 6 * Math.sin(E * 4);
  if (E < 160.0) return [AGDA_IN[0], AGDA_IN[1] + bob, true];
  if (E < 162.1) { const u = mjuk((E - 160) / 2.1); return [lerp(AGDA_IN[0], AGDA_FRAM[0], u), lerp(AGDA_IN[1], AGDA_FRAM[1], u) + bob, true]; }   // simmar fram till apelsinen
  const x = stegP(E, HIT, [[AGDA_FRAM[0]], [640], [790], [900]], 0.45)[0]; return [x, lerp(AGDA_FRAM[1], AGDA_IN[1], del(HIT[0], HIT[2] + 0.4, E)) + bob, true];
}
const AHAND = [140, 600], DHAND = [885, 600];   // vingens och tassens spets i riggarnas rutor
const apelsinBild = (x, y, s) => `<image href="${APELSIN}" x="${(x - 781 * 0.14 * s / 2).toFixed(1)}" y="${(y - 713 * 0.14 * s / 2).toFixed(1)}" width="${(781 * 0.14 * s).toFixed(1)}" height="${(713 * 0.14 * s).toFixed(1)}"/>`;
const frukt = { applet: (x, y) => `<image href="${APPLE}" x="${(x - 729 * 0.075 / 2).toFixed(1)}" y="${(y - 836 * 0.075 / 2).toFixed(1)}" width="${729 * 0.075}" height="${836 * 0.075}"/>`,
  banan: (x, y) => `<image href="${BANAN}" x="${(x - 1659 * 0.055 / 2).toFixed(1)}" y="${(y - 1535 * 0.055 / 2).toFixed(1)}" width="${1659 * 0.055}" height="${1535 * 0.055}" transform="rotate(-20 ${x.toFixed(1)} ${y.toFixed(1)})"/>` };
const KORG_P = { applet: [KX - 34, RIM - 20], banan: [KX + 8, RIM - 34] };
const halva = (x, y, k) => { const r = 40 * k; if (r < 3) return '';   // en halva i snitt: skal, vitt, ljust fruktkött och klyftorna
  return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><circle r="${r + 6}" fill="#fff"/><circle r="${r}" fill="#F28C28"/><circle r="${r * 0.86}" fill="#FFF3DC"/>
    <circle r="${r * 0.78}" fill="#FFB347"/>${[0, 1, 2, 3, 4, 5, 6, 7].map(j => { const a = j * Math.PI / 4; return `<line x2="${(r * 0.78 * Math.cos(a)).toFixed(1)}" y2="${(r * 0.78 * Math.sin(a)).toFixed(1)}" stroke="#FFE2B0" stroke-width="${(r * 0.07).toFixed(1)}"/>`; }).join('')}</g>`; };

// Fruktens väg: korgen → upp i vingen (0,4 s) → tillbaka i korgen (0,3 s)
function fruktVag(E, [t0, t1], korg, ah) {
  if (E < t0 || (t1 && E >= t1 + 0.3)) return null;
  const u = mjuk((E - t0) / 0.4), b = t1 && E > t1 ? mjuk((E - t1) / 0.3) : 0;
  const x = lerp(lerp(korg[0], ah.x, u), korg[0], b), y = lerp(lerp(korg[1], ah.y - 10, u), korg[1], b) - 50 * Math.sin(Math.PI * (b ? b : u));
  return [x, y];
}

function fram(E) {
  const g = $('fram'), aArm = A.fig.querySelector('.arm-l'), dArm = B.fig.querySelector('.arm-r');
  const ah = punkt(g, aArm, ...AHAND), dh = punkt(g, dArm, ...DHAND);
  let h = '';
  // äpplet och bananen i pantomimen
  for (const n of ['applet', 'banan']) { const q = fruktVag(E, FRUKT[n], KORG_P[n], ah); $('korgen-' + n).style.display = q ? 'none' : ''; if (q) h += frukt[n](...q); }
  // apelsinen: korgen → Agdas vinge (132.75) → Disas tass (överlämningen) → upp mot himlen → vattnet → bort → Agdas huvud
