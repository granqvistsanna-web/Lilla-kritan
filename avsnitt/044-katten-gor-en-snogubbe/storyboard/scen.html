<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Katten gör en snögubbe scener</title>
<style>html, body { margin:0; background:#000; } svg { width:100vw; height:auto; display:block; }</style>
</head>
<body>
<!-- 044 Katten gör en snögubbe: kodscenerna för storyboarden. window.rad(id) ritar radens stillbild (id som i rader.mjs, ?rad=14 visar en).
     Serveras från repots rot (bygg.mjs). Förlaga: 043 storyboard/scen.html. Björkdungen med grönteal himmel (bakgrunder/bjorkdungen.md),
     katten-kaj live ur uttryck.html med tomteluvan (som 035), snögubben av tre snöbollar (rekvisita/snoboll.md) med stenar i kod,
     moroten, kvistarna (rekvisita/kvist.md), den lilla blå fågeln (som 043) och fröpåsen. Rörelsepilar (lila, streckade) bara i storyboarden. -->
<svg viewBox="0 0 1920 1080">
  <defs>
    <filter id="boil" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="5000">
      <feTurbulence id="brus" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
      <feDisplacementMap in="SourceGraphic" scale="5"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="#FAF8F2"/>
  <g id="kamera">
    <g id="platta"></g>
    <g id="bak"></g>
    <g filter="url(#boil)"><g id="sakerbak"></g></g>
    <g filter="url(#boil)"><g id="figurer"></g></g>
    <g filter="url(#boil)"><g id="saker"></g></g>
    <g id="fram" filter="url(#boil)"></g>
    <g id="pilar"></g>
  </g>
  <g id="ram"></g>
  <g id="gomda" opacity="0"></g>
</svg>
<script src="/verktyg/blinka.js"></script>
<script src="/verktyg/kant.js"></script>
<script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script>
const $ = id => document.getElementById(id);
const A = '/assets/', R = A + 'rekvisita/';
const lagg = (id, h) => $(id).insertAdjacentHTML('beforeend', h);
const bild = (href, w, h, t, extra = '') => `<image href="${href}" width="${w}" height="${h}" transform="${t}" ${extra}/>`;
const KRITA = R + 'krita-rod/cut/krita-rod.png', KRITA_SPETS = [742, 132];
const FAG = R + 'smafaglar/cut/', PASE = R + 'fropase/cut/fropase.png', LUVA = R + 'tomteluva/cut/tomteluva.png', LUVA_O = [450, 845];
const BOLL = R + 'snoboll/cut/snoboll.png', MOROT = R + 'morot/cut/morot.png', KVIST = R + 'kvist/cut/kvist.png', GUBBE = R + 'snogubbe/cut/snogubbe.png';
const PLATTA = A + 'bakgrunder/bjorkdungen/bjorkdungen-platt-gronteal.jpeg';
let KONTUR = {};

let L, G; const GS = 0.38;                            // riggen, kattens grupp, skalan (som 035)
const GOLV = 870, KATT = [600, GOLV];                 // fötterna på snön (snökanten på 75 %, fötter ca 80 %)
const iFig = ([px, py], [x, fot] = KATT, s = GS) => [x + (px - 512) * s, fot + (py - L.FOTTER) * s];

function kamera(zoom = 1, cx = 960, cy = 540) {
  const tx = Math.max(1920 - 1920 * zoom, Math.min(0, 960 - cx * zoom)), ty = Math.max(1080 - 1080 * zoom, Math.min(0, 540 - cy * zoom));
  $('kamera').setAttribute('transform', `translate(${tx.toFixed(1)} ${ty.toFixed(1)}) scale(${zoom})`);
  $('brus').nextElementSibling.setAttribute('scale', (5 / zoom).toFixed(2));
}

// --- Effekter och notation (som 043) ------------------------------------------------------------------------------------------
const glans = (x, y, r, o = 1) => `<path transform="translate(${x} ${y}) scale(${r})" opacity="${o}" d="M0 -1 L.2 -.2 L1 0 L.2 .2 L0 1 L-.2 .2 L-1 0 L-.2 -.2Z" fill="#fff6c8" stroke="#e6b422" stroke-width=".06"/>`;
const skimmer = (x, y, k = 1, vidd = 1) => lagg('fram', [[-1, -0.7, 1], [1.1, -0.4, 0.8], [0.2, 1.1, 0.7], [-1.2, 0.8, 0.6]]
  .map(([dx, dy, s]) => glans(x + dx * 40 * vidd, y + dy * 34 * vidd, 16 * s * k * vidd, Math.min(1, 0.4 + k))).join(''));
const pil = (d, x, y, v, s = 6) => `<g fill="none" stroke="#7b2cbf" stroke-width="${s}" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
  <path d="${d}" stroke-dasharray="${3 * s} ${2.4 * s}"/><path d="M${x + 5 * s * Math.cos(v + 2.6)} ${y + 5 * s * Math.sin(v + 2.6)} L${x} ${y} L${x + 5 * s * Math.cos(v - 2.6)} ${y + 5 * s * Math.sin(v - 2.6)}"/></g>`;
const rakpil = (x0, y0, x1, y1, s) => pil(`M${x0} ${y0} L${x1} ${y1}`, x1, y1, Math.atan2(y1 - y0, x1 - x0), s);
const bagpil = (x0, y0, cx, cy, x1, y1, s) => pil(`M${x0} ${y0} Q${cx} ${cy} ${x1} ${y1}`, x1, y1, Math.atan2(y1 - cy, x1 - cx), s);
const pilar = (...p) => lagg('pilar', p.join(''));
const nickpil = (x, y, s = 5) => pilar(bagpil(x + 40, y - 30, x + 70, y + 10, x + 40, y + 50, s), bagpil(x + 70, y + 50, x + 100, y + 10, x + 70, y - 30, s));
const text = (x, y, t, s = 34) => lagg('fram', `<text x="${x}" y="${y}" style="font:800 ${s}px Fredoka,system-ui;fill:#7b2cbf">${t}</text>`);
const krita = (x, y, v = 125, s = 0.33) => lagg('pilar', bild(KRITA, 755, 265, `translate(${x} ${y}) rotate(${v}) scale(${s}) translate(${-KRITA_SPETS[0]} ${-KRITA_SPETS[1]})`));
function kontur(namn, t, k, bredd, farg = '#9a8a7a') {
  lagg('pilar', `<g transform="${t}"><path id="k-${namn}" d="${KONTUR[namn].d}" pathLength="1" fill="none" stroke="${farg}" stroke-width="${bredd}"
    stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="${k} 2"/></g>`);
  const p = $('k-' + namn), q = p.getPointAtLength(p.getTotalLength() * Math.min(0.999, k)), sm = $('kamera').getCTM().inverse().multiply(p.getCTM());
  const pt = new DOMPoint(q.x, q.y).matrixTransform(sm); return [pt.x, pt.y];
}
const papper = () => { $('platta').innerHTML = `<rect x="-200" y="-200" width="2400" height="1500" fill="#F6EFE3"/>
  <rect x="120" y="70" width="1680" height="940" rx="14" fill="#FDFBF4" stroke="#e8e0cf" stroke-width="6"/>`; };

// --- Björkdungen -------------------------------------------------------------------------------------------------------------
// Plattan 2752 × 1536 täcker 1920 × 1080 (skala 0,703, 7,6 px utanför till vänster). Holkens hål (2670, 807) → (1869, 567).
const HAL = [1869, 567], STOLPE = [1888, 866], BJORK = [250, 888], GOMD = [1790, 884];
function lund({ spar = 0, sno = 1, fron = 0, kvistBjork = 0, kvistGomd = 0, skimra = 0 } = {}) {
  $('platta').innerHTML = `<image href="${PLATTA}" width="1920" height="1080" preserveAspectRatio="xMidYMid slice"/>`;
  if (spar) lagg('bak', Array.from({ length: 5 }, (_, i) => `<ellipse cx="${100 + i * 95}" cy="${GOLV + 4 + (i % 2) * 14}" rx="16" ry="7" fill="#b9c9d8" opacity=".55"/>`).join(''));
  if (fron) lagg('bak', [[760, 884], [790, 892], [820, 880], [850, 890], [880, 884], [905, 894], [835, 898]].map(([x, y], i) => `<ellipse cx="${x}" cy="${y}" rx="7" ry="4.5" transform="rotate(${i * 37} ${x} ${y})" fill="#8a5a2b" stroke="#fff" stroke-width="2"/>`).join(''));
  if (kvistBjork) kvistSpets(...BJORK);
  if (kvistGomd) { kvistSpets(...GOMD); if (skimra) skimmer(GOMD[0] + 20, GOMD[1] - 30, skimra, 0.7); }
  if (sno) lagg('fram', Array.from({ length: Math.round(60 * sno) }, (_, i) => `<circle cx="${(i * 277) % 1920}" cy="${(i * 163) % 1000}" r="${3 + i % 4}" fill="#fff" opacity=".85"/>`).join(''));
}
// en kvistspets som sticker upp ur snön (kvisten lutad, bara klykan ovanför snön)
const kvistSpets = (x, y) => lagg('bak', `<g transform="translate(${x} ${y}) rotate(-60) scale(0.13) translate(-760 -170)"><image href="${KVIST}" width="1168" height="295"/></g>
  <path d="M${x - 40} ${y + 6} Q${x} ${y - 10} ${x + 40} ${y + 6}Z" fill="#FAF8F2"/>`);

// --- Snögubben av snöbollar: underbollen r 140, mellanbollen r 105, huvudet r 75 (snoboll.png: mitt 512, radie 386 med kanten) -----
const GX = 1130, BOLLAR = [[GX, GOLV - 132, 140], [GX, GOLV - 132 - 140 - 92, 105], [GX, GOLV - 132 - 140 - 92 - 105 - 64, 75]];
const HUV = BOLLAR[2], MEL = BOLLAR[1];
const boll = (x, y, r, lager = 'sakerbak') => lagg(lager, bild(BOLL, 1024, 1024, `translate(${x} ${y}) scale(${r / 386}) translate(-512 -512)`));
const sten = (x, y, r = 11) => `<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r * 0.82}" fill="#7d7f86" stroke="#fff" stroke-width="3"/><circle cx="${x - r * 0.3}" cy="${y - r * 0.3}" r="${r * 0.25}" fill="#a4a7ae"/>`;
const OGON = [[HUV[0] - 26, HUV[1] - 24], [HUV[0] + 26, HUV[1] - 24]];
const MUN = (le) => [-2, -1, 0, 1, 2].map(i => [HUV[0] + i * 16, HUV[1] + 36 + le * (4 - i * i) * 2.5]);
const KNAPP = [[MEL[0], MEL[1] - 50], [MEL[0], MEL[1]], [MEL[0], MEL[1] + 50]];
// gubbe({ bollar: 1–3, ogon, mun (0 rak, 1 ler), knappar, nasa: 'nasa' | 'magen' | 0, armar: 0–2, vinka, fagel })
function gubbe({ bollar = 3, ogon = 0, mun = -1, knappar = 0, nasa = 0, armar = 0, vinka = 0 } = {}) {
  BOLLAR.slice(0, bollar).forEach(([x, y, r]) => boll(x, y, r));
  if (armar >= 1) kvistArm(-1, vinka); if (armar >= 2) kvistArm(1, vinka);
  lagg('saker', OGON.slice(0, ogon).map(([x, y]) => sten(x, y, 12)).join('') + (mun >= 0 ? MUN(mun).map(([x, y]) => sten(x, y, 7)).join('') : '')
    + KNAPP.slice(0, knappar).map(([x, y]) => sten(x, y, 13)).join(''));
  if (nasa === 'nasa') morot(HUV[0] - 4, HUV[1] + 4, 0.11);
  if (nasa === 'magen') morot(MEL[0] - 4, MEL[1] - 10, 0.11, 18);
}
// kvistarmen: roten (30, 170) i mellanbollens sida; sida −1 vänster (speglad, klykan utåt), +1 höger
function kvistArm(sida, vinka = 0) {
  const x = MEL[0] + sida * 92, y = MEL[1] - 24, v = -20 - vinka * 8;
  lagg('sakerbak', `<g transform="translate(${x} ${y}) scale(${sida} 1) rotate(${v}) scale(0.13) translate(-30 -170)"><image href="${KVIST}" width="1168" height="295"/></g>`);
}
// moroten: tjocka änden (212, 293) i (x, y), pekar åt höger
const morot = (x, y, s = 0.11, v = 0, lager = 'saker') => lagg(lager, bild(MOROT, 1024, 572, `translate(${x} ${y}) rotate(${v}) scale(${s}) translate(-212 -293)`));
// fröpåsen (612 × 774) i kattens tass, eller i snön
function pase({ x, y, s = 0.17, v = 0 } = {}) { if (x == null) [x, y] = iFig([800, 640]); lagg('saker', bild(PASE, 612, 774, `translate(${x} ${y}) rotate(${v}) scale(${s}) translate(-306 -420)`)); }
const fallFron = (x, y) => lagg('fram', [[0, 30], [14, 60], [-8, 90], [22, 120]].map(([dx, dy], i) => `<ellipse cx="${x + dx + i * 12}" cy="${y + dy}" rx="7" ry="4.5" fill="#8a5a2b" stroke="#fff" stroke-width="2"/>`).join(''));
// stenarna i snön vid kattens fötter (n kvar)
const STENAR = [[730, 892], [760, 900], [790, 890], [815, 902], [845, 893], [870, 901], [700, 900], [895, 890], [745, 908], [830, 910]];
const stenarSno = (n = 10) => lagg('saker', STENAR.slice(0, n).map(([x, y], i) => sten(x, y, i < 2 ? 12 : i < 7 ? 8 : 11)).join(''));

// --- Den lilla blå fågeln (som 043): kropp 800 × 689 (fötterna 400, 689), vinge roten (150, 140) på (310, 230), ögat (632, 237) -------
function fagel(x, y, { s = 0.105, flax = 0, tilt = 0, vanster = true, blink = 0 } = {}) {
  const vr = flax > 0 ? -105 : flax < 0 ? 18 : 0;
  lagg('saker', `<g transform="translate(${x} ${y}) scale(${vanster ? -s : s} ${s}) rotate(${tilt}) translate(-400 -689)">
    <image href="${FAG}fagel-kropp-bla.png" width="800" height="689"/>
    <ellipse cx="632" cy="237" rx="22" ry="${blink ? 3 : 22}" fill="#2B2321"/>${blink ? '' : '<circle cx="627" cy="231" r="6.5" fill="#fff"/>'}
    <image href="${FAG}fagel-vinge-bla.png" width="675" height="606" transform="translate(310 230) scale(0.42) rotate(${vr}) translate(-150 -140)"/></g>`);
}
const PA_HUV = [HUV[0] + 6, HUV[1] - 68];

// --- Katten med tomteluvan ---------------------------------------------------------------------------------------------------
const P = o => ({ ...L.POSE0, ...o });
const F = (n, o = {}) => ({ ...L.blanda('neutral', n, 1), ...(['glad', 'jatteglad', 'fnissig', 'stolt', 'flinar'].includes(n) ? { glad: [0, 0] } : {}), ...o });
function katt(f, p = {}, { x = KATT[0], fot = KATT[1], s = GS } = {}) {
  $('figurer').appendChild(G);
  G.setAttribute('transform', `translate(${x} ${fot}) scale(${s}) translate(-512 ${-L.FOTTER})`);
  L.rita(G, f, P(p));
}
const VINKA = { armar: [0, 60] };
const huvud = (dx = 0, y = 250) => iFig([512 + dx, y]);
const HEL = () => kamera(1), HALV = () => kamera(1.5, 880, 640), ANS = () => kamera(2.4, KATT[0], iFig([512, 430])[1]),
  HUVN = () => kamera(3.0, HUV[0], HUV[1] + 10), MELN = () => kamera(2.8, MEL[0], MEL[1]), STENN = () => kamera(2.0, 800, 820),
  STOLPN = () => kamera(2.6, 1740, 800), HOLK = () => kamera(1.5, 1400, 620);

// --- Ritintrot: kritan ritar snögubben på papperet ------------------------------------------------------------------------------
const PG = [960, 920, 0.6];                           // snögubbens nederkant (512, 1280 i bilden) och skala på papperet
const pgT = () => { const [x, y, s] = PG; return `translate(${x} ${y}) scale(${s}) translate(-512 -1280)`; };
function papperGubbe(k, fyll) { papper(); kamera(1);
  if (fyll > 0) lagg('saker', `<g transform="${pgT()}"><clipPath id="pg"><circle cx="512" cy="700" r="${820 * fyll}"/></clipPath><image href="${GUBBE}" width="1024" height="1371" clip-path="url(#pg)"/></g>`);
  if (fyll < 1) { const sp = kontur('gubbe', pgT(), k, 10 / PG[2]); if (k < 1) krita(...sp, 125, 0.42); else krita(1360, 300, 140, 0.42); }
}

// --- Raderna ---------------------------------------------------------------------------------------------------------------
const kort = () => lagg('ram', `<rect width="1920" height="1080" fill="#FBF7EE"/>
  <text x="960" y="560" style="font:700 120px Fredoka,'Arial Rounded MT Bold',system-ui;fill:#e2574c;text-anchor:middle">Lilla Kritan</text>
  <text x="960" y="700" style="font:700 30px system-ui;fill:#c0392b;text-anchor:middle">logotypen i 1 s (ingen jingel, inget titelkort)</text>`);
const ANSIKTE = { ogon: 2, mun: 0, knappar: 3 }, KLAR = { ...ANSIKTE, mun: 1, nasa: 'nasa' };
const RAD = {
  '00': () => kort(),
  '01a': () => papperGubbe(0.6, 0),
  '01b': () => papperGubbe(1, 0),
  '01c': () => { papperGubbe(1, 1); lagg('pilar', `<rect x="560" y="130" width="800" height="800" fill="none" stroke="#7b2cbf" stroke-width="6" stroke-dasharray="20 14" opacity=".8"/>`); skimmer(1180, 300, 0.7, 1.2); },

  '1': () => { lund({ spar: 1 }); HEL(); katt(F('jatteglad'), VINKA); pilar(rakpil(40, 800, 420, 800, 8)); },
  '2': () => { lund(); HALV(); katt(F('nyfiken', { titt: [0, 4] }), { svans: 0.6 }); text(...huvud(240, 160), 'mjau, mjau, mjau', 26); },
  '3': () => { lund(); HALV(); katt(F('jatteglad'), { upp: 0.5, oron: [-8, -8] }); pilar(rakpil(...huvud(-260, 600), ...huvud(-260, 420), 5)); },
  '4': () => { lund(); HALV(); katt(F('nyfiken', { titt: [8, 14] }), { luta: 6 }); text(...huvud(240, 140), '?', 50); },
  '5': () => { lund(); HALV(); katt(F('nyfiken', { titt: [12, 14] }), {}); boll(760, GOLV + 2, 26, 'saker'); },
  '6': () => { lund(); HEL(); katt(F('glad', { titt: [16, 4] }), { armar: [0, 30], luta: 4 }); boll(...BOLLAR[0]);
    pilar(bagpil(760, GOLV - 20, 900, GOLV - 60, GX - 160, GOLV - 120, 7)); text(GX - 120, GOLV - 320, 'rulla, rulla …', 34); },
  '7': () => { lund(); HEL(); katt(F('glad', { titt: [16, -6] }), {}); gubbe({ bollar: 2 }); pilar(bagpil(780, GOLV - 40, 900, MEL[1] - 160, MEL[0] - 100, MEL[1] - 40, 6)); },
  '8': () => { lund(); HEL(); katt(F('glad', { titt: [16, -10] }), {}); gubbe({ bollar: 3 }); pilar(bagpil(780, GOLV - 40, 900, HUV[1] - 180, HUV[0] - 80, HUV[1] - 30, 6)); },
  '9': () => { lund(); HEL(); katt(F('jatteglad', { titt: [14, -8] }), { upp: 0.5 }, { x: 520 }); gubbe(); pilar(rakpil(600, 940, 470, 940, 6)); },

  '10': () => { lund(); HUVN(); gubbe(); text(HUV[0] + 90, HUV[1] - 60, '?', 50); text(HUV[0] - 130, HUV[1] + 120, 'paus 3 s', 22); },
  '11': () => { lund(); STENN(); katt(F('forvanad', { titt: [10, 14] }), {}); stenarSno(); [0, 3, 6, 8].forEach(i => lagg('fram', glans(STENAR[i][0] + 14, STENAR[i][1] - 16, 12))); },
  '12': () => { lund(); STENN(); katt(F('glad', { titt: [12, 16] }), { luta: 5 }); stenarSno(); },
  '13': () => { lund(); HUVN(); gubbe({ ogon: 2 }); text(HUV[0] - 160, HUV[1] - 70, 'ett öga … två ögon', 18);
    pilar(bagpil(HUV[0] - 200, HUV[1] + 160, HUV[0] - 120, HUV[1] - 40, OGON[0][0] - 16, OGON[0][1], 4)); },
  '14': () => { lund(); HUVN(); gubbe({ ogon: 2, mun: 0 }); pilar(bagpil(HUV[0] - 160, HUV[1] + 170, HUV[0] - 100, HUV[1] + 80, HUV[0] - 40, HUV[1] + 34, 4)); },
  '15': () => { lund(); MELN(); gubbe(ANSIKTE); text(MEL[0] + 50, MEL[1] - 70, 'en … två … tre', 18); },
  '16': () => { lund(); kamera(1.8, 920, 640); katt(F('nyfiken', { titt: [16, -10] }), { luta: 6 }); gubbe(ANSIKTE); text(HUV[0] + 60, HUV[1] + 10, '?', 40); },
  '17': () => { lund(); HEL(); katt(F('trumpen', { titt: [0, 6] }), { oron: [12, 12] }); gubbe(ANSIKTE); },

  '18a': () => { lund(); HEL(); katt(F('nyfiken', { titt: [16, 6] }), {}); gubbe(ANSIKTE);
    const t = `translate(860 ${GOLV - 30}) scale(0.22) translate(-512 -286)`, sp = kontur('morot', t, 0.55, 9 / 0.22); krita(...sp, 125, 0.33); },
  '18b': () => { lund(); HEL(); katt(F('nyfiken', { titt: [16, 6] }), {}); gubbe(ANSIKTE);
    kontur('morot', `translate(860 ${GOLV - 30}) scale(0.22) translate(-512 -286)`, 1, 9 / 0.22); krita(1000, GOLV - 120, 140, 0.33); text(760, GOLV - 140, 'paus 3 s', 22); },
  '18c': () => { lund(); kamera(1.8, 880, 760); katt(F('glad', { titt: [16, 10] }), {}); gubbe(ANSIKTE); morot(860 - (512 - 212) * 0.22, GOLV - 30, 0.22); skimmer(860, GOLV - 40, 0.8, 1.3); },
  '19': () => { lund(); HALV(); katt(F('glad'), { svans: 0.6 }); gubbe(ANSIKTE); morot(780, GOLV - 30, 0.22); krita(1000, 560, 140, 0.33); nickpil(...huvud(260, 160)); },
  '20': () => { lund(); HEL(); katt(F('fnissig'), {}); gubbe({ ...ANSIKTE, nasa: 'magen' }); pilar(bagpil(780, GOLV - 40, 900, MEL[1] - 160, MEL[0] - 30, MEL[1] - 30, 6)); text(MEL[0] + 120, MEL[1] - 20, 'inte där!', 26); },
  '21': () => { lund(); HUVN(); gubbe({ ...ANSIKTE, nasa: 'nasa' }); text(HUV[0] - 160, HUV[1] - 80, 'hopp!', 26); pilar(bagpil(HUV[0] - 20, HUV[1] + 170, HUV[0] - 120, HUV[1] + 80, HUV[0] - 20, HUV[1] + 12, 4)); },
  '22': () => { lund(); kamera(2.3, GX, HUV[1] + 60); gubbe(KLAR); text(HUV[0] + 70, HUV[1] + 50, 'ler', 22); },

  '23': () => { lund(); HEL(); katt(F('nyfiken', { titt: [16, -4] }), {}); gubbe(KLAR); text(MEL[0] - 150, MEL[1], '?', 40); text(MEL[0] + 120, MEL[1], '?', 40); },
  '24': () => { lund({ kvistBjork: 0 }); HEL(); katt(F('glad', { titt: [-12, 14] }), { luta: -6 }, { x: 380 }); gubbe({ ...KLAR, armar: 1 });
