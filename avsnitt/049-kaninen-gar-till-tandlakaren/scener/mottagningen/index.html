<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Kaninen går till tandläkaren</title>
<style>html, body { margin:0; background:#000; } svg { width:100vw; height:100vh; display:block; }</style>
</head>
<body>
<!-- 049 Kaninen går till tandläkaren: hela kodscenen (grind 6). Komposition och mått som storyboarden (../../storyboard/scen.html), tiden och
     raderna ur rader.json (skrivs av storyboard/bygg.mjs). Maskineriet (tid, ritintro, kritan, ljud, kritiris) är 046:s scen.
     Rendera: node verktyg/render-delat.mjs avsnitt/049-kaninen-gar-till-tandlakaren/scener/mottagningen [--snabb].
     Bara hårda klipp; den enda åkningen är zoomen in i teckningen. Kritan är liten, utan ansikte, knackar aldrig. Tandläkaren (doktorn B)
     säger inga meningar, bara doktorns små ljud, och står still bredvid stolen. I närbilderna på munnen och snabeln kommer hennes hand in
     från höger (rockärm + hand i kod) och håller spegeln eller tandborsten i skaftets ände. Rad 00 (logotypen) läggs på i sammanslagningen. -->
<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs id="defs">
    <filter id="boil" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="5000">
      <feTurbulence id="brus" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
      <feDisplacementMap id="boilStyrka" in="SourceGraphic" scale="2.5"/>
    </filter>
    <filter id="mjukStrale" x="-0.2" y="-0.2" width="1.4" height="1.4"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="#FAF8F2"/>
  <g id="kamera">
    <g id="rummet"></g>
    <!-- stolen i två delar: foten står kvar, sätet (med ryggen, lampan och fotstödet) åker upp, kolven fyller glappet -->
    <g id="stolfot"><image class="stolbild" clip-path="url(#stolKlippFot)" href="/assets/rekvisita/tandlakarstolen/cut/tandlakarstolen.png"/></g>
    <g id="stolkolv"><image class="stolbild" clip-path="url(#stolKlippKolv)" href="/assets/rekvisita/tandlakarstolen/cut/tandlakarstolen.png"/></g>
    <g id="stolg"><image class="stolbild" clip-path="url(#stolKlippTopp)" href="/assets/rekvisita/tandlakarstolen/cut/tandlakarstolen.png"/></g>
    <g filter="url(#boil)"><g id="figurer"></g></g>
    <g filter="url(#boil)"><g id="saker"></g></g>
    <g id="fram"></g>
  </g>
  <g id="papper"></g>
  <g id="ram"></g>
</svg>
<script src="/verktyg/blinka.js"></script>
<script src="/verktyg/doktor-saker.js"></script>
<script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script>
const $ = id => document.getElementById(id), f1 = v => v.toFixed(1);
const lagg = (id, h) => $(id).insertAdjacentHTML('beforeend', h);
const A = '/assets/', R = A + 'rekvisita/';
const KRITA = R + 'krita-rod/cut/krita-rod.png', KRITA_SPETS = [742, 132];
// Gosedjurselefanten (rekvisita/gosedjur-elefant.md), 884 × 986, utan ansikte: ögon och kinder i kod
const ELE = R + 'gosedjur-elefant/cut/gosedjur-elefant.png', ELE_C = [442, 520], ELE_H = 983, ELE_WH = [884, 986];
const ELE_OGON = [[372, 318], [548, 318]], ELE_KIND = [[330, 392], [596, 392]], ELE_SNABEL = [470, 560], ELE_HUVUD = [460, 330];

// Mått (storyboarden): rummet med grönblå vägg, stolen 797 × 849 (säte y 440 vid x 300–420, lampan [220, 115]); kolven x 307–434, delas vid y 660
const RUM = { fil: A + 'bakgrunder/mottagningen/mottagningen-teal-dekor.png', w: 1876, h: 1058 }, RS = 1920 / RUM.w;
const STOL = { w: 797, h: 849, x: 360, fot: 975, s: 1.0, satesY: 440, satesX: 370, lampa: [220, 115], UPP: 36, KLIPP: 660, KLIPPX: 480 };   // sätet åker upp 36 px (Sanna: 60 var för högt)
const STOL_TOPP = STOL.fot - STOL.h * STOL.s, SATE = [STOL.x + STOL.satesX * STOL.s, STOL_TOPP + STOL.satesY * STOL.s];
const KS = 0.55, PA_GOLV = [560, 990], PA_STOL = [SATE[0], SATE[1] + 108], PA_NER = [SATE[0] - 140, PA_GOLV[1]];
const DOKTOR = [1050, 990, 0.85];   // närmare stolen, så att hennes egen arm når munnen
const MAGE = [540, 700], MUN = [512, 470], FICKA = [589, 497];   // kaninen och doktorn B (riggarnas 1024-ruta); FICKA: bröstfickans överkant
const NER = -30, EH = 200;

let DL, KL, GD, GK, BL, ELEK;
let KZ = 1, BOILZ = null;
const ZOOM = { hel: 1, kanin: 1.45, kaninNar: 1.95, kaninHel: 1.55, doktor: 2.0, dokKanin: 1.35, lampa: 2.2, ele: 2.1, mun: 2.3, ficka: 2.4 };
function kamera(z, cx, cy) { cx = kl(cx, 960 / z, 1920 - 960 / z); cy = kl(cy, 540 / z, 1080 - 540 / z); $('kamera').setAttribute('transform', `translate(${f1(960 - cx * z)} ${f1(540 - cy * z)}) scale(${z})`); }
const punkt = (el, x, y) => { const m = DOMMatrix.fromMatrix($('kamera').getCTM()).inverse().multiply(el.getCTM()); const q = m.transformPoint(new DOMPoint(x, y)); return [q.x, q.y]; };
function doktorPa(x, y) { GD.setAttribute('transform', `translate(${f1(x)} ${f1(y)}) scale(${DOKTOR[2]}) translate(-512 ${-DL.FOTTER})`); }
function kaninPa([x, y]) { GK.setAttribute('transform', `translate(${f1(x)} ${f1(y)}) scale(${KS}) translate(-512 ${-KL.FOTTER})`); }
const dokPunkt = ([x, y]) => [DOKTOR[0] + (x - 512) * DOKTOR[2], DOKTOR[1] + (y - DL.FOTTER) * DOKTOR[2]];
// doktorns högra hand (skärmens högra): den runda handen i armlagren som ligger längst till höger
const hogerHand = () => { let b = null; GD.querySelectorAll('.armar-bak circle, .armar-fram circle').forEach(c => { if (+c.getAttribute('r') !== 35) return;
  const p = punkt(c, +c.getAttribute('cx'), +c.getAttribute('cy')); if (!b || p[0] > b[0]) b = p; }); return b; };
const vansterHand = () => { let b = null; GD.querySelectorAll('.armar-bak circle, .armar-fram circle').forEach(c => { if (+c.getAttribute('r') !== 35) return;
  const p = punkt(c, +c.getAttribute('cx'), +c.getAttribute('cy')); if (!b || p[0] < b[0]) b = p; }); return b; };
const handKnopp = h => `<circle cx="${f1(h[0])}" cy="${f1(h[1])}" r="${f1(35 * DOKTOR[2])}" fill="#f7ba99" stroke="#e3a07f" stroke-width="2.5"/>`;

// --- Tid ------------------------------------------------------------------------------------------------------------------------
const kl = (k, a = 0, b = 1) => Math.max(a, Math.min(b, k)), lerp = (a, b, k) => a + (b - a) * k;
const mjuk = k => (k = kl(k), k * k * (3 - 2 * k)), del = (a, b, t) => mjuk((t - a) / (b - a));
const bump = (a, b, t) => (t <= a || t >= b) ? 0 : Math.sin(Math.PI * (t - a) / (b - a));
const lerp2 = (A, B, k) => [lerp(A[0], B[0], k), lerp(A[1], B[1], k)];
let TT = 0, RAD_L = [], RR = {}, ROSTER = [], DURATION = 0, CUR = null;
const SVART = 0.6;
const ML = n => ROSTER[n - 1][1];
const MT = (i = 0) => (CUR.malin || [])[i]?.[1] ?? 0;
const LT = f => (CUR.ljud || []).filter(x => x[0].startsWith(f)).map(x => x[1]);

// --- Sakerna i kod --------------------------------------------------------------------------------------------------------------
const elefant = (x, y, h = EH) => { const s = h / ELE_H;
  const ans = ELE_OGON.map(([ox, oy]) => `<ellipse cx="${ox}" cy="${oy}" rx="20" ry="26" fill="#2a1d18"/><circle cx="${ox + 7}" cy="${oy - 9}" r="7" fill="#fff"/>`).join('')
    + ELE_KIND.map(([kx, ky]) => `<ellipse cx="${kx}" cy="${ky}" rx="30" ry="18" fill="#F4A6B8" opacity=".7"/>`).join('');
  return `<g transform="translate(${f1(x - ELE_C[0] * s)} ${f1(y - ELE_C[1] * s)}) scale(${s.toFixed(4)})"><image href="${ELE}" width="${ELE_WH[0]}" height="${ELE_WH[1]}"/>${ans}</g>`; };
const eleT = ([x, y], h = EH) => { const s = h / ELE_H; return `translate(${f1(x - ELE_C[0] * s)} ${f1(y - ELE_C[1] * s)}) scale(${s.toFixed(4)})`; };
const elePunkt = ([x, y], [px, py], h = EH) => { const s = h / ELE_H; return [x + (px - ELE_C[0]) * s, y + (py - ELE_C[1]) * s]; };
const krita = (x, y, s = 0.33 / Math.sqrt(KZ), v = 125) => `<image href="${KRITA}" width="755" height="265" transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(v)}) scale(${s.toFixed(3)}) translate(${-KRITA_SPETS[0]} ${-KRITA_SPETS[1]})"/>`;
// Tandborsten: skaft (mint), borsthuvud, vita borststrån uppåt. Mitten i (x, y), liggande, längd 300·s; v = vridning
function tandborste(x, y, s = 1, v = 0) {
  const sk = `M-150 -14 Q-155 0 -150 14 L95 12 Q110 10 112 0 Q110 -10 95 -12 Z`, hu = `M95 -16 L150 -16 Q160 -16 160 -6 L160 6 Q160 16 150 16 L95 16 Z`;
  const str = Array.from({ length: 6 }, (_, i) => `<rect x="${100 + i * 10}" y="-46" width="7" height="32" rx="3"/>`).join('');
  return `<g transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(v)}) scale(${s})"><path d="${sk}" fill="#5CC8B5" stroke="#fff" stroke-width="7" paint-order="stroke"/><path d="${hu}" fill="#3FA796" stroke="#fff" stroke-width="7" paint-order="stroke"/>
    <g fill="#fff" stroke="#d9e4ea" stroke-width="2">${str}</g></g>`;
}
// Tandborstens streck i ritordning (skaftet, huvudet, sex borststrån), i scenens mått: mitt c, skala s, vridning v
const TB_DRAG = ([cx, cy], s, v) => { const r = v * Math.PI / 180, P = (x, y) => `${f1(cx + s * (x * Math.cos(r) - y * Math.sin(r)))} ${f1(cy + s * (x * Math.sin(r) + y * Math.cos(r)))}`;
  return [`M${P(-150, -14)} Q${P(-157, 0)} ${P(-150, 14)} L${P(95, 12)} Q${P(110, 10)} ${P(112, 0)} Q${P(110, -10)} ${P(95, -12)} L${P(-150, -14)}`,
    `M${P(95, -16)} L${P(150, -16)} Q${P(160, -16)} ${P(160, -6)} L${P(160, 6)} Q${P(160, 16)} ${P(150, 16)} L${P(95, 16)}`,
    ...[0, 1, 2, 3, 4, 5].map(i => `M${P(103 + 10 * i, -18)} L${P(103 + 10 * i, -44)}`)]; };
const TB_VIKT = [3.0, 1.4, 0.35, 0.35, 0.35, 0.35, 0.35, 0.35];
// Spegeln: ett runt glas på ett skaft
// glans (0–1, sakbilden): en ljus strimma sveper över glaset
function spegel(x, y, s = 1, v = -30, glans = null) {
  const sv = glans == null || glans <= 0 || glans >= 1 ? '' : `<clipPath id="spGlas"><circle cx="0" cy="-26" r="27"/></clipPath><g clip-path="url(#spGlas)"><rect x="${f1(-70 + 130 * mjuk(glans))}" y="-80" width="20" height="110" fill="#fff" opacity=".95" transform="rotate(30 0 -26)"/><rect x="${f1(-42 + 130 * mjuk(glans))}" y="-80" width="8" height="110" fill="#fff" opacity=".75" transform="rotate(30 0 -26)"/></g>`
    + `<path d="${gnistaD(24, -50, 14 * bump(0.55, 1, glans))}" fill="#fff" stroke="#fff7b0" stroke-width="2"/>`;
  return `<g transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(v)}) scale(${s})"><rect x="-7" y="0" width="14" height="150" rx="7" fill="#b9c4cc" stroke="#fff" stroke-width="6" paint-order="stroke"/>
    <circle cx="0" cy="-26" r="30" fill="#dff2fb" stroke="#9fb0bc" stroke-width="7"/>${sv}<circle cx="0" cy="-26" r="30" fill="none" stroke="#fff" stroke-width="3"/>
    <path d="M-14 -38 Q-4 -48 8 -44" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/></g>`;
}
// Saken i tandläkarens egen hand (riggens vänstra hand, h): spegeln eller tandborsten pekar från handen mot mal
function iHand(h, mal, sak) {
  const L = Math.hypot(mal[0] - h[0], mal[1] - h[1]), th = Math.atan2(mal[1] - h[1], mal[0] - h[0]) * 180 / Math.PI;
  if (sak === 'spegel') { const s = kl(L / 156, 0.5, 0.9); return `<g transform="translate(${f1(h[0])} ${f1(h[1])}) rotate(${f1(th + 90)})">${spegel(0, -130 * s, s, 0)}</g>`; }
  const s = kl(L / 258, 0.38, 0.6); return `<g transform="translate(${f1(h[0])} ${f1(h[1])}) rotate(${f1(th)}) scale(1 -1)">${tandborste(130 * s, 0, s, 0)}</g>`;   // borststråna upp mot tänderna
}
// Ett frågetecken som gungar ovanför huvudet (tandläkaren undrar var tandborsten är)
const fraga = (x, y, t, op = 1) => op <= 0.01 ? '' : `<g transform="translate(${f1(x)} ${f1(y + 6 * Math.sin(t * 2.2))}) rotate(${f1(8 * Math.sin(t * 1.6))}) scale(${(0.6 + 0.4 * mjuk(op)).toFixed(3)})" opacity="${f1(Math.min(1, op * 1.5))}">
  <path d="M-24 -26 Q-24 -60 6 -60 Q36 -60 36 -32 Q36 -12 8 -2 L6 16" stroke="#fff" stroke-width="30" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="44" r="15" fill="#fff"/>
  <path d="M-24 -26 Q-24 -60 6 -60 Q36 -60 36 -32 Q36 -12 8 -2 L6 16" stroke="#3a2c28" stroke-width="15" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="44" r="9" fill="#3a2c28"/></g>`;
const SP_DRAG = ([x, y], s, v) => { const r = v * Math.PI / 180, P = (a, b) => [x + s * (a * Math.cos(r) - b * Math.sin(r)), y + s * (a * Math.sin(r) + b * Math.cos(r))];
  const [gx, gy] = P(0, -26), R_ = 30 * s, [ax, ay] = P(0, 4), [bx, by] = P(0, 150);
  return [`M${f1(gx)} ${f1(gy - R_)} a${f1(R_)} ${f1(R_)} 0 1 0 0.1 0`, `M${f1(ax)} ${f1(ay)} L${f1(bx)} ${f1(by)}`]; };
const SP_VIKT = [1.6, 1.0];
// Den glada tanden (klistermärket), absolut bana
const tandD = (x, y, r) => { const P = (a, b) => `${f1(x + a * r)} ${f1(y + b * r)}`;
  return `M${P(-1, -.55)} Q${P(-1, -1.05)} ${P(-.45, -1.05)} Q${P(0, -.85)} ${P(.45, -1.05)} Q${P(1, -1.05)} ${P(1, -.55)} Q${P(1, .2)} ${P(.7, 1.05)} Q${P(.5, 1.2)} ${P(.3, .9)} Q${P(.1, .45)} ${P(0, .45)} Q${P(-.1, .45)} ${P(-.3, .9)} Q${P(-.5, 1.2)} ${P(-.7, 1.05)} Q${P(-1, .2)} ${P(-1, -.55)} Z`; };
function tand(x, y, r = 40) {
  return `<g><path d="${tandD(x, y, r)}" fill="#fffdf6" stroke="#fff" stroke-width="${f1(r * .22)}" paint-order="stroke" filter="drop-shadow(0 0 2px #c9c2b4)"/>
    <circle cx="${f1(x - r * .32)}" cy="${f1(y - r * .4)}" r="${f1(r * .09)}" fill="#2a1d18"/><circle cx="${f1(x + r * .32)}" cy="${f1(y - r * .4)}" r="${f1(r * .09)}" fill="#2a1d18"/>
    <path d="M${f1(x - r * .25)} ${f1(y - r * .1)} Q${f1(x)} ${f1(y + r * .15)} ${f1(x + r * .25)} ${f1(y - r * .1)}" stroke="#2a1d18" stroke-width="${f1(r * .07)}" fill="none" stroke-linecap="round"/>
    <ellipse cx="${f1(x - r * .55)}" cy="${f1(y - r * .15)}" rx="${f1(r * .14)}" ry="${f1(r * .09)}" fill="#F4A6B8"/><ellipse cx="${f1(x + r * .55)}" cy="${f1(y - r * .15)}" rx="${f1(r * .14)}" ry="${f1(r * .09)}" fill="#F4A6B8"/></g>`;
}
// Tankebubbla med innehåll, växer fram (k 0–1)
const bubbla = (x, y, inne, fran, k = 1) => k <= 0.01 ? '' : `<g transform="translate(${f1(x)} ${f1(y)}) scale(${k.toFixed(3)}) translate(${f1(-x)} ${f1(-y)})"><circle cx="${f1(fran[0])}" cy="${f1(fran[1])}" r="10" fill="#fff" opacity=".95"/><circle cx="${f1((fran[0] + x) / 2)}" cy="${f1((fran[1] + y) / 2 + 40)}" r="16" fill="#fff" opacity=".95"/>
  <ellipse cx="${f1(x)}" cy="${f1(y)}" rx="125" ry="95" fill="#fff" opacity=".96"/>${inne}</g>`;
const godis = (x, y) => `<g transform="translate(${f1(x)} ${f1(y)})"><path d="M-62 -24 L-32 0 L-62 24 Z M62 -24 L32 0 L62 24 Z" fill="#F48FB1"/><circle r="34" fill="#F06292"/><path d="M-18 -18 Q0 -8 18 -18" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/></g>`;
const solMane = (x, y) => `<g transform="translate(${f1(x)} ${f1(y)})"><circle cx="-62" cy="-38" r="18" fill="#FFD23F"/>${Array.from({ length: 8 }, (_, i) => { const a = i * Math.PI / 4;
  return `<path d="M${f1(-62 + 25 * Math.cos(a))} ${f1(-38 + 25 * Math.sin(a))} L${f1(-62 + 34 * Math.cos(a))} ${f1(-38 + 34 * Math.sin(a))}" stroke="#FFD23F" stroke-width="5" stroke-linecap="round"/>`; }).join('')}
  <path d="M70 -56 A22 22 0 1 0 70 -18 A17 17 0 1 1 70 -56 Z" fill="#9FA8DA"/></g>`;
const ljusKagla = (fran, till, b = 120, op = 1) => { if (op <= 0.01) return ''; const [ax, ay] = fran, [bx, by] = till, dx = bx - ax, dy = by - ay, l = Math.hypot(dx, dy), nx = -dy / l, ny = dx / l;
  return `<g opacity="${op.toFixed(2)}"><path d="M${f1(ax)} ${f1(ay)} L${f1(bx + nx * b)} ${f1(by + ny * b)} L${f1(bx - nx * b)} ${f1(by - ny * b)} Z" fill="#fff3b0" opacity=".2"/><circle cx="${f1(bx)}" cy="${f1(by)}" r="${b}" fill="#fff3b0" opacity=".14"/>
    <circle cx="${f1(ax)}" cy="${f1(ay)}" r="18" fill="#fff6c8" opacity=".8"/></g>`; };
const skimmer = (x, y, R, t, op = 1) => op <= 0 ? '' : [0, 1, 2, 3].map(i => { const a = i * Math.PI / 2 + 0.4 + t * 1.2, px = x + R * Math.cos(a), py = y + R * 0.75 * Math.sin(a), r = 10 * (0.6 + 0.4 * Math.sin(t * 6 + i));
  return `<path d="M${f1(px - r)} ${f1(py)} L${f1(px + r)} ${f1(py)} M${f1(px)} ${f1(py - r)} L${f1(px)} ${f1(py + r)}" stroke="#fff7b0" stroke-width="5" stroke-linecap="round" opacity="${f1(op)}"/>`; }).join('');
const tander = (m, k = 1, lys = [1, 1]) => [[-14, 0], [2, 1]].map(([dx, i]) => `<rect x="${f1(m[0] + dx * k)}" y="${f1(m[1] - 12 * k)}" width="${f1(12 * k)}" height="${f1(16 * k)}" rx="${f1(3 * k)}" fill="#fff" stroke="#e5ded3" stroke-width="1.5"/>
  ${lys[i] > 0 ? `<rect x="${f1(m[0] + dx * k - 2)}" y="${f1(m[1] - 12 * k - 2)}" width="${f1(12 * k + 4)}" height="${f1(16 * k + 4)}" rx="${f1(4 * k)}" fill="#fff7b0" opacity="${(0.55 * lys[i]).toFixed(2)}"/>` : ''}`).join('');

// Kritirisen (som 045/046)
function kritiris(r, [cx, cy]) {
  if (r >= 1500) return;
  const ring = 'M' + Array.from({ length: 145 }, (_, j) => { const a = j / 144 * 2 * Math.PI, rr = r * (1 + 0.06 * Math.sin(9 * a + TT * 0.8));
    return `${(cx + rr * Math.cos(a)).toFixed(1)} ${(cy + rr * Math.sin(a)).toFixed(1)}`; }).join('L') + 'Z';
  lagg('ram', `<path d="M-50 -50H1970V1130H-50Z ${r > 1 ? ring : ''}" fill="#101010" fill-rule="evenodd"/>
    ${r > 1 ? `<path d="${ring}" fill="none" stroke="#fff8e0" stroke-width="${Math.min(14, r / 4)}" stroke-linejoin="round" filter="url(#boil)"/>` : ''}`);
}
// Små rosa hjärtan (som 046): stiger i en mjuk slinga bredvid ansiktet, pulserar och tonas ut
const hjartaD = (x, y, r) => `M${f1(x)} ${f1(y + r * 0.9)} C${f1(x - r * 1.6)} ${f1(y - r * 0.2)} ${f1(x - r * 1.1)} ${f1(y - r * 1.6)} ${f1(x)} ${f1(y - r * 0.7)} C${f1(x + r * 1.1)} ${f1(y - r * 1.6)} ${f1(x + r * 1.6)} ${f1(y - r * 0.2)} ${f1(x)} ${f1(y + r * 0.9)}Z`;
const hjartan = (x, y, tl, t0 = 0) => [0, 0.4, 0.8, 1.2].map((a, i) => { const u = (tl - t0 - a) / 1.9; if (u < 0 || u > 1) return '';
  const hx = x + [-34, 30, -6, 44][i] + 16 * Math.sin(u * 5 + i * 1.7), hy = y - 150 * mjuk(u) + [0, 20, -10, 30][i];
  const puls = 1 + 0.16 * Math.max(0, Math.sin(2 * Math.PI * 2.2 * (tl - a))) ** 3, r = (11 + [3, 0, 5, -1][i] + 4 * Math.sin(Math.PI * u)) * puls * Math.min(1, 5 * u);
  const fg = ['#F48FB1', '#F7A8C6', '#EC6FA0', '#F9B8D0'][i];

// Krit-gnistor (som ritintrot): fyruddiga gula klistermärken som poppar fram en i taget och krymper bort
const gnistaD = (x, y, r) => `M${f1(x)} ${f1(y - r)} Q${f1(x + r * 0.18)} ${f1(y - r * 0.18)} ${f1(x + r)} ${f1(y)} Q${f1(x + r * 0.18)} ${f1(y + r * 0.18)} ${f1(x)} ${f1(y + r)} Q${f1(x - r * 0.18)} ${f1(y + r * 0.18)} ${f1(x - r)} ${f1(y)} Q${f1(x - r * 0.18)} ${f1(y - r * 0.18)} ${f1(x)} ${f1(y - r)}Z`;
function gnistor(cx, cy, R, t, n = 5) { return Array.from({ length: n }, (_, i) => { const t0 = 0.25 * i, u = (t - t0) / 1.4; if (u < 0 || u > 1) return '';
  const a = -Math.PI / 2 + i * 2 * Math.PI / n + 0.4, x = cx + R * Math.cos(a), y = cy + R * 0.8 * Math.sin(a), r = 44 * Math.sin(Math.PI * Math.min(1, u * 1.6)) * (1 - 0.3 * u);
  return r > 0.5 ? `<path d="${gnistaD(x, y, r)}" fill="#ffd23f" stroke="#fff" stroke-width="6" stroke-linejoin="round" paint-order="stroke" transform="rotate(${f1(20 * u)} ${f1(x)} ${f1(y)})"/>` : ''; }).join(''); }
const gn = (cx, cy, R, t, sk = 0.55) => `<g transform="translate(${f1(cx)} ${f1(cy)}) scale(${sk}) translate(${f1(-cx)} ${f1(-cy)})">${gnistor(cx, cy, R / sk, t)}</g>`;

// Kritans bana genom strecken (som 046:s stetoBana): varje streck ritas, mellan strecken glider kritan i en liten båge
const MATT = {};
function bana(D, VIKT, k, attr) {
  const key = D.join('|');
  if (!MATT[key]) { const g = document.createElementNS('http://www.w3.org/2000/svg', 'g'); $('defs').appendChild(g);
    MATT[key] = D.map(d => { const e = document.createElementNS('http://www.w3.org/2000/svg', 'path'); e.setAttribute('d', d); g.appendChild(e);
      const L = e.getTotalLength(), a = e.getPointAtLength(0), b = e.getPointAtLength(L); return { e, L, a: [a.x, a.y], b: [b.x, b.y] }; }); }
  const M = MATT[key], steg = [];
  D.forEach((d, i) => { if (i) { const [x0, y0] = M[i - 1].b, [x1, y1] = M[i].a, dist = Math.hypot(x1 - x0, y1 - y0); if (dist > 4) steg.push({ resa: i, w: 0.25 + dist / 900 }); }
    steg.push({ rita: i, w: VIKT[i] }); });
  const sum = steg.reduce((a, x) => a + x.w, 0); let acc = 0, html = '', pos = M.at(-1).b;
  for (const st of steg) { const a = acc / sum, b = (acc += st.w) / sum, u = kl((k - a) / (b - a));
    if (st.rita != null && u > 0) html += `<path d="${D[st.rita]}" pathLength="1" ${attr} stroke-dasharray="1 1" stroke-dashoffset="${(1 - u).toFixed(4)}"/>`;
    if (k >= a && k < b) { if (st.rita != null) { const q = M[st.rita].e.getPointAtLength(M[st.rita].L * u); pos = [q.x, q.y]; }
      else { const P0 = M[st.resa - 1].b, P1 = M[st.resa].a, m = mjuk(u); pos = [lerp(P0[0], P1[0], m), lerp(P0[1], P1[1], m) - 40 * Math.sin(Math.PI * m)]; } } }
  return { html, pos, start: M[0].a, slut: M.at(-1).b };
}
const ritfart = k => (k = kl(k), 0.6 * k + 0.4 * mjuk(k));
const LINJE = w => `fill="none" stroke="#3a2c28" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"`;

const DVINKA = (tl, k = 1) => ({ armar: [0, k * (100 + 12 * Math.sin(2 * Math.PI * 1.1 * tl))], armbage: [0, -30 * k] });   // högra armen (bort från stolen)

  return { ...p, strack: p.strack + 0.014 * a, bred: p.bred + 0.007 * a, oron: p.oron.map((o, i) => o - 2 * a + (i ? -1 : 1) * 1.5 * Math.sin(t * 1.3 + 2 * i)) }; };

const vinka = (p, tl, i = 1, f = 1.15, k = 1) => { const a = [...p.armar]; a[i] = a[i] + k * (150 + 12 * Math.sin(2 * Math.PI * f * tl)); return { ...p, armar: a }; };
