<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Hunden går på pottan</title>
<style>html, body { margin:0; background:#000; overflow:hidden } svg { width:100vw; height:100vh; display:block; } body.silhuett, body.silhuett svg { background:transparent }</style>
</head>
<body>
<!-- 042 Hunden går på pottan: hela kodscenen (grind 6). Tiderna, Malin och effekterna ur ../rader.json (storyboard/bygg.mjs).
     Rad 00 (logotypen) är inte med: julkalenderns ram (lucka 17) är intro och outro.
     Två platser: kaktusrummet (Sanna 2026-11-20: kaktusrummet-v1, förlängt åt höger till 2880 px så att kameran kan följa hunden,
     ingen matta, ingen gran) och badrummet (som 023: handfatet, pallen bakom, julhandduken). Pottan och toarullen är urklipp;
     vattnet i glaset, strålen, skummet, pappersslingan och skimret är kod. Glaset och rullen bärs med riggens sak-API.
     Allt hänger på den absoluta tiden TT. Rendera från repots rot:
     node avsnitt/042-hunden-gar-pa-pottan/scener/render.mjs avsnitt/042-hunden-gar-pa-pottan/scener/badrummet [--snabb] -->
<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="korn" x="0" y="0" width="1" height="1">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="2"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.47  0 0 0 0 0.36  1.1 0 0 0 -0.47"/>
    </filter>
    <filter id="boil" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="7000" height="5000">
      <feTurbulence id="brus" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
      <feDisplacementMap in="SourceGraphic" scale="5"/>
    </filter>
    <filter id="kritkorn" x="0" y="0" width="1" height="1">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.2  0 0 0 0 0.08  0 0 0 0.55 -0.12" result="k"/>
      <feComposite in="k" in2="SourceGraphic" operator="in" result="kk"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="kk"/></feMerge>
    </filter>
  </defs>
  <rect id="botten" width="1920" height="1080" fill="#FAF8F2"/>
  <g id="kamera">
    <g id="platta"></g>
    <g id="bak"></g>
    <g id="pall"></g>
    <g filter="url(#boil)"><g id="figurer"></g></g>
    <g id="kar"></g>
    <g filter="url(#boil)"><g id="saker"></g></g>
    <g id="fram" filter="url(#boil)"></g>
    <g id="pilar"></g>
  </g>
  <g id="ram"></g>
  <g id="svep"></g>
  <g id="gomda" opacity="0"></g>
</svg>
<script src="/verktyg/blinka.js"></script>
<script src="/verktyg/kant.js"></script>
<script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script>
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const A = '/assets/', R = A + 'rekvisita/', HAR = '/avsnitt/042-hunden-gar-pa-pottan/scener/';
const lagg = (id, h) => $(id).insertAdjacentHTML('beforeend', h);
const f1 = x => (+x).toFixed(1);
const bild = (href, w, h, t, extra = '') => `<image href="${href}" width="${w}" height="${h}" transform="${t}" ${extra}/>`;

// --- Tiden ---------------------------------------------------------------------------------------------------------------------
const kl = (k, a = 0, b = 1) => Math.max(a, Math.min(b, k)), lerp = (a, b, k) => a + (b - a) * k;
const mjuk = k => (k = kl(k), k * k * (3 - 2 * k)), del = (a, b, t) => mjuk((t - a) / (b - a));
const bump = (a, b, t) => (t <= a || t >= b) ? 0 : Math.sin(Math.PI * (t - a) / (b - a));
let TT = 0, CUR = null, RAD_L = [], RR = {}, ROSTER = [], DURATION = 0;
const SVART = 0.6;
const mo = (i = 0) => CUR.malin[i][1], lo = (i = 0) => CUR.ljud[i][1];
const at = (id, o = 0) => RR[id].s + o, lj = (id, i) => RR[id].ljud[i][1], ml = (id, i = 0) => RR[id].malin[i][1];
const rl = n => ROSTER[n - 1][1];   // replikens längd

// --- Filer ---------------------------------------------------------------------------------------------------------------------
const KAKTUS = HAR + 'badrummet/kaktusrummet-bred.jpg', BADRUM = A + 'bakgrunder/badrummet/badrummet-v1.jpeg';
const KRITA = R + 'krita-rod/cut/krita-rod.png', KRITA_SPETS = [742, 132];
const SAK = {   // [fil, bildens storlek, alfarutan x0 y0 x1 y1]
  boll:  [R + 'boll-rod/cut/boll-rod.png', [1024, 1024], [166, 162, 858, 862]],
  glas:  [R + 'mjolkglas/cut/mjolkglas-v2-tomt.png', [665, 901], [6, 6, 660, 896]],
  potta: [R + 'potta/cut/potta-v3.png', [737, 522], [4, 4, 732, 517]],   // v3: Sannas nya röda potta, stänkskyddet fram (2026-11-20)
  rulle: [R + 'toarulle/cut/toarulle.png', [694, 799], [16, 15, 678, 780]],
  luva:  [R + 'tomteluva/cut/tomteluva.png', [1024, 1024], [114, 167, 911, 857]],
};
const HK = 0.68, HANDFAT = { bild: R + 'handfatet/cut/handfatet.png', W: 802 * HK, H: (772 - 177) * HK, kantY: 177 * HK };   // som 023
const PALL = R + 'pall/cut/pall.png', PALL_HOG = [555, 66];
const HANDDUK = [R + 'handduk-jul/cut/handduk-jul-krok.png', 538, 981];
const KAROL = 'assets/ljud/musik/jul/karol-up-on-the-housetop-slinga.m4a';
let KONTUR = {};

// --- Kameran (PW = plattans bredd: kaktusrummet 2880, badrummet 1920) --------------------------------------------------------------
let PW = 1920;
function kamera(zoom = 1, cx = 960, cy = 540) {
  zoom *= 1 + 0.008 * (0.5 - 0.5 * Math.cos(2 * Math.PI * TT / 6.5)); cx += 5 * Math.sin(TT * 0.55); cy += 3 * Math.sin(TT * 0.41);   // andas lugnt (045)
  const tx = Math.max(1920 - PW * zoom, Math.min(0, 960 - cx * zoom)), ty = Math.max(1080 - 1080 * zoom, Math.min(0, 540 - cy * zoom));
  $('kamera').setAttribute('transform', `translate(${tx.toFixed(1)} ${ty.toFixed(1)}) scale(${zoom})`);
  $('brus').nextElementSibling.setAttribute('scale', (5 / zoom).toFixed(2));
}
const kameraMix = (A, B, k) => kamera(lerp(A[0], B[0], k), lerp(A[1], B[1], k), lerp(A[2], B[2], k));

// --- Effekter -----------------------------------------------------------------------------------------------------------------
const glans = (x, y, r, o = 1) => `<path transform="translate(${f1(x)} ${f1(y)}) scale(${f1(r)})" opacity="${o}" d="M0 -1 L.2 -.2 L1 0 L.2 .2 L0 1 L-.2 .2 L-1 0 L-.2 -.2Z" fill="#fff6c8" stroke="#e6b422" stroke-width=".06"/>`;
const skimmer = (x, y, k = 1, vidd = 1) => { if (k < 0.02) return; lagg('fram', [[-1, -0.7, 1], [1.1, -0.4, 0.8], [0.2, 1.1, 0.7], [-1.2, 0.8, 0.6]]
  .map(([dx, dy, s], i) => glans(x + dx * 40 * vidd, y + dy * 34 * vidd, 16 * s * k * vidd * (0.85 + 0.15 * Math.sin(TT * 5 + i * 2)), Math.min(1, 0.4 + k))).join('')); };
const krita = (x, y, v = 125, s = 0.33) => lagg('pilar', bild(KRITA, 755, 265, `translate(${f1(x)} ${f1(y)}) rotate(${f1(v)}) scale(${s}) translate(${-KRITA_SPETS[0]} ${-KRITA_SPETS[1]})`));
const svajP = (x, y, tl) => [x + 14 * Math.sin(tl * 1.6), y + 10 * Math.sin(tl * 2.3), 140 + 4 * Math.sin(tl * 1.3)];
const kritaGlid = (A, B, k, s, bage = 40) => { const m = mjuk(k), h = Math.min(1, Math.hypot(B[0] - A[0], B[1] - A[1]) / 300) * bage * Math.sin(Math.PI * m);
  krita(lerp(A[0], B[0], m), lerp(A[1], B[1], m) - h, lerp(A[2] ?? 125, B[2] ?? 125, m), s); };
const ritfart = k => (k = kl(k), 0.6 * k + 0.4 * mjuk(k));
function kontur(namn, t, k, bredd, farg = '#3a2c28') {
  lagg('pilar', `<g transform="${t}"><path id="k-${namn}" d="${KONTUR[namn].d}" pathLength="1" fill="none" stroke="${farg}" stroke-width="${f1(bredd)}"
    stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="${k.toFixed(4)} 2"/></g>`);
  const p = $('k-' + namn), q = p.getPointAtLength(p.getTotalLength() * Math.min(0.999, k)), sm = $('kamera').getCTM().inverse().multiply(p.getCTM());
  const pt = new DOMPoint(q.x, q.y).matrixTransform(sm); return [pt.x, pt.y];
}
const papper = () => { $('platta').innerHTML = `<rect x="-200" y="-200" width="2400" height="1500" fill="#FBF7EE"/><rect x="-200" y="-200" width="2400" height="1500" filter="url(#korn)"/>`; };
function kritiris(r, [cx, cy]) {
  if (r >= 1500) return;
  const ring = 'M' + Array.from({ length: 145 }, (_, j) => { const a = j / 144 * 2 * Math.PI, rr = r * (1 + 0.06 * Math.sin(9 * a + TT * 0.8));
    return `${(cx + rr * Math.cos(a)).toFixed(1)} ${(cy + rr * Math.sin(a)).toFixed(1)}`; }).join('L') + 'Z';
  lagg('ram', `<path d="M-50 -50H1970V1130H-50Z ${r > 1 ? ring : ''}" fill="#101010" fill-rule="evenodd"/>
    ${r > 1 ? `<path d="${ring}" fill="none" stroke="#fff8e0" stroke-width="${Math.min(14, r / 4)}" stroke-linejoin="round" filter="url(#boil)"/>` : ''}`);
}
const vit = v => v > 0 && lagg('ram', `<rect x="-50" y="-50" width="2020" height="1180" fill="#FBF7EE" opacity="${v.toFixed(3)}"/>`);
const tuss = (x, y, r) => r < 0.5 ? '' : [[0, 0, 1], [-0.8, 0.25, 0.7], [0.8, 0.2, 0.75], [-0.35, -0.55, 0.65], [0.4, -0.5, 0.6]]
  .map(([dx, dy, k]) => `<circle cx="${f1(x + dx * r)}" cy="${f1(y + dy * r)}" r="${f1(k * r)}" fill="#fff" stroke="#cfe6ee" stroke-width="${f1(0.08 * r)}" paint-order="stroke"/>`).join('');

// --- Kritsvepet (006:s kritsvep.js, som 040): SVEP 0–0,5 täcker, 0,5–0,8 smular bort; SVEP_F = nya platsens väggfärg -------------
let SVEP = 0, SVEP_F = '#7ECCB8';
const SVEP_IN = 1.0, SVEP_UT = 0.7, BAD_FARG = '#7ECCB8', KAKTUS_FARG = '#B93564';

// --- Sakerna -------------------------------------------------------------------------------------------------------------------
const sak = (namn, x, fot, hojd, { lager = 'saker', rot = 0, extra = '' } = {}) => {
  const [f, [w, h], [x0, y0, x1, y1]] = SAK[namn], s = hojd / (y1 - y0); 
  lagg(lager, `<image href="${f}" width="${w}" height="${h}" ${extra} transform="translate(${f1(x)} ${f1(fot)}) rotate(${f1(rot)}) scale(${s.toFixed(4)}) translate(${-(x0 + x1) / 2} ${-y1})"/>`);
};
const sakT = (namn, [x, fot, hojd]) => { const [, , [x0, y0, x1, y1]] = SAK[namn], s = hojd / (y1 - y0);
  return [`translate(${f1(x)} ${f1(fot)}) scale(${s.toFixed(4)}) translate(${-(x0 + x1) / 2} ${-y1})`, s]; };
// en sak som fylls i inifrån (kritan har ritat konturen): fyll 0–1
let FYLLNR = 0;
function sakFyll(namn, pos, fyll, lager = 'saker') {
  if (fyll <= 0) return; if (fyll >= 1) return sak(namn, ...pos, { lager });
  const [, [w, h], [x0, y0, x1, y1]] = SAK[namn], [t] = sakT(namn, pos), id = 'fy' + FYLLNR++;
  lagg(lager, `<g transform="${t}"><clipPath id="${id}"><circle cx="${(x0 + x1) / 2}" cy="${(y0 + y1) / 2}" r="${f1(0.75 * Math.max(x1 - x0, y1 - y0) * mjuk(fyll))}"/></clipPath>
    <image href="${SAK[namn][0]}" width="${w}" height="${h}" clip-path="url(#${id})"/></g>`);
}
const ritaSak = (namn, pos, k, farg) => { const [t, s] = sakT(namn, pos); return kontur(namn, t, ritfart(k), 5 / s, farg); };
const skugga = (x, fot, rx, lager = 'bak', o = 0.08) => lagg(lager, `<ellipse cx="${f1(x)}" cy="${f1(fot - 2)}" rx="${f1(rx)}" ry="${f1(rx * 0.12)}" fill="#000" opacity="${o}"/>`);
const BD = 78;
const boll = ([x, y], rot = 0) => { skugga(x, y + BD / 2 + 2, BD * 0.42 * (1 - kl((y + BD / 2 - K_GOLV) / -300) * 0.5), 'bak'); sak('boll', x, y + BD / 2, BD, { rot }); };

// --- Kaktusrummet (2880 bred): dörren x 155–500, pallen med kaktusen x 1670–1855 (fötterna y 845), golvet från 812 ---------------
const K_GOLV = 905, STA = [1250, K_GOLV], PALLK = [1762, 845];
const BOLL_FRAM = [1400, K_GOLV - BD / 2], BOLL_MITT = [1560, K_GOLV - BD / 2], BOLL_PALL = [1762, 845 - BD / 2 + 6];
const GLAS = [1405, K_GOLV + 6, 105];
function kaktus() { PW = 2880; $('platta').innerHTML = `<image href="${KAKTUS}" width="2880" height="1080"/>`; lagg('bak', `<g filter="url(#boil)">${fonster(790, 230)}${klocka(1420, 300)}</g>`); }
// väggklockan (Sanna 2026-11-20: "add some more to room maybe clock on wall"): gul ram, vit urtavla, visarna går lugnt
function klocka(x, y) { const m = TT * 6, h = 300 + TT * 0.5, vis = (v, l, w) => `<line x1="0" y1="0" x2="${f1(l * Math.sin(v * Math.PI / 180))}" y2="${f1(-l * Math.cos(v * Math.PI / 180))}" stroke="#4a3428" stroke-width="${w}" stroke-linecap="round"/>`;
  return `<g transform="translate(${x} ${y})"><circle r="84" fill="#fff"/><circle r="77" fill="#F2C75C" filter="url(#kritkorn)"/><circle r="60" fill="#FFF8EC"/>
    ${Array.from({ length: 12 }, (_, i) => `<circle cx="${f1(48 * Math.sin(i * Math.PI / 6))}" cy="${f1(-48 * Math.cos(i * Math.PI / 6))}" r="${i % 3 ? 3 : 5.5}" fill="#B93564"/>`).join('')}
    ${vis(h, 28, 9)}${vis(m, 42, 6)}<circle r="7" fill="#4a3428"/></g>`; }
// fönstret med snö som faller utanför (som 034:s vardagsrum, i kod)
function fonster(x, y) { const W = 250, H = 300;
  const sno = Array.from({ length: 26 }, (_, i) => { const fx = (i * 97.3) % W, fart = 34 + (i * 13) % 26, fy = (i * 61 + TT * fart) % (H + 20) - 10;
    return `<circle cx="${f1(fx + 6 * Math.sin(TT * 0.9 + i))}" cy="${f1(fy)}" r="${3 + i % 3 * 1.6}" fill="#fff" opacity=".95"/>`; }).join('');
  return `<g transform="translate(${x} ${y})"><rect x="-14" y="-14" width="${W + 28}" height="${H + 28}" rx="18" fill="#fff"/><rect x="-8" y="-8" width="${W + 16}" height="${H + 16}" rx="14" fill="#F2C75C" filter="url(#kritkorn)"/>
    <clipPath id="fonsterklipp"><rect width="${W}" height="${H}" rx="8"/></clipPath><g clip-path="url(#fonsterklipp)"><rect width="${W}" height="${H}" fill="#9CC6E4"/>
    <ellipse cx="${W / 2}" cy="${H + 30}" rx="${W * 0.8}" ry="70" fill="#FBF7EE"/>${sno}</g>
    <rect x="${W / 2 - 6}" y="0" width="12" height="${H}" fill="#F2C75C"/><rect x="0" y="${H / 2 - 6}" width="${W}" height="12" fill="#F2C75C"/>
    <rect x="-26" y="${H + 8}" width="${W + 52}" height="18" rx="9" fill="#fff"/><rect x="-22" y="${H + 11}" width="${W + 44}" height="12" rx="6" fill="#E0A93E"/></g>`; }
// bollen: var den är just nu (tiden styr): framför hunden, upp i en båge (rad 3), under pallen (rad 4), ut igen (41), hopp (42)
function bollNu() {
  const kast = (A, B, a, b, h) => { const u = kl((TT - a) / (b - a)), m = mjuk(u); return [lerp(A[0], B[0], m), lerp(A[1], B[1], m) - h * Math.sin(Math.PI * u), (B[0] - A[0]) * m / 2]; };
  if (TT < at('3', 0.5)) return [...BOLL_FRAM, 0];
  if (TT < at('4')) { const [x, y, r] = kast(BOLL_FRAM, BOLL_MITT, at('3', 0.5), at('3', 1.3), 150); return [x, y - 18 * bump(at('3', 1.3), at('3', 1.6), TT), r]; }
  if (TT < at('41')) { const [x, y, r] = kast(BOLL_MITT, BOLL_PALL, at('4', 0.5), at('4', 1.5), 40); return [x, y, r + 90]; }
  const UT = [1560, K_GOLV - BD / 2], LAND = [1180, K_GOLV - BD / 2];
  if (TT < at('42')) { const [x, y, r] = kast(BOLL_PALL, UT, at('41', 0.35), at('41', 1.2), 10); return [x, y, 200 + r]; }
  const [x, y, r] = kast(UT, LAND, at('42', 0.4), at('42', 1.3), 230);
  return [x, y - 24 * bump(at('42', 1.3), at('42', 1.65), TT) - 9 * bump(at('42', 1.65), at('42', 1.9), TT), r];
}

// --- Badrummet (som 023): handfatet till höger, pallen bakom, pottan på golvet till vänster -----------------------------------------
const B_GOLV = 905, HX = 1300, RIM = B_GOLV - HANDFAT.H, BX = HX - 65, B_STA = [380, B_GOLV];
const KRAN = [HX + (598 - 401) * HK, RIM - (177 - 84) * HK];
const POTTA = [620, B_GOLV + 4, 175], RULLE_VID = [830, B_GOLV + 2, 90], SITS = 112, B_POTTA = [620, B_GOLV - SITS],   // Sanna 2026-11-20: "make dog sit ON potty not behind": hunden sitter uppe på kanten, pottan bakom
  B_BREDVID = [470, B_GOLV];
const HANDDUK_POS = [BX - 330, 190, 290];   // Sanna 2026-11-20 (feedback 3:03): "place handduk more to the left closer to potty"
const RULLE_SLUT = [975, B_GOLV + 2];   // där rullen stannar: till hälften bakom pallen vid handfatets skåp, så att den syns i rad 29
let VID, PALL_KS, PALL_X0, PALL_Y0;
function badrum() {
  PW = 1920; $('platta').innerHTML = `<image href="${BADRUM}" width="1920" height="1080" preserveAspectRatio="xMidYMid slice"/>`;
  const [hx, hy, hh] = HANDDUK_POS, hw = hh * HANDDUK[1] / HANDDUK[2];
  lagg('bak', `<image href="${HANDDUK[0]}" x="${f1(hx - hw / 2)}" y="${hy}" width="${f1(hw)}" height="${hh}"/>`);
  $('pall').innerHTML = `<image href="${PALL}" x="${f1(PALL_X0)}" y="${f1(PALL_Y0)}" width="${f1(781 * PALL_KS)}" height="${f1(551 * PALL_KS)}"/>`;
  const { W, H, kantY } = HANDFAT;
  $('kar').innerHTML = `<ellipse cx="${HX}" cy="${B_GOLV + 4}" rx="${W * 0.3}" ry="14" fill="#000" opacity="0.07"/>
    <image href="${HANDFAT.bild}" x="${f1(HX - W / 2)}" y="${f1(RIM - kantY)}" width="${f1(W)}" height="${f1(H + kantY)}" preserveAspectRatio="xMidYMax meet"/>`;
  slingaNu();   // slingan först: den börjar under pottan
  if (TT >= at('17b')) { skugga(POTTA[0], POTTA[1], 92, 'bak', 0.16); sakFyll('potta', pottaNu(), del(at('17b'), at('17b', 0.9), TT), TT < at('19', P_HOPP + 0.15) ? 'fram' : 'bak'); }
  kranNu();
}
// pottan trycks ihop lite när hunden landar på den (rad 19)
const pottaNu = () => { const l = bump(at('19', P_LAND), at('19', P_LAND + 0.3), TT); return [POTTA[0], POTTA[1], POTTA[2] * (1 - 0.06 * l)]; };
// pappersslingan: från pottan längs golvet till rullen (bakom handfatet); x1 = slingans slut
function slinga(x1) {
  const x0 = POTTA[0] + 70, y = B_GOLV + 12; if (x1 <= x0 + 4) return;
  const d = `M${x0} ${y} C${x0 + 120} ${y + 22} ${f1((x0 + x1) / 2)} ${y - 16} ${f1(x1)} ${y + 4}`;
  lagg('bak', `<path d="${d}" transform="translate(0 7)" fill="none" stroke="#3a4a5c" stroke-width="30" stroke-linecap="round" opacity=".18"/>
    <path d="${d}" fill="none" stroke="#fff" stroke-width="32" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#8FA3BA" stroke-width="25" stroke-linecap="round"/>
    <path d="${d}" fill="none" stroke="#F3EAD6" stroke-width="17" stroke-linecap="round" filter="url(#kritkorn)"/>
    <path d="${d}" fill="none" stroke="#A9B8CA" stroke-width="17" stroke-dasharray="3 34" opacity=".9"/>`);   // Sanna 2026-11-20: "white paper against white floor bad contrast"
}
// rullen: i tassen (25), glider ur och rullar till RULLE_SLUT med slingan efter sig (26), ligger kvar där
const RULL_T = () => [at('26', 0.3), at('26', 0.3 + 2.6)];
function slingaNu() {
  if (TT < at('26')) return;
  const [a, b] = RULL_T(), u = mjuk(kl((TT - a) / (b - a)));
  const x = lerp(RULLE_START[0], RULLE_SLUT[0], u), y = lerp(RULLE_START[1], RULLE_SLUT[1], kl(u * 4));
  slinga(x);
  if (TT >= a) { skugga(x, RULLE_SLUT[1] + 2, 38, 'bak', 0.07); sak('rulle', x, y, 72, { lager: 'bak', rot: 360 * (x - RULLE_START[0]) / (Math.PI * 70) }); }
}
let RULLE_START = [700, B_GOLV + 2];
// vattnet ur kranen (rad 34–37), en lugn stråle som slingrar sig lite
function kranNu() {
  if (TT < at('34', ml('34') + rl(42) * 0.6) || TT >= at('38')) return;
