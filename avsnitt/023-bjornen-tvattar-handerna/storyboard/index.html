<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Björnen tvättar händerna storyboard</title>
<style>
:root { --paper:#fbfaf6; --card:#fff; --ink:#2a2620; --muted:#6e675c; --line:#e6e1d6; --rosa:#b8506a }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper:#1d1c22; --card:#26252c; --ink:#f1ede4; --muted:#a8a196; --line:#3a3842; --rosa:#f2a7b8; color-scheme:dark } }
:root[data-theme="dark"] { --paper:#1d1c22; --card:#26252c; --ink:#f1ede4; --muted:#a8a196; --line:#3a3842; --rosa:#f2a7b8; color-scheme:dark }
* { box-sizing:border-box }
body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.5 system-ui,sans-serif }
.wrap { max-width:1240px; margin:0 auto; padding:40px 16px 72px }
h1 { font-size:clamp(30px,6vw,52px); margin:0 } h1 span { color:var(--rosa) }
.lede { color:var(--muted); max-width:72ch }
.frames { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; margin-top:24px }
.frame { margin:0; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden }
.frame img { width:100%; height:auto; display:block }
figcaption { padding:12px 14px 14px; display:grid; gap:6px; font-size:14px } figcaption p { margin:0 }
.t { font:500 12px ui-monospace,monospace; color:var(--muted) }
.said { border-left:3px solid var(--rosa); padding-left:10px }
.ans { color:var(--muted); font-size:13px }
</style></head><body><div class="wrap">
<h1>Björnen tvättar händerna <span>storyboard</span></h1>
<p class="lede">Avsnitt 023, 2:52.0 med 1 s logotyp-intro. En stillbild per rad i <code>storyboard.md</code>. Badrummet v1, handfatet (rekvisita/handfatet), björnen ur sin v2-rigg med ansikte, honung, tvål, skum och bubblor i kod. Röda streckade pilar visar rörelsen. 29 bilder.</p>
<div class="frames"><figure class="frame"><img src="frames/00.jpg" alt="Bild 00" loading="lazy"><figcaption>
  <div class="t">00 · 0:00.0 · 1.0 s · Intro</div><div class="said">–</div>
  <p>Lilla Kritans logotyp i 1 s, ingen jingel, inget titelkort. ⚠ Platshållare: logotypbilden läggs in i filmen</p><p class="ans">Ljud: tyst · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/01a.jpg" alt="Bild 01a" loading="lazy"><figcaption>
  <div class="t">01a · 0:01.0 · 6.0 s · Papperet, helbild</div><div class="said"><i>"Kritan ritar …"</i> (0:02.0)</div>
  <p>Kritan ritar björnens kontur i lugna drag (ca 7 s totalt), halvvägs här</p><p class="ans">Ljud: kritan ritar, skogsljud under · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/01b.jpg" alt="Bild 01b" loading="lazy"><figcaption>
  <div class="t">01b · 0:07.0 · 7.5 s · Papperet, helbild</div><div class="said"><i>"Hm … vad blir det nu?"</i> (0:07.0)</div>
  <p>Konturen ritas klar, sedan väntar kritan bredvid i ca 4 s och vajar lugnt: barnet gissar</p><p class="ans">Ljud: kritan ritar · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/01c.jpg" alt="Bild 01c" loading="lazy"><figcaption>
  <div class="t">01c · 0:14.5 · 3.8 s · Papperet, helbild → zoom in</div><div class="said"><i>"Oj! En björn!"</i> (0:15.1)</div>
  <p>Den riktiga björnen fylls i inifrån, honungskladdet kommer sist (tassarna, nosen). Sista 0,8 s: zoom in i teckningen</p><p class="ans">Ljud: – · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/1.jpg" alt="Bild 1" loading="lazy"><figcaption>
  <div class="t">1 · 0:18.3 · 6.0 s · Badrummet, helbild</div><div class="said"><i>"Hej, björnen! Hej, hej!"</i> (0:19.9)</div>
  <p>Björnen trippar in från vänster (riggens gång), ett kladdigt gult tassavtryck per steg, stannar och vinkar. <b>Hej med vinkning</b></p><p class="ans">Ljud: små steg, glatt brum (⚠ <code>brum-gullig</code> saknas) · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/2.jpg" alt="Bild 2" loading="lazy"><figcaption>
  <div class="t">2 · 0:24.3 · 5.7 s · Badrummet, närbild</div><div class="said"><i>"Oj, oj, oj! Vad kladdig du är!"</i> (0:24.7)</div>
  <p>Björnen håller upp tassarna åt sidorna: gul honung på båda, och en klick på nosen. Efter repliken slickar den sig om nosen</p><p class="ans">Ljud: belåtet brum (⚠), slick · Ansikte: stolt, tungan ute</p></figcaption></figure>
<figure class="frame"><img src="frames/3.jpg" alt="Bild 3" loading="lazy"><figcaption>
  <div class="t">3 · 0:30.0 · 4.9 s · Badrummet, helbild</div><div class="said"><i>"Titta, honung på golvet också!"</i> (0:30.3)</div>
  <p>De kladdiga tassavtrycken på golvet skimrar till ett i taget; björnen tittar ner på dem</p><p class="ans">Ljud: fniss (⚠) · Ansikte: nyfiken, tittar ner</p></figcaption></figure>
<figure class="frame"><img src="frames/4.jpg" alt="Bild 4" loading="lazy"><figcaption>
  <div class="t">4 · 0:34.9 · 5.0 s · Badrummet, halvbild björnen och handfatet</div><div class="said"><i>"Nu ska du väl tvätta händerna?"</i> (0:35.5)</div>
  <p>Kranen börjar rinna i handfatet. Björnen skakar på huvudet (ägget lutar åt sidorna)</p><p class="ans">Ljud: <code>kran</code>, trumpet brum (⚠) · Ansikte: lite ledsen (trumpen)</p></figcaption></figure>
<figure class="frame"><img src="frames/5.jpg" alt="Bild 5" loading="lazy"><figcaption>
  <div class="t">5 · 0:39.9 · 8.1 s · Badrummet, närbild</div><div class="said"><i>"Oj då. Björnen gömmer visst tassarna."</i> (0:40.2) … <i>"Hm … vad gör vi nu?"</i> (0:44.0)</div>
  <p>Björnen gömmer tassarna bakom ryggen (armarna glider in bakom kroppen) och tittar bort åt vänster. Paus 1 s mellan replikerna</p><p class="ans">Ljud: trumpet brum (⚠) · Ansikte: trumpen, tittar bort</p></figcaption></figure>
<figure class="frame"><img src="frames/6a.jpg" alt="Bild 6a" loading="lazy"><figcaption>
  <div class="t">6a · 0:48.0 · 9.9 s · Badrummet, halvbild</div><div class="said"><i>"Titta! Kritan ritar något."</i> (0:48.3)</div>
  <p>Kritan ritar tvålens kontur på handfatets kant (3 s), väntar sedan bredvid och vajar: gisspaus 3 s. Björnen kikar dit</p><p class="ans">Ljud: kritan ritar · Ansikte: nyfiken</p></figcaption></figure>
<figure class="frame"><img src="frames/6b.jpg" alt="Bild 6b" loading="lazy"><figcaption>
  <div class="t">6b · 0:57.9 · 5.1 s · Samma</div><div class="said"><i>"En tvål! Varsågod, björnen."</i> (0:58.1)</div>
  <p>Den riktiga tvålen fylls i inifrån. <i>Varsågod</i></p><p class="ans">Ljud: glitter · Ansikte: förvånad</p></figcaption></figure>
<figure class="frame"><img src="frames/7.jpg" alt="Bild 7" loading="lazy"><figcaption>
  <div class="t">7 · 1:03.0 · 8.4 s · Samma</div><div class="said"><i>"Ska vi säga tack?"</i> (1:03.3) … <i>"Tack!"</i> (1:08.4)</div>
  <p>Björnen tittar på tvålen och tassarna kommer fram igen. Paus 4 s: barnet säger tack. Efter <i>Tack!</i> nickar björnen</p><p class="ans">Ljud: nyfiket brum, sedan förtjust brum (⚠) · Ansikte: nyfiken → jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/8a.jpg" alt="Bild 8a" loading="lazy"><figcaption>
  <div class="t">8a · 1:11.4 · 3.0 s · Badrummet, helbild</div><div class="said">–</div>
  <p>Upp på pallen: ett lugnt skutt per steg, sedan står björnen bakom handfatet, synlig från magen och upp</p><p class="ans">Ljud: två mjuka steg · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/8b.jpg" alt="Bild 8b" loading="lazy"><figcaption>
  <div class="t">8b · 1:14.4 · 6.0 s · Badrummet, halvbild</div><div class="said"><i>"Oj! Tvålen är hal!"</i> (1:16.0)</div>
  <p>Björnen tar tvålen mellan tassarna. Den glider upp ur tassarna i en mjuk båge och landar i handfatet. Ögonen följer den</p><p class="ans">Ljud: <code>plopp</code>, fniss (⚠) · Ansikte: förvånad</p></figcaption></figure>
<figure class="frame"><img src="frames/9.jpg" alt="Bild 9" loading="lazy"><figcaption>
  <div class="t">9 · 1:20.4 · 6.1 s · Samma</div><div class="said"><i>"Ha ha! En gång till!"</i> (1:22.4)</div>
  <p>En gång till: tvålen glider upp och landar. <b>Leken (den hala tvålen)</b></p><p class="ans">Ljud: <code>plopp</code>, långt fniss (⚠) · Ansikte: fnissig</p></figcaption></figure>
<figure class="frame"><img src="frames/10.jpg" alt="Bild 10" loading="lazy"><figcaption>
  <div class="t">10 · 1:26.5 · 4.7 s · Samma</div><div class="said"><i>"Ska du tvätta bort all honung nu?"</i> (1:26.8)</div>
  <p>Björnen håller tvålen mellan tassarna (klappen framför magen). <b>Shorten börjar här</b></p><p class="ans">Ljud: förtjust brum (⚠) · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/11.jpg" alt="Bild 11" loading="lazy"><figcaption>
  <div class="t">11 · 1:31.2 · 7.1 s · Handfatet, närbild tassarna</div><div class="said"><i>"Först ena tassen. Gnugga, gnugga … ren!"</i> (1:31.5)</div>
  <p>Skumtussen snurrar mellan tassarna och växer. Kladdet på vänstra tassen bleknar och är borta på <i>"ren!"</i></p><p class="ans">Ljud: <code>skrubb</code>, <code>tindra</code> på "ren" · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/12.jpg" alt="Bild 12" loading="lazy"><figcaption>
  <div class="t">12 · 1:38.4 · 7.8 s · Samma</div><div class="said"><i>"Och andra tassen. Gnugga, gnugga … ren!"</i> (1:38.7)</div>
  <p>Samma på andra tassen (den vänstra redan ren)</p><p class="ans">Ljud: <code>skrubb</code>, <code>tindra</code>, fniss (⚠) · Ansikte: fnissig</p></figcaption></figure>
<figure class="frame"><img src="frames/13.jpg" alt="Bild 13" loading="lazy"><figcaption>
  <div class="t">13 · 1:46.2 · 7.0 s · Badrummet, halvbild</div><div class="said"><i>"Oj, lite honung är kvar. Björnen vet inte var."</i> (1:46.5)</div>
  <p>Rena tassar, men en gul klick är kvar på nosen. Björnen tittar på tassarna, sedan åt vänster och höger (ögonen, huvudet vänds inte)</p><p class="ans">Ljud: frågande brum (⚠) · Ansikte: nyfiken</p></figcaption></figure>
<figure class="frame"><img src="frames/14.jpg" alt="Bild 14" loading="lazy"><figcaption>
  <div class="t">14 · 1:53.1 · 10.3 s · Närbild ansiktet (klipp)</div><div class="said"><i>"Kan du hjälpa björnen? Kan du se var honungen är?"</i> (1:53.4)</div>
  <p>Den gula klicken på nosen. Paus 5 s; efter ca 3 s skimrar klicken svagt</p><p class="ans">Ljud: tyst · Ansikte: nyfiken</p></figcaption></figure>
<figure class="frame"><img src="frames/15.jpg" alt="Bild 15" loading="lazy"><figcaption>
  <div class="t">15 · 2:03.4 · 4.5 s · Samma</div><div class="said"><i>"Ja, där! Ja, på nosen!"</i> (2:03.4)</div>
  <p>Klicken skimrar tydligt</p><p class="ans">Ljud: förtjust brum (⚠), <code>tindra</code> · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/16.jpg" alt="Bild 16" loading="lazy"><figcaption>
  <div class="t">16 · 2:08.0 · 5.4 s · Samma</div><div class="said"><i>"Gnugga, gnugga … ren!"</i> (2:08.3)</div>
  <p>Skumtussen snurrar över nosen (armen når inte dit), björnen blundar. Klicken är borta på <i>"ren!"</i></p><p class="ans">Ljud: <code>skrubb</code>, fniss (⚠) · Ansikte: blundar, ler</p></figcaption></figure>
<figure class="frame"><img src="frames/17.jpg" alt="Bild 17" loading="lazy"><figcaption>
  <div class="t">17 · 2:13.4 · 5.7 s · Badrummet, halvbild</div><div class="said"><i>"Oj! Bubblor!"</i> (2:14.8)</div>
  <p>Kritan ritar tre bubblor som flyger långsamt upp och spricker mjukt, en i taget</p><p class="ans">Ljud: <code>pop</code> × 3, fniss (⚠) · Ansikte: förvånad → jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/18a.jpg" alt="Bild 18a" loading="lazy"><figcaption>
  <div class="t">18a · 2:19.1 · 8.9 s · Samma</div><div class="said"><i>"Nu är du alldeles ren! Kan du klappa händerna?"</i> (2:19.4)</div>
  <p>Alldeles rena tassar, björnen visar dem. Efter frågan: paus 4 s</p><p class="ans">Ljud: tyst i pausen · Ansikte: stolt</p></figcaption></figure>
<figure class="frame"><img src="frames/18b.jpg" alt="Bild 18b" loading="lazy"><figcaption>
  <div class="t">18b · 2:28.0 · 4.1 s · Samma</div><div class="said"><i>"Klapp, klapp, klapp!"</i> (2:28.0)</div>
  <p>Björnen klappar tre lugna klapp (riggens klapp), ett kritstreck-gnistrande per klapp. <b>Leken (klappa händerna). Shorten slutar här</b></p><p class="ans">Ljud: <code>tass-klapp-tre</code>, fniss (⚠) · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/19.jpg" alt="Bild 19" loading="lazy"><figcaption>
  <div class="t">19 · 2:32.1 · 6.5 s · Samma</div><div class="said"><i>"Mmm … mjuk handduk."</i> (2:32.5)</div>
  <p>Handduken glider upp framför tassarna och ner igen</p><p class="ans">Ljud: mysig suck (⚠) · Ansikte: blundar, ler</p></figcaption></figure>
<figure class="frame"><img src="frames/20.jpg" alt="Bild 20" loading="lazy"><figcaption>
  <div class="t">20 · 2:38.5 · 5.7 s · Samma</div><div class="said"><i>"Hej då, björnen! Hej då, tvålen!"</i> (2:38.8)</div>
  <p>Björnen vinkar (armen bakom kroppen, snett ut förbi kanten), tvålen ligger på handfatets kant. <b>Hej då med vinkning</b></p><p class="ans">Ljud: hej då-brum (⚠) · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/21.jpg" alt="Bild 21" loading="lazy"><figcaption>
  <div class="t">21 · 2:44.2 · 5.3 s · Samma</div><div class="said"><i>"Hej då! Vi ses snart!"</i> (2:44.5)</div>
  <p>Björnen vinkar klart, armen sjunker</p><p class="ans">Ljud: fniss (⚠) · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/22.jpg" alt="Bild 22" loading="lazy"><figcaption>
  <div class="t">22 · 2:49.5 · 2.5 s · Badrummet → kritirisen</div><div class="said">–</div>
  <p>Kritirisen drar ihop sig runt björnen och tvålen</p><p class="ans">Ljud: – · Ansikte: glad</p></figcaption></figure></div>
</div></body></html>
