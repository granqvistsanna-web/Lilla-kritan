<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>030 badet</title>
<style>html, body { margin:0; background:#000; overflow:hidden; } svg { width:100vw; height:100vh; display:block; }</style>
</head>
<body>
<!-- Avsnitt 030 Borsta, borsta (gulliga djur): hela sången i en kodscen, en plats (badrummet). Förlaga: 023 scener/badet (kopierad och
     bantad). Ett läge per rad i ../../storyboard/storyboard.md: S['id'] = (tl, d) => ({ kam, figs, … }), tl = sekunder in i raden.
     TID: scenens t = sångtid (t 0 = sångens 0:00.0). Inget intro än: när introt är bestämt blir avsnittstid = sångtid + introts längd,
     och bara den summan ändras (scenen och ../sang.m4a hänger ihop som de är, sången klipps aldrig).
     Rendera: node ../render.mjs badet --snabb (från scener/). Stillbilder: node ../render.mjs badet 12 40 …
     Figurerna är v2-riggarna live ur uttryck.html (v2-rigg.js + rigg-motor.js): katten, kaninen, pandan. Borstningen är riggens
     L.ROR.borsta('upp' | 'skrubba' | 'uppe' | 'nere' | 'klar', tl, d). Bara hårda klipp mellan tre utsnitt: helbild, ansiktet, munnen.
     I kod: tandborsten på handfatet, skumklicken på kaninens nos, kritirisen. -->
<svg viewBox="0 0 1920 1080">
  <defs>
    <filter id="boil" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="5000">
      <feTurbulence id="brus" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
      <feDisplacementMap in="SourceGraphic" scale="5"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="#FAF8F2"/>
  <g id="kamera">
    <g id="platta"></g>
    <g id="vagg"></g>
    <g id="bak"></g>
    <g id="bakom" filter="url(#boil)"></g>
    <g filter="url(#boil)"><g id="figurer"></g></g>
    <g id="kar"></g>
    <g id="pafat" filter="url(#boil)"></g>
    <g id="fram" filter="url(#boil)"></g>
  </g>
  <g id="ram"></g>
  <g id="gomda" opacity="0"></g>
</svg>
<script src="/verktyg/blinka.js"></script>
<script src="/verktyg/kant.js"></script>
<script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script type="module">
const $ = id => document.getElementById(id);
const A = '/assets/', R = A + 'rekvisita/';
const PLATTA = A + 'bakgrunder/badrummet/badrummet-v1.jpeg', HANDFAT = R + 'handfatet/cut/handfatet.png', BORSTE = R + 'tandborsten/cut/tandborsten.png';
// Inredningen (format/borstasang.md, provbild/badrum-inredning.jpg): [bild, bredd px, höjd px i filen, x, y, bredd i scenen]. Allt sitter högt och långt ut.
// Skåpet och tavlan sitter 74 px högre än i inredningsbilden (underkant y 308 och 290): annars syns deras underkant i ansiktsutsnitten (överkant y 328).
const INREDNING = [[R + 'vaggskap/cut/vaggskap.png', 945, 623, 158, 78, 348], [R + 'tavlan/cut/tavlan.png', 680, 679, 585, 98, 192],
  [R + 'handduk/cut/handduk-krok.png', 538, 1033, 1700, 60, 170], [R + 'badanka/cut/badanka.png', 716, 661, 96, 800, 112]];
// Runda 2: handduken sitter högre och längre ut (x 1700–1870, underkant y 386) så att ingen i raden skymmer den och den inte sticker in i öppningens utsnitt, och ankan står till vänster, för de som har borstat klart står till höger.
const lagg = (id, h) => $(id).insertAdjacentHTML('beforeend', h);
const kl = (k, a = 0, b = 1) => Math.max(a, Math.min(b, k)), lerp = (a, b, k) => a + (b - a) * k;
const mjuk = k => (k = kl(k), k * k * (3 - 2 * k)), del = (a, b, t) => mjuk((t - a) / (b - a));
const bump = (a, b, t) => (t <= a || t >= b) ? 0 : Math.sin(Math.PI * (t - a) / (b - a));
const f1 = v => v.toFixed(1);

// --- Mått i scenen (1920 × 1080) -----------------------------------------------------------------------------------------
// Samma uppställning som riggarnas provbild (uttryck.html?prov=borsta), 1,385 × större: handfatet 300 px brett som i inredningsbilden.
const SK = 0.69, MARK = 923, HX = 960;              // figurernas skala, fötternas linje, handfatets mitt
const HS = 0.374, HB = 802 * HS, HH = 775 * HS, RIM = MARK + 6 - HH + 177 * HS;   // handfatet (802 × 775, läppens överkant y 177)
const HOGER = [[1420], [1370, 1680]];               // där de som har borstat klart står under nästa vers (till höger, den som kommer in går fritt från vänster)
const OPP3 = [460, 960, 1460], OPP = { s: 0.82, fot: 975 };   // öppningen (helbild utan handfat): alla tre större än annars (skala 0,82 mot 0,69), fritt, mitt i bild, med luft emellan
const RAD3 = [520, 960, 1400];                      // slutet: katten, kaninen, pandan på rad (kaninen bakom handfatet)
const IN_X = -60;                                   // där en figur står när den kommer in (halva kroppen i bild)
// Utsnitten är storyboardens, omräknade till scenens skala: ansiktet 2,8 × 0,5 / SK, munnen tätt (gapet en tredjedel av bildens bredd).
const K_HEL = [1, 960, 540], Z_ANS = 2.8 * 0.5 / SK;
const K_FAT = [3.3, HX - 25, RIM - 20];   // förspelet: nära på handfatet
const FIG = [{ slug: 'katten-kaj', ljud: 'mjau/mjau-1', nos: [509, 428], oga: '.pupill ellipse', arm: { axel: 130, L: 88 } }, { slug: 'kaninen-kanel', ljud: 'kanin-gullig/kanin-gullig-3', nos: [508, 420], oga: '.oga ellipse', arm: { axel: 135, L: 138 } },
  { slug: 'pandan-pim', ljud: 'brum-gullig/brum-gullig-2', nos: [511, 440], arm: { axel: 130, L: 125, ut: [36, 20] } }];   // arm: armens vilovinkel och längd i riggen (uttryck.html), ut = den lyfta armens utflyttning

let KAM = K_HEL, TT = 0;
function kamera([z, cx, cy]) {
  const tx = Math.max(1920 - 1920 * z, Math.min(0, 960 - cx * z)), ty = Math.max(1080 - 1080 * z, Math.min(0, 540 - cy * z));
  KAM = [z, tx, ty];
  $('kamera').setAttribute('transform', `translate(${tx.toFixed(2)} ${ty.toFixed(2)}) scale(${z.toFixed(4)})`);
  $('brus').nextElementSibling.setAttribute('scale', (5 / z).toFixed(2));
}
const skarm = ([x, y]) => [KAM[1] + x * KAM[0], KAM[2] + y * KAM[0]];
const iFig = (x, [px, py], L) => [x + (px - 512) * SK, MARK + (py - L.FOTTER) * SK];
const kAns = (F, x = HX) => [Z_ANS, x, MARK - SK * (F.L.FOTTER - 470) - 7];
const kMun = F => [640 / (F.mun.w * SK), ...iFig(HX, [F.mun.cx, F.mun.cy], F.L)];

// --- Badrummet: byggs en gång -----------------------------------------------------------------------------------------------
function badrum() {
  $('platta').innerHTML = `<image href="${PLATTA}" width="1920" height="1080" preserveAspectRatio="xMidYMid slice"/>`;
  $('vagg').innerHTML = INREDNING.map(([bild, w, h, x, y, b]) => `<g><image href="${bild}" x="${x}" y="${y}" width="${b}" height="${f1(b * h / w)}"/></g>`).join('');
  // kranen i bilden maskas bort och ritas om i kod (runda 3, Sanna: "polish faucet"; som i 023, bilden är orörd): en ren, knubbig
  // svanhals i mjukt silverblått med en glansrand och två korallröda rattar. Den ligger i handfatets kantgrupp och får samma tunna kant.
  $('kar').innerHTML = `<defs><mask id="utan-kran" maskUnits="userSpaceOnUse" x="-50" y="-50" width="900" height="900"><rect x="-50" y="-50" width="900" height="900" fill="#fff"/><rect x="560" y="-50" width="300" height="218" fill="#000"/></mask></defs>
    <g transform="translate(${f1(HX - HB / 2 + 12)} ${f1(MARK + 6 - HH)}) scale(${HS})"><image href="${HANDFAT}" width="802" height="775" mask="url(#utan-kran)"/>${KRANBILD}</g>`;
}
const KRAN_D = 'M698 168 L698 72 C698 30 672 14 646 14 C619 14 600 31 600 58 L600 72';   // i handfatsbildens pixlar (läppen y 177)
const KRANBILD = `<g id="kran"><rect x="664" y="156" width="68" height="24" rx="11" fill="#a9bfcf"/>
  <path d="${KRAN_D}" fill="none" stroke="#9fb6c8" stroke-width="40" stroke-linecap="round"/>
  <path d="${KRAN_D}" fill="none" stroke="#d6e4ee" stroke-width="31" stroke-linecap="round"/>
  <path d="M687 158 L687 74 C687 42 668 27 646 26" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  <rect x="585" y="64" width="30" height="20" rx="7" fill="#9fb6c8"/><rect x="589" y="67" width="22" height="13" rx="5" fill="#c3d5e2"/>
  ${[[660, 150], [736, 150]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="24" fill="#e0705a"/><circle cx="${x}" cy="${y}" r="20" fill="#f08e76"/><circle cx="${x - 8}" cy="${y - 8}" r="6" fill="#fff" opacity="0.75"/>`).join('')}</g>`;
// Tandborsten ligger på handfatets läpp mellan verserna (huvudet åt vänster, mot tandkrämen) och tandkrämstuben står vid läppens
// vänstra ände (runda 3: bort från kranen, större: 85 px hög = halva borstens längd). Tuben är rekvisita/tandkramen.md (386 × 741,
// står på korken); korken är samma bild klippt vid y 594, så att den kan lossna. rand 0–1 = randen av tandkräm på borsten (i kod).
const BS = 0.28 * SK, TUB = R + 'tandkramen/cut/tandkramen.png', TUB_S = 85 / 741, TUB_X = HX - 100, BORST_X = HX + 10, KORK_Y = 594;
const HUVUD_X = BORST_X + (115 - 438) * BS, BORST_TOPP = RIM + 3 + (13 - 212) * BS;      // borsthuvudets mitt och borstens överkant på handfatet
const borstePaFat = (v = 0, dy = 0, rand = 1) => lagg('pafat', `<g transform="translate(${BORST_X} ${f1(RIM + 3 + dy)}) rotate(${f1(v)}) scale(${BS}) translate(-438 -212)"><image href="${BORSTE}" width="877" height="238"/>
  ${rand > 0.01 ? `<path d="M48 4 q24 -22 48 0 t48 0 t48 0" pathLength="1" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" stroke-dasharray="${rand.toFixed(3)} 2"/>
  <path d="M48 4 q24 -22 48 0 t48 0 t48 0" pathLength="1" fill="none" stroke="#8fe3d2" stroke-width="10" stroke-linecap="round" stroke-dasharray="${rand.toFixed(3)} 2"/>` : ''}</g>`);
// En tub i lagret `lager`: hel (x, y = där korken står) eller öppen (kork = [x, y, v] där korken är; x, y = tubens öppning, v = lutning kring den,
// sx = hur mycket den kläms). I den öppna tuben syns en liten pip där korken satt.
const tubBild = (x, y, { v = 0, sx = 1, kork = null } = {}, lager = 'pafat') => lagg(lager, kork
  ? `<g transform="translate(${f1(kork[0])} ${f1(kork[1])}) rotate(${f1(kork[2] || 0)}) scale(${TUB_S}) translate(-193 -738)"><g clip-path="url(#tubkork)"><image href="${TUB}" width="386" height="741"/></g></g>
     <g transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(v)}) scale(${(TUB_S * sx).toFixed(4)} ${TUB_S}) translate(-193 -${KORK_Y + 44})"><rect x="152" y="${KORK_Y - 8}" width="82" height="52" rx="14" fill="#efe6d2"/><g clip-path="url(#tubkropp)"><image href="${TUB}" width="386" height="741"/></g></g>`
  : `<g transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(v)}) scale(${TUB_S}) translate(-193 -738)"><image href="${TUB}" width="386" height="741"/></g>`);
const tuben = ({ dy = 0, v = 0 } = {}) => tubBild(TUB_X, RIM + 4 + dy, { v });      // tuben på sin plats på handfatet
const hopp = (tl, t0, h, d = 0.5) => { const u = (tl - t0) / d; return u > 0 && u < 1 ? -h * 4 * u * (1 - u) : 0; };   // ett mjukt hopp (sakerna, px i scenen)
// figurens mjuka hopp (px i riggens ruta): hukar lite, hoppar, landar mjukt
const hoppa = (tl, t0, h = 45, d = 0.65) => ({ lyft: hopp(tl, t0, h, d), strack: -0.05 * bump(t0 - 0.18, t0, tl) + 0.03 * bump(t0, t0 + d, tl) - 0.05 * bump(t0 + d, t0 + d + 0.28, tl) });
// krit-gnistor: en fyruddig stjärna (ur 023) som växer fram och krymper, vrids inte
const stjarna = (x, y, r) => r > 0.5 ? `<path transform="translate(${f1(x)} ${f1(y)}) scale(${r.toFixed(2)})" d="M0 -1 L.2 -.2 L1 0 L.2 .2 L0 1 L-.2 .2 L-1 0 L-.2 -.2Z" fill="#fff6c8" stroke="#e6b422" stroke-width=".07" stroke-linejoin="round"/>` : '';
const skur = (cx, cy, R, tl, n = 7, r = 36) => lagg('fram', Array.from({ length: n }, (_, i) => { const a = (i / n) * 2 * Math.PI - 1.2, rr = R * (0.75 + 0.3 * ((i * 5) % 3) / 2);
  return stjarna(cx + rr * Math.cos(a), cy + 0.7 * rr * Math.sin(a), r * (0.6 + 0.4 * ((i * 3) % 2)) * bump(0.07 * i, 0.07 * i + 0.8, tl)); }).join(''));

// --- Skumklicken på kaninens nos (ur 023: tuss och bubbla) och kritirisen ---------------------------------------------------------
const tuss = (x, y, r, v = 0) => [[0, 0, 1], [-0.8, 0.25, 0.7], [0.8, 0.2, 0.75], [-0.35, -0.55, 0.65], [0.4, -0.5, 0.6]]
  .map(([dx, dy, k]) => { const c = Math.cos(v), s = Math.sin(v), ex = dx * c - dy * s, ey = dx * s + dy * c;
    return `<circle cx="${f1(x + ex * r)}" cy="${f1(y + ey * r)}" r="${f1(k * r)}" fill="#fff" stroke="#cfe6ee" stroke-width="${f1(0.08 * r)}" paint-order="stroke"/>`; }).join('');
const sprack = (x, y, r, u) => u > 0 && u < 1 && lagg('fram', Array.from({ length: 9 }, (_, i) => { const a = i / 9 * 2 * Math.PI, rr = r * (1 + 1.2 * u);
  return `<circle cx="${f1(x + rr * Math.cos(a))}" cy="${f1(y + rr * Math.sin(a))}" r="${f1(0.28 * r * (1 - u) + 1)}" fill="#fff" stroke="#cfe6ee" stroke-width="1.5" opacity="${f1(1 - u)}"/>`; }).join(''));
function kritiris(r, [cx, cy], t) {
  if (r >= 1400) return;
  const ring = 'M' + Array.from({ length: 145 }, (_, j) => { const a = j / 144 * 2 * Math.PI, rr = r * (1 + 0.07 * Math.sin(9 * a + t * 0.8));
    return `${f1(cx + rr * Math.cos(a))} ${f1(cy + rr * Math.sin(a))}`; }).join('L') + 'Z';
  lagg('ram', `<path d="M-50 -50H1970V1130H-50Z ${r > 1 ? ring : ''}" fill="#101010" fill-rule="evenodd"/>
    ${r > 1 ? `<path d="${ring}" fill="none" stroke="#fff8e0" stroke-width="${Math.min(14, r / 4)}" stroke-linejoin="round" filter="url(#boil)"/>` : ''}`);
}

// --- Figurerna ---------------------------------------------------------------------------------------------------------------
// En figur i ett läge: { n: 0 katten | 1 kaninen | 2 pandan, x, f: ansikte, p: pose, vid: står bakom handfatet (skuggan dold), blink: false }
const ANS = (n, namn, o = {}) => ({ ...FIG[n].L.blanda('neutral', namn, 1), ...o });
const POS = (n, o = {}) => ({ ...FIG[n].L.POSE0, ...o });
const GAP = (n, vit = 0) => ({ ...FIG[n].L.param('gapar'), tander: Array(8).fill(vit) });           // gapet, matta (0) eller vita (1) tänder
const LER = n => ({ ...FIG[n].L.param('flinar'), tander: Array(8).fill(1) });                        // tandleendet, alla vita
const andas = (p, t, n) => ({ ...p, strack: (p.strack || 0) + 0.012 * (1 - Math.cos(2 * Math.PI * (t + n) / 3.6)) / 2 });
// vinkar: armen bakom kroppen, snett ut förbi kanten (023)
const vink = (tl, v) => ({ luta: 3 * v, armar: [0, v * (86 + 14 * Math.sin(2 * Math.PI * 1.1 * tl))] });
function figur({ n, x, f, p, vid = false, blink = true, kawaii = 0, s = SK, fot = MARK }, t) {
  const F = FIG[n], G = F.G;
  $('figurer').appendChild(G);
  G.setAttribute('transform', `translate(${f1(x)} ${fot}) scale(${s}) translate(-512 ${-F.L.FOTTER})`);
  F.L.rita(G, blink ? F.blinka(f, t) : f, andas(p, t, n));
  if (vid) G.querySelector('.skugga').setAttribute('opacity', 0);
  // kawaii-ögon på de glada slagen: större glans i ögonen (pandan har sina egna i riggen, f.kawaii)
  if (kawaii > 0.05 && F.oga) { const inv = $('kamera').getScreenCTM().inverse();
    G.querySelectorAll(F.oga).forEach(e => { const b = e.getBoundingClientRect(), q = new DOMPoint(b.x + b.width / 2, b.y + b.height / 2).matrixTransform(inv), w = b.width * inv.a, h = b.height * inv.a;
      lagg('fram', `<circle cx="${f1(q.x - 0.17 * w)}" cy="${f1(q.y - 0.2 * h)}" r="${f1(0.27 * w * kawaii)}" fill="#fff"/><circle cx="${f1(q.x + 0.2 * w)}" cy="${f1(q.y + 0.2 * h)}" r="${f1(0.13 * w * kawaii)}" fill="#fff"/>`); }); }
}
const KAWAII = (n, k) => n === 2 ? { ...ANS(n, 'glad'), kawaii: k } : ANS(n, 'glad', { ogonS: [1 + 0.1 * k, 1 + 0.12 * k] });

// --- Raderna: id och sångtid ur storyboarden (tider med ~ är inte hörda än) -----------------------------------------------------
const TIDER = [['00', 0], ['01', 4.8], ['02', 9.7], ['10', 14.7], ['11', 18.8], ['12', 20.9], ['13', 27.1], ['14', 29.7], ['15', 32.1], ['16', 34.5],
  ['20', 37.3], ['21', 40.8], ['22', 42.9], ['23', 49.1], ['24', 51.6], ['25', 54.1], ['26', 56.5],
  ['30', 59.3], ['31', 62.5], ['32', 64.8], ['33', 71.1], ['34', 73.7], ['35', 76.2], ['36', 78.6],
  ['40', 80.9], ['41', 82.3], ['42a', 84.9], ['42b', 85.9], ['42c', 86.5], ['43', 87.1], ['44', 90.9]];
const DURATION = 100.8;                              // sångens längd
const RAD = TIDER.map(([id, s], i) => ({ id, s, d: (TIDER[i + 1]?.[1] ?? DURATION) - s })), T = Object.fromEntries(RAD.map(r => [r.id, r]));
const GLANS = [1.1, 1.2, 1.3];                       // glansstjärnan in i raden "Rena tänder!": 0:35.6, 0:57.7, 1:19.9
const LJUD_IN = 0.7;                                 // djurets ljud in i mellanspelet (rad 12, 22, 32)

const S = {};
// Förspelet (två takter), nära på handfatet, en sak i taget (runda 3: korken ska synas tydligt). Stegen är delar av radens längd:
// tuben lyfts · korken lossnar med ett plopp och landar bredvid · tuben flyttar sig över borsten · lutar sig · klämmer ut en rand
// av tandkräm · reser sig · flyttar sig tillbaka · korken hoppar på igen · tuben landar.
const STEG = { lyft: [0.05, 0.15], kork: [0.19, 0.29], over: [0.33, 0.45], luta: [0.46, 0.54], klam: [0.55, 0.71], res: [0.72, 0.78], hem: [0.79, 0.88], pa: [0.89, 0.95], land: [0.95, 1] };
S['00'] = (tl, d) => { const u = tl / d, k = n => del(STEG[n][0], STEG[n][1], u), LYFT = 34, KH = (738 - KORK_Y) * TUB_S, PIP = 44 * TUB_S;
  const uppe = k('lyft') - k('land'), av = k('kork') - k('pa'), over = k('over') - k('hem'), lut = k('luta') - k('res'), fas = k('kork') * (1 - k('pa')) > 0 ? (k('pa') > 0 ? 1 - k('pa') : k('kork')) : 0;
  const bas = [TUB_X, RIM + 4 - LYFT * uppe];
  if (av <= 0) return { kam: K_FAT, figs: [], pafat: 0, rand: k('klam'), tubLage: { x: bas[0], y: bas[1] } };
  // korken: släpper från tuben, gör ett litet hopp åt vänster och står på läppen bredvid; samma väg tillbaka upp
  const kork = [TUB_X - 30 * fas, RIM + 4 - LYFT * (1 - fas) - 16 * Math.sin(Math.PI * fas), -10 * Math.sin(Math.PI * fas)];
  // tubens öppning: rakt under tuben när den hänger, sedan över borsthuvudet, strax ovanför borsten
  const pip = [lerp(TUB_X, HUVUD_X, over), lerp(RIM + 4 - LYFT - KH + PIP, BORST_TOPP - 14, over)];
  return { kam: K_FAT, figs: [], pafat: 0, bdy: 0, rand: k('klam'), tubLage: { x: pip[0], y: pip[1], v: -26 * lut, sx: 1 - 0.16 * bump(STEG.klam[0], STEG.klam[1], u), kork },
    klamma: bump(STEG.klam[0], STEG.klam[1], u) > 0 ? pip : null }; };
// "Nu ska vi borsta tänderna!": hårt klipp till de tre utan handfatet (runda 3: "too cramped, remove the sink"): de går in
// tillsammans från vänster och står fritt, stora och mitt i bild, med luft emellan
S['01'] = tl => ({ kam: K_HEL, utanFat: true, tub: null, figs: [0, 1, 2].map(n => { const g = kl(tl / 3.2), [fw, pw] = FIG[n].L.ROR.ga(0.25 + 1.5 * g + 0.3 * n), stopp = del(2.9, 3.4, tl);
  return { n, ...OPP, x: lerp(OPP3[n] - 1650, OPP3[n], 1 - (1 - g) ** 1.6), f: FIG[n].L.blanda({ ...fw, titt: [8, 0] }, ANS(n, 'glad'), stopp), p: FIG[n].L.blandaPose({ ...pw, x: 0, rikt: 0.7 }, POS(n), stopp) }; }) });
// andra raden: katten håller upp tandkrämen och pandan tandborsten (de kommer upp bakom kroppen med armen), alla vinkar och hoppar
// mjukt, en i taget, två gånger, med kawaii-ögon och några gnistor
S['02'] = tl => { const r = del(0.15, 0.75, tl);

    figs: [0, 1, 2].map(n => { const v = del(0.1 + 0.15 * n, 0.6 + 0.15 * n, tl) - del(3.9, 4.5, tl), k = del(0.1, 0.5, tl) - del(4.4, 4.9, tl), vk = vink(tl + n, v).armar[1];
      const h1 = hoppa(tl, 1.3 + 0.4 * n), h2 = hoppa(tl, 3.0 + 0.3 * n);
      return { n, ...OPP, x: OPP3[n], kawaii: k, f: KAWAII(n, k), p: POS(n, { luta: 3 * v, armar: n === 0 ? [95 * r, vk] : n === 2 ? [vk, 96 * r] : [0, vk], lyft: h1.lyft + h2.lyft, strack: h1.strack + h2.strack }) }; }) }; };

// En vers och en refräng för figur n. De som är klara står till höger med stängd mun.
const klara = n => Array.from({ length: n }, (_, i) => ({ n: i, x: HOGER[n - 1][i], f: ANS(i, 'glad'), p: POS(i) }));
function vers(n, a) {
  const id = k => a + k, vid = (f, p, o = {}) => ({ n, x: HX, f, p, vid: true, ...o });
  // går in från vänster till handfatet (2 s) och vinkar på ekot "Hej, …!"
  S[id(0)] = tl => { const g = kl(tl / 2.0), [fw, pw] = FIG[n].L.ROR.ga(0.25 + 1.5 * g), stopp = del(1.7, 2.1, tl), v = del(1.8, 2.3, tl);
    return { kam: K_HEL, pafat: 0, figs: [{ n, x: lerp(IN_X, HX, 1 - (1 - g) ** 1.6), vid: tl > 1.6,
      f: FIG[n].L.blanda({ ...fw, titt: [8, 0] }, ANS(n, 'jatteglad'), stopp), p: FIG[n].L.blandaPose({ ...pw, x: 0, rikt: 0.7 }, POS(n, vink(tl, v)), stopp) }, ...klara(n)] }; };
  // "Gapa stort!": munnen öppnas på ordet, matta tänder
  S[id(1)] = tl => ({ kam: kAns(FIG[n]), figs: [vid(FIG[n].L.blanda(ANS(n, 'glad'), GAP(n), del(0.1, 0.5, tl)), POS(n))] });
  // mellanspelet: figurens ljud (munnen stängs till ett glatt ansikte), gapar igen, och mot slutet kommer borsten upp i bild
  S[id(2)] = (tl, d) => { const L = FIG[n].L, ljud = n === 0 ? ANS(n, 'jatteglad') : n === 1 ? ANS(n, 'fnissig', { oron: [-8 * Math.sin(tl * 9), 8 * Math.sin(tl * 9)] }) : ANS(n, 'stolt');
    const f = L.blanda(L.blanda(GAP(n), ljud, del(0.4, 0.8, tl)), GAP(n), del(2.0, 2.5, tl)), u = tl - (d - 2.3);
    if (u < 0) return { kam: kAns(FIG[n]), figs: [vid(f, POS(n))] };
    const [fu, pu] = L.ROR.borsta('upp', u, 1.6);
    return { kam: kAns(FIG[n]), figs: [vid(fu, u < 0.5 ? L.blandaPose(POS(n), pu, del(0, 0.5, u)) : pu, { blink: false })] }; };
  const borsta = (...a) => { const [f, p] = FIG[n].L.ROR.borsta(...a); return { kam: null, figs: [vid(f, p, { blink: false })] }; };
  S[id(3)] = (tl, d) => ({ ...borsta('skrubba', tl, d), kam: kAns(FIG[n]) });            // "Borsta, borsta tänderna!": gnuggar, lite skum
  // "Borsta uppe!" / "Borsta nere!": raden blir vit en tand i taget; de sista 0,45 s sveper en glans över raden med tre små gnistor
  const GL = 0.45;
  S[id(4)] = (tl, d) => ({ ...borsta('uppe', tl, d - GL), kam: kMun(FIG[n]), glans: { n, rad: 0, u: (tl - (d - GL)) / GL } });
  S[id(5)] = (tl, d) => ({ ...borsta('nere', tl, d - GL), kam: kMun(FIG[n]), glans: { n, rad: 1, u: (tl - (d - GL)) / GL } });
  // "Rena tänder!": borsten bort, tandleendet; på "Hurra!" glansstjärnan, en skur gnistor och ett mjukt glädjehopp
  S[id(6)] = (tl, d) => { const st = borsta('klar', tl, d, { glans: GLANS[n], ner: 250 }), h = hoppa(tl, GLANS[n]), fg = st.figs[0];
    fg.p = { ...fg.p, lyft: h.lyft, strack: (fg.p.strack || 0) + h.strack };

vers(0, '1'); vers(1, '2'); vers(2, '3');
// Den roliga scenen (refräng 2): en skumklick hamnar på kaninens nos i rad 23, kaninen tittar på den; den sitter kvar i 24–25 och spricker på "Rena tänder!"
{ const s23 = S['23'];
  S['23'] = (tl, d) => { const st = s23(tl, d), f = st.figs[0].f;
    st.figs[0].f = { ...f, glad: f.glad.map(g => g * (1 - del(0.9, 1.1, tl) + del(2.1, 2.3, tl))), titt: [0, 9] };

// I versernas närbilder står tuben inte på handfatet: vid läppens vänstra ände skulle den stå framför borsthanden. I munutsnitten

for (const a of '123') for (const k of '123456') { const id = a + k, s = S[id]; S[id] = (tl, d) => ({ ...s(tl, d), tub: null, utanKran: k === '4' || k === '5' }); }

// Slutet: alla tre på rad med stängda munnar (4 s med frågan mitt i), tre ansiktsklipp, och sedan dansen
const rad3 = (f, p) => [0, 1, 2].map(n => ({ n, x: RAD3[n], f: f(n), p: p(n), vid: n === 1 }));

S['41'] = tl => ({ kam: K_HEL, pafat: 0, figs: rad3(n => ANS(n, 'glad'), n => POS(n, { luta: [-4, 4, -4][n] * del(0.2 + 0.15 * n, 0.8 + 0.15 * n, tl) })) });
// ansiktsklippen visar figuren ensam bakom handfatet, samma bild som i "Rena tänder!" (i raden skulle grannarna och handfatets kant sticka in i utsnittet)
['42a', '42b', '42c'].forEach((id, n) => S[id] = () => ({ kam: kAns(FIG[n]), tub: null, figs: [{ n, x: HX, f: LER(n), p: POS(n), vid: true }] }));
// Slutdansen från "Hej då!" (1:27.1) tills irisen har slutit sig (1:40.2): alla tre vinkar på "Hej då!" och ekot och dansar sedan
// glatt: mjuka hopp i takt, en i taget (två slag isär), armarna uppe och gungar. Pandan håller upp tandborsten, tuben dansar på
// handfatet, gnistor. Kritirisen sluter sig runt kaninen först de sista 2,6 s, så det blir högst 0,6 s svart.
const TAKT = 0.62, IRIS = 10.5;

  const figs = rad3(n => LER(n), n => { const v = del(0.1 + 0.2 * n, 0.6 + 0.2 * n, T) * (1 - d), fas = (T - 0.5 - 2 * TAKT / 3 * n) / (2 * TAKT), h = hoppa(fas - Math.floor(fas), 0.25, 36, 0.5);
    const vk = v * (86 + 14 * Math.sin(2 * Math.PI * 1.1 * T)) + (52 - 13 * sv) * d;   // katten håller upp tandkrämen, pandan tandborsten, den andra armen vinkar och gungar
    const upp = n === 2 ? [(94 + 5 * sv) * d, 96] : n === 0 ? [95, vk] : [(52 + 13 * sv) * d, vk];
    return POS(n, { luta: 3 * v + 4 * sv * d, armar: upp, lyft: T > 0.5 ? h.lyft : 0, strack: T > 0.5 ? h.strack : 0 }); });
  return { kam: K_HEL, figs, tub: null, hall: [{ n: 0, i: 0, sak: 'tub', k: 1 }, { n: 2, i: 1, sak: 'borste', k: 1 }], iris: T - IRIS,
    gnistor: Array.from({ length: 22 }, (_, i) => [0.4 + 0.55 * i, [380, 1560, 760, 1180, 250, 1700, 960][i % 7], [330, 360, 240, 290, 520, 560, 200][i % 7]]) }; };
S['43'] = tl => dans(tl);
S['44'] = tl => dans(tl + T['44'].s - T['43'].s);

// --- En bildruta ---------------------------------------------------------------------------------------------------------
function rita(t) {
  ['bakom', 'pafat', 'fram', 'ram'].forEach(n => $(n).innerHTML = '');
  FIG.forEach(F => $('gomda').appendChild(F.G));
  TT = t; const r = RAD.findLast(r => t >= r.s) || RAD[0], tl = t - r.s, st = S[r.id](tl, r.d);
  kamera(st.kam);
  st.figs.forEach(fg => figur(fg, t));
  if (st.pafat != null) borstePaFat(st.pafat, st.bdy || 0, st.rand ?? 1);
  if (st.tubLage) { const g = st.tubLage; tubBild(g.x, g.y, g); } else if (st.tub !== null) tuben(st.tub);
  if (st.klamma) lagg('pafat', `<circle cx="${f1(st.klamma[0])}" cy="${f1(st.klamma[1] + 5)}" r="7" fill="#fff"/><circle cx="${f1(st.klamma[0])}" cy="${f1(st.klamma[1] + 5)}" r="3" fill="#8fe3d2"/>`);   // tandkrämen kommer ut ur pipen
  $('kar').style.display = st.utanFat ? 'none' : ''; $('kran').style.display = st.utanKran ? 'none' : '';
  const nos = () => iFig(HX, FIG[1].nos, FIG[1].L);
  if (st.klick > 0.01) lagg('fram', tuss(...nos(), 17 * SK * st.klick, 0.4));
  if (st.klickSprack != null) sprack(...nos(), 17 * SK, st.klickSprack);
  if (st.glans && st.glans.u > 0 && st.glans.u < 1) {      // glansen sveper över tandraden, tre små gnistor
    const { n, rad, u } = st.glans, M = FIG[n].mun, [mx, my] = iFig(HX, [M.cx, M.cy], FIG[n].L), w = M.w * SK, h = M.h * SK, y0 = my - h / 2 + (rad ? 0.6 * h : 0), rh = 0.4 * h, x = mx - 0.8 * w + 1.6 * w * u;
    lagg('fram', `<clipPath id="glansklipp"><rect x="${f1(mx - w / 2)}" y="${f1(y0)}" width="${f1(w)}" height="${f1(rh)}" rx="${f1(0.3 * rh)}"/></clipPath>
      <g clip-path="url(#glansklipp)"><path d="M${f1(x)} ${f1(y0 + rh)} L${f1(x + 0.5 * rh)} ${f1(y0)} L${f1(x + 0.5 * rh + 0.2 * w)} ${f1(y0)} L${f1(x + 0.2 * w)} ${f1(y0 + rh)}Z" fill="#fff" opacity="${(0.85 * Math.sin(Math.PI * u)).toFixed(2)}"/></g>
      ${[[-0.34, 0.1, 0], [0.05, 0.95, 0.25], [0.36, 0.2, 0.5]].map(([dx, dy, t0]) => stjarna(mx + dx * w, y0 + dy * rh, 0.11 * w * bump(t0, t0 + 0.5, u))).join('')}`);
  }
  if (st.skur > 0 && st.skur < 1.5) { const fg = st.figs[0], [cx, cy] = iFig(fg.x, [512, 470], FIG[fg.n].L); skur(cx, cy, 250 * SK + 60, st.skur); }
  if (st.gnistor) lagg('fram', st.gnistor.map(([t0, x, y], i) => stjarna(x, y, (30 + 10 * (i % 3)) * bump(t0, t0 + 0.75, tl))).join(''));
  // En figur håller upp en sak (tuben eller borsten) i den lyfta handen. Handens plats räknas ur riggen: vridpunkten, armens
  // vilovinkel och längd, den lyfta armens utflyttning, hoppet och lutningen. Saken ritas bakom figuren, så att handen ligger
  // framför den och den kommer upp bakom kroppen när armen lyfts (k 0–1).
  for (const { n, i, sak, k } of st.hall || []) { const fg = st.figs.find(f => f.n === n), F = FIG[n], L = F.L, s = i ? -1 : 1, [px, py] = L.RIGG[i ? 'arm-r' : 'arm-l'];
    const A = 8 + fg.p.armar[i], v = (i ? 180 - F.arm.axel - A : F.arm.axel + A) * Math.PI / 180, [ux, uy] = F.arm.ut || [0, 0], lu = (fg.p.luta || 0) * Math.PI / 180;
    const hx = lerp(0, px - s * ux + 0.8 * F.arm.L * Math.cos(v) - 512, k), hy = lerp(560, py - uy + 0.8 * F.arm.L * Math.sin(v), k) + (fg.p.lyft || 0) - L.FOTTER;
    const fs = fg.s || SK, x = fg.x + (hx * Math.cos(lu) - hy * Math.sin(lu)) * fs, y = (fg.fot || MARK) + (hx * Math.sin(lu) + hy * Math.cos(lu)) * fs, lut = fg.p.luta || 0, m = fs / SK;
    // sakerna är lika stora mot figuren i alla bilder (m = figurens skala mot den vanliga)
    lagg('bakom', sak === 'tub' ? `<g transform="translate(${f1(x)} ${f1(y + 12 * m)}) rotate(${f1(lut - 8)}) scale(${(TUB_S * m).toFixed(4)}) translate(-193 -738)"><image href="${TUB}" width="386" height="741"/></g>`
      : `<g transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(72 + lut)}) scale(${(BS * m).toFixed(4)}) translate(-700 -150)"><image href="${BORSTE}" width="877" height="238"/></g>`); }
  if (st.iris != null && st.iris > 0) {       // sluter sig runt kaninen de sista 2,6 s, sedan svart
    const u = st.iris, rr = u < 1.2 ? lerp(1400, 300, mjuk(u / 1.2)) : lerp(300, 0, mjuk((u - 1.5) / 1.1));
    kritiris(rr, skarm(iFig(HX, [512, 470], FIG[1].L)), t);
  }

  window.kant?.uppdatera();
}

// --- Ljud: sången ligger under hela scenen (window.SANG); här läggs djurens ljud, borstljudet, glansen och ploppet lågt under ------

    ut.push({ t: T[a + '3'].s, fil: E + 'skrubb/skrubb-1.m4a', vol: 1.6, langd: T[a + '6'].s - T[a + '3'].s - 0.2, loop: true, fadeIn: 0.2, fade: 0.3 });   // borstljud rad 13–15

  ut.push({ t: STEG.kork[0] * I, fil: E + 'plopp/plopp-1.m4a', vol: 1.0 });                                                        // korken lossnar
  ut.push({ t: STEG.klam[0] * I + 0.1, fil: E + 'plupp/plupp-1.m4a', vol: 0.8 });                                                  // tandkrämen kläms ut
  ut.push({ t: STEG.pa[1] * I - 0.05, fil: E + 'plopp/plopp-1.m4a', vol: 0.6 });                                                   // korken på igen
  ['14', '15', '24', '25', '34', '35'].forEach(id => ut.push({ t: T[id].s + T[id].d - 0.45, fil: E + 'tindra/tindra-4.m4a', vol: 0.8 }));
  [T['02'].s + 1.3, T['02'].s + 3.0, T['43'].s + 0.4, T['44'].s + 1.2].forEach(t => ut.push({ t, fil: E + 'tindra/tindra-4.m4a', vol: 0.9 }));                                                               // skumklicken spricker
  return ut;
}

window.DURATION = DURATION;

  [...$('vagg').children].forEach(g => window.kant?.lagg(g)); window.kant?.lagg($('kar')); window.kant?.lagg($('pafat')); window.kant?.lagg($('bakom'));
  document.querySelector('defs').insertAdjacentHTML('beforeend', `<clipPath id="tubkropp"><rect x="-20" y="-20" width="426" height="${KORK_Y + 20}"/></clipPath><clipPath id="tubkork"><rect x="-20" y="${KORK_Y}" width="426" height="170"/></clipPath>`);
  await Promise.all([PLATTA, HANDFAT, BORSTE, TUB, ...INREDNING.map(i => i[0])].map(u => new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = u; })));

})();
