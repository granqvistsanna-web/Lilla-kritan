<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>030 badet</title>
<style>html, body { margin:0; background:#000; overflow:hidden; } svg { width:100vw; height:100vh; display:block; }</style>
</head>
<body>
<!-- Avsnitt 030 Borsta, borsta (gulliga djur): hela sången i en kodscen, en plats (badrummet). Förlaga: 023 scener/badet (kopierad och
     bantad). Ett läge per rad i ../../storyboard/storyboard.md: S['id'] = (tl, d) => ({ kam, figs, … }), tl = sekunder in i raden.
     TID: scenens t = sångtid (t 0 = sångens 0:00.0). Inget intro än: när introt är bestämt blir avsnittstid = sångtid + introts längd,
     och bara den summan ändras (scenen och ../sang.m4a hänger ihop som de är, sången klipps aldrig).
     Rendera: node ../render.mjs badet --snabb (från scener/). Stillbilder: node ../render.mjs badet 12 40 …
     Figurerna är v2-riggarna live ur uttryck.html (v2-rigg.js + rigg-motor.js): katten, kaninen, pandan. Borstningen är riggens
     L.ROR.borsta('upp' | 'skrubba' | 'uppe' | 'nere' | 'klar', tl, d). Bara hårda klipp mellan tre utsnitt: helbild, ansiktet, munnen.
     I kod: tandborsten på handfatet, skumklicken på kaninens nos, kritirisen. -->
<svg viewBox="0 0 1920 1080">
  <defs>
    <filter id="boil" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="5000">
      <feTurbulence id="brus" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
      <feDisplacementMap in="SourceGraphic" scale="5"/>
    </filter>
    <filter id="mjuk" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="turkos" color-interpolation-filters="sRGB"><feColorMatrix type="hueRotate" values="172"/><feColorMatrix type="saturate" values="0.8"/><feConvolveMatrix order="3" kernelMatrix="0 -0.6 0 -0.6 3.4 -0.6 0 -0.6 0" edgeMode="duplicate"/></filter>
    <linearGradient id="svepgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.25" stop-color="#fff" stop-opacity="1"/><stop offset="0.75" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="#FAF8F2"/>
  <g id="kamera">
    <g id="platta"></g>
    <g id="vagg"></g>
    <g id="disco"></g>
    <g id="bak"></g>
    <g id="bakom" filter="url(#boil)"></g>
    <g filter="url(#boil)"><g id="figurer"></g></g>
    <g id="kar"></g>
    <g id="pafat" filter="url(#boil)"></g>
    <g filter="url(#boil)"><g id="figurerFram"></g></g>
    <g id="saker" filter="url(#boil)"></g>
    <g id="fram" filter="url(#boil)"></g>
  </g>
  <g id="ram"></g>
  <g id="gomda" opacity="0"></g>
</svg>
<script src="/verktyg/blinka.js"></script>
<script src="/verktyg/kant.js"></script>
<script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script type="module">
const $ = id => document.getElementById(id);
const A = '/assets/', R = A + 'rekvisita/';
const PLATTA = A + 'bakgrunder/badrummet/badrummet-v1.jpeg', HANDFAT = R + 'handfatet/cut/handfatet.png', BORSTE = R + 'tandborsten/cut/tandborsten.png';
// Inredningen (format/borstasang.md, provbild/badrum-inredning.jpg): [bild, bredd px, höjd px i filen, x, y, bredd i scenen]. Allt sitter högt och långt ut.
// Skåpet sänkt 40 px (Sanna 2026-11-11: "lower cabinet a bit"): det sitter till vänster om ansiktsutsnitten, så underkanten (y 350) syns inte där.
// Skåpet och tavlan sitter 74 px högre än i inredningsbilden (underkant y 308 och 290): annars syns deras underkant i ansiktsutsnitten (överkant y 328).
const INREDNING = [[R + 'vaggskap/cut/vaggskap.png', 945, 623, 190, 152, 300], [R + 'tavlan/cut/tavlan.png', 680, 679, 600, 120, 180],
  [R + 'handduk/cut/handduk-krok.png', 538, 1033, 1618, 330, 145], [R + 'badanka/cut/badanka.png', 716, 661, 1128, 822, 104]];
// Rummet står still i hela filmen (runda 4): handfatet mitt i bild (HX), skåpet och tavlan uppe till vänster (underkant y 310 och 300,
// ovanför ansiktsutsnittens överkant y 328), handduken i huvudhöjd till höger, ankan på golvet intill handfatets pall (bakom raden när alla tre står där). Allt ryms i helbildens utsnitt.
const lagg = (id, h) => $(id).insertAdjacentHTML('beforeend', h);
const kl = (k, a = 0, b = 1) => Math.max(a, Math.min(b, k)), lerp = (a, b, k) => a + (b - a) * k;
const mjuk = k => (k = kl(k), k * k * (3 - 2 * k)), del = (a, b, t) => mjuk((t - a) / (b - a));
const bump = (a, b, t) => (t <= a || t >= b) ? 0 : Math.sin(Math.PI * (t - a) / (b - a));
const f1 = v => v.toFixed(1);

// --- Mått i scenen (1920 × 1080) -----------------------------------------------------------------------------------------
// Samma uppställning som riggarnas provbild (uttryck.html?prov=borsta), 1,385 × större: handfatet 300 px brett som i inredningsbilden.
const SK = 0.69, MARK = 923, HX = 960;              // figurernas skala, fötternas linje, handfatets mitt
const HS = 0.374, HB = 802 * HS, HH = 775 * HS, RIM = MARK + 6 - HH + 177 * HS;   // handfatet (802 × 775, läppens överkant y 177)
const VANTAR = 1450;                                 // där den som senast borstade klart väntar under nästa vers, till höger om handfatet. Bara den
                                                    // nyaste väntar i bild (i vers 3 kaninen; katten är utanför bild): två väntande täckte varandra och handduken
const RAD3 = [540, 960, 1380], FRAM = 28;           // alla tre på rad: katten, kaninen, pandan (öppningen, sista refrängen, dansen, slutet), ett steg framför handfatet
const IN_X = -60;                                   // där en figur står när den kommer in (halva kroppen i bild)
// Utsnitten är storyboardens, omräknade till scenens skala: ansiktet 2,8 × 0,5 / SK, munnen tätt (gapet en tredjedel av bildens bredd).
const ZH = 0.82 / SK, K_HEL = [ZH, 960, 546], Z_ANS = 2.8 * 0.5 / SK;   // EN helbild för hela filmen (runda 4): den större (x 152–1768, y 92–1000)
const K_FAT = [3.3, HX - 25, RIM - 20];   // förspelet: nära på handfatet
const FIG = [{ slug: 'katten-kaj', ljud: 'mjau/mjau-1', nos: [509, 428], oga: '.pupill ellipse', arm: { axel: 130, L: 88 }, tunna: 3 }, { slug: 'kaninen-kanel', ljud: 'kanin-gullig/kanin-gullig-3', nos: [508, 420], oga: '.oga ellipse', arm: { axel: 135, L: 138 } },
  { slug: 'pandan-pim', ljud: 'brum-gullig/brum-gullig-2', nos: [511, 440], arm: { axel: 130, L: 125, ut: [36, 20] }, tunna: 3 }];   // arm: armens vilovinkel och längd i riggen (uttryck.html), ut = den lyfta armens utflyttning

let KAM = K_HEL, TT = 0;
function kamera([z, cx, cy]) {
  const tx = Math.max(1920 - 1920 * z, Math.min(0, 960 - cx * z)), ty = Math.max(1080 - 1080 * z, Math.min(0, 540 - cy * z));
  KAM = [z, tx, ty];
  $('kamera').setAttribute('transform', `translate(${tx.toFixed(2)} ${ty.toFixed(2)}) scale(${z.toFixed(4)})`);
  $('brus').nextElementSibling.setAttribute('scale', (5 / z).toFixed(2));
}
const skarm = ([x, y]) => [KAM[1] + x * KAM[0], KAM[2] + y * KAM[0]];
const iFig = (x, [px, py], L) => [x + (px - 512) * SK, MARK + (py - L.FOTTER) * SK];
const kAns = (F, x = HX) => [Z_ANS, x, MARK - SK * (F.L.FOTTER - 470) - 7];
const kMun = F => [640 / (F.mun.w * SK), ...iFig(HX, [F.mun.cx, F.mun.cy], F.L)];

// --- Badrummet: byggs en gång -----------------------------------------------------------------------------------------------
function badrum() {
  $('platta').innerHTML = `<image href="${PLATTA}" width="1920" height="1080" preserveAspectRatio="xMidYMid slice"/>`;
  $('vagg').innerHTML = INREDNING.map(([bild, w, h, x, y, b]) => `<g><image href="${bild}" x="${x}" y="${y}" width="${b}" height="${f1(b * h / w)}"/></g>`).join('');
  // kranen i bilden maskas bort och ritas om i kod (runda 3, Sanna: "polish faucet"; som i 023, bilden är orörd): en ren, knubbig
  // svanhals i mjukt silverblått med en glansrand och två korallröda rattar. Den ligger i handfatets kantgrupp och får samma tunna kant.
  $('kar').innerHTML = `<defs><mask id="utan-kran" maskUnits="userSpaceOnUse" x="-50" y="-50" width="900" height="900"><rect x="-50" y="-50" width="900" height="900" fill="#fff"/><rect x="560" y="-50" width="300" height="218" fill="#000"/></mask></defs>
    <g transform="translate(${f1(HX - HB / 2 + 12)} ${f1(MARK + 6 - HH)}) scale(${HS})"><image href="${HANDFAT}" width="802" height="775" mask="url(#utan-kran)"/>${KRANBILD}</g>`;
}
const KRAN_D = 'M698 168 L698 72 C698 30 672 14 646 14 C619 14 600 31 600 58 L600 72';   // i handfatsbildens pixlar (läppen y 177)
const KRANBILD = `<g id="kran"><rect x="664" y="156" width="68" height="24" rx="11" fill="#a9bfcf"/>
  <path d="${KRAN_D}" fill="none" stroke="#9fb6c8" stroke-width="40" stroke-linecap="round"/>
  <path d="${KRAN_D}" fill="none" stroke="#d6e4ee" stroke-width="31" stroke-linecap="round"/>
  <path d="M687 158 L687 74 C687 42 668 27 646 26" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  <rect x="585" y="64" width="30" height="20" rx="7" fill="#9fb6c8"/><rect x="589" y="67" width="22" height="13" rx="5" fill="#c3d5e2"/>
  ${[[660, 150], [736, 150]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="24" fill="#e0705a"/><circle cx="${x}" cy="${y}" r="20" fill="#f08e76"/><circle cx="${x - 8}" cy="${y - 8}" r="6" fill="#fff" opacity="0.75"/>`).join('')}</g>`;
// Tandborsten ligger på handfatets läpp mellan verserna (huvudet åt vänster, mot tandkrämen) och tandkrämstuben står vid läppens
// vänstra ände (runda 3: bort från kranen, större: 85 px hög = halva borstens längd). Tuben är rekvisita/tandkramen.md (386 × 741,
// står på korken); korken är samma bild klippt vid y 594, så att den kan lossna. rand 0–1 = randen av tandkräm på borsten (i kod).
const BORST_FARG = ['', 'hue-rotate(156deg) saturate(1.1)', 'hue-rotate(-128deg) saturate(1.25) brightness(1.08)'], MINT = ['#8fe3d2', '#f6b4cf', '#f7e08a'];   // katten, kaninen, pandan
const BS = 0.28 * SK, TUB = R + 'tandkramen/cut/tandkramen.png', TUB_S = 85 / 741, TUB_X = HX - 100, BORST_X = HX + 10, KORK_Y = 594;
const HUVUD_X = BORST_X + (115 - 438) * BS, BORST_TOPP = RIM + 3 + (13 - 212) * BS;
const K_KLAM = [5.6, HUVUD_X - 4, BORST_TOPP - 18];      // tandkrämen på borsten: kameran går tätt på borsthuvudet (Sanna 2026-11-12: "more closeup on toothpaste applied to brush")
const BORST_PLATS = [[0, 0], [-22, -12], [-44, -24]];      // [x, y] i px: kaninens och pandans ligger lite högre och längre bak på läppen
// fran = första borsten som ligger kvar (de som redan tagits är borta); rand = randen av tandkräm 0–1 (ett tal eller en per borste)
const borstePaFat = (v = 0, dy = 0, rand = 1, fran = 0) => lagg('pafat', [2, 1, 0].filter(i => Array.isArray(fran) ? fran[i] : i >= fran).map(i => { const r = Array.isArray(rand) ? rand[i] : rand, [bx, by] = BORST_PLATS[i];
  return `<g transform="translate(${BORST_X + bx} ${f1(RIM + 3 + dy + by)}) rotate(${f1(v)}) scale(${BS}) translate(-438 -212)"><g style="filter:${BORST_FARG[i] || 'none'}"><image href="${BORSTE}" width="877" height="238"/></g>
  ${r > 0.01 ? `<path d="M48 4 q24 -22 48 0 t48 0 t48 0" pathLength="1" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" stroke-dasharray="${r.toFixed(3)} 2"/>
  <path d="M48 4 q24 -22 48 0 t48 0 t48 0" pathLength="1" fill="none" stroke="${MINT[i]}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${r.toFixed(3)} 2"/>` : ''}</g>`; }).join(''));
// Tandborstmuggen på ett litet bord bredvid handfatet (Sanna 2026-11-12: "need a cup to store all toothbrushes more neat"): pallen som sidobord,
// muggen ovanpå (bild från Flow, rekvisita/tandborstmuggen.md) och tre borstar i den, en färg var. Allt ritas i lagret 'bakom' (bakom djuren) och
// tonas ut med rummet när discot tar över. Borstarna står bakom muggens framsida, så att bara huvud och skaft sticker upp.
const PALL = R + 'pall/cut/pall.png', MUGG = R + 'tandborstmuggen/cut/tandborstmuggen.png';
const BORD_X = 405, BORD_W = 320, BORD_H = BORD_W * 551 / 781, BORD_TOPP = MARK + 6 - BORD_H;      // pallens höga del är den högra (ca 55 % av bredden)
const KOPP_X = BORD_X + 0.73 * BORD_W, KOPP_B = BORD_TOPP + 6, KOPP_W = 150, KOPP_H = 100;          // muggens mitt och underkant, bredd och höjd
const KOPP_LUT = [-11, 0, 11], KOPP_DX = [-42, 0, 42], BL = 877 * BS;                               // borstarnas lutning, plats i muggen och längd
const KOPP_PLATS = i => { const l = KOPP_LUT[i] * Math.PI / 180, bx = KOPP_X + KOPP_DX[i], by = KOPP_B - 16; return [bx + 0.5 * BL * Math.sin(l), by - 0.5 * BL * Math.cos(l), 90 + KOPP_LUT[i]]; };   // [x, y, vinkel] för borstens mitt: huvudet uppåt
const LIGG_PLATS = i => [BORST_X + BORST_PLATS[i][0], RIM + 3 + BORST_PLATS[i][1] + (119 - 212) * BS, 0];   // där den ligger på läppen: huvudet åt vänster
const borstBild = (i, x, y, rot, s = 1) => `<g transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(rot)}) scale(${(BS * s).toFixed(4)}) translate(-438 -119)"><g style="filter:${BORST_FARG[i] || 'none'}"><image href="${BORSTE}" width="877" height="238"/></g></g>`;
const bord = (inne, opac = 1) => opac > 0.01 && lagg('bakom', `<g opacity="${opac.toFixed(2)}"><image href="${PALL}" x="${BORD_X}" y="${f1(BORD_TOPP)}" width="${BORD_W}" height="${f1(BORD_H)}"/>
  ${[0, 1, 2].filter(i => inne[i]).map(i => borstBild(i, ...KOPP_PLATS(i))).join('')}
  <image href="${MUGG}" x="${f1(KOPP_X - KOPP_W / 2)}" y="${f1(KOPP_B - KOPP_H)}" width="${KOPP_W}" height="${KOPP_H}" preserveAspectRatio="none"/></g>`);
// flygturen: en mjuk båge med glitter efter borsten; a, b = [x, y, vinkel] (vinkeln tar den kortaste vägen)
const bage = (a, b, q) => { const e = mjuk(q), dv = ((b[2] - a[2] + 540) % 360) - 180; return [lerp(a[0], b[0], e), lerp(a[1], b[1], e) - 70 * Math.sin(Math.PI * q), a[2] + dv * e]; };
const glitter = (a, b, q, i) => { let h = ''; for (let k = 1; k <= 7; k++) { const qq = q - k * 0.06; if (qq <= 0) continue; const [x, y] = bage(a, b, qq), g = (1 - k / 8) * Math.min(1, 5 * q, 5 * (1 - q) + 0.4);
  h += gnistaVit(x + 11 * Math.sin(k * 2.1 + i), y + 11 * Math.cos(k * 1.7 + i), (13 + 7 * (k % 2)) * g); } return h; };
// var borsten i handen hamnar: mitt och vinkel ur riggens .borste (för flygturen och glittret)
const handMal = n => { const e = FIG[n].G.querySelector('.borste'), r = e.getBoundingClientRect(), inv = $('kamera').getScreenCTM().inverse(), c = new DOMPoint((r.left + r.right) / 2, (r.top + r.bottom) / 2).matrixTransform(inv), m = inv.multiply(e.getScreenCTM());
  return [c.x, c.y, Math.atan2(m.b, m.a) * 180 / Math.PI]; };
// när borsten i handen syns över handfatets kant (u sekunder in i "upp"; riggens borste räknas som "på" redan från u 0 men är då gömd bakom handfatet,
// så tiden är mätt i bilderna, 1,1–1,4 s för alla tre): där byter flygturen mot borsten i handen
const swapU = () => 1.25;
const FLYG_UT = 0.6;                                          // flygturen från muggen till handen (s)
const koppInne = (i, t) => { const a = T['00'], b = T[(i + 1) + '2']; return t >= a.s + FLYG_IN[i] * a.d + FLYG_D && t < b.s + b.d - 2.3 + swapU(i) - FLYG_UT; };
// En tub i lagret `lager`: hel (x, y = där korken står) eller öppen (kork = [x, y, v] där korken är; x, y = tubens öppning, v = lutning kring den,
// sx = hur mycket den kläms). I den öppna tuben syns en liten pip där korken satt.
const tubBild = (x, y, { v = 0, sx = 1, kork = null } = {}, lager = 'pafat') => lagg(lager, kork
  ? `<g transform="translate(${f1(kork[0])} ${f1(kork[1])}) rotate(${f1(kork[2] || 0)}) scale(${TUB_S}) translate(-193 -738)"><g clip-path="url(#tubkork)"><image href="${TUB}" width="386" height="741"/></g></g>
     <g transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(v)}) scale(${(TUB_S * sx).toFixed(4)} ${TUB_S}) translate(-193 -${KORK_Y + 44})"><rect x="152" y="${KORK_Y - 8}" width="82" height="52" rx="14" fill="#efe6d2"/><g clip-path="url(#tubkropp)"><image href="${TUB}" width="386" height="741"/></g></g>`
  : `<g transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(v)}) scale(${TUB_S}) translate(-193 -738)"><image href="${TUB}" width="386" height="741"/></g>`);
const tuben = ({ dy = 0, v = 0 } = {}) => tubBild(TUB_X, RIM + 4 + dy, { v });      // tuben på sin plats på handfatet
const hopp = (tl, t0, h, d = 0.5) => { const u = (tl - t0) / d; return u > 0 && u < 1 ? -h * 4 * u * (1 - u) : 0; };   // ett mjukt hopp (sakerna, px i scenen)
// figurens mjuka hopp (px i riggens ruta): hukar lite, hoppar, landar mjukt
const hoppa = (tl, t0, h = 45, d = 0.65) => ({ lyft: hopp(tl, t0, h, d), strack: -0.05 * bump(t0 - 0.18, t0, tl) + 0.03 * bump(t0, t0 + d, tl) - 0.05 * bump(t0 + d, t0 + d + 0.28, tl) });
// krit-gnistor: en fyruddig stjärna (ur 023) som växer fram och krymper, vrids inte
const stjarna = (x, y, r) => r > 0.5 ? `<path transform="translate(${f1(x)} ${f1(y)}) scale(${r.toFixed(2)})" d="M0 -1 L.2 -.2 L1 0 L.2 .2 L0 1 L-.2 .2 L-1 0 L-.2 -.2Z" fill="#fff6c8" stroke="#e6b422" stroke-width=".07" stroke-linejoin="round"/>` : '';
// vita gnistor med svagt blå kant (tänderna och "Rena tänder!"): de läses som "rent" på alla tre figurerna
const gnistaVit = (x, y, r) => r > 0.5 ? `<path transform="translate(${f1(x)} ${f1(y)}) scale(${r.toFixed(2)})" d="M0 -1 L.2 -.2 L1 0 L.2 .2 L0 1 L-.2 .2 L-1 0 L-.2 -.2Z" fill="#fff" stroke="#5bb8ee" stroke-width=".15" stroke-linejoin="round" paint-order="stroke"/>` : '';
const skur = (cx, cy, R, tl, n = 7, r = 36) => lagg('fram', Array.from({ length: n }, (_, i) => { const a = (i / n) * 2 * Math.PI - 1.2, rr = R * (0.75 + 0.3 * ((i * 5) % 3) / 2);
  return gnistaVit(cx + rr * Math.cos(a), cy + 0.7 * rr * Math.sin(a), r * (0.6 + 0.4 * ((i * 3) % 2)) * bump(0.07 * i, 0.07 * i + 0.8, tl)); }).join(''));

// --- Skumklicken på kaninens nos (ur 023: tuss och bubbla) och kritirisen ---------------------------------------------------------
const tuss = (x, y, r, v = 0) => [[0, 0, 1], [-0.8, 0.25, 0.7], [0.8, 0.2, 0.75], [-0.35, -0.55, 0.65], [0.4, -0.5, 0.6]]
  .map(([dx, dy, k]) => { const c = Math.cos(v), s = Math.sin(v), ex = dx * c - dy * s, ey = dx * s + dy * c;
    return `<circle cx="${f1(x + ex * r)}" cy="${f1(y + ey * r)}" r="${f1(k * r)}" fill="#fff" stroke="#cfe6ee" stroke-width="${f1(0.08 * r)}" paint-order="stroke"/>`; }).join('');
const sprack = (x, y, r, u) => u > 0 && u < 1 && lagg('fram', Array.from({ length: 9 }, (_, i) => { const a = i / 9 * 2 * Math.PI, rr = r * (1 + 1.2 * u);
  return `<circle cx="${f1(x + rr * Math.cos(a))}" cy="${f1(y + rr * Math.sin(a))}" r="${f1(0.28 * r * (1 - u) + 1)}" fill="#fff" stroke="#cfe6ee" stroke-width="1.5" opacity="${f1(1 - u)}"/>`; }).join(''));
function kritiris(r, [cx, cy], t) {
  if (r >= 1400) return;
  const ring = 'M' + Array.from({ length: 145 }, (_, j) => { const a = j / 144 * 2 * Math.PI, rr = r * (1 + 0.07 * Math.sin(9 * a + t * 0.8));
    return `${f1(cx + rr * Math.cos(a))} ${f1(cy + rr * Math.sin(a))}`; }).join('L') + 'Z';
  lagg('ram', `<path d="M-50 -50H1970V1130H-50Z ${r > 1 ? ring : ''}" fill="#101010" fill-rule="evenodd"/>
    ${r > 1 ? `<path d="${ring}" fill="none" stroke="#fff8e0" stroke-width="${Math.min(14, r / 4)}" stroke-linejoin="round" filter="url(#boil)"/>` : ''}`);
}

// --- Figurerna ---------------------------------------------------------------------------------------------------------------

    // kanter så att den syns på vitt), sedan två små skarpa vita gnistor som slår ut och tonar bort på var sin tand.
    const { n, rad, u } = st.glans, inv = $('kamera').getScreenCTM().inverse(), tander = [...FIG[n].G.querySelectorAll('.tand')].slice(rad ? 4 : 0, rad ? 8 : 4).map(e => e.firstElementChild);
    const lada = tander.map(e => { const b = e.getBoundingClientRect(), a = new DOMPoint(b.left, b.top).matrixTransform(inv), c = new DOMPoint(b.right, b.bottom).matrixTransform(inv); return [a.x, a.y, c.x, c.y]; });

    const sv = kl(u / 0.85), bw = 0.375 * w, lut = 0.45 * h, x = x0 - bw - lut + (w + bw + lut) * sv, o = Math.min(1, 4 * Math.sin(Math.PI * sv));   // glimten är en och en halv tand bred och går över hela raden på ca 0,5 s
    const klipp = tander.map(e => { const m = inv.multiply(e.getScreenCTM()); return `<path d="${e.getAttribute('d')}" transform="matrix(${m.a} ${m.b} ${m.c} ${m.d} ${m.e} ${m.f})"/>`; }).join('');

    const face = (r, ox, ky, mw, cx) => `<g transform="scale(${k.toFixed(3)})">${[-1, 1].map(sd => `<circle cx="${sd * ox}" cy="0" r="${r}" fill="#2a1d1a"/><circle cx="${sd * ox - 0.3 * r}" cy="${-0.35 * r}" r="${0.36 * r}" fill="#fff"/>
      <ellipse cx="${sd * cx}" cy="${ky}" rx="${0.95 * r}" ry="${0.6 * r}" fill="#f7a3ad" opacity="0.85"/>`).join('')}

      : `<g transform="translate(${f1(x)} ${f1(y + dy)}) rotate(${f1(98 + 0.7 * v)}) scale(${(BORSTD * m).toFixed(4)}) translate(-850 -152)">${[0, 1].map(j => { const ar = j ? ac[1] : ac[0], rr = ar * Math.PI / 180, x0 = 520, y0 = j ? 52 : 186, sg = j ? -1 : 1;
      return `<path d="M${x0} ${y0} L${f1(x0 + 250 * Math.cos(rr))} ${f1(y0 + sg * 250 * Math.sin(rr))}" stroke="${BRAK[farg]}" stroke-width="52" stroke-linecap="round"/><circle cx="${f1(x0 + 250 * Math.cos(rr))}" cy="${f1(y0 + sg * 250 * Math.sin(rr))}" r="42" fill="#fff6e8"/>`; }).join('')}<g style="filter:${BORST_FARG[farg] || 'none'}"><image href="${BORSTE}" width="877" height="238"/></g><g transform="translate(600 153) rotate(${f1(-98 - 0.7 * v)})">${face(14, 28, 20, 11, 46)}</g></g>`); }
  // Discot (ur 013:s disco(), omfärgat till turkost i kod, plattan skärpt): plattan med rutigt golv, mjuka ljuskäglor från kulan,
  // ljusfläckar på golvet och kulan som gungar. Det ritas i skärmens mått (gruppen backar kamerans zoom), så att figurerna kan stå
  // kvar i badrummets helbild medan rummet byts. st.disco = { s: tid, k: 0–1 plattan tonas in över badrummet, mork: 0–1 badrummets
  // ljus dämpas, kula: 0–1 kulan sänks ner, kaglor: 0–1 ljuskäglorna }.

  const kagla = (vv, x0, y0) => { const r = vv * Math.PI / 180, LL = 1300, b = 0.16; return `M${x0} ${y0} L${f1(x0 + LL * Math.sin(r - b))} ${f1(y0 + LL * Math.cos(r - b))} L${f1(x0 + LL * Math.sin(r + b))} ${f1(y0 + LL * Math.cos(r + b))}Z`; };

// --- Ljud: sången ligger under hela scenen (window.SANG); här läggs djurens ljud, borstljudet, glansen och ploppet lågt under ------
const E = 'assets/ljud/effekter/';
function ljud() {
  const ut = [], skrubb = (fran, till) => ut.push({ t: fran, fil: E + 'skrubb/skrubb-1.m4a', vol: 1.6, langd: till - fran - 0.2, loop: true, fadeIn: 0.2, fade: 0.3 });
  [['1', 0], ['2', 1], ['3', 2]].forEach(([a, n]) => {
    ut.push({ t: T[a + '2'].s + LJUD_IN, fil: E + FIG[n].ljud + '.m4a', vol: [8, 1, 1][n], langd: 1.9, fade: 0.3 });                      // kattens mjau, kaninens fniss (kanin-gullig-3), pandans brum (björnens brum-gullig-2 tills pandan får egna ljud). mjau-1 är en tyst fil (topp −22 dBFS), därför vol 8
    skrubb(T[a + '3'].s, T[a + 'e'].s); skrubb(T[a + '3b'].s, T[a + '6'].s);                                                         // borstljud under båda varven
    ut.push({ t: T[a + '6'].s + GLANS[n], fil: E + 'tindra/tindra-3.m4a', vol: 1.2 });                                                // glans på "Hurra!"
    ['4b', '5b'].forEach(k => ut.push({ t: T[a + k].s + T[a + k].d - 0.6, fil: E + 'tindra/tindra-4.m4a', vol: 0.8 }));              // glanssvepet över raden (andra varvet)
  });
  skrubb(T['50'].s, T['53'].s);                                                                                                    // sista refrängen: alla borstar
  ut.push({ t: T['53'].s + GLANS[3], fil: E + 'tindra/tindra-3.m4a', vol: 1.2 });
  ut.push({ t: T['26'].s, fil: E + 'plopp/plopp-1.m4a', vol: 0.7 });                                                               // skumklicken spricker
  const I = T['00'].d;                                                                                                            // förspelets steg (STEG), som delar av radens längd
  ut.push({ t: STEG.lyft[0] * I, fil: E + 'hopp-mjuk/hopp-mjuk-1.m4a', vol: 0.5 });                                                // tuben lyfts
  ut.push({ t: STEG.kork[0] * I, fil: E + 'plopp/plopp-1.m4a', vol: 1.0 });                                                        // korken lossnar
  [0, 1, 2].forEach(i => ut.push({ t: (PASS[i] + 0.42 * (PASS[i + 1] - PASS[i])) * I + 0.1, fil: E + 'plupp/plupp-1.m4a', vol: 0.8 }));   // tandkrämen kläms ut, en gång per borste
  ut.push({ t: STEG.pa[1] * I - 0.05, fil: E + 'plopp/plopp-1.m4a', vol: 0.6 });                                                   // korken på igen
  FLYG_IN.forEach(f => { ut.push({ t: f * I, fil: E + 'tindra/tindra-4.m4a', vol: 0.8 }); ut.push({ t: f * I + FLYG_D - 0.05, fil: E + 'hopp-mjuk/hopp-mjuk-1.m4a', vol: 0.5 }); });   // borstarna flyger ner i muggen
  [0, 1, 2].forEach(n => { const r = T[(n + 1) + '2']; ut.push({ t: r.s + r.d - 2.3 + swapU(n) - FLYG_UT, fil: E + 'tindra/tindra-3.m4a', vol: 1.0 }); });   // och ur den till handen
  // gnistor: öppningens hopp, dansmellanspelet, "Hej då!", och de tre solona i dansslutet
  // gnistor: öppningens hopp, dansmellanspelet, "Hej då!", och lågt på slaget i discot (armarna upp, och de tre solona)
  [T['60'].s + 1.2, T['43'].s + 0.4].forEach(t => ut.push({ t, fil: E + 'tindra/tindra-4.m4a', vol: 0.9 }));
  ut.push({ t: T['43'].s + 1.9, fil: E + 'tindra/tindra-3.m4a', vol: 0.7 });                                                       // discokulan är nere
  [1, 2, 3, 4, 5, 6, 7].forEach(rad => ut.push({ t: T['44'].s + rad * 4 * TAKT, fil: E + 'tindra/tindra-4.m4a', vol: 0.5 }));                                // lågt, när ett solo börjar
  return ut;
}

// Tunnare vita kanter (runda 4: "less thick white rim"). Regeln är 3 px + 1 % av sakens höjd i bild. kant.js lägger alltid 3 px
// ovanpå den inbakade kanten, och den inbakade är tjockare än 1 % på katten och pandan (10 px i en 620–650 px hög kropp) och
// på handduken. tunna(el, r) skalar bort r enheter av den inbakade kanten (i elementets egna mått) innan kant.js lägger sin.
let tunnNr = 0;
function tunna(el, r) { const id = `tunn-${tunnNr++}`;
  document.querySelector('defs').insertAdjacentHTML('beforeend', `<filter id="${id}" x="-0.05" y="-0.05" width="1.1" height="1.1"><feMorphology in="SourceAlpha" operator="erode" radius="${r}" result="e"/><feComposite in="SourceGraphic" in2="e" operator="in"/></filter>`);
  el.setAttribute('filter', `url(#${id})`); }

window.DURATION = DURATION;

window.ready = (async () => {
  for (const [n, F] of FIG.entries()) {

    const b = F.G.querySelector('.mun').getBoundingClientRect(), s = $('kamera').getBoundingClientRect(), inv = $('kamera').getScreenCTM().inverse();
    const q = new DOMPoint(b.x + b.width / 2, b.y + b.height / 2).matrixTransform(inv), w = b.width * inv.a / SK;
    F.mun = { cx: 512 + (q.x - HX) / SK, cy: F.L.FOTTER + (q.y - MARK) / SK, w, h: b.height * inv.a / SK }; }
  tunna($('vagg').children[2], 2);       // handdukens inbakade kant är 20 px i filen (5,6 px i bild): 2 px bort
  [...$('vagg').children].forEach(g => window.kant?.lagg(g)); window.kant?.lagg($('kar')); window.kant?.lagg($('pafat')); window.kant?.lagg($('bakom')); window.kant?.lagg($('saker'));
  document.querySelector('defs').insertAdjacentHTML('beforeend', `<clipPath id="tubkropp"><rect x="-20" y="-20" width="426" height="${KORK_Y + 20}"/></clipPath><clipPath id="tubkork"><rect x="-20" y="${KORK_Y}" width="426" height="170"/></clipPath>`);
  await Promise.all([PLATTA, HANDFAT, BORSTE, TUB, DISCO, KULA, ...INREDNING.map(i => i[0])].map(u => new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = u; })));
  window.LJUD = ljud();
  rita(Number(new URLSearchParams(location.search).get('t') || 0));
  return true;
})();
const start = performance.now();
(function loop() { if (!window.stilla && FIG[2].L) rita(((performance.now() - start) / 1000) % DURATION); requestAnimationFrame(loop); })();
