<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>030 badet</title>
<style>html, body { margin:0; background:#000; overflow:hidden; } svg { width:100vw; height:100vh; display:block; }</style>
</head>
<body>
<!-- Avsnitt 030 Borsta, borsta (gulliga djur): hela sången i en kodscen, en plats (badrummet). Förlaga: 023 scener/badet (kopierad och
     bantad). Ett läge per rad i ../../storyboard/storyboard.md: S['id'] = (tl, d) => ({ kam, figs, … }), tl = sekunder in i raden.
     TID: scenens t = sångtid (t 0 = sångens 0:00.0). Inget intro än: när introt är bestämt blir avsnittstid = sångtid + introts längd,
     och bara den summan ändras (scenen och ../sang.m4a hänger ihop som de är, sången klipps aldrig).
     Rendera: node ../render.mjs badet --snabb (från scener/). Stillbilder: node ../render.mjs badet 12 40 …
     Figurerna är v2-riggarna live ur uttryck.html (v2-rigg.js + rigg-motor.js): katten, kaninen, pandan. Borstningen är riggens
     L.ROR.borsta('upp' | 'skrubba' | 'uppe' | 'nere' | 'klar', tl, d). Bara hårda klipp mellan tre utsnitt: helbild, ansiktet, munnen.
     I kod: tandborsten på handfatet, skumklicken på kaninens nos, kritirisen. -->
<svg viewBox="0 0 1920 1080">
  <defs>
    <filter id="boil" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="5000">
      <feTurbulence id="brus" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
      <feDisplacementMap in="SourceGraphic" scale="5"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="#FAF8F2"/>
  <g id="kamera">
    <g id="platta"></g>
    <g id="vagg"></g>
    <g id="bak"></g>
    <g filter="url(#boil)"><g id="figurer"></g></g>
    <g id="kar"></g>
    <g id="pafat" filter="url(#boil)"></g>
    <g id="fram" filter="url(#boil)"></g>
  </g>
  <g id="ram"></g>
  <g id="gomda" opacity="0"></g>
</svg>
<script src="/verktyg/blinka.js"></script>
<script src="/verktyg/kant.js"></script>
<script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script type="module">
const $ = id => document.getElementById(id);
const A = '/assets/', R = A + 'rekvisita/';
const PLATTA = A + 'bakgrunder/badrummet/badrummet-v1.jpeg', HANDFAT = R + 'handfatet/cut/handfatet.png', BORSTE = R + 'tandborsten/cut/tandborsten.png';
// Inredningen (format/borstasang.md, provbild/badrum-inredning.jpg): [bild, bredd px, höjd px i filen, x, y, bredd i scenen]. Allt sitter högt och långt ut.
// Skåpet och tavlan sitter 74 px högre än i inredningsbilden (underkant y 308 och 290): annars syns deras underkant i ansiktsutsnitten (överkant y 328).
const INREDNING = [[R + 'vaggskap/cut/vaggskap.png', 945, 623, 158, 78, 348], [R + 'tavlan/cut/tavlan.png', 680, 679, 585, 98, 192],
  [R + 'handduk/cut/handduk-krok.png', 538, 1033, 1500, 208, 190], [R + 'badanka/cut/badanka.png', 716, 661, 1568, 768, 112]];
const lagg = (id, h) => $(id).insertAdjacentHTML('beforeend', h);
const kl = (k, a = 0, b = 1) => Math.max(a, Math.min(b, k)), lerp = (a, b, k) => a + (b - a) * k;
const mjuk = k => (k = kl(k), k * k * (3 - 2 * k)), del = (a, b, t) => mjuk((t - a) / (b - a));
const bump = (a, b, t) => (t <= a || t >= b) ? 0 : Math.sin(Math.PI * (t - a) / (b - a));
const f1 = v => v.toFixed(1);

// --- Mått i scenen (1920 × 1080) -----------------------------------------------------------------------------------------
// Samma uppställning som riggarnas provbild (uttryck.html?prov=borsta), 1,385 × större: handfatet 300 px brett som i inredningsbilden.
const SK = 0.69, MARK = 923, HX = 960;              // figurernas skala, fötternas linje, handfatets mitt
const HS = 0.374, HB = 802 * HS, HH = 775 * HS, RIM = MARK + 6 - HH + 177 * HS;   // handfatet (802 × 775, läppens överkant y 177)
const VANSTER = [[230], [170, 500]];                // där de som har borstat klart står under nästa vers
const RAD3 = [520, 960, 1400];                      // slutet: katten, kaninen, pandan på rad (kaninen bakom handfatet)
const IN_X = -60;                                   // där en figur står när den kommer in (halva kroppen i bild)
// Utsnitten är storyboardens, omräknade till scenens skala: ansiktet 2,8 × 0,5 / SK, munnen tätt (gapet en tredjedel av bildens bredd).
const K_HEL = [1, 960, 540], Z_ANS = 2.8 * 0.5 / SK;
const FIG = [{ slug: 'katten-kaj', ljud: 'mjau/mjau-1', nos: [509, 428] }, { slug: 'kaninen-kanel', ljud: 'kanin-gullig/kanin-gullig-3', nos: [508, 420] },
  { slug: 'pandan-pim', ljud: 'brum-gullig/brum-gullig-2', nos: [511, 440] }];

let KAM = K_HEL, TT = 0;
function kamera([z, cx, cy]) {
  const tx = Math.max(1920 - 1920 * z, Math.min(0, 960 - cx * z)), ty = Math.max(1080 - 1080 * z, Math.min(0, 540 - cy * z));
  KAM = [z, tx, ty];
  $('kamera').setAttribute('transform', `translate(${tx.toFixed(2)} ${ty.toFixed(2)}) scale(${z.toFixed(4)})`);
  $('brus').nextElementSibling.setAttribute('scale', (5 / z).toFixed(2));
}
const skarm = ([x, y]) => [KAM[1] + x * KAM[0], KAM[2] + y * KAM[0]];
const iFig = (x, [px, py], L) => [x + (px - 512) * SK, MARK + (py - L.FOTTER) * SK];
const kAns = (F, x = HX) => [Z_ANS, x, MARK - SK * (F.L.FOTTER - 470) - 7];
const kMun = F => [640 / (F.mun.w * SK), ...iFig(HX, [F.mun.cx, F.mun.cy], F.L)];

// --- Badrummet: byggs en gång -----------------------------------------------------------------------------------------------
function badrum() {
  $('platta').innerHTML = `<image href="${PLATTA}" width="1920" height="1080" preserveAspectRatio="xMidYMid slice"/>`;
  $('vagg').innerHTML = INREDNING.map(([bild, w, h, x, y, b]) => `<g><image href="${bild}" x="${x}" y="${y}" width="${b}" height="${f1(b * h / w)}"/></g>`).join('');
  $('kar').innerHTML = `<image href="${HANDFAT}" x="${f1(HX - HB / 2 + 12)}" y="${f1(MARK + 6 - HH)}" width="${f1(HB)}" height="${f1(HH)}"/>`;
}
// tandborsten ligger på handfatets läpp mellan verserna (helbilderna); gung = lutningen i grader
const BS = 0.28 * SK;
const borstePaFat = gung => lagg('pafat', `<g transform="translate(${HX - 62} ${f1(RIM + 3)}) rotate(${f1(gung)}) scale(${BS}) translate(-470 -212)"><image href="${BORSTE}" width="877" height="238"/></g>`);

// --- Skumklicken på kaninens nos (ur 023: tuss och bubbla) och kritirisen ---------------------------------------------------------
const tuss = (x, y, r, v = 0) => [[0, 0, 1], [-0.8, 0.25, 0.7], [0.8, 0.2, 0.75], [-0.35, -0.55, 0.65], [0.4, -0.5, 0.6]]
  .map(([dx, dy, k]) => { const c = Math.cos(v), s = Math.sin(v), ex = dx * c - dy * s, ey = dx * s + dy * c;
    return `<circle cx="${f1(x + ex * r)}" cy="${f1(y + ey * r)}" r="${f1(k * r)}" fill="#fff" stroke="#cfe6ee" stroke-width="${f1(0.08 * r)}" paint-order="stroke"/>`; }).join('');
const sprack = (x, y, r, u) => u > 0 && u < 1 && lagg('fram', Array.from({ length: 9 }, (_, i) => { const a = i / 9 * 2 * Math.PI, rr = r * (1 + 1.2 * u);
  return `<circle cx="${f1(x + rr * Math.cos(a))}" cy="${f1(y + rr * Math.sin(a))}" r="${f1(0.28 * r * (1 - u) + 1)}" fill="#fff" stroke="#cfe6ee" stroke-width="1.5" opacity="${f1(1 - u)}"/>`; }).join(''));
function kritiris(r, [cx, cy], t) {
  if (r >= 1400) return;
  const ring = 'M' + Array.from({ length: 145 }, (_, j) => { const a = j / 144 * 2 * Math.PI, rr = r * (1 + 0.07 * Math.sin(9 * a + t * 0.8));
    return `${f1(cx + rr * Math.cos(a))} ${f1(cy + rr * Math.sin(a))}`; }).join('L') + 'Z';
  lagg('ram', `<path d="M-50 -50H1970V1130H-50Z ${r > 1 ? ring : ''}" fill="#101010" fill-rule="evenodd"/>
    ${r > 1 ? `<path d="${ring}" fill="none" stroke="#fff8e0" stroke-width="${Math.min(14, r / 4)}" stroke-linejoin="round" filter="url(#boil)"/>` : ''}`);
}

// --- Figurerna ---------------------------------------------------------------------------------------------------------------
// En figur i ett läge: { n: 0 katten | 1 kaninen | 2 pandan, x, f: ansikte, p: pose, vid: står bakom handfatet (skuggan dold), blink: false }
const ANS = (n, namn, o = {}) => ({ ...FIG[n].L.blanda('neutral', namn, 1), ...o });
const POS = (n, o = {}) => ({ ...FIG[n].L.POSE0, ...o });
const GAP = (n, vit = 0) => ({ ...FIG[n].L.param('gapar'), tander: Array(8).fill(vit) });           // gapet, matta (0) eller vita (1) tänder
const LER = n => ({ ...FIG[n].L.param('flinar'), tander: Array(8).fill(1) });                        // tandleendet, alla vita
const andas = (p, t, n) => ({ ...p, strack: (p.strack || 0) + 0.012 * (1 - Math.cos(2 * Math.PI * (t + n) / 3.6)) / 2 });
// vinkar: armen bakom kroppen, snett ut förbi kanten (023)
const vink = (tl, v) => ({ luta: 3 * v, armar: [0, v * (86 + 14 * Math.sin(2 * Math.PI * 1.1 * tl))] });
function figur({ n, x, f, p, vid = false, blink = true }, t) {
  const F = FIG[n], G = F.G;
  $('figurer').appendChild(G);
  G.setAttribute('transform', `translate(${f1(x)} ${MARK}) scale(${SK}) translate(-512 ${-F.L.FOTTER})`);
  F.L.rita(G, blink ? F.blinka(f, t) : f, andas(p, t, n));
  if (vid) G.querySelector('.skugga').setAttribute('opacity', 0);
}

// --- Raderna: id och sångtid ur storyboarden (tider med ~ är inte hörda än) -----------------------------------------------------
const TIDER = [['00', 0], ['01', 4.8], ['02', 9.7], ['10', 14.7], ['11', 18.8], ['12', 20.9], ['13', 27.1], ['14', 29.7], ['15', 32.1], ['16', 34.5],
  ['20', 37.3], ['21', 40.8], ['22', 42.9], ['23', 49.1], ['24', 51.6], ['25', 54.1], ['26', 56.5],
  ['30', 59.3], ['31', 62.5], ['32', 64.8], ['33', 71.1], ['34', 73.7], ['35', 76.2], ['36', 78.6],
  ['40', 80.9], ['41', 82.3], ['42a', 84.9], ['42b', 85.9], ['42c', 86.5], ['43', 87.1], ['44', 90.9]];
const DURATION = 100.8;                              // sångens längd
const RAD = TIDER.map(([id, s], i) => ({ id, s, d: (TIDER[i + 1]?.[1] ?? DURATION) - s })), T = Object.fromEntries(RAD.map(r => [r.id, r]));
const GLANS = [1.1, 1.2, 1.3];                       // glansstjärnan in i raden "Rena tänder!": 0:35.6, 0:57.7, 1:19.9
const LJUD_IN = 0.7;                                 // djurets ljud in i mellanspelet (rad 12, 22, 32)

const S = {};
const gung = tl => 3 * Math.sin(2 * Math.PI * tl / 2.5);          // borsten gungar lugnt, en gång per takt
S['00'] = () => ({ kam: K_HEL, figs: [], pafat: 0 });
S['01'] = tl => ({ kam: K_HEL, figs: [], pafat: gung(tl) * del(0, 0.6, tl) });
// de tre tittar fram vid vänsterkanten, en i taget: kaninen, pandan och sist katten, som står kvar (den kommer in i rad 10)
S['02'] = tl => ({ kam: K_HEL, pafat: gung(tl + 4.9), figs: [[1, 0.3], [2, 1.8], [0, 3.4]].map(([n, t0]) => {
  const k = del(t0, t0 + 0.6, tl) - (n ? del(t0 + 1.1, t0 + 1.6, tl) : 0);
  return { n, x: lerp(-270, IN_X, k), f: ANS(n, 'nyfiken', { titt: [9, 0] }), p: POS(n, { luta: 5 * k, rikt: 0.5 * k }) }; }) });

// En vers och en refräng för figur n. De som är klara står till vänster med stängd mun.
const klara = n => Array.from({ length: n }, (_, i) => ({ n: i, x: VANSTER[n - 1][i], f: ANS(i, 'glad'), p: POS(i) }));
function vers(n, a) {
  const id = k => a + k, vid = (f, p, o = {}) => ({ n, x: HX, f, p, vid: true, ...o });
  // går in från vänster till handfatet (2 s) och vinkar på ekot "Hej, …!"
  S[id(0)] = tl => { const g = kl(tl / 2.0), [fw, pw] = FIG[n].L.ROR.ga(0.25 + 1.5 * g), stopp = del(1.7, 2.1, tl), v = del(1.8, 2.3, tl);
    return { kam: K_HEL, pafat: 0, figs: [{ n, x: lerp(IN_X, HX, 1 - (1 - g) ** 1.6), vid: tl > 1.6,
      f: FIG[n].L.blanda({ ...fw, titt: [8, 0] }, ANS(n, 'jatteglad'), stopp), p: FIG[n].L.blandaPose({ ...pw, x: 0, rikt: 0.7 }, POS(n, vink(tl, v)), stopp) }, ...klara(n)] }; };
  // "Gapa stort!": munnen öppnas på ordet, matta tänder
  S[id(1)] = tl => ({ kam: kAns(FIG[n]), figs: [vid(FIG[n].L.blanda(ANS(n, 'glad'), GAP(n), del(0.1, 0.5, tl)), POS(n))] });
  // mellanspelet: figurens ljud (munnen stängs till ett glatt ansikte), gapar igen, och mot slutet kommer borsten upp i bild
  S[id(2)] = (tl, d) => { const L = FIG[n].L, ljud = n === 0 ? ANS(n, 'jatteglad') : n === 1 ? ANS(n, 'fnissig', { oron: [-8 * Math.sin(tl * 9), 8 * Math.sin(tl * 9)] }) : ANS(n, 'stolt');
    const f = L.blanda(L.blanda(GAP(n), ljud, del(0.4, 0.8, tl)), GAP(n), del(2.0, 2.5, tl)), u = tl - (d - 2.3);
    if (u < 0) return { kam: kAns(FIG[n]), figs: [vid(f, POS(n))] };
    const [fu, pu] = L.ROR.borsta('upp', u, 1.6);
    return { kam: kAns(FIG[n]), figs: [vid(fu, u < 0.5 ? L.blandaPose(POS(n), pu, del(0, 0.5, u)) : pu, { blink: false })] }; };
  const del_ = (k, namn, kam, o) => S[id(k)] = (tl, d) => { const [f, p] = FIG[n].L.ROR.borsta(namn, tl, d, o); return { kam: kam(), figs: [vid(f, p, { blink: false })] }; };
  del_(3, 'skrubba', () => kAns(FIG[n]));            // "Borsta, borsta tänderna!": gnuggar, lite skum
  del_(4, 'uppe', () => kMun(FIG[n]));               // "Borsta uppe!": övre raden blir vit, en tand i taget
  del_(5, 'nere', () => kMun(FIG[n]));               // "Borsta nere!": nedre raden
  del_(6, 'klar', () => kAns(FIG[n]), { glans: GLANS[n] });   // "Rena tänder!": borsten bort, tandleendet, glansstjärnan
}
vers(0, '1'); vers(1, '2'); vers(2, '3');
// Den roliga scenen (refräng 2): en skumklick hamnar på kaninens nos i rad 23, kaninen tittar på den; den sitter kvar i 24–25 och spricker på "Rena tänder!"
{ const s23 = S['23'];
  S['23'] = (tl, d) => { const st = s23(tl, d), f = st.figs[0].f;
    st.figs[0].f = { ...f, glad: f.glad.map(g => g * (1 - del(0.9, 1.1, tl) + del(2.1, 2.3, tl))), titt: [0, 9] };
    return { ...st, klick: del(0.8, 1.05, tl) }; };
  for (const id of ['24', '25']) { const s = S[id]; S[id] = (tl, d) => ({ ...s(tl, d), klick: 1 }); }
  const s26 = S['26']; S['26'] = (tl, d) => ({ ...s26(tl, d), klickSprack: tl / 0.35 }); }

// Slutet: alla tre på rad med stängda munnar (4 s med frågan mitt i), tre ansiktsklipp, vinkningen och kritirisen
const rad3 = (f, p) => [0, 1, 2].map(n => ({ n, x: RAD3[n], f: f(n), p: p(n), vid: n === 1 }));
S['40'] = () => ({ kam: K_HEL, pafat: 0, figs: rad3(n => ANS(n, 'glad'), n => POS(n)) });
S['41'] = tl => ({ kam: K_HEL, pafat: 0, figs: rad3(n => ANS(n, 'glad'), n => POS(n, { luta: [-4, 4, -4][n] * del(0.2 + 0.15 * n, 0.8 + 0.15 * n, tl) })) });
// ansiktsklippen visar figuren ensam bakom handfatet, samma bild som i "Rena tänder!" (i raden skulle grannarna och handfatets kant sticka in i utsnittet)
['42a', '42b', '42c'].forEach((id, n) => S[id] = () => ({ kam: kAns(FIG[n]), figs: [{ n, x: HX, f: LER(n), p: POS(n), vid: true }] }));
S['43'] = tl => ({ kam: K_HEL, pafat: 0, figs: rad3(n => LER(n), n => POS(n, vink(tl + 0.3 * n, del(0.1 + 0.25 * n, 0.6 + 0.25 * n, tl)))) });
S['44'] = tl => ({ kam: K_HEL, pafat: 0, iris: tl, figs: rad3(n => FIG[n].L.blanda(LER(n), ANS(n, 'glad'), del(1.6, 2.0, tl)),
  n => POS(n, vink(tl + 3.8 + 0.3 * n, 1 - del(0.6 + 0.2 * n, 1.2 + 0.2 * n, tl)))) });

// --- En bildruta ---------------------------------------------------------------------------------------------------------
function rita(t) {
  ['pafat', 'fram', 'ram'].forEach(n => $(n).innerHTML = '');
  FIG.forEach(F => $('gomda').appendChild(F.G));
  TT = t; const r = RAD.findLast(r => t >= r.s) || RAD[0], tl = t - r.s, st = S[r.id](tl, r.d);
  kamera(st.kam);
  st.figs.forEach(fg => figur(fg, t));
  if (st.pafat != null) borstePaFat(st.pafat);
  const nos = () => iFig(HX, FIG[1].nos, FIG[1].L);
  if (st.klick > 0.01) lagg('fram', tuss(...nos(), 17 * SK * st.klick, 0.4));
  if (st.klickSprack != null) sprack(...nos(), 17 * SK, st.klickSprack);
  if (st.iris != null) {       // sluter sig runt kaninen i mitten 1:33–1:37, sedan svart
    const u = st.iris - 2.1, rr = u < 0 ? 1400 : u < 1.6 ? lerp(1400, 300, mjuk(u / 1.6)) : lerp(300, 0, mjuk((u - 2.6) / 1.4));
    kritiris(rr, skarm(iFig(HX, [512, 470], FIG[1].L)), t);
  }
  $('brus').setAttribute('seed', (Math.floor(Math.round(t * 30) / 3) % 50) + 1);
  window.kant?.uppdatera();
}

// --- Ljud: sången ligger under hela scenen (window.SANG); här läggs djurens ljud, borstljudet, glansen och ploppet lågt under ------
const E = 'assets/ljud/effekter/';
function ljud() {
  const ut = [];
  [['1', 0], ['2', 1], ['3', 2]].forEach(([a, n]) => {
    ut.push({ t: T[a + '2'].s + LJUD_IN, fil: E + FIG[n].ljud + '.m4a', vol: [8, 1, 1][n], langd: 1.9, fade: 0.3 });                      // kattens mjau, kaninens fniss (kanin-gullig-3), pandans brum (björnens brum-gullig-2 tills pandan får egna ljud). mjau-1 är en tyst fil (topp −22 dBFS), därför vol 8
    ut.push({ t: T[a + '3'].s, fil: E + 'skrubb/skrubb-1.m4a', vol: 1.6, langd: T[a + '6'].s - T[a + '3'].s - 0.2, loop: true, fadeIn: 0.2, fade: 0.3 });   // borstljud rad 13–15
    ut.push({ t: T[a + '6'].s + GLANS[n], fil: E + 'tindra/tindra-3.m4a', vol: 1.2 });                                                // glans
  });
  ut.push({ t: T['26'].s, fil: E + 'plopp/plopp-1.m4a', vol: 0.7 });                                                               // skumklicken spricker
  return ut;
}

window.DURATION = DURATION;
window.SANG = [0, DURATION];
window.seek = t => { window.stilla = true; rita(t); };
window.ready = (async () => {
  for (const [n, F] of FIG.entries()) {
    F.L = await v2rigg(F.slug); F.G = F.L.figur(512, F.L.FOTTER, 1, $('gomda')); F.blinka = skapaBlinka(31 + 7 * n);
    F.G.querySelector('.borste image').setAttribute('href', BORSTE);       // riggens borstbild pekar relativt figurens sida
    window.kant?.lagg(F.G.children[1]);                                    // figuren utan skuggan (annars får skuggan en kant)
  }
  badrum(); kamera(K_HEL);
  // gapets mitt och bredd per figur i riggens ruta, mätt på den ritade munnen (till munutsnittet)
  for (const [n, F] of FIG.entries()) { figur({ n, x: HX, f: GAP(n), p: POS(n), blink: false }, 0);
    const b = F.G.querySelector('.mun').getBoundingClientRect(), s = $('kamera').getBoundingClientRect(), inv = $('kamera').getScreenCTM().inverse();
    const q = new DOMPoint(b.x + b.width / 2, b.y + b.height / 2).matrixTransform(inv), w = b.width * inv.a / SK;
    F.mun = { cx: 512 + (q.x - HX) / SK, cy: F.L.FOTTER + (q.y - MARK) / SK, w }; }
  [...$('vagg').children].forEach(g => window.kant?.lagg(g)); window.kant?.lagg($('kar')); window.kant?.lagg($('pafat'));
  await Promise.all([PLATTA, HANDFAT, BORSTE, ...INREDNING.map(i => i[0])].map(u => new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = u; })));
  window.LJUD = ljud();
  rita(Number(new URLSearchParams(location.search).get('t') || 0));
  return true;
})();
const start = performance.now();
(function loop() { if (!window.stilla && FIG[2].L) rita(((performance.now() - start) / 1000) % DURATION); requestAnimationFrame(loop); })();
</script>
</body>
</html>
