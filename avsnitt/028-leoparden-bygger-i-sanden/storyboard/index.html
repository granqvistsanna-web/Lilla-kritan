<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leoparden bygger i sanden storyboard</title>
<style>
:root { --paper:#fbfaf6; --card:#fff; --ink:#2a2620; --muted:#6e675c; --line:#e6e1d6; --rosa:#b8506a }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper:#1d1c22; --card:#26252c; --ink:#f1ede4; --muted:#a8a196; --line:#3a3842; --rosa:#f2a7b8; color-scheme:dark } }
:root[data-theme="dark"] { --paper:#1d1c22; --card:#26252c; --ink:#f1ede4; --muted:#a8a196; --line:#3a3842; --rosa:#f2a7b8; color-scheme:dark }
* { box-sizing:border-box }
body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.5 system-ui,sans-serif }
.wrap { max-width:1240px; margin:0 auto; padding:40px 16px 72px }
h1 { font-size:clamp(30px,6vw,52px); margin:0 } h1 span { color:var(--rosa) }
.lede { color:var(--muted); max-width:72ch }
.frames { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; margin-top:24px }
.frame { margin:0; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden }
.frame img { width:100%; height:auto; display:block }
figcaption { padding:12px 14px 14px; display:grid; gap:6px; font-size:14px } figcaption p { margin:0 }
.t { font:500 12px ui-monospace,monospace; color:var(--muted) }
.said { border-left:3px solid var(--rosa); padding-left:10px }
.ans { color:var(--muted); font-size:13px }
</style></head><body><div class="wrap">
<h1>Leoparden bygger i sanden <span>storyboard</span></h1>
<p class="lede">Avsnitt 028, 2:38.4 med bilderbok-introt. En stillbild per rad, tagen ur kodscenen. ⚠ Malin är inte inspelad: repliklängderna är uppskattade, pauserna är manusets. 26 bilder.</p>
<div class="frames"><figure class="frame"><img src="frames/01a.jpg" alt="Bild 01a" loading="lazy"><figcaption>
  <div class="t">01a · 0:03.3 · 6.0 s · Papperet, helbild</div><div class="said"><i>"Kritan ritar …"</i> (0:04.3)</div>
  <p>Rent papper (efter bilderbok-introt). Kritan kommer in och ritar leopardens kontur i lugna drag, halvvägs här</p><p class="ans">Ljud: kritan ritar, skogsljud under · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/01b.jpg" alt="Bild 01b" loading="lazy"><figcaption>
  <div class="t">01b · 0:09.3 · 7.5 s · Papperet, helbild</div><div class="said"><i>"Hm … vad blir det nu?"</i> (0:09.3)</div>
  <p>Konturen ritas klar (armarna ett drag var, fläckarna sist), kritan väntar bredvid och vajar: barnet gissar</p><p class="ans">Ljud: kritan ritar · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/01c.jpg" alt="Bild 01c" loading="lazy"><figcaption>
  <div class="t">01c · 0:16.8 · 3.2 s · Papperet → zoom in</div><div class="said"><i>"Oj! En leopard!"</i> (0:17.4)</div>
  <p>Den riktiga leoparden fylls i inifrån. Sista 0,8 s: zoom in i teckningen</p><p class="ans">Ljud: – · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/1.jpg" alt="Bild 1" loading="lazy"><figcaption>
  <div class="t">1 · 0:20.0 · 7.0 s · Stranden, helbild</div><div class="said"><i>"Hej, leoparden! Hej, hej!"</i> (0:22.4)</div>
  <p>Leoparden trippar in från vänster (riggens gång) till sandvallen, stannar och vinkar. <b>Hej med vinkning</b></p><p class="ans">Ljud: små steg, glatt spinn · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/2.jpg" alt="Bild 2" loading="lazy"><figcaption>
  <div class="t">2 · 0:27.0 · 4.8 s · Stranden, halvbild</div><div class="said"><i>"Ska du bygga i sanden?"</i> (0:27.6)</div>
  <p>Leoparden sätter sig bakom sandvallen (bara överkroppen syns). Spaden står i sanden bredvid. Öronen vippar</p><p class="ans">Ljud: förtjust spinn · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/3.jpg" alt="Bild 3" loading="lazy"><figcaption>
  <div class="t">3 · 0:31.8 · 5.9 s · Närbild, sanden</div><div class="said"><i>"Oj då. Sanden rasar!"</i> (0:33.6)</div>
  <p>Spaden glider och lägger sand i en hög (två gånger). På <i>"rasar"</i> sjunker högen mjukt ihop och blir platt</p><p class="ans">Ljud: <code>sand</code>, frågande spinn · Ansikte: nyfiken</p></figcaption></figure>
<figure class="frame"><img src="frames/4.jpg" alt="Bild 4" loading="lazy"><figcaption>
  <div class="t">4 · 0:37.7 · 7.3 s · Närbild, leoparden</div><div class="said"><i>"Sanden vill visst inte stå."</i> (0:38.0) … <i>"Hm … vad gör vi nu?"</i> (0:41.3)</div>
  <p>Leoparden tittar ner på den platta sanden, öronen faller (riktningspose åt vänster). Paus 1 s mellan replikerna</p><p class="ans">Ljud: trumpet spinn · Ansikte: trumpen</p></figcaption></figure>
<figure class="frame"><img src="frames/5a.jpg" alt="Bild 5a" loading="lazy"><figcaption>
  <div class="t">5a · 0:45.0 · 10.5 s · Stranden → närbild där hinken ritas</div><div class="said"><i>"Titta! Kritan ritar något."</i> (0:45.3)</div>
  <p>Kritan kommer in och ritar hinkens kontur i sanden (4 s, nära bild), väntar sedan bredvid och vajar: gisspaus 3 s</p><p class="ans">Ljud: kritan ritar · Ansikte: nyfiken</p></figcaption></figure>
<figure class="frame"><img src="frames/5b.jpg" alt="Bild 5b" loading="lazy"><figcaption>
  <div class="t">5b · 0:55.5 · 4.5 s · Samma → halvbild</div><div class="said"><i>"En hink! Varsågod, leoparden."</i> (0:55.7)</div>
  <p>Den riktiga gula hinken fylls i inifrån, kritan flyger iväg. <i>Varsågod</i></p><p class="ans">Ljud: glitter · Ansikte: förvånad</p></figcaption></figure>
<figure class="frame"><img src="frames/6.jpg" alt="Bild 6" loading="lazy"><figcaption>
  <div class="t">6 · 1:00.1 · 8.9 s · Stranden, halvbild</div><div class="said"><i>"Ska vi säga tack?"</i> (1:00.4) … <i>"Tack!"</i> (1:05.9)</div>
  <p>Leoparden tittar på hinken, öronen reser sig. Paus 4 s: barnet säger tack. Efter <i>Tack!</i> nickar leoparden</p><p class="ans">Ljud: nyfiket spinn, sedan förtjust spinn · Ansikte: nyfiken → jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/7.jpg" alt="Bild 7" loading="lazy"><figcaption>
  <div class="t">7 · 1:09.0 · 5.0 s · Stranden, halvbild</div><div class="said"><i>"Oj! Hinken på huvudet!"</i> (1:10.0)</div>
  <p>Hinken glider upp i en mjuk båge och landar upp och ner på huvudet, öronen sticker ut under kanten. <b>Leken (hinkhatten)</b></p><p class="ans">Ljud: <code>swoosh</code>, fniss · Ansikte: förvånad → fnissig</p></figcaption></figure>
<figure class="frame"><img src="frames/8.jpg" alt="Bild 8" loading="lazy"><figcaption>
  <div class="t">8 · 1:14.0 · 5.0 s · Samma</div><div class="said"><i>"Ha ha! En hinkhatt!"</i> (1:15.0)</div>
  <p>Hinken glider ner i sanden igen och står rätt</p><p class="ans">Ljud: <code>hink-dunk</code>, långt fniss · Ansikte: fnissig</p></figcaption></figure>
<figure class="frame"><img src="frames/9.jpg" alt="Bild 9" loading="lazy"><figcaption>
  <div class="t">9 · 1:19.0 · 4.0 s · Samma</div><div class="said"><i>"Ska vi bygga nu?"</i> (1:19.3)</div>
  <p>Leoparden och hinken. <b>Shorten börjar här</b></p><p class="ans">Ljud: förtjust spinn · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/10.jpg" alt="Bild 10" loading="lazy"><figcaption>
  <div class="t">10 · 1:23.0 · 7.0 s · Närbild, bygget</div><div class="said"><i>"Först en sandkaka. Klapp, klapp … sandkaka!"</i> (1:24.3)</div>
  <p>Spaden fyller hinken två gånger, hinken tippar i en lugn båge och landar upp och ner. Två klapp (riggens klapp), hinken guppar på varje. På <i>"sandkaka!"</i> lyfts hinken och sandkakan står kvar</p><p class="ans">Ljud: <code>sand</code>, <code>klapp</code> ×2, <code>plupp</code>, fniss · Ansikte: glad → fnissig</p></figcaption></figure>
<figure class="frame"><img src="frames/11.jpg" alt="Bild 11" loading="lazy"><figcaption>
  <div class="t">11 · 1:30.0 · 7.0 s · Samma</div><div class="said"><i>"Och en till. Klapp, klapp … sandkaka!"</i> (1:31.7)</div>
  <p>Samma, sandkaka nummer två bredvid. Efteråt glider hinken tillbaka och spaden blir kvar bakom den</p><p class="ans">Ljud: <code>sand</code>, <code>klapp</code> ×2, <code>plupp</code>, fniss · Ansikte: fnissig</p></figcaption></figure>
<figure class="frame"><img src="frames/12.jpg" alt="Bild 12" loading="lazy"><figcaption>
  <div class="t">12 · 1:37.0 · 5.9 s · Stranden, halvbild</div><div class="said"><i>"Oj, spaden då? Leoparden vet inte var."</i> (1:37.3)</div>
  <p>Leoparden tittar åt vänster, sedan åt höger (ögonen och ansiktet). Spaden är borta</p><p class="ans">Ljud: frågande spinn · Ansikte: nyfiken</p></figcaption></figure>
<figure class="frame"><img src="frames/13.jpg" alt="Bild 13" loading="lazy"><figcaption>
  <div class="t">13 · 1:42.9 · 9.9 s · Närbild hinken (klipp)</div><div class="said"><i>"Kan du hjälpa leoparden? Kan du se var spaden är?"</i> (1:43.2)</div>
  <p>Spadens gula skaft sticker upp bakom hinken. Paus 5 s; efter ca 3 s skimrar skaftet svagt</p><p class="ans">Ljud: tyst · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/14.jpg" alt="Bild 14" loading="lazy"><figcaption>
  <div class="t">14 · 1:52.8 · 4.5 s · Samma → halvbild</div><div class="said"><i>"Ja, där! Ja, bakom hinken!"</i> (1:52.8)</div>
  <p>Skaftet skimrar tydligt och spaden glider fram på <i>"där"</i></p><p class="ans">Ljud: förtjust spinn, <code>tindra</code> · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/15.jpg" alt="Bild 15" loading="lazy"><figcaption>
  <div class="t">15 · 1:57.3 · 7.0 s · Närbild, bygget</div><div class="said"><i>"Klapp, klapp … sandkaka!"</i> (1:60.0)</div>
  <p>Spaden fyller, hinken tippar, två klapp, hinken lyfts: sandkaka nummer tre</p><p class="ans">Ljud: <code>sand</code>, <code>klapp</code> ×2, <code>plupp</code>, fniss · Ansikte: fnissig</p></figcaption></figure>
<figure class="frame"><img src="frames/16.jpg" alt="Bild 16" loading="lazy"><figcaption>
  <div class="t">16 · 2:04.3 · 4.2 s · Stranden, halvbild</div><div class="said"><i>"Oj! Tre sandkakor!"</i> (2:04.6)</div>
  <p>Tre sandkakor i rad, de skimrar till en i taget. Leoparden stolt</p><p class="ans">Ljud: <code>tindra</code>, förtjust spinn · Ansikte: stolt</p></figcaption></figure>
<figure class="frame"><img src="frames/17a.jpg" alt="Bild 17a" loading="lazy"><figcaption>
  <div class="t">17a · 2:08.5 · 3.4 s · Stranden, helbild</div><div class="said">–</div>
  <p>Leoparden reser sig och trippar ner till strandkanten (riggens gång åt höger)</p><p class="ans">Ljud: små steg · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/17b.jpg" alt="Bild 17b" loading="lazy"><figcaption>
  <div class="t">17b · 2:11.9 · 5.0 s · Strandkanten, halvbild</div><div class="said"><i>"Titta, små vågor! Hopp!"</i> (2:12.4)</div>
  <p>En liten våg glider upp på sanden. På <i>"Hopp!"</i> ett lugnt skutt, och vågen glider tillbaka under leoparden. <b>Leken (hoppa över vågorna)</b></p><p class="ans">Ljud: <code>vagor</code>, <code>landa-mjuk</code>, fniss · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/18.jpg" alt="Bild 18" loading="lazy"><figcaption>
  <div class="t">18 · 2:16.9 · 9.2 s · Samma</div><div class="said"><i>"Kan du också hoppa?"</i> (2:17.2) … <i>"Hopp!"</i> (2:22.9)</div>
  <p>En våg till. Paus 4 s: barnet hoppar. På <i>"Hopp!"</i> hoppar leoparden. <b>Shorten slutar här</b></p><p class="ans">Ljud: <code>vagor</code>, <code>landa-mjuk</code>, långt fniss · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/19.jpg" alt="Bild 19" loading="lazy"><figcaption>
  <div class="t">19 · 2:26.1 · 5.3 s · Strandkanten, halvbild</div><div class="said"><i>"Hej då, leoparden! Hej då, hinken!"</i> (2:26.4)</div>
  <p>Leoparden vinkar (armen bakom kroppen, snett ut förbi kanten), sandkakorna och hinken bredvid. <b>Hej då med vinkning</b></p><p class="ans">Ljud: hej då-spinn · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/20.jpg" alt="Bild 20" loading="lazy"><figcaption>
  <div class="t">20 · 2:31.4 · 4.5 s · Samma</div><div class="said"><i>"Hej då! Vi ses snart!"</i> (2:31.7)</div>
  <p>Leoparden vinkar klart, armen sjunker</p><p class="ans">Ljud: fniss · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/21.jpg" alt="Bild 21" loading="lazy"><figcaption>
  <div class="t">21 · 2:35.9 · 2.5 s · Stranden → kritirisen</div><div class="said">–</div>
  <p>Kritirisen drar ihop sig runt leoparden</p><p class="ans">Ljud: – · Ansikte: glad</p></figcaption></figure></div>
</div></body></html>
