<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Kaninen bygger torn i snön</title>
<style>html, body { margin:0; background:#000; } svg { width:100vw; height:100vh; display:block; }</style>
</head>
<body>
<!-- 050 Kaninen bygger torn i snön: hela kodscenen (grind 6). Komposition och mått som storyboarden (../../storyboard/scen.html),
     tiden och raderna ur ../rader.json (skrivs av storyboard/bygg.mjs). Maskineriet (tid, kritan, ljud, kritiris) är 049:s scen.
     Rendera: node verktyg/render-delat.mjs avsnitt/050-kaninen-bygger-torn/scener/granstugan [--snabb].
     Ingen logotyp först: julkalenderns ram (lucka 23, produktion/youtube/shorts/jul/23-kaninen-bygger-torn) är intro och outro.
     Bara hårda klipp; den enda åkningen är zoomen in i teckningen. Kritan är liten, utan ansikte, knackar aldrig. -->
<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs id="defs">
    <filter id="boil" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="5000">
      <feTurbulence id="brus" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
      <feDisplacementMap id="boilStyrka" in="SourceGraphic" scale="2.5"/>
    </filter>
    <radialGradient id="sken"><stop offset="0" stop-color="#ffd76a" stop-opacity=".85"/><stop offset=".45" stop-color="#ffc94a" stop-opacity=".35"/><stop offset="1" stop-color="#ffc94a" stop-opacity="0"/></radialGradient>
    <radialGradient id="dromsken"><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".55"/></radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="#FAF8F2"/>
  <g id="kamera">
    <g id="platta"></g>
    <g id="bak"></g>
    <g id="golv" filter="url(#boil)"></g>
    <g filter="url(#boil)"><g id="sakerBak"></g></g>
    <g filter="url(#boil)"><g id="figurer"></g></g>
    <g filter="url(#boil)"><g id="saker"></g></g>
    <g id="fram" filter="url(#boil)"></g>
    <g id="flingor"></g>
  </g>
  <g id="papper"></g>
  <g id="ram"></g>
  <g id="gomda" opacity="0"></g>
</svg>
<script src="/verktyg/blinka.js"></script>
<script src="/verktyg/kant.js"></script>
<script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script>
const $ = id => document.getElementById(id), f1 = v => v.toFixed(1);
const lagg = (id, h) => $(id).insertAdjacentHTML('beforeend', h);
const A = '/assets/', R = A + 'rekvisita/';
const GARD = A + 'bakgrunder/granstugan/granstugan-stark.jpeg';
const KRITA = R + 'krita-rod/cut/krita-rod.png', KRITA_SPETS = [742, 132];
const HALSDUK = R + 'halsduk/cut/halsduk.png';
const SAK = {   // [fil, bildens storlek, alfarutan x0 y0 x1 y1]
  hink:  [R + 'hink-bla/cut/hink-bla.png', [1024, 1024], [161, 67, 866, 951]],
  spade: [R + 'spade-rod/cut/spade-rod.png', [1024, 1024], [276, 42, 749, 981]],
  ljus:  [R + 'adventsljus/cut/adventsljus.png', [1024, 1371], [314, 206, 709, 1188]],
  laga:  [R + 'laga/cut/laga.png', [1024, 1024], [130, 115, 894, 914]],
  gran:  [R + 'julgran/cut/julgran.png', [1024, 1024], [182, 73, 842, 951]],
};

// --- Mått (storyboarden) -----------------------------------------------------------------------------------------------------
// feedback 22/11: kaninen större (0,5 → 0,6), hinken står vid kaninens tass (fylls där och vänder sig till tornplatsen),
// tornen längre åt höger med en bredare glipa (74 px nere) så att ljuset syns, ljuset större
const DS = 0.6, MARK = 905, STA = [600, MARK], HOG = [340, MARK + 6];
const TH = 155, TB = 178, T1 = [1100, MARK], T2 = [1350, MARK], T3 = [1225, MARK - TH];
const HINK = [905, MARK, 200], GLIPA = [1225, MARK];
const SPADE = [1390, MARK + 4, 230], VID = [STA[0], MARK], HO = [1640, MARK];
const LJUS_H = 104;

// --- Tid ---------------------------------------------------------------------------------------------------------------------
const kl = (k, a = 0, b = 1) => Math.max(a, Math.min(b, k)), lerp = (a, b, k) => a + (b - a) * k;
const mjuk = k => (k = kl(k), k * k * (3 - 2 * k)), del = (a, b, t) => mjuk((t - a) / (b - a));
const bump = (a, b, t) => (t <= a || t >= b) ? 0 : Math.sin(Math.PI * (t - a) / (b - a));
const lerp2 = (P, Q, k) => [lerp(P[0], Q[0], k), lerp(P[1], Q[1], k)];
let TT = 0, RAD_L = [], RR = {}, ROSTER = [], DURATION = 0, CUR = null, KZ = 1, BOILZ = null;
const SVART = 0.6;
const ML = n => ROSTER[n - 1][1];
const MT = (i = 0) => (CUR.malin || [])[i]?.[1] ?? 0;
const LT = f => (CUR.ljud || []).filter(x => x[0].startsWith(f)).map(x => x[1]);
const MSLUT = () => MT() + ML(CUR.malin[0][0]);   // när radens replik är slut

let L, G, BL;
const iFig = ([x, fot], [px, py], s = DS) => [x + (px - 512) * s, fot + (py - L.FOTTER) * s];

function kamera(z = 1, cx = 960, cy = 540) {
  KZ = z;
  const tx = Math.max(1920 - 1920 * z, Math.min(0, 960 - cx * z)), ty = Math.max(1080 - 1080 * z, Math.min(0, 540 - cy * z));
  $('kamera').setAttribute('transform', `translate(${f1(tx)} ${f1(ty)}) scale(${z})`);
}
const KAM = { hel: [1], halv: [1.5, 1010, MARK - 230], glipa: [2.1, GLIPA[0], MARK - 160], glipaHalv: [1.8, GLIPA[0] - 90, MARK - 170],
  fonster: [1.2, 1150, 560], hoger: [1.6, 1480, MARK - 250], lykta: [1.7, 1330, MARK - 210], hog: [1.7, 560, MARK - 240], kaninHalv: [1.6, STA[0] + 80, MARK - 260] };
const nara = (pos, dy = 0) => kamera(2.0, pos[0], pos[1] - 345 + dy);

// --- Saker -------------------------------------------------------------------------------------------------------------------
const sakT = (namn, x, fot, hojd, rot = 0) => { const [, , [x0, y0, x1, y1]] = SAK[namn], s = hojd / (y1 - y0);
  return `translate(${f1(x)} ${f1(fot)}) rotate(${f1(rot)}) scale(${s.toFixed(4)}) translate(${-(x0 + x1) / 2} ${-y1})`; };
const sakImg = (namn, x, fot, hojd, { rot = 0, o = 1, extra = '' } = {}) => { const [f, [w, h]] = SAK[namn];
  return `<image href="${f}" width="${w}" height="${h}" opacity="${f1(o)}" ${extra} transform="${sakT(namn, x, fot, hojd, rot)}"/>`; };
const sak = (namn, x, fot, hojd, o = {}) => lagg(o.lager || 'saker', sakImg(namn, x, fot, hojd, o));
const bredd = (namn, hojd) => { const [, , [x0, y0, x1, y1]] = SAK[namn]; return hojd * (x1 - x0) / (y1 - y0); };
const skugga = (x, fot, rx, o = 0.1) => lagg('bak', `<ellipse cx="${f1(x)}" cy="${f1(fot - 2)}" rx="${f1(rx)}" ry="${f1(rx * 0.12)}" fill="#2a4d7a" opacity="${o}"/>`);

// snöhögen: hög eller platt (k 0–1: hur mycket som grävts bort)
const snohog = (k = 0) => { const [x, fot] = HOG, h = k >= 1 ? 40 : lerp(150, 70, k);   // en hög driva till vänster om kaninen, i tassens höjd (feedback 22/11)
  lagg('golv', `<path d="M${x - 145} ${fot} C${x - 120} ${f1(fot - h)} ${x - 40} ${f1(fot - h * 1.15)} ${x} ${f1(fot - h * 1.1)} C${x + 60} ${f1(fot - h * 1.15)} ${x + 125} ${f1(fot - h)} ${x + 145} ${fot} Z" fill="#ffffff" stroke="#d6e4f4" stroke-width="4"/>`); };
// ett snötorn; v = vitglimt (0–1), o = opacitet, sk = skala (poppar lite när det står)
function torn([x, fot], { o = 1, v = 0, sk = 1 } = {}) {
  if (o <= 0.01) return;
  const b = TB / 2, t = TB * 0.39, h = TH;
  skugga(x, fot, b * 0.95, 0.1 * o);
  lagg('saker', `<g opacity="${f1(o)}" transform="translate(${x} ${fot}) scale(${(sk).toFixed(3)} ${(1 / sk).toFixed(3)}) translate(${-x} ${-fot})"><path d="M${x - b} ${fot} L${x - t} ${fot - h + 10} Q${x - t} ${fot - h} ${x - t + 10} ${fot - h} L${x + t - 10} ${fot - h} Q${x + t} ${fot - h} ${x + t} ${fot - h + 10} L${x + b} ${fot} Z"
    fill="#fbfdff" stroke="#cddff2" stroke-width="4" stroke-linejoin="round"/>
    <path d="M${x - b * 0.93} ${fot - h * 0.2} L${x + b * 0.93} ${fot - h * 0.2}" stroke="#d9e7f6" stroke-width="4"/>
    <path d="M${x - b * 0.88} ${fot - h * 0.27} L${x + b * 0.88} ${fot - h * 0.27}" stroke="#e4eef9" stroke-width="3"/>
    ${v > 0 ? `<path d="M${x - t * 0.7} ${fot - h * 0.85} L${x - t * 0.2} ${fot - h * 0.85}" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity="${f1(v)}"/>` : ''}</g>`);
  if (v > 0) skimmer(x, fot - h - 25, v, 34);
}
// hinken: x, fot, höjd, vridning (180 = upp och ner), full (0–1: snöhögen i öppningen)
function hink([x, fot, h], rot = 0, full = 0, lager = 'saker') {
  const s = h / (951 - 67), cx = x, cy = fot - h / 2;
  if (rot === 0) skugga(x, fot, bredd('hink', h) * 0.42);
  // snön i hinken: en låg vit kupol i öppningen, bakom kanten (hinkens egna mått: kanten y 370–470, insidan x 215–810).
  // Feedback 22/11 b ("the filled snow sits a bit over bucket"): kupolen satt på y 190, ovanför kanten och bredare än hinken
  const sno = full > 0 ? `<path d="M222 420 Q236 ${f1(420 - 80 * full)} 512 ${f1(410 - 100 * full)} Q790 ${f1(420 - 80 * full)} 804 420 Z" fill="#fbfdff" stroke="#d6e4f4" stroke-width="12"/>` : '';
  lagg(lager, `<g transform="translate(${f1(cx)} ${f1(cy)}) rotate(${f1(rot)}) translate(${f1(-cx)} ${f1(-cy)})"><g transform="${sakT('hink', x, fot, h)}">${sno}<image href="${SAK.hink[0]}" width="1024" height="1024"/></g></g>`);
}
// ljuset i glipan; tand 0–1 (lågan och skenet), fyll 0–1 (fylls i inifrån efter kritans kontur)
function ljus(tand = 1, fyll = 1) {
  const [x, fot] = GLIPA, h = LJUS_H, fl = 1 + 0.06 * Math.sin(TT * 9) + 0.04 * Math.sin(TT * 13.7);
  if (tand > 0) lagg('bak', `<ellipse cx="${x}" cy="${fot - 60}" rx="${f1(320 * tand * fl)}" ry="${f1(230 * tand * fl)}" fill="url(#sken)"/>`);
  if (fyll >= 1) sak('ljus', x, fot - 2, h);
  else if (fyll > 0) lagg('saker', `<clipPath id="ljusfyll"><circle cx="${x}" cy="${fot - h / 2}" r="${f1(70 * mjuk(fyll))}"/></clipPath><g clip-path="url(#ljusfyll)">${sakImg('ljus', x, fot - 2, h)}</g>`);
  if (tand > 0) lagg('saker', `<g transform="translate(${x} ${fot - h - 2}) scale(${f1(tand)} ${(tand * fl).toFixed(3)}) translate(${-x} ${-(fot - h - 2)})">${sakImg('laga', x, fot - h - 2, 46)}</g>`);
}
const stjarna = (x, y, r, o = 1) => `<path transform="translate(${f1(x)} ${f1(y)}) scale(${f1(r)})" opacity="${f1(o)}" d="M0 -1 L.2 -.2 L1 0 L.2 .2 L0 1 L-.2 .2 L-1 0 L-.2 -.2Z" fill="#fff6c8" stroke="#e6b422" stroke-width=".06"/>`;
function skimmer(x, y, k, Rr = 40) { if (k <= 0.01) return; lagg('fram', [[-1, -0.7, 1], [1.1, -0.4, 0.8], [0.2, 1.1, 0.7], [-1.2, 0.8, 0.6]].map(([dx, dy, s], i) =>
  stjarna(x + dx * Rr, y + dy * Rr * 0.87, Rr * 0.39 * s * k * (0.8 + 0.3 * Math.sin(TT * 5 + i * 1.7)), Math.min(1, 0.4 + k))).join('')); }
// gnistor (som ritintrot): fyruddiga gula klistermärken som poppar fram en i taget
const gnistaD = (x, y, r) => `M${f1(x)} ${f1(y - r)} Q${f1(x + r * 0.18)} ${f1(y - r * 0.18)} ${f1(x + r)} ${f1(y)} Q${f1(x + r * 0.18)} ${f1(y + r * 0.18)} ${f1(x)} ${f1(y + r)} Q${f1(x - r * 0.18)} ${f1(y + r * 0.18)} ${f1(x - r)} ${f1(y)} Q${f1(x - r * 0.18)} ${f1(y - r * 0.18)} ${f1(x)} ${f1(y - r)}Z`;
const gnistor = (cx, cy, Rr, t, sk = 1, n = 5) => Array.from({ length: n }, (_, i) => { const u = (t - 0.25 * i) / 1.4; if (u < 0 || u > 1) return '';
  const a = -Math.PI / 2 + i * 2 * Math.PI / n + 0.4, x = cx + Rr * Math.cos(a), y = cy + Rr * 0.8 * Math.sin(a), r = 44 * sk * Math.sin(Math.PI * Math.min(1, u * 1.6)) * (1 - 0.3 * u);
  return r > 0.5 ? `<path d="${gnistaD(x, y, r)}" fill="#ffd23f" stroke="#fff" stroke-width="${f1(6 * sk)}" stroke-linejoin="round" paint-order="stroke" transform="rotate(${f1(20 * u)} ${f1(x)} ${f1(y)})"/>` : ''; }).join('');
// snöpuff: små vita bollar som yr upp ur (x, y) och faller, u = s sedan puffen
const puff = (x, y, u, upp = 110, n = 9) => u < 0 || u > 1.3 ? '' : Array.from({ length: n }, (_, i) => { const a = -Math.PI / 2 + (i - (n - 1) / 2) * 0.28, v = upp * (0.7 + 0.5 * ((i * 37) % 10) / 10);
  const px = x + Math.cos(a) * v * 0.9 * u, py = y + Math.sin(a) * v * 2.2 * u + 260 * u * u, r = (11 + (i % 3) * 4) * (1 - 0.5 * del(0.8, 1.3, u));
  return `<circle cx="${f1(px)}" cy="${f1(py)}" r="${f1(r)}" fill="#fff" stroke="#d6e4f4" stroke-width="1.5" opacity="${f1(1 - del(0.9, 1.3, u))}"/>`; }).join('');
// snöfall: jämnt, lätt, faller hela tiden (deterministiskt ur tiden)
const FLINGOR = (() => { let s = 7; const r = () => (s = (s * 9301 + 49297) % 233280) / 233280; return Array.from({ length: 70 }, () => [r() * 1920, r() * 1100, 2.5 + r() * 4, 0.55 + r() * 0.4, 28 + r() * 30, r() * 6]); })();
const snofall = () => lagg('flingor', FLINGOR.map(([x, y, r, o, v, f]) => `<circle cx="${f1(x + 18 * Math.sin(TT * 0.7 + f))}" cy="${f1((y + v * TT) % 1100 - 10)}" r="${f1(r)}" fill="#fff" opacity="${f1(o)}"/>`).join(''));
// julpynt på drömgranen: kulor och en stjärna
function julpynt(x, fot, h, o = 1) {
  const P = [[-0.16, 0.30, '#E2483D'], [0.12, 0.36, '#F2C230'], [-0.24, 0.52, '#3F8FE0'], [0.05, 0.55, '#E2483D'], [0.25, 0.60, '#F2C230'], [-0.30, 0.74, '#F2C230'], [-0.06, 0.76, '#3F8FE0'], [0.20, 0.80, '#E2483D'], [0.0, 0.18, '#3F8FE0']];
  const kulor = P.map(([dx, dy, c]) => `<circle cx="${f1(x + dx * h)}" cy="${f1(fot - h + dy * h)}" r="${f1(h * 0.034)}" fill="${c}" stroke="#fff" stroke-width="5" paint-order="stroke"/>`).join('');
  const r = h * 0.075 * (1 + 0.06 * Math.sin(TT * 3)), sy = fot - h + h * 0.03, st = Array.from({ length: 10 }, (_, i) => { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; return `${f1(x + rr * Math.cos(a))} ${f1(sy + rr * Math.sin(a))}`; }).join(' L');
  lagg('saker', `<g opacity="${f1(o)}">${kulor}<path d="M${st} Z" fill="#FFCB3D" stroke="#fff" stroke-width="7" stroke-linejoin="round" paint-order="stroke"/></g>`);
}

// --- Kritan ------------------------------------------------------------------------------------------------------------------
const kritaH = (x, y, v = 125, s = 0.33 / Math.sqrt(KZ)) => `<image href="${KRITA}" width="755" height="265" transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(v)}) scale(${s.toFixed(3)}) translate(${-KRITA_SPETS[0]} ${-KRITA_SPETS[1]})"/>`;
const KONTUR = {};
// kritan ritar en saks kontur (drag[] i ordning) på platsen P = [x, fot, höjd]; k 0–1; linjen tonas bort med ut; returnerar spetsen
function ritaSak(namn, [x, fot, hojd], k, { ut = 0, bredd: w = 6, lager = 'fram' } = {}) {
  const [, , [x0, y0, x1, y1]] = SAK[namn], s = hojd / (y1 - y0), drag = KONTUR[namn].drag || [KONTUR[namn].d], n = drag.length, kk = kl(k) * n;
  const aktiv = Math.min(n - 1, Math.floor(kk));
  lagg(lager, `<g transform="${sakT(namn, x, fot, hojd)}" opacity="${f1(1 - ut)}">${drag.map((d, i) => `<path ${i === aktiv ? `id="rit-${namn}"` : ''} d="${d}" pathLength="1" fill="none" stroke="#3a2c28" stroke-width="${f1(w / s)}" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="${kl(kk - i).toFixed(4)} 2"/>`).join('')}</g>`);
  const p = $('rit-' + namn), q = p.getPointAtLength(kl(kk - aktiv, 0, 0.999) * p.getTotalLength());
  return [x + (q.x - (x0 + x1) / 2) * s, fot + (q.y - y1) * s];
}
// saken fylls i inifrån (cirkel ur mitten)
const fyllIn = (namn, [x, fot, h], f, rot = 0) => f <= 0 ? '' : f >= 1 ? sakImg(namn, x, fot, h, { rot }) :
  `<clipPath id="fyll-${namn}"><circle cx="${x}" cy="${f1(fot - h / 2)}" r="${f1(h * 0.8 * mjuk(f))}"/></clipPath><g clip-path="url(#fyll-${namn})">${sakImg(namn, x, fot, h, { rot })}</g>`;
const ritfart = k => (k = kl(k), 0.6 * k + 0.4 * mjuk(k));
// kritan i scenen: { spets } när den ritar, annars väntar den vid W och svajar; ut 0–1 = flyger ut uppåt höger; inn 0–1 = kommer in
function kritan({ spets = null, W = spets, ut = null, inn = null, slutPunkt = null, m = 1 }) {
  const svP = [W[0] + 5 / KZ * Math.sin(TT * 1.2), W[1] + 4 / KZ * Math.sin(TT * 1.7)], svV = 140 + 1.5 * Math.sin(TT);
  if (ut != null) { if (ut < 1) lagg('fram', kritaH(svP[0] + 900 * mjuk(ut) / KZ, svP[1] - 500 * mjuk(ut) / KZ, svV)); return; }
  if (inn != null && inn < 1 && spets) { const fr = [spets[0] + 700 / KZ, spets[1] - 450 / KZ]; lagg('fram', kritaH(lerp(fr[0], spets[0], mjuk(inn)), lerp(fr[1], spets[1], mjuk(inn)))); return; }
  if (spets) { lagg('fram', kritaH(...spets)); return; }
  const a = slutPunkt || svP; lagg('fram', kritaH(lerp(a[0], svP[0], m), lerp(a[1], svP[1], m) - 40 / KZ * Math.sin(Math.PI * m), lerp(125, svV, m)));
}

// --- Kaninen -----------------------------------------------------------------------------------------------------------------
const F = (n, o = {}) => ({ ...L.blanda('neutral', n, 1), glad: [0, 0], ...o });
const FB = (a, b, k) => L.blanda(a, b, kl(k));
const P = o => ({ ...L.POSE0, ...o });
const PB = (a, b, k) => { const r = { ...a }; for (const n in b) r[n] = Array.isArray(b[n]) ? b[n].map((v, i) => lerp(a[n]?.[i] ?? L.POSE0[n]?.[i] ?? 0, v, k)) : typeof b[n] === 'number' ? lerp(a[n] ?? L.POSE0[n] ?? 0, b[n], k) : b[n]; return r; };
const TRYCK = { luta: 8, sank: 30, armar: [0, 40] };
const liv = (p, t) => { const a = (1 - Math.cos(2 * Math.PI * t / 3.6)) / 2;
  return { ...p, strack: (p.strack || 0) + 0.014 * a, bred: (p.bred || 0) + 0.007 * a, oron: (p.oron || [0, 0]).map((o, i) => o - 2 * a + (i ? -1 : 1) * 1.5 * Math.sin(t * 1.3 + 2 * i)) }; };
const skutt = (A_, B_, tl, a, b, h = 90) => { const u = kl((tl - a) / (b - a)); return [lerp(A_[0], B_[0], mjuk(u)), lerp(A_[1], B_[1], u) - h * Math.sin(Math.PI * u)]; };
// vinkar (feedback 22/11, "arm behind body"): högra armen bakom kroppen, snett upp och ut förbi kanten (+80 på Kanels rigg; +150 pekade nedåt)
const vinka = (p, tl, k = 1) => ({ ...p, luta: (p.luta || 0) + 1.5 * k * Math.sin(2 * Math.PI * 0.55 * tl), armar: [p.armar?.[0] ?? 0, (p.armar?.[1] ?? 0) + k * (80 + 14 * Math.sin(2 * Math.PI * 1.15 * tl))] });
// nickar (feedback 22/11, "better nodding"): n tydliga dippar à per s från a. Ansiktet ner (öronen släpar lite), kroppen trycks ihop lite
const nicka = (tl, a, n = 2, per = 0.42) => { const d = x => { const u = (tl - x - a) / per; return u <= 0 || u >= n ? 0 : Math.sin(Math.PI * (u % 1)) ** 1.4 * Math.min(1, (n - u) * 4, u * 4); };
  const s = d(0), s2 = d(0.08); return { nick: [1.3 * s, 1.3 * s2], sank: 9 * s, strack: -0.015 * s, oron: [6 * s2, 6 * s2] }; };
const nick = (tl, a, n = 2) => nicka(tl, a, n).nick;

}
