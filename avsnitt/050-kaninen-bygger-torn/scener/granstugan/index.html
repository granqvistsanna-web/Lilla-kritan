<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Kaninen bygger torn i snön</title>
<style>html, body { margin:0; background:#000; } svg { width:100vw; height:100vh; display:block; }</style>
</head>
<body>
<!-- 050 Kaninen bygger torn i snön: hela kodscenen (grind 6). Komposition och mått som storyboarden (../../storyboard/scen.html),
     tiden och raderna ur ../rader.json (skrivs av storyboard/bygg.mjs). Maskineriet (tid, kritan, ljud, kritiris) är 049:s scen.
     Rendera: node verktyg/render-delat.mjs avsnitt/050-kaninen-bygger-torn/scener/granstugan [--snabb].
     Ingen logotyp först: julkalenderns ram (lucka 23, produktion/youtube/shorts/jul/23-kaninen-bygger-torn) är intro och outro.
     Bara hårda klipp; den enda åkningen är zoomen in i teckningen. Kritan är liten, utan ansikte, knackar aldrig. -->
<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs id="defs">
    <filter id="boil" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="5000">
      <feTurbulence id="brus" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
      <feDisplacementMap id="boilStyrka" in="SourceGraphic" scale="2.5"/>
    </filter>
    <radialGradient id="sken"><stop offset="0" stop-color="#ffd76a" stop-opacity=".85"/><stop offset=".45" stop-color="#ffc94a" stop-opacity=".35"/><stop offset="1" stop-color="#ffc94a" stop-opacity="0"/></radialGradient>
    <radialGradient id="dromsken"><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".55"/></radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="#FAF8F2"/>
  <g id="kamera">
    <g id="platta"></g>
    <g id="bak"></g>
    <g id="golv" filter="url(#boil)"></g>
    <g filter="url(#boil)"><g id="sakerBak"></g></g>
    <g filter="url(#boil)"><g id="figurer"></g></g>
    <g filter="url(#boil)"><g id="saker"></g></g>
    <g id="fram" filter="url(#boil)"></g>
    <g id="flingor"></g>
  </g>
  <g id="papper"></g>
  <g id="ram"></g>
  <g id="gomda" opacity="0"></g>
</svg>
<script src="/verktyg/blinka.js"></script>
<script src="/verktyg/kant.js"></script>
<script src="/verktyg/kritan-ritar.js"></script>
<script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script>
const $ = id => document.getElementById(id), f1 = v => v.toFixed(1);
const lagg = (id, h) => $(id).insertAdjacentHTML('beforeend', h);
const A = '/assets/', R = A + 'rekvisita/';
const GARD = A + 'bakgrunder/granstugan/granstugan-stark.jpeg';
const HALSDUK = R + 'halsduk/cut/halsduk.png';
const SAK = {   // [fil, bildens storlek, alfarutan x0 y0 x1 y1]
  hink:  [R + 'hink-bla/cut/hink-bla.png', [1024, 1024], [161, 67, 866, 951]],
  spade: [R + 'spade-rod/cut/spade-rod.png', [1024, 1024], [276, 42, 749, 981]],
  ljus:  [R + 'adventsljus/cut/adventsljus.png', [1024, 1371], [314, 206, 709, 1188]],
  laga:  [R + 'laga/cut/laga.png', [1024, 1024], [130, 115, 894, 914]],
  gran:  [R + 'julgran/cut/julgran.png', [1024, 1024], [182, 73, 842, 951]],
};

// --- Mått (storyboarden) -----------------------------------------------------------------------------------------------------
// feedback 22/11: kaninen större (0,5 → 0,6), hinken står vid kaninens tass (fylls där och vänder sig till tornplatsen),
// tornen längre åt höger med en bredare glipa (74 px nere) så att ljuset syns, ljuset större
const DS = 0.6, MARK = 905, STA = [600, MARK], HOG = [340, MARK + 6];
const TH = 155, TB = 178, T1 = [1100, MARK], T2 = [1350, MARK], T3 = [1225, MARK - TH];
const HINK = [905, MARK, 200], GLIPA = [1225, MARK];
const SPADE = [1390, MARK + 4, 230], VID = [STA[0], MARK], HO = [1640, MARK];
const LJUS_H = 76, LAGA_H = 34;   // feedback 22/11 b ("make light a candle smaller"): 104 → 76

// --- Tid ---------------------------------------------------------------------------------------------------------------------
const kl = (k, a = 0, b = 1) => Math.max(a, Math.min(b, k)), lerp = (a, b, k) => a + (b - a) * k;
const mjuk = k => (k = kl(k), k * k * (3 - 2 * k)), del = (a, b, t) => mjuk((t - a) / (b - a));
const bump = (a, b, t) => (t <= a || t >= b) ? 0 : Math.sin(Math.PI * (t - a) / (b - a));
const lerp2 = (P, Q, k) => [lerp(P[0], Q[0], k), lerp(P[1], Q[1], k)];
let TT = 0, RAD_L = [], RR = {}, ROSTER = [], DURATION = 0, CUR = null, KZ = 1, BOILZ = null;
const SVART = 0.6;
const ML = n => ROSTER[n - 1][1];
const MT = (i = 0) => (CUR.malin || [])[i]?.[1] ?? 0;
const LT = f => (CUR.ljud || []).filter(x => x[0].startsWith(f)).map(x => x[1]);
const MSLUT = () => MT() + ML(CUR.malin[0][0]);   // när radens replik är slut

let L, G, BL;
const iFig = ([x, fot], [px, py], s = DS) => [x + (px - 512) * s, fot + (py - L.FOTTER) * s];

function kamera(z = 1, cx = 960, cy = 540) {
  KZ = z;
  const tx = Math.max(1920 - 1920 * z, Math.min(0, 960 - cx * z)), ty = Math.max(1080 - 1080 * z, Math.min(0, 540 - cy * z));
  $('kamera').setAttribute('transform', `translate(${f1(tx)} ${f1(ty)}) scale(${z})`);
}
// QA 25/11: halv 1010 → 900, så att kaninens vänstra arm har luft till vänsterkanten (rad 26 använder också halv)
// QA 25/11 (Sanna): glipa 1225 → 1360, så att kaninens arm och spade inte sticker in vid vänsterkanten i detaljen på lyktan
const KAM = { hel: [1], halv: [1.5, 900, MARK - 230], glipa: [2.1, GLIPA[0] + 135, MARK - 160], glipaHalv: [1.8, GLIPA[0] - 90, MARK - 170],
  fonster: [1.2, 1150, 560], hoger: [1.6, 1480, MARK - 250], lykta: [1.7, 1330, MARK - 210], hog: [1.7, 560, MARK - 240], kaninHalv: [1.6, STA[0] + 80, MARK - 260] };
const nara = (pos, dy = 0) => kamera(2.0, pos[0], pos[1] - 345 + dy);

// --- Saker -------------------------------------------------------------------------------------------------------------------
const sakT = (namn, x, fot, hojd, rot = 0) => { const [, , [x0, y0, x1, y1]] = SAK[namn], s = hojd / (y1 - y0);
  return `translate(${f1(x)} ${f1(fot)}) rotate(${f1(rot)}) scale(${s.toFixed(4)}) translate(${-(x0 + x1) / 2} ${-y1})`; };
const sakImg = (namn, x, fot, hojd, { rot = 0, o = 1, extra = '' } = {}) => { const [f, [w, h]] = SAK[namn];
  return `<image href="${f}" width="${w}" height="${h}" opacity="${f1(o)}" ${extra} transform="${sakT(namn, x, fot, hojd, rot)}"/>`; };
const sak = (namn, x, fot, hojd, o = {}) => lagg(o.lager || 'saker', sakImg(namn, x, fot, hojd, o));
const bredd = (namn, hojd) => { const [, , [x0, y0, x1, y1]] = SAK[namn]; return hojd * (x1 - x0) / (y1 - y0); };
const skugga = (x, fot, rx, o = 0.1) => lagg('bak', `<ellipse cx="${f1(x)}" cy="${f1(fot - 2)}" rx="${f1(rx)}" ry="${f1(rx * 0.12)}" fill="#2a4d7a" opacity="${o}"/>`);

// snöhögen: hög eller platt (k 0–1: hur mycket som grävts bort)
const snohog = (k = 0) => { const [x, fot] = HOG, h = k >= 1 ? 40 : lerp(150, 70, k);   // en hög driva till vänster om kaninen, i tassens höjd (feedback 22/11)
  lagg('golv', `<path d="M${x - 145} ${fot} C${x - 120} ${f1(fot - h)} ${x - 40} ${f1(fot - h * 1.15)} ${x} ${f1(fot - h * 1.1)} C${x + 60} ${f1(fot - h * 1.15)} ${x + 125} ${f1(fot - h)} ${x + 145} ${fot} Z" fill="#ffffff" stroke="#d6e4f4" stroke-width="4"/>`); };
// ett snötorn; v = vitglimt (0–1), o = opacitet, sk = skala (poppar lite när det står)
function torn([x, fot], { o = 1, v = 0, sk = 1 } = {}) {
  if (o <= 0.01) return;
  const b = TB / 2, t = TB * 0.39, h = TH;
  skugga(x, fot, b * 0.95, 0.1 * o);
  lagg('saker', `<g opacity="${f1(o)}" transform="translate(${x} ${fot}) scale(${(sk).toFixed(3)} ${(1 / sk).toFixed(3)}) translate(${-x} ${-fot})"><path d="M${x - b} ${fot} L${x - t} ${fot - h + 10} Q${x - t} ${fot - h} ${x - t + 10} ${fot - h} L${x + t - 10} ${fot - h} Q${x + t} ${fot - h} ${x + t} ${fot - h + 10} L${x + b} ${fot} Z"
    fill="#fbfdff" stroke="#cddff2" stroke-width="4" stroke-linejoin="round"/>
    <path d="M${x - b * 0.93} ${fot - h * 0.2} L${x + b * 0.93} ${fot - h * 0.2}" stroke="#d9e7f6" stroke-width="4"/>
    <path d="M${x - b * 0.88} ${fot - h * 0.27} L${x + b * 0.88} ${fot - h * 0.27}" stroke="#e4eef9" stroke-width="3"/>
    ${v > 0 ? `<path d="M${x - t * 0.7} ${fot - h * 0.85} L${x - t * 0.2} ${fot - h * 0.85}" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity="${f1(v)}"/>` : ''}</g>`);
  if (v > 0) skimmer(x, fot - h - 25, v, 34);
}
// hinken: x, fot, höjd, vridning (180 = upp och ner), full (0–1: snöhögen i öppningen)
// mark: marken hinken står på upp och ner (feedback 22/11 b, "hink still visible on vänd"): vänd sjunker hinken 46 px så att kanten
// står på marken som tornet, och handtaget under kanten klipps bort
function hink([x, fot, h], rot = 0, full = 0, lager = 'saker', mark = null) {
  const s = h / (951 - 67), cx = x, cy = fot - h / 2;
  if (rot === 0) skugga(x, fot, bredd('hink', h) * 0.42);
  // snön i hinken: en låg vit kupol i öppningen, bakom kanten (hinkens egna mått: kanten y 370–470, insidan x 215–810).
  // Feedback 22/11 b ("the filled snow sits a bit over bucket"): kupolen satt på y 190, ovanför kanten och bredare än hinken
  const sno = full > 0 ? `<path d="M222 420 Q236 ${f1(420 - 80 * full)} 512 ${f1(410 - 100 * full)} Q790 ${f1(420 - 80 * full)} 804 420 Z" fill="#fbfdff" stroke="#d6e4f4" stroke-width="12"/>` : '';
  const dy = rot > 90 ? 46 * mjuk((rot - 90) / 90) : 0, id = 'hinkklipp' + lager;
  // QA 25/11 ("handtaget hänger ner genom snön"): handtaget (hinkens bild ovanför y 362) fälls ner över hinkens sida när hinken
  // vänds, runt fästena vid kanten (y 400): skalas i höjdled 1 → −0,85, så att det aldrig hänger ut under kanten
  const fall = mjuk((Math.abs(rot) - 60) / 100), hy = lerp(1, -0.85, fall), img = `<image href="${SAK.hink[0]}" width="1024" height="1024"`;
  const kropp = fall > 0 ? `<clipPath id="hk${id}"><rect x="0" y="362" width="1024" height="662"/></clipPath><clipPath id="hh${id}"><rect x="0" y="0" width="1024" height="362"/></clipPath>
    ${img} clip-path="url(#hk${id})"/><g transform="translate(0 400) scale(1 ${hy.toFixed(3)}) translate(0 -400)">${img} clip-path="url(#hh${id})"/></g>` : `${img}/>`;
  lagg(lager, `${mark != null ? `<clipPath id="${id}"><rect x="-3000" y="-3000" width="8000" height="${f1(mark + 3000)}"/></clipPath>` : ''}<g ${mark != null ? `clip-path="url(#${id})"` : ''}><g transform="translate(0 ${f1(dy)})"><g transform="translate(${f1(cx)} ${f1(cy)}) rotate(${f1(rot)}) translate(${f1(-cx)} ${f1(-cy)})"><g transform="${sakT('hink', x, fot, h)}">${sno}${kropp}</g></g></g></g>`);
}
// ljuset i glipan; tand 0–1 (lågan och skenet), fyll 0–1 (fylls i inifrån efter kritans kontur)
function ljus(tand = 1, fy = 1) {
  const [x, fot] = GLIPA, h = LJUS_H, fl = 1 + 0.06 * Math.sin(TT * 9) + 0.04 * Math.sin(TT * 13.7);
  if (tand > 0) lagg('bak', `<ellipse cx="${x}" cy="${fot - 60}" rx="${f1(270 * tand * fl)}" ry="${f1(195 * tand * fl)}" fill="url(#sken)"/>`);
  if (fy >= 1) sak('ljus', x, fot - 2, h);
  else if (fy > 0) lagg('saker', fyll(RIT[3], fy));
  if (tand > 0) lagg('saker', `<g transform="translate(${x} ${fot - h - 2}) scale(${f1(tand)} ${(tand * fl).toFixed(3)}) translate(${-x} ${-(fot - h - 2)})">${sakImg('laga', x, fot - h - 2, LAGA_H)}</g>`);
}
const stjarna = (x, y, r, o = 1) => `<path transform="translate(${f1(x)} ${f1(y)}) scale(${f1(r)})" opacity="${f1(o)}" d="M0 -1 L.2 -.2 L1 0 L.2 .2 L0 1 L-.2 .2 L-1 0 L-.2 -.2Z" fill="#fff6c8" stroke="#e6b422" stroke-width=".06"/>`;
function skimmer(x, y, k, Rr = 40) { if (k <= 0.01) return; lagg('fram', [[-1, -0.7, 1], [1.1, -0.4, 0.8], [0.2, 1.1, 0.7], [-1.2, 0.8, 0.6]].map(([dx, dy, s], i) =>
  stjarna(x + dx * Rr, y + dy * Rr * 0.87, Rr * 0.39 * s * k * (0.8 + 0.3 * Math.sin(TT * 5 + i * 1.7)), Math.min(1, 0.4 + k))).join('')); }
// snöpuff: små vita bollar som yr upp ur (x, y) och faller, u = s sedan puffen
const puff = (x, y, u, upp = 110, n = 9) => u < 0 || u > 1.3 ? '' : Array.from({ length: n }, (_, i) => { const a = -Math.PI / 2 + (i - (n - 1) / 2) * 0.28, v = upp * (0.7 + 0.5 * ((i * 37) % 10) / 10);
  const px = x + Math.cos(a) * v * 0.9 * u, py = y + Math.sin(a) * v * 2.2 * u + 260 * u * u, r = (11 + (i % 3) * 4) * (1 - 0.5 * del(0.8, 1.3, u));
  return `<circle cx="${f1(px)}" cy="${f1(py)}" r="${f1(r)}" fill="#fff" stroke="#d6e4f4" stroke-width="1.5" opacity="${f1(1 - del(0.9, 1.3, u))}"/>`; }).join('');
// snöfall: jämnt, lätt, faller hela tiden (deterministiskt ur tiden)
const FLINGOR = (() => { let s = 7; const r = () => (s = (s * 9301 + 49297) % 233280) / 233280; return Array.from({ length: 70 }, () => [r() * 1920, r() * 1100, 2.5 + r() * 4, 0.55 + r() * 0.4, 28 + r() * 30, r() * 6]); })();
const snofall = () => lagg('flingor', FLINGOR.map(([x, y, r, o, v, f]) => `<circle cx="${f1(x + 18 * Math.sin(TT * 0.7 + f))}" cy="${f1((y + v * TT) % 1100 - 10)}" r="${f1(r)}" fill="#fff" opacity="${f1(o)}"/>`).join(''));
// julpynt på drömgranen: kulor och en stjärna
function julpynt(x, fot, h, o = 1) {
  const P = [[-0.16, 0.30, '#E2483D'], [0.12, 0.36, '#F2C230'], [-0.24, 0.52, '#3F8FE0'], [0.05, 0.55, '#E2483D'], [0.25, 0.60, '#F2C230'], [-0.30, 0.74, '#F2C230'], [-0.06, 0.76, '#3F8FE0'], [0.20, 0.80, '#E2483D'], [0.0, 0.18, '#3F8FE0']];
  const kulor = P.map(([dx, dy, c]) => `<circle cx="${f1(x + dx * h)}" cy="${f1(fot - h + dy * h)}" r="${f1(h * 0.034)}" fill="${c}" stroke="#fff" stroke-width="5" paint-order="stroke"/>`).join('');
  const r = h * 0.075 * (1 + 0.06 * Math.sin(TT * 3)), sy = fot - h + h * 0.03, st = Array.from({ length: 10 }, (_, i) => { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; return `${f1(x + rr * Math.cos(a))} ${f1(sy + rr * Math.sin(a))}`; }).join(' L');
  lagg('saker', `<g opacity="${f1(o)}">${kulor}<path d="M${st} Z" fill="#FFCB3D" stroke="#fff" stroke-width="7" stroke-linejoin="round" paint-order="stroke"/></g>`);
}

// --- Kritan: verktyg/kritan-ritar.js (QA 26/11 J23 punkt 1, CLAUDE.md "krita kod") -------------------------------------------
// Kontur + detaljstreck i en mörk kritlinje (ritBana, ritfart), kritan med kritaFas (in uppifrån höger, spetsen i linjens ände, glider
// till väntplatsen och svajar, flyger ut), fyllning inifrån (fyllMask) medan linjen tonas bort (linjeOpacitet), krit-gnistorna (gnistor).
// Konturerna är kontur.py:s (…-kontur.json, ytterkontur + hålet), detaljerna mätta i bilderna (bildens px): hinkens kantlinje och glans,
// spadens fog mellan skaft och blad och bladets inre kant, ljusets framkant upptill och veken (lågan i scenens px).
// Hinken och spaden ritas i följd: kritan glider från hinken till spadens början och svajar där tills den ritar (som J02).
const KONTUR = {};   // kontur.py:s konturer, laddas i window.ready
const DETALJ = {
  hink: ['M226 470 Q512 452 798 458', 'M730 532 Q706 625 686 722'],
  spade: ['M474 574 L546 574', 'M300 612 C304 770 420 900 512 955', 'M724 612 C722 770 610 900 512 955'],
  ljus: ['M334 325 Q512 372 690 325', 'M512 228 L512 318'],
};
const LJUSP = [GLIPA[0], MARK - 2, LJUS_H];
// en bana i bildens px → scenens (papperets) px för saken på P = [x, fot, höjd], som en tät polylinje (ritBana rundar den själv)
function iP(namn, P, d) {
  const [, , [x0, y0, x1, y1]] = SAK[namn], s = P[2] / (y1 - y0), e = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  e.setAttribute('d', d); $('defs').appendChild(e); const L = e.getTotalLength(), n = Math.max(8, Math.ceil(L / 4));
  const pts = Array.from({ length: n + 1 }, (_, i) => { const q = e.getPointAtLength(L * i / n); return `${f1(P[0] + (q.x - (x0 + x1) / 2) * s)} ${f1(P[1] + (q.y - y1) * s)}`; });
  e.remove(); return 'M' + pts.join(' L');
}
// en ritning: var (P), när (t0, sek: ritandet; fyll, fd: fyllningen, absoluta sekunder), väntplats och ut (kritaFas), gnistornas ring
function ritning(namn, P, { t0, sek, fyll, fd, vanta = null, ut = null, gn, extra = [], bred = null }) {
  const K = KONTUR[namn], [, , [x0, y0, x1, y1]] = SAK[namn], s = P[2] / (y1 - y0), m = K.mitt || [(x0 + x1) / 2, (y0 + y1) / 2];
  const mitt = [P[0] + (m[0] - (x0 + x1) / 2) * s, P[1] + (m[1] - y1) * s], R = s * Math.max(...[[x0, y0], [x1, y0], [x0, y1], [x1, y1]].map(([x, y]) => Math.hypot(x - m[0], y - m[1])));
  return { namn, P, drag: [...(K.drag || [K.d]), ...DETALJ[namn]].map(d => iP(namn, P, d)).concat(extra), t0, sek, slut: t0 + sek, fyll, fd, vanta, ut, gn, mitt, R,
    w: bred ?? Math.max(5, Math.min(KRITAN.BRED, 0.04 * P[2])) };
}
let RIT = [];
function kedja() {   // ritningar som följer tätt (< 4 s) kedjas: kritan väntar vid nästa ritnings början i stället för att flyga ut
  RIT.forEach((r, i) => { const n = RIT[i + 1]; r.nasta = n && n.t0 - r.slut < 4 ? n : null; if (r.nasta) n.efter = true;
    r.T = r.nasta ? { in: [r.t0 - 0.4, r.t0], rit: [r.t0, r.slut], vanta: [r.slut, n.t0], ut: [n.t0, n.t0 + 1] }
      : { in: r.efter ? [r.t0, r.t0] : [r.t0 - 0.4, r.t0], rit: [r.t0, r.slut], vanta: r.vanta[1], ut: r.ut };
    r.av = r.nasta ? n.t0 : r.ut[1]; r.fran = r.efter ? r.t0 : r.t0 - 0.4; });
}
// sakens riktiga bild fylls i inifrån (fyllMask) från ritningens mitt
const fyll = (r, f, rot = 0) => f <= 0 ? '' : f >= 1 ? sakImg(r.namn, r.P[0], r.P[1], r.P[2], { rot }) :
  `${fyllMask('fyll-' + r.namn, r.mitt[0], r.mitt[1], r.R, f)}<g clip-path="url(#fyll-${r.namn})">${sakImg(r.namn, r.P[0], r.P[1], r.P[2], { rot })}</g>`;
// linjerna, gnistorna och kritan för ritningarna i lista vid tiden t, i lagret lager; s = kritans skala, z = kamerazoomen (gnistorna lika stora i bild)
function ritaKritan(t, lista, lager, s, z = 1) {
  let kr = null;
  for (const r of lista) {
    const f = kl((t - r.fyll) / r.fd), k = ritfart(kl((t - r.t0) / r.sek));
    if (t >= r.t0 && f < 1) lagg(lager, ritBana(r.drag, k, { attr: `fill="none" stroke="${KRITAN.LINJE}" stroke-width="${f1(r.w)}" stroke-linecap="round" stroke-linejoin="round" opacity="${linjeOpacitet(f).toFixed(3)}"` }).html);
    const u = t - r.fyll; if (u >= 0 && u < 2.6) { const [cx, cy, Rg] = r.gn;
      lagg(lager, `<g transform="translate(${f1(cx)} ${f1(cy)}) scale(${(1 / z).toFixed(3)}) translate(${f1(-cx)} ${f1(-cy)})">${gnistor(cx, cy, Rg * z, u)}</g>`); }
    if (t < r.fran || t >= r.av) continue;
    const B0 = ritBana(r.drag, 0), spets = ritBana(r.drag, k).spets, SV = KRITAN.SVAJ;
    const vanta = r.nasta ? (p => [p[0] - SV.ax * Math.sin(r.av * SV.fx), p[1] - SV.ay * Math.sin(r.av * SV.fy)])(ritBana(r.nasta.drag, 0).start) : r.vanta[0];
    kr = kritaFas(t, r.T, { start: B0.start, spets, slut: B0.slut, vanta, s });
    if (kr && r.nasta) kr.v = KRITAN.VINKEL_RITAR;   // glider direkt till nästa ritning: ritvinkeln hela vägen

// --- Kaninen -----------------------------------------------------------------------------------------------------------------
const F = (n, o = {}) => ({ ...L.blanda('neutral', n, 1), glad: [0, 0], ...o });
const FB = (a, b, k) => L.blanda(a, b, kl(k));
const P = o => ({ ...L.POSE0, ...o });
const PB = (a, b, k) => { const r = { ...a }; for (const n in b) r[n] = Array.isArray(b[n]) ? b[n].map((v, i) => lerp(a[n]?.[i] ?? L.POSE0[n]?.[i] ?? 0, v, k)) : typeof b[n] === 'number' ? lerp(a[n] ?? L.POSE0[n] ?? 0, b[n], k) : b[n]; return r; };
const TRYCK = { luta: 8, sank: 30, armar: [0, 40] };
const liv = (p, t) => { const a = (1 - Math.cos(2 * Math.PI * t / 3.6)) / 2;
  return { ...p, strack: (p.strack || 0) + 0.014 * a, bred: (p.bred || 0) + 0.007 * a, oron: (p.oron || [0, 0]).map((o, i) => o - 2 * a + (i ? -1 : 1) * 1.5 * Math.sin(t * 1.3 + 2 * i)) }; };
const skutt = (A_, B_, tl, a, b, h = 90) => { const u = kl((tl - a) / (b - a)); return [lerp(A_[0], B_[0], mjuk(u)), lerp(A_[1], B_[1], u) - h * Math.sin(Math.PI * u)]; };
// vinkar: riggens ARMROR.vinka (verktyg/rigg-motor.js, 22/11), armen bakom kroppen, snett ut förbi kanten, samma på alla figurer. Ger { f, p }
const vinka = (f, p, tl, k = 1) => { const [f2, p2] = L.ARMROR.vinka(f, p, tl, k); return { f: f2, p: p2 }; };
// fnissar: ansiktet tonar till fnissig vid fn och axlarna skakar lite (riggens STUNDER.fnissig, bara kroppen)
const fniss = (f, p, tl, fn, d = 1.4) => { const fk = FB(f, 'fnissig', del(fn - 0.1, fn + 0.3, tl)), u = tl - fn + 0.1; if (u <= 0 || u >= d) return { f: fk, p };
  const [, q] = L.STUNDER.fnissig(u, d); return { f: fk, p: PN(p, { strack: q.strack, luta: q.luta, oron: q.oron }) }; };
// nickar (feedback 22/11, "better nodding"): n tydliga dippar à per s från a. Ansiktet ner (öronen släpar lite), kroppen trycks ihop lite
const nicka = (tl, a, n = 2, per = 0.42) => { const d = x => { const u = (tl - x - a) / per; return u <= 0 || u >= n ? 0 : Math.sin(Math.PI * (u % 1)) ** 1.4 * Math.min(1, (n - u) * 4, u * 4); };
  const s = d(0), s2 = d(0.08); return { nick: [1.3 * s, 1.3 * s2], sank: 9 * s, strack: -0.015 * s, oron: [6 * s2, 6 * s2] }; };
const nick = (tl, a, n = 2) => nicka(tl, a, n).nick;
const PN = (o, ...nn) => { const r = P(o); for (const q of nn) for (const k in q) r[k] = Array.isArray(q[k]) ? q[k].map((v, i) => v + (r[k]?.[i] ?? 0)) : q[k] + (r[k] ?? 0); return r; };
function kaninRita(pos, f, p, { s = DS, lager = 'figurer' } = {}) {
  $(lager).appendChild(G);
  G.setAttribute('transform', `translate(${f1(pos[0])} ${f1(pos[1])}) scale(${s}) translate(-512 ${-L.FOTTER})`);
  L.rita(G, BL(f, TT), liv(p, TT));
}
const DM = m => DOMMatrix.fromMatrix(m);
const scenPunkt = (el, x, y) => { const q = DM($('kamera').getCTM()).inverse().multiply(DM(el.getCTM())).transformPoint(new DOMPoint(x, y)); return [q.x, q.y]; };
const handen = () => { const e = [...G.querySelectorAll('.arm-r')], a = e.find(x => x.getAttribute('opacity') !== '0') || e[0]; return scenPunkt(a, ...L.HAND.r); };
const nosen = () => scenPunkt(G.querySelector('.drag'), 512, 447);
// spaden i tassen (feedback 22/11 b, "improve spade in hand"): riggens sak i handen (sakIn/sakRita i verktyg/rigg-motor.js), så att
// tassen ligger över skaftet och spaden vrids runt greppet i tassen, inte runt bladet. rot = spadens vinkel (14 = vilar); last 0–1 = snöklump på bladet
const rotV = ([x, y], g) => { const a = g * Math.PI / 180; return [x * Math.cos(a) - y * Math.sin(a), x * Math.sin(a) + y * Math.cos(a)]; };
const SP_GREPP = [510, 330], SP_S = 230 / (981 - 42);   // greppet mitt på skaftet (spadens egna px), spadens skala i scenen
const SP_SAK = () => L.sakBild(SAK.spade[0], 1024, 1024, { grepp: SP_GREPP, fot: [512, 981], skala: SP_S / DS, folj: 0, kant: 10 });
const spadeFot = (rot = 14) => { const [x, y] = handen(), [dx, dy] = rotV([(512 - SP_GREPP[0]) * SP_S, (981 - SP_GREPP[1]) * SP_S], rot); return [x + dx, y + dy]; };
const bladet = (rot = 14) => { const [x, y] = handen(), [dx, dy] = rotV([0, (760 - SP_GREPP[1]) * SP_S], rot); return [x + dx, y + dy]; };
const klump = (x, y, k = 1, r = 30) => `<path transform="translate(${f1(x)} ${f1(y)}) scale(${(k * r / 30).toFixed(3)})" d="M-30 6 C-34 -10 -18 -24 -4 -20 C4 -32 26 -26 26 -10 C38 -6 36 12 24 14 L-24 14 C-32 14 -32 10 -30 6Z" fill="#fff" stroke="#cddff2" stroke-width="4" stroke-linejoin="round"/>`;
const klumpPaBladet = (rot = 14, last = 0) => { if (last > 0.02) { const [bx, by] = bladet(rot); lagg('fram', klump(bx, by - 14, last)); } };
// ett spadtag (feedback 22/11, "holding spade and filling bucket"): från a, 1,3 s. Bladet ner i snön bredvid hinken, upp med en
// snöklump, tippar över hinken och klumpen faller i. Ger armen, spadens vinkel, lasten och klumpens fall (0–1)
const SPADTAG = 1.3;
function spadtag(tl, a) {
  const u = (tl - a) / SPADTAG; if (u <= 0 || u >= 1) return { arm: 0, rot: 14, last: 0, fall: -1, ner: 0 };
  const ner = bump(0, 0.4, u), upp = del(0.3, 0.68, u) * (1 - del(0.85, 1, u)), tipp = del(0.62, 0.8, u) * (1 - del(0.88, 1, u));
  return { arm: -40 * ner + 62 * upp, rot: 14 + 14 * ner - 84 * tipp, last: del(0.3, 0.4, u) * (1 - del(0.7, 0.78, u)), fall: u > 0.72 ? del(0.72, 0.92, u) : -1, ner: del(0.18, 0.3, u) * (1 - del(0.3, 0.45, u)) };
}
// klappa med spadens baksida på snön i hinken: två lätta klapp kring kp
function spadKlapp(tl, kp) {
  const in_ = del(kp - 0.5, kp - 0.15, tl) * (1 - del(kp + 0.45, kp + 0.8, tl)), k = bump(kp - 0.15, kp + 0.1, tl) + bump(kp + 0.12, kp + 0.36, tl);
  return { arm: in_ * (42 - 12 * k), rot: 14 - in_ * 96, k };
}
// hopp på stället: ett lugnt skutt (lyft i scenens px)
const hoppY = (tl, a, h = 40, d = 0.5) => -h * bump(a, a + d, tl);

// --- Kritirisen --------------------------------------------------------------------------------------------------------------
function kritiris(r, [cx, cy]) {
  if (r >= 1500) return;
  const ring = 'M' + Array.from({ length: 145 }, (_, j) => { const a = j / 144 * 2 * Math.PI, rr = r * (1 + 0.06 * Math.sin(9 * a + TT * 0.8));
    return `${f1(cx + rr * Math.cos(a))} ${f1(cy + rr * Math.sin(a))}`; }).join('L') + 'Z';
  lagg('ram', `<path d="M-50 -50H1970V1130H-50Z ${r > 1 ? ring : ''}" fill="#101010" fill-rule="evenodd"/>
    ${r > 1 ? `<path d="${ring}" fill="none" stroke="#fff8e0" stroke-width="${Math.min(14, r / 4)}" stroke-linejoin="round" filter="url(#boil)"/>` : ''}`);
}

// --- Ritintrot: kritan ritar spadens kontur på papperet, väntar, spaden fylls i, zoom in i gården --------------------------

// hinkFyll (kritans ifyllning), spade: 'mark' | 'tass' | { fyll }, ljus: { tand, fyll }, rit: { namn, P, k, ut }, krita: {…}, puff: [x, y, u],
// prickar (snö på nosen, 0–1 kvar), drom (0–1), skim: [[x, y, k, R]], iris

const E = 'assets/ljud/effekter/';
const VOL = f => /^kanin-/.test(f) ? 0.85 : /^(glitter|tindra|pling)/.test(f) ? 0.7 : /^krita-ritar/.test(f) ? 0.9 : /^hopp/.test(f) ? 0.6 : /^bjallror/.test(f) ? 0.2 : /^knarr/.test(f) ? 0.45 : 0.75;
const RITLANGD = { '01a': 6.4, '11a': 2.6, '11b': 1.6, '26': 2.0 };
const MUSIK = 'assets/ljud/musik/jul/karol-up-on-the-housetop-slinga.m4a';   // feedback 22/11 ("add xmas soundtrack"): julkarolen i stället för dagbädden, så att det hörs att det är jul (som 042, 045)
function ljud() {
  const ut = [];
  for (const r of RAD_L) {
    for (const [n, o] of r.malin || []) ut.push({ t: r.s + o, fil: `assets/ljud/roster/kaninen-bygger-torn/${ROSTER[n - 1][0]}.m4a`, vol: 1.0 });
    for (const [f, o] of r.ljud || []) if (f) ut.push({ t: r.s + o, fil: E + f + '.m4a', vol: VOL(f), ...(/^krita-ritar/.test(f) ? { loop: true, langd: RITLANGD[r.id] ?? 2, fade: 0.4 } : /^bjallror/.test(f) ? { langd: 2.6, fade: 1.4 } : /^knarr/.test(f) && r.id === '1' ? { langd: 0.45, fade: 0.2 } : {}) });
  }
  ut.push({ t: 0.2, fil: MUSIK, vol: 0.16, langd: DURATION - 0.2, loop: true, fadeIn: 1.5, fade: 3.0 });
  return ut.filter(c => c.t < DURATION);
}

function rita(t) {
