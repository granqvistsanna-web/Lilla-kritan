<h1>Kaninen bygger torn <span>storyboard</span></h1>
<p class="lede">Avsnitt 050, 2:58.8. En stillbild per uppslag, tajmad efter Malins klippta repliker och manusets pauser. Granstugan (stark), kaninens v2-rigg med halsduken, hinken, spaden, snötornen, julgransdrömmen och snölyktan. Röda streckade pilar visar rörelsen. 41 bilder.</p>
<div class="frames"><figure class="frame"><img src="frames/01a.jpg" alt="Bild 01a" loading="lazy"><figcaption>
  <div class="t">01a · 0:00.0 · 7.0 s · Papperet, helbild</div><div class="said"><i>"Kritan ritar …"</i> (0:00.6)</div>
  <p>Kritan ritar spadens kontur (ytterkonturen, sedan öglan) i ett lugnt drag</p><p class="ans">Ljud: kritan ritar, karolen lågt · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/01b.jpg" alt="Bild 01b" loading="lazy"><figcaption>
  <div class="t">01b · 0:07.0 · 5.7 s · Papperet, helbild</div><div class="said"><i>"Hm … vad blir det nu?"</i> (0:07.0)</div>
  <p>Konturen klar, kritan väntar bredvid och svajar: barnet gissar</p><p class="ans">Ljud: tyst, karolen lågt · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/01c.jpg" alt="Bild 01c" loading="lazy"><figcaption>
  <div class="t">01c · 0:12.7 · 4.1 s · Papperet → zoom in</div><div class="said"><i>"Oj! En spade!"</i> (0:13.3)</div>
  <p>Spaden fylls i inifrån ("En spade!"). Zoom in i papperet, in i granstugans gård</p><p class="ans">Ljud: <code>glitter</code> · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/1.jpg" alt="Bild 1" loading="lazy"><figcaption>
  <div class="t">1 · 0:16.8 · 6.5 s · Granstugan, helbild</div><div class="said"><i>"Hej, kaninen! Hej, hej!"</i> (0:19.8)</div>
  <p>Kaninen med halsduken hoppar in från vänster och vinkar (armen bakom kroppen). Det snöar lätt, tassavtryck bakom</p><p class="ans">Ljud: <code>hopp-mjuk</code>, kanin hej · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/2.jpg" alt="Bild 2" loading="lazy"><figcaption>
  <div class="t">2 · 0:23.2 · 3.9 s · Helbild</div><div class="said"><i>"Oj, vad glad du är!"</i> (0:23.9)</div>
  <p>Glatt skutt, öronen vippar. Malin när den landat</p><p class="ans">Ljud: <code>hopp-mjuk</code>, jippi · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/3.jpg" alt="Bild 3" loading="lazy"><figcaption>
  <div class="t">3 · 0:27.1 · 3.8 s · Närbild</div><div class="said"><i>"Är det för att det är julafton i morgon?"</i> (0:27.5)</div>
  <p>Kaninen tittar mot stugans tända fönster</p><p class="ans">Ljud: förtjust · Ansikte: glittriga ögon</p></figcaption></figure>
<figure class="frame"><img src="frames/4.jpg" alt="Bild 4" loading="lazy"><figcaption>
  <div class="t">4 · 0:30.9 · 3.9 s · Närbild</div><div class="said"><i>"Ja, såklart! Det är så kul."</i> (0:31.2)</div>
  <p>Kaninen nickar två gånger</p><p class="ans">Ljud: ja, <code>bjallror</code> lågt · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/5.jpg" alt="Bild 5" loading="lazy"><figcaption>
  <div class="t">5 · 0:34.8 · 3.4 s · Halvbild</div><div class="said"><i>"Men vad ska vi göra i dag då?"</i> (0:35.1)</div>
  <p>Kaninen tittar på oss, öronen på sned</p><p class="ans">Ljud: frågande · Ansikte: nyfiken</p></figcaption></figure>
<figure class="frame"><img src="frames/6.jpg" alt="Bild 6" loading="lazy"><figcaption>
  <div class="t">6 · 0:38.3 · 3.6 s · Helbild</div><div class="said"><i>"Titta, så mycket snö!"</i> (0:38.8)</div>
  <p>Kaninen tittar upp mot flingorna</p><p class="ans">Ljud: förtjust · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/7.jpg" alt="Bild 7" loading="lazy"><figcaption>
  <div class="t">7 · 0:41.8 · 4.0 s · Halvbild: kaninen och snöhögen</div><div class="said"><i>"Gräver du med tassarna?"</i> (0:43.2)</div>
  <p>Kaninen gräver i snöhögen med rak tass, två gånger. Malin efter första grävet</p><p class="ans">Ljud: <code>knarr-sno</code> × 2, ja · Ansikte: koncentrerad</p></figcaption></figure>
<figure class="frame"><img src="frames/8.jpg" alt="Bild 8" loading="lazy"><figcaption>
  <div class="t">8 · 0:45.8 · 4.4 s · Halvbild</div><div class="said"><i>"Oj! Snö på nosen!"</i> (0:46.6)</div>
  <p>En snöpuff yr rakt upp och landar som små vita prickar på nosen</p><p class="ans">Ljud: <code>puff</code>, fniss · Ansikte: förvånad → fnissig</p></figcaption></figure>
<figure class="frame"><img src="frames/9.jpg" alt="Bild 9" loading="lazy"><figcaption>
  <div class="t">9 · 0:50.2 · 4.7 s · Närbild</div><div class="said"><i>"Med tassar går det visst inte så bra."</i> (0:50.8)</div>
  <p>Kaninen blinkar, lutar huvudet lugnt, prickarna faller av en i taget</p><p class="ans">Ljud: trumpen (kort) · Ansikte: blinkar</p></figcaption></figure>
<figure class="frame"><img src="frames/10.jpg" alt="Bild 10" loading="lazy"><figcaption>
  <div class="t">10 · 0:54.9 · 3.9 s · Närbild</div><div class="said"><i>"Hm … vad gör vi nu?"</i> (0:55.2)</div>
  <p>Kaninen tittar upp på oss</p><p class="ans">Ljud: frågande · Ansikte: nyfiken</p></figcaption></figure>
<figure class="frame"><img src="frames/11a.jpg" alt="Bild 11a" loading="lazy"><figcaption>
  <div class="t">11a · 0:58.8 · 5.6 s · Halvbild: snön bredvid kaninen</div><div class="said"><i>"Titta! Kritan ritar något."</i> (0:59.1)</div>
  <p>Kritan kommer in och ritar hinkens kontur på snön (tre drag). Gisspaus 3 s</p><p class="ans">Ljud: kritan ritar · Ansikte: nyfiken</p></figcaption></figure>
<figure class="frame"><img src="frames/11b.jpg" alt="Bild 11b" loading="lazy"><figcaption>
  <div class="t">11b · 1:04.4 · 5.0 s · Halvbild</div><div class="said"><i>"En hink! Och en spade! Varsågod, kaninen."</i> (1:04.7)</div>
  <p>Hinken fylls i inifrån. På "Och en spade!" ritar kritan spaden bredvid, den fylls i</p><p class="ans">Ljud: <code>glitter</code>, kritan ritar · Ansikte: glittriga ögon</p></figcaption></figure>
<figure class="frame"><img src="frames/12.jpg" alt="Bild 12" loading="lazy"><figcaption>
  <div class="t">12 · 1:09.4 · 2.5 s · Halvbild</div><div class="said"><i>"Tack, kritan!"</i> (1:09.8)</div>
  <p>Kaninen tittar upp mot kritan när den flyger ut</p><p class="ans">Ljud: kanin tack · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/13.jpg" alt="Bild 13" loading="lazy"><figcaption>
  <div class="t">13 · 1:11.9 · 3.0 s · Halvbild</div><div class="said"><i>"Kaninen säger också tack."</i> (1:12.2)</div>
  <p>Kaninen nickar</p><p class="ans">Ljud: förtjust · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/14.jpg" alt="Bild 14" loading="lazy"><figcaption>
  <div class="t">14 · 1:14.9 · 3.4 s · Halvbild</div><div class="said"><i>"Nu bygger vi ett torn!"</i> (1:15.7)</div>
  <p>Spaden glider till kaninens tass och sitter i tasspetsen</p><p class="ans">Ljud: jippi · Ansikte: ivrig</p></figcaption></figure>
<figure class="frame"><img src="frames/15.jpg" alt="Bild 15" loading="lazy"><figcaption>
  <div class="t">15 · 1:18.4 · 4.8 s · Halvbild: tornbygget</div><div class="said"><i>"Fyll … klappa … vänd!"</i> (1:18.7)</div>
  <p>Fyll (snöpuff i hinken), klappa (rak tass), vänd (hinken vänder sig själv i en båge och landar)</p><p class="ans">Ljud: <code>puff</code>, <code>klapp</code>, <code>sno-duns</code> · Ansikte: koncentrerad</p></figcaption></figure>
<figure class="frame"><img src="frames/16.jpg" alt="Bild 16" loading="lazy"><figcaption>
  <div class="t">16 · 1:23.2 · 2.5 s · Halvbild</div><div class="said"><i>"Ett torn!"</i> (1:23.5)</div>
  <p>Hinken lyfts, tornet står kvar, glitter. Glatt skutt</p><p class="ans">Ljud: <code>glitter</code>, skutt, fniss · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/17.jpg" alt="Bild 17" loading="lazy"><figcaption>
  <div class="t">17 · 1:25.8 · 2.0 s · Halvbild</div><div class="said"><i>"Och igen!"</i> (1:26.4)</div>
  <p>Kaninen fyller hinken igen bredvid första tornet</p><p class="ans">Ljud: ja · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/18.jpg" alt="Bild 18" loading="lazy"><figcaption>
  <div class="t">18 · 1:27.8 · 3.2 s · Halvbild</div><div class="said"><i>"Fyll … klappa …"</i> (1:28.1)</div>
  <p>Fyll, klappa: hinken står full och stilla</p><p class="ans">Ljud: <code>puff</code>, <code>klapp</code> · Ansikte: koncentrerad</p></figcaption></figure>
<figure class="frame"><img src="frames/19.jpg" alt="Bild 19" loading="lazy"><figcaption>
  <div class="t">19 · 1:30.9 · 5.8 s · Närbild</div><div class="said"><i>"Kan du säga vänd?"</i> (1:31.2)</div>
  <p>Kaninen tittar på oss, hinken gungar lite. Paus 4 s: barnet säger "vänd!"</p><p class="ans">Ljud: tyst, kaninen blinkar och andas · Ansikte: nyfiken</p></figcaption></figure>
<figure class="frame"><img src="frames/20.jpg" alt="Bild 20" loading="lazy"><figcaption>
  <div class="t">20 · 1:36.7 · 3.7 s · Halvbild</div><div class="said"><i>"Vänd! Ett torn till!"</i> (1:36.9)</div>
  <p>Hinken vänder sig på "Vänd!". Andra tornet tätt bredvid det första</p><p class="ans">Ljud: <code>sno-duns</code>, <code>glitter</code>, jippi · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/21.jpg" alt="Bild 21" loading="lazy"><figcaption>
  <div class="t">21 · 1:40.4 · 7.0 s · Helbild</div><div class="said"><i>"Oj! Var är kaninen?"</i> (1:41.8)</div>
  <p>Kaninen hoppar bakom tornen, bara öronspetsarna syns i glipan. Paus 3 s, öronen vippar</p><p class="ans">Ljud: <code>hopp-mjuk</code> · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/22.jpg" alt="Bild 22" loading="lazy"><figcaption>
  <div class="t">22 · 1:47.4 · 3.5 s · Helbild</div><div class="said"><i>"Tittut! Där är du!"</i> (1:47.9)</div>
  <p>Kaninen hoppar fram vid sidan</p><p class="ans">Ljud: <code>hopp-mjuk</code>, fniss · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/23.jpg" alt="Bild 23" loading="lazy"><figcaption>
  <div class="t">23 · 1:50.9 · 5.0 s · Halvbild</div><div class="said"><i>"Två torn. Och ett till … högst upp?"</i> (1:51.2)</div>
  <p>Kaninen tittar upp, ovanför tornen</p><p class="ans">Ljud: frågande · Ansikte: nyfiken</p></figcaption></figure>
<figure class="frame"><img src="frames/24.jpg" alt="Bild 24" loading="lazy"><figcaption>
  <div class="t">24 · 1:55.9 · 5.0 s · Halvbild</div><div class="said"><i>"Fyll … klappa … vänd!"</i> (1:56.2)</div>
  <p>Fyll, klappa, vänd: hinken vänder sig i en högre båge och landar ovanpå båda tornen</p><p class="ans">Ljud: <code>puff</code>, <code>klapp</code>, <code>sno-duns</code> · Ansikte: koncentrerad</p></figcaption></figure>
<figure class="frame"><img src="frames/25.jpg" alt="Bild 25" loading="lazy"><figcaption>
  <div class="t">25 · 2:00.9 · 4.1 s · Helbild</div><div class="said"><i>"Oj! Ett torn på tornen!"</i> (2:01.4)</div>
  <p>Tre torn i en trekant, glipan mellan de två nedre under det översta</p><p class="ans">Ljud: <code>glitter</code>, förvånad min · Ansikte: förvånad</p></figcaption></figure>
<figure class="frame"><img src="frames/25b.jpg" alt="Bild 25b" loading="lazy"><figcaption>
  <div class="t">25b · 2:05.0 · 6.3 s · Närbild → helbild</div><div class="said"><i>"Oj … det ser ut som en julgran!"</i> (2:06.6)</div>

  <p>Kritan kommer in och ritar ljusets kontur i glipan mellan tornen</p><p class="ans">Ljud: kritan ritar · Ansikte: nyfiken</p></figcaption></figure>
<figure class="frame"><img src="frames/27.jpg" alt="Bild 27" loading="lazy"><figcaption>
  <div class="t">27 · 2:15.5 · 5.3 s · Närbild: glipan</div><div class="said"><i>"Titta noga. Vad blir det?"</i> (2:15.8)</div>
  <p>Konturen står klar, kaninen tittar in. Gisspaus 3 s</p><p class="ans">Ljud: tyst, kaninen blinkar och andas · Ansikte: nyfiken</p></figcaption></figure>
<figure class="frame"><img src="frames/28.jpg" alt="Bild 28" loading="lazy"><figcaption>
  <div class="t">28 · 2:20.7 · 4.3 s · Närbild: glipan</div><div class="said"><i>"Ett ljus! Titta, det lyser!"</i> (2:21.3)</div>
  <p>Ljuset fylls i, lågan tänds, ett varmt gult sken sprider sig i snön</p><p class="ans">Ljud: <code>glitter</code>, <code>tindra</code> · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/29.jpg" alt="Bild 29" loading="lazy"><figcaption>
  <div class="t">29 · 2:25.1 · 3.3 s · Helbild</div><div class="said"><i>"En snölykta!"</i> (2:25.7)</div>

<figure class="frame"><img src="frames/31.jpg" alt="Bild 31" loading="lazy"><figcaption>
  <div class="t">31 · 2:31.0 · 7.1 s · Helbild</div><div class="said"><i>"Ska vi räkna tornen? Ett … två … tre!"</i> (2:31.3)</div>
  <p>Ett torn i taget glimtar på "Ett … två … tre!"</p><p class="ans">Ljud: <code>pling</code> × 3 · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/32.jpg" alt="Bild 32" loading="lazy"><figcaption>
  <div class="t">32 · 2:38.1 · 3.7 s · Närbild: lyktan och fönstret</div><div class="said"><i>"Snart är det jul!"</i> (2:38.7)</div>
