<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hunden leker storyboard</title>
<style>
:root { --paper:#fbfaf6; --card:#fff; --ink:#2a2620; --muted:#6e675c; --line:#e6e1d6; --bla:#2f7fb5 }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper:#1d1c22; --card:#26252c; --ink:#f1ede4; --muted:#a8a196; --line:#3a3842; --bla:#8cc6ec; color-scheme:dark } }
:root[data-theme="dark"] { --paper:#1d1c22; --card:#26252c; --ink:#f1ede4; --muted:#a8a196; --line:#3a3842; --bla:#8cc6ec; color-scheme:dark }
* { box-sizing:border-box }
body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.5 system-ui,sans-serif }
.wrap { max-width:1240px; margin:0 auto; padding:40px 16px 72px }
h1 { font-size:clamp(30px,6vw,52px); margin:0 } h1 span { color:var(--bla) }
.lede { color:var(--muted); max-width:72ch }
.frames { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; margin-top:24px }
.frame { margin:0; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden }
.frame img { width:100%; height:auto; display:block }
figcaption { padding:12px 14px 14px; display:grid; gap:6px; font-size:14px } figcaption p { margin:0 }
.t { font:500 12px ui-monospace,monospace; color:var(--muted) }
.said { border-left:3px solid var(--bla); padding-left:10px }
.ans { color:var(--muted); font-size:13px }
</style></head><body><div class="wrap">
<h1>Hunden leker <span>storyboard</span></h1>
<p class="lede">Avsnitt 021, 2:46.3 med 1 s intro. En stillbild per rad i <code>storyboard.md</code>. Lekplatsen med hinken, stöveln, lekstugan och rutschkanekullen, hunden ur sin v2-rigg, bollen ur lekplatsens saker. Röda streckade pilar visar rörelsen. 30 bilder.</p>
<div class="frames"><figure class="frame"><img src="frames/00.jpg" alt="Bild 00" loading="lazy"><figcaption>
  <div class="t">00 · 0:00.0 · 1.0 s · Intro</div><div class="said">–</div>
  <p>Lilla Kritans logotyp i 1 s. Ingen jingel, inget titelkort (Sanna 2026-11-11)</p><p class="ans">Ljud: – · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/01a.jpg" alt="Bild 01a" loading="lazy"><figcaption>
  <div class="t">01a · 0:01.0 · 6.0 s · Papperet, helbild</div><div class="said"><i>"Kritan ritar …"</i> (0:02.0)</div>
  <p>Kritan ritar hundens kontur i lugna drag (ca 7 s totalt), halvvägs här</p><p class="ans">Ljud: kritan ritar, skogsljud · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/01b.jpg" alt="Bild 01b" loading="lazy"><figcaption>
  <div class="t">01b · 0:07.0 · 7.5 s · Papperet, helbild</div><div class="said"><i>"Hm … vad blir det nu?"</i> (0:07.0)</div>
  <p>Konturen ritas klar, sedan väntar kritan bredvid och vickar lugnt (ingen knackning): barnet gissar</p><p class="ans">Ljud: kritan ritar, skogsljud · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/01c.jpg" alt="Bild 01c" loading="lazy"><figcaption>
  <div class="t">01c · 0:14.5 · 3.7 s · Papperet, helbild → zoom in</div><div class="said"><i>"Oj! En hund!"</i> (0:15.1)</div>
  <p>Den riktiga hunden fylls i inifrån. Sista 0,8 s: zoom in i teckningen (avsnittets enda zoom)</p><p class="ans">Ljud: – · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/1.jpg" alt="Bild 1" loading="lazy"><figcaption>
  <div class="t">1 · 0:18.2 · 5.9 s · Lekplatsen, helbild</div><div class="said"><i>"Hej, hunden! Hej, hej!"</i> (0:19.8)</div>
  <p>Hunden trippar in från vänster, stannar mitt på gången och vinkar (höger arm, bakom kroppen). Hinken står bredvid</p><p class="ans">Ljud: små steg, <code>vov-babbel</code>, svansen viftar · Ansikte: glad → jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/2.jpg" alt="Bild 2" loading="lazy"><figcaption>
  <div class="t">2 · 0:24.2 · 3.8 s · Lekplatsen, halvbild</div><div class="said">–</div>
  <p>Hunden tittar åt vänster, sedan åt höger (ögonen och <code>rikt ±0,3</code>, huvudet vänds inte). Inget att leka med i närheten. Tyst 3 s</p><p class="ans">Ljud: frågande <code>vov-pip</code> · Ansikte: nyfiken</p></figcaption></figure>
<figure class="frame"><img src="frames/3.jpg" alt="Bild 3" loading="lazy"><figcaption>
  <div class="t">3 · 0:28.0 · 8.7 s · Lekplatsen, närbild hunden</div><div class="said"><i>"Oj då. Hunden har visst inget att leka med."</i> (0:28.4) … <i>"Hm … vad gör vi nu?"</i> (0:32.5)</div>
  <p>Öronen faller (12°), kroppen sjunker lite (<code>strack −0,04</code>). Paus 1 s mellan replikerna</p><p class="ans">Ljud: ⚠ <code>suck</code> saknas, sedan <code>vov-pip</code> · Ansikte: lite ledsen</p></figcaption></figure>
<figure class="frame"><img src="frames/4a.jpg" alt="Bild 4a" loading="lazy"><figcaption>
  <div class="t">4a · 0:36.6 · 4.3 s · Lekplatsen, helbild</div><div class="said"><i>"Titta! Kritan ritar något."</i> (0:36.9)</div>
  <p>Kritan kommer in uppifrån till vänster (hunden står till höger om bollens plats), mot marken framför hunden</p><p class="ans">Ljud: – · Ansikte: nyfiken</p></figcaption></figure>
<figure class="frame"><img src="frames/4b.jpg" alt="Bild 4b" loading="lazy"><figcaption>
  <div class="t">4b · 0:41.0 · 7.0 s · Lekplatsen, bollens utsnitt (klipp)</div><div class="said">–</div>
  <p>Kritan ritar bollens kontur i ett drag (4 s), väntar sedan bredvid och vickar: gisspaus 3 s</p><p class="ans">Ljud: kritan ritar · Ansikte: nyfiken</p></figcaption></figure>
<figure class="frame"><img src="frames/4c.jpg" alt="Bild 4c" loading="lazy"><figcaption>
  <div class="t">4c · 0:48.0 · 5.0 s · Lekplatsen, bollens utsnitt → helbild (klipp mitt i)</div><div class="said"><i>"En boll! Varsågod, hunden."</i> (0:48.4)</div>
  <p>Den riktiga bollen fylls i inifrån och guppar en gång på marken. Kritan flyger ut uppe till höger</p><p class="ans">Ljud: glitter · Ansikte: förvånad</p></figcaption></figure>
<figure class="frame"><img src="frames/5.jpg" alt="Bild 5" loading="lazy"><figcaption>
  <div class="t">5 · 0:53.0 · 5.9 s · Lekplatsen, halvbild hunden och bollen</div><div class="said"><i>"Ska vi säga tack?"</i> (0:53.3)</div>
  <p>Hunden tittar på bollen (riktning höger), öronen reser sig. Paus 4 s: barnet säger tack</p><p class="ans">Ljud: nyfiket <code>vov-ja</code> sent i pausen · Ansikte: nyfiken</p></figcaption></figure>
<figure class="frame"><img src="frames/6.jpg" alt="Bild 6" loading="lazy"><figcaption>
  <div class="t">6 · 0:58.8 · 4.0 s · Samma</div><div class="said"><i>"Tack!"</i> (0:58.8)</div>
  <p>Hunden nickar (trycks ihop och sträcks en gång), svansen viftar</p><p class="ans">Ljud: <code>vov-ja</code>, svansen viftar · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/7.jpg" alt="Bild 7" loading="lazy"><figcaption>
  <div class="t">7 · 1:02.8 · 5.9 s · Lekplatsen, helbild</div><div class="said"><i>"Oj! Nu puffar hunden på bollen!"</i> (1:04.1)</div>
  <p>Hunden lutar sig fram (<code>luta 4</code>) och puffar bollen med nosen; bollen glider en bit och guppar</p><p class="ans">Ljud: <code>nos</code>, mjukt <code>boing</code> · Ansikte: fnissig</p></figcaption></figure>
<figure class="frame"><img src="frames/8.jpg" alt="Bild 8" loading="lazy"><figcaption>
  <div class="t">8 · 1:08.7 · 7.5 s · Samma</div><div class="said"><i>"Ni pratar visst med varandra."</i> (1:12.3)</div>
  <p>Utbytet: hunden svarar, bollen guppar, hunden svarar, bollen guppar. En sak rör sig i taget. Repliken efter</p><p class="ans">Ljud: vov – boing – vov – boing (<code>vov-babbel</code>) · Ansikte: fnissig</p></figcaption></figure>
<figure class="frame"><img src="frames/9.jpg" alt="Bild 9" loading="lazy"><figcaption>
  <div class="t">9 · 1:16.2 · 6.8 s · Samma</div><div class="said"><i>"Oj! Bollen hoppade ner i hinken!"</i> (1:18.0)</div>
  <p>Hunden puffar en gång till, bollen gör en båge och landar mjukt i hinken (en röd kant syns ovanför hinkens kant)</p><p class="ans">Ljud: <code>hink-dunk</code>, <code>vov-fniss</code> · Ansikte: förvånad → fnissig</p></figcaption></figure>
<figure class="frame"><img src="frames/10.jpg" alt="Bild 10" loading="lazy"><figcaption>
  <div class="t">10 · 1:23.0 · 4.3 s · Lekplatsen, helbild</div><div class="said"><i>"Ska bollen rulla nu?"</i> (1:23.3)</div>
  <p>Bollen ligger framför hunden igen (klipp: ingen visar hur den kom upp ur hinken)</p><p class="ans">Ljud: <code>vov-ja</code> · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/11.jpg" alt="Bild 11" loading="lazy"><figcaption>
  <div class="t">11 · 1:27.3 · 7.6 s · Lekplatsen, helbild</div><div class="said"><i>"Rulla, rulla … där! Bakom stöveln."</i> (1:27.6)</div>
  <p>Bollen rullar åt höger och stannar bakom stöveln, en röd skiva syns bredvid skaftet. Hunden travar dit efter repliken</p><p class="ans">Ljud: <code>rull</code>, <code>vov-ja</code> på "där", trav · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/12.jpg" alt="Bild 12" loading="lazy"><figcaption>
  <div class="t">12 · 1:34.9 · 7.0 s · Lekplatsen, helbild</div><div class="said"><i>"Rulla, rulla … där! Bakom lekstugan."</i> (1:35.2)</div>
  <p>Bollen rullar hela vägen åt vänster och stannar bakom lekstugan, en röd bit syns vid hörnet. Hunden travar dit</p><p class="ans">Ljud: <code>rull</code>, <code>vov-ja</code> på "där", trav · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/13.jpg" alt="Bild 13" loading="lazy"><figcaption>
  <div class="t">13 · 1:41.9 · 7.5 s · Lekplatsen, halvbild hunden</div><div class="said"><i>"Oj, nu är bollen borta. Hunden vet inte var."</i> (1:42.9)</div>
  <p>Bollen rullar ut ur bild åt höger. Hunden tittar åt vänster, sedan åt höger (ögonen, huvudet vänds inte). Kullen syns inte i utsnittet</p><p class="ans">Ljud: <code>rull</code>, frågande <code>vov-pip</code> · Ansikte: nyfiken</p></figcaption></figure>
<figure class="frame"><img src="frames/14a.jpg" alt="Bild 14a" loading="lazy"><figcaption>
  <div class="t">14a · 1:49.4 · 4.8 s · Lekplatsen, närbild hunden</div><div class="said"><i>"Kan du hjälpa hunden? Kan du se var bollen är?"</i> (1:49.7)</div>
  <p>Frågan till barnet. Hunden tittar ut mot tittaren, öronen lyssnar</p><p class="ans">Ljud: – · Ansikte: nyfiken</p></figcaption></figure>
<figure class="frame"><img src="frames/14b.jpg" alt="Bild 14b" loading="lazy"><figcaption>
  <div class="t">14b · 1:54.3 · 5.0 s · Lekplatsen, närbild kullen (klipp)</div><div class="said">–</div>
  <p>Paus 5 s, bara kullen och rutschkanan syns. En röd kant av bollen sticker fram vid kullens fot. Efter 3 s skimrar den svagt</p><p class="ans">Ljud: tyst, ett svagt <code>lysmask</code> · Ansikte: – (hunden utanför bild)</p></figcaption></figure>
<figure class="frame"><img src="frames/15.jpg" alt="Bild 15" loading="lazy"><figcaption>
  <div class="t">15 · 1:59.3 · 5.5 s · Samma närbild</div><div class="said"><i>"Ja, där! Ja, bakom rutschkanan!"</i> (1:59.3)</div>
  <p>Bollen skimrar tydligt (stjärnor runt kanten)</p><p class="ans">Ljud: <code>tindra</code>, <code>vov-ja</code> (hunden utanför bild) · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/16.jpg" alt="Bild 16" loading="lazy"><figcaption>
  <div class="t">16 · 2:04.7 · 5.0 s · Lekplatsen, helbild</div><div class="said"><i>"Rulla, rulla … där!"</i> (2:05.0)</div>
  <p>Hunden har travat fram till kullen, bollen rullar fram bakom kullen och stannar framför hunden</p><p class="ans">Ljud: trav, <code>rull</code>, <code>vov-fniss</code> · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/17.jpg" alt="Bild 17" loading="lazy"><figcaption>
  <div class="t">17 · 2:09.7 · 5.0 s · Lekplatsen, halvbild</div><div class="said"><i>"Nu är hunden glad!"</i> (2:10.0)</div>
  <p>Hunden står med bollen bredvid, svansen viftar (±14° kring roten)</p><p class="ans">Ljud: <code>flamt-valp</code>, <code>svansvift</code> · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/18a.jpg" alt="Bild 18a" loading="lazy"><figcaption>
  <div class="t">18a · 2:14.7 · 7.1 s · Lekplatsen, närbild hunden</div><div class="said"><i>"Kan du kittla hunden på magen?"</i> (2:15.0)</div>
  <p>Frågan, sedan paus 4 s. Efter 2 s skimrar magen svagt</p><p class="ans">Ljud: tyst, svagt <code>lysmask</code> på magen · Ansikte: nyfiken</p></figcaption></figure>
<figure class="frame"><img src="frames/18b.jpg" alt="Bild 18b" loading="lazy"><figcaption>
  <div class="t">18b · 2:21.8 · 4.5 s · Samma närbild</div><div class="said"><i>"Kittel, kittel, kittel!"</i> (2:21.8)</div>
  <p>Kittel: hela figuren lutar ±5° tre gånger, fnissigt ansikte med öppna ögon, svansen viftar. Inga armar mot magen</p><p class="ans">Ljud: <code>vov-fniss</code> ×3 (⚠ inget långt fniss finns, se storyboard.md), <code>svansvift</code> · Ansikte: fnissig, öppna ögon</p></figcaption></figure>
<figure class="frame"><img src="frames/19.jpg" alt="Bild 19" loading="lazy"><figcaption>
  <div class="t">19 · 2:26.3 · 7.0 s · Lekplatsen, helbild</div><div class="said"><i>"Nu leker hunden! Hopp, hopp!"</i> (2:26.6)</div>
  <p>Två lugna skutt (20 px upp, tryck ihop före och efter) på "Hopp, hopp!", bollen bredvid</p><p class="ans">Ljud: <code>hopp-mjuk</code> ×2, <code>vov-fniss</code> · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/20.jpg" alt="Bild 20" loading="lazy"><figcaption>
  <div class="t">20 · 2:33.3 · 5.0 s · Lekplatsen, halvbild</div><div class="said"><i>"Hej då, hunden! Hej då, bollen!"</i> (2:33.6)</div>
  <p>Hunden vinkar (höger arm bakom kroppen, snett ut), bollen bredvid</p><p class="ans">Ljud: <code>vov-babbel</code> · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/21.jpg" alt="Bild 21" loading="lazy"><figcaption>
  <div class="t">21 · 2:38.3 · 5.5 s · Samma</div><div class="said"><i>"Hej då! Vi ses snart!"</i> (2:38.5)</div>
  <p>Hunden vinkar klart, armen sjunker</p><p class="ans">Ljud: <code>vov-fniss</code> · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/22.jpg" alt="Bild 22" loading="lazy"><figcaption>
  <div class="t">22 · 2:43.8 · 2.5 s · Lekplatsen → kritirisen</div><div class="said">–</div>
  <p>Kritirisen drar ihop sig runt hunden och bollen</p><p class="ans">Ljud: – · Ansikte: glad</p></figcaption></figure></div>
</div></body></html>
