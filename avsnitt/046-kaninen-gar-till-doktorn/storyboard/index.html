<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaninen går till doktorn</title>
<style>
:root { --paper:#fbfaf6; --card:#fff; --ink:#2a2620; --muted:#6e675c; --line:#e6e1d6; --rosa:#c2185b }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper:#1d1c22; --card:#26252c; --ink:#f1ede4; --muted:#a8a196; --line:#3a3842; --rosa:#f48fb1; color-scheme:dark } }
:root[data-theme="dark"] { --paper:#1d1c22; --card:#26252c; --ink:#f1ede4; --muted:#a8a196; --line:#3a3842; --rosa:#f48fb1; color-scheme:dark }
* { box-sizing:border-box }
body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.5 system-ui,sans-serif }
.wrap { max-width:1240px; margin:0 auto; padding:40px 16px 72px }
h1 { font-size:clamp(30px,6vw,52px); margin:0 } h1 span { color:var(--rosa) }
.lede { color:var(--muted); max-width:72ch }
.frames { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; margin-top:24px }
.frame { margin:0; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden }
.frame img { width:100%; height:auto; display:block }
figcaption { padding:12px 14px 14px; display:grid; gap:6px; font-size:14px } figcaption p { margin:0 }
.t { font:500 12px ui-monospace,monospace; color:var(--muted) }

.ans { color:var(--muted); font-size:13px }
</style></head><body><div class="wrap">
<h1>Kaninen går till doktorn <span>storyboard</span></h1>
<p class="lede">Avsnitt 046, piloten för Besöket, 3:52.5. En stillbild per uppslag, tajmad efter Malins klippta repliker och manusets pauser. Mottagningen (komposition v2), britsen, kaninens och doktorns v2-riggar, nallen, stetoskopet och öronlampan i kod. 47 bilder.</p>
<div class="frames"><figure class="frame"><img src="frames/00.jpg" alt="Bild 00" loading="lazy"><figcaption>
  <div class="t">00 · 0:00.0 · 1.0 s · Logotypen</div><div class="said">–</div>
  <p>Lilla Kritans logotyp i 1 s, sedan papperet</p><p class="ans">Ljud: – · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/01a.jpg" alt="Bild 01a" loading="lazy"><figcaption>
  <div class="t">01a · 0:01.0 · 8.5 s · Papperet, helbild</div><div class="said"><i>"Kritan ritar …"</i> (0:01.6)</div>
  <p>Kritan ritar kaninens kontur i lugna drag (7 s): kroppen, de långa öronen och armarna som egna drag</p><p class="ans">Ljud: kritan ritar · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/01b.jpg" alt="Bild 01b" loading="lazy"><figcaption>
  <div class="t">01b · 0:09.5 · 5.8 s · Papperet, helbild</div><div class="said"><i>"Hm … vad blir det nu?"</i> (0:09.5)</div>
  <p>Konturen klar, kritan väntar bredvid och svajar: barnet gissar</p><p class="ans">Ljud: tyst · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/01c.jpg" alt="Bild 01c" loading="lazy"><figcaption>
  <div class="t">01c · 0:15.3 · 3.9 s · Papperet → zoom in</div><div class="said"><i>"Oj! En kanin!"</i> (0:15.9)</div>
  <p>Kaninen fylls i inifrån. Zoom in i teckningen, in i mottagningen</p><p class="ans">Ljud: <code>glitter</code> · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/1.jpg" alt="Bild 1" loading="lazy"><figcaption>
  <div class="t">1 · 0:19.1 · 7.0 s · Mottagningen, helbild</div><div class="said"><i>"Hej, kaninen! Hej, hej!"</i> (0:22.5)</div>
  <p>Kaninen trippar in från vänster, stannar framför pallen och vinkar (armen bakom kroppen). Doktorn står vid britsens högra ände</p><p class="ans">Ljud: småsteg, hej · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/2.jpg" alt="Bild 2" loading="lazy"><figcaption>
  <div class="t">2 · 0:26.1 · 4.2 s · Halvbild: doktorn</div><div class="said"><i>"Titta, där är doktorn. Hej, doktorn!"</i> (0:26.9)</div>
  <p>Doktorn vinkar och ler (stetoskopet runt halsen)</p><p class="ans">Ljud: – · Ansikte: doktorn glad</p></figcaption></figure>
<figure class="frame"><img src="frames/3.jpg" alt="Bild 3" loading="lazy"><figcaption>
  <div class="t">3 · 0:30.3 · 4.2 s · Närbild: kaninen</div><div class="said"><i>"Idag är kaninen hos doktorn."</i> (0:30.7)</div>
  <p>Öronen faller lite, blicken ner</p><p class="ans">Ljud: frågande · Ansikte: nyfiken → lite osäker</p></figcaption></figure>
<figure class="frame"><img src="frames/4.jpg" alt="Bild 4" loading="lazy"><figcaption>
  <div class="t">4 · 0:34.5 · 5.7 s · Närbild: kaninen</div><div class="said"><i>"Oj. Kaninen är visst lite osäker."</i> (0:35.7)</div>
  <p>Kaninen tittar upp mot doktorn och ner igen. Malin efter blicken</p><p class="ans">Ljud: trumpen (mjuk) · Ansikte: lite osäker</p></figcaption></figure>
<figure class="frame"><img src="frames/5.jpg" alt="Bild 5" loading="lazy"><figcaption>
  <div class="t">5 · 0:40.2 · 6.8 s · Mottagningen, helbild</div><div class="said"><i>"Doktorn ska bara titta att du växer och mår bra."</i> (0:40.8) … <i>"Hm … vad gör vi nu?"</i> (0:44.4)</div>
  <p>Doktorn nickar lugnt. Paus 1 s, sedan <i>"Hm … vad gör vi nu?"</i></p><p class="ans">Ljud: – · Ansikte: lite osäker</p></figcaption></figure>
<figure class="frame"><img src="frames/6a.jpg" alt="Bild 6a" loading="lazy"><figcaption>
  <div class="t">6a · 0:47.0 · 5.4 s · Halvbild: kaninen</div><div class="said"><i>"Titta! Kritan ritar något."</i> (0:47.3)</div>
  <p>Kritan kommer in och ritar nallens kontur bredvid kaninen (4 s). Gisspaus 3 s</p><p class="ans">Ljud: kritan ritar · Ansikte: nyfiken</p></figcaption></figure>
<figure class="frame"><img src="frames/6b.jpg" alt="Bild 6b" loading="lazy"><figcaption>
  <div class="t">6b · 0:52.4 · 3.9 s · Halvbild: kaninen</div><div class="said"><i>"En nalle! Varsågod, kaninen."</i> (0:53.0)</div>
  <p>Nallen fylls i inifrån</p><p class="ans">Ljud: <code>glitter</code> · Ansikte: glittriga ögon</p></figcaption></figure>
<figure class="frame"><img src="frames/7.jpg" alt="Bild 7" loading="lazy"><figcaption>
  <div class="t">7 · 0:56.3 · 3.9 s · Halvbild: kaninen</div><div class="said"><i>"Ska vi säga tack?"</i> (0:56.6)</div>
  <p>Kaninen tittar på nallen, öronen reser sig. Paus 2,5 s</p><p class="ans">Ljud: nyfiken (5) · Ansikte: nyfiken</p></figcaption></figure>
<figure class="frame"><img src="frames/8.jpg" alt="Bild 8" loading="lazy"><figcaption>
  <div class="t">8 · 1:00.2 · 2.6 s · Halvbild: kaninen</div><div class="said"><i>"Tack!"</i> (1:00.7)</div>
  <p>Kaninen nickar direkt och kramar nallen</p><p class="ans">Ljud: förtjust · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/9.jpg" alt="Bild 9" loading="lazy"><figcaption>
  <div class="t">9 · 1:02.8 · 4.2 s · Närbild: kaninen med nallen</div><div class="said"><i>"Nallen är med. Då går det bra."</i> (1:03.2)</div>
  <p>Nallen i famnen, huvudet lutar mot nallen</p><p class="ans">Ljud: mysig suck (4) · Ansikte: blundar nöjt</p></figcaption></figure>
<figure class="frame"><img src="frames/10.jpg" alt="Bild 10" loading="lazy"><figcaption>
  <div class="t">10 · 1:07.0 · 5.2 s · Mottagningen, helbild</div><div class="said"><i>"Upp på britsen! Hopp … och hopp!"</i> (1:07.3)</div>
  <p>Kaninen skuttar upp på pallen (<i>"hopp"</i>), sedan på britsen (<i>"och hopp!"</i>), och sätter sig med nallen i famnen</p><p class="ans">Ljud: hopp × 2 · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/11a.jpg" alt="Bild 11a" loading="lazy"><figcaption>
  <div class="t">11a · 1:12.1 · 5.4 s · Halvbild: doktorn och kaninen</div><div class="said"><i>"Titta! Kritan ritar något."</i> (1:12.4)</div>
  <p>Kritan ritar stetoskopet i luften framför doktorn: slangen och bröstdelen streck för streck (3 s). Gisspaus 3 s</p><p class="ans">Ljud: kritan ritar · Ansikte: nyfiken</p></figcaption></figure>
<figure class="frame"><img src="frames/11b.jpg" alt="Bild 11b" loading="lazy"><figcaption>
  <div class="t">11b · 1:17.6 · 5.3 s · Halvbild: doktorn och kaninen</div><div class="said"><i>"Ett stetoskop! Med det lyssnar doktorn."</i> (1:18.2)</div>
  <p>Stetoskopet fylls i, doktorn tar det</p><p class="ans">Ljud: <code>glitter</code>, frågande · Ansikte: nyfiken</p></figcaption></figure>
<figure class="frame"><img src="frames/11c.jpg" alt="Bild 11c" loading="lazy"><figcaption>
  <div class="t">11c · 1:22.9 · 1.6 s · Halvbild: doktorn</div><div class="said">–</div>
  <p>Doktorn sätter propparna i öronen och sträcker bröstdelen mot britsen</p><p class="ans">Ljud: – · Ansikte: doktorn glad</p></figcaption></figure>
<figure class="frame"><img src="frames/12.jpg" alt="Bild 12" loading="lazy"><figcaption>
  <div class="t">12 · 1:24.5 · 5.6 s · Närbild: nallens mage</div><div class="said"><i>"Först nallen. Lyssna, lyssna … dunk, dunk!"</i> (1:24.9)</div>
  <p>Bröstdelen mot nallens mage, två små ringar på <i>"dunk, dunk"</i>. Doktorn i bild</p><p class="ans">Ljud: <code>dunk</code> × 2 (lågt) · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/13.jpg" alt="Bild 13" loading="lazy"><figcaption>
  <div class="t">13 · 1:30.1 · 6.2 s · Närbild: kaninens mage</div><div class="said"><i>"Nu kaninen. Lyssna, lyssna … dunk, dunk!"</i> (1:30.5)</div>
  <p>Bröstdelen mot kaninens mage, två små ringar. Doktorn i bild (Sanna: "place dr in frame")</p><p class="ans">Ljud: <code>dunk</code> × 2, fniss · Ansikte: fnissig</p></figcaption></figure>
<figure class="frame"><img src="frames/14.jpg" alt="Bild 14" loading="lazy"><figcaption>
  <div class="t">14 · 1:36.3 · 4.4 s · Halvbild: doktorn</div><div class="said"><i>"Fint! Doktorn hörde magen."</i> (1:36.7)</div>
  <p>Doktorn med stetoskopet i öronen nickar och ler</p><p class="ans">Ljud: ja · Ansikte: doktorn glad</p></figcaption></figure>
<figure class="frame"><img src="frames/15.jpg" alt="Bild 15" loading="lazy"><figcaption>
  <div class="t">15 · 1:40.8 · 7.5 s · Halvbild: kaninen</div><div class="said"><i>"Kan du visa var din mage är?"</i> (1:41.1) … <i>"Där!"</i> (1:46.7)</div>
  <p>Paus 4 s: barnet visar magen. Kaninen klappar sig på magen, <i>"Där!"</i></p><p class="ans">Ljud: <code>klapp</code> · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/16.jpg" alt="Bild 16" loading="lazy"><figcaption>
  <div class="t">16 · 1:48.2 · 4.3 s · Halvbild: doktorn</div><div class="said"><i>"Och här är en lampa. Doktorn tittar i öronen."</i> (1:48.6)</div>
  <p>Doktorn håller upp öronlampan, ljuset tänds</p><p class="ans">Ljud: <code>lampa-klick</code> · Ansikte: doktorn nyfiken</p></figcaption></figure>
<figure class="frame"><img src="frames/17.jpg" alt="Bild 17" loading="lazy"><figcaption>
  <div class="t">17 · 1:52.6 · 4.8 s · Närbild: nallens öra</div><div class="said"><i>"Först nallen. Titta, titta … fint!"</i> (1:53.0)</div>
  <p>Lampan lyser på nallens öra. Doktorn i bild</p><p class="ans">Ljud: <code>tindra</code> · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/18.jpg" alt="Bild 18" loading="lazy"><figcaption>
  <div class="t">18 · 1:57.4 · 7.5 s · Närbild: kaninens öra</div><div class="said"><i>"Nu kaninen. Vilka långa öron! Titta, titta … fint!"</i> (1:57.8)</div>
  <p>Lampan lyser på kaninens långa öra, örat glöder. Doktorn i bild</p><p class="ans">Ljud: förtjust (2) · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/19.jpg" alt="Bild 19" loading="lazy"><figcaption>
  <div class="t">19 · 2:04.9 · 4.2 s · Närbild: kaninens öra</div><div class="said"><i>"Oj! Örat ramlade ner!"</i> (2:05.7)</div>
  <p>Kaninens öra ramlar ner framför ögat (0,5 s). Malin efter</p><p class="ans">Ljud: fniss · Ansikte: fnissig</p></figcaption></figure>
<figure class="frame"><img src="frames/20.jpg" alt="Bild 20" loading="lazy"><figcaption>
  <div class="t">20 · 2:09.1 · 4.0 s · Närbild: kaninen</div><div class="said"><i>"Ha ha! Upp igen."</i> (2:09.9)</div>
  <p>Kaninen lyfter upp örat med tassen</p><p class="ans">Ljud: ja · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/21.jpg" alt="Bild 21" loading="lazy"><figcaption>
  <div class="t">21 · 2:13.1 · 7.6 s · Halvbild: kaninen</div><div class="said"><i>"Var är dina öron?"</i> (2:13.4) … <i>"Där!"</i> (2:18.6)</div>
  <p>Paus 4 s: barnet visar öronen. Kaninen vickar på öronen</p><p class="ans">Ljud: fniss (3) · Ansikte: fnissig</p></figcaption></figure>
<figure class="frame"><img src="frames/22.jpg" alt="Bild 22" loading="lazy"><figcaption>
  <div class="t">22 · 2:20.7 · 3.0 s · Mottagningen, helbild</div><div class="said"><i>"Nu ska doktorn titta i munnen."</i> (2:21.1)</div>
  <p>Doktorn nickar</p><p class="ans">Ljud: – · Ansikte: nyfiken</p></figcaption></figure>
<figure class="frame"><img src="frames/23.jpg" alt="Bild 23" loading="lazy"><figcaption>
  <div class="t">23 · 2:23.7 · 6.9 s · Närbild: nallen</div><div class="said"><i>"Först nallen. Gapa … oj! Nallen kan inte gapa!"</i> (2:24.1)</div>
  <p>Lampan framför nallens mun. Nallen gapar inte</p><p class="ans">Ljud: fniss · Ansikte: fnissig</p></figcaption></figure>
<figure class="frame"><img src="frames/24.jpg" alt="Bild 24" loading="lazy"><figcaption>
  <div class="t">24 · 2:30.6 · 4.4 s · Närbild: kaninen</div><div class="said"><i>"Nu kaninen. Gapa … aaa!"</i> (2:31.0)</div>
  <p>Lampan framför kaninens mun, kaninen gapar stort (O-munnen) på <i>"aaa"</i> (bara Malins aaa)</p><p class="ans">Ljud: – · Ansikte: gapar</p></figcaption></figure>
<figure class="frame"><img src="frames/25.jpg" alt="Bild 25" loading="lazy"><figcaption>
  <div class="t">25 · 2:35.1 · 9.0 s · Halvbild: kaninen</div><div class="said"><i>"Fint! Kan du också gapa?"</i> (2:35.5) … <i>"Aaa!"</i> (2:41.6)</div>
  <p>Kaninen stänger munnen och ser stolt ut. Paus 4 s: barnet gapar</p><p class="ans">Ljud: jippi · Ansikte: stolt</p></figcaption></figure>
<figure class="frame"><img src="frames/26.jpg" alt="Bild 26" loading="lazy"><figcaption>
  <div class="t">26 · 2:44.1 · 4.7 s · Mottagningen, helbild</div><div class="said"><i>"Oj! Var är nallen?"</i> (2:45.7)</div>
  <p>Kaninen klappar händerna. Nallen glider ur famnen, ner längs britsen och bakom pallen</p><p class="ans">Ljud: <code>klapp</code>, frågande · Ansikte: förvånad</p></figcaption></figure>
<figure class="frame"><img src="frames/27.jpg" alt="Bild 27" loading="lazy"><figcaption>
  <div class="t">27 · 2:48.7 · 4.1 s · Halvbild: kaninen</div><div class="said"><i>"Kaninen vet inte var nallen är."</i> (2:49.0)</div>
  <p>Kaninen tittar åt vänster, sedan åt höger, öronen faller lite</p><p class="ans">Ljud: frågande (7) · Ansikte: nyfiken → osäker</p></figcaption></figure>
<figure class="frame"><img src="frames/28.jpg" alt="Bild 28" loading="lazy"><figcaption>
  <div class="t">28 · 2:52.8 · 8.3 s · Helbild → närbild på pallen</div><div class="said"><i>"Kan du hjälpa kaninen? Kan du se var nallen är?"</i> (2:53.1)</div>
  <p>Bred bild för frågan, efter 3 s klipp till närbild: nallens öra tittar fram över pallens kant och skimrar</p><p class="ans">Ljud: tyst, sedan <code>tindra</code> · Ansikte: nyfiken</p></figcaption></figure>
<figure class="frame"><img src="frames/29.jpg" alt="Bild 29" loading="lazy"><figcaption>
  <div class="t">29 · 3:01.1 · 4.2 s · Närbild: pallen</div><div class="said"><i>"Ja, där! Bakom pallen!"</i> (3:01.4)</div>
  <p>Örat skimrar tydligt</p><p class="ans">Ljud: jippi · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/30.jpg" alt="Bild 30" loading="lazy"><figcaption>
  <div class="t">30 · 3:05.3 · 4.3 s · Mottagningen, helbild</div><div class="said"><i>"Där är du, nallen!"</i> (3:06.5)</div>
  <p>Kaninen skuttar ner, tar nallen och kramar den. Malin efter kramen</p><p class="ans">Ljud: hopp, mysig suck (4b) · Ansikte: blundar nöjt</p></figcaption></figure>
<figure class="frame"><img src="frames/31a.jpg" alt="Bild 31a" loading="lazy"><figcaption>
  <div class="t">31a · 3:09.6 · 5.4 s · Halvbild: kaninen</div><div class="said"><i>"Titta! Kritan ritar igen."</i> (3:09.9)</div>
  <p>Kritan ritar en stjärna i luften (konturen 2 s). Gisspaus 3 s</p><p class="ans">Ljud: kritan ritar · Ansikte: nyfiken</p></figcaption></figure>
<figure class="frame"><img src="frames/31b.jpg" alt="Bild 31b" loading="lazy"><figcaption>
  <div class="t">31b · 3:15.0 · 3.9 s · Halvbild: kaninen</div><div class="said"><i>"En stjärna! Ett klistermärke!"</i> (3:15.6)</div>
  <p>Stjärnan fylls i gul</p><p class="ans">Ljud: <code>glitter</code> · Ansikte: glittriga ögon</p></figcaption></figure>
<figure class="frame"><img src="frames/32.jpg" alt="Bild 32" loading="lazy"><figcaption>
  <div class="t">32 · 3:18.8 · 3.5 s · Halvbild: kaninen</div><div class="said"><i>"Till kaninen."</i> (3:19.8)</div>
  <p>Stjärnan glider till kaninens mage och klistras fast (<code>pop</code>). Malin efter</p><p class="ans">Ljud: <code>pop</code>, förtjust (2) · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/33.jpg" alt="Bild 33" loading="lazy"><figcaption>
  <div class="t">33 · 3:22.3 · 4.4 s · Halvbild: kaninen</div><div class="said"><i>"Och en till nallen!"</i> (3:23.3)</div>
  <p>En liten stjärna glider till nallen</p><p class="ans">Ljud: <code>pop</code>, fniss · Ansikte: fnissig</p></figcaption></figure>
<figure class="frame"><img src="frames/34.jpg" alt="Bild 34" loading="lazy"><figcaption>
  <div class="t">34 · 3:26.7 · 4.7 s · Halvbild: kaninen</div><div class="said"><i>"Bra, kaninen! Nu är det klart."</i> (3:27.5)</div>
  <p>Kaninen tittar ner på stjärnan, glatt skutt</p><p class="ans">Ljud: jippi · Ansikte: stolt</p></figcaption></figure>
<figure class="frame"><img src="frames/35.jpg" alt="Bild 35" loading="lazy"><figcaption>
  <div class="t">35 · 3:31.4 · 6.6 s · Mottagningen, helbild</div><div class="said"><i>"Ska vi säga tack till doktorn?"</i> (3:32.0) … <i>"Tack, doktorn!"</i> (3:36.1)</div>
  <p>Kaninen vänder sig mot doktorn och nickar, doktorn nickar tillbaka. Paus 2,5 s</p><p class="ans">Ljud: ja · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/36.jpg" alt="Bild 36" loading="lazy"><figcaption>
  <div class="t">36 · 3:38.0 · 2.5 s · Halvbild: doktorn</div><div class="said"><i>"Hej då, doktorn!"</i> (3:38.6)</div>
  <p>Doktorn vinkar</p><p class="ans">Ljud: – · Ansikte: doktorn glad</p></figcaption></figure>
<figure class="frame"><img src="frames/37.jpg" alt="Bild 37" loading="lazy"><figcaption>
  <div class="t">37 · 3:40.5 · 5.1 s · Halvbild: kaninen</div><div class="said"><i>"Hej då, kaninen! Hej då, nallen!"</i> (3:41.1)</div>
  <p>Kaninen vinkar med nallen i andra tassen (armen bakom kroppen)</p><p class="ans">Ljud: hej då · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/38.jpg" alt="Bild 38" loading="lazy"><figcaption>
  <div class="t">38 · 3:45.6 · 3.8 s · Halvbild: kaninen</div><div class="said"><i>"Hej då! Vi ses snart!"</i> (3:45.9)</div>
  <p>Samma, kaninen vinkar klart</p><p class="ans">Ljud: – · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/39.jpg" alt="Bild 39" loading="lazy"><figcaption>
  <div class="t">39 · 3:49.5 · 3.0 s · Kritirisen</div><div class="said">–</div>
  <p>Kritirisen runt kaninen och nallen, 0,6 s svart</p><p class="ans">Ljud: – · Ansikte: –</p></figcaption></figure></div>
