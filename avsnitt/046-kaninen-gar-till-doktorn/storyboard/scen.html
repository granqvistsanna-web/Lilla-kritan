<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Kaninen går till doktorn scener</title>
<style>html, body { margin:0; background:#000; } svg { width:100vw; height:auto; display:block; }</style>
</head>
<body>
<!-- 046 Kaninen går till doktorn: stillbilderna för storyboarden. window.rad(id) ritar radens bild (id som i rader.mjs, ?rad=13 visar en).
     Serveras från repots rot (bygg.mjs). Komposition v2 från närbildsprovet (../prov/narbilder.html): det tomma större rummet
     (mottagningen-tom.png), britsen med pallen och lampan som urklipp, kaninen-kanel (0,55) och doktorn-a (0,85) med stetoskopet och
     öronlampan i kod (verktyg/doktor-saker.js). I närbilderna med doktorns sak flyttas doktorn så att saken hamnar rätt (klipp). -->
<svg viewBox="0 0 1920 1080">
  <defs id="defs">
    <filter id="boil" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="5000">
      <feTurbulence id="brus" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
      <feDisplacementMap in="SourceGraphic" scale="5"/>
    </filter>
    <mask id="iris"><rect width="1920" height="1080" fill="#fff"/><circle id="irishal" cx="960" cy="540" r="300" fill="#000"/></mask>
  </defs>
  <rect width="1920" height="1080" fill="#FAF8F2"/>
  <g id="kamera">
    <g id="rummet"></g>
    <g filter="url(#boil)"><g id="bak"></g></g>
    <image id="brits" href="/assets/bakgrunder/mottagningen/cut/brits.png"/>
    <g filter="url(#boil)"><g id="figurer"></g></g>
    <g filter="url(#boil)"><g id="saker"></g></g>
    <g id="fram"></g>
  </g>
  <g id="papper"></g>
  <rect id="svart" width="1920" height="1080" fill="#111" mask="url(#iris)" display="none"/>
</svg>
<script src="/verktyg/blinka.js"></script>
<script src="/verktyg/doktor-saker.js"></script>
<script src="/produktion/youtube/shorts/godnatt/nalle-v2.js"></script>
<script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script>
const $ = id => document.getElementById(id), f1 = v => v.toFixed(1);
const lagg = (id, h) => $(id).insertAdjacentHTML('beforeend', h);
const A = '/assets/', R = A + 'rekvisita/';
const KRITA = R + 'krita-rod/cut/krita-rod.png', KRITA_SPETS = [742, 132];
// Gosedjuret: en liten leopard (Sanna 2026-11-20: "a new teddy animal … maybe a leo small", rekvisita/gosedjur-leopard.md), 676 × 867,
// utan ansikte; ansiktet är nallen v2:s kodansikte (nalle-v2.js) flyttat till leopardens huvud. (Variablerna heter fortfarande nalle.)
const NALLE = R + 'gosedjur-leopard/cut/gosedjur-leopard.png', NALLE_C = [338, 433], NALLE_H = 865, NALLE_WH = [676, 867], NALLE_ANS = 'translate(-75 40)';

// Mått (bakgrunder/mottagningen.md, komposition v2)
const RUM = { fil: A + 'bakgrunder/mottagningen/mottagningen-tom.png', w: 1876, h: 1058 }, RS = 1920 / RUM.w;
const BRITS = { w: 725, h: 536, x: 170, fot: 950, s: 1.25, dyna: 235 };
const DYNA_Y = BRITS.fot - (BRITS.h - BRITS.dyna) * BRITS.s;
const BRITS_TOPP = BRITS.fot - BRITS.h * BRITS.s;
const PALL = [BRITS.x + 177 * BRITS.s, BRITS_TOPP + 405 * BRITS.s];   // pallens övre kant, mitt (urklippet: x 80–275, y 405)
const KS = 0.55, PA_BRITS = [900, DYNA_Y + 105], PA_GOLV = [640, 990];
const DOKTOR = [1250, 985, 0.85];
const MAGE = [540, 700], ORA = [672, 190], MUN = [512, 470];   // kaninen (riggens 1024-ruta)
const NER = -30;   // kaninens armar lite nedåt (som 041)

let DL, KL, GD, GK, BL;
function kamera(z, cx, cy) { $('kamera').setAttribute('transform', `translate(${f1(960 - cx * z)} ${f1(540 - cy * z)}) scale(${z})`); }
const punkt = (el, x, y) => { const m = DOMMatrix.fromMatrix($('kamera').getCTM()).inverse().multiply(el.getCTM()); const q = m.transformPoint(new DOMPoint(x, y)); return [q.x, q.y]; };
let DPOS = [0, 0];
function doktorPa(x, y) { DPOS = [x, y]; GD.setAttribute('transform', `translate(${f1(x)} ${f1(y)}) scale(${DOKTOR[2]}) translate(-512 ${-DL.FOTTER})`); }
function kaninPa([x, y]) { GK.setAttribute('transform', `translate(${f1(x)} ${f1(y)}) scale(${KS}) translate(-512 ${-KL.FOTTER})`); }

// Saker: nallen (bild), kritan (bild), stetoskopet och stjärnan (kod). kontur: streckad grå, som konturen kritan ritar.
const nalle = (x, y, h = 210, kontur = false, mun = 0) => { const s = h / NALLE_H;
  return `<g transform="translate(${f1(x - NALLE_C[0] * s)} ${f1(y - NALLE_C[1] * s)}) scale(${s.toFixed(4)})" ${kontur ? 'style="filter:grayscale(1) brightness(1.6) contrast(.6)" opacity=".45"' : ''}>
    <image href="${NALLE}" width="${NALLE_WH[0]}" height="${NALLE_WH[1]}"/>${kontur ? '' : `<g transform="${NALLE_ANS}">${nalleAnsikte(0, mun)}</g>`}</g>`; };
const krita = (x, y, s = 0.33, v = -35) => `<image href="${KRITA}" width="755" height="265" transform="translate(${f1(x)} ${f1(y)}) scale(${s}) rotate(${v}) translate(${-KRITA_SPETS[0]} ${-KRITA_SPETS[1]})"/>`;
const stjarnaD = (x, y, r) => Array.from({ length: 10 }, (_, i) => { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.48 : r;
  return `${i ? 'L' : 'M'}${f1(x + rr * Math.cos(a))} ${f1(y + rr * Math.sin(a))}`; }).join(' ') + 'Z';
const stjarna = (x, y, r, kontur = false) => kontur
  ? `<path d="${stjarnaD(x, y, r)}" fill="none" stroke="#c99a1f" stroke-width="5" stroke-dasharray="10 8" stroke-linejoin="round"/>`
  : `<path d="${stjarnaD(x, y, r)}" fill="#ffd23f" stroke="#fff" stroke-width="${f1(r * 0.16)}" stroke-linejoin="round" paint-order="stroke"/>`;
// Stetoskopet i luften (kritans teckning): öronbygeln, slangen och bröstdelen
function stetoLuft(x, y, s = 1, kontur = false) {
  const st = kontur ? `stroke="#59616b" stroke-dasharray="9 7" opacity=".7"` : `stroke="${STETO.SLANG}"`;
  const d = `M${x - 40 * s} ${y - 70 * s} Q${x - 46 * s} ${y - 10 * s} ${x} ${y + 10 * s} Q${x + 46 * s} ${y - 10 * s} ${x + 40 * s} ${y - 70 * s} M${x} ${y + 10 * s} C${x} ${y + 70 * s} ${x - 70 * s} ${y + 80 * s} ${x - 80 * s} ${y + 130 * s}`;
  return `<g><path d="${d}" fill="none" ${st} stroke-width="${f1(10 * s)}" stroke-linecap="round"/>
    ${kontur ? `<circle cx="${f1(x - 80 * s)}" cy="${f1(y + 150 * s)}" r="${f1(22 * s)}" fill="none" ${st} stroke-width="5"/>` : `<g filter="url(#saksKant)">${brostdel(x - 80 * s, y + 150 * s, 22 * s)}</g>`}
    ${kontur ? '' : `<circle cx="${f1(x - 40 * s)}" cy="${f1(y - 72 * s)}" r="${f1(7 * s)}" fill="${STETO.SLANGLJUS}"/><circle cx="${f1(x + 40 * s)}" cy="${f1(y - 72 * s)}" r="${f1(7 * s)}" fill="${STETO.SLANGLJUS}"/>`}</g>`;
}
const ringar = (x, y) => [24, 46].map((r, i) => `<circle cx="${f1(x)}" cy="${f1(y)}" r="${r}" fill="none" stroke="#fff" stroke-width="${5 - 2 * i}" opacity="${0.9 - 0.4 * i}"/>`).join('');
const sken = (x, y, rx = 24, ry = 42) => `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${rx}" ry="${ry}" fill="#ffe680" opacity=".45"/>`;

// --- Uppslagen: vad som syns. k = kanin {pa, f, p}, d = doktor {f, p}, kam = kamera, n = nallen, plus saker ----------------------
const KF = (n, k = 1, o = {}) => ({ ...KL.blanda('neutral', n, k), ...o });
const KP = (n = 'neutral', o = {}) => { const p = { ...KL.blandaPose('neutral', n, 1), ...o }; return { ...p, armar: p.armar.map(a => a + NER) }; };
const DP = (n = 'neutral', o = {}) => ({ ...DL.blandaPose('neutral', n, 1), ...o });
const VINKAR = { armar: [0, 150] }, DVINKAR = { armar: [100, 0], armbage: [-30, 0] };
const SITT = (o = {}) => KP('sitter', o);
function S(id) {
  const brits = { pa: PA_BRITS, p: SITT(), f: KF('glad') }, golv = { pa: PA_GOLV, p: KP(), f: KF('glad') };
  return ({
    '00': { papper: 'tomt' }, '01a': { papper: 'kontur', krita: 1 }, '01b': { papper: 'kontur', krita: 2 }, '01c': { papper: 'fylld' },
    '1': { kam: 'hel', k: { ...golv, p: KP('neutral', VINKAR), f: KF('jatteglad') } },
    '2': { kam: 'doktor', k: golv, d: { p: DP('neutral', DVINKAR) } },
    '3': { kam: 'kaninNar', k: { ...golv, f: KF('ledsen', 0.4, { titt: [0, 6] }), p: KP('neutral', { oron: [12, 12] }) } },
    '4': { kam: 'kaninNar', k: { ...golv, f: KF('ledsen', 0.5, { titt: [8, -6] }), p: KP('neutral', { oron: [14, 14] }) } },
    '5': { kam: 'hel', k: { ...golv, f: KF('ledsen', 0.4), p: KP('neutral', { oron: [12, 12] }) }, d: { p: DP('neutral', { nick: [0.6, 0.6] }) } },
    '6a': { kam: 'kanin', k: { ...golv, f: KF('nyfiken') }, n: 'golv-kontur', krita: 'nalle' },
    '6b': { kam: 'kanin', k: { ...golv, f: KF('kawaii') }, n: 'golv' },
    '7': { kam: 'kanin', k: { ...golv, f: KF('nyfiken', 1, { titt: [10, 4] }) }, n: 'golv' },
    '8': { kam: 'kanin', k: { ...golv, p: KP('magen') }, n: 'famn' },
    '9': { kam: 'kaninNar', k: { ...golv, f: KF('sover', 0.8), p: KP('magen', { luta: 4 }) }, n: 'famn' },
    '10': { kam: 'hel', k: { ...brits, p: SITT({ fram: [1, 1] }) }, n: 'famn' },
    '11a': { kam: 'dokKanin', k: { ...brits, f: KF('nyfiken') }, n: 'famn', steto: 'kontur', krita: 'steto' },
    '11b': { kam: 'dokKanin', k: { ...brits, f: KF('nyfiken') }, n: 'famn', steto: 'fylld' },
    '11c': { kam: 'doktor', k: brits, n: 'famn', d: { p: DP('stetoskop') } },
    '12': { kam: 'nalleMage', k: brits, n: 'famn', d: { p: DP('stetoskop') }, ringar: 1 },
    '13': { kam: 'mage', k: { ...brits, f: KF('fnissig') }, n: 'famn', d: { p: DP('stetoskop') }, ringar: 1 },
    '14': { kam: 'doktor', k: brits, n: 'famn', d: { p: DP('stetoskop', { nick: [0.6, 0.6] }) } },
    '15': { kam: 'kanin', k: { ...brits, p: SITT({ fram: [1, 1] }) }, n: 'famn' },
    '16': { kam: 'doktor', k: brits, n: 'famn', d: { p: DP('lampa'), f: 'nyfiken' } },
    '17': { kam: 'nalleOra', k: brits, n: 'famn', d: { p: DP('lampa', { armar: [100, 0], armbage: [-70, 0] }), f: 'nyfiken' } },
    '18': { kam: 'ora', k: brits, n: 'famn', d: { p: DP('lampa', { armar: [100, 0], armbage: [-70, 0] }), f: 'nyfiken' } },
    '19': { kam: 'kaninNar', k: { ...brits, f: KF('fnissig'), p: SITT({ oron: [0, 75] }) }, n: 'famn' },
    '20': { kam: 'kaninNar', k: { ...brits, p: SITT({ oron: [0, 30], armar: [6, 70] }) }, n: 'famn' },
    '21': { kam: 'kanin', k: { ...brits, f: KF('fnissig'), p: SITT({ oron: [-10, 10] }) }, n: 'famn' },
    '22': { kam: 'hel', k: brits, n: 'famn', d: { p: DP('neutral', { nick: [0.6, 0.6] }), f: 'nyfiken' } },
    '23': { kam: 'nalleMun', k: { ...brits, f: KF('fnissig') }, n: 'famn', d: { p: DP('lampa', { armar: [70, 0], armbage: [-55, 0] }), f: 'nyfiken' } },
    '24': { kam: 'mun', k: { ...brits, f: KF('gapar') }, n: 'famn', d: { p: DP('lampa', { armar: [70, 0], armbage: [-55, 0] }), f: 'nyfiken' } },
    '25': { kam: 'kanin', k: { ...brits, f: KF('stolt'), p: SITT() }, n: 'famn' },
    '26': { kam: 'hel', k: { ...brits, f: KF('forvanad') }, n: 'faller' },
    '27': { kam: 'kanin', k: { ...brits, f: KF('nyfiken', 1, { titt: [-12, 0] }), p: SITT({ oron: [10, 10] }) }, n: 'pall' },
    '28': { kam: 'pall', k: brits, n: 'pall' },
    '29': { kam: 'pall', k: brits, n: 'pall', skimmer: 1 },
    '30': { kam: 'hel', k: { ...golv, f: KF('sover', 0.8), p: KP('magen') }, n: 'famn' },
    '31a': { kam: 'kanin', k: { ...golv, f: KF('nyfiken', 1, { titt: [0, -10] }) }, n: 'famn', stj: 'kontur', krita: 'stjarna' },
    '31b': { kam: 'kanin', k: { ...golv, f: KF('kawaii') }, n: 'famn', stj: 'luft' },
    '32': { kam: 'kanin', k: golv, n: 'famn', stj: 'mage' },
    '33': { kam: 'kanin', k: { ...golv, f: KF('fnissig') }, n: 'famn', stj: 'mage+nalle' },
    '34': { kam: 'kanin', k: { ...golv, f: KF('stolt'), p: KP('neutral', { lyft: -20 }) }, n: 'famn', stj: 'mage+nalle' },
    '35': { kam: 'hel', k: { ...golv, p: KP('neutral', { rikt: 0.6 }) }, n: 'famn', stj: 'mage+nalle', d: { p: DP('neutral', { nick: [0.6, 0.6] }) } },
    '36': { kam: 'doktor', k: golv, n: 'famn', stj: 'mage+nalle', d: { p: DP('neutral', DVINKAR) } },
    '37': { kam: 'kanin', k: { ...golv, f: KF('jatteglad'), p: KP('neutral', VINKAR) }, n: 'famn', stj: 'mage+nalle' },
    '38': { kam: 'kanin', k: { ...golv, p: KP('neutral', VINKAR) }, n: 'famn', stj: 'mage+nalle' },
    '39': { kam: 'hel', k: golv, n: 'famn', stj: 'mage+nalle', iris: 1 },
  })[id] || { kam: 'hel', k: golv };
}

function ritaRad(id) {
  const s = S(id); ['bak', 'saker', 'fram', 'papper'].forEach(n => $(n).innerHTML = '');
  $('svart').setAttribute('display', s.iris ? 'inline' : 'none');
  if (s.papper) return papper(s);
  const k = s.k || {}, d = s.d || {};
  kaninPa(k.pa || PA_GOLV); KL.rita(GK, BL(k.f || KF('glad'), 0.4), k.p || KP());
  doktorPa(DOKTOR[0], DOKTOR[1]);
  const dp = d.p || DP(), dpLjus = dp.lampa >= 0.5 ? { ...dp, ljus: 1 } : dp;
  DL.rita(GD, BL(DL.blanda('neutral', d.f || 'glad', 1), 0.4), dpLjus);
  kamera(1, 960, 540);
  const mage = punkt(GK.querySelector('.mage'), MAGE[0], MAGE[1]);
  // nallen
  const NH = 210;
  if (s.n === 'famn') lagg('saker', nalle(mage[0], mage[1] + 10, NH));
  if (s.n === 'golv' || s.n === 'golv-kontur') lagg('saker', nalle(PA_GOLV[0] + 230, PA_GOLV[1] - NH * 0.48, NH, s.n === 'golv-kontur'));
  if (s.n === 'faller') lagg('saker', nalle(PALL[0] + 140, PALL[1] - 40, NH * 0.9) + `<path d="M${f1(mage[0])} ${f1(mage[1])} Q${f1(PALL[0] + 260)} ${f1(PALL[1] - 200)} ${f1(PALL[0] + 150)} ${f1(PALL[1] - 60)}" fill="none" stroke="#9b6bd6" stroke-width="5" stroke-dasharray="14 10"/>`);
  if (s.n === 'pall') lagg('bak', nalle(PALL[0] - 30, PALL[1] + 45, NH));   // bakom pallen: bara örat ovanför pallens kant
  // stjärnorna
  if (s.stj === 'kontur') lagg('saker', stjarna(mage[0] + 160, mage[1] - 260, 46, true));
  if (s.stj === 'luft') lagg('saker', stjarna(mage[0] + 160, mage[1] - 260, 46));
  if (s.stj?.startsWith('mage')) lagg('saker', stjarna(mage[0] + 60, mage[1] - 70, 24));
  if (s.stj === 'mage+nalle') lagg('saker', stjarna(mage[0] - 20, mage[1] + 10, 14));
  // stetoskopet som kritan ritar, framför doktorn
  const SL = [1080, 400];
  if (s.steto) lagg('fram', stetoLuft(SL[0], SL[1], 1.3, s.steto === 'kontur'));
  // kritan
  const kr = { nalle: [PA_GOLV[0] + 300, PA_GOLV[1] - 300], steto: [SL[0] + 40, SL[1] - 120], stjarna: [mage[0] + 210, mage[1] - 300] }[s.krita];
  if (kr) lagg('fram', krita(kr[0], kr[1]));
  // kameran
  const huvud = punkt(GK.querySelector('.drag'), 512, 470), dhuvud = () => punkt(GD.querySelector('.drag'), 512, 420);
  const naraSak = (mal, sak) => { const [x, y] = sak(); doktorPa(DPOS[0] + mal[0] - x, DPOS[1] + mal[1] - y); };
  const brostdelPos = () => { const b = GD.querySelectorAll('.steto-fram circle'), c = b[b.length - 2]; return punkt(c, +c.getAttribute('cx'), +c.getAttribute('cy')); };
  const lampSpets = () => punkt(GD.querySelector('.lampa'), -96, 0);
  const NS = 210 / NALLE_H, np = ([x, y]) => [mage[0] + (x - NALLE_C[0]) * NS, mage[1] + 10 + (y - NALLE_C[1]) * NS];
  const nalleMage = np([396, 592]), nalleOra = np([554, 110]), nalleMun = np([350, 378]);   // leopardens mage, högra öra, mun
  switch (s.kam) {
    case 'hel': kamera(1, 960, 540); break;
    case 'kanin': kamera(1.6, huvud[0], huvud[1] + 60); break;
    case 'kaninNar': kamera(2.3, huvud[0], huvud[1] + 10); break;
    case 'doktor': { const [x, y] = dhuvud(); kamera(1.9, x - 160, y + 60); break; }
    case 'dokKanin': kamera(1.35, 1060, 520); break;
    case 'mage': { const m = s.n === 'famn' ? [mage[0] + 95, mage[1] - 35] : mage;   // nallen sitter framför magen: magen till höger om nallens huvud
      naraSak(m, brostdelPos); lagg('fram', ringar(...m)); kamera(1.9, m[0] + 40, m[1] - 40); break; }
    case 'nalleMage': naraSak(nalleMage, brostdelPos); lagg('fram', ringar(...nalleMage)); kamera(1.9, nalleMage[0] + 40, nalleMage[1] - 110); break;
    case 'ora': { const o = punkt(GK.querySelector('image.ear-r'), ORA[0], ORA[1]); naraSak([o[0] + 18, o[1]], lampSpets); lagg('fram', sken(o[0] - 12, o[1])); kamera(1.45, o[0] + 120, o[1] + 230); break; }
    case 'nalleOra': naraSak([nalleOra[0] + 18, nalleOra[1]], lampSpets); lagg('fram', sken(nalleOra[0] - 6, nalleOra[1], 18, 18)); kamera(1.7, nalleOra[0] + 160, nalleOra[1] + 80); break;
    case 'mun': { const m = punkt(GK.querySelector('.drag'), MUN[0], MUN[1]); naraSak([m[0] + 60, m[1]], lampSpets); lagg('fram', sken(m[0] + 20, m[1], 28, 22)); kamera(1.8, m[0] + 120, m[1] + 40); break; }
    case 'nalleMun': naraSak([nalleMun[0] + 60, nalleMun[1]], lampSpets); lagg('fram', sken(nalleMun[0] + 24, nalleMun[1], 22, 18)); kamera(1.8, nalleMun[0] + 120, nalleMun[1] + 20); break;
    case 'pall': kamera(2.4, PALL[0], PALL[1] - 20); break;
  }
  if (s.skimmer) lagg('fram', [0, 1, 2, 3].map(i => { const a = i * Math.PI / 2 + 0.4, x = PALL[0] - 60 + 70 * Math.cos(a), y = PALL[1] - 30 + 50 * Math.sin(a);
    return `<path d="M${f1(x - 10)} ${f1(y)} L${f1(x + 10)} ${f1(y)} M${f1(x)} ${f1(y - 10)} L${f1(x)} ${f1(y + 10)}" stroke="#fff7b0" stroke-width="5" stroke-linecap="round"/>`; }).join(''));
  if (s.iris) { const [x, y] = punkt(GK.querySelector('.drag'), 512, 600); $('irishal').setAttribute('cx', x); $('irishal').setAttribute('cy', y); $('irishal').setAttribute('r', 330); }
}

// Ritintrot: kaninen på papperet, kontur (blek) eller ifylld
function papper(s) {
  lagg('papper', `<rect width="1920" height="1080" fill="#FAF8F2"/><g id="pk" filter="url(#boil)"></g>`);
  if (s.papper === 'tomt') return;
  const g = KL.figur(960, 940, 0.7, $('pk')); KL.rita(g, BL(KF('glad'), 0.4), KP());
  if (s.papper === 'kontur') { g.setAttribute('style', 'filter:grayscale(1) brightness(1.5) contrast(.5)'); g.setAttribute('opacity', '.5');
    lagg('papper', krita(s.krita === 2 ? 1320 : 1180, s.krita === 2 ? 520 : 300, 0.5)); }
}

window.rad = id => { ritaRad(id); $('brus').setAttribute('seed', 3); };
window.klar = (async () => {
