<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Kaninen går till doktorn</title>
<style>html, body { margin:0; background:#000; } svg { width:100vw; height:100vh; display:block; }</style>
</head>
<body>
<!-- 046 Kaninen går till doktorn: hela kodscenen (grind 6). Komposition och mått som storyboarden (../../storyboard/scen.html), tiden och
     raderna ur rader.json (skrivs av storyboard/bygg.mjs). Rendera: node verktyg/render-delat.mjs avsnitt/046-kaninen-gar-till-doktorn/scener/mottagningen [--snabb].
     Bara hårda klipp; den enda åkningen är zoomen in i teckningen. Kritan är liten, utan ansikte, knackar aldrig. Doktorn är tyst och står
     still vid britsen (rör armen, nickar, vinkar); i närbilderna flyttas doktorn så att bröstdelen eller lampan hamnar rätt (klipp).
     Rad 00 (logotypen) läggs på i sammanslagningen. -->
<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs id="defs">
    <filter id="boil" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="5000">
      <feTurbulence id="brus" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
      <feDisplacementMap id="boilStyrka" in="SourceGraphic" scale="2.5"/>
    </filter>
    <filter id="mjukStrale" x="-0.2" y="-0.2" width="1.4" height="1.4"><feGaussianBlur stdDeviation="14"/></filter>   <!-- mjuka strålar i sakbilderna -->
    <mask id="iris"><rect width="1920" height="1080" fill="#fff"/><circle id="irishal" cx="960" cy="540" r="300" fill="#000"/></mask>
  </defs>
  <rect width="1920" height="1080" fill="#FAF8F2"/>
  <g id="kamera">
    <g id="rummet"></g>
    <g filter="url(#boil)"><g id="bak"></g></g>
    <image id="brits" href="/assets/bakgrunder/mottagningen/cut/brits.png"/>
    <g filter="url(#boil)"><g id="figurer"></g></g>
    <g filter="url(#boil)"><g id="saker"></g></g>
    <g id="fram"></g>
  </g>
  <g id="papper"></g>
  <g id="ram"></g>
</svg>
<script src="/verktyg/blinka.js"></script>
<script src="/verktyg/doktor-saker.js"></script>
<script src="/produktion/youtube/shorts/godnatt/nalle-v2.js"></script>
<script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script>
const $ = id => document.getElementById(id), f1 = v => v.toFixed(1);
const lagg = (id, h) => $(id).insertAdjacentHTML('beforeend', h);
const A = '/assets/', R = A + 'rekvisita/';
const KRITA = R + 'krita-rod/cut/krita-rod.png', KRITA_SPETS = [742, 132];
// Gosedjuret: en liten leopard (Sanna 2026-11-20: "a new teddy animal … maybe a leo small", rekvisita/gosedjur-leopard.md), 676 × 867,
// utan ansikte; ansiktet är nallen v2:s kodansikte (nalle-v2.js) flyttat till leopardens huvud. (Variablerna heter fortfarande nalle.)
const NALLE = R + 'gosedjur-leopard/cut/gosedjur-leopard.png', NALLE_C = [338, 433], NALLE_H = 865, NALLE_WH = [676, 867], NALLE_ANS = 'translate(-75 40)';

// Mått (bakgrunder/mottagningen.md, komposition v2)
const RUM = { fil: A + 'bakgrunder/mottagningen/mottagningen-tom.png', w: 1876, h: 1058 }, RS = 1920 / RUM.w;
const BRITS = { w: 725, h: 536, x: 170, fot: 950, s: 1.25, dyna: 235 };
const DYNA_Y = BRITS.fot - (BRITS.h - BRITS.dyna) * BRITS.s;
const BRITS_TOPP = BRITS.fot - BRITS.h * BRITS.s;
const PALL = [BRITS.x + 177 * BRITS.s, BRITS_TOPP + 405 * BRITS.s];   // pallens övre kant, mitt (urklippet: x 80–275, y 405)
const KS = 0.55, PA_BRITS = [900, DYNA_Y + 105], PA_GOLV = [640, 990];
const DOKTOR = [1190, 985, 0.85];   // närmare kaninen (Sanna 2026-11-20)
const MAGE = [540, 700], ORA = [672, 190], MUN = [512, 470];   // kaninen (riggens 1024-ruta)
const NER = -30;   // kaninens armar lite nedåt (som 041)

let DL, KL, GD, GK, BL;
// kameran stannar alltid inne i rummet (1920 × 1080): mitten hålls så att bildens kanter inte går utanför
function kamera(z, cx, cy) { cx = kl(cx, 960 / z, 1920 - 960 / z); cy = kl(cy, 540 / z, 1080 - 540 / z); $('kamera').setAttribute('transform', `translate(${f1(960 - cx * z)} ${f1(540 - cy * z)}) scale(${z})`); }
const punkt = (el, x, y) => { const m = DOMMatrix.fromMatrix($('kamera').getCTM()).inverse().multiply(el.getCTM()); const q = m.transformPoint(new DOMPoint(x, y)); return [q.x, q.y]; };
let DPOS = [0, 0], LEOK = null;
function doktorPa(x, y) { DPOS = [x, y]; GD.setAttribute('transform', `translate(${f1(x)} ${f1(y)}) scale(${DOKTOR[2]}) translate(-512 ${-DL.FOTTER})`); }
function kaninPa([x, y]) { GK.setAttribute('transform', `translate(${f1(x)} ${f1(y)}) scale(${KS}) translate(-512 ${-KL.FOTTER})`); }

// Saker: nallen (bild), kritan (bild), stetoskopet och stjärnan (kod). kontur: streckad grå, som konturen kritan ritar.
const nalle = (x, y, h = 210, kontur = false, mun = 0) => { const s = h / NALLE_H;
  return `<g transform="translate(${f1(x - NALLE_C[0] * s)} ${f1(y - NALLE_C[1] * s)}) scale(${s.toFixed(4)})" ${kontur ? 'style="filter:grayscale(1) brightness(1.6) contrast(.6)" opacity=".45"' : ''}>
    <image href="${NALLE}" width="${NALLE_WH[0]}" height="${NALLE_WH[1]}"/>${kontur ? '' : `<g transform="${NALLE_ANS}">${nalleAnsikte(0, mun)}</g>`}</g>`; };
let KZ = 1;   // radens kamerazoom: kritan ritas lika liten i bild hur nära kameran än går
const krita = (x, y, s = 0.33 / Math.sqrt(KZ), v = 125) => `<image href="${KRITA}" width="755" height="265" transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(v)}) scale(${s.toFixed(3)}) translate(${-KRITA_SPETS[0]} ${-KRITA_SPETS[1]})"/>`;
const stjarnaD = (x, y, r) => Array.from({ length: 10 }, (_, i) => { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.48 : r;
  return `${i ? 'L' : 'M'}${f1(x + rr * Math.cos(a))} ${f1(y + rr * Math.sin(a))}`; }).join(' ') + 'Z';
const stjarna = (x, y, r, kontur = false) => kontur
  ? `<path d="${stjarnaD(x, y, r)}" fill="none" stroke="#c99a1f" stroke-width="5" stroke-dasharray="10 8" stroke-linejoin="round"/>`
  : `<path d="${stjarnaD(x, y, r)}" fill="#ffd23f" stroke="#fff" stroke-width="${f1(r * 0.16)}" stroke-linejoin="round" paint-order="stroke"/>`;
// Stetoskopet i luften (kritans teckning): öronbygeln, slangen och bröstdelen
function stetoLuft(x, y, s = 1, kontur = false) {
  const st = kontur ? `stroke="#59616b" stroke-dasharray="9 7" opacity=".7"` : `stroke="${STETO.SLANG}"`;
  const d = `M${x - 40 * s} ${y - 70 * s} Q${x - 46 * s} ${y - 10 * s} ${x} ${y + 10 * s} Q${x + 46 * s} ${y - 10 * s} ${x + 40 * s} ${y - 70 * s} M${x} ${y + 10 * s} C${x} ${y + 70 * s} ${x - 70 * s} ${y + 80 * s} ${x - 80 * s} ${y + 130 * s}`;
  return `<g><path d="${d}" fill="none" ${st} stroke-width="${f1(10 * s)}" stroke-linecap="round"/>
    ${kontur ? `<circle cx="${f1(x - 80 * s)}" cy="${f1(y + 150 * s)}" r="${f1(22 * s)}" fill="none" ${st} stroke-width="5"/>` : `<g filter="url(#saksKant)">${brostdel(x - 80 * s, y + 150 * s, 22 * s)}</g>`}
    ${kontur ? '' : `<circle cx="${f1(x - 40 * s)}" cy="${f1(y - 72 * s)}" r="${f1(7 * s)}" fill="${STETO.SLANGLJUS}"/><circle cx="${f1(x + 40 * s)}" cy="${f1(y - 72 * s)}" r="${f1(7 * s)}" fill="${STETO.SLANGLJUS}"/>`}</g>`;
}
const ringar = (x, y) => [24, 46].map((r, i) => `<circle cx="${f1(x)}" cy="${f1(y)}" r="${r}" fill="none" stroke="#fff" stroke-width="${5 - 2 * i}" opacity="${0.9 - 0.4 * i}"/>`).join('');
const sken = (x, y, rx = 24, ry = 42) => `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${rx}" ry="${ry}" fill="#ffe680" opacity=".25"/>`;   // svagare sken (Sanna: "less bright light")

// Kritirisen (som 045): en svart ram med en vågig krämvit vaxkant som drar ihop sig runt figuren, sedan 0,6 s svart.
function kritiris(r, [cx, cy]) {
  if (r >= 1500) return;
  const ring = 'M' + Array.from({ length: 145 }, (_, j) => { const a = j / 144 * 2 * Math.PI, rr = r * (1 + 0.06 * Math.sin(9 * a + TT * 0.8));
    return `${(cx + rr * Math.cos(a)).toFixed(1)} ${(cy + rr * Math.sin(a)).toFixed(1)}`; }).join('L') + 'Z';
  lagg('ram', `<path d="M-50 -50H1970V1130H-50Z ${r > 1 ? ring : ''}" fill="#101010" fill-rule="evenodd"/>
    ${r > 1 ? `<path d="${ring}" fill="none" stroke="#fff8e0" stroke-width="${Math.min(14, r / 4)}" stroke-linejoin="round" filter="url(#boil)"/>` : ''}`);
}
// Små hjärtan när kaninen kramar leoparden (Sanna 2026-11-20: "little hearts on hugging leo"): tre röda hjärtan med vit kant stiger
// upp mellan kaninens ansikte och leoparden och tonar bort, 0,5 s isär, från t0 sekunder in i raden.
const hjartaD = (x, y, r) => `M${f1(x)} ${f1(y + r * 0.9)} C${f1(x - r * 1.6)} ${f1(y - r * 0.2)} ${f1(x - r * 1.1)} ${f1(y - r * 1.6)} ${f1(x)} ${f1(y - r * 0.7)} C${f1(x + r * 1.1)} ${f1(y - r * 1.6)} ${f1(x + r * 1.6)} ${f1(y - r * 0.2)} ${f1(x)} ${f1(y + r * 0.9)}Z`;
// Små rosa hjärtan (Sanna 2026-11-21: "pink animated hearts"): fyra hjärtan stiger i en mjuk slinga, slår som ett hjärta
// (pulserar), vickar lite och tonas ut. Bredvid ansiktet, aldrig över det.
const hjartan = (x, y, tl, t0 = 0) => [0, 0.4, 0.8, 1.2].map((a, i) => { const u = (tl - t0 - a) / 1.9; if (u < 0 || u > 1) return '';
  const hx = x + [-34, 30, -6, 44][i] + 16 * Math.sin(u * 5 + i * 1.7), hy = y - 150 * mjuk(u) + [0, 20, -10, 30][i];
  const puls = 1 + 0.16 * Math.max(0, Math.sin(2 * Math.PI * 2.2 * (tl - a))) ** 3, r = (11 + [3, 0, 5, -1][i] + 4 * Math.sin(Math.PI * u)) * puls * Math.min(1, 5 * u);
  const fg = ['#F48FB1', '#F7A8C6', '#EC6FA0', '#F9B8D0'][i];
  return `<g transform="rotate(${f1(12 * Math.sin(u * 7 + i))} ${f1(hx)} ${f1(hy)})"><path d="${hjartaD(hx, hy, r)}" fill="${fg}" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" opacity="${f1(Math.min(1, 4 * (1 - u)))}"/></g>`; }).join('');

// Krit-gnistor (som ritintrot): fyruddiga gula klistermärken med vit kant som poppar fram en i taget runt saken och krymper bort.
const gnistaD = (x, y, r) => `M${f1(x)} ${f1(y - r)} Q${f1(x + r * 0.18)} ${f1(y - r * 0.18)} ${f1(x + r)} ${f1(y)} Q${f1(x + r * 0.18)} ${f1(y + r * 0.18)} ${f1(x)} ${f1(y + r)} Q${f1(x - r * 0.18)} ${f1(y + r * 0.18)} ${f1(x - r)} ${f1(y)} Q${f1(x - r * 0.18)} ${f1(y - r * 0.18)} ${f1(x)} ${f1(y - r)}Z`;
function gnistor(cx, cy, R, t, n = 5) { return Array.from({ length: n }, (_, i) => { const t0 = 0.25 * i, u = (t - t0) / 1.4; if (u < 0 || u > 1) return '';
  const a = -Math.PI / 2 + i * 2 * Math.PI / n + 0.4, x = cx + R * Math.cos(a), y = cy + R * 0.8 * Math.sin(a), r = 44 * Math.sin(Math.PI * Math.min(1, u * 1.6)) * (1 - 0.3 * u);
  return r > 0.5 ? `<path d="${gnistaD(x, y, r)}" fill="#ffd23f" stroke="#fff" stroke-width="6" stroke-linejoin="round" paint-order="stroke" transform="rotate(${f1(20 * u)} ${f1(x)} ${f1(y)})"/>` : ''; }).join(''); }
// Sakbilden: saken ensam mitt i bild mot en rosa kritbakgrund, lite gungning, gnistor när den nämns
function sakbild(s, tl) {
  lagg('papper', `<rect width="1920" height="1080" fill="#F6C3D3"/><rect width="1920" height="1080" fill="#fff" opacity=".12" filter="url(#boil)"/><g id="sb" filter="url(#boil)"></g>`);
  // ljusstrålar bakom saken (Sanna 2026-11-20: "light beams for objects"): 12 mjuka kilar från mitten, roterar långsamt, tonas in
  const ink = del(0, 0.8, tl), rot = 3 * tl, N = 12;   // långsamt (Sanna: "not too fast")
  lagg('papper', `<g opacity="${(0.24 * ink).toFixed(2)}" transform="rotate(${f1(rot)} 960 540)" filter="url(#mjukStrale)">${Array.from({ length: N }, (_, i) => { const a = i * 2 * Math.PI / N, b = a + Math.PI / N * 0.55, R = 1400;
    return `<path d="M960 540 L${f1(960 + R * Math.cos(a))} ${f1(540 + R * Math.sin(a))} L${f1(960 + R * Math.cos(b))} ${f1(540 + R * Math.sin(b))}Z" fill="#fff"/>`; }).join('')}</g>
    <circle cx="960" cy="540" r="${f1(330 + 12 * Math.sin(tl * 2))}" fill="#fff" opacity="${(0.2 * ink).toFixed(2)}" filter="url(#mjukStrale)"/>`);
  lagg('papper', `<g id="sb2" filter="url(#boil)"></g>`);
  const g = 1 + 0.025 * Math.sin(tl * 1.2), v = 2.5 * Math.sin(tl * 0.9);
  let h = `<g filter="url(#sakKantStor)"><g transform="translate(960 560) rotate(${f1(v)}) scale(${g.toFixed(3)}) translate(-960 -560)">`;
  if (s.sak === 'steto') h += stetoFylld([1020, 425], 1.85);   // lite lägre (Sanna: "1.27 lower stetoscop a bit")
  let sken = '';   // lampans sken ritas utanför den vita kanten (annars får skenet en ring)
  if (s.sak === 'lampa') { const lj = s.ljus ?? 1; h += oronlampa(1120, 560, -6, 5.2, 0);
    sken = `<g opacity="${lj.toFixed(2)}" filter="url(#mjukStrale)"><ellipse cx="500" cy="590" rx="170" ry="130" fill="#fff3b0" opacity=".35"/><circle cx="560" cy="585" r="60" fill="#fff6c8" opacity=".6"/></g>`; }
  $('sb2').innerHTML = sken + h + '</g></g>' + gnistor(960, 540, 420, tl - (s.gnista ?? 0.4));
}

// Klockan på väggen (Sanna 2026-11-20: "add a clock on wall behind"): rund, korallröd kant som britsen, krämvit urtavla, fyra
// streck, två visare och en prick i mitten, vit klistermärkeskant. Ritas en gång i rummet (står still, inget tickande ljud).
const klocka = (x, y, r) => `<g filter="url(#saksKant)"><g filter="url(#boil)">
  <circle cx="${x}" cy="${y}" r="${r}" fill="#E8695A"/><circle cx="${x}" cy="${y}" r="${f1(r * 0.8)}" fill="#FBF7EE"/>
  ${[0, 1, 2, 3].map(i => { const a = i * Math.PI / 2; return `<line x1="${f1(x + r * 0.62 * Math.cos(a))}" y1="${f1(y + r * 0.62 * Math.sin(a))}" x2="${f1(x + r * 0.72 * Math.cos(a))}" y2="${f1(y + r * 0.72 * Math.sin(a))}" stroke="#3a2c28" stroke-width="${f1(r * 0.07)}" stroke-linecap="round"/>`; }).join('')}
  <line x1="${x}" y1="${y}" x2="${f1(x + r * 0.32)}" y2="${f1(y - r * 0.22)}" stroke="#3a2c28" stroke-width="${f1(r * 0.09)}" stroke-linecap="round"/>
  <line x1="${x}" y1="${y}" x2="${x}" y2="${f1(y - r * 0.55)}" stroke="#3a2c28" stroke-width="${f1(r * 0.065)}" stroke-linecap="round"/>
  <circle cx="${x}" cy="${y}" r="${f1(r * 0.08)}" fill="#E8695A"/></g></g>`;

// --- Tid ------------------------------------------------------------------------------------------------------------------------
const kl = (k, a = 0, b = 1) => Math.max(a, Math.min(b, k)), lerp = (a, b, k) => a + (b - a) * k;
const mjuk = k => (k = kl(k), k * k * (3 - 2 * k)), del = (a, b, t) => mjuk((t - a) / (b - a));
const bump = (a, b, t) => (t <= a || t >= b) ? 0 : Math.sin(Math.PI * (t - a) / (b - a));
const lerp2 = (A, B, k) => [lerp(A[0], B[0], k), lerp(A[1], B[1], k)];
let TT = 0, RAD_L = [], RR = {}, ROSTER = [], DURATION = 0, CUR = null;
const SVART = 0.6;
const ML = n => ROSTER[n - 1][1];                                 // replikens längd
const MT = (i = 0) => (CUR.malin || [])[i]?.[1] ?? 0;             // när radens i:te replik börjar (s in i raden)
const LT = f => (CUR.ljud || []).filter(x => x[0].startsWith(f)).map(x => x[1]);   // när radens effekter med namnet börjar

// kaninen andas (som 041), öronen rör sig lite
const liv = (p, t) => { const a = (1 - Math.cos(2 * Math.PI * t / 3.6)) / 2;
  return { ...p, strack: p.strack + 0.014 * a, bred: p.bred + 0.007 * a, oron: p.oron.map((o, i) => o - 2 * a + (i ? -1 : 1) * 1.5 * Math.sin(t * 1.3 + 2 * i)) }; };
// skutt från A till B (fötterna), höjd h, under [a, b] sekunder in i raden
const skuttPos = (A, B, tl, a, b, h = 120) => { const u = kl((tl - a) / (b - a)); return { pa: [lerp(A[0], B[0], mjuk(u)), lerp(A[1], B[1], u) - h * Math.sin(Math.PI * u)], u }; };
const vinka = (p, tl, i = 1, f = 1.15, k = 1) => { const a = [...p.armar]; a[i] = a[i] + k * (150 + 12 * Math.sin(2 * Math.PI * f * tl)); return { ...p, armar: a }; };   // k: armen lyfts och sänks mjukt (QA 2)
// klippningen: en mask som visar teckningen fram till kritans spets (vänster → höger), kritan vid kanten
const avslojad = (inner, x0, x1, y0, y1, k) => `<clipPath id="rev"><rect x="${f1(x0 - 20)}" y="${f1(y0 - 40)}" width="${f1(Math.max(0, (x1 - x0 + 40) * k))}" height="${f1(y1 - y0 + 80)}"/></clipPath><g clip-path="url(#rev)">${inner}</g>`;
const kritaVid = (x0, x1, y0, y1, k, tl) => krita(lerp(x0, x1, k), (y0 + y1) / 2 + (y1 - y0) * 0.25 * Math.sin(k * 6));
const svajar = (x, y, tl) => krita(x + 5 / KZ * Math.sin(tl * 1.2), y + 4 / KZ * Math.sin(tl * 1.7), undefined, 140 + 1.5 * Math.sin(tl * 1.0));   // lugnare svaj (Sanna 2026-11-21: "a bit less wobbly crayon")

// Stetoskopet som kritan ritar, i scenens mått runt [x, y]: vänster och höger öronslang (från propparna ner till Y-knuten),
// slangen i en mjuk S-båge ner till vänster och bröstdelens ring (mitt x − 120, y + 208, r 38).
// Stetoskopet, mer detaljerat (Sanna 2026-11-20: "improve drawing of stetoskop more detailed"): öronrören, fjäderbygeln, proppar,
// slangen, bröstdelens hals, ytterring och membran. Streck i ritordning, i scenens mått runt Y-knuten [x, y].
const STETO_DRAG = ([x, y], k = 1) => {
  const P = (a, b) => `${f1(x + a * k)} ${f1(y + b * k)}`, cx = -110, cy = 175, R = 40, r = 22;
  return [
    `M${P(-58, -150)} C${P(-66, -80)} ${P(-38, -18)} ${P(0, 0)}`,
    `M${P(58, -150)} C${P(66, -80)} ${P(38, -18)} ${P(0, 0)}`,
    `M${P(-56, -96)} Q${P(0, -78)} ${P(56, -96)}`,
    `M${P(-69, -150)} a${f1(11 * k)} ${f1(8 * k)} -30 1 0 ${f1(22 * k)} 0 a${f1(11 * k)} ${f1(8 * k)} -30 1 0 ${f1(-22 * k)} 0`,
    `M${P(47, -150)} a${f1(11 * k)} ${f1(8 * k)} 30 1 0 ${f1(22 * k)} 0 a${f1(11 * k)} ${f1(8 * k)} 30 1 0 ${f1(-22 * k)} 0`,
    `M${P(0, 0)} C${P(0, 80)} ${P(cx - 10, 60)} ${P(cx, cy - R - 22)}`,
    `M${P(cx, cy - R - 22)} L${P(cx, cy - R)}`,
    `M${P(cx, cy - R)} a${f1(R * k)} ${f1(R * k)} 0 1 0 0.1 0`,
    `M${P(cx, cy - r)} a${f1(r * k)} ${f1(r * k)} 0 1 0 0.1 0`];
};
const STETO_VIKT = [1.4, 1.4, 0.8, 0.5, 0.5, 2.2, 0.3, 1.6, 1.0];   // hur länge kritan ritar varje streck (relativt)
// Kritans bana genom strecken (Sanna 2026-11-20: "0.08 flickering krita jumping positions"): varje streck ritas, och mellan
// strecken glider kritan lugnt i en liten båge från förra streckets slut till nästa streckets början. Ger html och spetsen.
let MATT_D = null;
function stetoBana(D, k, attr) {
  if (!MATT_D || MATT_D.key !== D.join('|')) {   // streckens längd, start och slut mäts en gång
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g'); $('defs').appendChild(g);
    MATT_D = { key: D.join('|'), m: D.map(d => { const e = document.createElementNS('http://www.w3.org/2000/svg', 'path'); e.setAttribute('d', d); g.appendChild(e);

      lagg('fram', `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(24 + 34 * u)}" fill="none" stroke="#fff" stroke-width="${f1(7 * (1 - u) + 1)}" opacity="${f1(1 - u)}"/>`); } };
  const skn = (x, y, rx, ry) => { if (s.sken) lagg('fram', `<g opacity="${(s.sken).toFixed(2)}">${sken(x, y, rx, ry)}</g>`); };
  switch (s.kam) {
    case 'hel': kamera(1, 960, 540); break;
    // QA 3: öronspetsarna ligger ca 230–250 px (scenens mått) ovanför huvud[]; kamerorna nedan ger dem luft i överkanten (de skars av)
    case 'kanin': kamera(2.0, huvud[0], huvud[1] + 5); break;   // QA 3: var ×2,2 och + 60 (öronen skars); hela kaninen med fötterna
    case 'kaninNar': kamera(2.8, huvud[0], huvud[1] - 68); break;   // QA 3: luft ovanför öronen (QA 2: − 30)
    case 'kaninOraNer': kamera(2.8, huvud[0] + 90, huvud[1] - 68); break;   // rad 19–20: mer åt höger, örat som ramlar (Sanna 2026-11-20: "2.29 move camera more to the right")
    case 'kaninOron': kamera(2.4, huvud[0] - 25, huvud[1] - 45); break;   // rad 21 (Sanna: lite upp och till vänster), hela öronen i bild
    case 'kaninLeo': kamera(2.0, (huvud[0] + golvN[0]) / 2, huvud[1] + 20); break;   // kaninens ansikte och leoparden på golvet; QA 3: ×2,0 och högre, öronen i bild
    case 'doktor': { const [x, y] = dhuvud(); kamera(2.5, x - 120, y + 60); break; }
    case 'lampaNar': { const [x, y] = punkt(GD.querySelector('.lampa'), -20, 0); kamera(3.0, x - 20, y); break; }   // öronlampan i doktorns hand
    case 'doktorVinkar': { const [x, y] = punkt(GD.querySelector('.drag'), 512, 300); kamera(2.0, x + 90, y + 30); break; }   // QA 2/3: mer åt höger, kaninens öra syns inte i vänsterkanten   // huvudet i mitten, luft ovanför
    case 'stetoNar': { const [x, y] = punkt(GD.querySelector('.kropp'), 520, 520); kamera(3.0, x, y + 10); break; }   // stetoskopet på doktorns bröst
    case 'doktorNar': { const [x, y] = punkt(GD.querySelector('.drag'), 512, 300); kamera(3.0, x, y + 20); break; }
    case 'steto': kamera(1.8, 1420, 480); break;
    case 'dokKanin': kamera(1.35, 1060, 520); break;
    case 'mage': { const m = s.n === 'sidan' ? [mage[0] + 10, mage[1] - 10] : [mage[0] + 95, mage[1] - 35]; naraSak(m, brostdelPos); puls(...m); kamera(1.9, m[0] + 40, Math.min(m[1] - 40, huvud[1] + 26)); break; }   // QA 3: högre, kaninens öron och doktorns hår i bild
    case 'nalleMage': naraSak(nalleMage, brostdelPos); puls(...nalleMage); kamera(2.6, nalleMage[0] + 50, nalleMage[1] - 60); break;
    case 'ora': { const o = punkt(GK.querySelector('image.ear-r'), ORA[0], ORA[1]); naraSak([o[0] + 18, o[1]], lampSpets); skn(o[0] - 12, o[1]); kamera(2.3, o[0] + 80, o[1] + 110); break; }
    case 'nalleOra': naraSak([nalleOra[0] + 18, nalleOra[1]], lampSpets); skn(nalleOra[0] - 6, nalleOra[1], 18, 18); kamera(2.2, nalleOra[0] + 60, huvud[1] - 15); break;   // QA 2: kaninens ansikte helt i bild (skars vid ögonen); QA 3: ×2,2 och högre, öronen i bild
    // mun: lampan bredvid munnen, skenet skymmer inte gapet
    case 'mun': { const m = punkt(GK.querySelector('.drag'), MUN[0], MUN[1]); naraSak([m[0] + 110, m[1] - 10], lampSpets); skn(m[0] + 60, m[1] - 8, 20, 16); kamera(2.6, m[0] + 80, m[1] - 52); break; }   // QA 3: högre (var − 20), öronen i bild
    case 'nalleMun': naraSak([nalleMun[0] + 60, nalleMun[1]], lampSpets); skn(nalleMun[0] + 24, nalleMun[1], 22, 18); kamera(2.2, nalleMun[0] + 70, huvud[1] - 15); break;   // QA 2: kaninens ansikte helt i bild; QA 3: ×2,2 och högre, öronen i bild
    case 'pall': kamera(2.4, PALL[0], PALL[1] - 20); break;
  }
  if (s.skimmer) lagg('fram', [0, 1, 2, 3].map(i => { const a = i * Math.PI / 2 + 0.4 + s.tl * 1.2, x = PALL[0] - 60 + 70 * Math.cos(a), y = PALL[1] - 30 + 50 * Math.sin(a), r = 10 * (0.6 + 0.4 * Math.sin(s.tl * 6 + i));
    return `<path d="M${f1(x - r)} ${f1(y)} L${f1(x + r)} ${f1(y)} M${f1(x)} ${f1(y - r)} L${f1(x)} ${f1(y + r)}" stroke="#fff7b0" stroke-width="5" stroke-linecap="round" opacity="${f1(s.skimmer)}"/>`; }).join(''));
  if (s.iris != null) kritiris(s.iris, punkt(GK.querySelector('.drag'), 512, 450));   // rad 39 är helbild: scenens koordinater = skärmens
  // 01c: zoomen in i teckningen; mottagningen syns först när papperet har tonat bort
}

// Ritintrot (Sanna 2026-11-20: kritan ritar stetoskopet, inte kaninen; som de andra avsnitten, format/ritintro.md och 045):
// krämvitt papper, konturen i en mörk kritlinje i ett lugnt drag (öronslangarna, slangen, bröstdelen), kritans spets i linjens ände
// (125°, 0,42). Kritan glider till en väntplats och svajar (140°). På svaret fylls det riktiga stetoskopet i inifrån (en cirkel som
// växer), linjen tonas bort, kritan flyger ut uppe till höger, och kameran zoomar in i teckningen; sedan vitt och klipp till mottagningen.
const IC = [990, 440],   /* lite lägre (Sanna 2026-11-21) */ IK = 1.75, ritfart = k => (k = kl(k), 0.6 * k + 0.4 * mjuk(k)), SVAJ = [1430, 300];
function papper(s, tl, d) {
  const z = s.zoom ?? 0, Z = (1 + 0.12 * mjuk(kl(((s.tl ?? 0) - 8.6) / 5))) * (1 + 1.6 * mjuk(z));   // gisspausen: kameran kryper in (+12 %), sedan zoom in
  lagg('papper', `<g transform="translate(${IC[0]} ${IC[1] + 60}) scale(${Z.toFixed(3)}) translate(${-IC[0]} ${-IC[1] - 60})"><rect x="-200" y="-200" width="2400" height="1500" fill="#FBF7EE"/><g id="pk" filter="url(#boil)"></g></g>`);
  const D = STETO_DRAG(IC, IK), k = ritfart(s.k ?? 1), linje = 1 - del(0.15, 0.9, s.fyll ?? 0);
  const R_ = stetoBana(D, k, `fill="none" stroke="#3a2c28" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="${linje.toFixed(2)}"`);
  let h = R_.html, sp = null;
  const f = s.fyll ?? 0;
  if (f > 0) h = `<clipPath id="ifyll"><circle cx="${IC[0] - 40}" cy="${IC[1] + 60}" r="${f1(460 * Math.pow(mjuk(f), 1.2))}"/></clipPath><g clip-path="url(#ifyll)"><g filter="url(#sakKantStor)">${stetoFylld(IC, IK)}</g></g>` + h;
  $('pk').innerHTML = h;
  if ((s.k ?? 0) > 0 && !s.svaj && s.ut == null) sp = R_.pos;   // ritar, eller står kvar vid sista spetsen tills 01b (inget flimmer)
  KZ = 1; BOILZ = Z;
  const kr = (x, y, v, sk = 0.42) => lagg('papper', krita(x, y, sk, v));
  if (sp) kr(sp[0], sp[1], 125);
  else if ((s.k ?? 0) <= 0) kr(lerp(2100, IC[0] - 58 * IK, del(0, 0.3, s.tl)), lerp(60, IC[1] - 150 * IK, del(0, 0.3, s.tl)), 125);
  else if (s.ut != null && s.ut > 0) { if (s.ut < 1) kr(lerp(SVAJ[0], 2100, mjuk(s.ut)), lerp(SVAJ[1], 60, mjuk(s.ut)), 140); }
  else { const m = mjuk(s.svaj ?? 1), a = R_.slut, w = [SVAJ[0] + 5 * Math.sin(s.tl * 1.2), SVAJ[1] + 4 * Math.sin(s.tl * 1.7)];
    kr(lerp(a[0], w[0], m), lerp(a[1], w[1], m) - 60 * Math.sin(Math.PI * m), lerp(125, 140 + 1.5 * Math.sin(s.tl * 1.0), m)); }
  if ((s.fyll ?? 0) > 0 && z < 0.3) lagg('papper', gnistor(IC[0] - 30, IC[1] + 60, 330, (s.tl - 14) - MT()));
  if (z > 0.6) lagg('papper', `<rect width="1920" height="1080" fill="#fff" opacity="${(del(0.6, 1, z)).toFixed(2)}"/>`);
}

// --- Ljud: Malin och effekterna ur raderna (ingen musik i bilderboken) ------------------------------------------------------------
const E = 'assets/ljud/effekter/';
const VOL = f => /^doktor-/.test(f) ? 0.8 : /^kanin-/.test(f) ? 0.85 : /^(glitter|tindra)/.test(f) ? 0.7 : /^(dunk|hjartslag)/.test(f) ? 0.6 : /^krita-ritar/.test(f) ? 0.9 : /^(smasteg|hopp)/.test(f) ? 0.6 : 0.75;

    for (const [f, o] of r.ljud || []) if (f) ut.push({ t: r.s + o, fil: E + f + '.m4a', vol: VOL(f),
      ...(/^krita-ritar/.test(f) ? { loop: true, langd: RITLANGD[r.id] ?? 3, fade: 0.4 } : /^smasteg/.test(f) ? { loop: true, langd: 2.8, fade: 0.4 } : {}) });
  }
  // mottagningens rumsljud (ElevenLabs 2026-11-20, −33 LUFS, lågpass 1,8 kHz) från rad 1 till kritirisens slut, som i receptet

  // gissa-bad.m4a som i shortsen, ABC och julkalendern; nivå som julbädden i 045)
  ut.push({ t: 0.2, fil: 'assets/ljud/musik/gissa-bad.m4a', vol: 0.075, langd: DURATION - 0.2, loop: true, fadeIn: 1.5, fade: 3.0 });
  return ut.filter(c => c.t < DURATION);
}

let BOILZ = null;
function rita(t) {
  BOILZ = null;
  TT = t; const r = RAD_L.find(x => t < x.s + x.d) || RAD_L.at(-1); CUR = r;
  ritaRad(r.id, Math.min(t - r.s, r.d), r.d);
  // Line boil svagare (Sanna 2026-11-21: "line boil is too strong"): 2,5 px i bild i stället för 5 px gånger kamerazoomen
  // (i en närbild ×2,8 blev det 14 px), och ny brusbild 6 gånger/s i stället för 10 (format/ritintro.md).
  $('brus').setAttribute('seed', Math.floor(t * 6) % 50 + 1);

}

  $('rummet').innerHTML = `<image href="${RUM.fil}" width="${f1(RUM.w * RS)}" height="${f1(RUM.h * RS)}"/>
    <ellipse cx="${f1(BRITS.x + BRITS.w * BRITS.s / 2)}" cy="${f1(BRITS.fot - 6)}" rx="${f1(BRITS.w * BRITS.s * 0.5)}" ry="22" fill="#3a5068" opacity="0.10"/>
    ${klocka(1480, 215, 74)}`;
  const b = $('brits'); b.setAttribute('x', BRITS.x); b.setAttribute('y', f1(BRITS_TOPP)); b.setAttribute('width', f1(BRITS.w * BRITS.s)); b.setAttribute('height', f1(BRITS.h * BRITS.s));
  const { RADER, ROST } = await (await fetch('/avsnitt/046-kaninen-gar-till-doktorn/scener/mottagningen/rader.json')).json();
  ROSTER = ROST; let acc = 0;
  RAD_L = RADER.filter(r => r.id !== '00').map(r => { const s = acc; acc += r.d; return { ...r, s }; }); RR = Object.fromEntries(RAD_L.map(r => [r.id, r]));

  GD = DL.figur(DOKTOR[0], DOKTOR[1], DOKTOR[2], $('figurer'));
  GK.querySelector('.skugga')?.setAttribute('display', 'none');
  LEOK = await (await fetch(R + 'gosedjur-leopard/cut/gosedjur-leopard-kontur.json')).json();   // kritans kontur (verktyg/kontur.py --krymp 28)
  BL = skapaBlinka(46);
  await Promise.all([RUM.fil, NALLE, KRITA, '/assets/bakgrunder/mottagningen/cut/brits.png'].map(u => new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = u; })));
  const lj = ljud(), finns = await Promise.all(lj.map(c => fetch('/' + c.fil, { method: 'HEAD' }).then(r => r.ok, () => false)));
  lj.forEach((c, i) => { if (!finns[i]) console.error('saknas:', c.fil); });
  window.LJUD = lj.filter((c, i) => finns[i]);
  rita(Number(new URLSearchParams(location.search).get('t') || 0));
  return true;
})();
