<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Kaninen går till doktorn</title>
<style>html, body { margin:0; background:#000; } svg { width:100vw; height:100vh; display:block; }</style>
</head>
<body>
<!-- 046 Kaninen går till doktorn: hela kodscenen (grind 6). Komposition och mått som storyboarden (../../storyboard/scen.html), tiden och
     raderna ur rader.json (skrivs av storyboard/bygg.mjs). Rendera: node verktyg/render-delat.mjs avsnitt/046-kaninen-gar-till-doktorn/scener/mottagningen [--snabb].
     Bara hårda klipp; den enda åkningen är zoomen in i teckningen. Kritan är liten, utan ansikte, knackar aldrig. Doktorn är tyst och står
     still vid britsen (rör armen, nickar, vinkar); i närbilderna flyttas doktorn så att bröstdelen eller lampan hamnar rätt (klipp).
     Rad 00 (logotypen) läggs på i sammanslagningen. -->
<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs id="defs">
    <filter id="boil" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="5000">
      <feTurbulence id="brus" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
      <feDisplacementMap in="SourceGraphic" scale="5"/>
    </filter>
    <mask id="iris"><rect width="1920" height="1080" fill="#fff"/><circle id="irishal" cx="960" cy="540" r="300" fill="#000"/></mask>
  </defs>
  <rect width="1920" height="1080" fill="#FAF8F2"/>
  <g id="kamera">
    <g id="rummet"></g>
    <g filter="url(#boil)"><g id="bak"></g></g>
    <image id="brits" href="/assets/bakgrunder/mottagningen/cut/brits.png"/>
    <g filter="url(#boil)"><g id="figurer"></g></g>
    <g filter="url(#boil)"><g id="saker"></g></g>
    <g id="fram"></g>
  </g>
  <g id="papper"></g>
  <rect id="svart" width="1920" height="1080" fill="#111" mask="url(#iris)" display="none"/>
</svg>
<script src="/verktyg/blinka.js"></script>
<script src="/verktyg/doktor-saker.js"></script>
<script src="/produktion/youtube/shorts/godnatt/nalle-v2.js"></script>
<script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script>
const $ = id => document.getElementById(id), f1 = v => v.toFixed(1);
const lagg = (id, h) => $(id).insertAdjacentHTML('beforeend', h);
const A = '/assets/', R = A + 'rekvisita/';
const KRITA = R + 'krita-rod/cut/krita-rod.png', KRITA_SPETS = [742, 132];
// Nallen v2 (Sanna 2026-11-20: "nallen v2", "ta bort den gamla nallen"): nalle-v2-ljus-tunn.png 848 × 856 som 016/026/037, ansiktet i kod (nalle-v2.js)
const NALLE = R + 'nalle/cut/nalle-v2-ljus-tunn.png', NALLE_C = [424, 429], NALLE_H = 776, NALLE_WH = [848, 856];

// Mått (bakgrunder/mottagningen.md, komposition v2)
const RUM = { fil: A + 'bakgrunder/mottagningen/mottagningen-tom.png', w: 1876, h: 1058 }, RS = 1920 / RUM.w;
const BRITS = { w: 725, h: 536, x: 170, fot: 950, s: 1.25, dyna: 235 };
const DYNA_Y = BRITS.fot - (BRITS.h - BRITS.dyna) * BRITS.s;
const BRITS_TOPP = BRITS.fot - BRITS.h * BRITS.s;
const PALL = [BRITS.x + 177 * BRITS.s, BRITS_TOPP + 405 * BRITS.s];   // pallens övre kant, mitt (urklippet: x 80–275, y 405)
const KS = 0.55, PA_BRITS = [900, DYNA_Y + 105], PA_GOLV = [640, 990];
const DOKTOR = [1250, 985, 0.85];
const MAGE = [540, 700], ORA = [672, 190], MUN = [512, 470];   // kaninen (riggens 1024-ruta)
const NER = -30;   // kaninens armar lite nedåt (som 041)

let DL, KL, GD, GK, BL;
function kamera(z, cx, cy) { $('kamera').setAttribute('transform', `translate(${f1(960 - cx * z)} ${f1(540 - cy * z)}) scale(${z})`); }
const punkt = (el, x, y) => { const m = DOMMatrix.fromMatrix($('kamera').getCTM()).inverse().multiply(el.getCTM()); const q = m.transformPoint(new DOMPoint(x, y)); return [q.x, q.y]; };
let DPOS = [0, 0];
function doktorPa(x, y) { DPOS = [x, y]; GD.setAttribute('transform', `translate(${f1(x)} ${f1(y)}) scale(${DOKTOR[2]}) translate(-512 ${-DL.FOTTER})`); }
function kaninPa([x, y]) { GK.setAttribute('transform', `translate(${f1(x)} ${f1(y)}) scale(${KS}) translate(-512 ${-KL.FOTTER})`); }

// Saker: nallen (bild), kritan (bild), stetoskopet och stjärnan (kod). kontur: streckad grå, som konturen kritan ritar.
const nalle = (x, y, h = 210, kontur = false, mun = 0) => { const s = h / NALLE_H;
  return `<g transform="translate(${f1(x - NALLE_C[0] * s)} ${f1(y - NALLE_C[1] * s)}) scale(${s.toFixed(4)})" ${kontur ? 'style="filter:grayscale(1) brightness(1.6) contrast(.6)" opacity=".45"' : ''}>
    <image href="${NALLE}" width="${NALLE_WH[0]}" height="${NALLE_WH[1]}"/>${kontur ? '' : nalleAnsikte(0, mun)}</g>`; };
const krita = (x, y, s = 0.33, v = -35) => `<image href="${KRITA}" width="755" height="265" transform="translate(${f1(x)} ${f1(y)}) scale(${s}) rotate(${v}) translate(${-KRITA_SPETS[0]} ${-KRITA_SPETS[1]})"/>`;
const stjarnaD = (x, y, r) => Array.from({ length: 10 }, (_, i) => { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.48 : r;
  return `${i ? 'L' : 'M'}${f1(x + rr * Math.cos(a))} ${f1(y + rr * Math.sin(a))}`; }).join(' ') + 'Z';
const stjarna = (x, y, r, kontur = false) => kontur
  ? `<path d="${stjarnaD(x, y, r)}" fill="none" stroke="#c99a1f" stroke-width="5" stroke-dasharray="10 8" stroke-linejoin="round"/>`
  : `<path d="${stjarnaD(x, y, r)}" fill="#ffd23f" stroke="#fff" stroke-width="${f1(r * 0.16)}" stroke-linejoin="round" paint-order="stroke"/>`;
// Stetoskopet i luften (kritans teckning): öronbygeln, slangen och bröstdelen
function stetoLuft(x, y, s = 1, kontur = false) {
  const st = kontur ? `stroke="#59616b" stroke-dasharray="9 7" opacity=".7"` : `stroke="${STETO.SLANG}"`;
  const d = `M${x - 40 * s} ${y - 70 * s} Q${x - 46 * s} ${y - 10 * s} ${x} ${y + 10 * s} Q${x + 46 * s} ${y - 10 * s} ${x + 40 * s} ${y - 70 * s} M${x} ${y + 10 * s} C${x} ${y + 70 * s} ${x - 70 * s} ${y + 80 * s} ${x - 80 * s} ${y + 130 * s}`;
  return `<g><path d="${d}" fill="none" ${st} stroke-width="${f1(10 * s)}" stroke-linecap="round"/>
    ${kontur ? `<circle cx="${f1(x - 80 * s)}" cy="${f1(y + 150 * s)}" r="${f1(22 * s)}" fill="none" ${st} stroke-width="5"/>` : `<g filter="url(#saksKant)">${brostdel(x - 80 * s, y + 150 * s, 22 * s)}</g>`}
    ${kontur ? '' : `<circle cx="${f1(x - 40 * s)}" cy="${f1(y - 72 * s)}" r="${f1(7 * s)}" fill="${STETO.SLANGLJUS}"/><circle cx="${f1(x + 40 * s)}" cy="${f1(y - 72 * s)}" r="${f1(7 * s)}" fill="${STETO.SLANGLJUS}"/>`}</g>`;
}
const ringar = (x, y) => [24, 46].map((r, i) => `<circle cx="${f1(x)}" cy="${f1(y)}" r="${r}" fill="none" stroke="#fff" stroke-width="${5 - 2 * i}" opacity="${0.9 - 0.4 * i}"/>`).join('');
const sken = (x, y, rx = 24, ry = 42) => `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${rx}" ry="${ry}" fill="#ffe680" opacity=".45"/>`;

// --- Tid ------------------------------------------------------------------------------------------------------------------------
const kl = (k, a = 0, b = 1) => Math.max(a, Math.min(b, k)), lerp = (a, b, k) => a + (b - a) * k;
const mjuk = k => (k = kl(k), k * k * (3 - 2 * k)), del = (a, b, t) => mjuk((t - a) / (b - a));
const bump = (a, b, t) => (t <= a || t >= b) ? 0 : Math.sin(Math.PI * (t - a) / (b - a));
const lerp2 = (A, B, k) => [lerp(A[0], B[0], k), lerp(A[1], B[1], k)];
let TT = 0, RAD_L = [], RR = {}, ROSTER = [], DURATION = 0, CUR = null;
const SVART = 0.6;
const ML = n => ROSTER[n - 1][1];                                 // replikens längd
const MT = (i = 0) => (CUR.malin || [])[i]?.[1] ?? 0;             // när radens i:te replik börjar (s in i raden)
const LT = f => (CUR.ljud || []).filter(x => x[0].startsWith(f)).map(x => x[1]);   // när radens effekter med namnet börjar

// kaninen andas (som 041), öronen rör sig lite
const liv = (p, t) => { const a = (1 - Math.cos(2 * Math.PI * t / 3.6)) / 2;
  return { ...p, strack: p.strack + 0.014 * a, bred: p.bred + 0.007 * a, oron: p.oron.map((o, i) => o - 2 * a + (i ? -1 : 1) * 1.5 * Math.sin(t * 1.3 + 2 * i)) }; };
// skutt från A till B (fötterna), höjd h, under [a, b] sekunder in i raden
const skuttPos = (A, B, tl, a, b, h = 120) => { const u = kl((tl - a) / (b - a)); return { pa: [lerp(A[0], B[0], mjuk(u)), lerp(A[1], B[1], u) - h * Math.sin(Math.PI * u)], u }; };
const vinka = (p, tl, i = 1, f = 1.15) => { const a = [...p.armar]; a[i] = a[i] + 150 + 12 * Math.sin(2 * Math.PI * f * tl); return { ...p, armar: a }; };
// klippningen: en mask som visar teckningen fram till kritans spets (vänster → höger), kritan vid kanten
const avslojad = (inner, x0, x1, y0, y1, k) => `<clipPath id="rev"><rect x="${f1(x0 - 20)}" y="${f1(y0 - 40)}" width="${f1(Math.max(0, (x1 - x0 + 40) * k))}" height="${f1(y1 - y0 + 80)}"/></clipPath><g clip-path="url(#rev)">${inner}</g>`;
const kritaVid = (x0, x1, y0, y1, k, tl) => krita(lerp(x0, x1, k), (y0 + y1) / 2 + (y1 - y0) * 0.4 * Math.sin(k * 9));
const svajar = (x, y, tl) => krita(x + 10 * Math.sin(tl * 2.1), y + 7 * Math.sin(tl * 1.6 + 1));

// --- Raderna: S[id](tl, d) ger { kam, k, d, n, ... } ----------------------------------------------------------------------------
const KF = (n, k = 1, o = {}) => ({ ...KL.blanda('neutral', n, k), ...o });
const KP = (n = 'neutral', o = {}) => { const p = { ...KL.blandaPose('neutral', n, 1), ...o }; return { ...p, armar: p.armar.map(a => a + NER) }; };
const DP = (n = 'neutral', o = {}, k = 1) => ({ ...DL.blandaPose('neutral', n, k), ...o });
const SITT = (o = {}) => KP('sitter', o);
const DVINKA = tl => ({ armar: [100 + 12 * Math.sin(2 * Math.PI * 1.1 * tl), 0], armbage: [-30, 0] });
const DNICK = (tl, a = 0.3) => { const [, p] = DL.nicka(DL.param('glad'), DP(), Math.max(0, tl - a)); return p.nick; };
const KNICK = (tl, a = 0.2) => { const [, p] = KL.nicka(KL.param('glad'), KL.blandaPose('neutral', 'neutral', 1), Math.max(0, tl - a)); return p.nick; };
const PALL_FOT = [PALL[0] + 10, PALL[1] + 130];   // fötterna på pallens övre steg (riggens fötter ligger under kroppen)
const NALLE_BAK = [PALL[0] - 30, PALL[1] + 70];

function S(id, tl, d) {
  const glad = KF('glad'), golv = { pa: PA_GOLV, p: KP(), f: glad }, brits = { pa: PA_BRITS, p: SITT(), f: glad };
  switch (id) {
    case '01a': return { papper: 'kontur', k: kl((tl - 0.3) / 7.0), tl };
    case '01b': return { papper: 'kontur', k: 1, svaj: 1, tl };
    case '01c': return { papper: 'fylld', fyll: del(0, 0.6, tl), zoom: del(d - 1.4, d, tl), tl };
    case '1': { const u = del(0.3, 3.2, tl), x = lerp(-260, PA_GOLV[0], 1 - (1 - kl((tl - 0.3) / 2.9)) ** 2), gar = tl > 0.3 && tl < 3.2;
      let p = KP('neutral', { lyft: gar ? -16 * Math.abs(Math.sin(2 * Math.PI * 1.8 * tl)) : 0, luta: gar ? 2 * Math.sin(2 * Math.PI * 1.8 * tl) : 0 });
      if (tl > 3.3) p = vinka(p, tl - 3.3);
      return { kam: 'hel', k: { pa: [x, PA_GOLV[1]], p, f: KF(tl > 3.3 ? 'jatteglad' : 'glad') }, u }; }
    case '2': return { kam: 'doktor', k: golv, d: { p: DP('neutral', DVINKA(tl)) } };
    case '3': return { kam: 'kaninNar', k: { ...golv, f: KF('ledsen', 0.4 * del(0, 0.6, tl), { titt: [0, 6 * del(0, 0.6, tl)] }), p: KP('neutral', { oron: [12, 12].map(o => o * del(0, 0.6, tl)), sank: 6 * del(0, 0.6, tl) }) } };
    case '4': { const upp = tl < 1.1; return { kam: 'kaninNar', k: { ...golv, f: KF('ledsen', 0.5, { titt: upp ? [10, -8] : [0, 6] }), p: KP('neutral', { oron: [14, 14], sank: 6 }) } }; }
    case '5': return { kam: 'hel', k: { ...golv, f: KF('ledsen', 0.4), p: KP('neutral', { oron: [12, 12], sank: 6 }) }, d: { p: DP('neutral', { nick: DNICK(tl) }) } };
    case '6a': { const rit = Math.min(4.0, d - 3.0 + 0.4); return { kam: 'kanin', k: { ...golv, f: KF('nyfiken', 1, { titt: [12, 6] }), p: KP('neutral', { oron: [12, 12] }) }, n: 'golv-kontur', nk: kl((tl - 0.4) / rit), krita: 'nalle', tl }; }
    case '6b': return { kam: 'kanin', k: { ...golv, f: KF('kawaii') }, n: 'golv', nfyll: del(0, 0.5, tl), kritaUt: del(0, 0.8, tl), krita: 'nalle', tl };
    case '7': return { kam: 'kanin', k: { ...golv, f: KF('nyfiken', 1, { titt: [12, 6] }), p: KP('neutral', { oron: [12, 12].map(o => lerp(o, -6, del(0.2, 1.0, tl))) }) }, n: 'golv' };
    case '8': { const kram = del(0.9, 1.4, tl); return { kam: 'kanin', k: { ...golv, f: KF('glad'), p: { ...KP('magen'), nick: KNICK(tl, 0.1) } }, n: 'tillFamn', nu: kram }; }
    case '9': return { kam: 'kaninNar', k: { ...golv, f: KF('sover', 0.8), p: KP('magen', { luta: 4 * del(0, 0.8, tl) }) }, n: 'famn' };
    case '10': { const a = MT() + ML(15) * 0.55, b = MT() + ML(15) * 0.95;
      if (tl < a + 0.25) { const s = skuttPos(PA_GOLV, PALL_FOT, tl, a - 0.25, a + 0.25, 90); return { kam: 'hel', k: { ...golv, pa: s.pa, p: KP('magen') }, n: 'famn' }; }
      const s = skuttPos(PALL_FOT, PA_BRITS, tl, b - 0.3, b + 0.3, 110), sitt = del(b + 0.2, b + 0.6, tl);
      return { kam: 'hel', k: { ...brits, pa: s.pa, p: { ...KL.blandaPose('magen', 'sitter', sitt), armar: KL.blandaPose('magen', 'sitter', sitt).armar.map(x => x + NER) } }, n: 'famn' }; }
    case '11a': return { kam: 'dokKanin', k: { ...brits, f: KF('nyfiken', 1, { titt: [12, -4] }) }, n: 'famn', steto: 'kontur', sk: kl((tl - 0.4) / 3.0), krita: 'steto', tl };
    case '11b': return { kam: 'dokKanin', k: { ...brits, f: KF('nyfiken', 1, { titt: [12, -4] }) }, n: 'famn', steto: 'fylld', sfyll: del(0, 0.5, tl), stIn: del(d - 1.0, d - 0.2, tl), kritaUt: del(0, 0.8, tl), krita: 'steto', tl };
    case '11c': { const k = del(0.3, 1.1, tl); return { kam: 'doktor', k: brits, n: 'famn', d: { p: { ...DP('stetoskop', {}, k), steto: tl > 0.6 ? 1 : 0 } } }; }
    case '12': return { kam: 'nalleMage', k: brits, n: 'famn', d: { p: DP('stetoskop') }, ringar: LT('dunk') };
    case '13': return { kam: 'mage', k: { ...brits, f: tl > MT() + ML(18) ? KF('fnissig') : KF('glad') }, n: 'famn', d: { p: DP('stetoskop') }, ringar: LT('dunk') };
    case '14': return { kam: 'doktor', k: brits, n: 'famn', d: { p: DP('stetoskop', { nick: DNICK(tl) }) } };
    case '15': { const kl_ = LT('klapp')[0], k = bump(kl_ - 0.35, kl_ + 0.5, tl); return { kam: 'kanin', k: { ...brits, f: KF(tl > kl_ ? 'jatteglad' : 'nyfiken'), p: { ...SITT(), fram: [k > 0.3 ? 1 : 0, k > 0.3 ? 1 : 0], armar: SITT().armar.map(a => a - 90 * k) } }, n: 'famn' }; }
    case '16': return { kam: 'doktor', k: brits, n: 'famn', d: { p: { ...DP('lampa', {}, del(0, 0.5, tl)), lampa: 1, ljus: tl > LT('lampa-klick')[0] ? 1 : 0 }, f: 'nyfiken' } };
    case '17': return { kam: 'nalleOra', k: brits, n: 'famn', d: { p: { ...DP('lampa', { armar: [100, 0], armbage: [-70, 0] }), ljus: del(0.2, 0.4, tl) }, f: 'nyfiken' }, sken: del(0.2, 0.4, tl) };
    case '18': return { kam: 'ora', k: { ...brits, f: tl > MT() + ML(24) ? KF('jatteglad') : glad }, n: 'famn', d: { p: { ...DP('lampa', { armar: [100, 0], armbage: [-70, 0] }), ljus: del(0.2, 0.4, tl) }, f: 'nyfiken' }, sken: del(0.2, 0.4, tl) };
    case '19': return { kam: 'kaninNar', k: { ...brits, f: KF(tl > 0.5 ? 'fnissig' : 'forvanad'), p: SITT({ oron: [0, 75 * del(0, 0.5, tl)] }) }, n: 'famn' };
    case '20': { const u = del(0.1, 0.7, tl); return { kam: 'kaninNar', k: { ...brits, p: SITT({ oron: [0, 75 * (1 - u)], armar: [6, 6 + 70 * bump(0, 0.9, tl)] }) }, n: 'famn' }; }
    case '21': { const v = tl > MT(1) ? 10 * Math.sin(2 * Math.PI * 2.2 * tl) : 0; return { kam: 'kanin', k: { ...brits, f: KF(tl > MT(1) ? 'fnissig' : 'nyfiken'), p: SITT({ oron: [-v, v] }) }, n: 'famn' }; }
    case '22': return { kam: 'hel', k: brits, n: 'famn', d: { p: DP('neutral', { nick: DNICK(tl) }), f: 'nyfiken' } };
    case '23': return { kam: 'nalleMun', k: { ...brits, f: tl > MT() + ML(30) * 0.5 ? KF('fnissig') : glad }, n: 'famn', d: { p: { ...DP('lampa', { armar: [70, 0], armbage: [-55, 0] }), ljus: del(0.2, 0.4, tl) }, f: 'nyfiken' }, sken: del(0.2, 0.4, tl) };
    case '24': { const a = MT() + ML(31) * 0.62, gap = tl > a && tl < a + 1.4 ? 1 : 0;
      return { kam: 'mun', k: { ...brits, f: gap ? KF('gapar') : glad }, n: 'famn', d: { p: { ...DP('lampa', { armar: [70, 0], armbage: [-55, 0] }), ljus: 1 }, f: 'nyfiken' }, sken: 1 }; }
    case '25': return { kam: 'kanin', k: { ...brits, f: KF('stolt'), p: SITT({ strack: 0.03 * del(0, 0.5, tl) }) }, n: 'famn' };
    case '26': { const k = bump(0.15, 0.7, tl), fall = del(0.6, 1.5, tl);
      return { kam: 'hel', k: { ...brits, f: KF(tl > 0.8 ? 'forvanad' : 'jatteglad'), p: { ...SITT(), fram: [k > 0.3 ? 1 : 0, k > 0.3 ? 1 : 0], armar: SITT().armar.map(a => a - 90 * k) } }, n: 'faller', nu: fall }; }
    case '27': { const t = tl < 1.2 ? [-14, 0] : tl < 2.4 ? [14, 0] : [0, 4]; return { kam: 'kanin', k: { ...brits, f: KF('nyfiken', 1, { titt: t }), p: SITT({ oron: [10, 10].map(o => o * del(1.5, 2.3, tl)) }) }, n: 'pall' }; }
    case '28': { const klipp = MT() + ML(36) + 1.0; return { kam: tl < klipp ? 'hel' : 'pall', k: { ...brits, f: KF('nyfiken') }, n: 'pall', skimmer: tl > (LT('tindra')[0] ?? 99) ? del(LT('tindra')[0], LT('tindra')[0] + 0.4, tl) : 0, tl }; }
    case '29': return { kam: 'pall', k: brits, n: 'pall', skimmer: 1, tl };
    case '30': { const s = skuttPos(PA_BRITS, PA_GOLV, tl, 0.2, 0.8, 100), st = del(0.2, 0.6, tl);
      return { kam: 'hel', k: { pa: s.pa, f: tl > 0.9 ? KF('sover', 0.8) : glad, p: tl > 0.9 ? KP('magen') : { ...KL.blandaPose('sitter', 'neutral', st), armar: KL.blandaPose('sitter', 'neutral', st).armar.map(a => a + NER) } }, n: tl < 0.85 ? 'pall' : 'tillFamnPall', nu: del(0.85, 1.15, tl) }; }
    case '31a': return { kam: 'kanin', k: { ...golv, f: KF('nyfiken', 1, { titt: [8, -10] }), p: KP('magen') }, n: 'famn', stj: 'kontur', jk: kl((tl - 0.4) / 2.0), krita: 'stjarna', tl };

function ritaRad(id, tl, d) {

  const dp = dd.p || DP();

      lagg('fram', `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(24 + 34 * u)}" fill="none" stroke="#fff" stroke-width="${f1(7 * (1 - u) + 1)}" opacity="${f1(1 - u)}"/>`); } };

  const lj = ljud(), finns = await Promise.all(lj.map(c => fetch('/' + c.fil, { method: 'HEAD' }).then(r => r.ok, () => false)));
