<!doctype html>

<body>
<!-- 040 Leoparden går och lägger sig: hela kodscenen (grind 6). Ritverktygen är storyboardens (../../storyboard/scen.html, kopierade hit),
     tiderna, Malin och effekterna ur rader.json (skrivs av storyboard/bygg.mjs). Inget eget intro: filmen ligger bakom julkalenderns lucka 3.
     Rendera från repots rot: node avsnitt/040-leoparden-gar-och-lagger-sig/scener/render.mjs avsnitt/040-leoparden-gar-och-lagger-sig/scener/kvall [--snabb] -->
<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="korn" x="0" y="0" width="1" height="1">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="2"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.47  0 0 0 0 0.36  1.1 0 0 0 -0.47"/>
    </filter>
    <filter id="boil" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="5000">
      <feTurbulence id="brus" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
      <feDisplacementMap in="SourceGraphic" scale="2.5"/>
    </filter>
    <filter id="kranKorn" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .5  0 0 0 0 .56  0 0 0 .22 0"/><feComposite in2="SourceGraphic" operator="in"/><feMerge><feMergeNode in="SourceGraphic"/><feMergeNode/></feMerge></filter>
    <filter id="fjader" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <!-- J03 "polish the sink tap": svansen (en del av kroppsbilden, x > 790, y > 640 i riggens ruta) klipps bort bakom handfatet, annars trasslar den in sig i kranen -->
    <clipPath id="utanSvans" clipPathUnits="userSpaceOnUse"><path id="utanSvansP" d="M-600 -600H1700V640H790V1700H-600Z"/></clipPath>
    <!-- J03 runda 5: saker som stiger upp bakom handfatets läpp syns bara ovanför den (höjden sätts i badrum()) -->
    <clipPath id="overLapp" clipPathUnits="userSpaceOnUse"><rect id="overLappR" x="-600" y="-600" width="3200" height="1"/></clipPath>
    <clipPath id="fyllklipp"><circle id="fyllcirkel" r="0"/></clipPath>
    <radialGradient id="sken"><stop offset="0" stop-color="#FFE38A" stop-opacity=".85"/><stop offset="1" stop-color="#FFE38A" stop-opacity="0"/></radialGradient>
    <radialGradient id="nattsken"><stop offset="0" stop-color="#FFE7A0" stop-opacity=".55"/><stop offset=".45" stop-color="#FFD27A" stop-opacity=".18"/><stop offset="1" stop-color="#FFD27A" stop-opacity="0"/></radialGradient>
    <radialGradient id="rumsken"><stop offset="0" stop-color="#FFD98A" stop-opacity=".55"/><stop offset=".5" stop-color="#FFC27A" stop-opacity=".15"/><stop offset="1" stop-color="#FFC27A" stop-opacity="0"/></radialGradient>
    <radialGradient id="manesken"><stop offset="0" stop-color="#FFF3C4" stop-opacity=".45"/><stop offset="1" stop-color="#FFF3C4" stop-opacity="0"/></radialGradient>
    <radialGradient id="nattgrad" gradientUnits="userSpaceOnUse" cx="1000" cy="720" r="1000"><stop offset="0" stop-color="#B8C6F0"/><stop offset=".55" stop-color="#4062C8"/><stop offset="1" stop-color="#2341B0"/></radialGradient>
    <linearGradient id="kvall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F2E5E"/><stop offset="1" stop-color="#40598F"/></linearGradient>
    <mask id="glas" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080"><image href="/assets/bakgrunder/rosa-sovrummet/fonster-mask.png" width="1920" height="1080" preserveAspectRatio="xMidYMid slice"/></mask>
    <g id="snodefs"></g>
    <!-- julbäddningen i kod (Sanna 2026-11-18): rött täcke med vita snöflingor, gräddvit vikt kant med röda ränder, rutig kudde -->
    <pattern id="flingor" width="64" height="56" patternUnits="userSpaceOnUse">
      <rect width="64" height="56" fill="#c8323a"/>
      <g stroke="#fff4e4" stroke-width="3.2" stroke-linecap="round"><path d="M16 8v16M8 16h16M10.5 10.5l11 11M21.5 10.5l-11 11"/><path d="M48 36v14M41 43h14M43 38l10 10M53 38l-10 10"/></g>
      <g stroke="#ffb3cf"><path d="M48 36v14M41 43h14M43 38l10 10M53 38l-10 10"/></g>
      <path d="M44 9c-3-4-8 0-4 4l4 4 4-4c4-4-1-8-4-4z" fill="#ffb3cf"/><circle cx="14" cy="44" r="2.6" fill="#fff4e4"/></pattern>
    <pattern id="randig" width="34" height="34" patternUnits="userSpaceOnUse"><rect width="34" height="34" fill="#fff4e4"/><rect width="11" height="34" fill="#f29bbb"/><rect x="20" width="4" height="34" fill="#d8434b"/></pattern>
    <pattern id="rutig" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#fff4f7"/>
      <rect width="40" height="16" fill="#f7a8c4" opacity=".7"/><rect width="16" height="40" fill="#f7a8c4" opacity=".7"/><rect x="28" width="3" height="40" fill="#d8434b" opacity=".8"/><rect y="28" width="40" height="3" fill="#d8434b" opacity=".8"/></pattern>
  </defs>
  <rect width="1920" height="1080" fill="#FAF8F2"/>
  <g id="kamera">
    <g id="platta"></g>
    <g id="snoFon" mask="url(#glas)" display="none"></g>
    <g id="bak"></g>
    <g filter="url(#boil)"><g id="sakerbak"></g></g>
    <g id="pall"></g>
    <g filter="url(#boil)"><g id="figurer"></g></g>
    <g id="kar"></g>
    <g filter="url(#boil)"><g id="saker"></g></g>
    <g id="natt"></g>
    <g id="fram" filter="url(#boil)"></g>
    <g id="pilar"></g>
  </g>
  <g id="ram"></g>
  <g id="svep"></g>
  <g id="gomda" opacity="0"></g>
</svg>
<script src="/verktyg/blinka.js"></script>
<script src="/verktyg/kant.js"></script>
<script src="/verktyg/kritan-ritar.js"></script>
<script src="/produktion/rum/sno.js"></script>
<script src="/produktion/youtube/shorts/godnatt/nalle-v2.js"></script>
<script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script>
const $ = id => document.getElementById(id);
const A = '/assets/', R = A + 'rekvisita/', NS = 'http://www.w3.org/2000/svg';
const KL = '/avsnitt/040-leoparden-gar-och-lagger-sig/klader-lager/';
const lagg = (id, h) => $(id).insertAdjacentHTML('beforeend', h);
const bild = (href, w, h, t, extra = '') => `<image href="${href}" width="${w}" height="${h}" transform="${t}" ${extra}/>`;
const SKJORTA = { fil: R + 'pyjamasskjorta/cut/pyjamasskjorta.png', w: 876, h: 736 };
const STJ = { fil: R + 'adventsstjarna/cut/adventsstjarna.png', w: 766, h: 874, mitt: [383, 470] };
let KONTUR = {};

let L, G, GS = 0.55;                                 // riggen, leopardens grupp, skalan i rummet
const iFig = ([x, fot], [px, py], s = GS) => [x + (px - 512) * s, fot + (py - L.FOTTER) * s];

// --- Kameran: zoom 1 = hela plattan; visar aldrig utanför bakgrunden -------------------------------------------------------
let ZOOM = 1;
function kamera(zoom = 1, cx = 960, cy = 540) {
  ZOOM = zoom;
  const tx = Math.max(1920 - 1920 * zoom, Math.min(0, 960 - cx * zoom)), ty = Math.max(1080 - 1080 * zoom, Math.min(0, 540 - cy * zoom));
  $('kamera').setAttribute('transform', `translate(${tx.toFixed(1)} ${ty.toFixed(1)}) scale(${zoom})`);
  $('brus').nextElementSibling.setAttribute('scale', (2.5 / zoom).toFixed(2)); $('brus').setAttribute('seed', 1 + Math.floor(TT * 6) % 50);   // line boil 2,5 px i bild, ny brusbild 6 gånger/s (CLAUDE.md)
}

// --- Effekter och notation ---------------------------------------------------------------------------------------------------
const glans = (x, y, r, o = 1) => `<path transform="translate(${x} ${y}) scale(${r})" opacity="${o}" d="M0 -1 L.2 -.2 L1 0 L.2 .2 L0 1 L-.2 .2 L-1 0 L-.2 -.2Z" fill="#fff6c8" stroke="#e6b422" stroke-width=".06"/>`;
const skimmer = (x, y, k = 1, vidd = 1) => lagg('fram', [[-1, -0.7, 1], [1.1, -0.4, 0.8], [0.2, 1.1, 0.7], [-1.2, 0.8, 0.6]]
  .map(([dx, dy, s]) => glans(x + dx * 40 * vidd, y + dy * 34 * vidd, 16 * s * k * vidd, Math.min(1, 0.4 + k))).join(''));
const pil = (d, x, y, v, s = 6) => `<g fill="none" stroke="#7b2cbf" stroke-width="${s}" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
  <path d="${d}" stroke-dasharray="${3 * s} ${2.4 * s}"/><path d="M${x + 5 * s * Math.cos(v + 2.6)} ${y + 5 * s * Math.sin(v + 2.6)} L${x} ${y} L${x + 5 * s * Math.cos(v - 2.6)} ${y + 5 * s * Math.sin(v - 2.6)}"/></g>`;
const rakpil = (x0, y0, x1, y1, s) => pil(`M${x0} ${y0} L${x1} ${y1}`, x1, y1, Math.atan2(y1 - y0, x1 - x0), s);
const bagpil = (x0, y0, cx, cy, x1, y1, s) => pil(`M${x0} ${y0} Q${cx} ${cy} ${x1} ${y1}`, x1, y1, Math.atan2(y1 - cy, x1 - cx), s);
const pilar = () => {};   // rörelsepilarna finns bara i storyboarden
const nickpil = (x, y, s = 5) => pilar(bagpil(x + 40, y - 30, x + 70, y + 10, x + 40, y + 50, s), bagpil(x + 70, y + 50, x + 100, y + 10, x + 70, y - 30, s));
const skakpil = (x, y, s = 5) => pilar(pil(`M${x - 80} ${y} Q${x} ${y - 36} ${x + 80} ${y}`, x + 80, y, 0.6, s), pil(`M${x + 80} ${y + 22} Q${x} ${y - 14} ${x - 80} ${y + 22}`, x - 80, y + 22, Math.PI - 0.6, s));
const text = (x, y, t, s = 34) => lagg('fram', `<text x="${x}" y="${y}" style="font:800 ${s}px Fredoka,system-ui;fill:#7b2cbf">${t}</text>`);
// adventsstjärnan med mitten i (x, y), skala s: fyll = ifyllnaden inifrån (0–1, kritan-ritar.js fyllMask), tand = skenet (0–1),
// rit = kritans linje (ritBana i bildens pixlar) som tonas bort medan stjärnan fylls. Snöret (i fönstret) är det sista kritstrecket
// och blir det riktiga snöret när stjärnan fylls: ett tvinnat rött och vitt snöre med en guldnål i valvet och en liten guldögla i
// stjärnans udd. På natten (NATT > 0) ligger stjärnan och ett större sken ovanför nattens mörker, så att den lyser starkare.
const iFonster = (x, y, s) => y > 200 && y < 500 && x < 800 && s < 0.5;
function stjarna(x, y, s, { fyll = 1, tand = 1, rit = null, lager = 'saker', snore = iFonster(x, y, s) } = {}) {
  const t = `translate(${x - STJ.mitt[0] * s} ${y - STJ.mitt[1] * s}) scale(${s})`;
  if (NATT > 0 && lager === 'saker') lager = 'natt';
  if (tand > 0) lagg('bak', `<circle cx="${x}" cy="${y}" r="${520 * s * (0.6 + 0.4 * tand)}" fill="url(#sken)" opacity="${tand}"/>`);
  if (tand > 0 && NATT > 0) { const p = 1 + 0.06 * Math.sin(TT * 1.4);
    lagg('natt', `<g style="mix-blend-mode:screen" opacity="${(tand * NATT).toFixed(2)}"><circle cx="${x}" cy="${y}" r="${(1250 * s * p).toFixed(1)}" fill="url(#nattsken)"/>
      <circle cx="${x}" cy="${y}" r="${(560 * s * p).toFixed(1)}" fill="url(#sken)" opacity=".9"/></g>`); }
  if (snore && fyll > 0) { const y1 = y - (STJ.mitt[1] - 30) * s, y0 = FON.y0 + 6, d = `M${x} ${y1} Q${x + 5} ${(y0 + y1) / 2} ${x} ${y0}`;
    lagg('bak', `<g opacity="${fyll.toFixed(2)}"><path d="${d}" fill="none" stroke="#fff" stroke-width="7.5" stroke-linecap="round" opacity=".9"/>
      <path d="${d}" fill="none" stroke="#c8323a" stroke-width="4" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#fff4e4" stroke-width="4" stroke-dasharray="4 5"/>
      <circle cx="${x}" cy="${y1 + 3}" r="5" fill="none" stroke="#E2B84F" stroke-width="3"/>
      <circle cx="${x}" cy="${y0}" r="7.5" fill="#E2B84F" stroke="#fff" stroke-width="2.5"/><circle cx="${x - 2.2}" cy="${y0 - 2.2}" r="2.2" fill="#fff8d8"/></g>`); }
  if (fyll > 0) lagg(lager, `<g transform="${t}">${fyll < 1 ? fyllMask(`sf${x | 0}`, STJ.mitt[0], STJ.mitt[1], 560, fyll) : ''}
    <image href="${STJ.fil}" width="${STJ.w}" height="${STJ.h}" ${fyll < 1 ? `clip-path="url(#sf${x | 0})"` : ''}/></g>`);
  if (rit && fyll < 1) lagg('pilar', `<g transform="${t}" opacity="${linjeOpacitet(fyll).toFixed(3)}">${rit.html}</g>`);
}
// Kritan ritar stjärnan (skillen kritan-ritar, verktyg/kritan-ritar.js): konturen i ett drag, en kort vila, sedan fyra detaljstreck,
// de stora hålen i ringen (uppe, höger, nere, vänster; mätta i bilden), och i fönstret sist snöret uppåt till valvet.
// T = kritans faser i filmens sekunder, [x, y, s] = stjärnans mitt och skala, bredd = linjens bredd i bild, vanta = väntplatsen.
const STJ_HAL = [[382, 335], [542, 490], [382, 645], [222, 490]].map(([x, y]) => `M${x} ${y - 18} A18 18 0 1 1 ${x - 0.1} ${y - 18}`);
function ritStjarna(T, [x, y, s], bredd, { fyll = 0, tand = 0, vanta, ks = kritaSkala(ZOOM), farg = KRITAN.LINJE }) {
  const snore = iFonster(x, y, s) ? [`M382 30 Q403 ${((30 + (FON.y0 + 6 - y) / s + STJ.mitt[1]) / 2).toFixed(1)} 382 ${((FON.y0 + 6 - y) / s + STJ.mitt[1]).toFixed(1)}`] : [];
  const k = ritfart((TT - T.rit[0]) / (T.rit[1] - T.rit[0]));
  const R = ritBana([KONTUR.stjarna.d, ...STJ_HAL, ...snore], k, { vila: [0.5],
    attr: `fill="none" stroke="${farg}" stroke-width="${(bredd / s).toFixed(2)}" stroke-linecap="round" stroke-linejoin="round"` });
  stjarna(x, y, s, { fyll, tand, rit: TT >= T.rit[0] ? R : null });
  const sc = ([px, py]) => [x + (px - STJ.mitt[0]) * s, y + (py - STJ.mitt[1]) * s];
  const kr = kritaFas(TT, T, { start: sc(R.start), spets: sc(R.spets), slut: sc(R.slut), vanta, s: ks });
  if (kr) lagg('pilar', kritaBild(kr.x, kr.y, kr));
}
// gnistorna på svaret, i stjärnans storlek (gnistor() är gjord för en sak på ca 0,85 av helbilden)
const stjGnistor = (x, y, s, t) => lagg('pilar', `<g transform="translate(${x} ${y}) scale(${(s / 0.85).toFixed(3)}) translate(${-x} ${-y})">${gnistor(x, y, 330, t)}</g>`);
// Papperet fyller hela bilden med kritkorn, ingen pappersskant (Sanna 2026-11-18: "match other videos", som 039:s papper2).
const papper = () => { $('platta').innerHTML = `<rect x="-200" y="-200" width="2400" height="1500" fill="#FBF7EE"/><rect x="-200" y="-200" width="2400" height="1500" filter="url(#korn)"/>`; };

// --- Leoparden med pyjamasskjortan (lagren på riggens delar, som ../rorelsetest/) ---------------------------------------------
function skjortaIn(g) {
  g.querySelectorAll('image[class^="arm-"]').forEach(img => {
    const klass = img.getAttribute('class'), grupp = document.createElementNS(NS, 'g'), fil = img.getAttribute('href').split('lova-')[1];
    grupp.setAttribute('class', klass); img.removeAttribute('class'); img.replaceWith(grupp);
    grupp.append(img); grupp.insertAdjacentHTML('beforeend', `<image class="skj" href="${KL}skjorta-${fil}" width="1024" height="1024"/>`);
  });
  g.querySelector('.mage').insertAdjacentHTML('afterend', `<image class="skj" href="${KL}skjorta-kropp.png" width="1024" height="1024"/>`);
  // hela skjortan över huvudet (tittut, uppslag 7): urklippet, halsen vid riggens y 170
  g.querySelector('.figuren').insertAdjacentHTML('beforeend', `<image class="hel" href="${SKJORTA.fil}" width="${SKJORTA.w}" height="${SKJORTA.h}" x="${512 - 438}" y="170"/>`);
  g.querySelector('.sovbild image').setAttribute('href', A + 'karaktarer/leoparden-lova/premium/cut-tunn/lova-sover-pyjamas.png');
}
const P = o => ({ ...L.POSE0, ...o });
// glada ansikten har öppna ögon (bilderbokens regel); blunda bara där raden ber om det
const F = (n, o = {}) => ({ ...L.blanda('neutral', n, 1), ...(['glad', 'jatteglad', 'fnissig', 'stolt', 'flinar'].includes(n) ? { glad: [0, 0] } : {}), ...o });
const GAP = o => ({ ...F('flinar'), glad: [0, 0], tand: 1, tandNere: 1, tunga: 1, mun: [58, 48, 1, 450], ...o });
// lova(var, ansikte, pose, { skjorta: 0 av, 1 på, 'hel' över huvudet; bakom: benen dolda; s })
function lova([x, fot], f, p, { skjorta = 1, bakom = false, s = GS } = {}) {
  if (FANGA) { FORE = { x, fot, f, p, s, bad: I_BADRUM }; return; }
  // J03 26/11 (1:54) "abrupt jump, make all movement seamless": de första BLEND s av en rad glider leoparden från förra radens sista
  // pose (läge, storlek, ansikte och kropp), så att inget uttryck, ingen lutning, vridning eller arm byts på en bildruta. Inte mellan rummen.
  const fo = FORE; if (fo && !fo.p.sovbild && !p.sovbild && fo.bad === I_BADRUM && Math.abs(fo.s - s) < 0.1 && Math.hypot(fo.x - x, fo.fot - fot) < 250) {
    const k = mjuk(kl((TT - CUR.s) / BLEND)); f = blandO(fo.f, f, k); p = blandO(fo.p, p, k); x = lerp(fo.x, x, k); fot = lerp(fo.fot, fot, k); s = lerp(fo.s, s, k); }
  $('figurer').appendChild(G);
  G.setAttribute('transform', `translate(${x} ${fot}) scale(${s}) translate(-512 ${-L.FOTTER})`);
  // liv: blinkningen (inte när den sover eller blundar glatt) och andningen (3,6 s per andetag), som rigg-motorns liv
  if ((f.sov || 0) < 0.5) { const a = (1 - Math.cos(2 * Math.PI * TT / 3.6)) / 2; f = BLINKA(f, TT);
    p = { ...p, strack: (p.strack || 0) + 0.012 * a, bred: (p.bred || 0) + 0.006 * a, oron: (p.oron || [0, 0]).map(o => o - 2 * a) }; }
  if (G.sakNamn !== SAK) { L.sakIn(G, SAK ? SAKER[SAK]() : null); G.sakNamn = SAK; }
  L.rita(G, f, p);
  // skjorta: 0 av, 1 på, 'hel' över huvudet, eller { k: bålen 0,4 uppdragen … 1 nere, l, r: ärmarna 0/1 } (runda 2: "ena armen och andra armen", skjortan åker ner)
  const sk = typeof skjorta === 'object' ? skjorta : { k: 1, l: +(skjorta === 1), r: +(skjorta === 1) }, pa = skjorta !== 0 && skjorta !== 'hel';
  G.querySelectorAll('.skj').forEach(e => { const h = e.getAttribute('href'), o = !pa ? 0 : h.includes('arm-l') ? sk.l : h.includes('arm-r') ? sk.r : 1;
    e.setAttribute('opacity', o); if (h.includes('kropp')) e.setAttribute('transform', sk.k < 1 ? `translate(0 556) scale(1 ${sk.k.toFixed(3)}) translate(0 -556)` : ''); });
  G.querySelector('.hel').setAttribute('opacity', skjorta === 'hel' ? 1 : 0);
  if (bakom) G.querySelectorAll('.leg-l,.leg-r,.skugga').forEach(e => e.setAttribute('opacity', 0));
  if (bakom && I_BADRUM) { $('utanSvansP').setAttribute('d', (y => `M-600 -600H1700V${y}H790L782 ${y + 60}L752 ${y + 130}L705 ${y + 190}V1700H-600Z`)(640 + (p.lyft || 0))); G.setAttribute('clip-path', 'url(#utanSvans)'); }   // klippet följer hoppet (lyft)
}
const HUG = { a: -60, aL: -48, k: 215, s: 0.38, gx: 135, gy: 600, upp: 125 };   // gx: greppet på nallens högra sida, så att nallen hamnar mellan tassarna   // aL: vänster arm lite högre, så att tassarna ligger på var sin sida om nallen (runda 8: "show both paws")   // kramen (rad 28): armarnas vinkel, inskjutning över magen, nallens skala och greppets höjd
const VINKA = { armar: [0, 150] }, VINK_BAS = 40;    // J03 runda 7: vinkarmens grundvinkel (snett upp förbi kroppens kant)
// Saker i tassen (riggens sakIn/sakRita, verktyg/rigg-motor.js; runda 2 2026-11-18: "much better" borstning och drickande, som 038):
// borsten och muggen sitter i högra tassen framför magen och förs till munnen (sakMun). SAK = sakens namn i den här bildrutan.
const SAKER = {
  // J03: borsten utan kvist och rosett (../../saker/), med en rand tandkräm (.pasta) som tuben lägger på i rad 13
  borste: () => ({ ...L.sakBild(BORSTE, 877, 238, { grepp: [700, 119], fot: [438, 238], skala: 0.32, folj: 1, kant: 3, mun: [110, 119] }),
    svg: `<image href="${BORSTE}" width="877" height="238"/>${PASTA_D.map((c, i) => `<path class="pasta" d="M42 6 q24 -24 48 0 t48 0 t48 0" pathLength="1" fill="none" stroke="${c}" stroke-width="${[40, 30, 10][i]}" stroke-linecap="round" stroke-dasharray="0 2"/>`).join('')}` }),
