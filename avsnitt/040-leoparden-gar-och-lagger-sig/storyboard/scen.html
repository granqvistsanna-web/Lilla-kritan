<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Leoparden går och lägger sig scener</title>
<style>html, body { margin:0; background:#000; } svg { width:100vw; height:auto; display:block; }</style>
</head>
<body>
<!-- 040 Leoparden går och lägger sig: kodscenerna för storyboarden. window.rad(id) ritar radens stillbild (id som i rader.mjs, ?rad=14 visar en).
     Serveras från repots rot (bygg.mjs). Förlagor: 023 storyboard/scen.html (badrummet, leoparden bakom handfatet), produktion/rum/julsovrummet
     (rummet), 039 storyboard/scen.html (plaggen som lager på riggen, kritans konturer). Leoparden är Lovas v2-rigg live ur uttryck.html, med
     pyjamasskjortan som lager (../klader-lager/, gjorda av ../klader.py) och sovbilden i pyjamas. Julljusen är fyra adventsljus i ljusstaken
     på nattduksbordet (Sanna 2026-11-18: riktiga ljus), som leoparden blåser ut. Rörelsepilar (lila, streckade) finns bara i storyboarden. -->
<svg viewBox="0 0 1920 1080">
  <defs>
    <filter id="boil" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="5000">
      <feTurbulence id="brus" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
      <feDisplacementMap in="SourceGraphic" scale="5"/>
    </filter>
    <clipPath id="fyllklipp"><circle id="fyllcirkel" r="0"/></clipPath>
    <radialGradient id="sken"><stop offset="0" stop-color="#FFE38A" stop-opacity=".85"/><stop offset="1" stop-color="#FFE38A" stop-opacity="0"/></radialGradient>
    <radialGradient id="rumsken"><stop offset="0" stop-color="#FFD98A" stop-opacity=".55"/><stop offset=".5" stop-color="#FFC27A" stop-opacity=".15"/><stop offset="1" stop-color="#FFC27A" stop-opacity="0"/></radialGradient>
    <radialGradient id="manesken"><stop offset="0" stop-color="#FFF3C4" stop-opacity=".45"/><stop offset="1" stop-color="#FFF3C4" stop-opacity="0"/></radialGradient>
    <linearGradient id="kvall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F2E5E"/><stop offset="1" stop-color="#40598F"/></linearGradient>
    <mask id="glas" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080"><image href="/assets/bakgrunder/julsovrummet/fonster-mask-valvt.png" width="1920" height="1080" preserveAspectRatio="xMidYMid slice"/></mask>
    <g id="snodefs"></g>
  </defs>
  <rect width="1920" height="1080" fill="#FAF8F2"/>
  <g id="kamera">
    <g id="platta"></g>
    <g id="bak"></g>
    <g filter="url(#boil)"><g id="sakerbak"></g></g>
    <g id="pall"></g>
    <g filter="url(#boil)"><g id="figurer"></g></g>
    <g id="kar"></g>
    <g filter="url(#boil)"><g id="saker"></g></g>
    <g id="natt"></g>
    <g id="fram" filter="url(#boil)"></g>
    <g id="pilar"></g>
  </g>
  <g id="ram"></g>
  <g id="gomda" opacity="0"></g>
</svg>
<script src="/verktyg/blinka.js"></script>
<script src="/verktyg/kant.js"></script>
<script src="/produktion/rum/sno.js"></script>
<script src="/produktion/youtube/shorts/godnatt/nalle-v2.js"></script>
<script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script>
const $ = id => document.getElementById(id);
const A = '/assets/', R = A + 'rekvisita/', NS = 'http://www.w3.org/2000/svg';
const KL = '/avsnitt/040-leoparden-gar-och-lagger-sig/klader-lager/';
const lagg = (id, h) => $(id).insertAdjacentHTML('beforeend', h);
const bild = (href, w, h, t, extra = '') => `<image href="${href}" width="${w}" height="${h}" transform="${t}" ${extra}/>`;
const KRITA = R + 'krita-rod/cut/krita-rod.png', KRITA_SPETS = [742, 132];
const SKJORTA = { fil: R + 'pyjamasskjorta/cut/pyjamasskjorta.png', w: 876, h: 736 };
const STJ = { fil: R + 'adventsstjarna/cut/adventsstjarna.png', w: 766, h: 874, mitt: [383, 470] };
let KONTUR = {};

let L, G, GS = 0.55;                                 // riggen, leopardens grupp, skalan i rummet
const iFig = ([x, fot], [px, py], s = GS) => [x + (px - 512) * s, fot + (py - L.FOTTER) * s];

// --- Kameran: zoom 1 = hela plattan; visar aldrig utanför bakgrunden -------------------------------------------------------
function kamera(zoom = 1, cx = 960, cy = 540) {
  const tx = Math.max(1920 - 1920 * zoom, Math.min(0, 960 - cx * zoom)), ty = Math.max(1080 - 1080 * zoom, Math.min(0, 540 - cy * zoom));
  $('kamera').setAttribute('transform', `translate(${tx.toFixed(1)} ${ty.toFixed(1)}) scale(${zoom})`);
  $('brus').nextElementSibling.setAttribute('scale', (5 / zoom).toFixed(2));
}

// --- Effekter och notation ---------------------------------------------------------------------------------------------------
const glans = (x, y, r, o = 1) => `<path transform="translate(${x} ${y}) scale(${r})" opacity="${o}" d="M0 -1 L.2 -.2 L1 0 L.2 .2 L0 1 L-.2 .2 L-1 0 L-.2 -.2Z" fill="#fff6c8" stroke="#e6b422" stroke-width=".06"/>`;
const skimmer = (x, y, k = 1, vidd = 1) => lagg('fram', [[-1, -0.7, 1], [1.1, -0.4, 0.8], [0.2, 1.1, 0.7], [-1.2, 0.8, 0.6]]
  .map(([dx, dy, s]) => glans(x + dx * 40 * vidd, y + dy * 34 * vidd, 16 * s * k * vidd, Math.min(1, 0.4 + k))).join(''));
const pil = (d, x, y, v, s = 6) => `<g fill="none" stroke="#7b2cbf" stroke-width="${s}" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
  <path d="${d}" stroke-dasharray="${3 * s} ${2.4 * s}"/><path d="M${x + 5 * s * Math.cos(v + 2.6)} ${y + 5 * s * Math.sin(v + 2.6)} L${x} ${y} L${x + 5 * s * Math.cos(v - 2.6)} ${y + 5 * s * Math.sin(v - 2.6)}"/></g>`;
const rakpil = (x0, y0, x1, y1, s) => pil(`M${x0} ${y0} L${x1} ${y1}`, x1, y1, Math.atan2(y1 - y0, x1 - x0), s);
const bagpil = (x0, y0, cx, cy, x1, y1, s) => pil(`M${x0} ${y0} Q${cx} ${cy} ${x1} ${y1}`, x1, y1, Math.atan2(y1 - cy, x1 - cx), s);
const pilar = (...p) => lagg('pilar', p.join(''));
const nickpil = (x, y, s = 5) => pilar(bagpil(x + 40, y - 30, x + 70, y + 10, x + 40, y + 50, s), bagpil(x + 70, y + 50, x + 100, y + 10, x + 70, y - 30, s));
const skakpil = (x, y, s = 5) => pilar(pil(`M${x - 80} ${y} Q${x} ${y - 36} ${x + 80} ${y}`, x + 80, y, 0.6, s), pil(`M${x + 80} ${y + 22} Q${x} ${y - 14} ${x - 80} ${y + 22}`, x - 80, y + 22, Math.PI - 0.6, s));
const text = (x, y, t, s = 34) => lagg('fram', `<text x="${x}" y="${y}" style="font:800 ${s}px Fredoka,system-ui;fill:#7b2cbf">${t}</text>`);
const krita = (x, y, v = 125, s = 0.33) => lagg('pilar', bild(KRITA, 755, 265, `translate(${x} ${y}) rotate(${v}) scale(${s}) translate(${-KRITA_SPETS[0]} ${-KRITA_SPETS[1]})`));
function kontur(namn, t, k, bredd, farg = '#9a8a7a') {   // en kontur (json ur verktyg/kontur.py) ritad till andelen k; returnerar kritans spets
  lagg('pilar', `<g transform="${t}"><path id="k-${namn}" d="${KONTUR[namn].d}" pathLength="1" fill="none" stroke="${farg}" stroke-width="${bredd}"
    stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="${k} 2"/></g>`);
  const p = $('k-' + namn), q = p.getPointAtLength(p.getTotalLength() * Math.min(0.999, k)), sm = $('kamera').getCTM().inverse().multiply(p.getCTM());
  const pt = new DOMPoint(q.x, q.y).matrixTransform(sm); return [pt.x, pt.y];
}
// adventsstjärnan med mitten i (x, y), skala s: k = konturen (0–1), fyll = ifyllnaden inifrån (0–1), tand = skenet (0–1)
function stjarna(x, y, s, { k = 1, fyll = 1, tand = 1, lager = 'saker' } = {}) {
  const t = `translate(${x - STJ.mitt[0] * s} ${y - STJ.mitt[1] * s}) scale(${s})`;
  if (tand > 0) lagg('bak', `<circle cx="${x}" cy="${y}" r="${520 * s * (0.6 + 0.4 * tand)}" fill="url(#sken)" opacity="${tand}"/>`);
  if (fyll > 0) lagg(lager, `<g transform="${t}"><clipPath id="sf${x | 0}"><circle cx="${STJ.mitt[0]}" cy="${STJ.mitt[1]}" r="${560 * fyll}"/></clipPath>
    <image href="${STJ.fil}" width="${STJ.w}" height="${STJ.h}" clip-path="url(#sf${x | 0})"/></g>`);
  if (fyll < 1 && k > 0) return kontur('stjarna', t, k, 10 / s);
  return null;
}
const papper = () => { $('platta').innerHTML = `<rect x="-200" y="-200" width="2400" height="1500" fill="#F6EFE3"/>
  <rect x="120" y="70" width="1680" height="940" rx="14" fill="#FDFBF4" stroke="#e8e0cf" stroke-width="6"/>`; };

// --- Leoparden med pyjamasskjortan (lagren på riggens delar, som ../rorelsetest/) ---------------------------------------------
function skjortaIn(g) {
  g.querySelectorAll('image[class^="arm-"]').forEach(img => {
    const klass = img.getAttribute('class'), grupp = document.createElementNS(NS, 'g'), fil = img.getAttribute('href').split('lova-')[1];
    grupp.setAttribute('class', klass); img.removeAttribute('class'); img.replaceWith(grupp);
    grupp.append(img); grupp.insertAdjacentHTML('beforeend', `<image class="skj" href="${KL}skjorta-${fil}" width="1024" height="1024"/>`);
  });
  g.querySelector('.mage').insertAdjacentHTML('afterend', `<image class="skj" href="${KL}skjorta-kropp.png" width="1024" height="1024"/>`);
  // hela skjortan över huvudet (tittut, uppslag 7): urklippet, halsen vid riggens y 170
  g.querySelector('.figuren').insertAdjacentHTML('beforeend', `<image class="hel" href="${SKJORTA.fil}" width="${SKJORTA.w}" height="${SKJORTA.h}" x="${512 - 438}" y="170"/>`);
  g.querySelector('.sovbild image').setAttribute('href', A + 'karaktarer/leoparden-lova/premium/cut-tunn/lova-sover-pyjamas.png');
}
const P = o => ({ ...L.POSE0, ...o });
// glada ansikten har öppna ögon (bilderbokens regel); blunda bara där raden ber om det
const F = (n, o = {}) => ({ ...L.blanda('neutral', n, 1), ...(['glad', 'jatteglad', 'fnissig', 'stolt', 'flinar'].includes(n) ? { glad: [0, 0] } : {}), ...o });
const GAP = o => ({ ...F('flinar'), glad: [0, 0], tand: 1, tandNere: 1, tunga: 1, mun: [46, 40, 1, 446], ...o });
// lova(var, ansikte, pose, { skjorta: 0 av, 1 på, 'hel' över huvudet; bakom: benen dolda; s })
function lova([x, fot], f, p, { skjorta = 1, bakom = false, s = GS } = {}) {
  $('figurer').appendChild(G);
  G.setAttribute('transform', `translate(${x} ${fot}) scale(${s}) translate(-512 ${-L.FOTTER})`);
  L.rita(G, f, p);
  G.querySelectorAll('.skj').forEach(e => e.setAttribute('opacity', skjorta === 1 ? 1 : 0));
  G.querySelector('.hel').setAttribute('opacity', skjorta === 'hel' ? 1 : 0);
  if (bakom) G.querySelectorAll('.leg-l,.leg-r,.skugga').forEach(e => e.setAttribute('opacity', 0));
}
const VINKA = { armar: [0, 150] };

// --- Badrummet (som 023): handfatet, leoparden bakom det på en pall, julhandduken, grankvisten med kulan, kroken ---------------
const BAD = A + 'bakgrunder/badrummet/badrummet-v1.jpeg';
const HK = 0.68, HANDFAT = { bild: R + 'handfatet/cut/handfatet.png', W: 802 * HK, H: (772 - 177) * HK, kantY: 177 * HK };
const GOLV_B = 905, HX = 1080, RIM = GOLV_B - HANDFAT.H, BX = HX - 50;
const KRAN = [HX + (598 - 401) * HK, RIM - (177 - 84) * HK];
const FATKANT = 800;                                 // leopardens y (riggens ruta) vid läppen: nästan hela pyjamasskjortan syns (Sanna 2026-11-18)
let VID;                                             // fötterna bakom handfatet (räknas när riggen är laddad)
const STA = [560, GOLV_B];                           // på golvet till vänster om handfatet innan den kliver upp (som björnen i 023)
const HANDDUK = [1560, 150, 330], KROK = [1810, 230]; // julhandduken [mitt x, överkant, höjd]; kroken för skjortan till höger om den
const TAVLA = [700, 130, 0.27];                       // tomtetavlan på väggen till vänster om handfatet [mitt x, överkant, skala] (Sanna 2026-11-18: ingen grankvist) [mitt x, överkant, skala]
const MUGG = [HX - 200, RIM - 2, 0.13];               // tandborstmuggen på läppens vänstra ände [mitt x, botten, skala]
function badrum({ skjortaPaKrok = true } = {}) {
  const [hx, hy, hh] = HANDDUK, hw = hh * 538 / 981, [kx, ky, ks] = TAVLA;
  $('platta').innerHTML = `<image href="${BAD}" width="1920" height="1080" preserveAspectRatio="xMidYMid slice"/>`;
  lagg('sakerbak', `<image href="${R}handduk-jul/cut/handduk-jul-krok.png" x="${hx - hw / 2}" y="${hy}" width="${hw}" height="${hh}"/>`
    + bild(R + 'tavlan-tomte/cut/tavlan-tomte.png', 820, 820, `translate(${kx - 410 * ks} ${ky}) scale(${ks})`)
    + `<circle cx="${KROK[0]}" cy="${KROK[1] - 22}" r="15" fill="#9aa3ad"/><path d="M${KROK[0]} ${KROK[1] - 22} V${KROK[1] + 4} q0 16 16 16" fill="none" stroke="#9aa3ad" stroke-width="10" stroke-linecap="round"/>`
    + (skjortaPaKrok ? bild(SKJORTA.fil, SKJORTA.w, SKJORTA.h, `translate(${KROK[0]} ${KROK[1] - 8}) scale(0.27) translate(-438 0)`) : ''));
  $('kar').innerHTML = `<ellipse cx="${HX}" cy="${GOLV_B + 4}" rx="${HANDFAT.W * 0.3}" ry="14" fill="#000" opacity="0.07"/>`
    + `<image href="${HANDFAT.bild}" x="${HX - HANDFAT.W / 2}" y="${RIM - HANDFAT.kantY}" width="${HANDFAT.W}" height="${HANDFAT.H + HANDFAT.kantY}" preserveAspectRatio="xMidYMax meet"/>`;
}
const mugg = (x = MUGG[0], y = MUGG[1], s = MUGG[2], v = 0) => lagg('saker', bild(R + 'tandborstmuggen/cut/tandborstmuggen.png', 758, 768, `translate(${x} ${y}) rotate(${v}) scale(${s}) translate(-379 -740)`));
const borste = (x, y, v = 0, s = 0.12) => lagg('saker', bild(R + 'tandborste-jul/cut/tandborste-jul.png', 877, 238, `translate(${x} ${y}) rotate(${v}) scale(${s}) translate(-120 -119)`));
function strale() { const [x, y] = KRAN;
  lagg('fram', `<path d="M${x - 8} ${y + 8} Q${x - 11} ${(y + RIM) / 2} ${x - 8} ${RIM + 4} L${x + 8} ${RIM + 4} Q${x + 11} ${(y + RIM) / 2} ${x + 8} ${y + 8}Z" fill="#a9dcf0" opacity="0.9"/>`); }
const stank = (x, y) => lagg('fram', [[-30, -10], [24, -18], [-6, -30], [38, 4], [-40, 8]].map(([dx, dy]) => `<circle cx="${x + dx}" cy="${y + dy}" r="7" fill="#bfe6f5" stroke="#fff" stroke-width="3"/>`).join(''));
const HEL_B = () => kamera(1), HALV_B = () => kamera(1.6, BX + 40, 450), ANS_B = () => kamera(2.4, BX, VID[1] - (L.FOTTER - 420) * GS), MUN_B = () => kamera(3.6, BX + 12, VID[1] - (L.FOTTER - 455) * GS);

// --- Julsovrummet (produktion/rum/julsovrummet): plattan, kvällshimlen och snön i fönstret, lampan, ljusstaken, sängen, nallen ---
const SOVR = A + 'bakgrunder/julsovrummet/julsovrummet-valvt-v2.jpeg';
const FON = { x0: 430, x1: 711, y0: 148, y1: 539 }, MANE = { x: 640, y: 262, r: 40 }, LAMPA = { x: 1770, y: 585 };
const STJ_FON = [571, 330, 0.17];                    // stjärnan i fönstret [mitt x, mitt y, skala]
let SNO;
// sängen (sangen.png 1273 × 667, madrassen y 288, huvudgaveln till vänster) skala 0,6 med mitten på 1130; leoparden bakom den
const GOLV_S = 905, RIM_S = 772, SANG = { s: 0.6, x: 1130 - 0.6 * 636, y: RIM_S - 0.6 * 288 };
const LX = 1330, VID_S = [LX, RIM_S + (922 - 700) * 0.5];   // FATKANT 700 som zebran, skala 0,5
const KUDDE = [880, RIM_S + 4, 0.2], NALLE_SANG = [1035, RIM_S + 10, 0.17], NALLE_GOLV = [1530, 848, 0.19];
// ljusstaken framför lampan på nattduksbordet; fyra adventsljus i kopparna (x 231, 487,5, 745, 1002 i bilden, kanten y 23)
const STAKE = { x: 1722, y: 712, s: 0.11 }, LJUS_S = 0.05;
function julrum({ lampa = 1, ljus = [1, 1, 1, 1], rok = [0, 0, 0, 0], natt = 0, nalle = 'golv', nalleBlund = 0, sang = true, kudde = true, snoTat = 0 } = {}) {
  $('platta').innerHTML = `<image href="${SOVR}" width="1920" height="1080" preserveAspectRatio="xMidYMid slice"/>
  <g mask="url(#glas)"><rect x="${FON.x0 - 10}" y="${FON.y0 - 10}" width="${FON.x1 - FON.x0 + 20}" height="${FON.y1 - FON.y0 + 20}" fill="url(#kvall)"/>
    <circle cx="${MANE.x}" cy="${MANE.y}" r="${MANE.r * 2.6}" fill="url(#manesken)"/>
    <path d="M${MANE.x - 6} ${MANE.y - 40} A40 40 0 1 0 ${MANE.x + 34} ${MANE.y + 22} A33 33 0 1 1 ${MANE.x - 6} ${MANE.y - 40}Z" fill="#F7E3A1"/>
    <path d="M${FON.x0 - 10} ${FON.y1 - 34} Q${FON.x0 + 90} ${FON.y1 - 64} ${FON.x0 + 180} ${FON.y1 - 44} T${FON.x1 + 10} ${FON.y1 - 48} V${FON.y1 + 10} H${FON.x0 - 10}Z" fill="#EEF3FA"/>
    ${SNO.svg}${snoTat ? Array.from({ length: 40 }, (_, i) => `<circle cx="${FON.x0 + (i * 73) % 280}" cy="${FON.y0 + (i * 131) % 380}" r="${3 + i % 3}" fill="#fff" opacity=".9"/>`).join('') : ''}</g>
  <rect width="1920" height="1080" fill="#2A2560" opacity=".12"/>
  <rect y="819" width="1920" height="261" fill="#EBC79A" style="mix-blend-mode:multiply" opacity=".45"/>`;
  SNO.seek(2.4);
  if (lampa) lagg('bak', `<ellipse cx="${LAMPA.x}" cy="${LAMPA.y + 40}" rx="620" ry="480" fill="url(#rumsken)"/><circle cx="${LAMPA.x}" cy="${LAMPA.y}" r="110" fill="url(#sken)"/>`);
  else lagg('bak', `<circle cx="${LAMPA.x}" cy="${LAMPA.y - 4}" r="70" fill="#5a4a6a" opacity=".35"/>`);   // släckt skärm
  // ljusstaken och ljusen
  const kx = i => STAKE.x + (231 + 257 * i - 616) * STAKE.s, ky = STAKE.y - (416 - 23) * STAKE.s;
  let h = '';
  [0, 1, 2, 3].forEach(i => { const x = kx(i), y = ky + 6;
    h += bild(R + 'adventsljus/cut/adventsljus.png', 1024, 1371, `translate(${x} ${y}) scale(${LJUS_S}) translate(-512 -1173)`);
    const vek = [x, y - (1173 - 221) * LJUS_S];
    if (ljus[i]) { lagg('bak', `<circle cx="${vek[0]}" cy="${vek[1] - 20}" r="46" fill="url(#sken)"/>`);
      h += bild(R + 'laga/cut/laga.png', 1024, 1024, `translate(${vek[0]} ${vek[1]}) scale(0.05) translate(-511.5 -901)`); }
    if (rok[i]) h += [0, 1, 2].map(j => `<circle cx="${vek[0] + 4 * Math.sin(j * 2)}" cy="${vek[1] - 14 - j * 14}" r="${5 + j * 2}" fill="#e8e6f0" opacity="${0.8 - j * 0.2}"/>`).join('');
  });
  lagg('saker', bild(R + 'ljusstake/cut/ljusstake.png', 1232, 416, `translate(${STAKE.x} ${STAKE.y}) scale(${STAKE.s}) translate(-616 -413)`) + h);
  if (sang) lagg('kar', bild(R + 'sangen/cut/sangen.png', 1273, 667, `translate(${SANG.x} ${SANG.y}) scale(${SANG.s})`));
  if (kudde) lagg('sakerbak', bild(R + 'kudde/cut/kudde-v1-lova.png', 1024, 1024, `translate(${KUDDE[0]} ${KUDDE[1]}) scale(${KUDDE[2]}) translate(-514 -934)`));
  if (nalle) { const [x, y, s] = nalle === 'golv' ? NALLE_GOLV : nalle === 'sov' ? [1240, RIM_S + 10, 0.17] : NALLE_SANG;
    lagg(nalle === 'golv' ? 'saker' : 'sakerbak', `<g transform="translate(${x - 424 * s} ${y - 831 * s}) scale(${s})">
      <image href="${R}nalle/cut/nalle-v2-ljus-tunn.png" width="848" height="856"/>${nalleAnsikte(nalleBlund)}
      <image href="${R}tomteluva/cut/tomteluva.png" x="150" y="-302" width="${1024 * 0.62}" height="${1024 * 0.62}" transform="rotate(-8 424 170)"/></g>`); }
  if (natt) lagg('natt', `<rect x="-100" y="-100" width="2120" height="1280" fill="#16205A" opacity="${0.42 * natt}"/>`);
}
const HEL_S = () => kamera(1), HALV_S = () => kamera(1.6, LX - 60, 600), ANS_S = () => kamera(2.4, LX, VID_S[1] - (922 - 420) * 0.5),
  FON_S = () => kamera(1.5, 820, 470), STAKE_S = () => kamera(3.2, STAKE.x - 40, STAKE.y - 60), STAKE_LOVA = () => kamera(2.0, 1560, 600);

// --- Ritintrot: kritan ritar adventsstjärnan på papperet ----------------------------------------------------------------------
function papperStjarna(k, fyll, tand = 0) { papper(); kamera(1);
  const sp = stjarna(960, 520, 0.85, { k, fyll, tand });
  if (k < 1 && sp) krita(...sp, 125, 0.42); else if (fyll < 1) krita(1400, 300, 140, 0.42); }
