<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lammet klär på sig storyboard</title>
<style>
:root { --paper:#fbfaf6; --card:#fff; --ink:#2a2620; --muted:#6e675c; --line:#e6e1d6; --farg:#c4452f }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper:#1d1c22; --card:#26252c; --ink:#f1ede4; --muted:#a8a196; --line:#3a3842; --farg:#f09a86; color-scheme:dark } }
:root[data-theme="dark"] { --paper:#1d1c22; --card:#26252c; --ink:#f1ede4; --muted:#a8a196; --line:#3a3842; --farg:#f09a86; color-scheme:dark }
* { box-sizing:border-box }
body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.5 system-ui,sans-serif }
.wrap { max-width:1240px; margin:0 auto; padding:40px 16px 72px }
h1 { font-size:clamp(30px,6vw,52px); margin:0 } h1 span, h2 { color:var(--farg) }
.lede { color:var(--muted); max-width:72ch }
.frames { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; margin-top:24px }
.frame { margin:0; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden }
.frame img { width:100%; height:auto; display:block }
figcaption { padding:12px 14px 14px; display:grid; gap:6px; font-size:14px } figcaption p { margin:0 }
.t { font:500 12px ui-monospace,monospace; color:var(--muted) }
.said { border-left:3px solid var(--farg); padding-left:10px }
.ans { color:var(--muted); font-size:13px }
</style></head><body><div class="wrap">
<h1>Lammet klär på sig <span>storyboard</span></h1>
<p class="lede">Avsnitt 024, 2:41.6 med 1 s logotyp. En stillbild per uppslag. Malins repliker är uppmätta, hallen och mössan är de riktiga bilderna. Lila streckade pilar visar rörelsen. 28 bilder.</p>
<div class="frames"><figure class="frame"><img src="frames/00.jpg" alt="Bild 00" loading="lazy"><figcaption>
  <div class="t">00 · 0:00.0 · 1.0 s · Intro</div><div class="said">–</div>
  <p>Lilla Kritans logotyp i 1 s. Ingen jingel, inget titelkort. Storyboarden visar ett textkort</p><p class="ans">Ljud: tyst · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/01a.jpg" alt="Bild 01a" loading="lazy"><figcaption>
  <div class="t">01a · 0:01.0 · 6.0 s · Papperet, helbild</div><div class="said"><i>"Kritan ritar …"</i> (0:02.0, 1.8 s)</div>
  <p>Kritan ritar lammets kontur i ett lugnt drag (ca 7 s totalt), halvvägs här</p><p class="ans">Ljud: kritan ritar, skogsljud under · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/01b.jpg" alt="Bild 01b" loading="lazy"><figcaption>
  <div class="t">01b · 0:07.0 · 7.5 s · Papperet, helbild</div><div class="said"><i>"Hm … vad blir det nu?"</i> (0:07.0, 1.7 s)</div>
  <p>Konturen ritas klar, sedan väntar kritan bredvid i ca 4 s och svävar: barnet gissar</p><p class="ans">Ljud: kritan ritar · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/01c.jpg" alt="Bild 01c" loading="lazy"><figcaption>
  <div class="t">01c · 0:14.5 · 3.8 s · Papperet, helbild → zoom in</div><div class="said"><i>"Oj! Ett lamm!"</i> (0:15.1, 2.0 s)</div>
  <p>Det riktiga lammet fylls i inifrån. Sista 0,8 s: zoom in i teckningen</p><p class="ans">Ljud: – · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/1.jpg" alt="Bild 1" loading="lazy"><figcaption>
  <div class="t">1 · 0:18.3 · 5.5 s · Hallen, helbild</div><div class="said"><i>"Hej, lammet! Hej, hej!"</i> (0:19.9, 1.8 s)</div>
  <p>Lammet trippar in från vänster (riggens gång), stannar och vinkar: armen bakom kroppen, snett ut förbi kanten</p><p class="ans">Ljud: små steg, glatt <code>ba</code> · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/2.jpg" alt="Bild 2" loading="lazy"><figcaption>
  <div class="t">2 · 0:23.8 · 4.2 s · Hallen, halvbild</div><div class="said"><i>"Ska du gå ut och leka?"</i> (0:24.1, 1.6 s)</div>
  <p>Lammet tittar mot dörren (riktning höger), öronen vippar</p><p class="ans">Ljud: förtjust <code>ba</code> · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/3.jpg" alt="Bild 3" loading="lazy"><figcaption>
  <div class="t">3 · 0:28.0 · 4.7 s · Hallen, helbild</div><div class="said"><i>"Då ska du väl klä på dig?"</i> (0:28.3, 1.5 s)</div>
  <p>Strumporna ligger på golvet. Lammet skakar på huvudet: hela ägget lutar ±6° tre gånger</p><p class="ans">Ljud: trumpet <code>ba</code> · Ansikte: ledsen (trumpen)</p></figcaption></figure>
<figure class="frame"><img src="frames/4.jpg" alt="Bild 4" loading="lazy"><figcaption>
  <div class="t">4 · 0:32.7 · 8.3 s · Hallen, närbild</div><div class="said"><i>"Oj då. Lammet vill visst inte klä på sig."</i> (0:33.0, 3.0 s) … <i>"Hm … vad gör vi nu?"</i> (0:37.0, 2.0 s)</div>
  <p>Lammet vänder bort huvudet (riktning vänster), öronen faller. Paus 1 s mellan replikerna</p><p class="ans">Ljud: trumpet <code>ba</code> · Ansikte: ledsen, tittar bort</p></figcaption></figure>
<figure class="frame"><img src="frames/5a.jpg" alt="Bild 5a" loading="lazy"><figcaption>
  <div class="t">5a · 0:41.0 · 4.2 s · Hallen, helbild</div><div class="said"><i>"Titta! Kritan ritar något."</i> (0:41.3, 2.4 s)</div>
  <p>Kritan kommer in uppifrån höger och stannar i luften framför lammet</p><p class="ans">Ljud: – · Ansikte: nyfiken</p></figcaption></figure>
<figure class="frame"><img src="frames/5b.jpg" alt="Bild 5b" loading="lazy"><figcaption>
  <div class="t">5b · 0:45.2 · 7.0 s · Hallen, halvbild (klipp när kritan börjar)</div><div class="said">–</div>
  <p>Kritan ritar mössans kontur i luften i ett lugnt drag (4 s), sedan gisspaus 3 s: kritan svävar bredvid</p><p class="ans">Ljud: kritan ritar · Ansikte: nyfiken</p></figcaption></figure>
<figure class="frame"><img src="frames/5c.jpg" alt="Bild 5c" loading="lazy"><figcaption>
  <div class="t">5c · 0:52.2 · 4.8 s · Hallen, halvbild</div><div class="said"><i>"En mössa! Varsågod, lammet."</i> (0:52.3, 2.8 s)</div>
  <p>Den riktiga mössan fylls i inifrån och svävar framför lammet. Kritan flyger iväg</p><p class="ans">Ljud: glitter · Ansikte: förvånad</p></figcaption></figure>
<figure class="frame"><img src="frames/6a.jpg" alt="Bild 6a" loading="lazy"><figcaption>
  <div class="t">6a · 0:57.0 · 5.9 s · Hallen, halvbild</div><div class="said"><i>"Ska vi säga tack?"</i> (0:57.3, 0.9 s)</div>
  <p>Lammet tittar på mössan, öronen reser sig. Paus 4 s: barnet säger tack</p><p class="ans">Ljud: nyfiket <code>ba</code>, sedan tyst · Ansikte: nyfiken</p></figcaption></figure>
<figure class="frame"><img src="frames/6b.jpg" alt="Bild 6b" loading="lazy"><figcaption>
  <div class="t">6b · 1:02.8 · 3.4 s · Samma</div><div class="said"><i>"Tack!"</i> (1:02.8, 0.7 s)</div>
  <p>Lammet nickar (ägget trycks ihop och sträcks en gång)</p><p class="ans">Ljud: förtjust <code>ba</code> · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/7.jpg" alt="Bild 7" loading="lazy"><figcaption>
  <div class="t">7 · 1:06.2 · 4.8 s · Hallen, halvbild</div><div class="said"><i>"Mössan på!"</i> (1:06.5, 1.9 s)</div>
  <p>Mössan glider ner uppifrån och stannar på huvudet. Öronen sticker ut under kanten</p><p class="ans">Ljud: <code>prassel-tyg</code>, fniss · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/8.jpg" alt="Bild 8" loading="lazy"><figcaption>
  <div class="t">8 · 1:11.0 · 7.8 s · Hallen, närbild (klipp)</div><div class="said"><i>"Oj! Var är lammet?"</i> (1:11.3, 2.8 s)</div>
  <p>Mössan glider ner över ögonen. Paus 4 s: bara nosen, munnen och öronen syns</p><p class="ans">Ljud: tyst, ett litet <code>ba</code> under mössan · Ansikte: – (ögonen dolda), ler</p></figcaption></figure>
<figure class="frame"><img src="frames/9.jpg" alt="Bild 9" loading="lazy"><figcaption>
  <div class="t">9 · 1:18.8 · 3.9 s · Samma</div><div class="said"><i>"Tittut!"</i> (1:18.8, 1.4 s)</div>
  <p>Mössan glider upp på <i>"Tittut!"</i>, lammet tittar fram</p><p class="ans">Ljud: <code>ba-fniss</code> · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/10.jpg" alt="Bild 10" loading="lazy"><figcaption>
  <div class="t">10 · 1:22.7 · 7.4 s · Samma</div><div class="said"><i>"Var är lammet?"</i> (1:23.0, 1.1 s) … <i>"Tittut!"</i> (1:26.0, 1.5 s)</div>
  <p>En gång till, kortare: mössan ner (paus 2 s) och upp igen på <i>"Tittut!"</i></p><p class="ans">Ljud: det långa <code>ba-fniss</code> · Ansikte: dolda → fnissig</p></figcaption></figure>
<figure class="frame"><img src="frames/11.jpg" alt="Bild 11" loading="lazy"><figcaption>
  <div class="t">11 · 1:30.1 · 4.4 s · Hallen, helbild</div><div class="said"><i>"Ska du klä på dig nu?"</i> (1:30.4, 1.4 s)</div>
  <p>Lammet sätter sig på golvet bredvid strumporna (posen <code>sitter</code>), benen ut</p><p class="ans">Ljud: förtjust <code>ba</code> · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/12.jpg" alt="Bild 12" loading="lazy"><figcaption>
  <div class="t">12 · 1:34.5 · 7.2 s · Hallen, närbild benen</div><div class="said"><i>"Först ena strumpan. Dra, dra … på!"</i> (1:34.8, 4.8 s)</div>
  <p>Lammet lyfter ena benet. Strumpan glider från golvet upp på benet och sitter på <i>"på!"</i>. <b>Shorten: 8–9 och 12–18</b></p><p class="ans">Ljud: <code>strumpa</code> · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/13.jpg" alt="Bild 13" loading="lazy"><figcaption>
  <div class="t">13 · 1:41.6 · 6.9 s · Samma</div><div class="said"><i>"Och andra strumpan. Dra, dra … på!"</i> (1:41.9, 4.1 s)</div>
  <p>Samma, andra benet</p><p class="ans">Ljud: <code>strumpa</code>, fniss · Ansikte: fnissig</p></figcaption></figure>
<figure class="frame"><img src="frames/14.jpg" alt="Bild 14" loading="lazy"><figcaption>
  <div class="t">14 · 1:48.5 · 7.2 s · Hallen, halvbild</div><div class="said"><i>"Oj, stövlarna då? Lammet vet inte var."</i> (1:48.8, 4.0 s)</div>
  <p>Lammet tittar åt vänster, sedan åt höger (ögonen och ansiktet, huvudet vänds inte)</p><p class="ans">Ljud: frågande <code>ba</code> · Ansikte: nyfiken</p></figcaption></figure>
<figure class="frame"><img src="frames/15.jpg" alt="Bild 15" loading="lazy"><figcaption>
  <div class="t">15 · 1:55.7 · 9.8 s · Hallen, närbild pallen (klipp)</div><div class="said"><i>"Kan du hjälpa lammet? Kan du se var stövlarna är?"</i> (1:56.0, 3.8 s)</div>
  <p>Två gula tår sticker fram bakom pallen. Paus 5 s; efter 3 s skimrar de svagt</p><p class="ans">Ljud: tyst, ett svagt <code>tindra</code> · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/16.jpg" alt="Bild 16" loading="lazy"><figcaption>
  <div class="t">16 · 2:05.5 · 5.2 s · Samma</div><div class="said"><i>"Ja, där! Ja, bakom pallen!"</i> (2:05.5, 3.1 s)</div>
  <p>Stövlarna skimrar tydligt</p><p class="ans">Ljud: <code>tindra</code>, förtjust <code>ba</code> · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/17.jpg" alt="Bild 17" loading="lazy"><figcaption>
  <div class="t">17 · 2:10.7 · 5.5 s · Hallen, helbild</div><div class="said"><i>"Dra, dra … på!"</i> (2:11.7, 2.2 s)</div>
  <p>Stövlarna glider fram från pallen över golvet och upp på benen, på plats på <i>"på!"</i></p><p class="ans">Ljud: <code>strumpa</code>, <code>duns</code> · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/18.jpg" alt="Bild 18" loading="lazy"><figcaption>
  <div class="t">18 · 2:16.2 · 12.7 s · Hallen, helbild</div><div class="said"><i>"Nu är du färdig! Kan du stampa med fötterna?"</i> (2:16.5, 3.4 s) … <i>"Stamp, stamp, stamp!"</i> (2:23.9, 2.6 s)</div>
  <p>Lammet står med mössa, strumpor och stövlar. Paus 4 s, sedan stampar det tre gånger, lugnt: ett ben i taget lyfts 20 px. Små streck vid foten</p><p class="ans">Ljud: <code>steg</code> ×3, <code>ba-fniss</code> · Ansikte: stolt → jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/19.jpg" alt="Bild 19" loading="lazy"><figcaption>
  <div class="t">19 · 2:28.9 · 5.1 s · Hallen, halvbild</div><div class="said"><i>"Hej då, lammet! Hej då, mössan!"</i> (2:29.2, 2.5 s)</div>
  <p>Lammet vinkar (armen bakom kroppen, snett ut förbi kanten)</p><p class="ans">Ljud: hej då-<code>ba</code> · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/20.jpg" alt="Bild 20" loading="lazy"><figcaption>
  <div class="t">20 · 2:34.1 · 5.0 s · Samma</div><div class="said"><i>"Hej då! Vi ses snart!"</i> (2:34.4, 2.4 s)</div>
  <p>Lammet vinkar klart, armen sjunker</p><p class="ans">Ljud: fniss · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/21.jpg" alt="Bild 21" loading="lazy"><figcaption>
  <div class="t">21 · 2:39.1 · 2.5 s · Hallen → kritirisen</div><div class="said">–</div>
  <p>Kritirisen drar ihop sig runt lammet</p><p class="ans">Ljud: mattan klingar ut · Ansikte: glad</p></figcaption></figure></div>
