<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scen A – Busshållplatsen</title>
<style>
  html, body { margin:0; background:#acde7a; overflow:hidden; }
  svg { width:100vw; height:100vh; display:block; }
</style>

<body>
<!-- Avsnitt 003, scen A (storyboard 03–08). Börjar på sista rutan i kritan-ritar (bussen i skala 2,5 på vägen,
     framhjulet i x 1260). Bussen kör på vägen genom början av vers 1, ett lila kritsvep byter till busshållplatsen
     på "Vem sitter där …", bussen rullar fram till kaninen på bänken och stannar. Slutar med det gröna kritsvepet mot vägen.
     Ingen text i bild. Alla tider läses ur ../../rader.txt och SHOTS i ../../storyboard/bygg.py: scenen går från
     bild 03:s start till bild 08:s slut, och sången spelar hela vägen. Vägen delas med körscenerna (../korscen-1/vag.js). -->
<script src="../kit.js"></script>
<script src="../kritsvep.js"></script>
<script src="../korscen-1/vag.js"></script>
<script>
const { clamp, lerp, mjuk, inUt, del, hopp, snurr, blink, prat, vinka, kritsvep, kamera, takt, BEAT } = kit;

// platser
const MARK = 905, SATE = 864;                // kaninens fötter på marken / när hon sitter på bänken
const BANK_X = 307;
const LILA = '#6f2dab';                      // busshållplatsens vägg
const V = 480;                               // fart på vägen (px/s), som i körscenerna
const BUSS = { s: 0.81, hjulX: 1367, y: 917 };     // vid hållplatsen (storyboard 03–08)
const VAG = { hjulX: 900 + (737 - 515.5) * 0.81, y: 978 };   // på vägen: fötterna i x 900, som i körscenerna
const START = { s: 2.5, hjulX: 1260, y: 971.5 + (812 - 804) * 2.5 };   // sista rutan i kritan-ritar
// Matchklipp från kritan-ritar: första rutan är exakt dess sista (papperet + det ritade hjulet, klipp/fanga.mjs).
// Hjulet snurrar vidare, papperet löses upp runt det, sedan drar kameran sig bakåt och hjulet blir bussens framhjul.
const MATCH = { papper: [0, 0.7], zoom: [0.7, 2.2], hjul: [1.0, 1.8],
  vinkel: 120 * (16.9667 - 11.9 - 0.2), fart: 120 };   // kritan-ritars hjulvinkel i sista rutan och dess fart (grader/s)

let T;   // alla tider i scentid, satta i tider()
let d2, fia, trad, humle, agda, buss, bussFram, bussTK, pella, kanel, papper, ritatHjul, passagerare, fonsterBas, tutStreck, hallplats, blommor, fart, d;

// ---------- tider ur rader.txt och SHOTS ----------
// Det som inte står i filerna (var i raden ett ord landar) anges i beats från radens start.
async function tider() {
  const M = await kit.manus(), rad = M.rad;
  const A0 = M.bild('03')[0], A1 = M.bild('08')[1];        // avsnittstid
  const sang = [A0 - M.av, A1 - M.av];                       // sångtid
  const S = s => s - sang[0], E = e => e - A0;               // sångtid / avsnittstid → scentid
  const B = (r, n) => takt(r.t) + n * BEAT;                  // n beats in i raden
  const b = id => M.bild(id).map(E);
  const kor = [rad('lilla bussen kör', 0), rad('hjulen snurrar', 0), rad('lilla bussen kör', 1), rad('hjulen snurrar', 1)];
  const dingel = rad('dinglar ben'), v2 = rad('Ett, två, tre'), inne = rad('In i bussen'), fonster = rad('I fönstret');
  const ut0 = S(B(kor[3], 4));                               // "runt, runt, runt, runt": hjulen snurrar extra
  const har = S(B(rad('härifrån'), 2));                      // tut på "härifrån", sedan kör bussen iväg
  const [b05, b06, b08] = [b('05')[0], b('06')[0], b('08')[0]];
  // lila kritsvep: fyller bilden strax före "Vem sitter där …", suddas bort på raden; bussen rullar fram och stannar
  const svep = [S(dingel.t) - 0.6, S(dingel.t) + 0.4], byt = (svep[0] + svep[1]) / 2;
  const t = {
    sang, DURATION: E(A1), bild: { b05, b06, b08 },
    SVEP: svep, BYT: byt, IN: [byt, S(dingel.t) + 2.1],
    HUMLA: [2.3, 3.6, 5.3, 6.9],                               // humlan: in från höger, en slinga över taket, ut åt vänster
    PLAN: [6.8, 15.0],                                         // flygplanet högt upp medan bussen kör, efter humlan
    ANKA: 13.0,                                                // ankan i vägkanten vinkar, bussen tutar tillbaka
    BLOMMOR: [5.5, 10.5],                                      // blommor i vägkanten kommer in från höger
    // "tuta-TUT": första "tut" ett beat in i raden, andra två beats senare
    TUT: [S(B(rad('hon säger hej'), 1)), ...kor.flatMap(r => [S(B(r, 1)), S(B(r, 3))])].filter(x => x < ut0),
    HEJ: S(takt(rad('vinkar hej').slut - 0.8)),             // sista ordet i raden
    DINGEL: [S(dingel.t), S(dingel.slut)],
    SNURR: [S(B(kor[1], 4)), S(rad('hjulen snurrar', 0).slut - 0.3)],
    GUNG: [[0.6, byt], [S(dingel.t) + 2.4, S(rad('hjulen snurrar', 0).slut - 0.6)], [S(kor[2].t - 0.3), E(A1)]],
    // vers 2: hopp på "ett", "två", stor båge in genom dörren på "hopp, hopp"
    HOPP: [S(B(v2, 0)), S(B(v2, 1))], STORT: [S(B(v2, 3)), S(B(v2, 4)) + 0.15],
    STANG: S(inne.t + 0.3), UPP: S(inne.t + 1.0),
    FONSTER: [1, 1.5, 2, 2.5].map(n => S(B(fonster, n))),
    HAR: har, UT: [har + 0.2, har + 2.2],                   // ut åt höger från hållplatsen, sedan klipp till vägen
    SNURR2: [ut0, ut0 + 2.2],
    // kaninen hoppar i fönstret varannan beat i refrängen
    STUDS: Array.from({ length: 40 }, (_, i) => S(B(kor[2], 2 * i))).filter(x => x > har + 2.4 && x < E(A1) - 1.2),
    FIA: [S(kor[3].t) - 1.0, S(kor[3].t) + 4.0],            // Fia fladdrar förbi högt upp under refrängen
    SVEP_UT: [E(A1) - 0.9, E(A1) - 0.1],
    // repliker (spelas in för sig, så det här är bara munnar och gupp på ungefär rätt ställe)
    BUSS_PRAT: [[3.5, 4.1], [4.6, 7.4], [b06 + 0.1, b06 + 0.95], [b08 + 0.35, b08 + 1.1], [S(kor[2].slut) - 1.1, S(kor[2].slut) - 0.2]],
    BUSS_TUT: [3.4, 13.0, har],
    KANIN_PRAT: [[b05 + 0.05, b05 + 0.9], [S(kor[2].t) + 1.6, S(kor[2].t) + 2.4]],
    RAKNA: [b05 + 0.95, b05 + 1.15, b05 + 1.35], NER: [b05 + 1.5, b05 + 1.9],
    DORR: [b06 + 0.05, b06 + 0.4],
  };
  // klipp: bussen framifrån på "Tuta-tut, hon säger hej" (närbild på ansiktet) och när den kommer till hållplatsen,
  // närbilder på kaninens fötter ("dinglar ben"), ansikte ("ler och vinkar hej") och i fönstret ("I fönstret hopp, hopp")
  const ler = rad('Kaninen ler');
  t.FRAM_VAG = [S(rad('hon säger hej').t), svep[0]];   // slutar när kritsvepet börjar
  t.FRAM_IN = [byt, byt + 1.25];
  t.SKOTT = [[0, 'hel'], [byt + 1.25, 'fotter'], [S(ler.t), 'hel'], [S(ler.t) + 0.6, 'ansikte'], [t.HEJ + 0.1, 'hel'],
    [b05, 'b05'], [b06, 'hel'], [S(fonster.t) - 0.1, 'fonster'], [t.FONSTER[3] + 0.2, 'hel']];
  t.BLINK = Array.from({ length: Math.ceil(t.DURATION / 3.3) }, (_, i) => 1.7 + i * 3.3 + (i % 3) * 0.6);
  return t;
}

async function bygg() {
  T = await tider();
  kit.duk('vagen');
  vag.vag();
  // på vägen: farten ökar mjukt från stillastående (kritan-ritars sista ruta), vägen syns till svepet
  const v = t => V * mjuk(del(...MATCH.papper, t));
  const cache = new Map();
  d2 = t => Math.max(0, t - T.UT[1]) * V;                 // refrängen: full fart från klippet
  d = t => { const k = Math.round(t * 1000); if (!cache.has(k)) cache.set(k, vag.stracka(Math.min(t, T.BYT), v)); return cache.get(k); };
  // träd längs vägen, bakom allt och långsammare än marken (parallax); blommorna framför dem
  trad = TRAD.map(([, k]) => vag.sak('tradet', 818, k));
  blommor = T.BLOMMOR.map(() => vag.sak('blommor', 846));
  // busshållplatsen ligger över vägen och visas när svepet täcker bilden
  hallplats = kit.bild(`${kit.ROT}assets/bakgrunder/busshallplatsen/busshallplatsen.png`, kit.lager.plate,
    { width: 1920, height: 1080, preserveAspectRatio: 'xMidYMid slice' });
  fart = vag.fartstreck(kit.lager.figurer);
  agda = await kit.figur('ankan-agda', { h: 260 });      // före bussen, så att bussen kör framför henne
  pella = await kit.figur('flygplanet-pella', { h: 350 });   // mindre och långt bort här; körscenen har det stora
  buss = await kit.figur('bussen-tva-fonster');
  bussFram = await kit.figur('bussen-fram');
  bussTK = await kit.figur('bussen-tre-kvart');          // ankomsten: snett framifrån, bron till sidvyn
  kanel = await kit.figur('kaninen-kanel');
  passagerare = await kit.figur('kaninen-kanel');
  humle = await kit.figur('humlan-humle', { h: 165 });
  fia = await kit.figur('fjarilen-fia', { h: 150 });
  fonsterBas = kit.iFonster(buss, passagerare, 1);
  // tut: tre korta kritstreck vid bussens nos
  tutStreck = [-28, 0, 28].map(a => kit.el('path', { d: 'M0 0 L60 0', stroke: '#f6d24a', 'stroke-width': 14, 'stroke-linecap': 'round',
    transform: `translate(960 470) rotate(${a})` }, buss.inre));
  // papperet över allt utom det ritade hjulet (ingen kokning på papperet, som i kritan-ritar)
  const svg = kit.lager.overst.parentNode;
  papper = kit.bild(new URL('klipp/papper.png', location.href).href, svg.insertBefore(kit.el('g', {}), kit.lager.overst), { width: 1920, height: 1080 });
  const hjulLager = kit.el('g', {}, svg.insertBefore(kit.el('g', { filter: 'url(#boil)' }), kit.lager.overst));
  ritatHjul = kit.bild(new URL('klipp/hjul.png', location.href).href, hjulLager, { x: -230, y: -230.5, width: 460, height: 461 });
  // ljud (kit.ljud): brum under körningen, fågelkvitter lågt på vägen, propellern, tut, dörren, svepen
  const LJ = kit.ljud;
  LJ('brum', 0, { loop: true, langd: T.BYT + 0.4, vol: 0.6, fade: 0.5 });
  LJ('fagelkvitter', 0, { langd: T.BYT + 0.4, vol: 0.35, fade: 0.6 });
  LJ('surr', T.HUMLA[0], { langd: T.HUMLA[3] - T.HUMLA[0], vol: 0.5, fade: 1.0 });
  LJ('fladder', T.FIA[0], { langd: T.FIA[1] - T.FIA[0], vol: 0.35, fade: 1.0 });
  LJ('propeller', T.PLAN[0], { loop: true, langd: T.PLAN[1] - T.PLAN[0], vol: 0.45, fade: 1.2 });
  LJ('brum', T.IN[0], { langd: T.IN[1] - T.IN[0] + 0.3, vol: 0.6, fade: 0.6 });
  LJ('brum', T.UT[0], { loop: true, langd: T.DURATION - T.UT[0], vol: 0.6, fade: 0.8 });
  for (const t of [...T.TUT, ...T.BUSS_TUT].sort((a, b) => a - b)) LJ('tuta-tut', t - 0.05, { langd: 0.9, vol: 0.8, fade: 0.2 });
  LJ('pschhh', T.DORR[0], { vol: 0.8 }); LJ('pschhh', T.STANG, { vol: 0.7 });
  for (const t of [...T.HOPP, T.STORT[0]]) LJ('boing', t, { vol: 0.7 });
  for (const [a, b] of [[T.HOPP[0], 0.37], [T.HOPP[1], 0.37], [T.NER[0], T.NER[1] - T.NER[0]]]) LJ('duns', a + b, { vol: 0.7 });
  LJ('hjul-gnissel', T.IN[1] - 0.5, { vol: 0.6 });
  LJ('swoosh', MATCH.zoom[0], { vol: 0.5 });
  kit.ljudSvep(T.SVEP[0], T.BYT); LJ('swoosh', T.BYT, { vol: 0.35 }); kit.ljudSvep(...T.SVEP_UT);
  kit.kor(render, T.DURATION, { sang: T.sang });
}

const fas = t => (t + T.sang[0] - kit.BEAT0) / BEAT;

// ---------- bussen ----------
const bussX = (s, hjulX) => hjulX - (737 - buss.fot[0]) * s;    // bussens fot-x så att framhjulet hamnar i hjulX
function rendBuss(t) {
  let tilt = 0, sx = 1, sy = 1, lyft = 0, s, hjulX, y, vinkel;
  if (t < T.BYT) {
    // på vägen: kameran drar sig bakåt från hjulet medan bussen kör iväg, vägen rullar
    const z = inUt(del(...MATCH.zoom, t));
    s = START.s * Math.pow(BUSS.s / START.s, z);
    hjulX = lerp(START.hjulX, VAG.hjulX, z);
    y = lerp(START.y, VAG.y, z);
    vinkel = MATCH.vinkel + MATCH.fart * t + snurr(d(t), 63 * s);   // samma vinkel som det ritade hjulet
  } else if (t >= T.UT[1]) {
    // på vägen igen (refrängen): rullar in från vänster till körscenernas plats, vägen rullar under
    s = BUSS.s; y = VAG.y;
    hjulX = lerp(VAG.hjulX - 900, VAG.hjulX, 1 - Math.pow(1 - del(T.UT[1], T.UT[1] + 1.1, t), 3));
    vinkel = snurr(d2(t) + hjulX, 63 * s);
  } else {
    // vid hållplatsen: rullar in från vänster och stannar framför kaninen
    const k = del(...T.IN, t), x = lerp(-700, BUSS.hjulX, 1 - Math.pow(1 - k, 3));
    s = BUSS.s; hjulX = x; y = BUSS.y;
    vinkel = snurr(x + 700, 63 * s);
    tilt += kit.bussStopp(t, T.IN[1]);
  }
  // gungar långsamt i takt
  for (const [a, b] of T.GUNG) if (t > a && t < b) {
    const g = kit.bussGung(fas(t), mjuk(del(a, a + 1.2, t)) * mjuk(del(b, b - 1.2, t)));
    tilt += g.tilt; lyft += g.lyft;
  }
  // tut: liten mjuk puff, munnen upp, glada ögon, streck vid nosen
  const u = kit.bussTut(t, [...T.TUT, ...T.BUSS_TUT]);
  lyft += u.lyft; sx *= u.sx; sy *= u.sy;
  const mun = Math.max(prat(t, T.BUSS_PRAT) * 0.8, u.mun), ogon = u.ogon || 'open', streck = u.streck;
  // hjulen snurrar på stället
  vinkel += 360 * 2.5 * inUt(del(...T.SNURR, t)) + 360 * 2 * inUt(del(...T.SNURR2, t));
  // 08: kör ut åt höger från hållplatsen
  const ut = t < T.UT[1] ? Math.pow(del(...T.UT, t), 2) * 1300 : 0;
  hjulX += ut;
  vinkel += snurr(ut, 63 * s);
  tilt += kit.bussStart(t, T.UT[0]);
  const framKlipp = (t >= T.FRAM_VAG[0] && t < T.FRAM_VAG[1]) || (t >= T.FRAM_IN[0] && t < T.FRAM_IN[1]);
  buss.pose({ x: bussX(s, hjulX), y: y + lyft, s, tilt, sx, sy, ogon, mun, synlig: !framKlipp,
    titt: t < T.BYT ? 0.6 : t > T.IN[1] - 0.5 && t < T.HOPP[0] ? -1 : 0, blink: blink(t, T.BLINK.map(b => b + 0.4)),
    delar: { 'del-1': vinkel, 'del-2': vinkel } });
  // det ritade hjulet ligger på framhjulet, med samma vinkel, och tonar över i bussens eget hjul
  const h = 1 - mjuk(del(...MATCH.hjul, t)), [hx, hy] = buss.punkt([737, 744]);
  ritatHjul.parentNode.style.display = h > 0 ? '' : 'none';
  ritatHjul.parentNode.setAttribute('opacity', h);
  ritatHjul.parentNode.setAttribute('transform', `translate(${hx} ${hy}) rotate(${tilt + vinkel}) scale(${s / START.s})`);
  tutStreck.forEach(p => {
    p.setAttribute('opacity', streck > 0 ? 1 - streck : 0);
    p.setAttribute('d', `M${45 + 40 * streck} 0 L${95 + 50 * streck} 0`);
  });
  return { s, hjulX };
}

// ---------- bussen framifrån: närbild på vägen ("hon säger hej"), sedan på väg mot hållplatsen ----------
function rendBussFram(t) {
  const u = kit.bussTut(t, T.TUT), b = blink(t, [T.FRAM_VAG[0] + 0.5, T.FRAM_IN[1] - 0.25]);
  const ogon = u.ogon || (t > T.FRAM_VAG[0] + 1.1 && t < T.FRAM_VAG[1] ? 'happy' : 'open');
  const vag = t >= T.FRAM_VAG[0] && t < T.FRAM_VAG[1];
  bussFram.pose({ x: 960, y: 1190 + kit.bussMotor(t) * 2 + u.lyft, k: 1.75, synlig: vag, sx: u.sx, sy: u.sy, mun: u.mun, ogon, blink: b, titt: 0 });
  // ankomsten snett framifrån (tre kvart, fronten åt höger som i sidvyn): kör mot kameran och växer
  const p = kit.motKamera(t, T.FRAM_IN, { x0: 1150, x1: 1270, y0: 860, y1: 1010, k0: 0.3, k1: 0.85, paus: 0.35 });
  bussTK.pose({ ...p, flip: true, sx: u.sx, sy: u.sy, mun: u.mun, ogon, blink: b, titt: 0.4 });
}

// ---------- flygplanet: litet, högt upp, medan bussen kör ----------
function rendPella(t) {
  const k = del(...T.PLAN, t);
  const q = 0.25 + 0.75 * Math.abs(Math.cos(t * 40));
  pella.pose({ x: lerp(-450, 2400, k), y: 330 + Math.sin(t * 2.2) * 10, tilt: Math.sin(t * 1.7) * 2, titt: 1,
    synlig: k > 0 && k < 1, blink: blink(t, T.PLAN.map(a => a + 3)),
    delar: { 'del-1': Math.sin(t * 9) * 8, 'del-4': (px, py) => `translate(${px} ${py}) scale(1 ${q}) translate(${-px} ${-py})` } });
}

// ---------- vägkanten: träd, humlan, ankan ----------
const TRAD = [[0, 0.45], [680, 0.38], [1360, 0.5], [2040, 0.42]];   // [x-förskjutning, skala], 2720 px varv
function rendTrad(dd) {
  TRAD.forEach(([x0], i) => trad[i].pa(((1700 + x0 - 0.55 * dd) % 2720 + 2720) % 2720 - 400));
}
// Humlan surrar in från höger, gör en slinga över bussens tak (aldrig framför bussen) och flyger ut åt vänster.
function rendHumle(t) {
  const [a, b, c, e] = T.HUMLA, C = [900, 330], R = [170, 100];
  let x, y, tilt;
  if (t < b) { const k = inUt(del(a, b, t)); x = lerp(2080, C[0] + R[0], k); y = lerp(250, C[1], k); tilt = -8; }
  else if (t < c) { const v = 2 * Math.PI * inUt(del(b, c, t)); x = C[0] + R[0] * Math.cos(v); y = C[1] - R[1] * Math.sin(v); tilt = -10 * Math.sin(v); }
  else { const k = inUt(del(c, e, t)); x = lerp(C[0] + R[0], -200, k); y = lerp(C[1], 150, k); tilt = -8; }
  const slinga = t > b && t < c, f = Math.sin(t * 44) * 30;
  humle.pose({ x, y: y + 8 * Math.sin(t * Math.PI * 3), tilt, titt: clamp((1100 - x) / 300, -1, 1),
    ogon: slinga ? 'happy' : 'open', mun: slinga ? 0.35 : 0, blink: blink(t, [a + 0.6, e - 0.5]), synlig: t > a && t < e,
    delar: { 'vinge-l': f, 'vinge-r': -f, 'leg-l': 6 * Math.sin(t * 5), 'leg-r': -6 * Math.sin(t * 5),
      'arm-l': 10 * Math.sin(t * 6), 'arm-r': -10 * Math.sin(t * 6) } });
}
// Fia fladdrar förbi högt upp i refrängen, höger till vänster, vingarna fälls in och ut
function rendFia(t) {
  const k = del(...T.FIA, t), x = lerp(2080, -160, k), slag = (1 + Math.cos(t * Math.PI * 7)) / 2, q = 0.35 + 0.65 * slag;
  const vinge = (px, py) => `translate(${px} ${py}) scale(${q} 1) translate(${-px} ${-py})`;
  fia.pose({ x, y: 300 + 40 * Math.sin(k * Math.PI * 2.5) - 12 * slag, tilt: -4 + 4 * Math.sin(t * 2.2), titt: -1,
    blink: blink(t, [T.FIA[0] + 2]), synlig: k > 0 && k < 1, delar: { 'wing-l': vinge, 'wing-r': vinge } });
}
// Ankan står i vägkanten och glider förbi med marken; vinkar mot bussen med toppen på tutet, hoppar till av glädje.
function rendAgda(t, dd) {
  const x = 1640 + d(T.ANKA) - dd, A = T.ANKA, h = hopp(t, A + 0.15, A + 0.5, 30);
  agda.pose({ x, y: 850 + h.y, sx: h.sx, sy: h.sy, synlig: x > -200 && x < 2150 && t < T.BYT,
    ogon: t > A ? 'happy' : 'open', titt: -1, mun: Math.max(prat(t, [[A + 0.05, A + 0.45]]), 0),
    blink: blink(t, [A - 1.2]), delar: { 'arm-l': vinka(t, A, 1, 3.0), ...kit.benHopp(h.ben) } });
}

// ---------- kaninen: väntar på bänken ----------
function rendKanel(t, dorrX, dorrY) {
  let x = BANK_X, y = SATE, sx = 1, sy = 1, k = 1, opacity = 1, ogon = 'open', titt = 0.6;
  const ben = { 'leg-l': 0, 'leg-r': 0 }, arm = { 'arm-l': 8, 'arm-r': -8 };
  if (t < T.NER[0]) {
    // sitter och dinglar med benen, mer på "Vem sitter där och dinglar ben?"
    const mer = 1 + 1.2 * mjuk(del(T.DINGEL[0], T.DINGEL[0] + 0.6, t)) * mjuk(del(T.DINGEL[1], T.DINGEL[1] - 0.6, t));
    const sv = Math.sin(fas(t) * Math.PI) * 14 * mer;
    ben['leg-l'] = sv; ben['leg-r'] = -sv;
    if (t > T.IN[1]) ogon = 'happy';                         // glad när bussen har stannat
    else titt = 1;                                           // tittar efter bussen som kommer
  }
  if (t < T.bild.b05) arm['arm-r'] = vinka(t, T.HEJ, -1, 1.8);
  // 05: närbild, pratar med små gupp, räknar "ett, två, tre" och hoppar ner
  let gupp = 0;
  for (const [a, b] of T.KANIN_PRAT) if (t > a && t < b && t < T.bild.b06) gupp = Math.abs(Math.sin((t - a) * Math.PI * 4.2)) * 7;
  for (const r of T.RAKNA) gupp -= hopp(t, r, r + 0.18, 10, 0.05, 0.08).y;
  const ner = hopp(t, ...T.NER, 70);
  if (t >= T.NER[0]) {
    x = lerp(BANK_X, 420, del(...T.NER, t)); y = lerp(SATE, MARK, del(...T.NER, t)) + ner.y;
    sx = ner.sx; sy = ner.sy;
  }
  // vers 2: "Ett, två" – två små hopp mot bussen, "hopp, hopp" – stor båge in genom dörren
  const [a1, a2] = T.HOPP, h1 = hopp(t, a1, a1 + 0.37, 40), h2 = hopp(t, a2, a2 + 0.37, 40), h3 = hopp(t, ...T.STORT, 150, 0.3);
  if (t >= a1) {
    x = 420 + 140 * del(a1, a1 + 0.37, t) + 140 * del(a2, a2 + 0.37, t) + (dorrX - 700) * del(...T.STORT, t);
    y = lerp(MARK, dorrY, del(...T.STORT, t)) + h1.y + h2.y + h3.y;
    sx = h1.sx * h2.sx * h3.sx; sy = h1.sy * h2.sy * h3.sy;
    k = lerp(1, 0.55, mjuk(del(0.55, 1, h3.luft)));
    opacity = 1 - mjuk(del(0.82, 0.98, h3.luft));
    Object.assign(ben, kit.benHopp(h1.ben + h2.ben + h3.ben));
    arm['arm-l'] = 8 + 30 * h3.ben; arm['arm-r'] = -8 - 30 * h3.ben;
    ogon = h3.luft > 0 ? 'happy' : 'open';
  }
  if (t > T.STORT[1]) opacity = 0;
  kanel.pose({ x, y: y - gupp, k, sx, sy, opacity, ogon, titt, synlig: t >= T.BYT && opacity > 0,
    blink: blink(t, T.BLINK), delar: { ...ben, ...arm } });
}

// ---------- kaninen i fönstret (bild 07–08) ----------
function rendPassagerare(t) {
  const upp = mjuk(del(T.UPP, T.UPP + 0.55, t));
  let studs = 0, sx = 1, sy = 1;
  for (const f of [...T.FONSTER, ...T.STUDS]) { const h = hopp(t, f, f + 0.24, 26, 0.06, 0.1); studs -= h.y; sx *= h.sx; sy *= h.sy; }
  const [g0, g1] = T.GUNG[2];
  if (t > g0 && t < g1) studs += Math.pow(Math.sin(fas(t) * Math.PI), 2) * 4;
  const [p0, p1] = T.KANIN_PRAT[1];
  if (t > p0 && t < p1) studs += Math.abs(Math.sin((t - p0) * Math.PI * 4.2)) * 6;
  const fragar = t > p0 - 0.3 && t < p1 + 1.2;
  passagerare.pose({ ...fonsterBas, y: fonsterBas.y + (1 - upp) * 140 - studs, sx, sy,
    ogon: fragar ? 'open' : 'happy', titt: fragar ? 1 : 0, blink: blink(t, T.BLINK) });
  fonsterBas.ruta.parentNode.style.display = t > T.UPP - 0.1 ? '' : 'none';
}

// ---------- en bildruta ----------
function render(t) {
  // vägen och sakerna i vägkanten, tills svepet byter till hållplatsen
  const igen = t >= T.UT[1], dist = igen ? d2(t) + d(T.BYT) : d(t), pavag = t < T.BYT || igen;
  vag.rulla(dist);
  T.BLOMMOR.forEach((b, i) => blommor[i].pa(2100 + d(b) - dist));
  const dd = t >= T.FRAM_VAG[0] && !igen ? d(T.FRAM_VAG[0]) : dist;           // framifrån står vägen still
  rendTrad(dd); rendAgda(t, dd); rendHumle(t); rendFia(t);
  hallplats.style.display = pavag ? 'none' : '';
  if (t >= T.FRAM_VAG[0] && t < T.BYT) vag.rulla(d(T.FRAM_VAG[0]));      // framifrån: vägen står still bakom
  const pap = 1 - mjuk(del(...MATCH.papper, t));
  papper.style.display = pap > 0 ? '' : 'none';
  papper.setAttribute('opacity', pap);
  fart(t, 470, 690, igen ? mjuk(del(T.UT[1] + 0.6, T.UT[1] + 1.4, t)) : pavag && t < T.FRAM_VAG[0] ? mjuk(del(1.0, 2.4, t)) : 0);
  rendBussFram(t);
  rendPella(t);
  const { s, hjulX } = rendBuss(t);
  // dörren: öppnas i bild 06, stängs när kaninen är inne
  kit.dorr(buss, mjuk(del(...T.DORR, t)) * (1 - mjuk(del(T.STANG, T.STANG + 0.4, t))));
  const dorrX = bussX(s, hjulX) + (737 - buss.fot[0]) * s, dorrY = BUSS.y + (641 - 812) * s + 10;
  rendKanel(t, dorrX, dorrY);
  rendPassagerare(t);
  // kamera 2: närbild på kaninen i bild 05, annars helbild
  const fx = bussX(BUSS.s, BUSS.hjulX + Math.pow(del(...T.UT, t), 2) * 1300) + (531 - buss.fot[0]) * BUSS.s;
  const VY = { hel: [960, 540, 1], b05: [419, 698, 2.2], fotter: [320, 930, 3.2], ansikte: [320, 730, 2.4],
    fonster: [fx, 610, 3.4] };
  kamera(...VY[T.SKOTT.findLast(([a]) => t >= a)[1]]);
  // lila svep (vägen → hållplatsen), sist grönt (vägens väggfärg) mot körscenen
  if (t < T.SVEP[1] + 0.1) kritsvep(del(...T.SVEP, t), LILA);
  else kritsvep(del(...T.SVEP_UT, t) * 0.5, '#acde7a');
}
