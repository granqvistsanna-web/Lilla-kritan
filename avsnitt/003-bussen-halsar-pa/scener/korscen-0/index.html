<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Körscen 0 – Branta backar</title>
<style>
  html, body { margin:0; background:#b1e0ee; overflow:hidden; }
  svg { width:100vw; height:100vh; display:block; }
</style>
</head>
<body>
<!-- Avsnitt 003, körscen 0: ett musikvideo-avbrott under första refrängen (sång 43,4–56,6, avsnitt ≈ 0:51–1:05),
     klipps in i scen A och tillbaka på vers 2. Bussen ensam (kaninen kliver på först efter refrängen).
     Tre klipp på taktstrecken: den stora branta backen ("tuta-tut … kör en tur"), en berg-och-dalbana
     ("tuta-tut, tuta-tut"), och närbild på framhjulet på "runt, runt" och helbild från taktstrecket.
     Ingen text i bild. Backarna delas med ../sista-refrangen (branta.js). -->
<script src="../kit.js"></script>
<script src="../korscen-1/vag.js"></script>
<script src="branta.js"></script>
<script>
const { lerp, mjuk, inUt, del, hopp, snurr, blink, BEAT, BEAT0 } = kit;
const { BACKE, BORT, MITT, DAL, PLAN, grader } = branta;

// beat n i sångtid; sångens fraser börjar ~0,1 s före beat-rutnätet
const beat = n => BEAT0 + n * BEAT - 0.1;
const SANG = [beat(44), 56.56];                              // "Tuta-tut" → vers 2 ("Ett, två, tre – hopp-hopp!")
const S = s => s - SANG[0], b = n => S(beat(n));             // sångtid / beat → scentid
const T = {
  DURATION: SANG[1] - SANG[0],
  TUT: [b(45), b(47), b(53), b(55)],                         // "tut" i varje "tuta-tut"
  KRON: b(48),                                               // "lilla": bussen över krönet
  RUNT: [b(58), b(59), b(60)],                               // "runt, runt, runt"
  SKOTT: [[0, 'backe'], [b(52), 'dal'], [b(57), 'hjul'], [b(60), 'hel']],   // närbilden högst 3 beats, klipp ut på taktstrecket
  BLINK: [1.2, 4.1, 6.4, 9.0, 11.8],
};
const K = { backe: 0.42, dal: 0.5, hjul: 1, hel: 1 };                // bussens storlek per klipp
const DAL_X = 820, DAL_V = 1000;                             // berg-och-dalbanan: bussen står i x 820, vägen rullar 1000 px/s
const DAL_OFF = t => 312.5 - DAL_X + 1250 + DAL_V * (t - T.TUT[2]);   // krön under bussen på tutet
const PLAN_X = 900;

let buss, tutStreck, fart, mark;

async function bygg() {
  const L = kit.duk('vagen');
  L.plate.querySelector('image').remove();
  mark = branta.backar(L.plate);
  fart = vag.fartstreck(L.figurer);
  buss = await kit.figur('bussen-tva-fonster');
  tutStreck = [-28, 0, 28].map(a => kit.el('path', { d: 'M0 0 L60 0', stroke: '#f6d24a', 'stroke-width': 14, 'stroke-linecap': 'round',
    transform: `translate(960 470) rotate(${a})` }, buss.inre));
  const LJ = kit.ljud;
  LJ('brum', 0, { loop: true, langd: T.DURATION, vol: 0.55, fade: 0.6 });
  LJ('fagelkvitter', 0, { langd: T.DURATION, vol: 0.3, fade: 0.8 });
  for (const t of T.TUT) LJ('tuta-tut', t - 0.05, { langd: 0.9, vol: 0.8, fade: 0.2 });
  LJ('swoosh', T.KRON + 0.1, { vol: 0.5 });
  for (const t of T.TUT.slice(2)) LJ('boing', t, { vol: 0.5 });
  kit.kor(render, T.DURATION, { sang: SANG });
}

const skott = t => T.SKOTT.findLast(([a]) => t >= a)[1];

// ---------- bussen över den stora backen: kryper upp, vilar en stund på krönet, rullar glatt ner ----------
function backeX(t) {
  if (t < T.KRON) return lerp(150, 960, 1 - Math.pow(1 - t / T.KRON, 1.7));
  return lerp(960, 1820, Math.pow(del(T.KRON + 0.25, T.SKOTT[1][0], t), 1.4));
}
// sträckan bussen kört i närbilden: jämn fart plus en knuff på varje "runt"
const planD = t => 480 * t + T.RUNT.reduce((s, r) => s + 220 * mjuk(del(r - 0.05, r + 0.4, t)), 0);

function render(t) {
  const vy = skott(t);
  let x, y, tilt, k = K[vy], dist, lyft = 0, sx = 1, sy = 1, ogon = 'open', mun = 0, titt = 0.8;
  const u = kit.bussTut(t, T.TUT);

  if (vy === 'backe') {
    mark.rita({ vag: BACKE, bort: BORT, mitt: MITT });
    x = backeX(t); y = BACKE(x) + 14; tilt = grader(BACKE, x);
    dist = (x - 150) * 1.1;
    // på krönet: stora ögon, sedan glad hela vägen ner
    if (t > T.KRON - 0.3 && t < T.KRON + 0.25) ogon = 'big';
    else if (t > T.KRON) ogon = 'happy';
    lyft = kit.bussMotor(t) * (t < T.KRON ? 2 : 1);
    fart(t, 0, 0, 0);
    kit.kamera(960, 540, 1);
  } else if (vy === 'dal') {
    const off = DAL_OFF(t), v = xx => DAL(xx, off);
    mark.rita({ vag: v, bort: xx => BORT(xx, off), mitt: xx => MITT(xx, off), off });
    x = DAL_X; y = v(x) + 14; tilt = grader(v, x); dist = off;
    // litet skutt på varje krön (där tutet ligger)
    for (const a of T.TUT.slice(2)) { const h = hopp(t, a - 0.08, a + 0.22, 16, 0.06, 0.12); lyft += h.y; sx *= h.sx; sy *= h.sy; }
    ogon = 'happy';
    fart(t, x - 260, y - 250, 0.9);
    kit.kamera(960, 540, 1);
  } else {
    const d = planD(t), v = xx => PLAN(xx, d);
    mark.rita({ vag: v, bort: xx => BORT(xx, d), mitt: xx => MITT(xx, d), off: d });
    const g = kit.bussGung((t + SANG[0] - BEAT0) / BEAT);
    x = PLAN_X; y = v(x) + 14; tilt = g.tilt; lyft = g.lyft; dist = d;
    // sjunger med på "runt, runt, runt", glad emellan
    for (const r of T.RUNT) if (t > r - 0.05 && t < r + 0.4) mun = Math.max(mun, 0.7 * Math.sin(del(r - 0.05, r + 0.4, t) * Math.PI));
    ogon = t > T.RUNT[0] - 0.1 ? 'happy' : 'open';
    fart(t, 470, 690, 1);
    // närbild på framhjulet och ansiktet, sedan rakt klipp till helbild på taktstrecket
    if (vy === 'hjul') kit.kamera(1120, 860, 2.2); else kit.kamera(960, 540, 1);
  }

  const vinkel = snurr(dist, 63 * buss.skala * k);
  buss.pose({ x, y: y + lyft + u.lyft, k, tilt, sx: sx * u.sx, sy: sy * u.sy, ogon: u.ogon || ogon, mun: Math.max(mun, u.mun), titt,
    blink: blink(t, T.BLINK), delar: { 'del-1': vinkel, 'del-2': vinkel } });
  tutStreck.forEach(p => {
    p.setAttribute('opacity', u.streck > 0 ? 1 - u.streck : 0);
    p.setAttribute('d', `M${45 + 40 * u.streck} 0 L${95 + 50 * u.streck} 0`);
  });
}

bygg();
</script>
</body>
</html>
