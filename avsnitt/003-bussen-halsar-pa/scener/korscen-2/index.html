<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Körscen 2 – Vägen till glasskiosken</title>
<style>
  html, body { margin:0; background:#acde7a; overflow:hidden; }
  svg { width:100vw; height:100vh; display:block; }
</style>
</head>
<body>
<!-- Avsnitt 003, körscen 2 (storyboard 16a–16e). Raka klipp in och ut.
     Alla ombord: kaninen i fönster 3, lammet i fönster 2. Äppelträdet, dammen, en äng med blommor medan flygplanet
     flyger över och stiger "högt, högt, högt", och traktorn som vinkar från sin åker. 
     Ingen text i bild. Vägen och klippen delas med ../korscen-1 (vag.js, klipp/). -->
<script src="../kit.js"></script>
<script src="../korscen-1/vag.js"></script>
<script>
const { lerp, mjuk, del, hopp, snurr, blink, takt, BEAT } = kit;

const BUSS = { x: 900, y: 978 };
const TRAKTOR = { y: 770, h: 265 };
const V = 480, V_LANGSAM = 220;

let T, buss, kanel, ludde, kanelBas, luddeBas, tuff, pella, fia, tutStreck, fart, rok;
let backe, damm, blommor, kant, aker, d;

async function tider() {
  const M = await kit.manus(), rad = M.rad;
  const A0 = M.bild('16a')[0], A1 = M.bild('16e')[0];
  const sang = [A0 - M.av, A1 - M.av];
  const S = s => s - sang[0];
  const brum = rad('vi kör igen'), flyg = rad('Flygplanet'), vinkar = rad('Och traktorn');   // Whisper hörde "minkar"
  const D = A1 - A0, h0 = takt(flyg.t + 1.15);
  const t = {
    sang, DURATION: D,
    BRUM: [0.2, 0.55].map(n => S(brum.t + n)),
    BACKAR: [0, S(brum.t + 3.2)],                       // bred bild: bussen över kullarna, klipp till vägen före "damm"
    DAMM: S(brum.t + 4.2),                              // "damm": dammen framför bussen
    FLYG: [S(flyg.t) - 0.3, S(h0 + 2 * BEAT) + 1.2],     // planet in från vänster, ut uppe till höger
    HOGT: [0, 1, 2].map(n => S(h0 + n * BEAT)),          // "högt, högt, högt": planet stiger ett steg per ord
    HEJ: S(vinkar.t + 1.9),                             // "hej": traktorn gungar mest
    SVEP_IN: [0, 0.8], SVEP_UT: [D - 0.9, D - 0.1],
  };
  t.VINKA = [t.HEJ - 1.3, t.HEJ + 0.9];
  // klipp: hjulet på "brum-brum", fönstret när trädet glider förbi bakom, lågt vid dammen, helbild för planet,
  // traktorn när den vinkar, helbild när bussen tutar tillbaka
  // kullarna är en bred bild; sedan lågt vid dammen, passagerarna tittar upp på planet ("högt, högt, högt"),
  // traktorn vinkar och kaninen vinkar tillbaka
  // mest helbild: bara två korta närbilder (~1,2 s), passagerarna tittar upp och traktorn vinkar
  t.SKOTT = [[0, 'hel'], [t.HOGT[0] - 0.3, 'fonster'], [t.HOGT[0] + 0.9, 'hel'], [t.HEJ - 0.6, 'traktor'], [t.HEJ + 0.6, 'hel']];
  t.BLINK = [2.3, 5.2, 9.0];
  return t;
}

async function bygg() {
  T = await tider();
  kit.duk('vagen');
  vag.vag();
  const v = t => lerp(V, V_LANGSAM, mjuk(del(T.HEJ - 2.4, T.HEJ - 1.0, t)));
  const cache = new Map();
  d = t => { const k = Math.round(t * 1000); if (!cache.has(k)) cache.set(k, vag.stracka(t, v)); return cache.get(k); };

  damm = vag.sak('dammen', 896);
  blommor = [0, 1, 2].map(() => vag.sak('blommor', 846));
  aker = vag.aker(1200);
  // träd bakom vägen, stilla, i vägens fart: [tid då mitten är i x 1500, sak, höjd]
  kant = [[3.6, 'bjork', 340], [6.6, 'bjork', 380]]   // bara björkar här
    .map(([tid, namn, h]) => ({ tid, s: kit.vagsak(namn, damm.g.parentNode, 830, h) }));

  // kullarna ligger över vägplattan; en björk på den bortre kullen
  backe = kit.backar(kit.lager.plate);
  const kulle = kit.el('g', {}, backe.g);
  for (const [x, namn, h] of [[1150, 'bjork', 170]]) kit.vagsak(namn, kulle, 402, h).pa(x);

  fart = vag.fartstreck(kit.lager.figurer);
  fia = await kit.figur('fjarilen-fia', { h: 110 });
  tuff = await kit.figur('traktorn-tuff', { h: TRAKTOR.h });
  rok = vag.puffar(kit.lager.figurer, 3);
  buss = await kit.figur('bussen-tva-fonster');
  kanel = await kit.figur('kaninen-kanel');
  ludde = await kit.figur('lammet-ludde');
  kanelBas = kit.iFonster(buss, kanel, 1);
  luddeBas = kit.iFonster(buss, ludde, 0);
  tutStreck = [-28, 0, 28].map(a => kit.el('path', { d: 'M0 0 L60 0', stroke: '#f6d24a', 'stroke-width': 14, 'stroke-linecap': 'round',
    transform: `translate(960 470) rotate(${a})` }, buss.inre));
  pella = await kit.figur('flygplanet-pella');

  T.XT = 1560 + d(T.HEJ);                       // traktorn står i x 1560 på "hej"
  T.XA = T.XT - 700;
  // ljud: brum hela vägen, fågelkvitter lågt, planet, Fia fladdrar, bussen tutar åt traktorn
  const LJ = kit.ljud;
  LJ('brum', 0, { loop: true, langd: T.DURATION, vol: 0.6, fade: 0.6 });
  LJ('fagelkvitter', 0, { langd: T.DURATION, vol: 0.35, fade: 0.8 });
  LJ('propeller', T.FLYG[0], { langd: T.FLYG[1] - T.FLYG[0], vol: 0.55, fade: 1.0 });
  LJ('fladder', T.DAMM + 1.2, { langd: 2.5, vol: 0.5, fade: 0.6 });
  LJ('tuff-tuff', T.VINKA[0], { langd: T.VINKA[1] - T.VINKA[0] + 0.5, vol: 0.6, fade: 0.4 });
  for (const t of tut()) LJ('tuta-tut', t - 0.05, { langd: 0.9, vol: 0.8, fade: 0.2 });
  kit.kor(render, T.DURATION, { sang: T.sang });
}

const fas = t => (t + T.sang[0] - kit.BEAT0) / BEAT;
const tut = () => [T.HEJ + 0.55];               // bussen tutar tillbaka åt traktorn

const bred = t => t < T.BACKAR[1];

function rendBuss(t, dist) {
  const f = fas(t);
  if (bred(t)) {
    // över kullarna: liten, jämn fart, lutar med backen (inga studsar)
    const x = lerp(150, 1650, del(...T.BACKAR, t)), k = 0.36, br = kit.bussTut(t, T.BRUM, true);
    buss.pose({ x, y: backe.y(x) + 14 + br.lyft * k, k, tilt: backe.grader(x), mun: br.mun, titt: 0.8, blink: blink(t, T.BLINK),
      delar: { 'del-1': snurr(x - 150, 63 * buss.skala * k), 'del-2': snurr(x - 150, 63 * buss.skala * k) } });
    tutStreck.forEach(p => p.setAttribute('opacity', 0));
    return;
  }
  // gungar långsamt och mjukt i takt, "brum" och tut är små puffar (kit.BUSS_RORELSE)
  const g = kit.bussGung(f), br = kit.bussTut(t, T.BRUM, true), u = kit.bussTut(t, tut());
  const tilt = g.tilt, lyft = g.lyft + br.lyft + u.lyft, sx = u.sx, sy = u.sy;
  const mun = Math.max(br.mun, u.mun), ogon = u.ogon || 'open', streck = u.streck;
  const vinkel = snurr(dist, 63 * buss.skala);
  buss.pose({ x: BUSS.x, y: BUSS.y + lyft, tilt, sx, sy, ogon, mun, titt: 0.8, blink: blink(t, T.BLINK),
    delar: { 'del-1': vinkel, 'del-2': vinkel } });
  tutStreck.forEach(p => {
    p.setAttribute('opacity', streck > 0 ? 1 - streck : 0);
    p.setAttribute('d', `M${45 + 40 * streck} 0 L${95 + 50 * streck} 0`);
  });
}

// passagerarna studsar i takt och extra på "brum", "högt" och "hej"
function rendPassagerare(t) {
  const skutt = [...T.BRUM, ...T.HOGT, T.HEJ];
  const planet = t > T.HOGT[0] - 0.8 && t < T.FLYG[1];
  [[kanel, kanelBas, 0], [ludde, luddeBas, 0.31]].forEach(([f, bas, forskj]) => {
    let studs = Math.pow(Math.sin((fas(t) + forskj) * Math.PI), 2) * 4, sx = 1, sy = 1;
    for (const b of skutt) { const h = hopp(t, b + forskj * 0.2, b + forskj * 0.2 + 0.24, 22, 0.06, 0.1); studs -= h.y; sx *= h.sx; sy *= h.sy; }
    const tittar = (t > T.DAMM - 1.5 && t < T.DAMM + 0.6) || (t > T.VINKA[0] - 0.4 && t < T.VINKA[1]);
    const upp = t > T.HOGT[0] - 0.4 && t < T.HOGT[2] + 0.8;
    const vinkar = f === kanel && t > T.HEJ + 0.2 && t < T.HEJ + 1.9;
    f.pose({ ...bas, y: bas.y - studs, sx, sy, ogon: upp ? 'big' : vinkar || !tittar ? 'happy' : 'open', titt: upp ? 0.3 : 1, tittY: upp ? -1 : 0,
      delar: vinkar ? { 'arm-r': kit.vinka(t, T.HEJ + 1, -1, 1.6) } : {},
      blink: blink(t, T.BLINK.map(b => b + 0.4 + forskj)) });
  });
}

function rendTraktor(t, dist) {
  const x = T.XT - dist, s = tuff.skala;
  // vinkar: gungar fram och tillbaka, störst på "hej"
  const amp = mjuk(del(T.VINKA[0], T.HEJ, t)) * mjuk(del(T.VINKA[1] + 0.5, T.HEJ + 0.1, t));
  const tilt = Math.sin((t - T.HEJ) * 9 + Math.PI / 2) * 8 * amp;
  const h = hopp(t, T.HEJ, T.HEJ + 0.24, 14, 0.06, 0.12);
  const glad = t > T.VINKA[0] && t < T.VINKA[1] + 0.6;
  const mun = t > T.HEJ - 0.1 && t < T.HEJ + 0.4 ? 0.8 * Math.sin(del(T.HEJ - 0.1, T.HEJ + 0.4, t) * Math.PI) : 0;
  tuff.pose({ x, y: TRAKTOR.y + h.y, tilt, sx: h.sx, sy: h.sy, mun, ogon: glad ? 'happy' : 'open', titt: -0.8,
    blink: blink(t, [7.2]), synlig: x > -300 && x < 2300 });
  aker.pa(T.XA - dist);
  const ror = { t0: T.HEJ, x: T.XT - d(T.HEJ) + (762 - tuff.fot[0]) * s, y: TRAKTOR.y + (330 - tuff.fot[1]) * s };
  rok(t, t >= T.HEJ ? [ror] : [], d);
  return x;
}

// Fia fladdrar lugnt över ängens blommor och följer med dem förbi
function rendFia(t, dist) {
  const bx = 1260 + d(T.HOGT[0]) - dist, slag = (1 + Math.cos(t * Math.PI * 5)) / 2, q = 0.35 + 0.65 * slag;
  const vinge = (px, py) => `translate(${px} ${py}) scale(${q} 1) translate(${-px} ${-py})`;
  const x = bx + 130 * Math.sin(t * 1.2), y = 610 + 45 * Math.sin(t * 1.9) - 6 * slag;
  fia.pose({ x, y, tilt: Math.sin(t * 1.1) * 5, titt: -0.6, blink: blink(t, [7.6]), synlig: !bred(t) && x > -150 && x < 2070,
    delar: { 'wing-l': vinge, 'wing-r': vinge } });
}

// flygplanet: in från vänster ovanför bussen, stiger ett steg på varje "högt", ut uppe till höger
function rendPella(t) {
  const k = del(...T.FLYG, t);
  let y = 470, tilt = 0;                                  // högt uppe på himlen, helt i bild
  for (const h of T.HOGT) {
    y -= 50 * mjuk(del(h - 0.05, h + 0.35, t));
    tilt -= 7 * Math.sin(del(h - 0.05, h + 0.45, t) * Math.PI);
  }
  const q = 0.25 + 0.75 * Math.abs(Math.cos(t * 40));
  pella.pose({ x: lerp(-450, 2400, k), y: y + Math.sin(t * 2.2) * 8, k: 0.45, tilt: tilt + Math.sin(t * 1.7) * 1.5, titt: 1,
    ogon: t > T.HOGT[0] ? 'happy' : 'open', synlig: k > 0 && k < 1,
    delar: { 'del-1': Math.sin(t * 9) * 8, 'del-4': (px, py) => `translate(${px} ${py}) scale(1 ${q}) translate(${-px} ${-py})` } });
}

function render(t) {
  const dist = d(t);
  vag.rulla(dist);
  backe.g.style.display = bred(t) ? '' : 'none';
  damm.pa(1450 + d(T.DAMM) - dist);
  kant.forEach(k => k.s.pa(1500 + d(k.tid) - dist));
  const ang = T.HOGT[0];                                     // ängen mitt framför bussen när planet är över den
  blommor.forEach((b, i) => b.pa(900 + i * 360 + d(ang) - dist));
  const tx = rendTraktor(t, dist);
  fart(t, 470, 690, bred(t) ? 0 : lerp(1, 0.6, mjuk(del(T.HEJ - 2.4, T.HEJ - 1, t))));
  rendFia(t, dist);
  rendBuss(t, dist);
  rendPassagerare(t);
  rendPella(t);
  vag.filma(t, T.SKOTT, tx);
}

bygg();
</script>
</body>
</html>
