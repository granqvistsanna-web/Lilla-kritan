<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Körscen 3 – Framme vid badplatsen</title>
<style>
  html, body { margin:0; background:#acde7a; overflow:hidden; }
  svg { width:100vw; height:100vh; display:block; }
</style>
</head>
<body>
<!-- Avsnitt 004, körscen 3 (storyboard 17–17a): körvers 3 på platt väg, stugan och träden glider förbi på "förbi hus och gröna träd",
     flygplanet glider högt uppe och försvinner. På "Titta, där är badplatsen!" glider dammen med vassen in från höger vid vägen,
     grodan och ankan tittar mot den med stora ögon, vägen saktar in och stannar på "stopp". När bussen stått stilla kritar
     kritan över bilden (första halvan av kritsvepet, blått), och scen B börjar med andra halvan (kompisarna på sanden).
     Ingen text i bild. Delar med ../korscen-1 (kor.js) och 003:s vag.js och kritsvep.js. -->
<script src="../kit.js"></script>
<script src="../../kritan-ritar/sol.js"></script>
<script src="../../../003-bussen-halsar-pa/scener/korscen-1/vag.js"></script>
<script src="../../../003-bussen-halsar-pa/scener/kritsvep.js"></script>
<script src="../korscen-1/kor.js"></script>
<script>
const { lerp, del, BEAT } = kit;

const BLA = '#306cc0';                                  // badplatsens vägg (kritsvepets färg, samma som B börjar med)
const SVEP_LANGD = 1.4, DAMM_X = 1560;                  // dammen står här när bussen har stannat (fritt från den större bussens nos)

let T, buss, streck, gurra, gurraBas, anka, ankaBas, pella, damm, kant, fart, d, v;

async function tider() {
  const M = await kit.manus(), rad = M.rad;
  const brum = kit.takt(rad('vi kör på vägen', 2).t), stann = kit.takt(rad('vi stannar', 2).t);
  const stopp = stann + 3 * BEAT, sang = [brum, stopp + 1.5];   // efter refräng 3 → 1,5 s efter "stopp" (kritsvep till B)
  const S = s => s - sang[0];
  const titta = S(rad('Titta, där är badplatsen').t);
  return { sang, DURATION: sang[1] - sang[0], STOPP: S(stopp), VEM: titta,     // vägen saktar in på "Titta" så att dammen glider in
    KANT: kor.forbiHus(S(rad('förbi hus', 2).t)),
    BRUM: [0.15, 0.5], TUT: [S(stann) + 0.5 * BEAT],              // "Brum-brum", "Tuta-tut, vi stannar"
    PELLA: titta - 0.6,                                            // flygplanet är ute ur bild före dammen
    // första halvan av kritsvepet (blått) när bussen stått stilla: sista rutan är helt överkritad (k 0,49);
    // B börjar med andra halvan (k 0,5 → 1), så att kompisarna kan stå på sanden i B:s första bild
    // (k når 0,49 några rutor före slutet och står kvar: täckningen är hel; på 0,5 börjar smulandet vid vänsterkanten och vägen syns)
    SLUT: [sang[1] - sang[0] - 0.1 - 0.5 * SVEP_LANGD, sang[1] - sang[0] - 0.1 + 0.5 * SVEP_LANGD],
    TITTA: titta + 0.3,                                            // grodan och ankan tittar mot dammen med stora ögon
    BLINK: [1.4, 4.2] };
}

async function bygg() {
  T = await tider();
  const L = kit.duk('vagen');
  const saker = kor.vag();
  kor.sol();                                          // samma sol som på vägen i körscen 1–2 (badplatsen har sin egen, på B:s plats)
  kant = T.KANT.map(([tid, namn, h]) => ({ tid, s: kit.vagsak(namn, saker, 830, h) }));
  damm = vag.sak('dammen', 896);
  fart = vag.fartstreck(L.figurer);
  pella = await kit.figur('flygplanet-pella');
  buss = await kor.nyBuss();
  streck = kor.tutStreck(buss);
  gurra = await kit.figur('grodan-gurra');
  gurraBas = kit.iFonster(buss, gurra, 0);
  anka = await kit.figur('ankan-agda');
  ankaBas = kit.iFonster(buss, anka, 1);
  ({ d, v } = kor.korning({ vem: T.VEM, stopp: T.STOPP }));   // saktar in på "Titta", står still från "stopp"

  const LJ = kit.ljud;
  LJ('brum', 0, { loop: true, langd: T.STOPP + 0.2, vol: 0.55, fade: 0.8 });
  LJ('fagelkvitter', 0, { langd: T.DURATION, vol: 0.3, fade: 0.5 });
  LJ('propeller', 0, { langd: T.PELLA, vol: 0.3, fade: 1.0 });
  kritsvep.LJUD.filter(k => k < 0.5).forEach((k, i) => LJ('skrrrrt-kort', T.SLUT[0] + k * SVEP_LANGD, { vol: 0.55, variant: i % 4 + 1 }));
  for (const t of T.TUT) LJ('tuta-tut', t - 0.05, { langd: 0.9, vol: 0.8, fade: 0.2 });
  LJ('hjul-gnissel', T.STOPP - 0.6, { vol: 0.3 });
  kit.kor(render, T.DURATION, { sang: T.sang });
}

function rendPella(t) {
  // glider sakta åt vänster högt uppe (bussen kör ifrån det), stiger sedan ut ur bild uppåt före "Titta" (aldrig över solen)
  const k = del(0, T.PELLA, t), q = 0.25 + 0.75 * Math.abs(Math.cos(t * 40));
  pella.pose({ x: lerp(1650, 1050, k), y: 250 - 480 * Math.pow(k, 3) + Math.sin(t * 2.2) * 8, k: 0.35, tilt: Math.sin(t * 1.7) * 1.5, titt: 1, ogon: 'happy', synlig: t < T.PELLA,
    delar: { 'del-1': Math.sin(t * 9) * 8, 'del-4': (px, py) => `translate(${px} ${py}) scale(1 ${q}) translate(${-px} ${-py})` } });
}

function render(t) {
  const dist = d(t), f = Math.min(1, v(t) / kor.V);
  vag.rulla(dist);
  kor.solDans(t + T.sang[0]);   // i sångtid, så att klippen matchar
  kant.forEach(k => k.s.pa(1500 + d(k.tid) - dist));
  damm.pa(DAMM_X + d(T.STOPP) - dist);
  rendPella(t);
  fart(t, 470, 690, f);
  const titta = t > T.TITTA;
  kor.buss(buss, streck, t, { sang0: T.sang[0], f, tut: T.TUT, brum: T.BRUM, stopp: T.STOPP, blink: T.BLINK, dist,
    titt: titta ? 1 : 0.8, ogon: titta ? 'big' : 'open' });
  const g = { sang0: T.sang[0], skutt: T.BRUM, ogon: titta ? 'big' : null, titt: titta ? 1 : 0.4, blink: T.BLINK.map(b => b + 0.4) };
  kor.iFonster(gurra, gurraBas, t, g);
  kor.iFonster(anka, ankaBas, t, { ...g, blink: T.BLINK.map(b => b + 1.3), forskj: 0.31 });
  kit.kamera(960, 540, 1);
  kritsvep(Math.min(0.49, del(...T.SLUT, t)), BLA);
}

bygg();
</script>
</body>
</html>
