<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Körscen 1 – Start till grodan</title>
<style>
  html, body { margin:0; background:#acde7a; overflow:hidden; }
  svg { width:100vw; height:100vh; display:block; }
</style>
</head>
<body>
<!-- Avsnitt 004, körscen 1 (storyboard 04–10): allt i scen A efter zoomen in fram till refräng 2. Raka klipp in och ut.
     I mellanspelet rullar bussen in och stannar, närbild där den tutar två gånger åt oss. Från "Solen skiner" står bussen kvar
     nära mitten och gungar, vägen rullar åt vänster. I vers 1 en sak i taget: björnen Bulle vinkar vid vägkanten och bussen tutar tillbaka,
     fjärilen fladdrar lugnt bredvid bussen, ett mindre gupp, refräng 1 (../refrang.js, b = branta backen), körvers 1 (äppelträdet, traktorn tutar och bussen tutar tillbaka),
     stopp 1 (skylten, grodan med handduk och vassen glider in på "Vem är det som väntar där?", vägen stannar på "stopp"),
     närbild på grodan, vers 2 (dörren, tre hopp, vinkar från bakre fönstret). Ingen text i bild.
     Tider ur ../../rader.txt. Vägen och 003:s klipp: ../../../003-bussen-halsar-pa/scener/korscen-1/vag.js. -->
<script src="../kit.js"></script>
<script src="../../kritan-ritar/sol.js"></script>
<script src="../../../003-bussen-halsar-pa/scener/korscen-1/vag.js"></script>
<script src="../../../003-bussen-halsar-pa/scener/korscen-0/branta.js"></script>
<script src="../refrang.js"></script>
<script src="kor.js"></script>
<script>
const { el, lerp, mjuk, del, hopp, snurr, blink, clamp, BEAT, BEAT0 } = kit;
const { BUSS, PLATS } = kor;
// traktorn och åkern långt bort, högre upp på ängen än bussens tak, så att den aldrig kör in bakom bussen
// början: kritans zoom landar på den tomma vägen (vägen står stilla på VAG0, samma i kritan-ritar). Bussen rullar in från vänster
// och stannar i mitten med en studs, rakt klipp till närbild på ansiktet (tittar på oss, blinkar med ena ögat, tut, tut, blinkar igen),
// rakt klipp tillbaka, och bussen kör iväg på "Solen skiner". Satt-ihop.sh klipper bort takterna mellan närbilden och helbilden
// (scentid 5,97–10,80, två takter som upprepas i mellanspelet, Sanna 2026-11-04: "intro is a bit long").
const IN_X = -620, NARBILD = [1210, 760, 3];   // NARBILD för 003:s bussstorlek (kor.narbild)
// björnen Bulle (statist) på bortre vägkanten i vers 1: glider in med vägen, vinkar på "vi ska åka och bada!", bussen tutar tillbaka
const BJORN = { x: 1570, y: 825, h: 270 };      // x när bussen tutar (en bit framför nosen, fritt från tutstrecken)
// längs hela vägen från "Solen skiner" till refräng 1 (ca 0:37–0:54 i avsnittet), glest, med en lucka där björnen står:
// träd och rosa buskar glider förbi bakom bussen (Sanna 2026-11-04), [scentid i x 1500, namn, höjd]
const VAGKANT = [[13.1, 'lovtrad', 330], [14.1, 'buske-rosa', 140], [15.1, 'bjork', 340],   // först när vägen rullar (första rutan = kritan-ritars)
  [17.9, 'gran', 360], [18.9, 'buske-rosa', 150], [19.9, 'lovtrad', 330], [21.0, 'buske-rosa', 125], [22.0, 'gran', 300], [23.1, 'bjork', 320],
  [24.2, 'buske-rosa', 140], [25.2, 'lovtrad', 340], [26.3, 'gran', 280], [27.4, 'buske-rosa', 130], [28.4, 'bjork', 330]];
// en bakre rad små träd och buskar högre upp på ängen, som glider förbi med halva vägens fart från "Solen skiner" (djup bakom vägen).
// x = mitten när vägen börjar rulla; alla börjar utanför bild till höger, så att första rutan är densamma som kritan-ritars sista
const BAKRAD = [['gran', 150, 2150], ['buske-rosa', 80, 2420], ['lovtrad', 145, 2800], ['bjork', 160, 3250], ['gran', 125, 3560],
  ['buske-rosa', 70, 3950], ['lovtrad', 155, 4330], ['gran', 140, 4780], ['bjork', 150, 5150], ['buske-rosa', 85, 5500], ['lovtrad', 140, 5900]];
const TRAKTOR = { y: 360, h: 150, u: 40, kor: 5 }, AKER = { w: 1500, bak: 1100, y: [216, 372] };   // åkern: ca tre busslängder, mest plöjd bakom traktorn

let T, R, gupp, bulle, bakrad, buss, streck, gurraUte, gurraIn, gurraBas, gurraHand, plats, tuff, rok, aker, trad, fia, kant, fart, d, v;

async function tider() {
  const M = await kit.manus(), rad = M.rad;
  const vers = rad('Solen skiner').t;
  const sang = [rad('nu åker vi').t + 4.5, kit.takt(rad('Tuta-tut, tuta-tut', 2).t)];   // där kritan-ritar slutar → refräng 2
  const S = s => s - sang[0];
  const n0 = Math.ceil((sang[0] + 0.3 - BEAT0) / BEAT), b = n => BEAT0 + (n0 + n) * BEAT - sang[0];   // b(n) = n:te slaget i scenen
  const brum = S(rad('vi kör på vägen', 0).t), forbi = S(rad('förbi hus', 0).t);
  R = refrang.ny(M, 0, S, 'backe');
  return { ...kor.stoppTider(M, 0, S), sang, DURATION: sang[1] - sang[0],
    VERS: S(vers), IN: [b(0), b(3)], NARA0: [b(4), b(9)],             // rullar in, närbild till klippet (b(9) = scentid 5,97)
    TITTA: b(4) + 0.1, TUT0: [b(6), b(7)],                             // tittar på oss, blinkar, "tut, tut", blinkar igen
    VINK: [b(5), b(8)],                                               // blinkar med främre ögat åt oss i närbilden, före och efter tutet (bara här)
    BJORN_VINK: [b(26), b(27)], TUT_BJORN: b(27),                    // "vi ska åka och bada!": två vink, bussen tutar tillbaka på det andra
                                                                      // (vägen går fort: björnen hinner bara en halv bild innan han är vid nosen)
    FIA: [S(vers) + 9.4, S(vers) + 14.6],                             // fjärilen följer med bussen en stund i vers 1, när björnen glidit ut
    GUPP: [[S(kit.takt(sang[0] + 26.6)), 0.6]],                       // [framhjulet på toppen, storlek], på slaget, när fjärilen flugit
    // saker vid vägen (mitt i x 1500 vid tiden); en sak i taget: björnen, fjärilen och guppet har vers 1 för sig själva
    KANT: [...kor.forbiHus(forbi), ...VAGKANT],
    BRUM: [0.15, 0.5].map(n => brum + n), TRAD: brum + 0.3,          // "Brum-brum", äppelträdet mitt framför bussen
    TRAKTOR: forbi - 0.9,                                             // traktorn mitt i bild (x 1500); ute ur bild före stoppet
    TUFF: [-1.2, -0.9, -0.6].map(n => forbi - 0.9 + n), TRAKTOR_TUT: forbi - 1.15, TUT_TILLBAKA: forbi - 0.55,
    BLINK: [b(2), 12.6, 22.4, 36.2, 41.0, 46.9, 52.4],
  };
}

async function bygg() {
  T = await tider();
  const L = kit.duk('vagen');
  const saker = kor.vag();
  kor.sol();
  aker = vag.aker(AKER.w, ...AKER.y);                 // bakom äppelträdet
  trad = vag.sak('tradet', 856);
  kant = T.KANT.map(([tid, namn, h]) => ({ tid, s: kit.vagsak(namn, saker, 830, h) }));
  bakrad = BAKRAD.map(([namn, h, x]) => ({ x, s: kit.vagsak(namn, saker, 700, h) }));   // läggs sist, alltså bakom vägkanten
  gupp = T.GUPP.map(([tid, k]) => ({ tid, k, g: el('path', { d: `M${-GUPP.b - 30} 8 C${-GUPP.b * 0.55} 8 ${-GUPP.b * 0.5} ${-GUPP.h} 0 ${-GUPP.h}`
    + ` C${GUPP.b * 0.5} ${-GUPP.h} ${GUPP.b * 0.55} 8 ${GUPP.b + 30} 8 Z`, fill: '#d9c7a3', stroke: '#9c8762', 'stroke-width': 7, 'stroke-linejoin': 'round' }, saker) }));
  plats = kor.stoppPlats('grodan');
  R.bygg(L, saker);

  fart = vag.fartstreck(L.figurer);
  fia = await kit.figur('fjarilen-fia', { h: 175 });
  bulle = await kit.figur('bjornen-bulle', { h: BJORN.h });
  tuff = await kit.figur('traktorn-tuff', { h: TRAKTOR.h });
  rok = vag.puffar(L.figurer, 3);
  buss = await kor.nyBuss();
  streck = kor.tutStreck(buss);
  gurraIn = await kit.figur('grodan-gurra');
  gurraBas = kit.iFonster(buss, gurraIn, 0);
  gurraHand = kor.hand(buss, 0, kor.HANDFARG['grodan-gurra']);
  gurraUte = await kit.figur('grodan-gurra', { h: 300 });
  kor.handduk(gurraUte);

  const varv = 2 * Math.PI * 63 * buss.skala;
  const k = kor.korning({ vem: T.VEM, stopp: T.STOPP, start: T.START, extra: t => R.extra(t, varv) });
  // vägen står stilla till "Solen skiner" och kommer upp i fart på 1 s; efter det exakt som förut (så att slutet mot körscen 2 är detsamma)
  const V0 = T.VERS, VAG0 = k.d(V0 + 1) - kor.V / 2;
  d = t => t >= V0 + 1 ? k.d(t) : t <= V0 ? VAG0 : VAG0 + kor.V * ((t - V0) ** 3 - (t - V0) ** 4 / 2);
  v = t => t >= V0 + 1 ? k.v(t) : kor.V * mjuk(t - V0);
  T.XT = 1500 + d(T.TRAKTOR);
  // guppet: framhjulet är på toppen vid tid, bakhjulet ett hjulavstånd senare (full fart här)
  const hjulX = x => BUSS.x + (x - buss.fot[0]) * buss.skala;
  T.HJUL = [hjulX(262), hjulX(737)];
  for (const g of gupp) { g.x = T.HJUL[1] + d(g.tid); g.ner = g.tid + (T.HJUL[1] - T.HJUL[0] + GUPP.b) / kor.V; }

  const LJ = kit.ljud;
  LJ('brum', 0, { loop: true, langd: T.STOPP + 0.2, vol: 0.55, fade: 0.8 });
  LJ('brum', T.START, { loop: true, langd: T.DURATION - T.START, vol: 0.55, fade: 0.3 });
  LJ('fagelkvitter', 0, { langd: T.DURATION, vol: 0.3, fade: 0.8 });
  LJ('fladder', T.FIA[0], { langd: T.FIA[1] - T.FIA[0], vol: 0.3, fade: 1.0 });
  for (const g of gupp) { LJ('boing', g.tid - 0.08, { vol: 0.55 * g.k }); LJ('duns', g.ner - 0.05, { vol: 0.5 * g.k }); }
  LJ('tuff-tuff', T.TUFF[0] - 0.05, { langd: 1.6, vol: 0.6, fade: 0.3 });
  for (const t of tut()) LJ('tuta-tut', t - 0.05, { langd: 0.9, vol: 0.8, fade: 0.2 });
  LJ('hjul-gnissel', T.IN[1] - 0.5, { vol: 0.2 });
  LJ('hjul-gnissel', T.STOPP - 0.6, { vol: 0.3 });
  LJ('pschhh', T.DORR[0], { vol: 0.7 }); LJ('pschhh', T.STANG, { vol: 0.5 });
  for (const t of T.HOPP) { LJ('boing', t, { vol: 0.6 }); LJ('duns', t + 0.37, { vol: 0.6 }); }
  kor.lat('grodan-gurra', [...kor.latTider(T), T.HEJHEJ[1]]);        // kväk i närbilden, i sången och när han vinkar från fönstret
  kit.kor(render, T.DURATION, { sang: T.sang });
}

// början: bussen rullar in och saktar in till mitten (hjulen snurrar med), studsar till när den stannar, lutar bakåt när den kör iväg
function korIn(t) {
  if (t >= T.VERS + 1.2) return null;
  const u = del(...T.IN, t), x = lerp(IN_X, BUSS.x, 1 - (1 - u) ** 2), h = hopp(t, T.IN[1], T.IN[1] + 0.25, 10, 0.06, 0.14);
  return { x, dist: t < T.VERS ? d(0) + x - BUSS.x : d(t), f: t < T.VERS ? 2 * (1 - u) * (u > 0) : v(t) / kor.V, lyft: -h.y, sx: h.sx, sy: h.sy,
    tilt: kit.bussStopp(t, T.IN[1] + 0.2) + kit.bussStart(t, T.VERS),
    titt: lerp(0.8, -0.2, mjuk(del(T.TITTA, T.TITTA + 0.3, t)) * (1 - mjuk(del(T.NARA0[1] - 0.5, T.NARA0[1] - 0.2, t)))) };
}

const tut = () => [...T.TUT0, T.TUT_BJORN, ...R.TUT, T.TUT_TILLBAKA, T.TUT];

function rendTraktor(t, dist) {
  const plog = TRAKTOR.u * kit.clamp(t - T.TRAKTOR, -TRAKTOR.kor, TRAKTOR.kor), x = T.XT + plog - dist, s = tuff.skala;
  let lyft = 0, sx = 1, sy = 1, mun = 0;
  for (const p of [...T.TUFF, T.TRAKTOR_TUT]) {
    const h = hopp(t, p, p + 0.22, p === T.TRAKTOR_TUT ? 16 : 8, 0.06, 0.12);
    lyft += h.y; sx *= h.sx; sy *= h.sy;
    if (t > p - 0.03 && t < p + 0.3) mun = Math.max(mun, 0.8 * Math.sin(del(p - 0.03, p + 0.3, t) * Math.PI));
  }
  const ogon = t > T.TUT_TILLBAKA - 0.1 && t < T.TUT_TILLBAKA + 0.7 ? 'happy' : 'open';
  tuff.pose({ x, y: TRAKTOR.y + lyft, tilt: Math.sin(t * 9) * 0.8, sx, sy, mun, ogon, titt: -0.6, blink: blink(t, [T.TRAKTOR - 1.2]),
    synlig: x > -300 && x < 2300, delar: { 'del-1': snurr(plog, 180 * s), 'del-2': snurr(plog, 85 * s) } });
  aker.pa(T.XT - AKER.bak - dist, x + (110 - tuff.fot[0]) * s);
  const ror = t0 => ({ t0, x: T.XT + TRAKTOR.u * kit.clamp(t0 - T.TRAKTOR, -TRAKTOR.kor, TRAKTOR.kor) - d(t0) + (762 - tuff.fot[0]) * s, y: TRAKTOR.y + (330 - tuff.fot[1]) * s });
  rok(t, T.TUFF.filter(p => p <= t).map(ror), d);
}

// ---------- guppet: hjulen åker över det ett i taget, bussen lutar, trycks ihop när den landar, "oj!" i ögonen ----------
const GUPP = { h: 24, b: 80 };      // höjd och halva bredden i bild
function guppa(t, dist) {
  let lb = 0, lf = 0, sx = 1, sy = 1, ogon = null;
  for (const g of gupp) {
    const x = g.x - dist, prof = hx => Math.abs(hx - x) < GUPP.b ? GUPP.h * g.k * (1 + Math.cos(Math.PI * (hx - x) / GUPP.b)) / 2 : 0;
    g.g.setAttribute('transform', `translate(${x} ${BUSS.y - 6}) scale(1 ${g.k})`);
    g.g.style.display = x > -200 && x < 2120 ? '' : 'none';
    lb += prof(T.HJUL[0]); lf += prof(T.HJUL[1]);
    const k = del(g.ner, g.ner + 0.35, t), q = Math.sin(k * Math.PI) * g.k;
    sx *= 1 + 0.04 * q; sy *= 1 - 0.06 * q;
    if (t > g.tid - GUPP.b / kor.V && t < g.ner) ogon = 'big';
    else if (t >= g.ner && t < g.ner + 1.2) ogon = 'happy';
  }
  // kroppen tar 60 % av lyften (och lutar), hjulen hoppar resten själva
  const ab = T.HJUL[1] - T.HJUL[0], tilt = -Math.atan2(0.6 * (lf - lb), ab) * 180 / Math.PI;
  return { lyft: 0.6 * (lb + lf) / 2, tilt, sx, sy, ogon, hjul: [lb, lf].map(l => 0.4 * l / buss.skala) };
}

// ---------- fjärilen: flyger in bakifrån, fladdrar lugnt bredvid bussens nos, flyger upp och iväg ----------
function fiaPlats(t) {
  const [a, b] = T.FIA, inn = mjuk(del(a, a + 2.5, t)), ut = del(b - 2.2, b, t), ut3 = ut * ut * ut;
  const hx = 1080 + 110 * Math.sin(t * 0.8), hy = 400 + 34 * Math.sin(t * 1.6);
  return [lerp(lerp(-160, hx, inn), 2150, ut3), lerp(lerp(330, hy, inn), 60, ut3) + Math.sin(t * 6) * 8];
}
function rendFia(t) {
  const [x, y] = fiaPlats(t), [x1, y1] = fiaPlats(t + 0.1), vx = (x1 - x) / 0.1, vy = (y1 - y) / 0.1;
  const flax = 0.35 + 0.65 * Math.abs(Math.cos(t * Math.PI * 4));
  const vinge = (px, py) => `translate(${px} ${py}) scale(${flax.toFixed(3)} 1) translate(${-px} ${-py})`;
  fia.pose({ x, y, tilt: clamp(vx / 25, -14, 14), synlig: t > T.FIA[0] && t < T.FIA[1], ogon: 'open',
    titt: clamp(vx / 150, -1, 1), tittY: clamp(vy / 150, -1, 1), blink: blink(t, [T.FIA[0] + 3.1, T.FIA[0] + 8.4]),
    delar: { 'wing-l': vinge, 'wing-r': vinge } });
}

// björnens arm är en kort stump på sidan (vridpunkten mitt i den, kor.vinkaStort vrider in den i kroppen): positiva grader lyfter den,
// ca 40° pekar mot kl 1. Upp och större medan han vinkar, ett svep mot kl 12 på varje vink.
function vinkStump(t, toppar) {
  const a = toppar[0] - 0.4, b = toppar[toppar.length - 1] + 0.6, upp = mjuk(del(a, a + 0.3, t)) * mjuk(del(b, b - 0.3, t));
  const svep = toppar.reduce((s, h) => s + Math.sin(Math.PI * del(h - 0.15, h + 0.4, t)), 0);
  return [upp * 40 + 35 * svep, 0, 0, 1 + 0.4 * upp];
}
// björnen vid vägkanten: glider med vägen, armen uppe och ett stort svep på varje vink, glad och tittar mot bussen
function rendBulle(t, dist) {
  const x = BJORN.x + d(T.TUT_BJORN) - dist, vink = T.BJORN_VINK;
  bulle.pose({ x, y: BJORN.y, ogon: t > vink[0] - 0.4 ? 'happy' : 'open', titt: -1, blink: blink(t, [vink[0] - 1.0]),
    delar: { 'arm-r': vinkStump(t, vink) }, synlig: x > -200 && x < 2120 });
}

function render(t) {
  const dist = d(t), f = Math.min(1, v(t) / kor.V);
  vag.rulla(dist);
  kor.solDans(t + T.sang[0], mjuk(del(0, 2, t)));   // solen dansar i sångtid; stilla i första rutan (klippet från kritan-ritar)
  trad.pa(1500 + d(T.TRAD) - dist);
  kant.forEach(k => k.s.pa(1500 + d(k.tid) - dist));
  bakrad.forEach(b => { b.s.pa(b.x - 0.5 * (dist - d(T.VERS))); b.s.g.style.display = ''; });
  const g = guppa(t, dist);
  const dx = d(T.STOPP) - dist;
  plats.pa(dx);
  rendTraktor(t, dist);
  rendFia(t);
  rendBulle(t, dist);

  const backe = R.rita(t, d), inn = korIn(t);
  fart(t, 470, 690, backe ? 0 : f);
  // första rutan är kritan-ritars sista: tom väg, bussen utanför bild till vänster
  kor.buss(buss, streck, t, { sang0: T.sang[0], f: inn ? Math.min(1, inn.f) : f, tut: tut(), brum: T.BRUM, stopp: T.STOPP, start: T.START,
    blink: T.BLINK, vink: T.VINK, dist, titt: t > T.VEM ? 1 : 0.8, ...g, ogon: g.ogon, ...(inn || {}), ...(backe || {}) });
  R.studs(t, buss);
  kit.dorr(buss, mjuk(del(...T.DORR, t)) * (1 - mjuk(del(T.STANG, T.STANG + 0.4, t))));
  kor.vanUte(gurraUte, t, T, PLATS.van + dx, buss, { blink: [T.STOPP + 1.1, T.DORR[0] + 1.6] });
  kor.iFonster(gurraIn, gurraBas, t, { sang0: T.sang[0], fram: T.INNE, skutt: T.HEJHEJ, vinka: [[T.HEJHEJ[1], 1.6]], lat: [T.HEJHEJ[1]], hand: gurraHand, titt: 0.2, blink: [T.START + 0.9, T.START + 3.6] });
  // backen döljer vägen, och allt som står vid den
  for (const g of [gurraUte.g, tuff.g, fia.g, bulle.g, ...bakrad.map(b => b.s.g)]) if (backe) g.style.display = 'none';

  const nara = t >= T.NARA[0] && t < T.NARA[1];
  const nara0 = t >= T.NARA0[0] && t < T.NARA0[1];
  kit.kamera(...(R.kamera(t) || (nara ? [PLATS.van, 830, 2.2] : nara0 ? kor.narbild(NARBILD) : [960, 540, 1])));
}

bygg();
</script>
</body>
</html>
