<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Körscen 1 – Start till grodan</title>
<style>
  html, body { margin:0; background:#acde7a; overflow:hidden; }
  svg { width:100vw; height:100vh; display:block; }
</style>
</head>
<body>
<!-- Avsnitt 004, körscen 1 (storyboard 04–10): allt i scen A efter zoomen in fram till refräng 2. Raka klipp in och ut.
     Bussen står kvar nära mitten och gungar, vägen rullar åt vänster. "Tuta-tut! Vi ska bada!" i mellanspelet, ett gupp i vägen,
     saker vid vägen var 2–3 s, fjärilen fladdrar lugnt bredvid bussen i vers 1 (inga saker vid vägen medan den är nära), ett mindre gupp, refräng 1 (../refrang.js, b = branta backen), körvers 1 (äppelträdet, traktorn tutar och bussen tutar tillbaka),
     stopp 1 (skylten, grodan med handduk och vassen glider in på "Vem är det som väntar där?", vägen stannar på "stopp"),
     närbild på grodan, vers 2 (dörren, tre hopp, vinkar från bakre fönstret). Ingen text i bild.
     Tider ur ../../rader.txt. Vägen och 003:s klipp: ../../../003-bussen-halsar-pa/scener/korscen-1/vag.js. -->
<script src="../kit.js"></script>
<script src="../../kritan-ritar/sol.js"></script>
<script src="../../../003-bussen-halsar-pa/scener/korscen-1/vag.js"></script>
<script src="../../../003-bussen-halsar-pa/scener/korscen-0/branta.js"></script>
<script src="../refrang.js"></script>
<script src="kor.js"></script>
<script>
const { el, lerp, mjuk, del, hopp, snurr, blink, clamp, BEAT } = kit;
const { BUSS, PLATS } = kor;
// traktorn och åkern långt bort, högre upp på ängen än bussens tak, så att den aldrig kör in bakom bussen
const TRAKTOR = { y: 440, h: 150, u: 40 }, AKER = [362, 446];

let T, R, gupp, buss, streck, gurraUte, gurraIn, gurraBas, gurraHand, plats, tuff, rok, aker, trad, fia, kant, fart, d, v;

async function tider() {
  const M = await kit.manus(), rad = M.rad;
  const vers = rad('Solen skiner').t;
  const sang = [rad('nu åker vi').t + 4.5, kit.takt(rad('Tuta-tut, tuta-tut', 2).t)];   // där kritan-ritar slutar → refräng 2
  const S = s => s - sang[0];
  const brum = S(rad('vi kör på vägen', 0).t), forbi = S(rad('förbi hus', 0).t);
  R = refrang.ny(M, 0, S, 'backe');
  return { ...kor.stoppTider(M, 0, S), sang, DURATION: sang[1] - sang[0],
    PRAT0: [[2.1, 3.6]], TUT0: 1.5,                                  // BUSSEN: "Tuta-tut! Vi ska bada!" (gissat)
    FIA: [S(vers) - 4, S(vers) + 7],                                  // fjärilen följer med bussen en stund i vers 1
    GUPP: [[S(kit.takt(sang[0] + 5.5)), 1], [S(kit.takt(sang[0] + 20.6)), 0.6]],   // [framhjulet på toppen, storlek], på slaget
    // saker vid vägen (mitt i x 1500 vid tiden), så att något glider förbi var 2–3 s; en sak i taget medan fjärilen är i bild
    KANT: [[2.6, 'bjork', 340], [5.0, 'staket', 110], [15.8, 'bjork', 300],
      [19.0, 'lovtrad', 330], [21.3, 'staket', 110], [21.9, 'brevlada', 130], [23.7, 'bjork', 320],
      [S(rad('hämtar alla').t) + 0.6, 'gran', 300], ...kor.forbiHus(forbi)],
    BRUM: [0.15, 0.5].map(n => brum + n), TRAD: brum + 0.3,          // "Brum-brum", äppelträdet mitt framför bussen
    TRAKTOR: forbi - 0.9,                                             // traktorn mitt i bild (x 1500); ute ur bild före stoppet
    TUFF: [-1.2, -0.9, -0.6].map(n => forbi - 0.9 + n), TRAKTOR_TUT: forbi - 1.15, TUT_TILLBAKA: forbi - 0.55,
    BLINK: [3.3, 7.9, 12.6, 18.1, 22.4, 36.2, 41.0, 46.9, 52.4],
  };
}

async function bygg() {
  T = await tider();
  const L = kit.duk('vagen');
  const saker = kor.vag();
  kor.sol();
  trad = vag.sak('tradet', 856);
  aker = vag.aker(360, ...AKER);
  kant = T.KANT.map(([tid, namn, h]) => ({ tid, s: kit.vagsak(namn, saker, 830, h) }));
  gupp = T.GUPP.map(([tid, k]) => ({ tid, k, g: el('path', { d: `M${-GUPP.b - 30} 8 C${-GUPP.b * 0.55} 8 ${-GUPP.b * 0.5} ${-GUPP.h} 0 ${-GUPP.h}`
    + ` C${GUPP.b * 0.5} ${-GUPP.h} ${GUPP.b * 0.55} 8 ${GUPP.b + 30} 8 Z`, fill: '#d9c7a3', stroke: '#9c8762', 'stroke-width': 7, 'stroke-linejoin': 'round' }, saker) }));
  plats = kor.stoppPlats('grodan');
  R.bygg(L, saker);

  fart = vag.fartstreck(L.figurer);
  fia = await kit.figur('fjarilen-fia', { h: 175 });
  tuff = await kit.figur('traktorn-tuff', { h: TRAKTOR.h });
  rok = vag.puffar(L.figurer, 3);
  buss = await kit.figur('bussen-tva-fonster');
  streck = kor.tutStreck(buss);
  gurraIn = await kit.figur('grodan-gurra');
  gurraBas = kit.iFonster(buss, gurraIn, 0);
  gurraHand = kor.hand(buss, 0, kor.HANDFARG['grodan-gurra']);
  gurraUte = await kit.figur('grodan-gurra', { h: 300 });
  kor.handduk(gurraUte);

  const varv = 2 * Math.PI * 63 * buss.skala;
  ({ d, v } = kor.korning({ vem: T.VEM, stopp: T.STOPP, start: T.START, extra: t => R.extra(t, varv) }));
  T.XT = 1500 + d(T.TRAKTOR);
  // guppet: framhjulet är på toppen vid tid, bakhjulet ett hjulavstånd senare (full fart här)
  const hjulX = x => BUSS.x + (x - buss.fot[0]) * buss.skala;
  T.HJUL = [hjulX(262), hjulX(737)];
  for (const g of gupp) { g.x = T.HJUL[1] + d(g.tid); g.ner = g.tid + (T.HJUL[1] - T.HJUL[0] + GUPP.b) / kor.V; }

  const LJ = kit.ljud;
  LJ('brum', 0, { loop: true, langd: T.STOPP + 0.2, vol: 0.55, fade: 0.8 });
  LJ('brum', T.START, { loop: true, langd: T.DURATION - T.START, vol: 0.55, fade: 0.3 });
  LJ('fagelkvitter', 0, { langd: T.DURATION, vol: 0.3, fade: 0.8 });
  LJ('fladder', T.FIA[0], { langd: T.FIA[1] - T.FIA[0], vol: 0.3, fade: 1.0 });
  for (const g of gupp) { LJ('boing', g.tid - 0.08, { vol: 0.55 * g.k }); LJ('duns', g.ner - 0.05, { vol: 0.5 * g.k }); }
  LJ('tuff-tuff', T.TUFF[0] - 0.05, { langd: 1.6, vol: 0.6, fade: 0.3 });
  for (const t of tut()) LJ('tuta-tut', t - 0.05, { langd: 0.9, vol: 0.8, fade: 0.2 });
  LJ('hjul-gnissel', T.STOPP - 0.6, { vol: 0.3 });
  LJ('pschhh', T.DORR[0], { vol: 0.7 }); LJ('pschhh', T.STANG, { vol: 0.5 });
  for (const t of T.HOPP) { LJ('boing', t, { vol: 0.6 }); LJ('duns', t + 0.37, { vol: 0.6 }); }
  kor.lat('grodan-gurra', [...kor.latTider(T), T.HEJHEJ[1]]);        // kväk i närbilden, i sången och när han vinkar från fönstret
  kit.kor(render, T.DURATION, { sang: T.sang });
}

const tut = () => [T.TUT0, ...R.TUT, T.TUT_TILLBAKA, T.TUT];

function rendTraktor(t, dist) {
  const plog = TRAKTOR.u * kit.clamp(t - T.TRAKTOR, -3, 3), x = T.XT + plog - dist, s = tuff.skala;
  let lyft = 0, sx = 1, sy = 1, mun = 0;
  for (const p of [...T.TUFF, T.TRAKTOR_TUT]) {
    const h = hopp(t, p, p + 0.22, p === T.TRAKTOR_TUT ? 16 : 8, 0.06, 0.12);
    lyft += h.y; sx *= h.sx; sy *= h.sy;
    if (t > p - 0.03 && t < p + 0.3) mun = Math.max(mun, 0.8 * Math.sin(del(p - 0.03, p + 0.3, t) * Math.PI));
  }
  const ogon = t > T.TUT_TILLBAKA - 0.1 && t < T.TUT_TILLBAKA + 0.7 ? 'happy' : 'open';
  tuff.pose({ x, y: TRAKTOR.y + lyft, tilt: Math.sin(t * 9) * 0.8, sx, sy, mun, ogon, titt: -0.6, blink: blink(t, [T.TRAKTOR - 1.2]),
    synlig: x > -300 && x < 2300, delar: { 'del-1': snurr(plog, 180 * s), 'del-2': snurr(plog, 85 * s) } });
  aker.pa(T.XT - 360 - dist, x + (110 - tuff.fot[0]) * s);
  const ror = t0 => ({ t0, x: T.XT + TRAKTOR.u * kit.clamp(t0 - T.TRAKTOR, -3, 3) - d(t0) + (762 - tuff.fot[0]) * s, y: TRAKTOR.y + (330 - tuff.fot[1]) * s });
  rok(t, T.TUFF.filter(p => p <= t).map(ror), d);
}

// ---------- guppet: hjulen åker över det ett i taget, bussen lutar, trycks ihop när den landar, "oj!" i ögonen ----------
const GUPP = { h: 24, b: 80 };      // höjd och halva bredden i bild
function guppa(t, dist) {
  let lb = 0, lf = 0, sx = 1, sy = 1, ogon = null;
  for (const g of gupp) {
    const x = g.x - dist, prof = hx => Math.abs(hx - x) < GUPP.b ? GUPP.h * g.k * (1 + Math.cos(Math.PI * (hx - x) / GUPP.b)) / 2 : 0;
    g.g.setAttribute('transform', `translate(${x} ${BUSS.y - 6}) scale(1 ${g.k})`);
    g.g.style.display = x > -200 && x < 2120 ? '' : 'none';
    lb += prof(T.HJUL[0]); lf += prof(T.HJUL[1]);
    const k = del(g.ner, g.ner + 0.35, t), q = Math.sin(k * Math.PI) * g.k;
    sx *= 1 + 0.04 * q; sy *= 1 - 0.06 * q;
    if (t > g.tid - GUPP.b / kor.V && t < g.ner) ogon = 'big';
    else if (t >= g.ner && t < g.ner + 1.2) ogon = 'happy';
  }
  // kroppen tar 60 % av lyften (och lutar), hjulen hoppar resten själva
  const ab = T.HJUL[1] - T.HJUL[0], tilt = -Math.atan2(0.6 * (lf - lb), ab) * 180 / Math.PI;
  return { lyft: 0.6 * (lb + lf) / 2, tilt, sx, sy, ogon, hjul: [lb, lf].map(l => 0.4 * l / buss.skala) };
}

// ---------- fjärilen: flyger in bakifrån, fladdrar lugnt bredvid bussens nos, flyger upp och iväg ----------
function fiaPlats(t) {
  const [a, b] = T.FIA, inn = mjuk(del(a, a + 2.5, t)), ut = del(b - 2.2, b, t), ut3 = ut * ut * ut;
  const hx = 1080 + 110 * Math.sin(t * 0.8), hy = 400 + 34 * Math.sin(t * 1.6);
  return [lerp(lerp(-160, hx, inn), 2150, ut3), lerp(lerp(330, hy, inn), 60, ut3) + Math.sin(t * 6) * 8];
}
function rendFia(t) {
  const [x, y] = fiaPlats(t), [x1, y1] = fiaPlats(t + 0.1), vx = (x1 - x) / 0.1, vy = (y1 - y) / 0.1;
  const flax = 0.35 + 0.65 * Math.abs(Math.cos(t * Math.PI * 4));
  const vinge = (px, py) => `translate(${px} ${py}) scale(${flax.toFixed(3)} 1) translate(${-px} ${-py})`;
  fia.pose({ x, y, tilt: clamp(vx / 25, -14, 14), synlig: t > T.FIA[0] && t < T.FIA[1], ogon: 'open',
    titt: clamp(vx / 150, -1, 1), tittY: clamp(vy / 150, -1, 1), blink: blink(t, [T.FIA[0] + 3.1, T.FIA[0] + 8.4]),
    delar: { 'wing-l': vinge, 'wing-r': vinge } });
}

function render(t) {
  const dist = d(t), f = Math.min(1, v(t) / kor.V);
  vag.rulla(dist);
  trad.pa(1500 + d(T.TRAD) - dist);
  kant.forEach(k => k.s.pa(1500 + d(k.tid) - dist));
  const g = guppa(t, dist);
  const dx = d(T.STOPP) - dist;
  plats.pa(dx);
  rendTraktor(t, dist);
  rendFia(t);

  const backe = R.rita(t, d);
  fart(t, 470, 690, backe ? 0 : Math.min(f, mjuk(t)));
  // första rutan är kritan-ritars sista: bussen rak och stilla, gunget kommer in under första sekunden
  kor.buss(buss, streck, t, { sang0: T.sang[0], f: Math.min(f, mjuk(t)), tut: tut(), brum: T.BRUM, stopp: T.STOPP, start: T.START, prat: T.PRAT0,
    blink: T.BLINK, dist, titt: t > T.VEM ? 1 : 0.8, ...g, ogon: g.ogon, ...(backe || {}) });
  R.studs(t, buss);
  kit.dorr(buss, mjuk(del(...T.DORR, t)) * (1 - mjuk(del(T.STANG, T.STANG + 0.4, t))));
  kor.vanUte(gurraUte, t, T, PLATS.van + dx, buss, { blink: [T.STOPP + 1.1, T.DORR[0] + 1.6] });
  kor.iFonster(gurraIn, gurraBas, t, { sang0: T.sang[0], fram: T.INNE, skutt: T.HEJHEJ, vinka: [[T.HEJHEJ[1], 1.6]], lat: [T.HEJHEJ[1]], hand: gurraHand, titt: 0.2, blink: [T.START + 0.9, T.START + 3.6] });
  // backen döljer vägen, och allt som står vid den
  for (const g of [gurraUte.g, tuff.g, fia.g]) if (backe) g.style.display = 'none';

  const nara = t >= T.NARA[0] && t < T.NARA[1];
  kit.kamera(...(R.kamera(t) || (nara ? [PLATS.van, 830, 2.2] : [960, 540, 1])));
}

bygg();
</script>
</body>
