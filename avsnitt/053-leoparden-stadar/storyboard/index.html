<h1>Leoparden städar <span>storyboard</span></h1>
<p class="lede">Avsnitt 053, 3:22.0 med 3,3 s intro (*Djuren hittar på!*). En stillbild per utsnitt (H helbild, HB halvbild, N närbild, D detalj). Sovrummet som 027, leoparden ur sin v2-rigg, formlådan och klossarna ur rekvisita. Röda streckade pilar visar rörelsen. 51 bilder.</p>
