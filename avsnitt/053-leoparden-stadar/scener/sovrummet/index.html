<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>053 Leoparden städar, sovrummet</title>
<style>html, body { margin:0; background:#000; overflow:hidden } svg { width:100vw; height:100vh; display:block; }</style>
</head>
<body>
<!-- 053 Leoparden städar: hela scenen efter den godkända storyboarden (storyboard/rader.mjs, scen.html).
     Rummet ur 026:s rum.js (samma sovrum som 027). Leoparden är Lovas v2-rigg med tunna kanter. Kritan går genom
     verktyg/kritan-ritar.js (ritintrots trekant och formlådan). Line boil 2,5 px i bild (2,5/zoom), ny brusbild 6 gånger/s.
     Tiderna läses ur rader.json (skrivs av storyboard/bygg.mjs). Renderas med ../render.mjs. -->
<script src="/verktyg/blinka.js"></script>
<script src="/verktyg/kant.js"></script>
<script src="/verktyg/kritan-ritar.js"></script>
<script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script type="module">
import * as R from '/avsnitt/026-zebran-gar-och-lagger-sig/scener/sovrummet/rum.js';
const { $, lagg, A, kl, lerp, mjuk, del, bump, f1 } = R;
const lerp2 = (P, Q, k) => [lerp(P[0], Q[0], k), lerp(P[1], Q[1], k)];
const HAR = '/avsnitt/053-leoparden-stadar/scener/sovrummet/';

// --- Saker (som storyboarden) ----------------------------------------------------------------------------------------------
const LADA = { bild: A + 'rekvisita/formlada/cut/formlada.png', w: 1131, h: 815, hal: { cirkel: [292, 131], fyrkant: [566, 122], trekant: [852, 128] } };
const HAL_DRAG = ['M197 131 A95 62 0 1 0 387 131 A95 62 0 1 0 197 131', 'M476 72 H656 L662 168 H470 Z', 'M847 70 L958 164 L750 164 Z'];
const KL = { cirkel: [A + 'rekvisita/klossar/cut/kloss-cirkel.png', 400, 396], fyrkant: [A + 'rekvisita/klossar/cut/kloss-fyrkant.png', 391, 393],
  trekant: [A + 'rekvisita/klossar/cut/kloss-trekant.png', 411, 380] };
const KORG = { bild: A + 'rekvisita/korg/cut/korg-v3-natt-tunn.png', s: 0.34, x: 215, fot: 900 };
const LEK = [['nalle/cut/nalle-v2-ljus-tunn.png', 848, 856, 0.15, -40, -10], ['boll-rod/cut/boll-rod.png', 1024, 1024, 0.1, 48, -14],   // bakre raden, inom öppningen (±100 px)
  ['bil-rod/cut/bil-rod.png', 1024, 1024, 0.13, 0, 8], ['hink-bla/cut/hink-bla.png', 1024, 1024, 0.09, 52, 14], ['badbat/cut/badbat-tunn.png', 708, 600, 0.13, -48, 20]];   // främre raden (Sanna 2026-11-25: polish)

// --- Mått (1920 × 1080) ------------------------------------------------------------------------------------------------------
const FOT = 1010, LS = 0.56, LX = 560;
const LADA_POS = { x: 900, fot: 1030, w: 300 };
const KS = 0.2;
const GOLVET = { cirkel: [352, 1032], fyrkant: [268, 1026], trekant: [720, 1052] };   // klossarna vid leopardens vänstra tass i början (så att tassen når dem)
const VID_KORG = { cirkel: [378, 1036], fyrkant: [238, 1024] };                        // där de landar framför korgen när de tippat över kanten
const VILA = { cirkel: [408, 1042], fyrkant: [268, 1026] };                            // där de blir liggande (cirkeln rullar tillbaka mot leoparden)
const KORG_TOPP = { cirkel: [KORG.x + 10, KORG.fot - 172], fyrkant: [KORG.x - 10, KORG.fot - 172] };
const KAKTUS = { bild: A + 'rekvisita/kaktus/cut/kaktus.png', w: 610, h: 850, fot: [305, 838], s: 0.26, x: 1170, y: 992 };   // krukan på golvet (rekvisita/kaktus.md)
const UNDER = [1232, 978];      // trekanten bakom krukan, ett grönt hörn sticker fram till höger (förut: under sängen)
const UT_UNDER = [1300, 1022];
const SVART = 0.6;

let L, G, BLINKA, ZOOM = 1, RAD = [], RR = {}, ROSTER = [], DURATION = 0, TRE_D, LADA_D, T_RIT, T_LADA;
const LN = n => ROSTER[n - 1][1];
const S0 = id => RR[id].s;
const iFig = ([x, fot], [px, py], s = LS) => [x + (px - 512) * s, fot + (py - L.FOTTER) * s];
const ladaS = () => LADA_POS.w / LADA.w;
const ladaPunkt = ([ix, iy]) => [LADA_POS.x + (ix - LADA.w / 2) * ladaS(), LADA_POS.fot + (iy - LADA.h) * ladaS()];
const PA_HAL = n => { const [x, y] = ladaPunkt(LADA.hal[n]); return [x, y + 16]; };   // klossens fot när den står på sitt hål

// --- Kameran: rum.js räknar läget, boil 2,5 px i bild ---------------------------------------------------------------------------
function kamera(k) { R.kamera(k); ZOOM = k[0]; $('brus').nextElementSibling.setAttribute('scale', (2.5 / k[0]).toFixed(2)); }
const HEL = [1, 960, 540], HB = [1.7, LX + 140, 820], HB_KORG = [1.7, 420, 820], HB_LADA = [1.5, 700, 820];   // fyrkanten vid korgen syns hel (förut skars den av)
const NARA = () => [2.6, LX, FOT + (430 - L.FOTTER) * LS];
const D = (x, y, z = 3) => [z, x, y];
const D_LADA = () => D(LADA_POS.x, LADA_POS.fot - 160, 3);
const LADA_VY = [1.8, 800, 850];   // lådan och hela leoparden: hon syns när klossarna ploppar ner (förut skars hon mitt itu)

// --- Leoparden -------------------------------------------------------------------------------------------------------------------
const P = o => ({ ...L.POSE0, ...o });
const GLADA = ['glad', 'jatteglad', 'fnissig', 'stolt', 'kawaii', 'skrattar'];
const F = (n, o = {}) => n === 'stolt' ? { ...L.blanda('jatteglad', 'stolt', 0.45), glad: [0, 0], ...o }   // riggens stolt har sura bryn
  : ({ ...L.blanda('neutral', n, 1), ...(GLADA.includes(n) ? { glad: [0, 0] } : {}), ...o });
const UPP = (k = 1) => [-12 * k, -12 * k], NER = (k = 1) => [16 * k, 16 * k];
const NAR_H = (k = 1, o = {}) => L.blandaPose(P(), P({ ...L.POSER.nar, bada: 0, ...o }), k);                       // sträcker tassen åt höger
const NAR_V = (k = 1, o = {}) => L.blandaPose(P(), P({ ...L.POSER.nar, rikt: -1, bada: 0, armar: [55, 0], ...o }), k);   // och åt vänster
const vink = (tl, v, o = {}) => P({ luta: 3 * v, armar: [0, v * (86 + 14 * Math.sin(2 * Math.PI * 1.1 * tl))], ...o });
const nick = (f, p, tl, d = 1.2) => tl > 0 && tl < d ? L.nicka(f, p, tl, d, 2) : [f, p];
const vipp = (tl, a, d = 1.4) => 10 * Math.sin(2 * Math.PI * (tl - a) / 0.7) * bump(a, a + d, tl);
const oronVipp = (tl, t0, n = 2) => { const u = tl - t0; return u > 0 && u < 0.4 * n ? -10 * Math.sin(u / 0.4 * Math.PI * 2) * (1 - u / (0.4 * n)) : 0; };
const liv = (p, t) => { const a = (1 - Math.cos(2 * Math.PI * t / 3.6)) / 2;
  return { ...p, strack: (p.strack || 0) + 0.012 * a, oron: (p.oron || [0, 0]).map((o, i) => o - 1.5 * a + (i ? -1 : 1) * 1.2 * Math.sin(t * 1.3 + 2 * i)) }; };
function skutt(p, tl, t0, d = 0.45) {
  const huk = bump(t0 - 0.18, t0 + 0.02, tl), u = kl((tl - t0) / d), land = bump(t0 + d - 0.02, t0 + d + 0.28, tl);
  return { ...p, strack: (p.strack || 0) - 0.06 * huk + 0.04 * Math.sin(Math.PI * u) - 0.05 * land, armar: (p.armar || [0, 0]).map(a => a + 18 * bump(t0, t0 + d, tl)) };
}
const lyft = (tl, t0, h = 40, d = 0.45) => h * bump(t0, t0 + d, tl);   // hur högt skuttet lyfter
function lova([x, fot], f, p) {
  $('framfig').appendChild(G);
  G.setAttribute('transform', `translate(${f1(x)} ${f1(fot)}) scale(${LS}) translate(-512 ${-L.FOTTER})`);
  L.rita(G, f, p);
}

// --- Klossarna, lådan, korgen ------------------------------------------------------------------------------------------------------
function kloss(n, [x, fot], { v = 0, s = KS, lager = 'golvsak', golv = fot, klipp = null } = {}) {
  const [b, w, h] = KL[n], hojd = Math.max(0, golv - fot);
  const piv = n === 'cirkel' ? ` 0 ${f1(-(h / 2 - 8) * s)}` : '';   // cirkeln rullar kring sin mitt; de andra vickar på foten
  const g = `<g transform="translate(${f1(x)} ${f1(fot)}) rotate(${f1(v)}${piv}) scale(${s.toFixed(3)}) translate(${-w / 2} ${-h + 8})"><image href="${b}" width="${w}" height="${h}"/></g>`;
  lagg(lager, (klipp == null && golv != null ? R.markskugga(x, golv, w * s * 0.9, hojd) : '') +
    (klipp != null ? `<clipPath id="halklipp-${n}"><path d="M-200 -200 H2200 V${f1(klipp)} H-200Z"/></clipPath><g clip-path="url(#halklipp-${n})">${g}</g>` : g));
}
function lada({ fyll = 1, skak = 0 } = {}) {
  if (fyll <= 0) return;
  const s = ladaS(), x0 = LADA_POS.x - LADA.w * s / 2, y0 = LADA_POS.fot - LADA.h * s;
  lagg('golvsak', R.markskugga(LADA_POS.x, LADA_POS.fot, LADA_POS.w) + `<g transform="rotate(${f1(skak)} ${LADA_POS.x} ${LADA_POS.fot})"><g transform="translate(${f1(x0)} ${f1(y0)}) scale(${s.toFixed(4)})">`
    + (fyll < 1 ? fyllMask('fyL', 565, 420, 760, fyll) : '') + `<image href="${LADA.bild}" width="${LADA.w}" height="${LADA.h}"${fyll < 1 ? ' clip-path="url(#fyL)"' : ''}/></g></g>`);
}
function ladaRit(t, fyll) {   // kritan ritar lådans kontur och de tre hålen (10a–10c), väntar, flyger ut efter "Tack, kritan!"
  const s = ladaS(), x0 = LADA_POS.x - LADA.w * s / 2, y0 = LADA_POS.fot - LADA.h * s, iL = ([x, y]) => [x0 + x * s, y0 + y * s];
  const k = ritfart((t - T_LADA.rit[0]) / (T_LADA.rit[1] - T_LADA.rit[0]));
  const Rb = ritBana([LADA_D, ...HAL_DRAG], k, { vikt: [3, 0.8, 0.8, 0.8], attr: `fill="none" stroke="${KRITAN.LINJE}" stroke-width="${f1(KRITAN.BRED / s / ZOOM)}" stroke-linecap="round" stroke-linejoin="round" opacity="${linjeOpacitet(fyll).toFixed(2)}"` });
  if (k > 0 && fyll < 1) lagg('kontur', `<g transform="translate(${f1(x0)} ${f1(y0)}) scale(${s.toFixed(4)})">${Rb.html}</g>`);
  const kr = kritaFas(t, T_LADA, { start: iL(Rb.start), spets: iL(Rb.spets), slut: iL(Rb.slut), vanta: [LADA_POS.x + 210, LADA_POS.fot - 300], s: kritaSkala(ZOOM) });
  if (kr) lagg('krita', kritaBild(kr.x, kr.y, kr));
  if (fyll > 0) lagg('krita', gnistor(LADA_POS.x, LADA_POS.fot - 110, 190, t - T_LADA.fyll));
}
function korg() {
  const { s, x, fot } = KORG, y0 = fot - 915 * s;
  const hel = `<image href="${KORG.bild}" x="${x - 512 * s}" y="${y0}" width="${1024 * s}" height="${1024 * s}"/>`;
  lagg('bak', R.markskugga(x, fot, 260) + hel + LEK.map(([fl, w, h, k, dx, dy]) => fl.startsWith('nalle') ? R.nalleBild([x + dx, y0 + 500 * s - h * k * 0.75 + dy + 816 * k], k) : `<image href="${A}rekvisita/${fl}" x="${x + dx - w * k / 2}" y="${y0 + 500 * s - h * k * 0.75 + dy}" width="${w * k}" height="${h * k}"/>`).join('')
    + `<image href="${KORG.bild}" x="${x - 512 * s}" y="${y0}" width="${1024 * s}" height="${1024 * s}" clip-path="url(#korgfram)"/>`);
}
const stjarna = (x, y, r, o = 1) => `<path transform="translate(${f1(x)} ${f1(y)}) scale(${r.toFixed(2)})" opacity="${o.toFixed(2)}" d="M0 -1 L.2 -.2 L1 0 L.2 .2 L0 1 L-.2 .2 L-1 0 L-.2 -.2Z" fill="#fff6c8" stroke="#e6b422" stroke-width=".06"/>`;
const skimmer = (x, y, k, t, v = 1) => k > 0.01 && lagg('fram', [[-1, -0.7, 1, 0], [1.1, -0.4, 0.8, 1.7], [0.2, 1.1, 0.7, 3.1], [-1.2, 0.8, 0.6, 4.4]]
  .map(([dx, dy, s, fas]) => stjarna(x + dx * 40 * v, y + dy * 34 * v, 15 * s * v * k * (0.8 + 0.2 * Math.sin(t * 5 + fas)), Math.min(1, 0.4 + k))).join(''));

// --- Plocka upp och kasta (rad 5, 7, 19, 21) -------------------------------------------------------------------------------------
// Riggens egen plockning (rigg-motor.js plockaDel, som 037 och rigg-sidan): blicken först, leoparden böjer sig, tassen läggs PÅ
// klossens ovansida (greppet i klossens övre del, klossen under tassen), klossen följer med upp vid sidan. Sedan tar den in klossen
// framför magen (sakFramVag), hukar lite (förberedelsen), kastar med ett litet lyft och släpper; klossen tar en lugn båge till målet.
// Medan klossen är i tassen ritar riggen den (sakIn); när den släpps tar scenen över från exakt samma punkt (mätt vid start).
const PD = 1.4, KAST = { mage: [1.4, 1.9], huk: [1.9, 2.25], lyft: [2.25, 2.5], slapp: 2.42 };   // sekunder från plockets start
let K = {}, SAKNU = null;
const KSAK = {}, GREPP = n => (KL[n][2] - 8) * KS + 12;   // tassens mitt 12 px ovanför klossens överkant: tassen ligger PÅ klossen
// Riggen får en osynlig sak (bara greppet), så att plockaDel för tassen exakt till klossens ovansida. Själva klossen ritar scenen,
// alltid framför leoparden och hel (riggens sak åkte in bakom kroppen och tonades fram när tassen gick till magen).
const sakFor = n => KSAK[n] ??= L.sakKod('', { grepp: [0, -GREPP(n) / LS], fot: [0, 0], skala: 1, kant: 99, folj: 0 });
const tassPunkt = () => { const a = G.querySelector(':scope > g > .arm-l');
  return DOMMatrix.fromMatrix($('golvsak').getCTM()).inverse().multiply(DOMMatrix.fromMatrix(a.getCTM())).transformPoint(new DOMPoint(...L.HAND.l)); };
let I_TASSEN = null;
function tassKloss(n, k, t) {   // på golvet tills tassen når den, sedan under tassen
  const u = t - k.t0, w = mjuk(kl((u - 0.46 * PD) / 0.15)), h = tassPunkt(), hf = [h.x, h.y + GREPP(n)];
  const p = lerp2(k.fran, hf, w), v = lerp(k.fran[2] || 0, 0, w);
  I_TASSEN = { p, v };
  return { p, v, ...(w > 0 ? { golv: null, fram: true } : {}) };
}
const iRigg = ([x, y, v = 0]) => [512 + (x - LX) / LS, L.FOTTER + (y - FOT) / LS, v];
// vilken kloss tassen har just nu (riggen ritar den från plockets start till släppet)
const iTassen = t => Object.entries(K).find(([, k]) => t >= k.t0 && t < k.t0 + KAST.slapp)?.[1].n ?? null;
// leopardens pose under ett kast: k = kastet, t global tid → [ansikte-titt, pose]
function kastPose(k, t) {
  const u = t - k.t0, [f0, p0] = L.plockaDel('upp', kl(u, 0, PD), PD, { fri: iRigg(k.fran), hand: 0, boj: k.boj });
  const m = del(KAST.mage[0], KAST.mage[1], u) * (1 - del(KAST.slapp + 0.1, KAST.slapp + 0.75, u)), fv = L.sakFramVag(m);
  const huk = del(KAST.huk[0], KAST.huk[1], u) * (1 - del(KAST.huk[1], KAST.huk[1] + 0.12, u)), lyft = bump(KAST.lyft[0], KAST.lyft[1] + 0.25, u);
  const mal = k.mal[0] < LX ? -1 : 1, titt = u < PD ? f0.titt : [10 * mal, u < KAST.slapp ? 4 : -2 - 4 * bump(KAST.slapp, KAST.slapp + k.F, u)];
  const p = { ...p0, armar: [p0.armar[0] + fv.armar, p0.armar[1]], fram: [fv.fram, 0], hand: m > 0.001 ? 1 : p0.hand, klapp: fv.klapp, sakGrepp: fv.sakGrepp,
    armY: fv.armY + 18 * huk - 34 * lyft, strack: p0.strack - 0.05 * huk + 0.035 * lyft, bred: (p0.bred || 0) + 0.03 * huk, luta: p0.luta + 2 * mal * lyft,
    oron: (p0.oron || [0, 0]).map(o => o - 6 * lyft), lyft: (p0.lyft || 0) + 1.5 * p0.luta };   // lutar hon sig står vänsterfoten kvar på golvet (den högra lyfts)
  return [titt, p];
}
// en rad med ett kast: ivrig medan hon kastar, blicken följer klossen; vid korgen förvånad när den tippar ner (öronen upp)
function kastRad(k, t, kam) {
  const [titt, p] = kastPose(k, t), l = landar(k), korg = k.mal[0] < LX, ned = korg ? del(l + 0.6, l + 1.3, t) : 0, oj = korg ? del(l + 0.75, l + 1.05, t) : 0;
  return RUM({ kam, f: F(oj > 0.5 ? 'forvanad' : 'ivrig', { titt: [lerp(titt[0], -12, ned), lerp(titt[1], 10, ned)] }), p: { ...p, oron: p.oron.map((o, i) => o + UPP(oj)[i]) } });
}
// var klossen är i luften efter släppet (båge från tassen till målet, lite snurr)
function iLuften(k, t) {
  const u = kl((t - k.t0 - KAST.slapp) / k.F), m = 0.5 * mjuk(u) + 0.5 * u;
  return { p: [lerp(k.ut.p[0], k.mal[0], m), lerp(k.ut.p[1], k.mal[1], m) - k.H * Math.sin(Math.PI * u)], v: lerp(k.ut.v, k.vMal, mjuk(u)), golv: null, fram: true };
}
const landar = k => k.t0 + KAST.slapp + k.F;

// --- Klossarnas vägar (globala tider) -----------------------------------------------------------------------------------------------
// var(t, a, d, P0, P1, h): rakt eller i båge; rull: cirkeln rullar när den glider på golvet
const bage = (t, a, d, P0, P1, h = 0) => { const u = kl((t - a) / d), m = mjuk(u); return [lerp(P0[0], P1[0], m), lerp(P0[1], P1[1], m) - h * Math.sin(Math.PI * u)]; };
const vick = (t, a, d = 0.7) => 9 * Math.sin(2 * Math.PI * (t - a) / 0.35) * bump(a, a + d, t);
const sjunk = (t, o) => kl((t - (o - 0.35)) / 0.35);   // sjunker ner i hålet de sista 0,35 s före ploppet
function klossLage(n, t) {
  const r = id => S0(id), dl = (id, a, b) => del(r(id) + a, r(id) + b, t);
  if (n === 'cirkel') {
    const k5 = K.c5, k19 = K.c19, l5 = landar(k5), l19 = landar(k19), t20 = r('20'), o20 = t20 + 0.4 + LN(31) - 0.45, RR = 40;   // RR: cirkelns radie i bild (rullar)
    if (t < k5.t0) return { p: GOLVET.cirkel };
    if (t < k5.t0 + KAST.slapp) return { tass: k5 };
    if (t < l5) return iLuften(k5, t);
    if (t < l5 + 0.6) return { p: KORG_TOPP.cirkel, v: k5.vMal + vick(t, l5, 0.6), golv: null };   // på leksakshögen, vickar
    // tippar över korgens framkant (en liten båge upp och ut, aldrig genom kanten), landar och rullar tillbaka mot leoparden
    if (t < l5 + 1.1) { const u = kl((t - l5 - 0.6) / 0.5);   // ut åt höger först, sedan ner: landar till höger om fyrkanten, aldrig genom den
      return { p: [lerp(KORG_TOPP.cirkel[0], VID_KORG.cirkel[0], 1 - (1 - u) ** 2), lerp(KORG_TOPP.cirkel[1], VID_KORG.cirkel[1], u * u) - 36 * Math.sin(Math.PI * u)], v: k5.vMal - 80 * mjuk(u), golv: null }; }
    const rull = (VILA.cirkel[0] - VID_KORG.cirkel[0]) / RR * 180 / Math.PI;
    if (t < k19.t0) { const u = kl((t - l5 - 1.1) / 0.9), e = 1 - (1 - u) ** 2;   // rullar och saktar in
      return { p: [lerp(VID_KORG.cirkel[0], VILA.cirkel[0], e), lerp(VID_KORG.cirkel[1], VILA.cirkel[1], e) - 6 * bump(0, 0.18, u)], v: k5.vMal - 80 + rull * e }; }
    if (t < k19.t0 + KAST.slapp) return { tass: k19 };
    if (t < l19) return iLuften(k19, t);
    // på det trekantiga hålet: vickar, passar inte. Sedan rullar den till det runda hålet, med ett litet hopp över det fyrkantiga,
    // stannar ovanför sitt hål, vickar till, och sjunker ner på "plopp!"
    if (t < t20 + 0.5) return { p: PA_HAL('trekant'), v: vick(t, l19 + 0.05, 0.8), pa: 'trekant' };
    const r0 = t20 + 0.5, r1 = o20 - 1.0, dx = PA_HAL('cirkel')[0] - PA_HAL('trekant')[0];
    if (t < r1) { const u = kl((t - r0) / (r1 - r0)), e = mjuk(u), p = [lerp(PA_HAL('trekant')[0], PA_HAL('cirkel')[0], e), PA_HAL('trekant')[1] - 22 * bump(0.3, 0.7, u)];
      return { p, v: dx * e / RR * 180 / Math.PI, pa: 'cirkel' }; }
    const vEnd = dx / RR * 180 / Math.PI;
    if (t < o20 - 0.35) return { p: PA_HAL('cirkel'), v: vEnd + 0.6 * vick(t, r1 + 0.05, 0.5), pa: 'cirkel' };
    if (t < o20) return { p: PA_HAL('cirkel').map((v, i) => v + i * 80 * mjuk(sjunk(t, o20))), v: vEnd, pa: 'cirkel', ner: true };
    return null;
  }
  if (n === 'fyrkant') {

    if (t < l7 + 1.1) return { p: bage(t, l7 + 0.6, 0.5, KORG_TOPP.fyrkant, VID_KORG.fyrkant, 40), v: k7.vMal - 28 * mjuk(del(l7 + 0.6, l7 + 1.1, t)), golv: null };
    if (t < k21.t0) { const u = kl((t - l7 - 1.1) / 0.45), e = 1 - (1 - u) ** 2;

    if (t < l21) return iLuften(k21, t);
    if (t < o22 - 0.35) return { p: PA_HAL('fyrkant'), v: vick(t, l21 + 0.05, 0.4) * 0.5, pa: 'fyrkant' };
    if (t < o22) return { p: PA_HAL('fyrkant').map((v, i) => v + i * 80 * mjuk(sjunk(t, o22))), pa: 'fyrkant', ner: true };

  }

  const t15 = r('15'), t17 = r('17'), t27a = r('27a'), o27 = r('27b') + 0.3 + LN(39) - 0.45;

  if (t < t27a + 0.7) { const u = del(t27a + 0.2, t27a + 0.7, t); return { p: lerp2(UNDER, UT_UNDER, u), v: lerp(14, 4, u), s: lerp(KS * 0.85, KS, u), lager: u < 0.6 ? 'under' : 'golvsak' }; }
  if (t < t27a + 0.8) return { p: UT_UNDER, v: 4 };
  if (t < t27a + 1.5) return { p: bage(t, t27a + 0.8, 0.7, UT_UNDER, PA_HAL('trekant'), 300), v: lerp(4, 0, del(t27a + 0.8, t27a + 1.5, t)), golv: null };

  if (t < o27) return { p: PA_HAL('trekant').map((v, i) => v + i * 80 * mjuk(sjunk(t, o27))), pa: 'trekant', ner: true };

function lage(t) {
  let i = RAD.findIndex(r => t < r.s + r.d); if (i < 0) i = RAD.length - 1;
  const r = RAD[i], tl = t - r.s, st = SR[r.id](tl, r.d);
  if (i > 0) {   // ansikte och pose blandas mjukt in från förra radens slut (0,45 s)
    const fr = RAD[i - 1], f0 = SR[fr.id](fr.d, fr.d), gb = del(0, 0.45, tl);
    if (f0.plats === st.plats && st.f && f0.f && gb < 1) { const fri = st.p.sakFri; st.f = L.blanda(f0.f, st.f, gb); st.p = { ...L.blandaPose(f0.p, st.p, gb), sakFri: fri }; }   // klossen ligger kvar där den ligger
  }
  return { ...st, id: r.id, tl, d: r.d };
}

const LEKRUM = '/assets/bakgrunder/lekrummet/lekrummet-v2.jpeg';   // gröna lekrummet v2 (Sanna 2026-11-25), golvet på y ca 810 som sovrummets
function ritaRum(st, t) {

  const lagen = ['cirkel', 'fyrkant', 'trekant'].map(n => [n, klossLage(n, t)]).filter(([, k]) => k).map(([n, k]) => [n, k.tass ? tassKloss(n, k.tass, t) : k])

  const ritK = ([n, k]) => kloss(n, k.p, { v: k.v || 0, s: k.s || (k.pa ? KS * 0.9 : KS), lager: k.lager || (k.fram ? 'fram' : 'golvsak'), golv: k.golv === null ? null : k.p[1] + (k.golv ?? 0),

  if (t >= lt) { lada({ fyll, skak: st.skak || 0 }); if (t < T_LADA.ut[1] + 0.1) ladaRit(t, fyll); }
  lagen.filter(([, k]) => !(k.bakLada || k.lager === 'under')).forEach(ritK);
  // skimmer
  if (st.skim) skimmer(st.skim[0], st.skim[1], st.skim[2], t, st.skim[3]);
  if (st.skimHal) ['cirkel', 'fyrkant', 'trekant'].forEach((n, i) => { const [x, y] = ladaPunkt(LADA.hal[n]); skimmer(x, y - 8, st.skimHal[i], t, 0.5); });
  // kritirisen runt leoparden och lådan

}
