<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Räven plockar blåbär</title>
<style>html, body { margin:0; background:#000; overflow:hidden } svg { width:100vw; height:100vh; display:block; }</style>
</head>
<body>
<!-- 059 Räven plockar blåbär: hela kodscenen (grind 6). Mått och utsnitt som storyboarden (../../storyboard/scen.html),
     ramverket som 056:s sovrum (varm ton, vinjett 0,14, ny brusbild 6 gånger/s, line boil 2,5 px delat med zoomen, kant.js, djup3d).
     Tiderna ur rader.json (skrivs av storyboard/bygg.mjs).
     Rendera: node avsnitt/059-raven-plockar-blabar/scener/render.mjs avsnitt/059-raven-plockar-blabar/scener/skogen [--snabb].
     Bara hårda klipp; den enda åkningen är zoomen in i teckningen. Kritan är liten, utan ansikte, knackar aldrig.
     Bären, korgen, pallen och den blå nosen räknas på hela filmens tid (de ändras bara framåt); räven och kameran per rad. -->
<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="boil" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="5000">
      <feTurbulence id="brus" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
      <feDisplacementMap in="SourceGraphic" scale="2.5"/>
    </filter>
    <filter id="korn" x="0" y="0" width="1" height="1">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="2"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.47  0 0 0 0 0.36  1.1 0 0 0 -0.47"/>
    </filter>
    <filter id="mjukskugga" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="7"/></filter>
    <radialGradient id="vinjett" cx="50%" cy="50%" r="75%"><stop offset="0.55" stop-color="#3a2410" stop-opacity="0"/><stop offset="1" stop-color="#3a2410" stop-opacity="0.14"/></radialGradient>
    <clipPath id="korgfram" clipPathUnits="userSpaceOnUse"><rect x="0" y="540" width="1024" height="484"/></clipPath>
    <!-- pallens framsidor (i pallbildens pixlar): ritas framför räven när den står på ett steg; topparna ligger kvar bakom -->
    <clipPath id="pallfram-lag" clipPathUnits="userSpaceOnUse"><path d="M0 300 H356 V560 H0Z"/></clipPath>
    <clipPath id="pallfram-hog" clipPathUnits="userSpaceOnUse"><path d="M0 300 H356 V95 H790 V560 H0Z"/></clipPath>
    <clipPath id="palltopp-lag" clipPathUnits="userSpaceOnUse"><path d="M32 238 H352 V300 H32Z"/></clipPath>
    <clipPath id="palltopp-hog" clipPathUnits="userSpaceOnUse"><path d="M360 28 H750 V96 H360Z"/></clipPath>
  </defs>
  <rect width="1920" height="1080" fill="#FAF8F2"/>
  <g id="kamera">
    <g id="platta" data-djup-ramp="700:-0.1 880:0 1080:0.15"></g>
    <g filter="url(#boil)"><g id="bak"></g></g>
    <g filter="url(#boil)"><g id="mitt"></g></g>
    <g filter="url(#boil)"><g id="figurer"></g></g>
    <g filter="url(#boil)"><g id="fram"></g></g>
    <g id="forgrund" data-djup="0.15"></g>
    <g id="glans"></g>
    <g id="krita"></g>
  </g>
  <g id="ram"></g>
  <g id="gomda" opacity="0"></g>
</svg>
<script src="/verktyg/blinka.js"></script>
<script src="/verktyg/kant.js"></script>
<script src="/verktyg/kritan-ritar.js"></script>
<script src="/verktyg/djup3d.js"></script>
<script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script>
const $ = id => document.getElementById(id);
const A = '/assets/';
const lagg = (id, h) => $(id).insertAdjacentHTML('beforeend', h);
const f1 = v => (+v).toFixed(1);
const kl = (k, a = 0, b = 1) => Math.max(a, Math.min(b, k)), lerp = (a, b, k) => a + (b - a) * k;
const mjuk = k => (k = kl(k), k * k * (3 - 2 * k)), del = (a, b, t) => mjuk((t - a) / (b - a));
const bump = (a, b, t) => (t <= a || t >= b) ? 0 : Math.sin(Math.PI * (t - a) / (b - a));
const lerp2 = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k)];

// --- Bilderna och måtten (som storyboarden) ---------------------------------------------------------------------------------
const PLATTA = A + 'bakgrunder/skogen-gron/skogen-gron.png', FORGRUND = A + 'bakgrunder/skogen-gron/skogen-gron-forgrund.png';
const BUSKE = { bild: A + 'rekvisita/blabarsbuske/cut/blabarsbuske.png', w: 1018, h: 713, fot: [509, 699] };
const STUBBE = { bild: A + 'rekvisita/stubbe/cut/stubbe.png', w: 1113, h: 742, fot: [556, 718] };
const KORG = { bild: A + 'rekvisita/korg/cut/korg-v3-tunn.png', w: 1024, h: 1024, fot: [512, 915], topp: 105 };
const PALL = { bild: A + 'rekvisita/pall/cut/pall-tunn.png', w: 781, h: 551, fot: [390, 530], topp: 21 };
const GS = 0.59, FOT = 880, SVART = 0.6;
const LILLA = { x: 400, y: 862, h: 250, bar: [[0.22, 0.42], [0.4, 0.3], [0.62, 0.36], [0.58, 0.3], [0.33, 0.62], [0.58, 0.6], [0.5, 0.47], [0.6, 0.5]] };   // 7, 2, 4, 1: där tassen når (sätts i ready)
// rad 3: fyra plock, tassen sträcker sig in i busken (armen v grader) och bäret följer med tillbaka; [bär, start, v]
const PLOCK3 = [[7, 0.15, 0], [2, 1.0, 30], [4, 1.85, -30], [1, 2.7, 15]], NA = 0.38, HALL = 0.12, TILLBAKA = 0.42, INDRAGEN = -60;
const STORA = { x: 1590, y: 872, h: 500, bar: [[0.3, 0.16], [0.48, 0.1], [0.66, 0.15], [0.4, 0.24], [0.58, 0.22], [0.75, 0.27], [0.22, 0.27]] };
const SISTA = { x: 1120, y: 884, h: 230, bar: [[0.8, 0.47]] };   // halva busken tittar fram bakom stubbens högra sida, ett bär syns (Sanna 27/11: inte en kvist på marken)
const STUBB = { x: 990, y: 906, w: 310 };
const KVISTBAR = [1222, 762], KVIST = [KVISTBAR[0] - 20, KVISTBAR[1] + 30];   // bäret på sista busken = barPos(SISTA, 0) (namnet kvar från kvisten)
const VID_LILLA = [660, FOT], VID_STORA = [1250, FOT], VID_NER = [1385, FOT];   // VID_NER: där räven landar när den kliver ner från pallen (kvisten vid stubben syns)
const KORG_LILLA = [530, 902], KORG_H = 150;
const PALLPOS = [1440, 896], PALL_H = 170;
const BAR = { r: 15, farg: '#3A4FB8', mork: '#22307A' };
const BLA = '#4A5AC8', BLA_MORK = '#3A4FB8';
const KORG_DETALJ = ['M215 485 C215 412 805 412 805 485 C805 552 215 552 215 487', 'M245 425 C290 160 730 160 770 415',
  'M165 560 C380 612 650 612 860 550', 'M262 612 C300 700 340 780 380 860', 'M690 618 C675 690 660 750 640 805'];
const PALL_DETALJ = ['M32 300 C130 304 250 304 350 300', 'M360 96 C480 100 630 100 748 94'];

let L, G, BLINKA, BK, PK, TT = 0, ZOOM = 1, RAD = [], RR = {}, ROSTER = [], DURATION = 0;
let T_RIT, T_K, T_P, KORG_STORA, STEG1, STEG2, FLYG = [], HAND = [], KORGN = [];
const LN = n => ROSTER[n - 1][1];
const M = (id, n) => RR[id].malin.find(x => x[0] === n)[1];
const iFig = ([x, fot], [px, py], s = GS) => [x + (px - 512) * s, fot + (py - L.FOTTER) * s];

function kamera([zoom, cx, cy]) {
  ZOOM = zoom;
  const tx = Math.max(1920 - 1920 * zoom, Math.min(0, 960 - cx * zoom)), ty = Math.max(1080 - 1080 * zoom, Math.min(0, 540 - cy * zoom));
  $('kamera').setAttribute('transform', `translate(${f1(tx)} ${f1(ty)}) scale(${zoom})`);
  $('brus').nextElementSibling.setAttribute('scale', (2.5 / zoom).toFixed(2));   // line boil 2,5 px i bild
}
// --- Kameror [zoom, cx, cy] (storyboardens utsnitt) -----------------------------------------------------------------------
const K_HEL = [1, 960, 540];
const HALV = ([x, y]) => [1.6, x - 60, y - 230];
const ANS = ([x, y]) => () => [2.6, x, y - (L.FOTTER - 440) * GS];
const K_LILLA_BUSKE = [2.4, LILLA.x, LILLA.y - LILLA.h * 0.55];
const K_TASSAR = [2.6, VID_LILLA[0] - 110, FOT - 170];
const K_KORG_LILLA = [2.6, KORG_LILLA[0] + 40, KORG_LILLA[1] - 110];
const K_PLOCKA_LILLA = [1.9, (LILLA.x + VID_LILLA[0]) / 2, FOT - 200];
const K_STORA_TOPP = [2.4, STORA.x, STORA.y - STORA.h * 0.82];
const K_STORA = HALV([VID_STORA[0] + 120, FOT - 60]);
const K_PALL = HALV([VID_STORA[0] + 80, FOT - 60]);
const K_PALL_PLOCK = [1.5, 1430, 560];
const K_KORG = () => [3.0, KORG_STORA[0], KORG_STORA[1] - 90];
const K_KVIST = [3.2, KVIST[0] - 40, KVIST[1] - 40];
const K_STUBBE = [1.8, (STUBB.x + VID_NER[0]) / 2, FOT - 190];

// --- Skogen och sakerna -----------------------------------------------------------------------------------------------------
const bar = (x, y, r = BAR.r, o = 1) => `<g opacity="${kl(o).toFixed(2)}"><circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r + 3)}" fill="#FFFDF6"/><circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}" fill="${BAR.farg}"/>
  <path d="M${f1(x - r * 0.35)} ${f1(y - r * 0.7)} L${f1(x)} ${f1(y - r * 0.45)} L${f1(x + r * 0.35)} ${f1(y - r * 0.7)}" fill="none" stroke="${BAR.mork}" stroke-width="${f1(r * 0.22)}" stroke-linecap="round"/>
  <circle cx="${f1(x - r * 0.38)}" cy="${f1(y - r * 0.2)}" r="${f1(r * 0.22)}" fill="#fff" opacity=".75"/></g>`;
const KLASE = [[0, 0], [-0.75, 0.45], [0.7, 0.55]];
const klase = (x, y, n, r) => KLASE.slice(0, n).map(([dx, dy]) => bar(x + dx * r * 1.5, y + dy * r * 1.5, r)).join('');
const buskSkala = B => B.h / (BUSKE.fot[1] - 13);
function buske(B, uta = []) {
  const s = buskSkala(B), w = BUSKE.w * s, x0 = B.x - BUSKE.fot[0] * s, y0 = B.y - BUSKE.fot[1] * s;
  lagg('bak', `<ellipse cx="${B.x}" cy="${B.y - 4}" rx="${f1(w * 0.42)}" ry="${f1(B.h * 0.05)}" fill="#2f5a22" opacity="0.22" filter="url(#mjukskugga)"/>
    <image href="${BUSKE.bild}" x="${f1(x0)}" y="${f1(y0)}" width="${f1(w)}" height="${f1(BUSKE.h * s)}"/>`
    + B.bar.map((_, i) => uta.includes(i) ? '' : bar(...barPos(B, i))).join(''));
}
const barPos = (B, i) => { const s = buskSkala(B); return [B.x - BUSKE.fot[0] * s + B.bar[i][0] * BUSKE.w * s, B.y - BUSKE.fot[1] * s + B.bar[i][1] * BUSKE.h * s]; };
function stubbe() {
  const s = STUBB.w / (1090 - 22), x0 = STUBB.x - STUBBE.fot[0] * s, y0 = STUBB.y - STUBBE.fot[1] * s;
  lagg('mitt', `<ellipse cx="${STUBB.x}" cy="${STUBB.y - 4}" rx="${STUBB.w * 0.48}" ry="16" fill="#3a2a1a" opacity="0.2" filter="url(#mjukskugga)"/>
    <image href="${STUBBE.bild}" x="${f1(x0)}" y="${f1(y0)}" width="${f1(STUBBE.w * s)}" height="${f1(STUBBE.h * s)}"/>`);
}
const korgSkala = (h = KORG_H) => h / (KORG.fot[1] - KORG.topp);
const iKorg = ([x, y], h = KORG_H) => { const s = korgSkala(h); return ([px, py]) => [x + (px - KORG.fot[0]) * s, y + (py - KORG.fot[1]) * s]; };
const korgOppning = (pos, dx = 0) => iKorg(pos)([512 + dx, 505]);
// korgen med foten i pos: n bär i högen, inne = bär på väg ner i korgen (mellan baksidan och framkanten), k/f = kritan ritar och fyller
function korg(pos, n = 0, { inne = '', k = 1, f = 1, skugga = true } = {}) {
  const [x, y] = pos, s = korgSkala(), t = `translate(${f1(x)} ${f1(y)}) scale(${s.toFixed(4)}) translate(${-KORG.fot[0]} ${-KORG.fot[1]})`;
  let html = '', Rb = null;
  if (f > 0) {
    const hog = Array.from({ length: n }, (_, i) => { const kk = i % 9, rad = Math.floor(i / 9);
      return bar(280 + kk * 58 + (rad % 2) * 28, 520 - rad * 42 - Math.sin(kk / 8 * Math.PI) * 18 * Math.min(rad, 2), 46); }).join('');
    const mask = f < 1 ? fyllMask('fyK', 512, 560, 560, f) : '', cl = f < 1 ? ' clip-path="url(#fyK)"' : '';
    if (skugga && f > 0.5) lagg('fram', `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(KORG_H * 0.42)}" ry="${f1(KORG_H * 0.06)}" fill="#3a2a1a" opacity="0.2" filter="url(#mjukskugga)"/>`);
    lagg('fram', `<g transform="${t}">${mask}<g${cl}><image href="${KORG.bild}" width="1024" height="1024"/>${hog}</g></g>${inne}<g transform="${t}"><g${cl}><image href="${KORG.bild}" width="1024" height="1024" clip-path="url(#korgfram)"/></g></g>`);
  }
  if (k < 1 || f < 1) { Rb = ritBana([KORG.d, ...KORG_DETALJ], ritfart(k), { attr: `fill="none" stroke="${KRITAN.LINJE}" stroke-width="${f1(KRITAN.BRED / s / Math.sqrt(ZOOM))}" stroke-linecap="round" stroke-linejoin="round" opacity="${linjeOpacitet(f).toFixed(2)}"` });
    if (k > 0) lagg('fram', `<g transform="${t}">${Rb.html}</g>`); }
  const i = iKorg(pos);
  return Rb ? { spets: i(Rb.spets), start: i(Rb.start), slut: i(Rb.slut) } : null;
}
const pallSkala = () => PALL_H / (PALL.fot[1] - PALL.topp);
const iPall = ([px, py]) => { const s = pallSkala(); return [PALLPOS[0] + (px - PALL.fot[0]) * s, PALLPOS[1] + (py - PALL.fot[1]) * s]; };
function pall({ k = 1, f = 1 } = {}) {
  const s = pallSkala(), t = `translate(${f1(PALLPOS[0])} ${f1(PALLPOS[1])}) scale(${s.toFixed(4)}) translate(${-PALL.fot[0]} ${-PALL.fot[1]})`;
  let html = '', Rb = null;
  if (f > 0) { if (f > 0.5) lagg('mitt', `<ellipse cx="${PALLPOS[0]}" cy="${PALLPOS[1]}" rx="${f1(PALL_H * 0.78)}" ry="${f1(PALL_H * 0.06)}" fill="#3a2a1a" opacity="0.2" filter="url(#mjukskugga)"/>`);
    html += `${f < 1 ? fyllMask('fyP', 390, 300, 520, f) : ''}<image href="${PALL.bild}" width="${PALL.w}" height="${PALL.h}"${f < 1 ? ' clip-path="url(#fyP)"' : ''}/>`; }
  if (k < 1 || f < 1) { Rb = ritBana([PK.d, ...PALL_DETALJ], ritfart(k), { attr: `fill="none" stroke="${KRITAN.LINJE}" stroke-width="${f1(KRITAN.BRED / s / Math.sqrt(ZOOM))}" stroke-linecap="round" stroke-linejoin="round" opacity="${linjeOpacitet(f).toFixed(2)}"` });
    if (k > 0) html += Rb.html; }
  lagg('mitt', `<g transform="${t}">${html}</g>`);
  return Rb ? { spets: iPall(Rb.spets), start: iPall(Rb.start), slut: iPall(Rb.slut) } : null;
}
// räven står på pallen (steg 'lag' eller 'hog'): en mjuk skugga på stegets ovansida bakom räven, och stegets framsida framför den (Sanna 27/11)
function pallStar(steg, fotX) {
  const s = pallSkala(), t = `translate(${f1(PALLPOS[0])} ${f1(PALLPOS[1])}) scale(${s.toFixed(4)}) translate(${-PALL.fot[0]} ${-PALL.fot[1]})`;
  const px = PALL.fot[0] + (fotX - PALLPOS[0]) / s, py = steg === 'hog' ? 70 : 276;
  lagg('mitt', `<g transform="${t}"><g clip-path="url(#palltopp-${steg})"><ellipse cx="${f1(px)}" cy="${py}" rx="190" ry="20" fill="#5a3a1a" opacity="0.32" filter="url(#mjukskugga)"/></g></g>`);
  lagg('fram', `<g transform="${t}"><image href="${PALL.bild}" width="${PALL.w}" height="${PALL.h}" clip-path="url(#pallfram-${steg})"/></g>`);
}

// --- Räven ---------------------------------------------------------------------------------------------------------------
const ISCEN = el => { const inv = $('kamera').getScreenCTM().inverse(), r = el.getBoundingClientRect(); return new DOMPoint(r.x + r.width / 2, r.y + r.height / 2).matrixTransform(inv); };
function rav([x, fot], f, p, { luft = false, bla = {}, utanSkugga = false } = {}) {
  $('figurer').appendChild(G);
  G.setAttribute('transform', `translate(${f1(x)} ${f1(fot)}) scale(${GS}) translate(-512 ${-L.FOTTER})`);
  L.rita(G, f, p);
  G.querySelector('.skugga')?.setAttribute('opacity', luft || utanSkugga ? 0 : 1);   // i hoppet: ingen skugga som svävar; på pallen: pallStar ritar skuggan
  // blåbärsblått (bara i scenkoden, riggen ändras inte): tungan, nosen, fläckar på tänderna
  const tu = G.querySelector('.tunga2');
  if (tu) { tu.setAttribute('fill', bla.tunga ? BLA : '#f6a6b0'); tu.setAttribute('stroke', bla.tunga ? BLA_MORK : '#d9707f'); }
  G.querySelectorAll('.tunga').forEach(e => e.setAttribute('fill', bla.tunga || bla.tander ? BLA : '#f6a6b0'));
  const nos = G.querySelector('.nasa');
  if (nos) { nos.setAttribute('fill', bla.nos ? BLA_MORK : '#2a1a14');
    if (bla.nos) { const c = ISCEN(nos), w = nos.getBoundingClientRect().width / $('kamera').getScreenCTM().a;
      lagg('glans', [[-0.9, 0.7, 0.32], [1.0, 0.6, 0.26], [0.15, 1.15, 0.22]].map(([dx, dy, k]) => `<circle cx="${f1(c.x + dx * w)}" cy="${f1(c.y + dy * w * 0.6)}" r="${f1(k * w)}" fill="${BLA}" opacity="0.75"/>`).join('')); } }
  if (bla.tander) G.querySelectorAll('.tand').forEach((e, j) => { if (+e.getAttribute('opacity') < 0.5 || j % 2) return;
    const c = ISCEN(e), r = e.getBoundingClientRect().width / $('kamera').getScreenCTM().a * 0.22;
    lagg('glans', [[0, 0, 1], [0.9, 0.5, 0.7]].map(([dx, dy, k]) => `<circle cx="${f1(c.x + dx * r)}" cy="${f1(c.y + dy * r)}" r="${f1(k * r)}" fill="${j % 4 ? '#3B4A8C' : '#6A4C93'}"/>`).join('')); });
}
// tassens spets (sida 'l' = bildens vänster) i scenens koordinater, ur armens synliga del
function tass(sida = 'l', saknas = [960, 700]) {
  const spets = sida === 'l' ? [162, 672] : [862, 672];
  for (const e of [`arm-${sida}-fram`, `arm-${sida}2`, `arm-${sida}`].flatMap(c => [...G.querySelectorAll('.' + c)])) {   // riggen har flera .arm-l (en per pose), ta den som syns
    let syns = true; for (let n = e; n && n !== G; n = n.parentNode) if (n.getAttribute('display') === 'none' || n.style?.display === 'none' || n.getAttribute('opacity') === '0') syns = false;
    if (!syns) continue;
    const m = $('kamera').getCTM().inverse().multiply(e.getCTM()), pt = new DOMPoint(...spets).matrixTransform(m);
    return [pt.x, pt.y];
  }
  return saknas;
}
const munnen = () => { const m = G.querySelector('.mun'), l = G.querySelector('.le');
  const e = m && +(m.getAttribute('opacity') ?? 1) > 0.5 && m.getBBox().width > 1 ? m : l; const c = e ? ISCEN(e) : { x: 960, y: 500 }; return [c.x, c.y]; };
const P = o => ({ ...L.POSE0, ...o });
const POSE = (n, o = {}) => ({ ...L.POSE0, ...L.POSER[n], ...o });
const GLADA = ['glad', 'jatteglad', 'fnissig', 'stolt', 'flinar'];
const F = (n, o = {}) => ({ ...L.blanda('neutral', n, 1), ...(GLADA.includes(n) ? { glad: [0, 0] } : {}), ...o });
const vink = (tl, v, fart = 1.1) => P({ luta: -3 * v, armar: [0, v * (86 + 14 * Math.sin(2 * Math.PI * fart * tl))] });   // högra armen bakom kroppen, snett ut förbi kanten
const nick = (f, p, tl, d = 1.2) => tl > 0 && tl < d ? L.nicka(f, p, tl, d, 2) : [f, p];
const vipp = (tl, a, d = 1.4) => 12 * Math.sin(2 * Math.PI * (tl - a) / 0.8) * bump(a, a + d, tl);
const liv = (p, t) => { const a = (1 - Math.cos(2 * Math.PI * t / 3.6)) / 2;
  return { ...p, strack: (p.strack || 0) + 0.012 * a, oron: (p.oron || [0, 0]).map((o, i) => o - 1.5 * a + (i ? -1 : 1) * 1.2 * Math.sin(t * 1.3 + 2 * i)) }; };
const oronUpp = (tl, a, b, h = 12) => -h * del(a, a + 0.3, tl) * (1 - del(b, b + 0.4, tl));
const prata = (f, tl, a, b) => { const k = bump(a, b, tl) > 0 ? 0.5 - 0.5 * Math.cos(2 * Math.PI * 3.2 * (tl - a)) : 0; return k > 0.02 ? L.blanda(f, { ...f, mun: [16, 12, 1, 458] }, k) : f; };
// ett lugnt skutt från a till b (fötterna), landar vid t1
function skutt(a, b, tl, t1, d = 0.45, h = 60) {
  const u = kl((tl - (t1 - d)) / d);
  return { pos: [lerp(a[0], b[0], mjuk(u)), lerp(a[1], b[1], u) - h * Math.sin(Math.PI * u)], luft: u > 0 && u < 1,
    strack: -0.06 * bump(t1 - d - 0.2, t1 - d + 0.02, tl) + 0.04 * Math.sin(Math.PI * u) * (u > 0 && u < 1 ? 1 : 0) - 0.05 * bump(t1 - 0.02, t1 + 0.28, tl) };
}

// --- Bären i tid: plockade, i tassarna, i korgen, på marken, i luften (räknas på hela filmens tid) -------------------------
const fore = (lista, t) => lista.filter(e => t >= e.t).reduce((s, e) => s + e.n, 0);
// en båge från a till b (a och b kan vara funktioner, de räknas i bildrutan), u 0–1
const bagen = (a, b, u, h) => { const c = [(a[0] + b[0]) / 2, Math.min(a[1], b[1]) - h]; const v = 1 - u; return [v * v * a[0] + 2 * u * v * c[0] + u * u * b[0], v * v * a[1] + 2 * u * v * c[1] + u * u * b[1]]; };
const ta = p => typeof p === 'function' ? p() : p;
// korgens plats: står vid lilla busken, bärs till stora busken (rad 12a), står där resten av filmen
function korgPos(t) {
  const s = RR['12a'].s, ner = s + 2.0;
  if (t < s + 0.5) return KORG_LILLA;
  if (t >= ner + 0.3) return KORG_STORA;
  const [tx, ty] = tass('l'), bar_ = [tx, ty + (KORG.fot[1] - KORG.topp - 20) * korgSkala()];
  return t < s + 0.9 ? lerp2(KORG_LILLA, bar_, del(s + 0.5, s + 0.9, t)) : t < ner ? bar_ : lerp2(bar_, KORG_STORA, del(ner, ner + 0.3, t));
}
const iKorgNu = t => korgOppning(korgPos(t));
function byggFlyg() {
  const s = id => RR[id].s, F_ = [];   // { t0, t1, a, b, h, n, r, bak (lager bakom stubben först) }
  const fly = (t0, t1, a, b, o = {}) => F_.push({ t0, t1, a, b, h: 40, n: 1, r: BAR.r, ...o });
  const iTass = () => tass('l'), iMun = () => munnen();
  // rad 3: fyra bär, tassen tar dem i busken och bäret följer med tassen tillbaka (Sanna 27/11: inga bär som flyger)
  PLOCK3.forEach(([i, o]) => { const g = s('3') + o + NA; F_.push({ t0: g, t1: g + HALL + TILLBAKA, folj: true, n: 1, r: BAR.r, plock: ['L', i], hand: 1 }); });
  // rad 4: tassarna är fulla, ett bär tippar över kanten, faller och rullar iväg; rad 5: ett till
  const rull = (t0, x, dx) => { fly(t0, t0 + 0.4, () => { const [tx, ty] = tass('l'); return [tx, ty - 12]; }, [x, FOT + 12], { h: 18, hand: -1, start: true, r: 13 }); MARK.push({ t0: t0 + 0.4, t1: t0 + 1.4, x, dx }); };
  rull(s('4') + 0.2, VID_LILLA[0] - 150, -200);
  rull(s('5') + 0.05, VID_LILLA[0] - 130, -300);
  // rad 8: plopp, plopp – bären ur tassarna ner i korgen
  [2.16, 2.36].forEach(w => { const t1 = s('8') + 0.6 + w; fly(t1 - 0.4, t1, iTass, () => iKorgNu(t1), { h: 50, hand: -1, start: true, korg: 1, inne: true }); });
  // rad 9: tar ett bär ur korgen; 9b: in i munnen på "Mums!"
  fly(s('9') + 0.3, s('9') + 0.7, () => iKorgNu(0), iTass, { h: 30, korg: -1, hand: 1 });
  fly(s('9b') + M('9b', 20) - 0.3, s('9b') + M('9b', 20), iTass, iMun, { h: 10, hand: -1, start: true, r: 12 });
  // rad 11: plocka, plocka … i korgen (en tasse full, tre bär, per ord)
  [[0, 2.0], [3, 2.5], [6, 3.3]].forEach(([i, w]) => { const t1 = s('11') + 0.3 + w; fly(t1 - 0.55, t1, barPos(LILLA, i), () => iKorgNu(t1), { n: 3, r: 11, h: 70, plock: ['L', i], korg: 3, inne: true }); });
  // rad 16: från stora busken, över huvudet ner i korgen
  [[4, 1.9], [2, 2.4], [5, 3.1]].forEach(([i, w]) => { const t1 = s('16') + 0.3 + w; fly(t1 - 0.6, t1, barPos(STORA, i), () => iKorgNu(t1), { n: 3, r: 11, h: 140, plock: ['S', i], korg: 3, inne: true }); });
  // rad 21: kvistens bär, sedan två tassar fulla som kommer upp bakom stubben
  [[KVISTBAR, 1.9, 'K'], [[1085, 790], 2.4], [[1120, 800], 3.1]].forEach(([a, w, k]) => { const t1 = s('21') + 1.4 + w;
    fly(t1 - (k ? 0.5 : 0.7), t1, a, () => iKorgNu(t1), { n: 3, r: 11, h: 90, plock: k ? ['K', 0] : null, korg: 3, inne: true, upp: !k }); });
  // rad 23: två munsbitar ur korgen på "Mums, mums!"
  [1.88, 2.31].forEach(w => { const t1 = s('23') + 0.6 + w; fly(t1 - 0.45, t1, () => iKorgNu(Infinity), iMun, { n: 2, r: 10, h: 60, korg: -2, start: true }); });
  return F_;
}
const MARK = [];
function bar_i_tid(t) {
  const uta = { L: [], S: [], K: [] }; let hand = 0, korgN = 0;
  for (const f of FLYG) {
    if (f.plock && t >= f.t0) uta[f.plock[0]].push(f.plock[1]);
    if (f.hand && t >= (f.start ? f.t0 : f.t1)) hand += f.hand;
    if (f.korg && t >= (f.korg < 0 ? f.t0 : f.t1)) korgN += f.korg;
  }
  return { uta, hand, korgN };
}
function ritaFlyg(t, hand = 0) {
  for (const f of FLYG) { if (t < f.t0 || t >= f.t1) continue;
    if (f.folj) { const [x, y] = iHanden(hand); lagg('glans', bar(x, y, 13)); continue; }   // bäret i tassen på väg tillbaka
    const u = (t - f.t0) / (f.t1 - f.t0);
    if (f.upp && u < 0.3) {   // kommer upp bakom stubben (lagret bakom)
      const [x, y] = ta(f.a); lagg('bak', klase(x, lerp(y + 90, y, mjuk(u / 0.3)), f.n, f.r)); continue; }
    const uu = f.upp ? (u - 0.3) / 0.7 : u, [x, y] = bagen(ta(f.a), ta(f.b), uu, f.h);
    if (!f.inne) lagg('glans', klase(x, y, f.n, f.r));

}
const inneHtml = t => FLYG.filter(f => f.inne && t >= f.t0 && t < f.t1).map(f => { const u = (t - f.t0) / (f.t1 - f.t0), uu = f.upp ? (u - 0.3) / 0.7 : u;
  if (f.upp && u < 0.3) return ''; const [x, y] = bagen(ta(f.a), ta(f.b), uu, f.h); return klase(x, y, f.n, f.r * lerp(1, 0.85, uu)); }).join('');
// bären som rullat iväg ligger kvar i gräset vid lilla busken
const markBar = t => MARK.filter(m => t >= m.t0).map(m => { const u = mjuk((t - m.t0) / (m.t1 - m.t0)), x = m.x + m.dx * (1 - (1 - kl(u)) ** 2);
  return `<g transform="rotate(${f1(-(m.dx * kl(u)) / BAR.r * 57)} ${f1(x)} ${FOT + 12})">${bar(x, FOT + 12, 13)}</g>`; }).join('');
// i tassarna: ett bär på vänstra tassen, eller flera mellan tassarna (posen magen)
// i en tass (när den andra inte syns, som när räven plockar): bären i en liten klase på tassen, plats n
const KLASE_TASS = [[0, -12], [-17, -4], [15, -3], [-3, -27]];
const iHanden = n => { const [lx, ly] = tass('l'), [dx, dy] = KLASE_TASS[Math.min(n, 3)]; return [lx + dx, ly + dy]; };
function iTassarna(n) { if (n <= 0) return;
  const [lx, ly] = tass('l'), hogra = tass('r', null); if (n === 1) return lagg('glans', bar(lx, ly - 12, 13));
  if (!hogra) return lagg('glans', Array.from({ length: n }, (_, i) => bar(...iHanden(i), 13)).join(''));
  const [rx, ry] = hogra, r = 13;
  lagg('glans', Array.from({ length: n }, (_, i) => bar(lx + (rx - lx) * (0.25 + 0.25 * i) , Math.min(ly, ry) - r * 0.6 - (i === 1 ? r * 1.1 : 0), r)).join('')); }

// --- Kritan, skimmer --------------------------------------------------------------------------------------------------------
const kritaRita = kr => { if (kr) lagg('krita', kritaBild(kr.x, kr.y, kr)); };
const stjarna = (x, y, r, o = 1) => `<path transform="translate(${f1(x)} ${f1(y)}) scale(${r.toFixed(2)})" opacity="${kl(o).toFixed(2)}" d="M0 -1 L.2 -.2 L1 0 L.2 .2 L0 1 L-.2 .2 L-1 0 L-.2 -.2Z" fill="#fff6c8" stroke="#e6b422" stroke-width=".06"/>`;
function skimmer(x, y, k, vidd = 1) { if (k <= 0.01) return;
  lagg('glans', [[-1, -0.7, 1], [1.1, -0.4, 0.8], [0.2, 1.1, 0.7], [-1.2, 0.8, 0.6]].map(([dx, dy, s], i) => stjarna(x + dx * 40 * vidd, y + dy * 34 * vidd, 16 * s * k * vidd * (0.75 + 0.25 * Math.sin(TT * 3 + i * 1.7)), 0.4 + k)).join('')); }
// en sak som kritan ritar i scenen: rit(k, f) ritar konturen/fyllningen och ger kritans punkter
function sakRit(t, T, f, rit, vanta, mitt, R) {
  if (t < T.in[0]) return;
  const b = rit(kl(ritfart((t - T.rit[0]) / (T.rit[1] - T.rit[0]))), f);
  if (b) kritaRita(kritaFas(t, T, { start: b.start, spets: b.spets, slut: b.slut, vanta, s: kritaSkala(ZOOM) * (ZOOM > 2 ? 0.7 : 1) }));

// --- Ritintrot: kritan ritar blåbärsbusken (en sak, inte räven) ---------------------------------------------------------------
