<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Katten åker buss</title>
<style>html, body { margin:0; background:#000; overflow:hidden } svg { width:100vw; height:100vh; display:block; }</style>
</head>
<body>
<!-- 047 Katten åker buss: hela kodscenen (grind 6). Tiderna, Malin och effekterna ur rader.json (skrivs av storyboard/bygg.mjs).
     Rad 00 (logotypen) ingår inte: filmen är en julkalenderlucka (som 040), och scentid = filmtid.
     Platserna: busshållplatsen i vinter, i bussen (bild A: ut genom fönstret med kattens huvud bakifrån; bild B: katten på sätet),
     farmors dörr (stängd/öppen platta). Utsiktsremsorna (horisonten y 521) glider bakom fönsterhålet efter bussens fart v(t),
     som bromsar in vid de tre stoppen och farmors hus. Katten är katten-kaj live (cut-tunn/) i skala 0,55, farmor är farmor-katt (0,66),
     kaninen i pulkan är kaninen-kanel (039), fågeln är 043:s fagel.js. Platshållare i kod: kattens huvud bakifrån, vantehanden,
     kortläsaren, snögubbens hatt, julgranen, imman och hjärtat, kattens tass vid knappen.
     Rendera från repots rot: node avsnitt/047-katten-aker-buss/scener/render.mjs avsnitt/047-katten-aker-buss/scener/resan [--snabb] -->
<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="korn" x="0" y="0" width="1" height="1">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="2"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.47  0 0 0 0 0.36  1.1 0 0 0 -0.47"/>
    </filter>
    <filter id="boil" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="5000">
      <feTurbulence id="brus" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
      <feDisplacementMap in="SourceGraphic" scale="5"/>
    </filter>
    <radialGradient id="imma" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.72"/><stop offset="1" stop-color="#fff" stop-opacity="0.97"/>
    </radialGradient>
    <clipPath id="glaset"><rect x="378" y="98" width="1162" height="399" rx="40"/></clipPath>
  </defs>
  <rect width="1920" height="1080" fill="#FAF8F2"/>
  <g id="kamera">
    <g id="platta"></g>
    <g id="bak"></g>
    <g filter="url(#boil)"><g id="sakerbak"></g></g>
    <g filter="url(#boil)"><g id="figurer"></g></g>
    <g filter="url(#boil)"><g id="saker"></g></g>
    <g id="fram" filter="url(#boil)"></g>
    <g id="pilar"></g>
  </g>
  <g id="ram"></g>
  <g id="gomda" opacity="0"></g>
</svg>
<script src="/verktyg/blinka.js"></script>
<script src="/verktyg/kant.js"></script>
<script src="/produktion/youtube/shorts/godnatt/nalle-v2.js"></script>
<script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script src="/avsnitt/043-grisen-matar-faglarna/fagel.js"></script>
<script src="kaj34.js"></script>
<script>
const $ = id => document.getElementById(id);
const A = '/assets/', R = A + 'rekvisita/', B = A + 'bakgrunder/', HAR = '/avsnitt/047-katten-aker-buss/scener/resan/';
const lagg = (id, h) => $(id).insertAdjacentHTML('beforeend', h);
const bild = (href, w, h, t, extra = '') => `<image href="${href}" width="${w}" height="${h}" transform="${t}" ${extra}/>`;
const f1 = x => (+x).toFixed(1);
const KRITA = R + 'krita-rod/cut/krita-rod.png', KRITA_SPETS = [742, 132];
const NALLE = R + 'nalle/cut/nalle-v2-ljus-tunn.png',   // v2-nallen som leoparden har i 040 (Sanna 2026-11-20), kanten inbakad, ansiktet i kod (nalle-v2.js)
      GUBBE = R + 'snogubbe/cut/snogubbe.png';
const BUSS = { fil: R + 'buss/cut/buss.png', w: 1042, h: 498 }, PLOG = { fil: R + 'snoplog/cut/snoplog.png', w: 1081, h: 579 };
const PULKA = { fil: R + 'pulka/cut/pulka.png', w: 1024, h: 572, mitt: [479, 489] };
const HALL = B + 'busshallplatsen/vinter/busshallplatsen-vinter-v1.jpg', INNE = B + 'i-bussen/i-bussen-v1.jpg', HAL = B + 'i-bussen/i-bussen-v1-fonsterhal.png';
const DORR = B + 'farmors-dorr/farmors-dorr-v1.jpg', DORR_OPPEN = B + 'farmors-dorr/farmors-dorr-oppen-v1.jpg';
const UT = n => B + `utsikt-buss/${n}.jpg`;
let KONTUR = {};

// --- Tiden ---------------------------------------------------------------------------------------------------------------------
const kl = (k, a = 0, b = 1) => Math.max(a, Math.min(b, k)), lerp = (a, b, k) => a + (b - a) * k;
const mjuk = k => (k = kl(k), k * k * (3 - 2 * k)), del = (a, b, t) => mjuk((t - a) / (b - a));
const bump = (a, b, t) => (t <= a || t >= b) ? 0 : Math.sin(Math.PI * (t - a) / (b - a));
let TT = 0, CUR = null, RAD_L = [], RR = {}, ROSTER = [], DURATION = 0;
const SVART = 0.6;
const mo = (i = 0) => CUR.malin[i][1], lo = (i = 0) => CUR.ljud[i][1];
const at = (id, o = 0) => RR[id].s + o, lj = (id, i) => RR[id].ljud[i][1], ml = (id, i = 0) => RR[id].malin[i][1];
const L_ = n => ROSTER[n - 1][1];
const ROST_L = k => ROSTER.find(([n]) => n.startsWith(k + '-'))[1];   // längden på en replik med bokstav (06b)
const ljudT = (re) => (CUR.ljud || []).find(([f]) => re.test(f))?.[1];

// --- Kameran (GUNG: bussen gungar lite när den åker) ------------------------------------------------------------------------------
let GUNG = 0;
function kamera(zoom = 1, cx = 960, cy = 540) {
  const tx = Math.max(1920 - 1920 * zoom, Math.min(0, 960 - cx * zoom)), ty = Math.max(1080 - 1080 * zoom, Math.min(0, 540 - cy * zoom));
  $('kamera').setAttribute('transform', `translate(${tx.toFixed(1)} ${(ty + GUNG).toFixed(1)}) scale(${zoom})`);
  $('brus').nextElementSibling.setAttribute('scale', (5 / zoom).toFixed(2));
}

// --- Effekter (som 044) ---------------------------------------------------------------------------------------------------------
// glans putsad (Sanna 2026-11-21 "polish sparkles"): en smal fyruddig stjärna med svängda sidor i varmvitt, ett mjukt gult sken bakom
// och en ljus prick i mitten; varje glans tindrar i egen takt (storlek och en liten vridning) i stället för att stå still med hård gul kant
const glans = (x, y, r, o = 1, fas = 0) => { const tw = 0.7 + 0.3 * Math.sin(TT * 4.3 + fas * 1.7), R = r * tw;
  return `<g transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(12 * Math.sin(TT * 1.4 + fas))})" opacity="${Math.min(1, o).toFixed(2)}">
    <circle r="${f1(R * 0.95)}" fill="#fff1a8" opacity=".22"/><circle r="${f1(R * 0.5)}" fill="#fff6cf" opacity=".35"/>
    <path transform="scale(${f1(R)})" d="M0 -1 Q.1 -.1 1 0 Q.1 .1 0 1 Q-.1 .1 -1 0 Q-.1 -.1 0 -1Z" fill="#fffbea" stroke="#f0c75a" stroke-width=".035"/>
    <circle r="${f1(Math.max(1.5, R * 0.1))}" fill="#fff"/></g>`; };
const skimmer = (x, y, k = 1, vidd = 1) => { if (k < 0.02) return; const st = Math.sqrt(vidd);   // vidd sprider, storleken växer bara med roten
  lagg('fram', [[-1, -0.7, 1], [1.1, -0.4, 0.8], [0.2, 1.1, 0.7], [-1.2, 0.8, 0.6]]
  .map(([dx, dy, s], i) => { const ki = kl(k * 1.6 - 0.18 * i);   // de tänds en i taget
    return ki > 0.02 ? glans(x + dx * 40 * vidd, y + dy * 34 * vidd, 18 * s * mjuk(ki) * st, Math.min(1, 0.3 + ki), i * 2.3) : ''; }).join('')); };
// gnistorna när bussen fylls i (Sanna 2026-11-21 "sparkles too small and center focused"): större glans utspridda runt hela bussen
// (x ca 380–1540, y ca 300–820 på papperet), tänds en i taget med glittret och tonar ut var för sig
const GNISTOR = [[420, 320, 78], [730, 255, 62], [1040, 280, 86], [1370, 305, 66], [1600, 520, 80], [1520, 820, 60], [1150, 880, 72],
  [760, 870, 64], [340, 650, 82], [880, 540, 54], [1260, 600, 60], [560, 470, 50]];
const bussGnistor = tl => lagg('fram', GNISTOR.map(([x, y, r], i) => { const a = 0.15 + 0.11 * i, o = del(a, a + 0.35, tl) * (1 - del(a + 1.1, a + 1.6, tl));
  return o > 0.02 ? glans(x, y, r * (0.6 + 0.4 * o), o, i * 1.9) : ''; }).join(''));
const krita = (x, y, v = 125, s = 0.33) => lagg('pilar', bild(KRITA, 755, 265, `translate(${f1(x)} ${f1(y)}) rotate(${f1(v)}) scale(${s.toFixed(3)}) translate(${-KRITA_SPETS[0]} ${-KRITA_SPETS[1]})`));
const svajP = (x, y, tl) => [x + 14 * Math.sin(tl * 1.6), y + 10 * Math.sin(tl * 2.3), 140 + 4 * Math.sin(tl * 1.3)];
const kritaGlid = (P0, P1, k, s, bage = 40) => { const m = mjuk(k), h = Math.min(1, Math.hypot(P1[0] - P0[0], P1[1] - P0[1]) / 300) * bage * Math.sin(Math.PI * m);
  krita(lerp(P0[0], P1[0], m), lerp(P0[1], P1[1], m) - h, lerp(P0[2] ?? 125, P1[2] ?? 125, m), s); };
const ritfart = k => (k = kl(k), 0.6 * k + 0.4 * mjuk(k));
const papper = () => { $('platta').innerHTML = `<rect x="-200" y="-200" width="2400" height="1500" fill="#FBF7EE"/><rect x="-200" y="-200" width="2400" height="1500" filter="url(#korn)"/>`; };
function kritiris(r, [cx, cy]) {
  if (r >= 1500) return;
  const ring = 'M' + Array.from({ length: 145 }, (_, j) => { const a = j / 144 * 2 * Math.PI, rr = r * (1 + 0.06 * Math.sin(9 * a + TT * 0.8));
    return `${(cx + rr * Math.cos(a)).toFixed(1)} ${(cy + rr * Math.sin(a)).toFixed(1)}`; }).join('L') + 'Z';
  lagg('ram', `<path d="M-50 -50H1970V1130H-50Z ${r > 1 ? ring : ''}" fill="#101010" fill-rule="evenodd"/>
    ${r > 1 ? `<path d="${ring}" fill="none" stroke="#fff8e0" stroke-width="${Math.min(14, r / 4)}" stroke-linejoin="round" filter="url(#boil)"/>` : ''}`);
}
const tussar = (x, y, k, s = 1) => { if (k <= 0 || k >= 1) return; lagg('fram', [[-50, 0], [50, -6], [0, -30], [-30, -20], [34, -24]].map(([dx, dy]) =>
  `<circle cx="${f1(x + s * dx * (0.6 + k))}" cy="${f1(y + s * (dy * (0.6 + k) + 40 * k * k))}" r="${f1(s * (12 - 5 * k))}" fill="#fff" opacity="${(0.9 * (1 - k)).toFixed(2)}"/>`).join('')); };
const vit = v => { if (v > 0) lagg('ram', `<rect x="-50" y="-50" width="2020" height="1180" fill="#FBF7EE" opacity="${v.toFixed(3)}"/>`); };
const slump = x => { const v = Math.sin(x * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); };
// snöfall: [x0, y0, bredd, höjd] (i kamerans rum), drift = vinden när bussen åker
function snofall(lager = 'fram', [x0, y0, w, h] = [-40, -60, 2000, 1200], tat = 0.9, drift = 0) {
  if (typeof lager === 'number') { tat = lager; lager = 'fram'; }
  let s = '';
  for (let i = 0; i < Math.round(110 * tat * w / 2000); i++) { const r = k => slump(i * 7.3 + k * 1.9), v = 22 + 18 * r(3);
    const y = y0 + ((TT * v + r(4) * h) % h), x = x0 + (((r(1) * w + 26 * Math.sin(TT * (0.4 + 0.3 * r(5)) + r(2) * 6) - drift * (0.6 + 0.4 * r(8))) % w) + w) % w;
    s += `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(2.6 + 3.2 * r(6))}" fill="#fff" opacity="${(0.65 + 0.3 * r(7)).toFixed(2)}"/>`; }
  lagg(lager, s);
}

// --- Katten (Kaj) med nallen -------------------------------------------------------------------------------------------------
let L, G, BLINKA, LF, GF, BLINKA_F, LK, GK; const GS = 0.7, GSF = 0.84;   // Sanna 2026-11-20: större katt (0,55 → 0,7), farmor lika mycket större
const P = o => ({ ...L.POSE0, ...o });
const ANS = (n, o = {}, l = L) => { const f = { ...l.blanda('neutral', n, 1), ...(['glad', 'jatteglad', 'fnissig', 'stolt', 'flinar'].includes(n) ? { glad: [0, 0] } : {}) };
  if (f.armar) f.armar = f.armar.map(a => a / 2); return { ...f, ...o }; };
const mellan = (a, b, k, l = L) => l.blanda(a, b, mjuk(k));
const skutt = (tl, a, b, h = 28) => h * bump(a + 0.15 * (b - a), b - 0.1 * (b - a), tl);
const nick = (f, p, tl, d = 1.2) => tl > 0 && tl < d ? L.nicka(f, P(p), tl, d, 2) : [f, p];
// Sanna 2026-11-20: "cat hold leo in one hand". Nallen i vänstra tassen (bildens vänstra, framför kroppen) hela filmen; den högra
// tassen är fri och gör allt: blippar, sträcker sig mot knappen, knackar och vinkar (bakom kroppen, snett ut förbi kanten).
const ENHAND = { armar: [-124, 0], fram: [1, 0] };
// vinka med den fria armen (bildens högra), bakom kroppen, snett ut förbi kanten (som 044)
const VINKA = (tl, a, b) => ({ upp: del(a, a + 0.6, tl) - del(b, b + 0.6, tl), tl: tl - a - 0.5 });
const nallePos = (x, fot, s, lyft) => [x + (512 - 512) * s, fot - lyft + (690 - L.FOTTER) * s];
const nalle = (x, y, s, v = 0) => lagg('saker', `<g transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(v)}) scale(${s.toFixed(4)}) translate(-424 -430)">
  <image href="${NALLE}" width="848" height="856"/>${nalleAnsikte(NBLINK())}</g>`);
// nallen blinkar ibland (som 040), så att bilden aldrig står helt still
const NBLINK = () => { const u = TT % 3.7; return u > 1.6 && u < 1.75 ? 1 : 0; };
const skugga = (x, y, rx = 150) => lagg('bak', `<ellipse cx="${f1(x)}" cy="${f1(y - 2)}" rx="${f1(rx)}" ry="${f1(rx * 0.12)}" fill="#3a5a7a" opacity="0.08"/>`);
const STEG = 46, ORA_MAX = 13;
// Kajs öron och svansrot putsade i scenen (Sanna 2026-11-20: "ears need polish at the ends", "polish cats tail, looks oddly bent
// or wall at root"). Urklippen i assets/karaktarer/katten-kaj är orörda. Örat: samma form som riggens ORA_D men med mjuka kurvor
// och rundad spets, roten långt ner under huvudets kant (döljs bakom kroppen) och vridpunkten vid roten i stället för mitt i örat.
// Svansen: en ren kodbit i svansens färg över urklippets knöliga fog (vinkeln och de vita stygnen vid kroppen), från inne i kroppen
// till där svansen är ren.
const ORA2_D = 'M305 410 C292 360 283 300 289 240 C292 214 299 199 314 197 C332 197 362 221 384 248 C401 269 411 302 416 340 C420 372 410 402 390 420 Z';
const ORA2 = `<path d="${ORA2_D}" fill="#fff" stroke="#fff" stroke-width="30" stroke-linejoin="round"/><path d="${ORA2_D}" fill="#342d2a" stroke="#342d2a" stroke-width="10" stroke-linejoin="round"/>
  <path d="M322 380 C312 330 307 270 314 238 C318 220 330 219 348 233 C371 252 387 283 393 318 C397 345 392 372 376 392 Z" fill="#cf8f95"/>`;
const SVANSROT = 'M690 750 C740 752 790 742 826 716 C850 698 866 678 876 660';
function putsaKaj() {
  L.RIGG['ear-l'] = [342, 302]; L.RIGG['ear-r'] = [672, 302];
  G.querySelector('.ear-l').innerHTML = ORA2; G.querySelector('.ear-r').innerHTML = `<g transform="translate(1014 0) scale(-1 1)">${ORA2}</g>`;
  const t = G.querySelector('image.tail'), g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('class', 'tail'); t.replaceWith(g); t.removeAttribute('class'); g.appendChild(t);
  // ryggsäckens axelremmar framifrån (Sanna 2026-11-20: "straps go around the arms"): varje rem kommer bakifrån över axelns topp,
  // ner framför armroten och tillbaka bakom kroppen under armen (riggens kropp: kanten x 224–795 vid y 540, armrötterna y 528–646).
  // Remmen ligger i kroppens lager, så bakre armar syns under den och armarna vrider sig fritt; en flik av säcken sticker ut
  // bakom kroppen vid axlarna. Spegling kring kroppens mitt (x 509,5): x → 1019 − x.
  const REM = 'M246 448 C286 474 300 528 292 570 C286 606 264 626 232 636';
  const rem = sx => { const t = sx < 0 ? 'translate(1019 0) scale(-1 1)' : '';
    return `<g transform="${t}"><path d="${REM}" fill="none" stroke="#2e6239" stroke-width="26" stroke-linecap="round"/>
      <path d="${REM}" fill="none" stroke="#4F9A5E" stroke-width="19" stroke-linecap="round"/>
      <path d="${REM}" fill="none" stroke="#7fbf8b" stroke-width="2.5" stroke-dasharray="6 6" transform="translate(2 -3)" opacity=".75"/>
      <g transform="translate(276 496) rotate(58)"><rect x="-14" y="-10" width="28" height="20" rx="5" fill="#f2b632" stroke="#9c6e10" stroke-width="3"/><path d="M-6 0 H6" stroke="#9c6e10" stroke-width="3"/></g></g>`; };
  const flik = sx => `<g transform="${sx < 0 ? 'translate(1019 0) scale(-1 1)' : ''}"><path d="M252 392 C226 398 214 420 212 450 C211 478 216 500 226 516 L240 516 Z" fill="#3f8a50" stroke="#2e6239" stroke-width="5" stroke-linejoin="round"/></g>`;
  G.querySelector('.kropp > image').insertAdjacentHTML('afterend', `<clipPath id="kajKropp"><ellipse cx="509.5" cy="545" rx="282" ry="320"/></clipPath>
    <g class="remmar" clip-path="url(#kajKropp)">${rem(1)}${rem(-1)}</g>`);   // klippt till kroppen: remmen försvinner bakom kroppens kant i båda ändar
  const flikStor = sx => `<g transform="${sx < 0 ? 'translate(1019 0) scale(-1 1)' : ''}"><path d="M256 372 C206 378 182 414 180 456 C178 500 192 530 216 544 L240 544 Z" fill="#3f8a50" stroke="#2e6239" stroke-width="5" stroke-linejoin="round"/>
      <path d="M204 430 C198 462 200 494 212 518" fill="none" stroke="#7fbf8b" stroke-width="3" stroke-dasharray="6 6" opacity=".75"/></g>`;
  G.querySelector('.katt').insertAdjacentHTML('afterbegin', `<g class="remmar sackflik liten">${flik(1)}${flik(-1)}</g><g class="remmar sackflik stor">${flikStor(1)}${flikStor(-1)}</g>`);   // stor: rad 3b visar säcken tydligare
  g.insertAdjacentHTML('beforeend', `<path d="${SVANSROT}" fill="none" stroke="#fff" stroke-width="70" stroke-linecap="butt"/><path d="${SVANSROT} L888 636" fill="none" stroke="#2c2622" stroke-width="48" stroke-linecap="round"/>`);
}
const iSatet = () => { const n = parseInt(CUR?.id); return n >= 13 && n <= 40; };   // i bussen ligger ryggsäcken på sätet bredvid katten
function katt(f, p = {}, { x = 960, fot = 1000, s = GS, lyft = 0, vinka = null, gang = null, medNalle = true, nalleV = -6, skugg = true } = {}) {
  if (gang) { const [, q] = L.steg(gang.vag / (2 * STEG) / 1.2, 1, gang.dir); const { x: _x, ...r } = q;
    p = { ...p, ...r, luta: (r.luta || 0) + (p.luta || 0) + 2 * gang.dir, svans: 9 * Math.sin(gang.vag / STEG * Math.PI) }; }
  else p = { ...p, svans: (p.svans || 0) + 8 * Math.sin(2 * Math.PI * TT / 2.2) };
  if (vinka && vinka.upp > 0.001) { const u = mjuk(vinka.upp), a = [...(p.armar || [0, 0])]; a[1] += u * (52 + 16 * Math.sin(2 * Math.PI * 1.15 * vinka.tl)); p = { ...p, armar: a, luta: (p.luta || 0) + 1.5 * u }; }
  { const a = (1 - Math.cos(2 * Math.PI * TT / 3.6)) / 2; p = { ...p, strack: (p.strack || 0) + 0.012 * a, bred: (p.bred || 0) + 0.006 * a }; }
  const n = (CUR.ljud || []).filter(([fil]) => /^mjau/.test(fil)).reduce((sm, [, o]) => sm + bump(o - 0.05, o + 0.4, TT - CUR.s), 0);
  if (n > 0.01) p = { ...p, strack: p.strack + 0.03 * n, oron: (p.oron || [0, 0]).map(o => o - 9 * n) };
  { const fo = f.oron || [0, 0], po = p.oron || [0, 0]; p = { ...p, oron: po.map((o, i) => kl(o + fo[i], -ORA_MAX, ORA_MAX) - fo[i]) }; }   // öronen högst ±13°
  if (skugg) skugga(x, fot, 150 * s / 0.5);
  $('figurer').appendChild(G); G.querySelectorAll('.remmar').forEach(e => e.style.display = iSatet() || e.classList.contains(CUR?.id === '3b' ? 'liten' : 'stor') ? 'none' : '');
  G.setAttribute('transform', `translate(${f1(x)} ${f1(fot - lyft)}) scale(${s}) translate(-512 ${-L.FOTTER})`);
  L.rita(G, BLINKA(f, TT), P(p));
  if (medNalle) {   // nallen i vänstra tassen: tassens spets (uppmätt för armar[0] −124 med fram) ligger framför nallens sida
    const lu = ((f.luta || 0) + (p.luta || 0) + 2 * (p.rikt || 0)) * Math.PI / 180, h = 293 * s, px = x - 186 * s + Math.sin(lu) * h, py = fot - lyft - Math.cos(lu) * h;
    nalle(px + 80 * s, py + 12 * s, 0.368 * s, nalleV + (p.luta || 0) * 0.6);
    lagg('saker', `<ellipse cx="${f1(px + 6 * s)}" cy="${f1(py)}" rx="${f1(30 * s)}" ry="${f1(25 * s)}" transform="rotate(-20 ${f1(px)} ${f1(py)})" fill="#cdc5b0" stroke="#2d2a25" stroke-width="${f1(3 * s)}"/>`); }
