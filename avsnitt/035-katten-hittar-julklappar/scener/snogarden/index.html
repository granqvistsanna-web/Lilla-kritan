    <clipPath id="spadblad"><rect x="0" y="850" width="1024" height="600"/></clipPath>

<script type="module">
import { RADER, ROST, L as LANGD, GRAV, PAKET, TRE } from '/avsnitt/035-katten-hittar-julklappar/storyboard/rader.mjs';
const $ = id => document.getElementById(id);
const A = '/assets/', R_ = A + 'rekvisita/';
const PLATTA = A + 'bakgrunder/bjorkdungen/bjorkdungen-platt-bla.jpeg';   // blå björkdungen (Sanna 2026-11-22: "more bold blue bg", "maybe the one with björk"); förut snogarden/snogarden.jpeg
const KRITA = '/avsnitt/035-katten-hittar-julklappar/scener/_bilder/krita-rod-tunn.png', KRITA_SPETS = [742, 132];
KRITAN.BILD = KRITA;   // samma krita (tunn kant) i introt som i scenen
const LUVA = R_ + 'tomteluva/cut/tomteluva.png', LUVA_O = [450, 845];
const PULKA = R_ + 'pulka/cut/pulka.png', PULKA_O = [512, 392], PK = 0.42;
// Ritintrot: kritan ritar paketet (J06 22/11: "draw julklapp istället för katt"), det gröna med röd rosett (paket 1). Bildens botten (y 939) på y 870.
const PAK_PS = 0.7, PAK_X = 960 - 512 * PAK_PS, PAK_Y = 870 - 939 * PAK_PS, HAL = [960, 600];
const pakTill = ([x, y]) => [PAK_X + x * PAK_PS, PAK_Y + y * PAK_PS];
// tre olika paket med rosetten i bilden (Sanna 2026-11-14: "generate 3 new packages with bows", "a round, wide, tall", mönstrat papper):
// o = bottenmitten i bildens px, h = lådans höjd under rosetten (så djupt sjunker den i snön)
const PAKETB = [
  { bild: R_ + 'paket/cut/paket-hog.png', o: [512, 906], h: 756 },    // trappan: "Något rött i snön" (den röda rosetten)
  { bild: R_ + 'paket/cut/paket-bred.png', o: [512, 902], h: 633 },   // under granen
  { bild: R_ + 'paket/cut/paket-rund.png', o: [511, 904], h: 654 }];  // bakom katten: bara den guldgula rosetten syns
// småsaker i förgrunden (Sanna 2026-11-14: "add some small things to fg"): snötussar, en julkula, en pepparkaksstjärna och en grankvist
// i snön längst ner; [bild, x, y (fotpunkt i scenen), skala, vridning, bildens botten-px, bildens mitt-x]
// J06 2026-11-22: julkulan, pepparkaksstjärnan, grankvisten och den gula stjärnan bort ("remove pepparkak", "odd julpynt laying around"); snötussarna kvar
const FG = [['snotuss/cut/snotuss.png', 150, 1050, 0.13, 0, 804], ['snotuss/cut/snotuss.png', 1790, 1062, 0.11, 0, 804], ['snotuss/cut/snotuss.png', 640, 1068, 0.07, 0, 804]]
  .map(([f, x, y, k, r, oy]) => ({ bild: R_ + f, x, y, k, r, oy }));
const ROSETT = R_ + 'rosett/cut/rosett.png', ROSETT_O = [512, 815];
// spaden (J06 22/11: "better digging animation", "maybe cat needs a spade?"): rekvisita/spade, bladet i guld (hueRotate) så att det
// inte blir en till röd sak i snön. G = greppet (D-handtaget), SPETS = bladets spets, i bildens px.
const SPADE = R_ + 'spade/cut/spade.png', SPADE_WH = [1024, 1371], SPADE_G = [512, 160], SPADE_SPETS = [512, 1265], SPADE_K = 0.16;
// tassens mitt i armbilden (figurens 1024-ruta), där handtaget sitter
const HAND = { l: [152, 624], r: [867, 624] };
const FLINGA = R_ + 'snoflinga/cut/snoflinga.png';
const lagg = (id, h) => $(id).insertAdjacentHTML('beforeend', h);
const kl = (k, a = 0, b = 1) => Math.max(a, Math.min(b, k)), lerp = (a, b, k) => a + (b - a) * k;
const mjuk = k => (k = kl(k), k * k * (3 - 2 * k)), del = (a, b, t) => mjuk((t - a) / (b - a));
const bump = (a, b, t) => (t <= a || t >= b) ? 0 : Math.sin(Math.PI * (t - a) / (b - a));
const f1 = v => v.toFixed(1);
let KONT = {};

// --- Mått i scenen (1920 × 1080). Plattan 2752 × 1536 skalas 0,703 och beskärs 7,5 px på var sida (bakgrunder/snogarden.md) ---
const GOLV = 880, GS = 0.46;   // större katt (Sanna 2026-11-22, var 0,38)
const C_MITT = 1000, C_TRAPPA = 470, C_GRAN = 1540,   // björkarna till vänster, fågelholken till höger (förut trappan 790, granen 1430)
  C_P3 = 1390, C_DRAG = 1600;   // J06 22/11: paket 3 längre bort från katten, katten går dit och gräver
const P_X = [310, 1700, 1250], P_K = [0.14, 0.12, 0.13], P_Y = GOLV + 10;           // paketen: trappan, granen, bakom katten
const PULKA_X = 900, PULKA_DRAG = 250;
// platserna på pulkans sits (sitsen y 826, x 735–987): stora till vänster, mellan till höger, lilla ovanpå
const SITS = [[805, 828], [905, 828], [855, 828 - 82]];
const LUVA_SNO = [690, GOLV + 12], LUVA_K = 0.17, LUVA_VANT = [520, GOLV - 230];   // kritans väntplats vänster om luvan, bort från kattens ansikte; ut uppåt vänster
const iFig = ([x, fot], [px, py], s = GS) => [x + (px - 512) * s, fot + (py - L.FOTTER) * s];
const K_HEL = [1, 960, 540], K_HALV = x => [1.6, x, 700], K_NARA = x => [2.4, x, 700], K_SPAR = [2.2, 1400, 850],
  K_LUVA = [2.2, 760, 790], K_VANSTER = [2.0, 480, 700], K_HOGER = [2.0, 1620, 700], K_ROSETT = [2.0, 1080, 712], K_PULKA = [1.8, 1010, 760];
const kamMix = (a, b, k) => k < 0.5 ? a : b;

let L, G, KAM = K_HEL, BLINKA, LUVA_PA = [512, 300];
function kamera([z, cx, cy]) {
  const tx = Math.max(1920 - 1920 * z, Math.min(0, 960 - cx * z)), ty = Math.max(1080 - 1080 * z, Math.min(0, 540 - cy * z));
  KAM = [z, tx, ty];
  $('kamera').setAttribute('transform', `translate(${tx.toFixed(2)} ${ty.toFixed(2)}) scale(${z.toFixed(4)})`);
  $('brus').nextElementSibling.setAttribute('scale', (2.5 / z).toFixed(2));   // line boil 2,5 px i bild (CLAUDE.md)
}
const skarm = ([x, y]) => [KAM[1] + x * KAM[0], KAM[2] + y * KAM[0]];

// --- Platserna ----------------------------------------------------------------------------------------------------------------
const papper = () => { $('platta').innerHTML = `<rect x="-200" y="-200" width="2400" height="1500" fill="#FBF7EE"/><rect x="-200" y="-200" width="2400" height="1500" filter="url(#korn)"/>`; };
const skugga = (x, y, rx) => lagg('bak', `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(rx)}" ry="${f1(rx * 0.12)}" fill="#3a5a7a" opacity="0.08"/>`);
function gard() { $('platta').innerHTML = `<image href="${PLATTA}" x="-7.5" width="1935" height="1080" preserveAspectRatio="none"/>`; }
// fallande snö i kod: fasta flingor, lugnt, lite drift (ingen slump som byter bild)
const slump = x => { const v = Math.sin(x * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); };
function snofall(t, z) {
  let h = ''; const e = 1 / Math.sqrt(z);
  for (let i = 0; i < 70; i++) { const r = k => slump(i * 7.3 + k * 1.9), v = 26 + 24 * r(3);
    const y = ((t * v + r(4) * 1200) % 1200) - 60, x = r(1) * 2000 - 40 + 26 * Math.sin(t * (0.4 + 0.3 * r(5)) + r(2) * 6);
    h += `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1((2.6 + 3.2 * r(6)) * e)}" fill="#fff" opacity="${(0.65 + 0.3 * r(7)).toFixed(2)}"/>`; }
  lagg('sno', h);
}

// --- Kattens gång och tassavtryck ------------------------------------------------------------------------------------------------
// Gångarna: rad, start och slut i raden, från x, till x. Avtrycken ligger kvar där katten gått (ett per steg, 46 px isär).
const GANGAR = [['1', 0, 2.6, 2050, C_MITT], ['15b', 0.2, 2.8, C_MITT, C_TRAPPA], ['16b', 0.7, 3.5, C_TRAPPA, C_GRAN],
  ['18', 0, 2.3, C_GRAN, C_MITT], ['21', 0.1, 1.2, C_MITT, C_P3], ['26', 0.6, 0.6 + 2.4, C_P3, C_DRAG]];
const STEG = 46;
function gangX(id, tl) { const g = GANGAR.find(g => g[0] === id); if (!g) return null; const u = kl((tl - g[1]) / (g[2] - g[1]));
  return { x: lerp(g[3], g[4], u), dir: Math.sign(g[4] - g[3]), gar: u > 0 && u < 1, vag: Math.abs(g[4] - g[3]) * u }; }
function tassar(t) {
  let h = '';
  for (const [id, a, b, x0, x1] of GANGAR) { const r = R[id]; if (!r || t < r.s + a) continue;
    const u = kl((t - r.s - a) / (b - a)), n = Math.floor(Math.abs(x1 - x0) * u / STEG), dir = Math.sign(x1 - x0);
    for (let k = 1; k <= n; k++) { const x = x0 + dir * k * STEG, y = GOLV + 4 + (k % 2 ? -5 : 6);
      if (x > 1940) continue;
      h += `<g opacity="0.55" fill="#a9bfd6"><ellipse cx="${f1(x)}" cy="${f1(y)}" rx="9" ry="4.2"/>${[-6, 0, 6].map(d => `<circle cx="${f1(x + d)}" cy="${f1(y - 6)}" r="2.4"/>`).join('')}</g>`; } }
  lagg('bak', h);
}
// en lugn trippgång: benen lyfts i tur och ordning, kroppen gungar lite, armarna svänger (riggens gang)
function trippa(p, vag, dir) {
  const ph = vag / STEG * Math.PI, s = Math.sin(ph);
  return { ...p, rikt: dir, gang: 1, sving: s, benY: [-14 * Math.max(0, s), -14 * Math.max(0, -s)], lyft: -4 * Math.abs(s), svans: 9 * Math.sin(ph - 0.7) };   // svansen släpar efter stegen (J06 0:26 "polish cat tail")
}

// --- Kritlinjer -----------------------------------------------------------------------------------------------------------------
const mitt2 = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], P2 = p => f1(p[0]) + ' ' + f1(p[1]);
function mjukD(pts) {
  const n = pts.length, sluten = Math.hypot(pts[0][0] - pts[n - 1][0], pts[0][1] - pts[n - 1][1]) < 2;
  if (sluten) { const Q = pts.slice(0, -1), m = Q.length; return `M${P2(mitt2(Q[m - 1], Q[0]))}` + Q.map((p, i) => `Q${P2(p)} ${P2(mitt2(p, Q[(i + 1) % m]))}`).join(''); }
  return `M${P2(pts[0])}L${P2(mitt2(pts[0], pts[1]))}` + pts.slice(1, -1).map((p, i) => `Q${P2(p)} ${P2(mitt2(p, pts[i + 2]))}`).join('') + `L${P2(pts[n - 1])}`;
}
const BANOR = new Map();
function bana(nyckel, d) {
  if (!BANOR.has(nyckel)) { d ||= mjukD(nyckel); const el = document.createElementNS('http://www.w3.org/2000/svg', 'path'); el.setAttribute('d', d); $('gomda').appendChild(el); BANOR.set(nyckel, { d, el, L: el.getTotalLength() }); }
  return BANOR.get(nyckel);
}
const banPunkt = (b, f) => { const q = b.el.getPointAtLength(kl(f) * b.L); return [q.x, q.y]; };
const ritTakt = f => 0.5 * kl(f) + 0.5 * mjuk(f);

// --- Kritan --------------------------------------------------------------------------------------------------------------------
const kritaVanta = ([x, y], tw) => [[x + 3 * Math.sin(tw * 1.1), y + 5 * Math.sin(tw * 1.6)], 125 + 4 * Math.sin(tw * 1.3)];
let TT = 0;
function ritKrita(p, v = 125, redan = false) {
  if (!redan) krita(p, v);
  const z = KAM ? KAM[0] : 1, e = 1 / Math.sqrt(z); let h = '';
  for (let j = 0; j < 8; j++) { const b = Math.floor(TT * 14) - j, age = TT - b / 14, r = slump(b * 7.13), r2 = slump(b * 3.31 + 1.7), op = Math.max(0, 0.7 - age * 1.4);
    if (op > 0) h += `<circle cx="${f1(p[0] + (r - 0.5) * 26 * e)}" cy="${f1(p[1] + (6 + age * 55 + r2 * 8) * e)}" r="${f1((2 + 2.5 * r2) * e)}" fill="#D9503F" opacity="${op.toFixed(2)}"/>`; }
  for (let j = 0; j < 3; j++) { const b = Math.floor(TT * 3) - j, age = TT - b / 3, r = slump(b * 5.7 + 2), r2 = slump(b * 9.1 + 4), k = bump(0, 0.9, age);
    if (k <= 0) continue; const x = p[0] + (r - 0.5) * 70 * e, y = p[1] - (14 + 26 * r2 + 18 * age) * e, R = (7 + 4 * r2) * e * k;
    h += `<path d="M${f1(x)} ${f1(y - R)} Q${f1(x)} ${f1(y)} ${f1(x + R)} ${f1(y)} Q${f1(x)} ${f1(y)} ${f1(x)} ${f1(y + R)} Q${f1(x)} ${f1(y)} ${f1(x - R)} ${f1(y)} Q${f1(x)} ${f1(y)} ${f1(x)} ${f1(y - R)}Z" fill="#FFF3B8" stroke="#fff" stroke-width="${f1(2.2 * e)}" paint-order="stroke" opacity="${(0.9 * k).toFixed(2)}"/>`; }
  lagg('krita', h);
}
const krita = ([x, y], v = 125, s = 0.33 * (KAM && KAM[0] > 1.5 ? 0.7 : 1)) =>
  lagg('krita', `<image href="${KRITA}" width="755" height="265" transform="translate(${f1(x)} ${f1(y)}) rotate(${v}) scale(${s}) translate(${-KRITA_SPETS[0]} ${-KRITA_SPETS[1]})"/>`);

// --- Saker som kritan ritar: luvan och pulkan (konturen ur <sak>-kontur.json, ett drag) -------------------------------------
// sak = { bild, w, h, o, kontur }. pos = originets plats i scenen, k = skala. ritad 0–1 konturen, fyll 0–1 bilden inifrån.
const SAK = { luva: { bild: LUVA, w: 1024, h: 1024, o: LUVA_O, fc: [470, 520], fr: 600 }, pulka: { bild: PULKA, w: 1024, h: 572, o: PULKA_O, fc: [520, 280], fr: 520 } };
function sakRitad(namn, [x, y], k, { ritad = 1, fyll = 1, r = 0, lager = 'saker' } = {}) {
  const S = SAK[namn], t = `translate(${f1(x)} ${f1(y)}) rotate(${r.toFixed(2)}) scale(${k.toFixed(4)}) translate(${-S.o[0]} ${-S.o[1]})`;
  let spets = null;
  if (fyll < 1 && ritad > 0) { const b = bana(namn, KONT[namn].d), f = ritTakt(ritad);
    lagg('fram', `<g filter="url(#vax)"><g transform="${t}"><path d="${b.d}" pathLength="1" fill="none" stroke="${namn === 'luva' ? '#6e1e16' : '#5a3418'}" stroke-width="${f1(10 / k)}" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="${f.toFixed(4)} 2"/></g></g>`);
    if (ritad < 1) { const [px, py] = banPunkt(b, f); spets = [x + (px - S.o[0]) * k, y + (py - S.o[1]) * k]; } }
  if (fyll > 0) { const c = $('cirkel-sak'); c.setAttribute('cx', S.fc[0]); c.setAttribute('cy', S.fc[1]); c.setAttribute('r', fyll >= 1 ? 3000 : S.fr * fyll);
    lagg(lager, `<g transform="${t}" ${fyll < 1 ? 'clip-path="url(#fyll-sak)"' : ''}><image href="${S.bild}" width="${S.w}" height="${S.h}"/></g>`); }
  return spets;
}
const luvaBild = () => `<g transform="scale(${(LUVA_K / GS).toFixed(4)}) rotate(-8) translate(${-LUVA_O[0]} ${-LUVA_O[1]})"><image href="${LUVA}" width="1024" height="1024"/></g>`;

// --- Paketen ---------------------------------------------------------------------------------------------------------------------
// ett paket: bottenmittens plats, skala, vridning; rosett på det lilla. sank px under snön (klipps vid snökanten).
function paketSvg([x, y], k, r = 0, i = 0) {
  const P = i.bild ? i : PAKETB[i];
  return `<g transform="translate(${f1(x)} ${f1(y)}) rotate(${r.toFixed(2)}) scale(${k.toFixed(4)}) translate(${-P.o[0]} ${-P.o[1]})"><image href="${P.bild}" width="1024" height="1024"/></g>`;
}
// Paketens läge vid tiden t: [{ syns, pos, k, r, sank, rosett }]. Tiderna ur raderna (gömt → upp → på snön → hopp → pulkan).
const UPP_D = 1.3;   // sekunder som ett paket glider upp ur snön
function paketen(t) {
  const ut = [];
  const pulkaDx = pulkaDrag(t);
  const sitt = (i, t0) => { const u = del(t0, t0 + 0.55, t), fr = [P_X[i], P_Y], til = [SITS[i][0] + pulkaDx, SITS[i][1]];
    return { pos: [lerp(fr[0], til[0], u), lerp(fr[1], til[1], u) - 90 * Math.sin(Math.PI * u)], r: 0, sank: 0 }; };
  // J06 22/11 "not pop up but fade up": paketen glider lugnt upp ur snön på UPP_D s (förr 0,6 s) och är uppe på "ett paket!"
  const F = UPP_D - 0.35 - 0.25;
