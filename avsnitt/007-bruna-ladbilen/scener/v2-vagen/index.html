<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>007 v2 – vägen</title>
<style>
  html, body { margin:0; background:#FBF7EE; overflow:hidden; }
  svg { width:100vw; height:100vh; display:block; }
</style>
</head>
<body>
<!-- Avsnitt 007 v2 (v2/storyboard-forslag.md), sångens hela instrumentala intro 0:00–0:30 (Sanna 2026-11-09: "dont cut out instrumental
     parts", sången börjar först efter kritan ritar). Renderas alltid med --v2. Scentid = sångtid.
     Kritan-ritars teckning tonas över i lastbilen, tut-tut. Grodan kör och tänker på sakerna i sången: fyra tankebubblor poppar upp en i
     taget (chokladbiten, chokladträdet, kolasåsen, rutschkanan). Närbild: grodan slickar sig om munnen. Minidramat: ett gupp, nallen
     ramlar av flaket, "oj då" (ohoh), lastbilen stannar, grodan blir ledsen. Ludde och Igge kommer gående, hjälper till och kastar upp
     nallen på flaket, och hoppar själva upp. Lastbilen kör vidare, grodan blundar och drömmer: prickar, molnet med en liten rutschkana,
     molnet sväller och molnövergången i sammansättningen tar oss in i chokladlandet på "Brunt, brunt, brunt". -->
<script src="../kit.js"></script><script src="../../../../verktyg/kant.js"></script><script src="../ansikten.js"></script>
<script src="../v2-riggar.js"></script><script src="../v2.js"></script><script src="../lastbilen.js"></script><script src="../rutschbana.js"></script>
<script>
(async () => {
const { el, bild, lerp, mjuk, inUt, over, del, clamp, blink, W, H, BEAT, BEAT0, ROT } = kit;
const M = await kit.manus();
const [a0, a1] = M.bild('v2-vagen'), SLUT = a1 - a0, K0 = a0 - M.av;     // K0: sångtid vid scenens t = 0 (0)
const fas = t => (t + K0 - BEAT0) / BEAT, tk = t => kit.takt(t + K0) - K0;
const V = 120, bump = k => Math.sin(clamp(k) * Math.PI) ** 2;
const ev = (t, a, b, r = 0.25) => mjuk(del(a, a + r, t)) * (1 - mjuk(del(b - r, b, t)));
const pop = u => u <= 0 ? 0 : 1 - Math.exp(-7 * u) * Math.cos(16 * u);   // klistermärkes-pop med översväng
const KANT = { r: [600, 760], l: [420, 760] }, arm = (s, mal, q) => [lerp(KANT[s][0], mal[0], q), lerp(KANT[s][1], mal[1], q)];

// ---------- tiderna ----------
// Sanna 2026-11-09 (runda 3): vägen räcker till "Tänk om" (sångtid 0:39). Introt: tut, vinkar till oss, närbild, minidramat och alla
// fyra kör vidare. Sedan på orden: en tankebubbla på varje "brunt" (0:30), slicket på "mums, mums, mums" (0:32), drömmen på
// "Brunt är den godaste färgen" (0:34) och molnet sväller in i chokladlandet på "Tänk om".
const T = { TUT: [tk(0.3), tk(0.3) + BEAT], GLID: [1.2, 3.4], VINK: [tk(4.6), tk(7.4)], NAR0: [tk(8.2), tk(11.6)], OJ: tk(12.6),
  BUBB: [30.0, 30.67, 31.33], BUBB_UT: 31.95, NAR: [32.0, 33.95], LICK: [32.05, 33.8] };
T.LANDN = T.OJ + 0.85;                 // nallen landar på vägen
T.STOPP = T.OJ + 1.4;                  // lastbilen har stannat
T.NAR2 = [T.OJ + 1.2, T.OJ + 2.8];     // närbild: grodan ser ledsen ut
T.IN = [T.OJ + 2.4, T.OJ + 4.6];       // Ludde och Igge kommer gående
T.NAR3 = [T.OJ + 4.6, T.OJ + 5.7];     // närbild på kompisarna vid nallen
T.KAST = T.OJ + 5.9; T.KAST_IN = T.KAST + 0.9;          // nallen kastas upp på flaket
T.HOPP = { L: T.KAST + 1.3, I: T.KAST + 1.9 }, T.HOPP_LUFT = 0.6;
T.GO = T.HOPP.I + 0.8;                 // kör igen
T.NAR4 = [T.GO + 1.8, T.GO + 5.6];     // närbild på flaket: alla fyra åker ihop
T.DROM = tk(34.0); T.MOLN = T.DROM + 0.9; T.AK = tk(35.8); T.LANDA = T.AK + 1.1; T.SVALL = [37.6, SLUT];
T.BLINK = [1.6, 7.9, 16.2, 23.4, 27.2, 29.4];
T.PUFF = [...lastbilen.puffTider(0.4, T.OJ, []), ...lastbilen.puffTider(T.GO, T.DROM, [])];

const L = kit.duk(kit.VAG_PLATTA);
const vag = kit.vag(L.plate);
const bil = await lastbilen.ny(L.figurer, M);
const tona = bild(new URL('../vagen-1/kritan-slut.jpg', location.href).href, kit.lager.overst.parentNode, { width: W, height: H, preserveAspectRatio: 'none' });

// kompisarna och nallen på vägen: bakom lastbilen, så att flakets sida döljer benen när de står i flaket
const vanner = el('g', {}, L.figurer); L.figurer.insertBefore(vanner, bil.g);
const ludde = await v2.figur('lammet-ludde', vanner, { h: 240, ben: true });
const igge = await v2.figur('igelkotten-igge', vanner, { h: 180, ben: true });
const nalleG = el('g', { style: 'display:none' }, L.figurer); L.figurer.insertBefore(nalleG, bil.g);
const nInre = el('g', { transform: `translate(-424 -856)` }, nalleG);
bild(lastbilen.NALLE, nInre, { width: 848, height: 856 });
const nAnsikte = lastbilen.nalleAnsikte(nInre);
const tunga = el('g', { style: 'display:none' }, L.figurer);   // tungan när grodan slickar sig om munnen (över lastbilen)
const TUNGA = ['#2a1d1a', '#e8737f', '#b94a57'].map(c => el('path', { fill: 'none', stroke: c, 'stroke-linecap': 'round' }, tunga));

// ---------- tankebubblorna: sakerna som sjungs om ----------
const tanke = el('g', {}, kit.lager.overst);   // över vägkantens svampar
const A = `${ROT}assets/rekvisita/`;
const SAKER = [
  g => { const b = el('g', { transform: 'rotate(-8)' }, g);   // chokladbiten
    el('rect', { x: -40, y: -32, width: 80, height: 64, rx: 12, fill: '#8B5A34', stroke: '#fff', 'stroke-width': 5 }, b);
    el('path', { d: 'M-13 -32 V32 M13 -32 V32 M-40 0 H40', stroke: '#5E3A20', 'stroke-width': 4 }, b); },
  g => bild(`${A}chokladtrad/cut/chokladtrad.png`, g, { x: -50, y: -66, width: 98, height: 132 }),
  g => bild(`${A}kolasas/cut/plask-v2-a.png`, g, { x: -58, y: -58, width: 116, height: 116 }),
];
const BUBB_XY = [[380, 118], [660, 96], [940, 116]];   // bubblornas mitt i bild, i en båge över lastbilen
const bubblor = SAKER.map(rita => {
  const g = el('g', { style: 'display:none' }, tanke);
  const prick = [0, 1].map(() => el('circle', { fill: '#fff', stroke: '#e6dccd', 'stroke-width': 3 }, tanke));
  el('circle', { r: 78, fill: '#fff', stroke: '#e6dccd', 'stroke-width': 7 }, g);
  rita(el('g', {}, g));
  return { g, prick };
});

// ---------- drömmolnet med en liten rutschbana i ----------
const MOLN = [[-150, 10, 95], [-60, -55, 110], [60, -60, 115], [155, 5, 95], [70, 60, 100], [-60, 60, 100]], RB = [800, 400, 0.32];
const prickar = [0, 1, 2].map(() => el('circle', { fill: '#fff', stroke: '#e6dccd', 'stroke-width': 4 }, tanke));
const moln = el('g', {}, tanke);
[['#e6dccd', 9], ['#fff', 0]].forEach(([fill, ext]) => MOLN.forEach(([x, y, r]) => el('circle', { cx: x, cy: y, r: r + ext / 2, fill }, moln)));
const klipp = el('clipPath', { id: 'molnklipp' }, document.querySelector('svg defs'));
MOLN.forEach(([x, y, r]) => el('circle', { cx: x, cy: y, r: r - 4 }, klipp));
const drom = el('g', { 'clip-path': 'url(#molnklipp)' }, tanke);
const inne = el('g', { transform: `scale(${RB[2]}) translate(${-RB[0]} ${-RB[1]})` }, drom);
el('rect', { x: -400, y: -400, width: W + 800, height: 1068, fill: '#F6E7C8' }, inne);
el('rect', { x: -400, y: 668, width: W + 800, height: 400, fill: '#E8A63A', filter: 'url(#kolakorn)' }, inne);
const mini = await rutschbana.ny(L, { bara: true, kronor: 1, havX: 420 });
inne.append(mini.strand, mini.fg);

const BIL = { x: M.matt.BIL.x, y: M.matt.BIL.gv, h: M.matt.BIL.h }, MITT = { x: W / 2, y: H / 2 + BIL.h / 2, h: BIL.h };
const DX = 320;   // så långt lastbilen rullar fram när den bromsar (kameran står still)
bil.pose(BIL);
const s = BIL.h / (bil.BB[3] - bil.BB[1]), hh = 700 * M.matt.BULLE[0] * s, [ex, ey] = bil.punkt([511, 400]);
const kamNar = (dx = 0) => [ex - 45 + dx, ey + hh * 0.3, 0.8 * H / hh];   // närbild på grodan (som vagen-1 03b)
const MOLN_XY = [0.72 * W, 0.3 * H + 30];
const VAG_Y = 700, NALLE_H = 0.8 * BIL.h / (bil.BB[3] - bil.BB[1]) * bil.NALLE_H;   // nallen i samma storlek som på flaket
const X = { L: 110, I: 300 }, NX = 205, FLAK = { L: [255, 505], I: [385, 515] };   // FLAK: fötterna i flaket (lastbilens ruta), sidan döljer magen   // kompisarnas platser på vägen och i flaket (lastbilens ruta)

// vägen: kameran följer lastbilen tills guppet, står still medan den bromsar, följer igen när den kör
const rull = t => { const a = Math.min(t, T.OJ) * V; if (t <= T.GO) return a; const u = t - T.GO; return a + V * (u < 1 ? u ** 3 - u ** 4 / 2 : u - 0.5); };
const framat = t => DX * (1 - (1 - clamp((t - T.OJ) / 1.4)) ** 2) * (1 - inUt(del(T.GO, T.GO + 2.4, t)));   // lastbilen rullar fram och sedan tillbaka

// ---------- ljud (lågt, sången är instrumental här) ----------
T.TUT.forEach(x => kit.ljud('tuta-tut', x - 0.02, { vol: 0.35, langd: 0.9, fade: 0.2 }));
kit.ljud('brum', 0, { loop: true, langd: T.OJ + 1.2, vol: 0.15, fade: 0.8 }); kit.ljud('brum', T.GO, { loop: true, langd: T.SVALL[0] - T.GO, vol: 0.15, fade: 0.8 });
T.BUBB.forEach(x => kit.ljud('plupp', x, { vol: 0.25 })); [0, 1, 2].forEach(i => kit.ljud('pop', T.BUBB_UT + 0.15 * i, { vol: 0.12 }));
[0, 1, 2].forEach(i => kit.ljud('slurp', T.LICK[0] + 0.1 + i * (T.LICK[1] - T.LICK[0]) / 3, { vol: 0.18 }));   // sången sjunger "mums"
kit.ljud('jippi', T.VINK[0] + 0.2, { vol: 0.15 });
kit.ljud('duns', T.OJ, { vol: 0.35 }); kit.ljud('hjul-gnissel', T.OJ + 0.15, { vol: 0.25 }); kit.ljud('duns', T.LANDN, { vol: 0.25 });
kit.ljud('ohoh', T.LANDN + 0.25, { vol: 0.45 });
[0, 0.42, 0.84, 1.26, 1.68].forEach(d => kit.ljud('steg', T.IN[0] + 0.3 + d, { vol: 0.15 }));
kit.ljud('hupp', T.KAST - 0.05, { vol: 0.3 }); kit.ljud('swoosh', T.KAST, { vol: 0.2 }); kit.ljud('pop', T.KAST_IN, { vol: 0.3 }); kit.ljud('jippi', T.KAST_IN + 0.15, { vol: 0.25 });
Object.values(T.HOPP).forEach(a => { kit.ljud('hopp-mjuk', a, { vol: 0.3 }); kit.ljud('landa-mjuk', a + T.HOPP_LUFT, { vol: 0.3 }); });
kit.ljud('tuta-tut', T.GO - 0.1, { vol: 0.3, langd: 0.9, fade: 0.2 });
[0.2, 0.42, 0.64].forEach(d => kit.ljud('plupp', T.DROM + 0.3 + d, { vol: 0.15 }));
kit.ljud('glimt', T.MOLN, { vol: 0.25 });
kit.ljud('swoosh', T.AK + 0.2, { vol: 0.2 }); kit.ljud('plask', T.LANDA, { vol: 0.3 });
kit.ljud('glitter', T.SVALL[0], { vol: 0.25 });
lastbilen.ljud(T.TUT);

// arkets hopp (som v2-landet): huk, sträckt i luften, landningen trycker ihop
function arkHopp(t, a, air, h, huk = 0.14) {
  if (t < a - huk || t > a + air + huk) return null;
  const tryck = q => ({ y: 0, l: 0, p2: { strack: -0.12 * q, bred: 0.1 * q }, arm: -12 * q });
  if (t < a) return tryck(Math.sin(Math.PI * (t - a + huk) / huk));
  if (t > a + air) return tryck(Math.sin(Math.PI * (t - a - air) / huk));
  const l = (t - a) / air, w = Math.sin(Math.PI * l);
  return { y: -4 * h * l * (1 - l), l, p2: { strack: 0.08 * w, bred: -0.06 * w, benY: [-30 * w, -30 * w] }, arm: 32 * w };
}

// Ludde och Igge: borta, går in, står vid nallen, kastar, hoppar upp i flaket och åker med
function van(t, vem, f, fas0) {
  if (t < T.IN[0] + (vem === 'I' ? 0.35 : 0)) { f.pose({ synlig: false }); return; }
  const o = { humor: 'glad', blink: blink(t, [T.IN[0] + 1.7 + fas0, T.KAST + 2.6 + fas0, T.DROM + 1 + fas0, T.DROM + 4 + fas0]) }, p2 = {};
  const in0 = T.IN[0] + (vem === 'I' ? 0.35 : 0), k = del(in0, T.IN[1], t), ha = T.HOPP[vem];
  let x = lerp(-160, X[vem], inUt(k)), y = VAG_Y;
  if (k < 1) { Object.assign(p2, v2.steg(t, Math.sin(Math.PI * k) * 0.9 + 0.1 * (1 - k), 1)); o.humor = 'nyfiken'; o.tittY = 0.3; }
  else if (t < T.KAST + 0.8) { o.humor = t < T.KAST - 0.9 ? 'nyfiken' : 'skrattar'; o.titt = vem === 'L' ? 0.7 : -0.7; o.tittY = 0.6 * ev(t, T.IN[1], T.KAST - 0.4); }
  else o.humor = 'skrattar';
  const kast = arkHopp(t, T.KAST, 0.3, 14, 0.16);   // båda hoppar till och kastar upp nallen
  if (kast) { y += kast.y; Object.assign(p2, kast.p2); p2.armar = [60 + kast.arm, 60 + kast.arm]; }
  if (t >= ha - 0.16) {   // hoppar upp i flaket och står kvar där
    const mal = bil.iBild(FLAK[vem]), h = arkHopp(t, ha, T.HOPP_LUFT, 60);
    if (t < ha) { if (h) Object.assign(p2, h.p2); }
    else if (t <= ha + T.HOPP_LUFT) { const l = h.l; x = lerp(X[vem], mal[0], inUt(l)); y = lerp(VAG_Y, mal[1], l) - 4 * 90 * l * (1 - l); Object.assign(p2, h.p2); p2.armar = [h.arm, h.arm]; }
    else { [x, y] = mal; if (h) Object.assign(p2, h.p2); }
  }
  const iBil = t >= ha - 0.16, par = iBil ? bil.flak : vanner;   // i flaket: i lastbilens passagerarlager (lastbilen.js b.flak)
  if (f.g.parentNode !== par) par.appendChild(f.g);
  if (t > ha + T.HOPP_LUFT + 0.3 && t > T.GO) y -= 4 * Math.abs(Math.sin(Math.PI * (fas(t) + fas0) / 2));   // guppar i takten
  if (t > T.GO + 0.4) {   // tittar på grodan, upp mot bubblorna och drömmen; skrattar i närbilden
    const i = Math.max(0, T.BUBB.filter(a => t >= a).length - 1);
    o.titt = t >= T.BUBB[0] - 0.3 && t < T.NAR[0] ? clamp((BUBB_XY[i][0] - x) / 300, -0.9, 0.9) : 0.6;
    o.tittY = t >= T.BUBB[0] - 0.3 ? -0.7 : 0;
    if (t >= T.NAR4[0] && t < T.NAR4[1]) { o.titt = vem === 'L' ? 0.5 : -0.3; o.tittY = 0; }
  }
  if (Object.keys(p2).length) o.pose2 = p2;
  f.pose({ x, y, ...o });
}

function render(t) {
  tona.setAttribute('opacity', (1 - mjuk(del(0, 0.6, t))).toFixed(3));
  const d = rull(t), fram = framat(t);
  vag.rulla(d, t);
  const f = fas(t), lugn = mjuk(del(0, 0.8, t)), kor = t < T.OJ || t > T.GO, drommer = t >= T.DROM;
  const hopp = T.TUT.reduce((a, x) => a + kit.hopp(t, x, x + 0.25, 8, 0.06, 0.12).y, 0) + kit.hopp(t, T.OJ, T.OJ + 0.32, 18, 0.05, 0.16).y;
  const g = inUt(del(...T.GLID, t)), bas = { x: lerp(MITT.x, BIL.x, g) + fram, y: lerp(MITT.y, BIL.y, g) };
  const gung = kor ? 1 : 0.15;   // gungar i takten när den kör, nästan stilla när den står
  let b;
  const tank = t >= T.BUBB[0] - 0.3 && t < T.NAR[0], narBil = t >= T.NAR4[0] && t < T.NAR4[1];
  if (t < T.OJ) {   // kör, tutar, vinkar till oss och nickar i takt i närbilden
    const tryck = T.TUT.reduce((m, x) => Math.max(m, bump(del(x - 0.05, x + 0.3, t))), 0), upp = lastbilen.armUpp(t, T.VINK[0], T.VINK[1]);
    const oss = upp > 0.05 || (t >= T.NAR0[0] && t < T.NAR0[1]);
    b = { humor: tryck > 0.3 || upp > 0.3 || oss ? 'skrattar' : 'glad', tryck, tut: tryck, titt: oss ? 0 : 0.4, tittY: oss ? 0 : -0.1,
          l: upp > 0.05 ? arm('l', [-480, 160 - 170 * Math.sin((t - T.VINK[0]) * 11) * upp], upp) : undefined,   // vänstra armen: bakom kroppen, ut förbi kanten (huven skymmer högra)
          rot: 2.5 * Math.sin(Math.PI * f / 4) * lugn, lyft: (oss ? 7 : 4) * lugn * Math.abs(Math.sin(Math.PI * f / 2)) };
  } else if (t < T.KAST_IN + 0.1) {   // guppet, nallen ramlar av: förvånad, tittar bakåt, ledsen tills nallen är tillbaka
    const bak = mjuk(del(T.OJ + 0.25, T.OJ + 0.6, t));
    b = { humor: t < T.OJ + 0.25 ? 'skrattar' : t < T.OJ + 1.5 ? 'forvanad' : t < T.IN[0] + 0.8 ? 'ledsen' : 'nyfiken', titt: -0.9 * bak, tittY: 0.2 * bak,
          rot: (t < T.OJ + 1 ? 3 : 0.8) * Math.sin(Math.PI * f / 4) * gung };
  } else if (tank) {   // en tankebubbla på varje "brunt": tittar upp mot den som just poppat
    const i = Math.max(0, T.BUBB.filter(a => t >= a).length - 1);
    b = { humor: t - T.BUBB[i] < 0.5 && t >= T.BUBB[0] ? 'skrattar' : 'nyfiken', titt: clamp((BUBB_XY[i][0] - 600) / 300, -0.8, 0.9), tittY: -0.8,
          rot: 2.5 * Math.sin(Math.PI * f / 4), lyft: 4 * Math.abs(Math.sin(Math.PI * f / 2)) };
  } else if (t >= T.NAR[0] && t < T.NAR[1]) {   // närbild: slickar sig om munnen på "mums, mums, mums"
    const sl = t >= T.LICK[0] && t < T.LICK[1];
    b = { humor: sl ? 'mums' : 'skrattar', m: sl ? 0.55 : undefined, titt: 0, rot: 2 * Math.sin(Math.PI * f / 4), lyft: 3 * Math.abs(Math.sin(Math.PI * f / 2)) };
  } else if (!drommer) {   // nallen är tillbaka: armen upp, glad, kör igen; tittar bakåt på kompisarna i närbilden på flaket
    const upp = lastbilen.armUpp(t, T.KAST_IN + 0.1, T.GO + 0.4);
    b = { humor: 'skrattar', titt: t < T.GO || narBil ? -0.7 : 0.3, r: upp > 0.05 ? arm('r', [1450, -520], upp) : undefined,
          rot: 2.5 * Math.sin(Math.PI * f / 4) * gung, lyft: 4 * gung * Math.abs(Math.sin(Math.PI * f / 2)) };
  } else {   // blundar och drömmer, gungar sakta; hoppar till i sätet när han plaskar i drömmen
    const plask = bump(del(T.LANDA - 0.05, T.LANDA + 0.45, t));
    b = { humor: 'drommer', tittY: -0.3, rot: 3 * Math.sin(Math.PI * f / 4), lyft: 6 * plask };
  }
  b.blink = drommer ? 0 : blink(t, T.BLINK);
  b.nalle = lastbilen.nalleUttryck(t, { glad: [T.BUBB[3], T.KAST_IN + 0.3, T.LANDA], oj: [T.OJ] });
  const nalleUte = t >= T.OJ + 0.05 && t < T.KAST_IN, landNalle = bump(del(T.KAST_IN, T.KAST_IN + 0.3, t));
  bil.pose({ x: bas.x, y: bas.y - gung * lugn * 2.5 * (1 - Math.cos(Math.PI * f)) / 2 + hopp, h: BIL.h, tilt: gung * lugn * 0.6 * Math.sin(Math.PI * f / 4), dist: d + fram,
             kanin: -hopp * 0.5 + 3 * gung * lugn * Math.abs(Math.sin(Math.PI * f / 2)) - 14 * landNalle, styr: 0, flagg: 3 * Math.sin(Math.PI * f / 4), nalleBort: nalleUte, ...b });
  if (kor) bil.puffa(t, T.PUFF);

  // nallen utanför flaket: ramlar av i en båge bakåt, sitter på vägen, kastas upp igen
  nalleG.style.display = nalleUte ? '' : 'none';
  if (nalleUte) {
    const ns = NALLE_H / 856, start = bil.iBild(bil.NF);
    let x, y, rot = 0;
    if (t < T.LANDN) { const q = del(T.OJ, T.LANDN, t); x = lerp(start[0], NX, q); y = lerp(start[1], VAG_Y, q) - 4 * 230 * q * (1 - q); rot = -18 * Math.sin(Math.PI * q); /* högt upp ur flaket så att fallet syns (QA) */ }
    else if (t < T.KAST) { x = NX; y = VAG_Y; rot = -6 * bump(del(T.LANDN, T.LANDN + 0.4, t)); }
    else { const q = del(T.KAST, T.KAST_IN, t), mal = bil.iBild(bil.NF); x = lerp(NX, mal[0], q); y = lerp(VAG_Y, mal[1], q) - 4 * 170 * q * (1 - q); rot = 12 * Math.sin(Math.PI * q); }
    nalleG.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(1)}) scale(${ns.toFixed(4)})`);
    const ledsen = t > T.LANDN && t < T.KAST - 0.6;
    nAnsikte.satt(t < T.LANDN + 0.6 ? 'forvanad' : ledsen ? 'glad' : 'happy', { blink: 0, m: 0.5 });
  }
  van(t, 'L', ludde, 0); van(t, 'I', igge, 0.6);

  // tungan (Sanna 2026-11-09: "improve the licking around mouth animation"): sticker ut ur den öppna munnen, sveper längs överläppen
  // från ena mungipan till den andra och dras in igen, en gång per "mums" (varannan åt andra hållet). Ritas från munnen till spetsen.
  const n = 3, lk = del(...T.LICK, t) * n, slick = lk > 0 && lk < n;
  tunga.style.display = slick ? '' : 'none';
  if (slick) {
    const u = lk % 1, vag = Math.floor(lk) % 2 ? -1 : 1, ut = mjuk(clamp(u / 0.22)) * (1 - mjuk(clamp((u - 0.8) / 0.2)));
    const v = Math.PI * 1.5 + vag * 0.62 * Math.PI * (2 * mjuk(clamp((u - 0.12) / 0.76)) - 1);   // mungipan → överläppen → andra mungipan
    const MUN = [514, 392], R = 64 * ut, spets = [MUN[0] + 1.15 * R * Math.cos(v), MUN[1] + 10 + 0.5 * R * Math.sin(v)];
    const [ax, ay] = bil.punkt(MUN), [px, py] = bil.punkt(spets), [k0] = bil.punkt([0, 0]), [k1] = bil.punkt([100, 0]), sc = (k1 - k0) / 100;
    const [cx, cy] = bil.punkt([(MUN[0] + spets[0]) / 2 + 0.25 * (spets[0] - MUN[0]), (MUN[1] + spets[1]) / 2 - 10 * ut]);
    const d = `M${ax.toFixed(1)} ${(ay + 6 * sc).toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${px.toFixed(1)} ${py.toFixed(1)}`;
    [[38, 0], [29, 0], [5, 0.55]].forEach(([w, kort], i) => { TUNGA[i].setAttribute('d', d); TUNGA[i].setAttribute('stroke-width', (w * sc).toFixed(1));
      if (kort) { TUNGA[i].setAttribute('pathLength', 1); TUNGA[i].setAttribute('stroke-dasharray', `${kort} 1`); } });
  }

  bubblorRita(t);
  dromRita(t, bas);
  const [fx, fy] = bil.iBild([330, 250]);
  const kam = (t >= T.NAR[0] && t < T.NAR[1]) || (t >= T.NAR0[0] && t < T.NAR0[1]) ? kamNar() : narBil ? [fx, fy, 1.6] : t >= T.NAR2[0] && t < T.NAR2[1] ? kamNar(fram) : t >= T.NAR3[0] && t < T.NAR3[1] ? [200, 560, 1.7] : [W / 2, H / 2, 1];
  kit.kamera(...kam, false, true);
}

function bubblorRita(t) {
  const [hx, hy] = bil.punkt([511, 120]);
  bubblor.forEach(({ g, prick }, i) => {
    const a = T.BUBB[i], ut = Math.min(T.BUBB_UT + 0.1 * i, T.NAR[0] - 0.26), k = t < ut ? pop(t - a) : 1 - mjuk(del(ut, ut + 0.25, t)), syns = t >= a && k > 0.01;
    g.style.display = syns ? '' : 'none'; prick.forEach(c => (c.style.display = syns ? '' : 'none'));
    if (!syns) return;
    const [bx, by0] = BUBB_XY[i], gung = 6 * Math.sin(2 * Math.PI * (t - a) / 1.7 + i), by = by0 + gung;
    g.setAttribute('transform', `translate(${bx.toFixed(1)} ${by.toFixed(1)}) scale(${k.toFixed(3)})`);
    prick.forEach((c, j) => { const q = 0.35 + 0.3 * j; c.setAttribute('cx', lerp(hx, bx, 1 - q)); c.setAttribute('cy', lerp(hy, by + 60, 1 - q)); c.setAttribute('r', ((8 + 6 * (1 - j)) * Math.min(1, k)).toFixed(1)); });
  });
}

function dromRita(t) {
  const syns = t >= T.DROM + 0.2;
  [moln, drom, ...prickar].forEach(e => (e.style.display = syns ? '' : 'none'));
  if (!syns) return;
  const [hx, hy] = bil.punkt([700, 230]), gung = 5 * Math.sin(2 * Math.PI * (t - T.DROM) / 1.6);
  const sv = inUt(del(...T.SVALL, t));   // molnet sväller mot mitten och fyller bilden
  const [mx, my] = [lerp(MOLN_XY[0], W / 2, sv), lerp(MOLN_XY[1] + gung, H / 2, sv)];
  prickar.forEach((c, i) => {
    const q = (i + 1) / 4, k = over(del(T.DROM + 0.3 + 0.2 * i, T.DROM + 0.6 + 0.2 * i, t)) * (1 - mjuk(del(T.SVALL[0], T.SVALL[0] + 0.4, t)));
    c.setAttribute('cx', lerp(hx, mx - 190, q)); c.setAttribute('cy', lerp(hy, my + 90, q)); c.setAttribute('r', (12 + 9 * i) * k);
  });
  const sk = 1.15 * over(del(T.MOLN, T.MOLN + 0.4, t)) * lerp(1, 6, sv * sv);
  const tr = `translate(${mx.toFixed(1)} ${my.toFixed(1)}) scale(${sk.toFixed(3)})`;
  moln.setAttribute('transform', tr); drom.setAttribute('transform', tr);
  // i drömmen: står på tornet och hoppar till i takt, åker ner, plask, flyter med armarna upp
  const hoppT = bump((fas(t) % 2) / 2) * (t < T.AK ? 1 : 0), upp = { poseNamn: 'hurra' };
  if (t < T.AK) mini.stall(t, { x: mini.TOPP[0], y: mini.TOPP[1] - 30 * hoppT, humor: 'skrattar', titt: -0.6 });
  else if (t < T.LANDA) mini.stall(t, { ...mini.ak(t, T.AK, T.LANDA), humor: 'ropar', m: 1, armar: upp });
  else mini.stall(t, { x: mini.HAV_X, y: mini.HAV_Y + 5 * Math.sin(t * 2.2), humor: 'skrattar', armar: upp });
  mini.fram(t); mini.krona(0, t, T.LANDA);
}

kit.kor(render, SLUT, { sang: [K0, K0 + SLUT] });
})();
