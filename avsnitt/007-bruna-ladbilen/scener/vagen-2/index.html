<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vägen 2 – 06 till 09h</title>
<style>
  html, body { margin:0; background:#FBF7EE; overflow:hidden; }
  svg { width:100vw; height:100vh; display:block; }
</style>
</head>
<body>
<!-- Avsnitt 007, vägen 2 (storyboard 06–08c och refräng 2, 09a–09h), tagning 3. Tiderna ur lager/matt.json (kit.manus()).
     Lastbilen står hela scenen där refrängens dansbild har den (M.matt.DANS, mitt i bild), så att 05h → 06 och 08c → 09a
     hänger ihop utan att lastbilen hoppar; granen står i högra kanten i stället för storyboardens högra tredjedel.
     06–06b i halvbilden, rakt klipp från 05h, ingen zoom, en sak i taget (Sanna 2026-11-06): humlan flyger in och sätter sig vid kotten
     i granen; "Titta där!": hon knuffar den och den trillar ner på vägen; "Kotten är brun": den poppar som klistermärke på sin plats
     med en glimt (ett skutt rakt upp, ingen skalning); "dunk, dunk": ett skutt på stället per dunk (på slagen), Bulle nickar; sedan flyger humlan ut.
     08 halvnära: frågan, huvudet på sned och tassarna uppåt, kotten ligger på vägen. 08a "Kan du se?": Bulle vänder huvudet mot nallen på flaket.
     08b: rakt klipp in till nallen på "Titta närmare" (ingen humla där), nallen guppar två gånger på "nallen är brun". 08c i MELLAN: klappar på magen, en per "brum",
     och vägen börjar rulla rakt in i refräng 2 (inget mellanspel i tagning 3). Armarna kan bara peka utåt och magen är bakom karossen, så klappen är som
     storyboardens 08c: tassarna på ratten, Bulle skuttar till i sätet och ratten guppar (lyft, tut), se BEHOV.md. 09a–09h: refräng 2 (../refrang.js).
     Raka klipp på bildgränserna (inga mjukaKlipp). Ut: kritsvepet i ängens himmelsblå fyller bilden de sista 0,6 s, angen/ sveper bort det. -->
<script src="../kit.js"></script><script src="../humla.js"></script><script src="../../../../verktyg/kant.js"></script><script src="../ansikten.js"></script><script src="../kritsvep.js"></script>
<script src="../lastbilen.js"></script><script src="../klistermarke.js"></script><script src="../rutschbana.js"></script><script src="../refrang.js"></script>
<script>
const { el, bild, lerp, mjuk, inUt, ut, over, del, clamp, blink, ROT, BEAT } = kit;
const V = 120;                                   // vägens fart (px/s), samma som hjulen i refrängen (dist = t · 120)
const GRAN_X = 1215, GRAN_FOT = 590, GRAN_H = 413, GRAN_KLIPP = 492;   // granen utan stammen (gran.png klipps vid y 492)
const KOTTE_H = 130, KOTTE_BB = [183, 88, 838, 934], VAG_Y = 700;         // kotten (cut/tunn/kotte-v1.png) och var den ligger på vägen
const KOTTE = `${ROT}assets/rekvisita/kotte/cut/tunn/kotte-v1.png`;
const SVEP = 0.6, ANG_HIMMEL = '#5EBDE3';         // kritsvepet ut till ängen (angen/:s HIMMEL)
// halvbilden: hela lastbilen med hjulen över nederkanten, granens krona; 06a åker in mot kotten på vägen (bakhjulet kvar i bild)
const MELLAN = [850, 470, 1.3];
let T, M, a0, r, moln, mini, stjarnor, bil, P0, kamNar, NAR08, NALLNAR, vag, granG, granSving, kotte, glimt, kotteBak, kotteFram;

async function bygg() {
  M = await kit.manus();
  [a0] = M.bild('06');
  const S = x => x - a0, b = id => M.bild(id).map(S), rad = (txt, nr) => S(M.rad(txt, nr).t + M.av);
  T = {};
  for (const id of ['06', '06a', '06b', '08', '08a', '08b', '08c', '08d', '09a']) T[id] = b(id)[0];
  T.SLUT = b('09h')[1];
  // 06–06b en sak i taget (Sanna 2026-11-06, #9): humlan flyger in och sätter sig vid kotten, på "Titta där!" knuffar hon den
  // och den trillar ner på vägen, på "Kotten är brun" poppar den som klistermärke, på "dunk, dunk" studsar den på stället, sedan
  // flyger humlan ut
  T.KNUFF = rad('Titta där');                       // humlan knuffar kotten
  T.FALL = T.KNUFF + 0.2;                           // kotten släpper
  T.LAND = T.FALL + 0.42;
  T.LOSS = T.KNUFF;
  T.KOTT = rad('Kotten är brun') - 0.05;           // "Kotten är brun": klistermärket poppar på "Kot-"
  T.DUNK = slag(rad('dunk dunk') - 0.25, T['08']).slice(0, 2);          // tagning 3: 71,6 och 72,25 (sångtid), på slagen
  T.KLIPP08 = slag(T['08'] + 0.75, T['08'] + 2)[0];   // halvbilden hålls tills humlan flugit ut, sedan rakt klipp på slaget till 08:s bild
  T.SE = rad('Kan du se');                          // "Kan du se?": Bulle vänder sig mot nallen
  T.NALLE = slag(rad('nallen är brun') - 0.1, T['08c']).slice(0, 2);   // nallen guppar två gånger
  T.BRUM = slag(S(M.rad('brum brum', { efter: M.bild('08c')[0] - M.av }).t + M.av) - 0.1, T['09a']).slice(0, 2);
  // 08d bryggan (Suno v7b, tagning 4): "Björnen blundar … tänk om, tänk om … Ett hav av kolasås! Nu kör vi dit – brum, brum!",
  // sedan harpluften utan sång (UPP → 09a): molnet med rutschkanan svävar upp och bort, kolasåsen väller in
  const bry = { efter: M.bild('08d')[0] - M.av - 0.1 }, radB = txt => S(M.rad(txt, bry).t + M.av);
  T.BJORN = S(M.rad('Och björnen med', { efter: M.bild('08c')[0] - M.av - 0.5 }).t + M.av) + 0.15;   // på "björnen"
  T.HAV = radB('En rutschkana'); T.DIT = radB('Nu kör vi dit');   // tagning 5: bryggan 2 har ingen kolasåsrad
  T.BRUM2 = slag(radB('brum brum') - 0.1, T['09a']).slice(0, 2); T.UPP = Math.min(T.BRUM2[1] + 0.6, T['09a'] - 1.1);   // tagning 5 har ingen harpluft: molnet svävar upp sista sekunden före refrängen (som vagen-1)
  T.RULL = T.DIT;                                   // "Nu kör vi dit": vägen börjar rulla igen
  T.BLINK = [T['06a'] + 2.2, T['08'] + 1.6, T['08b'] + 2.6, T.DIT + 1.4];

  const L = kit.duk(kit.VAG_PLATTA);
  // kritsvepet lämnar en glipa längst till vänster även vid k = 0,5: en hel himmelsblå yta under svepet de sista bildrutorna (samma som angen/)
  tackyta = el('rect', { x: -200, y: -200, width: 2400, height: 1500, fill: ANG_HIMMEL, opacity: 0 }, kit.lager.overst); kit.lager.overst.prepend(tackyta);
  // vägen: buskarna långt bort och de rullande mittstrecken (kit.vag, samma som vagen-1) och granen ligger i plattan, under refrängens berg
  vag = kit.vag(L.plate);
  granG = el('g', {}, L.plate);
  granSving = el('g', {}, granG);
  const gs = GRAN_H / GRAN_KLIPP;
  el('rect', { width: 355, height: GRAN_KLIPP }, el('clipPath', { id: 'granklipp' }, L.plate.ownerSVGElement.querySelector('defs')));
  const gi = el('g', { transform: `translate(${-355 * gs / 2} ${-GRAN_H}) scale(${gs})` }, granSving);
  bild(`${ROT}assets/bakgrunder/vagen-saker/gran.png`, el('g', { 'clip-path': 'url(#granklipp)' }, gi), { width: 355, height: 611 });
  kant.lagg(gi);

  kotteBak = el('g', {}, L.figurer);                // kotten bakom lastbilen när vägen rullar, framför den annars
  bil = await lastbilen.ny(L.figurer, M);
  // Humle visar kotten (Sanna 2026-11-06, #9 och #10): flyger in och sätter sig bredvid kotten i granen, knuffar den på "Titta där!"
  // och sitter kvar medan den trillar och studsar, flyger ut efter sista "dunk". Ingen humla på nallen (#10).
  const SITT = [GRAN_X - 55, GRAN_FOT - 200], KNUFF = [GRAN_X - 25, GRAN_FOT - 190];
  window.humle = await humla.ny(L.figurer, [
    { a: 0, e: T.KNUFF - 0.25, fran: [W + 120, 110], till: SITT, sitt: T.KNUFF, amp: 14, titt: 1 },
    { a: T.KNUFF, e: T.KNUFF + 0.18, fran: SITT, till: KNUFF, sitt: T.DUNK[1] + 0.25, amp: 0, titt: 1 },
    { a: T.DUNK[1] + 0.25, e: T.KLIPP08 - 0.05, fran: KNUFF, till: [W + 160, 30], amp: 14 }], { h: 90 });
  humle.ljud();
  kotteFram = el('g', {}, L.figurer);
  kotte = el('g', {}, kotteFram);
  const ks = KOTTE_H / (KOTTE_BB[3] - KOTTE_BB[1]);
  bild(KOTTE, el('g', { transform: `scale(${ks}) translate(${-(KOTTE_BB[0] + KOTTE_BB[2]) / 2} ${-(KOTTE_BB[1] + KOTTE_BB[3]) / 2})` }, kotte));
  kant.lagg(kotte);
  // glimten när kotten är klistermärke (som klistermarke.js), i övre högra hörnet
  const g = 0.13 * KOTTE_H, k = g * 0.28;
  glimt = el('path', { d: `M0 ${-g}L${k} ${-k}L${g} 0L${k} ${k}L0 ${g}L${-k} ${k}L${-g} 0L${-k} ${-k}Z`, fill: '#fff' }, kotteFram);   // utanför kottens grupp, så att kanten inte tar den

  // tankemolnet i bryggan ligger i bildens eget lager (ovanför kameran), uppe till höger, som i vagen-1
  moln = el('g', { filter: 'url(#kritkant)' }, L.plate.ownerSVGElement);
  moln.prickar = [0, 1, 2].map(() => el('circle', { fill: '#fff', stroke: '#e4ddd2', 'stroke-width': 5 }, moln));
  moln.g = el('g', {}, moln);
  const MOLN = [[-150, 10, 95], [-60, -55, 110], [60, -60, 115], [155, 5, 95], [70, 60, 100], [-60, 60, 100]];
  [['#e4ddd2', 16], ['#fff', 0]].forEach(([fill, ext]) => MOLN.forEach(([x, y, rr]) => el('circle', { cx: x, cy: y, r: rr + ext / 2, fill }, moln.g)));
  r = await refrang.ny(M, '09', S);
  await r.bygg(L, bil);
  // rutschkanan i molnet (Sanna 2026-11-06: "rutchkana in bubble 1:53 too"), som vagen-1:s 04b: en liten rutschbana.js (banan och Bulle)
  // med eget kolahav, klippt efter molnets form och utan molnets kritkant
  const klipp = el('clipPath', { id: 'molnklipp' }, document.querySelector('svg defs'));
  MOLN.forEach(([x, y, rr]) => el('circle', { cx: x, cy: y, r: rr - 4 }, klipp));
  moln.rb = el('g', { 'clip-path': 'url(#molnklipp)' }, L.plate.ownerSVGElement);
  const inne = el('g', { transform: `scale(${RB[2]}) translate(${-RB[0]} ${-RB[1]})` }, moln.rb);
  el('rect', { x: -400, y: 668, width: W + 800, height: 400, fill: '#E8A63A', filter: 'url(#kolakorn)' }, inne);   // kolahavet
  mini = await rutschbana.ny(L, { bara: true, kronor: 1, havX: 420 });   // plasket längre in, så att det ryms i molnet
  inne.append(mini.strand, mini.fg);
  // glitter runt Bulle på "Och björnen med" (Sanna 2026-11-06), samma stjärnor som nallens i lastbilen.js, på Bulles andra sida
  stjarnor = BULLE_GLITTER.map(([, , rr]) => {
    const g2 = el('g', {}, L.figurer), k = rr * 0.28;
    el('path', { d: `M0 ${-rr}L${k} ${-k}L${rr} 0L${k} ${k}L0 ${rr}L${-k} ${k}L${-rr} 0L${-k} ${-k}Z`, fill: '#fff', stroke: '#FFE7A8', 'stroke-width': 3 }, g2);
    return g2;
  });

  P0 = { x: M.matt.DANS[0], y: M.matt.DANS[1], h: M.matt.DANS[2] };
  bil.pose(P0);
  // närbilden som refrängens h (närbild() i bygg.py): ögonen strax ovanför mitten, bilens kant längst ner
  const s = P0.h / (bil.BB[3] - bil.BB[1]), hh = 700 * M.matt.BULLE[0] * s, [ex, ey] = bil.punkt([511, 400]);
  kamNar = [ex, ey + hh * 0.08, H / hh];
  NAR08 = [ex - 80, ey + 0.09 * hh, 0.5 * H / hh];     // 08–08a: Bulle och nallen på flaket, båda hela
  // nallen på flaket (lastbilen.js: mitt 325, fötterna 520 i lastbilens ruta): 08b åker in till den, Bulles ansikte i högerkanten
  const fot = [(bil.BB[0] + bil.BB[2]) / 2, bil.BB[3]], nx = P0.x + (325 - fot[0]) * s, ny = P0.y + (520 - 95 - fot[1]) * s;
  NALLNAR = [nx + 70, ny - 5, 2.5];

  // ljud (ljud.md): motorn lågt medan vägen rullar, grenen gungar, pop och glitter när kotten skuttar, dunk lägre än rösten, pling på magen
  kit.ljud('brum', 0, { vol: 0.12, langd: 1.5, fade: 0.7 });
  kit.ljud('fladder', T.LOSS, { vol: 0.25, langd: T.FALL - T.LOSS + 0.2, fade: 0.2 });   // granen gungar innan kotten släpper (ljud.md, Fler effekter)
  kit.ljud('fladder', T.FALL + 0.15, { vol: 0.15, langd: 0.7, fade: 0.4 });                // och fjädrar tillbaka när den släppt
  kit.ljud('plupp', T.LAND, { vol: 0.2 });          // kotten landar på vägen (dunken sparas till de sjungna "dunk")
  kit.ljud('pop', T.KOTT, { vol: 0.5 });
  kit.ljud('glimt', T.NALLE[0], { vol: 0.35 });   // nallen glittrar
  kit.ljud('glitter', T.KOTT + 0.25, { vol: 0.2 });
  T.DUNK.forEach(p => kit.ljud('dunk', p, { vol: 0.3 }));
  kit.ljud('pling', T.BRUM[0], { vol: 0.3 });
  kit.ljud('brum', T.RULL, { vol: 0.1, langd: T['09a'] - T.RULL + 0.5, fade: 0.5 });
  kit.ljud('glimt', T['08d'] + 1.0, { vol: 0.25 });   // bryggan: molnet poppar upp med rutschkanan
  kit.ljud('glimt', T.BJORN, { vol: 0.3 });             // Bulle glittrar på "björnen"
  kit.ljud('pop', T['08d'] + 1.4, { vol: 0.4 });
  kit.ljud('plask', T.HAV + 1.6, { vol: 0.3 });   // Bulle plaskar i kolahavet i molnet
  T.BRUM2.forEach(x => kit.ljud('brum', x - 0.03, { vol: 0.15, langd: 0.35, fade: 0.15 }));
  kit.ljud('glitter', T.UPP, { vol: 0.25 });       // motorn när de kör vidare

  // ut till ängen (#11): kritsvepet i ängens himmelsblå fyller bilden de sista SVEP s av 09h, så att klippet hamnar under kritan;
  // angen/ börjar täckt och sveper bort över ängen
  kit.ljud('swoosh', T.SLUT - SVEP, { vol: 0.5 });   // ängen tar smulandet, vi tar fyllningens ljud
  kritsvep.LJUD.filter(k => k < 0.5).forEach((k, i) => kit.ljud('skrrrrt-kort', T.SLUT - SVEP + k / 0.5 * (SVEP - 0.1), { variant: i % 4 + 1, vol: 0.5 }));
  // raka klipp på bildgränserna (Sanna 2026-11-06, #5: färre zoomar, fler klipp)
  kit.kor(render, T.SLUT, { sang: [a0 - M.av, a0 + T.SLUT - M.av] });
}

// slagen (scentid) i [a, b), på sångens takt
function slag(a, b) {
  const t0 = a0 - M.av - kit.BEAT0, ut = [];
  for (let n = Math.ceil((a + t0) / BEAT); n * BEAT - t0 < b; n++) ut.push(n * BEAT - t0);
  return ut;
}
const fas = t => (t + a0 - M.av - kit.BEAT0) / BEAT;
const puls = (t, tider, fore = 0.1, langd = 0.4) => tider.reduce((m, x) => Math.max(m, Math.sin(Math.PI * clamp((t - x + fore) / langd))), 0);

// vägens fart: rullar ur 05h, stannar vid granen (06), står still till 08c:s slut och rullar sedan in i refrängen; läget är integralen
const fart = t => Math.max(1 - mjuk(del(0.3, 1.5, t)), mjuk(del(T.RULL, T.RULL + 1.2, t)));
function vagLage(t) { let s = 0; for (let u = 0; u < t; u += 0.02) s += fart(u) * 0.02; return s * V; }
const STOPP = () => vagLage(1.6);   // vägen har stannat: granen står på GRAN_X då

// byte inom samma bild: förra poseringen glider över i den nya på d s (armarna utan r/l = på ratten, NER)
const NER = { r: [1300, 900], l: [-280, 900] };
function glid(t0, t, p0, p1, d = 0.4) {
  if (t >= t0 + d) return p1;
  const q = over(del(t0, t0 + d, t)), p = { ...p1 };
  for (const n of ['titt', 'tittY', 'rot']) p[n] = lerp(p0[n] ?? 0, p1[n] ?? 0, q);
  for (const k of 'rl') if (p0[k] || p1[k]) p[k] = [0, 1].map(i => lerp((p0[k] ?? NER[k])[i], (p1[k] ?? NER[k])[i], q));
  return p;
}
// kotten: mitten (x, y), vinkel, skala, tryck (sx, sy), glimt 0..1
let tackyta;
let kotteXY = [0, 0];   // kottens mitt i bild (humlan följer den)
function rKotte(x, y, rot = 0, sk = 1, sx = 1, sy = 1, gl = 0) {
  kotte.style.display = x == null ? 'none' : '';
  if (x != null) kotteXY = [x, y];
  glimt.style.display = 'none';
  if (x == null) return;
  kotte.setAttribute('transform', `translate(${x} ${y}) rotate(${rot}) scale(${sk * sx} ${sk * sy})`);
  glimt.style.display = gl > 0 ? '' : 'none';
  glimt.setAttribute('transform', `translate(${x + 0.36 * KOTTE_H * sk} ${y - 0.36 * KOTTE_H * sk}) rotate(${25 * gl}) scale(${gl * sk})`);
}
// en båge från p0 till p1 (mitten), toppen hy över den högre punkten, k 0..1
const bage = (p0, p1, hy, k) => [lerp(p0[0], p1[0], k), lerp(p0[1], p1[1], k) - (hy + Math.abs(p1[1] - p0[1]) / 2) * 4 * k * (1 - k)];

// tankemolnet i 08d (bildens lager, inte kamerans): prickarna, molnet med rutschkanan (Bulle hoppar till på tornet på "En rutschkana!",
// åker ner och plaskar i kolahavet); svävar bort i harpluften
const MOLN_XY = [0.74 * W, 0.3 * H + 20], RB = [800, 400, 0.32];   // RB: rutschbanans punkt i molnets mitt och skala (som vagen-1)
const bump = k => Math.sin(clamp(k) * Math.PI) ** 2;
// Bulles glitter: lastbilens koordinater (x, y, storlek), till höger om och ovanför huvudet, bort från nallen
const BULLE_GLITTER = [[700, 230, 18], [560, 120, 14], [760, 430, 15], [690, 620, 12], [820, 300, 10]];
function bulleGlitter(t) {
  const gl = del(T.BJORN - 0.1, T.BJORN + 0.55, t), [x0, y0] = bil.punkt([0, 0]), [, y1] = bil.punkt([0, 100]), sc = 3 * (y1 - y0) / 100;   // lika stora i bild som nallens stjärnor
  stjarnor.forEach((g2, i) => {
    const u = gl * 2.2 - 0.12 * i, k = u > 0 && gl < 1 ? u % 1 : 0, sk = Math.sin(Math.PI * k), [x, y] = bil.punkt(BULLE_GLITTER[i]);
    g2.style.display = sk > 0.01 ? '' : 'none';
    g2.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(45 * k).toFixed(1)}) scale(${(sk * sc).toFixed(3)})`);
  });
}
function tankemoln(t) {
  const t0 = T['08d'] + 0.4, syns = t >= t0 && t < T['09a'];
  moln.style.display = moln.rb.style.display = syns ? '' : 'none';
  if (!syns) return;
  const borta = mjuk(del(T['09a'] - 1.0, T['09a'] - 0.1, t)), upp = inUt(del(T.UPP, T['09a'] - 0.1, t));
  const gung = 5 * Math.sin(2 * Math.PI * (t - t0) / 1.6) - 520 * upp, vis = 1 - mjuk(del(T.UPP, T.UPP + 0.5, t));
  moln.setAttribute('opacity', (1 - borta).toFixed(3));
  moln.prickar.forEach((c, i) => {
    const q = (i + 1) / 4, s = over(del(t0 + 0.2 * i, t0 + 0.2 * i + 0.3, t)) * vis;
    c.setAttribute('cx', lerp(0.55 * W, MOLN_XY[0] - 190, q)); c.setAttribute('cy', lerp(0.42 * H, MOLN_XY[1] + 90, q) + gung * q);
    c.setAttribute('r', (12 + 9 * i) * s);
  });
  moln.g.setAttribute('transform', `translate(${MOLN_XY[0]} ${MOLN_XY[1] + gung}) scale(${1.15 * over(del(t0 + 0.6, t0 + 1.0, t)) * (1 - 0.3 * borta)})`);
  moln.rb.setAttribute('transform', moln.g.getAttribute('transform')); moln.rb.setAttribute('opacity', (1 - borta).toFixed(3));
  const ak = T.HAV + 0.45, landa = T.HAV + 1.6, hopp = bump(del(T.HAV - 0.05, T.HAV + 0.4, t)), armUpp = { r: mini.UPP.r, l: mini.UPP.l };
  if (t < ak) mini.stall(t, { x: mini.TOPP[0], y: mini.TOPP[1] - 40 * hopp, humor: 'skrattar', titt: -0.6, armar: hopp > 0.2 ? armUpp : undefined });
  else if (t < landa) mini.stall(t, { ...mini.ak(t, ak, landa), humor: 'ropar', m: 1, armar: armUpp });
  else mini.stall(t, { x: mini.HAV_X, y: mini.HAV_Y + 5 * Math.sin(t * 2.2), humor: 'skrattar', armar: armUpp });
  mini.fram(t); mini.krona(0, t, landa);
}

function render(t) {
  humle.rita(t);
  const pos = vagLage(t), fram = pos - STOPP();
  vag.rulla(pos, t);
  const gx = GRAN_X - fram;
  // granen gungar när kotten lossnar och studsar tillbaka när den trillat
  const sv = Math.sin(2 * Math.PI * (t - T.LOSS) / 0.5) * (t > T.LOSS && t < T.FALL ? 1.2 : 0) + Math.sin(2 * Math.PI * (t - T.FALL) / 0.6) * 1.8 * Math.exp(-3 * Math.max(0, t - T.FALL)) * (t > T.FALL ? 1 : 0);
  granG.setAttribute('transform', `translate(${gx.toFixed(1)} ${GRAN_FOT})`);
  granSving.setAttribute('transform', `rotate(${sv.toFixed(2)})`);
  granG.style.display = gx > -300 ? '' : 'none';

  const id = r.rita(t);
  tankemoln(id ? -1 : t);
  // när vägen rullar ligger kotten kvar på vägen och glider bort med granen, bakom lastbilen; i refrängen är den borta
  const bak = id || t >= T.RULL;
  if (kotte.parentNode !== (bak ? kotteBak : kotteFram)) (bak ? kotteBak : kotteFram).append(kotte);
  if (id) { rKotte(); if (t >= T.SLUT - SVEP) { kritsvep(0.5 * del(T.SLUT - SVEP, T.SLUT - 0.1, t), ANG_HIMMEL); tackyta.setAttribute('opacity', del(T.SLUT - 0.3, T.SLUT - 0.1, t).toFixed(3)); } return; }

  const KV = [GRAN_X - 6 - fram, VAG_Y - KOTTE_H / 2];              // kotten på vägen
  const KG = [GRAN_X + 12 - fram, GRAN_FOT - 175];                   // kotten i granen
  let p, kam = [W / 2, H / 2, 1], dy = 0;
  const dist = pos;
  if (t < T['08']) {   // 06–06b i halvbilden, ett rakt klipp från 05h och ingen zoom: en sak i taget (se T.KNUFF)
    kam = MELLAN;
    const [d1, d2] = T.DUNK;
    if (t < T.FALL) rKotte(KG[0], KG[1], -12 + 10 * Math.sin(2 * Math.PI * (t - T.KNUFF) / 0.25) * (t > T.KNUFF ? 1 - del(T.KNUFF, T.FALL, t) : 0));
    else if (t < T.LAND) { const k = del(T.FALL, T.LAND, t); rKotte(lerp(KG[0], KV[0], k), lerp(KG[1], KV[1], k * k), -12 + 12 * k, 1, 1 - 0.05 * k, 1 + 0.08 * k); }
    else if (t < d1 - 0.45) {   // landar (tryck), ligger still; "Kotten är brun": ett skutt rakt upp på sin plats med en glimt, ingen skalning (QA 2026-11-06)
      const land = kit.hopp(t, T.LAND - 0.01, T.LAND, 0, 0, 0.14), q = t - T.KOTT;
      const hopp = kit.hopp(t, T.KOTT, T.KOTT + 0.42, 46, 0.08, 0.16), gl = Math.max(0, Math.sin(Math.PI * del(0.15, 0.7, q)));
      const tr = hopp.sx !== 1 ? hopp : land;
      rKotte(KV[0], KV[1] + hopp.y, 0, 1, tr.sx, tr.sy, gl);
    } else {   // "dunk, dunk": ett skutt på stället per dunk, landar på ordet
      const h = T.DUNK.reduce((a, d) => a + kit.hopp(t, d - 0.42, d, 46, 0.08, 0.16).y, 0);
      const land = T.DUNK.map(d => kit.hopp(t, d - 0.01, d, 0, 0, 0.16)).find(x => x.sx !== 1) || { sx: 1, sy: 1 };
      rKotte(KV[0], KV[1] + h, 0, 1, land.sx, land.sy);
    }
    // Bulle: tittar på humlan när hon kommer, förvånad när kotten trillar, skrattar åt klistermärket, nickar en gång per dunk
    const sett = ut(del(T.FALL, T.FALL + 0.3, t)), nick = puls(t, T.DUNK, 0, 0.35);
    p = { humor: t > T.KOTT ? 'skrattar' : sett > 0.3 ? 'forvanad' : 'glad', titt: 1, tittY: lerp(-0.5, 0.4, mjuk(del(T.FALL, T.LAND, t))), rot: -3 * nick };
    const upp = lastbilen.armUpp(t, T.KOTT, d1 - 0.15);   // pekar på kotten: upp på slaget, ner före dunken
    if (upp > 0) p.r = [1500, lerp(650, 330, upp)];
    dy = 3 * nick;
  } else if (t < T['08b']) {   // 08: frågan till tittaren, huvudet på sned, tassarna uppåt; kotten hoppar ner på vägen. 08a "Kan du se?": vänder sig mot nallen
    kam = t < T.KLIPP08 ? MELLAN : NAR08;
    rKotte(KV[0], KV[1]);
    const q = mjuk(del(T['08'], T['08'] + 0.5, t)) * (1 - mjuk(del(T.SE, T.SE + 0.5, t)));
    // "Vad mer är brunt?" sjungs långt: blicken letar lugnt åt höger och vänster, och på "Kan du se?" vänder han sig mot nallen
    const leta = mjuk(del(T['08'] + 0.8, T['08'] + 1.4, t)) * (1 - mjuk(del(T.SE - 0.5, T.SE, t)));
    const sv = Math.sin(2 * Math.PI * (t - T['08'] - 0.8) / 2.6) * leta, mot = mjuk(del(T.SE, T.SE + 0.45, t));
    const arm = mjuk(del(T.SE, T.SE + 0.5, t));   // tassarna sjunker tillbaka till ratten
    p = glid(T['08'], t, { titt: 1, tittY: 0.4 },
      { humor: mot > 0.5 ? 'glad' : 'nyfiken', titt: lerp(0.8 * sv, -1, mot), tittY: lerp(-0.3, 0.2, mot), rot: q * (8 + 1.5 * Math.sin(Math.PI * fas(t) / 2)) + 3 * sv - 3 * mot,
        ...(arm < 1 ? { r: [lerp(1500, 1100, arm), lerp(-300, 600, arm)], l: [lerp(-480, -150, arm), lerp(-300, 600, arm)] } : {}) }, 0.5);
  } else if (t < T['08c']) {   // 08b: kameran åker in till nallen på "Titta närmare", nallen guppar två gånger på "nallen är brun"
    kam = NALLNAR;   // "Titta närmare": rakt klipp in till nallen
    rKotte(KV[0], KV[1]);
    p = { humor: 'glad', titt: -1, tittY: 0.2, rot: -3 };
    p.kanin = T.NALLE.reduce((a, x) => a - kit.hopp(t, x - 0.05, x + 0.3, 30, 0.06, 0.12).y, 0);
    p.glitter = del(T.NALLE[0] - 0.2, T.NALLE[0] + 0.45, t);   // bara på orden, stjärnorna borta innan nallen lutar huvudet (QA 2026-11-06)   // "nallen är brun": nallen glittrar (Sanna 2026-11-06)
  } else if (t >= T['08d']) {   // 08d bryggan: blundar och drömmer, ögonen upp på "Nu kör vi dit", ropar med på "brum, brum"
    kam = MELLAN;
    rKotte(KV[0], KV[1]);
    const vaken = mjuk(del(T.DIT - 0.2, T.DIT + 0.2, t)), ropar = T.BRUM2.some(a => t > a - 0.08 && t < a + 0.35);
    p = vaken < 0.5 ? glid(T['08d'], t, { humor: 'njuter' }, { humor: 'njuter', tittY: -0.3, rot: 5 * Math.sin(Math.PI * fas(t) / 4) }, 0.5)
      : { humor: ropar ? 'ropar' : 'skrattar', m: ropar ? 1 : 0, titt: 0.3, rot: 4 * Math.sin(Math.PI * fas(t) / 2), tut: puls(t, T.BRUM2, 0, 0.35) };
    dy = T.BRUM2.reduce((a, x) => a + kit.hopp(t, x, x + 0.3, 10, 0.06, 0.12).y, 0);
  } else {   // 08c i MELLAN: klappar på magen, en gång per "brum", lastbilen skumpar lite och puffar; vägen börjar rulla in i refrängen
    kam = MELLAN;
    rKotte(KV[0], KV[1]);
    const kl = puls(t, T.BRUM, 0.1, 0.42);
    p = glid(T['08c'], t, { titt: -1, tittY: 0.2, rot: -3 }, { humor: 'njuter', lyft: 14 * kl, tut: kl }, 0.4);
    dy = T.BRUM.reduce((a, x) => a + kit.hopp(t, x, x + 0.3, 8, 0.06, 0.12).y, 0);
  }
  if (blink(t, T.BLINK) && ['glad', 'nyfiken', 'forvanad'].includes(p.humor)) p.blink = 1;
  const stopp = t > 0.3 && t < 3 ? Math.sin(2 * Math.PI * (t - 1.0) / 1.3) * Math.exp(-2 * Math.max(0, t - 1.0)) * mjuk(del(0.3, 1.0, t)) : 0;   // gungar till när den stannar
  const kor = mjuk(del(T.RULL, T.RULL + 1.2, t));   // flaggan lutar bakåt i fartvinden och svajar när de kör igen
  // nallens min (Sanna 2026-11-06 "teddy expressions come alive"): oj när kotten trillar, glad på "nallen är brun" och "En rutschkana!"
  const nalle = lastbilen.nalleUttryck(t, { glad: [T.NALLE[0], T.HAV], oj: [T.FALL] });
  bil.pose({ ...P0, kanin: 3 * puls(t, T.BRUM, 0, 0.4), nalle, ...p, y: P0.y + dy, dist, tilt: 1.0 * stopp + 0.6 * kor * Math.sin(Math.PI * fas(t) / 2),
    flagg: 6 * stopp + kor * (4 + 3 * Math.sin(2 * Math.PI * t / 1.3)) });
  bil.puffa(t, [...(t < 1.5 ? [0.2, 0.85] : []), ...T.BRUM, ...T.BRUM2, T.RULL]);
  bulleGlitter(t);
  // närbild på ansiktet (Sanna 2026-11-06: "more close crops on faces"): från "Och björnen med" genom "Björnen blundar … tänk om",
  // ut igen när molnet med rutschkanan poppar upp; i bryggan glider ansiktet åt vänster så att molnet får plats till höger
  // raka klipp in på 08c och ut på slaget före "En rutschkana", och i 08d står ansiktet till vänster så att molnet får plats
  const a = T['08c'], e = slag(T.HAV - 0.9, T.HAV)[0] ?? T.HAV - 0.1;
  if (t >= a && t < e) {
    const dx = t >= T['08d'] ? 0.22 : 0;
    const [x, y0] = bil.punkt([511, 150]), [, y1] = bil.punkt([511, 850]), z = 0.92 * H / (y1 - y0);
    kam = [x + dx * W / z, (y0 + y1) / 2 - 0.04 * (y1 - y0), z];
  }
  kit.kamera(...kam);
}
