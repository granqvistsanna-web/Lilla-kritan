<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vägen 1 – 03 till 05h</title>
<style>
  html, body { margin:0; background:#FBF7EE; overflow:hidden; }
  svg { width:100vw; height:100vh; display:block; }
</style>
</head>
<body>
<!-- Avsnitt 007, vägen 1 (storyboard 03–04a, 05a–05h). Tiderna ur storyboard/bygg.py via kit.manus(), i takt med sång tagning 3.
     03–04 är 4,4 s (sångtid 15,0–19,4), så de är en följd, inte fyra bilder. 03: "Tut-tut" ligger på klippet: Bulle trycker på tutknappen
     och lastbilen hoppar två gånger medan kritan-ritars teckning tonas bort och kameran åker ut till vägen. 03a: kameran glider in till
     närbilden, Bulle vinkar på slagen ("Hej hej!"). 03b–04: tassen tillbaka på ratten till "nu kör vi!", gungar i takten. Körscenens
     innehåll (vägen glider, buskarna långt bak, puffarna) går vidare i 041–04a.
     041 körscen (förut närbild, granskningen 2026-11-05): gungar i takt och skrattar, lastbilen skumpar per "brum" och Bulle ropar med.
     042 (tagning 3, Sanna 2026-11-05): på "Björnen tycker brunt är gott" stiger tre prickar ur Bulles huvud och en vit tankebubbla
     poppar upp framför lastbilen; chokladen och kolan poppar in i den (../klistermarke.js) och studsar på "Choklad är brun" / "Kola är brun".
     På första "mmm" efter var rad flyger saken i en båge in i Bulles öppna mun (mums), han tuggar och slickar sig om munnen.
     04a: spanar och pekar åt vänster, sedan åt höger; "leta med – jag och du": tittar på oss och nickar,
     och lastbilen glider fram till dansbildens plats (refrang.js 05a).
     05a–05h: refrängen (../refrang.js). Vägen med mittstreck och buskar rullar (kit.vag). -->
<script src="../kit.js"></script><script src="../humla.js"></script><script src="../../../../verktyg/kant.js"></script><script src="../ansikten.js"></script>
<script src="../kritsvep.js"></script><script src="../lastbilen.js"></script><script src="../klistermarke.js"></script><script src="../rutschbana.js"></script><script src="../refrang.js"></script>
<script>
const { el, bild, lerp, mjuk, inUt, over, del, clamp, blink, ROT, BEAT, BEAT0 } = kit;
const V = 120;                                             // vägens fart, px/s (samma som refrang.js hjul: nu × 120)
const KANT = { r: [600, 760], l: [420, 760] };             // armen på ratten (refrang.js)
const bump = k => Math.sin(clamp(k) * Math.PI) ** 2;
// Bulles ansikte i bild (efter bil.pose): huvudet (y 150–850 i Bulles ruta) fyller bildens höjd, lite luft ovanför kepsen
// dx: ansiktet förskjutet i bildrutan (andel av bredden; + = ansiktet till vänster, så att tankemolnet får plats till höger)
const ansikte = (dx = 0) => { const [x, y0] = bil.punkt([511, 150]), [, y1] = bil.punkt([511, 850]), z = 0.92 * H / (y1 - y0); return [x + dx * W / z, (y0 + y1) / 2 - 0.04 * (y1 - y0), z]; };
let T, M, r, bil, BIL, DANS, kamNar, vag, tona, fas0, choklad, kola, tanke, landet, plasket;

async function bygg() {
  M = await kit.manus();
  const [a0] = M.bild('03'), [, slut] = M.bild('05h'), S = x => x - a0, rad = x => S(M.rad(x).t + M.av);
  fas0 = a0 - M.av - BEAT0;                                // scentid + fas0 = slag × BEAT i sångens rutnät
  const takt = t => Math.round((t + fas0) / BEAT) * BEAT - fas0;   // närmaste slag (scentid)
  T = { A: S(M.bild('03a')[0]), B: S(M.bild('03b')[0]), N: S(M.bild('041')[0]), K2: S(M.bild('042')[0]), LETA: S(M.bild('04a')[0]),
        DU: rad('Leta med'), R: S(M.bild('05a')[0]), SLUT: S(slut) };
  T.TUT = [0.02, 0.02 + BEAT / 2];                         // "Tut-tut" (sångtid 15,0) ligger på klippet in i vagen-1: två små hopp och tutknappen
  T.VINK = [takt(T.A + 0.3), T.B - 0.2];                   // "Hej hej!": en vink per slag, tassen på ratten till "nu kör vi!" (03b)
  T.BRUM = [0, 1].map(i => takt(rad('brum brum')) + i * BEAT);   // 041: "(brum, brum!)"
  // 042: "Björnen tycker brunt är gott! (Mmm!) Choklad är brun – (mmm, mmm!) Kola är brun – (mmm, mmm!)"
  const mm = [takt(rad('Mmm')), takt(rad('mmm mmm')), takt(S(M.rad('mmm mmm', 1).t + M.av))];
  T.MMM = [mm[0], mm[1], mm[1] + BEAT, mm[2], mm[2] + BEAT];
  T.CHOK = takt(rad('Choklad är brun')); T.KOLA = takt(rad('Kola är brun'));
  T.BORT = [T.LETA - 0.9, T.LETA - 0.1];
  T.AT = [T.MMM[1], T.MMM[3]];                             // Sanna 2026-11-05: Bulle äter chokladen och kolan, var sak landar i munnen på sitt första "mmm"                   // klistermärkena tonas bort före 04a
  T.SPANA = [T.LETA + 0.3, T.LETA + 1.4, T.DU - 0.3];      // pekar åt vänster, byter till höger, ner på ratten
  T.BLINK = [T.N + 0.4, T.N + 2.6, T.K2 + 1.9, T.LETA + 1.0, T.DU + 1.2];
  // 04b bryggan (Suno v7b, tagning 4): "Björnen blundar … tänk om, tänk om … Ett brunt land! (Ett brunt land!) Ett hav av kolasås!
  // (Kolasås!) Nu kör vi dit – brum, brum!", sedan harpluften utan sång (UPP → R) där molnet svävar upp och bort
  const bry = M.bild('04b')[0] - M.av - 0.1, radE = (x, n = 0) => S(M.rad(x, { efter: bry + (n ? M.rad(x, { efter: bry }).t - bry + 0.5 : 0) }).t + M.av);
  T.BR = S(M.bild('04b')[0]); T.LAND = [radE('En rutschkana'), radE('En rutschkana', 1)]; T.HAV = radE('Ner i kolasås');   // tagning 5
  T.DIT = radE('Nu kör vi dit'); T.BRUM2 = [0, 1].map(i => takt(radE('brum brum')) + i * BEAT); T.UPP = T.BRUM2[1] + 0.6;
  T.BLINK.push(T.DIT + 1.4);
  T.ANSIKTE = [[T.K2 + 0.1, T.CHOK - 0.3, 0.2], [T.BR - 0.2, T.LAND[0] - 0.1, 0.22]];
  T.PUFF = lastbilen.puffTider(0.4, T.R - 0.4, [...T.BRUM, ...T.BRUM2]);

  const L = kit.duk(kit.VAG_PLATTA);
  // buskarna och de rullande mittstrecken i plattan (kit.vag, samma som vagen-2): refrängens berg läggs ovanpå och täcker dem
  vag = kit.vag(L.plate);
  // kritan-ritars papper över vägen men bakom lastbilen: teckningen blir lastbilen på samma plats och vägen tonas fram runt den
  tona = el('rect', { x: -W, y: -H, width: 3 * W, height: 3 * H, fill: '#FBF7EE' }, L.plate);
  bil = await lastbilen.ny(L.figurer, M);
  // Humle (Sanna 2026-11-06: "sitting by teddy"): flyger in lugnt i körscenen och sätter sig på flakkanten bredvid nallen, i lastbilens
  // 1024-ruta (nallen står på x 325, flakkanten ca y 440), sitter med genom 042 och bryggan och flyger iväg i harpluften före refrängen
  // Sanna 2026-11-06 ("bumble bee a bit bigger and flying around"): hon sitter en stund, flyger en båge runt hytten och landar igen
  const SITT = [262, 466];
  // Humle hjälper till att leta (Sanna 2026-11-06: "find more intentional use"): hon kommer på "Björnen letar efter brunt",
  // letar ett varv runt lastbilen på "leta med – jag och du", sätter sig vid nallen och flyger iväg före refrängen
  window.humle = await humla.ny(bil.g.firstChild, [
    { a: T.LETA - 0.2, e: T.LETA + 4.2, fran: [1900, -260], via: [-560, 40], till: SITT, sitt: T.R - 3.2, amp: 34, slinga: true },
    { a: T.R - 3.2, e: T.R - 0.3, fran: SITT, till: [1900, 40], amp: 30 }], { h: 110 });
  humle.ljud();
  // Tankebubblan (Sanna 2026-11-05): på "Björnen tycker brunt är gott" stiger tre prickar ur Bulles huvud och ett vitt moln poppar upp
  // framför lastbilen; chokladen och kolan poppar in i molnet, och på "Choklad är brun" / "Kola är brun" studsar var och en till
  tanke = el('g', { filter: 'url(#kritkant)' }, L.figurer);
  tanke.prickar = [0, 1, 2].map(() => el('circle', { fill: '#fff', stroke: '#e4ddd2', 'stroke-width': 5 }, tanke));
  tanke.moln = el('g', {}, tanke);
  const MOLN = [[-150, 10, 95], [-60, -55, 110], [60, -60, 115], [155, 5, 95], [70, 60, 100], [-60, 60, 100]];
  [['#e4ddd2', 16], ['#fff', 0]].forEach(([fill, ext]) => MOLN.forEach(([x, y, r]) => el('circle', { cx: x, cy: y, r: r + ext / 2, fill }, tanke.moln)));
  choklad = klistermarke.ny(L.figurer, `${ROT}assets/rekvisita/choklad/cut/choklad-v5.png`, [114, 99, 921, 918], 0.19 * H);
  kola = klistermarke.ny(L.figurer, `${ROT}assets/rekvisita/kola/cut/kola-karamell.png`, [56, 142, 968, 872], 0.16 * H);
  // bryggan: kolalandet (rekvisita/kolalandet.md) i molnet på "Ett brunt land!", ett kolaplask på "Ett hav av kolasås!"
  landet = klistermarke.ny(L.figurer, `${ROT}assets/rekvisita/kolalandet/cut/kolalandet.png`, [124, 182, 901, 857], 0.33 * H);
  plasket = klistermarke.ny(L.figurer, `${ROT}assets/rekvisita/kolasas/cut/plask.png`, [67, 135, 972, 885], 0.13 * H);
  r = await refrang.ny(M, '05', S);
  await r.bygg(L, bil);

  BIL = { x: M.matt.BIL.x, y: M.matt.BIL.gv, h: M.matt.BIL.h };   // där den ritade lastbilen stod (körscen() i bygg.py)
  DANS = { x: M.matt.DANS[0], y: M.matt.DANS[1], h: M.matt.DANS[2] };
  // närbilden (närbild() i bygg.py): räknas på lastbilen i vila, så att den gungar i bild
  bil.pose(BIL);
  const s = BIL.h / (bil.BB[3] - bil.BB[1]), hh = 700 * M.matt.BULLE[0] * s, [ex, ey] = bil.punkt([511, 400]);
  // lite vidare och lägre än huvudet (granskningen 2026-11-05): karossens överkant, plankan och lampan syns, så att det läses som
  // lastbilen och inte som två bruna kullar, och lastbil.png (1024 px) förstoras mindre; lite åt vänster så att nallen på flaket är med
  kamNar = [ex - 45, ey + hh * 0.3, 0.8 * H / hh];

  // ljud (../ljud.md): lågt och i luckorna
  kit.ljud('tuta-tut', T.TUT[0] - 0.02, { vol: 0.3, langd: 0.9, fade: 0.2 });               // "Tut-tut": svagt, sången har tutet
  kit.ljud('brum', 0, { loop: true, langd: T.R, vol: 0.15, fade: 0.8 });                     // motorn, mycket lågt
  [1.8].map(m => T.PUFF.reduce((a, b) => Math.abs(b - m) < Math.abs(a - m) ? b : a))
    .forEach(x => kit.ljud('plupp', x, { vol: 0.2, langd: 0.6 }));                            // en puff i luckan före "nu kör vi!"
  T.BRUM.forEach(x => kit.ljud('brum', x - 0.03, { vol: 0.15, langd: 0.35, fade: 0.15 }));   // svagt eko av "brum"
  [T.CHOK, T.KOLA].forEach(x => { kit.ljud('pop', x, { vol: 0.5 }); kit.ljud('glitter', x + 0.25, { vol: 0.2 }); });
  kit.ljud('glimt', T.K2 + 0.75, { vol: 0.25 });   // tankebubblan poppar upp   // klistermärkena
  T.AT.forEach(x => { kit.ljud('swoosh', x - FLYGTID, { vol: 0.2 }); kit.ljud('mums', x + 0.05, { vol: 0.45 }); kit.ljud('nom', x + 0.5, { vol: 0.3 }); });   // flyger till munnen, mums, tugg   // flyger till munnen, mums
  kit.ljud('glimt', T.BR + 1.0, { vol: 0.25 });                                              // bryggan: molnet poppar upp
  T.LAND.forEach((x, i) => kit.ljud(i ? 'glitter' : 'pop', x, { vol: i ? 0.2 : 0.45 }));      // kolalandet poppar in, glittrar på ekot
  kit.ljud('plask', T.HAV + 0.1, { vol: 0.3 });
  T.BRUM2.forEach(x => kit.ljud('brum', x - 0.03, { vol: 0.15, langd: 0.35, fade: 0.15 }));
  kit.ljud('glitter', T.UPP, { vol: 0.25 });                                                  // molnet svävar bort i harpluften
  lastbilen.ljud([...T.TUT, ...T.BRUM, ...T.BRUM2]);                                                      // gnissel och kaninens pip på guppen
  kit.kor(kit.mjukaKlipp(render, [T.N], 1.3), T.SLUT, { sang: [a0 - M.av, a0 + T.SLUT - M.av] });
}

const fas = t => (t + fas0) / BEAT;

// lastbilen på vägen: lyfter sig mjukt på varje slag och gungar lite, skumpar per "brum"; glider till dansbildens plats före 05a
function korPose(t, bulle) {
  const f = fas(t), hopp = [...T.TUT.map(a => kit.hopp(t, a, a + 0.25, 8, 0.06, 0.12)), ...[...T.BRUM, ...T.BRUM2].map(a => kit.hopp(t, a, a + 0.3, 14, 0.08, 0.15))].reduce((a, h) => a + h.y, 0);
  const lugn = mjuk(del(0, 0.8, t)), q = inUt(del(T.R - 1.3, T.R - 0.05, t));
  return { x: lerp(BIL.x, DANS.x, q), y: lerp(BIL.y, DANS.y, q) - lugn * 2.5 * (1 - Math.cos(2 * Math.PI * f)) / 2 + hopp, h: lerp(BIL.h, DANS.h, q),
           tilt: lugn * 0.8 * Math.sin(Math.PI * f / 2), dist: V * t, kanin: -hopp * 0.5 + 3 * lugn * Math.abs(Math.sin(Math.PI * f)),
           flagg: 3 * Math.sin(Math.PI * f / 2), ...bulle };
}

// en arm från ratten (q = 0) ut mot målet (q = 1)
const arm = (s, mal, q) => [lerp(KANT[s][0], mal[0], q), lerp(KANT[s][1], mal[1], q)];

// Tankebubblan i 042: prickarna ur huvudet, molnet, sakerna i molnet; studs på sin rad, tonas bort med klistermärkena (T.BORT)
const MOLN_XY = [0.75 * W, 0.3 * H], FLYGTID = 0.5;
// sakens väg från molnet till Bulles mun: en båge uppåt, krymper, försvinner i munnen på slaget a
function flyg(t, a, fran) {
  const q = del(a - FLYGTID, a, t), mun = bil.punkt([512, 480]), k = inUt(q);
  return { x: lerp(fran[0], mun[0], k), y: lerp(fran[1], mun[1], k) - 120 * Math.sin(Math.PI * q), krymp: lerp(1, 0.35, k), ute: t >= a };
}
function tankebubbla(t) {
  // två gånger: 042 (godiset) och 04b bryggan (kolalandet; molnet svävar upp och bort i harpluften före refrängen)
  const brygga = t >= T.BR, t0 = brygga ? T.BR + 0.4 : T.K2 + 0.15, slut = brygga ? T.R : T.BORT[1];
  const borta = brygga ? mjuk(del(T.R - 1.0, T.R - 0.1, t)) : mjuk(del(T.BORT[0], T.BORT[1], t)), syns = t >= t0 && t < slut;
  const upp = brygga ? inUt(del(T.UPP, T.R - 0.1, t)) : 0, lyft = -520 * upp;
  tanke.style.display = syns ? '' : 'none';
  if (!syns) { choklad.g.style.display = kola.g.style.display = landet.g.style.display = plasket.g.style.display = 'none'; return; }
  tanke.setAttribute('opacity', (1 - borta).toFixed(3));
  const [hx, hy] = bil.punkt([700, 230]), gung = 5 * Math.sin(2 * Math.PI * (t - t0) / 1.6) + lyft;
  if (brygga) {
    const studs = a => 1 + 0.2 * bump(del(a - 0.05, a + 0.5, t));
    landet.rita(t, { ut: [T.R - 1.0, T.R - 0.1], t0: T.LAND[0], x: MOLN_XY[0] - 10, y: MOLN_XY[1] + 10 + gung, rot: -3, skala: studs(T.LAND[1]) });
    plasket.rita(t, { ut: [T.R - 1.0, T.R - 0.1], t0: T.HAV, x: MOLN_XY[0] + 165, y: MOLN_XY[1] - 75 + gung, rot: 8 });
    choklad.g.style.display = kola.g.style.display = 'none';
  } else landet.g.style.display = plasket.g.style.display = 'none';
  tanke.prickar.forEach((c, i) => {
    const q = (i + 1) / 4, s = over(del(t0 + 0.2 * i, t0 + 0.2 * i + 0.3, t)) * (1 - mjuk(del(T.UPP, T.UPP + 0.5, t)) * (brygga ? 1 : 0));
    c.setAttribute('cx', lerp(hx, MOLN_XY[0] - 190, q)); c.setAttribute('cy', lerp(hy, MOLN_XY[1] + 90, q) + gung * q);
    c.setAttribute('r', (12 + 9 * i) * s);
  });
  const sm = over(del(t0 + 0.6, t0 + 1.0, t)) * (1 - 0.3 * borta);
  tanke.moln.setAttribute('transform', `translate(${MOLN_XY[0]} ${MOLN_XY[1] + gung}) scale(${1.15 * sm})`);
  const studs = a => 1 + 0.25 * bump(del(a - 0.05, a + 0.5, t));   // studsar på sin rad
  if (brygga) return;
  [[choklad, t0 + 1.0, [MOLN_XY[0] - 95, MOLN_XY[1] + gung], -6, T.CHOK, T.AT[0]], [kola, t0 + 1.4, [MOLN_XY[0] + 100, MOLN_XY[1] + 5 + gung], 5, T.KOLA, T.AT[1]]]
    .forEach(([k, p0, fran, rot, rad, at]) => {
      const fl = flyg(t, at, fran);
      k.rita(t, { t0: p0, x: fl.x, y: fl.y, ut: [at - 0.01, at], rot, skala: studs(rad) * fl.krymp });
    });
}

function render(t) {
  humle.rita(t);
  tona.setAttribute('opacity', (1 - mjuk(del(0, 0.7, t))).toFixed(3));
  const id = r.rita(t);
  vag.rulla(V * t, t);
  if (id) { tankebubbla(-1); return; }   // molnet syns aldrig i refrängen

  let b, kam = [W / 2, H / 2, 1];
  const f = fas(t);
  if (t < T.N) {   // 03–04: ett svep in, som börjar i kritan-ritars fart och saktar in mot närbilden; ut till helbilden vid 041
    const q = del(0, T.A + 0.9, t), q2 = q * (2 - q);
    kam = [Math.max(BIL.x, W / 2 / 1.25), BIL.y - BIL.h / 2, 1.25].map((v, i) => lerp(v, kamNar[i], q2));
  }
  if (t < T.A) {   // 03: kameran fortsätter kritan-ritars svep in (zoom 1,25 på teckningen) hela vägen in till närbilden, utan att först åka ut
    const tryck = T.TUT.reduce((m, a) => Math.max(m, bump(del(a - 0.05, a + 0.3, t))), 0);   // "Tut-tut": tassen på tutknappen
    b = { humor: tryck > 0.3 ? 'skrattar' : 'glad', tryck, tut: tryck };
  } else if (t < T.N) {   // 03a–03b: närbild, vinkar på slagen och blinkar, sedan tassen tillbaka på ratten och blicken framåt
    const [v0, v1] = T.VINK, upp = over(del(v0 - 0.4, v0, t)) * (1 - mjuk(del(v1, v1 + 0.3, t)));
    const v = Math.sin(Math.PI * (t - v0) / BEAT) * mjuk(del(v0, v0 + 0.3, t));
    b = { humor: t < v1 ? 'blinkar' : 'glad', r: upp > 0.05 ? arm('r', [960 + 140 * v, -260], upp) : undefined, titt: 0.9 * mjuk(del(v1, v1 + 0.3, t)),
          rot: 3 * Math.sin(Math.PI * f / 2) * mjuk(del(T.B, T.B + 0.5, t)) };   // 03b–04: "nu kör vi!", sedan gungar han i shuffletakten
  } else if (t < T.K2) {   // 041: körscenen (raden handlar om att köra; närbilder högst 1,5–2,5 s), gungar i takten, ropar med på "brum"
    const ropar = T.BRUM.some(a => t > a - 0.08 && t < a + 0.35);
    b = { humor: ropar ? 'ropar' : 'skrattar', m: ropar ? 1 : 0, rot: 4 * Math.sin(Math.PI * f / 2), titt: 0.3, lyft: 4 * Math.abs(Math.sin(Math.PI * f)),
          tut: T.BRUM.reduce((m, a) => Math.max(m, bump(del(a, a + 0.35, t))), 0) };
  } else if (t < T.LETA) {   // 042: brunt är gott: tittar på klistermärkena, slickar sig om munnen och skuttar i sätet på varje mmm; kameran glider lite närmare
    const mmm = T.MMM.reduce((m, a) => Math.max(m, bump(del(a - 0.1, a + 0.45, t))), 0), ser = mjuk(del(T.CHOK - 0.2, T.CHOK + 0.3, t));
    const gapar = T.AT.some(a => t > a - FLYGTID && t < a + 0.05), tuggar = T.AT.some(a => t >= a + 0.05 && t < a + 2 * BEAT);
    b = gapar ? { humor: 'ropar', m: 1, titt: 0.6, tittY: -0.2 }   // gapar stort när godiset flyger mot munnen
      : { humor: mmm > 0.2 || tuggar ? 'slickar' : 'skrattar', titt: tuggar ? 0 : lerp(0.5, 0.9, ser), tittY: tuggar ? 0 : -0.35 * ser, lyft: 12 * mmm, tut: 0.6 * mmm };
    // (kameran står kvar på helbilden här: förut gled den in lite och ut igen i 04a, ett in-ut för mycket)
  } else if (t >= T.BR) {   // 04b bryggan: blundar och drömmer (molnet), ögonen upp på "Nu kör vi dit", ropar med på "brum, brum"
    const vaken = mjuk(del(T.DIT - 0.2, T.DIT + 0.2, t)), ropar = T.BRUM2.some(a => t > a - 0.08 && t < a + 0.35);
    const land = T.LAND.reduce((m, a) => Math.max(m, bump(del(a - 0.05, a + 0.45, t))), 0);
    b = vaken < 0.5 ? { humor: 'njuter', tittY: -0.3, rot: 5 * Math.sin(Math.PI * f / 4), lyft: 8 * land }
      : { humor: ropar ? 'ropar' : 'skrattar', m: ropar ? 1 : 0, titt: 0.3, rot: 4 * Math.sin(Math.PI * f / 2), lyft: 4 * Math.abs(Math.sin(Math.PI * f)),
          tut: T.BRUM2.reduce((m, a) => Math.max(m, bump(del(a, a + 0.35, t))), 0) };
    // kameran glider lite åt höger och upp så att molnet får plats, och tillbaka till dansbilden i harpluften
    const q = mjuk(del(T.BR, T.BR + 1.5, t)) * (1 - mjuk(del(T.UPP, T.R - 1.3, t)));
    kam = [lerp(W / 2, W / 2 + 60, q), lerp(H / 2, H / 2 - 30, q), 1];
  } else {   // 04a: spanar åt vänster och höger; "jag och du": tittar på oss och nickar (i körscenen, ingen zoom in och ut före refrängen)
    const [s0, s1, s2] = T.SPANA;
    const pl = over(del(T.LETA, s0, t)) * (1 - mjuk(del(s1 - 0.2, s1 + 0.2, t)));   // vänster arm ut, sedan ner
    const pr = over(del(s1, s1 + 0.4, t)) * (1 - mjuk(del(s2, s2 + 0.3, t)));       // höger arm ut, sedan ner
    const sida = lerp(-1, 1, mjuk(del(s1 - 0.3, s1 + 0.3, t)));
    const spanar = mjuk(del(T.LETA, s0, t)) * (1 - mjuk(del(s2, s2 + 0.3, t)));
    const du = mjuk(del(T.DU - 0.1, T.DU + 0.3, t));
    b = { humor: du > 0.5 ? 'glad' : 'nyfiken', l: pl > 0.05 ? arm('l', [-3000, -400], pl) : undefined, r: pr > 0.05 ? arm('r', [2000, -1500], pr) : undefined,
          titt: lerp(lerp(0.5, sida, spanar), 0, du), tittY: -0.1 * spanar, rot: -6 * sida * spanar,
          lyft: 9 * du * Math.abs(Math.sin(Math.PI * f)) };   // nickar i takt

  }
  b.blink = blink(t, T.BLINK);
  bil.pose(korPose(t, b));
  bil.puffa(t, T.PUFF);
  tankebubbla(t);
  // närbilder på ansiktet (Sanna 2026-11-06: "more close crops on faces"): kameran glider in mot Bulles ansikte där känslan sitter i
  // texten och ut igen innan godiset och molnet behöver plats: "Björnen tycker brunt är gott! (Mmm!)" och "Björnen blundar … tänk om"
  const nar = T.ANSIKTE.find(([a, e]) => t > a && t < e);
  if (nar) { const [a, e, dx] = nar, q = mjuk(del(a, a + 0.7, t)) * (1 - mjuk(del(e - 0.7, e, t))), mal = ansikte(dx); kam = kam.map((v, i) => lerp(v, mal[i], q)); }
  kit.kamera(...kam);
}
