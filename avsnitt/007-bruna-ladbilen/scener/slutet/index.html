<!doctype html><html lang="sv"><head><meta charset="utf-8"><title>Slutet</title>
<style>
  html, body { margin:0; background:#000; overflow:hidden; }
  body > svg { position:absolute; inset:0; width:100vw; height:100vh; display:block; }
</style></head><body>
<!-- Avsnitt 007, slutet (storyboard 17), som 006:s och 005:s bild 17, sista biten av outrot. Kvar på kolastranden vid
     vattenrutschbanan (Sanna 2026-11-06, anteckning 15: "keep outro at kola scene"), där 16d i discot/ slutar: Bulle flyter i
     kolan och vinkar, helbild (rb.HEL), ingen kamerarörelse. Lilla Kvacks kritiris sluter sig runt hans ansikte, håller, stängs,
     en stjärnglimt i det svarta och slutar svart när sången tar slut.
     Avviker från formatet (bara zoom och kritsvep, och ett fast outro): samma avvikelse som 005 och 006, som Sanna bad om. -->
<script src="../kit.js"></script><script src="../../../../verktyg/kant.js"></script><script src="../ansikten.js"></script><script src="../v2-riggar.js"></script><script src="../v2.js"></script><script src="../lastbilen.js"></script><script src="../rutschbana.js"></script>
<script>
(async () => {
const { el, lerp, mjuk, del, BEAT, BEAT0 } = kit;
const M = await kit.manus();
const [a0, a1] = M.bild('17'), SLUT = a1 - a0;                            // till sångens slut
const K0 = a0 - M.av;                                                     // klipptid (sang-klippt.m4a) vid scenens t = 0
const D = a0 - M.bild('15a')[0];                                          // discot/:s scentid = t + D (samma klocka för vågorna)
const HEJ = M.klipp(M.rad('Hej då, hej då', { efter: 190 }).t) - K0;   // rader.txt 3:21.4, i scentid (före 17)
const fas = t => (t + K0 - BEAT0) / BEAT, kort = t => (fas(t) % 4) > 3.5;   // samma takt och ansikten som discot/
// irisen: sluter sig (1,4 s), håller (1 s), stängs (0,6 s); glimten i det svarta tills sången är slut
const IRIS = [0, 1.4, 3.4, 4.0], IRIS_R = 150, GLINT = IRIS[3] - 0.05, GLINT_T = SLUT - GLINT;

// ---------- kolastranden som i discot/ 16c–16d ----------
const L = kit.duk();
const rb = await rutschbana.ny(L, { kronor: 3 });
rb.syns(true);

// ---------- kritirisen, i bildrutan ovanpå allt, utanför kameran ----------
const irisG = kit.lager.overst;
const iris = el('path', { fill: '#000', 'fill-rule': 'evenodd' }, irisG);
const irisKant = el('path', { fill: 'none', stroke: '#fff8e0', 'stroke-linejoin': 'round' }, el('g', { filter: 'url(#boil)' }, irisG));
const glimt = el('path', { d: 'M0 -1 L.16 -.16 L1 0 L.16 .16 L0 1 L-.16 .16 L-1 0 L-.16 -.16Z', fill: '#fff8e0', opacity: 0 }, irisG);
kit.ljud('glitter', IRIS[0], { vol: 0.3 });   // irisen sluter sig (ljud.md: glitter lågt)

function render(t) {
  kit.kamera(...rb.HEL, false, true);   // still, ingen drift (runda 3 #24), som discot/ 16d
  const td = t + D, f = fas(t);
  rb.sasRita(td, M.bild('16c')[0] - M.bild('15a')[0]);   // kolasåsen har runnit av sedan 16c (syns inte)
  rb.dolj();
  // flyter i kolan och vinkar, som i slutet av 16d
  rb.stall(td, { x: rb.HAV_X, y: rb.HAV_Y + 6 * Math.sin(td * 2.2) + rb.vag(rb.HAV_X, td) * 0.6, humor: kort(t) ? 'njuter' : 'skrattar', m: 0.5, titt: 0,
    armar: { r: [1500 + 200 * Math.sin(f * Math.PI), -600 + 200 * Math.sin(f * Math.PI)], l: [380, 640] } });
  // nallen flyter bredvid på hans fria vänstra sida, som i 16d (samma förvalda x och klocka); kisar glatt på "Hej då" (före 17, så bara för skarven)
  rb.flytNalle(td, lastbilen.nalleUttryck(t, { glad: [HEJ] }));
  rb.fram(td);

  // en vinglig cirkel med nio bucklor som vrider sig sakta, runt Bulles ansikte; svart utanför, krämvit kant med #boil
  const [ix, iy] = rb.bulle.punkt([511, 400]);
  const ir = t < IRIS[1] ? lerp(1220, IRIS_R, mjuk(del(IRIS[0], IRIS[1], t))) : lerp(IRIS_R, 0, mjuk(del(IRIS[2], IRIS[3], t)));
  const ring = 'M' + Array.from({ length: 145 }, (_, i) => {
    const a = i / 144 * 2 * Math.PI, rr = ir * (1 + 0.07 * Math.sin(9 * a + t * 0.8));
    return `${(ix + rr * Math.cos(a)).toFixed(1)} ${(iy + rr * Math.sin(a)).toFixed(1)}`;
  }).join('L') + 'Z';
  iris.setAttribute('d', `M-50 -50H${kit.W + 50}V${kit.H + 50}H-50Z ${ring}`);
  irisKant.setAttribute('d', ir > 1 ? ring : '');
  irisKant.setAttribute('stroke-width', Math.min(14, ir / 4));
  const gl = t >= GLINT && t < SLUT ? Math.sin(Math.PI * (t - GLINT) / GLINT_T) : 0;
  glimt.setAttribute('transform', `translate(${ix} ${iy}) rotate(${30 * gl}) scale(${40 * mjuk(gl)})`);
  glimt.setAttribute('opacity', gl);
}

kit.kor(render, SLUT, { sang: [K0, K0 + SLUT] });   // sångbiten ur sang-klippt.m4a, till sångens slut
})();
</script></body></html>
