(async () => {

  const L = kit.duk('vagen');
  const bil = await lastbilen.ny(L.figurer, M);

  const D = S(M.bild('05h')[1]);
  kit.kor(t => { if (!r.rita(t)) { bil.pose({ x: 688, y: 735, h: 520 }); kit.kamera(); } }, D, { sang: [t0 - 11, t0 - 11 + D] });
