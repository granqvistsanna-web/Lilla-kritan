<!-- Hjältebilden till 007 v2:s miniatyr ("Brunt är den godaste färgen"), utan text: grodan skrattar i bruna lastbilen med armarna
     uppe, lammet i flaket. Inga träd eller moln. Renderas med `node ../../scener/render.mjs . --v2 3` i thumbnail/v2-hjalte/. -->
<script src="../../scener/kit.js"></script><script src="../../../../verktyg/kant.js"></script><script src="../../scener/ansikten.js"></script>
<script src="../../scener/v2-riggar.js"></script><script src="../../scener/v2.js"></script><script src="../../scener/lastbilen.js"></script>
<script>
(async () => {
  const { W, H } = kit;
  const M = await kit.manus();
  const L = kit.duk(kit.VAG_PLATTA);
  const v = kit.vag(L.plate); v.rulla(0); v.trad.style.display = 'none'; if (v.moln) v.moln.style.display = 'none';
  const bil = await lastbilen.ny(L.figurer, M);
  const lamm = await v2.figur('lammet-ludde', bil.flak, { h: 240, ben: true });
  const P = { x: 0.6 * W, y: 1.03 * H, h: 1.0 * H, tilt: -2, dist: 0, flagg: -6, humor: 'skrattar', titt: -0.2, lyft: 10,
    r: [1450, -520], l: [-480, -380], styr: 0, nalle: { humor: 'glad' } };
  await new Promise(r => setTimeout(r, 1500));
  kit.kor(() => { bil.pose(P); const [x, y] = bil.iBild([300, 505]);
    lamm.pose({ x, y, humor: 'skrattar', titt: 0.6, pose2: { armar: [40, 40] } }); }, 4);
})();
</script>
