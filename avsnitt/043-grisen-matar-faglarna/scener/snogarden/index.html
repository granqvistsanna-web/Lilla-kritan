<!doctype html>
<html lang="sv">

<body>
<!-- 043 Grisen matar fåglarna: hela kodscenen (grind 6). Ritverktygen och platserna är storyboardens (../../storyboard/scen.html),
     tiderna, Malin och effekterna ur rader.json (skrivs av storyboard/bygg.mjs). Rad 00 (logotypen) läggs på i film/satt-ihop.sh.
     Fåglarna: kroppen är urklippet, vingen, näbben och benen ritas i kod (../../fagel.js). Grisen är grisen-greta live med tomteluvan.
     Rendera från repots rot: node avsnitt/043-grisen-matar-faglarna/scener/render.mjs avsnitt/043-grisen-matar-faglarna/scener/snogarden [--snabb] -->
<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="korn" x="0" y="0" width="1" height="1">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="2"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.47  0 0 0 0 0.36  1.1 0 0 0 -0.47"/>
    </filter>
    <filter id="boil" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="5000">
      <feTurbulence id="brus" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
      <feDisplacementMap in="SourceGraphic" scale="2.5"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="#FAF8F2"/>
  <g id="kamera">
    <g id="platta"></g>
    <g id="bak"></g>
    <g filter="url(#boil)"><g id="sakerbak"></g></g>
    <g filter="url(#boil)"><g id="figurer"></g></g>
    <g filter="url(#boil)"><g id="saker"></g></g>
    <g filter="url(#boil)"><g id="faglar"></g></g>
    <g id="fram" filter="url(#boil)"></g>
    <g id="pilar"></g>
  </g>
  <g id="ram"></g>
  <g id="gomda" opacity="0"></g>
</svg>
<script src="/verktyg/blinka.js"></script>
<script src="/verktyg/kant.js"></script>
<script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script src="/avsnitt/043-grisen-matar-faglarna/fagel.js"></script>
<script src="/verktyg/kritan-ritar.js"></script>
<script>
const $ = id => document.getElementById(id);
const A = '/assets/', R = A + 'rekvisita/';
const lagg = (id, h) => $(id).insertAdjacentHTML('beforeend', h);
const bild = (href, w, h, t, extra = '') => `<image href="${href}" width="${w}" height="${h}" transform="${t}" ${extra}/>`;
const KARVE = R + 'julkarve/cut/julkarve.png', PASE = R + 'fropase/cut/fropase.png', PASE_TOM = R + 'fropase/cut/fropase-tom.png', LUVA = R + 'tomteluva/cut/tomteluva.png';
// ?bg=<mapp/fil> byter plattan (för att jämföra bakgrunder); annars snögården
const PLATTA = A + 'bakgrunder/' + (new URLSearchParams(location.search).get('bg') || 'bjorkdungen/bjorkdungen-platt.jpeg');   // platta björkdungen (Sanna 2026-11-19)
let TOM_FINNS = false;

let L, G; const GS = 0.45;
const GRIS0 = [700, 864], GRIS1 = [1010, 864], GRIS2 = [890, 864];   // GRIS1 nära kärven när den skakas (rad 25–32), GRIS2 bredvid taket (rad 33–)          // grisens fötter: vid stugan, sedan vid kärven (från rad 25)
let GRIS = GRIS0;
const iFig = ([px, py], [x, fot] = GRIS, s = GS) => [x + (px - 512) * s, fot + (py - L.FOTTER) * s];

// --- Tiden ---------------------------------------------------------------------------------------------------------------------
const kl = (k, a = 0, b = 1) => Math.max(a, Math.min(b, k)), lerp = (a, b, k) => a + (b - a) * k;
const mjuk = k => (k = kl(k), k * k * (3 - 2 * k)), del = (a, b, t) => mjuk((t - a) / (b - a));
const bump = (a, b, t) => (t <= a || t >= b) ? 0 : Math.sin(Math.PI * (t - a) / (b - a));
let TT = 0, CUR = null, RAD_L = [], RR = {}, ROSTER = [], DURATION = 0, BLINKA;
const SVART = 0.2;   // QA 27/11: 1,4 s helsvart före kalenderns outro, förut 0,6 + 0,3 s efter kritirisen
const mo = (i = 0) => CUR.malin[i][1], lo = (i = 0) => CUR.ljud[i][1], LN = n => ROSTER[n - 1][1];

// --- Kameran -------------------------------------------------------------------------------------------------------------------
function kamera(zoom = 1, cx = 960, cy = 540) {
  const tx = Math.max(1920 - 1920 * zoom, Math.min(0, 960 - cx * zoom)), ty = Math.max(1080 - 1080 * zoom, Math.min(0, 540 - cy * zoom));
  $('kamera').setAttribute('transform', `translate(${tx.toFixed(1)} ${ty.toFixed(1)}) scale(${zoom})`);
  $('brus').nextElementSibling.setAttribute('scale', (2.5 / zoom).toFixed(2)); $('brus').setAttribute('seed', 1 + Math.floor(TT * 6) % 50);   // line boil 2,5 px i bild, ny brusbild 6 gånger/s (CLAUDE.md)
}

// --- Effekter -----------------------------------------------------------------------------------------------------------------
const glans = (x, y, r, o = 1) => `<path transform="translate(${x} ${y}) scale(${r})" opacity="${o}" d="M0 -1 L.2 -.2 L1 0 L.2 .2 L0 1 L-.2 .2 L-1 0 L-.2 -.2Z" fill="#fff6c8" stroke="#e6b422" stroke-width=".06"/>`;
const skimmer = (x, y, k = 1, vidd = 1) => { if (k < 0.02) return; lagg('fram', [[-1, -0.7, 1], [1.1, -0.4, 0.8], [0.2, 1.1, 0.7], [-1.2, 0.8, 0.6]]
  .map(([dx, dy, s], i) => glans(x + dx * 40 * vidd, y + dy * 34 * vidd, 16 * s * k * vidd * (0.85 + 0.15 * Math.sin(TT * 5 + i * 2)), Math.min(1, 0.4 + k))).join('')); };
// Kritan ritar med verktyg/kritan-ritar.js (QA 27/11: den egna krit-koden drog ett streck i luften, teckningarna var bara konturen).
// TECKNING: kontur + detaljstreck i bildens pixlar, mätta mot bilderna (kritan-ritar-detaljerat-mjukt, teckningen-som-bilden).
const TECKNING = {
  fagel: [null, 'M353 139 Q400 160 412 200 Q418 250 400 294 Q370 345 329 376 Q300 405 271 418 Q245 425 224 418 Q190 418 165 406 Q150 380 159 353 Q170 300 200 247 Q230 185 271 165 Q310 140 353 139Z',   // vingen
    'M412 566 L412 676', 'M380 680 L446 679', 'M506 566 L506 676', 'M474 680 L540 679', 'M638 168 A14 14 0 1 1 610 168 A14 14 0 1 1 638 168'],   // benen, fötterna, ögat
  karve: [null, 'M165 372 Q205 360 247 378 Q290 362 326 368', 'M244 386 Q228 425 216 466', 'M253 388 Q268 415 279 440',   // bandet och rosettens band
    'M182 588 Q186 500 200 422', 'M313 588 Q308 500 295 422'],   // två strån
  tak: ['M352 10 Q505 140 676 300 Q712 330 704 392 L352 142 L14 392 Q6 330 40 300 Q200 140 352 10Z',   // taket (egen kontur: json-konturen har krokiga ben)
    'M32 336 Q190 205 354 78 Q520 205 690 336', 'M89 384 L89 1328', 'M621 384 L621 1328'],   // snökanten, benen
};
const VILA = { fagel: [0.8], karve: [0.6], tak: [0.4] };
// teckning(namn, t, k, sk, f): strecken fram till k (0–1) i bildens transform t (sk = bildens skala), tonas bort med fyllningen f;
// ger spetsen, start och slut i scenens koordinater (genom samma transform, så att kritan sitter i linjens ände)
function teckning(namn, t, k, sk, f = 0) {
  const R = ritBana(TECKNING[namn], k, { vila: VILA[namn], attr: `fill="none" stroke="${KRITAN.LINJE}" stroke-width="${(KRITAN.BRED / sk).toFixed(1)}" stroke-linecap="round" stroke-linejoin="round" opacity="${linjeOpacitet(f).toFixed(2)}"` });
  lagg('pilar', `<g transform="${t}">${f < 1 ? R.html : ''}</g>`);
  const m = $('kamera').getCTM().inverse().multiply($('pilar').lastElementChild.getCTM()), P = ([x, y]) => { const q = new DOMPoint(x, y).matrixTransform(m); return [q.x, q.y]; };
  return { spets: P(R.spets), start: P(R.start), slut: P(R.slut) };
}
// kritan genom hela förloppet (kritaFas), T i scenens sekunder
const krita = (T, R, vanta, s) => { if (!R) return; const kr = kritaFas(TT, T, { ...R, vanta, s }); if (kr) lagg('pilar', kritaBild(kr.x, kr.y, kr)); };
const kFas = (T, t = TT) => ritfart((t - T.rit[0]) / (T.rit[1] - T.rit[0]));
const T_FAGEL = () => ({ in: [0, 0.4], rit: [0.4, 6.7], vanta: [RR['01b'].s, RR['01b'].s + 0.8], ut: [RR['01c'].s + 0.6, RR['01c'].s + 1.4] });
const T_KARVE = () => { const a = RR['11a'].s + RR['11a'].ljud[0][1]; return { in: [a - 0.5, a], rit: [a, a + 4.9], vanta: [RR['11b'].s, RR['11b'].s + 0.8], ut: [RR['11c'].s + 0.4, RR['11c'].s + 1.2] }; };
const T_TAK = () => { const a = RR['34a'].s + RR['34a'].ljud[0][1]; return { in: [a - 0.5, a], rit: [a, a + 3.3], vanta: [RR['34b'].s, RR['34b'].s + 0.8], ut: [RR['34c'].s + 0.4, RR['34c'].s + 1.2] }; };
const papper = () => { $('platta').innerHTML = `<rect x="-200" y="-200" width="2400" height="1500" fill="#FBF7EE"/><rect x="-200" y="-200" width="2400" height="1500" filter="url(#korn)"/>`; };
function kritiris(r, [cx, cy]) {
  if (r >= 1500) return;
  const ring = 'M' + Array.from({ length: 145 }, (_, j) => { const a = j / 144 * 2 * Math.PI, rr = r * (1 + 0.06 * Math.sin(9 * a + TT * 0.8));
    return `${(cx + rr * Math.cos(a)).toFixed(1)} ${(cy + rr * Math.sin(a)).toFixed(1)}`; }).join('L') + 'Z';
  lagg('ram', `<path d="M-50 -50H1970V1130H-50Z ${r > 1 ? ring : ''}" fill="#101010" fill-rule="evenodd"/>
    ${r > 1 ? `<path d="${ring}" fill="none" stroke="#fff8e0" stroke-width="${Math.min(14, r / 4)}" stroke-linejoin="round" filter="url(#boil)"/>` : ''}`);
}
const flinga = (x, y, s = 1) => lagg('fram', `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${s}) rotate(${(TT * 40) % 360})" stroke-linecap="round">
  <path d="M0 -14V14M-14 0H14M-10 -10L10 10M10 -10L-10 10" stroke="#c9d8e6" stroke-width="9"/><path d="M0 -14V14M-14 0H14M-10 -10L10 10M10 -10L-10 10" stroke="#fff" stroke-width="5"/></g>`);

// --- Snögården ----------------------------------------------------------------------------------------------------------------
// fåglarnas hem: fågelholken vid högerkanten (björkdungen, mätt i 1920 × 1080): hålet (1862, 570), taket överst y 440
const HOLK = [1862, 570], GRAN = HOLK;
const FRON = [[880, 878], [915, 886], [950, 874], [985, 884], [1020, 879], [1055, 888], [1090, 876], [940, 893], [1010, 895], [1070, 896], [900, 894], [1040, 870]];
// snö: tat 0–1 hur många flingor faller (i hela bilden, i lugn takt)
const snofall = tat => tat > 0.01 && lagg('fram', Array.from({ length: Math.round(90 * tat) }, (_, i) => {
  const a = Math.abs(Math.sin(i * 127.1 + 311.7) * 43758.5453 % 1), b = Math.abs(Math.sin(i * 71.3 + 17.1) * 9631.7 % 1), st = i % 3;
  const v = [40, 58, 80][st], y = -30 + ((b * 1140 + TT * v) % 1140), x = a * 1960 - 20 + 14 * Math.sin(TT * 0.8 + i);
  return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${[3.5, 5, 7][st]}" fill="#fff" opacity="${[0.7, 0.85, 0.95][st]}"/>`; }).join(''));
// gården: spar = fotspåren bakom grisen (antal), fron = andelen frön kvar på snön (0–1), sno = snöfall
function gard({ spar = 0, fron = 0, sno = 0 } = {}) {
  $('platta').innerHTML = `<image href="${PLATTA}" width="1920" height="1080" preserveAspectRatio="xMidYMid slice"/>`;
  if (spar) lagg('bak', Array.from({ length: Math.floor(spar) }, (_, i) => `<ellipse cx="${60 + i * 80}" cy="${874 + (i % 2) * 12}" rx="15" ry="6.5" fill="#b9c9d8" opacity=".55"/>`).join(''));
  const n = Math.round(FRON.length * kl(fron));
  if (n) lagg('bak', FRON.slice(0, n).map(([x, y], i) => `<ellipse cx="${x}" cy="${y}" rx="7" ry="4.5" transform="rotate(${i * 37} ${x} ${y})" fill="#8a5a2b" stroke="#fff" stroke-width="2"/>`).join(''));
  snofall(Math.max(sno, SNO_BAS));
}
// Sanna 2026-11-21 (J16 1:16, 2:55 "light snow all video"): ett svagt, lugnt snöfall i hela snögården, samma flingor hela vägen
const SNO_BAS = 0.3;
// julkärven: foten (stångens nederkant, bildens 243, 890) i (x, y), skala 0,5
const KARV = [1250, 884, 0.5], KTOPP = [KARV[0], KARV[1] - 870 * KARV[2]];
const vaj = () => 0.8 * Math.sin(TT * 1.1) + 0.3 * Math.sin(TT * 2.3);   // kärven i vinden, grader
const karveT = () => `translate(${KARV[0] - 243 * KARV[2]} ${KARV[1] - 890 * KARV[2]}) scale(${KARV[2]})`;
// snön på kärven (Sanna 2026-11-20: mer snö): en tjock mössa som rinner ner över axen och klumpar på kärven, som skakas av
function snoKarve(x, t, sp) {
  const th = 36 + 50 * kl(sp / 1.2), y = v => (t + v).toFixed(1), X = v => (x + v).toFixed(1), kl2 = kl((sp - 0.35) * 1.6);
  const mossa = `M${X(-122)} ${y(34)} Q${X(-112)} ${y(-18)} ${X(-48)} ${y(-14)} Q${X(-4)} ${y(-34)} ${X(44)} ${y(-16)} Q${X(110)} ${y(-14)} ${X(126)} ${y(34)}
    Q${X(118)} ${y(th)} ${X(98)} ${y(th - 8)} Q${X(84)} ${y(th + 24)} ${X(62)} ${y(th - 4)} Q${X(22)} ${y(th + 12)} ${X(-8)} ${y(th - 6)}
    Q${X(-38)} ${y(th + 28)} ${X(-62)} ${y(th - 6)} Q${X(-100)} ${y(th + 6)} ${X(-122)} ${y(34)}Z`;
  const klumpar = [[-72, 112, 16], [56, 122, 14], [-24, 148, 15], [84, 96, 12], [10, 172, 12], [-56, 160, 10]]
    .map(([dx, dy, r]) => `<ellipse cx="${X(dx)}" cy="${y(dy)}" rx="${r}" ry="${(r * 0.6).toFixed(1)}" fill="#fdfdfb" stroke="#c9d8e6" stroke-width="3"/>`).join('');
  return `<g opacity="${kl(0.3 + sp).toFixed(2)}"><path d="${mossa}" fill="#fdfdfb" stroke="#c9d8e6" stroke-width="5"/></g>${kl2 > 0.02 ? `<g opacity="${kl2.toFixed(2)}">${klumpar}</g>` : ''}`;
}
function karve({ fyll = 1, snoPa = 0, tak = 0, v = 0 } = {}) {
  const [x, y] = KARV, t = KTOPP[1];
  lagg('sakerbak', `<g transform="rotate(${v.toFixed(2)} ${x} ${y})">${fyll > 0 ? `<g transform="${karveT()}"><clipPath id="kf"><circle cx="243" cy="300" r="${(700 * fyll).toFixed(1)}"/></clipPath>
    <image href="${KARVE}" width="487" height="894" clip-path="url(#kf)"/></g>` : ''}
    ${snoPa > 0.02 ? snoKarve(x, t, snoPa) : ''}</g>`);
  if (tak) takSvg(tak);
}
// taket på ben över kärven (julkarve-tak.png, Flow-tagning 4, Sanna 2026-11-19): benens mitt (358, 1334) på marken under kärven, skala 0,5
const TS = 0.5, TAKB = R + 'julkarve/cut/julkarve-tak.png';
const takT = () => `translate(${KARV[0] - 358 * TS} ${KARV[1] - 1334 * TS}) scale(${TS})`;
const TAK = { x: KARV[0], y: KARV[1] - 1134 * TS };   // takets mitt
// taket: fyll = ifyllnaden (0–1, inifrån och ut), k = kritans streck (0–1); snön är målad på bilden
function takSvg(fyll = 1, k = 1) {
  if (fyll > 0) lagg('sakerbak', `<g transform="${takT()}"><clipPath id="tf"><circle cx="358" cy="250" r="${(1500 * fyll).toFixed(1)}"/></clipPath>
    <image href="${TAKB}" width="712" height="1341" clip-path="url(#tf)"/></g>`);
  return fyll < 1 ? teckning('tak', takT(), k, TS, fyll) : null;
}

// --- Fåglarna (../../fagel.js) --------------------------------------------------------------------------------------------------
// Spegelvända klistermärken som alltid tittar åt vänster (mot grisen). fagel(f, x, y, { flax, oppen, tilt, ben, s, lager, klipp })
const FS = { rod: 0.13, gul: 0.13, bla: 0.105 }, FNR = { rod: 0, gul: 1, bla: 2 };
function fagel(f, x, y, { s = FS[f], flax = 0, oppen = 0, tilt = 0, ben = flax, lager = 'faglar', lyft = 0, klipp = '' } = {}) {
  const i = FNR[f], blink = ((TT + i * 1.3) % (3.1 + i * 0.4)) < 0.12 ? 1 : 0, andas = 1 + 0.015 * Math.sin(TT * 3 + i);
  lagg(lager, `<g ${klipp}><g transform="translate(${x.toFixed(1)} ${(y - lyft).toFixed(1)}) scale(${-s} ${s * andas}) rotate(${tilt.toFixed(1)}) translate(-400 -689)">
    ${fagelSvg(f, { t: TT + i * 0.07, flax, oppen, blink, ben })}</g></g>`);
}
// flygtur från A till B under tiden a–b (i raden), båge h; före a står den i A, efter b i B
function flyg(f, A, B, a, b, tl, { h = 120, o = {} } = {}) {
  const u = kl((tl - a) / (b - a));
  if (u <= 0 || u >= 1) { const P = u <= 0 ? A : B, land = u >= 1 ? bump(b, b + 0.25, tl) : 0;
    return fagel(f, P[0], P[1], { ...o, lyft: (o.lyft || 0) - 6 * land }); }
  const k = mjuk(u), x = lerp(A[0], B[0], k), y = lerp(A[1], B[1], k) - h * Math.sin(Math.PI * u);
  fagel(f, x, y, { ...o, flax: u < 0.88 ? 1 : (1 - u) / 0.12, ben: 1 - del(0.75, 1, u), tilt: -10 * Math.sin(Math.PI * u) });
}
// pick och pip: tider i raden → lutning och näbb
const pickT = (tl, tider) => tider.reduce((s, a) => s + bump(a - 0.1, a + 0.25, tl), 0);
const pipT = (tl, tider) => tider.reduce((s, a) => s + bump(a - 0.05, a + 0.3, tl), 0);
const pick = (tl, tider) => ({ tilt: 24 * pickT(tl, tider), oppen: 0.5 * pickT(tl, tider) });
const pip = (tl, tider) => ({ oppen: pipT(tl, tider), lyft: 7 * pipT(tl, tider) });
const VID_FRON = { rod: [930, 888], gul: [1025, 892], bla: [1110, 888] };
const PA_KARV = { rod: [KARV[0] - 70, KTOPP[1] + 30], gul: [KARV[0] + 5, KTOPP[1] + 12], bla: [KARV[0] + 78, KTOPP[1] + 32] };
// på holkens snötak (rod, gul) och inne i hålet (bla)
const I_GRAN = { rod: [1828, 452], gul: [1886, 446], bla: [HOLK[0], HOLK[1] + 30] };
// en fågel ensam på holkens tak i närbilden HOLKN (rad 4 och 5): på snön strax vänster om nocken
const HOLK_TAK = [1860, 445];
const FRAMFOR = { rod: [1060, 900], gul: [1130, 904], bla: [1195, 898] };
// hopp: tider i raden (ett hopp tar 0,32 s) med steg i x per hopp → { dx, lyft } att lägga på fågelns plats
const hopp = (tl, steg) => steg.reduce((o, [a, dx]) => { const w = kl((tl - a) / 0.32); return { dx: o.dx + dx * mjuk(w), lyft: o.lyft + 22 * Math.sin(Math.PI * w) }; }, { dx: 0, lyft: 0 });
const alla = (plats, o = {}) => ['rod', 'gul', 'bla'].forEach(f => fagel(f, ...plats[f], o[f] ?? {}));

// --- Grisen med tomteluvan och påsen --------------------------------------------------------------------------------------------
const P = o => ({ ...L.POSE0, ...o });
const F = (n, o = {}) => ({ ...L.blanda('neutral', n, 1), ...(['glad', 'jatteglad', 'fnissig', 'stolt', 'flinar', 'kawaii'].includes(n) ? { glad: [0, 0] } : {}), ...o });
// påsen: null = ingen, 'hand' = i handen (v vinkel, tom), 'snö' = ligger tom på snön bredvid grisen
let PASEN = null;
function gris(f, p = {}, { x = GRIS[0], fot = GRIS[1], s = GS } = {}) {
  $('figurer').appendChild(G);
  G.setAttribute('transform', `translate(${x} ${fot}) scale(${s}) translate(-512 ${-L.FOTTER})`);
  if ((f.sov || 0) < 0.5) { const a = (1 - Math.cos(2 * Math.PI * TT / 3.6)) / 2; f = BLINKA(f, TT);
    p = { ...p, strack: (p.strack || 0) + 0.012 * a, bred: (p.bred || 0) + 0.006 * a, oron: (p.oron || [0, 0]).map(o => o - 2 * a) }; }
  // noffen: trynet och kroppen gör en liten knyck när grisens ljud hörs
  const n = (CUR.ljud || []).filter(([fil]) => /^noff/.test(fil)).reduce((s, [, o]) => s + bump(o - 0.05, o + 0.35, TT - CUR.s), 0);
  if (n > 0.01) p = { ...p, strack: (p.strack || 0) + 0.03 * n, oron: (p.oron || [0, 0]).map(o => o - 8 * n) };
  if (PASEN) p = { ...p, armar: [p.armar ? p.armar[0] : 0, (p.armar ? p.armar[1] : 0) + 50] };   // påsarmen (höger i bild) lite ut från kroppen
  L.rita(G, f, P(p));
  if (PASEN) rPase({ ...PASEN, lager: 'sakerbak' });
}
// handens spets i scenen: punkten (832, 650) i arm-r-bildens ruta (armen till höger i bild, armar[1]), genom armens transform.
// Påsen ligger bakom tassen (receptet: tassen framför saken).
function hand() { const e = G.querySelector('image.arm-r'), m = $('kamera').getCTM().inverse().multiply(e.getCTM());
  const q = new DOMPoint(832, 650).matrixTransform(m); return [q.x, q.y]; }

  return ut.filter(c => c.t < DURATION);

}
