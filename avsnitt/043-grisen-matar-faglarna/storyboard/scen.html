<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Grisen matar fåglarna scener</title>
<style>html, body { margin:0; background:#000; } svg { width:100vw; height:auto; display:block; }</style>
</head>
<body>
<!-- 043 Grisen matar fåglarna: kodscenerna för storyboarden. window.rad(id) ritar radens stillbild (id som i rader.mjs, ?rad=14 visar en).
     Serveras från repots rot (bygg.mjs). Förlaga: 040 storyboard/scen.html. Snögården (bakgrunder/snogarden.md), grisen-greta live ur
     uttryck.html med tomteluvan (som lucka 23), småfåglarna som saker (kropp + lös vinge + öga i kod, som prov/flyg/), julkärven, fröpåsen.
     Fåglarna är spegelvända klistermärken som alltid tittar åt vänster (mot grisen); de vänds aldrig under en rörelse.
     Rörelsepilar (lila, streckade) finns bara i storyboarden. -->
<svg viewBox="0 0 1920 1080">
  <defs>
    <filter id="boil" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="5000">
      <feTurbulence id="brus" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
      <feDisplacementMap in="SourceGraphic" scale="5"/>
    </filter>
    <radialGradient id="sken"><stop offset="0" stop-color="#FFE38A" stop-opacity=".85"/><stop offset="1" stop-color="#FFE38A" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="#FAF8F2"/>
  <g id="kamera">
    <g id="platta"></g>
    <g id="bak"></g>
    <g filter="url(#boil)"><g id="sakerbak"></g></g>
    <g filter="url(#boil)"><g id="figurer"></g></g>
    <g filter="url(#boil)"><g id="saker"></g></g>
    <g id="fram" filter="url(#boil)"></g>
    <g id="pilar"></g>
  </g>
  <g id="ram"></g>
  <g id="gomda" opacity="0"></g>
</svg>
<script src="/verktyg/blinka.js"></script>
<script src="/verktyg/kant.js"></script>
<script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script>
const $ = id => document.getElementById(id);
const A = '/assets/', R = A + 'rekvisita/';
const lagg = (id, h) => $(id).insertAdjacentHTML('beforeend', h);
const bild = (href, w, h, t, extra = '') => `<image href="${href}" width="${w}" height="${h}" transform="${t}" ${extra}/>`;
const KRITA = R + 'krita-rod/cut/krita-rod.png', KRITA_SPETS = [742, 132];
const FAG = R + 'smafaglar/cut/', KARVE = R + 'julkarve/cut/julkarve.png', PASE = R + 'fropase/cut/fropase.png', LUVA = R + 'tomteluva/cut/tomteluva.png';
const PLATTA = A + 'bakgrunder/snogarden/snogarden.jpeg';
let KONTUR = {};

let L, G; const GS = 0.45;                            // riggen, grisens grupp, skalan i gården
const GRIS = [700, 864];                              // grisens fötter (snögården: fötter på 80 % av höjden)
const iFig = ([px, py], [x, fot] = GRIS, s = GS) => [x + (px - 512) * s, fot + (py - L.FOTTER) * s];

// --- Kameran: zoom 1 = hela plattan; visar aldrig utanför bakgrunden -------------------------------------------------------
function kamera(zoom = 1, cx = 960, cy = 540) {
  const tx = Math.max(1920 - 1920 * zoom, Math.min(0, 960 - cx * zoom)), ty = Math.max(1080 - 1080 * zoom, Math.min(0, 540 - cy * zoom));
  $('kamera').setAttribute('transform', `translate(${tx.toFixed(1)} ${ty.toFixed(1)}) scale(${zoom})`);
  $('brus').nextElementSibling.setAttribute('scale', (5 / zoom).toFixed(2));
}

// --- Effekter och notation ---------------------------------------------------------------------------------------------------
const glans = (x, y, r, o = 1) => `<path transform="translate(${x} ${y}) scale(${r})" opacity="${o}" d="M0 -1 L.2 -.2 L1 0 L.2 .2 L0 1 L-.2 .2 L-1 0 L-.2 -.2Z" fill="#fff6c8" stroke="#e6b422" stroke-width=".06"/>`;
const skimmer = (x, y, k = 1, vidd = 1) => lagg('fram', [[-1, -0.7, 1], [1.1, -0.4, 0.8], [0.2, 1.1, 0.7], [-1.2, 0.8, 0.6]]
  .map(([dx, dy, s]) => glans(x + dx * 40 * vidd, y + dy * 34 * vidd, 16 * s * k * vidd, Math.min(1, 0.4 + k))).join(''));
const pil = (d, x, y, v, s = 6) => `<g fill="none" stroke="#7b2cbf" stroke-width="${s}" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
  <path d="${d}" stroke-dasharray="${3 * s} ${2.4 * s}"/><path d="M${x + 5 * s * Math.cos(v + 2.6)} ${y + 5 * s * Math.sin(v + 2.6)} L${x} ${y} L${x + 5 * s * Math.cos(v - 2.6)} ${y + 5 * s * Math.sin(v - 2.6)}"/></g>`;
const rakpil = (x0, y0, x1, y1, s) => pil(`M${x0} ${y0} L${x1} ${y1}`, x1, y1, Math.atan2(y1 - y0, x1 - x0), s);
const bagpil = (x0, y0, cx, cy, x1, y1, s) => pil(`M${x0} ${y0} Q${cx} ${cy} ${x1} ${y1}`, x1, y1, Math.atan2(y1 - cy, x1 - cx), s);
const pilar = (...p) => lagg('pilar', p.join(''));
const nickpil = (x, y, s = 5) => pilar(bagpil(x + 40, y - 30, x + 70, y + 10, x + 40, y + 50, s), bagpil(x + 70, y + 50, x + 100, y + 10, x + 70, y - 30, s));
const skakpil = (x, y, s = 5) => pilar(pil(`M${x - 80} ${y} Q${x} ${y - 36} ${x + 80} ${y}`, x + 80, y, 0.6, s), pil(`M${x + 80} ${y + 22} Q${x} ${y - 14} ${x - 80} ${y + 22}`, x - 80, y + 22, Math.PI - 0.6, s));
const text = (x, y, t, s = 34) => lagg('fram', `<text x="${x}" y="${y}" style="font:800 ${s}px Fredoka,system-ui;fill:#7b2cbf">${t}</text>`);
const krita = (x, y, v = 125, s = 0.33) => lagg('pilar', bild(KRITA, 755, 265, `translate(${x} ${y}) rotate(${v}) scale(${s}) translate(${-KRITA_SPETS[0]} ${-KRITA_SPETS[1]})`));
function kontur(namn, t, k, bredd, farg = '#9a8a7a') {   // en kontur (json ur verktyg/kontur.py) ritad till andelen k; returnerar kritans spets
  lagg('pilar', `<g transform="${t}"><path id="k-${namn}" d="${KONTUR[namn].d}" pathLength="1" fill="none" stroke="${farg}" stroke-width="${bredd}"
    stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="${k} 2"/></g>`);
  const p = $('k-' + namn), q = p.getPointAtLength(p.getTotalLength() * Math.min(0.999, k)), sm = $('kamera').getCTM().inverse().multiply(p.getCTM());
  const pt = new DOMPoint(q.x, q.y).matrixTransform(sm); return [pt.x, pt.y];
}
const papper = () => { $('platta').innerHTML = `<rect x="-200" y="-200" width="2400" height="1500" fill="#F6EFE3"/>
  <rect x="120" y="70" width="1680" height="940" rx="14" fill="#FDFBF4" stroke="#e8e0cf" stroke-width="6"/>`; };

// --- Snögården ---------------------------------------------------------------------------------------------------------------
const GRAN = [1640, 690];                             // mitt i granen (x 78–93 %, toppen y 475)
const FRON = [[880, 878], [915, 886], [950, 874], [985, 884], [1020, 879], [1055, 888], [1090, 876], [940, 893], [1010, 895], [1070, 896]];
function gard({ spar = 0, fron = 0, sno = 0 } = {}) {
  $('platta').innerHTML = `<image href="${PLATTA}" width="1920" height="1080" preserveAspectRatio="xMidYMid slice"/>`;
  if (spar) lagg('bak', Array.from({ length: 6 }, (_, i) => `<ellipse cx="${80 + i * 95}" cy="${872 + (i % 2) * 14}" rx="16" ry="7" fill="#b9c9d8" opacity=".55"/>`).join(''));
  if (fron) lagg('bak', FRON.slice(0, Math.round(FRON.length * fron)).map(([x, y], i) => `<ellipse cx="${x}" cy="${y}" rx="7" ry="4.5" transform="rotate(${i * 37} ${x} ${y})" fill="#8a5a2b" stroke="#fff" stroke-width="2"/>`).join(''));
  if (sno) lagg('fram', Array.from({ length: Math.round(70 * sno) }, (_, i) => `<circle cx="${(i * 277) % 1920}" cy="${(i * 163) % 1000}" r="${4 + i % 4}" fill="#fff" opacity=".9"/>`).join(''));
}
// julkärven på sin stång: foten (stångens nederkant, bildens 243, 890) i (x, y)
const KARV = [1250, 884, 0.5], KTOPP = [KARV[0], KARV[1] - 870 * KARV[2]];   // kärvens topp (axen) i scenen
const karveT = ([x, y, s] = KARV) => `translate(${x - 243 * s} ${y - 890 * s}) scale(${s})`;
function karve({ fyll = 1, snoPa = 0, tak = 0, v = 0 } = {}) {
  const [x, y] = KARV;
  lagg('sakerbak', `<g transform="rotate(${v} ${x} ${y})">${fyll ? `<g transform="${karveT()}"><clipPath id="kf"><circle cx="243" cy="300" r="${700 * fyll}"/></clipPath>
    <image href="${KARVE}" width="487" height="894" clip-path="url(#kf)"/></g>` : ''}
    ${snoPa ? `<path d="M${x - 108} ${KTOPP[1] + 40} Q${x - 90} ${KTOPP[1] - 14} ${x - 30} ${KTOPP[1] - 8} Q${x + 10} ${KTOPP[1] - 26} ${x + 50} ${KTOPP[1] - 10} Q${x + 104} ${KTOPP[1] - 6} ${x + 112} ${KTOPP[1] + 40} Q${x} ${KTOPP[1] + 50 + 30 * snoPa} ${x - 108} ${KTOPP[1] + 40}Z" fill="#fdfdfb" stroke="#c9d8e6" stroke-width="5" opacity="${Math.min(1, 0.5 + snoPa)}"/>` : ''}</g>`);
  if (tak) takSvg(tak);
}
// taket som kritan ritar över kärven: två stolpar och ett rött sadeltak med snö (i kod). k = konturen, fyll = ifyllnaden.
const TAK = { x: KARV[0], y: KTOPP[1] - 70, b: 330 };
const TAKD = (() => { const { x, y, b } = TAK; return `M${x - b / 2 - 20} ${y + 40} L${x} ${y - 80} L${x + b / 2 + 20} ${y + 40}Z M${x - b / 2 + 10} ${y + 40} V${KARV[1]} M${x + b / 2 - 10} ${y + 40} V${KARV[1]}`; })();
function takSvg(fyll = 1, k = 1) {
  const { x, y, b } = TAK;
  if (fyll) lagg('saker', `<g opacity="${fyll}"><path d="M${x - b / 2 + 10} ${y + 40} V${KARV[1]} M${x + b / 2 - 10} ${y + 40} V${KARV[1]}" stroke="#fff" stroke-width="22" stroke-linecap="round"/>
    <path d="M${x - b / 2 + 10} ${y + 40} V${KARV[1]} M${x + b / 2 - 10} ${y + 40} V${KARV[1]}" stroke="#8a5a34" stroke-width="13" stroke-linecap="round"/>
    <path d="M${x - b / 2 - 20} ${y + 40} L${x} ${y - 80} L${x + b / 2 + 20} ${y + 40}Z" fill="#c8423a" stroke="#fff" stroke-width="9" stroke-linejoin="round"/>
    <path d="M${x - b / 2 - 6} ${y + 26} L${x} ${y - 66} L${x + b / 2 + 6} ${y + 26}" fill="none" stroke="#a83630" stroke-width="5" opacity=".6"/>
    <path d="M${x - b / 2 - 24} ${y + 30} L${x} ${y - 92} L${x + b / 2 + 24} ${y + 30} Q${x + 60} ${y - 40} ${x} ${y - 66} Q${x - 60} ${y - 40} ${x - b / 2 - 24} ${y + 30}Z" fill="#fdfdfb"/></g>`);
  if (k < 1 || !fyll) { lagg('pilar', `<path id="k-tak" d="${TAKD}" pathLength="1" fill="none" stroke="#9a8a7a" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="${k} 2"/>`);
    const p = $('k-tak'), q = p.getPointAtLength(p.getTotalLength() * Math.min(0.999, k)); return [q.x, q.y]; }
  return null;
}
// fröpåsen (612 × 774) i grisens hand: handens spets (JMATT 'grisen-greta' hand [832, 650]), påsens mitt där. upp = påsen upp och ner.
function pase({ x, y, s = 0.2, v = 0, tom = 0 } = {}) {
  if (x == null) [x, y] = iFig([860, 640]);
  lagg('saker', bild(PASE, 612, 774, `translate(${x} ${y}) rotate(${v}) scale(${s}) translate(-306 -420)`, tom ? 'opacity=".95"' : ''));
}
const fallFron = (x, y) => lagg('fram', [[0, 30], [14, 60], [-8, 90], [22, 120], [4, 150]].map(([dx, dy], i) => `<ellipse cx="${x + dx + i * 12}" cy="${y + dy}" rx="7" ry="4.5" fill="#8a5a2b" stroke="#fff" stroke-width="2"/>`).join(''));

// --- Småfåglarna: kropp 800 × 689 (fötterna i 400, 689), vinge med roten (150, 140) på ryggen (310, 230), ögat (632, 237) -----------
// fagel(f, x, y, { s, flax 0 vila / 1 uppslag / -1 nedslag, tilt, luta (huvudet), vanster: tittar åt vänster (spegelvänd, standard) })
const FS = { rod: 0.13, gul: 0.13, bla: 0.105 };
function fagel(f, x, y, { s = FS[f], flax = 0, tilt = 0, vanster = true, lager = 'saker', blink = 0 } = {}) {
  const vr = flax > 0 ? -105 : flax < 0 ? 18 : 0;
  lagg(lager, `<g transform="translate(${x} ${y}) scale(${vanster ? -s : s} ${s}) rotate(${tilt}) translate(-400 -689)">
    <image href="${FAG}fagel-kropp-${f}.png" width="800" height="689"/>
    <ellipse cx="632" cy="237" rx="22" ry="${blink ? 3 : 22}" fill="#2B2321"/>${blink ? '' : '<circle cx="627" cy="231" r="6.5" fill="#fff"/>'}
    <image href="${FAG}fagel-vinge-${f}.png" width="675" height="606" transform="translate(310 230) scale(0.42) rotate(${vr}) translate(-150 -140)"/></g>`);
}
// där fåglarna står: vid fröna på snön, på kärvens topp, framför grisen
const VID_FRON = { rod: [930, 888], gul: [1025, 892], bla: [1110, 888] };
const PA_KARV = { rod: [KARV[0] - 70, KTOPP[1] + 30], gul: [KARV[0] + 5, KTOPP[1] + 12], bla: [KARV[0] + 78, KTOPP[1] + 32] };
const FRAMFOR = { rod: [880, 890], gul: [980, 896], bla: [1070, 892] };
const alla = (plats, o = {}) => ['rod', 'gul', 'bla'].forEach(f => fagel(f, ...plats[f], o[f] ?? {}));

// --- Grisen med tomteluvan ---------------------------------------------------------------------------------------------------
const P = o => ({ ...L.POSE0, ...o });
// glada ansikten har öppna ögon (bilderbokens regel); blunda bara där raden ber om det
const F = (n, o = {}) => ({ ...L.blanda('neutral', n, 1), ...(['glad', 'jatteglad', 'fnissig', 'stolt', 'flinar', 'kawaii'].includes(n) ? { glad: [0, 0] } : {}), ...o });
function gris(f, p = {}, { x = GRIS[0], fot = GRIS[1], s = GS } = {}) {
  $('figurer').appendChild(G);
  G.setAttribute('transform', `translate(${x} ${fot}) scale(${s}) translate(-512 ${-L.FOTTER})`);
  L.rita(G, f, P(p));
}
const VINKA = { armar: [0, 150] };
const huvud = (dx = 0, y = 250) => iFig([512 + dx, y]);
const HEL = () => kamera(1), HALV = () => kamera(1.6, 960, 680), ANS = () => kamera(2.4, GRIS[0], iFig([512, 430])[1]),
  KARVN = () => kamera(2.3, KARV[0], KTOPP[1] + 120), PASEN = () => kamera(2.4, ...iFig([780, 560])), GRANN = () => kamera(2.6, GRAN[0], GRAN[1]);

// --- Ritintrot: kritan ritar den lilla blå fågeln på papperet -----------------------------------------------------------------
const PF = [960, 760, 0.62];                          // fågelns fötter och skala på papperet
function papperFagel(k, fyll) { papper(); kamera(1);
  const [x, y, s] = PF, t = `translate(${x} ${y}) scale(${-s} ${s}) translate(-400 -689)`;
  if (fyll > 0) lagg('saker', `<g transform="${t}"><clipPath id="pf"><circle cx="420" cy="380" r="${620 * fyll}"/></clipPath><g clip-path="url(#pf)">
    <image href="${FAG}fagel-kropp-bla.png" width="800" height="689"/><ellipse cx="632" cy="237" rx="22" ry="22" fill="#2B2321"/><circle cx="627" cy="231" r="6.5" fill="#fff"/>
    <image href="${FAG}fagel-vinge-bla.png" width="675" height="606" transform="translate(310 230) scale(0.42) translate(-150 -140)"/></g></g>`);
  if (fyll < 1) { const sp = kontur('fagel', t, k, 10 / s); if (k < 1) krita(...sp, 125, 0.42); else krita(1420, 320, 140, 0.42); }
}

// --- Raderna ---------------------------------------------------------------------------------------------------------------
const kort = () => lagg('ram', `<rect width="1920" height="1080" fill="#FBF7EE"/>
  <text x="960" y="560" style="font:700 120px Fredoka,'Arial Rounded MT Bold',system-ui;fill:#e2574c;text-anchor:middle">Lilla Kritan</text>
  <text x="960" y="700" style="font:700 30px system-ui;fill:#c0392b;text-anchor:middle">logotypen i 1 s (ingen jingel, inget titelkort)</text>`);
const RAD = {
  '00': () => kort(),
  '01a': () => papperFagel(0.6, 0),
  '01b': () => papperFagel(1, 0),
  '01c': () => { papperFagel(1, 1); lagg('pilar', `<rect x="620" y="280" width="680" height="520" fill="none" stroke="#7b2cbf" stroke-width="6" stroke-dasharray="20 14" opacity=".8"/>`);
    skimmer(1150, 400, 0.7, 1.2); text(1340, 300, 'pip!'); },

  '1': () => { gard({ spar: 1 }); HEL(); gris(F('jatteglad'), VINKA); pase(); pilar(rakpil(60, 800, 420, 800, 8)); },
  '2': () => { gard(); PASEN(); gris(F('nyfiken', { titt: [12, 8] }), { armar: [0, 40] }); pase({ v: 12 }); skakpil(...iFig([860, 470]), 4); text(...iFig([940, 560]), 'rassel', 22); },
  '3': () => { gard({ fron: 1 }); HALV(); gris(F('glad', { titt: [14, 10] }), { armar: [0, 60] }); const [x, y] = iFig([880, 600]); pase({ x, y, v: 110 }); fallFron(x + 30, y);
    pilar(bagpil(x + 40, y + 20, x + 160, y, 1060, 860, 5)); },
  '4': () => { gard({ fron: 1 }); HEL(); gris(F('glad', { titt: [14, 0] }), {}); pase();
    fagel('rod', GRAN[0] - 120, GRAN[1] - 100, { flax: 1 }); pilar(bagpil(GRAN[0] - 160, GRAN[1] - 140, 1300, 500, 960, 860, 7)); text(GRAN[0] - 90, GRAN[1] - 200, 'pip!'); },
  '5': () => { gard({ fron: 1 }); HALV(); gris(F('glad', { titt: [14, 6] }), {}); pase(); fagel('rod', ...VID_FRON.rod, { tilt: 12 });
    fagel('gul', 1260, 640, { flax: -1 }); pilar(bagpil(1420, 560, 1200, 520, 1050, 850, 6)); },
  '6': () => { gard({ fron: 0.6 }); HALV(); gris(F('glad', { titt: [16, 10] }), {}); pase(); fagel('rod', ...VID_FRON.rod, { tilt: 22 }); fagel('gul', ...VID_FRON.gul, { tilt: 22 });
    text(860, 780, 'pick'); text(980, 760, 'pick'); text(1080, 790, 'pick!'); },
  '7': () => { gard(); PASEN(); gris(F('forvanad', { titt: [12, 2] }), { armar: [0, 90] }); const [x, y] = iFig([860, 470]); pase({ x, y, v: 180 }); skakpil(x, y - 60, 4); text(x + 70, y + 80, '…', 40); },
  '8': () => { gard(); HEL(); gris(F('nyfiken', { titt: [14, 0] }), {}); pase(); fagel('rod', ...VID_FRON.rod); fagel('gul', ...VID_FRON.gul);
    fagel('bla', GRAN[0] - 100, GRAN[1] - 60, { flax: 1 }); pilar(bagpil(GRAN[0] - 130, GRAN[1] - 100, 1380, 640, 1130, 860, 6)); },
  '9': () => { gard(); kamera(3.2, VID_FRON.bla[0] - 20, VID_FRON.bla[1] - 60); fagel('rod', ...VID_FRON.rod); fagel('gul', ...VID_FRON.gul); fagel('bla', ...VID_FRON.bla, { tilt: -14 });
    text(VID_FRON.bla[0] - 20, VID_FRON.bla[1] - 120, '?', 30); },
  '10': () => { gard(); ANS(); gris(F('ledsen', { le: -0.3, titt: [14, 6] }), { oron: [14, 14] }); },

  '11a': () => { gard(); HEL(); gris(F('nyfiken', { titt: [16, 0] }), {}); pase(); alla(VID_FRON);
    const sp = kontur('karve', karveT(), 0.55, 9 / KARV[2]); krita(...sp, 125, 0.33); },
  '11b': () => { gard(); HEL(); gris(F('nyfiken', { titt: [16, 0] }), {}); pase(); alla(VID_FRON);
    kontur('karve', karveT(), 1, 9 / KARV[2]); krita(KARV[0] + 190, KTOPP[1] - 60, 140, 0.33); },
  '11c': () => { gard(); KARVN(); karve(); skimmer(KARV[0], KTOPP[1] + 160, 0.9, 2.2); },
  '12': () => { gard(); KARVN(); karve(); [[-60, 60], [40, 30], [80, 120], [-30, 170], [20, 110]].forEach(([dx, dy]) => lagg('fram', glans(KARV[0] + dx, KTOPP[1] + dy, 12))); },
  '13': () => { gard(); HALV(); karve(); alla(VID_FRON); gris(F('kawaii', { titt: [16, -6] }), { oron: [-10, -10] }); pase(); },
  '14': () => { gard(); HALV(); karve(); alla(VID_FRON); gris(F('glad'), {}); pase(); nickpil(...huvud(260, 160)); },
  '15': () => { gard(); HEL(); karve(); gris(F('glad', { titt: [16, -8] }), {}); pase(); fagel('rod', ...PA_KARV.rod); fagel('gul', 1150, 640, { flax: 1 }); fagel('bla', ...VID_FRON.bla);
    pilar(bagpil(VID_FRON.gul[0], 860, 1060, 640, PA_KARV.gul[0] - 20, PA_KARV.gul[1] + 10, 6), bagpil(VID_FRON.bla[0], 860, 1140, 680, PA_KARV.bla[0] - 20, PA_KARV.bla[1] + 10, 5));
    text(1160, 560, 'en … två … tre', 30); },
  '16': () => { gard(); KARVN(); karve(); fagel('rod', ...PA_KARV.rod); fagel('gul', ...PA_KARV.gul); fagel('bla', ...PA_KARV.bla, { tilt: 26 }); text(PA_KARV.bla[0] + 20, PA_KARV.bla[1] - 70, 'pick!', 26); },
