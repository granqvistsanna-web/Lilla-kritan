<h1>Grisen matar fåglarna <span>storyboard</span></h1>
<p class="lede">Avsnitt 043, 4:02.9. En stillbild per uppslag, tajmad efter Malins klippta repliker och manusets pauser. Snögården, grisens v2-rigg med tomteluvan, tre småfåglar, julkärven och fröpåsen. Lila streckade pilar visar rörelsen. 51 bilder.</p>

  <div class="t">00 · 0:00.0 · 1.0 s · Logotypen</div><div class="said">–</div>
  <p>Lilla Kritans logotyp i 1 s, sedan papperet</p><p class="ans">Ljud: – · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/01a.jpg" alt="Bild 01a" loading="lazy"><figcaption>

  <p>Kritan ritar den lilla blå fågelns kontur i lugna drag: kroppen, huvudet, vingen, näbben, stjärten och benen</p><p class="ans">Ljud: kritan ritar · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/01b.jpg" alt="Bild 01b" loading="lazy"><figcaption>

<figure class="frame"><img src="frames/01c.jpg" alt="Bild 01c" loading="lazy"><figcaption>
  <div class="t">01c · 0:13.7 · 4.2 s · Papperet → zoom in</div><div class="said"><i>"Oj! En fågel!"</i> (0:14.3)</div>
  <p>Fågeln fylls i inifrån, pipar. Zoom in i teckningen, till snögården, och fågeln flyger iväg in i granen</p><p class="ans">Ljud: <code>glitter</code>, pip, flax · Ansikte: –</p></figcaption></figure>

  <p>Grisen med tomteluvan trippar in i snön från vänster med fröpåsen och vinkar (armen bakom kroppen). Fotspår i snön</p><p class="ans">Ljud: <code>knarr-sno</code>, noff hej (1) · Ansikte: jätteglad</p></figcaption></figure>
