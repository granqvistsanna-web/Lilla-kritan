<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Kaninen badar varmt</title>
<style>html, body { margin:0; background:#000; overflow:hidden } svg { width:100vw; height:100vh; display:block; }</style>
</head>
<body>
<!-- 041 Kaninen badar varmt: hela kodscenen (grind 6). Mått och teckningar som storyboarden (../../storyboard/scen.html), tiden och
     raderna ur rader.json (skrivs av storyboard/bygg.mjs). Rendera: node verktyg/render-delat.mjs avsnitt/041-kaninen-badar-varmt/scener/badet [--snabb].
     Bara hårda klipp; den enda åkningen är zoomen in i snöflingan. Kritan är liten, utan ansikte, knackar aldrig. -->
<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="boil" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="5000">
      <feTurbulence id="brus" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
      <feDisplacementMap in="SourceGraphic" scale="5"/>
    </filter>
    <filter id="korn" x="0" y="0" width="1" height="1">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="2"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.47  0 0 0 0 0.36  1.1 0 0 0 -0.47"/>
    </filter>
    <radialGradient id="vinjett" cx="50%" cy="50%" r="75%"><stop offset="0.55" stop-color="#3a2410" stop-opacity="0"/><stop offset="1" stop-color="#3a2410" stop-opacity="0.14"/></radialGradient>
    <radialGradient id="kokljus" cx="30%" cy="40%" r="80%"><stop offset="0" stop-color="#FFE6B0"/><stop offset="1" stop-color="#F0C98A"/></radialGradient>
    <clipPath id="fonsterklipp"><rect x="540" y="105" width="300" height="250" rx="16"/></clipPath>
  </defs>
  <rect width="1920" height="1080" fill="#FAF8F2"/>
  <g id="kamera">
    <g id="platta"></g>
    <g id="vagg"></g>
    <g id="bak"></g>
    <g id="flakt"></g>
    <g filter="url(#boil)"><g id="figurer"></g></g>
    <g filter="url(#boil)"><g id="saker"></g></g>
    <g id="kar"></g>
    <g filter="url(#boil)"><g id="figurerFram"></g></g>
    <g id="fram" filter="url(#boil)"></g>
    <g id="pilar"></g>
  </g>
  <g id="ram"></g>
  <g id="gomda" opacity="0"></g>
</svg>
<script src="/verktyg/blinka.js"></script>
<script src="/verktyg/kant.js"></script>
<script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script>
const $ = id => document.getElementById(id);
const A = '/assets/', R = A + 'rekvisita/';
const lagg = (id, h) => $(id).insertAdjacentHTML('beforeend', h);
const f1 = v => v.toFixed(1);
const kl = (k, a = 0, b = 1) => Math.max(a, Math.min(b, k)), lerp = (a, b, k) => a + (b - a) * k;
const mjuk = k => (k = kl(k), k * k * (3 - 2 * k)), del = (a, b, t) => mjuk((t - a) / (b - a));
const bump = (a, b, t) => (t <= a || t >= b) ? 0 : Math.sin(Math.PI * (t - a) / (b - a));
const slump = x => { const v = Math.sin(x * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); };

// --- Filer och mått (som storyboarden; karet mindre, Sanna 2026-11-18 "bathtub looks a bit large") --------------------------------
const PLATTA = A + 'bakgrunder/badrummet/badrummet-v1.jpeg';
const KAR_S = 0.88, KAR = R + 'badkar/cut/badkar-bla-kran-tunn.png', KAR_W = 1044 * KAR_S, KAR_H = 687 * KAR_S, KAR_LAPP = 240 * KAR_S, KAR_Y0 = 905 - 668 * KAR_S;
const KAR_PIP = [765 * KAR_S, 118 * KAR_S];
const PALL = R + 'pall/cut/pall.png', PALL_KS = 0.58;   // stegen ungefär lika breda som kaninens fötter (0,5 var för smal)
const HANDDUK = [R + 'handduk/cut/handduk-rutig.png', 538, 1033];
const KRITA = R + 'krita-rod/cut/krita-rod.png', KRITA_SPETS = [742, 132];
const BAT_BILD = R + 'badbat/cut/badbat.png';
const FLAKT_RAM = R + 'flakt/cut/flakt-ram.png', FLAKT_W = 761, FLAKT_H = 923, FLAKT_C = [381, 380], FLAKT_RIN = 309;
const SNO = R + 'snoflinga/cut/snoflinga.png';
const PK = [R + 'pepparkakshjarta/cut/pepparkakshjarta.png', R + 'pepparkaksstjarna/cut/pepparkaksstjarna.png'];

const GOLV = 905, KX = 1420;
const KANT = KAR_Y0 + KAR_LAPP;
const GS = 0.5, BADKANT = 660;
const STA = [330, GOLV], VID_KAR = [400, GOLV];   // vid karet: precis till vänster om pallen, så att första skuttet går upp på nedre steget
const PALL_X0 = KX - KAR_W / 2 + 25 - 778 * PALL_KS, PALL_Y0 = GOLV - 548 * PALL_KS;
// pallens två steg (pall.png 781 × 551): nedre stegets ovansida y 212, x 40–330; övre y 4, x 360–760. Fötterna mitt på ovansidan.
const STEG1 = [PALL_X0 + 185 * PALL_KS, PALL_Y0 + 238 * PALL_KS], STEG2 = [PALL_X0 + 565 * PALL_KS, PALL_Y0 + 32 * PALL_KS];
// skutt i följd: lista = [[start, längd, mål, höjd]] från A. Blicken går till nästa mål 0,3 s före, en huk, armarna lyfts lite
// i luften, öronen släpar (skutt) och landningen trycker ihop kroppen mjukt. Ger [pos, p, blick (−1 … 1 åt sidan)].
function skuttar(tl, A, lista, p) {
  let pos = A, blick = 0, prev = A;
  for (const [t0, d, B, h] of lista) {
    if (tl >= t0) { pos = hoppVag(tl, t0, t0 + d, prev, B); }
    const fore = del(t0 - 0.35, t0 - 0.1, tl) * (1 - del(t0 + d - 0.1, t0 + d + 0.2, tl));
    if (fore > 0.01) blick = Math.sign(B[0] - prev[0]) * fore;
    p = skutt(p, tl, t0, h, d);
    const luft = bump(t0, t0 + d, tl); p = { ...p, armar: p.armar.map(a => a + 22 * luft), upp: (p.upp || 0) + 0.15 * Math.sign(prev[1] - B[1]) * fore };
    prev = B;
  }
  return [pos, p, blick];
}
let FOT = 947;
const IKAR0 = () => [KX + 40, KANT + (FOT - BADKANT) * GS];   // lite till höger, så att båten får plats till vänster
const KRAN = [KX - KAR_W / 2 + KAR_PIP[0], KAR_Y0 + KAR_PIP[1] - 14];
const DORR = [0, 300, 175];
const FONSTER = [540, 105, 300, 250];
const KROK = [330, 92], HANDDUK_H = 250;
const FL = [150, GOLV], FL_S = 0.33;
const FL_MITT = [FL[0], FL[1] - (FLAKT_H - FLAKT_C[1]) * FL_S];
const BAT = () => [KX - 280, KANT + 4], BAT_H = 160;   // x 1140: båten ryms mellan karets vänstra kant och kaninen

let L, G, BLINKA, TT = 0, KAM = [1, 960, 540], RAD = [], RR = {}, IDX = {}, ROSTER = [], BORTA = {}, DURATION = 0;
const SVART = 0.6;
const LN = n => ROSTER.find(r => +r[0].slice(0, 2) === n)[1];
const fran = (id, n) => IDX[id] >= IDX[n], efter = (id, n) => IDX[id] > IDX[n];
const iFig = ([x, fot], [px, py], s = GS) => [x + (px - 512) * s, fot + (py - FOT) * s];

function kamera(zoom = 1, cx = 960, cy = 540) {
  const tx = Math.max(1920 - 1920 * zoom, Math.min(0, 960 - cx * zoom)), ty = Math.max(1080 - 1080 * zoom, Math.min(0, 540 - cy * zoom));
  $('kamera').setAttribute('transform', `translate(${f1(tx)} ${f1(ty)}) scale(${zoom})`);
  $('brus').nextElementSibling.setAttribute('scale', (5 / zoom).toFixed(2));
}
function kam(k) { KAM = k; kamera(...k); }

// --- Badrummet --------------------------------------------------------------------------------------------------------------------
function badrum({ handduk = 1, kran = 0, skum = 0, anga = 0 } = {}) {
  $('platta').innerHTML = `<image href="${PLATTA}" width="1920" height="1080" preserveAspectRatio="xMidYMid slice"/>`;
  const [dx, dy, db] = DORR, [fx, fy, fb, fh] = FONSTER;
  let sno = ''; for (let i = 0; i < 26; i++) {   // snön faller sakta i fönstret
    const x = fx + 10 + slump(i) * (fb - 20) + 8 * Math.sin(TT * 0.9 + i), y = fy - 10 + (((slump(i + 50) * fh) + TT * (18 + 10 * slump(i + 9))) % (fh + 20));
    sno += `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(4 + 4 * slump(i + 3))}" fill="#fff"/>`; }
  lagg('vagg', `<g filter="url(#boil)">
    <path d="M${dx - 20} ${GOLV} V${dy} H${dx + db} V${GOLV}" fill="url(#kokljus)" stroke="#fff" stroke-width="22"/>
    <rect x="${fx}" y="${fy}" width="${fb}" height="${fh}" rx="16" fill="#cfe1ef"/>
    <g clip-path="url(#fonsterklipp)">${sno}</g>
    <rect x="${fx}" y="${fy}" width="${fb}" height="${fh}" rx="16" fill="none" stroke="#fff" stroke-width="20"/>
    <path d="M${fx + fb / 2} ${fy} V${fy + fh} M${fx} ${fy + fh / 2} H${fx + fb}" stroke="#fff" stroke-width="14"/>
    <path d="M${fx - 6} ${fy + fh - 4} q${fb / 4} -16 ${fb / 2} 0 t${fb / 2 + 12} 0" fill="#fff"/>
    <circle cx="${KROK[0]}" cy="${KROK[1]}" r="12" fill="#b9c2c6" stroke="#fff" stroke-width="6"/></g>`);
  if (handduk > 0.01) { const w = HANDDUK_H * HANDDUK[1] / HANDDUK[2];
    lagg('vagg', `<image href="${HANDDUK[0]}" x="${f1(KROK[0] - w / 2)}" y="${KROK[1] - 6}" width="${f1(w)}" height="${HANDDUK_H}" opacity="${handduk.toFixed(2)}"/>`); }
  if (kran > 0.01) { const [x, y] = KRAN, b = 9 * kran;
    lagg('bak', `<g filter="url(#boil)" opacity="${kl(kran * 1.5).toFixed(2)}"><path d="M${f1(x - b)} ${y + 14} Q${f1(x - b - 4)} ${(y + KANT) / 2} ${f1(x - b)} ${KANT + 30} L${f1(x + b)} ${KANT + 30} Q${f1(x + b + 3)} ${(y + KANT) / 2} ${f1(x + b)} ${y + 14}Z" fill="#a9dcf0" opacity="0.9"/>
      ${[0, 1, 2].map(i => { const yy = y + 24 + ((TT * 260 + i * 60) % (KANT - y - 20)); return `<path d="M${x - 2} ${f1(yy)} v26" stroke="#fff" stroke-width="4" opacity="0.75" stroke-linecap="round"/>`; }).join('')}</g>`); }
  lagg('bak', `<image href="${PALL}" x="${f1(PALL_X0)}" y="${f1(PALL_Y0)}" width="${f1(781 * PALL_KS)}" height="${f1(551 * PALL_KS)}"/>`);
  $('kar').innerHTML = `<image href="${KAR}" x="${f1(KX - KAR_W / 2)}" y="${f1(KAR_Y0)}" width="${f1(KAR_W)}" height="${f1(KAR_H)}"/>`;
  if (skum > 0.01) skumKant(skum);
  if (anga > 0.01) angaUpp(anga);
}
const tuss = (x, y, r, kant = '#cfe6ee') => [[0, 0, 1], [-0.8, 0.25, 0.7], [0.8, 0.2, 0.75], [-0.35, -0.55, 0.65], [0.4, -0.5, 0.6]]
  .map(([dx, dy, k]) => `<circle cx="${f1(x + dx * r)}" cy="${f1(y + dy * r)}" r="${f1(k * r)}" fill="#fff" stroke="${kant}" stroke-width="${f1(0.08 * r)}" paint-order="stroke"/>`).join('');
function skumKant(k) {   // tussar längs kanten som stiger med k och andas lite
  let h = ''; for (let i = 0; i < 13; i++) { const u = i / 12, x = KX - KAR_W / 2 + 70 + (KAR_W - 140) * u, r = (22 + 14 * Math.abs(Math.sin(i * 2.3))) * (0.35 + 0.65 * k) * (1 + 0.04 * Math.sin(TT * 1.7 + i));
    h += tuss(x, KANT + 10 - 0.5 * r * k, r); }
  lagg('fram', h);
}
function angaUpp(k) {   // band som ringlar uppåt och tonar bort
  lagg('bak', [0, 1, 2, 3].map(i => { const x = KX - 260 + 170 * i, fas = (TT * 0.35 + i * 0.27) % 1, y = KANT - 20 - 120 * fas, o = 0.5 * k * Math.sin(Math.PI * fas);
    return `<path d="M${x + 10 * Math.sin(TT + i)} ${f1(y)} q-22 -45 0 -90 t0 -90" fill="none" stroke="#fff" stroke-width="${f1(15 * k)}" stroke-linecap="round" opacity="${o.toFixed(2)}"/>`; }).join(''));
}
const droppe = (x, y, s = 1, o = 1) => `<path d="M${f1(x)} ${f1(y - 14 * s)} Q${f1(x + 9 * s)} ${f1(y)} ${f1(x)} ${f1(y + 6 * s)} Q${f1(x - 9 * s)} ${f1(y)} ${f1(x)} ${f1(y - 14 * s)}Z" fill="#a9dcf0" stroke="#fff" stroke-width="${f1(3 * s)}" opacity="${kl(o).toFixed(2)}"/>`;
const stjarna = (x, y, r, o = 1) => `<path transform="translate(${f1(x)} ${f1(y)}) scale(${r.toFixed(2)})" opacity="${kl(o).toFixed(2)}" d="M0 -1 L.2 -.2 L1 0 L.2 .2 L0 1 L-.2 .2 L-1 0 L-.2 -.2Z" fill="#fff6c8" stroke="#e6b422" stroke-width=".06"/>`;
const skimra = ([x, y], k, Rr = 36) => { if (k <= 0.01) return;
  lagg('fram', [[-1, -0.7, 1], [1.1, -0.4, 0.8], [0.2, 1.1, 0.7], [-1.2, 0.8, 0.6]].map(([dx, dy, s], i) => stjarna(x + dx * Rr, y + dy * Rr * 0.83, 14 * s * k * (0.75 + 0.25 * Math.sin(TT * 3 + i * 1.7)), 0.4 + k)).join('')); };

// --- Kritan --------------------------------------------------------------------------------------------------------------------
const kritaS = () => 0.33 * (KAM[0] > 1.3 ? 0.7 : 1);
const krita = (x, y, v = 125, s = kritaS()) => lagg('pilar', `<image href="${KRITA}" width="755" height="265"
  transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(v)}) scale(${s.toFixed(3)}) translate(${-KRITA_SPETS[0]} ${-KRITA_SPETS[1]})"/>`);
const kritaVanta = ([x, y]) => [[x + 3 * Math.sin(TT * 1.1), y + 5 * Math.sin(TT * 1.6)], 125 + 4 * Math.sin(TT * 1.3)];
const glid = ([p0, v0], [p1, v1], u) => { const m = mjuk(u); return [[lerp(p0[0], p1[0], m), lerp(p0[1], p1[1], m)], lerp(v0, v1, m)]; };
function gnistor([x, y]) {
  const e = 1 / Math.sqrt(KAM[0]); let h = '';
  for (let j = 0; j < 8; j++) { const b = Math.floor(TT * 14) - j, age = TT - b / 14, r = slump(b * 7.13), r2 = slump(b * 3.31 + 1.7), op = Math.max(0, 0.7 - age * 1.4);
    if (op > 0) h += `<circle cx="${f1(x + (r - 0.5) * 26 * e)}" cy="${f1(y + (6 + age * 55 + r2 * 8) * e)}" r="${f1((2 + 2.5 * r2) * e)}" fill="#D9503F" opacity="${op.toFixed(2)}"/>`; }
  lagg('fram', h);
}
const kritaRita = ([p, v, ritar], s) => { krita(p[0], p[1], v, s); if (ritar) gnistor(p); };
// kontur i bildens egna koordinater (t = transform), k 0–1; ger spetsens punkt i scenen
function kontur(d, t, k, bredd, farg) {
  lagg('pilar', `<g transform="${t}"><path d="${d}" pathLength="1" fill="none" stroke="${farg}" stroke-width="${bredd}" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="${kl(k)} 2"/></g>`);
  const p = $('pilar').lastElementChild.querySelector('path'), pt = p.getPointAtLength(kl(k, 0, 0.999) * p.getTotalLength());
  const m = DOMMatrix.fromMatrix($('kamera').getCTM()).inverse().multiply(p.getCTM()), q = m.transformPoint(new DOMPoint(pt.x, pt.y));
  return [q.x, q.y];
}

// --- Båten och fläkten -----------------------------------------------------------------------------------------------------------
const BAT_KONTUR = 'M' + [[30, 262], [140, 272], [255, 290], [298, 335], [318, 255], [335, 180], [455, 172], [460, 30], [580, 78], [465, 115], [465, 172],
  [560, 175], [575, 335], [650, 345], [682, 385], [665, 470], [610, 535], [500, 570], [350, 575], [220, 555], [120, 500], [60, 410], [30, 262]].map(p => p.join(' ')).join(' L');
const batT = ([x, y], rot = 0, s = 1) => `translate(${f1(x)} ${f1(y)}) rotate(${f1(rot)}) scale(${(s * BAT_H / 600).toFixed(4)}) translate(-355 -575)`;
const bat = (pos, rot = 0, s = 1, o = 1) => lagg('saker', `<image transform="${batT(pos, rot, s)}" href="${BAT_BILD}" width="708" height="600" opacity="${kl(o).toFixed(2)}"/>`);
const gupp = (x, t) => [x, BAT()[1] + 4 * Math.sin(t * 2.2)];
const guppV = t => 3 * Math.sin(t * 1.7);

const flaktT = `translate(${FL[0]} ${FL[1]}) scale(${FL_S}) translate(${-FLAKT_C[0]} ${-FLAKT_H})`;
const FLAKT_KONTUR = (() => { const fot = [[270, 700], [272, 790], [160, 850], [140, 905], [620, 905], [600, 850], [490, 790], [492, 700]];
  const ring = Array.from({ length: 41 }, (_, i) => { const a = Math.PI / 2 + i / 40 * 2 * Math.PI; return [FLAKT_C[0] + 330 * Math.cos(a), FLAKT_C[1] + 330 * Math.sin(a)]; });
  return 'M' + [...fot, ...ring].map(p => p.map(v => v.toFixed(0)).join(' ')).join(' L'); })();
function flakt(vrid, o = 1, lager = 'flakt') {
  const blad = [0, 1, 2].map(i => `<g transform="rotate(${f1(vrid + i * 120)} ${FLAKT_C[0]} ${FLAKT_C[1]})"><ellipse cx="${FLAKT_C[0]}" cy="${FLAKT_C[1] - 150}" rx="105" ry="130" fill="#FFF4E2"/></g>`).join('');
  lagg(lager, `<g transform="${flaktT}" filter="url(#boil)" opacity="${kl(o).toFixed(2)}">
    <circle cx="${FLAKT_C[0]}" cy="${FLAKT_C[1]}" r="${FLAKT_RIN}" fill="#FFF8EC" opacity=".35"/>${blad}
    <path d="M${FLAKT_C[0] - FLAKT_RIN} ${FLAKT_C[1]} H${FLAKT_C[0] + FLAKT_RIN} M${FLAKT_C[0]} ${FLAKT_C[1] - FLAKT_RIN} V${FLAKT_C[1] + FLAKT_RIN}" stroke="#F2C64C" stroke-width="12"/>
    <image href="${FLAKT_RAM}" width="${FLAKT_W}" height="${FLAKT_H}"/>
    <circle cx="${FLAKT_C[0]}" cy="${FLAKT_C[1]}" r="60" fill="#F6A83B"/></g>`);
}
// fläktens vinkel: snurrar lugnt från rad 26, stannar under rad 33
const W = 220;
function flaktVrid(t) {
  const a = RR['26'].s + 1.2, b = RR['33'].s, D = RR['33'].d;
  if (t < a) return 0;
  const upp = Math.min(t - a, 0.6), vid = t < a + 0.6 ? W * (t - a) * (t - a) / 1.2 : W * 0.3 + W * (Math.min(t, b) - a - 0.6);
  if (t <= b) return vid;
  const u = Math.min(t - b, D); return vid + W * (u - u * u / (2 * D));
}
const flaktFart = t => { const a = RR['26'].s + 1.2, b = RR['33'].s; return del(a, a + 0.6, t) * (1 - kl((t - b) / RR['33'].d)); };
// doftens virvlar: in genom dörren, genom fläkten, mot målet. k = hur långt de kommit, o = opacitet
function doft(mal, k, o, kakor = 0) {
  if (o <= 0.01 || k <= 0.01) return;
  const [fx, fy] = FL_MITT, [mx, my] = mal;
  let h = '';
  [0, 1, 2].forEach(i => { const off = (i - 1) * 40, x1 = fx + (mx - fx) * k, y1 = fy + (my - fy) * k + off * 0.4, vag = 14 * Math.sin(TT * 1.4 + i);
    h += `<path d="M-20 ${fy + off - 60} C${fx - 70} ${fy + off - 120 + vag} ${fx + 30} ${fy + off + 50} ${fx + 120} ${fy + off} S${(fx + x1) / 2} ${y1 - 150 + off + vag} ${f1(x1)} ${f1(y1)}"
      fill="none" stroke="#C98B4E" stroke-width="14" stroke-linecap="round" opacity="${(0.4 * o).toFixed(2)}" stroke-dasharray="70 36" stroke-dashoffset="${f1(-TT * 90 - i * 30)}"/>`; });
  lagg('fram', h);
  if (kakor > 0.01) PK.forEach((p, i) => { const u = 0.45 + 0.22 * i + 0.03 * Math.sin(TT * 1.2 + i), x = fx + (mx - fx) * u, y = fy + (my - fy) * u - 70 + 50 * i + 10 * Math.sin(TT * 1.8 + i), s = 110 * kakor;
    lagg('saker', `<image href="${p}" x="${f1(x - s / 2)}" y="${f1(y - s / 2)}" width="${f1(s)}" height="${f1(s)}" transform="rotate(${f1((i ? 12 : -10) + 6 * Math.sin(TT + i))} ${f1(x)} ${f1(y)})" opacity="${kl(kakor * 1.4).toFixed(2)}"/>`); });
}

// --- Kaninen ---------------------------------------------------------------------------------------------------------------------
const SNO_KANT = '#9FC0E4', SNO_C = { orl: [348, 78], orr: [676, 82], nos: [512, 438], huvud: [512, 222] }, SNO_R = { orl: 40, orr: 38, nos: 20, huvud: 36 };
function snoIn(g) {
  g.querySelector('image.ear-l').insertAdjacentHTML('afterend', `<g class="ear-l"><g class="sno-orl"></g></g>`);
  g.querySelector('image.ear-r').insertAdjacentHTML('afterend', `<g class="ear-r"><g class="sno-orr"></g></g>`);
  g.querySelector('.drag').insertAdjacentHTML('beforeend', `<g class="sno-nos"></g><g class="sno-huvud"></g>`);
  g.querySelector('.kropp').insertAdjacentHTML('beforebegin', `<g class="cape"><path d="M250 360 Q512 250 774 360 L800 790 Q512 850 224 790Z" fill="#F4A6B8"/>
    <path d="M300 380 V800 M420 330 V820 M604 330 V820 M724 380 V800" stroke="#fff" stroke-width="16" opacity=".7"/></g>`);
  // framsidan: handduken knuten om magen (läses som "har handduken på sig"), axelflikar ovanför
  g.querySelector('.mage').insertAdjacentHTML('afterend', `<g class="cape"><path d="M262 360 Q300 330 372 352 L366 600 Q300 610 252 596Z" fill="#F4A6B8"/>
