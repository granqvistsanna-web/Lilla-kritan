<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leoparden plockar äpplen storyboard</title>
<style>
:root { --paper:#fbfaf6; --card:#fff; --ink:#2a2620; --muted:#6e675c; --line:#e6e1d6; --rosa:#b8506a }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper:#1d1c22; --card:#26252c; --ink:#f1ede4; --muted:#a8a196; --line:#3a3842; --rosa:#f2a7b8; color-scheme:dark } }
:root[data-theme="dark"] { --paper:#1d1c22; --card:#26252c; --ink:#f1ede4; --muted:#a8a196; --line:#3a3842; --rosa:#f2a7b8; color-scheme:dark }
* { box-sizing:border-box }
body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.5 system-ui,sans-serif }
.wrap { max-width:1240px; margin:0 auto; padding:40px 16px 72px }
h1 { font-size:clamp(30px,6vw,52px); margin:0 } h1 span { color:var(--rosa) }
.lede { color:var(--muted); max-width:72ch }
.frames { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; margin-top:24px }
.frame { margin:0; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden }
.frame img { width:100%; height:auto; display:block }
figcaption { padding:12px 14px 14px; display:grid; gap:6px; font-size:14px } figcaption p { margin:0 }
.t { font:500 12px ui-monospace,monospace; color:var(--muted) }
.said { border-left:3px solid var(--rosa); padding-left:10px }
.ans { color:var(--muted); font-size:13px }
</style></head><body><div class="wrap">
<h1>Leoparden plockar äpplen <span>storyboard</span></h1>
<p class="lede">Avsnitt 029, 2:41.9 med bilderbok-introt. En stillbild per rad, tagen ur kodscenen. 27 bilder.</p>
<div class="frames"><figure class="frame"><img src="frames/01a.jpg" alt="Bild 01a" loading="lazy"><figcaption>
  <div class="t">01a · 0:03.3 · 6.0 s · Papperet, helbild</div><div class="said"><i>"Kritan ritar …"</i> (0:04.3)</div>
  <p>Rent papper (efter bilderbok-introt). Kritan kommer in och ritar leopardens kontur i lugna drag, halvvägs här</p><p class="ans">Ljud: kritan ritar, skogsljud under · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/01b.jpg" alt="Bild 01b" loading="lazy"><figcaption>
  <div class="t">01b · 0:09.3 · 7.5 s · Papperet, helbild</div><div class="said"><i>"Hm … vad blir det nu?"</i> (0:09.3)</div>
  <p>Konturen ritas klar (armarna ett drag var, fläckarna sist), kritan väntar bredvid och vajar: barnet gissar</p><p class="ans">Ljud: kritan ritar · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/01c.jpg" alt="Bild 01c" loading="lazy"><figcaption>
  <div class="t">01c · 0:16.8 · 3.8 s · Papperet → zoom in</div><div class="said"><i>"Oj! En leopard!"</i> (0:17.4)</div>
  <p>Den riktiga leoparden fylls i inifrån. Sista 0,8 s: zoom in i teckningen</p><p class="ans">Ljud: – · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/1.jpg" alt="Bild 1" loading="lazy"><figcaption>
  <div class="t">1 · 0:20.6 · 6.7 s · Äppelträdet, helbild</div><div class="said"><i>"Hej, leoparden! Hej, hej!"</i> (0:23.0)</div>
  <p>Leoparden trippar in från vänster (riggens gång), stannar till vänster om stammen och vinkar. <b>Hej med vinkning</b></p><p class="ans">Ljud: små steg, glatt spinn · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/2.jpg" alt="Bild 2" loading="lazy"><figcaption>
  <div class="t">2 · 0:27.3 · 4.7 s · Halvbild</div><div class="said"><i>"Titta, så många äpplen!"</i> (0:27.9)</div>
  <p>Leoparden tittar upp i kronan full av röda äpplen, öronen vippar</p><p class="ans">Ljud: förtjust spinn · Ansikte: nyfiken → glad</p></figcaption></figure>
<figure class="frame"><img src="frames/3.jpg" alt="Bild 3" loading="lazy"><figcaption>
  <div class="t">3 · 0:32.0 · 6.2 s · Helbild</div><div class="said"><i>"Oj då. Äpplet rullar iväg!"</i> (0:33.3)</div>
  <p>Ett äpple lossnar, landar i gräset med en liten studs och rullar ut ur bild åt vänster</p><p class="ans">Ljud: <code>apple-studs</code>, <code>rull</code>, frågande spinn · Ansikte: förvånad</p></figcaption></figure>
<figure class="frame"><img src="frames/4.jpg" alt="Bild 4" loading="lazy"><figcaption>
  <div class="t">4 · 0:38.2 · 7.2 s · Närbild, leoparden</div><div class="said"><i>"Äpplena rullar visst iväg."</i> (0:38.8) … <i>"Hm … vad gör vi nu?"</i> (0:41.5)</div>
  <p>Ett äpple till rullar förbi i gräset, leoparden tittar efter det, öronen faller. Paus 1 s mellan replikerna</p><p class="ans">Ljud: <code>rull</code>, trumpet spinn · Ansikte: trumpen</p></figcaption></figure>
<figure class="frame"><img src="frames/5a.jpg" alt="Bild 5a" loading="lazy"><figcaption>
  <div class="t">5a · 0:45.3 · 10.7 s · Helbild → närbild där korgen ritas</div><div class="said"><i>"Titta! Kritan ritar något."</i> (0:45.6)</div>
  <p>Kritan kommer in och ritar korgens kontur i gräset framför leoparden (4 s, nära bild), väntar sedan bredvid: gisspaus 3 s</p><p class="ans">Ljud: kritan ritar · Ansikte: nyfiken</p></figcaption></figure>
<figure class="frame"><img src="frames/5b.jpg" alt="Bild 5b" loading="lazy"><figcaption>
  <div class="t">5b · 0:56.1 · 5.1 s · Samma → halvbild</div><div class="said"><i>"En korg! Varsågod, leoparden."</i> (0:56.3)</div>
  <p>Den riktiga korgen fylls i inifrån, kritan flyger iväg. <i>Varsågod</i></p><p class="ans">Ljud: glitter · Ansikte: förvånad</p></figcaption></figure>
<figure class="frame"><img src="frames/6.jpg" alt="Bild 6" loading="lazy"><figcaption>
  <div class="t">6 · 1:01.2 · 8.4 s · Halvbild</div><div class="said"><i>"Ska vi säga tack?"</i> (1:01.5) … <i>"Tack!"</i> (1:06.7)</div>
  <p>Leoparden tittar på korgen, öronen reser sig. Paus 4 s: barnet säger tack. Efter <i>Tack!</i> nickar leoparden</p><p class="ans">Ljud: nyfiket spinn, sedan förtjust spinn · Ansikte: nyfiken → jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/7.jpg" alt="Bild 7" loading="lazy"><figcaption>
  <div class="t">7 · 1:09.6 · 4.7 s · Halvbild</div><div class="said"><i>"Oj! Ett äpple på huvudet …"</i> (1:10.6)</div>
  <p>Ett äpple lossnar och landar mjukt på huvudet. Leoparden blundar och fnissar. <b>Leken (äpplet på huvudet)</b></p><p class="ans">Ljud: <code>apple-studs</code>, fniss · Ansikte: förvånad → fnissig (blundar)</p></figcaption></figure>
<figure class="frame"><img src="frames/8.jpg" alt="Bild 8" loading="lazy"><figcaption>
  <div class="t">8 · 1:14.3 · 4.3 s · Samma</div><div class="said"><i>"… och i korgen! Ha ha!"</i> (1:14.5)</div>
  <p>Äpplet studsar från huvudet ner i korgen på <i>"korgen"</i></p><p class="ans">Ljud: <code>korg</code>, <code>spinn-fniss</code> · Ansikte: fnissig</p></figcaption></figure>
<figure class="frame"><img src="frames/9.jpg" alt="Bild 9" loading="lazy"><figcaption>
  <div class="t">9 · 1:18.6 · 4.0 s · Halvbild</div><div class="said"><i>"Ska du plocka äpplen nu?"</i> (1:18.9)</div>
  <p>Leoparden tittar upp i kronan och nickar. <b>Shorten börjar här</b></p><p class="ans">Ljud: förtjust spinn · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/10.jpg" alt="Bild 10" loading="lazy"><figcaption>
  <div class="t">10 · 1:22.5 · 6.1 s · Halvbild</div><div class="said"><i>"Först ett äpple. Vips … i korgen!"</i> (1:23.1)</div>
  <p>Leoparden sträcker på sig. På <i>"Vips"</i> lossnar ett äpple och glider i en mjuk båge, på <i>"i korgen!"</i> landar det i korgen</p><p class="ans">Ljud: <code>swoosh</code>, <code>apple-studs</code>, fniss · Ansikte: glad → fnissig</p></figcaption></figure>
<figure class="frame"><img src="frames/11.jpg" alt="Bild 11" loading="lazy"><figcaption>
  <div class="t">11 · 1:28.6 · 5.8 s · Samma</div><div class="said"><i>"Och ett till. Vips … i korgen!"</i> (1:29.2)</div>
  <p>Samma, ett äpple till</p><p class="ans">Ljud: <code>swoosh</code>, <code>apple-studs</code>, fniss · Ansikte: fnissig</p></figcaption></figure>
<figure class="frame"><img src="frames/12.jpg" alt="Bild 12" loading="lazy"><figcaption>
  <div class="t">12 · 1:34.4 · 7.1 s · Halvbild</div><div class="said"><i>"Oj, ett äpple är kvar. Leoparden vet inte var."</i> (1:34.7)</div>
  <p>Leoparden tittar åt vänster, sedan åt höger (ögonen och ansiktet)</p><p class="ans">Ljud: frågande spinn · Ansikte: nyfiken</p></figcaption></figure>
<figure class="frame"><img src="frames/13.jpg" alt="Bild 13" loading="lazy"><figcaption>
  <div class="t">13 · 1:41.4 · 9.7 s · Närbild stammen (klipp)</div><div class="said"><i>"Kan du hjälpa leoparden? Kan du se var äpplet är?"</i> (1:41.7)</div>
  <p>En röd kant sticker fram bakom stammen, nere i gräset. Paus 5 s; efter ca 3 s skimrar den svagt</p><p class="ans">Ljud: tyst · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/14.jpg" alt="Bild 14" loading="lazy"><figcaption>
  <div class="t">14 · 1:51.1 · 4.9 s · Samma</div><div class="said"><i>"Ja, där! Ja, bakom trädet!"</i> (1:51.1)</div>
  <p>Äpplet skimrar tydligt</p><p class="ans">Ljud: förtjust spinn, <code>tindra</code> · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/15.jpg" alt="Bild 15" loading="lazy"><figcaption>
  <div class="t">15 · 1:56.1 · 4.1 s · Halvbild</div><div class="said"><i>"Vips … i korgen!"</i> (1:56.4)</div>
  <p>Äpplet glider fram bakom stammen på <i>"Vips"</i> och landar i korgen på <i>"korgen"</i></p><p class="ans">Ljud: <code>swoosh</code>, <code>apple-studs</code>, fniss · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/16.jpg" alt="Bild 16" loading="lazy"><figcaption>
  <div class="t">16 · 2:00.2 · 4.0 s · Halvbild</div><div class="said"><i>"Nu är korgen full!"</i> (2:00.5)</div>
  <p>Korgen full av äpplen, den skimrar. Leoparden stolt</p><p class="ans">Ljud: <code>tindra</code>, förtjust spinn · Ansikte: stolt</p></figcaption></figure>
<figure class="frame"><img src="frames/17.jpg" alt="Bild 17" loading="lazy"><figcaption>
  <div class="t">17 · 2:04.2 · 5.7 s · Helbild</div><div class="said"><i>"Oj! Nu klättrar leoparden upp i trädet!"</i> (2:04.5)</div>
  <p>Leoparden klättrar upp bakom stammen med lugna skutt och försvinner bakom kronan</p><p class="ans">Ljud: <code>prassel-lov</code>, <code>spinn-fniss</code> · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/18.jpg" alt="Bild 18" loading="lazy"><figcaption>
  <div class="t">18 · 2:09.9 · 6.3 s · Närbild kronan</div><div class="said"><i>"Var är leoparden?"</i> (2:10.2)</div>
  <p>Kronan prasslar och gungar lite. Paus 4 s: barnet letar</p><p class="ans">Ljud: <code>prassel-buske</code>, tyst · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/19.jpg" alt="Bild 19" loading="lazy"><figcaption>
  <div class="t">19 · 2:16.2 · 3.4 s · Samma</div><div class="said"><i>"Tittut!"</i> (2:16.4)</div>
  <p>På <i>"Tittut!"</i> kommer huvudet och öronen fram vid kronans vänstra kant. <b>Leken (tittut i trädet)</b></p><p class="ans">Ljud: långt fniss · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/20.jpg" alt="Bild 20" loading="lazy"><figcaption>
  <div class="t">20 · 2:19.6 · 8.1 s · Samma</div><div class="said"><i>"Var är leoparden?"</i> (2:19.9) … <i>"Tittut!"</i> (2:24.0)</div>
  <p>Huvudet gömmer sig, kronan prasslar. På <i>"Tittut!"</i> kommer huvudet fram på andra sidan. <b>Shorten slutar här</b></p><p class="ans">Ljud: <code>prassel-buske</code>, <code>spinn-fniss</code> · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/21.jpg" alt="Bild 21" loading="lazy"><figcaption>
  <div class="t">21 · 2:27.7 · 6.8 s · Helbild</div><div class="said"><i>"Hej då, leoparden! Hej då, korgen!"</i> (2:29.6)</div>
  <p>Leoparden klättrar ner bakom stammen, landar bakom korgen och vinkar (armen bakom kroppen). <b>Hej då med vinkning</b></p><p class="ans">Ljud: hej då-spinn · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/22.jpg" alt="Bild 22" loading="lazy"><figcaption>
  <div class="t">22 · 2:34.5 · 4.9 s · Samma</div><div class="said"><i>"Hej då! Vi ses snart!"</i> (2:34.8)</div>
  <p>Leoparden vinkar klart, armen sjunker</p><p class="ans">Ljud: fniss · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/23.jpg" alt="Bild 23" loading="lazy"><figcaption>
  <div class="t">23 · 2:39.4 · 2.5 s · Äppelträdet → kritirisen</div><div class="said">–</div>
  <p>Kritirisen drar ihop sig runt leoparden och korgen</p><p class="ans">Ljud: – · Ansikte: glad</p></figcaption></figure></div>
</div></body></html>
