<style>

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper:#1d1c22; --card:#26252c; --ink:#f1ede4; --muted:#a8a196; --line:#3a3842; --gul:#f5c842; color-scheme:dark } }
:root[data-theme="dark"] { --paper:#1d1c22; --card:#26252c; --ink:#f1ede4; --muted:#a8a196; --line:#3a3842; --gul:#f5c842; color-scheme:dark }

<h1>Gula sången <span>storyboard v2</span></h1>
<p class="lede">Avsnitt 011, tagning 2 (2:28.0). En stillbild per rad i <code>storyboard.md</code>, avsnittstid = sångtid + 24,5 s. Byggd av v2-plattorna, bananen v2 och helikoptern v3 (glasbubblan och rotorn i kod), figurerna ur sina v2-riggar med ansiktena i kod. Pilarna visar rörelsen. 50 bilder.</p>
<div class="frames"><figure class='frame'><img src='frames/00.jpg' alt='Bild 00' loading='lazy'><figcaption><div class='t'>00 · 0:00.0 · Intro (fast)</div><div class='song'>–</div><p>Formatets intro (<code>../intro/</code>, kopia av 013:s med gul som förval, 9,0 s med jingeln): logotypen, titeln <i>Gula sången</i> på en gul kritfläck, och ett gult kritsvep rakt in i ritandet</p><p class='ans'>–</p></figcaption></figure><figure class='frame'><img src='frames/01a.jpg' alt='Bild 01a' loading='lazy'><figcaption><div class='t'>01a · 0:09.0 · Papper · kritan ritar (1)</div><div class='song'><i>BERÄTTAREN (0:09.2):</i> &quot;Titta!&quot; … (0:13.5) &quot;Något långt.&quot;</div><p>Bananens kontur i ett lugnt drag (ca 7 s), sedan skaftet. Skogsljud under</p><p class='ans'>–</p></figcaption></figure><figure class='frame'><img src='frames/01b.jpg' alt='Bild 01b' loading='lazy'><figcaption><div class='t'>01b · 0:16.2 · Papper (1)</div><div class='song'>… paus ca 3 s …</div><p>Konturen står stilla, barnet gissar. Kritan väntar bredvid, vickar och knackar två gånger</p><p class='ans'>–</p></figcaption></figure><figure class='frame'><img src='frames/01c.jpg' alt='Bild 01c' loading='lazy'><figcaption><div class='t'>01c · 0:20.0 · Papper (1)</div><div class='song'><i>BERÄTTAREN (0:20.0):</i> &quot;En banan! En gul banan!&quot; … (0:22.2) &quot;Nu flyger vi!&quot;</div><p>Riktiga bananen (<code>banan/cut/banan-v2.png</code>) fylls i inifrån, pling, guppar till, krit-gnistor. <b>Zoom in</b> (0:22.3–0:24.2) genom ett hål i papperet mot dammens strand. Sången börjar under zoomen</p><p class='ans'>–</p></figcaption></figure><figure class='frame'><img src='frames/02a.jpg' alt='Bild 02a' loading='lazy'><figcaption><div class='t'>02a · 0:22.2 · Dammen · helbild (5)</div><div class='song'>Gul är den gladaste färgen! <i>(Ha-ha!)</i></div><p>Helikoptern står på marken vid dammen, rotorn står still. Lage vinkar. På &quot;Ha-ha!&quot; gungar den två gånger på medarna</p><p class='ans'>Lage: <b>jatteglad</b></p></figcaption></figure><figure class='frame'><img src='frames/02b.jpg' alt='Bild 02b' loading='lazy'><figcaption><div class='t'>02b · 0:27.4 · Närbild Lage (3)</div><div class='song'>Gul är den gladaste färgen! <i>(Ha-ha!)</i></div><p>Lage skrattar i glasbubblan, manen guppar på &quot;Ha-ha!&quot;. Dammen bakom. <b>Ha-ha-skämtet</b> (samma varje &quot;Ha-ha!&quot;): helikoptern skuttar två gånger på medarna. Ljud: Lages mjuka ryt som blir en gäspning (<code>gaspning</code>), i pausen före &quot;Ha-ha!&quot;</p><p class='ans'>Lage: <b>fnissig</b></p></figcaption></figure><figure class='frame'><img src='frames/02c.jpg' alt='Bild 02c' loading='lazy'><figcaption><div class='t'>02c · 0:31.7 · Dammen (5)</div><div class='song'>Gul helikopter – <i>(snurra, snurra!)</i></div><p>Rotorn börjar snurra på &quot;snurra, snurra&quot;, två vita vindvirvlar mot marken, och helikoptern lyfter från marken</p><p class='ans'>Lage: <b>glad</b></p></figcaption></figure><figure class='frame'><img src='frames/02d.jpg' alt='Bild 02d' loading='lazy'><figcaption><div class='t'>02d · 0:36.4 · Himlen (2)</div><div class='song'>Vi flyger högt! <i>(Högt, högt!)</i></div><p>Rakt klipp upp i himlen: helikoptern stiger två lugna lyft upp genom molnen, molnen sjunker undan under den. Den flyger rakt igenom ett moln och kommer ut på andra sidan med en liten molntuss på bubblan. Långt bort flyger ett litet rött flygplan förbi (<code>flygplan-rod</code>, bakgrund)</p><p class='ans'>Lage: <b>jatteglad</b> + <b>upp</b></p></figcaption></figure><figure class='frame'><img src='frames/03a.jpg' alt='Bild 03a' loading='lazy'><figcaption><div class='t'>03a · 0:39.8 · Himlen (2)</div><div class='song'>Gul-la-la! <i>(Gul-la-la!)</i></div><p><b>Refrängbilden:</b> helikoptern gungar i takt, rotorn snurrar, Lage gungar med. En fjäril fladdrar förbi i bakgrunden</p><p class='ans'>Lage: <b>jatteglad</b></p></figcaption></figure><figure class='frame'><img src='frames/03b.jpg' alt='Bild 03b' loading='lazy'><figcaption><div class='t'>03b · 0:43.5 · Närbild rotorn och Lage (3)</div><div class='song'>Snurra, snurra – vi flyger!</div><p>Rotorn snurrar, Lage pekar uppåt</p><p class='ans'>Lage: <b>glad</b> + <b>pekar</b></p></figcaption></figure><figure class='frame'><img src='frames/03c.jpg' alt='Bild 03c' loading='lazy'><figcaption><div class='t'>03c · 0:45.8 · Himlen (2)</div><div class='song'>Gul-la-la! <i>(Gul-la-la!)</i></div><p>Som 03a</p><p class='ans'>Lage: <b>jatteglad</b></p></figcaption></figure><figure class='frame'><img src='frames/03d.jpg' alt='Bild 03d' loading='lazy'><figcaption><div class='t'>03d · 0:47.8 · Gult kritsvep → <b>jättesolen</b> (4)</div><div class='song'>Upp, upp, upp till solen!</div><p>Gult kritsvep, bakom det jättesolens orange himmel. Helikoptern kommer in nerifrån i tre lyft, ett per &quot;upp&quot;, och stannar framför solen</p><p class='ans'>Lage: <b>forvanad</b> · solen: <b>glad</b></p></figcaption></figure><figure class='frame'><img src='frames/03e.jpg' alt='Bild 03e' loading='lazy'><figcaption><div class='t'>03e · 0:50.1 · Jättesolen (4)</div><div class='song'>Gul är den gladaste färgen! <i>(Ha-ha!)</i></div><p>Solen skrattar och himlen blir blekt citrongul (den gula floden). På &quot;Ha-ha!&quot; guppar solen och helikoptern. Ha-ha-skämtet: solen blinkar och helikoptern skuttar</p><p class='ans'>Lage: <b>jatteglad</b> · solen: <b>fnissig</b></p></figcaption></figure><figure class='frame'><img src='frames/04a.jpg' alt='Bild 04a' loading='lazy'><figcaption><div class='t'>04a · 0:53.0 · Blått kritsvep → himlen (2)</div><div class='song'>Vad är gult? <i>(Vad är gult?)</i> Titta där! <i>(Titta där!)</i></div><p>Hem till himlen. Lage spanar med tassen över ögonen, åt båda hållen. Långt borta till höger syns en liten gul prick som surrar närmare: barnet hinner se humlan före Lage. Ljud: svagt <code>surr</code></p><p class='ans'>Lage: <b>nyfiken</b></p></figcaption></figure><figure class='frame'><img src='frames/04b.jpg' alt='Bild 04b' loading='lazy'><figcaption><div class='t'>04b · 0:57.9 · Himlen (2)</div><div class='song'>Humlan är gul –</div><p>Humle surrar in från höger och stannar framför helikoptern, gnistrar. Ljud: <code>surr</code></p><p class='ans'>Lage: <b>jatteglad</b> + <b>pekar</b> · Humle: <b>glad</b></p></figcaption></figure><figure class='frame'><img src='frames/04c.jpg' alt='Bild 04c' loading='lazy'><figcaption><div class='t'>04c · 0:59.5 · Himlen (2)</div><div class='song'>surr, surr, surr!</div><p>Humle flyger tre små öglor runt bubblan, en per &quot;surr&quot;</p><p class='ans'>Lage: <b>fnissig</b> · Humle: <b>jatteglad</b></p></figcaption></figure><figure class='frame'><img src='frames/04d.jpg' alt='Bild 04d' loading='lazy'><figcaption><div class='t'>04d · 1:02.1 · Himlen (2)</div><div class='song'>Vad är gult? <i>(Vad är gult?)</i> Titta där! <i>(Titta där!)</i></div><p>Lage spanar igen. Ett litet moln glider undan. Bananens spets kikar fram bakom ett moln innan molnet glider undan: barnet hinner peka först</p><p class='ans'>Lage: <b>nyfiken</b></p></figcaption></figure><figure class='frame'><img src='frames/04e.jpg' alt='Bild 04e' loading='lazy'><figcaption><div class='t'>04e · 1:06.3 · Himlen (2)</div><div class='song'>Bananen är gul –</div><p>Bananen (<code>banan/cut/banan-v2.png</code>) flyter in på ett moln, samma banan som kritan ritade, gnistrar</p><p class='ans'>Lage: <b>forvanad</b> → <b>jatteglad</b></p></figcaption></figure><figure class='frame'><img src='frames/04f.jpg' alt='Bild 04f' loading='lazy'><figcaption><div class='t'>04f · 1:07.7 · Närbild Lage (3)</div><div class='song'>mums, mums, mums!</div><p>Lage tar bananen och tar tre tuggor, en per &quot;mums&quot;, slickar sig om munnen</p><p class='ans'>Lage: <b>jatteglad</b>, mun <b>tunga</b> på sista</p></figcaption></figure><figure class='frame'><img src='frames/05a.jpg' alt='Bild 05a' loading='lazy'><figcaption><div class='t'>05a · 1:09.8 · Närbild Lage (3)</div><div class='song'>Vad mer är gult? Kan du se?</div><p>Lage tittar åt vänster och åt höger. Tofsen på hans svans sticker upp över karets kant bakom honom och viftar en gång, men han ser den inte</p><p class='ans'>Lage: <b>nyfiken</b></p></figcaption></figure><figure class='frame'><img src='frames/05c.jpg' alt='Bild 05c' loading='lazy'><figcaption><div class='t'>05c · 1:14.5 · Närbild svansen (3)</div><div class='song'>Svansen är gul –</div><p>Överraskningen: kameran zoomar in på lejonets svans, tofsen gnistrar, och Lage vänder blicken och ser sin egen svans. Ljud: Lages mjuka ryt som blir en gäspning (<code>gaspning</code>), sedan <code>glitter</code></p><p class='ans'>Lage: <b>forvanad</b> → <b>fnissig</b></p></figcaption></figure><figure class='frame'><img src='frames/05d.jpg' alt='Bild 05d' loading='lazy'><figcaption><div class='t'>05d · 1:16.1 · Närbild (3)</div><div class='song'>vifta, vifta, vifta!</div><p>Svansen viftar tre gånger, en per &quot;vifta&quot;</p><p class='ans'>Lage: <b>fnissig</b></p></figcaption></figure><figure class='frame'><img src='frames/06a.jpg' alt='Bild 06a' loading='lazy'><figcaption><div class='t'>06a · 1:20.1 · Himlen (2)</div><div class='song'>Gul-la-la! <i>(Gul-la-la!)</i></div><p>Refräng 2, som 03a. Refräng 2 växer: humlan surrar med bredvid bubblan och bananen sitter i karet</p><p class='ans'>Lage: <b>jatteglad</b></p></figcaption></figure><figure class='frame'><img src='frames/06b.jpg' alt='Bild 06b' loading='lazy'><figcaption><div class='t'>06b · 1:22.7 · Närbild (3)</div><div class='song'>Snurra, snurra – vi flyger!</div><p>Som 03b</p><p class='ans'>Lage: <b>glad</b> + <b>pekar</b></p></figcaption></figure><figure class='frame'><img src='frames/06c.jpg' alt='Bild 06c' loading='lazy'><figcaption><div class='t'>06c · 1:24.9 · Himlen (2)</div><div class='song'>Gul-la-la! <i>(Gul-la-la!)</i></div><p>Som 03a</p><p class='ans'>Lage: <b>jatteglad</b></p></figcaption></figure><figure class='frame'><img src='frames/06d.jpg' alt='Bild 06d' loading='lazy'><figcaption><div class='t'>06d · 1:27.0 · Gult kritsvep → jättesolen (4)</div><div class='song'>Upp, upp, upp till solen!</div><p>Som 03d. Humlan och bananen åker med upp till solen</p><p class='ans'>Lage: <b>forvanad</b> · solen: <b>glad</b></p></figcaption></figure><figure class='frame'><img src='frames/06e.jpg' alt='Bild 06e' loading='lazy'><figcaption><div class='t'>06e · 1:29.2 · Jättesolen (4)</div><div class='song'>Gul är den gladaste färgen! <i>(Ha-ha!)</i></div><p>Som 03e. Ha-ha-skämtet: solen blinkar och helikoptern skuttar. Humlan och bananen skrattar med</p><p class='ans'>Lage: <b>jatteglad</b> · solen: <b>fnissig</b></p></figcaption></figure><figure class='frame'><img src='frames/07a.jpg' alt='Bild 07a' loading='lazy'><figcaption><div class='t'>07a · 1:32.0 · Turkost kritsvep → <b>Dammen</b> · helbild (5)</div><div class='song'>Vad är gult? <i>(Vad är gult?)</i> Titta där! <i>(Titta där!)</i></div><p>Helikoptern landar i gräset vid dammen i två lugna sänkningar. Kajsa står vid kanten med hatten. Tre näckrosblad på vattnet</p><p class='ans'>Lage: <b>nyfiken</b> · Kajsa: <b>glad</b></p></figcaption></figure><figure class='frame'><img src='frames/07b.jpg' alt='Bild 07b' loading='lazy'><figcaption><div class='t'>07b · 1:36.9 · Dammen, tvåbild (5)</div><div class='song'>Hatten är gul –</div><p>Hatten gnistrar på Kajsas huvud</p><p class='ans'>Kajsa: <b>stolt</b></p></figcaption></figure><figure class='frame'><img src='frames/07c.jpg' alt='Bild 07c' loading='lazy'><figcaption><div class='t'>07c · 1:38.5 · Dammen (5)</div><div class='song'>hej, hej, hej!</div><p>Kajsa vinkar tre gånger, Lage vinkar tillbaka. Ljud: ett mjukt <code>mu</code> på första &quot;hej&quot;</p><p class='ans'>Kajsa: <b>jatteglad</b> · Lage: <b>jatteglad</b></p></figcaption></figure><figure class='frame'><img src='frames/08a.jpg' alt='Bild 08a' loading='lazy'><figcaption><div class='t'>08a · 1:40.3 · Dammen (5)</div><div class='song'><i>(mellanspel 1, oroligt, ca 9 s)</i></div><p>Rotorn snurrar fortfarande: en vindvirvel lyfter hatten, den seglar ut och landar på det tredje näckrosbladet (plopp). Kajsa tittar ledset. Lage stänger av motorn, rotorn saktar in och stannar. Kajsa får en tår. Ljud: <code>plopp</code> när hatten landar på bladet</p><p class='ans'>Kajsa: <b>forvanad</b> → <b>ledsen</b> · Lage: <b>forvanad</b></p></figcaption></figure><figure class='frame'><img src='frames/08b.jpg' alt='Bild 08b' loading='lazy'><figcaption><div class='t'>08b · 1:49.2 · Dammen, bladen (5)</div><div class='song'><i>(mellanspel 2, glatt, ca 9 s)</i></div><p>Gurra hoppar upp på första bladet, sedan blad till blad, ett hopp per takt, tar hatten och hoppar tillbaka. Han räcker den till Kajsa, hon sätter på sig den och nickar tack. Bytet till det glada ljudet ca-tid, justeras mot ljudet. Ljud: ett <code>kvak</code> och ett <code>plopp</code> per hopp. När hatten är tillbaka på Kajsa gnistrar den och alla tre jublar (<code>jubel</code>, kort)</p><p class='ans'>Gurra: <b>jatteglad</b> → <b>stolt</b> · Kajsa: <b>ledsen</b> → <b>jatteglad</b></p></figcaption></figure><figure class='frame'><img src='frames/09a.jpg' alt='Bild 09a' loading='lazy'><figcaption><div class='t'>09a · 1:58.2 · Dammen · helbild (5)</div><div class='song'>Gul-la-la! <i>(Gul-la-la!)</i></div><p>Refräng 3 vid dammen: alla tre gungar i takt i solskenet, ca-tid</p><p class='ans'>alla: <b>jatteglad</b></p></figcaption></figure><figure class='frame'><img src='frames/09b.jpg' alt='Bild 09b' loading='lazy'><figcaption><div class='t'>09b · 2:00.6 · Dammen (5)</div><div class='song'>Snurra, snurra – vi flyger!</div><p>Lage startar motorn igen, rotorn snurrar mjukt (ingen vind mot hatten: Kajsa håller i den)</p><p class='ans'>Lage: <b>glad</b> · Kajsa: <b>fnissig</b></p></figcaption></figure><figure class='frame'><img src='frames/09c.jpg' alt='Bild 09c' loading='lazy'><figcaption><div class='t'>09c · 2:02.8 · Dammen (5)</div><div class='song'>Gul-la-la! <i>(Gul-la-la!)</i></div><p>Som 09a</p><p class='ans'>alla: <b>jatteglad</b></p></figcaption></figure><figure class='frame'><img src='frames/09d.jpg' alt='Bild 09d' loading='lazy'><figcaption><div class='t'>09d · 2:04.8 · Dammen (5)</div><div class='song'>Upp, upp, upp till solen!</div><p>Helikoptern lyfter i tre lyft, Kajsa och Gurra vinkar</p><p class='ans'>Lage: <b>jatteglad</b> · Kajsa, Gurra: <b>glad</b></p></figcaption></figure><figure class='frame'><img src='frames/09e.jpg' alt='Bild 09e' loading='lazy'><figcaption><div class='t'>09e · 2:07.0 · Dammen · helbild (5)</div><div class='song'>Gul är den gladaste färgen! <i>(Ha-ha!)</i></div><p>Kajsa och Gurra hoppar, helikoptern skuttar i luften ovanför. På &quot;Ha-ha!&quot; skrattar alla. Solen tittar fram över vassen och färgar allt gult på &quot;Ha-ha!&quot;, som jättesolens flod</p><p class='ans'>alla: <b>jatteglad</b></p></figcaption></figure><figure class='frame'><img src='frames/10a.jpg' alt='Bild 10a' loading='lazy'><figcaption><div class='t'>10a · 2:09.1 · Rakt klipp → <b>discot</b> (6)</div><div class='song'>Nu dansar vi! <i>(Dansa!)</i></div><p>Fyra på golvet, lika stora (grodan lite mindre): Kajsa (med hatten), Gurra, Humle och Hugo. Lage är inte med, han kommer i helikoptern på &quot;Hej då&quot;</p><p class='ans'>alla: <b>jatteglad</b></p></figcaption></figure><figure class='frame'><img src='frames/10b.jpg' alt='Bild 10b' loading='lazy'><figcaption><div class='t'>10b · 2:12.6 · Discot (6)</div><div class='song'>Klappa händer – <i>(klapp, klapp!)</i></div><p>Första varvet, en dansare per rörelse: Kajsa klappar, händerna möts framför bröstet</p><p class='ans'>Kajsa: <b>jatteglad</b> · de andra: <b>glad</b></p></figcaption></figure><figure class='frame'><img src='frames/10c.jpg' alt='Bild 10c' loading='lazy'><figcaption><div class='t'>10c · 2:14.8 · Discot (6)</div><div class='song'>Gunga kroppen – <i>(gung, gung!)</i></div><p>Humle gungar åt sidan, två gånger</p><p class='ans'>Humle: <b>jatteglad</b> · de andra: <b>glad</b></p></figcaption></figure><figure class='frame'><img src='frames/10d.jpg' alt='Bild 10d' loading='lazy'><figcaption><div class='t'>10d · 2:16.8 · Discot (6)</div><div class='song'>Hoppa högt – <i>(hopp, hopp!)</i></div><p>Gurra hoppar högt, två gånger</p><p class='ans'>Gurra: <b>jatteglad</b> · de andra: <b>glad</b></p></figcaption></figure><figure class='frame'><img src='frames/10e.jpg' alt='Bild 10e' loading='lazy'><figcaption><div class='t'>10e · 2:19.0 · Discot (6)</div><div class='song'>En gång till! <i>(En gång till!)</i></div><p>Hugo blinkar och pekar på tittaren: du också. Ljud: <code>vov</code> på &quot;En gång till!&quot;</p><p class='ans'>Hugo: <b>blinkar</b> + <b>pekar</b> · de andra: <b>glad</b></p></figcaption></figure><figure class='frame'><img src='frames/10f.jpg' alt='Bild 10f' loading='lazy'><figcaption><div class='t'>10f · 2:21.1 · Discot (6)</div><div class='song'>Klappa händer – Gunga kroppen – Hoppa högt – <i>(ekon)</i></div><p>Andra varvet direkt efter: <b>alla</b> gör varje rörelse tillsammans, en rörelse per rad, så att barnen kan göra med. Kameran lite närmare</p><p class='ans'>alla: <b>jatteglad</b></p></figcaption></figure><figure class='frame'><img src='frames/10g.jpg' alt='Bild 10g' loading='lazy'><figcaption><div class='t'>10g · 2:27.3 · Discot (6)</div><div class='song'>Hurra!</div><p>Armarna upp</p><p class='ans'>alla: <b>jatteglad</b> + <b>hurra</b></p></figcaption></figure><figure class='frame'><img src='frames/11a.jpg' alt='Bild 11a' loading='lazy'><figcaption><div class='t'>11a · 2:28.1 · Discot (6)</div><div class='song'>Gul banan – <i>(mums!)</i></div><p>Bananen slås upp stort mitt i bild och flyger upp i bågen runt kulan. Helikoptern sitter redan i bågen</p><p class='ans'>alla: <b>glad</b></p></figcaption></figure><figure class='frame'><img src='frames/11b.jpg' alt='Bild 11b' loading='lazy'><figcaption><div class='t'>11b · 2:30.1 · Discot (6)</div><div class='song'>Gul humla – <i>(surr, surr!)</i></div><p>Humlans klistermärke slås upp stort i mitten och flyger upp i bågen; Humle surrar och skuttar</p><p class='ans'>Humle: <b>jatteglad</b></p></figcaption></figure><figure class='frame'><img src='frames/11c.jpg' alt='Bild 11c' loading='lazy'><figcaption><div class='t'>11c · 2:32.1 · Discot (6)</div><div class='song'>Gul hatt – <i>(hej, hej!)</i></div><p>Hattens klistermärke slås upp stort i mitten och flyger upp i bågen; Kajsa vinkar</p><p class='ans'>Kajsa: <b>jatteglad</b></p></figcaption></figure><figure class='frame'><img src='frames/11d.jpg' alt='Bild 11d' loading='lazy'><figcaption><div class='t'>11d · 2:34.3 · Discot (6)</div><div class='song'>Gul är den gladaste färgen! <i>(Ha-ha!)</i></div><p>Alla hoppar, stort hopp på &quot;Ha-ha!&quot;</p><p class='ans'>alla: <b>jatteglad</b></p></figcaption></figure><figure class='frame'><img src='frames/11e.jpg' alt='Bild 11e' loading='lazy'><figcaption><div class='t'>11e · 2:37.0 · Discot (6)</div><div class='song'>Hej då! <i>(Hej då!)</i></div><p>Helikoptern flyger in bakifrån genom en lucka mitt mellan dansarna och växer mjukt medan dansarna krymper och glider isär. Lage vinkar. Vinkningarna börjar en i taget, 0,25 s isär</p><p class='ans'>Lage: <b>blinkar</b> + vinkande arm · alla: <b>glad</b></p></figcaption></figure><figure class='frame'><img src='frames/12.jpg' alt='Bild 12' loading='lazy'><figcaption><div class='t'>12 · 2:39.9 · Rakt klipp → himlen</div><div class='song'><i>(outro, ca 10 s, sången slutar 2:50.2)</i></div><p>Helikoptern flyger in åt höger och stannar, Lage vinkar; kritirisen sluter sig runt hans ansikte på de sista takterna, stjärnglimt, svart</p><p class='ans'>Lage: <b>jatteglad</b>, sedan <b>somnig</b></p></figcaption></figure></div>
