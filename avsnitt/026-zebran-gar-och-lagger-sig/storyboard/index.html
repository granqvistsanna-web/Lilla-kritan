<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zebran går och lägger sig storyboard</title>
<style>
:root { --paper:#fbfaf6; --card:#fff; --ink:#2a2620; --muted:#6e675c; --line:#e6e1d6; --rosa:#b8506a }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper:#1d1c22; --card:#26252c; --ink:#f1ede4; --muted:#a8a196; --line:#3a3842; --rosa:#f2a7b8; color-scheme:dark } }
:root[data-theme="dark"] { --paper:#1d1c22; --card:#26252c; --ink:#f1ede4; --muted:#a8a196; --line:#3a3842; --rosa:#f2a7b8; color-scheme:dark }
* { box-sizing:border-box }
body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.5 system-ui,sans-serif }
.wrap { max-width:1240px; margin:0 auto; padding:40px 16px 72px }
h1 { font-size:clamp(30px,6vw,52px); margin:0 } h1 span { color:var(--rosa) }
.lede { color:var(--muted); max-width:72ch }
.frames { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; margin-top:24px }
.frame { margin:0; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden }
.frame img { width:100%; height:auto; display:block }
figcaption { padding:12px 14px 14px; display:grid; gap:6px; font-size:14px } figcaption p { margin:0 }
.t { font:500 12px ui-monospace,monospace; color:var(--muted) }
.said { border-left:3px solid var(--rosa); padding-left:10px }
.ans { color:var(--muted); font-size:13px }
</style></head><body><div class="wrap">
<h1>Zebran går och lägger sig <span>storyboard</span></h1>
<p class="lede">Avsnitt 026, 2:59.5 med bilderbok-introt. En stillbild per rad i <code>storyboard.md</code>, tagen ur kodscenen. Sovrummet, sängen och täcket är platshållare i kod tills bilderna finns. 27 bilder.</p>
<div class="frames"><figure class="frame"><img src="frames/00.jpg" alt="Bild 00" loading="lazy"><figcaption>
  <div class="t">00 · 0:00.0 · 3.3 s · Intro</div><div class="said">–</div>
  <p>Det gemensamma bilderbok-introt ("bilderbok!" på papperskortet), tonar till samma papper som scenen</p><p class="ans">Ljud: introts jingel · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/01a.jpg" alt="Bild 01a" loading="lazy"><figcaption>
  <div class="t">01a · 0:03.3 · 6.0 s · Papperet, helbild</div><div class="said"><i>"Kritan ritar …"</i> (0:04.3)</div>
  <p>Kritan kommer in och ritar zebrans kontur i lugna drag (7 s): kroppen med manen, öronen, mulen</p><p class="ans">Ljud: kritan ritar, skogsljud under · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/01b.jpg" alt="Bild 01b" loading="lazy"><figcaption>
  <div class="t">01b · 0:09.3 · 7.5 s · Papperet, helbild</div><div class="said"><i>"Hm … vad blir det nu?"</i> (0:09.3)</div>
  <p>Konturen ritas klar (armarna ett drag var, benen, leendet, ränderna sist), sedan väntar kritan bredvid och vajar: barnet gissar</p><p class="ans">Ljud: kritan ritar · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/01c.jpg" alt="Bild 01c" loading="lazy"><figcaption>
  <div class="t">01c · 0:16.8 · 4.3 s · Papperet, helbild → zoom in</div><div class="said"><i>"Oj! En zebra!"</i> (0:17.4)</div>
  <p>Den riktiga zebran fylls i inifrån. Sista 0,8 s: zoom in i teckningen</p><p class="ans">Ljud: – · Ansikte: glad</p></figcaption></figure>
<figure class="frame"><img src="frames/1.jpg" alt="Bild 1" loading="lazy"><figcaption>
  <div class="t">1 · 0:21.1 · 5.9 s · Sovrummet, helbild, kvällsljus</div><div class="said"><i>"Hej, zebran! Hej, hej!"</i> (0:22.7)</div>
  <p>Lampan lyser. Zebran går in från höger bakom sängen (riggens gång), stannar mitt bakom sängen och vinkar. <b>Hej med vinkning</b></p><p class="ans">Ljud: <code>trav</code>, glatt gnägg · Ansikte: jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/2.jpg" alt="Bild 2" loading="lazy"><figcaption>
  <div class="t">2 · 0:27.0 · 6.1 s · Fönstret och zebran</div><div class="said"><i>"Det är kväll nu. Titta, månen!"</i> (0:27.4)</div>
  <p>Månen i fönstret. Zebran tittar dit, öronen vippar</p><p class="ans">Ljud: förtjust gnägg · Ansikte: nyfiken → glad</p></figcaption></figure>
<figure class="frame"><img src="frames/3.jpg" alt="Bild 3" loading="lazy"><figcaption>
  <div class="t">3 · 0:33.1 · 5.2 s · Sovrummet, helbild</div><div class="said"><i>"Nu ska du väl gå och lägga dig?"</i> (0:33.4)</div>
  <p>Sängen. Zebran skakar på huvudet: ägget lutar ±6° tre gånger</p><p class="ans">Ljud: trumpet frust · Ansikte: trumpen</p></figcaption></figure>
<figure class="frame"><img src="frames/4.jpg" alt="Bild 4" loading="lazy"><figcaption>
  <div class="t">4 · 0:38.3 · 8.3 s · Närbild zebran</div><div class="said"><i>"Oj då. Zebran vill visst inte lägga sig."</i> (0:38.6) … <i>"Hm … vad gör vi nu?"</i> (0:42.6)</div>
  <p>Zebran vänder bort huvudet (riktningsposen åt vänster), öronen faller. Paus 1 s mellan replikerna</p><p class="ans">Ljud: trumpet frust · Ansikte: trumpen, tittar bort</p></figcaption></figure>
<figure class="frame"><img src="frames/5a.jpg" alt="Bild 5a" loading="lazy"><figcaption>
  <div class="t">5a · 0:46.6 · 10.9 s · Halvbild → närbild sängens huvudända</div><div class="said"><i>"Titta! Kritan ritar något."</i> (0:46.9)</div>
  <p>Kritan kommer in och ritar kuddens kontur på sängens vänstra ände (4 s), väntar sedan bredvid och vajar: gisspaus 3 s</p><p class="ans">Ljud: kritan ritar · Ansikte: nyfiken</p></figcaption></figure>
<figure class="frame"><img src="frames/5b.jpg" alt="Bild 5b" loading="lazy"><figcaption>
  <div class="t">5b · 0:57.5 · 5.2 s · Samma → halvbild</div><div class="said"><i>"En kudde! Varsågod, zebran."</i> (0:57.7)</div>
  <p>Den riktiga kudden fylls i inifrån. <i>Varsågod</i></p><p class="ans">Ljud: glitter · Ansikte: förvånad</p></figcaption></figure>
<figure class="frame"><img src="frames/6.jpg" alt="Bild 6" loading="lazy"><figcaption>
  <div class="t">6 · 1:02.7 · 8.5 s · Halvbild</div><div class="said"><i>"Ska vi säga tack?"</i> (1:03.0) … <i>"Tack!"</i> (1:08.2)</div>
  <p>Zebran tittar på kudden, öronen reser sig. Paus 4 s: barnet säger tack. Efter <i>Tack!</i> nickar zebran</p><p class="ans">Ljud: nyfiket gnägg, sedan förtjust gnägg · Ansikte: nyfiken → jätteglad</p></figcaption></figure>
<figure class="frame"><img src="frames/7.jpg" alt="Bild 7" loading="lazy"><figcaption>
  <div class="t">7 · 1:11.2 · 6.9 s · Halvbild</div><div class="said"><i>"Mmm … vilken mjuk kudde!"</i> (1:12.2)</div>
  <p>Kudden glider upp till zebrans kind, zebran blundar och myser, och kudden glider tillbaka</p><p class="ans">Ljud: <code>puff</code>, mysig suck · Ansikte: blundar, ler</p></figcaption></figure>
<figure class="frame"><img src="frames/8.jpg" alt="Bild 8" loading="lazy"><figcaption>
  <div class="t">8 · 1:18.0 · 7.7 s · Närbild zebran</div><div class="said"><i>"Oj! Var är zebran?"</i> (1:19.0)</div>
  <p>Täcket glider upp framför ansiktet så att ögonen täcks. Paus 4 s</p><p class="ans">Ljud: <code>prassel-tyg</code>, ett litet gnägg under täcket · Ansikte: (under täcket)</p></figcaption></figure>
<figure class="frame"><img src="frames/9.jpg" alt="Bild 9" loading="lazy"><figcaption>
  <div class="t">9 · 1:25.8 · 3.0 s · Samma</div><div class="said"><i>"Tittut!"</i> (1:25.8)</div>
  <p>Täcket glider ner på <i>"Tittut!"</i>, zebran tittar fram</p><p class="ans">Ljud: fniss · Ansikte: fnissig</p></figcaption></figure>
<figure class="frame"><img src="frames/10.jpg" alt="Bild 10" loading="lazy"><figcaption>
  <div class="t">10 · 1:28.7 · 10.7 s · Samma</div><div class="said"><i>"Var är zebran?"</i> (1:29.6) … <i>"Tittut!"</i> (1:33.3)</div>
  <p>En gång till, kortare: upp, paus 2 s, ner på <i>"Tittut!"</i>. <b>Leken (tittut)</b></p><p class="ans">Ljud: <code>prassel-tyg</code>, långt fniss · Ansikte: fnissig</p></figcaption></figure>
<figure class="frame"><img src="frames/11.jpg" alt="Bild 11" loading="lazy"><figcaption>
  <div class="t">11 · 1:39.4 · 7.3 s · Halvbild</div><div class="said"><i>"Oj, en gäspning! Är du trött nu?"</i> (1:40.7)</div>
  <p>Zebran gäspar (munnen ett stort O, ögonen kniper ihop). <b>Shorten börjar här</b></p><p class="ans">Ljud: <code>gaspning</code>, sömnigt gnägg · Ansikte: sömnig, gäspar</p></figcaption></figure>
<figure class="frame"><img src="frames/12.jpg" alt="Bild 12" loading="lazy"><figcaption>
  <div class="t">12 · 1:46.7 · 7.8 s · Lampan och zebran</div><div class="said"><i>"Först lampan. Gäsp … god natt!"</i> (1:47.1)</div>
  <p>Zebran gäspar på <i>"Gäsp"</i>, lampan släcks på <i>"natt"</i>: skenet tonas bort på 0,4 s, rummet blir lite mörkare och varmt blått</p><p class="ans">Ljud: <code>lampa-klick</code> · Ansikte: sömnig</p></figcaption></figure>
<figure class="frame"><img src="frames/13.jpg" alt="Bild 13" loading="lazy"><figcaption>
  <div class="t">13 · 1:54.5 · 7.5 s · Fönstret och zebran</div><div class="said"><i>"Och månen. Gäsp … god natt!"</i> (1:54.9)</div>
  <p>Zebran gäspar på <i>"Gäsp"</i>, månen lyser upp mjukt på <i>"natt"</i></p><p class="ans">Ljud: <code>glimt</code> · Ansikte: sömnig</p></figcaption></figure>
<figure class="frame"><img src="frames/14.jpg" alt="Bild 14" loading="lazy"><figcaption>
  <div class="t">14 · 2:02.0 · 6.8 s · Halvbild</div><div class="said"><i>"Oj, nallen då? Zebran vet inte var."</i> (2:02.3)</div>
  <p>Zebran tittar åt vänster, sedan åt höger (ögonen och ansiktet, huvudet vänds inte)</p><p class="ans">Ljud: frågande gnägg · Ansikte: nyfiken</p></figcaption></figure>
<figure class="frame"><img src="frames/15.jpg" alt="Bild 15" loading="lazy"><figcaption>
  <div class="t">15 · 2:08.8 · 10.1 s · Närbild kudden (klipp)</div><div class="said"><i>"Kan du hjälpa zebran? Kan du se var nallen är?"</i> (2:09.1)</div>
  <p>Två bruna öron sticker upp bakom kudden. Paus 5 s; efter ca 3 s skimrar de svagt</p><p class="ans">Ljud: tyst · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/16.jpg" alt="Bild 16" loading="lazy"><figcaption>
  <div class="t">16 · 2:18.9 · 5.7 s · Samma</div><div class="said"><i>"Ja, där! Ja, bakom kudden!"</i> (2:18.9)</div>
  <p>Öronen skimrar tydligt</p><p class="ans">Ljud: förtjust gnägg, <code>tindra</code> · Ansikte: –</p></figcaption></figure>
<figure class="frame"><img src="frames/17.jpg" alt="Bild 17" loading="lazy"><figcaption>
  <div class="t">17 · 2:24.6 · 8.3 s · Halvbild</div><div class="said"><i>"Gäsp … god natt!"</i> (2:26.8)</div>
  <p>Nallen glider fram bakom kudden och sätter sig bredvid zebran. Zebran gäspar på <i>"Gäsp"</i></p><p class="ans">Ljud: <code>nalle-hopp</code>, mysig suck · Ansikte: sömnig, gäspar</p></figcaption></figure>
<figure class="frame"><img src="frames/18a.jpg" alt="Bild 18a" loading="lazy"><figcaption>
  <div class="t">18a · 2:32.9 · 6.3 s · Halvbild</div><div class="said"><i>"Kan du också gäspa?"</i> (2:33.2)</div>
  <p>Zebran tittar på barnet. Paus 4 s: barnet gäspar</p><p class="ans">Ljud: tyst i pausen · Ansikte: sömnig</p></figcaption></figure>
<figure class="frame"><img src="frames/18b.jpg" alt="Bild 18b" loading="lazy"><figcaption>
  <div class="t">18b · 2:39.2 · 3.8 s · Samma</div><div class="said"><i>"Gääsp …"</i> (2:39.2)</div>
  <p>Zebran gäspar en gång till på <i>"Gääsp"</i>. <b>Leken (gäspa med). Shorten slutar här</b></p><p class="ans">Ljud: <code>gaspning</code>, fniss · Ansikte: gäspar → fnissig</p></figcaption></figure>
<figure class="frame"><img src="frames/19.jpg" alt="Bild 19" loading="lazy"><figcaption>
  <div class="t">19 · 2:43.0 · 5.8 s · Halvbild</div><div class="said"><i>"Hej då, zebran! Hej då, kudden!"</i> (2:43.3)</div>
  <p>Zebran vinkar sömnigt (armen bakom kroppen, snett ut förbi kanten). <b>Hej då med vinkning</b></p><p class="ans">Ljud: mjukt hej då-gnägg · Ansikte: sömnig, glad</p></figcaption></figure>
<figure class="frame"><img src="frames/20.jpg" alt="Bild 20" loading="lazy"><figcaption>
  <div class="t">20 · 2:48.7 · 8.3 s · Halvbild</div><div class="said"><i>"Hej då! Vi ses snart!"</i> (2:51.3)</div>
  <p>Zebran somnar (Somnar C): litet hopp, landar liggande på magen på kudden, täcket glider upp till hakan, zzz</p><p class="ans">Ljud: <code>snark-pip</code>, <code>godnatt-pling</code> · Ansikte: sover</p></figcaption></figure>
<figure class="frame"><img src="frames/21.jpg" alt="Bild 21" loading="lazy"><figcaption>
  <div class="t">21 · 2:57.0 · 2.5 s · Sovrummet → kritirisen</div><div class="said">–</div>
  <p>Kritirisen drar ihop sig runt zebran och nallen</p><p class="ans">Ljud: – · Ansikte: sover</p></figcaption></figure></div>
</div></body></html>
