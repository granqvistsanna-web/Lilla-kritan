  .map(([u, v]) => [RM.x + u * RM.width, RM.y + v * RM.height]);

const krita = el('g', {}, SET.papper);

  <path d="M-16 -2 L0 26 L16 -2Z" fill="#F6AAC8" stroke="#fff" stroke-width="5" stroke-linejoin="round"/><rect x="-16" y="-180" width="32" height="70" fill="#FBD3E3"/></g>`;

// vägkanten (som 005:s vägen 1): v2-granar och rosa buskar glider förbi bakom vägen; [tid när mitten är vid x = W, sak, höjd].

const VAGKANT = [];
for (let t = 9, i = 0; t < 80; t += 1.9, i++) VAGKANT.push([t, i % 3 === 1 ? 'buske-rosa' : 'lovtrad', i % 3 === 1 ? 110 : [230, 250, 215][i % 3]]);
VAGKANT.push([17.0 + (W / 3) / V, 'buske-rosa', 150]);

function vagkant(s) { kant.forEach(({ tid, s: k }) => { const x = W + V * (tid - s); k.g.style.display = x > -300 && x < W + 300 ? '' : 'none'; k.pa(x); }); }
nyttSet('disco');   // 005:s disco (Sanna 2026-11-09: "back disco scene"): dansen 12a–12h
bild(`${ROT}avsnitt/005-rosa-bilen/scener/lager/disco.png`, SET.disco, { width: W, height: H, preserveAspectRatio: 'xMidYMid slice' });

nyttSet('berg');
el('rect', { x: -400, y: -900, width: 2200, height: 2200, fill: 'url(#himmel19)' }, SET.berg);
const marken = el('g', {}, SET.berg);
el('path', { d: `M-400 640 Q300 600 900 625 T1900 615 V1300 H-400Z`, fill: '#9fd46e' }, marken);
el('path', { d: `M-400 700 Q400 680 900 692 T1900 690 V1300 H-400Z`, fill: '#FBF7EE' }, marken);
const berget = el('g', {}, SET.berg);
const GBERG = { fil: `${ROT}assets/rekvisita/glassberg-v3/cut/glassberg.png`, w: 2360, h: 1750, topp: [1200, 95], mitt: 1180 };
bild(GBERG.fil, berget, { width: GBERG.w, height: GBERG.h });

// moln som klistermärken (rosa eller vita) i figurlagret: [typ, x, y, bredd, rosa, sy]
const molnG = el('g', {}, L.figurer);
const molnen = Array.from({ length: 7 }, () => { const g = el('g', {}, molnG), b = bild(`${MOLN}moln-stor.png`, g, { width: 1, height: 1 }); return { g, b }; });
const molnH = (typ, w, rosa = true) => { const [w0, h0] = (rosa ? ROSAFIL : MOLNFIL)[typ]; return w * h0 / w0; };
function moln(lista) {
  molnen.forEach((m, i) => {
    const d = lista[i]; m.g.style.display = d ? '' : 'none'; if (!d) return;
    const [typ, x, y, w, rosa = true, sy = 1] = d, h = molnH(typ, w, rosa);
    m.b.setAttribute('href', rosa ? `${ROSA}moln-rosa-${typ}.png` : `${MOLN}moln-${typ}.png`);
    Object.entries({ x: -w / 2, y: -h / 2, width: w, height: h }).forEach(([k, v]) => m.b.setAttribute(k, v));
    m.g.setAttribute('transform', `translate(${x} ${y}) scale(${2 - sy} ${sy})`);
  });
}
const pa = (x, y, typ, w) => [x, y - 0.36 * molnH(typ, w)];   // där en figur står på ett moln

// ---------- figurerna ----------
const bil = bilen.ny(L.figurer, { kontur: true }), bilTom = bilen.ny(L.figurer, { mus: false });
const mus = await bilen.musen({ h: 300, forelder: L.figurer });
const kanin = v2.figur('kaninen-kanel', L.figurer, { h: 300, ben: true });
L.figurer.insertBefore(kanin.g, mus.g);   // Mille framför kaninen när de står tätt (trappan)
const saker = el('g', {}, L.figurer);
const sak = (fil, w, h0w0) => { const g = el('g', {}, saker); bild(fil, g, { width: w, height: w * h0w0 }); return { g,
  pa(x, y, s = 1, rot = 0) { g.style.display = s > 0.01 ? '' : 'none'; g.setAttribute('transform', `translate(${x} ${y}) rotate(${rot}) scale(${s}) translate(${-w / 2} ${-w * h0w0})`); } }; };
const glass2 = sak(bilen.GLASS.rosa, 70, 743 / 431);
const klisterGlass = sak(bilen.GLASS.rosa, 120, 743 / 431);
const ballong = sak(`${RV2}ballong-rosa-v2.png`, 150, 1050 / 671);
const flagga = sak(`${RV2}flagga-rosa-v2.png`, 110, 862 / 501);
const kulor = el('g', {}, saker);
[[0, 0, 34], [70, 8, 28], [-60, 10, 26]].forEach(([x, y, r]) => el('circle', { cx: x, cy: y, r, fill: '#F28DB8', stroke: '#fff', 'stroke-width': 6 }, kulor));
// pynt i bildrutan (utanför kameran): gnistor, strössel, varmt ljus, molnsvepet, kritirisen
const gnistor = el('g', {}, L.overst);
const STJ = r => `M0 ${-r * 2}L${r * 0.5} ${-r * 0.5}L${r * 2} 0L${r * 0.5} ${r * 0.5}L0 ${r * 2}L${-r * 0.5} ${r * 0.5}L${-r * 2} 0L${-r * 0.5} ${-r * 0.5}Z`;
function gnista(lista, s = 0, farg = '#F6AAC8') {   // [x, y, r]; blinkar en i taget
  gnistor.innerHTML = lista.map(([x, y, r = 10], i) => { const k = 0.55 + 0.45 * Math.sin(s * 5 + i * 1.9);
    return `<g transform="translate(${x} ${y}) rotate(${(s * 25 + i * 40) % 90}) scale(${k.toFixed(3)})"><path d="${STJ(r)}" fill="${farg}" stroke="#fff" stroke-width="3"/></g>`; }).join('');
}
const strossel = el('g', {}, L.overst);
const STR = Array.from({ length: 46 }, (_, i) => ({ x: (i * 157) % W, v: 70 + (i * 37) % 60, f: ['#F28DB8', '#FFD45C', '#7CC7F0', '#9FD46E', '#fff'][i % 5], r: (i * 47) % 180, o: (i * 0.137) % 1 }));
function strossla(s, k) {
  strossel.innerHTML = k <= 0 ? '' : STR.map(p => { const y = ((s * p.v + p.o * (H + 60)) % (H + 60)) - 30, x = p.x + 18 * Math.sin(s * 1.3 + p.o * 9);
    return `<rect x="-10" y="-3.5" width="20" height="7" rx="3.5" fill="${p.f}" stroke="#fff" stroke-width="1.5" opacity="${k}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(p.r + s * 90) % 360})"/>`; }).join('');
}
const varm = el('rect', { x: 0, y: 0, width: W, height: H, fill: '#FFC98A', opacity: 0, style: 'mix-blend-mode:multiply' }, L.overst);
// molnsvepet (Sanna 2026-11-09: "i like the cloud transition, polish and improve it"): två lager rosa moln. Det bakre (ljusare,
// mindre) drar förbi lite före och snabbare, det främre är en tät molnbank utan platt yta: kanterna och mitten är molnbilder.
// Banken saktar in medan den täcker bilden (klippet sker mitt i), molnen gungar lite var för sig och puffar upp sig.
const svep = el('g', {}, L.overst), svepBak = el('g', { opacity: 0.85 }, svep), svepFram = el('g', {}, svep);
const SVEP_B = 1900;   // bankens bredd
el('rect', { x: 260, y: -200, width: SVEP_B - 520, height: H + 400, fill: MOLNROSA }, svepFram);
const svepMoln = [];
const lagg = (g, typ, x, y, w, fas) => { const h = molnH(typ, w), mg = el('g', {}, g);
  bild(`${ROSA}moln-rosa-${typ}.png`, mg, { x: -w / 2, y: -h / 2, width: w, height: h }); svepMoln.push({ mg, x, y, fas }); };
[[0, -40], [60, 170], [-20, 390], [50, 600], [-10, 810]].forEach(([dx, y], i) => lagg(svepFram, ['stor', 'mellan', 'stor', 'lang', 'stor'][i], 260 + dx, y, 620, i));
[[0, 40], [-60, 260], [20, 480], [-40, 700], [10, 900]].forEach(([dx, y], i) => lagg(svepFram, ['mellan', 'stor', 'lang', 'stor', 'mellan'][i], SVEP_B - 260 + dx, y, 620, i + 5));
[[700, 120], [1150, 300], [820, 520], [1250, 700], [950, 860], [1000, 60]].forEach(([x, y], i) => lagg(svepFram, ['stor', 'mellan', 'stor', 'liten', 'mellan', 'lang'][i], x, y, 560, i + 10));
[[0, 120], [300, 420], [80, 700], [520, 250], [380, 880]].forEach(([x, y], i) => lagg(svepBak, ['liten', 'mellan', 'liten', 'stor', 'mellan'][i], x, y, 360, i + 20));
const SVEP = [42.9, 60.8, 72.0, 117.7, 148.0, 186.4, 200.6, 207.3];   // platsbyten (sångtid): molnen täcker bilden här
const SV = 1.0;   // halva svepet (s)
function molnsvep(s) {
  const t0 = SVEP.find(a => s > a - SV && s < a + SV);
  svep.style.display = t0 == null ? 'none' : '';
  if (t0 == null) return;
  // läget: in snabbt, långsamt genom mitten (täcker), ut snabbt; vid t0 täcker banken hela bilden
  const k = del(t0 - SV, t0 + SV, s), u = 0.5 + 0.5 * Math.sign(k - 0.5) * Math.abs(2 * k - 1) ** 1.6;
  const mittX = (W - SVEP_B) / 2;
  svepFram.setAttribute('transform', `translate(${u < 0.5 ? lerp(W + 40, mittX, u * 2) : lerp(mittX, -SVEP_B - 40, u * 2 - 1)} 0)`);
  svepBak.setAttribute('transform', `translate(${lerp(W + 500, -900, del(t0 - SV * 1.1, t0 + SV * 0.6, s))} 0)`);
  svepMoln.forEach(({ mg, x, y, fas }) => { const p = 1 + 0.04 * Math.sin(s * 4 + fas * 1.7);
    mg.setAttribute('transform', `translate(${x + 10 * Math.sin(s * 2 + fas)} ${y + 8 * Math.cos(s * 2.3 + fas)}) scale(${p})`); });
}
const iris = el('path', { fill: '#000', 'fill-rule': 'evenodd' }, L.overst);
const irisKant = el('path', { fill: 'none', stroke: '#fff8e0', 'stroke-linejoin': 'round' }, el('g', { filter: 'url(#boil)' }, L.overst));

const DM = 560, DK = 800, DY = 715, DH = 300;   // discot: Mille, kaninen, golvet, storleken

function nollstall() {

const iBil = (s, p = {}) => { const x = p.x ?? BIL_X, y = p.y ?? GV, h = p.h ?? BIL_H;

  bil.pose({ x: p.x ?? BIL_X, y: (p.y ?? GV) + gung(s) + (p.dy ?? 0), h: p.h ?? BIL_H, tilt: (p.tilt ?? -1) + 0.8 * Math.sin(Math.PI * fas(s) / 2),
  dist: p.dist ?? V * s, lyft: p.lyft, rot: p.rot, humor: p.humor || 'glad', titt: p.titt ?? 0.4, tittY: p.tittY,
  arm_r: p.arm_r ?? 'kant', arm_l: p.arm_l ?? 'kant', m: p.m, mums: p.mums, kropp: p.kropp, fram: p.fram });
  if (p.dist == null || p.puffa) bil.puffa(s, PUFF); };
const narMus = (zoom = 1.7) => { const [x, y] = bil.musPunkt([512, 560]); kit.kamera(x, y + 40, zoom); };
const musPa = p => mus.pose({ h: 260, humor: 'glad', ...p });
// Storlek i världen (art direction v2, Sanna 2026-11-09 "make the characters the same size"): kroppen, utan öronen, lika hög.
// Mätt i ../_test/: kaninen på h × 1,03 har Milles kroppshöjd på h, och Mille i bilen är lika stor som Mille på h = 0,777 × bilens h.
const KANIN_K = 1.03, I_BIL = 0.777;
// kaninen använder sin egen v2-rigg fullt ut: pose (POSER: hurra, lyssnar, sitter, ner, pekar …) och rörelser (klappa, dansa)
const kaninPa = p => { const P = p.pose ? { ...kanin.R.POSER[p.pose], ...(p.pose2 || {}) } : p.pose2;
  kanin.pose({ humor: 'glad', ...p, pose2: P, s: (p.h ?? 260) * KANIN_K / (kanin.F.bbox[3] - kanin.F.bbox[1]) }); };   // v2.figur läser s, inte h
// hopp längs en bana: punkter p0 … pn, hopp i från p[i] till p[i+1] på tider[i] (d s i luften). → { x, y, ben, sx, sy }
function bana(s, punkter, tider, h = 70, d = 0.42) {
  let i = 0; while (i < tider.length && s >= tider[i] + d) i++;
  const [ax, ay] = punkter[i], [bx, by] = punkter[Math.min(i + 1, punkter.length - 1)];
  if (i >= tider.length) return { x: ax, y: ay, ben: [0, 0], sx: 1, sy: 1 };
  const k = del(tider[i], tider[i] + d, s), hp = kit.hopp(s, tider[i], tider[i] + d, h + Math.max(0, ay - by) * 0.6);
  const prev = i > 0 ? kit.hopp(s, tider[i - 1], tider[i - 1] + d, h) : null;   // landningens tryck från förra hoppet
  const sy = s < tider[i] ? (prev && s > tider[i - 1] + d ? prev.sy : hp.sy) : hp.sy;
  return { x: lerp(ax, bx, mjuk(k)), y: lerp(ay, by, k) + hp.y, ben: [18 * hp.ben, 18 * hp.ben], sx: 2 - sy, sy };
}
const hopp1 = (s, tider, h = 40, d = 0.36) => tider.reduce((a, t0) => a + kit.hopp(s, t0, t0 + d, h).y, 0);   // hopp på stället, y
