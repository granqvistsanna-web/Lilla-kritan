<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Ängen 1</title>
<style>html,body{margin:0;background:#FBF7EE;overflow:hidden}svg{width:100vw;height:100vh;display:block}</style>
</head>
<body>
<!-- Avsnitt 015, bild 03–08 "Ängen 1" (sångtid 0:09.0–0:33.4, avsnittstid 0:20.0–0:44.4). Börjar exakt där kritan-ritar slutar.
     03 helbild: far och mor glada (titt 0.6), Ludde glad och extra luddig (tussar 11), säcken tom. Fia glider över himlen (0:10.5, fladder).
     05 helbild: far och mor lutar sig fram (nyfiken), Ludde skrattar och vickar på "bä, bä" (0:12.0, 0:12.6).
     06 halvbild Ludde och säcken: nickar på "ja, ja" (0:17.2, 0:17.8), skakar på sig (prassel 0:18.8), Luddes elva extra tussar flyger
        ner i säcken i fyra vågor (3, 3, 3, 2; puff 0:19.6, 0:20.3, 0:21.0, 0:21.7), säcken tom → full, Ludde förvånad när den är full.
     07 tvåbild far och mor: en tuss flyger ur säcken till far, kritan klottrar, rocken (0:25.1, skrrrrt-kort + pling); samma för mor och kjolen (0:27.7).
     08 lågt utsnitt vid fötterna: två tussar ur säcken blir två par strumpor i en hög, plopp på "två" (0:28.8) och "strumpor" (0:29.7).
     Sista bilden: kameran fotter, far med rock, mor med kjol, Ludde förvånad (titt 0.2, tittY 1, tussar 0), säcken full, hela strumphögen.
     Lammen snurrar aldrig: bara lutning, vick, nick, skak och små skutt. Ingen text i bild. -->
<script src="../kit.js"></script><script src="../../../../verktyg/kant.js"></script><script src="../ansikten.js"></script><script src="../lamm.js"></script>
<script>
const { el, clamp, lerp, mjuk, inUt, ut, over } = kit;
const del = ([a, b], s) => kit.del(a, b, s);
const pop = tau => tau <= 0 ? 0 : 1 - Math.exp(-7 * tau) * Math.cos(16 * tau);   // klistermärkes-pop: 0 → översväng → 1
// Ord i sångtid (rader.txt: vers 2 − 32,0 s) och ljud.md. Bildernas gränser läses ur M.bild().
const ORD = { fia: 10.5, fladder: 10.8, ba: [12.0, 12.6], ja: [17.2, 17.8], skak: 18.8, puff: [19.6, 20.3, 21.0, 21.7],
  far: 25.1, mor: 27.7, plopp: [28.8, 29.7] };
// 06: alla elva extra tussarna flyger i fyra vågor (3, 3, 3, 2), en puff per våg; resten av vågen landar 0,09 s efter varandra.
// Så slutar Ludde utan extra ull (tussar 0), som angen-2 börjar och storyboarden 10 ritar honom.
const SACKEN = [3, 3, 3, 2].flatMap((n, i) => Array.from({ length: n }, (_, j) => ORD.puff[i] + 0.09 * j));   // landningstid per tuss
let M, m, S0, B, far, mor, ludde, sack, fia, flyg = {}, klotter = {}, par = [], glimmer = {};
// 03 börjar där kritan-ritar slutar (E, närmare än helbilden: Ludde, mor och säcken) och åker ut till helbilden: far syns.
// Samma E som i kritan-ritar (ändra båda).
const E_ = m => [m.LUDDE_X + 40, m.GOLV - 150, 760], UT = [0.9, 2.4];   // utåkningen, sekunder in i 03 (E hålls 0,9 s först, QA #7)
// glimmer på plaggen när de nämns: små fyruddiga gnistor (som angen-2:s blänk) i lammets egen ruta, [x, y, r, fördröjning]
const GNISTOR = [[400, 700, 34, 0], [610, 640, 26, 0.12], [520, 800, 20, 0.24]];

// kit räknar kamerans drift och andningen i scentid (kit.nu); kritan-ritar slutar på sångtid 9,0 med samma formler i sångtid.
// De här två hjälparna räknar om till sångtid, så att första bilden blir exakt kritan-ritars sista (kit-förslag i README).
const drift = s => [4 * (Math.sin(s * 0.5) - Math.sin((s - S0) * 0.5)), 3 * (Math.sin(s * 0.37 + 1) - Math.sin((s - S0) * 0.37 + 1))];
const kam = ([cx, cy, w], s) => { const [dx, dy] = drift(s); kit.kamera(cx + dx, cy + dy, W / w); };   // kit.kamera (inte utsnitt), så att mjukaKlipp fångar den
const FAS = [0, 0.618, 0.236];   // kit.figur: (figurNr · 0.618) % 1 för far, mor, Ludde (skapas i den ordningen, som i kritan-ritar)
const andas = (i, s) => { const a = x => Math.sin(2 * Math.PI * (x / 2.8 + FAS[i])), A = a(s), B_ = a(s - S0);
  return { sx: (1 - 0.008 * A) / (1 - 0.008 * B_), sy: (1 + 0.015 * A) / (1 + 0.015 * B_) }; };

// klottret när en tuss blir ett plagg: kritstreck fram och tillbaka över magen, i lammets egen ruta (följer lutning och skutt)
function nyttKlotter(l, farg) {
  // inom kroppens siluett (samma mask som plaggen i lamm.js), så att klottret färglägger magen och inte ängen
  const id = `klotter-${l.vem}`, mk = el('mask', { id, maskUnits: 'userSpaceOnUse', x: 0, y: 0, width: 1024, height: 1024 }, l.g.ownerSVGElement.querySelector('defs'));
  kit.bild(`${kit.ROT}assets/karaktarer/lammet-ludde/cut/ludde-body.png`, mk, { filter: 'url(#vitsiluett)' });
  const g = el('g', { filter: 'url(#lammkrita)' }, el('g', { mask: `url(#${id})` }, l.f.inre));
  // två varv fram och tillbaka, lite snett och ojämnt, som ett barn som färglägger
  let d = 'M180 600', fro = 7;
  const rnd = () => (fro = (fro * 16807) % 2147483647) / 2147483647;
  for (const [x0, x1, st] of [[180, 860, 30], [860, 180, -34]])
    for (let x = x0, upp = false; st > 0 ? x <= x1 : x >= x1; x += st, upp = !upp) d += ` L${(x + 18 * rnd()).toFixed(0)} ${(upp ? 570 + 40 * rnd() : 860 - 40 * rnd()).toFixed(0)}`;
  const p = el('path', { d, fill: 'none', stroke: farg, 'stroke-width': 34, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
  const L = p.getTotalLength();
  p.setAttribute('stroke-dasharray', `${L} ${L + 1}`);
  return (rita, bort) => { g.style.display = rita > 0 && bort < 1 ? '' : 'none'; p.setAttribute('stroke-dashoffset', (L * (1 - rita)).toFixed(1)); g.setAttribute('opacity', (1 - bort).toFixed(3)); };
}

async function bygg() {
  M = await kit.manus(); m = M.matt;
  const s = id => M.bild(id).map(x => x - M.av);
  S0 = s('03')[0];
  B = { b05: s('05')[0], b06: s('06')[0], b07: s('07')[0], b08: s('08')[0], slut: s('08')[1] };
  const L = kit.duk('angen');
  far = await lamm.ny('far', { forelder: L.figurer });
  mor = await lamm.ny('mor', { forelder: L.figurer });
  sack = lamm.sack(L.figurer);
  ludde = await lamm.ny('ludde', { forelder: L.figurer });
  fia = await kit.figur('fjarilen-fia', { h: 95, forelder: L.figurer });
  // strumphögen i två halvor (rosa paret, blå paret), var och en poppar fram runt sin egen mitt
  const defs = L.plate.ownerSVGElement.querySelector('defs'), hb = lamm.HOG[1], hs = m.HOG[2] / (hb[3] - hb[1]), hcx = (hb[0] + hb[2]) / 2;
  for (const [i, [x0, x1]] of [[0, 515], [515, 1024]].entries()) {
    el('rect', { x: x0, y: 0, width: x1 - x0, height: 1024 }, el('clipPath', { id: `halva-${i}` }, defs));
    const yttre = el('g', {}, L.figurer), h = lamm.sak(lamm.HOG, yttre);
    h.g.firstChild.setAttribute('clip-path', `url(#halva-${i})`);
    h.pose({ x: m.HOG[0], y: m.HOG[1], h: m.HOG[2] });
    par.push({ yttre, c: [m.HOG[0] + ((x0 + x1) / 2 - hcx) * hs, m.HOG[1] - m.HOG[2] / 2] });
  }
  // lösa tussar överst: fyra till säcken, en till far, en till mor, två till högen
  for (const n of [...SACKEN.keys(), 'far', 'mor', 'h0', 'h1']) flyg[n] = lamm.tuss(L.figurer);
  // glimmer: en grupp per plagg överst i figurlagret, gnistorna i lammets 1024-ruta (följer skutt och lutning via punkt())
  const gnista = (g, r) => el('path', { d: `M0 ${-r} Q${r * 0.16} ${-r * 0.16} ${r} 0 Q${r * 0.16} ${r * 0.16} 0 ${r} Q${-r * 0.16} ${r * 0.16} ${-r} 0 Q${-r * 0.16} ${-r * 0.16} 0 ${-r}Z`,
    fill: '#FFFBE6', stroke: '#F6D86B', 'stroke-width': 2.5, 'stroke-linejoin': 'round' }, g);
  for (const vem of ['far', 'mor']) glimmer[vem] = GNISTOR.map(([, , r]) => { const g = el('g', { style: 'display:none' }, L.figurer); gnista(g, r); return g; });
  klotter.far = nyttKlotter(far, m.FARG.ROCK);
  klotter.mor = nyttKlotter(mor, m.FARG.KJOL);

  // ljud (ljud.md), i scentid; lågt under sången
  const t = x => x - S0;
  kit.ljud('fagelkvitter', 0, { loop: true, langd: B.slut - S0, vol: 0.35, fade: 0.1 });
  kit.ljud('fladder', t(ORD.fladder), { vol: 0.5 });
  kit.ljud('prassel-tyg', t(ORD.skak), { vol: 0.8 });
  for (const p of ORD.puff) kit.ljud('puff', t(p), { vol: 0.8 });
  for (const [o, d] of [[ORD.far, 0.5], [ORD.mor, 0.5]]) {
    kit.ljud('skrrrrt-kort', t(o), { vol: 1, langd: 0.6, fade: 0.2 });
    kit.ljud('glimt', t(o + d), { vol: 0.6 });   // när plagget är klart: det glimrar (i stället för pling, användaren 2026-11-07)
  }
  for (const p of ORD.plopp) kit.ljud('plopp', t(p), { vol: 0.8 });

  // mjuka klipp: 0,9 s glid till 06 och 07, 0,4 s till 08 (första ploppet kommer 0,4 s in i bilden)
  const inre = kit.mjukaKlipp(render, [B.b06 - S0, B.b07 - S0]);
  kit.kor(kit.mjukaKlipp(inre, [B.b08 - S0], 0.4), B.slut - S0, { sang: [S0, B.slut] });
}

// ---------- rörelser (sångtid s) ----------
const vick = (s, t0) => s < t0 ? 0 : 7 * Math.sin(2 * Math.PI * 2.4 * (s - t0)) * Math.exp(-3.5 * (s - t0));   // dämpat vick
const nick = (s, t0) => Math.sin(Math.PI * kit.del(t0, t0 + 0.36, s));
// en tuss i en båge från p0 till p1 på [a, b]; krymper lite sista biten
function flyger(tu, s, [a, b], p0, p1, hojd, r = 17) {
  const k = kit.del(a, b, s), q = inUt(k);
  tu.pose({ x: lerp(p0[0], p1[0], q), y: lerp(p0[1], p1[1], q) - hojd * Math.sin(Math.PI * k), r: r * (1 - 0.3 * mjuk(kit.del(0.75, 1, k))),
    rot: 25 * Math.sin(k * 5), synlig: s >= a && s < b });
}

// ---------- en bildruta ----------
function render(t) {
  if (!M) return;
  const s = t + S0, P = ORD.puff;

  // far och mor: lutar sig fram i 05 (som bygg.py: 20 px närmare, 6°), rätar på sig i början av 06
  const lut = mjuk(kit.del(ORD.ba[0] - 0.3, ORD.ba[0] + 0.3, s)) * (1 - mjuk(kit.del(B.b06, B.b06 + 0.8, s)));
  const rock = inUt(kit.del(ORD.far + 0.1, ORD.far + 0.6, s)), kjol = inUt(kit.del(ORD.mor + 0.1, ORD.mor + 0.6, s));
  const farH = kit.hopp(s, ORD.far + 0.75, ORD.far + 1.05, 10), morH = kit.hopp(s, ORD.mor + 0.65, ORD.mor + 0.95, 10);
  const farAnsikte = s < ORD.ba[0] - 0.2 ? ['glad', 0.6] : s < B.b06 ? ['nyfiken', 1] : s >= ORD.far - 0.6 && s < ORD.far + 0.75 ? ['forvanad', 1] : ['glad', 0.6];
  const morAnsikte = s < ORD.ba[0] - 0.15 ? ['glad', 0.6] : s < B.b06 ? ['nyfiken', 1] : s >= ORD.mor - 0.6 && s < ORD.mor + 0.75 ? ['forvanad', 1]
    : s >= ORD.far - 0.2 && s < ORD.far + 1.2 ? ['glad', -0.8] : ['glad', 0.6];
  const af = andas(0, s), am = andas(1, s);
  far.pose({ x: m.FAR_X + 20 * lut, y: m.GOLV + farH.y, tilt: 6 * lut, sx: af.sx * farH.sx, sy: af.sy * farH.sy, humor: farAnsikte[0], titt: farAnsikte[1], rock, delar: kit.benHopp(farH.ben) });
  mor.pose({ x: m.MOR_X + 20 * lut, y: m.GOLV + morH.y, tilt: 6 * lut, sx: am.sx * morH.sx, sy: am.sy * morH.sy, humor: morAnsikte[0], titt: morAnsikte[1], rock: 0, kjol, delar: kit.benHopp(morH.ben) });

  // säcken: platt och tom tills första tussen landar, poppar upp (70 %) och växer med varje tuss; puffar till vid varje landning
  const landat = P.filter(p => s >= p).length;
  const k = landat ? Math.max(0.001, P.slice(1).reduce((a, p) => a + over(kit.del(p, p + 0.35, s)) / 3, 0)) : 0;
  const upp = landat ? lerp(0.55, 1, over(kit.del(P[0], P[0] + 0.35, s))) : 1;
  const studs = P.reduce((a, p) => a + Math.sin(Math.PI * kit.del(p, p + 0.25, s)) * (s >= p ? 1 : 0), 0);
  sack.pose({ x: m.SACK_X, y: m.GOLV + 4, k, sx: 1 + 0.05 * studs, sy: upp * (1 - 0.07 * studs) });

  // Ludde: lutar mot far och mor och vickar på "bä, bä" (05), nickar på "ja, ja" och skakar på sig (06), förvånad när säcken är full;
  // tittar på plaggen (07) och på strumphögen (08), med ett litet skutt av förvåning vid varje plopp
  const lean = -5 * mjuk(kit.del(ORD.ba[0] - 0.2, ORD.ba[0] + 0.3, s)) * (1 - mjuk(kit.del(B.b06, B.b06 + 0.6, s)));
  const gung = s >= ORD.ba[0] && s < B.b06 ? 1.5 * Math.sin(Math.PI * (s - kit.BEAT0) / kit.BEAT) * mjuk(kit.del(ORD.ba[1] + 0.6, ORD.ba[1] + 1.2, s)) : 0;
  const sk = kit.del(ORD.skak, ORD.skak + 0.7, s), skak = sk > 0 && sk < 1 ? 6 * Math.sin(2 * Math.PI * 4.5 * (s - ORD.skak)) * (1 - sk) : 0;
  const n = nick(s, ORD.ja[0]) + nick(s, ORD.ja[1]);
  const lh = [kit.hopp(s, ORD.plopp[0] + 0.05, ORD.plopp[0] + 0.3, 8, 0.08, 0.14), kit.hopp(s, ORD.plopp[1] + 0.05, ORD.plopp[1] + 0.3, 8, 0.08, 0.14)];
  const ly = lh[0].y + lh[1].y, lsx = lh[0].sx * lh[1].sx, lsy = lh[0].sy * lh[1].sy;
  const fullTid = P[3] + 0.2;
  const [humor, titt, tittY] = s < ORD.ba[0] ? ['glad', -0.3, 0] : s < B.b06 ? ['skrattar', -0.5, 0] : s < fullTid ? ['glad', 0.8, 0.25 + 0.5 * n]
    : s < B.b07 ? ['forvanad', 0.8, 0.3] : s < B.b08 ? ['glad', -0.8, 0] : ['forvanad', 0.2, 1];
  const al = andas(2, s), armar = 22 * (sk > 0 && sk < 1 ? 1 - sk : 0);
  const kvar = 11 - SACKEN.filter(p => s >= p - 0.5).length;   // tussen lämnar Ludde när den börjar flyga
  ludde.pose({ x: m.LUDDE_X, y: m.GOLV + ly + 4 * n, tilt: lean + vick(s, ORD.ba[0]) + vick(s, ORD.ba[1]) + gung + skak,
    sx: al.sx * lsx, sy: al.sy * lsy * (1 - 0.05 * n), humor, titt, tittY, tussar: kvar, armL: -armar, armR: armar,
    delar: kit.benHopp(lh[0].ben + lh[1].ben) });

  // 06: tussarna från Ludde (bakifrån: 10, 9, 8 …) ner i säckens mynning, våg för våg
  const mynning = sack.oppning();
  SACKEN.forEach((p, i) => flyger(flyg[i], s, [p - 0.5, p], ludde.tussPunkt(10 - i), [mynning[0], mynning[1] + 8], 70));
  // 07: en tuss ur säcken till far (rocken), en till mor (kjolen); klottret, sedan torkas plagget fram
  flyger(flyg.far, s, [ORD.far - 0.75, ORD.far + 0.05], mynning, far.punkt([512, 720]), 200, 20);
  flyger(flyg.mor, s, [ORD.mor - 0.7, ORD.mor + 0.05], mynning, mor.punkt([512, 740]), 120, 20);
  klotter.far(ut(kit.del(ORD.far, ORD.far + 0.4, s)), mjuk(kit.del(ORD.far + 0.45, ORD.far + 0.75, s)));
  klotter.mor(ut(kit.del(ORD.mor, ORD.mor + 0.4, s)), mjuk(kit.del(ORD.mor + 0.45, ORD.mor + 0.75, s)));
  // 08: två tussar ur säcken ner till högen; varje par poppar fram som ett klistermärke på ploppet
  ORD.plopp.forEach((p, i) => {
    flyger(flyg[`h${i}`], s, [p - 0.55, p], mynning, par[i].c, 90, 17);
    const q = s >= p ? over(kit.del(p, p + 0.35, s)) : 0, [cx, cy] = par[i].c;
    par[i].yttre.style.display = q > 0 ? '' : 'none';
    par[i].yttre.setAttribute('transform', `translate(${cx} ${cy}) scale(${q.toFixed(4)}) translate(${-cx} ${-cy})`);
  });

  // Fia glider över himlen från vänster till höger (03 och in i 05), vingarna fälls in och ut
  const fk = kit.del(ORD.fia, ORD.fia + 5.5, s), slag = (1 + Math.cos(s * Math.PI * 6)) / 2, vq = 0.35 + 0.65 * slag;
  const vinge = (px, py) => `translate(${px} ${py}) scale(${vq} 1) translate(${-px} ${-py})`;
  fia.pose({ x: lerp(-90, W + 90, fk), y: 235 + 25 * Math.sin(fk * Math.PI * 2) - 8 * slag, tilt: -10 + 3 * Math.sin(s * 2.2), titt: 1,
    blink: kit.blink(s, [ORD.fia + 2.4]), synlig: fk > 0 && fk < 1, delar: { 'wing-l': vinge, 'wing-r': vinge } });

  // glimmer på rocken och kjolen när de nämns (plagget klart 0,6 s efter ordet): poppar, tindrar och tonas bort
  for (const [vem, l, o] of [['far', far, ORD.far], ['mor', mor, ORD.mor]]) GNISTOR.forEach(([x, y, , d], i) => {
    const k = kit.del(o + 0.5 + d, o + 1.4 + d, s), g = glimmer[vem][i];
    g.style.display = k > 0 && k < 1 ? '' : 'none';
    if (k <= 0 || k >= 1) return;
    const sk = pop(k * 0.9) * (1 - mjuk(kit.del(0.6, 1, k))), [px, py] = l.punkt([x, y]);
    g.setAttribute('transform', `translate(${px.toFixed(1)} ${py.toFixed(1)}) rotate(${(k * 45).toFixed(1)}) scale(${sk.toFixed(3)})`);
  });

  // kameran: E → hel (03, utåkning), hel (05) → halv (06) → tva (07) → fotter (08)
  const K = m.KAMERA;
  if (s < B.b05) {
    const q = inUt(kit.del(S0 + UT[0], S0 + UT[1], s)), e = E_(m), h = K.hel;
    kam([lerp(e[0], h[0], q), lerp(e[1], h[1], q), Math.exp(lerp(Math.log(e[2]), Math.log(h[2]), q))], s);
  } else kam(s < B.b06 ? K.hel : s < B.b07 ? K.halv : s < B.b08 ? K.tva : K.fotter, s);
}

bygg();
</script>
</body>
</html>
