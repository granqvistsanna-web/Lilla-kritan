<!doctype html>
<html><head><meta charset="utf-8"><title>039 rörelsetest kläder</title>
<!-- Rörelsetest: Kanels rigg (013:s kanel-motor.js) med 039:s kläder som lager på riggens delar.
     Lagren görs av ../provbild-klader.py --lager ../klader-lager. Rendera: node ../../024-lammet-klar-pa-sig/scener/render.mjs . --snabb -->
<style>html,body{margin:0;background:#f6ead8}svg{display:block;width:100vw;height:100vh}</style>
<script>window.KANEL_BAS = '../../../assets/karaktarer/kaninen-kanel/premium/cut/';</script>
<script src="../../013-rod-brandbil/storyboard-v2/kanel-motor.js"></script>
</head><body>
<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs><clipPath id="orrot"><rect width="1024" height="308"/></clipPath></defs>
  <rect width="1920" height="1080" fill="#f6ead8"/><rect y="860" width="1920" height="220" fill="#e7cfae"/>
  <text id="etikett" x="960" y="90" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="54" fill="#5a3d2b"></text>
  <g id="figurer"></g>
</svg>
<script>
const KL = '../klader-lager/', NS = 'http://www.w3.org/2000/svg', NER = -30;   // armarna 22° ner som i provbilden (vila 8 + −30)
const fig = figur(960, 900, 0.72);
// Varje arm- och benbild blir en grupp med samma klass (motorn vrider gruppen): ärmen och vanten över armen,
// byxbenet och stöveln i stället för benet (foten göms i stöveln).
fig.querySelectorAll('image.arm-l, image.arm-l2, image.arm-r, image.arm-r2, image.leg-l, image.leg-r').forEach(img => {
  const klass = img.getAttribute('class'), del = klass.replace('2', ''), g = document.createElementNS(NS, 'g');
  g.setAttribute('class', klass); img.removeAttribute('class'); img.replaceWith(g);
  const k = img.cloneNode(); k.removeAttribute('clip-path'); k.setAttribute('href', KL + del + '.png');
  if (del.startsWith('arm')) g.appendChild(img);
  g.appendChild(k);
});
const kl_ = document.createElementNS(NS, 'image');
kl_.setAttribute('href', KL + 'kropp.png'); kl_.setAttribute('width', 1024); kl_.setAttribute('height', 1024);
fig.querySelector('.mage').after(kl_);

const ner = p => ({ ...p, armar: p.armar.map(a => a + NER) });
const DELAR = [   // [slut, etikett, (t i delen) => [ansikte, pose]]
  [3, 'Står och nickar', t => [blinka(blanda('neutral', 'glad', 0.5), t), ner({ ...POSE0, upp: -0.7 * Math.max(0, Math.sin(Math.PI * t * 1.4)) ** 2, oron: [3, 3] })]],
  [6.5, 'Vinkar', t => { const k = mjuk(kl(0, 1, t / 0.5)) * mjuk(kl(0, 1, (3.5 - t) / 0.5));
    return [blinka(blanda('neutral', 'glad', 1), t), ner({ ...POSE0, armar: [0, k * (125 + 18 * Math.sin(t * 9))], luta: -2 * k })]; }],
  [11.3, 'Hoppar', t => { const [f, p] = ROR.hoppa(t); return [f, ner(p)]; }],
  [17.3, 'Går', t => ROR.ga(t + 0.0)],
  [21, 'Sätter sig (som i pulkan)', t => [blinka(blanda('neutral', 'glad', 0.6), t), ner(blandaPose('neutral', 'sitter', mjuk(kl(0, 1, (t - 0.3) / 0.8))))]],
];
window.DURATION = 21;
window.seek = t => {
  let fran = 0;
  for (const [slut, namn, fn] of DELAR) {
    if (t < slut || slut === DELAR.at(-1)[0]) {
      const [f, p] = fn(t - fran); rita(fig, { ...f, armar: NEUTRAL.armar }, p);
      document.getElementById('etikett').textContent = namn; return; }
    fran = slut;
  }
};
window.seek(0);
window.ready = true;   // render.mjs väntar på networkidle, så bilderna är laddade
</script>
</body></html>
