<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Pandan leker ute</title>
<style>html, body { margin:0; background:#000; overflow:hidden } svg { width:100vw; height:100vh; display:block; }</style>
</head>
<body>
<!-- 058 Pandan leker ute: hela kodscenen (grind 6). Uppställningen som storyboarden (../../storyboard/scen.html, storleksbild C),
     ramverket som 061:s strand (varm ton, vinjett 0,14, ny brusbild 6 gånger/s, line boil 2,5 px delat med zoomen, kant.js, djup3d).
     Tiderna ur rader.json (skrivs av storyboard/bygg.mjs).
     Rendera: node avsnitt/058-pandan-leker-ute/scener/render.mjs avsnitt/058-pandan-leker-ute/scener/lekplatsen [--snabb].
     Bara hårda klipp; den enda åkningen är zoomen in i teckningen. Kritan är liten, utan ansikte, knackar aldrig.
     Inget går genom något: bollen rullar framför eller bakom pandan (djup), aldrig genom; vid trädet står pandan lite längre bak
     (TRAD_P) så att hinken står framför fötterna och tassen når stammen. -->
<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="boil" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="5000">
      <feTurbulence id="brus" type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="1"/>
      <feDisplacementMap in="SourceGraphic" scale="2.5"/>
    </filter>
    <filter id="korn" x="0" y="0" width="1" height="1">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="2"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.47  0 0 0 0 0.36  1.1 0 0 0 -0.47"/>
    </filter>
    <filter id="mjukskugga" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="7"/></filter>
    <radialGradient id="vinjett" cx="50%" cy="50%" r="75%"><stop offset="0.55" stop-color="#3a2410" stop-opacity="0"/><stop offset="1" stop-color="#3a2410" stop-opacity="0.14"/></radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="#FAF8F2"/>
  <g id="kamera">
    <g id="platta" data-djup-ramp="540:-0.1 985:0 1080:0.05"></g>
    <g filter="url(#boil)"><g id="bak"></g></g>
    <g filter="url(#boil)"><g id="saker"></g></g>
    <g filter="url(#boil)"><g id="figurer"></g></g>
    <g filter="url(#boil)"><g id="fram"></g></g>
    <g id="forgrund"></g>
    <g id="glans"></g>
    <g id="krita"></g>
  </g>
  <g id="ram"></g>
  <g id="gomda" opacity="0"></g>
</svg>
<script src="/verktyg/blinka.js"></script>
<script src="/verktyg/kant.js"></script>
<script src="/verktyg/kritan-ritar.js"></script>
<script src="/verktyg/djup3d.js"></script>
<script src="/produktion/youtube/shorts/godnatt/v2-rigg.js"></script>
<script>
const $ = id => document.getElementById(id);
const A = '/assets/', LS = A + 'bakgrunder/lekplatsen-saker/';
const lagg = (id, h) => $(id).insertAdjacentHTML('beforeend', h);
const f1 = v => (+v).toFixed(1);
const kl = (k, a = 0, b = 1) => Math.max(a, Math.min(b, k)), lerp = (a, b, k) => a + (b - a) * k;
const mjuk = k => (k = kl(k), k * k * (3 - 2 * k)), del = (a, b, t) => mjuk((t - a) / (b - a));
const bump = (a, b, t) => (t <= a || t >= b) ? 0 : Math.sin(Math.PI * (t - a) / (b - a));
const lerp2 = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k)];
const utK = u => 1 - (1 - kl(u)) ** 2;   // mjuk inbromsning

// --- Bilderna och uppställningen (storleksbild C) ---------------------------------------------------------------------------
const PLATTA = A + 'bakgrunder/lekplatsen/lekplatsen.png', FORGRUND = A + 'bakgrunder/lekplatsen/lekplatsen-forgrund.png';
const SAK = {   // [fil, bildens storlek, alfarutan x0 y0 x1 y1]
  trad:  [LS + 'appeltrad.png', [896, 1200], [56, 95, 840, 1115]],
  gung:  [LS + 'gunganka.png', [1024, 1024], [145, 76, 919, 970]],
  sand:  [LS + 'sandlada.png', [1200, 896], [67, 115, 1134, 798]],
  hink:  [LS + 'hink.png', [1024, 1024], [155, 64, 865, 951]],
  boll:  [LS + 'boll.png', [1024, 1024], [89, 89, 934, 935]],
  apple: [A + 'rekvisita/applet-rott/cut/applet-rott-v3-tunn.png', [729, 836], [19, 13, 709, 810]],
};
// detaljstrecken som kritan ritar efter konturen (mätta i bilderna, 1024-koordinater)
const DETALJ = {
  gung: ['M760 225 C820 212 890 228 905 255 C895 285 840 300 765 290',                 // näbben
    'M690 207 C690 190 714 190 714 207 C714 224 690 224 690 207',                          // ögat
    'M285 410 L545 410',                                                                   // handtaget
    'M315 490 C360 580 520 620 645 565',                                                   // vingen
    'M420 720 C560 730 560 760 420 770 C560 780 560 810 420 820 C560 830 560 860 420 870 C560 880 560 900 500 915'],   // fjädern
  boll: ['M106 400 C350 425 680 425 920 400', 'M106 565 C350 640 680 640 920 565',      // randen
    'M261 281 C261 236 329 236 329 281 C329 326 261 326 261 281', 'M479 326 C479 281 547 281 547 326 C547 371 479 371 479 326',
    'M699 292 C699 247 767 247 767 292 C767 337 699 337 699 292'],                         // prickarna
  hink: ['M258 330 C258 60 757 60 757 330',                                                 // handtagets insida
    'M266 396 C266 350 742 350 742 396 C742 440 266 440 266 396', 'M225 470 C400 495 620 495 790 470'],   // öppningen, kanten
};
const DS = 0.5, MARK = 985, SVART = 0.6;
const TRAD = [330, 935, 640], GUNG = [1180, 950, 470], SANDL = [1650, 940, 250], HINK = [435, 965, 210];
const BD = 96, BR = BD / 2, BY = MARK - BR;
const IN = [860, MARK], VID_GUNG = [820, MARK], SAND_P = [1390, MARK], VID_TRAD = [720, MARK], TRAD_P = [610, 945];
const GS = GUNG[2] / (970 - 76), PIV = [GUNG[0] + (500 - 532) * GS, GUNG[1] + (930 - 970) * GS];   // gunganden vickar runt fjäderns fot
const SADEL_Y = GUNG[1] - GUNG[2] * (1 - 0.385);
const SITT = [GUNG[0] - 104, SADEL_Y + 30];
const B_SADEL = [GUNG[0] - 59, SADEL_Y - BR + 4];
const B_FRAM = [630, BY], B_F2 = [570, BY], B_F3 = [1040, BY], B_SAND = [SANDL[0] - 20, 800], B_GUNG = [GUNG[0] + 58, 905];
const B_TRAD = [432, 866], B_TRADF = [520, BY], B_KRONA = [HINK[0], 560], B_HINK = [HINK[0], 844];
const APPLE_FRAN = [540, 700], APPLE_LAND = [560, 978], APPLE_STOPP = [790, 982], APPLE_GUNG = [700, 982], APPLE_H = 58;
const GPAPP = [960, 940, 760];

let L, G, BLINKA, KONT = {}, TT = 0, ZOOM = 1, RAD = [], RR = {}, ROSTER = [], DURATION = 0, J = {};
let T_RIT, T_B, T_H, T_SITT;
const LN = n => ROSTER[n - 1][1];
const MO = (id, i = 0) => RR[id].malin[i][1];          // replik nr i (i raden) in i raden
const ML = (id, i = 0) => LN(RR[id].malin[i][0]);      // dess längd
const MS = (id, i = 0) => RR[id].s + MO(id, i);        // i filmens tid
const iFig = ([x, fot], [px, py], s = DS) => [x + (px - 512) * s, fot + (py - L.FOTTER) * s];
const rotP = ([x, y], v, [px, py]) => { const c = Math.cos(v * Math.PI / 180), s = Math.sin(v * Math.PI / 180), dx = x - px, dy = y - py; return [px + dx * c - dy * s, py + dx * s + dy * c]; };

function kamera([zoom, cx, cy]) {
  ZOOM = zoom;
  const tx = Math.max(1920 - 1920 * zoom, Math.min(0, 960 - cx * zoom)), ty = Math.max(1080 - 1080 * zoom, Math.min(0, 540 - cy * zoom));
  $('kamera').setAttribute('transform', `translate(${f1(tx)} ${f1(ty)}) scale(${zoom})`);
  $('brus').nextElementSibling.setAttribute('scale', (2.5 / zoom).toFixed(2));   // line boil 2,5 px i bild
  const fs = 1 + 0.06 * (zoom - 1);
  $('forgrund').setAttribute('transform', `translate(${f1(cx)} ${f1(cy + 300)}) scale(${fs.toFixed(4)}) translate(${f1(-cx)} ${f1(-cy - 300)})`);
}
// --- Kameror [zoom, cx, cy] (storyboardens utsnitt) -------------------------------------------------------------------------
const K_HEL = [1, 960, 540];
const HALV = ([x, y], dx = 0) => [1.6, x + dx, y - 210];
const NARA = ([x, y], dy = 0) => [2.3, x, y - 200 + dy];
const NARA_SITT = [2.3, SITT[0], SITT[1] - 180];
const TRADUT = [1.35, 560, 640];
const K_BOLL = [1.9, (B_FRAM[0] + IN[0]) / 2, MARK - 170];
const K_BD = [3.0, B_FRAM[0], B_FRAM[1] - 10];
const K_SAND = [2.0, 1520, 780];
const K_TRAD = [3.0, B_TRAD[0] - 30, B_TRAD[1] - 40];
const K_TRADH = [1.5, 560, 720];
const K_APP = [3.2, APPLE_STOPP[0], APPLE_STOPP[1] - 40];
const K_KRONA = [2.6, B_KRONA[0] + 20, B_KRONA[1] + 20];
const K_HINK = [2.6, HINK[0] + 40, 830];

// --- Saker --------------------------------------------------------------------------------------------------------------------
const sakS = (namn, h) => { const [, , [, y0, , y1]] = SAK[namn]; return h / (y1 - y0); };
const sakC = namn => { const [, , [x0, y0, x1, y1]] = SAK[namn]; return [(x0 + x1) / 2, y1, (y0 + y1) / 2]; };
// en sak med foten i (x, fot), höjd h; vrid = [grader, px, py]; k = kritans linje (0–1), f = fyllningen (0–1)
function sak(namn, [x, fot, h], { lager = 'saker', vrid = null, k = 1, f = 1, o = 1 } = {}) {
  const [fil, [w, hh]] = SAK[namn], s = sakS(namn, h), [cx, y1, cy] = sakC(namn);
  const tr = `${vrid ? `rotate(${f1(vrid[0])} ${f1(vrid[1])} ${f1(vrid[2])}) ` : ''}translate(${f1(x)} ${f1(fot)}) scale(${s.toFixed(4)}) translate(${f1(-cx)} ${-y1})`;
  let html = '', Rb = null;
  if (f > 0) html += `${f < 1 ? fyllMask('fy' + namn, cx, cy, Math.max(w, hh) * 0.75, f) : ''}<image href="${fil}" width="${w}" height="${hh}" opacity="${o}"${f < 1 ? ` clip-path="url(#fy${namn})"` : ''}/>`;
  if (k < 1 || f < 1) { Rb = ritBana([KONT[namn].d, ...DETALJ[namn]], ritfart(k), { vila: [0.5], attr: `fill="none" stroke="${KRITAN.LINJE}" stroke-width="${f1(KRITAN.BRED / s / Math.sqrt(ZOOM))}" stroke-linecap="round" stroke-linejoin="round" opacity="${linjeOpacitet(f).toFixed(2)}"` });
    if (k > 0) html += Rb.html; }
  lagg(lager, `<g transform="${tr}">${html}</g>`);
  const iS = ([px, py]) => { const p = [x + (px - cx) * s, fot + (py - y1) * s]; return vrid ? rotP(p, vrid[0], [vrid[1], vrid[2]]) : p; };
  return Rb ? { spets: iS(Rb.spets), start: iS(Rb.start), slut: iS(Rb.slut) } : {};
}
const skugga = (x, y, rx, lager = 'bak', o = 0.22) => lagg(lager, `<ellipse cx="${f1(x)}" cy="${f1(y - 2)}" rx="${f1(rx)}" ry="${f1(rx * 0.13)}" fill="#6b5236" opacity="${o.toFixed(2)}" filter="url(#mjukskugga)"/>`);
// bollen: pos = mitten, rot = hur långt den rullat; mark = marken under (skuggan), sand = sanden framför, prick = sand på bollen
function boll({ pos, rot = 0, lager = 'saker', mark = null, sand = false, prick = 0, vrid = null, k = 1, f = 1 }) {
  let [x, y] = pos;
  if (mark != null) skugga(x, mark, BR * (0.9 - 0.4 * kl((mark - BR - y) / 300)), lager, 0.22 * (1 - 0.6 * kl((mark - BR - y) / 300)));
  const [fil, [w, h]] = SAK.boll, s = sakS('boll', BD), [cx, , cy] = sakC('boll');
  if (k < 1 || f < 1) return sak('boll', [x, y + BR, BD], { lager, k, f });
  const tr = `${vrid ? `rotate(${f1(vrid[0])} ${f1(vrid[1])} ${f1(vrid[2])}) ` : ''}translate(${f1(x)} ${f1(y)}) rotate(${f1(rot)}) scale(${s.toFixed(4)}) translate(${f1(-cx)} ${f1(-cy)})`;
  lagg(lager, `<image href="${fil}" width="${w}" height="${h}" transform="${tr}"/>`);
  if (prick > 0) lagg(lager, [[-22, -18], [14, -26], [26, 6], [-8, 12], [-30, 14]].map(([dx, dy]) => `<circle cx="${f1(x + dx)}" cy="${f1(y + dy)}" r="4.5" fill="#e6dcc6" stroke="#cfc2a6" stroke-width="1.2" opacity="${f1(prick)}"/>`).join(''));
  if (sand) lagg(lager, `<ellipse cx="${f1(x)}" cy="${f1(y + 26)}" rx="64" ry="30" fill="#ebe6db"/>${[[-30, 4], [12, -2], [40, 8]].map(([dx, dy]) => `<circle cx="${f1(x + dx)}" cy="${f1(y + 26 + dy)}" r="4" fill="#ddd5c4"/>`).join('')}`);
  return {};
}
function apple({ pos, rot = 0, lager = 'saker', mark = null }) {
  if (mark != null) skugga(pos[0], mark, 22, lager, 0.2);
  const [fil, [w, h]] = SAK.apple, s = sakS('apple', APPLE_H), [cx, , cy] = sakC('apple');
  lagg(lager, `<image href="${fil}" width="${w}" height="${h}" transform="translate(${f1(pos[0])} ${f1(pos[1] - APPLE_H / 2)}) rotate(${f1(rot)}) scale(${s.toFixed(4)}) translate(${f1(-cx)} ${f1(-cy)})"/>`);
}
// rörelser för bollen och äpplet
const rull = (a, b, t0, t1, tl, r = BR) => { const u = utK((tl - t0) / (t1 - t0)), x = lerp(a[0], b[0], u); return { pos: [x, lerp(a[1], b[1], u)], rot: (x - a[0]) / r * 57.3 }; };
const bageP = (a, b, h, u) => { u = kl(u); return [lerp(a[0], b[0], u), lerp(a[1], b[1], u) - h * Math.sin(Math.PI * u)]; };
const qb = (a, c, b, u) => { u = kl(u); return [(1 - u) ** 2 * a[0] + 2 * u * (1 - u) * c[0] + u * u * b[0], (1 - u) ** 2 * a[1] + 2 * u * (1 - u) * c[1] + u * u * b[1]]; };
const studs = (tl, t, h, d = 0.35) => h * bump(t, t + d, tl);   // ett litet gupp uppåt
const puff = (x, y, u) => { if (u <= 0 || u >= 1) return;
  lagg('fram', [[-1, -0.6], [0, -1], [1, -0.5], [-0.4, -0.2]].map(([dx, dy], i) => `<circle cx="${f1(x + dx * 40 * u)}" cy="${f1(y + dy * 40 * u)}" r="${f1(9 + 6 * u - i)}" fill="#e3dccb" opacity="${f1(0.9 * (1 - u))}"/>`).join('')); };

// gunganden vickar: när bollen landar, på "gung", när bollen hoppar av och hela tiden när pandan sitter i sadeln
function gungV(t) {
  if (!RR['9']) return 0;
  const vick = (t0, A, n = 3, P = 0.9) => t < t0 || t > t0 + n * P ? 0 : A * Math.sin(2 * Math.PI * (t - t0) / P) * (1 - (t - t0) / (n * P));
  const g1 = RR['9'].s + MO('9', 1) + J.GUNG['16b'][0];
  let v = vick(RR['9'].s + 0.9, 8) + vick(g1, 6, 2) + vick(RR['9b'].s + RR['9b'].d - 1.0, 5, 2);
  if (t > T_SITT) v += 6 * del(T_SITT, T_SITT + 0.8, t) * Math.sin(2 * Math.PI * (t - T_SITT) / 1.9);
  return v;
}
// äppelträdet svajar runt roten efter en puff på stammen
const tradV = (t, t0) => t < t0 || t > t0 + 2.4 ? 0 : 2 * Math.sin(2 * Math.PI * (t - t0) / 0.8) * (1 - (t - t0) / 2.4);
function tradSvaj(t) { return (RR['21'] ? tradV(t, RR['21'].s + 0.3) : 0) + (RR['24c'] ? tradV(t, RR['24c'].s + 0.4 + ML('24c') + 0.05) : 0); }

// --- Pandan -------------------------------------------------------------------------------------------------------------------
function pd([x, fot], f, p, { luft = false, vrid = 0 } = {}) {
  $('figurer').appendChild(G);
  G.setAttribute('transform', `${vrid ? `rotate(${f1(vrid)} ${f1(PIV[0])} ${f1(PIV[1])}) ` : ''}translate(${f1(x)} ${f1(fot)}) scale(${DS}) translate(-512 ${-L.FOTTER})`);
  L.rita(G, f, p);
  const sk = G.querySelector('.skugga');   // skuggan mjuk och varmbrun som sakernas (som 061)
  if (sk) { sk.setAttribute('fill', '#3a2a1a'); sk.setAttribute('filter', 'url(#mjukskugga)'); sk.setAttribute('opacity', luft || vrid ? 0 : (2.2 * +sk.getAttribute('opacity')).toFixed(3)); }
}
// tassens spets (sida 'l' = bildens vänster) i scenens koordinater
function tass(sida = 'l', saknas = [960, 700]) {
  const spets = sida === 'l' ? [179, 668] : [845, 668];
  for (const e of [`arm-${sida}-fram`, `arm-${sida}2`, `arm-${sida}`].flatMap(c => [...G.querySelectorAll('.' + c)])) {
    let syns = true; for (let n = e; n && n !== G; n = n.parentNode) if (n.getAttribute('display') === 'none' || n.style?.display === 'none' || n.getAttribute('opacity') === '0') syns = false;
    if (!syns) continue;
    const m = $('kamera').getCTM().inverse().multiply(e.getCTM()), pt = new DOMPoint(...spets).matrixTransform(m);
    return [pt.x, pt.y];
  }
  return saknas;
}
const P = o => ({ ...L.POSE0, ...o });
const SITP = o => ({ ...L.blandaPose('neutral', 'sitter', 1), ...o });
const GLADA = ['glad', 'jatteglad', 'fnissig', 'stolt', 'kawaii', 'mums'];
const F = (n, o = {}) => ({ ...L.blanda('neutral', n, 1), ...(GLADA.includes(n) ? { glad: [0, 0] } : {}), ...o });   // glada ansikten med öppna ögon
const vinkArm = (tl, v, fart = 1.1) => ({ luta: -3 * v, armar: [0, v * (86 + 14 * Math.sin(2 * Math.PI * fart * tl))] });   // högra armen bakom kroppen, snett ut förbi kanten
const nick = (f, p, tl, d = 1.2, n = 2) => tl > 0 && tl < d ? L.nicka(f, p, tl, d, n) : [f, p];
const skaka = (f, p, tl) => tl > 0 && tl < 1.6 ? L.skakaHuvud(f, p, tl) : [f, p];
const liv = (p, t) => { const a = (1 - Math.cos(2 * Math.PI * t / 3.6)) / 2;
  return { ...p, strack: (p.strack || 0) + 0.012 * a, oron: (p.oron || [0, 0]).map((o, i) => o - 1.5 * a + (i ? -1 : 1) * 1.2 * Math.sin(t * 1.3 + 2 * i)) }; };
const oronUpp = (tl, a, b, h = 10) => -h * del(a, a + 0.3, tl) * (1 - del(b, b + 0.4, tl));
const prata = (f, tl, a, b) => { const k = bump(a, b, tl) > 0 ? 0.5 - 0.5 * Math.cos(2 * Math.PI * 3.2 * (tl - a)) : 0; return k > 0.02 ? L.blanda(f, { ...f, mun: [16, 12, 1, 458] }, k) : f; };
function skutt(a, b, tl, t1, d = 0.45, h = 60) {
  const u = kl((tl - (t1 - d)) / d);
  return { pos: [lerp(a[0], b[0], mjuk(u)), lerp(a[1], b[1], u) - h * Math.sin(Math.PI * u)], luft: u > 0 && u < 1,
    strack: -0.06 * bump(t1 - d - 0.2, t1 - d + 0.02, tl) + 0.04 * Math.sin(Math.PI * u) * (u > 0 && u < 1 ? 1 : 0) - 0.05 * bump(t1 - 0.02, t1 + 0.28, tl) };
}
// går från a till b mellan t0 och t1 (rikt åt det håll den går); utanför: står still
function ga(tl, t0, t1, a, b, pBas) {
  const u = kl((tl - t0) / (t1 - t0)), w = del(t0 - 0.05, t0 + 0.2, tl) * (1 - del(t1 - 0.25, t1 + 0.05, tl));
  const pos = lerp2(a, b, mjuk(u));
  if (w <= 0) return { pos, p: pBas };
  const [, pw] = L.ROR.ga(0.25 + Math.hypot(b[0] - a[0], b[1] - a[1]) / 220 * u);
  return { pos, p: L.blandaPose(pBas, { ...pw, x: 0, rikt: 0.6 * Math.sign(b[0] - a[0]) }, w) };
}
const PUFF_V = { luta: -6, sank: 14, armar: [40, 0] };
const PUFF_H = { luta: 6, sank: 14, armar: [0, 40] };
const puffa = (tl, a, pose = PUFF_V, d = 0.55) => bump(a, a + d, tl);   // 0 → 1 → 0

// --- Kritan, skimmer -----------------------------------------------------------------------------------------------------------
const kritaRita = kr => { if (kr) lagg('krita', kritaBild(kr.x, kr.y, kr)); };
const stjarna = (x, y, r, o = 1) => `<path transform="translate(${f1(x)} ${f1(y)}) scale(${r.toFixed(2)})" opacity="${kl(o).toFixed(2)}" d="M0 -1 L.2 -.2 L1 0 L.2 .2 L0 1 L-.2 .2 L-1 0 L-.2 -.2Z" fill="#fff6c8" stroke="#e6b422" stroke-width=".06"/>`;
function skimmer(x, y, k, vidd = 1) { if (k <= 0.01) return;
  lagg('glans', [[-1, -0.7, 1], [1.1, -0.4, 0.8], [0.2, 1.1, 0.7], [-1.2, 0.8, 0.6]].map(([dx, dy, s], i) => stjarna(x + dx * 40 * vidd, y + dy * 34 * vidd, 16 * s * k * vidd * (0.75 + 0.25 * Math.sin(TT * 3 + i * 1.7)), 0.4 + k)).join('')); }
const kritaS = () => kritaSkala(ZOOM) * (ZOOM > 2 ? 0.7 : 1);

// --- Ritintrot: kritan ritar gunganden på papperet ----------------------------------------------------------------------------
function ritaPapper(st, t) {
  $('platta').innerHTML = `<rect x="-200" y="-200" width="2400" height="1500" fill="#FBF7EE"/><rect x="-200" y="-200" width="2400" height="1500" filter="url(#korn)"/>`;
  $('forgrund').innerHTML = '';
  const kryp = 1 + 0.12 * (st.kryp || 0), z = (st.zoom || 1) * kryp;
  kamera([z, 960, 540]);
  const f = st.fyll || 0, k = (t - T_RIT.rit[0]) / (T_RIT.rit[1] - T_RIT.rit[0]);
  const g = st.gung ?? 0, v = 1.5 * Math.sin(g * 1.7) * del(0.5, 1.2, g);   // gunganden gungar lugnt när den är ifylld
  const piv = [GPAPP[0] + (500 - 532) * sakS('gung', GPAPP[2]), GPAPP[1] + (930 - 970) * sakS('gung', GPAPP[2])];
  const b = sak('gung', GPAPP, { lager: 'bak', k: kl(k), f, vrid: f > 0 ? [v, ...piv] : null });
  if (b.spets) kritaRita(kritaFas(t, T_RIT, { ...b, vanta: [1500, 260], s: KRITAN.SKALA_PAPPER / kryp }));
  else kritaRita(kritaFas(t, T_RIT, { start: [0, 0], spets: [0, 0], slut: [0, 0], vanta: [1500, 260], s: KRITAN.SKALA_PAPPER / kryp }));
  if (f > 0) lagg('krita', gnistor(960, 600, 400, t - RR['01c'].s));
}

function lage(t) {
  let i = RAD.findIndex(r => t < r.s + r.d); if (i < 0) i = RAD.length - 1;

    const fr = RAD[i - 1], f0 = RS[fr.id](fr.d, fr.d), gb = del(0, 0.45, tl);
    if (f0.f && gb < 1 && f0.pos?.[0] === st.pos?.[0] && f0.pos?.[1] === st.pos?.[1]) { st.f = L.blanda(f0.f, st.f, gb); st.p = L.blandaPose(f0.p, st.p, gb); }
  }
  return { ...st, id: r.id, tl, d: r.d };
}

// --- Bildrutan -----------------------------------------------------------------------------------------------------------------
